<figure class="simwrap" data-sim="eps">
      <header><span class="lbl">Try it</span><b>\(\varepsilon_r\) against frequency — the staircase</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">frequency <b data-out="f">–</b></span><span class="ro">\(\varepsilon_r\) <b data-out="er">–</b></span>
        <span class="ro">still contributing <b data-out="mech">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>frequency (\(\log_{10}\) Hz)</span><input type="range" min="1" max="16" value="9" step="0.05" data-k="f"><output></output></label>
        <label class="ctrl"><span>orientational strength</span><input type="range" min="0" max="60" value="45" step="1" data-k="o"><output></output></label>
      </div>
      <figcaption>Each mechanism drops out when the field oscillates faster than the charges can follow: space charge first, then orientation at microwave, ionic in the infrared, leaving only the electron cloud in the optical. Drag the marker across and the readout names which mechanisms are still keeping up. Set the orientational strength to zero for a non-polar solid and the first big step disappears.</figcaption>
