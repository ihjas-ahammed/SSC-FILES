<figure class="simwrap" data-sim="sigmaT">
      <header><span class="lbl">Try it</span><b>\(\ln\sigma\) against \(1/T\) — the plot that measures the gap</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">\(E_g\) <b data-out="Eg">–</b></span><span class="ro">slope <b data-out="slope">–</b></span>
        <span class="ro">\(n_i\)(300 K) <b data-out="ni">–</b></span><span class="ro">\(\sigma_i\)(300 K) <b data-out="sig">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>band gap \(E_g\) (eV)</span><input type="range" min="0.3" max="2" value="1.1" step="0.02" data-k="Eg"><output></output></label>
        <label class="ctrl"><span>doping \(N_D\) (\(10^x\ \mathrm{m^{-3}}\))</span><input type="range" min="0" max="23" value="0" step="0.5" data-k="ND"><output></output></label>
      </div>
      <figcaption>With no doping the line is straight and its slope is \(-E_g/2k_B\) — read the gap straight off it. Add donors and the low-temperature end flattens into the extrinsic plateau, with the intrinsic line taking over only once \(n_i\) climbs past \(N_D\). Set \(E_g\) to \(1.1\) for Si and \(0.7\) for Ge and compare the slopes.</figcaption>
    </figure>
