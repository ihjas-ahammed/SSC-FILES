<figure class="simwrap" data-sim="lp">
      <header><span class="lbl">Try it</span><b>Turn the cost vector of an LP and watch the optimum jump between vertices</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">\(\mathbf c\) <b data-out="c">–</b></span><span class="ro">\(\mathbf x^\star\) <b data-out="x">–</b></span><span class="ro">\(p^\star\) <b data-out="p">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>direction of \(\mathbf c\)</span><input type="range" min="0" max="359" value="225" step="1" data-k="th"><output></output></label>
      </div>
      <figcaption>Minimise \(\mathbf c^T\mathbf x\) subject to \(x_1,x_2\ge0\), \(x_1+x_2\le5\), \(x_1+3x_2\le12\), \(2x_1+x_2\le8\). The copper line is the lowest level line that still touches the polygon. As \(\mathbf c\) turns, the optimum stays at one vertex and then jumps; exactly when \(\mathbf c\) is normal to an edge, the whole edge is optimal.</figcaption>
    </figure>
