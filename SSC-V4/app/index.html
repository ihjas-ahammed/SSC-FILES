<link rel="stylesheet" href="src/ui.css">

<script>
  /* MathJax: authored content uses $…$ and $$…$$. formatError parks the
     message where core.tex.js can read it, so a malformed learner fragment
     becomes a readable warning instead of a silent red blob. */
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      formatError: function (jax, err) {
        window.__texError = err.message;
        return jax.formatError(err);
      }
    },
    chtml: { displayAlign: 'left', displayIndent: '0' },
    options: { enableMenu: false, enableAssistiveMml: true },
    startup: { typeset: false }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>

<script>
  document.getElementById('theme-btn').addEventListener('click', function () {
    var order = ['auto', 'light', 'dark'];
    var next = order[(order.indexOf(Store.pref('theme', 'auto')) + 1) % 3];
    Store.setPref('theme', next);
    Theme.apply();
    DOM.announce('Theme set to ' + next + '.');
  });
</script>
