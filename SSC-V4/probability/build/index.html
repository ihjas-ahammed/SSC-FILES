                  [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: 'Show answer' })]);

                tryBtn.addEventListener('click', function () {
                  const open = tryHost.hidden;
                  if (open && !tryBuilt) { tryBuilt = true; DOM.add(tryHost, buildTry()); UI.math(tryHost); }
                  tryHost.hidden = !open;
                  tryBtn.setAttribute('aria-expanded', String(open));
                  tryBtn.querySelector('.lb').textContent = open ? 'Hide hint' : 'Try it (hint)';
                });

                showBtn.addEventListener('click', function () {
                  const open = answerHost.hidden;
                  if (open && !answerBuilt) { answerBuilt = true; DOM.add(answerHost, buildAnswer()); UI.math(answerHost); }
                  answerHost.hidden = !open;
                  showBtn.setAttribute('aria-expanded', String(open));
                  showBtn.querySelector('.lb').textContent = open ? 'Hide answer' : 'Show answer';
                });

                return [
                  el('div', { class: 'prose tight', html: q.prompt }),
                  el('div', { class: 'row', style: { gap: '8px', marginTop: '10px', flexWrap: 'wrap' } },
                    [tryBtn, showBtn]),
                  tryHost, answerHost,
                  taskRow('w:' + q.id, { noun: 'exercise', onTick: function () {
                    paintQMark();
                    updateHeader();
                    if (onTick) onTick();
                  } })
                ];
              }
            });
          }))
        ];
      }
    });

    exp._updateHeader = updateHeader;
    return exp;
  }

  /* ══════════════════════════════════════════════════════════════════════
     The note itself.

       opts.onChange    something in here moved a level — repaint the tree
       opts.onComplete  the Complete button was pressed; the tree closes this
                        note and opens the next one
     ══════════════════════════════════════════════════════════════════════ */
  function build(c, opts) {
    const o = opts || {};
    const root = el('div', { class: 'notebody stack' });

    const hasProof = !!c.proof;
    const isExt = Pool.isExt(c);
    const extNote = isExt ? ' (outside syllabus)' : '';
    const badgesHost = el('div', { class: 'row', style: { marginBottom: '2px' } });
    const ladderHost = el('div', {});
    const askHost = el('div', {});
    const doneBtn = el('button', { class: 'btn', type: 'button' });
    let syncProofTick = null;

    const isL2Complete = Progress.level(c.id) >= 2;
    const wView = writtenOn(c, function () { paintDone(); }, isL2Complete);

    function paintDone() {
      Progress.dropCache();
      const on = Store.isDone(c.id);
      const isL2 = Progress.level(c.id) >= 2;

      if (wView) {
        if (wView._updateHeader) wView._updateHeader();
        if (isL2 && wView._open && !wView._isOpen()) {
          wView._open();
        }
      }

      DOM.clear(badgesHost);
      DOM.add(badgesHost, [UI.kindBadge(c), UI.tierBadge(c), UI.levelBadge(c.id)].filter(Boolean));

      /* Never primary: the Complete button at the foot is the primary action on
         an open note, and two competing blue buttons is one too many. */
      doneBtn.className = 'btn';
      DOM.clear(doneBtn);
      DOM.add(doneBtn, [
        DOM.mi(on ? 'task_alt' : 'radio_button_unchecked', 'sm'),
        el('span', { text: on ? 'Read' + extNote + ' — undo' : 'Mark as read' + extNote })
      ]);
      doneBtn.setAttribute('aria-pressed', String(on));
      DOM.clear(ladderHost).appendChild(UI.ladder(c.id));
      if (o.onChange) o.onChange();
    }

    /* Ticking a result you have just read usually means you already have the
       groundwork under it — but "usually" is not "always", so it is offered as
       a question rather than done silently. */
    function offerCascade() {
      const pending = Progress.pendingPrereqs(c.id);
      DOM.clear(askHost);
      if (!pending.length) return;

      const list = el('div', { class: 'row', style: { marginTop: '2px' } },
        pending.slice(0, 8).map(x => el('span', { class: 'chip', text: x.title })));
      if (pending.length > 8) {
        list.appendChild(el('span', { class: 'count', text: '+' + (pending.length - 8) + ' more' }));
      }

      askHost.appendChild(UI.ask({
        title: 'Mark its groundwork as read too?',
        body: el('div', {}, [
          el('p', { style: { margin: '0 0 8px' },
            text: pending.length + ' ' + DOM.plural(pending.length, 'prerequisite') +
              ' of this result ' + DOM.plural(pending.length, 'has', 'have') +
              ' not been read. Mark them read — and nothing more?' }),
          list
        ]),
        actions: [
          { label: 'Yes, mark all ' + pending.length, primary: true, onClick: function () {
              const n = Progress.raisePrereqs(c.id);
              DOM.clear(askHost);
              DOM.announce('Marked ' + n + ' ' + DOM.plural(n, 'prerequisite') + ' as read.');
              paintDone();
            } },
          { label: 'No, just this one', onClick: function () { DOM.clear(askHost); } }
        ]
      }));
    }

    doneBtn.addEventListener('click', function () {
      const next = !Store.isDone(c.id);
      Store.setDone(c.id, next);
      if (!hasProof) Store.setProofDone(c.id, next);
      else if (!next) Store.setProofDone(c.id, false);
      Progress.dropCache();
      paintDone();
      if (syncProofTick) syncProofTick();
      DOM.announce(next ? 'Marked as read.' : 'Tick removed.');
      if (next) offerCascade(); else DOM.clear(askHost);
    });

    const pView = proofView(c, function () { paintDone(); });
    if (pView && pView._paintProofDone) syncProofTick = pView._paintProofDone;

    /* ── the button that carries you on ──────────────────────────────────
       Complete is not a synonym for the tick: it is the end of the note. It
       marks it read, closes it, and opens the next one — which is the whole
       reason the note lives in the tree now. */
    const next = Pool.neighbours(c.id).next;
    const completeBtn = el('button', { class: 'btn primary full', type: 'button' }, [
      DOM.mi('done_all', 'sm'),
      el('span', { text: next ? 'Complete · open ' + next.title : 'Complete this note' })
    ]);
    completeBtn.addEventListener('click', function () {
      Progress.complete(c.id);
      paintDone();
      DOM.announce('Completed ' + c.title + '.');
      if (o.onComplete) o.onComplete(next);
    });

    DOM.add(root, [
      el('div', {}, [
        badgesHost,
        el('p', { class: 'lede', style: { margin: '8px 0 0' }, text: c.oneLine })
      ]),

      el('div', { class: 'card note-statement' }, [
        el('div', { class: 'kicker', text: 'Statement' }),
        el('div', { style: { marginTop: '10px' } }, [RealLine.statementInto(UI.prose(c.statement), c)])
      ]),

      Fig.mount(c),

      Project.hook('noteSim', c),

      c.intuition ? el('div', { class: 'card tint note-intuition' }, [
        el('div', { class: 'kicker', text: 'In everyday words' }),
        el('div', { style: { marginTop: '10px' } }, [UI.prose(c.intuition, 'tight')])
      ]) : null,

      prereqPath(c),
      pView,
      traps(c),
      wView,
      questionsOn(c),
      writeWorkspace(c),
      selfChecks(c),
      sectionTasks(c),
      unlocks(c),

      el('div', { class: 'card glass' }, [
        el('div', { class: 'kicker', text: 'This note' }),
        el('div', { style: { margin: '10px 0 14px' } }, [ladderHost]),
        el('div', { class: 'btn-row' }, [doneBtn]),
        askHost
      ]),

      el('div', { class: 'note-foot' }, [completeBtn])
    ]);

    paintDone();
    UI.math(root);
    return root;
  }

  return { build, expander, taskRow };
})();


/* ── flow-library/app/src/comp.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The writing workspace — a live markdown editor, one line at a time.

   The old workspace was a textarea with the rendering underneath and a sheet
   of LaTeX keys at the bottom. Two things were wrong with it on a phone: the
   key sheet covered the input it was meant to serve, and the rendering sat so
   far below a growing block of source that you stopped looking at it.

   So the shape is inverted. You write ONE line at a time, and that line's
   rendering sits directly ABOVE the input — where your eyes already are.
   Press Enter and the line settles into the document above; a fresh input
   appears beneath it, with its own output right above it again. The page
   fills downward with rendered mathematics and the caret is always at the
   bottom of it. Tap any settled line to reopen it.

   Commands are offered as completions rather than as a palette (core.latex.js):
   type a backslash and the matches appear in a strip immediately under the
   input, thumb-high. When nothing is being typed the strip shows the commands
   this theorem actually uses, so discovery still works without knowing how to
   spell anything.

   Still deliberately NOT a checker: it verifies that what you wrote renders,
   and says so out loud. Whether the mathematics is right stays your call.
   ══════════════════════════════════════════════════════════════════════════ */

const WriteBox = (function () {

  const el = DOM.el;

  function mount(host, opts) {
    const o = opts || {};
    const concept = o.concept || null;
    const uid = 'w' + Math.random().toString(36).slice(2, 8);

    /* MARKDOWN IS THE DEFAULT, AND SO IS MATHS. Every line is prose until you
       put maths in it, because a workspace you cannot write a sentence in is
       not a workspace — it is a formula box.

       Maths no longer needs fencing: write `I love \\frac{1}{2} in fact` and
       core.md.js finds the expression, typesets it, and leaves the sentence
       alone. Explicit $…$ and $$…$$ still work and still win, and the Σ key
       wraps the whole line for when the line really is nothing but maths.

       `mathFirst: true` is the opt-in exception for boxes that exist only to
       capture one formula; there, a line with no $ is taken as bare LaTeX. */
    const mathFirst = o.mathFirst === true;

    /* What the draft is filed under. Usually the concept, but a proof
       scratchpad and a statement attempt are different pieces of work on the
       same concept, so they need different keys — 'proof:<id>' for the former.
       Both merge across devices like any other draft. */
    const draftKey = o.draftKey || (concept ? concept.id : null);

    let firstInputFired = false;
    let lines = [''];
    let active = 0;

    const stored = (o.value != null ? o.value : (draftKey ? Store.draft(draftKey) : '')) || '';
    if (stored) { lines = stored.split('\n'); active = lines.length - 1; }

    /* ── chrome ────────────────────────────────────────────────────────── */
    const doc = el('div', { class: 'wdoc', id: uid + '-doc' });
    const strip = el('div', { class: 'wstrip', role: 'listbox',
      'aria-label': 'LaTeX command completions' });
    const errBox = el('div', { hidden: true });
    const saveNote = el('span', { class: 'small muted', text: '' });

    const hint = el('p', {
      class: 'small muted', id: uid + '-hint', style: { margin: '6px 0 0' },
      text: (mathFirst
        ? 'One line at a time. A line with no $ is typeset as display maths; use $…$ to mix maths into words. '
        : 'Write normally — **bold**, # headings, - lists. Maths needs no dollar signs: '
          + 'type \\frac{1}{2} mid-sentence and it is typeset where it stands. A backslash '
          + 'opens the command list; the Σ key sets the whole line as display maths. ') +
        'Enter starts the next line.'
    });

    /* the live input; one line, always the one you are writing */
    const field = el('input', {
      class: 'wfield', type: 'text', id: uid, spellcheck: 'false',
      autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off',
      'aria-describedby': uid + '-hint',
      placeholder: o.placeholder || (mathFirst
        ? '\\forall \\varepsilon > 0 \\; \\exists \\delta > 0 \\ldots'
        : 'Write a line — words, **bold**, or maths like \\varepsilon > 0 …')
    });

    const newlineBtn = el('button', { class: 'wkey', type: 'button',
      title: 'Start the next line (Enter)', 'aria-label': 'Start the next line' },
      [DOM.mi('keyboard_return', 'sm')]);

    const mathBtn = el('button', { class: 'wkey', type: 'button',
      title: 'Wrap this line in display maths', 'aria-label': 'Wrap this line in display maths' },
      [DOM.mi('functions', 'sm')]);

    /* ── rendering one line ────────────────────────────────────────────── */

    /* Returns a promise resolving {ok, error, hint} so the active line can
       report, and settled lines can stay quiet. */
    function paint(target, src) {
      const text = String(src == null ? '' : src);

      if (!text.trim()) {
        DOM.clear(target);
        target.appendChild(el('div', { class: 'ph',
          text: target.dataset.live ? 'This line renders here as you type.' : ' ' }));
        return Promise.resolve({ ok: true, empty: true });
      }

      if (mathFirst && !Markdown.hasMath(text)) {
        return Tex.renderFragment(target, text, { display: true });
      }

      DOM.clear(target);
      target.appendChild(el('div', { class: 'prose tight', html: Markdown.line(text) }));
      return Tex.typeset(target).then(function () {
        const bad = target.querySelector('mjx-merror, [data-mjx-error]');
        if (!bad) return { ok: true };
        return { ok: false,
          error: bad.getAttribute('data-mjx-error') || bad.textContent || 'MathJax could not parse the maths on this line.' };
      });
    }

    function showProblem(res) {
      if (!res || res.ok === true && !res.hint) { errBox.hidden = true; DOM.clear(errBox); return; }
      if (res.ok && res.hint) {
        DOM.clear(errBox);
        errBox.appendChild(el('div', { class: 'tex-err' }, [
          DOM.mi('info', 'sm'), el('span', { text: res.hint })
        ]));
        errBox.hidden = false;
        return;
      }
      if (res.ok) { errBox.hidden = true; DOM.clear(errBox); return; }
      DOM.clear(errBox);
      errBox.appendChild(el('div', { class: 'tex-err' }, [
        DOM.mi('report', 'sm'),
        el('span', {}, [
          el('b', { text: 'This line does not render yet. ' }),
          el('span', { text: res.error || 'Check for an unmatched { or }.' })
        ])
      ]));
      errBox.hidden = false;
    }

    /* ── the document ──────────────────────────────────────────────────── */

    let liveOut = null;          /* the output frame above the active input */

    /* Settled lines are re-rendered on every rebuild, and MathJax is the most
       expensive thing in the app. Their output only depends on their source,
       so keep the markup by source text and reuse it. */
    const cache = {};

    function build() {
      DOM.clear(doc);
      liveOut = null;

      lines.forEach(function (text, i) {
        const out = el('div', { class: 'wout' });
        const row = el('div', { class: 'wline' + (i === active ? ' live' : '') }, [
          el('span', { class: 'wnum', 'aria-hidden': 'true', text: String(i + 1) }),
          out
        ]);

        if (i === active) {
          out.dataset.live = '1';
          liveOut = out;
          doc.appendChild(row);
          doc.appendChild(el('div', { class: 'winput' }, [
            el('span', { class: 'wcaret', 'aria-hidden': 'true', text: '›' }),
            field, mathBtn, newlineBtn
          ]));
          field.value = text;
          paint(out, text).then(showProblem);
        } else {
          /* a settled line reopens on tap — that is the only way back */
          row.setAttribute('tabindex', '0');
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', 'Edit line ' + (i + 1));
          const open = function (e) {
            if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            focusLine(i, 'end');
          };
          row.addEventListener('click', open);
          row.addEventListener('keydown', open);
          doc.appendChild(row);
          if (cache[text] != null) out.innerHTML = cache[text];
          else paint(out, text).then(function () { cache[text] = out.innerHTML; });
        }
      });
    }

    const liveRender = DOM.debounce(function () {
      if (liveOut) paint(liveOut, field.value).then(showProblem);
    }, 200);

    const persist = DOM.debounce(function () {
      if (!draftKey) return;
      Store.saveDraft(draftKey, value());
      saveNote.textContent = value().trim() ? 'Draft saved' : '';
    }, 700);

    function commitField() { lines[active] = field.value; }

    function focusLine(i, caret) {
      commitField();
      active = Math.max(0, Math.min(lines.length - 1, i));
      build();
      refreshStrip();
      /* synchronously: a requestAnimationFrame here leaves the user-gesture
         context, and iOS then refuses to bring the keyboard back up */
      field.focus();
      const at = caret === 'end' ? field.value.length : (caret || 0);
      try { field.setSelectionRange(at, at); } catch (e) { /* not focusable yet */ }
      revealInput();
    }

    /* ── completions ───────────────────────────────────────────────────── */
    let matches = [];
    let picked = 0;

    function refreshStrip() {
      const caret = field.selectionStart == null ? field.value.length : field.selectionStart;
      const tok = Latex.tokenAt(field.value, caret);
      matches = tok ? Latex.complete(tok.word, concept, 12) : Latex.suggestions(concept, 14);
      picked = 0;

      DOM.clear(strip);
      strip.appendChild(el('span', { class: 'wstrip-l', 'aria-hidden': 'true',
        text: tok ? (tok.text || '\\') : 'commands' }));

      matches.forEach(function (k, i) {
        strip.appendChild(el('button', {
          class: 'wsug' + (i === picked && tok ? ' on' : ''),
          type: 'button', role: 'option', 'aria-selected': String(i === picked && !!tok),
          title: '\\' + k.cmd + (k.desc ? ' — ' + k.desc : ''),
          on: { click: function () { take(k); } }
        }, [
          el('span', { class: 's', text: k.show }),
          el('span', { class: 'c', text: '\\' + k.cmd })
        ]));
      });

      if (!matches.length) {
        strip.appendChild(el('span', { class: 'small muted',
          text: 'no command matches that spelling' }));
      }
    }

    /* Insert a command bare. It used to be wrapped in $…$ on the way in; that
       is now auto-math's job, and doing it here as well would fence half a
       sentence the learner is still writing. */
    function take(entry) {
      Latex.accept(field, entry, { wrapInMath: false });
      refreshStrip();
      revealInput();
    }

    /* ── keeping the input above the keyboard ────────────────────────────────
       An on-screen keyboard shrinks the VISUAL viewport but not the layout
       one, so an input near the bottom ends up behind it and the page looks
       like it simply refuses to scroll far enough. Correct it by hand: measure
       how far the input row plus its command strip overflow the visible
       bottom, and scroll the nearest scrolling ancestor by exactly that — the
       reel when we are inside it, the window otherwise. */
    function scroller(node) {
      let n = node.parentElement;
      while (n && n !== document.body) {
        const st = window.getComputedStyle(n);
        if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 4) return n;
        n = n.parentElement;
      }
      return null;
    }

    function revealInput() {
      if (document.activeElement !== field) return;
      const vv = window.visualViewport;
      const bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      const r = strip.getBoundingClientRect();
      const inputTop = field.getBoundingClientRect().top;

      let by = 0;
      const over = r.bottom + 12 - bottom;
      if (over > 1) by = over;
      else if (inputTop - 12 < top) by = inputTop - top - 12;
      if (!by) return;

      const sc = scroller(field);
      if (sc) sc.scrollTop += by;
      else window.scrollBy(0, by);
    }

    const reveal = DOM.debounce(revealInput, 90);
    field.addEventListener('focus', reveal);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', reveal);
      window.visualViewport.addEventListener('scroll', reveal);
    }

    /* ── keys ──────────────────────────────────────────────────────────── */
    field.addEventListener('input', function () {
      reveal();
      liveRender();
      commitField();
      persist();
      refreshStrip();
      if (!firstInputFired && field.value.trim()) {
        firstInputFired = true;
        if (o.onFirstInput) o.onFirstInput();
      }
    });

    field.addEventListener('keydown', function (e) {
      const caret = field.selectionStart == null ? 0 : field.selectionStart;
      const len = field.value.length;

      if (e.key === 'Tab' && matches.length) {
        const tok = Latex.tokenAt(field.value, caret);
        if (tok) {
          e.preventDefault();
          take(matches[picked] || matches[0]);
          return;
        }
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        newLine();
        return;
      }

      if (e.key === 'Backspace' && caret === 0 && field.selectionEnd === 0 && active > 0) {
        e.preventDefault();
        commitField();
        const carry = lines[active];
        const prevLen = lines[active - 1].length;
        lines[active - 1] += carry;
        lines.splice(active, 1);
        focusLine(active - 1, prevLen);
        persist();
        return;
      }

      if (e.key === 'ArrowUp' && caret === 0 && active > 0) {
        e.preventDefault();
        focusLine(active - 1, 'end');
        return;
      }

      if (e.key === 'ArrowDown' && caret === len && active < lines.length - 1) {
        e.preventDefault();
        focusLine(active + 1, 'end');
      }
    });

    field.addEventListener('click', refreshStrip);
    field.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') refreshStrip();
    });

    function newLine() {
      commitField();
      /* Enter on the last line when it is empty means "done", not "another
         blank line" — otherwise the document grows a tail of empties. */
      if (active === lines.length - 1 && !lines[active].trim() && lines.length > 1) {
        field.blur();
        return;
      }
      lines.splice(active + 1, 0, '');
      focusLine(active + 1, 0);
      persist();
    }

    newlineBtn.addEventListener('click', newLine);

    mathBtn.addEventListener('click', function () {
      const t = field.value.trim();
      const wrapped = /^\$\$[\s\S]*\$\$$/.test(t);
      field.value = wrapped ? t.replace(/^\$\$\s*|\s*\$\$$/g, '') : '$$ ' + t + ' $$';
      commitField();
      field.dispatchEvent(new Event('input', { bubbles: true }));
      field.focus();
    });

    /* ── assemble ──────────────────────────────────────────────────────── */
    const value = () => lines.join('\n');

    const box = el('div', { class: 'stack wbox', style: { gap: '10px' } }, [
      el('div', { class: 'spread' }, [
        el('label', { class: 'kicker', for: uid,
          text: o.label || 'Write it — one line at a time' }),
        saveNote
      ]),
      doc,
      strip,
      errBox,
      hint,
      el('p', {
        class: 'small muted', style: { margin: 0 },
        text: 'This checks only that what you wrote renders — not whether the mathematics is correct. That judgement stays yours.'
      })
    ]);
    host.appendChild(box);

    build();
    refreshStrip();

    return {
      value: value,
      focus: () => field.focus(),
      hasContent: () => !!value().trim(),
      node: box
    };
  }

  return { mount };
})();


/* ── flow-library/app/src/view.login.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Sign in.

   The app does not open until there is a name and a roll number, because
   those two are the key the record is stored and merged under. A progress
   record that starts anonymous and is claimed later cannot be merged honestly
   — you would have to guess which device's history was whose.

   Be straight about what this is: it is a PASS KEY, not a password. Anyone who
   knows both halves can open this record. It exists so your work follows you
   between a phone and a laptop without an account to create, and the screen
   says exactly that rather than dressing it up as security.
   ══════════════════════════════════════════════════════════════════════════ */

const Login = (function () {

  const el = DOM.el;

  function mount(host, onDone) {
    const nameIn = el('input', {
      class: 'tin', type: 'text', id: 'login-name', autocomplete: 'name',
      placeholder: 'e.g. Student Name', spellcheck: 'false', enterkeyhint: 'next'
    });
    const rollIn = el('input', {
      class: 'tin', type: 'text', id: 'login-roll', autocomplete: 'off',
      placeholder: 'e.g. Roll Number', spellcheck: 'false', enterkeyhint: 'go'
    });

    const known = Store.identity();
    nameIn.value = known.name || '';
    rollIn.value = known.roll || '';

    const note = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const go = el('button', { class: 'btn primary', type: 'submit', text: 'Open my study record' });

    const keyLine = el('p', { class: 'small mono', style: { margin: '8px 0 0', color: 'var(--ink-3)' } });
    function paintKey() {
      const k = Sync.keyFor(nameIn.value, rollIn.value);
      keyLine.textContent = k ? 'record: ' + k : '';
    }
    nameIn.addEventListener('input', paintKey);
    rollIn.addEventListener('input', paintKey);
    paintKey();

    let busy = false;
    function submit(e) {
      if (e) e.preventDefault();
      if (busy) return;
      const name = nameIn.value.trim(), roll = rollIn.value.trim();
      if (!name || !roll) {
        note.textContent = 'Both a name and a roll number are needed — together they are the key.';
        (name ? rollIn : nameIn).focus();
        return;
      }
      busy = true;
      go.disabled = true;
      go.textContent = 'Opening…';
      note.textContent = 'Looking for an existing record…';

      Store.signIn(name, roll);
      Sync.hello().then(function (r) {
        note.textContent = r.msg || '';
        onDone(r);
      }, function () {
        /* offline is not a reason to lock someone out of their own device */
        note.textContent = '';
        onDone({ ok: false, offline: true });
      });
    }

    const form = el('form', { class: 'stack', style: { gap: '14px' }, on: { submit: submit } }, [
      el('div', {}, [
        el('div', { class: 'kicker', text: PROJECT.name + ' · study system' }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: 'Sign in to your record' })
      ]),
      el('p', { class: 'lede' }, [
        'Your name and roll number are the key your progress is stored under. ' +
        'Enter the same two on any device and the record follows you.'
      ]),
      el('div', { class: 'card' }, [
        el('label', { class: 'kicker', for: 'login-name', text: 'Name' }),
        el('div', { style: { margin: '6px 0 14px' } }, [nameIn]),
        el('label', { class: 'kicker', for: 'login-roll', text: 'Roll number' }),
        el('div', { style: { margin: '6px 0 0' } }, [rollIn]),
        keyLine
      ]),
      el('div', { class: 'btn-row' }, [go]),
      note,
      el('div', { class: 'banner' }, [
        DOM.mi('info'),
        el('span', {}, [
          el('b', { text: 'This is a pass key, not a password. ' }),
          'Anyone who knows your name and roll number can open this record. It keeps your ' +
          'work together across devices; it does not protect it.'
        ])
      ]),
      Pool.isMock() ? el('p', { class: 'small muted', style: { margin: 0 },
        text: 'Test build: records here are kept in a separate store from the real app, so nothing you do can reach it.' }) : null
    ]);

    nameIn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); rollIn.focus(); }
    });

    host.appendChild(el('div', { class: 'wrap view-in' }, [form]));
    (nameIn.value ? rollIn : nameIn).focus();
  }

  return { mount };
})();


/* ── flow-library/app/src/view.home.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Today — what to do next, and what the app actually knows about you.

   The tiles keep completion, proof work and recall apart on purpose: finishing
   a note is Level 1 "completed" and says nothing about recall, so the numbers
   are never merged into one flattering percentage.

   There is no level switch any more. A course does not get *set* to level 2;
   it arrives there when every note in it has had its proof worked, and at
   level 3 when every section's exercises are done. The card shows the colour
   the course has actually earned — red, amber, green — and what is owed for
   the next one.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewHome = (function () {

  const el = DOM.el;

  function nextUndone() {
    return Pool.concepts().filter(c => Progress.level(c.id) === 0)[0]
      || Pool.concepts(null, { includeExt: true }).filter(c => Progress.level(c.id) === 0)[0]
      || null;
  }
  function nextCard() {
    return Pool.deck().filter(c => !(Store.card(c.id) || {}).first)[0] || null;
  }
  function nextQuestion() {
    return Pool.objective().filter(q => !(Store.omr(q.id) || {}).first)[0] || null;
  }
  /* the next proof owed on something already read — offering proof work on a
     note nobody has opened is offering work out of order */
  function nextProof() {
    return Pool.concepts().filter(c => Progress.level(c.id) === 1)[0]
      || Pool.concepts(null, { includeExt: true }).filter(c => Progress.level(c.id) === 1)[0]
      || null;
  }

  /* the next section exercise owed, for level 3 */
  function nextExercise() {
    const qs = Pool.written();
    for (let i = 0; i < qs.length; i++) {
      if (!Progress.taskDone(qs[i])) return qs[i];
    }
    return null;
  }

  /* ── the way back ────────────────────────────────────────────────────────
     The section (and note) you last opened, so a day's work starts with one
     tap instead of a scroll through the tree. */
  function resumeCard() {
    const l = Tree.last();
    const first = nextUndone();
    const host = el('div', { class: 'card resume' });

    if (!l) {
      if (!first) return null;
      DOM.add(host, [
        el('div', { class: 'kicker', text: 'Start here' }),
        el('div', { class: 'resume-t', text: first.title }),
        el('div', { class: 'small muted', text: '§' + first.sec + ' ' + Pool.sectionTitle(first.sec) }),
        el('a', { class: 'btn primary', href: Router.href('note/' + first.id) }, [
          DOM.mi('play_arrow', 'xs'), ' Open the first note'])
      ]);
      return host;
    }

    const ids = (Pool.sections(l.course.id).filter(s => s.sec === l.sec)[0] || { concepts: [] })
      .concepts.filter(c => !Pool.isExt(c)).map(c => c.id);
    const c = Progress.count(ids);
    const where = [l.module ? 'Module ' + l.module.n + ' · ' + l.module.title : null, l.course.title]
      .filter(Boolean).join(' · ');
    const go = function () {
      if (l.concept) Tree.revealPath(l.concept.id); else Tree.revealSection(l.sec);
      Router.go('study');
    };

    DOM.add(host, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Pick up where you left off' }),
        l.at ? el('span', { class: 'count', text: UI.ago(l.at) }) : null
      ]),
      el('div', { class: 'resume-t', text: '§' + l.sec + ' ' + Pool.sectionTitle(l.sec) }),
      l.concept ? el('div', { class: 'resume-n' }, [DOM.mi('article', 'xs'), ' ' + l.concept.title]) : null,
      el('div', { class: 'small muted', text: where }),
      ids.length ? el('div', { style: { marginTop: '10px' } }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'count', text: 'this section' }),
          el('span', { class: 'count', text: c.l1 + '/' + c.total + ' read' })
        ]),
        el('div', { style: { marginTop: '6px' } }, [UI.levelBar(c, { key: false })])
      ]) : null,
      el('button', { class: 'btn primary', type: 'button', on: { click: go } }, [
        DOM.mi('play_arrow', 'xs'), ' Continue'])
    ]);
    return host;
  }

  function step(n, label, detail, href, ready) {
    return el('a', { class: 'item', href: Router.href(href) }, [
      ready ? el('span', { class: 'ix', text: String(n) })
            : el('span', { class: 'ix ok' }, [DOM.mi('check', 'xs')]),
      el('span', { class: 'tt' }, [
        el('b', { text: label }),
        el('span', { text: detail })
      ]),
      el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
    ]);
  }

  /* One course, and the level it has EARNED. The ring is coloured by the
     weakest note in it, because a course is not at level 2 while something in
     it is still unread — and the bar underneath shows how the three levels are
     spread, which a single percentage cannot. */
  const LEVEL_WORD = ['not started', 'reading', 'proofs worked', 'textbook questions', 'PYQ worked', 'recall and fix'];

  function courseCard(course) {
    if (course.pending) {
      return el('div', { class: 'card' }, [
        el('div', { class: 'spread' }, [
          el('div', { class: 'kicker', text: course.title }),
          el('span', { class: 'badge warn', text: 'pending' })
        ]),
        el('p', { class: 'small muted', style: { margin: '8px 0 0' },
          text: course.pendingNote || 'Content has not been delivered yet.' })
      ]);
    }

    const ids = Pool.ids.concepts(course.id);
    const c = Progress.count(ids);
    const tasks = Pool.ids.written(course.id);
    const tasksDone = tasks.filter(id => Store.isProofDone('w:' + id)).length;
    const pyq = Progress.pyqState(course.id);
    const lv = Progress.courseLevel(course.id);

    const owed = c.min === 0 ? (c.total - c.l1) + ' still to read for a red tick'
      : c.min === 1 ? (c.total - c.l2) + ' proofs still owed for an amber tick'
      : c.min === 2 ? (c.total - c.l3) + ' notes still short of their section exercises'
      : lv < 4 ? (pyq.total
          ? (pyq.total - pyq.done) + ' past-paper ' + DOM.plural(pyq.total - pyq.done, 'question')
            + ' between this and level 4'
          : 'level 4 needs the ' + PROJECT.pyqLabel + ', which are not delivered yet')
      : lv < 5 ? 'Use Recall, then correct missed items: ' + Progress.recallState(course.id).done
          + '/' + Progress.recallState(course.id).total + ' recalled and fixed'
      : 'all five levels earned';

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('a', { class: 'kicker', style: { textDecoration: 'none' },
          href: Router.href('study/' + course.id), text: course.title }),
        el('span', { class: 'badge' + (lv ? ' lv' + lv : ''),
          text: lv ? 'level ' + lv + ' · ' + LEVEL_WORD[lv] : 'not started' })
      ]),
      el('div', { class: 'row', style: { marginTop: '10px', gap: '12px', alignItems: 'center' } }, [
        UI.levelRing(c, course.title),
        el('span', { class: 'tt' }, [
          el('b', { text: c.l1 + ' read · ' + c.l2 + ' proofs · ' + c.l3 + ' green, of ' + c.total }),
          el('span', { text: course.blurb })
        ])
      ]),
      el('div', { style: { marginTop: '12px' } }, [UI.levelBar(c)]),
      tasks.length ? el('div', { style: { marginTop: '12px' } }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'count', text: 'section exercises worked' }),
          el('span', { class: 'count', text: tasksDone + '/' + tasks.length })
        ]),
        el('div', { style: { marginTop: '6px' } }, [UI.meter(tasksDone, tasks.length, 3)])
      ]) : null,
      pyq.total ? el('div', { style: { marginTop: '12px' } }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'count', text: PROJECT.pyqLabel + ' · level 4' }),
          el('span', { class: 'count', text: pyq.done + '/' + pyq.total })
        ]),
        el('div', { style: { marginTop: '6px' } }, [UI.meter(pyq.done, pyq.total, 4)])
      ]) : null,
      el('p', { class: 'small muted', style: { margin: '10px 0 0' }, text: owed })
    ]);
  }

  /* ── sync ─────────────────────────────────────────────────────────────── */
  /* There is no Sync now button any more, because there was never anything to
     decide: every change pushes itself, coming back to the tab pulls, and a
     timer pulls while you are reading. A button for a thing that already
     happens is a button that makes you wonder whether it happened. What is
     left is the record you are signed into, what the last sync did, and the
     way out. */
  function syncCard() {
    const id = Store.identity();
    const host = el('div', { class: 'card tint' });
    const state = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const dot = el('span', { class: 'badge ok', text: Sync.status().key });

    function paint(last) {
      const s = Sync.status();
      const when = s.last && s.last.at
        ? ' · last checked ' + UI.ago(s.last.at)
        : '';
      state.textContent = (last && last.msg)
        ? last.msg + when
        : 'Signed in as ' + id.name + ' · ' + id.roll + '. Progress merges across every device '
          + 'that signs in with these two, on its own' + when + '. It is a pass key, not a password.';
    }
    Sync.watch(paint);
    paint(Sync.status().last);

    DOM.add(host, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Your record · syncing automatically' }),
        dot
      ]),
      el('div', { class: 'btn-row', style: { marginTop: '10px' } }, [
        el('button', { class: 'btn', type: 'button', text: 'Sign out',
          on: { click: function () {
            if (!window.confirm('Sign out? Progress stays on this device and in the cloud record.')) return;
            Sync.disconnect();
            location.reload();
          } } })
      ]),
      state
    ]);
    return host;
  }

  function render() {
    const all = Pool.ids.concepts();
    const overall = Progress.count(all);
    const s = Store.summary(all, Pool.ids.cards(), Pool.ids.objective(), Pool.ids.proofs());
    const note = nextUndone(), card = nextCard(), q = nextQuestion();
    const pf = nextProof(), ex = nextExercise();
    const exTarget = ex ? (Pool.concept((ex.tests || [])[0]) || null) : null;
    const qTarget = q ? (Pool.concept((q.tests || [])[0]) || null) : null;

    const root = el('div', { class: 'stack' });

    const tiles = [
      UI.stat(overall.l1 + '/' + overall.total, 'Read', 'level 1',
        UI.levelBar(overall, { key: false })),
      UI.stat(s.cards.tried ? DOM.pct(s.cards.got, s.cards.tried) + '%' : '—',
        'First-try recall',
        s.cards.tried + ' of ' + s.cards.total + ' tried'),
      UI.stat(s.omr.locked ? DOM.pct(s.omr.correct, s.omr.locked) + '%' : '—',
        'First-try correct',
        s.omr.locked + ' of ' + s.omr.total + ' locked'),
      UI.stat(overall.l2 + '/' + overall.total, 'Proofs worked', 'level 2',
        UI.meter(overall.l2, overall.total, 2)),
      UI.stat(overall.l3 + '/' + overall.total, 'Sections green', 'level 3',
        UI.meter(overall.l3, overall.total, 3))
    ];

    const loop = [
      step(1, note ? 'Read: ' + note.title : 'Every syllabus note has been read once',
        note ? (Pool.sectionTitle(note.sec) + (Pool.isExt(note) ? ' · outside syllabus' : '')) : 'Re-reading is always available',
        note ? 'note/' + note.id : 'study', !!note),
      step(2, card ? 'State it from memory' : 'Every statement has had one attempt',
        card ? card.title : 'Re-attempts are allowed but never recorded',
        'recall', !!card),
      /* Questions live inside the note that teaches them now, so the step goes
         to that note rather than to a page of questions. */
      step(3, q ? 'Answer the next question' : 'Every question has been locked once',
        q ? q.type + ' · ' + Pool.sectionTitle(q.sec) : 'Review the worked answers any time',
        q ? (qTarget ? 'note/' + qTarget.id : 'omr/' + q.id) : 'study', !!q),
      step(4, pf ? 'Work the proof: ' + pf.title : 'Every proof you have read is worked through',
        pf ? (Pool.sectionTitle(pf.sec) + ' · earns level 2') : 'Level 2 is clear',
        pf ? 'note/' + pf.id : 'study', !!pf),
      step(5, ex ? 'Work the exercise: ' + (ex.title || ex.id)
              : 'Every delivered exercise is worked through',
        ex ? ((exTarget ? Pool.sectionTitle(exTarget.sec) + ' · ' : '') + 'earns level 3')
           : 'Level 3 is clear for everything delivered',
        ex && exTarget ? 'note/' + exTarget.id : 'study', !!ex)
    ];

    DOM.add(root, [
      Project.hook('home', { overall: overall, stats: s }),
      UI.title('Today'),
      UI.mockBanner(),

      resumeCard(),

      DOM.stagger(el('div', { class: 'stats' }, tiles)),

      Pace.card(),

      el('div', { class: 'card glass' }, [
        el('div', { class: 'kicker', text: 'The loop' }),
        el('p', { class: 'small muted', style: { margin: '4px 0 12px' },
          text: 'Read it, state it from memory, answer questions on it, produce the proof '
            + 'yourself, then work the section\'s exercises. Feedback comes after the attempt, '
            + 'never before.' }),
        el('div', { class: 'list' }, loop)
      ]),

      el('div', {}, [
        el('div', { class: 'spread', style: { marginBottom: '10px' } }, [
          el('h2', { text: 'Courses' }),
          el('a', { class: 'chip', href: Router.href('study'), text: 'Open the syllabus' })
        ]),
        el('p', { class: 'small muted', style: { margin: '0 0 10px' },
          text: 'A course carries the colour of its weakest note. Nothing here is switched on '
            + 'or off — the level is whatever the work says it is.' }),
        el('div', { class: 'stack', style: { gap: '12px' } },
          Pool.courses().map(course => courseCard(course)))
      ]),

      el('div', { class: 'card tint' }, [
        el('div', { class: 'kicker', text: 'The five learning levels' }),
        el('div', { class: 'stack', style: { gap: '8px', marginTop: '10px' } }, [
          el('div', { class: 'row' }, [
            el('span', { class: 'badge lv1', text: 'level 1' }),
            el('span', { class: 'small muted', text: 'you have read it' })
          ]),
          el('div', { class: 'row' }, [
            el('span', { class: 'badge lv2', text: 'level 2' }),
            el('span', { class: 'small muted',
              text: 'you produced its proof yourself (definitions and examples arrive here with the tick)' })
          ]),
          el('div', { class: 'row' }, [
            el('span', { class: 'badge lv3', text: 'level 3' }),
            el('span', { class: 'small muted',
              text: 'every textbook exercise in its section is worked through' })
          ]),
          el('div', { class: 'row' }, [el('span', { class: 'badge lv4', text: 'level 4' }),
            el('span', { class: 'small muted', text: 'past-paper questions worked through' })]),
          el('div', { class: 'row' }, [el('span', { class: 'badge lv5', text: 'level 5' }),
            el('span', { class: 'small muted', text: 'use Recall across the course and correct every missed item' })])
        ]),
        el('p', { class: 'small muted', style: { margin: '12px 0 0' },
          text: 'A module or a course takes the colour of the weakest thing inside it, so all '
            + 'red before red, all amber before amber, all green before green.' })
      ]),

      syncCard()
    ]);

    return root;
  }

  return { render };
})();


/* ── flow-library/app/src/view.study.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Study — the whole syllabus as one page of dropdowns you read your way
   through. Nothing is more than one line tall until you open it, so the size
   of the course never lands on you all at once; and since Level 4 the note
   itself opens here rather than on a page of its own, so studying a section
   never costs you your place.

   `#/study`             all three courses, collapsed to the last open path
   `#/study/<courseId>`  one course, for deep links
   ══════════════════════════════════════════════════════════════════════════ */

const ViewStudy = (function () {

  const el = DOM.el;

  const LEVEL_WORD = ['not started', 'read', 'proofs worked', 'exercises done', 'all complete'];

  function summaryStrip() {
    const ids = Pool.ids.concepts();
    const c = Progress.count(ids);
    return el('div', { class: 'card glass' }, [
      el('div', { class: 'spread' }, [
        el('div', {}, [
          el('div', { class: 'kicker', text: 'Where the syllabus stands' }),
          el('div', { style: { fontSize: '1.3rem', fontWeight: 600, marginTop: '2px' },
            text: c.l1 + ' of ' + c.total + ' read' })
        ]),
        el('span', { class: 'badge' + (c.min ? ' lv' + c.min : ''),
          text: c.min ? 'level ' + c.min + ' · ' + LEVEL_WORD[c.min] : 'not started' })
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.levelBar(c)])
    ]);
  }

  function courseView(course) {
    const root = el('div', { class: 'stack' });
    const host = el('div', {});
    const ids = Pool.ids.concepts(course.id);
    const c = Progress.count(ids);
    const pyq = Progress.pyqState(course.id);

    DOM.add(root, [
      UI.crumb([{ text: 'Study', href: 'study' }, { text: course.title }]),
      UI.title(course.title, course.code + (course.sem !== '—' ? ' · semester ' + course.sem : '')),
      el('p', { class: 'lede', text: course.blurb }),
      course.pending
        ? el('div', { class: 'banner' }, [
            DOM.mi('hourglass_empty'),
            el('span', {}, [el('b', { text: 'Not built yet. ' }), course.pendingNote])
          ])
        : el('div', { class: 'card tint' }, [
            el('div', { class: 'spread' }, [
              el('span', { class: 'kicker', text: 'Levels reached' }),
              el('span', { class: 'count', text: c.l1 + ' / ' + c.l2 + ' / ' + c.l3 + ' of ' + c.total })
            ]),
            el('div', { style: { marginTop: '8px' } }, [UI.levelBar(c)]),
            pyq.total ? el('div', { class: 'spread', style: { marginTop: '12px' } }, [
              el('span', { class: 'count', text: 'past papers · level 4' }),
              el('span', { class: 'count', text: pyq.done + '/' + pyq.total })
            ]) : null,
            pyq.total ? el('div', { style: { marginTop: '6px' } },
              [UI.meter(pyq.done, pyq.total, 4)]) : null
          ]),
      host
    ]);

    Tree.mount(host, course);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const course = Pool.course(args[0]);
      if (course) return courseView(course);
    }

    const root = el('div', { class: 'stack' });
    const host = el('div', {});
    Tree.seedOpen(Pool.courses().filter(c => !c.pending)[0]);

    DOM.add(root, [
      UI.title('Syllabus', 'Open a module, read what is inside it'),
      UI.mockBanner(),
      summaryStrip(),
      host,
      el('p', { class: 'small muted', style: { margin: 0 },
        text: 'One press on a row advances it: read it (red), then work its proof (amber). '
          + 'Green arrives when every exercise in that section is worked through — and a row '
          + 'with no proof, or a section with no exercises, is not held back by a stage that '
          + 'does not exist. A parent row takes the colour of the weakest thing inside it; a '
          + 'course reaches level 4 when its past papers are done.' })
    ]);

    Tree.mountAll(host, Pool.courses());
    return root;
  }

  /* `keepScroll` tells the shell not to jump to the top: this view restores
     the position of whatever was left open instead. */
  function afterPaint() { Tree.scrollToOpen(); }

  return { render, afterPaint, keepScroll: true };
})();


/* ── flow-library/app/src/view.note.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   `#/note/<id>` — kept, and no longer a page.

   The note is a component now (comp.note.js) that opens inside the syllabus
   tree. But `#/note/<id>` is written into hundreds of places: every
   prerequisite path, every "used later by" chip, and every concept reference
   `DOM.linkifyConcepts` finds in authored prose. Breaking them would mean
   rewriting content to fix navigation, which is backwards.

   So the route survives as a jump: open the path down to that concept and
   hand over to Study, which lands on it. One scroll, one screen, and every
   old link still means what it said.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewNote = (function () {

  const el = DOM.el;

  function render(args) {
    const id = args && args[0];
    if (!Pool.concept(id)) {
      return el('div', { class: 'stack' }, [
        UI.title('Not found'),
        UI.empty('That concept is not in the loaded pool.',
          el('a', { class: 'btn', href: Router.href('study'), text: 'Back to the syllabus' }))
      ]);
    }
    Tree.revealPath(id);
    return ViewStudy.render([]);
  }

  return { render, afterPaint: () => Tree.scrollToOpen(), keepScroll: true };
})();


/* ── flow-library/app/src/view.recall.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Recall, as a reel.

   One card per screen, swiped vertically, exactly one card per swipe. Getting
   that last part right is the whole job: a flick carries momentum, and a
   proximity-snapped scroller happily sails past two or three cards before it
   settles. `scroll-snap-stop: always` is the rule that forbids it. Every card
   is therefore exactly one viewport tall, and a card whose content overflows
   scrolls INSIDE itself and chains out at its ends.

   NOTHING COUNTS THE CARDS. There is no rail of dots, no "3 / 47", no "end of
   the reel" — you scroll and the next thing arrives, the way a reel is
   supposed to feel. Cards are appended a handful at a time as you approach the
   bottom, and the queue re-queries itself when it runs dry, so ticking a
   concept in Study while the reel is open makes new cards appear behind you
   rather than requiring a reload.

   What is in it, and in what order, is core.progress.js's business
   (`Progress.reel`): only material you have met, scheduled by Leitner box, due
   cards shuffled so no two passes are alike, and cards you know well a long
   way back. Nothing repeats within a pass.

   The rules are unchanged: nothing is revealed before an attempt, and the
   first grade is the one that counts.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewRecall = (function () {

  const el = DOM.el;
  const GRADES = [
    { k: 'got', label: 'Stated it', cls: 'primary' },
    { k: 'partly', label: 'Partly', cls: '' },
    { k: 'missed', label: 'Missed it', cls: '' }
  ];
  const BATCH = 6;          /* how many cards to add at a time */
  const LOOKAHEAD = 3;      /* how close to the end before the next batch */

  let onlyNew = false;
  let startAt = null;          /* concept id to open on, from ?from= */

  /* ── intro card ──────────────────────────────────────────────────────────
     The only place the reel is configured, and it says nothing about how much
     is left — that is the point. */
  function introCard(rebuild) {
    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: fn } });

    const anything = Progress.reel().length;

    return el('div', { class: 'inner' }, [
      el('div', {}, [
        el('div', { class: 'kicker', text: 'Reel · one swipe, one card' }),
        UI.title('Recall')
      ]),
      el('p', { class: 'lede' },
        ['Only what you have already met. Each card asks first; nothing is revealed ' +
         'until you have attempted it. What comes next is a surprise.']),

      anything
        ? el('div', { class: 'row' }, [
            chip('Everything', !onlyNew, function () { onlyNew = false; rebuild(); }),
            chip('Not yet attempted', onlyNew, function () { onlyNew = true; rebuild(); })
          ])
        : UI.empty(
            'The reel draws on notes you have read, proofs you have worked and questions you '
              + 'have answered — and there are none of those yet.',
            el('a', { class: 'btn primary', href: Router.href('study'), text: 'Open the syllabus' })),

      anything ? el('p', { class: 'small muted', style: { margin: 0 },
        text: 'Cards you get right come back days later, cards you miss come back soon. '
          + 'Tick something new in the syllabus and it joins the reel behind you.' }) : null
    ]);
  }

  /* ── shared card chrome ──────────────────────────────────────────────── */
  function head(item, badge) {
    const rec = Store.card(item.id);
    return el('div', { class: 'stack', style: { gap: '10px' } }, [
      el('div', { class: 'spread' }, [
        el('span', { class: 'badge accent', text: badge }),
        item.sec ? el('a', { class: 'small', href: Router.href('note/' + item.cid),
          text: '§' + item.sec }) : null
      ]),
      el('div', { class: 'kicker', text: item.conceptKind + ' · ' + item.title }),
      (rec && rec.first)
        ? el('div', { class: 'row' }, [
            el('span', {
              class: 'badge ' + (rec.first === 'got' ? 'ok' : rec.first === 'missed' ? 'bad' : 'warn'),
              text: 'first attempt: ' + rec.first
            }),
            el('span', { class: 'small muted', text: 'this pass will not change it' })
          ])
        : null
    ]);
  }

  function gradeRow(item, goNext, preGrade) {
    const rec = Store.card(item.id);
    const attemptedBefore = !!(rec && rec.first);
    const wrap = el('div', {});

    function commit(grade) {
      const r = Store.gradeCard(item.id, grade);
      DOM.clear(wrap);
      DOM.add(wrap, [
        el('div', { class: 'verdict ' +
          (grade === 'got' ? 'ok' : grade === 'missed' ? 'bad' : 'warn') }, [
          el('span', { class: 'g', 'aria-hidden': 'true' },
            [DOM.mi(grade === 'got' ? 'check_circle' : grade === 'missed' ? 'cancel' : 'remove_circle')]),
          el('span', {}, [
            el('b', { text: r.tries === 1 ? 'First attempt recorded: ' + grade
              : 'This pass: ' + grade }),
            el('span', { text: r.tries > 1
              ? 'First attempt (' + r.first + ') is unchanged.'
              : 'Completion and recall stay separate numbers.' })
          ])
        ]),
        el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
          el('button', { class: 'btn primary', type: 'button', text: 'Next card',
            on: { click: goNext } }),
          item.cid ? el('a', { class: 'btn', href: Router.href('note/' + item.cid),
            text: 'Open the note' }) : null
        ])
      ]);
      DOM.announce('Recorded ' + grade + '.');
    }

    DOM.add(wrap, [
      el('p', { class: 'small muted', style: { margin: '0 0 8px' },
        text: attemptedBefore
          ? 'How did this pass go? Your first attempt stays on record.'
          : 'How did your attempt compare with the answer above?' }),
      el('div', { class: 'btn-row' }, GRADES.map(g =>
        el('button', { class: 'btn ' + g.cls, type: 'button', text: g.label,
          on: { click: function () { commit(g.k); } } })))
    ]);

    if (preGrade) window.setTimeout(() => commit(preGrade), 0);
    return wrap;
  }

  /* ── a statement card ────────────────────────────────────────────────── */
  function statementCard(item, goNext) {
    const concept = Pool.concept(item.cid);
    let revealed = false;
    const gateHost = el('div', {});
    const writeHost = el('div', {});
    const answerHost = el('div', {});

    function unlock(msg) {
      DOM.clear(gateHost);
      gateHost.appendChild(el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: 'Show the canonical statement',
          on: { click: function () { reveal(); } } })
      ]));
      if (msg) DOM.announce(msg);
    }

    function reveal(preGrade) {
      if (revealed) return;
      revealed = true;
      DOM.clear(gateHost);
      DOM.clear(answerHost);
      answerHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: 'Canonical statement' })]),
        el('div', { class: 'b' }, [
          RealLine.statementInto(el('div', { class: 'prose tight', html: item.a }), concept),
          el('div', { class: 'row', style: { marginTop: '12px' } }, [
            el('a', { class: 'chip', href: Router.href('note/' + item.cid),
              text: 'Full note · ' + concept.title })
          ])
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.gate({
      hint: 'State it from memory first — write it out, or say it aloud and declare the attempt.',
      actions: [
        { label: 'Write it out', primary: true, onClick: function () {
            DOM.clear(writeHost);
            const wb = WriteBox.mount(writeHost, {
              concept: concept, label: 'Your statement',
              onFirstInput: function () { unlock('Attempt registered — you can reveal now.'); }
            });
            wb.focus();
          } },
        { label: 'I stated it aloud', onClick: function () { unlock('Attempt registered.'); } },
        { label: "I can't state it", onClick: function () { reveal('missed'); } }
      ]
    }));

    return el('div', { class: 'inner' }, [
      head(item, 'statement'),
      el('div', { class: 'prose', style: { fontSize: '1.12rem' }, html: item.q }),
      gateHost, writeHost, answerHost
    ]);
  }

  /* ── a proof card ────────────────────────────────────────────────────────
     The ask is the strategy, not the write-up: if you can say why the proof
     goes the way it does, the steps follow. */
  function proofCard(item, goNext) {
    const concept = Pool.concept(item.cid);
    const p = item.proof;
    let revealed = false;
    const gateHost = el('div', {});
    const writeHost = el('div', {});
    const answerHost = el('div', {});

    function unlock(msg) {
      DOM.clear(gateHost);
      gateHost.appendChild(el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: 'Show the argument',
          on: { click: function () { reveal(); } } })
      ]));
      if (msg) DOM.announce(msg);
    }

    function reveal(preGrade) {
      if (revealed) return;
      revealed = true;
      DOM.clear(gateHost);
      DOM.clear(answerHost);
      answerHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: 'The argument' })]),
        el('div', { class: 'b', style: { display: 'grid', gap: '10px' } }, [
          p.idea ? el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
            el('div', { class: 'kicker', text: 'Key idea' }),
            el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
          ]) : null,
          p.why ? el('div', { class: 'prose tight', html: p.why }) : null,
          (p.rungs && p.rungs.length)
            ? el('div', { class: 'stack', style: { gap: '8px' } }, (function (lines) {
                return p.rungs.map(function (r, i) { return UI.rung(r, i, { compact: true, line: lines[i] }); });
              })(RealLine.proof(concept)))
            : null,
          p.ends ? el('div', { class: 'prose tight', html: p.ends }) : null,
          el('div', { class: 'row' }, [
            el('a', { class: 'chip', href: Router.href('note/' + item.cid),
              text: 'Full note · ' + concept.title })
          ])
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.gate({
      hint: 'Say how the proof goes before you look — the main move, and why it works.',
      actions: [
        { label: 'Sketch it', primary: true, onClick: function () {
            DOM.clear(writeHost);
            const wb = WriteBox.mount(writeHost, {
              draftKey: 'proof:' + concept.id, concept: concept,
              label: 'Your sketch of the argument',
              placeholder: 'The main move is…',
              onFirstInput: function () { unlock('Attempt registered — you can reveal now.'); }
            });
            wb.focus();
          } },
        { label: 'I said it aloud', onClick: function () { unlock('Attempt registered.'); } },
        { label: "I can't reconstruct it", onClick: function () { reveal('missed'); } }
      ]
    }));

    return el('div', { class: 'inner' }, [
      head(item, 'proof'),
      el('div', { class: 'prose', style: { fontSize: '1.12rem' } }, [
        el('b', { text: 'Reconstruct the proof of ' }),
        el('span', { text: concept.title + '.' }),
        el('p', { class: 'small muted', style: { margin: '8px 0 0' },
          text: 'The strategy and why it works, not the full write-up.' })
      ]),
      gateHost, writeHost, answerHost
    ]);
  }

  /* ── an objective question, on a card ────────────────────────────────────
     The attempt IS the answer, so there is no separate grade row: the verdict
     the sheet returns is what schedules the card. */
  function questionCard(item, goNext) {
    const q = item.question;
    const tail = el('div', { class: 'btn-row' }, [
      el('button', { class: 'btn primary', type: 'button', text: 'Next card',
        on: { click: goNext } }),
      item.cid ? el('a', { class: 'btn', href: Router.href('note/' + item.cid),
        text: 'Open the note' }) : null
    ]);
    return el('div', { class: 'inner' }, [
      head(item, 'question'),
      QuestionCard.build(q, {
        inNote: true, tail: tail,
        onLocked: function (verdict) {
          Store.gradeCard(item.id,
            verdict === 'correct' ? 'got' : verdict === 'partial' ? 'partly' : 'missed');
        }
      })
    ]);
  }

  /* ── an exercise you have already worked, back for another look ──────── */
  function exerciseCard(item, goNext) {
    const q = item.question;
    let revealed = false;
    const gateHost = el('div', {});
    const writeHost = el('div', {});
    const answerHost = el('div', {});

    function unlock(msg) {
      DOM.clear(gateHost);
      gateHost.appendChild(el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: 'Show the worked answer',
          on: { click: function () { reveal(); } } })
      ]));
      if (msg) DOM.announce(msg);
    }

    function reveal(preGrade) {
      if (revealed) return;
      revealed = true;
      DOM.clear(gateHost);
      DOM.clear(answerHost);
      answerHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: 'Worked answer' })]),
        el('div', { class: 'b', style: { display: 'grid', gap: '10px' } }, [
          q.approach ? el('div', { class: 'prose tight', html: q.approach }) : null,
          q.solution ? el('div', { class: 'prose tight', html: q.solution }) : null,
          q.trap ? el('p', { class: 'small muted' },
            [el('b', { text: 'Trap: ' }), el('span', { html: q.trap })]) : null
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.gate({
      hint: 'You have worked this one before. Do the main move again before you look.',
      actions: [
        { label: 'Work it', primary: true, onClick: function () {
            DOM.clear(writeHost);
            const wb = WriteBox.mount(writeHost, {
              draftKey: 'written:' + q.id,
              concept: Pool.concept(item.cid) || { id: q.id, title: item.title },
              label: 'Your working',
              onFirstInput: function () { unlock('Attempt registered — you can reveal now.'); }
            });
            wb.focus();
          } },
        { label: 'I did it in my head', onClick: function () { unlock('Attempt registered.'); } },
        { label: "I can't do it now", onClick: function () { reveal('missed'); } }
      ]
    }));

    return el('div', { class: 'inner' }, [
      head(item, 'exercise'),
      el('div', { class: 'prose', style: { fontSize: '1.05rem' }, html: q.prompt }),
      gateHost, writeHost, answerHost
    ]);
  }

  const BUILDERS = {
    state: statementCard, proof: proofCard, question: questionCard, exercise: exerciseCard
  };

  /* ── the reel ────────────────────────────────────────────────────────── */
  function render(args, query) {
    if (query && query.from) { startAt = query.from; onlyNew = false; }

    const reel = el('div', { class: 'reel', tabindex: '-1', 'aria-label': 'Recall reel' });
    const root = el('div', {}, [
      el('h1', { id: 'pagetitle', tabindex: '-1', class: 'sr-only', text: 'Recall' }),
      reel
    ]);

    let cards = [];        /* the <section>s on screen, index 0 is the intro */
    let queue = [];        /* cards drawn but not yet placed */
    let placed = {};       /* every id already on screen — nothing repeats */
    let ended = false;

    function build() {
      if (io) { io.disconnect(); io = null; }
      DOM.clear(reel);
      cards = [];
      placed = {};
      ended = false;
      queue = Progress.reel({ onlyNew: onlyNew });

      push(el('section', { class: 'reel-card' }, [introCard(function () {
        build();
        reel.scrollTo({ top: 0, behavior: 'auto' });
      })]));

      extend(BATCH);
      observe();
      UI.math(reel);
      jumpToStart();
    }

    function push(section) {
      cards.push(section);
      reel.appendChild(section);
      if (io) io.observe(section);
    }

    const glide = i => {
      const to = cards[i];
      if (!to) return;
      reel.scrollTo({ top: to.offsetTop, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    };

    /* Draw `n` more cards. When the queue runs dry it is re-drawn, which is
       how material ticked while the reel is open finds its way in. */
    function extend(n) {
      let added = 0;
      while (added < n) {
        if (!queue.length) queue = Progress.reel({ onlyNew: onlyNew, exclude: placed });
        const item = queue.shift();
        if (!item) break;
        if (placed[item.id]) continue;
        placed[item.id] = true;
        const at = cards.length;
        const make = BUILDERS[item.kind];
        if (!make) continue;
        push(el('section', { class: 'reel-card', 'data-cid': item.cid || '' },
          [make(item, function () { glide(at + 1); })]));
        added += 1;
      }
      if (!added && !ended) {
        ended = true;
        push(el('section', { class: 'reel-card' }, [
          el('div', { class: 'inner' }, [
            UI.empty(onlyNew
              ? 'Everything in your material has had a first attempt.'
              : 'That is everything you have met, for now. Read something new and it '
                + 'will be here waiting.',
              el('a', { class: 'btn primary', href: Router.href('study'),
                text: 'Open the syllabus' }))
          ])
        ]));
      }
      UI.math(reel);
    }

    /* Mark the card in view, and top the reel up before you reach the end.
       Cards are one viewport tall, so a majority-of-the-viewport test is both
       correct and cheap. */
    let io = null;
    function observe() {
      if (!window.IntersectionObserver) { cards.forEach(c => c.classList.add('live')); return; }
      if (io) return;
      io = new window.IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          const seen = e.intersectionRect ? e.intersectionRect.height : 0;
          const port = (e.rootBounds && e.rootBounds.height) || reel.clientHeight || 1;
          const live = e.isIntersecting && seen / port > 0.55;
          e.target.classList.toggle('live', live);
          if (live && cards.indexOf(e.target) >= cards.length - LOOKAHEAD) extend(BATCH);
        });
      }, { root: reel, threshold: [0, 0.25, 0.56, 0.9, 1] });
      cards.forEach(c => io.observe(c));
    }

    function jumpToStart() {
      if (!startAt) return;
      const at = cards.map(c => c.getAttribute('data-cid')).indexOf(startAt);
      startAt = null;
      if (at > 0) window.requestAnimationFrame(function () {
        reel.scrollTo({ top: cards[at].offsetTop, behavior: 'auto' });
      });
    }

    /* Ticking a concept in Study while the reel is open should put its cards
       in the reel, not wait for a reload. The end card is the only thing in
       the way, so it is taken back off and the queue asked again. */
    Store.onChange(function () {
      if (!document.body.contains(reel) || !ended) return;
      const last = cards.pop();
      if (last && last.parentNode) last.parentNode.removeChild(last);
      ended = false;
      extend(BATCH);
    });

    /* Keyboard moves exactly one card, like the swipe. */
    reel.addEventListener('keydown', function (e) {
      const keys = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 };
      const dir = keys[e.key];
      if (!dir) return;
      if (/^(TEXTAREA|INPUT|SELECT)$/.test((e.target.tagName || '').toUpperCase())) return;
      e.preventDefault();
      const h = reel.clientHeight || 1;
      const last = reel.children.length - 1;
      const at = Math.round(reel.scrollTop / h);
      const to = Math.max(0, Math.min(last, at + dir));
      reel.scrollTo({ top: to * h, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });

    build();
    return root;
  }

  return { render, wrapClass: 'wrap bleed' };
})();


/* ── flow-library/app/src/view.omr.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Objective questions, OMR first.

   The question itself is now a component — see comp.question.js — because a
   question belongs next to the note that teaches it, not behind a tab of its
   own. There is no Questions tab any more: this screen survives only so that
   `#/omr/<id>` links keep resolving, and so there is somewhere to see the
   whole bank at once.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewOmr = (function () {

  const el = DOM.el;

  /* ── list ──────────────────────────────────────────────────────────────── */
  let filter = 'all';

  function list(query) {
    const root = el('div', { class: 'stack' });
    const sec = query && query.sec;
    const chips = el('div', { class: 'row' });
    const host = el('div', {});

    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: fn } });

    function paint() {
      let qs = Pool.objective();
      if (sec) qs = qs.filter(q => q.sec === sec);
      if (filter === 'new') qs = qs.filter(q => !(Store.omr(q.id) || {}).first);
      else if (filter !== 'all') qs = qs.filter(q => q.type === filter);

      DOM.clear(chips);
      DOM.add(chips, ['all', 'new', 'MCQ', 'MSQ', 'NAT'].map(f => chip(
        f === 'all' ? 'All' : f === 'new' ? 'Not attempted' : f,
        filter === f, function () { filter = f; paint(); })));

      DOM.clear(host);
      if (!qs.length) { host.appendChild(UI.empty('Nothing matches that filter.')); return; }

      host.appendChild(el('div', { class: 'list' }, qs.map(function (q, i) {
        const rec = Store.omr(q.id);
        const v = rec && rec.first && rec.first.verdict;
        return el('a', { class: 'item', href: Router.href('omr/' + q.id) }, [
          el('span', { class: 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : '') },
            [v ? DOM.mi(v === 'correct' ? 'check' : v === 'wrong' ? 'close' : 'remove', 'xs')
               : el('span', { text: String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: '§' + q.sec + '  ' + Pool.sectionTitle(q.sec) }),
            el('span', { text: q.type + ' · ' + q.marks + ' ' + DOM.plural(q.marks, 'mark') +
              ' · ' + (v ? 'first attempt: ' + v : (q.neg ? (q.negLabel || q.neg) + ' if wrong' : 'no negative')) })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      })));
    }

    const s = Store.summary([], [], Pool.ids.objective());
    DOM.add(root, [
      UI.title('Questions', 'Answer first, then the full solution'),
      UI.mockBanner(),
      el('p', { class: 'small muted', style: { margin: 0 },
        text: 'Every one of these also opens inside the note it examines, in the syllabus.' }),
      el('div', { class: 'card tint' }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'kicker', text: 'First attempts' }),
          el('span', { class: 'count',
            text: s.omr.locked + ' of ' + s.omr.total + ' locked · ' + s.omr.correct + ' correct' })
        ]),
        el('div', { style: { marginTop: '8px' } }, [UI.meter(s.omr.locked, s.omr.total)])
      ]),
      sec ? el('div', { class: 'row' }, [
        el('span', { class: 'badge accent', text: '§' + sec }),
        el('a', { class: 'chip', href: Router.href('omr'), text: 'clear section filter' })
      ]) : null,
      chips, host
    ]);
    paint();
    return root;
  }

  /* ── one question ──────────────────────────────────────────────────────── */
  function nextLink(q) {
    const all = Pool.objective();
    const i = all.map(x => x.id).indexOf(q.id);
    const unattempted = all.slice(i + 1).concat(all.slice(0, i))
      .filter(x => !(Store.omr(x.id) || {}).first)[0];
    const next = unattempted || all[(i + 1) % all.length];
    return el('a', { class: 'btn primary', href: Router.href('omr/' + next.id),
      text: unattempted ? 'Next unattempted question' : 'Next question' });
  }

  function detail(q) {
    const tail = el('div', { class: 'btn-row' }, [
      nextLink(q), el('a', { class: 'btn', href: Router.href('omr'), text: 'All questions' })
    ]);
    return el('div', { class: 'stack' }, [
      UI.crumb([{ text: 'Questions', href: 'omr' },
        { text: '§' + q.sec + ' ' + Pool.sectionTitle(q.sec) }]),
      el('h1', { tabindex: '-1', id: 'pagetitle', class: 'sr-only',
        text: q.type + ' question on ' + Pool.sectionTitle(q.sec) }),
      QuestionCard.build(q, { tail: tail })
    ]);
  }

  function render(args, query) {
    if (args && args[0]) {
      const q = Pool.objectiveOne(args[0]);
      if (q) return detail(q);
      return el('div', { class: 'stack' }, [
        UI.title('Not found'),
        UI.empty('That question is not in the loaded bank.',
          el('a', { class: 'btn', href: Router.href('omr'), text: 'All questions' }))
      ]);
    }
    return list(query);
  }

  return { render, judge: QuestionCard.judge };
})();


/* ── flow-library/app/src/view.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Theorem writing.

   The target is named but its statement is withheld: you write first, then
   compare. The canonical statement is behind a gate for the same reason the
   flashcard answer is — reading a statement is not writing one.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewWrite = (function () {

  const el = DOM.el;

  function picker() {
    const targets = Pool.concepts();
    return el('div', { class: 'stack' }, [
      UI.title('Write a statement', 'LaTeX, with the palette beside you'),
      el('p', { class: 'lede small' },
        ['Pick what to write from memory. You type the maths fragment only — the palette offers ' +
         'exactly the commands that statement needs, and the rendering appears under the input.']),
      el('div', { class: 'list' }, targets.map(function (c) {
        const has = !!Store.draft(c.id);
        return el('a', { class: 'item', href: Router.href('write/' + c.id) }, [
          el('span', { class: 'ix' + (has ? ' ok' : '') },
            [DOM.mi(has ? 'edit_note' : 'radio_button_unchecked', 'xs')]),
          el('span', { class: 'tt' }, [
            el('b', { text: c.title }),
            el('span', { text: '§' + c.sec + ' · ' + c.kind + (has ? ' · draft saved' : '') })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      }))
    ]);
  }

  function workspace(c) {
    const root = el('div', { class: 'stack' });
    const boxHost = el('div', { class: 'card' });
    const compareHost = el('div', {});

    const wb = WriteBox.mount(boxHost, { concept: c, label: 'Your statement, in LaTeX' });

    function compare() {
      DOM.clear(compareHost);
      compareHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: 'Canonical statement' })]),
        el('div', { class: 'b' }, [
          UI.prose(c.statement, 'tight'),
          el('p', { class: 'small muted', style: { margin: '12px 0 0' },
            text: 'Compare the quantifiers and the hypotheses first — that is where written answers lose marks, ' +
              'not in the algebra.' }),
          el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
            el('a', { class: 'btn', href: Router.href('note/' + c.id), text: 'Open the full note' }),
            el('a', { class: 'btn', href: Router.href('recall?from=' + encodeURIComponent(c.id)),
              text: 'Grade it as recall' })
          ])
        ])
      ]));
      UI.math(compareHost);
      DOM.announce('Canonical statement revealed.');
    }

    const gate = UI.gate({
      hint: 'Write your version above first. The canonical statement stays hidden until you ask for it.',
      actions: [
        { label: 'Compare with the canonical statement', primary: true, onClick: function () {
            if (!wb.hasContent() &&
              !window.confirm('Nothing is written yet. Reveal the statement anyway?')) return;
            compare();
          } }
      ]
    });

    DOM.add(root, [
      UI.crumb([{ text: 'Write', href: 'write' }, { text: '§' + c.sec }]),
      el('div', {}, [
        el('div', { class: 'row', style: { marginBottom: '8px' } }, [UI.kindBadge(c), UI.levelBadge(c.id)]),
        UI.title(c.title, 'Write the statement of')
      ]),
      el('p', { class: 'lede', text: c.oneLine }),
      boxHost,
      gate,
      compareHost
    ]);

    UI.math(root);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const c = Pool.concept(args[0]);
      if (c) return workspace(c);
    }
    return picker();
  }

  return { render };
})();


/* ── flow-library/app/src/boot.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Boot: theme, data loading, navigation, routing, failure surfaces.
   ══════════════════════════════════════════════════════════════════════════ */

const Theme = (function () {
  const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function apply() {
    const pref = Store.pref('theme', 'auto');
    const dark = pref === 'dark' || (pref === 'auto' && media && media.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
