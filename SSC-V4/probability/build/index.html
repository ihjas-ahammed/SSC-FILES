  {id:'w.prob.5.1.1',sec:'5.1',marks:4,title:'Adaptation of Ross Self-Test 5.2',prompt:`A variable has density $f(x)=c x^2$ for $0<x<1$ and zero otherwise. Find $c$, $F(x)$, and $P(X>1/2)$.`,approach:`Normalize first. Then integrate piecewise for the CDF and use the survival probability.`,solution:`Normalization gives $1=c\\int_0^1x^2dx=c/3$, so $c=3$. Thus $F(x)=0$ for $x\\le0$, $F(x)=x^3$ for $0<x<1$, and $F(x)=1$ for $x\\ge1$. Therefore $P(X>1/2)=1-(1/2)^3=7/8$.`,trap:`The support restriction matters: extending $3x^2$ to all real $x$ would not define this density.`,tests:['c.prob.5.1.1','c.prob.5.1.2']},
  {id:'w.prob.5.1.2',sec:'5.1',marks:3,title:'Original drill: equal CDF values',prompt:`Let $X$ be continuous with CDF $F$. If $F(3)=0.2$ and $F(8)=0.75$, find $P(3<X\\le8)$ and $P(X=3)$.`,approach:`Use CDF differences; continuous variables put zero mass at a single point.`,solution:`$P(3<X\\le8)=F(8)-F(3)=0.75-0.2=0.55$. Since $X$ is continuous, $P(X=3)=0$.`,trap:`A CDF value is cumulative probability, not density height.`,tests:['c.prob.5.1.1']},
  {id:'w.prob.5.2.1',sec:'5.2',marks:5,title:'Adaptation of Ross Self-Test 5.3',prompt:`For $f(x)=c x^4$ on $0<x<2$ and zero elsewhere, find $c$, $E[X]$, and $\\operatorname{Var}(X)$.`,approach:`Normalize, then calculate the first and second raw moments and subtract the squared mean.`,solution:`$1=c\\int_0^2x^4dx=32c/5$, so $c=5/32$. Then $E[X]=(5/32)\\int_0^2x^5dx=5/3$, and $E[X^2]=(5/32)\\int_0^2x^6dx=20/7$. Hence $\\operatorname{Var}(X)=20/7-25/9=5/63$.`,trap:`The variance is $E[X^2]-(E[X])^2$, not the second moment alone.`,tests:['c.prob.5.2.1','c.prob.5.2.2']},
  {id:'w.prob.5.2.2',sec:'5.2',marks:4,title:'Original drill: tail integral',prompt:`A nonnegative lifetime has survival function $P(X>t)=e^{-2t}$. Find $E[X]$ using the tail-integral formula and identify its exponential rate.`,approach:`Integrate the survival curve over $t\\ge0$.`,solution:`$E[X]=\\int_0^\\infty e^{-2t}dt=1/2$. This is an exponential lifetime with rate $\\lambda=2$.`,trap:`The mean is the reciprocal of the rate, not the rate itself.`,tests:['c.prob.5.2.3','c.prob.5.5.1']},
  {id:'w.prob.5.3.1',sec:'5.3',marks:4,title:'Original drill: uniform interval',prompt:`For $X\\sim\\operatorname{Unif}(-2,6)$, find $P(1<X<5)$, $E[X]$, and $\\operatorname{Var}(X)$.`,approach:`Use interval length within the support, then the uniform moment formulas.`,solution:`The support width is $8$ and the requested interval width is $4$, so the probability is $1/2$. The mean is $(-2+6)/2=2$. The variance is $8^2/12=16/3$.`,trap:`Use width $b-a$, not $a+b$, in the variance formula.`,tests:['c.prob.5.3.1','c.prob.5.3.2']},
  {id:'w.prob.5.3.2',sec:'5.3',marks:5,title:'Original drill: minimum of reflected uniform values',prompt:`Let $U\\sim\\operatorname{Unif}(0,1)$. Find the distribution of $Y=\\min(U,1-U)$.`,approach:`For $0\\le y\\le1/2$, compute $P(Y>y)$ as the length of the interval where both $U>y$ and $1-U>y$.`,solution:`For $0\\le y\\le1/2$, $Y>y$ iff $y<U<1-y$, so $P(Y>y)=1-2y$. Therefore $F_Y(y)=2y$ on $[0,1/2]$, with $F_Y=0$ below 0 and $F_Y=1$ above $1/2$. Differentiating gives density $2$ on $(0,1/2)$: $Y\\sim\\operatorname{Unif}(0,1/2)$.`,trap:`The map is two-to-one over the interior; counting only one side loses half the probability.`,tests:['c.prob.5.3.1','c.prob.5.7.2']},
  {id:'w.prob.5.4.1',sec:'5.4',marks:5,title:'Adaptation of Ross Self-Test 5.8',prompt:`An IQ score is approximately normal with mean $100$ and standard deviation $15$. Express the probability of a score above $125$ using $\\Phi$, and give a numerical value to three decimals.`,approach:`Standardize the cutoff, then read the upper tail of the standard normal.`,solution:`$z=(125-100)/15=5/3$. Thus $P(X>125)=1-\\Phi(5/3)\\approx0.048$.`,trap:`The stated 15 is the standard deviation; the variance would be $225$.`,tests:['c.prob.5.4.1']},
  {id:'w.prob.5.4.2',sec:'5.4',marks:4,title:'Adaptation of Ross Self-Test 5.9',prompt:`Commute time is normal with mean 40 minutes and standard deviation 7 minutes. Find the latest departure buffer that keeps the probability of being late at most 5%, using $z_{0.95}=1.645$.`,approach:`Choose the 95th percentile of travel time.`,solution:`The required buffer $t$ satisfies $P(X\\le t)=0.95$, so $t=40+1.645(7)=51.515$ minutes. Leave at least about 51.5 minutes before the appointment.`,trap:`For an upper 5% tail, use the 95th percentile, not the 5th.`,tests:['c.prob.5.4.1','c.prob.5.4.2']},
  {id:'w.prob.5.5.1',sec:'5.5',marks:4,title:'Adaptation of Ross Self-Test 5.13',prompt:`Service time is exponential with mean 5 minutes. A customer is already in service. Find the probability service lasts at least 4 more minutes.`,approach:`The exponential is memoryless; the elapsed time does not enter the residual survival probability.`,solution:`The rate is $\\lambda=1/5$ per minute. By memorylessness the desired probability is $P(X>4)=e^{-4/5}\\approx0.449$.`,trap:`Do not add the elapsed service time unless the question asks total service duration.`,tests:['c.prob.5.5.1']},
  {id:'w.prob.5.5.2',sec:'5.5',marks:5,title:'Adaptation of Ross Self-Test 5.14',prompt:`A lifetime has CDF $F(x)=1-e^{-x^2}$ for $x>0$, and $F(x)=0$ otherwise. Find its density and hazard rate for $x>0$.`,approach:`Differentiate the CDF and divide the density by the survival function.`,solution:`$f(x)=F'(x)=2xe^{-x^2}$. The survival is $S(x)=e^{-x^2}$, hence $h(x)=f(x)/S(x)=2x$ for $x>0$.`,trap:`Hazard divides by survival, not by the CDF.`,tests:['c.prob.5.1.1','c.prob.5.5.2']},
  {id:'w.prob.5.6.1',sec:'5.6',marks:4,title:'Adaptation of Ross Self-Test 5.16',prompt:`If $X$ is standard Cauchy with density $1/[\\pi(1+x^2)]$, use the transformation formula to find the density of $Y=1/X$.`,approach:`For $y\\ne0$, the inverse is $x=1/y$ and its derivative has absolute value $1/y^2$.`,solution:`$f_Y(y)=f_X(1/y)/y^2=[1/(\\pi(1+y^{-2}))]/y^2=1/[\\pi(1+y^2)]$, $y\\ne0$. Thus $Y$ is also standard Cauchy (the value of a density at $0$ can be assigned by continuity).`,trap:`The derivative factor $1/y^2$ is essential; substitution alone is insufficient.`,tests:['c.prob.5.6.2','c.prob.5.7.1']},
  {id:'w.prob.5.6.2',sec:'5.6',marks:4,title:'Original drill: Pareto moments',prompt:`A Pareto variable has survival $P(X>x)=(2/x)^3$ for $x\\ge2$. Find its mean by the tail-integral formula.`,approach:`For $0\\le t<2$, survival is 1; for $t\\ge2$, use the stated Pareto tail.`,solution:`$E[X]=\\int_0^2 1\\,dt+\\int_2^\\infty(2/t)^3dt=2+8[ -1/(2t^2)]_2^\\infty=2+1=3$.`,trap:`The survival is 1 below the lower support endpoint; do not apply the power tail there.`,tests:['c.prob.5.2.3','c.prob.5.6.2']},
  {id:'w.prob.5.7.1',sec:'5.7',marks:4,title:'Adaptation of Ross Self-Test 5.22',prompt:`Let $U\\sim\\operatorname{Unif}(0,1)$ and let $a<b$. Find the distribution of $Y=a+(b-a)U$.`,approach:`Solve the event $Y\\le y$ and track the transformed support.`,solution:`The support is $(a,b)$. For $a<y<b$, $P(Y\\le y)=P(U\\le(y-a)/(b-a))=(y-a)/(b-a)$. Thus $Y\\sim\\operatorname{Unif}(a,b)$.`,trap:`If the scale coefficient were negative, the inequality would reverse; here $b-a>0$.`,tests:['c.prob.5.3.1','c.prob.5.7.1']},
  {id:'w.prob.5.7.2',sec:'5.7',marks:5,title:'Original drill: square of a symmetric variable',prompt:`Let $X$ be uniform on $(-1,1)$ and $Y=X^2$. Find $F_Y(y)$ and the density of $Y$.`,approach:`For $0<y<1$, the event $X^2\\le y$ is an interval centered at zero.`,solution:`For $0<y<1$, $P(Y\\le y)=P(-\\sqrt y\\le X\\le\\sqrt y)=(2\\sqrt y)/2=\\sqrt y$. Hence $F_Y(y)=0$ for $y\\le0$, $\\sqrt y$ on $(0,1)$, and 1 for $y\\ge1$. Therefore $f_Y(y)=1/(2\\sqrt y)$ for $0<y<1$.`,trap:`There are two inverse branches $x=\\pm\\sqrt y$; both contribute.`,tests:['c.prob.5.7.1','c.prob.5.7.2']}
);

  {id:'o.prob.5.2.1',course:'prob',sec:'5.2',type:'MCQ',marks:2,neg:-2/3,negLabel:'−2/3',time:50,prompt:`If $E[X]=3$ and $\\operatorname{Var}(X)=4$, what is $\\operatorname{Var}(2X-7)$?`,options:[{k:'A',t:'1'},{k:'B',t:'8'},{k:'C',t:'16'},{k:'D',t:'−16'}],answer:'C',solution:`Variance scales by the square of the multiplier: $2^2\\cdot4=16$.`,tested:`Affine variance transformation.`,trap:`Using $a$ instead of $a^2$.`,twist:{q:`What is $E[2X-7]$?`,a:`$2(3)-7=-1$.`},tests:['c.prob.5.2.2'],provenance:'Original assessment item; concept aligned with Ross §5.2.'},
  {id:'o.prob.5.3.1',course:'prob',sec:'5.3',type:'NAT',marks:2,neg:0,time:45,prompt:`$X\\sim\\operatorname{Unif}(2,10)$. Find $P(4<X<7)$.`,answer:{value:0.375,tol:0,dp:3},solution:`The overlap length is $7-4=3$ and support length is $10-2=8$, giving $3/8=0.375$.`,tested:`Uniform interval probability as a length ratio.`,trap:`Dividing by an endpoint rather than by the support width.`,twist:{q:`Find $\\operatorname{Var}(X)$.`,a:`$8^2/12=16/3$.`},tests:['c.prob.5.3.1'],provenance:'Original assessment item; concept aligned with Ross §5.3.'},
  {id:'o.prob.5.4.1',course:'prob',sec:'5.4',type:'MCQ',marks:2,neg:-2/3,negLabel:'−2/3',time:55,prompt:`If $X\\sim N(10,9)$, which is the standardization of $X=13$?`,options:[{k:'A',t:'$z=1$'},{k:'B',t:'$z=3$'},{k:'C',t:'$z=1/3$'},{k:'D',t:'$z=−1$'}],answer:'A',solution:`The standard deviation is $3$, so $z=(13-10)/3=1$.`,tested:`Correct use of the variance parameter and standard deviation.`,trap:`Treating variance 9 as the standard deviation.`,twist:{q:`What is $P(X\\le13)$ in terms of $\\Phi$?`,a:`$\\Phi(1)$.`},tests:['c.prob.5.4.1'],provenance:'Original assessment item; concept aligned with Ross §5.4.'},
  {id:'o.prob.5.5.1',course:'prob',sec:'5.5',type:'NAT',marks:2,neg:0,time:50,prompt:`An exponential lifetime has rate $\\lambda=0.2$ per hour. Given survival for 3 hours, find the probability it lasts at least 2 more hours.`,answer:{value:0.670320046,tol:0.000001,dp:6},solution:`Memorylessness gives $P(X>2)=e^{-0.2(2)}=e^{-0.4}\\approx0.670320$.`,tested:`Exponential memorylessness.`,trap:`Conditioning on survival to 3 hours does not mean multiplying by the first three hours of survival again.`,twist:{q:`What is the unconditional probability of surviving at least 5 hours?`,a:`$e^{-1}\\approx0.367879$.`},tests:['c.prob.5.5.1'],provenance:'Original assessment item; concept aligned with Ross §5.5.'},
  {id:'o.prob.5.6.1',course:'prob',sec:'5.6',type:'MSQ',marks:2,neg:0,negLabel:'0',time:60,prompt:`Select all true statements about the named laws.`,options:[{k:'A',t:'A standard Cauchy variable has a finite mean.'},{k:'B',t:'A gamma law with shape 1 and rate $\\lambda$ is exponential with rate $\\lambda$.'},{k:'C',t:'A beta variable is supported on $(0,1)$.'},{k:'D',t:'A Pareto law always has a finite mean.'}],answer:['B','C'],solution:`The gamma density with shape 1 is $\\lambda e^{-\\lambda x}$; beta support is $(0,1)$. Cauchy mean is undefined; a Pareto mean exists only when its tail exponent exceeds 1.`,tested:`Supports, special cases and moment existence across continuous families.`,trap:`“Heavy-tailed” families can lack moments, and Pareto moment existence depends on its parameter.`,twist:{q:`For Pareto tail $P(X>x)=(a/x)^\\alpha$, when is the mean finite?`,a:`When $\\alpha>1$.`},tests:['c.prob.5.6.1','c.prob.5.6.2'],provenance:'Original assessment item; concepts aligned with Ross §5.6.'},

  {
    "id": "c.prob.6.3.3",
    "sec": "6.3",
    "kind": "theorem",
    "tier": "core",
    "title": "Gamma sums with a common rate",
    "oneLine": "Independent gamma variables with a shared rate add their shape parameters.",
    "statement": "<p>If independent $X_i\\sim\\operatorname{Gamma}(\\alpha_i,\\lambda)$ use shape-rate parameterization, then $\\sum_iX_i\\sim\\operatorname{Gamma}(\\sum_i\\alpha_i,\\lambda)$. In particular, a sum of $n$ independent exponential$(\\lambda)$ variables is gamma$(n,\\lambda)$.</p>",
    "intuition": "If a job has several independent waiting stages with the same pace, total wait stays in the gamma family and its shape counts the combined stages.",
    "needs": [

      "The rates must agree for this simple closure result.",
      "Check whether a source defines gamma's second parameter as rate or scale."
    ],
    "proof": {
      "idea": "Convolve two gamma densities, substitute $u=y/s$, and identify the beta integral; induction gives the finite-sum case.",
      "why": "Convolution combines the powers while preserving the shared exponential tail.",
      "rungs": [
        {
          "why": "Multiply the two gamma kernels within the convolution.",
          "m": "$$e^{-\\lambda(s-y)}(s-y)^{\\alpha-1}e^{-\\lambda y}y^{\\beta-1}=e^{-\\lambda s}(s-y)^{\\alpha-1}y^{\\beta-1}$$",
          "meaning": "The shared rate makes the exponential factor independent of the split $y$."
        },
        {
          "why": "Scale the convolution variable by the total $s$.",
          "m": "$$\\int_0^s(s-y)^{\\alpha-1}y^{\\beta-1}dy=s^{\\alpha+\\beta-1}B(\\alpha,\\beta)$$",
          "meaning": "The beta integral supplies the normalization and the powers add to shape $\\alpha+\\beta$."
        },
        {
          "why": "Recognize the resulting normalized gamma density.",
          "m": "$$X+Y\\sim\\operatorname{Gamma}(\\alpha+\\beta,\\lambda)$$",
          "meaning": "The resulting sum keeps the rate and combines the shapes."
        }
      ],
      "ends": "Apply the two-variable result repeatedly to obtain the sum of any finite number of independent gamma variables with common rate."
    },
    "cards": [
      {
        "q": "What is the sum law for independent gamma variables with common rate $\\lambda$?",
        "a": "Gamma with the same rate and shape equal to the sum of the component shapes.",
        "kind": "state"
      }

    "provenance": "Ross, §6.3.2, pp. 265–266 (PDF pp. 265–266)."
  },
  {
    "id": "c.prob.6.3.4",
    "sec": "6.3",
    "kind": "theorem",
    "tier": "core",
    "title": "Normal, Poisson and binomial sum laws",
    "oneLine": "Several familiar families are closed under independent addition.",
    "statement": "<p>For independent $X_i\\sim N(\\mu_i,\\sigma_i^2)$, $\\sum_iX_i\\sim N(\\sum_i\\mu_i,\\sum_i\\sigma_i^2)$. Independent Poisson variables add to Poisson with summed rates. Independent binomial variables with common success probability $p$ add to binomial with summed trial counts.</p>",
    "intuition": "If two independent stores get Poisson customer arrivals, their combined count is Poisson with the two rates added. Two binomial counts combine the same way only when each trial has the same success chance.",
    "needs": [

    "traps": [

      "Binomial closure requires a common $p$; different probabilities generally do not give a binomial sum."

    "proof": {
      "idea": "Use convolution: normal density exponents complete a square; Poisson masses use the binomial theorem; binomial masses use Vandermonde's identity.",
      "why": "The family parameters combine because the independent component probabilities multiply and the possible allocations sum.",
      "rungs": [
        {
          "why": "For independent variables, convolution sums over all ways to split a total.",
          "m": "$$P(X+Y=k)=\\sum_jP(X=j)P(Y=k-j)$$",
          "meaning": "Every decomposition of the total contributes its product probability."
        },
        {
          "why": "For Poisson masses, factor the terms independent of the allocation and apply the binomial theorem.",
          "m": "$$e^{-(\\lambda_1+\\lambda_2)}\\frac{(\\lambda_1+\\lambda_2)^k}{k!}$$",
          "meaning": "The sum has the Poisson form with the combined rate."
        },
        {
          "why": "For binomial counts with shared $p$, count allocations across the two trial groups.",
          "m": "$$\\binom{n+m}{k}p^k(1-p)^{n+m-k}$$",
          "meaning": "Pooling the trials preserves a common success probability and adds their counts."
        }
      ],
      "ends": "For independent normal summands, the same convolution principle gives summed means and variances."
    },
    "cards": [
      {
        "q": "State the addition rule for independent Poisson variables.",
        "a": "Their sum is Poisson with parameter equal to the sum of the parameters.",
        "kind": "state"
      }

    "statement": "<p>When $P(Y=y)>0$, $p_{X\\mid Y}(x\\mid y)=P(X=x\\mid Y=y)=p_{X,Y}(x,y)/p_Y(y)$. The conditional CDF is the sum of these conditional masses up to its argument.</p>",

    "kind": "theorem",
    "tier": "core",
    "title": "Poisson splitting conditional on a total",
    "oneLine": "Given a total of n events from two independent Poisson counts, the allocation to the first is binomial.",
    "statement": "<p>If independent $X\\sim\\operatorname{Poisson}(\\lambda_1)$ and $Y\\sim\\operatorname{Poisson}(\\lambda_2)$, then $X\\mid(X+Y=n)\\sim\\operatorname{Binomial}(n,\\lambda_1/(\\lambda_1+\\lambda_2))$.</p>",
    "intuition": "Two independent phone lines receive calls at different rates. If you know there were 10 calls altogether, a call is more likely to have come from the busier line, in proportion to its rate.",

  {

  {
    "id": "c.prob.6.5.2",
    "sec": "6.5",
    "kind": "theorem",
    "tier": "core",
    "title": "Conditional law of a bivariate normal",
    "oneLine": "A bivariate normal slice is normal, with conditional mean shifted linearly by the observed coordinate.",
    "statement": "<p>If $(X,Y)$ is bivariate normal with means $\\mu_X,\\mu_Y$, standard deviations $\\sigma_X,\\sigma_Y$ and correlation $\\rho$, then $X\\mid Y=y$ is normal with mean $\\mu_X+\\rho\\frac{\\sigma_X}{\\sigma_Y}(y-\\mu_Y)$ and variance $\\sigma_X^2(1-\\rho^2)$.</p>",
    "intuition": "For height and weight in a bell-shaped population, a taller-than-average height shifts the predicted weight upward. The correlation tells how much to shift; stronger link means less leftover uncertainty.",
    "needs": [
      "c.prob.6.5.1",
      "c.prob.6.2.2"

    "traps": [
      "The conditional variance does not depend on $y$ for a bivariate normal pair.",
      "Use standard deviations in the mean adjustment, variances in the variance formula."

    "proof": {
      "idea": "Substitute the bivariate normal density into the conditional-density quotient and complete the square in x.",
      "why": "The completed square exposes a normal kernel in x, whose center and scale give the conditional parameters.",
      "rungs": [
        {
          "why": "Divide the joint density by the marginal density of Y.",
          "m": "$$f_{X|Y}(x|y)=f_{X,Y}(x,y)/f_Y(y)$$",
          "meaning": "In words, Divide the joint density by the marginal density of Y."
        },
        {
          "why": "Collect terms depending on x and complete their square.",
          "m": "$$[x-\\{\\mu_X+\\rho(\\sigma_X/\\sigma_Y)(y-\\mu_Y)\\}]^2/[2\\sigma_X^2(1-\\rho^2)]$$",
          "meaning": "In words, Collect terms depending on x and complete their square."
        },
        {
          "why": "Read the mean and variance from the normalized normal kernel.",
          "m": "$$X|Y=y\\sim N(\\mu_X+\\rho(\\sigma_X/\\sigma_Y)(y-\\mu_Y),\\,\\sigma_X^2(1-\\rho^2))$$",
          "meaning": "In words, Read the mean and variance from the normalized normal kernel."
        }
      ],
      "ends": "The residual variance is nonnegative for a valid correlation; at |rho|=1 the conditional law is degenerate and the density formula is understood as a limit."
    },
    "cards": [

        "a": "Normal with mean $\\mu_X+\\rho(\\sigma_X/\\sigma_Y)(y-\\mu_Y)$ and variance $\\sigma_X^2(1-\\rho^2)$.",

  {
    "id": "c.prob.6.6.1",
    "sec": "6.6",
    "kind": "theorem",
    "tier": "core",
    "title": "Order statistics of an iid continuous sample",
    "oneLine": "The kth smallest sample value has a binomial-count CDF and a beta-shaped density factor.",
    "statement": "<p>Let $X_1,\\ldots,X_n$ be iid continuous with CDF $F$ and density $f$, and write $X_{(k)}$ for the kth smallest. Then $F_{X_{(k)}}(x)=\\sum_{j=k}^n\\binom njF(x)^j[1-F(x)]^{n-j}$, and $f_{X_{(k)}}(x)=\\frac{n!}{(k-1)!(n-k)!}F(x)^{k-1}[1-F(x)]^{n-k}f(x)$.</p>",
    "intuition": "For 5 exam scores, the third-smallest score is at most 70 exactly when at least 3 scores are at most 70. Counting how many land below the cutoff gives the order statistic’s chance.",
    "needs": [
      "c.prob.6.1.3"
    ],
    "traps": [
      "Use $k-1$ observations below the kth value and $n-k$ above it.",
      "The joint order-statistic density lives only on the ordered region $x_1<\\cdots<x_n$."
    ],
    "proof": {
      "idea": "Count how many iid observations fall below $x$ for the CDF; partition which observation occupies the kth position for the density.",
      "why": "Ordering an iid sample converts threshold comparisons into a binomial count.",
      "rungs": [
        {
          "why": "Count the number of observations at most $x$.",
          "m": "$$N_x=\\sum_{i=1}^n1_{\\{X_i\\le x\\}}\\sim\\operatorname{Binomial}(n,F(x))$$",
          "meaning": "Each independent observation is below the threshold with probability $F(x)$."
        },
        {
          "why": "The kth value is at most $x$ exactly when at least $k$ observations are below the threshold.",
          "m": "$$P(X_{(k)}\\le x)=P(N_x\\ge k)$$",
          "meaning": "A sample needs $k$ successes in the below-threshold count for its kth order statistic to lie there."
        },
        {
          "why": "Differentiate the binomial tail or select the one observation near $x$ and the observations on either side.",
          "m": "$$f_{X_{(k)}}(x)=\\frac{n!}{(k-1)!(n-k)!}F^{k-1}(1-F)^{n-k}f(x)$$",
          "meaning": "The coefficient counts assignments to below, near, and above groups; $f(x)dx$ supplies the near-$x$ probability."
        }
      ],
      "ends": "The joint density of all ordered values is $n!\\prod_i f(x_i)$ on $x_1<\\cdots<x_n$ because each ordering of iid distinct observations has the same product density."
    },
    "cards": [
      {
        "q": "State the CDF characterization of $X_{(k)}$.",
        "a": "$X_{(k)}\\le x$ iff at least $k$ sample values are at most $x$; thus its CDF is a binomial upper tail with success probability $F(x)$.",

      }

  {
    "id": "c.prob.6.6.2",
    "sec": "6.6",
    "kind": "theorem",
    "tier": "core",
    "title": "Range of an iid sample",
    "oneLine": "The sample range is largest minus smallest; its law follows from the joint law of the two extremes.",
    "statement": "<p>For iid continuous observations, $R=X_{(n)}-X_{(1)}$. For $a\\ge0$, $P(R\\le a)=n\\int_{-\\infty}^{\\infty}[F(x+a)-F(x)]^{n-1}f(x)dx$. For $n$ iid uniform$(0,1)$ observations, $f_R(a)=n(n-1)a^{n-2}(1-a)$ for $0<a<1$.</p>",

    "traps": [

      "The uniform formula is supported only on $0<a<1$."

    "proof": {
      "idea": "Use the joint density of the sample minimum and maximum, then integrate over pairs whose difference is at most a.",

          "why": "The joint density of the minimum and maximum is obtained from the order-statistic density by integrating interior observations.",
          "m": "$$f_{X_{(1)},X_{(n)}}(x,z)=n(n-1)[F(z)-F(x)]^{n-2}f(x)f(z),\\quad x<z$$",
          "meaning": "In words, The joint density of the minimum and maximum is obtained from the order-statistic density by integrating interior observations."
        },
        {
          "why": "Integrate over x<z≤x+a and then integrate out z.",
          "m": "$$P(R\\le a)=n\\int [F(x+a)-F(x)]^{n-1}f(x)dx$$",
          "meaning": "In words, Integrate over x<z≤x+a and then integrate out z."
        },
        {
          "why": "For uniform(0,1), split the minimum location into the interval where x+a≤1 and the boundary strip.",
          "m": "$$P(R\\le a)=n(1-a)a^{n-1}+a^n$$",
          "meaning": "In words, For uniform(0,1), split the minimum location into the interval where x+a≤1 and the boundary strip."
        }
      ],
      "ends": "Differentiating the uniform CDF gives $f_R(a)=n(n-1)a^{n-2}(1-a)$ on (0,1)."
    },
    "cards": [
      {
        "q": "What event is used to derive the CDF of a sample range?",
        "a": "Choose the minimum at $x$ and require every other observation to fall in $(x,x+a]$.",
        "kind": "state"
      }

    "provenance": "Ross, §6.6, pp. 279–280 (PDF pp. 279–280)."

  {
    "id": "c.prob.6.7.1",
    "sec": "6.7",
    "kind": "theorem",
    "tier": "core",
    "title": "Multivariate change of variables",
    "oneLine": "A one-to-one smooth transformation changes joint density by the absolute inverse-Jacobian determinant.",
    "statement": "<p>Let $(Y_1,Y_2)=g(X_1,X_2)$ be one-to-one and differentiable with differentiable inverse $(x_1,x_2)=h(y_1,y_2)$. Then $f_{Y_1,Y_2}(y_1,y_2)=f_{X_1,X_2}(h(y_1,y_2))\\left|\\det Dh(y_1,y_2)\\right|$ on the transformed support. The same rule holds in $n$ dimensions.</p>",
    "intuition": "Changing from map coordinates to distance and direction stretches little patches. The Jacobian is the stretch factor, so the probability density must shrink or grow by the opposite amount to keep the same probability.",
    "needs": [
      "c.prob.6.1.3"
    ],
    "traps": [
      "Use the determinant of the inverse map when substituting into the original density.",

    "proof": {

          "meaning": "In words, Write probability in the original coordinates over the inverse image of a small output region."
        },
        {
          "why": "Substitute x=h(y) in the integral.",
          "m": "$$dx=|\\det Dh(y)|dy$$",
          "meaning": "In words, Substitute x=h(y) in the integral."
        },
        {
          "why": "Read off the density in the transformed coordinates.",
          "m": "$$f_Y(y)=f_X(h(y))|\\det Dh(y)|$$",
          "meaning": "In words, Read off the density in the transformed coordinates."
        }
      ],
      "ends": "The inverse Jacobian formula applies when the transformation is one-to-one and differentiable with nonzero determinant; multiple inverse branches contribute a sum."
    },
    "cards": [
      {
        "q": "State the density change-of-variables rule using the inverse map $x=h(y)$.",

  {
    "id": "c.prob.6.7.2",
    "sec": "6.7",
    "kind": "theorem",
    "tier": "extra",
    "title": "Gamma sum and proportion",
    "oneLine": "Independent equal-rate gamma variables separate into an independent total and a beta proportion.",
    "statement": "<p>If independent $X\\sim\\operatorname{Gamma}(\\alpha,\\lambda)$ and $Y\\sim\\operatorname{Gamma}(\\beta,\\lambda)$, set $U=X+Y$ and $V=X/(X+Y)$. Then $U\\sim\\operatorname{Gamma}(\\alpha+\\beta,\\lambda)$, $V\\sim\\operatorname{Beta}(\\alpha,\\beta)$, and $U,V$ are independent.</p>",

  {id:'w.prob.6.1.1',sec:'6.1',marks:5,title:'Adaptation of Ross Problem 6.1(c)',prompt:`Two fair dice are rolled. Let $X$ be the smaller result and $Y$ the larger result. Give the joint pmf in a formula, including its support.`,approach:`There are 36 ordered outcomes. When the values differ, either order of the dice produces the same pair; when equal, there is one outcome.`,solution:`For $1\\le i\\le j\\le6$, $P(X=i,Y=j)=1/36$ if $i=j$, and $2/36$ if $i<j$. It is zero otherwise. The total mass is $6/36+2\\binom62/36=1$.`,trap:`Do not give off-diagonal pairs only one ordered outcome; both die orders count.`,tests:['c.prob.6.1.1','c.prob.6.1.2']},
  {id:'w.prob.6.1.2',sec:'6.1',marks:4,title:'Original drill: marginal from a joint density',prompt:`A joint density is $f(x,y)=2$ on $0<x<y<1$ and zero elsewhere. Find $f_X(x)$ and $f_Y(y)$.`,approach:`For fixed $x$, integrate over $x<y<1$; for fixed $y$, integrate over $0<x<y$.`,solution:`$f_X(x)=\\int_x^1 2dy=2(1-x)$ for $0<x<1$. $f_Y(y)=\\int_0^y2dx=2y$ for $0<y<1$. Both are zero outside $(0,1)$. Each integrates to one.`,trap:`The triangular support makes the inner limits depend on the coordinate held fixed.`,tests:['c.prob.6.1.3']},
  {id:'w.prob.6.2.1',sec:'6.2',marks:4,title:'Adaptation of Ross Problem 6.20',prompt:`Let $f(x,y)=x e^{-(x+y)}$ for $x>0,y>0$, zero otherwise. Determine whether $X,Y$ are independent.`,approach:`Compute both marginals and test whether their product equals the joint density across the support.`,solution:`$f_X(x)=\\int_0^\\infty xe^{-(x+y)}dy=xe^{-x}$ and $f_Y(y)=\\int_0^\\infty xe^{-(x+y)}dx=e^{-y}$. Their product is $xe^{-(x+y)}=f(x,y)$ on the support, so $X,Y$ are independent.`,trap:`A factorization must use the normalized marginal densities and agree on the whole support.`,tests:['c.prob.6.1.3','c.prob.6.2.1']},
  {id:'w.prob.6.2.2',sec:'6.2',marks:4,title:'Original drill: uncorrelated does not imply independent',prompt:`Let $X$ be uniform on $(-1,1)$ and set $Y=X^2$. Show that $\\operatorname{Cov}(X,Y)=0$ but that $X,Y$ are dependent.`,approach:`Use symmetry to compute $E[X]$ and $E[X^3]$. Then note that $Y$ is determined by $X$.`,solution:`By symmetry $E[X]=E[X^3]=0$, so $\\operatorname{Cov}(X,Y)=E[XY]-E[X]E[Y]=E[X^3]=0$. But $Y=X^2$ is a nonconstant function of $X$, so it cannot be independent of $X$: for example, $P(Y<1/4\\mid |X|<1/2)=1$ while $P(Y<1/4)=1/2$.`,trap:`Zero covariance is weaker than independence outside special families such as jointly normal pairs.`,tests:['c.prob.6.2.1','c.prob.6.2.2']},
  {id:'w.prob.6.3.1',sec:'6.3',marks:5,title:'Adaptation of Ross Problem 6.29(a)',prompt:`Daily sales are independent normal variables with mean $2200$ and standard deviation $230$. Find the probability the two-day total exceeds $5000$, expressing the answer using $\\Phi$ and giving an approximation.`,approach:`The independent normal sum has summed means and variances; standardize the threshold.`,solution:`The total has mean $4400$ and variance $2(230)^2$, so standard deviation $230\\sqrt2$. Hence $P(S>5000)=1-\\Phi(600/(230\\sqrt2))=1-\\Phi(1.844)\\approx0.033$.`,trap:`Standard deviations do not add; variances add for independent variables.`,tests:['c.prob.6.3.1','c.prob.6.3.4']},
  {id:'w.prob.6.3.2',sec:'6.3',marks:4,title:'Original drill: uniform convolution',prompt:`For independent $X,Y\\sim\\operatorname{Unif}(0,1)$, derive the density of $S=X+Y$ and compute $P(S<1)$.`,approach:`Convolve the densities and split at the point where the integration limits stop expanding.`,solution:`For $0<s<1$, $f_S(s)=\\int_0^s1\\,dy=s$. For $1\\le s<2$, the overlap length is $2-s$, so $f_S(s)=2-s$. Otherwise the density is zero. Thus $P(S<1)=\\int_0^1s\\,ds=1/2$.`,trap:`The support is $(0,2)$; a sum of two uniforms is not itself uniform.`,tests:['c.prob.6.3.1','c.prob.6.3.2']},
  {id:'w.prob.6.4.1',sec:'6.4',marks:5,title:'Adaptation of Ross Problem 6.12',prompt:`In one hour, independent male and female arrival counts are Poisson with rates $4$ and $6$. Given 10 total arrivals, find the conditional distribution of the number of male arrivals and the probability there are at most 3.`,approach:`Use the conditional allocation theorem for independent Poisson variables, then sum four binomial masses.`,solution:`If $M$ is the male count, $M\\mid(M+F=10)\\sim\\operatorname{Binomial}(10,4/10)$. Therefore $P(M\\le3\\mid M+F=10)=\\sum_{k=0}^3\\binom{10}{k}(0.4)^k(0.6)^{10-k}\\approx0.3823$.`,trap:`The conditional probability is the male rate divided by the combined rate.`,tests:['c.prob.6.4.1','c.prob.6.4.2']},
  {id:'w.prob.6.4.2',sec:'6.4',marks:4,title:'Original drill: conditioned Bernoulli order',prompt:`Among 5 iid Bernoulli$(p)$ trials, given there are exactly 2 successes, what is the probability that the first two trials are the successes?`,approach:`All choices of the two success positions have the same conditional probability.`,solution:`There are $\\binom52=10$ equally likely position sets conditional on two successes. Exactly one set is $\\{1,2\\}$, so the probability is $1/10$.`,trap:`Do not retain the factor $p^2(1-p)^3$ after conditioning; it cancels for every ordering.`,tests:['c.prob.6.4.1']},
  {id:'w.prob.6.5.1',sec:'6.5',marks:5,title:'Adaptation of Ross Problem 6.45',prompt:`A joint density is $f(x,y)=2$ on $0<x<y<1$ and zero elsewhere. Find $f_{X\\mid Y}(x\\mid y)$ and $P(X<1/2\\mid Y=y)$ for $0<y<1$.`,approach:`First compute $f_Y(y)$, then divide the joint density by that marginal and integrate over the requested event.`,solution:`$f_Y(y)=2y$ for $0<y<1$. Therefore $f_{X\\mid Y}(x\\mid y)=1/y$ on $0<x<y$. The conditional probability is $1$ if $y\\le1/2$; if $y>1/2$, it is $(1/2)/y=1/(2y)$.`,trap:`The conditional support depends on the observed value $y$.`,tests:['c.prob.6.1.3','c.prob.6.5.1']},
  {id:'w.prob.6.5.2',sec:'6.5',marks:5,title:'Original drill: conditional bivariate normal',prompt:`A bivariate normal pair has $\\mu_X=1$, $\\mu_Y=2$, $\\sigma_X=3$, $\\sigma_Y=4$, and $\\rho=1/2$. Give the law of $X\\mid Y=6$.`,approach:`Substitute into the conditional mean and variance formulas.`,solution:`The mean is $1+(1/2)(3/4)(6-2)=1+1.5=2.5$. The variance is $3^2(1-1/4)=27/4$. Thus $X\\mid Y=6\\sim N(2.5,27/4)$.`,trap:`The mean uses a standard-deviation ratio; the variance uses $\\sigma_X^2$.`,tests:['c.prob.6.5.1','c.prob.6.5.2']},
  {id:'w.prob.6.6.1',sec:'6.6',marks:5,title:'Adaptation of Ross Problem 6.50',prompt:`Three independent points are uniform on a road segment of length 1. Find the probability no pair is within distance $d=0.2$.`,approach:`Order the locations and use the spacing formula for the minimum gap condition.`,solution:`For $n=3$ and $d\\le1/(n-1)$, the probability is $[1-(n-1)d]^n$. Hence $[1-2(0.2)]^3=0.6^3=0.216$.`,trap:`The condition applies to both consecutive spacings; verify $d\\le1/2$.`,tests:['c.prob.6.6.1','c.prob.6.6.2']},
  {id:'w.prob.6.6.2',sec:'6.6',marks:4,title:'Original drill: sample maximum',prompt:`For 4 iid observations with CDF $F$, derive the CDF and density of the maximum $X_{(4)}$.`,approach:`The maximum is at most $x$ exactly when all four observations are at most $x$.`,solution:`$F_{X_{(4)}}(x)=P(X_1\\le x,\\ldots,X_4\\le x)=F(x)^4$. If $F$ has density $f$, differentiation gives $f_{X_{(4)}}(x)=4F(x)^3f(x)$.`,trap:`Independence is required to raise the marginal CDF to the fourth power.`,tests:['c.prob.6.6.1']},
  {id:'w.prob.6.7.1',sec:'6.7',marks:5,title:'Adaptation of Ross Problem 6.27',prompt:`Let $X\\sim\\operatorname{Exp}(1)$ and $Y\\sim\\operatorname{Exp}(2)$ independently. Find the density of $Z=X/Y$ and compute $P(X<Y)$.`,approach:`Transform $(X,Y)$ to $(Z,Y)$ with $X=ZY$, then integrate out $Y$.`,solution:`The inverse map $(z,y)\\mapsto(zy,y)$ has Jacobian $y$. Thus $f_{Z,Y}(z,y)=2y e^{-(z+2)y}$ for $z,y>0$. Integrating in $y$ gives $f_Z(z)=2/(z+2)^2$. Therefore $P(X<Y)=P(Z<1)=\\int_0^1 2/(z+2)^2dz=1/3$.`,trap:`The Jacobian factor $y$ is required; $P(X<Y)$ is then the ratio CDF below 1.`,tests:['c.prob.6.7.1']},
  {id:'w.prob.6.7.2',sec:'6.7',marks:4,title:'Original drill: gamma proportion',prompt:`Independent $X\\sim\\operatorname{Gamma}(2,3)$ and $Y\\sim\\operatorname{Gamma}(5,3)$ use shape-rate parameters. Identify the joint law of $U=X+Y$ and $V=X/(X+Y)$.`,approach:`Apply the equal-rate gamma total/proportion transformation.`,solution:`$U\\sim\\operatorname{Gamma}(7,3)$ and $V\\sim\\operatorname{Beta}(2,5)$, independently.`,trap:`The rate must be common for this independence result; here both rates are 3.`,tests:['c.prob.6.3.3','c.prob.6.7.2']},
  {id:'w.prob.6.8.1',sec:'6.8',marks:4,title:'Adaptation of Ross Problem 6.2',prompt:`Three balls are drawn without replacement from 5 white and 8 red balls. Let $X_i=1$ if draw $i$ is white and 0 otherwise. Show $P(X_1=1,X_2=0)=P(X_1=0,X_2=1)$ and explain what it shows.`,approach:`Compute each ordered pattern by sequential conditional probabilities.`,solution:`$P(1,0)=(5/13)(8/12)=10/39$. Also $P(0,1)=(8/13)(5/12)=10/39$. The labels of the draw positions can be permuted without changing the joint law, illustrating exchangeability. The draws remain dependent because the first color changes the composition.`,trap:`Symmetry under permutations does not mean the draws are independent.`,tests:['c.prob.6.8.1','c.prob.6.8.2']},
  {id:'w.prob.6.8.2',sec:'6.8',marks:4,title:'Original drill: latent shared probability',prompt:`Let $\\Theta\\sim\\operatorname{Unif}(0,1)$ and conditional on $\\Theta$ let $X_1,X_2$ be iid Bernoulli$(\\Theta)$. Show the pair is exchangeable but dependent.`,approach:`Compute the joint probabilities by averaging over $\\Theta$.`,solution:`$P(X_1=1,X_2=0)=E[\\Theta(1-\\Theta)]=1/6$, and by symmetry $P(X_1=0,X_2=1)=1/6$, so the joint law is permutation-invariant. But $P(X_1=1)=E[\\Theta]=1/2$ and $P(X_1=1,X_2=1)=E[\\Theta^2]=1/3\\ne1/4$, so the pair is dependent.`,trap:`Conditional independence given $\\Theta$ does not imply unconditional independence after averaging over a shared random parameter.`,tests:['c.prob.6.8.1','c.prob.6.8.2']}

        "a": "Cov$(X,Y)=E[XY]-E[X]E[Y]$; $\\rho=\\operatorname{Cov}(X,Y)/(\\sigma_X\\sigma_Y)$ when both standard deviations are nonzero.",

    "statement": "For finite second moments, $\\operatorname{Var}(\\sum_{i=1}^nX_i)=\\sum_i\\operatorname{Var}(X_i)+2\\sum_{i<j}\\operatorname{Cov}(X_i,X_j)$. If the variables are pairwise uncorrelated, this reduces to the sum of variances; independence is sufficient for that reduction.",

    "title": "Law of total variance",
    "oneLine": "Total variance is average within-group variance plus variance between group means.",
    "statement": "For $E[X^2]<\\infty$, define the conditional variance by $\\operatorname{Var}(X\\mid Y)=E[(X-E[X\\mid Y])^2\\mid Y]=E[X^2\\mid Y]-(E[X\\mid Y])^2$. Then $\\operatorname{Var}(X)=E[\\operatorname{Var}(X\\mid Y)]+\\operatorname{Var}(E[X\\mid Y])$.",

    "traps": [

          "m": "$E[\\operatorname{Var}(X\\mid Y)]=E[X^2]-E[(E[X\\mid Y])^2]$",
          "meaning": "The tower property turns the first term into $E[X^2]$."

          "m": "$E[X^2]-(E[X])^2=\\operatorname{Var}(X)$",

 {id:'c.prob.9.1.1',sec:'9.1',kind:'definition',tier:'ext',title:'Homogeneous Poisson process',oneLine:'A rate-λ Poisson process has stationary independent increments and locally a single-event chance λh+o(h).',statement:'A Poisson counting process N(t) has N(0)=0, independent counts on disjoint intervals, stationary increments, $P(N(h)=1)=\\lambda h+o(h)$, and $P(N(h)\\ge2)=o(h)$ as h↓0. Then $N(t)\\sim Poisson(\\lambda t)$.',intuition:'Imagine counting raindrops during a shower. If the rate stays steady and separate time windows do not affect each other, then a longer window simply gives more chances for drops; the count over time t follows a Poisson law with average λt.',needs:[],traps:['Poisson process requires independent and stationary increments; a Poisson marginal count by itself does not establish a process.','The rate λ is events per unit time, so mean count over length t is λt.'],cards:[{q:'State the defining increment features of a homogeneous Poisson process.',a:'Starts at zero; independent increments; stationary increments; short interval one-event probability λh+o(h), multi-event probability o(h).',kind:'state'},{q:'What is the distribution of N(t)?',a:'Poisson with parameter λt.',kind:'state'}],proof:{idea:'Derive the zero-count probability from the local one-event chance, then use exponential interarrival times to obtain all count probabilities.',why:'The infinitesimal assumptions determine the waiting-time law, and the count event is equivalent to an arrival-time event.',rungs:[{why:'For P₀(t)=P(N(t)=0), use an independent increment over (t,t+h].',m:'P_0(t+h)=P_0(t)[1-\\lambda h+o(h)]'},{why:'Take a difference quotient and use P₀(0)=1.',m:'P_0\' (t)=-\\lambda P_0(t),\\quad P_0(t)=e^{-\\lambda t}'},{why:'Interarrival times are iid Exp(λ); the nth arrival time is Gamma(n,λ). Difference consecutive arrival-count tails to obtain the pmf.',m:'P(N(t)=n)=e^{-\\lambda t}(\\lambda t)^n/n!'}],ends:'Thus counts over an interval of length t are Poisson(λt), and disjoint intervals give independent counts.'},provenance:'Ross, 10th ed., §9.1, PDF pp. 427–429, Lemma 1.1, Proposition 1.1 and Theorem 1.1.'},
 {id:'c.prob.9.1.2',sec:'9.1',kind:'theorem',tier:'ext',title:'Interarrival and arrival times',oneLine:'A Poisson process has iid exponential interarrival times; the nth arrival time is gamma distributed.',statement:'For a rate-λ Poisson process, the interarrival times $T_1,T_2,\\ldots$ are independent Exp(λ) variables with mean 1/λ. The nth arrival time $S_n=\\sum_{i=1}^nT_i$ has Gamma(shape n, rate λ) density $f_{S_n}(x)=\\lambda e^{-\\lambda x}(\\lambda x)^{n-1}/(n-1)!$, x≥0.',intuition:'If arrivals happen at a steady rate, the time until the next one has an exponential waiting-time law. After each arrival the clock starts fresh, and the time to the nth arrival is the sum of n such waits.',needs:['c.prob.9.1.1'],traps:['Mean interarrival time is 1/λ, whereas mean count per unit time is λ.','The Gamma convention here uses rate λ, not scale λ.'],cards:[{q:'What are the interarrival times in a Poisson process?',a:'Independent exponential random variables, each with rate λ.',kind:'state'},{q:'What is the nth arrival-time law?',a:'Gamma with shape n and rate λ.',kind:'state'}],proof:{idea:'Use the no-arrival event for the exponential survival function; use independent increments to restart after each arrival.',why:'The probability of waiting longer than t is exactly the chance of zero events in length t.',rungs:[{why:'Translate T₁>t into a zero-count event.',m:'P(T_1>t)=P(N(t)=0)=e^{-\\lambda t}'},{why:'For later arrivals, condition on the preceding arrival and apply stationary independent increments.',m:'P(T_{k+1}>t\\mid T_k=s)=e^{-\\lambda t}'},{why:'Sum n independent exponential waits.',m:'S_n=T_1+\\cdots+T_n\\sim Gamma(n,\\lambda)'}],ends:'The gamma arrival-time distribution is the bridge between waiting times and Poisson event counts.'},provenance:'Ross, 10th ed., §9.1, PDF pp. 428–429.'},
 {id:'c.prob.9.2.1',sec:'9.2',kind:'definition',tier:'ext',title:'Markov property and transition matrix',oneLine:'The next state depends on the past only through the current state.',statement:'A sequence $(X_n)$ is a Markov chain with transition probabilities $P_{ij}$ if $P(X_{n+1}=j\\mid X_n=i,X_{n-1},\\ldots,X_0)=P_{ij}$. Each row of the transition matrix P is a probability distribution: $P_{ij}\\ge0$ and $\\sum_jP_{ij}=1$.',intuition:'For a Markov chain, the current situation contains everything from the past that matters for the next move. For example, if the weather today is known, yesterday’s weather gives no extra help predicting tomorrow in this model.',needs:[],traps:['Markov does not mean the states Xₙ are independent.','Rows are conditioned on the current state; the transition matrix convention here is row-stochastic.'],cards:[{q:'State the Markov property.',a:'Given the current state, the next state is conditionally independent of the earlier history.',kind:'state'},{q:'What must each transition-matrix row satisfy?',a:'Nonnegative entries that sum to 1.',kind:'state'}],provenance:'Ross, 10th ed., §9.2, PDF pp. 430–431.'},
 {id:'c.prob.9.2.2',sec:'9.2',kind:'theorem',tier:'ext',title:'Path probabilities and Chapman–Kolmogorov',oneLine:'A path probability is an initial-state mass times its successive transition probabilities; multi-step transitions compose by summing over intermediate states.',statement:'For states i₀,...,iₙ, $P(X_0=i_0,\\ldots,X_n=i_n)=P(X_0=i_0)\\prod_{r=1}^nP_{i_{r-1},i_r}$. The n-step transition matrix is $P^{(n)}=P^n$ and $P_{ij}^{(r+s)}=\\sum_kP_{ik}^{(r)}P_{kj}^{(s)}$.',intuition:'To get from state i to state j in several steps, list the possible in-between states. Find the chance of each route by multiplying its step chances, then add the route chances.',needs:['c.prob.9.2.1'],traps:['The one-step entry Pᵢⱼ is not the probability of being at j after n steps.','When composing steps, sum over intermediate states; multiplying one selected path gives only that path’s contribution.'],cards:[{q:'State Chapman–Kolmogorov for r+s steps.',a:'$P_{ij}^{(r+s)}=\\sum_kP_{ik}^{(r)}P_{kj}^{(s)}$.',kind:'state'}],proof:{idea:'Condition on the intermediate state at time r and apply the Markov property.',why:'The intermediate state partitions all ways to arrive at j at time r+s.',rungs:[{why:'Partition by X_r=k.',m:'P(X_{r+s}=j\\mid X_0=i)=\\sum_kP(X_{r+s}=j,X_r=k\\mid X_0=i)'},{why:'Use the Markov property after time r.',m:'=\\sum_kP(X_{r+s}=j\\mid X_r=k)P(X_r=k\\mid X_0=i)'},{why:'Identify the two transition probabilities.',m:'P_{ij}^{(r+s)}=\\sum_kP_{ik}^{(r)}P_{kj}^{(s)}'}],ends:'In matrix notation this is matrix multiplication, so the n-step transition matrix is Pⁿ.'},provenance:'Ross, 10th ed., §9.2, PDF pp. 430–432, Proposition 2.1.'},
 {id:'c.prob.9.2.3',sec:'9.2',kind:'technique',tier:'ext',title:'Stationary distribution and long-run proportions',oneLine:'A stationary distribution solves π=πP and sums to one; convergence to it requires additional chain conditions.',statement:'A stationary distribution is a probability row vector π satisfying $\\pi=\\pi P$. For finite ergodic chains, transition probabilities converge to the unique stationary distribution and πⱼ is the long-run proportion of time in state j.',intuition:'A stationary distribution is a set of state percentages that stays the same after one step. In a well-mixing finite chain, those percentages also describe the long-run share of time spent in each state.',needs:['c.prob.9.2.1','c.prob.9.2.2'],traps:['A stationary distribution may exist without convergence from every starting state.','Solve πP=π together with Σπⱼ=1; do not mistake a right eigenvector convention for the row-vector convention used here.'],cards:[{q:'What equations define a stationary distribution?',a:'π=πP, πⱼ≥0, and Σⱼπⱼ=1.',kind:'state'}],provenance:'Ross, 10th ed., §9.2, PDF pp. 432–433, Theorem 2.1 and examples 2e–2f.'},
 {id:'c.prob.9.3.1',sec:'9.3',kind:'definition',tier:'ext',title:'Surprise and Shannon entropy',oneLine:'An outcome of probability p carries surprise −log₂p bits; entropy is expected surprise.',statement:'Under the additive, continuous, monotone surprise axioms, $S(p)=-C\\log_2p$ for C>0. With C=1, a discrete X with masses pᵢ has entropy $H(X)=-\\sum_ip_i\\log_2p_i$, taking 0 log₂0=0.',intuition:'A rare result tells you more when it happens than an expected result does. Entropy is the average number of bits of surprise you would get before learning which result occurred.',needs:[],traps:['Entropy is an average over outcomes, not the surprise of one particular outcome.','The log base sets units: base 2 gives bits, natural log gives nats.'],cards:[{q:'Define Shannon entropy for a discrete variable.',a:'$H(X)=-\\sum_ip_i\\log_2p_i$, with zero-mass terms set to zero.',kind:'state'}],provenance:'Ross, 10th ed., §9.3, PDF pp. 434–436, Theorem 3.1 and entropy definition.'},
 {id:'c.prob.9.3.2',sec:'9.3',kind:'theorem',tier:'ext',title:'Entropy chain rule and conditioning reduces entropy',oneLine:'Joint entropy splits into the entropy of one variable plus conditional entropy; observing data cannot increase average uncertainty.',statement:'For finite-support discrete X,Y, $H(X,Y)=H(Y)+H(X\\mid Y)$ and $H(X\\mid Y)\\le H(X)$, with equality iff X and Y are independent.',intuition:'After you learn Y, some questions about X may already be answered. The chain rule adds what Y tells you and what remains about X; on average, learning Y cannot leave you more uncertain about X.',needs:['c.prob.9.3.1'],traps:['For a particular observed y, H(X|Y=y) can exceed H(X); the inequality is for the average conditional entropy.','Independence gives equality; dependence can reduce but not increase average uncertainty.'],cards:[{q:'State the entropy chain rule.',a:'$H(X,Y)=H(Y)+H(X|Y)$.',kind:'state'},{q:'When does H(X|Y)=H(X)?',a:'Exactly when X and Y are independent.',kind:'state'}],proof:{idea:'Factor the joint mass as p(y)p(x|y) inside the logarithm; use nonnegativity of relative entropy for the inequality.',why:'The logarithm turns multiplication of probabilities into addition of information terms.',rungs:[{why:'Substitute the conditional factorization into joint entropy.',m:'-\\sum_{x,y}p(x,y)\\log[p(y)p(x|y)]'},{why:'Split the logarithm and sum each contribution.',m:'H(X,Y)=H(Y)+H(X|Y)'},{why:'Apply log u≤(u−1)log e to compare conditional and marginal masses.',m:'H(X|Y)-H(X)\\le0'}],ends:'Equality in the entropy inequality holds precisely when p(x|y)=p(x) on all positive-probability pairs, which is independence.'},provenance:'Ross, 10th ed., §9.3, PDF pp. 436–437, Proposition 3.1, Lemma 3.1, Theorem 3.2.'},
 {id:'c.prob.9.3.3',sec:'9.3',kind:'theorem',tier:'ext',title:'Entropy is maximized by a uniform law',oneLine:'Among distributions on n values, entropy is at most log₂ n, attained only by equal probabilities.',statement:'If X has at most n possible values, then $H(X)\\le\\log_2 n$, with equality iff $P(X=x_i)=1/n$ for all i.',intuition:'If one of n results is certain to happen and you have no reason to favor any one of them, equal chances create the most uncertainty: log₂n bits.',needs:['c.prob.9.3.1'],traps:['The bound depends on the number of possible values, not the numerical sizes of those values.','Zero-probability listed values mean the effective support is smaller, so equality cannot hold across all n slots.'],cards:[{q:'What is the maximum entropy for n possible outcomes?',a:'log₂ n bits, attained by the uniform distribution.',kind:'state'}],proof:{idea:'Compare p with the uniform distribution using nonnegative relative entropy.',why:'The uniform law is the least informative reference among n possible labels, and relative entropy measures the excess concentration of p.',rungs:[{why:'Apply Gibbs inequality to p and u_i=1/n.',m:'D(p\\|u)=\\sum_ip_i\\log_2(p_i/u_i)\\ge0'},{why:'Expand and use Σp_i=1.',m:'D(p\\|u)=\\sum_ip_i\\log_2p_i+\\log_2n=\\log_2n-H(X)'},{why:'Rearrange and identify equality.',m:'H(X)\\le\\log_2n,\\quad equality\\iff p_i=1/n'}],ends:'Uniform probabilities uniquely maximize entropy on a fixed n-point support.'},provenance:'Ross, 10th ed., §9.3, PDF pp. 435–436 and Problem 9.13, PDF p. 445.'},
 {id:'c.prob.9.4.1',sec:'9.4',kind:'theorem',tier:'ext',title:'Kraft inequality and noiseless coding bound',oneLine:'Prefix-free binary code lengths obey Kraft’s inequality, and their expected length is at least the source entropy.',statement:'For binary codeword lengths lᵢ in a prefix-free code, $\\sum_i2^{-l_i}\\le1$. For a source X, expected length $L=\\sum_ip_il_i$ satisfies $L\\ge H(X)$; a code exists with $H(X)\\le L<H(X)+1$.',intuition:'A prefix-free code never makes one complete message label the beginning of another, so you can tell when a message ends. Common messages can get short labels and rare messages longer ones, but the average label length cannot beat the source’s average information.',needs:['c.prob.9.3.1'],traps:['Prefix-free is the decodability condition; arbitrary variable-length strings can be ambiguous.','Entropy is a lower bound on average length, not necessarily an exactly attainable length for each finite source.'],cards:[{q:'State the binary Kraft inequality.',a:'For prefix-free lengths lᵢ, Σᵢ2^(−lᵢ)≤1.',kind:'state'},{q:'What average-length bounds does the noiseless coding theorem give?',a:'H(X)≤L, and some code has L<H(X)+1.',kind:'state'}],proof:{idea:'Use Kraft’s inequality to form a normalized code-induced distribution, then compare source entropy to cross entropy.',why:'The code lengths determine a probability-like allocation of leaves in a binary tree; a source cannot have lower average code length than its entropy.',rungs:[{why:'Set qᵢ proportional to 2^(−lᵢ), normalized by their sum.',m:'q_i=2^{-l_i}/\\sum_j2^{-l_j}'},{why:'Nonnegativity of relative entropy gives H(p)≤−Σpᵢlog₂qᵢ.',m:'H(X)\\le\\sum_ip_il_i+\\log_2\\sum_j2^{-l_j}'},{why:'Apply Kraft’s bound.',m:'H(X)\\le L'}],ends:'Choosing lᵢ=⌈−log₂pᵢ⌉ gives a Kraft-valid Shannon code with H(X)≤L<H(X)+1.'},provenance:'Ross, 10th ed., §9.4, PDF pp. 438–440, Lemma 4.1 and Theorem 4.1.'},
 {id:'c.prob.9.4.2',sec:'9.4',kind:'theorem',tier:'ext',title:'Binary symmetric channel capacity',oneLine:'For a binary symmetric channel, the maximal reliable information rate is one minus binary entropy of its crossover probability.',statement:'For a binary symmetric channel with bit-correct probability p, capacity is $C=1+p\\log_2p+(1-p)\\log_2(1-p)=1-H_b(p)$ bits per channel use (with the symmetric convention p≥1/2). The noisy coding theorem says rates below C permit arbitrarily small error with sufficiently long codes.',intuition:'A binary channel can send at most one bit each time. If a bit flips randomly, some of that capacity is spent figuring out whether the received bit was changed; the remaining reliable rate is 1−H_b(p).',needs:['c.prob.9.3.1'],traps:['The coding theorem is asymptotic; it does not say a short code has zero error.','If p denotes crossover probability instead of correctness probability, the algebraic expression must be reparameterized; Ross uses correctness probability p.'],cards:[{q:'What is the binary symmetric channel capacity in Ross’s correctness-probability convention?',a:'$1-H_b(p)=1+p\\log_2p+(1-p)\\log_2(1-p)$ bits/use.',kind:'state'}],provenance:'Ross, 10th ed., §9.4, PDF pp. 441–443, Theorem 4.2 and Problem 9.18.'}

 {id:'w.prob.9.1.1',course:'prob',sec:'9.1',marks:4,title:'Condition on a Poisson count',prompt:'(Adapted from Ross Problem 9.1.) Customers arrive according to a homogeneous Poisson process. Given that exactly two arrive during the first hour, find the probability (a) both arrived in the first 20 minutes, and (b) at least one arrived in the first 20 minutes.',approach:'Condition on the total count in the hour. The two arrival locations are uniform over the hour; equivalently, split the hour into thirds and use conditional Poisson counts.',solution:'Given N(1)=2, the two arrival times are independent uniform locations in the hour (up to ordering). Each is in the first third with probability 1/3. Thus (a) (1/3)²=1/9. (b) use the complement that both are outside: 1−(2/3)²=5/9.',trap:'Do not use the unconditional Poisson probability of arrivals in the first 20 minutes after conditioning on exactly two arrivals during the full hour.',tests:['c.prob.9.1.1']},

 {id:'w.prob.9.2.1',course:'prob',sec:'9.2',marks:5,title:'Three-step weather chain',prompt:'(Adapted from Ross Problem 9.5.) Rain today has probability 1/2. If it rains today, tomorrow is rainy with probability .7; if it is dry today, tomorrow is rainy with probability .3. Find the probability it rains three days from today.',approach:'Use the two-state transition matrix or update the rain probability one step at a time.',solution:'Let r_n be the rain probability n days after today. The update is r_{n+1}=.7r_n+.3(1−r_n)=.3+.4r_n. Starting r_0=.5 gives r_1=r_2=r_3=.5. Equivalently the initial distribution (.5,.5) is stationary for P=[[.7,.3],[.3,.7]].',trap:'The transition probability conditioned on today’s state is not itself the unconditional probability for a future day.',tests:['c.prob.9.2.1','c.prob.9.2.2']},
 {id:'w.prob.9.2.2',course:'prob',sec:'9.2',marks:5,title:'Stationary mood proportions',prompt:'(Adapted from Ross Problem 9.8.) Buffy’s states are cheerful C, so-so S, gloomy G. The transition rows are C:(.7,.2,.1), S:(.4,.3,.3), G:(.2,.4,.4). Find the stationary probability of being cheerful.',approach:'Solve π=πP together with π_C+π_S+π_G=1.',solution:'The stationary equations give .3π_C=.4π_S+.2π_G and .7π_S=.2π_C+.4π_G. Solving with the normalization yields (π_C,π_S,π_G)=(30/59,16/59,13/59). Thus Buffy is cheerful in the long run with probability 30/59≈.5085.',trap:'The stationary vector is a row vector under the row-stochastic convention; also normalize the solution to sum to one.',tests:['c.prob.9.2.1','c.prob.9.2.3']},
 {id:'w.prob.9.3.1',course:'prob',sec:'9.3',marks:4,title:'Entropy of a fair-dice sum',prompt:'(Adapted from Ross Problem 9.12.) Two fair dice are rolled. Write the entropy of their sum exactly as a finite logarithmic sum.',approach:'The sum s has 6−|7−s| ordered outcomes for s=2,...,12. Substitute those masses in Shannon entropy.',solution:'The probabilities for sums 2 through 12 are (1,2,3,4,5,6,5,4,3,2,1)/36. Therefore H(S)=−Σ_{s=2}^{12}[(6−|7−s|)/36]log₂[(6−|7−s|)/36] bits. Grouping equal terms, H(S)=−2[(1/36)log₂(1/36)+(2/36)log₂(2/36)+(3/36)log₂(3/36)+(4/36)log₂(4/36)+(5/36)log₂(5/36)]−(6/36)log₂(6/36).',trap:'The sum is not uniform on eleven values; central sums have more underlying dice outcomes.',tests:['c.prob.9.3.1']},
 {id:'w.prob.9.3.2',course:'prob',sec:'9.3',marks:4,title:'Maximum entropy on a finite support',prompt:'(Adapted from Ross Problem 9.13.) Prove that a variable with at most n possible values has entropy at most log₂ n, with equality for the uniform law.',approach:'Use nonnegativity of relative entropy between the law p and the uniform distribution u_i=1/n.',solution:'For positive p_i, Gibbs’ inequality gives Σ_i p_i log₂(p_i/u_i)≥0. Since u_i=1/n, the left side is Σp_i log₂p_i+log₂n=−H(X)+log₂n. Hence H(X)≤log₂n. Equality in Gibbs’ inequality holds exactly when p_i=u_i for all i, so the uniform law uniquely maximizes entropy on n points. Zero masses follow by continuity and cannot attain equality across all n slots.',trap:'The equality claim requires all n possible values to have equal positive mass.',tests:['c.prob.9.3.1','c.prob.9.3.3']},

 {id:'w.prob.9.4.2',course:'prob',sec:'9.4',marks:5,title:'Binary symmetric channel capacity',prompt:'(Adapted from Ross Problem 9.18.) A binary symmetric channel transmits a bit correctly with probability p. Explain why the maximizing input has probability 1/2 for each bit and give its capacity.',approach:'The output entropy is maximized by a uniform output; for a symmetric channel, a uniform input produces that output. Subtract the conditional output entropy given the input.',solution:'For input bit X and received bit Y, information rate is H(Y)−H(Y|X). The channel is symmetric, and a uniform input makes Y uniform, maximizing H(Y)=1 bit. Given X, Y is correct with probability p and flipped with probability 1−p, so H(Y|X)=H_b(p)=−p log₂p−(1−p)log₂(1−p). Therefore C=1−H_b(p)=1+p log₂p+(1−p)log₂(1−p) bits per channel use. (This uses Ross’s p=correct-transmission convention.)',trap:'The expression depends on whether p denotes correct transmission or crossover probability; state the convention.',tests:['c.prob.9.3.1','c.prob.9.4.2']}

 {id:'o.prob.9.1.1',course:'prob',sec:'9.1',type:'NAT',marks:1,neg:0,negLabel:'0',time:60,prompt:'A Poisson process runs at 4 events per hour. What is the probability of zero events in 15 minutes? Give 4 decimal places.',answer:{value:0.3679,tol:0.0001,dp:4},solution:'The interval is 1/4 hour, so its Poisson parameter is λt=4/4=1. P(N=0)=e^(−1)=.3679.',tested:'Rate-times-duration parameterization of a Poisson process.',trap:'Using parameter λ=4 directly for the quarter-hour interval.',twist:{q:'What is the expected event count in 45 minutes?',a:'4·(3/4)=3.'},tests:['c.prob.9.1.1'],provenance:'Original drill, based on Ross §9.1, PDF pp. 427–429.'},
 {id:'o.prob.9.1.2',course:'prob',sec:'9.1',type:'MCQ',marks:1,neg:-1/3,negLabel:'−1/3',time:60,prompt:'Interarrival times in a homogeneous Poisson process of rate λ are:',options:[{k:'A',t:'Independent Exp(λ) variables'},{k:'B',t:'Independent Poisson(λ) variables'},{k:'C',t:'Dependent Exp(1/λ) variables'},{k:'D',t:'Uniform on (0,λ)'}],answer:'A',solution:'Independent stationary increments imply exponential waiting times of rate λ; successive interarrival times are independent and identically distributed.',tested:'Poisson-process interarrival law.',trap:'Confusing event counts with waiting times, or confusing exponential rate λ with mean 1/λ.',twist:{q:'What is the mean time to the third arrival?',a:'3/λ.'},tests:['c.prob.9.1.1','c.prob.9.1.2'],provenance:'Ross, 10th ed., §9.1, PDF p. 428.'},
 {id:'o.prob.9.2.1',course:'prob',sec:'9.2',type:'MCQ',marks:1,neg:-1/3,negLabel:'−1/3',time:60,prompt:'A chain has states 0,1 and transition matrix P=[[.8,.2],[.3,.7]]. Starting in state 0, what is the probability of the path 0→1→1?',options:[{k:'A',t:'0.04'},{k:'B',t:'0.14'},{k:'C',t:'0.20'},{k:'D',t:'0.70'}],answer:'B',solution:'The path probability is P₀₁P₁₁=.2·.7=.14.',tested:'Multiply transition probabilities along a specified path.',trap:'Using only the final transition probability .7.',twist:{q:'What is the two-step probability P₀₀^(2)?',a:'P₀₀P₀₀+P₀₁P₁₀=.8(.8)+.2(.3)=.70.'},tests:['c.prob.9.2.1','c.prob.9.2.2'],provenance:'Original Markov-chain drill aligned with Ross §9.2, PDF pp. 430–431.'},
 {id:'o.prob.9.2.2',course:'prob',sec:'9.2',type:'NAT',marks:1,neg:0,negLabel:'0',time:90,prompt:'For a two-state chain with P=[[.8,.2],[.3,.7]], find the stationary probability of state 0.',answer:{value:0.6,tol:0,dp:1},solution:'Let π₀=a. Stationarity requires a=.8a+.3(1−a)=.3+.5a, so a=.6.',tested:'Solve π=πP for a stationary distribution.',trap:'Solving only the eigenvector relation without normalizing probabilities.',twist:{q:'What is the stationary probability of state 1?',a:'0.4.'},tests:['c.prob.9.2.1','c.prob.9.2.3'],provenance:'Original stationary-distribution drill based on Ross §9.2, PDF pp. 432–433.'},
 {id:'o.prob.9.3.1',course:'prob',sec:'9.3',type:'MSQ',marks:1,neg:0,negLabel:'0',time:75,prompt:'Which statements about discrete Shannon entropy are true?',options:[{k:'A',t:'A uniform variable on n points has entropy log₂ n.'},{k:'B',t:'H(X|Y)≤H(X) for average conditional entropy.'},{k:'C',t:'If X and Y are independent, H(X,Y)=H(X)+H(Y).'} ,{k:'D',t:'Entropy is the surprise of the most likely outcome.'}],answer:['A','B','C'],solution:'A follows from equal masses 1/n. B is conditioning reduces average uncertainty. C follows from the chain rule and independence. D is false: entropy is expected surprise over all outcomes.',tested:'Entropy maximum, conditioning, chain rule and interpretation.',trap:'Confusing average surprise with surprise at the modal outcome.',twist:{q:'When does H(X|Y)=H(X)?',a:'Exactly when X and Y are independent.'},tests:['c.prob.9.3.1','c.prob.9.3.2','c.prob.9.3.3'],provenance:'Original conceptual drill based on Ross §9.3, PDF pp. 435–437.'},

var CONCEPTS = CONCEPTS || [];
CONCEPTS.push(
 {id:'c.prob.10.1.1',sec:'10.1',kind:'technique',tier:'ext',title:'Simulation as a Monte Carlo estimate',oneLine:'Repeatedly simulate the experiment and average indicator outcomes to estimate a probability.',statement:'For iid repetitions, let $I_j=1$ when the target event occurs and 0 otherwise. Then $E[I_j]=p$, and $\\hat p_k=k^{-1}\\sum_{j=1}^kI_j$ is unbiased with variance $p(1-p)/k$ and converges almost surely to p.',intuition:'Run the same random experiment many times and count how often the event happens. The fraction is an estimate: more independent runs usually make it wobble less, at a rate proportional to 1/√k.',needs:[],traps:['Simulation estimates a quantity; finite runs do not return the exact probability.','The variance formula assumes independent repetitions under the correct experiment model.'],cards:[{q:'How is an event probability estimated by simulation?',a:'Run independent repetitions and divide the number of event occurrences by the number of runs.',kind:'state'}],proof:{idea:'The estimate is an average of iid Bernoulli indicators.',why:'Linearity gives the target mean, variance of an average gives its precision, and the strong law gives convergence.',rungs:[{why:'Each indicator has mean p and variance p(1−p).',m:'E[I_j]=p,\\quad Var(I_j)=p(1-p)'},{why:'Average the k independent indicators.',m:'E[\\hat p_k]=p,\\quad Var(\\hat p_k)=p(1-p)/k'},{why:'Apply the strong law of large numbers.',m:'\\hat p_k\\to p\\quad\\text{almost surely}'}],ends:'Simulation is useful when the target probability is hard to count analytically but the experiment is easy to reproduce.'},provenance:'Ross, 10th ed., §10.1, PDF pp. 449–450.'},
 {id:'c.prob.10.1.2',sec:'10.1',kind:'technique',tier:'ext',title:'Uniform random permutation by successive swaps',oneLine:'Choose an element uniformly from the remaining positions at each step to generate a uniform permutation.',statement:'Starting with a list of n items, for i=n,n−1,...,2 choose J_i uniformly from {1,...,i} and swap positions i and J_i. Every permutation is produced with probability 1/n!.',intuition:'To shuffle fairly, choose a random item for the last open place, then choose from the items still unplaced for the next place. Each full ordering gets the same chance.',needs:['c.prob.10.1.1'],traps:['At stage i choose only among the first i positions; selecting from all n at every stage is a different procedure and can bias outputs.','Do not confuse the shuffle with repeatedly drawing with replacement.'],cards:[{q:'What is the choice range at the i-th backward shuffle step?',a:'Uniformly choose an index from 1 through i, then swap with position i.',kind:'state'}],proof:{idea:'A target permutation fixes one choice at each stage, with probability 1/i at stage i.',why:'The product of uniform conditional choices gives the same probability to every final ordering.',rungs:[{why:'The last position is assigned one of n items uniformly.',m:'P(\\text{specified item in position }n)=1/n'},{why:'Conditioned on that choice, the remaining n−1 items are uniformly permuted by the same rule.',m:'P(\\text{specified remaining order})=1/(n-1)!'},{why:'Multiply the stage probabilities.',m:'P(\\text{specified permutation})=(1/n)(1/(n-1)!)=1/n!'}],ends:'Uniform permutations support unbiased shuffling and random assignment of subjects to treatment groups.'},provenance:'Ross, 10th ed., §10.1, PDF pp. 450–451, Example 1a.'},
 {id:'c.prob.10.2.1',sec:'10.2',kind:'theorem',tier:'ext',title:'Inverse transform method',oneLine:'Apply the generalized inverse c.d.f. to a uniform random number to obtain the target distribution.',statement:'If U~Uniform(0,1) and $F^{-1}(u)=\\inf\\{x:F(x)\\ge u\\}$, then X=F^{-1}(U) has c.d.f. F. For continuous strictly increasing F, this is the ordinary inverse.',intuition:'A uniform draw picks a random spot between 0 and 1. The inverse CDF stretches that spot onto the target distribution so that each cutoff x is reached with chance F(x).',needs:[],traps:['For a discrete c.d.f. use the generalized inverse or cumulative-threshold rule; the usual algebraic inverse may not exist.','The formula −log U gives unit exponential because 1−U is also uniform.'],cards:[{q:'State the inverse transform recipe.',a:'Generate U uniform on (0,1) and set X=F⁻¹(U), using the generalized inverse.',kind:'state'}],proof:{idea:'Translate the event F⁻¹(U)≤x into a threshold event for U.',why:'Uniform probability on an interval (0,a] equals a.',rungs:[{why:'For a nondecreasing c.d.f., the inverse threshold relation holds.',m:'F^{-1}(U)\\le x\\iff U\\le F(x)'},{why:'Use the uniform distribution.',m:'P(X\\le x)=P(U\\le F(x))'},{why:'Evaluate that probability.',m:'P(X\\le x)=F(x)'}],ends:'Therefore the transformed variable has the target distribution; generalized inverses handle jumps.'},provenance:'Ross, 10th ed., §10.2.1, PDF pp. 452–453, Proposition 2.1 and Example 2a.'},
 {id:'c.prob.10.2.2',sec:'10.2',kind:'technique',tier:'ext',title:'Rejection sampling',oneLine:'Propose from an easy density and accept with a likelihood ratio to obtain a target density.',statement:'Suppose f and g are densities, $f(y)=0$ wherever $g(y)=0$, and $f(y)\\le c g(y)$ wherever g(y)>0. Generate Y~g and U~Uniform(0,1); accept Y when $U\\le f(Y)/(cg(Y))$, otherwise repeat. The accepted value has density f; acceptance probability is 1/c.',intuition:'Draw a candidate from an easy distribution that covers the target. Keep candidates more often where the target is high and throw away extra candidates where the covering curve is too generous.',needs:['c.prob.10.1.1'],traps:['The bound c must dominate f/g everywhere on the support.','If g(y)=0 where f(y)>0, rejection sampling cannot generate the target there.'],cards:[{q:'What is the acceptance test in rejection sampling?',a:'Accept proposal Y~g if U≤f(Y)/(c g(Y)), with f≤cg everywhere.',kind:'state'}],proof:{idea:'Compute the joint probability of proposing y and accepting it, then normalize.',why:'Proposal density g times acceptance probability f/(cg) is proportional to target f.',rungs:[{why:'At value y, multiply proposal density by acceptance chance.',m:'g(y)\\cdot\\frac{f(y)}{cg(y)}=f(y)/c'},{why:'Integrate to find the total acceptance probability.',m:'P(accept)=\\int f(y)/c\\,dy=1/c'},{why:'Condition on acceptance.',m:'f_{Y|accept}(y)=(f(y)/c)/(1/c)=f(y)'}],ends:'The number of proposals through the first acceptance is geometric with mean c.'},provenance:'Ross, 10th ed., §10.2.2, PDF pp. 453–455, Proposition 2.2.'},
 {id:'c.prob.10.3.1',sec:'10.3',kind:'technique',tier:'ext',title:'Discrete inverse transform',oneLine:'Use cumulative probability intervals to map a uniform number to a discrete support value.',statement:'For ordered support x₁,x₂,... with masses pⱼ, generate U~Uniform(0,1) and return xⱼ when $\\sum_{i<j}p_i<U\\le\\sum_{i\\le j}p_i$.',intuition:'Lay the possible outcomes along a line from 0 to 1, giving each one a piece as long as its probability. A uniform draw lands on outcome j exactly as often as that piece’s length.',needs:['c.prob.10.2.1'],traps:['Keep the support and cumulative probabilities in the same order.','Boundary conventions on exact endpoints do not affect a continuous uniform input, but the intervals must cover (0,1).'],cards:[{q:'How do you simulate from a discrete pmf using one uniform number?',a:'Return the first support value whose cumulative mass is at least U.',kind:'state'}],proof:{idea:'Each threshold interval has length equal to the mass assigned to its support point.',why:'A uniform variable lands in an interval with probability equal to that interval’s length.',rungs:[{why:'Define cumulative sums c_j=Σ_{i≤j}p_i.',m:'I_j=(c_{j-1},c_j]'},{why:'The interval length equals the j-th mass.',m:'P(U\\in I_j)=c_j-c_{j-1}=p_j'},{why:'Map every interval to its support value.',m:'P(X=x_j)=p_j'}],ends:'The method works for every discrete law and requires only cumulative masses.'},provenance:'Ross, 10th ed., §10.3, PDF p. 458.'},
 {id:'c.prob.10.3.2',sec:'10.3',kind:'technique',tier:'ext',title:'Specialized discrete generators',oneLine:'Exploit a distribution’s construction to simulate it with simpler random draws.',statement:'A Binomial(n,p) variable is the sum of n independent Bernoulli(p) indicators. A Poisson(λ) variable can be generated by multiplying uniforms until the product first falls below e^(−λ); if N is the number of uniforms used, N−1 is Poisson(λ).',intuition:'Sometimes a familiar story is a faster recipe than a probability table: count how many independent successes occur, or multiply uniform draws until a stopping rule is met.',needs:['c.prob.10.3.1'],traps:['For the Poisson product algorithm, return N−1, not N.','The Bernoulli uniforms for a binomial must be independent.'],cards:[{q:'How can a binomial random variable be simulated?',a:'Sum n independent indicators 1{U_i<p}.',kind:'state'},{q:'In the Poisson product algorithm, what count is returned?',a:'N−1, where N is the first index with product(U_i)<e^(−λ).',kind:'state'}],provenance:'Ross, 10th ed., §10.3, PDF pp. 459–460, Examples 3b–3c.'},
 {id:'c.prob.10.4.1',sec:'10.4',kind:'technique',tier:'ext',title:'Monte Carlo error and antithetic variables',oneLine:'Pair negatively associated simulations to reduce the variance of an average when the target function is monotone.',statement:'For iid $Y_i=g(X_i)$, $\\bar Y_k$ estimates E[Y] with variance Var(Y)/k. For a uniform input U, U and 1−U have the same distribution; the paired estimate $[g(U)+g(1-U)]/2$ has variance $[Var(g(U))+Cov(g(U),g(1-U))]/2$, which is reduced when the covariance is negative.',intuition:'Use the same random input twice in opposite directions. If a high first estimate tends to pair with a low second estimate, their average cancels some of the random ups and downs.',needs:['c.prob.10.1.1','c.prob.10.2.1'],traps:['Antithetic pairing preserves each marginal distribution, but variance reduction requires negative covariance.','Monotonicity of g provides a useful sufficient condition in common inverse-transform settings; it is not true for every arbitrary transformation.'],cards:[{q:'What is the key variance condition for antithetic variables?',a:'The paired outputs should have negative covariance while each retains the target marginal law.',kind:'state'}],provenance:'Ross, 10th ed., §10.4.1, PDF pp. 460–461.'},
 {id:'c.prob.10.4.2',sec:'10.4',kind:'theorem',tier:'ext',title:'Conditioning as variance reduction',oneLine:'Replacing a simulation output by its conditional expectation preserves its mean and cannot increase variance.',statement:'For square-integrable Y and a conditioning variable Z, $E[E(Y|Z)]=E[Y]$ and $Var(E(Y|Z))\\le Var(Y)$.',intuition:'If you know Z, average over the remaining randomness in Y instead of drawing that randomness once. The average has the same overall target but less scatter.',needs:['c.prob.10.1.1'],traps:['You must be able to compute or efficiently approximate E(Y|Z).','The conditional estimate has equal variance only when the residual Y−E(Y|Z) is zero almost surely.'],cards:[{q:'What happens to mean and variance under conditional expectation?',a:'The mean is unchanged; variance cannot increase.',kind:'state'}],proof:{idea:'Use the tower property for means and the law of total variance.',why:'Total variance splits into expected within-Z variance plus variance of the conditional mean.',rungs:[{why:'Apply the tower property.',m:'E[E(Y|Z)]=E[Y]'},{why:'Decompose total variance.',m:'Var(Y)=E[Var(Y|Z)]+Var(E[Y|Z])'},{why:'Use nonnegativity of conditional variance.',m:'Var(E[Y|Z])\\le Var(Y)'}],ends:'This is the Rao–Blackwell variance reduction principle used by the chapter’s conditional estimator.'},provenance:'Ross, 10th ed., §10.4.2, PDF pp. 461–462.'},
 {id:'c.prob.10.4.3',sec:'10.4',kind:'technique',tier:'ext',title:'Control variates',oneLine:'Use a correlated variable with known expectation to correct a noisy Monte Carlo output.',statement:'If E[Z]=μ_Z is known, estimate θ=E[Y] with $W=Y+a(Z-μ_Z)$. The variance-minimizing coefficient is $a^*=-Cov(Y,Z)/Var(Z)$ when Var(Z)>0.',intuition:'Use a second quantity whose average is already known and that tends to rise and fall with your noisy answer. Subtracting its extra fluctuation can make the corrected estimate steadier.',needs:['c.prob.10.1.1'],traps:['Use the centered control Z−E[Z], so the estimator remains unbiased for any a.','The theoretically optimal coefficient depends on covariance and variance; in practice these are estimated from simulation.'],cards:[{q:'What is the optimal control-variate coefficient?',a:'$a^*=-Cov(Y,Z)/Var(Z)$.',kind:'state'}],proof:{idea:'Expand the variance as a quadratic function of a and minimize it.',why:'The correction is unbiased, and the coefficient balances the control’s variance against its covariance with Y.',rungs:[{why:'Expand Var(Y+a(Z−μ_Z)).',m:'Var(W)=Var(Y)+a^2Var(Z)+2aCov(Y,Z)'},{why:'Differentiate with respect to a and set to zero.',m:'2aVar(Z)+2Cov(Y,Z)=0'},{why:'Solve for the minimizing value.',m:'a^*=-Cov(Y,Z)/Var(Z)'}],ends:'At this coefficient, variance is $Var(Y)-Cov(Y,Z)^2/Var(Z)$, which cannot exceed Var(Y).'},provenance:'Ross, 10th ed., §10.4.3, PDF pp. 462–463, equations (4.1)–(4.3).'}
);
