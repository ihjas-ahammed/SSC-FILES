  }

  /* ── what the views call ────────────────────────────────────────────── */

  const tracksOfAll = lines => [].concat.apply([], lines.map(tracksOf)).slice(0, 3);

  function render(lines, fresh) {
    const tracks = tracksOfAll(lines);
    return tracks.length ? el('div', { class: 'rl-group' }, tracks.map(t => track(t, fresh))) : null;
  }

  /* `line` in the data: false, one TeX string, or several */
  const source = (obj, fallback) => (obj && obj.line === false) ? null
    : (obj && typeof obj.line === 'string') ? '$' + obj.line + '$'
    : (obj && Array.isArray(obj.line)) ? obj.line.map(l => '$' + l + '$').join(' ') : fallback;

  /* The statement's own line(s). */
  function statement(c) {
    if (!enabled() || !c) return null;
    return render(planStatement(c), null);
  }

  /* Rays from one-sided facts, for a text that states no richer order. A
     bound other than 0 first: `n \ge K` says more than `\varepsilon > 0`,
     which nearly every step repeats. */
  function rayLines(F, rays) {
    const seen = {};
    /* w \le s "for all s \in S" is about s, not w: the side the text
       quantifies over is the variable, whichever side it is written on */
    rays = rays.map(r => (F.quantified[r.bk] && !F.quantified[r.vk])
      ? { v: F.labels[r.bk], vk: r.bk, bk: r.vk, dir: r.dir === 'r' ? 'l' : 'r', open: r.open } : r);
    return rays.filter(r => { const k = r.vk + '|' + r.bk + '|' + r.dir; if (seen[k]) return false; seen[k] = true; return true; })
      .sort((x, y) => (key(F.labels[x.bk] || '') === '0') - (key(F.labels[y.bk] || '') === '0'))
      .slice(0, MAX_LINES)
      .map(r => ({
        pts: [r.bk], gaps: [], labels: [F.labels[r.bk]],
        ranges: [{ v: r.v, vk: r.vk, lo: r.dir === 'r' ? r.bk : null, hi: r.dir === 'l' ? r.bk : null,
          loOpen: r.open, hiOpen: r.open }]
      }));
  }

  const rungText = r => source(r, [r.m, r.math].filter(Boolean).map(t => /\$/.test(t) ? t : '$' + t + '$').join(' '));

  /* The plan, with no DOM: one entry per rung ({ lines, fresh } or null),
     each solved against the statement plus every step up to and including
     it. A step whose facts clash with an earlier one (the same letter
     reused for something else) falls back to its own facts alone, so one
     clash cannot blank the rest of the proof. */
  /* Plan a sequence of texts (proof steps, or the parts of a statement):
     each is solved against ctx plus every text before it, falling back to
     its own facts alone, then to rays. `shown` collects what has been drawn
     so far, and a point drawn for the first time is `fresh`. */
  function planSeq(ctx, texts, shown) {
    return texts.map(function (text) {
      if (!text) return null;
      const before = { m: ctx.mentioned.length, r: ctx.ranges.length, y: ctx.rays.length };
      read(ctx, text);
      let lines = solve(ctx, ctx.mentioned.slice(before.m), ctx.ranges.slice(before.r));
      if (!tracksOfAll(lines).length) { const own = read(Facts(), text); lines = solve(own, own.mentioned, own.ranges); }
      if (!tracksOfAll(lines).length) lines = rayLines(ctx, ctx.rays.slice(before.y));
      if (!tracksOfAll(lines).length) return null;
      const fresh = {};
      const keys = [].concat.apply([], tracksOfAll(lines).map(t => t.pts.map(p => p.k)));
      keys.forEach(k => { if (!shown[k]) fresh[k] = true; });
      keys.forEach(k => { shown[k] = true; });
      return { lines: lines, fresh: fresh };
    });
  }

  /* A statement in parts, as the reader sees it: each <p>, each list item,
     and any loose text between them. A line goes right under its part. */
  function htmlParts(html) {
    const out = [], re = /<(p|li|div|blockquote)\b[^>]*>([\s\S]*?)<\/\1>/gi;
    const loose = t => t.replace(/<\/?(ul|ol)\b[^>]*>/gi, '');
    let last = 0, m;
    while ((m = re.exec(html))) {
      const pre = loose(html.slice(last, m.index));
      if (pre.trim()) out.push(pre);
      out.push(m[2]);
      last = re.lastIndex;
    }
    const tail = loose(html.slice(last));
    if (tail.trim()) out.push(tail);
    return out;
  }

  /* one entry per part of the statement: { lines, fresh } or null */
  function planStatementParts(c, parts) {
    if (!c || c.line === false) return (parts || []).map(() => null);
    if (c.line !== undefined) return [planSeq(Facts(), [source(c, '')], {})[0]];   /* an override is one block */
    return planSeq(Facts(), parts || htmlParts(String(c.statement || '')), {});
  }

  /* every line the statement draws, flat (the report and the proof seed use it) */
  function planStatement(c) {
    return [].concat.apply([], planStatementParts(c).filter(Boolean).map(p => p.lines));
  }

  function planProof(c) {
    const rungs = (c && c.proof && c.proof.rungs) || [];
    if (c.line === false || !rungs.length) return rungs.map(() => null);
    const ctx = Facts();
    const stText = source(c, c.statement);
    if (stText) read(ctx, stText);
    const shown = {};
    tracksOfAll(planStatement(c)).forEach(t => t.pts.forEach(p => { shown[p.k] = true; }));
    return planSeq(ctx, rungs.map(rungText), shown);
  }

  /* Draw a statement's lines INTO its rendered prose, each one directly under
     the block it comes from. Blocks are read before MathJax runs, so their
     text is still the authored TeX. Returns the prose node. */
  function statementInto(node, c) {
    if (!enabled() || !c || !node) return node;
    if (c.line !== undefined) {                       /* override: after the whole statement */
      const g = c.line === false ? null : render(planStatement(c), null);
      if (g) node.appendChild(g);
      return node;
    }
    const blocks = [];
    let run = [];
    const flush = () => {
      const text = run.map(n => n.textContent).join('');
      if (run.length && text.trim()) blocks.push({ after: run[run.length - 1], text: text });
      run = [];
    };
    Array.prototype.slice.call(node.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && /^(P|DIV|BLOCKQUOTE|TABLE|H[1-6])$/.test(n.tagName)) { flush(); blocks.push({ after: n, text: n.textContent }); }
      else if (n.nodeType === 1 && /^(UL|OL)$/.test(n.tagName)) {
        flush();
        Array.prototype.slice.call(n.children).forEach(li => blocks.push({ into: li, text: li.textContent }));
      } else run.push(n);
    });
    flush();
    planStatementParts(c, blocks.map(b => b.text)).forEach(function (p, i) {
      const g = p && render(p.lines, null);
      if (!g) return;
      const b = blocks[i];
      if (b.into) b.into.appendChild(g);
      else b.after.parentNode.insertBefore(g, b.after.nextSibling);
    });
    return node;
  }

  /* One node (or null) per rung. */
  function proof(c) {
    const rungs = (c && c.proof && c.proof.rungs) || [];
    if (!enabled()) return rungs.map(() => null);
    return planProof(c).map(p => p ? render(p.lines, p.fresh) : null);
  }

  return { statement: statement, proof: proof, enabled: enabled,
    planStatement: planStatement, planProof: planProof, statementInto: statementInto, tracksOf: tracksOfAll, describe: describe };
})();


/* ── flow-library/app/src/comp.tree.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The syllabus tree — and, since Level 4, the reader as well.

   Course → module → section → concept, each row carrying a tick you can press
   and a ring showing how much of what is underneath is done. Opening a concept
   no longer leaves for a page of its own: the note unfolds in place, and its
   proof, its exercises and its questions unfold inside that. One scroll, from
   the course title to the last exercise.

   EXACTLY ONE THING IS OPEN AT EACH DEPTH. Opening a section closes the
   section that was open; opening a note closes the note that was open. The
   tree is a place you are, not a pile you have accumulated — which is the only
   way a three-deep tree of two hundred concepts stays navigable on a phone.
   That single open path is stored, so closing the app and coming back lands
   you where you left off (see `scrollToOpen`).

   Colour is the whole vocabulary. A row is RED once everything under it has
   been read, AMBER once every proof under it has been worked, GREEN once every
   section exercise under it is done. A course can go one further: VIOLET, level
   4, once its JAM past papers are worked through too.
   ══════════════════════════════════════════════════════════════════════════ */

const Tree = (function () {

  const el = DOM.el;
  const KEY = 'open4';
  const LEGACY = 'open';
  const DEPTH = ['course', 'mod', 'sec', 'concept'];

  /* ── the one open path ────────────────────────────────────────────────── */
  function readPath() {
    const p = Store.pref(KEY, null);
    if (p && typeof p === 'object') return p;

    /* Levels 1–3 stored a map of every open id. Keep the first of each kind
       so an upgrade lands somewhere familiar rather than fully collapsed. */
    const old = Store.pref(LEGACY, null);
    if (!old || typeof old !== 'object') return null;
    const out = {};
    Object.keys(old).forEach(function (k) {
      if (k.indexOf('course-') === 0 && !out.course) out.course = k.slice(7);
      else if (k.indexOf('mod-') === 0 && !out.mod) out.mod = k.slice(4);
      else if (k.indexOf('sec-') === 0 && !out.sec) out.sec = k.slice(4);
    });
    Store.setPref(KEY, out);
    return out;
  }

  let openPath = null;
  const path = () => (openPath || (openPath = readPath() || {}));
  function savePath(p, seeding) {
    openPath = p;
    Store.setPref(KEY, p);
    if (!seeding) remember(p);
  }

  /* ── the place you last read ─────────────────────────────────────────────
     The open path forgets when you close a row. `last4` never does: it is
     written whenever a section or a note opens and only ever replaced, so
     Today can always offer the way back. Closing a note keeps the section;
     reopening the same section keeps the note you were on inside it. */
  const LAST = 'last4';
  function remember(p) {
    if (!p || !p.sec) return;
    const prev = Store.pref(LAST, null) || {};
    const concept = p.concept || (prev.sec === p.sec ? prev.concept : null) || null;
    if (prev.sec === p.sec && (prev.concept || null) === concept) return;
    Store.setPref(LAST, { course: p.course || null, mod: p.mod || null, sec: p.sec,
      concept: concept, at: Date.now() });
  }

  /* what Today shows: only a place that still exists in the loaded pool */
  function last() {
    const l = Store.pref(LAST, null);
    if (!l || !l.sec || !Pool.courseOfSec(l.sec)) return null;
    const c = l.concept && Pool.concept(l.concept) ? Pool.concept(l.concept) : null;
    return { sec: l.sec, concept: c, at: l.at || 0,
      course: Pool.courseOfSec(l.sec), module: Pool.moduleOfSec(l.sec) };
  }

  /* open the path down to a section — the same jump `revealPath` makes for a note */
  function revealSection(sec) {
    const course = Pool.courseOfSec(sec), mod = Pool.moduleOfSec(sec);
    if (!course) return false;
    savePath({ course: course.id, mod: mod ? mod.id : null, sec: sec, concept: null, pyq: null });
    return true;
  }

  /* Setting a slot clears everything deeper than it: opening a different

  function setSlot(kind, id, on) {
    const p = Object.assign({}, path());
    const i = DEPTH.indexOf(kind);

    if (kind === 'pyq') { if (on) { p.mod = null; p.sec = null; p.concept = null; } }
    else {

    }

  /* ── in-place mark repainting ────────────────────────────────────────────

     tear the note out from under the person using it. So every row registers
     how to repaint its own tick and ring, and a change just runs the list. */
  let marks = [];
  const registerMark = fn => { marks.push(fn); fn(); };
  function refresh() {
    Progress.dropCache();
    marks.forEach(function (fn) { try { fn(); } catch (e) { /* never break a repaint */ } });
  }

  /* ── pieces ───────────────────────────────────────────────────────────── */

  function tickButton(getState, onPress) {

      [el('i', { 'aria-hidden': 'true' })]);
    registerMark(function () {
      const s = getState();
      btn.setAttribute('aria-checked', s.state);
      btn.setAttribute('data-lv', String(s.lv || 0));

        s.state === 'mixed' ? 'remove' : s.lv >= 4 ? 'military_tech' : s.lv >= 3 ? 'workspace_premium' : 'check',
        'xs'));
    });

    return btn;
  }

  const staticTick = glyph => el('span', { class: 'tick', 'aria-hidden': 'true' },
    [el('i', { style: { borderStyle: 'dashed' } }, [DOM.mi(glyph, 'xs')])]);

  /* A ring that repaints itself in place. */
  function ring(getCount, label) {
    const host = el('span', { class: 'ringhost' });
    registerMark(function () {
      DOM.clear(host);
      host.appendChild(UI.levelRing(getCount(), label));
    });
    return host;
  }

  let ctxOpenAccs = new Set();
  let isInitialPaint = true;

  function accordion(nid, open, kids, ctx) {
    const inner = el('div', { class: 'acc-in' }, [el('div', { class: 'acc-pad' }, kids)]);
    const acc = el('div', { class: 'acc', id: 'acc-' + nid }, [inner]);
    if (open) {
      const wasOpen = ctx && ctx.wasOpen ? ctx.wasOpen('acc-' + nid) : ctxOpenAccs.has('acc-' + nid);
      const isInit = ctx && typeof ctx.isInitial === 'boolean' ? ctx.isInitial : isInitialPaint;

  }

  function toggler(nid, open, kids, onToggle) {
    const btn = el('button', {
      class: 'tlabel', type: 'button',
      'aria-expanded': String(open), 'aria-controls': 'acc-' + nid

    btn.addEventListener('click', function () { onToggle(!open); });

  }

  /* ── the cascade offer ────────────────────────────────────────────────── */
  function offerCascade(c) {
    const pending = Progress.pendingPrereqs(c.id);
    if (!pending.length) return;
    const names = pending.slice(0, 5).map(x => '· ' + x.title).join('\n') +
      (pending.length > 5 ? '\n· and ' + (pending.length - 5) + ' more' : '');
    const ask = pending.length + ' ' + DOM.plural(pending.length, 'prerequisite') +
      ' of "' + c.title + '" ' + DOM.plural(pending.length, 'has', 'have') +
      ' not been read yet:\n\n' + names + '\n\nMark them as read too?';
    if (!window.confirm(ask)) return;
    const n = Progress.raisePrereqs(c.id);
    DOM.announce('Marked ' + n + ' ' + DOM.plural(n, 'prerequisite') + ' as read.');
  }

  /* ── a concept: one row, and the whole note under it ─────────────────── */
  function conceptRow(c, ctx) {
    const nid = 'c-' + c.id;
    const open = isOpen('concept', c.id);
    const isExt = Pool.isExt(c);
    const extNote = isExt ? ' (outside syllabus)' : '';

    /* The row exists before anything that repaints it: a mark closure runs
       the moment it is registered, and a half-built row is a crash. */
    const row = el('div', { class: 'crow' });

    const tick = tickButton(function () {
      const lv = Progress.level(c.id);

        label: lv === 0 ? 'Mark "' + c.title + '" as read' + extNote

    registerMark(function () {
      const lv = Progress.level(c.id);
      DOM.clear(tag);
      if (lv === 1 && Progress.hasProof(c.id)) {
        tag.appendChild(el('span', { class: 'lvtag', 'data-lv': '1', text: 'proof owed' }));
      } else if (lv >= 2) {
        tag.appendChild(el('span', { class: 'lvtag', 'data-lv': String(lv), text: 'L' + lv }));

  /* ── a section ────────────────────────────────────────────────────────── */

      el('div', { class: 'trow' }, [
        tickButton(function () {
          const cnt = Progress.count(ids);
          return { state: Progress.tickState(ids), lv: cnt.min,
            label: 'Advance all of §' + s.sec + (isExt ? ' (outside syllabus)' : '') };
        }, function () {
          const to = Progress.advanceMany(ids);
          DOM.announce(to ? 'Section at level ' + to + '.' : 'Section cleared.');
          refresh();
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: '§' + s.sec + '  ' + s.title }),
              isExt ? el('span', { class: 'badge warn', text: 'outside syllabus' }) : null
            ]),
            el('span', { text: s.concepts.length + ' ' + DOM.plural(s.concepts.length, 'concept') +
              (tasks.total ? ' · ' + tasks.done + '/' + tasks.total + ' exercises' : '') +
              (isExt ? ' · outside syllabus (not in exam %)' : '') })
          ]),
          ring(() => Progress.count(ids), '§' + s.sec),

  /* ── a module ─────────────────────────────────────────────────────────── */
  function moduleNode(course, mod, ctx) {
    if (mod.pending) return pendingNode(mod, ctx);

    const secs = Pool.sections(course.id).filter(s => (mod.secs || []).indexOf(s.sec) >= 0);
    const isExtMod = !!mod.ext;
    const countSecs = isExtMod ? secs : secs.filter(s => !Pool.isExtSec(s.sec));
    const ids = countSecs.reduce((acc, s) => acc.concat(s.concepts.map(c => c.id)), []);
    const nid = 'mod-' + mod.id;
    const open = isOpen('mod', mod.id);

    const extCount = secs.filter(s => Pool.isExtSec(s.sec)).length;
    const subtitleText = isExtMod
      ? (secs.length + ' ' + DOM.plural(secs.length, 'section') + ' · outside syllabus')
      : ((mod.marks ? mod.marks + ' marks · ' : '') +
         countSecs.length + ' syllabus ' + DOM.plural(countSecs.length, 'section') +
         (extCount ? ' (+' + extCount + ' outside syllabus)' : ''));

    const modPrefix = isExtMod || mod.n === '+' || mod.n === 'Ext'
      ? 'Extension'
      : (mod.n && mod.n.indexOf('E') === 0 ? 'Topic ' + mod.n : 'Module ' + mod.n);
    const modHeading = modPrefix + ' · ' + mod.title;

    const acc = accordion(nid, open, open
      ? [el('div', {}, secs.map(s => sectionNode(s, ctx)))] : [], ctx);

    const node = el('div', { class: 'tnode' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const cnt = Progress.count(ids);
          return { state: Progress.tickState(ids), lv: cnt.min,
            label: 'Advance every syllabus note of ' + (isExtMod ? mod.title : 'module ' + mod.n) };
        }, function () {
          const to = Progress.advanceMany(ids);
          DOM.announce(to ? (isExtMod ? mod.title : 'Module ' + mod.n) + ' at level ' + to + '.' : 'Cleared.');
          refresh();
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: modHeading }),
              isExtMod ? el('span', { class: 'badge warn', text: 'outside syllabus' }) : null
            ]),
            el('span', { text: subtitleText })
          ]),
          ring(() => Progress.count(ids), isExtMod ? mod.title : 'Module ' + mod.n),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('mod', mod.id, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  function pendingNode(mod, ctx) {
    const nid = 'pend-' + mod.id;
    const open = isOpen('mod', mod.id);
    const builds = (mod.builds || []).map(function (id) {
      const c = Pool.concept(id);
      return c ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
        : el('span', { class: 'chip ghost', text: id });
    });
    const acc = accordion(nid, open, [el('div', { style: { padding: '0 2px' } }, [
      mod.why ? el('p', { class: 'small muted', style: { margin: '2px 0 8px' }, text: mod.why }) : null,
      builds.length ? el('div', {}, [
        el('div', { class: 'kicker', style: { marginBottom: '6px' }, text: 'Will build on' }),
        el('div', { class: 'row' }, builds)
      ]) : null
    ])], ctx);
    const modHeading = (mod.n && mod.n.indexOf('E') === 0 ? 'Topic ' + mod.n : mod.n) + ' · ' + mod.title;
    return el('div', { class: 'tnode sub sec' }, [
      el('div', { class: 'trow' }, [
        staticTick('hourglass_empty'),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: modHeading }),
              el('span', { class: 'badge warn', text: 'pending' })
            ]),
            el('span', { text: 'not delivered yet' })
          ]),
          DOM.icon('chev', 20, 'chev')
        ], function (on) { setSlot('mod', mod.id, on); ctx.repaint({ scroll: false }); })
      ]),
      acc
    ]);
  }

  /* ── level 4: the course's past papers ───────────────────────────────────
     A JAM question is set on the subject, not on a Bartle section, so it
     cannot hang off a note. It hangs off the COURSE — a sibling of the
     modules, and the last thing between a green course and a finished one. */
  function pyqNode(course, ctx) {
    const qs = Pool.pyq(course.id);
    const nid = 'pyq-' + course.id;
    const open = isOpen('pyq', course.id);

    if (!qs.length) {
      return el('div', { class: 'tnode sub sec' }, [
        el('div', { class: 'trow' }, [
          staticTick('hourglass_empty'),
          el('span', { class: 'tlabel', style: { cursor: 'default' } }, [
            el('span', { class: 'tt' }, [
              el('b', { text: PROJECT.pyqLabel }),
              el('span', { text: 'not delivered yet · level 4 of ' + course.title })
            ]),
            el('span', { class: 'badge warn', text: 'pending' })
          ])
        ])
      ]);
    }

    /* grouped by paper, newest first — Pool already sorted them that way */
    function years() {
      const seen = [], by = {};
      qs.forEach(function (q) {
        const k = (q.year || '—') + (q.paper ? ' ' + q.paper : '');
        if (!by[k]) { by[k] = []; seen.push(k); }
        by[k].push(q);
      });
      return seen.map(k => ({ label: k, list: by[k] }));
    }

    function questionCard(q) {
      const mark = el('span', { class: 'ix' });
      function paintMark() {
        const on = Progress.pyqDone(q);
        mark.className = 'ix' + (on ? ' ok' : '');
        DOM.clear(mark);
        mark.appendChild(DOM.mi(on ? 'check' : 'radio_button_unchecked', 'xs'));
      }
      paintMark();

      return NoteBody.expander({
        cls: 'exp-q',
        mark: mark,
        title: (q.exam || 'PYQ') + ' ' + (q.year || '') + (q.qno ? ' · Q' + q.qno : ''),
        sub: (q.marks ? q.marks + ' ' + DOM.plural(q.marks, 'mark') : '')
          + (q.title ? ' · ' + q.title : ''),
        build: function () {
          /* an objective past question is answered like any other; a written
             one is worked on paper and claimed */
          if (q.options || q.type === 'MCQ' || q.type === 'MSQ' || q.type === 'NAT') {
            return [
              QuestionCard.build(q, { inNote: true }),
              NoteBody.taskRow('p:' + q.id, { noun: 'question', onTick: function () {
                paintMark(); refresh();
              } })
            ];
          }

          const answerHost = el('div', { class: 'prose tight', style: { marginTop: '8px' }, hidden: true });
          let built = false;
          const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
            [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: 'Show answer' })]);
          showBtn.addEventListener('click', function () {
            const on = answerHost.hidden;
            if (on && !built) {
              built = true;
              DOM.add(answerHost, [
                q.approach ? el('div', { html: q.approach }) : null,
                q.solution ? el('div', { html: q.solution }) : null,
                q.trap ? el('p', {}, [el('b', { text: 'Trap: ' }), el('span', { html: q.trap })]) : null
              ]);
              UI.math(answerHost);
            }
            answerHost.hidden = !on;
            showBtn.setAttribute('aria-expanded', String(on));
            showBtn.querySelector('.lb').textContent = on ? 'Hide answer' : 'Show answer';
          });

          const pad = el('div', { class: 'scratch' });
          WriteBox.mount(pad, {
            draftKey: 'pyq:' + q.id,
            concept: Pool.concept((q.tests || [])[0]) || { id: q.id, title: q.title || q.id },
            label: 'Scratchpad · work it before you look',
            placeholder: 'What is this question really asking…'
          });

          return [
            el('div', { class: 'prose tight', html: q.prompt }),
            el('div', { class: 'row', style: { gap: '8px', marginTop: '10px' } }, [showBtn]),
            pad, answerHost,
            NoteBody.taskRow('p:' + q.id, { noun: 'question', onTick: function () {
              paintMark(); refresh();
            } })
          ];
        }
      });
    }

    const acc = accordion(nid, open, open ? [el('div', { class: 'stack', style: { gap: '10px' } },
      years().map(function (grp) {
        return el('div', { class: 'stack', style: { gap: '6px' } }, [
          el('div', { class: 'kicker', text: grp.label }),
          el('div', { class: 'stack', style: { gap: '6px' } }, grp.list.map(questionCard))
        ]);
      }))] : [], ctx);

    const count = el('span', { class: 'count' });
    registerMark(function () {
      const st = Progress.pyqState(course.id);
      count.textContent = st.done + ' / ' + st.total;
    });

    const node = el('div', { class: 'tnode sub sec pyq' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const st = Progress.pyqState(course.id);
          return {
            state: st.ready ? 'true' : (st.done ? 'mixed' : 'false'),
            lv: st.ready ? 4 : 0,
            label: st.ready ? 'Every past paper of ' + course.title + ' is complete'
              : 'Mark every past paper of ' + course.title + ' complete'
          };
        }, function () {
          const st = Progress.pyqState(course.id);
          const want = !st.ready;
          st.list.forEach(q => Store.setProofDone('p:' + q.id, want));
          Progress.dropCache();
          DOM.announce(want ? 'Every past paper marked complete.' : 'Past papers cleared.');
          ctx.repaint({});
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', { text: PROJECT.pyqLabel }),
            el('span', { text: qs.length + ' ' + DOM.plural(qs.length, 'question')
              + ' · finishing them is level 4' })
          ]),
          count,
          DOM.icon('chev', 20, 'chev')
        ], function (on) { setSlot('pyq', course.id, on); ctx.repaint({ scroll: false }); })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── a whole course ──────────────────────────────────────────────────── */
  function courseNode(course, ctx) {
    const ids = Pool.ids.concepts(course.id);
    const nid = 'course-' + course.id;
    const open = isOpen('course', course.id);

    const acc = accordion(nid, open, open ? [el('div', { class: 'rail' },
      (course.modules || []).map(mod => moduleNode(course, mod, ctx))
        .concat(course.pending ? [] : [pyqNode(course, ctx)]))] : [], ctx);

    const node = el('div', { class: 'tnode' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        course.pending
          ? staticTick('hourglass_empty')
          : tickButton(function () {
              const lv = Progress.courseLevel(course.id);
              return { state: Progress.tickState(ids), lv: lv,
                label: 'Advance every note of ' + course.title };
            }, function () {
              const to = Progress.advanceMany(ids);
              DOM.announce(to ? course.title + ' at level ' + to + '.' : 'Course cleared.');
              refresh();
            }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: course.title }),
              course.pending ? el('span', { class: 'badge warn', text: 'pending' }) : null
            ]),
            el('span', { text: course.pending ? course.blurb : course.code + ' · ' + course.blurb })
          ]),
          course.pending ? null : ring(() => Progress.count(ids), course.title),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('course', course.id, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── mounting ─────────────────────────────────────────────────────────── */
  function painter(host, build) {
    let isInitial = true;

    function repaint(opts) {
      const o = opts || {};
      const keepY = window.scrollY;

      const currentlyOpenAccs = new Set();
      host.querySelectorAll('.acc.open').forEach(function (node) {
        if (node.id) currentlyOpenAccs.add(node.id);
      });
      ctxOpenAccs = currentlyOpenAccs;

      const prevH = host.offsetHeight;
      if (prevH > 0) host.style.minHeight = prevH + 'px';

      marks = [];
      const ctx = {
        repaint: repaint,
        target: null,
        isInitial: isInitial,
        wasOpen: function (accId) { return currentlyOpenAccs.has(accId); }
      };

      DOM.clear(host);
      host.appendChild(el('div', { class: 'tree' }, build(ctx)));

      window.requestAnimationFrame(function () {
        host.style.minHeight = '';
      });

      const openCid = path().concept;
      document.body.classList.toggle('note-open', !!openCid);
      const openC = openCid ? Pool.concept(openCid) : null;
      if (typeof Shell !== 'undefined' && Shell.setSubtitle) {
        Shell.setSubtitle(openC ? openC.title : '');
      }
      lastTarget = ctx.target;

      if (o.scroll && o.isNote && ctx.target) {
        scrollToNote(ctx.target);
      } else if (o.scroll && ctx.target) {
        scrollTo(ctx.target);
      } else if (o.restore !== false) {
        window.scrollTo(0, keepY);
      }

      isInitial = false;
      isInitialPaint = false;
    }

    /* The first paint leaves the scroll alone — the Study view decides where
       to land, via scrollToOpen(). */
    repaint({ restore: false });
    return repaint;
  }

  let lastTarget = null;

  function scrollToNote(node) {
    if (!node) return;
    const scrollTarget = function () {
      const head = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--head-h'), 10) || 54;
      const rect = node.getBoundingClientRect();
      const targetY = Math.max(0, rect.top + window.scrollY - head - 8);
      window.scrollTo({ top: targetY, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    };
    window.requestAnimationFrame(scrollTarget);
    setTimeout(scrollTarget, 100);
    setTimeout(scrollTarget, 240);
  }

  function scrollTo(node) {
    if (!node) return;
    window.requestAnimationFrame(function () {
      const head = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--head-h'), 10) || 0;
      const y = node.getBoundingClientRect().top + window.scrollY - head - 12;
      window.scrollTo({ top: Math.max(0, y), behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });
  }

  /* Called by the Study view once it is on screen: return to whatever was
     last left open. */
  function scrollToOpen() {
    if (lastTarget) {
      if (path().concept) scrollToNote(lastTarget);
      else scrollTo(lastTarget);
    }
  }

  function mountAll(host, courses) {
    return painter(host, ctx => courses.map(course => courseNode(course, ctx)));
  }

  function mount(host, course) {
    return painter(host, ctx => (course.modules || []).map(mod => moduleNode(course, mod, ctx))
      .concat(course.pending ? [] : [pyqNode(course, ctx)]));
  }

  /* First visit: open the first course, module and section that still have
     work left, so the tree opens somewhere useful rather than flat. */
  function seedOpen(course) {
    if (Store.pref(KEY, null) || Store.pref(LEGACY, null)) { path(); return; }
    const p = {};
    if (course) {
      p.course = course.id;
      const mod = (course.modules || []).filter(x => !x.pending)[0];
      if (mod) {
        p.mod = mod.id;
        const sec = Pool.sections(course.id)
          .filter(s => (mod.secs || []).indexOf(s.sec) >= 0)
          .filter(s => s.concepts.some(c => Progress.level(c.id) < 1))[0];
        if (sec) p.sec = sec.sec;
      }
    }
    savePath(p, true);
  }

  /* Open the path down to one concept — what `#/note/<id>` now means. */
  function revealPath(conceptId, opts) {
    const c = Pool.concept(conceptId);
    if (!c) return false;
    const course = Pool.courseOfSec(c.sec), mod = Pool.moduleOfSec(c.sec);
    savePath({
      course: course ? course.id : null,
      mod: mod ? mod.id : null,
      sec: c.sec || null,
      concept: c.id,
      pyq: null
    });
    void opts;
    return true;
  }

  return { mount, mountAll, seedOpen, revealPath, revealSection, last, refresh, scrollToOpen, path };
})();


/* ── flow-library/app/src/comp.pace.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Pace — sections completed per day, and where that pace is heading.

   A SECTION IS COMPLETE when every note in it has been read (level 1, the red
   tick). It became complete on the day its LAST note was ticked. That is
   derived from the tick timestamps the store already keeps, so the graph needs
   no log of its own, works on progress made before it existed, and merges
   across devices for free. Un-ticking a note takes its section back out.

   THE PREDICTION is ordinary least squares on the cumulative curve. With day
   index t and cumulative sections C over the trailing window, the line
   C = a + b·t minimises Σ(C − a − b·t)², which is the normal-equation system

        [ n    Σt  ] [a]   [ ΣC  ]
        [ Σt   Σt² ] [b] = [ ΣtC ]

   solved here by Gaussian elimination with partial pivoting. `b` is sections
   per day; the finish day is where the line reaches the syllabus total.
   R² says how straight the recent past actually was, so a jumpy fortnight
   reads as a weak forecast instead of a confident one.
   ══════════════════════════════════════════════════════════════════════════ */

const Pace = (function () {

  const el = DOM.el, S = DOM.svg;
  const DAY = 86400e3;
  const LABEL = { 1: 'Reading', 2: 'Proofs', 3: 'Textbook questions', 4: 'PYQ', 5: 'Recall and fix' };

  /* ── dates, in the learner's own day ─────────────────────────────────── */
  const dayIndex = ms => {
    const d = new Date(ms);
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / DAY);
  };
  const dayDate = i => new Date(i * DAY + DAY / 2);   /* UTC noon: no DST edge */
  const fmtDay = i => dayDate(i).toLocaleDateString(undefined, { day: 'numeric', month: 'short', timeZone: 'UTC' });

  /* ── linear algebra ──────────────────────────────────────────────────── */
  /* solve A x = b for a small dense system; null when singular */
  function solve(A, b) {
    const n = b.length;
    const M = A.map((row, i) => row.slice().concat([b[i]]));
    for (let c = 0; c < n; c += 1) {
      let piv = c;
      for (let r = c + 1; r < n; r += 1) if (Math.abs(M[r][c]) > Math.abs(M[piv][c])) piv = r;
      if (Math.abs(M[piv][c]) < 1e-12) return null;
      const t = M[c]; M[c] = M[piv]; M[piv] = t;
      for (let r = c + 1; r < n; r += 1) {
        const f = M[r][c] / M[c][c];
        for (let k = c; k <= n; k += 1) M[r][k] -= f * M[c][k];
      }
    }
    const x = new Array(n);
    for (let r = n - 1; r >= 0; r -= 1) {
      let s = M[r][n];
      for (let k = r + 1; k < n; k += 1) s -= M[r][k] * x[k];
      x[r] = s / M[r][r];
    }
    return x;
  }

  /* least squares C ≈ a + b·t through the points; returns {a, b, r2} */
  function fitLine(ts, cs) {
    const n = ts.length;
    if (n < 2) return null;
    let st = 0, stt = 0, sc = 0, stc = 0;
    for (let i = 0; i < n; i += 1) {
      st += ts[i]; stt += ts[i] * ts[i]; sc += cs[i]; stc += ts[i] * cs[i];
    }
    const beta = solve([[n, st], [st, stt]], [sc, stc]);
    if (!beta) return null;
    const mean = sc / n;
    let ssRes = 0, ssTot = 0;
    for (let i = 0; i < n; i += 1) {
      const e = cs[i] - (beta[0] + beta[1] * ts[i]);
      ssRes += e * e;
      ssTot += (cs[i] - mean) * (cs[i] - mean);
    }
    return { a: beta[0], b: beta[1], r2: ssTot > 1e-12 ? Math.max(0, 1 - ssRes / ssTot) : 0 };
  }

  /* ── the data: when did each section become complete ─────────────────── */
  function completions(stage) {
    stage = stage || 1;
    const out = [];
    Pool.sections().forEach(function (s) {
      const ids = s.concepts.filter(c => !Pool.isExt(c)).map(c => c.id);
      if (!ids.length) return;
      const at = Progress.stageAt(s.sec, stage);
      if (at > 0) out.push({ sec: s.sec, at: at });
    });
    return out.sort((x, y) => x.at - y.at);
  }

  function totalSections(stage) {
    return Pool.sections().filter(s => !Pool.isExtSec(s.sec)
      && (s.concepts.some(c => !Pool.isExt(c)) || (s.module && s.module.pending))
      && (stage !== 4 || Progress.pyqForSec(s.sec).length > 0)).length;
  }

  /* Everything the chart and the caption need, for the last `span` days. */
  function model(span, stage) {
    stage = stage || 1;
    const done = completions(stage);
    const total = totalSections(stage);
    const today = dayIndex(Date.now());
    const first = done.length ? dayIndex(done[0].at) : today;
    const start = Math.max(today - span + 1, Math.min(first, today));
    const days = [];
    for (let d = start; d <= today; d += 1) days.push({ d: d, n: 0, cum: 0 });
    const before = done.filter(x => dayIndex(x.at) < start).length;
    done.forEach(function (x) {
      const i = dayIndex(x.at) - start;
      if (i >= 0 && i < days.length) days[i].n += 1;
    });
    let run = before;
    days.forEach(function (x) { run += x.n; x.cum = run; });

    /* fit the trailing fortnight (or what exists of it) */
    const win = days.slice(-14);
    const fit = win.length >= 3 ? fitLine(win.map(x => x.d - today), win.map(x => x.cum)) : null;
    const left = total - run;
    let eta = null;
    if (fit && fit.b > 0.02 && left > 0) eta = today + Math.ceil((total - fit.a) / fit.b);
    if (eta != null && eta < today) eta = today;

    return { days: days, total: total, done: run, left: left, fit: fit, today: today, eta: eta,
      stage: stage, count: done.length, avg7: days.slice(-7).reduce((s, x) => s + x.n, 0) / Math.min(7, days.length) };
  }

  /* ── drawing ─────────────────────────────────────────────────────────── */
  const W = 480, H = 230, PL = 26, PR = 30, PT = 12, PB = 28;

  function chart(m) {
    const n = m.days.length;
    const horizon = m.fit && m.fit.b > 0.02 && m.left > 0
      ? Math.max(3, Math.min(14, (m.eta != null ? m.eta - m.today : 7) + 1)) : 0;
    const cols = n + horizon;  /* forecast columns sit after today */
    const iw = W - PL - PR, ih = H - PT - PB;
    const slot = iw / cols;
    const barMax = Math.max(2, Math.max.apply(null, m.days.map(x => x.n)));
    const yb = v => PT + ih - (v / barMax) * ih;
    const yc = v => PT + ih - (Math.min(v, m.total) / Math.max(1, m.total)) * ih;
    const xc = i => PL + (i + 0.5) * slot;

    const svg = S('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'pace-svg', role: 'img',
      'aria-label': 'Sections completed per day, with a least-squares forecast' });

    /* gridlines: left axis is per-day, right axis is the cumulative share */
    [0, 0.5, 1].forEach(function (f) {
      const y = PT + ih - f * ih;
      svg.appendChild(S('line', { x1: PL, x2: W - PR, y1: y, y2: y, class: 'pace-grid' }));
      svg.appendChild(S('text', { x: PL - 6, y: y + 3, class: 'pace-ax', 'text-anchor': 'end',
        text: String(Math.round(f * barMax * 10) / 10) }));
      svg.appendChild(S('text', { x: W - PR + 6, y: y + 3, class: 'pace-ax pace-ax-c',
        text: String(Math.round(f * m.total)) }));
    });

    /* forecast band first so the real data draws over it */
    if (horizon && m.fit) {
      const pts = [];
      for (let k = 0; k <= horizon; k += 1) {
        const v = Math.max(0, Math.min(m.total, m.fit.a + m.fit.b * k));
        pts.push(xc(n - 1 + k).toFixed(1) + ',' + yc(v).toFixed(1));
      }
      svg.appendChild(S('polyline', { points: pts.join(' '), class: 'pace-pred' }));
      svg.appendChild(S('line', { x1: xc(n - 1) + slot / 2, x2: xc(n - 1) + slot / 2, y1: PT, y2: PT + ih,
        class: 'pace-now' }));
    }

    m.days.forEach(function (x, i) {
      if (!x.n) return;
      svg.appendChild(S('rect', { x: xc(i) - slot * 0.32, width: slot * 0.64, y: yb(x.n),
        height: PT + ih - yb(x.n), rx: 2, class: 'pace-bar' }, [
          S('title', { text: fmtDay(x.d) + ': ' + x.n + ' ' + DOM.plural(x.n, 'section') })]));
    });

    svg.appendChild(S('polyline', {
      points: m.days.map((x, i) => xc(i).toFixed(1) + ',' + yc(x.cum).toFixed(1)).join(' '),
      class: 'pace-cum' }));
    const lastDay = m.days[n - 1];
    svg.appendChild(S('circle', { cx: xc(n - 1), cy: yc(lastDay.cum), r: 3.4, class: 'pace-dot' }));

    /* the trend the fit sees, over the fitted window */
    if (m.fit && n >= 3) {
      const w0 = Math.max(0, n - 14);
      const v = i => Math.max(0, Math.min(m.total, m.fit.a + m.fit.b * (m.days[i].d - m.today)));
      svg.appendChild(S('line', { x1: xc(w0), y1: yc(v(w0)), x2: xc(n - 1), y2: yc(v(n - 1)),
        class: 'pace-fit' }));
    }

    /* x labels: first, middle, last, and the forecast end */
    const ticks = [[0, m.days[0].d], [Math.floor((n - 1) / 2), m.days[Math.floor((n - 1) / 2)].d],
      [n - 1, m.today]];
    if (horizon) ticks.push([n + horizon - 1, m.today + horizon]);
    const seen = {};
    ticks.forEach(function (t, k) {
      if (seen[t[0]]) return;
      seen[t[0]] = true;
      svg.appendChild(S('text', { x: xc(t[0]), y: H - 10, class: 'pace-ax',
        'text-anchor': k === 0 ? 'start' : (t[0] === n + horizon - 1 && horizon ? 'end' : 'middle'),
        text: t[1] === m.today ? 'today' : fmtDay(t[1]) }));
    });
    return svg;
  }

  function caption(m) {
    if (!m.count) {
      if (m.stage === 4 && !m.total) return 'No past-paper sections are mapped yet. Add verified PYQs to start this graph.';
      return 'Complete a section at ' + LABEL[m.stage] + ' and its day appears here.'
        + (m.stage === 4 ? ' Only sections with mapped past papers count in this graph; other sections have no PYQ coverage.' : '')
        + (m.stage === 5 ? ' Use Recall and correct every missed item to Stated it.' : '');
    }
    if (m.left <= 0) return 'Every section in the syllabus is complete.';
    if (!m.fit) return 'A few more days of work and this can start forecasting.';
    if (m.eta == null) {
      return 'No steady pace in the last fortnight yet, so there is nothing honest to forecast.';
    }
    const gap = m.eta - m.today;
    const when = gap <= 0 ? 'today' : gap === 1 ? 'tomorrow'
      : (fmtDay(m.eta) + ' (in ' + gap + ' days)');
    return 'At ' + (Math.round(m.fit.b * 100) / 100) + ' sections a day, the last of the '
      + m.left + ' still to go lands ' + when + '.';
  }

  function confidence(m) {
    if (!m.fit || m.eta == null) return null;
    const r = m.fit.r2;
    return r >= 0.9 ? 'steady' : r >= 0.7 ? 'fairly steady' : 'uneven';
  }

  /* the card Today drops in */
  function card() {
    let stage = Number(Store.pref('paceLevel', 1));
    if (![1, 2, 3, 4, 5].includes(stage)) stage = 1;
    let span = Store.pref('paceSpan', 14);
    if ([14, 30, 90].indexOf(span) < 0) span = 14;
    const host = el('div', { class: 'card pace' });

    function paint() {
      DOM.clear(host);
      const m = model(span, stage);
      const conf = confidence(m);
      DOM.add(host, [
        el('div', { class: 'spread' }, [
          el('div', {}, [
            el('div', { class: 'kicker', text: 'LR · ' + LABEL[stage] + ' · sections per day' }),
            el('div', { class: 'pace-big' }, [
              el('b', { text: m.total ? m.done + '/' + m.total : 'No mapped PYQ sections' }),
              el('span', { text: !m.total ? '' : stage === 4 ? ' mapped sections complete' : ' sections complete' })
            ])
          ]),
          el('div', { class: 'seg', role: 'group', 'aria-label': 'Range' },
            [14, 30, 90].map(v => el('button', { type: 'button', class: v === span ? 'on' : '',
              text: v + 'd', on: { click: function () { span = Store.setPref('paceSpan', v); paint(); } } })))
        ]),
        el('div', { class: 'pace-levels seg', role: 'group', 'aria-label': 'Learning level' },
          [1, 2, 3, 4, 5].map(v => el('button', { type: 'button', class: v === stage ? 'on' : '',
            'aria-pressed': String(v === stage), text: 'Lv' + v + ' · ' + LABEL[v],
            on: { click: function () { stage = Store.setPref('paceLevel', v); paint(); } } }))),
        m.total && m.days.length ? el('div', { class: 'pace-plot' }, [chart(m)]) : null,
        el('div', { class: 'pace-key small muted' }, [
          el('span', {}, [el('i', { class: 'k-bar' }), ' per day']),
          el('span', {}, [el('i', { class: 'k-cum' }), ' cumulative']),
          el('span', {}, [el('i', { class: 'k-fit' }), ' least-squares fit']),
          m.eta != null ? el('span', {}, [el('i', { class: 'k-pred' }), ' forecast']) : null
        ]),
        el('p', { class: 'pace-cap', text: caption(m) }),
        m.count ? el('p', { class: 'small muted', style: { margin: '4px 0 0' },
          text: 'Last 7 days: ' + (Math.round(m.avg7 * 10) / 10) + ' a day'
            + (conf ? ' · trend is ' + conf + ' (R² ' + (Math.round(m.fit.r2 * 100) / 100) + ')' : '') }) : null
      ]);
    }
    paint();
    return host;
  }

  return { card, model, fitLine, solve, completions };
})();


/* ── flow-library/app/src/comp.question.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One objective question, as a component.

   This used to live inside the Questions page, which is why answering a
   question meant leaving the note that taught it. The machinery is unchanged —
   OMR sheet first, lock, then verdict + worked answer + what it tests + trap +
   variant — it has simply stopped belonging to a screen, so the note can put a
   question inside itself and the reel can put one on a card.

   MCQ, MSQ and NAT are scored by their own rules, not one shared rule:
     MCQ  one key; a wrong lock costs the negative mark
     MSQ  the exact set is required; a clean subset is reported as partial and
          earns nothing, which is the convention these papers use
     NAT  numeric within the stated tolerance; no negative marking
   Only the first lock is recorded.
   ══════════════════════════════════════════════════════════════════════════ */

const QuestionCard = (function () {

  const el = DOM.el;

  /* ── scoring ───────────────────────────────────────────────────────────── */
  function judge(q, given) {
    if (q.type === 'MCQ') {
      return given === q.answer ? 'correct' : 'wrong';
    }
    if (q.type === 'MSQ') {
      const key = q.answer.slice().sort().join(',');
      const got = given.slice().sort().join(',');
      if (key === got) return 'correct';
      const noWrong = given.every(k => q.answer.indexOf(k) >= 0);
      return (noWrong && given.length) ? 'partial' : 'wrong';
    }
    const n = parseFloat(String(given).replace(/[^0-9eE+\-.]/g, ''));
    if (!isFinite(n)) return 'wrong';
    return Math.abs(n - q.answer.value) <= (q.answer.tol || 0) + 1e-12 ? 'correct' : 'wrong';
  }

  const awarded = (q, verdict) =>
    verdict === 'correct' ? q.marks : (q.type === 'MCQ' ? (q.neg || 0) : 0);

  const keyText = q => q.type === 'NAT'
    ? q.answer.value.toFixed(q.answer.dp || 0) + (q.answer.tol ? ' (± ' + q.answer.tol + ')' : '')
    : (Array.isArray(q.answer) ? q.answer.join(' and ') : q.answer);

  const givenText = (q, given) => q.type === 'NAT'
    ? String(given)
    : (Array.isArray(given) ? (given.slice().sort().join(' and ') || '—') : given);

  /* The figure of the first tested concept that has one — seeing the picture
     right after the attempt is when it lands hardest. */
  function figureFor(q) {
    const withFig = (q.tests || [])
      .map(id => Pool.concept(id))
      .filter(c => c && Fig.forConcept(c).length)[0];
    if (!withFig) return null;
    const def = Fig.forConcept(withFig)[0].def;
    return el('div', { class: 'stack', style: { gap: '8px' } }, [
      el('div', { class: 'kicker', text: 'The picture behind it' }),
      Fig.frame(def)
    ]);
  }

  /* ── the component ───────────────────────────────────────────────────────
     opts.inNote   true when the question is open inside a note: the links back
                   to concepts are then pointless and the chrome is lighter
     opts.tail     extra nodes appended after the worked answer (the "next
                   question" row the Questions page still wants)
     opts.onLocked called with the verdict once the first lock lands */
  function build(q, opts) {
    const o = opts || {};
    const rec = Store.omr(q.id);
    const already = rec && rec.first;

    let given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
    let locked = false;
    const started = Date.now();

    const sheetHost = el('div', {});
    const actionHost = el('div', {});
    const resultHost = el('div', {});

    const timer = el('span', { class: 'timer', text: '0:00' });
    const tick = window.setInterval(function () {
      /* stop on lock, and stop once this component has been thrown away */
      if (locked || !document.body.contains(timer)) { window.clearInterval(tick); return; }
      timer.textContent = UI.clock(Date.now() - started);
    }, 1000);

    /* — OMR sheet — */
    function paintSheet(focusIdx) {
      DOM.clear(sheetHost);

      if (q.type === 'NAT') {
        const input = el('input', {
          type: 'text', inputmode: 'decimal', autocomplete: 'off',
          'aria-label': 'Your numeric answer', placeholder: '0.00',
          disabled: locked || null
        });
        input.value = typeof given === 'string' ? given : '';
        input.addEventListener('input', function () { given = input.value; paintActions(); });
        sheetHost.appendChild(el('div', { class: 'nat-in' }, [
          input,
          el('span', { class: 'small muted', text: q.answer.dp
            ? 'to ' + q.answer.dp + ' decimal places' : 'integer' })
        ]));
        if (locked) {
          sheetHost.appendChild(el('p', { class: 'small muted', style: { margin: '8px 0 0' },
            text: 'Accepted range: ' + keyText(q) }));
        }
        return;
      }

      const msq = q.type === 'MSQ';
      const group = el('div', {
        class: 'omr', role: msq ? 'group' : 'radiogroup',
        'aria-label': msq ? 'Select all correct options' : 'Select one option'
      });

      (q.options || []).forEach(function (opt) {
        const chosen = msq ? given.indexOf(opt.k) >= 0 : given === opt.k;
        const isKey = locked && (msq ? q.answer.indexOf(opt.k) >= 0 : q.answer === opt.k);
        const badChoice = locked && chosen && !isKey;

        const row = el('button', {
          class: 'omr-opt' + (msq ? ' msq' : '') + (isKey ? ' key' : '') + (badChoice ? ' chosen-bad' : ''),
          type: 'button',
          role: msq ? 'checkbox' : 'radio',
          'aria-checked': String(chosen),
          'aria-disabled': locked ? 'true' : null
        }, [
          el('span', { class: 'bub', 'aria-hidden': 'true', text: opt.k }),
          el('span', { class: 't', html: opt.t }),
          locked && isKey ? el('span', { class: 'omr-mark ok', text: 'key' }) : null,
          badChoice ? el('span', { class: 'omr-mark bad', text: 'yours' }) : null
        ]);

        if (!locked) row.addEventListener('click', function () {
          if (msq) {
            const i = given.indexOf(opt.k);
            if (i >= 0) given.splice(i, 1); else given.push(opt.k);
          } else given = opt.k;
          paintSheet(q.options.indexOf(opt));   /* keep focus on the row just used */
          paintActions();
        });
        group.appendChild(row);
      });

      /* arrow-key movement inside the group, as a radiogroup should behave */
      group.addEventListener('keydown', function (e) {
        if (locked) return;
        const keys = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'];
        if (keys.indexOf(e.key) < 0) return;
        e.preventDefault();
        const rows = Array.prototype.slice.call(group.querySelectorAll('.omr-opt'));
        const at = rows.indexOf(document.activeElement);
        const dir = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
        const nextRow = rows[(at + dir + rows.length) % rows.length];
        if (nextRow) nextRow.focus();
      });

      sheetHost.appendChild(group);
      if (focusIdx != null) {
        const rows = group.querySelectorAll('.omr-opt');
        if (rows[focusIdx]) rows[focusIdx].focus({ preventScroll: true });
      }
      UI.math(group);
    }

    /* — lock / clear — */
    function hasAnswer() {
      if (q.type === 'MSQ') return given.length > 0;
      if (q.type === 'NAT') return String(given).trim().length > 0;
      return !!given;
    }

    function paintActions() {
      DOM.clear(actionHost);
      if (locked) return;
      DOM.add(actionHost, [
        el('div', { class: 'btn-row' }, [
          el('button', {
            class: 'btn primary', type: 'button', disabled: hasAnswer() ? null : true,
            text: q.type === 'MSQ' ? 'Lock ' + (given.length || 'no') + ' selected' : 'Lock answer',
            on: { click: lock }
          }),
          hasAnswer() ? el('button', { class: 'btn', type: 'button', text: 'Clear',
            on: { click: function () {
              given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
              paintSheet(); paintActions();
            } } }) : null
        ]),
        el('p', { class: 'small muted', style: { margin: '10px 0 0' },
          text: already
            ? 'Your first attempt (' + already.verdict + ') is already on record; this pass is not recorded.'
            : 'Locking records your first attempt. The worked answer follows immediately.' })
      ]);
    }

    function lock() {
      if (locked || !hasAnswer()) return;
      locked = true;
      const verdict = judge(q, given);
      const ms = Date.now() - started;
      const saved = Store.lockOmr(q.id, { given: given, verdict: verdict, ms: ms });
      paintSheet();
      DOM.clear(actionHost);
      resultHost.appendChild(feedback(q, given, verdict, ms, saved));
      UI.math(resultHost);
      DOM.announce(verdict === 'correct' ? 'Correct.' : verdict === 'partial'
        ? 'Partially correct — no marks under this paper’s rule.' : 'Incorrect. Worked answer shown.');
      if (o.onLocked) o.onLocked(verdict);
      const h = resultHost.querySelector('.verdict');
      if (h) h.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    /* — after the lock: verdict, worked answer, what it tests, trap, twist — */
    function feedback(q, given, verdict, ms, saved) {
      const wrap = el('div', { class: 'stack' });
      const marks = awarded(q, verdict);
      const cls = verdict === 'correct' ? 'ok' : verdict === 'partial' ? 'warn' : 'bad';
      const glyph = verdict === 'correct' ? 'check_circle' : verdict === 'partial' ? 'remove_circle' : 'cancel';

      DOM.add(wrap, [
        el('div', { class: 'verdict ' + cls }, [
          el('span', { class: 'g', 'aria-hidden': 'true' }, [DOM.mi(glyph)]),
          el('span', {}, [
            el('b', { text: verdict === 'correct' ? 'Correct' : verdict === 'partial'
              ? 'Partially correct — this paper awards nothing for a partial set' : 'Not correct' }),
            el('span', { text: 'You answered ' + givenText(q, given) + ' · key ' + keyText(q) +
              ' · ' + (marks > 0 ? '+' : '') + (Math.round(marks * 100) / 100) + ' ' +
              DOM.plural(Math.abs(marks), 'mark') + ' · ' + UI.clock(ms) })
          ])
        ]),

        saved.tries > 1 ? el('p', { class: 'small muted', style: { margin: 0 },
          text: 'First attempt (' + saved.first.verdict + ') is unchanged — that is the number the stats use.' }) : null,

        el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: 'Worked answer' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.solution, 'tight')])
        ]),

        q.tested ? el('div', { class: 'card tint' }, [
          el('div', { class: 'kicker', text: 'What this actually tests' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.tested, 'tight')]),
          o.inNote ? null : el('div', { class: 'row', style: { marginTop: '12px' } },
            (q.tests || []).map(function (id) {
              const c = Pool.concept(id);
              return c
                ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
                : el('span', { class: 'chip ghost', text: id });
            }))
        ]) : null,

        /* the picture of the idea being examined, where there is one */
        figureFor(q),

        q.trap ? el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: 'The trap' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.trap, 'tight')])
        ]) : null,

        q.twist ? UI.reveal('Changed version', function () {
          return el('div', { class: 'stack', style: { gap: '10px' } }, [
            UI.prose(q.twist.q, 'tight'),
            UI.reveal('Answer', () => UI.prose(q.twist.a, 'tight'),
              { openLabel: 'Show', closeLabel: 'Hide' })
          ]);
        }, { openLabel: 'Try the variant', closeLabel: 'Hide the variant' }) : null,

        o.tail || null
      ]);
      return wrap;
    }

    const node = el('div', { class: o.inNote ? 'stack qcard' : 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'row' }, [
          UI.typeBadge(q),
          q.mock ? el('span', { class: 'badge warn', text: 'draft' }) : null
        ]),
        timer
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.metaRow(q)]),
      el('div', { style: { marginTop: '14px' } }, [UI.prose(q.prompt)]),
      el('div', { style: { marginTop: '16px' } }, [sheetHost]),
      el('div', { style: { marginTop: '16px' } }, [actionHost]),
      resultHost
    ]);

    paintSheet();
    paintActions();
    UI.math(node);
    return node;
  }

  return { build, judge, awarded, keyText, givenText, figureFor };
})();


/* ── flow-library/app/src/comp.note.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One concept note, as a component that opens INSIDE the syllabus.

   The note used to be a page of its own, which meant that reading a section
   was a loop of leaving the tree and coming back to it — four screens for one
   act of studying. It is now a body with no chrome: the tree expands a row and
   drops this in, and everything the note used to link out to (its proof, its
   exercises, its objective questions, the writing workspace) opens inside it,
   in the same scroll.

   Nothing here is built until the note is opened, and the questions inside it
   are not built until each one is opened in turn. A section of forty concepts
   costs one row each until you ask for more.

   The vocabulary of the buttons changed with rule 13: a claim is now "Mark as
   complete", not "Tick level 3". The level still moves — it is just no longer
   what the button talks about. Reading is level 1, the proof is level 2, the
   section's exercises are level 3, and a stage that does not exist is skipped
   rather than held against you.
   ══════════════════════════════════════════════════════════════════════════ */

const NoteBody = (function () {

  const el = DOM.el;
  let panelNumber = 0;

  /* ── a lazy, titled expander ─────────────────────────────────────────────
     The one pattern the whole note is built from: a header you press and a
     body that does not exist until you do. */
  function expander(opts) {
    const o = opts || {};
    const isOpen = !!o.open;
    const panelId = 'note-panel-' + (++panelNumber);
    const body = el('div', { id: panelId, class: 'exp-b', hidden: !isOpen });
    const chev = DOM.icon('chev', 18, 'chev');
    const head = el('button', { class: 'exp-h', type: 'button', 'aria-expanded': String(isOpen), 'aria-controls': panelId }, [
      o.mark || null,
      el('span', { class: 'tt' }, [
        el('b', { text: o.title }),
        o.sub ? el('span', { text: o.sub }) : null
      ]),
      o.badge || null,
      chev
    ]);
    let built = false;
    function openBody() {
      if (!built) {
        built = true;
        DOM.add(body, o.build());
        UI.math(body);
      }
      body.hidden = false;
      head.setAttribute('aria-expanded', 'true');
      if (o.onOpen) o.onOpen(body);
    }
    function closeBody() {
      body.hidden = true;
      head.setAttribute('aria-expanded', 'false');
    }
    head.addEventListener('click', function () {
      if (body.hidden) openBody(); else closeBody();
    });
    if (isOpen) {
      built = true;
      DOM.add(body, o.build());
    }
    const host = el('div', { class: 'exp' + (o.cls ? ' ' + o.cls : '') }, [head, body]);
    host._head = head;
    host._open = openBody;
    host._close = closeBody;
    host._isOpen = function () { return !body.hidden; };
    return host;
  }

  /* ── the prerequisite chain, walked and rendered as a path ──────────────
     A prerequisite is satisfied once it has been READ, and nothing more is
     asked of it. Judging the chain at the highest level anything in it had
     reached was the bug that made groundwork look permanently outstanding. */
  function prereqPath(c) {
    const chain = Pool.chain(c.id, 3);
    if (chain.length < 2) return null;
    const missing = chain.filter(x => x.id !== c.id && !Progress.prereqOk(x.id)).length;

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Route to this result' }),
        missing
          ? el('span', { class: 'badge warn', text: missing + ' not read yet' })
          : el('span', { class: 'badge ok', text: 'groundwork read' })
      ]),
      el('div', { class: 'path', style: { marginTop: '10px' } }, chain.map(function (x, i) {
        const here = x.id === c.id;
        const lv = Progress.level(x.id);
        const ok = Progress.prereqOk(x.id);
        const kids = [
          el('span', { class: 'dot', 'aria-hidden': 'true' },
            [ok && !here ? DOM.mi('check', 'xs') : el('span', { text: here ? '•' : String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: x.title }),
            el('span', { text: here ? 'you are here'
              : '§' + x.sec + ' · ' + x.kind + ' · level ' + lv })
          ])
        ];
        return here
          ? el('div', { class: 'pstep here' }, kids)
          : el('a', { class: 'pstep' + (ok ? ' done' : ''), 'data-lv': String(lv),
              href: Router.href('note/' + x.id) }, kids);
      }))
    ]);
  }

  /* ── reverse edges: what this result is used for ──────────────────────── */
  function unlocks(c) {
    const next = Pool.unlocks(c.id);
    if (!next.length) return null;
    return el('div', { class: 'card tint' }, [
      el('div', { class: 'kicker', text: 'Used later by' }),
      el('div', { class: 'row', style: { marginTop: '10px' } }, next.map(function (x) {
        return el('a', { class: 'chip', href: Router.href('note/' + x.id) }, [
          Progress.level(x.id) >= 1 ? DOM.mi('check', 'xs') : null,
          el('span', { text: x.title })
        ]);
      }))
    ]);
  }

  /* ── the claim that earns a level ────────────────────────────────────────
     One control, because it is one kind of claim — "I produced this myself".
     It is deliberately not a checkbox you can tick on the way past. */
  function taskRow(id, opts) {
    const o = opts || {};
    const noun = o.noun || 'proof';
    const btn = el('button', { class: 'btn', type: 'button' });
    const note = el('p', { class: 'small muted', style: { margin: '8px 0 0' } });

    function paint() {
      const on = Store.isProofDone(id);
      btn.className = 'btn' + (on ? '' : ' primary');
      DOM.clear(btn);
      DOM.add(btn, [
        DOM.mi(on ? 'task_alt' : 'radio_button_unchecked', 'sm'),
        el('span', { text: on ? 'Completed — undo' : 'Mark as complete' })
      ]);
      btn.setAttribute('aria-pressed', String(on));
      note.textContent = on
        ? 'Marked complete on this ' + noun + '.'
        : 'Claim this only if you produced the argument yourself, not if you read it.';
    }

    btn.addEventListener('click', function () {
      const next = !Store.isProofDone(id);
      Store.setProofDone(id, next);
      /* A proof cannot be worked through on a note you have not read, so
         claiming it carries the reading tick with it. An exercise key ('w:')
         is a section-wide claim and owns no single concept, so it carries
         nothing. */
      if (next && id.indexOf('w:') !== 0 && id.indexOf('p:') !== 0 && !Store.isDone(id)) {
        Store.setDone(id, true);
      }
      Progress.dropCache();
      paint();
      if (o.onTick) o.onTick();
      DOM.announce(next ? 'Marked complete.' : 'Completion removed.');
    });
    paint();

    const host = el('div', { class: 'proof-done', style: { marginTop: '16px' } }, [
      el('div', { class: 'btn-row' }, [btn]),
      note
    ]);
    host._paint = paint;
    return host;
  }

  /* ── the proof ───────────────────────────────────────────────────────── */
  function proofView(c, onTick) {
    if (!c.proof) return null;
    const p = c.proof;

    const tryHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });
    const proofHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });

    let tryBuilt = false;
    let proofBuilt = false;

    function buildTry() {
      const kids = [];
      if (p.idea) {
        kids.push(el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
          el('div', { class: 'kicker' }, [DOM.mi('lightbulb', 'xs'), el('span', { text: ' Proof strategy' })]),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
        ]));
      }
      if (p.why) {
        kids.push(el('div', { class: 'card flat', style: { padding: '10px 14px', borderLeft: '3px solid var(--accent, #4f46e5)' } }, [
          el('div', { class: 'kicker', text: 'Core Rationale' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.why })
        ]));
      }
      if (p.rungs && p.rungs.length > 0 && p.rungs[0].why) {
        kids.push(el('div', { class: 'card flat', style: { padding: '8px 12px', background: 'var(--surface-2)' } }, [
          el('div', { class: 'small muted' }, [
            el('b', { text: 'First step clue: ' }),
            el('span', { html: p.rungs[0].why })
          ])
        ]));
      }
      /* The scratchpad is the full writing workspace, not a bare textarea:
         a proof sketch is prose with maths in it, and it is worth keeping.
         Filed under 'proof:<id>' so it never collides with the statement
         draft for the same concept, and it syncs like any other draft. */
      const pad = el('div', { class: 'scratch' });
      WriteBox.mount(pad, {
        draftKey: 'proof:' + c.id, concept: c,
        label: 'Scratchpad · draft the argument before you look',
        placeholder: 'The main move is…'
      });
      kids.push(pad);
      return kids;
    }

    function buildProof() {
      const kids = [];
      if (p.idea) {
        kids.push(el('div', { class: 'card tint', style: { marginBottom: '6px', padding: '10px 14px' } }, [
          el('div', { class: 'kicker', text: 'Key Idea' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
        ]));
      }
      if (p.rungs && p.rungs.length) {
        kids.push(el('div', { class: 'stack', style: { gap: '10px' } },
          (function (lines) {
            return p.rungs.map(function (r, idx) {
              return UI.rung(r, idx, { line: lines[idx], fig: Project.hook('rungFig', r, c, idx) });
            });
          })(RealLine.proof(c))
        ));
      }
      if (p.ends) {
        kids.push(el('div', { class: 'prose tight', style: { marginTop: '12px', fontStyle: 'italic', borderTop: '1px solid var(--line, rgba(0,0,0,0.1))', paddingTop: '8px' }, html: p.ends }));
      }
      return kids;
    }

    const tryBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
      [DOM.mi('lightbulb', 'sm'), el('span', { class: 'lb', text: 'Try proof (hint)' })]);

    const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
      [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: 'Show step-by-step proof' })]);

    tryBtn.addEventListener('click', function () {
      const open = tryHost.hidden;
      if (open && !tryBuilt) { tryBuilt = true; DOM.add(tryHost, buildTry()); UI.math(tryHost); }
      tryHost.hidden = !open;
      tryBtn.setAttribute('aria-expanded', String(open));
      tryBtn.querySelector('.lb').textContent = open ? 'Hide hint' : 'Try proof (hint)';
    });

    showBtn.addEventListener('click', function () {
      const open = proofHost.hidden;
      if (open && !proofBuilt) { proofBuilt = true; DOM.add(proofHost, buildProof()); UI.math(proofHost); }
      proofHost.hidden = !open;
      showBtn.setAttribute('aria-expanded', String(open));
      showBtn.querySelector('.lb').textContent = open ? 'Hide proof' : 'Show step-by-step proof';
    });

    const row = taskRow(c.id, { noun: 'proof', onTick: onTick });
    const view = expander({
      cls: 'exp-proof',
      open: true,
      title: 'Proof & rigorous argument',
      sub: (p.rungs ? p.rungs.length : 0) + ' ' + DOM.plural(p.rungs ? p.rungs.length : 0, 'step')
        + ' · completing it is level 2',
      build: function () {
        return [
          el('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap' } }, [tryBtn, showBtn]),
          tryHost, proofHost, row
        ];
      }
    });
    view._paintProofDone = row._paint;
    return view;
  }

  /* Level 3 is a SECTION bar, so the note has to say where the section stands
     — otherwise a learner works the two exercises filed under this theorem,
     sees no green, and reads it as a bug. A section with NO exercises is not
     held back: it is already as done as it can be. */
  function sectionTasks(c) {
    if (!c.sec) return null;
    const t = Progress.secTaskState(c.sec);
    if (!t.total) return null;

    return el('div', { class: 'card tint' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: '§' + c.sec + ' exercises · level 3' }),
        el('span', { class: 'count', text: t.done + ' / ' + t.total })
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.meter(t.done, t.total, 3)]),
      el('p', { class: 'small muted', style: { margin: '10px 0 0' },
        text: t.ready
          ? 'Every exercise in this section is worked through — the section is at level 3.'
          : 'The whole section has to be worked through before anything in it turns green.' })
    ]);
  }

  function traps(c) {
    // Older lesson pools also store a single warning as a string.
    const items = (Array.isArray(c.traps) ? c.traps : [c.traps])
      .filter(t => typeof t === 'string' && t.trim());
    if (!items.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'kicker', text: 'Where marks are lost' }),
      el('ul', { class: 'prose tight', style: { marginTop: '10px', paddingLeft: '1.1em' } },
        items.map(t => el('li', { html: t })))
    ]);
  }

  function selfChecks(c) {
    const cards = (c.cards || []);
    if (!cards.length) return null;
    return expander({
      title: 'Self-check',
      open: true,
      sub: cards.length + ' ' + DOM.plural(cards.length, 'prompt') + ' · nothing here is recorded',
      build: function () {
        return [el('div', { class: 'stack', style: { gap: '14px' } }, cards.map(function (card) {
          return el('div', { class: 'stack', style: { gap: '6px' } }, [
            el('div', { class: 'prose tight', html: card.q }),
            UI.reveal(card.kind, () => el('div', { class: 'prose tight', html: card.a }),
              { openLabel: 'Show answer', closeLabel: 'Hide' })
          ]);
        }))];
      }
    });
  }

  /* ── the writing workspace, in the note ─────────────────────────────────
     The statement is withheld until you have written yours: reading a
     statement is not writing one. */
  function writeWorkspace(c) {
    return expander({
      title: 'Write the statement from memory',
      sub: 'LaTeX, with the palette beside you',
      build: function () {
        const boxHost = el('div', { class: 'card' });
        const compareHost = el('div', {});
        const wb = WriteBox.mount(boxHost, { concept: c, label: 'Your statement, in LaTeX' });

        function compare() {
          DOM.clear(compareHost);
          compareHost.appendChild(el('div', { class: 'reveal' }, [
            el('div', { class: 'h' }, [el('span', { text: 'Canonical statement' })]),
            el('div', { class: 'b' }, [
              UI.prose(c.statement, 'tight'),
              el('p', { class: 'small muted', style: { margin: '12px 0 0' },
                text: 'Compare the quantifiers and the hypotheses first — that is where written '
                  + 'answers lose marks, not in the algebra.' })
            ])
          ]));
          UI.math(compareHost);
          DOM.announce('Canonical statement revealed.');
        }

        return [boxHost, UI.gate({
          hint: 'Write your version above first. The canonical statement stays hidden until you ask for it.',
          actions: [
            { label: 'Compare with the canonical statement', primary: true, onClick: function () {
                if (!wb.hasContent() &&
                  !window.confirm('Nothing is written yet. Reveal the statement anyway?')) return;
                compare();
              } }
          ]
        }), compareHost];
      }
    });
  }

  /* ── objective questions, answered here ──────────────────────────────── */
  function questionsOn(c) {
    const qs = Pool.objectiveFor(c.id);
    if (!qs.length) return null;
    return el('div', { class: 'stack', style: { gap: '8px' } }, [
      el('div', { class: 'kicker', text: 'Objective questions on this' }),
      el('div', { class: 'stack', style: { gap: '8px' } }, qs.map(function (q) {
        const mark = el('span', { class: 'ix' });
        const sub = el('span', {});
        /* Repainted on the lock as well as on build: the header still says
           "not attempted" while the worked answer is open underneath it
           otherwise, which reads as the tick having failed. */
        function paintMark() {
          const rec = Store.omr(q.id);
          const v = rec && rec.first && rec.first.verdict;
          mark.className = 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : '');
          DOM.clear(mark);
          mark.appendChild(DOM.mi(v === 'correct' ? 'check' : v ? 'close' : 'radio_button_unchecked', 'xs'));
          sub.textContent = v ? 'first attempt: ' + v : 'not attempted';
        }
        paintMark();

        const node = expander({
          cls: 'exp-q',
          open: true,
          mark: mark,
          title: q.type + ' · ' + q.marks + ' ' + DOM.plural(q.marks, 'mark'),
          sub: ' ',
          build: function () {
            return [QuestionCard.build(q, { inNote: true, onLocked: paintMark })];
          }
        });
        /* swap the static subtitle for the live one */
        const slot = node.querySelector('.exp-h .tt span');
        if (slot) slot.parentNode.replaceChild(sub, slot);
        return node;
      }))
    ]);
  }

  /* ── the section's exercises, worked here ────────────────────────────── */
  function writtenOn(c, onTick, isOpen) {
    const qs = Pool.writtenFor(c.id);
    if (!qs.length) return null;

    const countSpan = el('span', { class: 'count' });
    const mark = el('span', { class: 'ix' });

    function updateHeader() {
      const done = qs.filter(q => Progress.taskDone(q)).length;
      const allDone = done === qs.length;
      DOM.clear(mark);
      mark.className = 'ix' + (allDone ? ' ok' : '');
      mark.appendChild(DOM.mi(allDone ? 'check' : 'radio_button_unchecked', 'xs'));
      countSpan.textContent = done + ' / ' + qs.length;
    }
    updateHeader();

    const exp = expander({
      cls: 'exp-exercises',
      open: !!isOpen,
      mark: mark,
      title: 'Exercises on this',
      sub: qs.length + ' ' + DOM.plural(qs.length, 'exercise') + ' · completing them is level 3',
      badge: countSpan,
      build: function () {
        return [
          el('p', { class: 'small muted', style: { margin: '0 0 10px' },
            text: 'Every exercise in this section has to be worked through before the section '
              + 'turns green. Work it on paper or in the scratchpad, then mark it complete.' }),
          el('div', { class: 'stack', style: { gap: '8px' } }, qs.map(function (q) {
            const qMark = el('span', { class: 'ix' });
            function paintQMark() {
              DOM.clear(qMark);
              const on = Progress.taskDone(q);
              qMark.className = 'ix' + (on ? ' ok' : '');
              qMark.appendChild(DOM.mi(on ? 'check' : 'radio_button_unchecked', 'xs'));
            }
            paintQMark();

            return expander({
              cls: 'exp-q',
              open: true,
              mark: qMark,
              title: q.title || ('Exercise ' + q.id),
              sub: (q.marks || '?') + ' ' + DOM.plural(q.marks || 0, 'mark'),
              build: function () {
                const tryHost = el('div', { class: 'stack', style: { gap: '8px', marginTop: '8px' }, hidden: true });
                const answerHost = el('div', { class: 'prose tight', style: { marginTop: '8px' }, hidden: true });
                let tryBuilt = false, answerBuilt = false;

                function buildTry() {
                  const kids = [];
                  if (q.approach) {
                    kids.push(el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
                      el('div', { class: 'kicker' }, [DOM.mi('lightbulb', 'xs'), el('span', { text: ' Approach' })]),
                      el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: q.approach })
                    ]));
                  }
                  const pad = el('div', { class: 'scratch' });
                  WriteBox.mount(pad, {
                    draftKey: 'written:' + q.id, concept: c,
                    label: 'Scratchpad · draft your answer before you look',
                    placeholder: 'Start with what the question is really testing…'
                  });
                  kids.push(pad);
                  return kids;
                }

                function buildAnswer() {
                  return [
                    q.approach ? el('div', { html: q.approach }) : null,
                    q.solution ? el('div', { html: q.solution }) : null,
                    q.trap ? el('p', {}, [el('b', { text: 'Trap: ' }), el('span', { html: q.trap })]) : null
                  ];
                }

                const tryBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
                  [DOM.mi('lightbulb', 'sm'), el('span', { class: 'lb', text: 'Try it (hint)' })]);
                const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
