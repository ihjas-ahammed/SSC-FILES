  /* SVG element builder — figures are hand-drawn, so this stays tiny */
  const NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs, kids) {
    const node = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'text') node.textContent = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (kid) {
      if (kid) node.appendChild(kid);
    });
    return node;
  }

  return { el, add, clear, announce, icon, mi, debounce, plural, pct, reduced, stagger, svg };
})();

/* ── hash router ─────────────────────────────────────────────────────────── */
const Router = (function () {
  let handler = null;
  /* How many route changes this visit has made. `history.back()` is only worth
     offering while there is somewhere of ours to go back TO — otherwise the
     browser walks out of the app entirely, which is not what a back button
     inside a toolbar is understood to mean. */
  let depth = 0;

  function current() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [p, q] = raw.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    new URLSearchParams(q || '').forEach((v, k) => { query[k] = v; });
    return { name: parts[0] || 'home', args: parts.slice(1), query, raw: p };
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', function () {
      depth += 1;
      handler(current());
      listeners.forEach(function (f) { try { f(current()); } catch (e) { /* never break a route */ } });
    });
    handler(current());
  }

  const listeners = [];
  const onRoute = fn => listeners.push(fn);

  /* One step back through OUR history, or home when there is none. */
  function back() {
    if (depth > 0) { depth -= 2; window.history.back(); return true; }
    if (current().name !== 'home') { go('home'); return true; }
    return false;
  }
  const canBack = () => depth > 0 || current().name !== 'home';

  const go = hash => { location.hash = hash.charAt(0) === '#' ? hash : '#/' + hash.replace(/^\//, ''); };
  const href = hash => '#/' + String(hash).replace(/^\//, '');
  const reload = () => handler && handler(current());

  return { current, start, go, href, reload, back, canBack, onRoute };
})();


/* ── src/core.tex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   MathJax plumbing.

   Two jobs: typeset authored content after a view is mounted, and render the
   learner's own LaTeX fragment safely. "Safely" means a malformed fragment
   never throws into the view, never wipes the last good render, and reports a
   human-readable reason. MathJax's formatError hook (set in index.html) parks
   the message on window.__texError; we read and clear it around each run.
   ══════════════════════════════════════════════════════════════════════════ */

const Tex = (function () {

  let chain = Promise.resolve();

  const available = () => !!(window.MathJax && window.MathJax.typesetPromise);

  /* Serialise every typeset call: MathJax is single-threaded and we need the
     error hook to belong to a known run. */
  function run(job) {
    chain = chain.then(job).catch(err => {
      console.warn('[tex]', err && err.message);
    });
    return chain;
  }

  /* Typeset authored HTML already in the DOM. */
  function typeset(nodes) {
    if (!available()) return Promise.resolve();
    const list = Array.isArray(nodes) ? nodes : [nodes];
    return run(() => window.MathJax.typesetPromise(list));
  }

  /* Render one learner fragment into `target`.
     Resolves {ok, error}. On failure `target` keeps whatever it had. */
  function renderFragment(target, latex, opts) {
    const display = !opts || opts.display !== false;
    const src = String(latex == null ? '' : latex);

    if (!src.trim()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'ph', text: opts && opts.placeholder
        ? opts.placeholder : 'Your rendered mathematics will appear here.' }));
      return Promise.resolve({ ok: true, empty: true });
    }
    if (!available()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'mono small', text: src }));
      return Promise.resolve({ ok: false, error: 'MathJax is not loaded — showing LaTeX source.' });
    }

    return run(function () {
      const stage = document.createElement('div');
      stage.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      stage.textContent = display ? '\\[' + src + '\\]' : '\\(' + src + '\\)';
      document.body.appendChild(stage);
      window.__texError = null;

      return window.MathJax.typesetPromise([stage]).then(function () {
        const err = window.__texError;
        window.__texError = null;

        /* Three ways a fragment can be bad, and all three must be caught:
           a TeX error raised through formatError; an error node rendered in
           place; or no maths at all, which is what an unclosed group does —
           MathJax swallows the closing delimiter and finds nothing to typeset. */
        const errNode = stage.querySelector('mjx-merror, [data-mjx-error]');
        const produced = stage.querySelector('mjx-container');
        const why = err
          || (errNode && (errNode.getAttribute('data-mjx-error') || errNode.textContent))
          || (!produced && 'nothing came out — check for an unmatched { or }, and that every command is complete.');

        if (why) { stage.remove(); return { ok: false, error: String(why) }; }

        /* MathJax's noundefined package prints an unknown macro in red rather
           than failing. That is the right behaviour — the rest of the line
           still renders — but the learner deserves to be told. */
        const unknown = stage.querySelector('[style*="color: red"]');
        const hint = unknown
          ? 'It renders, but the part shown in red is not a command MathJax knows — check that spelling.'
          : null;

        DOM.clear(target);
        while (stage.firstChild) target.appendChild(stage.firstChild);
        stage.remove();
        return { ok: true, hint: hint };
      }, function (e) {
        stage.remove();
        window.__texError = null;
        return { ok: false, error: (e && e.message) || 'LaTeX could not be rendered.' };
      });
    });
  }

  /* Wait once for MathJax, so the first view is not typeset into the void. */
  function ready() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      return window.MathJax.startup.promise.catch(() => {});
    }
    return Promise.resolve();
  }

  return { typeset, renderFragment, ready, available };
})();


/* ── src/core.md.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Markdown, line by line, with the maths left alone.

   The writing workspace is a live markdown editor whose maths is written
   inline as $…$ and $$…$$. So the one thing this renderer must never do is
   touch what is between the dollars: `\text{a*b*c}` is not italics, and a
   backslash is not an escape character to markdown here.

   The method is therefore: cut the source into maths and prose segments
   first, run the inline rules over prose only, then reassemble. Every block
   is one line — the editor renders each line into its own frame, so there is
   no multi-line block state to carry.

   AUTO-MATH. Dollar signs are bookkeeping, and bookkeeping is what stops a
   sentence being written at speed. So a LaTeX command met in the middle of
   prose no longer has to be fenced: "I love \\frac{1}{2} in fact" typesets the
   fraction and leaves the words alone. `autoMath` finds each run that is
   unambiguously mathematics — it has to CONTAIN a backslash command, a
   superscript or a subscript, never merely look numeric — grows it over the
   operands and operators around it, and stops at the first real word. The run
   is stashed behind a placeholder before the markdown rules run, so `_` inside
   a subscript is never mistaken for italics and `<` is never escaped.

   Explicit `$…$` still works and still wins: segments() takes those out first,
   so anything already fenced is left exactly as written.
   ══════════════════════════════════════════════════════════════════════════ */

const Markdown = (function () {

  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* Split on $$…$$ first, then $…$, so a display block is never mistaken for
     two inline ones. Returns [{math:false,t}|{math:true,t}]. */
  function segments(src) {
    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;
  }

  /* Inline rules, prose only. Code spans are pulled out first so that what is
     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);
      return '\x00C' + (code.length - 1) + '\x00';
    });

    s = esc(s)
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>');

    return s.replace(/\x00C(\d+)\x00/g, (_, i) => '<code>' + esc(code[+i]) + '</code>');
  }

  /* ── auto-math ───────────────────────────────────────────────────────────
     Scan a PROSE segment (everything already fenced in $…$ has been taken out)
     and wrap each mathematical run in \\( … \\).

     What starts a run: a backslash command, or a token carrying ^ or _.
     What continues one: single-letter variables, numbers, operators, balanced
     braces and the spaces between them.
     What ends one: a word of two or more letters that is not a command, a
     sentence-ending punctuation mark, or the end of the line.

     The two-letter rule is the whole safety margin. "in fact" ends the run;
     "x + 1" does not. A lone word like "a" or "I" can be swallowed into a run
     that is already open, which is the right call inside `f(a) = b` and a
     harmless one elsewhere — it renders as italic a, which is what someone
     writing mathematics meant anyway. */

  /* `*` is deliberately absent: it is markdown emphasis far more often than it
     is multiplication, and LaTeX writes a product as \\cdot or \\times anyway. */
  const OPS = '+-/=<>()[]|,;:!\'~^_&.';
  const isOp = ch => OPS.indexOf(ch) >= 0;
  const isSpace = ch => ch === ' ' || ch === '\t';
  const isAlnum = ch => /[0-9A-Za-z]/.test(ch);

  /* a balanced {...} starting at i, or -1 */
  function brace(src, i) {
    if (src[i] !== '{') return -1;
    let depth = 0;
    for (let j = i; j < src.length; j++) {
      if (src[j] === '\\') { j += 1; continue; }
      if (src[j] === '{') depth += 1;
      else if (src[j] === '}') { depth -= 1; if (!depth) return j + 1; }
    }
    return -1;
  }

  /* one math token at i: returns the index after it, or -1 */
  function token(src, i) {
    const ch = src[i];
    if (ch === '\\') {
      const m = /^\\([a-zA-Z]+|[{}$%&#_|,;: ])/.exec(src.slice(i));
      return m ? i + m[0].length : -1;
    }
    if (ch === '{') return brace(src, i);
    if (ch === '^' || ch === '_') {
      const after = i + 1;
      const b = brace(src, after);
      if (b > 0) return b;
      if (after < src.length && isAlnum(src[after])) return after + 1;
      return -1;
    }
    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < src.length && /[0-9.]/.test(src[j])) j += 1;
      return j;
    }
    if (/[A-Za-z]/.test(ch)) {
      /* a single letter is a variable; two or more is a word, and a word ends
         the run — unless it is the argument of a command, which the brace
         branch has already eaten */
      return /[A-Za-z]/.test(src[i + 1] || '') ? -1 : i + 1;
    }
    if (isOp(ch)) return i + 1;
    return -1;
  }

  const STRONG = /\\[a-zA-Z]|[\^_]/;   /* what makes a run unmistakably maths */
  const TRAIL = /[.,;:!?\s]+$/;

  /* Is this ^ or _ a script, or is it punctuation in a word?
     `x_n` and `x^{2}` are scripts. `snake_case` is not: its base letter is part
     of a word. `_italic_` is not: it has no base at all. That one test is what
     lets markdown emphasis and auto-math share a line. */
  function isScript(s, i) {
    const prev = s[i - 1];
    if (prev == null) return false;
    if (/[A-Za-z]/.test(prev)) { if (/[A-Za-z]/.test(s[i - 2] || '')) return false; }
    else if (!/[0-9})\]]/.test(prev)) return false;
    const nx = s[i + 1];
    if (nx === '{') return brace(s, i + 1) > 0;
    if (!/[0-9A-Za-z]/.test(nx || '')) return false;
    return !/[0-9A-Za-z]/.test(s[i + 2] || '');
  }

  /* `*` is absent from both operator sets on purpose: it is markdown emphasis
     far more often than multiplication, and LaTeX writes a product as \cdot
     or \times anyway. */
  const BACK_OPS = '+-/=<>|&([{~^_';

  /* The math token that ENDS at k, as a start index, or -1. Used to grow a run
     leftwards so that `f(x) = \sqrt{x}` is one expression rather than three
     words and a fraction. */
  function tokenBack(s, k, floor) {
    if (k <= floor) return -1;
    const ch = s[k - 1];
    if (ch === '\x00') return -1;
    if (ch === '}' || ch === ')' || ch === ']') {
      const open = ch === '}' ? '{' : ch === ')' ? '(' : '[';
      let depth = 0;
      for (let j = k - 1; j >= floor; j--) {
        if (s[j] === ch) depth += 1;
        else if (s[j] === open) { depth -= 1; if (!depth) return j; }
      }
      return -1;
    }
    if (/[0-9]/.test(ch)) {
      let j = k;
      while (j - 1 > floor && /[0-9.]/.test(s[j - 2]) && /[0-9]/.test(s[j - 1])) j -= 1;
      while (j - 1 >= floor && /[0-9]/.test(s[j - 1])) j -= 1;
      return j;
    }
    if (/[A-Za-z]/.test(ch)) {
      if (/[A-Za-z]/.test(s[k - 2] || '')) return -1;   /* part of a word */
      return k - 1;
    }
    if (BACK_OPS.indexOf(ch) >= 0) return k - 1;
    return -1;
  }

  function extendLeft(s, from, floor) {
    let a = from;
    for (;;) {
      let k = a;
      while (k > floor && isSpace(s[k - 1])) k -= 1;
      if (k <= floor) break;
      const t = tokenBack(s, k, floor);
      if (t < 0) break;
      a = t;
    }
    return a;
  }

  function extendRight(s, from) {
    let j = from;
    for (;;) {
      let k = j;
      while (k < s.length && isSpace(s[k])) k += 1;
      if (k >= s.length) break;
      const next = token(s, k);
      if (next < 0) break;
      j = next;
    }
    return j;
  }

  /* Find every mathematical run in a prose segment and fence it in \( … \).
     Runs are collected as ranges first and merged, so two anchors in the same
     expression (`\lim_{n\to\infty} x_n`) produce ONE fence rather than two
     that overlap. */
  function autoMath(src) {
    const s = String(src);
    if (!STRONG.test(s)) return { text: s, stash: [] };

    /* regions that are verbatim and must never be fenced */
    const skip = [];
    for (let i = 0; i < s.length; i++) {
      if (s[i] !== '`') continue;
      const close = s.indexOf('`', i + 1);
      const end = close < 0 ? s.length : close + 1;
      skip.push([i, end]);
      i = end - 1;
    }
    const inSkip = i => skip.some(r => i >= r[0] && i < r[1]);
    const floorFor = i => {
      let f = -1;
      skip.forEach(function (r) { if (r[1] <= i && r[1] - 1 > f) f = r[1] - 1; });
      return f;
    };

    const runs = [];
    for (let i = 0; i < s.length; i++) {
      if (inSkip(i)) continue;
      const isCmd = s[i] === '\\' && /[a-zA-Z]/.test(s[i + 1] || '');
      const isScr = (s[i] === '^' || s[i] === '_') && isScript(s, i);
      if (!isCmd && !isScr) continue;
      if (runs.length && i < runs[runs.length - 1][1]) continue;   /* already inside one */

      const floor = Math.max(floorFor(i), runs.length ? runs[runs.length - 1][1] - 1 : -1);
      const a = extendLeft(s, i, floor);
      const b = extendRight(s, isCmd ? (token(s, i) < 0 ? i + 1 : token(s, i)) : i + 1);
      if (runs.length && a <= runs[runs.length - 1][1]) runs[runs.length - 1][1] = Math.max(b, runs[runs.length - 1][1]);
      else runs.push([a, b]);
      i = b - 1;
    }

    if (!runs.length) return { text: s, stash: [] };

    const stash = [];
    let out = '', at = 0;
    runs.forEach(function (r) {
      out += s.slice(at, r[0]);
      let run = s.slice(r[0], r[1]);
      const trail = TRAIL.exec(run);
      let tail = '';
      if (trail && trail.index > 0) { tail = trail[0]; run = run.slice(0, trail.index); }
      if (!run.trim()) { out += s.slice(r[0], r[1]); at = r[1]; return; }
      stash.push('\\(' + run + '\\)');
      out += '\x00M' + (stash.length - 1) + '\x00' + tail;
      at = r[1];
    });
    out += s.slice(at);
    return { text: out, stash: stash };
  }

  /* prose through the inline rules, maths through untouched */
  function spans(src) {
    return segments(src).map(function (seg) {
      if (seg.math) return seg.t;
      const auto = autoMath(seg.t);
      const html = inline(auto.text);
      if (!auto.stash.length) return html;
      return html.replace(/\x00M(\d+)\x00/g, (_, n) => auto.stash[+n]);
    }).join('');
  }

  /* One source line -> one HTML block. */
  function line(src) {
    const raw = String(src == null ? '' : src);
    const t = raw.trim();
    if (!t) return '';

    if (/^(---|\*\*\*|___)\s*$/.test(t)) return '<hr>';

    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) {
      const n = Math.min(h[1].length + 1, 5);
      return '<h' + n + ' class="md-h">' + spans(h[2]) + '</h' + n + '>';
    }

    const q = /^>\s?(.*)$/.exec(t);
    if (q) return '<blockquote class="md-q">' + spans(q[1]) + '</blockquote>';

    const ul = /^[-*+]\s+(.*)$/.exec(t);
    if (ul) return '<ul class="md-l"><li>' + spans(ul[1]) + '</li></ul>';

    const ol = /^(\d+)[.)]\s+(.*)$/.exec(t);
    if (ol) return '<ol class="md-l" start="' + ol[1] + '"><li>' + spans(ol[2]) + '</li></ol>';

    return '<p class="md-p">' + spans(raw) + '</p>';
  }

  /* Does this line carry an explicit maths delimiter? A maths-first box uses
     this to decide whether a delimiter-free line is bare LaTeX. It stays
     dollar-only on purpose: auto-math is for MIXED lines, and a maths-first box
     wants the whole line set as display maths, not one fenced run inside it. */
  const hasMath = src => /\$/.test(String(src || ''));

  /* Whole document, for export and for the read-only preview. */
  const doc = src => String(src || '').split('\n').map(line).join('\n');

  return { line, doc, hasMath, inline, segments, autoMath };
})();


/* ── src/core.store.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Progress store.

   Three things are tracked, and they are kept apart on purpose:

     completion   Level 1. You have encountered the material. Never evidence
                  of recall.
     proof work   Level 2. You have worked a proof through yourself. Awarded
                  per task, never for opening the note.
     first try    the FIRST recorded attempt at a card or a question. Later
                  attempts are allowed but never overwrite the first, because
                  the first attempt is the only honest measurement.

   The shape is built for merging. Two devices can both make progress offline,
   so every mutation is timestamped and every removal leaves a tombstone —
   merge(a,b) == merge(b,a), and merging twice changes nothing. core.sync.js
   depends on that and on nothing else.

   Storage is localStorage with an in-memory fallback so a locked-down browser
   degrades to a working-but-forgetful session instead of a broken one.
   ══════════════════════════════════════════════════════════════════════════ */

const Store = (function () {

  const KEY = 'ssc4.level1.v1';
  const EMPTY = {
    v: 2,
    done: {}, undone: {},        /* Level 1 completion + tombstones */
    proofs: {}, unproofs: {},    /* proof + exercise work (L2/L3) + tombstones */
    cards: {}, omr: {}, write: {},
    prefs: {}, prefsAt: {},
    updated: 0
  };

  let volatile = false;
  let state = load();
  const listeners = [];

  function blank() { return JSON.parse(JSON.stringify(EMPTY)); }

  /* v1 had no tombstones, no proof map and no per-key preference stamps.
     Everything it did have keeps its meaning, so the upgrade is a fill-in. */
  function upgrade(raw) {
    const s = Object.assign(blank(), raw || {});
    ['done', 'undone', 'proofs', 'unproofs', 'cards', 'omr', 'write', 'prefs', 'prefsAt']
      .forEach(function (k) { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
    s.v = 2;
    if (!s.updated) s.updated = Date.now();
    return s;
  }

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (!raw) return blank();
      return upgrade(JSON.parse(raw));
    } catch (e) {
      volatile = true;
      return blank();
    }
  }

  function write() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { volatile = true; }
  }

  const flush = DOM.debounce(write, 250);

  /* Write immediately, skipping the debounce. Anything the very next page load
     depends on has to go through here: a debounced write is still pending when
     `location.reload()` tears the page down, and signing in or out and then
     reloading would land back where you started. */
  function flushNow() { write(); }

  function save(quiet) {
    state.updated = Date.now();
    flush();
    if (!quiet) listeners.forEach(function (fn) { try { fn(); } catch (e) { /* a listener must never break a save */ } });
  }

  /* core.sync.js subscribes here; nothing else needs to. */
  function onChange(fn) { listeners.push(fn); }

  /* ── a tick with a tombstone, used by completion and by proof work ────── */
  function flag(on, off, id, want) {
    const now = Date.now();
    if (want) { state[on][id] = now; delete state[off][id]; }
    else { state[off][id] = now; delete state[on][id]; }
    save();
    return !!state[on][id];
  }

  /* ── completion (Level 1) ────────────────────────────────────────────── */
  const isDone = id => !!state.done[id];
  const setDone = (id, on) => flag('done', 'undone', id, on);

  /* Tick a whole list in one write — the prerequisite cascade. Returns the
     ids that actually changed, so the caller can report honestly. */
  function setDoneMany(ids, on) {
    const now = Date.now();
    const hit = [];
    (ids || []).forEach(function (id) {
      if (!!state.done[id] === !!on) return;
      hit.push(id);
      if (on) { state.done[id] = now; delete state.undone[id]; }
      else { state.undone[id] = now; delete state.done[id]; }
    });
    if (hit.length) save();
    return hit;
  }

  /* ── task work (Levels 2 and 3) ──────────────────────────────────────────
     One flag map for "I produced this myself", under two kinds of key:
       '<conceptId>'      a proof worked through          — earns level 2
       'w:<questionId>'   a written exercise worked out   — earns level 3
     They share a map because they are the same kind of claim and merge the
     same way; core.progress.js is what gives each key its meaning. */
  const isProofDone = id => !!state.proofs[id];
  const setProofDone = (id, on) => flag('proofs', 'unproofs', id, on);

  /* ── recall cards ────────────────────────────────────────────────────── */
  /* grade: 'got' | 'partly' | 'missed'

     `box` is the Leitner box the reel schedules from: it rises when you state
     a card, steps back when you half-state it and resets when you miss it.
     The interval each box buys is core.progress.js's business — this only has
     to store the number and, critically, MERGE it (see mergeAttempts). */
  const card = id => state.cards[id] || null;
  function gradeCard(id, grade) {
    const rec = state.cards[id] || (state.cards[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = grade;
    rec.lastAt = Date.now();
    rec.box = Progress.nextBox(rec.box, grade);
    if (!rec.first) { rec.first = grade; rec.firstAt = rec.lastAt; }  /* first attempt is final */
    save();
    return rec;
  }

  /* ── objective questions ─────────────────────────────────────────────── */
  const omr = id => state.omr[id] || null;
  function lockOmr(id, result) {
    const rec = state.omr[id] || (state.omr[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = { given: result.given, verdict: result.verdict, ms: result.ms, at: Date.now() };
    if (!rec.first) rec.first = rec.last;
    save();
    return rec;
  }

  /* ── writing drafts ──────────────────────────────────────────────────── */
  const draft = cid => (state.write[cid] && state.write[cid].tex) || '';
  function saveDraft(cid, tex) {
    if (!tex.trim()) delete state.write[cid];
    else state.write[cid] = { tex: tex, at: Date.now() };
    save();
  }

  /* ── preferences ─────────────────────────────────────────────────────── */
  const pref = (k, d) => (k in state.prefs ? state.prefs[k] : d);
  function setPref(k, v) {
    state.prefs[k] = v;
    state.prefsAt[k] = Date.now();
    save();
    return v;
  }

  /* ── the mastery level is no longer stored ────────────────────────
     It used to be a per-course switch with an unlock, and pressing it moved
     the goalposts under work that was already finished. The level is now
     DERIVED from what has actually been done — see core.progress.js — so there
     is nothing here to set. The old 'level:<course>' and 'level2:<course>'
     preferences are left where they are: they are inert, and deleting them
     would only make two devices argue about a key neither of them reads. */

  /* ── who is signed in ────────────────────────────────────────────────────
     Name and roll number are the credentials AND the sync key. They are a pass
     key, not a password, and every surface that shows them says so. */
  const identity = () => ({
    name: pref('syncName', ''),
    roll: pref('syncRoll', '')
  });
  const signedIn = () => {
    const id = identity();
    return !!(String(id.name).trim() && String(id.roll).trim());
  };
  function signIn(name, roll) {
    setPref('syncName', String(name || '').trim());
    setPref('syncRoll', String(roll || '').trim());
    flushNow();
    return signedIn();
  }
  function signOut() {
    setPref('syncName', '');
    setPref('syncRoll', '');
    flushNow();
  }

  /* ── aggregate stats over a given universe of ids ────────────────────── */
  function summary(conceptIds, cardIds, omrIds, proofIds) {
    const notes = conceptIds.filter(isDone).length;
    let tried = 0, got = 0, partly = 0;
    cardIds.forEach(function (id) {
      const r = state.cards[id];
      if (!r || !r.first) return;
      tried += 1;
      if (r.first === 'got') got += 1;
      else if (r.first === 'partly') partly += 1;
    });
    let locked = 0, right = 0, part = 0;
    omrIds.forEach(function (id) {
      const r = state.omr[id];
      if (!r || !r.first) return;
      locked += 1;
      if (r.first.verdict === 'correct') right += 1;
      else if (r.first.verdict === 'partial') part += 1;
    });
    const pf = proofIds || [];
    return {
      notes: { done: notes, total: conceptIds.length },
      cards: { tried: tried, got: got, partly: partly, total: cardIds.length },
      omr: { locked: locked, correct: right, partial: part, total: omrIds.length },
      proofs: { done: pf.filter(isProofDone).length, total: pf.length }
    };
  }

  /* ── merging two devices ─────────────────────────────────────────────────
     Loss-free and order-independent. The rules follow from what each field
     means rather than from a single "newest wins": a first attempt is a
     measurement, so the EARLIER one survives; a tick is a decision, so the
     LATER one survives. */
  function mergeFlags(a, b, ta, tb) {
    const on = {}, off = {};
    [a, b].forEach(src => { for (const k in (src || {})) if (!(on[k] >= src[k])) on[k] = src[k]; });
    [ta, tb].forEach(src => { for (const k in (src || {})) if (!(off[k] >= src[k])) off[k] = src[k]; });
    for (const k in off) {
      if (!on[k]) continue;
      if (off[k] > on[k]) delete on[k];   /* un-ticked after the tick */
      else delete off[k];                 /* tombstone spent */
    }
    return { on: on, off: off };
  }

  function mergeAttempts(A, B, firstKey) {
    const out = {};
    const ids = {};
    for (const k in (A || {})) ids[k] = true;
    for (const k in (B || {})) ids[k] = true;
    for (const id in ids) {
      const x = (A || {})[id], y = (B || {})[id];
      if (!x || !y) { out[id] = JSON.parse(JSON.stringify(x || y)); continue; }
      const rec = { tries: Math.max(x.tries || 0, y.tries || 0) };

      /* the honest first attempt is the earliest one either device saw */
      const fx = x.first ? (x.firstAt || (x.first.at || 0)) : Infinity;
      const fy = y.first ? (y.firstAt || (y.first.at || 0)) : Infinity;
      const first = fx <= fy ? x : y;
      if (first.first) {
        rec.first = first.first;
        if (first.firstAt) rec.firstAt = first.firstAt;
      }

      /* the latest pass is the one worth showing */
      const lx = x.lastAt || (x.last && x.last.at) || 0;
      const ly = y.lastAt || (y.last && y.last.at) || 0;
      const last = lx >= ly ? x : y;
      if (last.last) {
        rec.last = last.last;
        if (last.lastAt) rec.lastAt = last.lastAt;
      }
      /* The schedule travels with the latest pass. Rebuilding the record field
         by field is what drops anything not named here, so a new field has to
         be added in BOTH places or every sync quietly resets it. */
      if (last.box != null) rec.box = last.box;
      out[id] = rec;
    }
    return out;
  }

  function mergeStates(A, B) {
    A = upgrade(A); B = upgrade(B);
    const done = mergeFlags(A.done, B.done, A.undone, B.undone);
    const proof = mergeFlags(A.proofs, B.proofs, A.unproofs, B.unproofs);

    const write = {};
    [A.write, B.write].forEach(function (src) {
      for (const k in (src || {})) {
        if (!write[k] || (src[k].at || 0) > (write[k].at || 0)) write[k] = src[k];
      }
    });

    /* preferences are per-key: the device that set it most recently wins, and
       a key with no stamp yields to one that has it */
    const prefs = {}, prefsAt = {};
    [[A.prefs, A.prefsAt, A.updated], [B.prefs, B.prefsAt, B.updated]].forEach(function (p) {
      const src = p[0] || {}, at = p[1] || {}, fallback = p[2] || 0;
      for (const k in src) {
        const t = at[k] || fallback;
        if (!(k in prefs) || t >= (prefsAt[k] || 0)) { prefs[k] = src[k]; prefsAt[k] = t; }
      }
    });

    return {
      v: 2,
      done: done.on, undone: done.off,
      proofs: proof.on, unproofs: proof.off,
      cards: mergeAttempts(A.cards, B.cards),
      omr: mergeAttempts(A.omr, B.omr),
      write: write, prefs: prefs, prefsAt: prefsAt,
      updated: Math.max(A.updated || 0, B.updated || 0)
    };
  }

  /* Adopt a merged state wholesale. `quiet` keeps the sync listener from
     firing on the state it has just pulled. */
  function adopt(next, quiet) {
    state = upgrade(next);
    save(quiet);
    return state;
  }

  const snapshot = () => JSON.parse(JSON.stringify(state));
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function reset() { state = blank(); save(); }

  /* what the summary tiles count, so two callers cannot disagree */
  function tally() {
    return {
      notes: Object.keys(state.done).length,
      proofs: Object.keys(state.proofs).length,
      cards: Object.keys(state.cards).filter(k => state.cards[k].first).length,
      omr: Object.keys(state.omr).filter(k => state.omr[k].first).length
    };
  }

  return {
    isDone, setDone, setDoneMany,
    isProofDone, setProofDone,
    card, gradeCard, omr, lockOmr, draft, saveDraft,
    pref, setPref,
    identity, signedIn, signIn, signOut,
    summary, exportJSON, reset, tally,
    snapshot, adopt, mergeStates, onChange, flushNow,
    isVolatile: () => volatile
  };
})();


/* ── src/core.sync.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Multi-device sync.

   Firebase Realtime Database over plain REST — no SDK, no npm, no auth
   handshake, nothing to load before the app can start. One GET and one PUT.

   The key is the learner's name and roll number. That is a pass key, not a
   password: anyone who knows both can read and write that record, and the UI
   says so plainly rather than implying a login. It is the right trade for a
   personal study record that has to follow one person between a phone and a
   laptop with no account to create.

   Every sync MERGES before it writes (Store.mergeStates), so two devices that
   both worked offline lose nothing and the order they reconnect in does not
   matter. Overwriting instead of merging is how a week of work disappears.
   ══════════════════════════════════════════════════════════════════════════ */

const Sync = (function () {

  const DB = 'https://task-dominion-default-rtdb.asia-southeast1.firebasedatabase.app';

  /* Mock and validated pools keep SEPARATE STORES — progress and the sign-in
     register both. Their ids do not mean the same things, and a name typed
     into the test build must never appear in, or merge with, the real record.
     This is the only place that mapping is decided.

        live   ssc4_ra_v1        ssc4_users_v1
        mock   ssc4_ra_mock_v1   ssc4_users_mock_v1

     AGY owns the live pair; see "Publishing" in HOOK_agy.md. */
  const LIVE = () => (typeof DATA_KIND !== 'undefined' && DATA_KIND === 'live');
  const NS = () => LIVE() ? 'ssc4_ra_v1' : 'ssc4_ra_mock_v1';
  const USERS = () => LIVE() ? 'ssc4_users_v1' : 'ssc4_users_mock_v1';

  let syncing = false;
  let pushT = 0;
  let last = { at: 0, ok: null, msg: '' };
  const watchers = [];

  const slug = s => String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  /* name + roll -> one stable key. Both are required: a roll number alone
     collides across colleges, a name alone collides across people.

     The separator is '--', not '.': a Realtime Database key may not contain
     '.', '$', '#', '[', ']' or '/', and a dotted key is rejected outright with
     "Invalid token in path". slug() collapses runs of separators, so '--' can
     never be produced by either half and the split stays unambiguous. */
  function keyFor(name, roll) {
    const a = slug(name), b = slug(roll);
    return (a && b) ? a + '--' + b : '';
  }

  const identity = () => Store.identity();

  function key() {
    const id = identity();
    return keyFor(id.name, id.roll);
  }

  const on = () => !!key();
  const url = () => DB + '/' + NS() + '/' + encodeURIComponent(key()) + '.json';
  const userUrl = () => DB + '/' + USERS() + '/' + encodeURIComponent(key()) + '.json';

  function announce(ok, msg) {
    last = { at: Date.now(), ok: ok, msg: msg };
    watchers.forEach(function (fn) { try { fn(last); } catch (e) { /* a watcher must never break a sync */ } });
  }

  const watch = fn => { watchers.push(fn); return last; };
  const status = () => ({ on: on(), key: key(), syncing: syncing, last: last });

  /* ── the one operation: pull, merge, push ─────────────────────────────── */
  function now(opts) {
    const o = opts || {};
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not connected.' });
    if (syncing) return Promise.resolve({ ok: false, msg: 'Already syncing.' });
    if (!window.fetch) return Promise.resolve({ ok: false, msg: 'This browser cannot sync.' });

    syncing = true;
    announce(null, 'Syncing…');
    const before = Store.tally();

    return window.fetch(url(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (remote) {
        let rs = null;
        if (remote && typeof remote === 'object' && typeof remote.payload === 'string') {
          try { rs = JSON.parse(remote.payload); } catch (e) { rs = null; }
        }
        const merged = Store.mergeStates(Store.snapshot(), rs);
        Store.adopt(merged, true);   /* quiet: do not re-trigger the auto-push */

        const body = JSON.stringify({
          payload: JSON.stringify(Store.snapshot()),
          updated: Date.now(),
          device: Store.pref('syncName', '') + ' · ' + (navigator.platform || 'device')
        });
        return window.fetch(url(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: body
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const after = Store.tally();
          const gained = {
            notes: after.notes - before.notes,
            proofs: after.proofs - before.proofs,
            cards: after.cards - before.cards,
            omr: after.omr - before.omr
          };
          const bits = [];
          if (gained.notes > 0) bits.push(gained.notes + ' ' + DOM.plural(gained.notes, 'note'));
          if (gained.proofs > 0) bits.push(gained.proofs + ' ' + DOM.plural(gained.proofs, 'proof'));
          if (gained.cards > 0) bits.push(gained.cards + ' ' + DOM.plural(gained.cards, 'card'));
          if (gained.omr > 0) bits.push(gained.omr + ' ' + DOM.plural(gained.omr, 'question'));
          const msg = bits.length
            ? 'Merged in ' + bits.join(', ') + ' from your other device'
            : 'Everything already in sync';
          syncing = false;
          announce(true, msg);
          if (bits.length && o.reload !== false && typeof Router !== 'undefined') Router.reload();
          if (!o.quiet) DOM.announce(msg + '.');
          return { ok: true, msg: msg, gained: gained };
        });
      })
      .catch(function (err) {
        syncing = false;
        const msg = /Failed to fetch|NetworkError/i.test(String(err && err.message))
          ? 'Offline — your progress is saved here and will sync when you are back.'
          : 'Sync failed: ' + ((err && err.message) || err);
        announce(false, msg);
        if (!o.quiet) DOM.announce(msg);
        return { ok: false, msg: msg };
      });
  }

  const schedule = () => {
    if (!on()) return;
    window.clearTimeout(pushT);
    pushT = window.setTimeout(() => now({ quiet: true, reload: false }), 1500);
  };

  /* ── signing in ──────────────────────────────────────────────────────────
     Registers the key in the sign-in store (or touches it if it is already
     there), then does a normal merge-sync so an existing record arrives before
     the first screen is drawn. Being offline is NOT a reason to refuse entry:
     the local record still opens, and the next sync reconciles it. */
  function hello() {
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not signed in.' });
    if (!window.fetch) return now({ quiet: true }).then(r => Object.assign({ returning: null }, r));

    const id = identity();
    return window.fetch(userUrl(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (rec) {
        const returning = !!(rec && rec.created);
        return window.fetch(userUrl(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: id.name, roll: id.roll,
            created: (rec && rec.created) || Date.now(),
            seen: Date.now(),
            visits: ((rec && rec.visits) || 0) + 1
          })
        }).then(() => returning);
      })
      .then(function (returning) {
        return now({ quiet: true }).then(function (r) {
          return {
            ok: true, returning: returning,
            msg: returning
              ? 'Welcome back — ' + (r.ok ? r.msg.charAt(0).toLowerCase() + r.msg.slice(1) : 'working offline for now')
              : 'New record created for ' + id.name + '.'
          };
        });
      })
      .catch(function () {
        return { ok: false, offline: true,
          msg: 'Offline — opening the record stored on this device. It will sync when you are back.' };
      });
  }

  /* ── connecting ──────────────────────────────────────────────────────── */
  function connect(name, roll) {
    const k = keyFor(name, roll);
    if (!k) return Promise.resolve({ ok: false, msg: 'Both a name and a roll number are needed.' });
    Store.signIn(name, roll);
    return now({ quiet: false });
  }

  function disconnect() {
    Store.signOut();
    announce(null, 'Signed out. Progress stays on this device.');
  }

  /* ── wiring ──────────────────────────────────────────────────────────── */
  /* Sync is automatic and has no button. Three things wake it: a change you
     made (pushed through `schedule`), coming back to the tab or the network,
     and a slow heartbeat while the tab is open — the last one is what makes a
     phone left on a desk pick up the laptop's work without being asked. */
  const PULL_EVERY = 60e3;

  function start() {
    Store.onChange(schedule);
    if (!on()) return;
    now({ quiet: true });
    /* coming back to the tab is the moment the other device's work matters */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) now({ quiet: true });
    });
    window.addEventListener('online', function () { now({ quiet: true }); });
    window.setInterval(function () {
      if (document.hidden || !navigator.onLine) return;
      now({ quiet: true });
    }, PULL_EVERY);
  }

  return { start, hello, connect, disconnect, now, status, watch, identity, keyFor, on };
})();


/* ── src/core.pool.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Content pool — one pass over the loaded data, then pure lookups.

   The app never reads the data globals directly; everything goes through here,
   so swapping mock data for the validated pool changes nothing above this line.

   Reads:  SYLLABI, SECTITLE, CONCEPTS, OBJECTIVE, QUESTIONS (optional),
           PYQ (optional — past-paper questions, filed per COURSE)
   Builds: concept index, section -> concepts, course/module for a section,
           the statement-card deck, and the inverted `tests` edge
           (concept -> questions that examine it).
   ══════════════════════════════════════════════════════════════════════════ */

const Pool = (function () {

  const byId = {};          /* concept id -> node */
  const bySec = {};         /* section id  -> [node] */
  const secMeta = {};       /* section id  -> {course, module} */
  const deck = [];          /* statement cards, in course order */
  const objFor = {};        /* concept id -> [objective question] */
  const writFor = {};       /* concept id -> [written question] */
  const writSec = {};       /* section id  -> [written question] */
  const neededBy = {};      /* concept id -> [concept that lists it in needs] */
  const background = [];    /* nodes with no section in any course */
  const pyqBy = {};         /* course id   -> [past-paper question] */
  let courses = [], objective = [], written = [], pyq = [];
  let titles = {}, extSecs = {}, mock = false;

  /* Data files declare top-level `const`s, which are global *lexical* bindings
     rather than window properties — so they are read by name, guarded with
     typeof. These five names, plus DATA_KIND, are the entire data contract. */
  function build() {
    courses = (typeof SYLLABI !== 'undefined' ? SYLLABI : []).slice();
    objective = (typeof OBJECTIVE !== 'undefined' ? OBJECTIVE : []).slice();
    written = (typeof QUESTIONS !== 'undefined' ? QUESTIONS : []).slice();
    pyq = (typeof PYQ !== 'undefined' ? PYQ : []).slice();
    titles = typeof SECTITLE !== 'undefined' ? SECTITLE : {};
    extSecs = typeof EXT_SECS !== 'undefined' ? EXT_SECS : {};
    const concepts = typeof CONCEPTS !== 'undefined' ? CONCEPTS : [];
    const kind = typeof DATA_KIND !== 'undefined' ? DATA_KIND : null;

    mock = kind === 'mock' || concepts.some(c => c.mock) || objective.some(q => q.mock);

    courses.forEach(course => (course.modules || []).forEach(mod =>
      (mod.secs || []).forEach(sec => { secMeta[sec] = { course: course, module: mod }; })));

    concepts.forEach(function (c) {
      byId[c.id] = c;
      if (c.sec && secMeta[c.sec]) (bySec[c.sec] || (bySec[c.sec] = [])).push(c);
      else background.push(c);
    });

    /* reverse prerequisite edges: "what does knowing this unlock?" */
    concepts.forEach(c => (c.needs || []).forEach(function (n) {
      (neededBy[n] || (neededBy[n] = [])).push(c);
    }));

    /* statement recall deck, ordered the way the courses are ordered */
    sections().forEach(s => s.concepts.forEach(c =>
      (c.cards || []).forEach(function (card, i) {
        if (card.kind !== 'state') return;
        deck.push({ id: c.id + '#' + i, cid: c.id, q: card.q, a: card.a, sec: c.sec,
          title: c.title, kind: c.kind });
      })));

    /* Past papers are filed on a COURSE, not on a section: a JAM question is
       set on the subject, not on Bartle §2.3. `course` is the only routing
       field the app needs; `sec` and `tests` are optional colour. */
    pyq.forEach(function (q) {
      const id = q.course || (q.sec && courseOfSec(q.sec) && courseOfSec(q.sec).id);
      if (!id) return;
      (pyqBy[id] || (pyqBy[id] = [])).push(q);
    });
    Object.keys(pyqBy).forEach(function (id) {
      pyqBy[id].sort(function (a, b) {
        if ((b.year || 0) !== (a.year || 0)) return (b.year || 0) - (a.year || 0);
        return (a.qno || 0) - (b.qno || 0);
      });
    });

    objective.forEach(q => (q.tests || []).forEach(t => (objFor[t] || (objFor[t] = [])).push(q)));
    written.forEach(q => (q.tests || []).forEach(t => (writFor[t] || (writFor[t] = [])).push(q)));

    /* Level 3 is a section-wide bar, so the exercises are indexed by section
       as well as by concept. A question reaches a section either by naming it
       (`sec`) or by testing a concept that lives in it — an exercise filed
       against two sections counts in both, and is listed once in each. */
    written.forEach(function (q) {
      const secs = {};
      if (q.sec) secs[q.sec] = true;
      (q.tests || []).forEach(function (t) {
        const c = byId[t];
        if (c && c.sec) secs[c.sec] = true;
      });
      Object.keys(secs).forEach(function (sec) {
        (writSec[sec] || (writSec[sec] = [])).push(q);
      });
    });
  }

  /* every in-course section, in display order */
  function sections(courseId) {
    const out = [];
    courses.forEach(function (course) {
      if (courseId && course.id !== courseId) return;
      (course.modules || []).forEach(mod => (mod.secs || []).forEach(sec => out.push({
        sec: sec, title: sectionTitle(sec), course: course, module: mod,
        concepts: bySec[sec] || []
      })));
    });
    return out;
  }

  const sectionTitle = sec => titles[sec] || ('Section ' + sec);
  const concept = id => byId[id] || null;
  const course = id => courses.filter(c => c.id === id)[0] || null;
  const courseOfSec = sec => (secMeta[sec] && secMeta[sec].course) || null;
  const moduleOfSec = sec => (secMeta[sec] && secMeta[sec].module) || null;
  const objectiveFor = cid => objFor[cid] || [];
  const writtenFor = cid => writFor[cid] || [];
  const writtenForSec = sec => writSec[sec] || [];
  const objectiveOne = id => objective.filter(q => q.id === id)[0] || null;

  /* Past papers for one course, newest paper first; every one of them when no
     course is named. */
  const pyqFor = courseId => courseId ? (pyqBy[courseId] || []).slice() : pyq.slice();

  function isExtSec(sec) {
    if (!sec) return false;
    if (extSecs[sec]) return true;
    const meta = secMeta[sec];
    if (meta && meta.module) {
      if (meta.module.ext) return true;
      if (meta.module.extSecs && meta.module.extSecs.indexOf(sec) >= 0) return true;
    }
    return false;
  }

  function isExt(conceptOrId) {
    const c = typeof conceptOrId === 'string' ? byId[conceptOrId] : conceptOrId;
    if (!c) return false;
    if (c.tier === 'ext') return true;
    if (c.sec && isExtSec(c.sec)) return true;
    return false;
  }

  /* concepts of the whole slice, in reading order */
  function conceptList(courseId, opts) {
    const o = opts || {};
    const out = [];
    sections(courseId).forEach(s => s.concepts.forEach(function (c) {
      if (!o.includeExt && isExt(c)) return;
      out.push(c);
    }));
    return out;
  }

  /* Prerequisite chain, deepest first, ending at `id` itself. Depth-first over
     `needs`, de-duplicated, cycle-safe — this is what the note view walks. */
  function chain(id, limit) {
    const out = [], seen = {};
    (function walk(at, depth) {
      if (!byId[at] || seen[at] || depth > (limit == null ? 4 : limit)) return;
      seen[at] = true;
      (byId[at].needs || []).forEach(n => walk(n, depth + 1));
      out.push(byId[at]);
    })(id, 0);
    return out;
  }

  const unlocks = id => (neededBy[id] || []).slice();

  /* previous / next concept in reading order across the whole pool */
  function neighbours(id) {
    const all = conceptList(null, { includeExt: true });
    const i = all.map(c => c.id).indexOf(id);
    if (i < 0) return { prev: null, next: null };
    return { prev: all[i - 1] || null, next: all[i + 1] || null };
  }

  /* ids used for progress denominators */
  const ids = {
    concepts: courseId => conceptList(courseId, { includeExt: false }).map(c => c.id),
    allConcepts: courseId => conceptList(courseId, { includeExt: true }).map(c => c.id),
    cards: () => deck.filter(c => !isExt(c.cid)).map(c => c.id),
    allCards: () => deck.map(c => c.id),
    objective: () => objective.map(q => q.id),
    /* Level 4's denominator: the past papers filed against a course. */
    pyq: courseId => pyqFor(courseId).map(q => q.id),
    /* Level 2 counts proof work, so its denominator is the concepts that
       actually carry a proof — not every note. */
    proofs: courseId => conceptList(courseId, { includeExt: false }).filter(c => c.proof).map(c => c.id),
    allProofs: courseId => conceptList(courseId, { includeExt: true }).filter(c => c.proof).map(c => c.id),
    /* Level 3's denominator: every exercise reachable from a course's own
       sections, de-duplicated, because one exercise may span two sections. */
    written: function (courseId) {
      const seen = {}, out = [];
      sections(courseId).forEach(s => writtenForSec(s.sec).forEach(function (q) {
        if (seen[q.id]) return;
        seen[q.id] = true;
        out.push(q.id);
      }));
      return out;
    }
  };

  return {
    build, sections, sectionTitle, concept, concepts: conceptList, course,
    courses: () => courses, courseOfSec, moduleOfSec, deck: () => deck,
    objective: () => objective, objectiveOne, objectiveFor, writtenFor, writtenForSec,
    written: () => written, pyq: pyqFor,
    background: () => background, chain, unlocks, neighbours, ids,
    isExtSec, isExt, isMock: () => mock
  };
})();


/* ── src/core.progress.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Levels, earned — never switched.

   There is no level control. A learner does not *choose* to be at level 2;
   they get there by working the proof. The level of a concept is derived, in
   one place, from what has actually been done:

     level 1   read. You have been through the material.                RED
     level 2   its proof worked through. A note with NO proof reaches    AMBER
               level 2 with the tick, because there is no proof to work.
     level 3   every exercise filed against this concept's SECTION       GREEN
               worked through. A section with NO exercises reaches
               level 3 with level 2, because there is nothing to work.

   Nothing is ever held back by a stage that does not exist: a definition with
   no proof, in a section with no exercises, is green the moment it is read.
   That is the whole of rule 12 — a missing stage promotes, it does not cap.

   A group (section, module, course) is at the level its *weakest* member has
   reached — all red before the group is red, all amber before the group is
   amber. That is what the coloured rings and bars draw.

   LEVEL 4 IS A COURSE RUNG AND ONLY A COURSE RUNG. Concepts, sections and
   modules top out at 3. A course reaches 4 — "all complete" — when every note
   in it is green AND every JAM past-paper question filed against it has been
   worked through. See `courseLevel`.

   `Store` knows four independent facts and nothing about courses: a concept
   was read, and a task was worked through (a proof, keyed on the concept id;
   an exercise, keyed 'w:<questionId>'; a past-paper question, keyed
   'p:<questionId>'). `Pool` knows structure and no progress. This is the one
   place the two meet, so "done" cannot mean two different things on two
   screens.
   ══════════════════════════════════════════════════════════════════════════ */

const Progress = (function () {

  const courseIdOf = function (c) {
    if (!c) return null;
    const course = Pool.courseOfSec(c.sec);
    return course ? course.id : null;
  };

  const hasProof = id => {
    const c = Pool.concept(id);
    return !!(c && c.proof);
  };

  /* ── level 3 tasks ───────────────────────────────────────────────────────
     The written/Bartle exercises attached to a section. They are stored in the
     same flag map as proof work, under a 'w:' key, so they merge across
     devices exactly like every other tick. */
  const taskKey = q => 'w:' + q.id;
  const taskDone = q => Store.isProofDone(taskKey(q));

  /* ── level 4 tasks ───────────────────────────────────────────────────────
     The JAM past-paper questions attached to a COURSE, under a 'p:' key. */
  const pyqKey = q => 'p:' + q.id;
  const pyqDone = q => Store.isProofDone(pyqKey(q));

  /* secTaskState is asked once per concept per repaint, so it is memoised and
     the cache is dropped whenever anything is written. */
  let secCache = {};
  if (Store.onChange) Store.onChange(function () { secCache = {}; });
  const dropCache = () => { secCache = {}; };

  function secTasks(sec) {
    const qs = (sec && Pool.writtenForSec) ? Pool.writtenForSec(sec) : [];
    const done = qs.filter(taskDone).length;
    /* `ready` is true for an EMPTY set too: nothing owed is nothing owed. */
    return { total: qs.length, done: done, ready: done === qs.length, list: qs };
  }

  function secTaskState(sec) {
    if (!sec) return { total: 0, done: 0, ready: true, list: [] };
    if (!secCache[sec]) secCache[sec] = secTasks(sec);
    return secCache[sec];
  }

  /* Every concept can now reach 3. The ceiling is kept as a function because
     three call sites ask it, but it no longer has anything to refuse. */
  const ceiling = () => 3;
  const ceilingOf = () => 3;

  /* ── the level of one concept ────────────────────────────────────────── */
  function level(id) {
    if (!Store.isDone(id)) return 0;
    if (hasProof(id) && !Store.isProofDone(id)) return 1;
    const c = Pool.concept(id);
    if (c && !secTaskState(c.sec).ready) return 2;
    return 3;
  }

  /* kept for the few places that only care whether a note has been met */
  const isDone = id => level(id) >= 1;

  /* ── the level of a whole course, 0–4 ────────────────────────────────────
     4 is reached only here, and only by a course: every note green, and every
     past-paper question under the course worked through. */
  function pyqState(courseId) {
    const qs = Pool.pyq(courseId);
    const done = qs.filter(pyqDone).length;
    return { total: qs.length, done: done, ready: qs.length > 0 && done === qs.length, list: qs };
  }

  function courseLevel(courseId) {
    const c = count(Pool.ids.concepts(courseId));
    if (c.min < 3) return c.min;
    return pyqState(courseId).ready ? 4 : 3;
  }

  /* ── ticking ─────────────────────────────────────────────────────────────
     One press advances one step, so the tick always has somewhere to go.
     Level 3 is deliberately NOT reachable from here: it is earned by working
     the section's exercises, not by pressing a box. */
  function advance(id) {
    const at = level(id);
    if (at === 0) {
      Store.setDone(id, true);
      if (!hasProof(id)) Store.setProofDone(id, true);
    } else if (at === 1) {
      Store.setProofDone(id, true);
    } else {
      clear(id);
    }
    dropCache();
    return level(id);
  }

  /* Mark a note read without ever pulling it back down — what the Complete
     button at the foot of an open note presses. */
  function complete(id) {
    if (!Store.isDone(id)) Store.setDone(id, true);
    if (!hasProof(id) && !Store.isProofDone(id)) Store.setProofDone(id, true);
    dropCache();
    return level(id);
  }

  function clear(id) {
    if (Store.isProofDone(id)) Store.setProofDone(id, false);
    Store.setDone(id, false);
    dropCache();
  }

  /* Put a list of concepts AT a given level (0, 1 or 2). Bulk ticking a
     section or a module runs through here, and so does the prerequisite
     cascade — which is why it takes a level rather than a boolean. */
  function setTo(ids, n) {
    const list = ids || [];
    const want = Math.max(0, Math.min(2, n));
    Store.setDoneMany(list, want >= 1);
    list.forEach(function (id) {
      const proof = hasProof(id);
      const on = want >= 2 || (want >= 1 && !proof);
      if (Store.isProofDone(id) !== on) Store.setProofDone(id, on);
    });
    dropCache();
  }

  /* one press on a section / module / course row */
  function advanceMany(ids) {
    const c = count(ids);
    if (!c.total) return 0;
    if (c.min === 0) setTo(ids, 1);
    else if (c.min === 1) setTo(ids, 2);
    else setTo(ids, 0);
    return count(ids).min;
  }

  /* ── counting ─────────────────────────────────────────────────────────────
     l1/l2/l3 are cumulative — "how many have reached at least this level" —
     because that is what the three-colour bar draws, and `min` is the level
     the whole group has reached. */
  function count(ids) {
    const list = ids || [];
    let l1 = 0, l2 = 0, l3 = 0, min = 3;
    list.forEach(function (id) {
      const v = level(id);
      if (v >= 1) l1 += 1;
      if (v >= 2) l2 += 1;
      if (v >= 3) l3 += 1;
      if (v < min) min = v;
    });
    if (!list.length) min = 0;
    return { total: list.length, l1: l1, l2: l2, l3: l3, min: min, done: l1 };
  }

  /* what a tick button should render: 'true' | 'mixed' | 'false' */
  function tickState(ids) {
    const c = count(ids);
    if (!c.total) return 'false';
    if (c.min >= 1) return 'true';
    return c.l1 ? 'mixed' : 'false';
  }

  /* ── prerequisites ───────────────────────────────────────────────────────
     A prerequisite is satisfied once it has been READ. Nothing more is asked:
     holding a note hostage to the proof work of everything under it made the
     groundwork look permanently outstanding, and that is not what a
     prerequisite is for. */
  const prereqTarget = () => 1;
  const prereqOk = prereqId => level(prereqId) >= 1;

  /* Prerequisites of `id` that have not been read. */
  function pendingPrereqs(id) {
    return Pool.chain(id).filter(x => x.id !== id && !prereqOk(x.id));
  }

  /* Raise them to level 1 — and no further, so a cascade never promotes work
     nobody did. */
  function raisePrereqs(id) {
    const pending = pendingPrereqs(id);
    pending.forEach(function (x) {
      if (level(x.id) < 1) setTo([x.id], 1);
    });
    dropCache();
    return pending.length;
  }

  /* ── the reel queue: spaced practice ─────────────────────────────────────
     The reel only ever shows material you have said you have met. Studying a
     statement you have never read is not recall, it is reading with extra
     steps.

     Four kinds of card, and each arrives by a different act — so ticking
     topics, proofs AND questions all feed the reel:

       statement   a ticked concept's 'state' card
       proof       a ticked concept that carries a proof
       question    an objective question whose tested concept has been read
       exercise    a written exercise you have marked complete

     Order is spaced practice, not a fixed ranking. Each card sits in a
     Leitner box that rises when you state it, holds when you half-state it
     and resets when you miss it; the box picks how long the card is put away
     for. Everything due (and everything never attempted) comes first, in
     RANDOM order — so no two passes are the same — and everything not yet due
     follows, soonest first. A card you know well is therefore a long way back
     without ever being dropped.

     Nothing repeats within a pass: the queue is a list, and the reel walks it
     once. */
  const HOUR = 3600e3, DAY = 24 * HOUR;
  const INTERVAL = [10 * 60e3, HOUR, DAY, 3 * DAY, 7 * DAY, 21 * DAY];

  function dueAt(cardId) {
    const rec = Store.card(cardId);
    if (!rec || !rec.lastAt) return 0;              /* never attempted — due now */
    const b = Math.max(0, Math.min(rec.box || 0, INTERVAL.length - 1));
    return rec.lastAt + INTERVAL[b];
  }

  /* what one grade does to the box — mirrored in Store.gradeCard */
  function nextBox(box, grade) {
    if (grade === 'got') return Math.min((box || 0) + 1, INTERVAL.length - 1);
    if (grade === 'partly') return Math.max(0, (box || 0) - 1);
    return 0;
  }

  function pool() {
    const out = [];

    Pool.deck().forEach(function (card, i) {
      if (!Store.isDone(card.cid)) return;
      out.push({
        kind: 'state', id: card.id, cid: card.cid, sec: card.sec,
        title: card.title, conceptKind: card.kind,
        q: card.q, a: card.a, order: i
      });
    });

    Pool.concepts(null, { includeExt: true }).forEach(function (c, i) {
      if (!c.proof || !Store.isDone(c.id)) return;
      out.push({
        kind: 'proof', id: c.id + '#proof', cid: c.id, sec: c.sec,
        title: c.title, conceptKind: c.kind, proof: c.proof, order: i + 0.5
      });
    });

    /* an objective question joins once anything it examines has been read */
    Pool.objective().forEach(function (q, i) {
      const tested = (q.tests || []).filter(id => Pool.concept(id));
      if (!tested.length || !tested.some(id => Store.isDone(id))) return;
      const c = Pool.concept(tested[0]);
      out.push({
        kind: 'question', id: 'q:' + q.id, cid: c.id, sec: q.sec || c.sec,
        title: c.title, conceptKind: q.type, question: q, order: 1000 + i
      });
    });

    /* an exercise joins once you have marked it worked through */
    Pool.written().forEach(function (q, i) {
      if (!taskDone(q)) return;
      const c = Pool.concept((q.tests || [])[0]);
      out.push({
        kind: 'exercise', id: 'x:' + q.id, cid: c ? c.id : null, sec: q.sec || (c && c.sec),
        title: q.title || (c ? c.title : q.id), conceptKind: 'exercise',
        question: q, order: 2000 + i
      });
    });

    return out;
  }

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function reel(opts) {
    const o = opts || {};
    const now = Date.now();
    let all = pool();
    if (o.onlyNew) all = all.filter(x => !(Store.card(x.id) || {}).first);
    if (o.exclude) all = all.filter(x => !o.exclude[x.id]);

    const due = [], later = [];
    all.forEach(function (x) {
      x.due = dueAt(x.id);
      (x.due <= now ? due : later).push(x);
    });
    shuffle(due);
    later.sort((a, b) => a.due - b.due);
    return due.concat(later);
  }

  /* every id the reel could ever contain, for the "n of m attempted" meter */
  function reelIds() {
    return pool().map(x => x.id);
  }

  return {
    level, courseLevel, ceiling, ceilingOf, isDone, hasProof, courseIdOf,
    advance, advanceMany, complete, clear, setTo,
    count, tickState,
    secTaskState, taskKey, taskDone,
    pyqKey, pyqDone, pyqState,
    prereqTarget, prereqOk, pendingPrereqs, raisePrereqs,
    reel, reelIds, nextBox, dueAt, dropCache
  };
})();


/* ── src/core.latex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   LaTeX commands, offered the way a code editor offers them.

   The brief asks for "a compact palette of the LaTeX commands needed for the
   current theorem … contextual and small rather than an indiscriminate
   reference manual." A sheet of keys at the bottom of the screen satisfied
   the letter of that and failed the thumb: on a phone it covers the input you
   are typing into, and finding one symbol among sixty is slower than knowing
   how to spell it.

   So the catalogue is now a completion source. Type `\va` and the matches
   appear inline above the keyboard, ranked with the commands this theorem
   actually uses first. Tap one, or press Tab. When nothing is being typed the
   same strip shows the contextual commands, so discovery still works by
   thumb — which is what the palette was really for.
   ══════════════════════════════════════════════════════════════════════════ */

const Latex = (function () {

  const CARET = String.fromCharCode(1);   /* never appears in typed LaTeX */

  /* show = what the learner sees, ins = what gets typed, cmd = the macro name,
     alt = extra words that should also find it. */
  const CATALOG = [
    { g: 'Greek', show: 'ε', cmd: 'varepsilon', ins: '\\varepsilon ', desc: 'epsilon' },
    { g: 'Greek', show: 'δ', cmd: 'delta', ins: '\\delta ', desc: 'delta' },
    { g: 'Greek', show: 'Δ', cmd: 'Delta', ins: '\\Delta ', desc: 'big delta' },
    { g: 'Greek', show: 'η', cmd: 'eta', ins: '\\eta ' },
    { g: 'Greek', show: 'θ', cmd: 'theta', ins: '\\theta ' },
    { g: 'Greek', show: 'λ', cmd: 'lambda', ins: '\\lambda ' },
    { g: 'Greek', show: 'α', cmd: 'alpha', ins: '\\alpha ' },
    { g: 'Greek', show: 'β', cmd: 'beta', ins: '\\beta ' },
    { g: 'Greek', show: 'γ', cmd: 'gamma', ins: '\\gamma ' },
    { g: 'Greek', show: 'μ', cmd: 'mu', ins: '\\mu ' },
    { g: 'Greek', show: 'σ', cmd: 'sigma', ins: '\\sigma ' },
    { g: 'Greek', show: 'φ', cmd: 'varphi', ins: '\\varphi ', desc: 'phi' },
    { g: 'Greek', show: 'π', cmd: 'pi', ins: '\\pi ' },
    { g: 'Greek', show: 'ω', cmd: 'omega', ins: '\\omega ' },

    { g: 'Logic', show: '∀', cmd: 'forall', ins: '\\forall ', desc: 'for all' },
    { g: 'Logic', show: '∃', cmd: 'exists', ins: '\\exists ', desc: 'there exists' },
    { g: 'Logic', show: '∄', cmd: 'nexists', ins: '\\nexists ', desc: 'no such' },
    { g: 'Logic', show: '⟹', cmd: 'implies', ins: '\\implies ', desc: 'implies' },
    { g: 'Logic', show: '⟺', cmd: 'iff', ins: '\\iff ', desc: 'if and only if' },
    { g: 'Logic', show: '⇒', cmd: 'Rightarrow', ins: '\\Rightarrow ' },
    { g: 'Logic', show: '¬', cmd: 'neg', ins: '\\neg ', desc: 'not' },
    { g: 'Logic', show: '∧', cmd: 'wedge', ins: '\\wedge ', desc: 'and' },
    { g: 'Logic', show: '∨', cmd: 'vee', ins: '\\vee ', desc: 'or' },
    { g: 'Logic', show: 'text', cmd: 'text', ins: '\\text{' + CARET + '}', desc: 'words inside maths' },

    { g: 'Sets', show: 'ℝ', cmd: 'mathbb', needle: '\\mathbb{R}', ins: '\\mathbb{R}', desc: 'the reals', alt: 'R reals' },
    { g: 'Sets', show: 'ℕ', cmd: 'mathbb', needle: '\\mathbb{N}', ins: '\\mathbb{N}', desc: 'the naturals', alt: 'N naturals' },
    { g: 'Sets', show: 'ℚ', cmd: 'mathbb', needle: '\\mathbb{Q}', ins: '\\mathbb{Q}', desc: 'the rationals', alt: 'Q rationals' },
    { g: 'Sets', show: 'ℤ', cmd: 'mathbb', needle: '\\mathbb{Z}', ins: '\\mathbb{Z}', desc: 'the integers', alt: 'Z integers' },
    { g: 'Sets', show: '∈', cmd: 'in', ins: '\\in ', desc: 'belongs to' },
    { g: 'Sets', show: '∉', cmd: 'notin', ins: '\\notin ', desc: 'not in' },
    { g: 'Sets', show: '⊆', cmd: 'subseteq', ins: '\\subseteq ' },
    { g: 'Sets', show: '⊂', cmd: 'subset', ins: '\\subset ' },
    { g: 'Sets', show: '∪', cmd: 'cup', ins: '\\cup ', desc: 'union' },
    { g: 'Sets', show: '∩', cmd: 'cap', ins: '\\cap ', desc: 'intersection' },
    { g: 'Sets', show: '⋃', cmd: 'bigcup', ins: '\\bigcup_{' + CARET + '}' },
    { g: 'Sets', show: '⋂', cmd: 'bigcap', ins: '\\bigcap_{' + CARET + '}' },
    { g: 'Sets', show: '∅', cmd: 'emptyset', ins: '\\emptyset ', desc: 'empty set' },
    { g: 'Sets', show: '∖', cmd: 'setminus', ins: '\\setminus ', desc: 'set difference' },
    { g: 'Sets', show: '{ }', cmd: 'lbrace', ins: '\\{' + CARET + '\\}', desc: 'braces', alt: 'set brace' },

    { g: 'Relations', show: '≤', cmd: 'le', ins: '\\le ', desc: 'at most' },
    { g: 'Relations', show: '≥', cmd: 'ge', ins: '\\ge ', desc: 'at least' },
    { g: 'Relations', show: '≠', cmd: 'ne', ins: '\\ne ', desc: 'not equal' },
    { g: 'Relations', show: '≈', cmd: 'approx', ins: '\\approx ' },
    { g: 'Relations', show: '≡', cmd: 'equiv', ins: '\\equiv ' },
    { g: 'Relations', show: '↦', cmd: 'mapsto', ins: '\\mapsto ' },
    { g: 'Relations', show: '≔', cmd: 'coloneqq', ins: ':= ', desc: 'defined as' },

    { g: 'Analysis', show: '→', cmd: 'to', ins: '\\to ', desc: 'tends to' },
    { g: 'Analysis', show: '∞', cmd: 'infty', ins: '\\infty ', desc: 'infinity' },
    { g: 'Analysis', show: 'sup', cmd: 'sup', ins: '\\sup ', desc: 'supremum' },
    { g: 'Analysis', show: 'inf', cmd: 'inf', ins: '\\inf ', desc: 'infimum' },
    { g: 'Analysis', show: 'lim', cmd: 'lim', ins: '\\lim_{' + CARET + '}', desc: 'limit' },
    { g: 'Analysis', show: 'limsup', cmd: 'limsup', ins: '\\limsup_{' + CARET + '}' },
    { g: 'Analysis', show: 'Σ', cmd: 'sum', ins: '\\sum_{' + CARET + '}^{}', desc: 'sum' },
    { g: 'Analysis', show: '∏', cmd: 'prod', ins: '\\prod_{' + CARET + '}^{}', desc: 'product' },
    { g: 'Analysis', show: '∫', cmd: 'int', ins: '\\int_{' + CARET + '}^{}', desc: 'integral' },
    { g: 'Analysis', show: '∂', cmd: 'partial', ins: '\\partial ' },
    { g: 'Analysis', show: '⋯', cmd: 'cdots', ins: '\\cdots ' },
    { g: 'Analysis', show: '…', cmd: 'ldots', ins: '\\ldots ' },
    { g: 'Analysis', show: 'f′', cmd: 'prime', ins: "f'(" + CARET + ')', desc: 'derivative' },

    { g: 'Structure', show: 'a⁄b', cmd: 'frac', ins: '\\frac{' + CARET + '}{}', desc: 'fraction' },
    { g: 'Structure', show: '√', cmd: 'sqrt', ins: '\\sqrt{' + CARET + '}', desc: 'square root' },
    { g: 'Structure', show: 'xⁿ', cmd: 'sup-script', ins: '^{' + CARET + '}', desc: 'superscript', alt: 'power exponent' },
    { g: 'Structure', show: 'xₙ', cmd: 'sub-script', ins: '_{' + CARET + '}', desc: 'subscript', alt: 'index' },
    { g: 'Structure', show: '|x|', cmd: 'abs', ins: '|' + CARET + '|', desc: 'absolute value', alt: 'modulus' },
    { g: 'Structure', show: '‖x‖', cmd: 'norm', ins: '\\|' + CARET + '\\|', desc: 'norm' },
    { g: 'Structure', show: '( )', cmd: 'left', ins: '\\left(' + CARET + '\\right)', desc: 'sized brackets' },
    { g: 'Structure', show: '[ ]', cmd: 'bracket', ins: '[' + CARET + ']' },
    { g: 'Structure', show: 'quad', cmd: 'quad', ins: '\\quad ', desc: 'wide space' },
    { g: 'Structure', show: 'cases', cmd: 'cases', ins: '\\begin{cases}' + CARET + '\\end{cases}', desc: 'case split' }
  ];

  /* what stays offered even when the statement does not use it */
  const CORE = ['varepsilon', 'delta', 'forall', 'exists', 'in', 'le', 'to',
    'frac', 'abs', 'sub-script', 'sup-script', 'mathbb', 'lim', 'text'];

  function macrosIn(tex) {
    const src = String(tex || '');
    const found = {};
    src.replace(/\\([a-zA-Z]+)/g, function (whole, m) { found[m] = true; return whole; });
    if (/_\{|_[a-zA-Z0-9]/.test(src)) found['sub-script'] = true;
    if (/\^\{|\^[a-zA-Z0-9]/.test(src)) found['sup-script'] = true;
    if (/\|/.test(src)) found['abs'] = true;
    return found;
  }

  /* Which catalogue entries this concept's own statement uses. These rank
     first everywhere — it is the whole of "contextual". */
  function usedBy(concept) {
    const src = String((concept && concept.statement) || '');
    const used = macrosIn(src);
    const taken = {};
    return CATALOG.filter(function (k) {
      const hit = k.needle ? src.indexOf(k.needle) >= 0 : !!used[k.cmd];
      if (!hit || taken[k.ins]) return false;
      taken[k.ins] = true;
      return true;
    });
  }

  /* ── completion ───────────────────────────────────────────────────────── */

  /* The token being typed: a backslash and the letters after it, ending at
     the caret. Returns null when the caret is not inside one. */
  function tokenAt(value, caret) {
    const upto = String(value || '').slice(0, caret);
    const m = /\\([a-zA-Z]*)$/.exec(upto);
    if (!m) return null;
    return { text: m[0], word: m[1], from: caret - m[0].length, to: caret };
  }

  const score = (k, word, ctx) => {
    const w = word.toLowerCase();
    const cmd = k.cmd.toLowerCase();
    const hay = (cmd + ' ' + (k.desc || '') + ' ' + (k.alt || '')).toLowerCase();
    let s = -1;
    if (!w) s = 40;
    else if (cmd === w) s = 100;
    else if (cmd.indexOf(w) === 0) s = 80 - cmd.length;
    else if (hay.indexOf(w) >= 0) s = 40 - cmd.length;
    if (s < 0) return s;
    if (ctx[k.ins]) s += 25;                      /* this theorem uses it */
    if (CORE.indexOf(k.cmd) >= 0) s += 6;
    return s;
  };

  /* Ranked completions for a partial command. `word` may be '' — that is the
     bare-backslash case, and it should still offer something useful. */
  function complete(word, concept, limit) {
    const ctx = {};
    usedBy(concept).forEach(k => { ctx[k.ins] = true; });
    const seen = {};
    return CATALOG
      .map(k => ({ k: k, s: score(k, String(word || ''), ctx) }))
      .filter(function (r) {
        if (r.s < 0 || seen[r.k.ins]) return false;
        seen[r.k.ins] = true;
        return true;
      })
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 12)
      .map(r => r.k);
  }

  /* The idle strip: what to offer when nothing is being typed. Contextual
     first, then the essentials, because a learner who does not know the
     spelling cannot start a completion at all. */
  function suggestions(concept, limit) {
    const ctx = usedBy(concept);
    const taken = {};
    ctx.forEach(k => { taken[k.ins] = true; });
    const core = CATALOG.filter(k => !taken[k.ins] && CORE.indexOf(k.cmd) >= 0);
    return ctx.concat(core).slice(0, limit || 14);
  }

  /* ── insertion ────────────────────────────────────────────────────────── */

  /* Replace [from,to) with `ins`. CARET marks where the caret should land.

     `opts.wrap` decides what happens to the text being replaced, and the two
     cases are genuinely different:

       wrap: true   the range is the user's SELECTION and CARET means "put it
                    here", so \sqrt{▮} around a selected x gives \sqrt{x}.
       wrap: false  the range is a half-typed command being replaced by the
                    completion, so it must be DISCARDED — keeping it turns
                    `\eps` + `$\varepsilon▮$` into `$\varepsilon\eps$`. */
  function splice(field, from, to, ins, opts) {
    const wrap = !opts || opts.wrap !== false;
    const val = field.value;
    const selected = wrap ? val.slice(from, to) : '';
    let text = ins, caretAt;
    const mark = text.indexOf(CARET);
    if (mark >= 0) {
      text = text.slice(0, mark) + selected + text.slice(mark + 1);
      caretAt = from + mark + selected.length;
    } else {
      caretAt = from + text.length;
    }
    field.value = val.slice(0, from) + text + val.slice(to);
    field.focus();
    try { field.setSelectionRange(caretAt, caretAt); } catch (e) { /* detached field */ }
    field.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* Insert at the caret, replacing the selection. */
  function insert(field, ins) {
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const b = field.selectionEnd == null ? a : field.selectionEnd;
    splice(field, a, b, ins);
  }

  /* Is the caret inside maths? Count the unescaped $ before it: an odd number
     means an inline span is open. `$$` counts as one delimiter either way, so
     a display block reads as "open" too, which is the answer we want. */
  function inMath(value, caret) {
    const upto = String(value || '').slice(0, caret);
    let n = 0;
    for (let i = 0; i < upto.length; i++) {
      if (upto[i] !== '$') continue;
      if (i && upto[i - 1] === '\\') continue;      /* an escaped \$ is a literal */
      if (upto[i + 1] === '$') { i += 1; }
      n += 1;
    }
    return n % 2 === 1;
  }

  /* Accept a completion: the partial command being typed is replaced whole.

     In a markdown line, a command typed in the middle of a sentence has to be
     wrapped in $…$ or it renders as literal backslash-text. Doing that at
     accept time is what lets someone write a paragraph and drop a symbol into
     it without stopping to think about delimiters. */
  function accept(field, entry, opts) {
    const o = opts || {};
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const tok = tokenAt(field.value, a);
    let ins = entry.ins;

    if (o.wrapInMath && !inMath(field.value, tok ? tok.from : a)) {
      const body = ins.replace(/\s+$/, '');
      const mark = body.indexOf(CARET);
      ins = mark >= 0
        ? '$' + body.slice(0, mark) + CARET + body.slice(mark + 1) + '$'
        : '$' + body + CARET + '$';
    }

    /* the half-typed command is replaced, never wrapped */
    if (tok) splice(field, tok.from, tok.to, ins, { wrap: false });
    else insert(field, ins);
  }

  return { CATALOG, CARET, usedBy, tokenAt, inMath, complete, suggestions, insert, splice, accept };
})();


/* ── src/ui.parts.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Shared view parts. Small builders every view reuses, so the views stay
   about study logic rather than markup.
   ══════════════════════════════════════════════════════════════════════════ */

const UI = (function () {

  const el = DOM.el;

  /* The page heading is also the focus target after a route change. */
  const title = (text, kicker) => el('div', {}, [
    kicker ? el('div', { class: 'kicker', text: kicker }) : null,
    el('h1', { tabindex: '-1', id: 'pagetitle', text: text })
  ]);

  function crumb(items) {
    const row = el('nav', { class: 'crumb', 'aria-label': 'Breadcrumb' });
    items.forEach(function (it, i) {
      if (i) row.appendChild(el('span', { 'aria-hidden': 'true', text: '›' }));
      row.appendChild(it.href
        ? el('a', { href: Router.href(it.href), text: it.text })
        : el('span', { text: it.text }));
    });
    return row;
  }

  /* authored HTML + TeX. Typeset by the caller via UI.math(node). */
  const prose = (html, cls) => el('div', { class: 'prose' + (cls ? ' ' + cls : ''), html: html || '' });
  const math = node => Tex.typeset(node);

  const kindBadge = c => el('span', { class: 'badge', text: c.kind || 'note' });

  const tierBadge = c => {
    if (typeof Pool !== 'undefined' && Pool.isExt && Pool.isExt(c)) {
      return el('span', { class: 'badge warn', text: 'outside syllabus' });
    }
    if (c.tier && c.tier !== 'core') {
      return el('span', { class: 'badge warn', text: c.tier === 'ext' ? 'outside syllabus' : c.tier });
    }
    return null;
