        el('div', { class: 'b' }, [
          el('div', { class: 'prose tight', html: item.a }),
          el('div', { class: 'row', style: { marginTop: '12px' } }, [
            el('a', { class: 'chip', href: Router.href('note/' + item.cid),
              text: 'Full note · ' + concept.title })
          ])
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, onGraded, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.gate({
      hint: 'State it from memory first — write it out, or say it aloud and declare the attempt.',
      actions: [
        { label: 'Write it out', primary: true, onClick: function () {
            DOM.clear(writeHost);
            const wb = WriteBox.mount(writeHost, {
              concept: concept, label: 'Your statement',
              onFirstInput: function () { unlock('Attempt registered — you can reveal now.'); }
            });
            wb.focus();
          } },
        { label: 'I stated it aloud', onClick: function () { unlock('Attempt registered.'); } },
        { label: "I can't state it", onClick: function () { reveal('missed'); } }
      ]
    }));

    return el('div', { class: 'inner' }, [
      head(item, index, total, 'statement'),
      el('div', { class: 'prose', style: { fontSize: '1.12rem' }, html: item.q }),
      gateHost, writeHost, answerHost
    ]);
  }

  /* ── a proof card (Level 2 only) ─────────────────────────────────────────
     The ask is the strategy, not the write-up: if you can say why the proof
     goes the way it does, the steps follow. So the reveal leads with `idea`
     and `why`, and the rungs are there to check yourself against. */
  function proofCard(item, index, total, goNext, onGraded) {
    const concept = Pool.concept(item.cid);
    const p = item.proof;
    let revealed = false;
    const gateHost = el('div', {});
    const writeHost = el('div', {});
    const answerHost = el('div', {});

    function unlock(msg) {
      DOM.clear(gateHost);
      gateHost.appendChild(el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: 'Show the argument',
          on: { click: function () { reveal(); } } })
      ]));
      if (msg) DOM.announce(msg);
    }

    function reveal(preGrade) {
      if (revealed) return;
      revealed = true;
      DOM.clear(gateHost);
      DOM.clear(answerHost);
      answerHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: 'The argument' })]),
        el('div', { class: 'b', style: { display: 'grid', gap: '10px' } }, [
          p.idea ? el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
            el('div', { class: 'kicker', text: 'Key idea' }),
            el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
          ]) : null,
          p.why ? el('div', { class: 'prose tight', html: p.why }) : null,
          (p.rungs && p.rungs.length)
            ? el('div', { class: 'stack', style: { gap: '8px' } }, p.rungs.map(function (r, i) {
                return el('div', { class: 'card flat', style: { padding: '10px 14px' } }, [
                  el('div', { class: 'small muted', style: { marginBottom: '6px' } }, [
                    el('b', { text: 'Step ' + (i + 1) + ': ' }), el('span', { html: r.why })
                  ]),
                  r.m ? el('div', { html: r.m }) : null
                ]);
              }))
            : null,
          p.ends ? el('div', { class: 'prose tight', html: p.ends }) : null,
          el('div', { class: 'row' }, [
            el('a', { class: 'chip', href: Router.href('note/' + item.cid),
              text: 'Full note · ' + concept.title })
          ])
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, onGraded, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.gate({
      hint: 'Say how the proof goes before you look — the main move, and why it works.',
      actions: [
        { label: 'Sketch it', primary: true, onClick: function () {
            DOM.clear(writeHost);
            const wb = WriteBox.mount(writeHost, {
              draftKey: 'proof:' + concept.id, concept: concept,
              label: 'Your sketch of the argument',
              placeholder: 'The main move is…',
              onFirstInput: function () { unlock('Attempt registered — you can reveal now.'); }
            });
            wb.focus();
          } },
        { label: 'I said it aloud', onClick: function () { unlock('Attempt registered.'); } },
        { label: "I can't reconstruct it", onClick: function () { reveal('missed'); } }
      ]
    }));

    return el('div', { class: 'inner' }, [
      head(item, index, total, 'proof · level 2'),
      el('div', { class: 'prose', style: { fontSize: '1.12rem' } }, [
        el('b', { text: 'Reconstruct the proof of ' }),
        el('span', { text: concept.title + '.' }),
        el('p', { class: 'small muted', style: { margin: '8px 0 0' },
          text: 'The strategy and why it works, not the full write-up.' })
      ]),
      gateHost, writeHost, answerHost
    ]);
  }

  /* ── the reel ────────────────────────────────────────────────────────── */
  function render(args, query) {
    if (query && query.from) { startAt = query.from; onlyNew = false; }

    const reel = el('div', { class: 'reel', tabindex: '-1', 'aria-label': 'Recall reel' });
    const rail = el('div', { class: 'reel-rail', 'aria-hidden': 'true' });
    const root = el('div', {}, [
      el('h1', { id: 'pagetitle', tabindex: '-1', class: 'sr-only', text: 'Recall' }),
      rail, reel
    ]);

    function build() {
      const deck = Progress.reel({ onlyNew: onlyNew });
      DOM.clear(reel);
      DOM.clear(rail);

      const cards = [];
      const dots = [];

      /* Every card is exactly one viewport tall, so a card's position is
         index × clientHeight and nothing can drift. Overflowing content
         scrolls inside the card (.inner) and chains out at its ends. */
      const glide = i => {
        const to = cards[i];
        if (!to) return;
        reel.scrollTo({ top: to.offsetTop, behavior: DOM.reduced() ? 'auto' : 'smooth' });
      };

      cards.push(el('section', { class: 'reel-card' }, [introCard(deck, function () {
        build();
        reel.scrollTo({ top: 0, behavior: 'auto' });
      })]));

      deck.forEach(function (item, i) {
        const make = item.kind === 'proof' ? proofCard : statementCard;
        const section = el('section', { class: 'reel-card' }, [
          make(item, i + 1, deck.length,
            function () { glide(i + 2); },
            function (grade) {
              const dot = dots[i + 1];
              if (dot) dot.classList.toggle('got', grade === 'got');
            })
        ]);
        section.appendChild(el('div', { class: 'reel-hint' },
          [el('span', { text: i + 1 < deck.length ? 'swipe up for the next' : 'end of the reel' })]));
        cards.push(section);
      });

      if (!deck.length && onlyNew) {
        cards.push(el('section', { class: 'reel-card' }, [
          el('div', { class: 'inner' }, [
            UI.empty('Every card in your ticked material has had a first attempt.',
              el('button', { class: 'btn', type: 'button', text: 'Show everything again',
                on: { click: function () { onlyNew = false; build(); } } }))
          ])
        ]));
      }

      cards.forEach(function (c, i) {
        reel.appendChild(c);
        const dot = el('i');
        if (i && deck[i - 1]) {
          const r = Store.card(deck[i - 1].id);
          if (r && r.first === 'got') dot.classList.add('got');
          if (deck[i - 1].kind === 'proof') dot.classList.add('pf');
        }
        dots.push(dot);
        rail.appendChild(dot);
      });

      /* Mark the card in view. Cards are one viewport tall, so a simple
         majority-of-the-viewport test is both correct and cheap. */
      if (window.IntersectionObserver) {
        const io = new window.IntersectionObserver(function (entries) {
          entries.forEach(function (e) {
            const seen = e.intersectionRect ? e.intersectionRect.height : 0;
            const port = (e.rootBounds && e.rootBounds.height) || reel.clientHeight || 1;
            const live = e.isIntersecting && seen / port > 0.55;
            e.target.classList.toggle('live', live);
            if (live) {
              const i = cards.indexOf(e.target);
              Array.prototype.forEach.call(rail.children, (d, j) => d.classList.toggle('on', j === i));
            }
          });
        }, { root: reel, threshold: [0, 0.25, 0.56, 0.9, 1] });
        cards.forEach(c => io.observe(c));
      } else {
        cards.forEach(c => c.classList.add('live'));
        if (rail.firstChild) rail.firstChild.classList.add('on');
      }

      UI.math(reel);

      if (startAt) {
        const at = deck.map(c => c.cid).indexOf(startAt);
        startAt = null;
        if (at >= 0) window.requestAnimationFrame(function () {
          reel.scrollTo({ top: cards[at + 1].offsetTop, behavior: 'auto' });
        });
      }
    }

    /* Keyboard moves exactly one card, like the swipe. Content that overflows
       is reached by scrolling inside the card, which the browser does for us
       when the focus is in there. */
    reel.addEventListener('keydown', function (e) {
      const keys = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 };
      const dir = keys[e.key];
      if (!dir) return;
      if (/^(TEXTAREA|INPUT|SELECT)$/.test((e.target.tagName || '').toUpperCase())) return;
      e.preventDefault();
      const h = reel.clientHeight || 1;
      const last = reel.children.length - 1;
      const at = Math.round(reel.scrollTop / h);
      const to = Math.max(0, Math.min(last, at + dir));
      reel.scrollTo({ top: to * h, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });

    build();
    return root;
  }

  return { render, wrapClass: 'wrap bleed' };
})();


/* ── src/view.omr.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Objective questions, OMR first.

   HOOK_claude.md: show the OMR-style question first; the learner chooses an
   answer before seeing the solution; then show (1) whether the choice was
   correct, (2) the complete worked answer, (3) the theorem/definition/trap
   involved, (4) a short changed-version follow-up when useful.

   MCQ, MSQ and NAT are scored by their own rules, not one shared rule:
     MCQ  one key; a wrong lock costs the negative mark
     MSQ  the exact set is required; a clean subset is reported as partial and
          earns nothing, which is the convention these papers use
     NAT  numeric within the stated tolerance; no negative marking
   Only the first lock is recorded.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewOmr = (function () {

  const el = DOM.el;

  /* ── scoring ───────────────────────────────────────────────────────────── */
  function judge(q, given) {
    if (q.type === 'MCQ') {
      return given === q.answer ? 'correct' : 'wrong';
    }
    if (q.type === 'MSQ') {
      const key = q.answer.slice().sort().join(',');
      const got = given.slice().sort().join(',');
      if (key === got) return 'correct';
      const noWrong = given.every(k => q.answer.indexOf(k) >= 0);
      return (noWrong && given.length) ? 'partial' : 'wrong';
    }
    const n = parseFloat(String(given).replace(/[^0-9eE+\-.]/g, ''));
    if (!isFinite(n)) return 'wrong';
    return Math.abs(n - q.answer.value) <= (q.answer.tol || 0) + 1e-12 ? 'correct' : 'wrong';
  }

  const awarded = (q, verdict) =>
    verdict === 'correct' ? q.marks : (q.type === 'MCQ' ? (q.neg || 0) : 0);

  const keyText = q => q.type === 'NAT'
    ? q.answer.value.toFixed(q.answer.dp || 0) + (q.answer.tol ? ' (± ' + q.answer.tol + ')' : '')
    : (Array.isArray(q.answer) ? q.answer.join(' and ') : q.answer);

  const givenText = (q, given) => q.type === 'NAT'
    ? String(given)
    : (Array.isArray(given) ? (given.slice().sort().join(' and ') || '—') : given);

  /* ── list ──────────────────────────────────────────────────────────────── */
  let filter = 'all';

  function list(query) {
    const root = el('div', { class: 'stack' });
    const sec = query && query.sec;
    const chips = el('div', { class: 'row' });
    const host = el('div', {});

    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: fn } });

    function paint() {
      let qs = Pool.objective();
      if (sec) qs = qs.filter(q => q.sec === sec);
      if (filter === 'new') qs = qs.filter(q => !(Store.omr(q.id) || {}).first);
      else if (filter !== 'all') qs = qs.filter(q => q.type === filter);

      DOM.clear(chips);
      DOM.add(chips, ['all', 'new', 'MCQ', 'MSQ', 'NAT'].map(f => chip(
        f === 'all' ? 'All' : f === 'new' ? 'Not attempted' : f,
        filter === f, function () { filter = f; paint(); })));

      DOM.clear(host);
      if (!qs.length) { host.appendChild(UI.empty('Nothing matches that filter.')); return; }

      host.appendChild(el('div', { class: 'list' }, qs.map(function (q, i) {
        const rec = Store.omr(q.id);
        const v = rec && rec.first && rec.first.verdict;
        return el('a', { class: 'item', href: Router.href('omr/' + q.id) }, [
          el('span', { class: 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : '') },
            [v ? DOM.mi(v === 'correct' ? 'check' : v === 'wrong' ? 'close' : 'remove', 'xs')
               : el('span', { text: String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: '§' + q.sec + '  ' + Pool.sectionTitle(q.sec) }),
            el('span', { text: q.type + ' · ' + q.marks + ' ' + DOM.plural(q.marks, 'mark') +
              ' · ' + (v ? 'first attempt: ' + v : (q.neg ? (q.negLabel || q.neg) + ' if wrong' : 'no negative')) })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      })));
    }

    const s = Store.summary([], [], Pool.ids.objective());
    DOM.add(root, [
      UI.title('Questions', 'Answer first, then the full solution'),
      UI.mockBanner(),
      el('div', { class: 'card tint' }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'kicker', text: 'First attempts' }),
          el('span', { class: 'count',
            text: s.omr.locked + ' of ' + s.omr.total + ' locked · ' + s.omr.correct + ' correct' })
        ]),
        el('div', { style: { marginTop: '8px' } }, [UI.meter(s.omr.locked, s.omr.total)])
      ]),
      sec ? el('div', { class: 'row' }, [
        el('span', { class: 'badge accent', text: '§' + sec }),
        el('a', { class: 'chip', href: Router.href('omr'), text: 'clear section filter' })
      ]) : null,
      chips, host
    ]);
    paint();
    return root;
  }

  /* The figure of the first tested concept that has one — seeing the picture
     right after the attempt is when it lands hardest. */
  function figureFor(q) {
    const withFig = (q.tests || [])
      .map(id => Pool.concept(id))
      .filter(c => c && Fig.forConcept(c).length)[0];
    if (!withFig) return null;
    const def = Fig.forConcept(withFig)[0].def;
    return el('div', { class: 'stack', style: { gap: '8px' } }, [
      el('div', { class: 'kicker', text: 'The picture behind it' }),
      Fig.frame(def)
    ]);
  }

  /* ── one question ──────────────────────────────────────────────────────── */
  function detail(q) {
    const root = el('div', { class: 'stack' });
    const rec = Store.omr(q.id);
    const already = rec && rec.first;

    let given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
    let locked = false;
    const started = Date.now();

    const sheetHost = el('div', {});
    const actionHost = el('div', {});
    const resultHost = el('div', {});

    const timer = el('span', { class: 'timer', text: '0:00' });
    const tick = window.setInterval(function () {
      /* stop on lock, and stop once this view has been replaced */
      if (locked || !document.body.contains(timer)) { window.clearInterval(tick); return; }
      timer.textContent = UI.clock(Date.now() - started);
    }, 1000);

    /* — OMR sheet — */
    function paintSheet(focusIdx) {
      DOM.clear(sheetHost);

      if (q.type === 'NAT') {
        const input = el('input', {
          type: 'text', inputmode: 'decimal', autocomplete: 'off',
          'aria-label': 'Your numeric answer', placeholder: '0.00',
          disabled: locked || null
        });
        input.value = q.type === 'NAT' && typeof given === 'string' ? given : '';
        input.addEventListener('input', function () { given = input.value; paintActions(); });
        sheetHost.appendChild(el('div', { class: 'nat-in' }, [
          input,
          el('span', { class: 'small muted', text: q.answer.dp
            ? 'to ' + q.answer.dp + ' decimal places' : 'integer' })
        ]));
        if (locked) {
          sheetHost.appendChild(el('p', { class: 'small muted', style: { margin: '8px 0 0' },
            text: 'Accepted range: ' + keyText(q) }));
        }
        return;
      }

      const msq = q.type === 'MSQ';
      const group = el('div', {
        class: 'omr', role: msq ? 'group' : 'radiogroup',
        'aria-label': msq ? 'Select all correct options' : 'Select one option'
      });

      q.options.forEach(function (opt) {
        const chosen = msq ? given.indexOf(opt.k) >= 0 : given === opt.k;
        const isKey = locked && (msq ? q.answer.indexOf(opt.k) >= 0 : q.answer === opt.k);
        const badChoice = locked && chosen && !isKey;

        const row = el('button', {
          class: 'omr-opt' + (msq ? ' msq' : '') + (isKey ? ' key' : '') + (badChoice ? ' chosen-bad' : ''),
          type: 'button',
          role: msq ? 'checkbox' : 'radio',
          'aria-checked': String(chosen),
          'aria-disabled': locked ? 'true' : null
        }, [
          el('span', { class: 'bub', 'aria-hidden': 'true', text: opt.k }),
          el('span', { class: 't', html: opt.t }),
          locked && isKey ? el('span', { class: 'omr-mark ok', text: 'key' }) : null,
          badChoice ? el('span', { class: 'omr-mark bad', text: 'yours' }) : null
        ]);

        if (!locked) row.addEventListener('click', function () {
          if (msq) {
            const i = given.indexOf(opt.k);
            if (i >= 0) given.splice(i, 1); else given.push(opt.k);
          } else given = opt.k;
          paintSheet(q.options.indexOf(opt));   /* keep focus on the row just used */
          paintActions();
        });
        group.appendChild(row);
      });

      /* arrow-key movement inside the group, as a radiogroup should behave */
      group.addEventListener('keydown', function (e) {
        if (locked) return;
        const keys = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'];
        if (keys.indexOf(e.key) < 0) return;
        e.preventDefault();
        const rows = Array.prototype.slice.call(group.querySelectorAll('.omr-opt'));
        const at = rows.indexOf(document.activeElement);
        const dir = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
        const nextRow = rows[(at + dir + rows.length) % rows.length];
        if (nextRow) nextRow.focus();
      });

      sheetHost.appendChild(group);
      if (focusIdx != null) {
        const rows = group.querySelectorAll('.omr-opt');
        if (rows[focusIdx]) rows[focusIdx].focus({ preventScroll: true });
      }
      UI.math(group);
    }

    /* — lock / clear — */
    function hasAnswer() {
      if (q.type === 'MSQ') return given.length > 0;
      if (q.type === 'NAT') return String(given).trim().length > 0;
      return !!given;
    }

    function paintActions() {
      DOM.clear(actionHost);
      if (locked) return;
      DOM.add(actionHost, [
        el('div', { class: 'btn-row' }, [
          el('button', {
            class: 'btn primary', type: 'button', disabled: hasAnswer() ? null : true,
            text: q.type === 'MSQ' ? 'Lock ' + (given.length || 'no') + ' selected' : 'Lock answer',
            on: { click: lock }
          }),
          hasAnswer() ? el('button', { class: 'btn', type: 'button', text: 'Clear',
            on: { click: function () {
              given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
              paintSheet(); paintActions();
            } } }) : null
        ]),
        el('p', { class: 'small muted', style: { margin: '10px 0 0' },
          text: already
            ? 'Your first attempt (' + already.verdict + ') is already on record; this pass is not recorded.'
            : 'Locking records your first attempt. The worked answer follows immediately.' })
      ]);
    }

    function lock() {
      if (locked || !hasAnswer()) return;
      locked = true;
      const verdict = judge(q, given);
      const ms = Date.now() - started;
      const saved = Store.lockOmr(q.id, { given: given, verdict: verdict, ms: ms });
      paintSheet();
      DOM.clear(actionHost);
      resultHost.appendChild(feedback(q, given, verdict, ms, saved));
      UI.math(resultHost);
      DOM.announce(verdict === 'correct' ? 'Correct.' : verdict === 'partial'
        ? 'Partially correct — no marks under this paper’s rule.' : 'Incorrect. Worked answer shown.');
      const h = resultHost.querySelector('.verdict');
      if (h) h.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    /* — after the lock: verdict, worked answer, what it tests, trap, twist — */
    function feedback(q, given, verdict, ms, saved) {
      const wrap = el('div', { class: 'stack' });
      const marks = awarded(q, verdict);
      const cls = verdict === 'correct' ? 'ok' : verdict === 'partial' ? 'warn' : 'bad';
      const glyph = verdict === 'correct' ? 'check_circle' : verdict === 'partial' ? 'remove_circle' : 'cancel';

      DOM.add(wrap, [
        el('div', { class: 'verdict ' + cls }, [
          el('span', { class: 'g', 'aria-hidden': 'true' }, [DOM.mi(glyph)]),
          el('span', {}, [
            el('b', { text: verdict === 'correct' ? 'Correct' : verdict === 'partial'
              ? 'Partially correct — this paper awards nothing for a partial set' : 'Not correct' }),
            el('span', { text: 'You answered ' + givenText(q, given) + ' · key ' + keyText(q) +
              ' · ' + (marks > 0 ? '+' : '') + (Math.round(marks * 100) / 100) + ' ' +
              DOM.plural(Math.abs(marks), 'mark') + ' · ' + UI.clock(ms) })
          ])
        ]),

        saved.tries > 1 ? el('p', { class: 'small muted', style: { margin: 0 },
          text: 'First attempt (' + saved.first.verdict + ') is unchanged — that is the number the stats use.' }) : null,

        el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: 'Worked answer' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.solution, 'tight')])
        ]),

        el('div', { class: 'card tint' }, [
          el('div', { class: 'kicker', text: 'What this actually tests' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.tested, 'tight')]),
          el('div', { class: 'row', style: { marginTop: '12px' } }, (q.tests || []).map(function (id) {
            const c = Pool.concept(id);
            return c
              ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
              : el('span', { class: 'chip ghost', text: id });
          }))
        ]),

        /* the picture of the idea being examined, where there is one */
        figureFor(q),

        q.trap ? el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: 'The trap' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.trap, 'tight')])
        ]) : null,

        q.twist ? UI.reveal('Changed version', function () {
          return el('div', { class: 'stack', style: { gap: '10px' } }, [
            UI.prose(q.twist.q, 'tight'),
            UI.reveal('Answer', () => UI.prose(q.twist.a, 'tight'),
              { openLabel: 'Show', closeLabel: 'Hide' })
          ]);
        }, { openLabel: 'Try the variant', closeLabel: 'Hide the variant' }) : null,

        el('div', { class: 'btn-row' }, [
          nextLink(q), el('a', { class: 'btn', href: Router.href('omr'), text: 'All questions' })
        ])
      ]);
      return wrap;
    }

    function nextLink(q) {
      const all = Pool.objective();
      const i = all.map(x => x.id).indexOf(q.id);
      const unattempted = all.slice(i + 1).concat(all.slice(0, i))
        .filter(x => !(Store.omr(x.id) || {}).first)[0];
      const next = unattempted || all[(i + 1) % all.length];
      return el('a', { class: 'btn primary', href: Router.href('omr/' + next.id),
        text: unattempted ? 'Next unattempted question' : 'Next question' });
    }

    /* — header — */
    DOM.add(root, [
      UI.crumb([{ text: 'Questions', href: 'omr' },
        { text: '§' + q.sec + ' ' + Pool.sectionTitle(q.sec) }]),
      el('div', { class: 'card' }, [
        el('div', { class: 'spread' }, [
          el('div', { class: 'row' }, [
            UI.typeBadge(q),
            q.mock ? el('span', { class: 'badge warn', text: 'draft' }) : null
          ]),
          timer
        ]),
        el('div', { style: { marginTop: '10px' } }, [UI.metaRow(q)]),
        el('div', { style: { marginTop: '14px' } }, [
          el('h1', { tabindex: '-1', id: 'pagetitle', class: 'sr-only',
            text: q.type + ' question on ' + Pool.sectionTitle(q.sec) }),
          UI.prose(q.prompt)
        ]),
        el('div', { style: { marginTop: '16px' } }, [sheetHost]),
        el('div', { style: { marginTop: '16px' } }, [actionHost])
      ]),
      resultHost
    ]);

    paintSheet();
    paintActions();
    UI.math(root);
    return root;
  }

  function render(args, query) {
    if (args && args[0]) {
      const q = Pool.objectiveOne(args[0]);
      if (q) return detail(q);
      return el('div', { class: 'stack' }, [
        UI.title('Not found'),
        UI.empty('That question is not in the loaded bank.',
          el('a', { class: 'btn', href: Router.href('omr'), text: 'All questions' }))
      ]);
    }
    return list(query);
  }

  return { render, judge };
})();


/* ── src/view.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Theorem writing.

   The target is named but its statement is withheld: you write first, then
   compare. The canonical statement is behind a gate for the same reason the
   flashcard answer is — reading a statement is not writing one.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewWrite = (function () {

  const el = DOM.el;

  function picker() {
    const targets = Pool.concepts();
    return el('div', { class: 'stack' }, [
      UI.title('Write a statement', 'LaTeX, with the palette beside you'),
      el('p', { class: 'lede small' },
        ['Pick what to write from memory. You type the maths fragment only — the palette offers ' +
         'exactly the commands that statement needs, and the rendering appears under the input.']),
      el('div', { class: 'list' }, targets.map(function (c) {
        const has = !!Store.draft(c.id);
        return el('a', { class: 'item', href: Router.href('write/' + c.id) }, [
          el('span', { class: 'ix' + (has ? ' ok' : '') },
            [DOM.mi(has ? 'edit_note' : 'radio_button_unchecked', 'xs')]),
          el('span', { class: 'tt' }, [
            el('b', { text: c.title }),
            el('span', { text: '§' + c.sec + ' · ' + c.kind + (has ? ' · draft saved' : '') })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      }))
    ]);
  }

  function workspace(c) {
    const root = el('div', { class: 'stack' });
    const boxHost = el('div', { class: 'card' });
    const compareHost = el('div', {});

    const wb = WriteBox.mount(boxHost, { concept: c, label: 'Your statement, in LaTeX' });

    function compare() {
      DOM.clear(compareHost);
      compareHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: 'Canonical statement' })]),
        el('div', { class: 'b' }, [
          UI.prose(c.statement, 'tight'),
          el('p', { class: 'small muted', style: { margin: '12px 0 0' },
            text: 'Compare the quantifiers and the hypotheses first — that is where written answers lose marks, ' +
              'not in the algebra.' }),
          el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
            el('a', { class: 'btn', href: Router.href('note/' + c.id), text: 'Open the full note' }),
            el('a', { class: 'btn', href: Router.href('recall?from=' + encodeURIComponent(c.id)),
              text: 'Grade it as recall' })
          ])
        ])
      ]));
      UI.math(compareHost);
      DOM.announce('Canonical statement revealed.');
    }

    const gate = UI.gate({
      hint: 'Write your version above first. The canonical statement stays hidden until you ask for it.',
      actions: [
        { label: 'Compare with the canonical statement', primary: true, onClick: function () {
            if (!wb.hasContent() &&
              !window.confirm('Nothing is written yet. Reveal the statement anyway?')) return;
            compare();
          } }
      ]
    });

    DOM.add(root, [
      UI.crumb([{ text: 'Write', href: 'write' }, { text: '§' + c.sec }]),
      el('div', {}, [
        el('div', { class: 'row', style: { marginBottom: '8px' } }, [UI.kindBadge(c), UI.levelBadge(c.id)]),
        UI.title(c.title, 'Write the statement of')
      ]),
      el('p', { class: 'lede', text: c.oneLine }),
      boxHost,
      gate,
      compareHost
    ]);

    UI.math(root);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const c = Pool.concept(args[0]);
      if (c) return workspace(c);
    }
    return picker();
  }

  return { render };
})();


/* ── src/boot.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Boot: theme, data loading, navigation, routing, failure surfaces.
   ══════════════════════════════════════════════════════════════════════════ */

const Theme = (function () {
  const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function apply() {
    const pref = Store.pref('theme', 'auto');
    const dark = pref === 'dark' || (pref === 'auto' && media && media.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#101216' : '#faf8f4');
  }

  if (media && media.addEventListener) {
    media.addEventListener('change', function () {
      if (Store.pref('theme', 'auto') === 'auto') apply();
    });
  }
  return { apply };
})();

/* ── shell chrome ─────────────────────────────────────────────────────────
   The controls that belong to the frame rather than to any view: back, full
   screen, theme. Each exists twice — once in the mobile header, once in the
   desktop rail — so they repaint from one place and can never disagree about
   what is on. */
const Shell = (function () {

  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  function toggleFull() {
    const root = document.documentElement;
    if (isFull()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return;
    }
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (req) {
      const r = req.call(root);
      if (r && r.catch) r.catch(function () { DOM.announce('This browser refused full screen.'); });
    } else {
      DOM.announce('This browser has no full-screen mode.');
    }
  }

  function cycleTheme() {
    const order = ['auto', 'light', 'dark'];
    const next = order[(order.indexOf(Store.pref('theme', 'auto')) + 1) % 3];
    Store.setPref('theme', next);
    Theme.apply();
    DOM.announce('Theme set to ' + next + '.');
    paint();
  }

  const each = (sel, fn) => Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
  function setGlyph(btn, name, label) {
    const g = btn.querySelector('.mi');
    if (g) g.textContent = name;
    const l = btn.querySelector('.lb');
    if (l) l.textContent = label;
  }

  function paint() {
    const full = isFull();
    const theme = Store.pref('theme', 'auto');
    document.body.classList.toggle('is-full', full);
    each('[data-chrome=full]', function (b) {
      b.setAttribute('aria-pressed', String(full));
      b.setAttribute('aria-label', full ? 'Leave full screen' : 'Full screen');
      setGlyph(b, full ? 'fullscreen_exit' : 'fullscreen', full ? 'Exit full screen' : 'Full screen');
    });
    each('[data-chrome=theme]', function (b) {
      b.setAttribute('aria-label', 'Theme: ' + theme + ' — change it');
      setGlyph(b, theme === 'dark' ? 'dark_mode' : theme === 'light' ? 'light_mode' : 'contrast',
        'Theme: ' + theme);
    });
    each('[data-chrome=back]', function (b) { b.disabled = !Router.canBack(); });
  }

  function wire() {
    const byId = id => document.getElementById(id);
    const back = byId('back-btn'), full = byId('full-btn'), theme = byId('theme-btn');
    if (back) { back.setAttribute('data-chrome', 'back'); back.addEventListener('click', () => Router.back()); }
    if (full) { full.setAttribute('data-chrome', 'full'); full.addEventListener('click', toggleFull); }
    if (theme) { theme.setAttribute('data-chrome', 'theme'); theme.addEventListener('click', cycleTheme); }
    document.addEventListener('fullscreenchange', paint);
    document.addEventListener('webkitfullscreenchange', paint);
    paint();
  }

  return { isFull, toggleFull, cycleTheme, paint, wire };
})();

const App = (function () {

  const el = DOM.el;

  const TABS = [
    { name: 'home', label: 'Today', icon: 'today', also: [] },
    { name: 'study', label: 'Study', icon: 'menu_book', also: ['note'] },
    { name: 'recall', label: 'Recall', icon: 'style', also: [] },
    { name: 'omr', label: 'Questions', icon: 'ballot', also: [] },
    { name: 'write', label: 'Write', icon: 'draw', also: [] }
  ];

  const VIEWS = {
    home: () => ViewHome, study: () => ViewStudy, note: () => ViewNote,
    recall: () => ViewRecall, omr: () => ViewOmr, write: () => ViewWrite
  };

  /* ONE nav element, laid out two ways.

     On a phone it is the bottom tab bar it has always been. On a desktop the
     same element becomes a left rail — because the horizontal strip was
     costing a band of vertical space on every screen, and vertical space is
     the whole of reading. The rail carries its own brand, back button and
     shell controls, so at that width the top header can go away entirely and
     the page gets the full height of the window.

     `.rail-top` and `.rail-foot` are simply not displayed on a phone, where
     the header already carries them. */
  function railBtn(chrome, glyph, label, onClick) {
    const b = el('button', { class: 'rail-btn', type: 'button', 'data-chrome': chrome,
      'aria-label': label }, [DOM.mi(glyph), el('span', { class: 'lb', text: label })]);
    b.addEventListener('click', onClick);
    return b;
  }

  function buildNav() {
    const nav = document.getElementById('tabs');
    DOM.clear(nav);

    nav.appendChild(el('div', { class: 'rail-top' }, [
      railBtn('back', 'arrow_back', 'Back', function () { Router.back(); }),
      el('a', { class: 'rail-brand', href: Router.href('home') }, [
        el('b', { text: 'Real Analysis' }),
        el('span', { text: 'Levels 1–3' })
      ])
    ]));

    const list = el('div', { class: 'rail-nav' });
    TABS.forEach(function (t) {
      list.appendChild(el('a', { href: Router.href(t.name), id: 'tab-' + t.name }, [
        DOM.mi(t.icon), el('span', { class: 'lb', text: t.label })
      ]));
    });
    nav.appendChild(list);

    nav.appendChild(el('div', { class: 'rail-foot' }, [
      railBtn('full', 'fullscreen', 'Full screen', Shell.toggleFull),
      railBtn('theme', 'contrast', 'Theme', Shell.cycleTheme)
    ]));

    Shell.paint();
  }

  function markNav(routeName) {
    TABS.forEach(function (t) {
      const a = document.getElementById('tab-' + t.name);
      if (!a) return;
      const on = t.name === routeName || t.also.indexOf(routeName) >= 0;
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function failureCard(err) {
    console.error(err);
    document.body.setAttribute('data-error', (err && err.message) || 'error');
    return el('div', { class: 'stack' }, [
      el('h1', { tabindex: '-1', id: 'pagetitle', text: 'Something broke' }),
      el('div', { class: 'banner' }, [
        DOM.mi('warning'),
        el('span', {}, [
          el('b', { text: 'This view failed to render. ' }),
          el('span', { class: 'mono', text: (err && err.message) || String(err) })
        ])
      ]),
      el('a', { class: 'btn', href: Router.href('home'), text: 'Back to Today' })
    ]);
  }

  function paint(r) {
    const main = document.getElementById('main');
    const view = (VIEWS[r.name] || VIEWS.home)();
    DOM.clear(main);
    let node;
    try { node = view.render(r.args, r.query); }
    catch (err) { node = failureCard(err); }
    const wrap = el('div', { class: (view.wrapClass || 'wrap') + ' view-in' }, [node]);
    main.appendChild(wrap);
    markNav(r.name);
    Shell.paint();
    const h = main.querySelector('#pagetitle');
    if (h) h.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  }

  /* Views are painted synchronously and animate in with CSS (.view-in).
     The native View Transition API was tried here and dropped: its DOM-update
     callback is frame-scheduled, so a route could land on an empty <main> if
     that frame never arrives. A blank screen is not worth a cross-fade. */
  const route = paint;

  /* ── data loading ──────────────────────────────────────────────────────── */
  function loadOne(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = () => resolve(src);
      s.onerror = () => reject(new Error('could not load ' + src));
      document.head.appendChild(s);
    });
  }

  function loadData() {
    const cfg = (typeof DATA_SOURCES !== 'undefined') ? DATA_SOURCES : null;
    if (!cfg) return Promise.reject(new Error('app/sources.js is missing'));
    const list = cfg[cfg.use] || [];
    if (!list.length) return Promise.reject(new Error('no data files listed for source "' + cfg.use + '"'));
    return list.reduce((p, src) => p.then(() => loadOne(src)), Promise.resolve());
  }

  function fatal(err) {
    document.body.setAttribute('data-error', (err && err.message) || 'fatal');
    const main = document.getElementById('main');
    DOM.clear(main);
    main.appendChild(el('div', { class: 'wrap stack' }, [
      el('h1', { text: 'Content did not load' }),
      el('div', { class: 'banner' }, [
        DOM.mi('warning'),
        el('span', {}, [
          el('b', { text: 'The data files could not be read. ' }),
          el('span', { class: 'mono', text: (err && err.message) || String(err) })
        ])
      ]),
      el('p', { class: 'small muted', text: 'Check the paths listed in app/sources.js.' })
    ]));
  }

  function mathjaxWarning() {
    if (Tex.available()) return;
    const main = document.getElementById('main');
    const wrap = main.querySelector('.wrap');
    if (!wrap) return;
    wrap.insertBefore(el('div', { class: 'banner' }, [
      DOM.mi('warning'),
      el('span', {}, [
        el('b', { text: 'MathJax did not load. ' }),
        'Formulas will show as LaTeX source. The app needs the network once to fetch it.'
      ])
    ]), wrap.firstChild);
  }

  /* The app proper. Only ever reached with someone signed in. */
  function run() {
    document.body.classList.remove('signed-out');
    buildNav();
    /* Sync starts after the pool: a merge can change what is on screen, and
       it reloads the current route when it does. */
    Sync.start();
    Router.start(route);

    /* MathJax arrives on its own schedule; typeset whatever is on screen
       once it is ready, and say so plainly if it never arrives. */
    Tex.ready().then(function () {
      Tex.typeset(document.getElementById('main'));
      mathjaxWarning();
    });
  }

  /* The record is keyed on a name and a roll number, so there is no sensible
     "anonymous" state to start in: progress made before signing in could not
     be merged with the record it later turns out to belong to. The gate is
     therefore first, and it is the only screen shown until it is passed. */
  function gate() {
    const main = document.getElementById('main');
    DOM.clear(main);
    document.body.classList.add('signed-out');
    Login.mount(main, function () {
      DOM.clear(main);
      run();
    });
    Tex.ready().then(() => Tex.typeset(main));
  }

  function start() {
    Theme.apply();
    Shell.wire();

    loadData().then(function () {
      Pool.build();
      if (Store.signedIn()) run(); else gate();
    }, fatal);
  }

  window.addEventListener('error', function (e) {
    document.body.setAttribute('data-error', (e && e.message) || 'error');
  });

  /* Progress is written through a debounce, so a tab closed or backgrounded
     within a quarter-second of the last tick would lose it. `pagehide` is the
     one event that fires reliably on mobile, where tabs are killed rather
     than closed. */
  window.addEventListener('pagehide', function () { Store.flushNow(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) Store.flushNow();
  });

  return { start: start, route: route };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', App.start);
} else {
  App.start();
}

</script>
</body>
</html>
