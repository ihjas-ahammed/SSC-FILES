  };

  /* The level a concept has reached, as a badge. One vocabulary everywhere:
     1 read, 2 proof worked, 3 exercises done — and the colour says which. */
  const LEVEL_NAME = ['not started', 'read', 'proof worked', 'exercises done', 'all complete'];
  const levelBadge = function (id) {
    const n = Progress.level(id);
    if (!n) return null;
    return el('span', { class: 'badge lv' + n }, [
      DOM.mi(n >= 3 ? 'workspace_premium' : n >= 2 ? 'function' : 'check', 'xs'),
      el('span', { text: 'level ' + n + ' · ' + LEVEL_NAME[n] })
    ]);
  };

  /* `lv` is a level (1, 2, 3) to colour the fill with, or `true` for the plain
     "finished" green. Left out, the meter is accent-coloured and says nothing
     about levels — which is right for recall and first-attempt numbers. */
  const meter = (a, b, lv) => el('div', {
    class: 'meter' + (lv === true ? ' ok' : lv ? ' lv' + lv : '')
  }, [el('i', { style: { width: DOM.pct(a, b) + '%' } })]);

  /* ── the three-level bar ─────────────────────────────────────────────────
     `c` is a Progress.count(): l1/l2/l3 are cumulative, so the widths nest and
     the bar reads green | amber | red | untouched with no arithmetic. */
  function levelBar(c, opts) {
    const o = opts || {};
    const bar = el('div', { class: 'lvbar', role: 'img',
      'aria-label': c.l1 + ' read, ' + c.l2 + ' with the proof worked, ' + c.l3 +
        ' with the exercises done, of ' + c.total });
    DOM.add(bar, [
      el('i', { class: 'a', style: { width: DOM.pct(c.l1, c.total) + '%' } }),
      el('i', { class: 'b', style: { width: DOM.pct(c.l2, c.total) + '%' } }),
      el('i', { class: 'c', style: { width: DOM.pct(c.l3, c.total) + '%' } })
    ]);
    if (o.key === false) return bar;
    return el('div', {}, [bar, el('div', { class: 'lvkey' }, [
      el('span', { class: 'k1' }, [el('em', {}), el('span', { text: 'read ' + c.l1 + '/' + c.total })]),
      el('span', { class: 'k2' }, [el('em', {}), el('span', { text: 'proofs ' + c.l2 + '/' + c.total })]),
      el('span', { class: 'k3' }, [el('em', {}), el('span', { text: 'exercises ' + c.l3 + '/' + c.total })])
    ])]);
  }

  /* The ring every tree row and course card draws: coloured by the level the
     WHOLE group has reached, filled by how far it has got towards the next. */
  function levelRing(c, label) {
    const at = c.min;
    const reached = at >= 3 ? c.l3 : at >= 2 ? c.l3 : at >= 1 ? c.l2 : c.l1;
    const pc = at >= 3 ? 100 : DOM.pct(reached, c.total);
    const node = el('span', {
      class: 'ring', 'data-lv': String(at), role: 'img',
      'aria-label': (label || '') + ' level ' + at + ', ' + reached + ' of ' + c.total +
        ' at the next level'
    }, [el('i', { text: c.total ? (at >= 3 ? c.total + '/' + c.total : reached + '/' + c.total) : '—' })]);
    window.requestAnimationFrame(() => node.style.setProperty('--p', pc));
    return node;
  }

  function stat(n, label, sub, bar) {
    return el('div', { class: 'stat' }, [
      el('div', { class: 'n', text: n }),
      el('div', { class: 'l', text: label }),
      sub ? el('div', { class: 's', text: sub }) : null,
      bar ? el('div', { style: { marginTop: '8px' } }, [bar]) : null
    ]);
  }

  const empty = (msg, extra) => el('div', { class: 'empty' }, [el('p', { text: msg }), extra || null]);

  /* Mastery ladder, for ONE concept. Nothing here is chosen — each rung is
     earned by a different act, and the caption says which act is still owed. */
  function ladder(id) {
    const at = Progress.level(id);
    const hasProof = Progress.hasProof(id);
    const c = Pool.concept(id);
    const tasks = c ? Progress.secTaskState(c.sec) : { total: 0, done: 0 };

    const caption = at === 3 ? '3 · section exercises done'
      : at === 2 ? '2 · proof worked through'
      : at === 1 ? '1 · read'
      : 'not started';

    /* A stage that does not exist is not a stage you are owed: a note with no
       proof is level 2 the moment it is read, and a section with no exercises
       cannot hold anything back from green. */
    const owed = at === 0 ? 'mark it read once you have been through it'
      : at === 1 ? 'complete the proof to reach level 2'
      : at === 2 ? ('level 3: ' + tasks.done + ' of ' + tasks.total + ' section exercises done')
      : 'nothing owed';

    const seg = n => el('span', {
      class: (n <= at ? 'on l' + n : ''),
      title: n === 1 ? 'Read' : n === 2 ? (hasProof ? 'Proof worked through' : 'No proof to work')
        : 'Section exercises worked'
    });

    return el('div', {}, [
      el('div', { class: 'ladder' }, [seg(1), seg(2), seg(3)]),
      el('div', { class: 'ladder-l' }, [
        el('span', { text: caption }),
        el('span', { text: owed })
      ])
    ]);
  }

  /* Which of a concept's prerequisites have not reached the level this note is
     held to. One definition, because the note view and the syllabus tree both
     offer the same cascade and must never disagree about what it would do. */
  const pendingPrereqs = id => Progress.pendingPrereqs(id);

  /* An inline question with real buttons, used where window.confirm would
     lose the detail that makes the question answerable. */
  function ask(opts) {
    const host = el('div', { class: 'card tint ask', role: 'group',
      'aria-label': opts.title });
    DOM.add(host, [
      el('div', { class: 'kicker', text: opts.title }),
      opts.body ? el('div', { class: 'small', style: { margin: '6px 0 10px' } }, [opts.body]) : null,
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button',
          text: a.label, on: { click: a.onClick } })))
    ]);
    return host;
  }

  function mockBanner() {
    if (!Pool.isMock()) return null;
    return el('div', { class: 'banner' }, [
      DOM.mi('science'),
      el('span', {}, [
        el('b', { text: 'Mock content. ' }),
        'These ten theorems and sixteen questions are placeholders written to test the study loop — ' +
        'not validated material, and not from any past paper. The real pool arrives through the ' +
        'data handoff.'
      ])
    ]);
  }

  /* Attempt-before-reveal gate. Nothing is revealed until the learner says
     they have tried, or does something that counts as trying. */
  function gate(opts) {
    const host = el('div', { class: 'gate' });
    const body = el('div', { class: 'stack', style: { gap: '12px' } }, [
      el('p', { class: 'small muted', style: { margin: 0 }, text: opts.hint }),
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button', text: a.label,
          on: { click: a.onClick } })))
    ]);
    host.appendChild(body);
    return host;
  }

  /* A titled block whose body is only built when it is opened. */
  function reveal(label, buildBody, opts) {
    const o = opts || {};
    const body = el('div', { class: 'b', hidden: true });
    const btn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false',
      text: o.openLabel || 'Show' });
    let built = false;
    btn.addEventListener('click', function () {
      const open = body.hidden;
      if (open && !built) { built = true; DOM.add(body, buildBody()); math(body); }
      body.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? (o.closeLabel || 'Hide') : (o.openLabel || 'Show');
    });
    const box = el('div', { class: 'reveal' }, [
      el('div', { class: 'h' }, [el('span', { text: label }), btn]), body
    ]);
    return box;
  }

  const typeBadge = q => el('span', {
    class: 'badge accent',
    text: q.type
  });

  function metaRow(q) {
    const bits = [q.marks + ' ' + DOM.plural(q.marks, 'mark')];
    bits.push(q.neg ? (q.negLabel || q.neg) + ' if wrong' : 'no negative marking');
    if (q.time) bits.push('about ' + Math.round(q.time / 30) / 2 + ' min');
    const row = el('div', { class: 'row' });
    bits.forEach(function (b, i) {
      if (i) row.appendChild(el('span', { class: 'count dot', 'aria-hidden': 'true', text: '·' }));
      row.appendChild(el('span', { class: 'count', text: b }));
    });
    return row;
  }

  /* "2 minutes ago", for the sync line. Short, because it is a reassurance and
     not a measurement. */
  function ago(at) {
    const s = Math.max(0, Math.round((Date.now() - at) / 1000));
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' ' + DOM.plural(m, 'minute') + ' ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' ' + DOM.plural(h, 'hour') + ' ago';
    const d = Math.round(h / 24);
    return d + ' ' + DOM.plural(d, 'day') + ' ago';
  }

  const clock = ms => {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0');
  };

  return {
    title, crumb, prose, math, kindBadge, tierBadge, meter, stat, empty,
    ladder, levelBadge, levelBar, levelRing, ask, pendingPrereqs, mockBanner, gate, reveal,
    typeBadge, metaRow, clock, ago
  };
})();

  /* ── §5.1 ε–δ, interactive ────────────────────────────────────────────── */
  'fig.eps-delta': {
    title: 'ε is demanded, δ is your answer',
    interactive: true,
    caption: 'Drag ε. The orange band is the tolerance you must land inside; the blue strip is ' +
      'the δ that answers it for $f(x)=x^2$ at $c=1$. Continuity means you can always answer — ' +
      'and δ shrinks as ε does.',
    build(api) {
      const f = x => x * x, c = 1, fc = 1;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 2], yr: [0, 4], padT: 14, padB: 26,
        padL: 30, padR: 14 });

      const epsBand = p.rect(0, fc - 0.6, 2, fc + 0.6, 'band warm');
      const delBand = p.rect(c - 0.2, 0, c + 0.2, 4, 'band');
      p.axes({ ticks: [{ x: 1, t: 'c = 1' }, { x: 2, t: '2' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, fc, c, fc, 'guide');
      p.dot(c, fc, '', 4.4);
      const epsLbl = Fig.svg('text', { x: p.X(1.98), y: p.Y(fc) - 6, class: 'lbl',
        'text-anchor': 'end', text: 'ε' });
      const delLbl = Fig.svg('text', { x: p.X(c), y: p.Y(3.75), class: 'lbl',
        'text-anchor': 'middle', text: 'δ' });
      p.add(epsLbl, delLbl);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function deltaFor(eps) {
        const right = Math.sqrt(fc + eps) - c;
        const left = (fc - eps) > 0 ? c - Math.sqrt(fc - eps) : c;
        return Math.min(right, left);
      }
      function update(eps) {
        const d = deltaFor(eps);
        const lo = Math.max(0, fc - eps), hi = Math.min(4, fc + eps);
        epsBand.setAttribute('y', p.Y(hi));
        epsBand.setAttribute('height', Math.abs(p.Y(lo) - p.Y(hi)));
        delBand.setAttribute('x', p.X(c - d));
        delBand.setAttribute('width', p.X(c + d) - p.X(c - d));
        epsLbl.setAttribute('y', p.Y(hi) - 5);
      }
      api.control({
        min: 0.1, max: 1.6, step: 0.05, value: 0.6, label: 'epsilon',
        format: v => 'ε = ' + v.toFixed(2) + '  →  δ = ' + deltaFor(v).toFixed(3),
        onInput: update
      });
      update(0.6);
      p.svg.setAttribute('aria-label',
        'The curve y equals x squared with an epsilon band around f of c and the delta strip that answers it.');
    }
  },

  /* ── §5.1 sequential criterion ────────────────────────────────────────── */
  'fig.seq-crit': {
    title: 'sequences carry continuity',
    caption: 'Any $x_n\\to c$ on the axis is dragged by $f$ to $f(x_n)\\to f(c)$ on the other. ' +
      'Continuity is exactly the promise that <i>every</i> such input sequence behaves; one ' +
      'misbehaving sequence is all it takes to destroy it.',
    build(api) {
      const f = x => 0.6 + 1.1 * Math.sin(1.15 * x);
      const c = 1.6;
      const p = Fig.plot({ w: 330, h: 205, xr: [0, 2.4], yr: [0, 2], padT: 14, padB: 26,
        padL: 34, padR: 14 });
      p.axes({ ticks: [{ x: c, t: 'c' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, f(c), c, f(c), 'guide');
      p.line(c, 0, c, f(c), 'guide');
      p.dot(c, f(c), '', 4.6);
      p.label(0.22, f(c) + 0.14, 'f(c)', 'lbl', 'start');

      for (let n = 1; n <= 5; n++) {
        const x = c - 0.62 / n;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (250 + n * 200) + 'ms';
        g.appendChild(Fig.svg('circle', { cx: p.X(x), cy: p.Y(0), r: 3.2, class: 'pt' }));
        g.appendChild(Fig.svg('circle', { cx: p.X(0), cy: p.Y(f(x)), r: 3.2, class: 'pt good' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(0), x2: p.X(x), y2: p.Y(f(x)),
          class: 'guide' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(f(x)), x2: p.X(0), y2: p.Y(f(x)),
          class: 'guide' }));
        p.add(g);
      }
      p.label(1.02, 0.12, 'xₙ → c', 'lbl', 'middle');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Points approaching c on the x-axis with their images approaching f of c on the y-axis.');
    }
  },

  /* ── §5.3 max–min attained ────────────────────────────────────────────── */
  'fig.maxmin': {
    title: 'on [a,b] the extremes are reached',
    caption: 'Closed and bounded, plus continuity: the supremum and infimum of the range are ' +
      'not merely approached, they are <i>values</i> $f(x^*)$ and $f(x_*)$ at actual points of ' +
      'the interval.',
    build(api) {
      const f = x => 1.55 + 0.85 * Math.sin(3.1 * x) + 0.18 * x;
      const a = 0.25, b = 1.95;
      let xh = a, xl = a;
      for (let i = 0; i <= 400; i++) {
        const x = a + (b - a) * i / 400;
        if (f(x) > f(xh)) xh = x;
        if (f(x) < f(xl)) xl = x;
      }
      const p = Fig.plot({ w: 330, h: 200, xr: [0, 2.2], yr: [0, 3], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: a, t: 'a' }, { x: b, t: 'b' }] });
      const cur = p.path(p.curve(f, a, b), 'curve');
      [[xh, 'good'], [xl, 'bad']].forEach(function (pair, i) {
        const x = pair[0];
        p.line(0, f(x), x, f(x), 'guide');
        p.line(x, 0, x, f(x), 'guide');
        const d = p.dot(x, f(x), pair[1], 5);
        d.classList.add('fade-in');
        d.style.animationDelay = (700 + i * 240) + 'ms';
      });
      p.label(0.24, f(xh) + 0.17, 'max f(x*)', 'lbl', 'start');
      p.label(0.24, f(xl) - 0.28, 'min f(x⁎)', 'lbl', 'start');
      p.dot(a, f(a), '', 3.4);
      p.dot(b, f(b), '', 3.4);
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'A continuous curve on a closed interval with its maximum and minimum points marked.');
    }
  },

  /* ── §5.3 the same theorem with the hypothesis removed ────────────────── */
  'fig.no-max': {
    title: 'drop “closed” and the maximum goes',
    caption: '$f(x)=1/x$ on $(0,1]$ is continuous, attains its minimum at $x=1$, and has no ' +
      'maximum at all: $f(1/n)=n$. Nothing is contradicted — the theorem simply never applied.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 185, xr: [0, 1.2], yr: [0, 6], padT: 18, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.14 ? 1 / x : NaN), 0.14, 1.2), 'curve');
      p.dot(1, 1, 'good', 4.6);
      p.label(1.06, 1.2, 'min = 1', 'lbl', 'start');
      p.add(Fig.svg('circle', { cx: p.X(0.167), cy: p.Y(6), r: 4.4, class: 'pt open' }));

      const arrow = Fig.svg('g', { class: 'rise-y' });
      arrow.style.setProperty('--dy', '18px');
      arrow.appendChild(Fig.svg('path', { class: 'hot',
        d: 'M' + p.X(0.09) + ' ' + p.Y(2.2) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' M' + (p.X(0.09) - 4) + ' ' + (p.Y(5.4) + 6) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' L' + (p.X(0.09) + 4) + ' ' + (p.Y(5.4) + 6) }));
      p.add(arrow);
      p.label(0.33, 5.2, 'no maximum', 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'One over x on the half-open interval, escaping upward near zero with its minimum at x equals one.');
    }
  },

  /* ── §5.3 IVT, on the cubic the questions use ─────────────────────────── */
  'fig.ivt': {
    title: 'a sign change forces a crossing',
    caption: '$p(x)=x^3-3x+1$ has $p(0)=1>0$ and $p(1)=-1<0$, so the level $0$ is crossed ' +
      'somewhere inside. The theorem gives <i>at least one</i> $c$; that it is exactly one here ' +
      'comes from $p\' &lt; 0$ on $(0,1)$, not from the IVT.',
    build(api) {
      const p3 = x => x * x * x - 3 * x + 1;
      const root = 0.34729636;
      const p = Fig.plot({ w: 330, h: 195, xr: [-0.06, 1.12], yr: [-1.35, 1.35], padT: 16,
        padB: 26, padL: 30, padR: 16 });
      p.axes({ y0: 0, ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const cur = p.path(p.curve(p3, -0.06, 1.12), 'curve');
      p.dot(0, 1, 'good', 4.4);
      p.dot(1, -1, 'bad', 4.4);
      p.label(0.08, 1.16, 'p(0) = 1', 'lbl', 'start');
      p.label(0.94, -1.2, 'p(1) = −1', 'lbl', 'end');

      const sweep = Fig.svg('line', { x1: p.X(-0.06), y1: p.Y(0), x2: p.X(1.12), y2: p.Y(0),
        class: 'hot' });
      p.add(sweep);
      const rd = p.dot(root, 0, '', 5.2);
      rd.classList.add('fade-in');
      rd.style.animationDelay = '900ms';
      p.line(root, 0, root, -0.55, 'guide');
      p.label(root, -0.72, 'c ≈ 0.35', 'lbl');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.draw(sweep);
      p.svg.setAttribute('aria-label',
        'The cubic x cubed minus three x plus one crossing zero between zero and one.');
    }
  },

  /* ── §5.4 uniform continuity, interactive ─────────────────────────────── */
  'fig.unif': {
    title: 'one δ cannot serve the whole set',
    interactive: true,
    caption: 'Slide the δ-window along $f(x)=1/x$ on $(0,1]$. Its width never changes; the ' +
      'height of the image band does — without limit as you approach $0$. That is precisely ' +
      'the failure of uniform continuity.',
    build(api) {
      const f = x => 1 / x, d = 0.05;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 1.1], yr: [0, 12], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      const imgBand = p.rect(0, 1, 1.1, 2, 'band warm');
      const winBand = p.rect(0.5 - d, 0, 0.5 + d, 12, 'band');
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.083 ? f(x) : NaN), 0.083, 1.1), 'curve');
      const lo = p.dot(0.45, f(0.45), '', 3.8);
      const hi = p.dot(0.55, f(0.55), '', 3.8);
      const gap = Fig.svg('text', { class: 'lbl', 'text-anchor': 'start', text: '' });
      p.add(gap);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function update(u) {
        const a = Math.max(0.085, u - d), b = Math.min(1.1, u + d);
        const ya = f(b), yb = Math.min(12, f(a));
        winBand.setAttribute('x', p.X(a));
        winBand.setAttribute('width', p.X(b) - p.X(a));
        imgBand.setAttribute('y', p.Y(yb));
        imgBand.setAttribute('height', Math.abs(p.Y(ya) - p.Y(yb)));
        lo.setAttribute('cx', p.X(a)); lo.setAttribute('cy', p.Y(Math.min(12, f(a))));
        hi.setAttribute('cx', p.X(b)); hi.setAttribute('cy', p.Y(f(b)));
        gap.setAttribute('x', p.X(0.3));
        gap.setAttribute('y', p.Y(Math.min(11.4, yb)) - 6);
        gap.textContent = 'image height ≈ ' + (Math.min(12, f(a)) - f(b)).toFixed(2);
      }
      api.control({
        min: 0.1, max: 0.95, step: 0.01, value: 0.5, label: 'window position',
        format: v => 'window at x = ' + v.toFixed(2) + ',  width 2δ = ' + (2 * d).toFixed(2),
        onInput: update
      });
      update(0.5);
      p.svg.setAttribute('aria-label',
        'A fixed-width window sliding along one over x; the image band grows without bound near zero.');
    }
  },

  /* ── §5.4 why compactness rescues it ─────────────────────────────────── */
  'fig.heine': {
    title: 'on a closed interval there is a worst case',
    caption: 'Equal δ-windows along $\\sqrt{x}$ on $[0,1]$. The image bands differ, the worst ' +
      'one sits at $0$ — and because the interval is closed and bounded the worst one <i>exists</i>. ' +
      'Take δ for that window and it serves everywhere: continuity becomes uniform.',
    build(api) {
      const f = Math.sqrt;
      const p = Fig.plot({ w: 330, h: 190, xr: [0, 1.06], yr: [0, 1.15], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const w = 1 / 6;
      for (let i = 0; i < 6; i++) {
        const a = i * w, b = a + w;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (200 + i * 130) + 'ms';
        g.appendChild(Fig.svg('rect', {
          x: p.X(a), y: p.Y(f(b)), width: p.X(b) - p.X(a),
          height: Math.abs(p.Y(f(a)) - p.Y(f(b))),
          class: i === 0 ? 'band warm' : 'band good'
        }));
        g.appendChild(Fig.svg('line', { x1: p.X(a), y1: p.Y(0), x2: p.X(a), y2: p.Y(f(b)),
          class: 'guide' }));
        p.add(g);
      }
      const cur = p.path(p.curve(f, 0, 1.02), 'curve');
      p.label(0.2, 0.52, 'worst window', 'lbl', 'start');
      p.line(0.185, 0.5, 0.09, 0.42, 'guide');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Equal-width windows under the square-root curve, the tallest image band at zero.');
    }
  },

  /* ── §6.2 MVT, on the interval the questions use ─────────────────────── */
  'fig.mvt': {
    title: 'the tangent parallel to the chord',
    caption: 'For $f(x)=x^2$ on $[1,3]$ the chord has slope $\\frac{9-1}{3-1}=4$, and $f\'(c)=2c=4$ ' +
      'puts the parallel tangent at $c=2$. The theorem promises such a $c$ exists; finding it is ' +
      'just solving that equation.',
    build(api) {
      const f = x => x * x, a = 1, b = 3, c = 2;
      const p = Fig.plot({ w: 330, h: 205, xr: [0.6, 3.5], yr: [0, 11], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: 'a=1' }, { x: 2, t: 'c=2' }, { x: 3, t: 'b=3' }] });
      const cur = p.path(p.curve(f, 0.6, 3.5), 'curve');

      p.add(Fig.svg('line', { x1: p.X(a), y1: p.Y(f(a)), x2: p.X(b), y2: p.Y(f(b)), class: 'hot' }));
      p.label(1.35, 6.4, 'chord, slope 4', 'lbl', 'start');

      /* tangent y = 4x - 4, slid into place */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.1) - p.X(2)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(0.9), y1: p.Y(4 * 0.9 - 4),
        x2: p.X(3.2), y2: p.Y(4 * 3.2 - 4), class: 'curve', 'stroke-dasharray': '5 4' }));
      p.add(g);
      p.dot(a, f(a), '', 4); p.dot(b, f(b), '', 4);
      const cd = p.dot(c, f(c), 'good', 5.2);
      cd.classList.add('fade-in'); cd.style.animationDelay = '1.2s';
      p.label(2.42, 3.1, "f′(c) = 4", 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'The parabola x squared with the chord from one to three and the parallel tangent at c equals two.');
    }
  }
};

/* ── src/comp.figure.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Figure engine.

   Two kinds of figure now, and they are complementary rather than rivals:

     drawn      hand-built inline SVG (fig.library.js). Inherits the theme,
                scales to any width, animates, and a few take a control so the
                learner can move the parameter that matters (ε, or the window).
     rendered   the light/dark PNG pairs in `diagrams/`, indexed by concept in
                fig.diagrams.js. There are dozens of them and the app used to
                show none — a result with a picture sitting in the repository
                and nothing on screen is the worst of both.

   A concept shows its drawn figures first, then its rendered ones. Nothing is
   duplicated: where a drawn figure already exists for a result, the rendered
   one is still offered below it, because they show different things (the drawn
   figure is interactive, the rendered one is the finished diagram).

   This file is the plumbing — coordinate mapping, the frame, the controls, and
   the theme swap on a rendered diagram.
   ══════════════════════════════════════════════════════════════════════════ */

const Fig = (function () {

  const el = DOM.el;
  const s = DOM.svg;

  /* A plot area inside a viewBox: maths coordinates in, pixels out. */
  function plot(opts) {
    const o = Object.assign({ w: 330, h: 190, pad: 20, xr: [0, 1], yr: [0, 1] }, opts);
    const l = o.padL == null ? o.pad : o.padL;
    const b = o.padB == null ? o.pad : o.padB;
    const t = o.padT == null ? o.pad : o.padT;
    const r = o.padR == null ? o.pad : o.padR;
    const X = x => l + (x - o.xr[0]) / (o.xr[1] - o.xr[0]) * (o.w - l - r);
    const Y = y => (o.h - b) - (y - o.yr[0]) / (o.yr[1] - o.yr[0]) * (o.h - t - b);

    /* sampled path of a function, clipped to the y range */
    function curve(fn, from, to, steps) {
      const n = steps || 90;
      const a = from == null ? o.xr[0] : from;
      const z = to == null ? o.xr[1] : to;
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = a + (z - a) * i / n;
        const y = fn(x);
        if (!isFinite(y) || y < o.yr[0] - 1e-9 || y > o.yr[1] + 1e-9) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1) + ' ';
        pen = true;
      }
      return d.trim();
    }

    const svg = s('svg', {
      viewBox: '0 0 ' + o.w + ' ' + o.h, role: 'img',
      preserveAspectRatio: 'xMidYMid meet'
    });

    return {
      svg: svg, X: X, Y: Y, curve: curve, box: o,
      add(...kids) { kids.forEach(k => k && svg.appendChild(k)); return this; },
      /* axes with optional tick labels */
      axes(opts2) {
        const a = opts2 || {};
        const y0 = a.y0 == null ? o.yr[0] : a.y0;
        this.add(s('line', { class: 'axis', x1: X(o.xr[0]), y1: Y(y0), x2: X(o.xr[1]), y2: Y(y0) }));
        if (a.yAxis !== false) {
          this.add(s('line', { class: 'axis', x1: X(a.x0 == null ? o.xr[0] : a.x0), y1: Y(o.yr[0]),
            x2: X(a.x0 == null ? o.xr[0] : a.x0), y2: Y(o.yr[1]) }));
        }
        (a.ticks || []).forEach(function (tk) {
          svg.appendChild(s('line', { class: 'axis', x1: X(tk.x), y1: Y(y0) - 3, x2: X(tk.x), y2: Y(y0) + 3 }));
          svg.appendChild(s('text', { x: X(tk.x), y: Y(y0) + 15, 'text-anchor': 'middle', text: tk.t }));
        });
        return this;
      },
      label(x, y, text, cls, anchor) {
        this.add(s('text', { x: X(x), y: Y(y), class: cls || '', text: text,
          'text-anchor': anchor || 'middle' }));
        return this;
      },
      dot(x, y, cls, r2) {
        const c = s('circle', { cx: X(x), cy: Y(y), r: r2 || 3.6, class: 'pt ' + (cls || '') });
        this.add(c);
        return c;
      },
      line(x1, y1, x2, y2, cls) {
        const n = s('line', { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), class: cls || 'guide' });
        this.add(n);
        return n;
      },
      rect(x1, y1, x2, y2, cls) {
        const n = s('rect', { x: Math.min(X(x1), X(x2)), y: Math.min(Y(y1), Y(y2)),
          width: Math.abs(X(x2) - X(x1)), height: Math.abs(Y(y2) - Y(y1)), class: cls || 'band' });
        this.add(n);
        return n;
      },
      path(d, cls) {
        const n = s('path', { d: d, class: cls || 'curve' });
        this.add(n);
        return n;
      },
      /* stroke-draw entrance for a path */
      draw(node) {
        if (DOM.reduced() || !node.getTotalLength) return node;
        try {
          const len = Math.ceil(node.getTotalLength());
          node.style.setProperty('--len', len);
          node.classList.add('draw');
        } catch (e) { /* not yet in the document — skip the flourish */ }
        return node;
      }
    };
  }

  /* The frame: title, the drawing, an optional control, a caption. */
  function frame(def, opts) {
    const host = el('figure', { class: 'fig', style: { margin: 0 } });
    const body = el('div', {});
    const ctl = el('div', {});

    host.appendChild(el('div', { class: 'fig-h' }, [
      el('span', { class: 'kicker', text: def.title }),
      def.interactive ? el('span', { class: 'badge accent', text: 'drag it' }) : null
    ]));
    host.appendChild(body);
    host.appendChild(ctl);
    if (def.caption) {
      host.appendChild(el('figcaption', { class: 'fig-cap', html: def.caption }));
    }

    const api = {
      body: body,
      /* a labelled range control; onInput gets the numeric value */
      control(spec) {
        const input = el('input', {
          type: 'range', min: spec.min, max: spec.max, step: spec.step,
          value: spec.value, 'aria-label': spec.label
        });
        const out = el('label', { text: spec.format(Number(spec.value)) });
        input.addEventListener('input', function () {
          const v = Number(input.value);
          out.textContent = spec.format(v);
          spec.onInput(v);
        });
        DOM.clear(ctl);
        ctl.appendChild(el('div', { class: 'fig-ctl' }, [input, out]));
        return input;
      }
    };

    def.build(api, opts || {});
    return host;
  }

  /* ── rendered diagrams ────────────────────────────────────────────────── */
  const base = () => (typeof DIAGRAM_BASE !== 'undefined' ? DIAGRAM_BASE : 'diagrams/');

  const prettyTitle = b => b
    .replace(/^c\.[0-9.]+[a-z]?_/, '')
    .replace(/_/g, ' ')
    .replace(/^./, ch => ch.toUpperCase());

  function renderedFrame(basename, caption) {
    const light = base() + 'light/' + basename + '.png';
    const dark = base() + 'dark/' + basename + '.png';

    const img = el('img', {
      src: light, alt: caption || prettyTitle(basename),
      loading: 'lazy', decoding: 'async', class: 'fig-img'
    });

    /* One <img> whose src follows the theme. A <picture> with a
       prefers-color-scheme <source> was the obvious answer and is the wrong
       one: it can only see the OS setting, and this app has three theme
       settings of its own. So the swap watches the same `data-theme` attribute
       every other themed thing here reads. */
    function paint() {
      const wantDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = wantDark ? dark : light;
      if (img.getAttribute('src') !== next) img.setAttribute('src', next);
    }
    paint();
    if (window.MutationObserver) {
      const mo = new MutationObserver(paint);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    return el('figure', { class: 'fig fig-rendered', style: { margin: 0 } }, [
      el('div', { class: 'fig-h' }, [
        el('span', { class: 'kicker', text: prettyTitle(basename) }),
        el('span', { class: 'badge', text: 'diagram' })
      ]),
      el('div', { class: 'fig-imgwrap' }, [img])
    ]);
  }

  /* Which rendered diagrams belong to this concept. A concept may name them
     itself with `img: [...]`; otherwise the generated index answers by id. */
  function imagesFor(concept) {
    if (!concept) return [];
    if (concept.img && concept.img.length) {
      return Array.isArray(concept.img) ? concept.img : [concept.img];
    }
    return (typeof DIAGRAM_MAP !== 'undefined' && DIAGRAM_MAP[concept.id]) || [];
  }

  /* Mount every figure attached to a concept. Data may carry `figs: [id]`;
     the app's own map is the fallback while the pool is mock. */
  function forConcept(concept) {
    if (!concept) return [];
    const ids = (concept.figs && concept.figs.length)
      ? concept.figs
      : (FIGMAP[concept.id] || []);
    return ids.map(id => FIGLIB[id] ? { id: id, def: FIGLIB[id] } : null).filter(Boolean);
  }

  function mount(concept) {
    const figs = forConcept(concept);
    const imgs = imagesFor(concept);
    if (!figs.length && !imgs.length) return null;
    return el('div', { class: 'stack', style: { gap: '12px' } },
      figs.map(f => frame(f.def)).concat(imgs.map(b => renderedFrame(b))));
  }

  return { plot: plot, frame: frame, mount: mount, forConcept: forConcept,
    imagesFor: imagesFor, renderedFrame: renderedFrame, svg: s };
})();


/* ── src/comp.tree.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The syllabus tree — and, since Level 4, the reader as well.

   Course → module → section → concept, each row carrying a tick you can press
   and a ring showing how much of what is underneath is done. Opening a concept
   no longer leaves for a page of its own: the note unfolds in place, and its
   proof, its exercises and its questions unfold inside that. One scroll, from
   the course title to the last exercise.

   EXACTLY ONE THING IS OPEN AT EACH DEPTH. Opening a section closes the
   section that was open; opening a note closes the note that was open. The
   tree is a place you are, not a pile you have accumulated — which is the only
   way a three-deep tree of two hundred concepts stays navigable on a phone.
   That single open path is stored, so closing the app and coming back lands
   you where you left off (see `scrollToOpen`).

   Colour is the whole vocabulary. A row is RED once everything under it has
   been read, AMBER once every proof under it has been worked, GREEN once every
   section exercise under it is done. A course can go one further: VIOLET, level
   4, once its JAM past papers are worked through too.
   ══════════════════════════════════════════════════════════════════════════ */

const Tree = (function () {

  const el = DOM.el;
  const KEY = 'open4';
  const LEGACY = 'open';
  const DEPTH = ['course', 'mod', 'sec', 'concept'];

  /* ── the one open path ────────────────────────────────────────────────── */
  function readPath() {
    const p = Store.pref(KEY, null);
    if (p && typeof p === 'object') return p;

    /* Levels 1–3 stored a map of every open id. Keep the first of each kind
       so an upgrade lands somewhere familiar rather than fully collapsed. */
    const old = Store.pref(LEGACY, null);
    if (!old || typeof old !== 'object') return null;
    const out = {};
    Object.keys(old).forEach(function (k) {
      if (k.indexOf('course-') === 0 && !out.course) out.course = k.slice(7);
      else if (k.indexOf('mod-') === 0 && !out.mod) out.mod = k.slice(4);
      else if (k.indexOf('sec-') === 0 && !out.sec) out.sec = k.slice(4);
    });
    Store.setPref(KEY, out);
    return out;
  }

  let openPath = null;
  const path = () => (openPath || (openPath = readPath() || {}));
  function savePath(p) {
    openPath = p;
    Store.setPref(KEY, p);
  }

  /* Setting a slot clears everything deeper than it: opening a different
     section cannot leave the previous section's note hanging open. */
  function setSlot(kind, id, on) {
    const p = Object.assign({}, path());
    const i = DEPTH.indexOf(kind);
    p[kind] = on ? id : null;
    if (kind === 'pyq') { if (on) { p.mod = null; p.sec = null; p.concept = null; } }
    else {
      p.pyq = null;
      DEPTH.slice(i + 1).forEach(function (k) { p[k] = null; });
    }
    savePath(p);
  }

  const isOpen = (kind, id) => path()[kind] === id;

  /* ── in-place mark repainting ────────────────────────────────────────────
     A tick pressed inside an open note must not rebuild the tree — that would
     tear the note out from under the person using it. So every row registers
     how to repaint its own tick and ring, and a change just runs the list. */
  let marks = [];
  const registerMark = fn => { marks.push(fn); fn(); };
  function refresh() {
    Progress.dropCache();
    marks.forEach(function (fn) { try { fn(); } catch (e) { /* never break a repaint */ } });
  }

  /* ── pieces ───────────────────────────────────────────────────────────── */

  function tickButton(getState, onPress) {
    const btn = el('button', { class: 'tick', type: 'button', role: 'checkbox' },
      [el('i', { 'aria-hidden': 'true' })]);
    registerMark(function () {
      const s = getState();
      btn.setAttribute('aria-checked', s.state);
      btn.setAttribute('data-lv', String(s.lv || 0));
      btn.setAttribute('aria-label', s.label);
      const i = btn.firstChild;
      DOM.clear(i);
      i.appendChild(DOM.mi(
        s.state === 'mixed' ? 'remove' : s.lv >= 4 ? 'military_tech' : s.lv >= 3 ? 'workspace_premium' : 'check',
        'xs'));
    });
    btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); onPress(); });
    return btn;
  }

  const staticTick = glyph => el('span', { class: 'tick', 'aria-hidden': 'true' },
    [el('i', { style: { borderStyle: 'dashed' } }, [DOM.mi(glyph, 'xs')])]);

  /* A ring that repaints itself in place. */
  function ring(getCount, label) {
    const host = el('span', { class: 'ringhost' });
    registerMark(function () {
      DOM.clear(host);
      host.appendChild(UI.levelRing(getCount(), label));
    });
    return host;
  }

  let ctxOpenAccs = new Set();
  let isInitialPaint = true;

  function accordion(nid, open, kids, ctx) {
    const inner = el('div', { class: 'acc-in' }, [el('div', { class: 'acc-pad' }, kids)]);
    const acc = el('div', { class: 'acc', id: 'acc-' + nid }, [inner]);
    if (open) {
      const wasOpen = ctx && ctx.wasOpen ? ctx.wasOpen('acc-' + nid) : ctxOpenAccs.has('acc-' + nid);
      const isInit = ctx && typeof ctx.isInitial === 'boolean' ? ctx.isInitial : isInitialPaint;
      if (wasOpen || isInit || DOM.reduced()) {
        acc.classList.add('open');
      } else {
        window.requestAnimationFrame(() => acc.classList.add('open'));
      }
    }
    return acc;
  }

  function toggler(nid, open, kids, onToggle) {
    const btn = el('button', {
      class: 'tlabel', type: 'button',
      'aria-expanded': String(open), 'aria-controls': 'acc-' + nid
    }, kids);
    btn.addEventListener('click', function () { onToggle(!open); });
    return btn;
  }

  /* ── the cascade offer ────────────────────────────────────────────────── */
  function offerCascade(c) {
    const pending = Progress.pendingPrereqs(c.id);
    if (!pending.length) return;
    const names = pending.slice(0, 5).map(x => '· ' + x.title).join('\n') +
      (pending.length > 5 ? '\n· and ' + (pending.length - 5) + ' more' : '');
    const ask = pending.length + ' ' + DOM.plural(pending.length, 'prerequisite') +
      ' of "' + c.title + '" ' + DOM.plural(pending.length, 'has', 'have') +
      ' not been read yet:\n\n' + names + '\n\nMark them as read too?';
    if (!window.confirm(ask)) return;
    const n = Progress.raisePrereqs(c.id);
    DOM.announce('Marked ' + n + ' ' + DOM.plural(n, 'prerequisite') + ' as read.');
  }

  /* ── a concept: one row, and the whole note under it ─────────────────── */
  function conceptRow(c, ctx) {
    const nid = 'c-' + c.id;
    const open = isOpen('concept', c.id);
    const isExt = Pool.isExt(c);
    const extNote = isExt ? ' (outside syllabus)' : '';

    /* The row exists before anything that repaints it: a mark closure runs
       the moment it is registered, and a half-built row is a crash. */
    const row = el('div', { class: 'crow' });

    const tick = tickButton(function () {
      const lv = Progress.level(c.id);
      return {
        state: lv >= 1 ? 'true' : 'false', lv: lv,
        label: lv === 0 ? 'Mark "' + c.title + '" as read' + extNote
          : lv === 1 ? 'Mark the proof of "' + c.title + '" as complete' + extNote
            : 'Clear "' + c.title + '"'
      };
    }, function () {
      const was = Progress.level(c.id);
      Progress.advance(c.id);
      if (was === 0) offerCascade(c);
      refresh();
    });

    const tag = el('span', { class: 'lvtags' });
    registerMark(function () {
      const lv = Progress.level(c.id);
      DOM.clear(tag);
      if (lv === 1 && Progress.hasProof(c.id)) {
        tag.appendChild(el('span', { class: 'lvtag', 'data-lv': '1', text: 'proof owed' }));
      } else if (lv >= 2) {
        tag.appendChild(el('span', { class: 'lvtag', 'data-lv': String(lv), text: 'L' + lv }));
      }
      row.setAttribute('data-lv', String(lv));
    });

    const body = open ? NoteBody.build(c, {
      onChange: refresh,
      onComplete: function (next) {
        if (next) revealPath(next.id);
        else setSlot('concept', c.id, false);
        ctx.repaint({ scroll: !!next, isNote: !!next });
      }
    }) : null;

    const acc = accordion(nid, open, body ? [body] : [], ctx);

    const label = toggler(nid, open, [
      el('span', { class: 'tt' }, [
        el('b', {}, [
          el('span', { text: c.title }),
          isExt ? el('span', { class: 'badge warn', text: 'outside syllabus' }) : null
        ]),
        el('span', { text: c.kind + ' · ' + c.oneLine })
      ]),
      tag,
      DOM.icon('chev', 18, 'chev')
    ], function (on) {
      setSlot('concept', c.id, on);
      ctx.repaint({ scroll: on, isNote: true });
    });

    DOM.add(row, [tick, label]);
    const node = el('div', { class: 'cnode' + (open ? ' open' : ''), 'data-cid': c.id }, [row, acc]);
    if (open) ctx.target = node;
    return node;
  }

  /* ── a section ────────────────────────────────────────────────────────── */
  function sectionNode(s, ctx) {
    const ids = s.concepts.map(c => c.id);
    const nid = 'sec-' + s.sec;
    const open = isOpen('sec', s.sec);
    const isExt = Pool.isExtSec(s.sec);
    const tasks = Progress.secTaskState(s.sec);

    const acc = accordion(nid, open, open
      ? (s.concepts.length
        ? [el('div', { class: 'stack', style: { gap: '6px' } }, s.concepts.map(c => conceptRow(c, ctx)))]
        : [el('p', { class: 'small muted', style: { margin: '4px 2px' },
            text: 'No concepts loaded for this section yet.' })])
      : [], ctx);

    const node = el('div', { class: 'tnode sub sec' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const cnt = Progress.count(ids);
          return { state: Progress.tickState(ids), lv: cnt.min,
            label: 'Advance all of §' + s.sec + (isExt ? ' (outside syllabus)' : '') };
        }, function () {
          const to = Progress.advanceMany(ids);
          DOM.announce(to ? 'Section at level ' + to + '.' : 'Section cleared.');
          refresh();
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: '§' + s.sec + '  ' + s.title }),
              isExt ? el('span', { class: 'badge warn', text: 'outside syllabus' }) : null
            ]),
            el('span', { text: s.concepts.length + ' ' + DOM.plural(s.concepts.length, 'concept') +
              (tasks.total ? ' · ' + tasks.done + '/' + tasks.total + ' exercises' : '') +
              (isExt ? ' · outside syllabus (not in exam %)' : '') })
          ]),
          ring(() => Progress.count(ids), '§' + s.sec),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('sec', s.sec, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── a module ─────────────────────────────────────────────────────────── */
  function moduleNode(course, mod, ctx) {
    if (mod.pending) return pendingNode(mod, ctx);

    const secs = Pool.sections(course.id).filter(s => (mod.secs || []).indexOf(s.sec) >= 0);
    const isExtMod = !!mod.ext;
    const countSecs = isExtMod ? secs : secs.filter(s => !Pool.isExtSec(s.sec));
    const ids = countSecs.reduce((acc, s) => acc.concat(s.concepts.map(c => c.id)), []);
    const nid = 'mod-' + mod.id;
    const open = isOpen('mod', mod.id);

    const extCount = secs.filter(s => Pool.isExtSec(s.sec)).length;
    const subtitleText = isExtMod
      ? (secs.length + ' ' + DOM.plural(secs.length, 'section') + ' · outside syllabus')
      : ((mod.marks ? mod.marks + ' marks · ' : '') +
         countSecs.length + ' syllabus ' + DOM.plural(countSecs.length, 'section') +
         (extCount ? ' (+' + extCount + ' outside syllabus)' : ''));

    const modPrefix = isExtMod || mod.n === '+' || mod.n === 'Ext'
      ? 'Extension'
      : (mod.n && mod.n.indexOf('E') === 0 ? 'Topic ' + mod.n : 'Module ' + mod.n);
    const modHeading = modPrefix + ' · ' + mod.title;

    const acc = accordion(nid, open, open
      ? [el('div', {}, secs.map(s => sectionNode(s, ctx)))] : [], ctx);

    const node = el('div', { class: 'tnode' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const cnt = Progress.count(ids);
          return { state: Progress.tickState(ids), lv: cnt.min,
            label: 'Advance every syllabus note of ' + (isExtMod ? mod.title : 'module ' + mod.n) };
        }, function () {
          const to = Progress.advanceMany(ids);
          DOM.announce(to ? (isExtMod ? mod.title : 'Module ' + mod.n) + ' at level ' + to + '.' : 'Cleared.');
          refresh();
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: modHeading }),
              isExtMod ? el('span', { class: 'badge warn', text: 'outside syllabus' }) : null
            ]),
            el('span', { text: subtitleText })
          ]),
          ring(() => Progress.count(ids), isExtMod ? mod.title : 'Module ' + mod.n),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('mod', mod.id, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  function pendingNode(mod, ctx) {
    const nid = 'pend-' + mod.id;
    const open = isOpen('mod', mod.id);
    const builds = (mod.builds || []).map(function (id) {
      const c = Pool.concept(id);
      return c ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
        : el('span', { class: 'chip ghost', text: id });
    });
    const acc = accordion(nid, open, [el('div', { style: { padding: '0 2px' } }, [
      mod.why ? el('p', { class: 'small muted', style: { margin: '2px 0 8px' }, text: mod.why }) : null,
      builds.length ? el('div', {}, [
        el('div', { class: 'kicker', style: { marginBottom: '6px' }, text: 'Will build on' }),
        el('div', { class: 'row' }, builds)
      ]) : null
    ])], ctx);
    const modHeading = (mod.n && mod.n.indexOf('E') === 0 ? 'Topic ' + mod.n : mod.n) + ' · ' + mod.title;
    return el('div', { class: 'tnode sub sec' }, [
      el('div', { class: 'trow' }, [
        staticTick('hourglass_empty'),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: modHeading }),
              el('span', { class: 'badge warn', text: 'pending' })
            ]),
            el('span', { text: 'not delivered yet' })
          ]),
          DOM.icon('chev', 20, 'chev')
        ], function (on) { setSlot('mod', mod.id, on); ctx.repaint({ scroll: false }); })
      ]),
      acc
    ]);
  }

  /* ── level 4: the course's past papers ───────────────────────────────────
     A JAM question is set on the subject, not on a Bartle section, so it
     cannot hang off a note. It hangs off the COURSE — a sibling of the
     modules, and the last thing between a green course and a finished one. */
  function pyqNode(course, ctx) {
    const qs = Pool.pyq(course.id);
    const nid = 'pyq-' + course.id;
    const open = isOpen('pyq', course.id);

    if (!qs.length) {
      return el('div', { class: 'tnode sub sec' }, [
        el('div', { class: 'trow' }, [
          staticTick('hourglass_empty'),
          el('span', { class: 'tlabel', style: { cursor: 'default' } }, [
            el('span', { class: 'tt' }, [
              el('b', { text: 'JAM past papers' }),
              el('span', { text: 'not delivered yet · level 4 of ' + course.title })
            ]),
            el('span', { class: 'badge warn', text: 'pending' })
          ])
        ])
      ]);
    }

    /* grouped by paper, newest first — Pool already sorted them that way */
    function years() {
      const seen = [], by = {};
      qs.forEach(function (q) {
        const k = (q.year || '—') + (q.paper ? ' ' + q.paper : '');
        if (!by[k]) { by[k] = []; seen.push(k); }
        by[k].push(q);
      });
      return seen.map(k => ({ label: k, list: by[k] }));
    }

    function questionCard(q) {
      const mark = el('span', { class: 'ix' });
      function paintMark() {
        const on = Progress.pyqDone(q);
        mark.className = 'ix' + (on ? ' ok' : '');
        DOM.clear(mark);
        mark.appendChild(DOM.mi(on ? 'check' : 'radio_button_unchecked', 'xs'));
      }
      paintMark();

      return NoteBody.expander({
        cls: 'exp-q',
        mark: mark,
        title: (q.exam || 'PYQ') + ' ' + (q.year || '') + (q.qno ? ' · Q' + q.qno : ''),
        sub: (q.marks ? q.marks + ' ' + DOM.plural(q.marks, 'mark') : '')
          + (q.title ? ' · ' + q.title : ''),
        build: function () {
          /* an objective past question is answered like any other; a written
             one is worked on paper and claimed */
          if (q.options || q.type === 'MCQ' || q.type === 'MSQ' || q.type === 'NAT') {
            return [
              QuestionCard.build(q, { inNote: true }),
              NoteBody.taskRow('p:' + q.id, { noun: 'question', onTick: function () {
                paintMark(); refresh();
              } })
            ];
          }

          const answerHost = el('div', { class: 'prose tight', style: { marginTop: '8px' }, hidden: true });
          let built = false;
          const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
            [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: 'Show answer' })]);
          showBtn.addEventListener('click', function () {
            const on = answerHost.hidden;
            if (on && !built) {
              built = true;
              DOM.add(answerHost, [
                q.approach ? el('div', { html: q.approach }) : null,
                q.solution ? el('div', { html: q.solution }) : null,
                q.trap ? el('p', {}, [el('b', { text: 'Trap: ' }), el('span', { html: q.trap })]) : null
              ]);
              UI.math(answerHost);
            }
            answerHost.hidden = !on;
            showBtn.setAttribute('aria-expanded', String(on));
            showBtn.querySelector('.lb').textContent = on ? 'Hide answer' : 'Show answer';
          });

          const pad = el('div', { class: 'scratch' });
          WriteBox.mount(pad, {
            draftKey: 'pyq:' + q.id,
            concept: Pool.concept((q.tests || [])[0]) || { id: q.id, title: q.title || q.id },
            label: 'Scratchpad · work it before you look',
            placeholder: 'What is this question really asking…'
          });

          return [
            el('div', { class: 'prose tight', html: q.prompt }),
            el('div', { class: 'row', style: { gap: '8px', marginTop: '10px' } }, [showBtn]),
            pad, answerHost,
            NoteBody.taskRow('p:' + q.id, { noun: 'question', onTick: function () {
              paintMark(); refresh();
            } })
          ];
        }
      });
    }

    const acc = accordion(nid, open, open ? [el('div', { class: 'stack', style: { gap: '10px' } },
      years().map(function (grp) {
        return el('div', { class: 'stack', style: { gap: '6px' } }, [
          el('div', { class: 'kicker', text: grp.label }),
          el('div', { class: 'stack', style: { gap: '6px' } }, grp.list.map(questionCard))
        ]);
      }))] : [], ctx);

    const count = el('span', { class: 'count' });
    registerMark(function () {
      const st = Progress.pyqState(course.id);
      count.textContent = st.done + ' / ' + st.total;
    });

    const node = el('div', { class: 'tnode sub sec pyq' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const st = Progress.pyqState(course.id);
          return {
            state: st.ready ? 'true' : (st.done ? 'mixed' : 'false'),
            lv: st.ready ? 4 : 0,
            label: st.ready ? 'Every past paper of ' + course.title + ' is complete'
              : 'Mark every past paper of ' + course.title + ' complete'
          };
        }, function () {
          const st = Progress.pyqState(course.id);
          const want = !st.ready;
          st.list.forEach(q => Store.setProofDone('p:' + q.id, want));
          Progress.dropCache();
          DOM.announce(want ? 'Every past paper marked complete.' : 'Past papers cleared.');
          ctx.repaint({});
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', { text: 'JAM past papers' }),
            el('span', { text: qs.length + ' ' + DOM.plural(qs.length, 'question')
              + ' · finishing them is level 4' })
          ]),
          count,
          DOM.icon('chev', 20, 'chev')
        ], function (on) { setSlot('pyq', course.id, on); ctx.repaint({ scroll: false }); })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── a whole course ──────────────────────────────────────────────────── */
  function courseNode(course, ctx) {
    const ids = Pool.ids.concepts(course.id);
    const nid = 'course-' + course.id;
    const open = isOpen('course', course.id);

    const acc = accordion(nid, open, open ? [el('div', { class: 'rail' },
      (course.modules || []).map(mod => moduleNode(course, mod, ctx))
        .concat(course.pending ? [] : [pyqNode(course, ctx)]))] : [], ctx);

    const node = el('div', { class: 'tnode' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        course.pending
          ? staticTick('hourglass_empty')
          : tickButton(function () {
              const lv = Progress.courseLevel(course.id);
              return { state: Progress.tickState(ids), lv: lv,
                label: 'Advance every note of ' + course.title };
            }, function () {
              const to = Progress.advanceMany(ids);
              DOM.announce(to ? course.title + ' at level ' + to + '.' : 'Course cleared.');
              refresh();
            }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: course.title }),
              course.pending ? el('span', { class: 'badge warn', text: 'pending' }) : null
            ]),
            el('span', { text: course.pending ? course.blurb : course.code + ' · ' + course.blurb })
          ]),
          course.pending ? null : ring(() => Progress.count(ids), course.title),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('course', course.id, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── mounting ─────────────────────────────────────────────────────────── */
  function painter(host, build) {
    let isInitial = true;

    function repaint(opts) {
      const o = opts || {};
      const keepY = window.scrollY;

      const currentlyOpenAccs = new Set();
      host.querySelectorAll('.acc.open').forEach(function (node) {
        if (node.id) currentlyOpenAccs.add(node.id);
      });
      ctxOpenAccs = currentlyOpenAccs;

      const prevH = host.offsetHeight;
      if (prevH > 0) host.style.minHeight = prevH + 'px';

      marks = [];
      const ctx = {
        repaint: repaint,
        target: null,
        isInitial: isInitial,
        wasOpen: function (accId) { return currentlyOpenAccs.has(accId); }
      };

      DOM.clear(host);
      host.appendChild(el('div', { class: 'tree' }, build(ctx)));

      window.requestAnimationFrame(function () {
        host.style.minHeight = '';
      });

      const openCid = path().concept;
      document.body.classList.toggle('note-open', !!openCid);
      const openC = openCid ? Pool.concept(openCid) : null;
      if (typeof Shell !== 'undefined' && Shell.setSubtitle) {
        Shell.setSubtitle(openC ? openC.title : '');
      }
      lastTarget = ctx.target;

      if (o.scroll && o.isNote && ctx.target) {
        scrollToNote(ctx.target);
      } else if (o.scroll && ctx.target) {
        scrollTo(ctx.target);
      } else if (o.restore !== false) {
        window.scrollTo(0, keepY);
      }

      isInitial = false;
      isInitialPaint = false;
    }

    /* The first paint leaves the scroll alone — the Study view decides where
       to land, via scrollToOpen(). */
    repaint({ restore: false });
    return repaint;
  }

  let lastTarget = null;

  function scrollToNote(node) {
    if (!node) return;
    const scrollTarget = function () {
      const head = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--head-h'), 10) || 54;
      const rect = node.getBoundingClientRect();
      const targetY = Math.max(0, rect.top + window.scrollY - head - 8);
      window.scrollTo({ top: targetY, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    };
    window.requestAnimationFrame(scrollTarget);
    setTimeout(scrollTarget, 100);
    setTimeout(scrollTarget, 240);
  }

  function scrollTo(node) {
    if (!node) return;
    window.requestAnimationFrame(function () {
      const head = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--head-h'), 10) || 0;
      const y = node.getBoundingClientRect().top + window.scrollY - head - 12;
      window.scrollTo({ top: Math.max(0, y), behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });
  }

  /* Called by the Study view once it is on screen: return to whatever was
     last left open. */
  function scrollToOpen() {
    if (lastTarget) {
      if (path().concept) scrollToNote(lastTarget);
      else scrollTo(lastTarget);
    }
  }

  function mountAll(host, courses) {
    return painter(host, ctx => courses.map(course => courseNode(course, ctx)));
  }

  function mount(host, course) {
    return painter(host, ctx => (course.modules || []).map(mod => moduleNode(course, mod, ctx))
      .concat(course.pending ? [] : [pyqNode(course, ctx)]));
  }

  /* First visit: open the first course, module and section that still have
     work left, so the tree opens somewhere useful rather than flat. */
  function seedOpen(course) {
    if (Store.pref(KEY, null) || Store.pref(LEGACY, null)) { path(); return; }
    const p = {};
    if (course) {
      p.course = course.id;
      const mod = (course.modules || []).filter(x => !x.pending)[0];
      if (mod) {
        p.mod = mod.id;
        const sec = Pool.sections(course.id)
          .filter(s => (mod.secs || []).indexOf(s.sec) >= 0)
          .filter(s => s.concepts.some(c => Progress.level(c.id) < 1))[0];
        if (sec) p.sec = sec.sec;
      }
    }
    savePath(p);
  }

  /* Open the path down to one concept — what `#/note/<id>` now means. */
  function revealPath(conceptId, opts) {
    const c = Pool.concept(conceptId);
    if (!c) return false;
    const course = Pool.courseOfSec(c.sec), mod = Pool.moduleOfSec(c.sec);
    savePath({
      course: course ? course.id : null,
      mod: mod ? mod.id : null,
      sec: c.sec || null,
      concept: c.id,
      pyq: null
    });
    void opts;
    return true;
  }

  return { mount, mountAll, seedOpen, revealPath, refresh, scrollToOpen, path };
})();


/* ── src/comp.question.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One objective question, as a component.

   This used to live inside the Questions page, which is why answering a
   question meant leaving the note that taught it. The machinery is unchanged —
   OMR sheet first, lock, then verdict + worked answer + what it tests + trap +
   variant — it has simply stopped belonging to a screen, so the note can put a
   question inside itself and the reel can put one on a card.

   MCQ, MSQ and NAT are scored by their own rules, not one shared rule:
     MCQ  one key; a wrong lock costs the negative mark
     MSQ  the exact set is required; a clean subset is reported as partial and
          earns nothing, which is the convention these papers use
     NAT  numeric within the stated tolerance; no negative marking
   Only the first lock is recorded.
   ══════════════════════════════════════════════════════════════════════════ */

const QuestionCard = (function () {

  const el = DOM.el;

  /* ── scoring ───────────────────────────────────────────────────────────── */
  function judge(q, given) {
    if (q.type === 'MCQ') {
      return given === q.answer ? 'correct' : 'wrong';
    }
    if (q.type === 'MSQ') {
      const key = q.answer.slice().sort().join(',');
      const got = given.slice().sort().join(',');
      if (key === got) return 'correct';
      const noWrong = given.every(k => q.answer.indexOf(k) >= 0);
      return (noWrong && given.length) ? 'partial' : 'wrong';
    }
    const n = parseFloat(String(given).replace(/[^0-9eE+\-.]/g, ''));
    if (!isFinite(n)) return 'wrong';
    return Math.abs(n - q.answer.value) <= (q.answer.tol || 0) + 1e-12 ? 'correct' : 'wrong';
  }

  const awarded = (q, verdict) =>
    verdict === 'correct' ? q.marks : (q.type === 'MCQ' ? (q.neg || 0) : 0);

  const keyText = q => q.type === 'NAT'
    ? q.answer.value.toFixed(q.answer.dp || 0) + (q.answer.tol ? ' (± ' + q.answer.tol + ')' : '')
    : (Array.isArray(q.answer) ? q.answer.join(' and ') : q.answer);

  const givenText = (q, given) => q.type === 'NAT'
    ? String(given)
    : (Array.isArray(given) ? (given.slice().sort().join(' and ') || '—') : given);

  /* The figure of the first tested concept that has one — seeing the picture
     right after the attempt is when it lands hardest. */
  function figureFor(q) {
    const withFig = (q.tests || [])
      .map(id => Pool.concept(id))
      .filter(c => c && Fig.forConcept(c).length)[0];
    if (!withFig) return null;
    const def = Fig.forConcept(withFig)[0].def;
    return el('div', { class: 'stack', style: { gap: '8px' } }, [
      el('div', { class: 'kicker', text: 'The picture behind it' }),
      Fig.frame(def)
    ]);
  }

  /* ── the component ───────────────────────────────────────────────────────
     opts.inNote   true when the question is open inside a note: the links back
                   to concepts are then pointless and the chrome is lighter
     opts.tail     extra nodes appended after the worked answer (the "next
                   question" row the Questions page still wants)
     opts.onLocked called with the verdict once the first lock lands */
  function build(q, opts) {
    const o = opts || {};
    const rec = Store.omr(q.id);
    const already = rec && rec.first;

    let given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
    let locked = false;
    const started = Date.now();

    const sheetHost = el('div', {});
    const actionHost = el('div', {});
    const resultHost = el('div', {});

    const timer = el('span', { class: 'timer', text: '0:00' });
    const tick = window.setInterval(function () {
      /* stop on lock, and stop once this component has been thrown away */
      if (locked || !document.body.contains(timer)) { window.clearInterval(tick); return; }
      timer.textContent = UI.clock(Date.now() - started);
    }, 1000);

    /* — OMR sheet — */
    function paintSheet(focusIdx) {
      DOM.clear(sheetHost);

      if (q.type === 'NAT') {
        const input = el('input', {
          type: 'text', inputmode: 'decimal', autocomplete: 'off',
          'aria-label': 'Your numeric answer', placeholder: '0.00',
          disabled: locked || null
        });
        input.value = typeof given === 'string' ? given : '';
        input.addEventListener('input', function () { given = input.value; paintActions(); });
        sheetHost.appendChild(el('div', { class: 'nat-in' }, [
          input,
          el('span', { class: 'small muted', text: q.answer.dp
            ? 'to ' + q.answer.dp + ' decimal places' : 'integer' })
        ]));
        if (locked) {
          sheetHost.appendChild(el('p', { class: 'small muted', style: { margin: '8px 0 0' },
            text: 'Accepted range: ' + keyText(q) }));
        }
        return;
      }

      const msq = q.type === 'MSQ';
      const group = el('div', {
        class: 'omr', role: msq ? 'group' : 'radiogroup',
        'aria-label': msq ? 'Select all correct options' : 'Select one option'
      });

      (q.options || []).forEach(function (opt) {
        const chosen = msq ? given.indexOf(opt.k) >= 0 : given === opt.k;
        const isKey = locked && (msq ? q.answer.indexOf(opt.k) >= 0 : q.answer === opt.k);
        const badChoice = locked && chosen && !isKey;

        const row = el('button', {
          class: 'omr-opt' + (msq ? ' msq' : '') + (isKey ? ' key' : '') + (badChoice ? ' chosen-bad' : ''),
          type: 'button',
          role: msq ? 'checkbox' : 'radio',
          'aria-checked': String(chosen),
          'aria-disabled': locked ? 'true' : null
        }, [
          el('span', { class: 'bub', 'aria-hidden': 'true', text: opt.k }),
          el('span', { class: 't', html: opt.t }),
          locked && isKey ? el('span', { class: 'omr-mark ok', text: 'key' }) : null,
          badChoice ? el('span', { class: 'omr-mark bad', text: 'yours' }) : null
        ]);

        if (!locked) row.addEventListener('click', function () {
          if (msq) {
            const i = given.indexOf(opt.k);
            if (i >= 0) given.splice(i, 1); else given.push(opt.k);
          } else given = opt.k;
          paintSheet(q.options.indexOf(opt));   /* keep focus on the row just used */
          paintActions();
        });
        group.appendChild(row);
      });

      /* arrow-key movement inside the group, as a radiogroup should behave */
      group.addEventListener('keydown', function (e) {
        if (locked) return;
        const keys = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'];
        if (keys.indexOf(e.key) < 0) return;
        e.preventDefault();
        const rows = Array.prototype.slice.call(group.querySelectorAll('.omr-opt'));
        const at = rows.indexOf(document.activeElement);
        const dir = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
        const nextRow = rows[(at + dir + rows.length) % rows.length];
        if (nextRow) nextRow.focus();
      });

      sheetHost.appendChild(group);
      if (focusIdx != null) {
        const rows = group.querySelectorAll('.omr-opt');
        if (rows[focusIdx]) rows[focusIdx].focus({ preventScroll: true });
      }
      UI.math(group);
    }

    /* — lock / clear — */
    function hasAnswer() {
      if (q.type === 'MSQ') return given.length > 0;
      if (q.type === 'NAT') return String(given).trim().length > 0;
      return !!given;
    }

    function paintActions() {
      DOM.clear(actionHost);
      if (locked) return;
      DOM.add(actionHost, [
        el('div', { class: 'btn-row' }, [
          el('button', {
            class: 'btn primary', type: 'button', disabled: hasAnswer() ? null : true,
            text: q.type === 'MSQ' ? 'Lock ' + (given.length || 'no') + ' selected' : 'Lock answer',
            on: { click: lock }
          }),
          hasAnswer() ? el('button', { class: 'btn', type: 'button', text: 'Clear',
            on: { click: function () {
              given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
              paintSheet(); paintActions();
            } } }) : null
        ]),
        el('p', { class: 'small muted', style: { margin: '10px 0 0' },
          text: already
            ? 'Your first attempt (' + already.verdict + ') is already on record; this pass is not recorded.'
            : 'Locking records your first attempt. The worked answer follows immediately.' })
      ]);
    }

    function lock() {
      if (locked || !hasAnswer()) return;
      locked = true;
      const verdict = judge(q, given);
      const ms = Date.now() - started;
      const saved = Store.lockOmr(q.id, { given: given, verdict: verdict, ms: ms });
      paintSheet();
      DOM.clear(actionHost);
      resultHost.appendChild(feedback(q, given, verdict, ms, saved));
      UI.math(resultHost);
      DOM.announce(verdict === 'correct' ? 'Correct.' : verdict === 'partial'
        ? 'Partially correct — no marks under this paper’s rule.' : 'Incorrect. Worked answer shown.');
      if (o.onLocked) o.onLocked(verdict);
      const h = resultHost.querySelector('.verdict');
      if (h) h.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    /* — after the lock: verdict, worked answer, what it tests, trap, twist — */
    function feedback(q, given, verdict, ms, saved) {
      const wrap = el('div', { class: 'stack' });
      const marks = awarded(q, verdict);
      const cls = verdict === 'correct' ? 'ok' : verdict === 'partial' ? 'warn' : 'bad';
      const glyph = verdict === 'correct' ? 'check_circle' : verdict === 'partial' ? 'remove_circle' : 'cancel';

      DOM.add(wrap, [
        el('div', { class: 'verdict ' + cls }, [
          el('span', { class: 'g', 'aria-hidden': 'true' }, [DOM.mi(glyph)]),
          el('span', {}, [
            el('b', { text: verdict === 'correct' ? 'Correct' : verdict === 'partial'
              ? 'Partially correct — this paper awards nothing for a partial set' : 'Not correct' }),
            el('span', { text: 'You answered ' + givenText(q, given) + ' · key ' + keyText(q) +
              ' · ' + (marks > 0 ? '+' : '') + (Math.round(marks * 100) / 100) + ' ' +
              DOM.plural(Math.abs(marks), 'mark') + ' · ' + UI.clock(ms) })
          ])
        ]),

        saved.tries > 1 ? el('p', { class: 'small muted', style: { margin: 0 },
          text: 'First attempt (' + saved.first.verdict + ') is unchanged — that is the number the stats use.' }) : null,

        el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: 'Worked answer' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.solution, 'tight')])
        ]),

        q.tested ? el('div', { class: 'card tint' }, [
          el('div', { class: 'kicker', text: 'What this actually tests' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.tested, 'tight')]),
          o.inNote ? null : el('div', { class: 'row', style: { marginTop: '12px' } },
            (q.tests || []).map(function (id) {
              const c = Pool.concept(id);
              return c
                ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
                : el('span', { class: 'chip ghost', text: id });
            }))
        ]) : null,

        /* the picture of the idea being examined, where there is one */
        figureFor(q),

        q.trap ? el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: 'The trap' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.trap, 'tight')])
        ]) : null,

        q.twist ? UI.reveal('Changed version', function () {
          return el('div', { class: 'stack', style: { gap: '10px' } }, [
            UI.prose(q.twist.q, 'tight'),
            UI.reveal('Answer', () => UI.prose(q.twist.a, 'tight'),
              { openLabel: 'Show', closeLabel: 'Hide' })
          ]);
        }, { openLabel: 'Try the variant', closeLabel: 'Hide the variant' }) : null,

        o.tail || null
      ]);
      return wrap;
    }

    const node = el('div', { class: o.inNote ? 'stack qcard' : 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'row' }, [
          UI.typeBadge(q),
          q.mock ? el('span', { class: 'badge warn', text: 'draft' }) : null
        ]),
        timer
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.metaRow(q)]),
      el('div', { style: { marginTop: '14px' } }, [UI.prose(q.prompt)]),
      el('div', { style: { marginTop: '16px' } }, [sheetHost]),
      el('div', { style: { marginTop: '16px' } }, [actionHost]),
      resultHost
    ]);

    paintSheet();
    paintActions();
    UI.math(node);
    return node;
  }

  return { build, judge, awarded, keyText, givenText, figureFor };
})();


/* ── src/comp.note.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One concept note, as a component that opens INSIDE the syllabus.

   The note used to be a page of its own, which meant that reading a section
   was a loop of leaving the tree and coming back to it — four screens for one
   act of studying. It is now a body with no chrome: the tree expands a row and
   drops this in, and everything the note used to link out to (its proof, its
   exercises, its objective questions, the writing workspace) opens inside it,
   in the same scroll.

   Nothing here is built until the note is opened, and the questions inside it
   are not built until each one is opened in turn. A section of forty concepts
   costs one row each until you ask for more.

   The vocabulary of the buttons changed with rule 13: a claim is now "Mark as
   complete", not "Tick level 3". The level still moves — it is just no longer
   what the button talks about. Reading is level 1, the proof is level 2, the
   section's exercises are level 3, and a stage that does not exist is skipped
   rather than held against you.
   ══════════════════════════════════════════════════════════════════════════ */

const NoteBody = (function () {

  const el = DOM.el;

  /* ── a lazy, titled expander ─────────────────────────────────────────────
     The one pattern the whole note is built from: a header you press and a
     body that does not exist until you do. */
  function expander(opts) {
    const o = opts || {};
    const isOpen = !!o.open;
    const body = el('div', { class: 'exp-b', hidden: !isOpen });
    const chev = DOM.icon('chev', 18, 'chev');
    const head = el('button', { class: 'exp-h', type: 'button', 'aria-expanded': String(isOpen) }, [
      o.mark || null,
      el('span', { class: 'tt' }, [
        el('b', { text: o.title }),
        o.sub ? el('span', { text: o.sub }) : null
      ]),
      o.badge || null,
      chev
    ]);
    let built = false;
    function openBody() {
      if (!built) {
        built = true;
        DOM.add(body, o.build());
        UI.math(body);
      }
      body.hidden = false;
      head.setAttribute('aria-expanded', 'true');
      if (o.onOpen) o.onOpen(body);
    }
    function closeBody() {
      body.hidden = true;
      head.setAttribute('aria-expanded', 'false');
    }
    head.addEventListener('click', function () {
      if (body.hidden) openBody(); else closeBody();
    });
    if (isOpen) {
      built = true;
      DOM.add(body, o.build());
    }
    const host = el('div', { class: 'exp' + (o.cls ? ' ' + o.cls : '') }, [head, body]);
    host._head = head;
    host._open = openBody;
    host._close = closeBody;
    host._isOpen = function () { return !body.hidden; };
    return host;
  }

  /* ── the prerequisite chain, walked and rendered as a path ──────────────
     A prerequisite is satisfied once it has been READ, and nothing more is
     asked of it. Judging the chain at the highest level anything in it had
     reached was the bug that made groundwork look permanently outstanding. */
  function prereqPath(c) {
    const chain = Pool.chain(c.id, 3);
    if (chain.length < 2) return null;
    const missing = chain.filter(x => x.id !== c.id && !Progress.prereqOk(x.id)).length;

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Route to this result' }),
        missing
          ? el('span', { class: 'badge warn', text: missing + ' not read yet' })
          : el('span', { class: 'badge ok', text: 'groundwork read' })
      ]),
      el('div', { class: 'path', style: { marginTop: '10px' } }, chain.map(function (x, i) {
        const here = x.id === c.id;
        const lv = Progress.level(x.id);
        const ok = Progress.prereqOk(x.id);
        const kids = [
          el('span', { class: 'dot', 'aria-hidden': 'true' },
            [ok && !here ? DOM.mi('check', 'xs') : el('span', { text: here ? '•' : String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: x.title }),
            el('span', { text: here ? 'you are here'
              : '§' + x.sec + ' · ' + x.kind + ' · level ' + lv })
          ])
        ];
        return here
          ? el('div', { class: 'pstep here' }, kids)
          : el('a', { class: 'pstep' + (ok ? ' done' : ''), 'data-lv': String(lv),
              href: Router.href('note/' + x.id) }, kids);
      }))
    ]);
  }

  /* ── reverse edges: what this result is used for ──────────────────────── */
  function unlocks(c) {
    const next = Pool.unlocks(c.id);
    if (!next.length) return null;
    return el('div', { class: 'card tint' }, [
      el('div', { class: 'kicker', text: 'Used later by' }),
      el('div', { class: 'row', style: { marginTop: '10px' } }, next.map(function (x) {
        return el('a', { class: 'chip', href: Router.href('note/' + x.id) }, [
          Progress.level(x.id) >= 1 ? DOM.mi('check', 'xs') : null,
          el('span', { text: x.title })
        ]);
      }))
    ]);
  }

  /* ── the claim that earns a level ────────────────────────────────────────
     One control, because it is one kind of claim — "I produced this myself".
     It is deliberately not a checkbox you can tick on the way past. */
  function taskRow(id, opts) {
    const o = opts || {};
    const noun = o.noun || 'proof';
    const btn = el('button', { class: 'btn', type: 'button' });
    const note = el('p', { class: 'small muted', style: { margin: '8px 0 0' } });

    function paint() {
      const on = Store.isProofDone(id);
      btn.className = 'btn' + (on ? '' : ' primary');
      DOM.clear(btn);
      DOM.add(btn, [
        DOM.mi(on ? 'task_alt' : 'radio_button_unchecked', 'sm'),
        el('span', { text: on ? 'Completed — undo' : 'Mark as complete' })
      ]);
      btn.setAttribute('aria-pressed', String(on));
      note.textContent = on
        ? 'Marked complete on this ' + noun + '.'
        : 'Claim this only if you produced the argument yourself, not if you read it.';
    }

    btn.addEventListener('click', function () {
      const next = !Store.isProofDone(id);
      Store.setProofDone(id, next);
      /* A proof cannot be worked through on a note you have not read, so
         claiming it carries the reading tick with it. An exercise key ('w:')
         is a section-wide claim and owns no single concept, so it carries
         nothing. */
      if (next && id.indexOf('w:') !== 0 && id.indexOf('p:') !== 0 && !Store.isDone(id)) {
        Store.setDone(id, true);
      }
      Progress.dropCache();
      paint();
      if (o.onTick) o.onTick();
      DOM.announce(next ? 'Marked complete.' : 'Completion removed.');
    });
    paint();

    const host = el('div', { class: 'proof-done', style: { marginTop: '16px' } }, [
      el('div', { class: 'btn-row' }, [btn]),
      note
    ]);
    host._paint = paint;
    return host;
  }

  /* ── the proof ───────────────────────────────────────────────────────── */
  function proofView(c, onTick) {
    if (!c.proof) return null;
    const p = c.proof;

    const tryHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });
    const proofHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });

    let tryBuilt = false;
    let proofBuilt = false;
