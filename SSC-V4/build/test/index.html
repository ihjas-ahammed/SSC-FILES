<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="description" content="Real Analysis study system — theorem-statement recall, OMR-first objective questions, and a LaTeX theorem-writing workspace.">
<title>Real Analysis · TEST (mock data)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=block">
<style>
/* app/src/ui.css */
/* ══════════════════════════════════════════════════════════════════════════
   Real Analysis study system — design system.

   Mobile-first, two themes, one content column. Depth comes from layered
   glass over a soft aurora, not from heavy borders. Motion is short, springy
   and always optional (prefers-reduced-motion switches it all off).
   ══════════════════════════════════════════════════════════════════════════ */

@property --p { syntax: '<number>'; inherits: false; initial-value: 0; }

:root {
  /* paper-light */
  --paper:#faf8f4; --surface:#fff; --surface-2:#f4f0e9; --surface-3:#e9e2d6;
  --ink:#191614; --ink-2:#554e46; --ink-3:#847b70;
  --rule:#e4dccf; --rule-2:#cec4b3;
  --accent:#2a45c7; --accent-ink:#fff; --accent-soft:#e9ecfd; --accent-line:#b6c0f3;
  --ok:#0d6b49; --ok-soft:#e1f2ea; --ok-line:#a3d4bf;
  --bad:#a9251d; --bad-soft:#fbe9e7; --bad-line:#e9b1ab;
  --warn:#845200; --warn-soft:#fbf0db; --warn-line:#e2c588;

  /* glass + aurora */
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --glass-line:rgba(25,22,20,.08); --blur:saturate(180%) blur(18px);
  --aurora-1:rgba(42,69,199,.13); --aurora-2:rgba(196,120,0,.11); --aurora-3:rgba(13,107,73,.09);

  --font-prose:'Lora',Georgia,'Times New Roman',serif;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;

  --r-s:9px; --r-m:14px; --r-l:22px;
  --sp:16px;
  --head-h:54px; --tab-h:62px;
  --shadow:0 1px 2px rgba(25,22,20,.05),0 10px 30px -14px rgba(25,22,20,.18);
  --shadow-2:0 2px 6px rgba(25,22,20,.06),0 24px 48px -20px rgba(25,22,20,.28);

  /* The three levels, as one traffic light. They are aliases rather than new
     hexes so a theme only has to get bad/warn/ok right once, and level colour
     can never drift away from the verdict colour it has to sit beside. */
  --lv0:var(--surface-3);
  --lv1:var(--bad);  --lv1-soft:var(--bad-soft);  --lv1-line:var(--bad-line);
  --lv2:var(--warn); --lv2-soft:var(--warn-soft); --lv2-line:var(--warn-line);
  --lv3:var(--ok);   --lv3-soft:var(--ok-soft);   --lv3-line:var(--ok-line);
  /* Level 4 is a COURSE rung — its past papers are done — so it is deliberately
     off the traffic light: nothing below a course can ever wear it. */
  --lv4:#6d4aff; --lv4-soft:#efeaff; --lv4-line:#c6b6ff;

  --rail-w:236px;
  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.44,.5,1);
  --dur:.34s; --dur-s:.18s;
  color-scheme:light;
}

:root[data-theme=dark] {
  --paper:#101216; --surface:#191c22; --surface-2:#21252d; --surface-3:#2b313b;
  --ink:#eae7e1; --ink-2:#aaa39b; --ink-3:#7e7770;
  --rule:#2b3038; --rule-2:#3a414d;
  --accent:#93a8ff; --accent-ink:#0d1020; --accent-soft:#1c2340; --accent-line:#39457a;
  --ok:#5ec79c; --ok-soft:#122a21; --ok-line:#26533e;
  --bad:#ff9087; --bad-soft:#2c1715; --bad-line:#5d2926;
  --warn:#e2b567; --warn-soft:#292013; --warn-line:#51401e;
  --lv4:#b6a2ff; --lv4-soft:#211b3c; --lv4-line:#453a78;

  --glass:rgba(25,28,34,.68); --glass-2:rgba(25,28,34,.5);
  --glass-line:rgba(255,255,255,.07); --blur:saturate(150%) blur(20px);
  --aurora-1:rgba(94,120,255,.17); --aurora-2:rgba(255,167,64,.10); --aurora-3:rgba(64,200,150,.10);

  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-2:0 2px 8px rgba(0,0,0,.45),0 28px 56px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font:400 16px/1.55 var(--font-ui);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);
  overflow-x:hidden;
}
/* the light the glass bends */
body::before{
  content:''; position:fixed; inset:-20% -10% auto -10%; height:120vh; z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(52vw 42vw at 12% 4%, var(--aurora-1), transparent 62%),
    radial-gradient(44vw 40vw at 92% 14%, var(--aurora-2), transparent 64%),
    radial-gradient(48vw 44vw at 50% 92%, var(--aurora-3), transparent 66%);
}

h1,h2,h3{ margin:0; font-weight:600; letter-spacing:-.014em; line-height:1.22; }
h1{ font-size:1.42rem; } h2{ font-size:1.06rem; } h3{ font-size:.95rem; }
p{ margin:0 0 .7em; } ul,ol{ margin:0 0 .7em; padding-left:1.25em; } li{ margin:.25em 0; }
a{ color:var(--accent); text-underline-offset:2px; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:5px; }
h1[tabindex="-1"]:focus,main:focus{ outline:none; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:8px; top:-48px; z-index:60; background:var(--accent);
  color:var(--accent-ink); padding:10px 14px; border-radius:var(--r-s); transition:top .15s; }
.skip:focus{ top:8px; }

/* ── shell ───────────────────────────────────────────────────────────────── */
.top{
  position:sticky; top:0; z-index:30; height:var(--head-h);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glass-line);
}
.brand{ display:flex; align-items:center; gap:8px; min-width:0; overflow:hidden; }
.brand-titles{ display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.brand-titles b{ font-weight:600; font-size:.95rem; white-space:nowrap; line-height:1.2; }
.brand-sub{ font-size:.70rem; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:240px; line-height:1.2; margin-top:1px; }
.brand-sub:empty{ display:none; }
.brand span.mock-tag{ color:var(--ink-3); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; }
.top .grow{ flex:1 1 auto; }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-width:42px; height:42px; padding:0 11px;
  border:1px solid var(--glass-line); background:var(--glass-2);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-radius:999px; cursor:pointer; font-size:.82rem; color:var(--ink-2);
  transition:transform var(--dur-s) var(--spring), color var(--dur-s), border-color var(--dur-s);
}
.icon-btn:hover{ color:var(--ink); border-color:var(--rule-2); }
.icon-btn:active{ transform:scale(.93); }
.icon-btn svg{ width:17px; height:17px; flex:0 0 auto; }

/* ── icons ───────────────────────────────────────────────────────────────
   Material Symbols as a ligature font: `<span class="mi">arrow_back</span>`.
   The stylesheet is requested with `display=block`, so the glyph never flashes
   as the literal word "arrow_back" before the font arrives. */
.mi{
  font-family:'Material Symbols Outlined'; font-weight:normal; font-style:normal;
  font-size:20px; line-height:1; letter-spacing:normal; text-transform:none;
  display:inline-block; white-space:nowrap; word-wrap:normal; direction:ltr;
  -webkit-font-feature-settings:'liga'; font-feature-settings:'liga';
  -webkit-font-smoothing:antialiased; flex:0 0 auto; user-select:none;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
.mi.fill{ font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }
.mi.sm{ font-size:17px; }
.mi.lg{ font-size:24px; }
.mi.xs{ font-size:14px; }

/* ── navigation ──────────────────────────────────────────────────────────
   ONE element, two layouts. On a phone it is the bottom tab bar. From 900px
   it becomes a left rail carrying its own brand, back button and shell
   controls — and the top header is removed entirely, so the window's whole
   height belongs to what you are reading. */
nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.rail-top,.rail-foot{ display:none; }
.rail-nav{ display:grid; grid-auto-flow:column; grid-auto-columns:1fr; }
.rail-nav a{
  position:relative; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; height:var(--tab-h); text-decoration:none;
  color:var(--ink-3); font-size:.66rem; letter-spacing:.02em; font-weight:500;
  transition:color var(--dur-s), background var(--dur-s);
}
.rail-nav a .mi{ font-size:22px; transition:transform var(--dur) var(--spring); }
.rail-nav a:active .mi{ transform:scale(.88); }
.rail-nav a[aria-current=page]{ color:var(--accent); }
.rail-nav a[aria-current=page] .mi{ font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24; }
.rail-nav a[aria-current=page]::before{
  content:''; position:absolute; top:0; left:50%; width:26px; height:3px;
  transform:translateX(-50%); border-radius:0 0 4px 4px; background:var(--accent);
}

.rail-brand{ display:flex; flex-direction:column; min-width:0; text-decoration:none;
  color:inherit; line-height:1.2; }
.rail-brand b{ font-size:.95rem; font-weight:600; letter-spacing:-.01em; }
.rail-brand span{ font-size:.6rem; letter-spacing:.11em; text-transform:uppercase;
  color:var(--ink-3); }
.rail-brand .brand-sub{ font-size:.70rem; color:var(--ink-3); text-transform:none;
  letter-spacing:normal; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  max-width:140px; margin-top:2px; }
.rail-brand .brand-sub:empty{ display:none; }
.rail-btn{
  display:flex; align-items:center; gap:12px; height:40px; padding:0 11px; width:100%;
  border:0; background:none; border-radius:10px; cursor:pointer; color:var(--ink-2);
  font:500 .84rem/1 var(--font-ui); text-align:left;
  transition:background var(--dur-s), color var(--dur-s);
}
.rail-btn:hover{ background:var(--surface-2); color:var(--ink); }
.rail-btn:active{ transform:scale(.97); }
.rail-btn[disabled]{ opacity:.35; cursor:not-allowed; }
.icon-btn[disabled]{ opacity:.35; cursor:not-allowed; }

main{ display:block; }
.wrap{ width:100%; max-width:730px; margin:0 auto; padding:18px 14px 30px; }
.wrap.bleed{ padding:0; max-width:none; }

@media (min-width:900px){
  /* No top bar and no tab strip: both bands of vertical chrome are gone and
     the reel, the tree and the note each get the full window. */
  :root{ --head-h:0px; --tab-h:0px; }
  header.top{ display:none; }
  body{ padding-bottom:0; padding-left:var(--rail-w); }

  nav.tabs{
    top:0; bottom:0; right:auto; width:var(--rail-w);
    display:flex; flex-direction:column; gap:6px;
    border-top:0; border-right:1px solid var(--glass-line);
    padding:14px 10px calc(14px + env(safe-area-inset-bottom,0px));
  }
  .rail-top{ display:flex; align-items:center; gap:6px; padding:2px 2px 10px;
    border-bottom:1px solid var(--rule); }
  .rail-top .rail-btn{ width:auto; flex:0 0 auto; padding:0 8px; }
  .rail-top .rail-btn .lb{ display:none; }
  .rail-nav{ display:flex; flex-direction:column; gap:2px; }
  .rail-foot{ display:flex; flex-direction:column; gap:2px; margin-top:auto;
    padding-top:8px; border-top:1px solid var(--rule); }

  .rail-nav a{
    height:42px; flex-direction:row; justify-content:flex-start; gap:12px;
    padding:0 11px; border-radius:10px; font-size:.88rem; font-weight:500;
  }
  .rail-nav a:hover{ background:var(--surface-2); color:var(--ink); }
  .rail-nav a[aria-current=page]{ background:var(--accent-soft); }
  .rail-nav a[aria-current=page]::before{
    top:50%; left:0; width:3px; height:20px; transform:translateY(-50%);
    border-radius:0 3px 3px 0;
  }

  .wrap{ padding:30px 36px 72px; max-width:880px; }

  /* Full screen narrows the rail to its glyphs — the point of the button is
     the reading column, so the chrome gives ground first. */
  body.is-full{ padding-left:62px; }
  body.is-full nav.tabs{ width:62px; padding-left:7px; padding-right:7px; align-items:stretch; }
  body.is-full .rail-brand{ display:none; }
  body.is-full .rail-nav a,body.is-full .rail-btn{ justify-content:center; gap:0; padding:0; }
  body.is-full .rail-nav a .lb,body.is-full .rail-btn .lb{ display:none; }
  body.is-full .rail-top{ justify-content:center; }
  body.is-full .wrap{ max-width:940px; }
}

@media (min-width:1500px){
  .wrap{ max-width:960px; }
}

/* ── motion ──────────────────────────────────────────────────────────────── */
@keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
@keyframes pop{ from{ opacity:0; transform:scale(.9) } to{ opacity:1; transform:none } }
@keyframes slideIn{ from{ opacity:0; transform:translateY(16px) scale(.985) }
  to{ opacity:1; transform:none } }
@keyframes sweepIn{ from{ clip-path:inset(0 100% 0 0) } to{ clip-path:inset(0) } }
@keyframes drawIn{ from{ stroke-dashoffset:var(--len,600) } to{ stroke-dashoffset:0 } }
@keyframes glow{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

.view-in{ animation:rise var(--dur) var(--ease) both; }
.stagger>*{ animation:rise .42s var(--ease) both; animation-delay:calc(var(--i,0)*45ms); }
.verdict{ animation:slideIn .4s var(--spring) both; }

/* ── type helpers ────────────────────────────────────────────────────────── */
.kicker{ font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); }
.lede{ font-family:var(--font-prose); font-size:1.04rem; color:var(--ink-2); }
.muted{ color:var(--ink-3); }
.small{ font-size:.81rem; }
.mono{ font-family:var(--font-mono); font-size:.86em; }
.stack{ display:flex; flex-direction:column; gap:var(--sp); }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.spread{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
/* the two-line label: a title over a caption. Defined once here so a .tt used
   outside a list row still stacks instead of running the caption on. */
.tt{ min-width:0; }
.tt>b{ display:block; font-weight:500; }
.tt>span{ display:block; font-size:.78rem; color:var(--ink-3); }

/* ── surfaces ────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-m);
  padding:16px; box-shadow:var(--shadow);
}
.card.flat{ box-shadow:none; }
.card.tint{ background:var(--surface-2); box-shadow:none; }
.card.glass{
  background:var(--glass); border-color:var(--glass-line);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-2);
}
a.card,button.card{ display:block; text-decoration:none; color:inherit; text-align:left;
  width:100%; cursor:pointer; transition:transform var(--dur-s) var(--ease),
  border-color var(--dur-s), box-shadow var(--dur-s); }
a.card:hover,button.card:hover{ border-color:var(--accent-line); box-shadow:var(--shadow-2); }
a.card:active,button.card:active{ transform:scale(.985); }
.card h2,.card h3{ margin-bottom:6px; }
.hr{ height:1px; background:var(--rule); border:0; margin:14px 0; }

/* ── badges & chips ──────────────────────────────────────────────────────── */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:.68rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule);
  white-space:nowrap;
}
.badge.accent{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); }
.badge.ok{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
.badge.bad{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
.badge.warn{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  font-size:.81rem; cursor:pointer; text-decoration:none; min-height:36px;
  transition:transform var(--dur-s) var(--spring), background var(--dur-s),
    color var(--dur-s), border-color var(--dur-s);
}
.chip:hover{ border-color:var(--rule-2); color:var(--ink); }
.chip:active{ transform:scale(.94); }
.chip[aria-pressed=true],.chip.on{ background:var(--accent-soft); color:var(--accent);
  border-color:var(--accent-line); font-weight:600; }
.chip[disabled]{ opacity:.55; cursor:not-allowed; }
.chip.ghost{ background:transparent; border-style:dashed; }

/* ── buttons ─────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 18px; border-radius:var(--r-s); cursor:pointer;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font-size:.93rem; font-weight:500; text-decoration:none; text-align:center;
  transition:transform var(--dur-s) var(--spring), filter var(--dur-s), border-color var(--dur-s);
}
.btn:hover{ border-color:var(--rule-2); }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  font-weight:600; box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent); }
.btn.primary:hover{ filter:brightness(1.07); }
.btn.quiet{ background:transparent; border-color:transparent; color:var(--accent); }
.btn.full{ width:100%; }
.btn[disabled]{ opacity:.6; cursor:not-allowed; transform:none; }
.btn.primary[disabled]{ background:var(--surface-2); border-color:var(--rule);
  color:var(--ink-3); opacity:1; box-shadow:none; }
.btn.sm{ min-height:36px; padding:0 14px; font-size:.84rem; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn-row>.btn{ flex:1 1 auto; }

/* ── concept reference links ──────────────────────────────────────────────── */
.concept-ref{
  display:inline-flex; align-items:center; gap:4px; padding:1px 8px; margin:0 2px;
  border-radius:var(--r-s, 6px); background:var(--accent-soft); color:var(--accent);
  font-weight:600; font-size:.88em; text-decoration:none;
  border:1px solid var(--accent-line); vertical-align:baseline;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:background var(--dur-s), color var(--dur-s), border-color var(--dur-s), transform var(--dur-s);
}
.concept-ref:hover{
  background:var(--accent); color:var(--accent-ink, #ffffff);
  border-color:var(--accent); text-decoration:none;
}
.concept-ref:active{ transform:scale(.96); }

.proof-scratchpad{
  width:100%; min-height:85px; padding:10px 12px; margin-top:8px; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:.9rem; line-height:1.5; resize:vertical;
}
.proof-scratchpad:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);
}

/* ── prose (authored HTML + TeX) ─────────────────────────────────────────── */
.prose{ font-family:var(--font-prose); font-size:1.03rem; line-height:1.68; color:var(--ink); }
.prose b{ font-weight:600; }
.prose :last-child{ margin-bottom:0; }
.prose mjx-container[display=true]{ overflow-x:auto; overflow-y:hidden; padding:2px 0; }
mjx-container{ max-width:100%; }
.prose.tight{ font-size:.97rem; line-height:1.62; }

/* ── stats, meters, rings ────────────────────────────────────────────────── */
.stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(132px,1fr)); gap:10px; }
.stat{ background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-m);
  padding:12px; }
.stat .n{ font-size:1.55rem; font-weight:600; letter-spacing:-.025em; line-height:1.1; }
.stat .l{ font-size:.67rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
  margin-top:3px; }
.stat .s{ font-size:.74rem; color:var(--ink-2); margin-top:4px; }
.meter{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.meter>i{ display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ok)));
  transition:width .6s var(--ease); animation:sweepIn .7s var(--ease) both; }
.meter.ok>i{ background:var(--ok); }
.meter.lv1>i{ background:var(--lv1); }
.meter.lv2>i{ background:var(--lv2); }
.meter.lv3>i{ background:var(--lv3); }

.ring{ position:relative; width:38px; height:38px; flex:0 0 auto; border-radius:50%;
  --ring-c:var(--accent);
  display:grid; place-items:center; transition:--p .7s var(--ease);
  background:conic-gradient(var(--ring-c) calc(var(--p)*1%), var(--surface-3) 0); }
/* the ring is coloured by the level the WHOLE group has reached, and filled by
   how much of it has reached the next one */
.ring[data-lv="1"]{ --ring-c:var(--lv1); }
.ring[data-lv="2"]{ --ring-c:var(--lv2); }
.ring[data-lv="3"]{ --ring-c:var(--lv3); }
.ring>i{ width:30px; height:30px; border-radius:50%; background:var(--surface);
  display:grid; place-items:center; font-style:normal; font-size:.62rem;
  font-family:var(--font-mono); color:var(--ink-2); }
.ring[data-lv="1"]>i,.ring[data-lv="2"]>i,.ring[data-lv="3"]>i{ color:var(--ring-c); }

/* ── the three-level bar ────────────────────────────────────────────────────
   One track, three layers, widest first: red is "reached level 1", amber sits
   on top of it for level 2, green on top of that for level 3. Because each
   fraction contains the next, the layers read left to right as green | amber |
   red | untouched without any arithmetic. */
.lvbar{ position:relative; height:7px; border-radius:999px; background:var(--surface-3);
  overflow:hidden; }
.lvbar>i{ position:absolute; left:0; top:0; bottom:0; border-radius:999px;
  transition:width .6s var(--ease); animation:sweepIn .7s var(--ease) both; }
.lvbar>i.a{ background:var(--lv1); }
.lvbar>i.b{ background:var(--lv2); }
.lvbar>i.c{ background:var(--lv3); }
.lvkey{ display:flex; gap:12px; flex-wrap:wrap; font-size:.64rem; color:var(--ink-3);
  margin-top:6px; }
.lvkey>span{ display:inline-flex; align-items:center; gap:5px; }
.lvkey em{ width:8px; height:8px; border-radius:50%; display:inline-block; }
.lvkey .k1 em{ background:var(--lv1); } .lvkey .k2 em{ background:var(--lv2); }
.lvkey .k3 em{ background:var(--lv3); }
.badge.lv1{ background:var(--lv1-soft); color:var(--lv1); border-color:var(--lv1-line); }
.badge.lv2{ background:var(--lv2-soft); color:var(--lv2); border-color:var(--lv2-line); }
.badge.lv3{ background:var(--lv3-soft); color:var(--lv3); border-color:var(--lv3-line); }

/* ── mastery ladder ─────────────────────────────────────────────────────── */
.ladder{ display:flex; gap:6px; }
.ladder>span{ flex:1 1 0; height:6px; border-radius:999px; background:var(--surface-3);
  transition:background var(--dur); }
.ladder>span.on{ animation:sweepIn .5s var(--ease) both; }
.ladder>span.on.l1{ background:var(--lv1); }
.ladder>span.on.l2{ background:var(--lv2); }
.ladder>span.on.l3{ background:var(--lv3); }
.ladder-l{ display:flex; justify-content:space-between; font-size:.66rem; color:var(--ink-3);
  margin-top:6px; }

/* ── the tick tree ───────────────────────────────────────────────────────── */
.tree{ display:flex; flex-direction:column; gap:10px; }
.tnode{ border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface);
  box-shadow:var(--shadow); overflow:hidden;
  transition:border-radius .42s var(--ease), border-color .42s var(--ease),
    margin .42s var(--ease), padding .42s var(--ease), box-shadow .42s var(--ease); }
.tnode.sub{ border-radius:var(--r-s); box-shadow:none; background:var(--surface-2);
  transition:border-radius .42s var(--ease), border-color .42s var(--ease),
    margin .42s var(--ease), padding .42s var(--ease), background .42s var(--ease); }
.trow{ display:flex; align-items:stretch; gap:0; }
.tlabel{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:8px;
  padding:13px 14px 13px 4px; background:none; border:0; cursor:pointer; text-align:left;
}
.tnode.sub .tlabel{ padding-top:11px; padding-bottom:11px; }
.tlabel .tt{ flex:1 1 auto; min-width:0; }
.tlabel .tt b{
  display:block;
  font-weight:500;
  font-size:.97rem;
  letter-spacing:-.005em;
  line-height:1.35;
  color:var(--ink);
}
.tlabel .tt b span:not(.badge){
  display:inline;
  font-size:inherit;
  color:inherit;
  font-weight:inherit;
}
.tlabel .tt b .badge{
  display:inline-flex;
  vertical-align:middle;
  margin-left:6px;
  margin-top:-2px;
  font-size:.62rem;
  padding:2px 7px;
  line-height:1.2;
  white-space:nowrap;
}
.tlabel .tt>span{
  display:block;
  font-size:.75rem;
  color:var(--ink-3);
  margin-top:2px;
  line-height:1.35;
}
.tnode.sub .tlabel .tt b{ font-size:.92rem; }
.tlabel .count{ white-space:nowrap; flex:0 0 auto; }
.chev{ flex:0 0 auto; width:20px; height:20px; color:var(--ink-3);
  transition:transform var(--dur) var(--spring); }
.tlabel[aria-expanded=true] .chev{ transform:rotate(90deg); color:var(--accent); }

/* the tick itself — the thing you came here to press */
.tick{
  flex:0 0 auto; width:42px; display:grid; place-items:center; cursor:pointer;
  background:none; border:0;
}
.tick>i{
  width:24px; height:24px; border-radius:7px; border:2px solid var(--rule-2);
  display:grid; place-items:center; font-style:normal; font-size:.78rem; color:transparent;
  background:var(--surface); line-height:1;
  transition:background var(--dur-s), border-color var(--dur-s), color var(--dur-s),
    transform var(--dur-s) var(--spring);
}
.tick:hover>i{ border-color:var(--accent); }
.tick:active>i{ transform:scale(.86); }
.tick[aria-checked=true]>i{ background:var(--lv1); border-color:var(--lv1); color:#fff; }
.tick[data-lv="2"]>i{ background:var(--lv2); border-color:var(--lv2); color:#fff; }
.tick[data-lv="3"]>i{ background:var(--lv3); border-color:var(--lv3); color:#fff; }
.tick[aria-checked=mixed]>i{ background:var(--accent-soft); border-color:var(--accent);
  color:var(--accent); }
.tick[aria-checked=true]>i,.tick[aria-checked=mixed]>i{ animation:pop .26s var(--spring) both; }

/* animated open/close: 0fr -> 1fr, no JS measuring */
.acc{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur) var(--ease); }
.acc.open{ grid-template-rows:1fr; }
.acc>.acc-in{ overflow:hidden; }
.acc-pad{ padding:0 8px 10px; display:flex; flex-direction:column; gap:8px;
  transition:padding .42s var(--ease); }
.tnode.sub .acc-pad{ padding:0 6px 8px; }
.tnode.sec .acc-pad{ padding:0 0 8px; gap:6px; }
/* One faint rail at the course level and none below it: every deeper level
   keeps the full width, so a three-deep tree never squeezes the text. */
.rail{ border-left:2px solid var(--rule); padding-left:8px; display:flex;
  flex-direction:column; gap:8px; }
/* a section is a flush band inside its module, not another card */
.tnode.sec{ background:transparent; border:0; border-top:1px solid var(--rule);
  border-radius:0; box-shadow:none; }
.tnode.sec:first-child{ border-top:0; }
.tnode.sec .tlabel{ padding-left:2px; }

.crow{ display:flex; align-items:stretch; border-radius:var(--r-s); background:var(--surface);
  border:1px solid var(--rule); overflow:hidden; }
.tnode.sub .crow{ background:var(--surface); }
.crow>a{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px;
  padding:10px 12px 10px 2px; text-decoration:none; color:inherit; }
.crow .tt{ flex:1 1 auto; min-width:0; }
.crow>a:hover{ background:var(--surface-2); }
.crow .tt b{ display:block; font-weight:500; font-size:.92rem; }
.crow .tt span{ display:block; font-size:.72rem; color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crow[data-lv="1"]{ border-color:var(--lv1-line); }
.crow[data-lv="2"]{ border-color:var(--lv2-line); }
.crow[data-lv="3"]{ border-color:var(--lv3-line); }
.crow[data-lv="3"] .tt b{ color:var(--ink-2); }

/* ── recall reel ─────────────────────────────────────────────────────────── */
/* ── recall reel ──────────────────────────────────────────────────────────
   One swipe, one card — the Shorts/Reels rule, and it is `scroll-snap-stop:
   always` that enforces it. Without it a flick keeps its momentum and sails
   past two or three snap points before settling, which reads as "it swiped
   twice". With it the scroller must come to rest on the very next snap point
   however hard the flick was.

   That rule only holds if every card is EXACTLY one viewport tall. So the card
   is a fixed-height frame and its content scrolls inside `.inner`, whose
   overscroll behaviour is left at `auto` on purpose: it scrolls to its own end
   and then chains out to the reel. (`contain` was tried and is what trapped
   the gesture on a long card — the inner scroller ate the touch and refused to
   hand it back.)

   `position:relative` on the reel is load-bearing too: it makes the reel the
   offsetParent of its cards, so card.offsetTop and reel.scrollTop are in the
   same coordinate system. And nothing here may carry a `transform`, because
   the browser snaps to the TRANSFORMED box — a decorative scale() silently
   moves every snap point. */
.reel{
  position:relative;
  height:calc(100dvh - var(--head-h) - var(--tab-h) - env(safe-area-inset-bottom,0px));
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scroll-snap-type:y mandatory; scroll-behavior:smooth;
  scrollbar-width:none;
}
.reel::-webkit-scrollbar{ display:none; }
@media (min-width:880px){ .reel{ height:calc(100dvh - var(--head-h) - var(--tab-h)); } }

.reel-card{
  height:100%; flex:0 0 100%;
  scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; flex-direction:column; position:relative;
  transition:opacity var(--dur) var(--ease);
  opacity:.45;
}
.reel-card.live{ opacity:1; }

/* the card's own scroll region — this is where a long statement goes */
.reel-card>.inner{
  flex:1 1 auto; width:100%; max-width:640px; margin:0 auto;
  display:flex; flex-direction:column; gap:14px;
  padding:16px 14px 46px;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.reel-card>.inner::-webkit-scrollbar{ display:none; }
/* centre short content without clipping tall content the way
   justify-content:center would inside a scroller */
.reel-card>.inner::before,
.reel-card>.inner::after{ content:''; margin:auto; }

/* There is no position rail and no end-of-reel hint. Both told you how much
   was left, and a reel that tells you how much is left is a list with extra
   animation — the next card is supposed to be a surprise. */

/* ── figures ─────────────────────────────────────────────────────────────── */
.fig{ border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface-2);
  overflow:hidden; }
.fig svg{ display:block; width:100%; height:auto; }
.fig-imgwrap{ background:var(--surface); padding:8px; }
.fig-img{ display:block; width:100%; height:auto; border-radius:var(--r-s);
  animation:pop .4s var(--ease) both; }
.fig-h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 13px; border-bottom:1px solid var(--rule); background:var(--surface); }
.fig-cap{ padding:10px 13px; font-size:.79rem; color:var(--ink-2); line-height:1.5;
  border-top:1px solid var(--rule); }
.fig-ctl{ display:flex; align-items:center; gap:10px; padding:10px 13px;
  border-top:1px solid var(--rule); }
.fig-ctl label{ font-size:.72rem; color:var(--ink-3); white-space:nowrap;
  font-family:var(--font-mono); }
.fig-ctl input[type=range]{ flex:1 1 auto; accent-color:var(--accent); min-width:80px; }
.fig text{ font-family:var(--font-ui); font-size:9.5px; fill:var(--ink-2); }
.fig .axis{ stroke:var(--rule-2); stroke-width:1; }
.fig .curve{ stroke:var(--accent); stroke-width:2; fill:none; stroke-linecap:round; }
.fig .curve.draw{ stroke-dasharray:var(--len,600); animation:drawIn 1.1s var(--ease) both; }
.fig .band{ fill:var(--accent); opacity:.13; }
.fig .band.warm{ fill:var(--warn); opacity:.16; }
.fig .band.good{ fill:var(--ok); opacity:.14; }
.fig .guide{ stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3; opacity:.75; }
.fig .pt{ fill:var(--accent); }
.fig .pt.open{ fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.fig .pt.good{ fill:var(--ok); } .fig .pt.bad{ fill:var(--bad); }
.fig .hot{ stroke:var(--warn); stroke-width:2; fill:none; }
.fig .lbl{ font-weight:600; fill:var(--ink); }
.fig .fade-in{ animation:pop .5s var(--spring) both; }

/* ── OMR sheet ───────────────────────────────────────────────────────────── */
.omr{ display:flex; flex-direction:column; gap:10px; margin:0; padding:0; border:0; }
.omr-opt{
  display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
  padding:12px 14px; border:1px solid var(--rule); border-radius:var(--r-m);
  background:var(--surface); cursor:pointer; min-height:54px;
  transition:transform var(--dur-s) var(--ease), border-color var(--dur-s), background var(--dur-s);
}
.omr-opt:hover{ border-color:var(--rule-2); }
.omr-opt:active{ transform:scale(.99); }
.omr-opt .bub{
  flex:0 0 auto; width:31px; height:31px; border-radius:50%;
  border:2px solid var(--rule-2); display:grid; place-items:center;
  font-family:var(--font-mono); font-size:.8rem; font-weight:600; color:var(--ink-3);
  background:var(--paper);
  transition:background var(--dur-s), border-color var(--dur-s), color var(--dur-s),
    transform var(--dur-s) var(--spring);
}
.omr-opt.msq .bub{ border-radius:8px; }
.omr-opt[aria-checked=true]{ border-color:var(--accent); background:var(--accent-soft); }
.omr-opt[aria-checked=true] .bub{ background:var(--accent); border-color:var(--accent);
  color:var(--accent-ink); transform:scale(1.08); }
.omr-opt.key{ border-color:var(--ok); background:var(--ok-soft); }
.omr-opt.key .bub{ border-color:var(--ok); color:var(--ok); }
.omr-opt.chosen-bad{ border-color:var(--bad); background:var(--bad-soft); }
.omr-opt.chosen-bad .bub{ background:var(--bad); border-color:var(--bad); color:#fff; }
.omr-opt[aria-disabled=true]{ cursor:default; }
.omr-opt .t{ flex:1 1 auto; min-width:0; font-family:var(--font-prose); line-height:1.5; }
.omr-mark{ flex:0 0 auto; font-size:.7rem; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; padding-top:7px; }
.omr-mark.ok{ color:var(--ok); } .omr-mark.bad{ color:var(--bad); }

.nat-in{ display:flex; align-items:center; gap:10px; padding:12px 14px;
  border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface); }
.nat-in input{ flex:1 1 auto; min-width:0; font:600 1.18rem/1 var(--font-mono);
  letter-spacing:.04em; padding:11px 12px; border:1px solid var(--rule-2);
  border-radius:var(--r-s); background:var(--paper); color:var(--ink); }
.nat-in input:focus{ border-color:var(--accent); }

.verdict{ display:flex; gap:12px; align-items:flex-start; padding:14px 15px;
  border-radius:var(--r-m); border:1px solid; font-size:.93rem; }
.verdict.ok{ background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
.verdict.bad{ background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
.verdict.warn{ background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
.verdict b{ display:block; font-size:1rem; margin-bottom:2px; }
.verdict .g{ font-size:1.35rem; line-height:1; animation:pop .45s var(--spring) both; }

/* ── reveal blocks ───────────────────────────────────────────────────────── */
.reveal{ border:1px solid var(--rule); border-radius:var(--r-m); overflow:hidden;
  background:var(--surface); }
.reveal>.h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; background:var(--surface-2); font-size:.79rem; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); }
.reveal>.b{ padding:14px; animation:rise .34s var(--ease) both; }
.gate{ border:1px dashed var(--rule-2); border-radius:var(--r-m); padding:16px;
  background:var(--surface-2); }

/* ── write workspace ─────────────────────────────────────────────────────── */
/* ── the writing workspace ───────────────────────────────────────────────── */
/* A document that fills downward: each line's rendering sits directly above
   it, and the one live input is always at the bottom of the stack. */
.wbox{ --w-rail:26px; }
.wdoc{ display:flex; flex-direction:column; gap:2px; }
.wline{
  display:flex; gap:8px; align-items:flex-start; padding:4px 6px 4px 0;
  border-radius:var(--r-s); transition:background var(--dur-s);
}
.wline[role=button]{ cursor:text; }
.wline[role=button]:hover{ background:var(--surface-2); }
.wline.live{ background:var(--accent-soft); }
.wnum{
  flex:0 0 var(--w-rail); text-align:right; padding-top:3px;
  font:500 .66rem/1.5 var(--font-ui); color:var(--ink-3); font-variant-numeric:tabular-nums;
  user-select:none;
}
.wout{ flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; }
.wout .ph{ color:var(--ink-3); font-size:.8rem; }
.wout mjx-container{ margin:.15em 0 !important; }
.wout mjx-container[display=true]{ text-align:left !important; margin:.2em 0 !important; }
.wout .prose{ font-size:.96rem; }
.wout .md-p,.wout .md-l,.wout .md-q{ margin:0; }
.wout .md-h{ margin:.1em 0; }
.wout .md-l{ padding-left:1.1em; }
.wout .md-q{ border-left:2px solid var(--accent-line); padding-left:10px; color:var(--ink-2); }

.winput{
  display:flex; align-items:center; gap:6px; margin:2px 0 0;
  padding:0 6px 0 calc(var(--w-rail) - 12px);
}
.wcaret{ flex:0 0 12px; color:var(--accent); font-weight:600; }
.wfield{
  flex:1 1 auto; min-width:0; padding:11px 12px;
  border:1px solid var(--accent-line); border-radius:var(--r-m);
  background:var(--surface); color:var(--ink);
  font:400 .95rem/1.5 var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);
}
.wfield:focus{ outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft); }
.wkey{
  flex:0 0 auto; width:38px; height:38px; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-2);
  cursor:pointer; font-size:1rem; display:inline-flex; align-items:center;
  justify-content:center; transition:transform var(--dur-s) var(--spring);
}
.wkey:active{ transform:scale(.9); }

/* Completions, thumb-high: a single scrolling strip immediately under the
   input rather than a sheet that covers it. */
.wstrip{
  display:flex; gap:6px; align-items:center; overflow-x:auto; padding:2px 0 4px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.wstrip::-webkit-scrollbar{ display:none; }
.wstrip-l{
  flex:0 0 auto; font:500 .64rem/1 var(--font-mono,ui-monospace,monospace);
  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  padding-right:4px; border-right:1px solid var(--rule); margin-right:2px;
}
.wsug{
  flex:0 0 auto; display:inline-flex; flex-direction:column; align-items:center;
  gap:1px; min-width:46px; padding:6px 9px; cursor:pointer;
  border:1px solid var(--rule); border-radius:var(--r-s); background:var(--surface);
  transition:transform var(--dur-s) var(--spring), border-color var(--dur-s);
}
.wsug:active{ transform:scale(.9); }
.wsug.on{ border-color:var(--accent); background:var(--accent-soft); }
.wsug .s{ font-size:1.02rem; line-height:1.1; font-family:var(--font-prose); }
.wsug .c{ font:400 .58rem/1 var(--font-mono,ui-monospace,monospace); color:var(--ink-3);
  max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.tex-out{ min-height:66px; padding:14px; border-radius:var(--r-m);
  border:1px solid var(--rule); background:var(--surface-2); overflow-x:auto; }
.tex-out .ph{ color:var(--ink-3); font-size:.9rem; font-family:var(--font-ui); }
.tex-err{ display:flex; gap:8px; align-items:flex-start; font-size:.8rem; color:var(--warn);
  margin-top:8px; line-height:1.45; }

/* text inputs outside the workspace (the sync pass key) */
.tin{
  flex:1 1 140px; min-width:0; padding:10px 12px; border-radius:var(--r-m);
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font:400 .92rem/1.4 var(--font-ui);
}
.tin:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

/* the inline "tick its groundwork too?" question, and the level 2 mark */
.ask{ margin-top:12px; animation:rise var(--dur) var(--ease) both; }
.proof-done{ border-top:1px solid var(--rule); padding-top:12px; }

/* ── the note, opened inside its row ─────────────────────────────────────

/* The note's own chrome is flat on purpose. Every block used to be a card, and
   a card inside a card inside an accordion is three borders between the reader

.notebody{ gap:0; }

.exp-proof>.exp-h{ background:var(--accent-soft); }
.exp-exercises{ border-color:var(--rule); }

/* ── width follows the note ──────────────────────────────────────────────

        a: 'No. A maximum is a supremum that happens to lie in $S$; $(0,1)$ has $\\sup=1$ and no maximum.' }
    ] },

  { id: 'm.2.3.6', img: ['c.2.3.6_completeness_supremum_property'], sec: '2.3', kind: 'theorem', tier: 'core', mock: true,
    title: 'The Completeness (Supremum) Property of ℝ',
    oneLine: 'Every nonempty set of reals with a ceiling has a least ceiling — inside ℝ.',
    statement: `<p>Every nonempty subset of $\\mathbb{R}$ that is bounded above has a supremum
      in $\\mathbb{R}$.</p>
      <p>Dually, every nonempty subset of $\\mathbb{R}$ that is bounded below has an infimum in
      $\\mathbb{R}$ (apply the above to $-S$).</p>`,
    intuition: `<p>This is the property that separates $\\mathbb{R}$ from $\\mathbb{Q}$, and it is
      an axiom, not a theorem about order and arithmetic.</p>
      <p>Watch it fail in $\\mathbb{Q}$: the set $\\{x\\in\\mathbb{Q}: x>0,\\ x^{2}<2\\}$ is nonempty
      and bounded above, but inside $\\mathbb{Q}$ it has no least upper bound — the candidate is
      $\\sqrt2$, which is not there. Completeness is what fills those holes, and it is the engine
      behind the Monotone Convergence Theorem, Bolzano–Weierstrass and every existence result in
      the course.</p>`,
    needs: ['m.2.3.2'],
    traps: [
      `The supremum is guaranteed in $\\mathbb{R}$, not in the set: it may be irrational even when
       every element of the set is rational.`,
      `Boundedness above is essential. $\\mathbb{N}$ has no supremum in $\\mathbb{R}$; the property
       says nothing about unbounded sets.`
    ],
    proof: {
      idea: `<p>Part (a) is <b>not</b> proved: the Supremum Property is an <i>axiom</i> of
        $\\mathbb{R}$ — it is what we mean by calling $\\mathbb{R}$ complete. What does need an
        argument is the dual statement about infima, and the trick is to reflect the set through
        the origin and let (a) do the work.</p>`,
      why: `<p>Reflection turns lower bounds into upper bounds and reverses every inequality,
        so a least upper bound for $-S$ is forced to be a greatest lower bound for $S$. You will
        use this reflection again and again; it is the cheapest way to halve the work on any
        sup/inf result.</p>`,
      rungs: [
        { why: 'Set up the reflected set and record that it inherits the hypothesis.',
          m: `$$ -S=\\{-s: s\\in S\\},\\qquad S\\neq\\emptyset \\implies -S\\neq\\emptyset. $$` },
        { why: 'A lower bound for $S$ becomes an upper bound for $-S$, so $-S$ is bounded above and (a) applies.',
          m: `$$ t\\le s\\ \\ \\forall s\\in S \\iff -s\\le -t\\ \\ \\forall s\\in S. $$` },
        { why: 'Apply the axiom to $-S$ and name the supremum it produces.',
          m: `$$ u=\\sup(-S)\\ \\text{ exists in }\\mathbb{R}. $$` },
        { why: 'Reflect back. The two supremum conditions on $u$ become exactly the two infimum conditions on $-u$.',
          m: `$$ -u\\le s\\ \\ \\forall s\\in S,\\qquad t\\le -u\\ \\text{ for every lower bound } t. $$` }
      ],
      ends: `<p>Hence $\\inf S=-\\sup(-S)$, which both proves the dual statement and gives a
        formula worth remembering.</p>`
    },
    cards: [
      { kind: 'state', q: 'State the Completeness Property of $\\mathbb{R}$.',
        a: 'Every nonempty subset of $\\mathbb{R}$ that is bounded above has a supremum in $\\mathbb{R}$.' },
      { kind: 'recall', q: 'Give a set showing the property fails in $\\mathbb{Q}$.',
        a: '$\\{x\\in\\mathbb{Q}:x>0,\\ x^{2}<2\\}$ — bounded above, nonempty, no least upper bound in $\\mathbb{Q}$ (it would have to be $\\sqrt2$).' },
      { kind: 'trap', q: 'Does completeness guarantee a maximum?',
        a: 'No — only a supremum, which need not be attained. $(0,1)$ has $\\sup=1\\notin(0,1)$.' }
    ] },

  { id: 'm.3.4.8', img: ['c.3.4.8_bolzano_weierstrass_theorem'], sec: '3.4', kind: 'theorem', tier: 'core', mock: true,
    title: 'The Bolzano–Weierstrass Theorem',
    oneLine: 'A bounded sequence always hides a convergent subsequence inside it.',
    statement: `<p>Every bounded sequence of real numbers has a convergent subsequence.</p>`,
    intuition: `<p>Infinitely many terms crammed into a finite band must pile up somewhere. The
      theorem does not tame the sequence — it only extracts a well-behaved part of it.</p>
      <p>This extraction is the workhorse of §5.3 and §5.4: take a sequence witnessing that
      something goes wrong on $[a,b]$, pull out a convergent subsequence (boundedness), note the
      limit is still in $[a,b]$ (closedness), and contradict continuity there.</p>`,
    needs: ['m.2.3.6'],
    traps: [
      `It gives a convergent <i>subsequence</i>, never convergence of the whole sequence:
       $x_{n}=(-1)^{n}$ is bounded and divergent.`,
      `It is not an equivalence. An unbounded sequence can still have a convergent subsequence —
       for instance $1,1,2,1,3,1,4,\\ldots$`
    ],
    proof: {
      idea: `<p>Trap the sequence. Halve the interval that contains it, keep whichever half still
        holds infinitely many terms, and repeat forever. The nested intervals shrink to a single
        point, and a subsequence can be chosen marching into them.</p>`,
      why: `<p>Bisection converts "bounded" into "convergent" because the two halves cannot
        <i>both</i> contain only finitely many terms — there are infinitely many terms to house.
        That pigeonhole step is the whole engine; completeness (through the Nested Interval
        Property) supplies the point at the end.</p>`,
      rungs: [
        { why: 'Boundedness gives a first interval containing every term.',
          m: `$$ |x_{n}|\\le M\\ \\ \\forall n \\implies x_{n}\\in I_{1}=[-M,M]. $$` },
        { why: 'Bisect, and keep a half holding infinitely many terms — at least one always does.',
          m: `$$ I_{k}\\supseteq I_{k+1},\\qquad \\text{length}(I_{k})=\\frac{2M}{2^{\\,k-1}}. $$` },
        { why: 'The nested intervals have exactly one common point, because their lengths go to zero.',
          m: `$$ \\bigcap_{k=1}^{\\infty} I_{k}=\\{x\\}. $$` },
        { why: 'Choose indices in order, one from each interval — possible precisely because each $I_k$ holds infinitely many terms.',
          m: `$$ n_{1}<n_{2}<\\cdots,\\qquad x_{n_{k}}\\in I_{k}. $$` },
        { why: 'Both $x_{n_k}$ and $x$ lie in $I_k$, so their distance is at most its length.',
          m: `$$ |x_{n_{k}}-x|\\le \\frac{2M}{2^{\\,k-1}}\\longrightarrow 0. $$` }
      ],
      ends: `<p>So $x_{n_{k}}\\to x$: every bounded sequence has a convergent subsequence. Note
        what is <i>not</i> claimed — the sequence itself need not converge.</p>`
    },
    cards: [
      { kind: 'state', q: 'State the Bolzano–Weierstrass Theorem.',
        a: 'Every bounded sequence of real numbers has a convergent subsequence.' },
      { kind: 'apply', q: 'What are the subsequential limits of $x_{n}=(-1)^{n}$, and what does B–W give here?',
        a: 'Limits $1$ (even $n$) and $-1$ (odd $n$); B–W guarantees at least one convergent subsequence, and indeed two obvious ones exist, while the sequence itself diverges.' },
      { kind: 'trap', q: 'Does a bounded sequence with a convergent subsequence have to converge?',
        a: 'No. Convergence needs <i>every</i> subsequence to share one limit.' }
    ] },

  { id: 'm.5.1.1', img: ['c.5.1.1_continuity_at_a_point'], sec: '5.1', kind: 'definition', tier: 'core', mock: true,
    title: 'Continuity at a Point',
    oneLine: 'You can force f(x) as close to f(c) as demanded by keeping x close enough to c.',
    statement: `<p>Let $A\\subseteq\\mathbb{R}$, let $f:A\\to\\mathbb{R}$, and let $c\\in A$. Then $f$
      is <b>continuous at $c$</b> if for every $\\varepsilon>0$ there exists $\\delta>0$ such that
      for all $x\\in A$,</p>
      $$|x-c|<\\delta \\implies |f(x)-f(c)|<\\varepsilon.$$
      <p>If $f$ is not continuous at $c$, it is <b>discontinuous at $c$</b>.</p>`,
    intuition: `<p>A two-move game. Your opponent names a tolerance $\\varepsilon$ around $f(c)$;
      you must answer with a radius $\\delta$ around $c$ that keeps every image inside that
      tolerance. Continuity means you can always answer.</p>
      <p>$\\delta$ is allowed to depend on $\\varepsilon$ and on $c$ — that dependence on $c$ is
      exactly what uniform continuity later forbids.</p>`,
    needs: [],
    traps: [
      `The order of quantifiers is the whole definition: $\\varepsilon$ is given first, $\\delta$ is
       chosen after. Writing “there exists $\\delta$ for all $\\varepsilon$” states something else
       (and something false in general).`,
      `$c$ must belong to the domain $A$. Continuity at a point where $f$ is undefined is not a
       question you can ask — that is a limit question instead.`
    ],
    cards: [
      { kind: 'state', q: 'State the $\\varepsilon$–$\\delta$ definition of continuity of $f:A\\to\\mathbb{R}$ at $c\\in A$.',
        a: 'For every $\\varepsilon>0$ there exists $\\delta>0$ such that for all $x\\in A$ with $|x-c|<\\delta$ we have $|f(x)-f(c)|<\\varepsilon$.' },
      { kind: 'apply', q: 'For $f(x)=3x+2$ and any $c$, which $\\delta$ answers a given $\\varepsilon$?',
        a: '$\\delta=\\varepsilon/3$, since $|f(x)-f(c)|=3|x-c|$. Note it does not depend on $c$.' },
      { kind: 'trap', q: 'May $\\delta$ depend on $\\varepsilon$? On $c$?',
        a: 'On both. Only uniform continuity requires a single $\\delta$ that works at every point of the set.' }
    ] },

  { id: 'm.5.1.3', img: ['c.5.1.3_sequential_criterion_for_continuity'], sec: '5.1', kind: 'theorem', tier: 'core', mock: true,
    title: 'Sequential Criterion for Continuity',
    oneLine: 'Continuity = every sequence heading to c has images heading to f(c).',
    statement: `<p>Let $A\\subseteq\\mathbb{R}$, $f:A\\to\\mathbb{R}$ and $c\\in A$. Then $f$ is
      continuous at $c$ if and only if for <b>every</b> sequence $(x_{n})$ in $A$ with
      $x_{n}\\to c$, the image sequence satisfies $f(x_{n})\\to f(c)$.</p>`,
    intuition: `<p>It converts an $\\varepsilon$–$\\delta$ statement into a statement about
      sequences, which is usually far easier to attack.</p>
      <p>Its contrapositive is the working tool — the <b>Discontinuity Criterion</b>: to prove $f$
      is discontinuous at $c$, produce <i>one</i> sequence $x_{n}\\to c$ in $A$ for which
      $f(x_{n})\\not\\to f(c)$. One witness is enough.</p>`,
    needs: ['m.5.1.1'],
    traps: [
      `“For every sequence” cannot be weakened to “for some sequence”: the constant sequence
       $x_{n}=c$ satisfies $f(x_{n})\\to f(c)$ for <i>any</i> function whatsoever, continuous or not.`,
      `The implication is not reversible in the other variable: $f(x_{n})\\to f(c)$ does not force
       $x_{n}\\to c$ (take $f$ constant).`
    ],
    proof: {
      idea: `<p>Two directions, and they are not equally hard. Forwards is a direct $\\varepsilon$–$\\delta$
        chase. Backwards is a contrapositive: assume continuity fails, and <i>build</i> the sequence
        that exposes the failure by taking $\\delta=1/n$.</p>`,
      why: `<p>Whenever a criterion says "for every sequence", the useful direction is almost always
        the contrapositive — one badly behaved sequence is far easier to construct than to rule out.
        The construction $\\delta=1/n$ is the standard way to turn a failed $\\varepsilon$–$\\delta$
        statement into a sequence.</p>`,
      rungs: [
        { why: '(⇒) Assume $f$ continuous at $c$ and take any sequence heading to $c$. Fix $\\varepsilon$ and get the matching $\\delta$.',
          m: `$$ |x-c|<\\delta \\implies |f(x)-f(c)|<\\varepsilon. $$` },
        { why: 'Convergence puts the tail of the sequence inside that $\\delta$, so the images sit inside $\\varepsilon$.',
          m: `$$ \\exists K:\\ n\\ge K \\implies |x_{n}-c|<\\delta \\implies |f(x_{n})-f(c)|<\\varepsilon. $$` },
        { why: '(⇐) Contrapositive. Suppose $f$ is NOT continuous at $c$: some $\\varepsilon_{0}$ defeats every $\\delta$.',
          m: `$$ \\exists\\varepsilon_{0}>0\\ \\ \\forall\\delta>0\\ \\ \\exists x:\\ |x-c|<\\delta\\ \\text{ and }\\ |f(x)-f(c)|\\ge\\varepsilon_{0}. $$` },
        { why: 'Run that with $\\delta=1/n$ to manufacture a sequence.',
          m: `$$ |x_{n}-c|<\\tfrac1n,\\qquad |f(x_{n})-f(c)|\\ge\\varepsilon_{0}. $$` },
        { why: 'The squeeze sends $x_n\\to c$, yet the images stay $\\varepsilon_0$ away — a sequence that violates the hypothesis.',
          m: `$$ x_{n}\\to c\\quad\\text{but}\\quad f(x_{n})\\not\\to f(c). $$` }
      ],
      ends: `<p>That contradicts the assumed sequential condition, so $f$ must be continuous at
        $c$. The same $\\delta=1/n$ construction proves the Divergence Criteria.</p>`
    },
    cards: [
      { kind: 'state', q: 'State the Sequential Criterion for continuity at $c$.',
        a: '$f$ is continuous at $c$ iff for every sequence $(x_{n})$ in $A$ with $x_{n}\\to c$ we have $f(x_{n})\\to f(c)$.' },
      { kind: 'recall', q: 'State the Discontinuity Criterion.',
        a: '$f$ is discontinuous at $c$ iff there exists a sequence $(x_{n})$ in $A$ with $x_{n}\\to c$ but $f(x_{n})\\not\\to f(c)$.' },
      { kind: 'trap', q: 'Why is “there exists a sequence $x_{n}\\to c$ with $f(x_{n})\\to f(c)$” useless as a criterion?',
        a: 'The constant sequence $x_{n}=c$ always satisfies it, so it holds for every function at every point.' }
    ] },

  { id: 'm.5.3.4', img: ['c.5.3.4_maximum_minimum_theorem', 'c.5.3.4_failure_extremum_open_interval'], sec: '5.3', kind: 'theorem', tier: 'core', mock: true,
    title: 'Maximum–Minimum Theorem',
    oneLine: 'On a closed bounded interval, a continuous function actually attains its extremes.',
    statement: `<p>Let $I=[a,b]$ be a closed bounded interval and let $f:I\\to\\mathbb{R}$ be
      continuous on $I$. Then $f$ has an absolute maximum and an absolute minimum on $I$: there
      exist points $x^{*},x_{*}\\in I$ with</p>
      $$f(x_{*})\\le f(x)\\le f(x^{*})\\qquad\\text{for all } x\\in I.$$`,
    intuition: `<p>Two separate gifts: the range is bounded, <i>and</i> the bounds are hit at
      actual points of the interval. Boundedness alone would only give $\\sup f$ and $\\inf f$; the
      theorem says these are values of $f$.</p>
      <p>Proof shape: $f$ is bounded (else a sequence with $|f(x_{n})|>n$ plus Bolzano–Weierstrass
      contradicts continuity), then take $x_{n}$ with $f(x_{n})\\to\\sup f$ and extract a convergent
      subsequence whose limit lies in $I$ because $I$ is closed.</p>`,
    needs: ['m.5.1.1', 'm.3.4.8'],
    traps: [
      `Both halves of “closed bounded” are load-bearing. $f(x)=1/x$ is continuous on $(0,1]$ and has
       a minimum but no maximum; $f(x)=x$ on $[0,\\infty)$ has a minimum but no maximum.`,
      `Continuity is required on the whole interval, not just at interior points.`,
      `The extreme points $x^{*},x_{*}$ need not be unique and need not be interior.`
    ],
    proof: {
      idea: `<p>Two claims in one theorem: $f$ is <b>bounded</b>, and the bound is <b>attained</b>.
        Prove boundedness by contradiction, then get attainment by pushing a sequence at the
        supremum and squeezing a convergent subsequence out of it with Bolzano–Weierstrass.</p>`,
      why: `<p>Closed and bounded is exactly what B–W needs, and continuity is what lets a limit
        pass through $f$. Remove either hypothesis and the proof collapses at a step you can point
        to — which is why the standard counterexamples are $1/x$ on $(0,1]$ and $x$ on
        $[0,\\infty)$.</p>`,
      rungs: [
        { why: 'Suppose $f$ were unbounded. Then some point overshoots every $n$.',
          m: `$$ \\exists x_{n}\\in[a,b]:\\ |f(x_{n})|>n. $$` },
        { why: 'The sequence lives in $[a,b]$, so B–W extracts a convergent subsequence — and the limit stays in $[a,b]$ because the interval is closed.',
          m: `$$ x_{n_{k}}\\to x^{*}\\in[a,b]. $$` },
        { why: 'Continuity makes $f(x_{n_k})$ converge, so it is bounded — contradicting $|f(x_{n_k})|>n_k$. Hence $f$ is bounded.',
          m: `$$ f(x_{n_{k}})\\to f(x^{*})\\ \\text{ bounded},\\qquad\\text{contradiction.} $$` },
        { why: 'Now let $s$ be the supremum of the range, and pick points climbing towards it.',
          m: `$$ s=\\sup\\{f(x):x\\in[a,b]\\},\\qquad s-\\tfrac1n<f(y_{n})\\le s. $$` },
        { why: 'B–W again on $(y_n)$, then continuity carries the limit inside $f$.',
          m: `$$ y_{n_{k}}\\to y^{*}\\in[a,b],\\qquad f(y_{n_{k}})\\to f(y^{*}). $$` },
        { why: 'The squeeze forces those images to $s$, so the supremum is a value of $f$.',
          m: `$$ f(y^{*})=s=\\max_{[a,b]} f. $$` }
      ],
      ends: `<p>Apply the same argument to $-f$ for the minimum. Notice that boundedness had to be
        established <i>first</i> — without it, $\\sup$ of the range need not exist.</p>`
    },
    cards: [
      { kind: 'state', q: 'State the Maximum–Minimum Theorem.',
        a: 'If $f$ is continuous on a closed bounded interval $[a,b]$, then $f$ attains an absolute maximum and an absolute minimum at points of $[a,b]$.' },
      { kind: 'recall', q: 'Which two hypotheses are usually the ones that fail in counterexamples?',
        a: 'That the interval is closed, and that it is bounded — continuity on a non-compact interval is not enough.' },
      { kind: 'trap', q: 'Does $f(x)=1/x$ on $(0,1]$ contradict the theorem?',
        a: 'No. $(0,1]$ is not closed, so the theorem does not apply; $f$ has minimum $1$ at $x=1$ and no maximum.' }
    ] },

  { id: 'm.5.3.7', img: ['c.5.3.7_bolzano_intermediate_value_theorem'], sec: '5.3', kind: 'theorem', tier: 'core', mock: true,
    title: "Bolzano's Intermediate Value Theorem",
    oneLine: 'A continuous function on an interval skips no value between two of its values.',
    statement: `<p>Let $I=[a,b]$ and let $f:I\\to\\mathbb{R}$ be continuous on $I$. If $k\\in\\mathbb{R}$
      satisfies $f(a)<k<f(b)$ or $f(b)<k<f(a)$, then there exists $c\\in(a,b)$ with $f(c)=k$.</p>
      <p><b>Location of Roots (the $k=0$ case).</b> If $f(a)$ and $f(b)$ have opposite signs, then
      $f$ has a zero in $(a,b)$.</p>`,
    intuition: `<p>To get from below $k$ to above $k$ without lifting your pen, you must cross the
      level $k$. Continuity is what forbids jumping over it.</p>
      <p>It is an <i>existence</i> theorem and nothing more: it produces at least one $c$, gives no
      uniqueness, and hands you no formula. Uniqueness has to come from elsewhere — usually strict
      monotonicity via the sign of $f'$.</p>`,
    needs: ['m.5.1.1'],
    traps: [
      `The converse is false: $f(x)=x^{2}$ on $[-1,1]$ has a root at $0$ while $f(-1)f(1)=1>0$.
       A root does not require a sign change.`,
      `Continuity on the whole interval is essential: $f(x)=\\operatorname{sgn}(x)$ on $[-1,1]$ takes
       $-1$ and $1$ but never $0$.`,
      `“At least one $c$”, not “exactly one”. Counting roots needs a monotonicity argument on top.`
    ],
    proof: {
      idea: `<p>Take the case $f(a)<k<f(b)$. Look at the set of points where $f$ is still below
        $k$, and take its supremum: that is the last moment before the crossing. Then rule out
        both $f(c)<k$ and $f(c)>k$ using continuity.</p>`,
      why: `<p>The supremum is the natural candidate because it is the <i>first</i> point that
        cannot be below $k$ any longer. Continuity is then used twice, once to push each strict
        inequality into a neighbourhood — which is what makes both alternatives impossible.</p>`,
      rungs: [
        { why: 'Collect the points still below $k$; it is nonempty and bounded, so it has a supremum.',
          m: `$$ S=\\{x\\in[a,b]: f(x)<k\\},\\qquad a\\in S,\\qquad c=\\sup S. $$` },
        { why: 'Points of $S$ climb to $c$, so continuity forces $f(c)\\le k$.',
          m: `$$ x_{n}\\in S,\\ x_{n}\\to c \\implies f(c)=\\lim f(x_{n})\\le k. $$` },
        { why: 'Suppose $f(c)<k$. Continuity keeps $f$ below $k$ on a whole interval to the right of $c$ — so $c$ was not an upper bound of $S$ after all.',
          m: `$$ \\exists\\delta>0:\\ f(x)<k \\ \\ \\forall x\\in(c,c+\\delta) \\implies c+\\tfrac{\\delta}{2}\\in S. $$` },
        { why: 'That contradicts $c=\\sup S$, and the case $c=b$ is excluded because $f(b)>k$.',
          m: `$$ \\text{contradiction} \\implies f(c)\\ge k. $$` }
      ],
      ends: `<p>Both inequalities hold, so $f(c)=k$. The case $f(b)<k<f(a)$ follows by applying
        this to $-f$ and $-k$.</p>`
    },
    cards: [
      { kind: 'state', q: "State Bolzano's Intermediate Value Theorem.",
        a: 'If $f$ is continuous on $[a,b]$ and $k$ lies strictly between $f(a)$ and $f(b)$, then $f(c)=k$ for some $c\\in(a,b)$.' },
      { kind: 'apply', q: 'Show $x^{3}-3x+1$ has a root in $(0,1)$.',
        a: '$p(0)=1>0$ and $p(1)=-1<0$, so by the Location of Roots case there is $c\\in(0,1)$ with $p(c)=0$.' },
      { kind: 'trap', q: 'Does the IVT tell you how many solutions $f(x)=k$ has?',
        a: 'No — only that at least one exists. Uniqueness needs strict monotonicity, e.g. $f\'>0$ on the interval.' }
    ] },

  { id: 'm.5.4.1', img: ['c.5.4.1_uniform_continuity', 'c.5.4.2_nonuniform_continuity_criterion'], sec: '5.4', kind: 'definition', tier: 'core', mock: true,
    title: 'Uniform Continuity',
    oneLine: 'One δ must work everywhere on the set, not a fresh δ at each point.',
    statement: `<p>Let $A\\subseteq\\mathbb{R}$ and $f:A\\to\\mathbb{R}$. Then $f$ is <b>uniformly
      continuous on $A$</b> if for every $\\varepsilon>0$ there exists $\\delta>0$ such that for all
      $x,u\\in A$,</p>
      $$|x-u|<\\delta \\implies |f(x)-f(u)|<\\varepsilon.$$
      <p><b>Nonuniform Continuity Criterion.</b> $f$ fails to be uniformly continuous on $A$ if and
      only if there exist $\\varepsilon_{0}>0$ and sequences $(x_{n}),(u_{n})$ in $A$ with
      $|x_{n}-u_{n}|\\to0$ and $|f(x_{n})-f(u_{n})|\\ge\\varepsilon_{0}$ for all $n$.</p>`,
    intuition: `<p>Compare the definitions: continuity fixes $c$ first and then chooses $\\delta$, so
      $\\delta$ may shrink as $c$ moves. Uniform continuity demands one $\\delta$ good for the whole
      set at once.</p>
      <p>$f(x)=1/x$ on $(0,1)$ is the standard failure: near $0$ the graph steepens without limit,
      so no single $\\delta$ survives. Take $x_{n}=1/n$, $u_{n}=1/(n+1)$: the inputs close up but
      $|f(x_{n})-f(u_{n})|=1$ always.</p>`,
    needs: ['m.5.1.1'],
    traps: [
      `Uniform continuity is a property of $f$ <i>together with its set</i>. The same formula can be
       uniformly continuous on $[1,2]$ and not on $(0,1)$.`,
      `It is strictly weaker than Lipschitz: $\\sqrt{x}$ is uniformly continuous on $[0,1]$ but not
       Lipschitz there, since $(\\sqrt{x}-0)/(x-0)=1/\\sqrt{x}$ is unbounded.`,
      `“Pointwise continuous at every point” never upgrades itself to uniform without an extra
       hypothesis such as a closed bounded domain.`
    ],
    cards: [
      { kind: 'state', q: 'State the definition of uniform continuity of $f$ on $A$.',
        a: 'For every $\\varepsilon>0$ there exists $\\delta>0$ such that $|f(x)-f(u)|<\\varepsilon$ for all $x,u\\in A$ with $|x-u|<\\delta$.' },
      { kind: 'apply', q: 'Prove $f(x)=1/x$ is not uniformly continuous on $(0,1)$.',
        a: 'Take $x_{n}=1/n$, $u_{n}=1/(n+1)$. Then $|x_{n}-u_{n}|\\to0$ but $|f(x_{n})-f(u_{n})|=|n-(n+1)|=1$, so the Nonuniform Continuity Criterion applies with $\\varepsilon_{0}=1$.' },
      { kind: 'trap', q: 'How does the definition differ from continuity at every point of $A$?',
        a: 'The single $\\delta$ must serve all pairs of points; in pointwise continuity $\\delta$ may depend on the point.' }

  /* ── §2.3 · completeness, suprema and infima ────────────────────────────── */
  { id: 'w.2.3.1', sec: '2.3', marks: 4, mock: true,
    title: 'Exercise 2.3.1 — locate the bounds',
    prompt: `<p>Let $S=\\left\\{\\,1-\\dfrac{(-1)^{n}}{n}\\ :\\ n\\in\\mathbb{N}\\,\\right\\}$.
      Find $\\sup S$ and $\\inf S$, and say whether each is attained.</p>`,
    approach: `<p>Split on the parity of $n$ rather than trying to handle the set at once.
      For even $n$ the terms are $1-\\frac1n$; for odd $n$ they are $1+\\frac1n$. Each family is
      monotone, so each has an obvious extreme member — and the extremes of the two families are
      the extremes of the union.</p>`,
    solution: `<p>For even $n$, $x_n=1-\\frac1n$, which increases from $x_2=\\tfrac12$ towards $1$.
      For odd $n$, $x_n=1+\\frac1n$, which decreases from $x_1=2$ towards $1$.</p>
      <p>Every element is therefore at least $\\tfrac12$ and at most $2$, so $\\tfrac12$ is a lower
      bound and $2$ an upper bound. Both are elements of $S$ (take $n=2$ and $n=1$), so they are
      the infimum and the supremum and both are attained:</p>
      $$\\inf S=\\tfrac12=\\min S,\\qquad \\sup S=2=\\max S.$$`,

      do with a bound.`,
    tests: ['m.2.3.2'] },

      $w$ is an upper bound of $A\\cup B$, and no smaller number is. Get the second one from the
      fact that $w$ equals one of $u,v$, and that one is a LEAST upper bound of its own set.</p>`,
    solution: `<p>Put $u=\\sup A$, $v=\\sup B$, $w=\\max\\{u,v\\}$.</p>
      <p><b>$w$ is an upper bound.</b> Let $x\\in A\\cup B$. If $x\\in A$ then $x\\le u\\le w$; if
      $x\\in B$ then $x\\le v\\le w$. So $A\\cup B$ is bounded above by $w$ and, being nonempty,
      has a supremum.</p>

      any upper bound of $A\\cup B$ then $z$ is in particular an upper bound of $A$, and since
      $u=\\sup A$ is the least upper bound of $A$ we get $u\\le z$, i.e. $w\\le z$.</p>
      <p>Hence $w$ is an upper bound no larger than every other upper bound, which is exactly

    approach: `<p>The $\\varepsilon$-characterisation is the efficient route: $u=\\sup S$ exactly

    solution: `<p>Suppose $x_n\\not\\to L$. Then there is $\\varepsilon_0>0$ such that for every
      $K\\in\\mathbb{N}$ there is $n\\ge K$ with $|x_n-L|\\ge\\varepsilon_0$. Choosing
      $K=1,2,3,\\ldots$ in turn gives indices $n_1<n_2<\\cdots$ with
      $$|x_{n_k}-L|\\ge\\varepsilon_0 \\quad\\text{for all } k.$$</p>
      <p>$(x_{n_k})$ is a subsequence of a bounded sequence, hence bounded, so by
      Bolzano–Weierstrass it has a convergent subsequence $(x_{n_{k_j}})$, say with limit $M$.
      That is also a subsequence of $(x_n)$, so by hypothesis $M=L$.</p>
      <p>But $|x_{n_{k_j}}-L|\\ge\\varepsilon_0$ for every $j$, and letting $j\\to\\infty$ gives

    trap: `Boundedness is doing real work here and must be used: without it the statement fails
      for $x_n = n$ when $n$ is odd and $x_n = 0$ when $n$ is even, whose only convergent

    tests: ['m.3.4.8'] },

  { id: 'w.3.4.3', sec: '3.4', marks: 3, mock: true,

  /* ── §5.1 · continuous functions ────────────────────────────────────────── */
  { id: 'w.5.1.1', sec: '5.1', marks: 6, mock: true,
    title: 'Exercise 5.1.1 — $x^{2}$ from the definition',
    prompt: `<p>Use the $\\varepsilon$-$\\delta$ definition to prove that $f(x)=x^{2}$ is

    approach: `<p>Factor $x^{2}-c^{2}=(x-c)(x+c)$ and control the second factor by agreeing in

    solution: `<p>Fix $c$ and let $\\varepsilon>0$. For $|x-c|<1$ we have $|x|<|c|+1$, hence

      <p>Put $\\delta=\\min\\left\\{1,\\ \\dfrac{\\varepsilon}{2|c|+1}\\right\\}>0$. If
      $|x-c|<\\delta$ then both constraints hold and
      $$|x^{2}-c^{2}| = |x-c|\\,|x+c| < \\delta\\,(2|c|+1) \\le \\varepsilon.$$</p>

  { id: 'w.5.1.2', sec: '5.1', marks: 6, mock: true,
    title: 'Exercise 5.1.2 — Dirichlet, by the sequential criterion',
    prompt: `<p>Let $f(x)=1$ for $x\\in\\mathbb{Q}$ and $f(x)=0$ for $x\\notin\\mathbb{Q}$. Prove

    approach: `<p>Density gives two sequences at every point — one rational, one irrational —

    solution: `<p>Let $c\\in\\mathbb{R}$.</p>
      <p>By the density of $\\mathbb{Q}$ there is a sequence $(r_n)$ of rationals with

      with $s_n\\to c$.</p>
      <p>Then $f(r_n)=1\\to 1$ and $f(s_n)=0\\to 0$. If $f$ were continuous at $c$, the sequential
      criterion would force $f(r_n)\\to f(c)$ and $f(s_n)\\to f(c)$, giving $f(c)=1$ and

      <p>That is impossible, so $f$ is discontinuous at $c$ — and $c$ was arbitrary.</p>`,

  { id: 'w.5.1.3', sec: '5.1', marks: 5, mock: true,
    title: 'Exercise 5.1.3 — sign is preserved locally',
    prompt: `<p>Suppose $f$ is continuous at $c$ and $f(c)>0$. Prove there is $\\delta>0$ such

    approach: `<p>The whole exercise is the choice of $\\varepsilon$. Pick it so that the

    solution: `<p>Let $\\varepsilon=\\tfrac12 f(c)>0$. By continuity at $c$ there is $\\delta>0$
      such that $|x-c|<\\delta$ (and $x$ in the domain) implies
      $$|f(x)-f(c)|<\\tfrac12 f(c).$$</p>
      <p>The left-hand inequality of that absolute value gives
      $$f(x) > f(c)-\\tfrac12 f(c) = \\tfrac12 f(c) > 0.$$</p>
      <p>So $f$ is strictly positive on that whole neighbourhood, and in fact bounded below

  /* ── §5.3 · continuous functions on intervals ───────────────────────────── */
  { id: 'w.5.3.1', sec: '5.3', marks: 4, mock: true,

    prompt: `<p>Show that $f(x)=1/x$ is continuous and unbounded on $(0,1]$. Which hypothesis of

      <p>Take $x_n=1/n$ for $n\\ge 1$. Then $x_n\\in(0,1]$ and $f(x_n)=n$, so $f$ takes values

      <p>The Boundedness Theorem requires a CLOSED BOUNDED interval $[a,b]$. Here the interval is

  { id: 'w.5.3.2', sec: '5.3', marks: 6, mock: true,

      <p>$p$ is a polynomial, hence continuous on $[a,b]$, and $p(a)<0<p(b)$. By Bolzano's

  { id: 'w.5.3.3', sec: '5.3', marks: 5, mock: true,

    prompt: `<p>Let $f:[0,1]\\to[0,1]$ be continuous. Prove that there is $c\\in[0,1]$ with

      <p>If $g(0)=0$ then $c=0$ works; if $g(1)=0$ then $c=1$ works. Otherwise $g(0)>0>g(1)$ and

    trap: `Forgetting the two boundary cases. $g(0)\\ge 0$ and $g(1)\\le 0$ are not strict, and the

  /* ── §5.4 · uniform continuity ──────────────────────────────────────────── */

  { id: 'w.5.4.2', sec: '5.4', marks: 6, mock: true,

      closing in position.</p>`,
    solution: `<p><b>On $[0,b]$.</b> For $x,u\\in[0,b]$,
      $$|x^{2}-u^{2}|=|x-u|\\,|x+u|\\le 2b\\,|x-u|.$$
      Given $\\varepsilon>0$ take $\\delta=\\varepsilon/(2b)$, which depends on $\\varepsilon$ and

      <p><b>On $\\mathbb{R}$.</b> Take $x_n=n+\\dfrac1n$ and $u_n=n$. Then $x_n-u_n=\\dfrac1n\\to

  { id: 'w.5.4.3', sec: '5.4', marks: 6, mock: true,
    title: 'Exercise 5.4.3 — Cauchy sequences are preserved',
    prompt: `<p>Let $f$ be uniformly continuous on $A\\subseteq\\mathbb{R}$ and let $(x_n)$ be a

    approach: `<p>Uniform continuity hands you one $\\delta$ for the whole set; the Cauchy property

    solution: `<p>Let $\\varepsilon>0$. By uniform continuity there is $\\delta>0$ such that
      $$u,v\\in A,\\ |u-v|<\\delta \\ \\Longrightarrow\\ |f(u)-f(v)|<\\varepsilon.$$</p>
      <p>Since $(x_n)$ is Cauchy there is $K\\in\\mathbb{N}$ such that $|x_n-x_m|<\\delta$ for all
      $n,m\\ge K$.</p>

    trap: `Mere continuity is not enough, and the same $f(x)=1/x$ on $(0,1)$ shows it: $x_n=1/n$ is

    tests: ['m.5.4.1', 'm.5.4.3'] },

      $$\\sin x-\\sin y=(\\cos c)(x-y).$$</p>
      <p>Taking absolute values and using $|\\cos c|\\le 1$,

      <p>By the Mean Value Theorem there is $c\\in(a,b)$ with

  { id: 'w.6.2.3', sec: '6.2', marks: 6, mock: true,
    title: 'Exercise 6.2.3 — bracketing the logarithm',
    prompt: `<p>Prove that for every $x>0$,
      $$\\frac{x}{1+x} < \\ln(1+x) < x.$$</p>`,
    approach: `<p>Apply the MVT to $\\ln$ on $[1,1+x]$. The derivative is $1/t$, which is
      decreasing — so bounding $c$ between the endpoints bounds $1/c$ between the two reciprocals,

    solution: `<p>Fix $x>0$ and let $g(t)=\\ln t$ on $[1,1+x]$. It is continuous there and
      differentiable on $(1,1+x)$ with $g'(t)=1/t$, so the Mean Value Theorem gives
      $c\\in(1,1+x)$ with
      $$\\ln(1+x)-\\ln 1=\\frac{1}{c}\\,\\big((1+x)-1\\big)=\\frac{x}{c},$$

    tests: ['m.6.2.4'] }

  { id: 'p.mock.ra1.2019.14', course: 'ra1', exam: 'JAM', year: 2019, paper: 'MA', qno: 14,

/* ── src/core.dom.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   DOM + routing primitives. No framework: every view returns a real element.
   ══════════════════════════════════════════════════════════════════════════ */

const DOM = (function () {

  const HTML_TAG_NAMES = 'p|b|i|u|strong|em|code|ul|ol|li|br|hr|table|tr|td|th|tbody|thead|h[1-6]|blockquote|pre|small|sub|sup|div|span|a|button|nav|svg|path|circle';
  const VALID_HTML_TAG_RE = new RegExp('</?(?:' + HTML_TAG_NAMES + ')(?=[\\s/>])[^>]*>', 'gi');

  /* Protect mathematical inequalities (e.g. $x<y$, $u-\\varepsilon<s_\\varepsilon$, 1/n < x)
     so the browser HTML parser does not mistake "<" for an opening HTML tag. */
  function sanitizeMathHtml(s) {
    if (typeof s !== 'string' || s.indexOf('<') === -1) return s;
    const tags = [];
    const masked = s.replace(VALID_HTML_TAG_RE, function (match) {
      tags.push(match);
      return '\x00TAG' + (tags.length - 1) + '\x00';
    });
    const safe = masked.replace(/</g, '&lt;');
    return safe.replace(/\x00TAG(\d+)\x00/g, function (_, idx) {
      return tags[parseInt(idx, 10)];
    });
  }

  /* Turn concept IDs like <code>c.2.3.1</code>, $c.3.4.2$, or raw c.2.3.1 references into
     clickable links labeled with their section number and concept name. */
  function linkifyConcepts(s) {
    if (typeof s !== 'string') return s;
    if (s.indexOf('<code>') === -1 && s.indexOf('$c.') === -1 && s.indexOf('c.') === -1 && s.indexOf('s.') === -1) return s;
    const re = /<code>(c\.[0-9]+[a-z0-9.]*|s\.[a-z0-9-]+)<\/code>|\$((?:c\.[0-9]+[a-z0-9.]*|s\.[a-z0-9-]+))\$|(?<=[\s(])(c\.[0-9]+\.[0-9]+[a-z0-9.]*)(?=[\s.,;:)])/g;
    return s.replace(re, function (match, g1, g2, g3) {
      const id = g1 || g2 || g3;
      const c = (typeof Pool !== 'undefined' && Pool.concept) ? Pool.concept(id) : null;
      if (!c) return match;
      const cleanTitle = (c.title || id).split(';')[0].trim();
      const label = c.sec ? ('§' + c.sec + ' ' + cleanTitle) : cleanTitle;
      const secTitle = (c.sec && typeof Pool.sectionTitle === 'function') ? Pool.sectionTitle(c.sec) : null;
      const fullDesc = (secTitle ? ('Section ' + c.sec + ': ' + secTitle + ' — ') : '') + (c.title || id);
      const escTitle = fullDesc.replace(/"/g, '&quot;');
      return '<a class="concept-ref" href="#/note/' + id + '" title="' + escTitle + '">' + label + '</a>';
    });
  }

  /* el('div', {class, text, html, on:{click}, ...attrs}, children) */
  function el(tag, attrs, kids) {
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = sanitizeMathHtml(linkifyConcepts(v));            /* authored content only */
      else if (k === 'on') for (const ev in v) node.addEventListener(ev, v[ev]);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    add(node, kids);
    return node;
  }

  function add(node, kids) {
    if (kids == null || kids === false) return node;
    if (Array.isArray(kids)) { kids.forEach(k => add(node, k)); return node; }
    node.appendChild(kids instanceof Node ? kids : document.createTextNode(String(kids)));
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

  /* polite screen-reader announcements (route changes, verdicts, saves) */
  function announce(msg) {
    const live = document.getElementById('live');
    if (!live) return;
    live.textContent = '';
    window.setTimeout(() => { live.textContent = msg; }, 30);
  }

  /* ── icons ───────────────────────────────────────────────────────────────
     Material Symbols, as a ligature font. Emoji used to stand in for icons
     here (💡, 👁, ⚠, ✓) and they were the wrong tool twice over: every
     platform draws them differently, and they ignore the theme — a yellow
     bulb on a dark card is not a design, it is a default. A ligature glyph
     inherits colour and size from its parent like any other text.

     `mi('bolt')` renders the icon named `bolt`. `mi('bolt', 'fill')` renders
     its filled variant. Names come from fonts.google.com/icons. */
  function mi(name, cls) {
    return el('span', {
      class: 'mi' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true', translate: 'no', text: name
    });
  }

  /* A handful of shapes are still hand-drawn SVG, because they are figures
     rather than icons: the tree chevron animates its own rotation and has to
     line up with a text baseline at three different sizes. */
  const ICONS = {
    chev: 'M9 5l7 7-7 7'
  };
  function icon(name, size, cls) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    if (cls) svg.setAttribute('class', cls);
    if (size) {
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.7');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', ICONS[name] || '');
    svg.appendChild(p);
    return svg;
  }

  function debounce(fn, ms) {
    let t = 0;
    return function () {
      const a = arguments, self = this;
      window.clearTimeout(t);
      t = window.setTimeout(() => fn.apply(self, a), ms);
    };
  }

  const plural = (n, one, many) => n === 1 ? one : (many || one + 's');
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

  const reduced = () => !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* entrance animation, staggered by position — set --i, the CSS does the rest */
  function stagger(node, cls) {
    if (!node) return node;
    node.classList.add(cls || 'stagger');
    Array.prototype.forEach.call(node.children, function (kid, i) {
      kid.style.setProperty('--i', Math.min(i, 12));
    });
    return node;
  }
