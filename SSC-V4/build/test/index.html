<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="description" content="Real Analysis study system — theorem-statement recall, OMR-first objective questions, and a LaTeX theorem-writing workspace.">
<title>Real Analysis · TEST (mock data)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* app/src/ui.css */
/* ══════════════════════════════════════════════════════════════════════════
   Real Analysis study system — design system.

   Mobile-first, two themes, one content column. Depth comes from layered
   glass over a soft aurora, not from heavy borders. Motion is short, springy
   and always optional (prefers-reduced-motion switches it all off).
   ══════════════════════════════════════════════════════════════════════════ */

@property --p { syntax: '<number>'; inherits: false; initial-value: 0; }

:root {
  /* paper-light */
  --paper:#faf8f4; --surface:#fff; --surface-2:#f4f0e9; --surface-3:#e9e2d6;
  --ink:#191614; --ink-2:#554e46; --ink-3:#847b70;
  --rule:#e4dccf; --rule-2:#cec4b3;
  --accent:#2a45c7; --accent-ink:#fff; --accent-soft:#e9ecfd; --accent-line:#b6c0f3;
  --ok:#0d6b49; --ok-soft:#e1f2ea; --ok-line:#a3d4bf;
  --bad:#a9251d; --bad-soft:#fbe9e7; --bad-line:#e9b1ab;
  --warn:#845200; --warn-soft:#fbf0db; --warn-line:#e2c588;

  /* glass + aurora */
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --glass-line:rgba(25,22,20,.08); --blur:saturate(180%) blur(18px);
  --aurora-1:rgba(42,69,199,.13); --aurora-2:rgba(196,120,0,.11); --aurora-3:rgba(13,107,73,.09);

  --font-prose:'Lora',Georgia,'Times New Roman',serif;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;

  --r-s:9px; --r-m:14px; --r-l:22px;
  --sp:16px;
  --head-h:54px; --tab-h:62px;
  --shadow:0 1px 2px rgba(25,22,20,.05),0 10px 30px -14px rgba(25,22,20,.18);
  --shadow-2:0 2px 6px rgba(25,22,20,.06),0 24px 48px -20px rgba(25,22,20,.28);

  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.44,.5,1);
  --dur:.34s; --dur-s:.18s;
  color-scheme:light;
}

:root[data-theme=dark] {
  --paper:#101216; --surface:#191c22; --surface-2:#21252d; --surface-3:#2b313b;
  --ink:#eae7e1; --ink-2:#aaa39b; --ink-3:#7e7770;
  --rule:#2b3038; --rule-2:#3a414d;
  --accent:#93a8ff; --accent-ink:#0d1020; --accent-soft:#1c2340; --accent-line:#39457a;
  --ok:#5ec79c; --ok-soft:#122a21; --ok-line:#26533e;
  --bad:#ff9087; --bad-soft:#2c1715; --bad-line:#5d2926;
  --warn:#e2b567; --warn-soft:#292013; --warn-line:#51401e;

  --glass:rgba(25,28,34,.68); --glass-2:rgba(25,28,34,.5);
  --glass-line:rgba(255,255,255,.07); --blur:saturate(150%) blur(20px);
  --aurora-1:rgba(94,120,255,.17); --aurora-2:rgba(255,167,64,.10); --aurora-3:rgba(64,200,150,.10);

  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-2:0 2px 8px rgba(0,0,0,.45),0 28px 56px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font:400 16px/1.55 var(--font-ui);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);
  overflow-x:hidden;
}
/* the light the glass bends */
body::before{
  content:''; position:fixed; inset:-20% -10% auto -10%; height:120vh; z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(52vw 42vw at 12% 4%, var(--aurora-1), transparent 62%),
    radial-gradient(44vw 40vw at 92% 14%, var(--aurora-2), transparent 64%),
    radial-gradient(48vw 44vw at 50% 92%, var(--aurora-3), transparent 66%);
}

h1,h2,h3{ margin:0; font-weight:600; letter-spacing:-.014em; line-height:1.22; }
h1{ font-size:1.42rem; } h2{ font-size:1.06rem; } h3{ font-size:.95rem; }
p{ margin:0 0 .7em; } ul,ol{ margin:0 0 .7em; padding-left:1.25em; } li{ margin:.25em 0; }
a{ color:var(--accent); text-underline-offset:2px; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:5px; }
h1[tabindex="-1"]:focus,main:focus{ outline:none; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:8px; top:-48px; z-index:60; background:var(--accent);
  color:var(--accent-ink); padding:10px 14px; border-radius:var(--r-s); transition:top .15s; }
.skip:focus{ top:8px; }

/* ── shell ───────────────────────────────────────────────────────────────── */
.top{
  position:sticky; top:0; z-index:30; height:var(--head-h);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glass-line);
}
.brand{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.brand b{ font-weight:600; font-size:.98rem; white-space:nowrap; }
.brand span{ color:var(--ink-3); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; }
.top .grow{ flex:1 1 auto; }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-width:42px; height:42px; padding:0 11px;
  border:1px solid var(--glass-line); background:var(--glass-2);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-radius:999px; cursor:pointer; font-size:.82rem; color:var(--ink-2);
  transition:transform var(--dur-s) var(--spring), color var(--dur-s), border-color var(--dur-s);
}
.icon-btn:hover{ color:var(--ink); border-color:var(--rule-2); }
.icon-btn:active{ transform:scale(.93); }
.icon-btn svg{ width:17px; height:17px; flex:0 0 auto; }

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs a{
  position:relative; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; height:var(--tab-h); text-decoration:none;
  color:var(--ink-3); font-size:.66rem; letter-spacing:.02em; font-weight:500;
  transition:color var(--dur-s);
}
nav.tabs a svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round;
  transition:transform var(--dur) var(--spring), stroke-width var(--dur-s); }
nav.tabs a:active svg{ transform:scale(.88); }
nav.tabs a[aria-current=page]{ color:var(--accent); }
nav.tabs a[aria-current=page] svg{ stroke-width:2.2; transform:translateY(-1px) scale(1.06); }
nav.tabs a[aria-current=page]::before{
  content:''; position:absolute; top:0; left:50%; width:26px; height:3px;
  transform:translateX(-50%); border-radius:0 0 4px 4px; background:var(--accent);
}

main{ display:block; }
.wrap{ width:100%; max-width:730px; margin:0 auto; padding:18px 14px 30px; }
.wrap.bleed{ padding:0; max-width:none; }

@media (min-width:880px){
  :root{ --tab-h:48px; }
  body{ padding-bottom:0; }
  nav.tabs{ position:sticky; top:var(--head-h); bottom:auto; border-top:0;
    border-bottom:1px solid var(--glass-line); }
  nav.tabs a{ flex-direction:row; gap:9px; font-size:.84rem; }
  nav.tabs a[aria-current=page]::before{ top:auto; bottom:0; width:38px; border-radius:4px 4px 0 0; }
  .wrap{ padding:28px 20px 64px; }
}

/* ── motion ──────────────────────────────────────────────────────────────── */
@keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
@keyframes pop{ from{ opacity:0; transform:scale(.9) } to{ opacity:1; transform:none } }
@keyframes slideIn{ from{ opacity:0; transform:translateY(16px) scale(.985) }
  to{ opacity:1; transform:none } }
@keyframes sweepIn{ from{ clip-path:inset(0 100% 0 0) } to{ clip-path:inset(0) } }
@keyframes drawIn{ from{ stroke-dashoffset:var(--len,600) } to{ stroke-dashoffset:0 } }
@keyframes glow{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

.view-in{ animation:rise var(--dur) var(--ease) both; }
.stagger>*{ animation:rise .42s var(--ease) both; animation-delay:calc(var(--i,0)*45ms); }
.verdict{ animation:slideIn .4s var(--spring) both; }

/* ── type helpers ────────────────────────────────────────────────────────── */
.kicker{ font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); }
.lede{ font-family:var(--font-prose); font-size:1.04rem; color:var(--ink-2); }
.muted{ color:var(--ink-3); }
.small{ font-size:.81rem; }
.mono{ font-family:var(--font-mono); font-size:.86em; }
.stack{ display:flex; flex-direction:column; gap:var(--sp); }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.spread{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

/* ── surfaces ────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-m);
  padding:16px; box-shadow:var(--shadow);
}
.card.flat{ box-shadow:none; }
.card.tint{ background:var(--surface-2); box-shadow:none; }
.card.glass{
  background:var(--glass); border-color:var(--glass-line);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-2);
}
a.card,button.card{ display:block; text-decoration:none; color:inherit; text-align:left;
  width:100%; cursor:pointer; transition:transform var(--dur-s) var(--ease),
  border-color var(--dur-s), box-shadow var(--dur-s); }
a.card:hover,button.card:hover{ border-color:var(--accent-line); box-shadow:var(--shadow-2); }
a.card:active,button.card:active{ transform:scale(.985); }
.card h2,.card h3{ margin-bottom:6px; }
.hr{ height:1px; background:var(--rule); border:0; margin:14px 0; }

/* ── badges & chips ──────────────────────────────────────────────────────── */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:.68rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule);
  white-space:nowrap;
}
.badge.accent{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); }
.badge.ok{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
.badge.bad{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
.badge.warn{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  font-size:.81rem; cursor:pointer; text-decoration:none; min-height:36px;
  transition:transform var(--dur-s) var(--spring), background var(--dur-s),
    color var(--dur-s), border-color var(--dur-s);
}
.chip:hover{ border-color:var(--rule-2); color:var(--ink); }
.chip:active{ transform:scale(.94); }
.chip[aria-pressed=true],.chip.on{ background:var(--accent-soft); color:var(--accent);
  border-color:var(--accent-line); font-weight:600; }
.chip[disabled]{ opacity:.55; cursor:not-allowed; }
.chip.ghost{ background:transparent; border-style:dashed; }

/* ── buttons ─────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 18px; border-radius:var(--r-s); cursor:pointer;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font-size:.93rem; font-weight:500; text-decoration:none; text-align:center;
  transition:transform var(--dur-s) var(--spring), filter var(--dur-s), border-color var(--dur-s);
}
.btn:hover{ border-color:var(--rule-2); }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  font-weight:600; box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent); }
.btn.primary:hover{ filter:brightness(1.07); }
.btn.quiet{ background:transparent; border-color:transparent; color:var(--accent); }
.btn.full{ width:100%; }
.btn[disabled]{ opacity:.6; cursor:not-allowed; transform:none; }
.btn.primary[disabled]{ background:var(--surface-2); border-color:var(--rule);
  color:var(--ink-3); opacity:1; box-shadow:none; }
.btn.sm{ min-height:36px; padding:0 14px; font-size:.84rem; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn-row>.btn{ flex:1 1 auto; }

/* ── concept reference links ──────────────────────────────────────────────── */
.concept-ref{
  display:inline-flex; align-items:center; gap:4px; padding:1px 8px; margin:0 2px;
  border-radius:var(--r-s, 6px); background:var(--accent-soft); color:var(--accent);
  font-weight:600; font-size:.88em; text-decoration:none;
  border:1px solid var(--accent-line); vertical-align:baseline;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:background var(--dur-s), color var(--dur-s), border-color var(--dur-s), transform var(--dur-s);
}
.concept-ref:hover{
  background:var(--accent); color:var(--accent-ink, #ffffff);
  border-color:var(--accent); text-decoration:none;
}
.concept-ref:active{ transform:scale(.96); }

.proof-scratchpad{
  width:100%; min-height:85px; padding:10px 12px; margin-top:8px; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:.9rem; line-height:1.5; resize:vertical;
}
.proof-scratchpad:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);
}

/* ── prose (authored HTML + TeX) ─────────────────────────────────────────── */
.prose{ font-family:var(--font-prose); font-size:1.03rem; line-height:1.68; color:var(--ink); }
.prose b{ font-weight:600; }
.prose :last-child{ margin-bottom:0; }
.prose mjx-container[display=true]{ overflow-x:auto; overflow-y:hidden; padding:2px 0; }
mjx-container{ max-width:100%; }
.prose.tight{ font-size:.97rem; line-height:1.62; }

/* ── stats, meters, rings ────────────────────────────────────────────────── */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat{ background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-m);
  padding:12px; }
.stat .n{ font-size:1.55rem; font-weight:600; letter-spacing:-.025em; line-height:1.1; }
.stat .l{ font-size:.67rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
  margin-top:3px; }
.stat .s{ font-size:.74rem; color:var(--ink-2); margin-top:4px; }
.meter{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.meter>i{ display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ok)));
  transition:width .6s var(--ease); animation:sweepIn .7s var(--ease) both; }
.meter.ok>i{ background:var(--ok); }

.ring{ position:relative; width:38px; height:38px; flex:0 0 auto; border-radius:50%;
  display:grid; place-items:center; transition:--p .7s var(--ease);
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-3) 0); }
.ring.done{ background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--surface-3) 0); }
.ring>i{ width:30px; height:30px; border-radius:50%; background:var(--surface);
  display:grid; place-items:center; font-style:normal; font-size:.62rem;
  font-family:var(--font-mono); color:var(--ink-2); }
.ring.done>i{ color:var(--ok); }

/* ── mastery ladder ─────────────────────────────────────────────────────── */
.ladder{ display:flex; gap:6px; }
.ladder>span{ flex:1 1 0; height:6px; border-radius:999px; background:var(--surface-3);
  transition:background var(--dur); }
.ladder>span.on{ background:var(--ok); animation:sweepIn .5s var(--ease) both; }
.ladder-l{ display:flex; justify-content:space-between; font-size:.66rem; color:var(--ink-3);
  margin-top:6px; }

/* ── the tick tree ───────────────────────────────────────────────────────── */
.tree{ display:flex; flex-direction:column; gap:10px; }
.tnode{ border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface);
  box-shadow:var(--shadow); overflow:hidden; }
.tnode.sub{ border-radius:var(--r-s); box-shadow:none; background:var(--surface-2); }
.trow{ display:flex; align-items:stretch; gap:0; }
.tlabel{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:11px;
  padding:13px 14px 13px 4px; background:none; border:0; cursor:pointer; text-align:left;
}
.tnode.sub .tlabel{ padding-top:11px; padding-bottom:11px; }
.tlabel .tt{ flex:1 1 auto; min-width:0; }
.tlabel .tt b{ display:block; font-weight:500; font-size:.97rem; letter-spacing:-.005em; }
.tlabel .tt span{ display:block; font-size:.75rem; color:var(--ink-3); margin-top:1px; }
.tnode.sub .tlabel .tt b{ font-size:.92rem; }
.chev{ flex:0 0 auto; width:20px; height:20px; color:var(--ink-3);
  transition:transform var(--dur) var(--spring); }
.tlabel[aria-expanded=true] .chev{ transform:rotate(90deg); color:var(--accent); }

/* the tick itself — the thing you came here to press */
.tick{
  flex:0 0 auto; width:42px; display:grid; place-items:center; cursor:pointer;
  background:none; border:0;
}
.tick>i{
  width:24px; height:24px; border-radius:7px; border:2px solid var(--rule-2);
  display:grid; place-items:center; font-style:normal; font-size:.78rem; color:transparent;
  background:var(--surface); line-height:1;
  transition:background var(--dur-s), border-color var(--dur-s), color var(--dur-s),
    transform var(--dur-s) var(--spring);
}
.tick:hover>i{ border-color:var(--accent); }
.tick:active>i{ transform:scale(.86); }
.tick[aria-checked=true]>i{ background:var(--ok); border-color:var(--ok); color:#fff; }
.tick[aria-checked=mixed]>i{ background:var(--accent-soft); border-color:var(--accent);
  color:var(--accent); }
.tick[aria-checked=true]>i,.tick[aria-checked=mixed]>i{ animation:pop .26s var(--spring) both; }

/* animated open/close: 0fr -> 1fr, no JS measuring */
.acc{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur) var(--ease); }
.acc.open{ grid-template-rows:1fr; }
.acc>.acc-in{ overflow:hidden; }
.acc-pad{ padding:0 8px 10px; display:flex; flex-direction:column; gap:8px; }
.tnode.sub .acc-pad{ padding:0 6px 8px; }
.tnode.sec .acc-pad{ padding:0 0 8px; gap:6px; }
/* One faint rail at the course level and none below it: every deeper level
   keeps the full width, so a three-deep tree never squeezes the text. */
.rail{ border-left:2px solid var(--rule); padding-left:8px; display:flex;
  flex-direction:column; gap:8px; }
/* a section is a flush band inside its module, not another card */
.tnode.sec{ background:transparent; border:0; border-top:1px solid var(--rule);
  border-radius:0; box-shadow:none; }
.tnode.sec:first-child{ border-top:0; }
.tnode.sec .tlabel{ padding-left:2px; }

.crow{ display:flex; align-items:stretch; border-radius:var(--r-s); background:var(--surface);
  border:1px solid var(--rule); overflow:hidden; }
.tnode.sub .crow{ background:var(--surface); }
.crow>a{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px;
  padding:10px 12px 10px 2px; text-decoration:none; color:inherit; }
.crow .tt{ flex:1 1 auto; min-width:0; }
.crow>a:hover{ background:var(--surface-2); }
.crow .tt b{ display:block; font-weight:500; font-size:.92rem; }
.crow .tt span{ display:block; font-size:.72rem; color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crow.done{ border-color:var(--ok-line); }
.crow.done .tt b{ color:var(--ink-2); }

/* ── recall reel ─────────────────────────────────────────────────────────── */
/* ONE scroller, and only one. A snap container whose cards are themselves
   scrollable traps the gesture: the inner scroller eats the touch and
   `overscroll-behavior:contain` then refuses to chain it back out, so a card
   taller than the screen becomes a dead end. Cards grow instead, the reel
   scrolls, and snapping is `proximity` — `mandatory` makes everything between
   two snap points unreachable the moment a card is taller than the viewport. */
.reel{
  /* `position:relative` is load-bearing, not decoration: it makes the reel the
     offsetParent of its cards, so card.offsetTop is in the SAME coordinate
     system as reel.scrollTop. Without it the cards measure from .wrap, which
     carries the view-in animation — and every jump lands a few pixels out,
     by a margin that changes while the view animates in. */
  position:relative;
  height:calc(100dvh - var(--head-h) - var(--tab-h) - env(safe-area-inset-bottom,0px));
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  scroll-snap-type:y proximity; scroll-behavior:smooth;
  scrollbar-width:none;
}
.reel::-webkit-scrollbar{ display:none; }
@media (min-width:880px){ .reel{ height:calc(100dvh - var(--head-h) - var(--tab-h)); } }
.reel-card{
  min-height:100%; height:auto; scroll-snap-align:start; scroll-snap-stop:normal;
  display:flex; flex-direction:column; padding:16px 14px 46px; position:relative;
  /* Opacity only. A `transform: scale()` on the settle effect moved each card's
     snap point by a few pixels — the browser snaps to the TRANSFORMED box — so
     every jump landed just past its target and left the card sitting high. */
  transition:opacity var(--dur) var(--ease);
  opacity:.45;
}
.reel-card.live{ opacity:1; }
/* auto margins centre the card without clipping tall content the way
   justify-content:center would inside a scroller */
.reel-card>.inner{ width:100%; max-width:640px; margin:auto; display:flex;
  flex-direction:column; gap:14px; }
.reel-hint{ position:absolute; left:0; right:0; bottom:14px; text-align:center;
  font-size:.7rem; color:var(--ink-3); pointer-events:none; }
.reel-hint span{ display:inline-block; animation:glow 2.6s ease-in-out infinite; }
.reel-rail{ position:fixed; right:6px; top:calc(var(--head-h) + 18px); z-index:20;
  display:flex; flex-direction:column; gap:5px; align-items:center; }
.reel-rail i{ width:5px; height:5px; border-radius:50%; background:var(--rule-2);
  transition:all var(--dur) var(--ease); }
.reel-rail i.on{ background:var(--accent); height:16px; border-radius:3px; }
.reel-rail i.got{ background:var(--ok); }
@media (min-width:880px){ .reel-rail{ right:max(12px,calc(50vw - 380px)); } }

/* ── figures ─────────────────────────────────────────────────────────────── */
.fig{ border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface-2);
  overflow:hidden; }
.fig svg{ display:block; width:100%; height:auto; }
.fig-h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 13px; border-bottom:1px solid var(--rule); background:var(--surface); }

  border-top:1px solid var(--rule); }
.fig-ctl{ display:flex; align-items:center; gap:10px; padding:10px 13px;
  border-top:1px solid var(--rule); }
.fig-ctl label{ font-size:.72rem; color:var(--ink-3); white-space:nowrap;

.fig .curve.draw{ stroke-dasharray:var(--len,600); animation:drawIn 1.1s var(--ease) both; }
.fig .band{ fill:var(--accent); opacity:.13; }
.fig .band.warm{ fill:var(--warn); opacity:.16; }

.fig .pt{ fill:var(--accent); }

/* ── reveal blocks ───────────────────────────────────────────────────────── */
.reveal{ border:1px solid var(--rule); border-radius:var(--r-m); overflow:hidden;
  background:var(--surface); }

/* ── write workspace ─────────────────────────────────────────────────────── */
/* ── the writing workspace ───────────────────────────────────────────────── */
/* A document that fills downward: each line's rendering sits directly above

.winput{

}

.wfield{

  { id: 'mo.08', course: 'ra2', sec: '5.1', type: 'NAT', mock: true,

/* ── src/core.dom.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   DOM + routing primitives. No framework: every view returns a real element.
   ══════════════════════════════════════════════════════════════════════════ */

const DOM = (function () {

  const HTML_TAG_NAMES = 'p|b|i|u|strong|em|code|ul|ol|li|br|hr|table|tr|td|th|tbody|thead|h[1-6]|blockquote|pre|small|sub|sup|div|span|a|button|nav|svg|path|circle';
  const VALID_HTML_TAG_RE = new RegExp('</?(?:' + HTML_TAG_NAMES + ')(?=[\\s/>])[^>]*>', 'gi');

  /* Protect mathematical inequalities (e.g. $x<y$, $u-\\varepsilon<s_\\varepsilon$, 1/n < x)
     so the browser HTML parser does not mistake "<" for an opening HTML tag. */
  function sanitizeMathHtml(s) {
    if (typeof s !== 'string' || s.indexOf('<') === -1) return s;
    const tags = [];
    const masked = s.replace(VALID_HTML_TAG_RE, function (match) {
      tags.push(match);
      return '\x00TAG' + (tags.length - 1) + '\x00';
    });
    const safe = masked.replace(/</g, '&lt;');
    return safe.replace(/\x00TAG(\d+)\x00/g, function (_, idx) {
      return tags[parseInt(idx, 10)];
    });
  }

  /* Turn concept IDs like <code>c.2.3.1</code>, $c.3.4.2$, or raw c.2.3.1 references into
     clickable links labeled with their section number and concept name. */
  function linkifyConcepts(s) {
    if (typeof s !== 'string') return s;
    if (s.indexOf('<code>') === -1 && s.indexOf('$c.') === -1 && s.indexOf('c.') === -1 && s.indexOf('s.') === -1) return s;
    const re = /<code>(c\.[0-9]+[a-z0-9.]*|s\.[a-z0-9-]+)<\/code>|\$((?:c\.[0-9]+[a-z0-9.]*|s\.[a-z0-9-]+))\$|(?<=[\s(])(c\.[0-9]+\.[0-9]+[a-z0-9.]*)(?=[\s.,;:)])/g;
    return s.replace(re, function (match, g1, g2, g3) {
      const id = g1 || g2 || g3;
      const c = (typeof Pool !== 'undefined' && Pool.concept) ? Pool.concept(id) : null;
      if (!c) return match;
      const cleanTitle = (c.title || id).split(';')[0].trim();
      const label = c.sec ? ('§' + c.sec + ' ' + cleanTitle) : cleanTitle;
      const secTitle = (c.sec && typeof Pool.sectionTitle === 'function') ? Pool.sectionTitle(c.sec) : null;
      const fullDesc = (secTitle ? ('Section ' + c.sec + ': ' + secTitle + ' — ') : '') + (c.title || id);
      const escTitle = fullDesc.replace(/"/g, '&quot;');
      return '<a class="concept-ref" href="#/note/' + id + '" title="' + escTitle + '">' + label + '</a>';
    });
  }

  /* el('div', {class, text, html, on:{click}, ...attrs}, children) */
  function el(tag, attrs, kids) {
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = sanitizeMathHtml(linkifyConcepts(v));            /* authored content only */
      else if (k === 'on') for (const ev in v) node.addEventListener(ev, v[ev]);

/* ── hash router ─────────────────────────────────────────────────────────── */
const Router = (function () {
  let handler = null;

  function current() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [p, q] = raw.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    new URLSearchParams(q || '').forEach((v, k) => { query[k] = v; });
    return { name: parts[0] || 'home', args: parts.slice(1), query, raw: p };
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', () => handler(current()));
    handler(current());
  }

  const go = hash => { location.hash = hash.charAt(0) === '#' ? hash : '#/' + hash.replace(/^\//, ''); };
  const href = hash => '#/' + String(hash).replace(/^\//, '');
  const reload = () => handler && handler(current());

  return { current, start, go, href, reload };
})();


/* ── src/core.tex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   MathJax plumbing.

   Two jobs: typeset authored content after a view is mounted, and render the
   learner's own LaTeX fragment safely. "Safely" means a malformed fragment
   never throws into the view, never wipes the last good render, and reports a
   human-readable reason. MathJax's formatError hook (set in index.html) parks
   the message on window.__texError; we read and clear it around each run.
   ══════════════════════════════════════════════════════════════════════════ */

const Tex = (function () {

  let chain = Promise.resolve();

  const available = () => !!(window.MathJax && window.MathJax.typesetPromise);

  /* Serialise every typeset call: MathJax is single-threaded and we need the
     error hook to belong to a known run. */
  function run(job) {
    chain = chain.then(job).catch(err => {
      console.warn('[tex]', err && err.message);
    });
    return chain;
  }

  /* Typeset authored HTML already in the DOM. */
  function typeset(nodes) {
    if (!available()) return Promise.resolve();
    const list = Array.isArray(nodes) ? nodes : [nodes];
    return run(() => window.MathJax.typesetPromise(list));
  }

  /* Render one learner fragment into `target`.
     Resolves {ok, error}. On failure `target` keeps whatever it had. */
  function renderFragment(target, latex, opts) {
    const display = !opts || opts.display !== false;
    const src = String(latex == null ? '' : latex);

    if (!src.trim()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'ph', text: opts && opts.placeholder
        ? opts.placeholder : 'Your rendered mathematics will appear here.' }));
      return Promise.resolve({ ok: true, empty: true });
    }
    if (!available()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'mono small', text: src }));
      return Promise.resolve({ ok: false, error: 'MathJax is not loaded — showing LaTeX source.' });
    }

    return run(function () {
      const stage = document.createElement('div');
      stage.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      stage.textContent = display ? '\\[' + src + '\\]' : '\\(' + src + '\\)';
      document.body.appendChild(stage);
      window.__texError = null;

      return window.MathJax.typesetPromise([stage]).then(function () {
        const err = window.__texError;
        window.__texError = null;

        /* Three ways a fragment can be bad, and all three must be caught:
           a TeX error raised through formatError; an error node rendered in
           place; or no maths at all, which is what an unclosed group does —
           MathJax swallows the closing delimiter and finds nothing to typeset. */
        const errNode = stage.querySelector('mjx-merror, [data-mjx-error]');
        const produced = stage.querySelector('mjx-container');
        const why = err
          || (errNode && (errNode.getAttribute('data-mjx-error') || errNode.textContent))
          || (!produced && 'nothing came out — check for an unmatched { or }, and that every command is complete.');

        if (why) { stage.remove(); return { ok: false, error: String(why) }; }

        /* MathJax's noundefined package prints an unknown macro in red rather
           than failing. That is the right behaviour — the rest of the line
           still renders — but the learner deserves to be told. */
        const unknown = stage.querySelector('[style*="color: red"]');
        const hint = unknown
          ? 'It renders, but the part shown in red is not a command MathJax knows — check that spelling.'
          : null;

        DOM.clear(target);
        while (stage.firstChild) target.appendChild(stage.firstChild);
        stage.remove();
        return { ok: true, hint: hint };
      }, function (e) {
        stage.remove();
        window.__texError = null;
        return { ok: false, error: (e && e.message) || 'LaTeX could not be rendered.' };
      });
    });
  }

  /* Wait once for MathJax, so the first view is not typeset into the void. */
  function ready() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      return window.MathJax.startup.promise.catch(() => {});
    }
    return Promise.resolve();
  }

  return { typeset, renderFragment, ready, available };
})();


/* ── src/core.md.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Markdown, line by line, with the maths left alone.

   The writing workspace is a live markdown editor whose maths is written
   inline as $…$ and $$…$$. So the one thing this renderer must never do is
   touch what is between the dollars: `\text{a*b*c}` is not italics, and a
   backslash is not an escape character to markdown here.

   The method is therefore: cut the source into maths and prose segments
   first, run the inline rules over prose only, then reassemble. Every block
   is one line — the editor renders each line into its own frame, so there is
   no multi-line block state to carry.
   ══════════════════════════════════════════════════════════════════════════ */

const Markdown = (function () {

  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* Split on $$…$$ first, then $…$, so a display block is never mistaken for
     two inline ones. Returns [{math:false,t}|{math:true,t}]. */
  function segments(src) {
    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;
  }

  /* Inline rules, prose only. Code spans are pulled out first so that what is
     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);
      return '\x00C' + (code.length - 1) + '\x00';
    });

    s = esc(s)
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>');

    return s.replace(/\x00C(\d+)\x00/g, (_, i) => '<code>' + esc(code[+i]) + '</code>');
  }

  /* prose through the inline rules, maths through untouched */
  function spans(src) {
    return segments(src).map(seg => seg.math ? seg.t : inline(seg.t)).join('');
  }

  /* One source line -> one HTML block. */
  function line(src) {
    const raw = String(src == null ? '' : src);
    const t = raw.trim();
    if (!t) return '';

    if (/^(---|\*\*\*|___)\s*$/.test(t)) return '<hr>';

    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) {
      const n = Math.min(h[1].length + 1, 5);
      return '<h' + n + ' class="md-h">' + spans(h[2]) + '</h' + n + '>';
    }

    const q = /^>\s?(.*)$/.exec(t);
    if (q) return '<blockquote class="md-q">' + spans(q[1]) + '</blockquote>';

    const ul = /^[-*+]\s+(.*)$/.exec(t);
    if (ul) return '<ul class="md-l"><li>' + spans(ul[1]) + '</li></ul>';

    const ol = /^(\d+)[.)]\s+(.*)$/.exec(t);
    if (ol) return '<ol class="md-l" start="' + ol[1] + '"><li>' + spans(ol[2]) + '</li></ol>';

    return '<p class="md-p">' + spans(raw) + '</p>';
  }

  /* Does this line carry any maths delimiter at all? The editor uses this to
     decide whether a delimiter-free line in a maths-first box should be
     treated as bare LaTeX. */
  const hasMath = src => /\$/.test(String(src || ''));

  /* Whole document, for export and for the read-only preview. */
  const doc = src => String(src || '').split('\n').map(line).join('\n');

  return { line, doc, hasMath, inline, segments };
})();


/* ── src/core.store.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Progress store.

   Three things are tracked, and they are kept apart on purpose:

     completion   Level 1. You have encountered the material. Never evidence
                  of recall.
     proof work   Level 2. You have worked a proof through yourself. Awarded
                  per task, never for opening the note.
     first try    the FIRST recorded attempt at a card or a question. Later
                  attempts are allowed but never overwrite the first, because
                  the first attempt is the only honest measurement.

   The shape is built for merging. Two devices can both make progress offline,
   so every mutation is timestamped and every removal leaves a tombstone —
   merge(a,b) == merge(b,a), and merging twice changes nothing. core.sync.js
   depends on that and on nothing else.

   Storage is localStorage with an in-memory fallback so a locked-down browser
   degrades to a working-but-forgetful session instead of a broken one.
   ══════════════════════════════════════════════════════════════════════════ */

const Store = (function () {

  const KEY = 'ssc4.level1.v1';
  const EMPTY = {
    v: 2,
    done: {}, undone: {},        /* Level 1 completion + tombstones */
    proofs: {}, unproofs: {},    /* Level 2 proof work + tombstones */
    cards: {}, omr: {}, write: {},
    prefs: {}, prefsAt: {},
    updated: 0
  };

  let volatile = false;
  let state = load();
  const listeners = [];

  function blank() { return JSON.parse(JSON.stringify(EMPTY)); }

  /* v1 had no tombstones, no proof map and no per-key preference stamps.
     Everything it did have keeps its meaning, so the upgrade is a fill-in. */
  function upgrade(raw) {
    const s = Object.assign(blank(), raw || {});
    ['done', 'undone', 'proofs', 'unproofs', 'cards', 'omr', 'write', 'prefs', 'prefsAt']
      .forEach(function (k) { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
    s.v = 2;
    if (!s.updated) s.updated = Date.now();
    return s;
  }

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (!raw) return blank();
      return upgrade(JSON.parse(raw));
    } catch (e) {
      volatile = true;
      return blank();
    }
  }

  const flush = DOM.debounce(function () {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { volatile = true; }
  }, 250);

  function save(quiet) {
    state.updated = Date.now();
    flush();
    if (!quiet) listeners.forEach(function (fn) { try { fn(); } catch (e) { /* a listener must never break a save */ } });
  }

  /* core.sync.js subscribes here; nothing else needs to. */
  function onChange(fn) { listeners.push(fn); }

  /* ── a tick with a tombstone, used by completion and by proof work ────── */
  function flag(on, off, id, want) {
    const now = Date.now();
    if (want) { state[on][id] = now; delete state[off][id]; }
    else { state[off][id] = now; delete state[on][id]; }
    save();
    return !!state[on][id];
  }

  /* ── completion (Level 1) ────────────────────────────────────────────── */
  const isDone = id => !!state.done[id];
  const setDone = (id, on) => flag('done', 'undone', id, on);

  /* Tick a whole list in one write — the prerequisite cascade. Returns the
     ids that actually changed, so the caller can report honestly. */
  function setDoneMany(ids, on) {
    const now = Date.now();
    const hit = [];
    (ids || []).forEach(function (id) {
      if (!!state.done[id] === !!on) return;
      hit.push(id);
      if (on) { state.done[id] = now; delete state.undone[id]; }
      else { state.undone[id] = now; delete state.done[id]; }
    });
    if (hit.length) save();
    return hit;
  }

  /* ── proof work (Level 2) ────────────────────────────────────────────── */
  /* id is a concept id, or 'w:<questionId>' for a written question. */
  const isProofDone = id => !!state.proofs[id];
  const setProofDone = (id, on) => flag('proofs', 'unproofs', id, on);

  /* grade: 'got' | 'partly' | 'missed' */
  const card = id => state.cards[id] || null;
  function gradeCard(id, grade) {
    const rec = state.cards[id] || (state.cards[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = grade;
    rec.lastAt = Date.now();
    if (!rec.first) { rec.first = grade; rec.firstAt = rec.lastAt; }  /* first attempt is final */
    save();
    return rec;
  }

  const omr = id => state.omr[id] || null;
  function lockOmr(id, result) {
    const rec = state.omr[id] || (state.omr[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = { given: result.given, verdict: result.verdict, ms: result.ms, at: Date.now() };
    if (!rec.first) rec.first = rec.last;
    save();
    return rec;
  }

  /* ── writing drafts ──────────────────────────────────────────────────── */
  const draft = cid => (state.write[cid] && state.write[cid].tex) || '';
  function saveDraft(cid, tex) {
    if (!tex.trim()) delete state.write[cid];
    else state.write[cid] = { tex: tex, at: Date.now() };

  }

  const pref = (k, d) => (k in state.prefs ? state.prefs[k] : d);

  }

  /* ── the mastery level the app is currently operating at ─────────────── */
  /* Level 2 has to be unlocked before it can be selected: either a whole
     course is finished at Level 1, or the learner turns it on deliberately in
     settings. Opening the app never promotes anyone. */
  const unlocked = () => pref('level2', false) === true;
  function unlock(on) { setPref('level2', !!on); if (!on) setPref('level', 1); return unlocked(); }
  function level() {
    const want = pref('level', 1);

  }

  /* ── aggregate stats over a given universe of ids ────────────────────── */
  function summary(conceptIds, cardIds, omrIds, proofIds) {
    const notes = conceptIds.filter(isDone).length;
    let tried = 0, got = 0, partly = 0;
    cardIds.forEach(function (id) {
      const r = state.cards[id];
      if (!r || !r.first) return;
      tried += 1;
      if (r.first === 'got') got += 1;
      else if (r.first === 'partly') partly += 1;

    let locked = 0, right = 0, part = 0;
    omrIds.forEach(function (id) {
      const r = state.omr[id];
      if (!r || !r.first) return;
      locked += 1;
      if (r.first.verdict === 'correct') right += 1;
      else if (r.first.verdict === 'partial') part += 1;
    });
    const pf = proofIds || [];
    return {
      notes: { done: notes, total: conceptIds.length },
      cards: { tried: tried, got: got, partly: partly, total: cardIds.length },
      omr: { locked: locked, correct: right, partial: part, total: omrIds.length },
      proofs: { done: pf.filter(isProofDone).length, total: pf.length }
    };

  /* ── merging two devices ─────────────────────────────────────────────────
     Loss-free and order-independent. The rules follow from what each field
     means rather than from a single "newest wins": a first attempt is a
     measurement, so the EARLIER one survives; a tick is a decision, so the
     LATER one survives. */
  function mergeFlags(a, b, ta, tb) {
    const on = {}, off = {};
    [a, b].forEach(src => { for (const k in (src || {})) if (!(on[k] >= src[k])) on[k] = src[k]; });
    [ta, tb].forEach(src => { for (const k in (src || {})) if (!(off[k] >= src[k])) off[k] = src[k]; });
    for (const k in off) {
      if (!on[k]) continue;
      if (off[k] > on[k]) delete on[k];   /* un-ticked after the tick */
      else delete off[k];                 /* tombstone spent */
    }

  }

    const out = {};
    const ids = {};
    for (const k in (A || {})) ids[k] = true;
    for (const k in (B || {})) ids[k] = true;
    for (const id in ids) {
      const x = (A || {})[id], y = (B || {})[id];
      if (!x || !y) { out[id] = JSON.parse(JSON.stringify(x || y)); continue; }
      const rec = { tries: Math.max(x.tries || 0, y.tries || 0) };

      /* the honest first attempt is the earliest one either device saw */
      const fx = x.first ? (x.firstAt || (x.first.at || 0)) : Infinity;
      const fy = y.first ? (y.firstAt || (y.first.at || 0)) : Infinity;
      const first = fx <= fy ? x : y;
      if (first.first) {
        rec.first = first.first;
        if (first.firstAt) rec.firstAt = first.firstAt;
      }

      /* the latest pass is the one worth showing */
      const lx = x.lastAt || (x.last && x.last.at) || 0;
      const ly = y.lastAt || (y.last && y.last.at) || 0;
      const last = lx >= ly ? x : y;
      if (last.last) {
        rec.last = last.last;
        if (last.lastAt) rec.lastAt = last.lastAt;
      }
      out[id] = rec;
    }

  }

    A = upgrade(A); B = upgrade(B);
    const done = mergeFlags(A.done, B.done, A.undone, B.undone);
    const proof = mergeFlags(A.proofs, B.proofs, A.unproofs, B.unproofs);

    const write = {};
    [A.write, B.write].forEach(function (src) {
      for (const k in (src || {})) {
        if (!write[k] || (src[k].at || 0) > (write[k].at || 0)) write[k] = src[k];
      }
    });

    /* preferences are per-key: the device that set it most recently wins, and
       a key with no stamp yields to one that has it */
    const prefs = {}, prefsAt = {};
    [[A.prefs, A.prefsAt, A.updated], [B.prefs, B.prefsAt, B.updated]].forEach(function (p) {
      const src = p[0] || {}, at = p[1] || {}, fallback = p[2] || 0;
      for (const k in src) {
        const t = at[k] || fallback;
        if (!(k in prefs) || t >= (prefsAt[k] || 0)) { prefs[k] = src[k]; prefsAt[k] = t; }
      }
    });

    return {
      v: 2,
      done: done.on, undone: done.off,
      proofs: proof.on, unproofs: proof.off,
      cards: mergeAttempts(A.cards, B.cards),
      omr: mergeAttempts(A.omr, B.omr),
      write: write, prefs: prefs, prefsAt: prefsAt,
      updated: Math.max(A.updated || 0, B.updated || 0)
    };
  }

  /* Adopt a merged state wholesale. `quiet` keeps the sync listener from
     firing on the state it has just pulled. */
  function adopt(next, quiet) {
    state = upgrade(next);
    save(quiet);
    return state;
  }

  const snapshot = () => JSON.parse(JSON.stringify(state));
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function reset() { state = blank(); save(); }

  /* what the summary tiles count, so two callers cannot disagree */
  function tally() {
    return {
      notes: Object.keys(state.done).length,
      proofs: Object.keys(state.proofs).length,
      cards: Object.keys(state.cards).filter(k => state.cards[k].first).length,
      omr: Object.keys(state.omr).filter(k => state.omr[k].first).length
    };
  }

  return {
    isDone, setDone, setDoneMany,
    isProofDone, setProofDone,
    card, gradeCard, omr, lockOmr, draft, saveDraft,
    pref, setPref, level, setLevel, unlocked, unlock,
    summary, exportJSON, reset, tally,
    snapshot, adopt, mergeStates, onChange,
    isVolatile: () => volatile
  };
})();


/* ── src/core.sync.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Multi-device sync.

   Firebase Realtime Database over plain REST — no SDK, no npm, no auth
   handshake, nothing to load before the app can start. One GET and one PUT.

   The key is the learner's name and roll number. That is a pass key, not a
   password: anyone who knows both can read and write that record, and the UI
   says so plainly rather than implying a login. It is the right trade for a
   personal study record that has to follow one person between a phone and a
   laptop with no account to create.

   Every sync MERGES before it writes (Store.mergeStates), so two devices that
   both worked offline lose nothing and the order they reconnect in does not
   matter. Overwriting instead of merging is how a week of work disappears.
   ══════════════════════════════════════════════════════════════════════════ */

const Sync = (function () {

  const DB = 'https://task-dominion-default-rtdb.asia-southeast1.firebasedatabase.app';

  /* Mock and validated pools keep separate records: their ids do not mean the
     same things, and test progress must never land in the real one. */
  const NS = () => (typeof DATA_KIND !== 'undefined' && DATA_KIND === 'live')
    ? 'ssc4_ra_v1' : 'ssc4_ra_mock_v1';

  let syncing = false;
  let pushT = 0;
  let last = { at: 0, ok: null, msg: '' };
  const watchers = [];

  const slug = s => String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  /* name + roll -> one stable key. Both are required: a roll number alone
     collides across colleges, a name alone collides across people.

     The separator is '--', not '.': a Realtime Database key may not contain
     '.', '$', '#', '[', ']' or '/', and a dotted key is rejected outright with
     "Invalid token in path". slug() collapses runs of separators, so '--' can
     never be produced by either half and the split stays unambiguous. */
  function keyFor(name, roll) {
    const a = slug(name), b = slug(roll);
    return (a && b) ? a + '--' + b : '';
  }

  const identity = () => ({
    name: Store.pref('syncName', ''),
    roll: Store.pref('syncRoll', '')
  });

  function key() {
    const id = identity();
    return keyFor(id.name, id.roll);
  }

  const on = () => !!key();
  const url = () => DB + '/' + NS() + '/' + encodeURIComponent(key()) + '.json';

  function announce(ok, msg) {
    last = { at: Date.now(), ok: ok, msg: msg };
    watchers.forEach(function (fn) { try { fn(last); } catch (e) { /* a watcher must never break a sync */ } });
  }

  const watch = fn => { watchers.push(fn); return last; };
  const status = () => ({ on: on(), key: key(), syncing: syncing, last: last });

  /* ── the one operation: pull, merge, push ─────────────────────────────── */
  function now(opts) {
    const o = opts || {};
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not connected.' });
    if (syncing) return Promise.resolve({ ok: false, msg: 'Already syncing.' });
    if (!window.fetch) return Promise.resolve({ ok: false, msg: 'This browser cannot sync.' });

    syncing = true;
    announce(null, 'Syncing…');
    const before = Store.tally();

    return window.fetch(url(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (remote) {
        let rs = null;
        if (remote && typeof remote === 'object' && typeof remote.payload === 'string') {
          try { rs = JSON.parse(remote.payload); } catch (e) { rs = null; }
        }
        const merged = Store.mergeStates(Store.snapshot(), rs);
        Store.adopt(merged, true);   /* quiet: do not re-trigger the auto-push */

        const body = JSON.stringify({
          payload: JSON.stringify(Store.snapshot()),
          updated: Date.now(),
          device: Store.pref('syncName', '') + ' · ' + (navigator.platform || 'device')
        });
        return window.fetch(url(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: body
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const after = Store.tally();
          const gained = {
            notes: after.notes - before.notes,
            proofs: after.proofs - before.proofs,
            cards: after.cards - before.cards,
            omr: after.omr - before.omr
          };
          const bits = [];
          if (gained.notes > 0) bits.push(gained.notes + ' ' + DOM.plural(gained.notes, 'note'));
          if (gained.proofs > 0) bits.push(gained.proofs + ' ' + DOM.plural(gained.proofs, 'proof'));
          if (gained.cards > 0) bits.push(gained.cards + ' ' + DOM.plural(gained.cards, 'card'));
          if (gained.omr > 0) bits.push(gained.omr + ' ' + DOM.plural(gained.omr, 'question'));
          const msg = bits.length
            ? 'Merged in ' + bits.join(', ') + ' from your other device'
            : 'Everything already in sync';
          syncing = false;
          announce(true, msg);
          if (bits.length && o.reload !== false && typeof Router !== 'undefined') Router.reload();
          if (!o.quiet) DOM.announce(msg + '.');
          return { ok: true, msg: msg, gained: gained };
        });
      })
      .catch(function (err) {
        syncing = false;
        const msg = /Failed to fetch|NetworkError/i.test(String(err && err.message))
          ? 'Offline — your progress is saved here and will sync when you are back.'
          : 'Sync failed: ' + ((err && err.message) || err);
        announce(false, msg);
        if (!o.quiet) DOM.announce(msg);
        return { ok: false, msg: msg };
      });
  }

  const schedule = () => {
    if (!on()) return;
    window.clearTimeout(pushT);
    pushT = window.setTimeout(() => now({ quiet: true, reload: false }), 1500);
  };

  /* ── connecting ──────────────────────────────────────────────────────── */
  function connect(name, roll) {
    const k = keyFor(name, roll);
    if (!k) return Promise.resolve({ ok: false, msg: 'Both a name and a roll number are needed.' });
    Store.setPref('syncName', String(name).trim());
    Store.setPref('syncRoll', String(roll).trim());
    return now({ quiet: false });
  }

  function disconnect() {
    Store.setPref('syncName', '');
    Store.setPref('syncRoll', '');
    announce(null, 'Disconnected. Progress stays on this device.');
  }

  /* ── wiring ──────────────────────────────────────────────────────────── */
  function start() {
    Store.onChange(schedule);
    if (!on()) return;
    now({ quiet: true });
    /* coming back to the tab is the moment the other device's work matters */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) now({ quiet: true });
    });
    window.addEventListener('online', function () { now({ quiet: true }); });
  }

  return { start, connect, disconnect, now, status, watch, identity, keyFor, on };
})();


/* ── src/core.pool.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Content pool — one pass over the loaded data, then pure lookups.

   The app never reads the data globals directly; everything goes through here,
   so swapping mock data for the validated pool changes nothing above this line.

   Reads:  SYLLABI, SECTITLE, CONCEPTS, OBJECTIVE, QUESTIONS (optional)
   Builds: concept index, section -> concepts, course/module for a section,
           the statement-card deck, and the inverted `tests` edge
           (concept -> questions that examine it).
   ══════════════════════════════════════════════════════════════════════════ */

const Pool = (function () {

  const byId = {};          /* concept id -> node */
  const bySec = {};         /* section id  -> [node] */
  const secMeta = {};       /* section id  -> {course, module} */
  const deck = [];          /* statement cards, in course order */
  const objFor = {};        /* concept id -> [objective question] */
  const writFor = {};       /* concept id -> [written question] */
  const neededBy = {};      /* concept id -> [concept that lists it in needs] */
  const background = [];    /* nodes with no section in any course */
  let courses = [], objective = [], written = [], titles = {}, mock = false;

  /* Data files declare top-level `const`s, which are global *lexical* bindings
     rather than window properties — so they are read by name, guarded with
     typeof. These five names, plus DATA_KIND, are the entire data contract. */
  function build() {
    courses = (typeof SYLLABI !== 'undefined' ? SYLLABI : []).slice();
    objective = (typeof OBJECTIVE !== 'undefined' ? OBJECTIVE : []).slice();
    written = (typeof QUESTIONS !== 'undefined' ? QUESTIONS : []).slice();
    titles = typeof SECTITLE !== 'undefined' ? SECTITLE : {};
    const concepts = typeof CONCEPTS !== 'undefined' ? CONCEPTS : [];
    const kind = typeof DATA_KIND !== 'undefined' ? DATA_KIND : null;

    mock = kind === 'mock' || concepts.some(c => c.mock) || objective.some(q => q.mock);

    courses.forEach(course => (course.modules || []).forEach(mod =>
      (mod.secs || []).forEach(sec => { secMeta[sec] = { course: course, module: mod }; })));

    concepts.forEach(function (c) {
      byId[c.id] = c;
      if (c.sec && secMeta[c.sec]) (bySec[c.sec] || (bySec[c.sec] = [])).push(c);
      else background.push(c);
    });

    /* reverse prerequisite edges: "what does knowing this unlock?" */
    concepts.forEach(c => (c.needs || []).forEach(function (n) {
      (neededBy[n] || (neededBy[n] = [])).push(c);
    }));

    /* statement recall deck, ordered the way the courses are ordered */
    sections().forEach(s => s.concepts.forEach(c =>
      (c.cards || []).forEach(function (card, i) {
        if (card.kind !== 'state') return;
        deck.push({ id: c.id + '#' + i, cid: c.id, q: card.q, a: card.a, sec: c.sec,
          title: c.title, kind: c.kind });
      })));

    objective.forEach(q => (q.tests || []).forEach(t => (objFor[t] || (objFor[t] = [])).push(q)));
    written.forEach(q => (q.tests || []).forEach(t => (writFor[t] || (writFor[t] = [])).push(q)));
  }

  /* every in-course section, in display order */
  function sections(courseId) {
    const out = [];
    courses.forEach(function (course) {
      if (courseId && course.id !== courseId) return;
      (course.modules || []).forEach(mod => (mod.secs || []).forEach(sec => out.push({
        sec: sec, title: sectionTitle(sec), course: course, module: mod,
        concepts: bySec[sec] || []
      })));
    });
    return out;
  }

  const sectionTitle = sec => titles[sec] || ('Section ' + sec);
  const concept = id => byId[id] || null;
  const course = id => courses.filter(c => c.id === id)[0] || null;
  const courseOfSec = sec => (secMeta[sec] && secMeta[sec].course) || null;
  const moduleOfSec = sec => (secMeta[sec] && secMeta[sec].module) || null;
  const objectiveFor = cid => objFor[cid] || [];
  const writtenFor = cid => writFor[cid] || [];
  const objectiveOne = id => objective.filter(q => q.id === id)[0] || null;

  /* concepts of the whole slice, in reading order */
  function conceptList(courseId) {
    const out = [];
    sections(courseId).forEach(s => s.concepts.forEach(c => out.push(c)));
    return out;
  }

  /* Prerequisite chain, deepest first, ending at `id` itself. Depth-first over
     `needs`, de-duplicated, cycle-safe — this is what the note view walks. */
  function chain(id, limit) {
    const out = [], seen = {};
    (function walk(at, depth) {
      if (!byId[at] || seen[at] || depth > (limit == null ? 4 : limit)) return;
      seen[at] = true;
      (byId[at].needs || []).forEach(n => walk(n, depth + 1));
      out.push(byId[at]);
    })(id, 0);
    return out;
  }

  const unlocks = id => (neededBy[id] || []).slice();

  /* previous / next concept in reading order across the whole pool */
  function neighbours(id) {
    const all = conceptList();
    const i = all.map(c => c.id).indexOf(id);
    if (i < 0) return { prev: null, next: null };
    return { prev: all[i - 1] || null, next: all[i + 1] || null };
  }

  /* ids used for progress denominators */
  const ids = {
    concepts: courseId => conceptList(courseId).map(c => c.id),
    cards: () => deck.map(c => c.id),
    objective: () => objective.map(q => q.id),
    /* Level 2 counts proof work, so its denominator is the concepts that
       actually carry a proof — not every note. */
    proofs: courseId => conceptList(courseId).filter(c => c.proof).map(c => c.id)
  };

  return {
    build, sections, sectionTitle, concept, concepts: conceptList, course,
    courses: () => courses, courseOfSec, moduleOfSec, deck: () => deck,
    objective: () => objective, objectiveOne, objectiveFor, writtenFor,
    background: () => background, chain, unlocks, neighbours, ids, isMock: () => mock
  };
})();


/* ── src/core.latex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   LaTeX commands, offered the way a code editor offers them.

   The brief asks for "a compact palette of the LaTeX commands needed for the
   current theorem … contextual and small rather than an indiscriminate
   reference manual." A sheet of keys at the bottom of the screen satisfied
   the letter of that and failed the thumb: on a phone it covers the input you
   are typing into, and finding one symbol among sixty is slower than knowing
   how to spell it.

   So the catalogue is now a completion source. Type `\va` and the matches
   appear inline above the keyboard, ranked with the commands this theorem
   actually uses first. Tap one, or press Tab. When nothing is being typed the
   same strip shows the contextual commands, so discovery still works by
   thumb — which is what the palette was really for.
   ══════════════════════════════════════════════════════════════════════════ */

const Latex = (function () {

    { g: 'Greek', show: 'μ', cmd: 'mu', ins: '\\mu ' },
    { g: 'Greek', show: 'σ', cmd: 'sigma', ins: '\\sigma ' },
    { g: 'Greek', show: 'φ', cmd: 'varphi', ins: '\\varphi ', desc: 'phi' },

    { g: 'Logic', show: '∀', cmd: 'forall', ins: '\\forall ', desc: 'for all' },

    { g: 'Sets', show: 'ℝ', cmd: 'mathbb', needle: '\\mathbb{R}', ins: '\\mathbb{R}', desc: 'the reals', alt: 'R reals' },

    { g: 'Analysis', show: 'limsup', cmd: 'limsup', ins: '\\limsup_{' + CARET + '}' },
    { g: 'Analysis', show: 'Σ', cmd: 'sum', ins: '\\sum_{' + CARET + '}^{}', desc: 'sum' },
    { g: 'Analysis', show: '∏', cmd: 'prod', ins: '\\prod_{' + CARET + '}^{}', desc: 'product' },
    { g: 'Analysis', show: '∫', cmd: 'int', ins: '\\int_{' + CARET + '}^{}', desc: 'integral' },
    { g: 'Analysis', show: '∂', cmd: 'partial', ins: '\\partial ' },
    { g: 'Analysis', show: '⋯', cmd: 'cdots', ins: '\\cdots ' },
    { g: 'Analysis', show: '…', cmd: 'ldots', ins: '\\ldots ' },
    { g: 'Analysis', show: 'f′', cmd: 'prime', ins: "f'(" + CARET + ')', desc: 'derivative' },

    { g: 'Structure', show: 'a⁄b', cmd: 'frac', ins: '\\frac{' + CARET + '}{}', desc: 'fraction' },
    { g: 'Structure', show: '√', cmd: 'sqrt', ins: '\\sqrt{' + CARET + '}', desc: 'square root' },
    { g: 'Structure', show: 'xⁿ', cmd: 'sup-script', ins: '^{' + CARET + '}', desc: 'superscript', alt: 'power exponent' },
    { g: 'Structure', show: 'xₙ', cmd: 'sub-script', ins: '_{' + CARET + '}', desc: 'subscript', alt: 'index' },
    { g: 'Structure', show: '|x|', cmd: 'abs', ins: '|' + CARET + '|', desc: 'absolute value', alt: 'modulus' },
    { g: 'Structure', show: '‖x‖', cmd: 'norm', ins: '\\|' + CARET + '\\|', desc: 'norm' },
    { g: 'Structure', show: '( )', cmd: 'left', ins: '\\left(' + CARET + '\\right)', desc: 'sized brackets' },
    { g: 'Structure', show: '[ ]', cmd: 'bracket', ins: '[' + CARET + ']' },
    { g: 'Structure', show: 'quad', cmd: 'quad', ins: '\\quad ', desc: 'wide space' },
    { g: 'Structure', show: 'cases', cmd: 'cases', ins: '\\begin{cases}' + CARET + '\\end{cases}', desc: 'case split' }
  ];

  /* what stays offered even when the statement does not use it */
  const CORE = ['varepsilon', 'delta', 'forall', 'exists', 'in', 'le', 'to',
    'frac', 'abs', 'sub-script', 'sup-script', 'mathbb', 'lim', 'text'];

  function macrosIn(tex) {
    const src = String(tex || '');
    const found = {};
    src.replace(/\\([a-zA-Z]+)/g, function (whole, m) { found[m] = true; return whole; });
    if (/_\{|_[a-zA-Z0-9]/.test(src)) found['sub-script'] = true;
    if (/\^\{|\^[a-zA-Z0-9]/.test(src)) found['sup-script'] = true;
    if (/\|/.test(src)) found['abs'] = true;
    return found;
  }

  /* Which catalogue entries this concept's own statement uses. These rank
     first everywhere — it is the whole of "contextual". */
  function usedBy(concept) {
    const src = String((concept && concept.statement) || '');
    const used = macrosIn(src);
    const taken = {};
    return CATALOG.filter(function (k) {
      const hit = k.needle ? src.indexOf(k.needle) >= 0 : !!used[k.cmd];
      if (!hit || taken[k.ins]) return false;
      taken[k.ins] = true;
      return true;
    });
  }

  /* ── completion ───────────────────────────────────────────────────────── */

  /* The token being typed: a backslash and the letters after it, ending at
     the caret. Returns null when the caret is not inside one. */
  function tokenAt(value, caret) {
    const upto = String(value || '').slice(0, caret);
    const m = /\\([a-zA-Z]*)$/.exec(upto);
    if (!m) return null;
    return { text: m[0], word: m[1], from: caret - m[0].length, to: caret };
  }

  const score = (k, word, ctx) => {
    const w = word.toLowerCase();
    const cmd = k.cmd.toLowerCase();
    const hay = (cmd + ' ' + (k.desc || '') + ' ' + (k.alt || '')).toLowerCase();
    let s = -1;
    if (!w) s = 40;
    else if (cmd === w) s = 100;
    else if (cmd.indexOf(w) === 0) s = 80 - cmd.length;
    else if (hay.indexOf(w) >= 0) s = 40 - cmd.length;
    if (s < 0) return s;
    if (ctx[k.ins]) s += 25;                      /* this theorem uses it */
    if (CORE.indexOf(k.cmd) >= 0) s += 6;
    return s;
  };

  /* Ranked completions for a partial command. `word` may be '' — that is the
     bare-backslash case, and it should still offer something useful. */
  function complete(word, concept, limit) {
    const ctx = {};
    usedBy(concept).forEach(k => { ctx[k.ins] = true; });
    const seen = {};
    return CATALOG
      .map(k => ({ k: k, s: score(k, String(word || ''), ctx) }))
      .filter(function (r) {
        if (r.s < 0 || seen[r.k.ins]) return false;
        seen[r.k.ins] = true;
        return true;
      })
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 12)
      .map(r => r.k);
  }

  /* The idle strip: what to offer when nothing is being typed. Contextual
     first, then the essentials, because a learner who does not know the
     spelling cannot start a completion at all. */
  function suggestions(concept, limit) {
    const ctx = usedBy(concept);
    const taken = {};
    ctx.forEach(k => { taken[k.ins] = true; });
    const core = CATALOG.filter(k => !taken[k.ins] && CORE.indexOf(k.cmd) >= 0);
    return ctx.concat(core).slice(0, limit || 14);
  }

  /* ── insertion ────────────────────────────────────────────────────────── */

  /* Replace [from,to) with `ins`, honouring CARET and any selection. Works on
     an <input> and on a <textarea> alike. */
  function splice(field, from, to, ins) {
    const val = field.value;
    const selected = val.slice(from, to);
    let text = ins, caretAt;
    const mark = text.indexOf(CARET);
    if (mark >= 0) {
      text = text.slice(0, mark) + selected + text.slice(mark + 1);
      caretAt = from + mark + selected.length;
    } else {
      caretAt = from + text.length;
    }
    field.value = val.slice(0, from) + text + val.slice(to);
    field.focus();
    try { field.setSelectionRange(caretAt, caretAt); } catch (e) { /* detached field */ }
    field.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* Insert at the caret, replacing the selection. */
  function insert(field, ins) {
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const b = field.selectionEnd == null ? a : field.selectionEnd;
    splice(field, a, b, ins);
  }

  /* Accept a completion: the partial command being typed is replaced whole. */
  function accept(field, entry) {
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const tok = tokenAt(field.value, a);
    if (tok) splice(field, tok.from, tok.to, entry.ins);
    else insert(field, entry.ins);
  }

  return { CATALOG, CARET, usedBy, tokenAt, complete, suggestions, insert, splice, accept };
})();


/* ── src/ui.parts.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Shared view parts. Small builders every view reuses, so the views stay
   about study logic rather than markup.
   ══════════════════════════════════════════════════════════════════════════ */

const UI = (function () {

  const el = DOM.el;

  /* The page heading is also the focus target after a route change. */
  const title = (text, kicker) => el('div', {}, [
    kicker ? el('div', { class: 'kicker', text: kicker }) : null,
    el('h1', { tabindex: '-1', id: 'pagetitle', text: text })
  ]);

  function crumb(items) {
    const row = el('nav', { class: 'crumb', 'aria-label': 'Breadcrumb' });
    items.forEach(function (it, i) {
      if (i) row.appendChild(el('span', { 'aria-hidden': 'true', text: '›' }));
      row.appendChild(it.href
        ? el('a', { href: Router.href(it.href), text: it.text })
        : el('span', { text: it.text }));
    });
    return row;
  }

  /* authored HTML + TeX. Typeset by the caller via UI.math(node). */
  const prose = (html, cls) => el('div', { class: 'prose' + (cls ? ' ' + cls : ''), html: html || '' });
  const math = node => Tex.typeset(node);

  const kindBadge = c => el('span', { class: 'badge', text: c.kind || 'note' });

  const tierBadge = c => (c.tier && c.tier !== 'core')
    ? el('span', { class: 'badge warn', text: c.tier === 'ext' ? 'extension' : c.tier })
    : null;

  const doneBadge = id => Store.isDone(id)
    ? el('span', { class: 'badge ok', text: '✓ completed' })
    : null;

  const meter = (a, b, ok) => el('div', { class: 'meter' + (ok ? ' ok' : '') }, [
    el('i', { style: { width: DOM.pct(a, b) + '%' } })
  ]);

  function stat(n, label, sub, bar) {
    return el('div', { class: 'stat' }, [
      el('div', { class: 'n', text: n }),
      el('div', { class: 'l', text: label }),
      sub ? el('div', { class: 's', text: sub }) : null,
      bar ? el('div', { style: { marginTop: '8px' } }, [bar]) : null
    ]);
  }

  const empty = (msg, extra) => el('div', { class: 'empty' }, [el('p', { text: msg }), extra || null]);

  /* Mastery ladder. Level 1 is a tick; level 2 is proof work actually done.
     Neither is awarded for opening anything, and the caption says which rung
     the learner is standing on rather than implying the whole ladder. */
  function ladder(done, proofDone, hasProof) {
    const names = ['Completed', 'Recognised', 'Recalled', 'Applied', 'Transferred'];
    const at = proofDone ? 2 : done ? 1 : 0;
    const caption = at === 2 ? '2 · proof worked through'
      : at === 1 ? '1 · completed'
      : '1 · not yet completed';
    const right = Store.level() === 2
      ? (hasProof === false ? 'no proof on this note'
        : at === 2 ? 'levels 3–5 need delayed evidence'
        : 'work the proof to reach level 2')
      : 'levels 2–5 open at Level 2';
    return el('div', {}, [
      el('div', { class: 'ladder' }, names.map((n, i) =>
        el('span', { class: i < at ? 'on' : '', title: n }))),
      el('div', { class: 'ladder-l' }, [
        el('span', { text: caption }),
        el('span', { text: right })
      ])
    ]);
  }

  /* The current level as a badge, and the switch that changes it. Level 2 is
     never entered by accident: it has to be unlocked first (Store.unlocked). */
  const levelBadge = () => el('span', {
    class: 'badge' + (Store.level() === 2 ? ' accent' : ''),
    text: 'Level ' + Store.level()
  });

  /* Which of a concept's prerequisites are not ticked yet. One definition,
     because the note view and the syllabus tree both offer the same cascade
     and must never disagree about what it would do. */
  const pendingPrereqs = id =>
    Pool.chain(id).filter(x => x.id !== id && !Store.isDone(x.id));

  /* An inline question with real buttons, used where window.confirm would
     lose the detail that makes the question answerable. */
  function ask(opts) {
    const host = el('div', { class: 'card tint ask', role: 'group',
      'aria-label': opts.title });
    DOM.add(host, [
      el('div', { class: 'kicker', text: opts.title }),
      opts.body ? el('div', { class: 'small', style: { margin: '6px 0 10px' } }, [opts.body]) : null,
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button',
          text: a.label, on: { click: a.onClick } })))
    ]);
    return host;
  }

  function mockBanner() {
    if (!Pool.isMock()) return null;
    return el('div', { class: 'banner' }, [
      el('span', { 'aria-hidden': 'true', text: '⚠' }),
      el('span', {}, [
        el('b', { text: 'Mock content. ' }),
        'These ten theorems and sixteen questions are placeholders written to test the study loop — ' +
        'not validated material, and not from any past paper. The real pool arrives through the ' +
        'data handoff.'
      ])
    ]);
  }

  /* Attempt-before-reveal gate. Nothing is revealed until the learner says
     they have tried, or does something that counts as trying. */
  function gate(opts) {
    const host = el('div', { class: 'gate' });
    const body = el('div', { class: 'stack', style: { gap: '12px' } }, [
      el('p', { class: 'small muted', style: { margin: 0 }, text: opts.hint }),
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button', text: a.label,
          on: { click: a.onClick } })))
    ]);
    host.appendChild(body);
    return host;
  }

  /* A titled block whose body is only built when it is opened. */
  function reveal(label, buildBody, opts) {
    const o = opts || {};
    const body = el('div', { class: 'b', hidden: true });
    const btn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false',
      text: o.openLabel || 'Show' });
    let built = false;
    btn.addEventListener('click', function () {
      const open = body.hidden;
      if (open && !built) { built = true; DOM.add(body, buildBody()); math(body); }
      body.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? (o.closeLabel || 'Hide') : (o.openLabel || 'Show');
    });
    const box = el('div', { class: 'reveal' }, [
      el('div', { class: 'h' }, [el('span', { text: label }), btn]), body
    ]);
    return box;
  }

  const typeBadge = q => el('span', {
    class: 'badge accent',
    text: q.type
  });

  function metaRow(q) {
    const bits = [q.marks + ' ' + DOM.plural(q.marks, 'mark')];
    bits.push(q.neg ? (q.negLabel || q.neg) + ' if wrong' : 'no negative marking');
    if (q.time) bits.push('about ' + Math.round(q.time / 30) / 2 + ' min');
    const row = el('div', { class: 'row' });
    bits.forEach(function (b, i) {
      if (i) row.appendChild(el('span', { class: 'count dot', 'aria-hidden': 'true', text: '·' }));
      row.appendChild(el('span', { class: 'count', text: b }));
    });
    return row;
  }

  const clock = ms => {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0');
  };

  return {
    title, crumb, prose, math, kindBadge, tierBadge, doneBadge, meter, stat, empty,
    ladder, levelBadge, ask, pendingPrereqs, mockBanner, gate, reveal, typeBadge, metaRow, clock
  };
})();


/* ── src/fig.library.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The figures.

   Each one exists because the picture carries something the prose struggles
   with. Two of them take a control, because the whole point of ε–δ and of
   uniform continuity is what happens when you MOVE the parameter.

   Mock note: FIGMAP attaches figures to the placeholder concept ids. Validated
   data can instead declare `figs: ['fig.eps-delta']` on the concept itself and
   this map becomes unnecessary.
   ══════════════════════════════════════════════════════════════════════════ */

const FIGLIB = {

  /* ── §2.3 supremum: the least ceiling, not an element ─────────────────── */
  'fig.sup-inf': {
    title: 'sup sits outside the set',
    caption: 'Dots are $1-1/n$. Every dot is below $1$, and nothing below $1$ bounds them all — ' +
      'so $\\sup S=1$ even though $1$ is never an element. The infimum $0$ <i>is</i> an element.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 120, xr: [-0.12, 1.42], yr: [0, 1], padT: 26, padB: 34 });
      p.add(Fig.svg('line', { class: 'axis', x1: p.X(-0.12), y1: p.Y(0.42),
        x2: p.X(1.42), y2: p.Y(0.42) }));

      for (let n = 1; n <= 9; n++) {
        const x = 1 - 1 / n;
        const d = p.dot(x, 0.42, '', 4);
        d.classList.add('fade-in');
        d.style.animationDelay = (n * 55) + 'ms';
      }
      p.dot(0, 0.42, 'good', 4.6);
      p.label(0, 0.16, 'inf S = 0 ∈ S', 'lbl');

      /* the open circle at the supremum */
      p.add(Fig.svg('circle', { cx: p.X(1), cy: p.Y(0.42), r: 5, class: 'pt open' }));
      p.line(1, 0.42, 1, 0.9, 'guide');
      p.label(1, 1.0, 'sup S = 1 ∉ S', 'lbl');

      /* upper bounds sliding down to the least one */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.35) - p.X(1)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(1), y1: p.Y(0.06), x2: p.X(1), y2: p.Y(0.78),
        class: 'hot' }));
      g.appendChild(Fig.svg('text', { x: p.X(1) + 6, y: p.Y(0.1), text: 'upper bounds →',
        'text-anchor': 'start' }));
      p.add(g);
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'Number line with the points 1 minus 1 over n approaching 1; 1 is marked as an open circle.');
    }
  },

  /* ── §2.3 completeness: the hole in ℚ ─────────────────────────────────── */
  'fig.gap': {
    title: 'the hole completeness fills',
    caption: 'Rationals close in on $\\sqrt3$ from both sides. In $\\mathbb{Q}$ there is nothing ' +
      'at the meeting point, so the set of rationals below it has no least upper bound there. ' +
      'In $\\mathbb{R}$ the point exists — that is the whole content of the axiom.',
    build(api) {
      const R = Math.sqrt(3);
      const p = Fig.plot({ w: 330, h: 125, xr: [1.6, 1.87], yr: [0, 1], padT: 24, padB: 36 });
      p.axes({ y0: 0.4, yAxis: false, ticks: [{ x: 1.65, t: '1.65' }, { x: 1.8, t: '1.80' }] });

      const left = [1.7, 1.73, 1.731, 1.7320];
      const right = [1.85, 1.79, 1.7325, 1.73206];
      left.forEach(function (x, i) {
        const d = p.dot(x, 0.4, '', 3.6);
        d.classList.add('fade-in'); d.style.animationDelay = (i * 160) + 'ms';
      });
      right.forEach(function (x, i) {
        const d = p.dot(x, 0.4, 'good', 3.6);
        d.classList.add('fade-in'); d.style.animationDelay = (i * 160 + 80) + 'ms';
      });

      p.add(Fig.svg('line', { x1: p.X(R), y1: p.Y(0.12), x2: p.X(R), y2: p.Y(0.82), class: 'hot' }));
      p.add(Fig.svg('circle', { cx: p.X(R), cy: p.Y(0.4), r: 5, class: 'pt open' }));
      p.label(R, 0.95, '√3 ∉ ℚ', 'lbl');
      p.label(1.69, 0.13, 'x² < 3', '', 'middle');
      p.label(1.80, 0.13, 'x² > 3', '', 'middle');
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'Rationals approaching the square root of three from both sides, with a gap marked at the limit.');
    }
  },

  /* ── §3.4 Bolzano–Weierstrass ─────────────────────────────────────────── */
  'fig.bw': {
    title: 'a convergent subsequence, extracted',
    caption: 'The sequence $x_n=(-1)^n\\left(1-\\frac1n\\right)$ never settles, but the ' +
      'even-indexed terms (green) march to $1$. Boundedness alone guarantees some such ' +
      'subsequence exists — never that the sequence itself converges.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 175, xr: [0, 22], yr: [-1.25, 1.25], padT: 18, padB: 26,
        padL: 26, padR: 14 });
      p.rect(0, -1, 22, 1, 'band');
      p.axes({ y0: 0, yAxis: false });
      p.line(0, 1, 22, 1, 'guide');
