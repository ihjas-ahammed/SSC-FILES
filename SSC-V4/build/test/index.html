      p.label(20.4, 1.12, 'limit 1', 'lbl', 'end');
      p.label(1.6, -1.16, '|xₙ| ≤ 1', '', 'start');

      for (let n = 1; n <= 20; n++) {
        const y = (n % 2 ? -1 : 1) * (1 - 1 / n);
        const even = n % 2 === 0;
        const d = p.dot(n, y, even ? 'good' : '', even ? 4.4 : 3.2);
        d.classList.add('fade-in');
        d.style.animationDelay = (n * 45) + 'ms';
      }
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'A bounded oscillating sequence with its even-indexed subsequence converging to one.');
    }
  },

  /* ── §5.1 ε–δ, interactive ────────────────────────────────────────────── */
  'fig.eps-delta': {
    title: 'ε is demanded, δ is your answer',
    interactive: true,
    caption: 'Drag ε. The orange band is the tolerance you must land inside; the blue strip is ' +
      'the δ that answers it for $f(x)=x^2$ at $c=1$. Continuity means you can always answer — ' +
      'and δ shrinks as ε does.',
    build(api) {
      const f = x => x * x, c = 1, fc = 1;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 2], yr: [0, 4], padT: 14, padB: 26,
        padL: 30, padR: 14 });

      const epsBand = p.rect(0, fc - 0.6, 2, fc + 0.6, 'band warm');
      const delBand = p.rect(c - 0.2, 0, c + 0.2, 4, 'band');
      p.axes({ ticks: [{ x: 1, t: 'c = 1' }, { x: 2, t: '2' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, fc, c, fc, 'guide');
      p.dot(c, fc, '', 4.4);
      const epsLbl = Fig.svg('text', { x: p.X(1.98), y: p.Y(fc) - 6, class: 'lbl',
        'text-anchor': 'end', text: 'ε' });
      const delLbl = Fig.svg('text', { x: p.X(c), y: p.Y(3.75), class: 'lbl',
        'text-anchor': 'middle', text: 'δ' });
      p.add(epsLbl, delLbl);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function deltaFor(eps) {
        const right = Math.sqrt(fc + eps) - c;
        const left = (fc - eps) > 0 ? c - Math.sqrt(fc - eps) : c;
        return Math.min(right, left);
      }
      function update(eps) {
        const d = deltaFor(eps);
        const lo = Math.max(0, fc - eps), hi = Math.min(4, fc + eps);
        epsBand.setAttribute('y', p.Y(hi));
        epsBand.setAttribute('height', Math.abs(p.Y(lo) - p.Y(hi)));
        delBand.setAttribute('x', p.X(c - d));
        delBand.setAttribute('width', p.X(c + d) - p.X(c - d));
        epsLbl.setAttribute('y', p.Y(hi) - 5);
      }
      api.control({
        min: 0.1, max: 1.6, step: 0.05, value: 0.6, label: 'epsilon',
        format: v => 'ε = ' + v.toFixed(2) + '  →  δ = ' + deltaFor(v).toFixed(3),
        onInput: update
      });
      update(0.6);
      p.svg.setAttribute('aria-label',
        'The curve y equals x squared with an epsilon band around f of c and the delta strip that answers it.');
    }
  },

  /* ── §5.1 sequential criterion ────────────────────────────────────────── */
  'fig.seq-crit': {
    title: 'sequences carry continuity',
    caption: 'Any $x_n\\to c$ on the axis is dragged by $f$ to $f(x_n)\\to f(c)$ on the other. ' +
      'Continuity is exactly the promise that <i>every</i> such input sequence behaves; one ' +
      'misbehaving sequence is all it takes to destroy it.',
    build(api) {
      const f = x => 0.6 + 1.1 * Math.sin(1.15 * x);
      const c = 1.6;
      const p = Fig.plot({ w: 330, h: 205, xr: [0, 2.4], yr: [0, 2], padT: 14, padB: 26,
        padL: 34, padR: 14 });
      p.axes({ ticks: [{ x: c, t: 'c' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, f(c), c, f(c), 'guide');
      p.line(c, 0, c, f(c), 'guide');
      p.dot(c, f(c), '', 4.6);
      p.label(0.22, f(c) + 0.14, 'f(c)', 'lbl', 'start');

      for (let n = 1; n <= 5; n++) {
        const x = c - 0.62 / n;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (250 + n * 200) + 'ms';
        g.appendChild(Fig.svg('circle', { cx: p.X(x), cy: p.Y(0), r: 3.2, class: 'pt' }));
        g.appendChild(Fig.svg('circle', { cx: p.X(0), cy: p.Y(f(x)), r: 3.2, class: 'pt good' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(0), x2: p.X(x), y2: p.Y(f(x)),
          class: 'guide' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(f(x)), x2: p.X(0), y2: p.Y(f(x)),
          class: 'guide' }));
        p.add(g);
      }
      p.label(1.02, 0.12, 'xₙ → c', 'lbl', 'middle');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Points approaching c on the x-axis with their images approaching f of c on the y-axis.');
    }
  },

  /* ── §5.3 max–min attained ────────────────────────────────────────────── */
  'fig.maxmin': {
    title: 'on [a,b] the extremes are reached',
    caption: 'Closed and bounded, plus continuity: the supremum and infimum of the range are ' +
      'not merely approached, they are <i>values</i> $f(x^*)$ and $f(x_*)$ at actual points of ' +
      'the interval.',
    build(api) {
      const f = x => 1.55 + 0.85 * Math.sin(3.1 * x) + 0.18 * x;
      const a = 0.25, b = 1.95;
      let xh = a, xl = a;
      for (let i = 0; i <= 400; i++) {
        const x = a + (b - a) * i / 400;
        if (f(x) > f(xh)) xh = x;
        if (f(x) < f(xl)) xl = x;
      }
      const p = Fig.plot({ w: 330, h: 200, xr: [0, 2.2], yr: [0, 3], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: a, t: 'a' }, { x: b, t: 'b' }] });
      const cur = p.path(p.curve(f, a, b), 'curve');
      [[xh, 'good'], [xl, 'bad']].forEach(function (pair, i) {
        const x = pair[0];
        p.line(0, f(x), x, f(x), 'guide');
        p.line(x, 0, x, f(x), 'guide');
        const d = p.dot(x, f(x), pair[1], 5);
        d.classList.add('fade-in');
        d.style.animationDelay = (700 + i * 240) + 'ms';
      });
      p.label(0.24, f(xh) + 0.17, 'max f(x*)', 'lbl', 'start');
      p.label(0.24, f(xl) - 0.28, 'min f(x⁎)', 'lbl', 'start');
      p.dot(a, f(a), '', 3.4);
      p.dot(b, f(b), '', 3.4);
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'A continuous curve on a closed interval with its maximum and minimum points marked.');
    }
  },

  /* ── §5.3 the same theorem with the hypothesis removed ────────────────── */
  'fig.no-max': {
    title: 'drop “closed” and the maximum goes',
    caption: '$f(x)=1/x$ on $(0,1]$ is continuous, attains its minimum at $x=1$, and has no ' +
      'maximum at all: $f(1/n)=n$. Nothing is contradicted — the theorem simply never applied.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 185, xr: [0, 1.2], yr: [0, 6], padT: 18, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.14 ? 1 / x : NaN), 0.14, 1.2), 'curve');
      p.dot(1, 1, 'good', 4.6);
      p.label(1.06, 1.2, 'min = 1', 'lbl', 'start');
      p.add(Fig.svg('circle', { cx: p.X(0.167), cy: p.Y(6), r: 4.4, class: 'pt open' }));

      const arrow = Fig.svg('g', { class: 'rise-y' });
      arrow.style.setProperty('--dy', '18px');
      arrow.appendChild(Fig.svg('path', { class: 'hot',
        d: 'M' + p.X(0.09) + ' ' + p.Y(2.2) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' M' + (p.X(0.09) - 4) + ' ' + (p.Y(5.4) + 6) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' L' + (p.X(0.09) + 4) + ' ' + (p.Y(5.4) + 6) }));
      p.add(arrow);
      p.label(0.33, 5.2, 'no maximum', 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'One over x on the half-open interval, escaping upward near zero with its minimum at x equals one.');
    }
  },

  /* ── §5.3 IVT, on the cubic the questions use ─────────────────────────── */
  'fig.ivt': {
    title: 'a sign change forces a crossing',
    caption: '$p(x)=x^3-3x+1$ has $p(0)=1>0$ and $p(1)=-1<0$, so the level $0$ is crossed ' +
      'somewhere inside. The theorem gives <i>at least one</i> $c$; that it is exactly one here ' +
      'comes from $p\' &lt; 0$ on $(0,1)$, not from the IVT.',
    build(api) {
      const p3 = x => x * x * x - 3 * x + 1;
      const root = 0.34729636;
      const p = Fig.plot({ w: 330, h: 195, xr: [-0.06, 1.12], yr: [-1.35, 1.35], padT: 16,
        padB: 26, padL: 30, padR: 16 });
      p.axes({ y0: 0, ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const cur = p.path(p.curve(p3, -0.06, 1.12), 'curve');
      p.dot(0, 1, 'good', 4.4);
      p.dot(1, -1, 'bad', 4.4);
      p.label(0.08, 1.16, 'p(0) = 1', 'lbl', 'start');
      p.label(0.94, -1.2, 'p(1) = −1', 'lbl', 'end');

      const sweep = Fig.svg('line', { x1: p.X(-0.06), y1: p.Y(0), x2: p.X(1.12), y2: p.Y(0),
        class: 'hot' });
      p.add(sweep);
      const rd = p.dot(root, 0, '', 5.2);
      rd.classList.add('fade-in');
      rd.style.animationDelay = '900ms';
      p.line(root, 0, root, -0.55, 'guide');
      p.label(root, -0.72, 'c ≈ 0.35', 'lbl');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.draw(sweep);
      p.svg.setAttribute('aria-label',
        'The cubic x cubed minus three x plus one crossing zero between zero and one.');
    }
  },

  /* ── §5.4 uniform continuity, interactive ─────────────────────────────── */
  'fig.unif': {
    title: 'one δ cannot serve the whole set',
    interactive: true,
    caption: 'Slide the δ-window along $f(x)=1/x$ on $(0,1]$. Its width never changes; the ' +
      'height of the image band does — without limit as you approach $0$. That is precisely ' +
      'the failure of uniform continuity.',
    build(api) {
      const f = x => 1 / x, d = 0.05;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 1.1], yr: [0, 12], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      const imgBand = p.rect(0, 1, 1.1, 2, 'band warm');
      const winBand = p.rect(0.5 - d, 0, 0.5 + d, 12, 'band');
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.083 ? f(x) : NaN), 0.083, 1.1), 'curve');
      const lo = p.dot(0.45, f(0.45), '', 3.8);
      const hi = p.dot(0.55, f(0.55), '', 3.8);
      const gap = Fig.svg('text', { class: 'lbl', 'text-anchor': 'start', text: '' });
      p.add(gap);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function update(u) {
        const a = Math.max(0.085, u - d), b = Math.min(1.1, u + d);
        const ya = f(b), yb = Math.min(12, f(a));
        winBand.setAttribute('x', p.X(a));
        winBand.setAttribute('width', p.X(b) - p.X(a));
        imgBand.setAttribute('y', p.Y(yb));
        imgBand.setAttribute('height', Math.abs(p.Y(ya) - p.Y(yb)));
        lo.setAttribute('cx', p.X(a)); lo.setAttribute('cy', p.Y(Math.min(12, f(a))));
        hi.setAttribute('cx', p.X(b)); hi.setAttribute('cy', p.Y(f(b)));
        gap.setAttribute('x', p.X(0.3));
        gap.setAttribute('y', p.Y(Math.min(11.4, yb)) - 6);
        gap.textContent = 'image height ≈ ' + (Math.min(12, f(a)) - f(b)).toFixed(2);
      }
      api.control({
        min: 0.1, max: 0.95, step: 0.01, value: 0.5, label: 'window position',
        format: v => 'window at x = ' + v.toFixed(2) + ',  width 2δ = ' + (2 * d).toFixed(2),
        onInput: update
      });
      update(0.5);
      p.svg.setAttribute('aria-label',
        'A fixed-width window sliding along one over x; the image band grows without bound near zero.');
    }
  },

  /* ── §5.4 why compactness rescues it ─────────────────────────────────── */
  'fig.heine': {
    title: 'on a closed interval there is a worst case',
    caption: 'Equal δ-windows along $\\sqrt{x}$ on $[0,1]$. The image bands differ, the worst ' +
      'one sits at $0$ — and because the interval is closed and bounded the worst one <i>exists</i>. ' +
      'Take δ for that window and it serves everywhere: continuity becomes uniform.',
    build(api) {
      const f = Math.sqrt;
      const p = Fig.plot({ w: 330, h: 190, xr: [0, 1.06], yr: [0, 1.15], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const w = 1 / 6;
      for (let i = 0; i < 6; i++) {
        const a = i * w, b = a + w;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (200 + i * 130) + 'ms';
        g.appendChild(Fig.svg('rect', {
          x: p.X(a), y: p.Y(f(b)), width: p.X(b) - p.X(a),
          height: Math.abs(p.Y(f(a)) - p.Y(f(b))),
          class: i === 0 ? 'band warm' : 'band good'
        }));
        g.appendChild(Fig.svg('line', { x1: p.X(a), y1: p.Y(0), x2: p.X(a), y2: p.Y(f(b)),
          class: 'guide' }));
        p.add(g);
      }
      const cur = p.path(p.curve(f, 0, 1.02), 'curve');
      p.label(0.2, 0.52, 'worst window', 'lbl', 'start');
      p.line(0.185, 0.5, 0.09, 0.42, 'guide');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Equal-width windows under the square-root curve, the tallest image band at zero.');
    }
  },

  /* ── §6.2 MVT, on the interval the questions use ─────────────────────── */
  'fig.mvt': {
    title: 'the tangent parallel to the chord',
    caption: 'For $f(x)=x^2$ on $[1,3]$ the chord has slope $\\frac{9-1}{3-1}=4$, and $f\'(c)=2c=4$ ' +
      'puts the parallel tangent at $c=2$. The theorem promises such a $c$ exists; finding it is ' +
      'just solving that equation.',
    build(api) {
      const f = x => x * x, a = 1, b = 3, c = 2;
      const p = Fig.plot({ w: 330, h: 205, xr: [0.6, 3.5], yr: [0, 11], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: 'a=1' }, { x: 2, t: 'c=2' }, { x: 3, t: 'b=3' }] });
      const cur = p.path(p.curve(f, 0.6, 3.5), 'curve');

      p.add(Fig.svg('line', { x1: p.X(a), y1: p.Y(f(a)), x2: p.X(b), y2: p.Y(f(b)), class: 'hot' }));
      p.label(1.35, 6.4, 'chord, slope 4', 'lbl', 'start');

      /* tangent y = 4x - 4, slid into place */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.1) - p.X(2)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(0.9), y1: p.Y(4 * 0.9 - 4),
        x2: p.X(3.2), y2: p.Y(4 * 3.2 - 4), class: 'curve', 'stroke-dasharray': '5 4' }));
      p.add(g);
      p.dot(a, f(a), '', 4); p.dot(b, f(b), '', 4);
      const cd = p.dot(c, f(c), 'good', 5.2);
      cd.classList.add('fade-in'); cd.style.animationDelay = '1.2s';
      p.label(2.42, 3.1, "f′(c) = 4", 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'The parabola x squared with the chord from one to three and the parallel tangent at c equals two.');
    }
  }
};

/* Concept → figures, while the pool is mock. Validated concepts should carry
   their own `figs: [...]` and this map can then be deleted. */
const FIGMAP = {
  'm.2.3.2': ['fig.sup-inf'],
  'm.2.3.6': ['fig.gap'],
  'm.3.4.8': ['fig.bw'],
  'm.5.1.1': ['fig.eps-delta'],
  'm.5.1.3': ['fig.seq-crit'],
  'm.5.3.4': ['fig.maxmin', 'fig.no-max'],
  'm.5.3.7': ['fig.ivt'],
  'm.5.4.1': ['fig.unif'],
  'm.5.4.3': ['fig.heine'],
  'm.6.2.4': ['fig.mvt']
};


/* ── src/comp.figure.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Figure engine.

   Figures are hand-drawn inline SVG, built from the mathematics rather than
   pasted in as images: they inherit the theme's colours, scale to any width,
   animate on entry, and a few of them take a control so the learner can move
   the parameter that matters (ε, or the window position).

   This file is the plumbing — coordinate mapping, the frame, the controls.
   The figures themselves live in fig.library.js.
   ══════════════════════════════════════════════════════════════════════════ */

const Fig = (function () {

  const el = DOM.el;
  const s = DOM.svg;

  /* A plot area inside a viewBox: maths coordinates in, pixels out. */
  function plot(opts) {
    const o = Object.assign({ w: 330, h: 190, pad: 20, xr: [0, 1], yr: [0, 1] }, opts);
    const l = o.padL == null ? o.pad : o.padL;
    const b = o.padB == null ? o.pad : o.padB;
    const t = o.padT == null ? o.pad : o.padT;
    const r = o.padR == null ? o.pad : o.padR;
    const X = x => l + (x - o.xr[0]) / (o.xr[1] - o.xr[0]) * (o.w - l - r);
    const Y = y => (o.h - b) - (y - o.yr[0]) / (o.yr[1] - o.yr[0]) * (o.h - t - b);

    /* sampled path of a function, clipped to the y range */
    function curve(fn, from, to, steps) {
      const n = steps || 90;
      const a = from == null ? o.xr[0] : from;
      const z = to == null ? o.xr[1] : to;
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = a + (z - a) * i / n;
        const y = fn(x);
        if (!isFinite(y) || y < o.yr[0] - 1e-9 || y > o.yr[1] + 1e-9) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1) + ' ';
        pen = true;
      }
      return d.trim();
    }

    const svg = s('svg', {
      viewBox: '0 0 ' + o.w + ' ' + o.h, role: 'img',
      preserveAspectRatio: 'xMidYMid meet'
    });

    return {
      svg: svg, X: X, Y: Y, curve: curve, box: o,
      add(...kids) { kids.forEach(k => k && svg.appendChild(k)); return this; },
      /* axes with optional tick labels */
      axes(opts2) {
        const a = opts2 || {};
        const y0 = a.y0 == null ? o.yr[0] : a.y0;
        this.add(s('line', { class: 'axis', x1: X(o.xr[0]), y1: Y(y0), x2: X(o.xr[1]), y2: Y(y0) }));
        if (a.yAxis !== false) {
          this.add(s('line', { class: 'axis', x1: X(a.x0 == null ? o.xr[0] : a.x0), y1: Y(o.yr[0]),
            x2: X(a.x0 == null ? o.xr[0] : a.x0), y2: Y(o.yr[1]) }));
        }
        (a.ticks || []).forEach(function (tk) {
          svg.appendChild(s('line', { class: 'axis', x1: X(tk.x), y1: Y(y0) - 3, x2: X(tk.x), y2: Y(y0) + 3 }));
          svg.appendChild(s('text', { x: X(tk.x), y: Y(y0) + 15, 'text-anchor': 'middle', text: tk.t }));
        });
        return this;
      },
      label(x, y, text, cls, anchor) {
        this.add(s('text', { x: X(x), y: Y(y), class: cls || '', text: text,
          'text-anchor': anchor || 'middle' }));
        return this;
      },
      dot(x, y, cls, r2) {
        const c = s('circle', { cx: X(x), cy: Y(y), r: r2 || 3.6, class: 'pt ' + (cls || '') });
        this.add(c);
        return c;
      },
      line(x1, y1, x2, y2, cls) {
        const n = s('line', { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), class: cls || 'guide' });
        this.add(n);
        return n;
      },
      rect(x1, y1, x2, y2, cls) {
        const n = s('rect', { x: Math.min(X(x1), X(x2)), y: Math.min(Y(y1), Y(y2)),
          width: Math.abs(X(x2) - X(x1)), height: Math.abs(Y(y2) - Y(y1)), class: cls || 'band' });
        this.add(n);
        return n;
      },
      path(d, cls) {
        const n = s('path', { d: d, class: cls || 'curve' });
        this.add(n);
        return n;
      },
      /* stroke-draw entrance for a path */
      draw(node) {
        if (DOM.reduced() || !node.getTotalLength) return node;
        try {
          const len = Math.ceil(node.getTotalLength());
          node.style.setProperty('--len', len);
          node.classList.add('draw');
        } catch (e) { /* not yet in the document — skip the flourish */ }
        return node;
      }
    };
  }

  /* The frame: title, the drawing, an optional control, a caption. */
  function frame(def, opts) {
    const host = el('figure', { class: 'fig', style: { margin: 0 } });
    const body = el('div', {});
    const ctl = el('div', {});

    host.appendChild(el('div', { class: 'fig-h' }, [
      el('span', { class: 'kicker', text: def.title }),
      def.interactive ? el('span', { class: 'badge accent', text: 'drag it' }) : null
    ]));
    host.appendChild(body);
    host.appendChild(ctl);
    if (def.caption) {
      host.appendChild(el('figcaption', { class: 'fig-cap', html: def.caption }));
    }

    const api = {
      body: body,
      /* a labelled range control; onInput gets the numeric value */
      control(spec) {
        const input = el('input', {
          type: 'range', min: spec.min, max: spec.max, step: spec.step,
          value: spec.value, 'aria-label': spec.label
        });
        const out = el('label', { text: spec.format(Number(spec.value)) });
        input.addEventListener('input', function () {
          const v = Number(input.value);
          out.textContent = spec.format(v);
          spec.onInput(v);
        });
        DOM.clear(ctl);
        ctl.appendChild(el('div', { class: 'fig-ctl' }, [input, out]));
        return input;
      }
    };

    def.build(api, opts || {});
    return host;
  }

  /* Mount every figure attached to a concept. Data may carry `figs: [id]`;
     the app's own map is the fallback while the pool is mock. */
  function forConcept(concept) {
    if (!concept) return [];
    const ids = (concept.figs && concept.figs.length)
      ? concept.figs
      : (FIGMAP[concept.id] || []);
    return ids.map(id => FIGLIB[id] ? { id: id, def: FIGLIB[id] } : null).filter(Boolean);
  }

  function mount(concept) {
    const figs = forConcept(concept);
    if (!figs.length) return null;
    return el('div', { class: 'stack', style: { gap: '12px' } },
      figs.map(f => frame(f.def)));
  }

  return { plot: plot, frame: frame, mount: mount, forConcept: forConcept, svg: s };
})();


/* ── src/comp.tree.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The tick tree.

   The syllabus is only ever one line tall until you open it. Course → module →
   section → concept, each row carrying a tick you can press and a ring showing
   how much of what is underneath is done. Expanding animates, and expanded
   content keeps the full width — the only indentation is a thin rail, so a
   deep tree never squeezes the text.

   Ticking a parent ticks everything under it; untick does the reverse. Parents
   show a mixed state when some of their children are done.
   ══════════════════════════════════════════════════════════════════════════ */

const Tree = (function () {

  const el = DOM.el;
  const OPEN_KEY = 'open';

  const openMap = () => Store.pref(OPEN_KEY, null);
  function setOpen(id, on) {
    const m = openMap() || {};
    if (on) m[id] = 1; else delete m[id];
    Store.setPref(OPEN_KEY, m);
  }
  const isOpen = id => {
    const m = openMap();
    return !!(m && m[id]);
  };

  /* ── pieces ───────────────────────────────────────────────────────────── */

  function ring(done, total) {
    const pc = DOM.pct(done, total);
    const node = el('span', {
      class: 'ring' + (total && done === total ? ' done' : ''),
      role: 'img', 'aria-label': done + ' of ' + total + ' completed'
    }, [el('i', { text: total ? done + '/' + total : '—' })]);
    /* set after mount so the conic gradient animates from 0 */
    window.requestAnimationFrame(() => node.style.setProperty('--p', pc));
    return node;
  }

  function tickButton(state, label, onPress) {
    const btn = el('button', {
      class: 'tick', type: 'button', role: 'checkbox',
      'aria-checked': state, 'aria-label': label
    }, [el('i', { 'aria-hidden': 'true', text: state === 'mixed' ? '–' : '✓' })]);
    btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); onPress(); });
    return btn;
  }

  function accordion(id, children) {
    const inner = el('div', { class: 'acc-in' }, [el('div', { class: 'acc-pad' }, children)]);
    const acc = el('div', { class: 'acc' + (isOpen(id) ? ' open' : ''), id: 'acc-' + id }, [inner]);
    return acc;
  }

  function toggler(acc, id, kids) {
    const btn = el('button', {
      class: 'tlabel', type: 'button',
      'aria-expanded': String(isOpen(id)), 'aria-controls': 'acc-' + id
    }, kids);
    btn.addEventListener('click', function () {
      const open = !acc.classList.contains('open');
      acc.classList.toggle('open', open);
      btn.setAttribute('aria-expanded', String(open));
      setOpen(id, open);
    });
    return btn;
  }

  /* ── levels ───────────────────────────────────────────────────────────── */

  /* The same offer the note view makes, in the form a list row can carry:
     ticking a result usually means its groundwork is already behind you, but
     "usually" is not "always", so it is asked rather than assumed. */
  function offerCascade(c) {
    const pending = UI.pendingPrereqs(c.id);
    if (!pending.length) return;
    const names = pending.slice(0, 5).map(x => '· ' + x.title).join('\n') +
      (pending.length > 5 ? '\n· and ' + (pending.length - 5) + ' more' : '');
    const ask = pending.length + ' ' + DOM.plural(pending.length, 'prerequisite') +
      ' of "' + c.title + '" ' + DOM.plural(pending.length, 'is', 'are') +
      ' not ticked yet:\n\n' + names + '\n\nTick them as completed too?';
    if (!window.confirm(ask)) return;
    const hit = Store.setDoneMany(pending.map(x => x.id), true);
    DOM.announce('Ticked ' + hit.length + ' ' + DOM.plural(hit.length, 'prerequisite') + '.');
  }

  function conceptRow(c, repaint) {
    const done = Store.isDone(c.id);
    const row = el('div', { class: 'crow' + (done ? ' done' : '') }, [
      tickButton(String(done), (done ? 'Unmark' : 'Mark') + ' "' + c.title + '" completed',
        function () {
          const on = !Store.isDone(c.id);
          Store.setDone(c.id, on);
          if (on) offerCascade(c);
          repaint();
        }),
      el('a', { href: Router.href('note/' + c.id) }, [
        el('span', { class: 'tt' }, [
          el('b', { text: c.title }),
          el('span', { text: c.kind + ' · ' + c.oneLine })
        ]),
        DOM.icon('chev', 18, 'chev')
      ])
    ]);
    return row;
  }

  function sectionNode(s, repaint) {
    const ids = s.concepts.map(c => c.id);
    const done = ids.filter(Store.isDone).length;
    const state = !ids.length ? 'false' : done === ids.length ? 'true' : done ? 'mixed' : 'false';
    const nid = 'sec-' + s.sec;

    const acc = accordion(nid, s.concepts.length
      ? [el('div', { class: 'stack', style: { gap: '6px' } },
          s.concepts.map(c => conceptRow(c, repaint)))]
      : [el('p', { class: 'small muted', style: { margin: '4px 2px' },
          text: 'No concepts loaded for this section yet.' })]);

    const node = el('div', { class: 'tnode sub sec' }, [
      el('div', { class: 'trow' }, [
        tickButton(state, (done === ids.length ? 'Unmark' : 'Mark') + ' all of §' + s.sec,
          function () {
            const all = done === ids.length;
            Store.setDoneMany(ids, !all);
            DOM.announce(all ? 'Section cleared.' : 'Section ticked — ' + ids.length + ' notes.');
            repaint();
          }),
        toggler(acc, nid, [
          el('span', { class: 'tt' }, [
            el('b', { text: '§' + s.sec + '  ' + s.title }),
            el('span', { text: s.concepts.length + ' ' + DOM.plural(s.concepts.length, 'concept') })
          ]),
          ring(done, ids.length),
          DOM.icon('chev', 20, 'chev')
        ])
      ]),
      acc
    ]);
    return node;
  }

  function moduleNode(course, mod, repaint) {
    const secs = Pool.sections(course.id).filter(s => (mod.secs || []).indexOf(s.sec) >= 0);
    const ids = secs.reduce((acc, s) => acc.concat(s.concepts.map(c => c.id)), []);
    const done = ids.filter(Store.isDone).length;
    const state = !ids.length ? 'false' : done === ids.length ? 'true' : done ? 'mixed' : 'false';
    const nid = 'mod-' + mod.id;

    if (mod.pending) return pendingNode(mod);

    const acc = accordion(nid, [el('div', {}, secs.map(s => sectionNode(s, repaint)))]);
    const node = el('div', { class: 'tnode' }, [
      el('div', { class: 'trow' }, [
        tickButton(state, (done === ids.length ? 'Unmark' : 'Mark') + ' all of module ' + mod.n,
          function () {
            const all = done === ids.length;
            Store.setDoneMany(ids, !all);
            DOM.announce(all ? 'Module cleared.' : 'Module ticked — ' + ids.length + ' notes.');
            repaint();
          }),
        toggler(acc, nid, [
          el('span', { class: 'tt' }, [
            el('b', { text: 'Module ' + mod.n + ' · ' + mod.title }),
            el('span', { text: (mod.marks ? mod.marks + ' marks · ' : '') +
              secs.length + ' ' + DOM.plural(secs.length, 'section') })
          ]),
          ring(done, ids.length),
          DOM.icon('chev', 20, 'chev')
        ])
      ]),
      acc
    ]);
    return node;
  }

  function pendingNode(mod) {
    const nid = 'pend-' + mod.id;
    const builds = (mod.builds || []).map(function (id) {
      const c = Pool.concept(id);
      return c ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
        : el('span', { class: 'chip ghost', text: id });
    });
    const acc = accordion(nid, [el('div', { style: { padding: '0 2px' } }, [
      mod.why ? el('p', { class: 'small muted', style: { margin: '2px 0 8px' }, text: mod.why }) : null,
      builds.length ? el('div', {}, [
        el('div', { class: 'kicker', style: { marginBottom: '6px' }, text: 'Will build on' }),
        el('div', { class: 'row' }, builds)
      ]) : null
    ])]);
    const node = el('div', { class: 'tnode sub sec' }, [
      el('div', { class: 'trow' }, [
        el('span', { class: 'tick', 'aria-hidden': 'true' },
          [el('i', { style: { borderStyle: 'dashed', color: 'transparent' }, text: '✓' })]),
        toggler(acc, nid, [
          el('span', { class: 'tt' }, [
            el('b', { text: mod.n + ' · ' + mod.title }),
            el('span', { text: 'content arrives at Level 3' })
          ]),
          el('span', { class: 'badge warn', text: 'pending' }),
          DOM.icon('chev', 20, 'chev')
        ])
      ]),
      acc
    ]);
    return node;
  }

  /* A whole course as one collapsed row — the top level of the one-page tree. */
  function courseNode(course, repaint) {
    const ids = Pool.ids.concepts(course.id);
    const done = ids.filter(Store.isDone).length;
    const state = !ids.length ? 'false' : done === ids.length ? 'true' : done ? 'mixed' : 'false';
    const nid = 'course-' + course.id;

    const acc = accordion(nid, [el('div', { class: 'rail' },
      (course.modules || []).map(mod => moduleNode(course, mod, repaint)))]);

    return el('div', { class: 'tnode' }, [
      el('div', { class: 'trow' }, [
        course.pending
          ? el('span', { class: 'tick', 'aria-hidden': 'true' },
              [el('i', { style: { borderStyle: 'dashed', color: 'transparent' }, text: '✓' })])
          : tickButton(state, (done === ids.length ? 'Unmark' : 'Mark') + ' all of ' + course.title,
              function () {
                const all = done === ids.length;
                Store.setDoneMany(ids, !all);
                DOM.announce(all ? 'Course cleared.' : 'Course ticked — ' + ids.length + ' notes.');
                repaint();
              }),
        toggler(acc, nid, [
          el('span', { class: 'tt' }, [
            el('b', { text: course.title }),
            el('span', { text: course.pending ? course.blurb : course.code + ' · ' + course.blurb })
          ]),
          course.pending
            ? el('span', { class: 'badge warn', text: 'level 3' })
            : ring(done, ids.length),
          DOM.icon('chev', 20, 'chev')
        ])
      ]),
      acc
    ]);
  }

  /* ── public: the whole syllabus as one page of dropdowns ──────────────── */
  function mountAll(host, courses) {
    function repaint() {
      const scroll = window.scrollY;
      DOM.clear(host);
      host.appendChild(el('div', { class: 'tree' },
        courses.map(course => courseNode(course, repaint))));
      window.scrollTo(0, scroll);
    }
    repaint();
    return host;
  }

  /* ── public: one course's tree, repainting in place ───────────────────── */
  function mount(host, course) {
    function repaint() {
      const scroll = window.scrollY;
      DOM.clear(host);
      host.appendChild(el('div', { class: 'tree' },
        (course.modules || []).map(mod => moduleNode(course, mod, repaint))));
      window.scrollTo(0, scroll);
    }
    repaint();
    return host;
  }

  /* First visit: open the first course, module and section that still have
     work left, so the tree opens somewhere useful rather than flat or sprawled. */
  function seedOpen(course) {
    if (openMap()) return;
    const m = {};
    if (course) {
      m['course-' + course.id] = 1;
      const mod = (course.modules || []).filter(x => !x.pending)[0];
      if (mod) {
        m['mod-' + mod.id] = 1;
        const sec = Pool.sections(course.id)
          .filter(s => (mod.secs || []).indexOf(s.sec) >= 0)
          .filter(s => s.concepts.some(c => !Store.isDone(c.id)))[0];
        if (sec) m['sec-' + sec.sec] = 1;
      }
    }
    Store.setPref(OPEN_KEY, m);
  }

  /* Open the path down to one concept, so arriving from a link lands with the
     surrounding syllabus already unfolded. */
  function revealPath(conceptId) {
    const c = Pool.concept(conceptId);
    if (!c) return;
    const course = Pool.courseOfSec(c.sec), mod = Pool.moduleOfSec(c.sec);
    const m = openMap() || {};
    if (course) m['course-' + course.id] = 1;
    if (mod) m['mod-' + mod.id] = 1;
    m['sec-' + c.sec] = 1;
    Store.setPref(OPEN_KEY, m);
  }

  return { mount, mountAll, seedOpen, revealPath };
})();


/* ── src/comp.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The writing workspace — a live markdown editor, one line at a time.

   The old workspace was a textarea with the rendering underneath and a sheet
   of LaTeX keys at the bottom. Two things were wrong with it on a phone: the
   key sheet covered the input it was meant to serve, and the rendering sat so
   far below a growing block of source that you stopped looking at it.

   So the shape is inverted. You write ONE line at a time, and that line's
   rendering sits directly ABOVE the input — where your eyes already are.
   Press Enter and the line settles into the document above; a fresh input
   appears beneath it, with its own output right above it again. The page
   fills downward with rendered mathematics and the caret is always at the
   bottom of it. Tap any settled line to reopen it.

   Commands are offered as completions rather than as a palette (core.latex.js):
   type a backslash and the matches appear in a strip immediately under the
   input, thumb-high. When nothing is being typed the strip shows the commands
   this theorem actually uses, so discovery still works without knowing how to
   spell anything.

   Still deliberately NOT a checker: it verifies that what you wrote renders,
   and says so out loud. Whether the mathematics is right stays your call.
   ══════════════════════════════════════════════════════════════════════════ */

const WriteBox = (function () {

  const el = DOM.el;

  function mount(host, opts) {
    const o = opts || {};
    const concept = o.concept || null;
    const uid = 'w' + Math.random().toString(36).slice(2, 8);

    /* A line with no $ in a maths-first box is bare LaTeX, rendered as display
       maths. One rule, stated in the hint, so nothing about it is a surprise. */
    const mathFirst = o.mathFirst !== false;

    let firstInputFired = false;
    let lines = [''];
    let active = 0;

    const stored = (o.value != null ? o.value : (concept ? Store.draft(concept.id) : '')) || '';
    if (stored) { lines = stored.split('\n'); active = lines.length - 1; }

    /* ── chrome ────────────────────────────────────────────────────────── */
    const doc = el('div', { class: 'wdoc', id: uid + '-doc' });
    const strip = el('div', { class: 'wstrip', role: 'listbox',
      'aria-label': 'LaTeX command completions' });
    const errBox = el('div', { hidden: true });
    const saveNote = el('span', { class: 'small muted', text: '' });

    const hint = el('p', {
      class: 'small muted', id: uid + '-hint', style: { margin: '6px 0 0' },
      text: (mathFirst
        ? 'One line at a time. A line with no $ is typeset as display maths; use $…$ to mix maths into words. '
        : 'One line at a time. Markdown, with maths written as $…$ and $$…$$. ') +
        'Enter starts the next line, and a backslash brings up the commands.'
    });

    /* the live input; one line, always the one you are writing */
    const field = el('input', {
      class: 'wfield', type: 'text', id: uid, spellcheck: 'false',
      autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off',
      'aria-describedby': uid + '-hint',
      placeholder: o.placeholder || (mathFirst
        ? '\\forall \\varepsilon > 0 \\; \\exists \\delta > 0 \\ldots'
        : 'Write a line — **bold**, a list, or $x^2$…')
    });

    const newlineBtn = el('button', { class: 'wkey', type: 'button',
      title: 'Start the next line (Enter)', 'aria-label': 'Start the next line' },
      [el('span', { text: '↵' })]);

    const mathBtn = el('button', { class: 'wkey', type: 'button',
      title: 'Wrap this line in display maths', 'aria-label': 'Wrap this line in display maths' },
      [el('span', { text: 'Σ' })]);

    /* ── rendering one line ────────────────────────────────────────────── */

    /* Returns a promise resolving {ok, error, hint} so the active line can
       report, and settled lines can stay quiet. */
    function paint(target, src) {
      const text = String(src == null ? '' : src);

      if (!text.trim()) {
        DOM.clear(target);
        target.appendChild(el('div', { class: 'ph',
          text: target.dataset.live ? 'This line renders here as you type.' : ' ' }));
        return Promise.resolve({ ok: true, empty: true });
      }

      if (mathFirst && !Markdown.hasMath(text)) {
        return Tex.renderFragment(target, text, { display: true });
      }

      DOM.clear(target);
      target.appendChild(el('div', { class: 'prose tight', html: Markdown.line(text) }));
      return Tex.typeset(target).then(function () {
        const bad = target.querySelector('mjx-merror, [data-mjx-error]');
        if (!bad) return { ok: true };
        return { ok: false,
          error: bad.getAttribute('data-mjx-error') || bad.textContent || 'MathJax could not parse the maths on this line.' };
      });
    }

    function showProblem(res) {
      if (!res || res.ok === true && !res.hint) { errBox.hidden = true; DOM.clear(errBox); return; }
      if (res.ok && res.hint) {
        DOM.clear(errBox);
        errBox.appendChild(el('div', { class: 'tex-err' }, [
          el('span', { 'aria-hidden': 'true', text: 'ⓘ' }), el('span', { text: res.hint })
        ]));
        errBox.hidden = false;
        return;
      }
      if (res.ok) { errBox.hidden = true; DOM.clear(errBox); return; }
      DOM.clear(errBox);
      errBox.appendChild(el('div', { class: 'tex-err' }, [
        el('span', { 'aria-hidden': 'true', text: '⚠' }),
        el('span', {}, [
          el('b', { text: 'This line does not render yet. ' }),
          el('span', { text: res.error || 'Check for an unmatched { or }.' })
        ])
      ]));
      errBox.hidden = false;
    }

    /* ── the document ──────────────────────────────────────────────────── */

    let liveOut = null;          /* the output frame above the active input */

    /* Settled lines are re-rendered on every rebuild, and MathJax is the most
       expensive thing in the app. Their output only depends on their source,
       so keep the markup by source text and reuse it. */
    const cache = {};

    function build() {
      DOM.clear(doc);
      liveOut = null;

      lines.forEach(function (text, i) {
        const out = el('div', { class: 'wout' });
        const row = el('div', { class: 'wline' + (i === active ? ' live' : '') }, [
          el('span', { class: 'wnum', 'aria-hidden': 'true', text: String(i + 1) }),
          out
        ]);

        if (i === active) {
          out.dataset.live = '1';
          liveOut = out;
          doc.appendChild(row);
          doc.appendChild(el('div', { class: 'winput' }, [
            el('span', { class: 'wcaret', 'aria-hidden': 'true', text: '›' }),
            field, mathBtn, newlineBtn
          ]));
          field.value = text;
          paint(out, text).then(showProblem);
        } else {
          /* a settled line reopens on tap — that is the only way back */
          row.setAttribute('tabindex', '0');
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', 'Edit line ' + (i + 1));
          const open = function (e) {
            if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            focusLine(i, 'end');
          };
          row.addEventListener('click', open);
          row.addEventListener('keydown', open);
          doc.appendChild(row);
          if (cache[text] != null) out.innerHTML = cache[text];
          else paint(out, text).then(function () { cache[text] = out.innerHTML; });
        }
      });
    }

    const liveRender = DOM.debounce(function () {
      if (liveOut) paint(liveOut, field.value).then(showProblem);
    }, 200);

    const persist = DOM.debounce(function () {
      if (!concept) return;
      Store.saveDraft(concept.id, value());
      saveNote.textContent = value().trim() ? 'Draft saved' : '';
    }, 700);

    function commitField() { lines[active] = field.value; }

    function focusLine(i, caret) {
      commitField();
      active = Math.max(0, Math.min(lines.length - 1, i));
      build();
      refreshStrip();
      /* synchronously: a requestAnimationFrame here leaves the user-gesture
         context, and iOS then refuses to bring the keyboard back up */
      field.focus();
      const at = caret === 'end' ? field.value.length : (caret || 0);
      try { field.setSelectionRange(at, at); } catch (e) { /* not focusable yet */ }
    }

    /* ── completions ───────────────────────────────────────────────────── */
    let matches = [];
    let picked = 0;

    function refreshStrip() {
      const caret = field.selectionStart == null ? field.value.length : field.selectionStart;
      const tok = Latex.tokenAt(field.value, caret);
      matches = tok ? Latex.complete(tok.word, concept, 12) : Latex.suggestions(concept, 14);
      picked = 0;

      DOM.clear(strip);
      strip.appendChild(el('span', { class: 'wstrip-l', 'aria-hidden': 'true',
        text: tok ? (tok.text || '\\') : 'commands' }));

      matches.forEach(function (k, i) {
        strip.appendChild(el('button', {
          class: 'wsug' + (i === picked && tok ? ' on' : ''),
          type: 'button', role: 'option', 'aria-selected': String(i === picked && !!tok),
          title: '\\' + k.cmd + (k.desc ? ' — ' + k.desc : ''),
          on: { click: function () { Latex.accept(field, k); refreshStrip(); } }
        }, [
          el('span', { class: 's', text: k.show }),
          el('span', { class: 'c', text: '\\' + k.cmd })
        ]));
      });

      if (!matches.length) {
        strip.appendChild(el('span', { class: 'small muted',
          text: 'no command matches that spelling' }));
      }
    }

    /* ── keys ──────────────────────────────────────────────────────────── */
    field.addEventListener('input', function () {
      liveRender();
      commitField();
      persist();
      refreshStrip();
      if (!firstInputFired && field.value.trim()) {
        firstInputFired = true;
        if (o.onFirstInput) o.onFirstInput();
      }
    });

    field.addEventListener('keydown', function (e) {
      const caret = field.selectionStart == null ? 0 : field.selectionStart;
      const len = field.value.length;

      if (e.key === 'Tab' && matches.length) {
        const tok = Latex.tokenAt(field.value, caret);
        if (tok) {
          e.preventDefault();
          Latex.accept(field, matches[picked] || matches[0]);
          refreshStrip();
          return;
        }
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        newLine();
        return;
      }

      if (e.key === 'Backspace' && caret === 0 && field.selectionEnd === 0 && active > 0) {
        e.preventDefault();
        commitField();
        const carry = lines[active];
        const prevLen = lines[active - 1].length;
        lines[active - 1] += carry;
        lines.splice(active, 1);
        focusLine(active - 1, prevLen);
        persist();
        return;
      }

      if (e.key === 'ArrowUp' && caret === 0 && active > 0) {
        e.preventDefault();
        focusLine(active - 1, 'end');
        return;
      }

      if (e.key === 'ArrowDown' && caret === len && active < lines.length - 1) {
        e.preventDefault();
        focusLine(active + 1, 'end');
      }
    });

    field.addEventListener('click', refreshStrip);
    field.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') refreshStrip();
    });

    function newLine() {
      commitField();
      /* Enter on the last line when it is empty means "done", not "another
         blank line" — otherwise the document grows a tail of empties. */
      if (active === lines.length - 1 && !lines[active].trim() && lines.length > 1) {
        field.blur();
        return;
      }
      lines.splice(active + 1, 0, '');
      focusLine(active + 1, 0);
      persist();
    }

    newlineBtn.addEventListener('click', newLine);

    mathBtn.addEventListener('click', function () {
      const t = field.value.trim();
      const wrapped = /^\$\$[\s\S]*\$\$$/.test(t);
      field.value = wrapped ? t.replace(/^\$\$\s*|\s*\$\$$/g, '') : '$$ ' + t + ' $$';
      commitField();
      field.dispatchEvent(new Event('input', { bubbles: true }));
      field.focus();
    });

    /* ── assemble ──────────────────────────────────────────────────────── */
    const value = () => lines.join('\n');

    const box = el('div', { class: 'stack wbox', style: { gap: '10px' } }, [
      el('div', { class: 'spread' }, [
        el('label', { class: 'kicker', for: uid,
          text: o.label || 'Write it — one line at a time' }),
        saveNote
      ]),
      doc,
      strip,
      errBox,
      hint,
      el('p', {
        class: 'small muted', style: { margin: 0 },
        text: 'This checks only that what you wrote renders — not whether the mathematics is correct. That judgement stays yours.'
      })
    ]);
    host.appendChild(box);

    build();
    refreshStrip();

    return {
      value: value,
      focus: () => field.focus(),
      hasContent: () => !!value().trim(),
      node: box
    };
  }

  return { mount };
})();


/* ── src/view.home.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Today — what to do next, and what the app actually knows about you.

   The tiles keep completion, proof work and recall apart on purpose: finishing
   a note is Level 1 "completed" and says nothing about recall, so the numbers
   are never merged into one flattering percentage.

   This screen also owns the level switch. The app opens at Level 1 for
   everyone and stays there until Level 2 is unlocked — by finishing a whole
   course at Level 1, or deliberately, here in settings. Nothing promotes a
   learner silently.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewHome = (function () {

  const el = DOM.el;

  function nextUndone() {
    return Pool.concepts().filter(c => !Store.isDone(c.id))[0] || null;
  }
  function nextCard() {
    return Pool.deck().filter(c => !(Store.card(c.id) || {}).first)[0] || null;
  }
  function nextQuestion() {
    return Pool.objective().filter(q => !(Store.omr(q.id) || {}).first)[0] || null;
  }
  function nextProof() {
    return Pool.concepts().filter(c => c.proof && !Store.isProofDone(c.id))[0] || null;
  }

  /* A course finished at Level 1 is the earned route into Level 2. It has to
     be a real course with real content — a `pending` course, or one with no
     concepts loaded, must never count as "finished". */
  function finishedCourse() {
    return Pool.courses().filter(function (course) {
      if (course.pending) return false;
      const ids = Pool.ids.concepts(course.id);
      return ids.length > 0 && ids.every(Store.isDone);
    })[0] || null;
  }

  function step(n, label, detail, href, ready) {
    return el('a', { class: 'item', href: Router.href(href) }, [
      el('span', { class: 'ix' + (ready ? '' : ' ok'), text: ready ? String(n) : '✓' }),
      el('span', { class: 'tt' }, [
        el('b', { text: label }),
        el('span', { text: detail })
      ]),
      el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
    ]);
  }

  function courseRow(course) {
    const ids = Pool.ids.concepts(course.id);
    const done = ids.filter(Store.isDone).length;
    const pc = DOM.pct(done, ids.length);
    const ring = el('span', {
      class: 'ring' + (ids.length && done === ids.length ? ' done' : ''),
      role: 'img', 'aria-label': done + ' of ' + ids.length + ' ticked'
    }, [el('i', { text: ids.length ? done + '/' + ids.length : '—' })]);
    window.requestAnimationFrame(() => ring.style.setProperty('--p', pc));

    const proofIds = Pool.ids.proofs(course.id);
    const proofsDone = proofIds.filter(Store.isProofDone).length;

    return el('a', { class: 'item', href: Router.href('study/' + course.id) }, [
      course.pending ? el('span', { class: 'ix', text: '·' }) : ring,
      el('span', { class: 'tt' }, [
        el('b', { text: course.title }),
        el('span', { text: course.pending ? 'content arrives at Level 3'
          : (Store.level() === 2 && proofIds.length)
            ? course.blurb + ' · ' + proofsDone + '/' + proofIds.length + ' proofs worked'
            : course.blurb })
      ]),
      course.pending
        ? el('span', { class: 'badge warn', text: 'level 3' })
        : el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
    ]);
  }

  /* ── the level switch ─────────────────────────────────────────────────── */
  function levelCard() {
    const host = el('div', { class: 'card glass' });
    const body = el('div', {});

    function paint() {
      DOM.clear(body);
      const at = Store.level();
      const open = Store.unlocked();
      const earned = finishedCourse();

      const switcher = el('div', { class: 'row', style: { marginTop: '10px' } },
        [1, 2].map(function (n) {
          const can = n === 1 || open;
          const b = el('button', {
            class: 'chip', type: 'button', 'aria-pressed': String(at === n),
            disabled: !can, text: 'Level ' + n
          });
          b.addEventListener('click', function () {
            Store.setLevel(n);
            DOM.announce('Switched to Level ' + Store.level() + '.');
            Router.reload();
          });
          return b;
        }));

      DOM.add(body, [
        el('p', { class: 'small muted', style: { margin: '4px 0 0' },
          text: at === 2
            ? 'Level 2 adds proof work: mark a proof as worked through and it counts, per proof, towards the second rung.'
            : 'Level 1 tracks what you have encountered and how your first attempts went. Level 2 adds proof work.' }),
        switcher
      ]);

      if (!open) {
        /* boot.js has already granted the unlock if a course is finished, so
           reaching here means it has not been earned — the honest offer is to
           say so and let the learner take it anyway. */
        DOM.add(body, [
          el('p', { class: 'small muted', style: { margin: '10px 0 0' },
            text: 'Level 2 unlocks by itself when a whole course is ticked at Level 1. '
              + 'You can also turn it on now if you would rather not wait.' }),
          el('div', { class: 'btn-row', style: { marginTop: '10px' } }, [
            el('button', {
              class: 'btn', type: 'button', text: 'Turn on Level 2 anyway',
              on: { click: function () {
                Store.unlock(true);
                Store.setLevel(2);
                DOM.announce('Level 2 unlocked.');
                Router.reload();
              } }
            })
          ])
        ]);
      } else {
        DOM.add(body, [
          earned && at === 1 ? el('p', { class: 'small muted', style: { margin: '10px 0 0' },
            text: 'You finished ' + earned.title + ' at Level 1, so Level 2 is open. '
              + 'Switching is still yours to make.' }) : null,
          el('div', { class: 'btn-row', style: { marginTop: '10px' } }, [
            el('button', {
              class: 'chip', type: 'button', text: 'Lock Level 2 again',
              on: { click: function () {
                Store.unlock(false);
                DOM.announce('Back to Level 1. Nothing you recorded was removed.');
                Router.reload();
              } }
            })
          ])
        ]);
      }
    }

    DOM.add(host, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Mastery level' }),
        UI.levelBadge()
      ]),
      body
    ]);
    paint();
    return host;
  }

  /* ── sync ─────────────────────────────────────────────────────────────── */
  function syncCard() {
    const id = Sync.identity();
    const host = el('div', { class: 'card tint' });

    const nameIn = el('input', { class: 'tin', type: 'text', id: 'sync-name',
      placeholder: 'Name', autocomplete: 'name', spellcheck: 'false' });
    const rollIn = el('input', { class: 'tin', type: 'text', id: 'sync-roll',
      placeholder: 'Roll number', autocomplete: 'off', spellcheck: 'false' });
    nameIn.value = id.name;
    rollIn.value = id.roll;

    const state = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const btnRow = el('div', { class: 'btn-row', style: { marginTop: '10px' } });

    function paint(last) {
      const on = Sync.on();
      DOM.clear(btnRow);
      DOM.add(btnRow, [
        el('button', {
          class: 'btn primary', type: 'button', text: on ? 'Sync now' : 'Connect',
          on: { click: function () {
            if (on) Sync.now({}).then(r => paint(r && { ok: r.ok, msg: r.msg }));
            else Sync.connect(nameIn.value, rollIn.value).then(function (r) {
              paint(r && { ok: r.ok, msg: r.msg });
              if (r && r.ok) Router.reload();
            });
          } }
        }),
        on ? el('button', {
          class: 'btn', type: 'button', text: 'Disconnect',
          on: { click: function () { Sync.disconnect(); Router.reload(); } }
        }) : null
      ]);

      const s = Sync.status();
      state.textContent = last && last.msg ? last.msg
        : on ? 'Connected as ' + s.key + '. Progress merges across every device using this name and roll number.'
        : 'Enter the same name and roll number on another device and progress follows you. '
          + 'This is a pass key, not a password — anyone who knows both can read this record.';
    }

    Sync.watch(function (last) { paint(last); });
    paint(Sync.status().last);

    DOM.add(host, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Sync across devices' }),
        el('span', { class: 'badge' + (Sync.on() ? ' ok' : ''),
          text: Sync.on() ? 'connected' : 'this device only' })
      ]),
      el('div', { class: 'row', style: { marginTop: '10px', gap: '8px' } }, [nameIn, rollIn]),
      btnRow,
      state
    ]);
    return host;
  }

  /* ── device settings ──────────────────────────────────────────────────── */
  function settings() {
    const themeBtn = el('button', { class: 'chip', type: 'button' });
    function paint() { themeBtn.textContent = 'Theme: ' + Store.pref('theme', 'auto'); }
    themeBtn.addEventListener('click', function () {
      const order = ['auto', 'light', 'dark'];
      const next = order[(order.indexOf(Store.pref('theme', 'auto')) + 1) % 3];
      Store.setPref('theme', next);
      Theme.apply();
      paint();
    });
    paint();

    const exportBtn = el('button', { class: 'chip', type: 'button', text: 'Copy progress JSON' });
    exportBtn.addEventListener('click', function () {
      const text = Store.exportJSON();
      const done = () => DOM.announce('Progress JSON copied to the clipboard.');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, () => window.prompt('Copy your progress:', text));
      } else window.prompt('Copy your progress:', text);
    });

    const resetBtn = el('button', { class: 'chip', type: 'button', text: 'Reset progress' });
    resetBtn.addEventListener('click', function () {
      if (window.confirm('Clear all ticks, attempts and drafts on this device?')) {
        Store.reset();
        Router.reload();
        DOM.announce('Progress cleared.');
      }
    });

    return el('div', { class: 'card tint' }, [
      el('div', { class: 'kicker', text: 'This device' }),
      el('div', { class: 'row', style: { marginTop: '10px' } }, [themeBtn, exportBtn, resetBtn]),
      el('p', { class: 'small muted', style: { margin: '10px 0 0' },
        text: Store.isVolatile()
          ? 'Storage is blocked in this browser, so progress lasts only for this session. Connect sync above to keep it.'
          : 'Progress is stored in this browser. Connect sync above to carry it to another device.' })
    ]);
  }

  function render() {
    const at = Store.level();
    const s = Store.summary(Pool.ids.concepts(), Pool.ids.cards(),
      Pool.ids.objective(), Pool.ids.proofs());
    const note = nextUndone(), card = nextCard(), q = nextQuestion(), pf = nextProof();

    const root = el('div', { class: 'stack' });

    const tiles = [
      UI.stat(s.notes.done + '/' + s.notes.total, 'Notes ticked', 'ladder level 1',
        UI.meter(s.notes.done, s.notes.total)),
      UI.stat(s.cards.tried ? DOM.pct(s.cards.got, s.cards.tried) + '%' : '—',
        'First-try recall',
        s.cards.tried + ' of ' + s.cards.total + ' tried'),
      UI.stat(s.omr.locked ? DOM.pct(s.omr.correct, s.omr.locked) + '%' : '—',
        'First-try correct',
        s.omr.locked + ' of ' + s.omr.total + ' locked')
    ];
    if (at === 2) {
      tiles.push(UI.stat(s.proofs.done + '/' + s.proofs.total, 'Proofs worked', 'ladder level 2',
        UI.meter(s.proofs.done, s.proofs.total)));
    }

    const loop = [
      step(1, note ? 'Read: ' + note.title : 'Every note has been read once',
        note ? Pool.sectionTitle(note.sec) : 'Re-reading is always available',
        note ? 'note/' + note.id : 'study', !!note),
      step(2, card ? 'State it from memory' : 'Every statement has had one attempt',
        card ? card.title : 'Re-attempts are allowed but never recorded',
        'recall', !!card),
      step(3, q ? 'Answer the next question' : 'Every question has been locked once',
        q ? q.type + ' · ' + Pool.sectionTitle(q.sec) : 'Review the worked answers any time',
        q ? 'omr/' + q.id : 'omr', !!q)
    ];
    if (at === 2) {
      loop.push(step(4, pf ? 'Work the proof: ' + pf.title : 'Every proof has been worked through',
        pf ? Pool.sectionTitle(pf.sec) : 'Levels 3–5 need delayed evidence, which is not built yet',
        pf ? 'note/' + pf.id : 'study', !!pf));
    }

    DOM.add(root, [
      el('div', { class: 'spread' }, [UI.title('Today'), UI.levelBadge()]),
      UI.mockBanner(),

      DOM.stagger(el('div', { class: 'stats' }, tiles)),

      el('div', { class: 'card glass' }, [
        el('div', { class: 'kicker', text: 'The loop' }),
        el('p', { class: 'small muted', style: { margin: '4px 0 12px' },
          text: at === 2
            ? 'Read it → state it from memory → answer questions on it → produce the proof yourself. Feedback comes after the attempt, never before.'
            : 'Read it → state it from memory → answer questions on it. Feedback comes after the attempt, never before.' }),
        el('div', { class: 'list' }, loop)
      ]),

      el('div', {}, [
        el('div', { class: 'spread', style: { marginBottom: '10px' } }, [
          el('h2', { text: 'Courses' }),
          el('a', { class: 'chip', href: Router.href('study'), text: 'Open the syllabus' })
        ]),
        el('div', { class: 'list' }, Pool.courses().map(courseRow))
      ]),

      levelCard(),

      el('div', { class: 'card tint' }, [
        el('div', { class: 'kicker', text: 'Mastery ladder' }),
        el('p', { class: 'small muted', style: { margin: '4px 0 10px' },
          text: at === 2
            ? 'A tick earns level 1. Working a proof through earns level 2 on that proof. Levels 3–5 need delayed evidence, which is not built yet.'
            : 'A tick earns level 1 and nothing more. Recall levels need evidence, and that evidence is collected from Level 2 onwards.' }),
        UI.ladder(false, false)
      ]),

      syncCard(),
      settings()
    ]);

    return root;
  }

  return { render };
})();


/* ── src/view.study.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Study — the whole syllabus as one page of dropdowns you tick your way
   through. Nothing is more than one line tall until you open it, so the size
   of the course never lands on you all at once.

   `#/study`             all three courses, collapsed
   `#/study/<courseId>`  one course, for deep links out of a note
   ══════════════════════════════════════════════════════════════════════════ */

const ViewStudy = (function () {

  const el = DOM.el;

  function summaryStrip() {
    const ids = Pool.ids.concepts();
    const done = ids.filter(Store.isDone).length;
    const left = ids.length - done;
    return el('div', { class: 'card glass' }, [
      el('div', { class: 'spread' }, [
        el('div', {}, [
          el('div', { class: 'kicker', text: 'Ticked off' }),
          el('div', { style: { fontSize: '1.3rem', fontWeight: 600, marginTop: '2px' },
            text: done + ' of ' + ids.length + ' notes' })
        ]),
        el('span', { class: 'count',
          text: left ? left + ' to go' : 'slice complete' })
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.meter(done, ids.length)])
    ]);
  }

  function courseView(course) {
    const root = el('div', { class: 'stack' });
    const host = el('div', {});
    const ids = Pool.ids.concepts(course.id);
    const done = ids.filter(Store.isDone).length;

    DOM.add(root, [
      UI.crumb([{ text: 'Study', href: 'study' }, { text: course.title }]),
      UI.title(course.title, course.code + (course.sem !== '—' ? ' · semester ' + course.sem : '')),
      el('p', { class: 'lede', text: course.blurb }),
      course.pending
        ? el('div', { class: 'banner' }, [
            el('span', { 'aria-hidden': 'true', text: '⚠' }),
            el('span', {}, [el('b', { text: 'Not built yet. ' }), course.pendingNote])
          ])
        : el('div', { class: 'card tint' }, [
            el('div', { class: 'spread' }, [
              el('span', { class: 'kicker', text: 'Notes ticked' }),
              el('span', { class: 'count', text: done + ' / ' + ids.length })
            ]),
            el('div', { style: { marginTop: '8px' } }, [UI.meter(done, ids.length)])
          ]),
      host
    ]);

    Tree.mount(host, course);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const course = Pool.course(args[0]);
      if (course) return courseView(course);
    }

    const root = el('div', { class: 'stack' });
    const host = el('div', {});
    Tree.seedOpen(Pool.courses().filter(c => !c.pending)[0]);

    DOM.add(root, [
      UI.title('Syllabus', 'Open a level, tick what is done'),
      UI.mockBanner(),
      summaryStrip(),
      host,
      el('p', { class: 'small muted', style: { margin: 0 },
        text: 'A tick means "I have been through this" — level 1 of the ladder, nothing more. ' +
          'Ticking a module or a section ticks everything inside it.' })
    ]);

    Tree.mountAll(host, Pool.courses());
    return root;
  }

  return { render };
})();


/* ── src/view.note.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One concept note.

   Navigation is the point of this screen as much as the content is: the
   prerequisite chain above it, what it unlocks below it, the previous and next
   concept in reading order, the questions that examine it. Nothing about this
   concept should be more than one tap away.

   Completion is a deliberate act with a deliberate label — "encountered the
   material", level 1 — so it can never read as evidence of recall.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewNote = (function () {

  const el = DOM.el;

  /* ── the prerequisite chain, walked and rendered as a path ────────────── */
  function prereqPath(c) {
    const chain = Pool.chain(c.id, 3);
    if (chain.length < 2) return null;
    const missing = chain.filter(x => x.id !== c.id && !Store.isDone(x.id)).length;

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Route to this result' }),
        missing
          ? el('span', { class: 'badge warn', text: missing + ' not ticked' })
          : el('span', { class: 'badge ok', text: 'groundwork done' })
      ]),
      el('div', { class: 'path', style: { marginTop: '10px' } }, chain.map(function (x, i) {
        const here = x.id === c.id;
        const done = Store.isDone(x.id);
        const kids = [
          el('span', { class: 'dot', 'aria-hidden': 'true',
            text: here ? '●' : done ? '✓' : String(i + 1) }),
          el('span', { class: 'tt' }, [
            el('b', { text: x.title }),
            el('span', { text: here ? 'you are here' : '§' + x.sec + ' · ' + x.kind })
          ])
        ];
        return here
          ? el('div', { class: 'pstep here' }, kids)
          : el('a', { class: 'pstep' + (done ? ' done' : ''),
              href: Router.href('note/' + x.id) }, kids);
      }))
    ]);
  }

  /* ── reverse edges: what this result is used for ──────────────────────── */
  function unlocks(c) {
    const next = Pool.unlocks(c.id);
    if (!next.length) return null;
    return el('div', { class: 'card tint' }, [
      el('div', { class: 'kicker', text: 'Used later by' }),
      el('div', { class: 'row', style: { marginTop: '10px' } }, next.map(function (x) {
        return el('a', { class: 'chip', href: Router.href('note/' + x.id) }, [
          Store.isDone(x.id) ? el('span', { 'aria-hidden': 'true', text: '✓' }) : null,
          el('span', { text: x.title })
        ]);
      }))
    ]);
  }

  function prevNext(c) {
    const n = Pool.neighbours(c.id);
    if (!n.prev && !n.next) return null;
    return el('div', { class: 'nav-pair' }, [
      n.prev ? el('a', { href: Router.href('note/' + n.prev.id) }, [
        el('span', { class: 'k', text: '‹ previous' }),
        el('span', { class: 'v', text: n.prev.title })
      ]) : el('span', {}),
      n.next ? el('a', { class: 'next', href: Router.href('note/' + n.next.id) }, [
        el('span', { class: 'k', text: 'next ›' }),
        el('span', { class: 'v', text: n.next.title })
      ]) : el('span', {})
    ]);
  }

  function proofView(c) {
    if (!c.proof) return null;
    const p = c.proof;

    const tryHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });
    const proofHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });

    let tryBuilt = false;
    let proofBuilt = false;

    function buildTry() {
      const kids = [];
      if (p.idea) {
        kids.push(el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
          el('div', { class: 'kicker', text: '💡 Proof Strategy / Hint' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
        ]));
      }
      if (p.why) {
        kids.push(el('div', { class: 'card flat', style: { padding: '10px 14px', borderLeft: '3px solid var(--accent, #4f46e5)' } }, [
          el('div', { class: 'kicker', text: 'Core Rationale' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.why })
        ]));
      }
      if (p.rungs && p.rungs.length > 0 && p.rungs[0].why) {
        kids.push(el('div', { class: 'card flat', style: { padding: '8px 12px', background: 'var(--surface-2)' } }, [
          el('div', { class: 'small muted' }, [
            el('b', { text: 'First step clue: ' }),
            el('span', { html: p.rungs[0].why })
          ])
        ]));
      }
      kids.push(el('div', { class: 'stack', style: { gap: '4px' } }, [
        el('label', { class: 'small muted', text: 'Scratchpad: draft your proof steps or reasoning before checking the solution' }),
        el('textarea', {
          class: 'proof-scratchpad',
          placeholder: 'Write your proof sketch or key steps here...',
          spellcheck: 'false'
        })
      ]));
      return kids;
    }

    function buildProof() {
      const kids = [];
      if (p.idea) {
        kids.push(el('div', { class: 'card tint', style: { marginBottom: '6px', padding: '10px 14px' } }, [
          el('div', { class: 'kicker', text: 'Key Idea' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
        ]));
      }
      if (p.rungs && p.rungs.length) {
        kids.push(el('div', { class: 'stack', style: { gap: '10px' } },
          p.rungs.map(function (r, idx) {
            return el('div', { class: 'card flat', style: { padding: '10px 14px', borderLeft: '3px solid var(--accent, #4f46e5)' } }, [
              el('div', { class: 'small muted', style: { marginBottom: '6px' } }, [
                el('b', { text: 'Step ' + (idx + 1) + ': ' }),
                el('span', { html: r.why })
              ]),
              r.m ? el('div', { html: r.m }) : null
            ]);
          })
        ));
      }
      if (p.ends) {
        kids.push(el('div', { class: 'prose tight', style: { marginTop: '12px', fontStyle: 'italic', borderTop: '1px solid var(--line, rgba(0,0,0,0.1))', paddingTop: '8px' }, html: p.ends }));
      }
      return kids;
    }

    const tryBtn = el('button', {
      class: 'chip',
      type: 'button',
      'aria-expanded': 'false',
      text: '💡 Try proof (hint)'
    });

    const showBtn = el('button', {
      class: 'chip',
      type: 'button',
      'aria-expanded': 'false',
      text: '👁 Show step-by-step proof'
    });

    tryBtn.addEventListener('click', function () {
      const open = tryHost.hidden;
      if (open && !tryBuilt) {
        tryBuilt = true;
        DOM.add(tryHost, buildTry());
        UI.math(tryHost);
      }
      tryHost.hidden = !open;
      tryBtn.setAttribute('aria-expanded', String(open));
      tryBtn.textContent = open ? 'Hide hint' : '💡 Try proof (hint)';
    });

    showBtn.addEventListener('click', function () {
      const open = proofHost.hidden;
      if (open && !proofBuilt) {
        proofBuilt = true;
        DOM.add(proofHost, buildProof());
        UI.math(proofHost);
      }
      proofHost.hidden = !open;
      showBtn.setAttribute('aria-expanded', String(open));
      showBtn.textContent = open ? 'Hide proof' : '👁 Show step-by-step proof';
    });

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Proof & Rigorous Argument' }),
        el('span', { class: 'count', text: (p.rungs ? p.rungs.length : 0) + ' steps' })
      ]),
      el('div', { class: 'row', style: { gap: '8px', marginTop: '10px', flexWrap: 'wrap' } }, [
        tryBtn,
        showBtn
      ]),
      tryHost,
      proofHost,
      proofDoneRow(c.id, 'proof')
    ]);
  }

  /* ── Level 2: proof work, marked per task ─────────────────────────────────
     This is the only thing that earns level 2, and it is earned per proof
     rather than per note — a chapter is not "recognised" because one theorem
     in it was worked through. Like the level 1 tick it is self-reported, but
     it reports a much harder act, and the label says exactly what is being
     claimed so it cannot be ticked absent-mindedly. */
  function proofDoneRow(id, what) {
    if (Store.level() !== 2) return null;

    const btn = el('button', { class: 'btn', type: 'button' });
    const note = el('span', { class: 'small muted' });
    function paint() {
      const on = Store.isProofDone(id);
      btn.className = 'btn' + (on ? '' : ' primary');
      btn.textContent = on ? '✓ Proof worked through — undo' : 'I worked this ' + what + ' through';
      btn.setAttribute('aria-pressed', String(on));
      note.textContent = on
        ? 'Level 2 on this ' + what + '.'
        : 'Claim this only if you produced the argument yourself, not if you read it.';
    }
    btn.addEventListener('click', function () {
      const on = Store.setProofDone(id, !Store.isProofDone(id));
      paint();
      DOM.announce(on ? 'Marked as worked through.' : 'Level 2 mark removed.');
    });
    paint();

    return el('div', { class: 'proof-done', style: { marginTop: '14px' } }, [
      el('div', { class: 'btn-row' }, [btn]),
      el('p', { class: 'small muted', style: { margin: '8px 0 0' } }, [note])
    ]);
  }

  function traps(c) {
    if (!c.traps || !c.traps.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'kicker', text: 'Where marks are lost' }),
      el('ul', { class: 'prose tight', style: { marginTop: '10px', paddingLeft: '1.1em' } },
        c.traps.map(t => el('li', { html: t })))
    ]);
  }

  function selfChecks(c) {
    const cards = (c.cards || []);
    if (!cards.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'kicker', text: 'Self-check' }),
      el('p', { class: 'small muted', style: { margin: '4px 0 12px' },
        text: 'Practice prompts. Answer in your head first — nothing here is recorded.' }),
      el('div', { class: 'stack', style: { gap: '14px' } }, cards.map(function (card) {
        return el('div', { class: 'stack', style: { gap: '6px' } }, [
          el('div', { class: 'prose tight', html: card.q }),
          UI.reveal(card.kind, () => el('div', { class: 'prose tight', html: card.a }),
            { openLabel: 'Show answer', closeLabel: 'Hide' })
        ]);
      }))
    ]);
  }

  function questionsOn(c) {
    const qs = Pool.objectiveFor(c.id);
    if (!qs.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: 'Objective questions on this' }),
        el('span', { class: 'count', text: String(qs.length) })
      ]),
      DOM.stagger(el('div', { class: 'list', style: { marginTop: '12px' } }, qs.map(function (q) {
        const rec = Store.omr(q.id);
        const v = rec && rec.first && rec.first.verdict;
        return el('a', { class: 'item', href: Router.href('omr/' + q.id) }, [
          el('span', { class: 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : ''),
            text: v === 'correct' ? '✓' : v ? '✗' : '·' }),
          el('span', { class: 'tt' }, [
            el('b', { text: q.type + ' · ' + q.marks + ' ' + DOM.plural(q.marks, 'mark') }),
            el('span', { text: v ? 'first attempt: ' + v : 'not attempted' })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      })))
    ]);
  }

  function writtenOn(c) {
    const qs = Pool.writtenFor(c.id);
    if (!qs.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'kicker', text: 'Written exam questions on this' }),
      el('div', { class: 'stack', style: { gap: '14px', marginTop: '12px' } }, qs.map(function (q) {
        const tryHost = el('div', { class: 'stack', style: { gap: '8px', marginTop: '8px' }, hidden: true });
        const answerHost = el('div', { class: 'prose tight', style: { marginTop: '8px' }, hidden: true });

        let tryBuilt = false;
        let answerBuilt = false;

        function buildTry() {
          const kids = [];
          if (q.approach) {
            kids.push(el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
              el('div', { class: 'kicker', text: '💡 Strategic Hint / Approach' }),
              el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: q.approach })
            ]));
          }
          kids.push(el('div', { class: 'stack', style: { gap: '4px' } }, [
            el('label', { class: 'small muted', text: 'Scratchpad: outline your proof or solution steps' }),
            el('textarea', {
              class: 'proof-scratchpad',
              placeholder: 'Draft your solution here before viewing the model answer...',
              spellcheck: 'false'
            })
          ]));
          return kids;
        }

        function buildAnswer() {
          return [
            q.approach ? el('div', { html: q.approach }) : null,
            q.solution ? el('div', { html: q.solution }) : null,
            q.trap ? el('p', {}, [el('b', { text: 'Trap: ' }), el('span', { html: q.trap })]) : null
          ];
        }

        const tryBtn = el('button', {
          class: 'chip',
          type: 'button',
          'aria-expanded': 'false',
          text: '💡 Try proof (hint)'
        });

        const showBtn = el('button', {
          class: 'chip',
          type: 'button',
          'aria-expanded': 'false',
          text: '👁 Show answer'
        });

        tryBtn.addEventListener('click', function () {
          const open = tryHost.hidden;
          if (open && !tryBuilt) {
            tryBuilt = true;
            DOM.add(tryHost, buildTry());
            UI.math(tryHost);
          }
          tryHost.hidden = !open;
          tryBtn.setAttribute('aria-expanded', String(open));
          tryBtn.textContent = open ? 'Hide hint' : '💡 Try proof (hint)';
        });

        showBtn.addEventListener('click', function () {
          const open = answerHost.hidden;
          if (open && !answerBuilt) {
            answerBuilt = true;
            DOM.add(answerHost, buildAnswer());
            UI.math(answerHost);
          }
          answerHost.hidden = !open;
          showBtn.setAttribute('aria-expanded', String(open));
          showBtn.textContent = open ? 'Hide answer' : '👁 Show answer';
        });

        return el('div', { class: 'card flat', style: { padding: '12px', border: '1px solid var(--rule)' } }, [
          el('div', { class: 'spread', style: { marginBottom: '8px' } }, [
            el('span', { class: 'badge', text: (q.marks || '?') + ' marks' }),
            q.title ? el('span', { class: 'kicker', text: q.title }) : null
          ]),
          el('div', { class: 'prose tight', html: q.prompt }),
          el('div', { class: 'row', style: { gap: '8px', marginTop: '10px', flexWrap: 'wrap' } }, [
            tryBtn,
            showBtn
          ]),
          tryHost,
          answerHost,
          proofDoneRow('w:' + q.id, 'answer')
        ]);
      }))
    ]);
  }

  function render(args) {
    const c = Pool.concept(args && args[0]);
    if (!c) return el('div', { class: 'stack' }, [
      UI.title('Not found'),
      UI.empty('That concept is not in the loaded pool.',
        el('a', { class: 'btn', href: Router.href('study'), text: 'Back to the syllabus' }))
    ]);

    Tree.revealPath(c.id);      /* so the syllabus is unfolded when you go back */

    const course = Pool.courseOfSec(c.sec);
    const mod = Pool.moduleOfSec(c.sec);
    const root = el('div', { class: 'stack' });

    /* completion toggle */
    const doneBtn = el('button', { class: 'btn', type: 'button' });
    const ladderHost = el('div', {});
    const askHost = el('div', {});

    function paintDone() {
      const on = Store.isDone(c.id);
