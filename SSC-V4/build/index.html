CONCEPTS.push(
  { id:'c.2.3.1', bartle:'2.3.1', sec:'2.3', kind:'definition', tier:'core',
    title:'Upper and lower bounds; bounded sets',
    oneLine:'A set is bounded above if some single number sits at or above every element of it.',
    statement:`<p>Let $S$ be a nonempty subset of $\\mathbb{R}$.</p>
      <p>(a) $S$ is <b>bounded above</b> if there exists $u\\in\\mathbb{R}$ such that $s\\le u$ for all $s\\in S$. Any such $u$ is an <b>upper bound</b> of $S$.</p>
      <p>(b) $S$ is <b>bounded below</b> if there exists $w\\in\\mathbb{R}$ such that $w\\le s$ for all $s\\in S$. Any such $w$ is a <b>lower bound</b> of $S$.</p>
      <p>(c) $S$ is <b>bounded</b> if it is both bounded above and bounded below; otherwise it is <b>unbounded</b>.</p>`,
    intuition:`<p>An upper bound is a fence that no element of $S$ can climb over. There is never just one such fence: if $u$ works, so does $u+1$, $u+2$, and every number above $u$ — a set with one upper bound automatically has infinitely many.</p>
      <p><b>Worked micro-example:</b> $S=\\{x\\in\\mathbb{R}: x<2\\}$. It is bounded above (by $2$, or by $2.001$, or by $1000$ — all work). It has NO lower bound at all (numbers in $S$ go to $-\\infty$), so $S$ is unbounded even though it is bounded above.</p>`,
    needs:['s.quantifier'],
    traps:[
      `Confusing "an upper bound" (there are infinitely many, none special) with "the least upper bound" (there is only one — see <code>c.2.3.2</code>).`,
      `Assuming a set bounded above must also be bounded below (or vice versa) — false, as the worked example shows.`
    ],
    cards:[
      { q:`Define "upper bound of S".`, a:`A number $u$ with $s\\le u$ for every $s\\in S$.`, kind:'state' },
      { q:`If $u$ is an upper bound of $S$, is $u+5$ also an upper bound?`, a:`Yes — any number $\\ge u$ is automatically an upper bound too.`, kind:'recall' },
      { q:`Is $S=\\{x: x<2\\}$ bounded?`, a:`No — it is bounded above (e.g. by $2$) but unbounded below, so it is not bounded overall.`, kind:'apply' }
    ]
  },

  { id:'c.2.3.2', bartle:'2.3.2', sec:'2.3', kind:'definition', tier:'core',
    title:'Supremum and infimum',
    oneLine:'The supremum is the tightest possible upper bound — the least of all of them.',
    statement:`<p>Let $S$ be a nonempty subset of $\\mathbb{R}$.</p>
      <p>(a) If $S$ is bounded above, $u$ is the <b>supremum</b> (least upper bound) of $S$, written $u=\\sup S$, if:<br>
      (1) $u$ is an upper bound of $S$, and (2) if $v$ is any upper bound of $S$, then $u\\le v$.</p>
      <p>(b) If $S$ is bounded below, $w$ is the <b>infimum</b> (greatest lower bound) of $S$, written $w=\\inf S$, if:<br>
      (1) $w$ is a lower bound of $S$, and (2) if $t$ is any lower bound of $S$, then $t\\le w$.</p>
      <p>The supremum (when it exists) is unique: if $u_1$ and $u_2$ both satisfy the definition, condition (2) applied to each forces $u_1\\le u_2$ and $u_2\\le u_1$, so $u_1=u_2$.</p>`,
    intuition:`<p>Among all the possible ceilings you could put over a room, the supremum is the <b>lowest</b> one that still clears everyone's head — condition (1) says it IS a ceiling, condition (2) says no lower ceiling would still work. This is exactly the everyday "least upper bound" idea from <code>s.sup-inf-school</code>, now made precise with two checkable conditions.</p>
      <p><b>Worked micro-example:</b> $S=[0,1)$. $u=1$: it's an upper bound (condition 1 ✓); and any $v<1$ fails to be an upper bound since some element of $S$ (e.g. $\\max(v,0.5)$, adjusted to lie in $S$) exceeds it — so no smaller number works, giving condition (2) ✓. Hence $\\sup S=1$, even though $1\\notin S$.</p>`,
    needs:['c.2.3.1','s.sup-inf-school'],
    figs:['fig.sup-inf'],
    traps:[
      `Thinking $\\sup S$ must belong to $S$ — false in general (see the worked example).`,
      `Checking only condition (1) (that $u$ is AN upper bound) and forgetting condition (2) (that it's the LEAST one).`,
      `Talking about "the" supremum before confirming it's unique — always a safe habit, but worth knowing WHY it's safe (see the uniqueness argument above).`
    ],
    cards:[
      { q:`State both conditions in the definition of $u=\\sup S$.`, a:`(1) $u$ is an upper bound of $S$; (2) every other upper bound $v$ satisfies $u\\le v$.`, kind:'state' },
      { q:`Must $\\sup S \\in S$?`, a:`No — e.g. $\\sup(0,1)=1$ but $1\\notin(0,1)$.`, kind:'recall' },
      { q:`Find $\\sup S$ and $\\inf S$ for $S=\\{1/n : n\\in\\mathbb{N}\\}$.`, a:`$\\sup S = 1$ (attained at $n=1$); $\\inf S = 0$ (not attained, but no positive number is a lower bound).`, kind:'apply' }
    ]
  },

  { id:'c.2.3.4', bartle:'2.3.4', sec:'2.3', kind:'lemma', tier:'core',
    title:'ε-characterisation of the supremum',
    oneLine:'u is the supremum of S exactly when, however close to u you stand from below, some point of S is even closer.',
    statement:`<p>An upper bound $u$ of a nonempty $S\\subseteq\\mathbb{R}$ is $\\sup S$ if and only if for every $\\varepsilon>0$ there exists $s_\\varepsilon\\in S$ such that $u-\\varepsilon < s_\\varepsilon$.</p>`,
    intuition:`<p>This restates "$u$ is the LEAST upper bound" in a form built for $\\varepsilon$-arguments: however small a margin $\\varepsilon$ you allow yourself below the ceiling $u$, the set $S$ still has a point that gets inside that margin — otherwise $u-\\varepsilon$ would itself be a smaller working ceiling, contradicting that $u$ is the least one.</p>
      <p><b>Worked micro-example:</b> $S=(0,1)$, $u=1$. Given any $\\varepsilon>0$, pick $s_\\varepsilon := 1-\\varepsilon/2 \\in S$ (as long as $\\varepsilon<2$, which we may assume). Then $u-\\varepsilon = 1-\\varepsilon < 1-\\varepsilon/2 = s_\\varepsilon$, as required.</p>`,
    needs:['c.2.3.2','s.abs-ineq'],
    traps:[
      `Checking the condition for just one $\\varepsilon$ instead of "for every $\\varepsilon>0$".`,
      `Forgetting this lemma SUPPLEMENTS condition (1) (still need $u$ to be an upper bound) rather than replacing it.`
    ],
    proof:{
      idea:`Prove both directions. (⇐) is a direct translation using $\\varepsilon:=u-v$. (⇒) argues that if $u=\\sup S$, then $u-\\varepsilon$ is too small to be an upper bound, so something in $S$ must beat it.`,
      why:`The whole point is that "least upper bound" (condition (2), phrased with an arbitrary competing bound $v$) and "for every $\\varepsilon$, some point of $S$ beats $u-\\varepsilon$" are just two ways of saying the same thing — one compares against other bounds, the other measures a margin directly.`,
      rungs:[
        { why:`(⇐) Assume $u$ is an upper bound satisfying the $\\varepsilon$-condition. Take any $v<u$ and turn the gap into an $\\varepsilon$.`, m:`$$\\varepsilon := u-v > 0$$` },
        { why:`Apply the hypothesis with this specific $\\varepsilon$ to get a point of $S$ beating $v$.`, m:`$$\\exists\\, s_\\varepsilon\\in S:\\ u-\\varepsilon < s_\\varepsilon \\iff v < s_\\varepsilon$$` },
        { why:`So no $v<u$ can be an upper bound of $S$ — exactly condition (2) of the supremum definition.`, m:`$$v<u \\Rightarrow v \\text{ is not an upper bound} \\Rightarrow u=\\sup S$$` },
        { why:`(⇒) Conversely, suppose $u=\\sup S$ and let $\\varepsilon>0$ be given. Since $u$ is the LEAST upper bound, anything strictly below it fails to be one.`, m:`$$u-\\varepsilon < u \\Rightarrow u-\\varepsilon \\text{ is not an upper bound of } S$$` },
        { why:`"Not an upper bound" means, by definition, some element of $S$ slips past it.`, m:`$$\\exists\\, s_\\varepsilon\\in S:\\ u-\\varepsilon < s_\\varepsilon$$` }
      ],
      ends:`Both directions hold, so the $\\varepsilon$-form and the original least-upper-bound form say exactly the same thing. The $\\varepsilon$-form is the one you will actually reach for inside limit proofs.`
    },
    cards:[
      { q:`State the ε-characterisation of $\\sup S$.`, a:`$u$ is an upper bound of $S$, and for every $\\varepsilon>0$ there exists $s_\\varepsilon\\in S$ with $u-\\varepsilon < s_\\varepsilon$.`, kind:'state' },
      { q:`For $S=(0,1)$ and $u=1$, exhibit $s_\\varepsilon$ for a given small $\\varepsilon>0$.`, a:`$s_\\varepsilon = 1-\\varepsilon/2$ works, since $1-\\varepsilon<1-\\varepsilon/2<1$.`, kind:'apply' },
      { q:`Trap: does verifying the ε-condition for ONE value of $\\varepsilon$ prove $u=\\sup S$?`, a:`No — it must hold for EVERY $\\varepsilon>0$; a single success proves nothing.`, kind:'trap' }
    ]
  },

  { id:'c.2.3.6', bartle:'2.3.6', sec:'2.3', kind:'theorem', tier:'core',
    title:'The Completeness (Supremum) Property of ℝ',
    oneLine:'Every nonempty set of real numbers with an upper bound actually has a supremum — no gaps.',
    statement:`<p>Every nonempty subset of $\\mathbb{R}$ that has an upper bound also has a supremum in $\\mathbb{R}$. ($\\mathbb{R}$ is a <b>complete ordered field</b>.) Equivalently, every nonempty subset of $\\mathbb{R}$ that has a lower bound also has an infimum in $\\mathbb{R}$.</p>`,
    intuition:`<p>$\\mathbb{Q}$ has "holes": the set $\\{x\\in\\mathbb{Q}: x^2<2\\}$ is bounded above (e.g. by $2$) but has no LEAST rational upper bound — you can always find a slightly smaller rational upper bound, forever, because the true ceiling $\\sqrt2$ isn't rational. $\\mathbb{R}$ is built precisely so this can't happen.</p>
      <p>This property cannot be derived from the algebraic and order axioms of $\\mathbb{R}$ alone — it is genuinely extra information about what $\\mathbb{R}$ is, so it is simply postulated as an axiom. Nearly every "does a limit exist" argument later in the course secretly leans on this fact whenever it needs a number to converge to, or a bound to exist.</p>`,
    needs:['c.2.3.1','c.2.3.2'],
    figs:['fig.gap'],
    traps:[
      `Trying to "prove" completeness from the field and order axioms alone — it cannot be done; it is an independent axiom.`,
      `Forgetting the infimum version isn't a separate axiom — it follows from the supremum version by flipping signs (see the proof).`
    ],
    proof:{
      idea:`The supremum version is taken as the axiom. The infimum version is then FREE: turn a "bounded below" question into a "bounded above" question by flipping every sign.`,
      why:`Negating a set turns lower bounds into upper bounds and vice versa, so completeness-for-suprema automatically delivers completeness-for-infima once you translate through $S':=\\{-s:s\\in S\\}$.`,
      rungs:[
        { why:`Start from a nonempty $S$ bounded below by $w$; build the sign-flipped set.`, m:`$$S' := \\{-s : s\\in S\\}$$` },
        { why:`"$w$ is a lower bound of $S$" becomes, after flipping signs, "$-w$ is an upper bound of $S'$".`, m:`$$s\\ge w\\ \\forall s\\in S \\iff -s\\le -w\\ \\forall s\\in S \\ \\Rightarrow\\ S' \\text{ bounded above by } -w$$` },
        { why:`Now apply the Completeness Property (the axiom) to the bounded-above set $S'$.`, m:`$$u := \\sup S' \\text{ exists, by the axiom}$$` },
        { why:`Claim $-u = \\inf S$; check both defining conditions by flipping signs back.`, m:`$$-u \\le s\\ \\forall s\\in S \\quad(\\text{lower bound}),\\qquad t\\le s\\ \\forall s\\in S \\Rightarrow t\\le -u \\quad(\\text{greatest such})$$` }
      ],
      ends:`So the infimum property is not a second, independent assumption — it is a consequence of the supremum property. $\\mathbb{R}$ is complete for both suprema and infima.`
    },
    cards:[
      { q:`State the Completeness Property of $\\mathbb{R}$.`, a:`Every nonempty subset of $\\mathbb{R}$ that is bounded above has a supremum in $\\mathbb{R}$.`, kind:'state' },
      { q:`Can the Completeness Property be proved from the field and order axioms of $\\mathbb{R}$?`, a:`No — it is an independent axiom; $\\mathbb{Q}$ satisfies the same field and order axioms but fails completeness.`, kind:'recall' },
      { q:`How is "every bounded-below set has an infimum" derived without a second axiom?`, a:`Apply the supremum axiom to the sign-flipped set $S'=\\{-s:s\\in S\\}$ and set $\\inf S := -\\sup S'$.`, kind:'apply' }
    ]
  },

  { id:'c.3.1.3', bartle:'3.1.3', sec:'3.1', kind:'definition', tier:'core',
    title:'Convergence of a sequence (the ε-K definition)',
    oneLine:'A sequence converges to x if, for any tolerance ε you pick, all terms eventually (past some point) land within ε of x.',
    statement:`<p>A sequence $X=(x_n)$ in $\\mathbb{R}$ <b>converges</b> to $x\\in\\mathbb{R}$, written $\\lim(x_n)=x$, if for every $\\varepsilon>0$ there exists a natural number $K(\\varepsilon)$ such that $n\\ge K(\\varepsilon)$ implies $|x_n-x|<\\varepsilon$. If no such $x$ exists, the sequence <b>diverges</b>.</p>`,
    intuition:`<p>However small a tolerance $\\varepsilon$ you demand, the sequence must EVENTUALLY (from some index $K$ onward) stay within that tolerance of $x$ forever after — not just occasionally get close. $K$ is allowed to depend on $\\varepsilon$: a tighter tolerance will generally need a larger $K$.</p>
      <p><b>Worked micro-example:</b> $\\lim(1/n)=0$. Given $\\varepsilon=0.01$, we need $1/n<0.01$, i.e. $n>100$, so $K=101$ works — and any tighter $\\varepsilon$ just pushes $K$ higher.</p>`,
    needs:['s.abs-ineq','s.quantifier'],
    traps:[
      `Thinking it's enough for the terms to get close to $x$ sometimes — the condition must hold for ALL $n\\ge K$, permanently, not intermittently.`,
      `Believing one single $K$ must work for every $\\varepsilon$ — the opposite is true and expected: $K$ is allowed to (and generally must) grow as $\\varepsilon$ shrinks.`,
      `Confusing "converges to $x$" with "gets arbitrarily close to $x$ infinitely often" — the latter is much weaker and does not imply convergence (e.g. $(-1)^n$ gets close to $1$ infinitely often but does not converge to $1$).`
    ],
    cards:[
      { q:`State the ε-K definition of $\\lim(x_n)=x$.`, a:`For every $\\varepsilon>0$ there is $K(\\varepsilon)\\in\\mathbb{N}$ such that $n\\ge K(\\varepsilon) \\Rightarrow |x_n-x|<\\varepsilon$.`, kind:'state' },
      { q:`For $x_n=1/n$ and $\\varepsilon=0.01$, find a valid $K$.`, a:`Any $K\\ge101$ works, since $n\\ge101 \\Rightarrow 1/n\\le1/101<0.01$.`, kind:'apply' },
      { q:`Trap: does $x_n=(-1)^n$ converge to $0$ because $|x_n-0|\\le1$ is "close-ish" for all $n$?`, a:`No — convergence needs $|x_n-x|<\\varepsilon$ for EVERY $\\varepsilon>0$ eventually; taking $\\varepsilon=0.5$, no $K$ works since $x_n$ keeps hitting $\\pm1$ forever.`, kind:'trap' }
    ]
  },

  { id:'c.3.1.4', bartle:'3.1.4', sec:'3.1', kind:'theorem', tier:'core',
    title:'Uniqueness of limits',
    oneLine:'A sequence cannot converge to two different numbers.',
    statement:`<p>A sequence in $\\mathbb{R}$ can have at most one limit. That is, if a sequence $X = (x_n)$ of real numbers converges to $x' \\in \\mathbb{R}$ and also converges to $x'' \\in \\mathbb{R}$, then:
      $$x' = x''$$</p>`,
    intuition:`<p>If $x'$ and $x''$ were both limits, then eventually the terms would be simultaneously trapped close to both — but two fixed numbers can't both be "arbitrarily close" to the same wandering terms unless they are, in fact, the same number. The clean way to see this: compare $x'$ to $x''$ by routing the comparison through a term $x_n$ of the sequence, using the add-and-subtract trick.</p>`,
    needs:['c.3.1.3','s.triangle-ineq'],
    traps:[
      `Trying to compare $x'$ and $x''$ directly without introducing a THIRD point ($x_n$) to route the comparison through — the triangle-inequality trick always needs a common middle term.`,
      `Using two different indices for the two convergences without justifying why a common $K=\\max\\{K',K''\\}$ works for both simultaneously.`
    ],
    proof:{
      idea:`Suppose both $x'$ and $x''$ were limits. Show $|x'-x''|$ is smaller than every positive number — which forces it to be exactly $0$.`,
      why:`Both $x'$ and $x''$ satisfy the convergence definition, so eventually the terms are simultaneously close to both; the only way to compare $x'$ to $x''$ directly is by routing the comparison through a shared term $x_n$ — exactly what the triangle inequality's add-and-subtract trick does.`,
      rungs:[
        { why:`Suppose, for contradiction, both $x'$ and $x''$ are limits of $(x_n)$.`, m:`$$\\lim(x_n)=x' \\text{ and } \\lim(x_n)=x''$$` },
        { why:`Split an arbitrary tolerance in half — one half for each limit — so the two errors will add up to exactly $\\varepsilon$ at the end.`, m:`$$\\text{given }\\varepsilon>0,\\ \\exists K': n\\ge K' \\Rightarrow |x_n-x'|<\\varepsilon/2$$ $$\\exists K'': n\\ge K'' \\Rightarrow |x_n-x''|<\\varepsilon/2$$` },
        { why:`Take $n$ large enough to satisfy both conditions simultaneously.`, m:`$$K := \\max\\{K',K''\\},\\qquad n\\ge K$$` },
        { why:`Insert and subtract $x_n$ (add-and-subtract trick), then apply the triangle inequality.`, m:`$$|x'-x''| = |x'-x_n+x_n-x''| \\le |x'-x_n|+|x_n-x''| < \\varepsilon/2+\\varepsilon/2 = \\varepsilon$$` }
      ],
      ends:`Since $\\varepsilon>0$ was arbitrary, $|x'-x''|<\\varepsilon$ for every $\\varepsilon>0$, which forces $x'-x''=0$, i.e. $x'=x''$. A sequence cannot converge to two different numbers.`
    },
    cards:[
      { q:`What does the Uniqueness of Limits theorem say?`, a:`A sequence of real numbers can converge to at most one number.`, kind:'state' },
      { q:`What is the key algebraic trick in its proof?`, a:`Insert and subtract $x_n$: $|x'-x''|=|x'-x_n+x_n-x''|\\le|x'-x_n|+|x_n-x''|$, then bound each piece by $\\varepsilon/2$.`, kind:'recall' },
      { q:`Trap: why split the tolerance as $\\varepsilon/2+\\varepsilon/2$ rather than using $\\varepsilon$ for both?`, a:`Using $\\varepsilon$ for both would only bound $|x'-x''|$ by $2\\varepsilon$, which is still fine since $\\varepsilon$ is arbitrary — but the standard convention splits evenly so the final bound reads exactly $\\varepsilon$.`, kind:'trap' }
    ]
  },

  { id:'c.3.4.1', bartle:'3.4.1', sec:'3.4', kind:'definition', tier:'core',
    title:'Subsequence',
    oneLine:'A subsequence picks out infinitely many terms from a sequence, keeping their original left-to-right order.',
    statement:`<p>Let $X=(x_n)$ be a sequence and let $n_1 < n_2<\\cdots < n_k<\\cdots$ be a strictly increasing sequence of natural numbers. Then $X'=(x_{n_k})=(x_{n_1},x_{n_2},\\ldots)$ is a <b>subsequence</b> of $X$.</p>`,
    intuition:`<p>You choose infinitely many indices, but they must strictly increase — you can skip ahead as much as you like, but never go backwards and never repeat an index.</p>
      <p><b>Worked micro-example:</b> $X=(1/n)$. Selecting the even indices gives the subsequence $(1/2,1/4,1/6,\\ldots)$. By contrast, a "sequence" built by jumping around out of order, like $(1/2,1/1,1/4,1/3,\\ldots)$, is NOT a subsequence — the index order must strictly increase.</p>`,
    needs:['c.3.1.3'],
    traps:[
      `Picking indices out of increasing order — that is not a subsequence, even if every term still comes from $X$.`,
      `Confusing a subsequence with the SET of values taken — $((-1)^n)$ has value-set $\\{-1,1\\}$ but infinitely many distinct subsequences (constant $-1$, constant $1$, alternating ones, etc.).`
    ],
    cards:[
      { q:`What condition must the chosen indices $n_1,n_2,\\ldots$ satisfy to define a subsequence?`, a:`They must be strictly increasing natural numbers: $n_1 < n_2 < n_3<\\cdots$.`, kind:'state' },
      { q:`Give the subsequence of $X=(1/n)$ using odd indices.`, a:`$(1,\\,1/3,\\,1/5,\\ldots)$.`, kind:'apply' },
      { q:`Trap: is $(x_2,x_1,x_4,x_3,\\ldots)$ a subsequence of $(x_n)$?`, a:`No — the indices $2,1,4,3,\\ldots$ are not strictly increasing.`, kind:'trap' }
    ]
  },

  { id:'c.3.4.2', bartle:'3.4.2', sec:'3.4', kind:'theorem', tier:'core',
    title:'Subsequences of convergent sequences converge to the same limit',
    oneLine:'Thinning out a sequence that already homes in on x cannot make the survivors wander off.',
    statement:`<p>If $X=(x_n)$ converges to $x$, then every subsequence $X'=(x_{n_k})$ of $X$ also converges to $x$.</p>`,
    intuition:`<p>A subsequence only removes terms and relabels the rest with new indices $k=1,2,\\ldots$ — it introduces no new, wilder terms. Once the ORIGINAL sequence is trapped near $x$ past some index, every surviving (relabelled) term is trapped too, just under a new name.</p>`,
    needs:['c.3.4.1','c.3.1.3'],
    traps:[
      `Thinking a subsequence could somehow converge to a DIFFERENT limit than the parent sequence — impossible once the parent converges.`,
      `Skipping the justification that $n_k\\ge k$ — this index-growth fact is the entire engine of the proof.`
    ],
    proof:{
      idea:`Show the same $K(\\varepsilon)$ from the original sequence's convergence still works for the relabelled subsequence, using that the $k$-th chosen index $n_k$ is never smaller than $k$.`,
      why:`A subsequence only removes terms and relabels the rest — it can't introduce any term that wasn't already trapped near $x$ once $n$ was large enough; the one thing to verify is that the relabelled indices keep pace with (or outrun) their new labels.`,
      rungs:[
        { why:`Start from what convergence of $X$ already gives us.`, m:`$$\\text{given }\\varepsilon>0,\\ \\exists K(\\varepsilon): n\\ge K(\\varepsilon) \\Rightarrow |x_n-x|<\\varepsilon$$` },
        { why:`Key fact about any strictly increasing sequence of indices: by induction, the $k$-th chosen index is never smaller than $k$ itself.`, m:`$$n_k \\ge k \\quad \\text{for all } k\\in\\mathbb{N}$$` },
        { why:`So once $k$ reaches $K(\\varepsilon)$, the corresponding original index $n_k$ has already reached $K(\\varepsilon)$ too, and the original bound applies.`, m:`$$k\\ge K(\\varepsilon) \\Rightarrow n_k\\ge k\\ge K(\\varepsilon) \\Rightarrow |x_{n_k}-x|<\\varepsilon$$` }
      ],
      ends:`The subsequence satisfies the same ε-K definition, with the same $\\varepsilon$ and $K$ — so it converges to $x$ as well.`
    },
    cards:[
      { q:`If $\\lim(x_n)=5$, what is $\\lim(x_{2n})$?`, a:`Also $5$ — every subsequence of a convergent sequence converges to the same limit.`, kind:'state' },
      { q:`What index fact drives the proof?`, a:`$n_k\\ge k$ for every $k$, since the indices are strictly increasing naturals.`, kind:'recall' },
      { q:`Trap: does this theorem say every subsequence converges (period)?`, a:`No — it only applies when the PARENT sequence already converges. A divergent sequence can still have convergent subsequences (see the divergence criteria).`, kind:'trap' }
    ]
  },

  { id:'c.3.4.5', bartle:'3.4.5', sec:'3.4', kind:'theorem', tier:'core',
    title:'Divergence Criteria (for sequences)',
    oneLine:'A sequence is divergent if it has two subsequences with different limits, or if it is unbounded.',
    statement:`<p>If a sequence $X=(x_n)$ has either of the following properties, then $X$ is divergent:</p>
      <p>(i) $X$ has two convergent subsequences $X'$ and $X''$ whose limits are not equal; or</p>
      <p>(ii) $X$ is unbounded.</p>`,
    intuition:`<p>(i) is just the contrapositive of <code>c.3.4.2</code>: since every subsequence of a convergent sequence must agree on the same limit, two subsequences disagreeing is proof by itself that no limit exists at all. (ii) uses that every convergent sequence is automatically bounded (its tail huddles near the limit, and the finitely many terms before that are trivially bounded) — so an unbounded sequence cannot possibly converge.</p>`,
    needs:['c.3.4.2'],
    traps:[
      `Thinking boundedness alone implies convergence — false; e.g. $((-1)^n)$ is bounded but divergent, caught only by criterion (i), not (ii).`,
      `Using criterion (ii) loosely ("it doesn't look like it's settling") instead of actually proving unboundedness.`
    ],
    proof:{
      idea:`Both parts reuse facts already established: (i) is the direct contrapositive of "all subsequences of a convergent sequence share its limit"; (ii) reuses that convergence forces the whole sequence to be bounded.`,
      why:`Both halves reuse facts already established: (i) is the direct contrapositive of <code>c.3.4.2</code>; (ii) reuses that convergence forces eventual closeness to a fixed number, which automatically caps the size of the whole sequence, leading terms included.`,
      rungs:[
        { why:`(i) If $X$ converged to some $x$, then by <code>c.3.4.2</code> every subsequence — including $X'$ and $X''$ — would have to converge to that same $x$.`, m:`$$X\\to x \\ \\Rightarrow\\ X'\\to x \\text{ and } X''\\to x$$` },
        { why:`But we are given two subsequences with DIFFERENT limits — contradiction, so $X$ cannot converge.`, m:`$$\\lim X' \\ne \\lim X'' \\ \\Rightarrow\\ \\text{no such } x \\text{ can exist}$$` },
        { why:`(ii) A convergent sequence eventually sits inside a fixed neighbourhood of its limit; the finitely many terms before that are automatically bounded (any finite set of numbers is bounded).`, m:`$$n\\ge K(1) \\Rightarrow |x_n-x|<1 \\Rightarrow |x_n|<|x|+1$$ $$M := \\max\\{|x_1|,\\ldots,|x_{K-1}|,\\ |x|+1\\}$$` },
        { why:`So convergent $\\Rightarrow$ bounded; taking the contrapositive gives unbounded $\\Rightarrow$ divergent.`, m:`$$\\text{unbounded} \\ \\Rightarrow\\ \\text{not convergent}$$` }
      ],
      ends:`Either mismatched subsequential limits or plain unboundedness is, alone, enough to certify divergence — without ever having to negate the ε-K definition directly.`
    },
    cards:[
      { q:`Name the two divergence criteria for sequences.`, a:`(i) two convergent subsequences with different limits; (ii) the sequence is unbounded.`, kind:'state' },
      { q:`Use a divergence criterion to show $((-1)^n)$ diverges.`, a:`The even-indexed subsequence is constantly $1\\to1$; the odd-indexed subsequence is constantly $-1\\to-1$; different limits, so by criterion (i) the sequence diverges.`, kind:'apply' },
      { q:`Trap: does a bounded sequence have to converge?`, a:`No — bounded is necessary but not sufficient; $((-1)^n)$ is bounded yet divergent.`, kind:'trap' }
    ]
  },

  { id:'c.3.4.7', bartle:'3.4.7', sec:'3.4', kind:'theorem', tier:'core',
    title:'Monotone Subsequence Theorem',
    oneLine:'Every sequence, however wild, hides a monotone subsequence inside it.',
    statement:`<p>If $X=(x_n)$ is a sequence of real numbers, then $X$ has a subsequence that is monotone (either increasing or decreasing).</p>`,
    intuition:`<p>Call a term $x_m$ a "peak" if no later term ever beats it ($x_m\\ge x_n$ for all $n\\ge m$). Either infinitely many peaks exist — string them together in order and you automatically get a decreasing subsequence, since each peak, being a peak, is at least as big as every later one including the next peak. Or only finitely many peaks exist, so past the last one, every term is eventually beaten by something later — chase that "something later, bigger" term over and over to build an increasing subsequence.</p>`,
    needs:['c.3.4.1'],
    traps:[
      `Assuming the monotone subsequence must be made of CONSECUTIVE terms — it can skip around arbitrarily; only its own index order needs to increase.`,
      `Mixing up which case (infinitely many peaks vs. finitely many) produces the decreasing vs. increasing subsequence.`
    ],
    proof:{
      idea:`Split into two cases by whether the sequence has infinitely many "peaks" (terms never later exceeded) or only finitely many; each case hands you a monotone subsequence directly.`,
      why:`This argument is purely combinatorial — no $\\varepsilon$'s needed — it is entirely about the ORDER structure of the sequence's terms.`,
      rungs:[
        { why:`Define what makes a term unbeatable from that point onward.`, m:`$$x_m \\text{ is a peak if } x_m \\ge x_n \\text{ for all } n\\ge m$$` },
        { why:`Case 1 — infinitely many peaks exist. List them in increasing order of index; being a peak means each one is $\\ge$ every later term, in particular the next peak.`, m:`$$x_{m_1}\\ge x_{m_2}\\ge x_{m_3}\\ge\\cdots \\quad\\text{(a decreasing subsequence)}$$` },
        { why:`Case 2 — only finitely many peaks exist. Start just past the last peak, where nothing is a peak any longer.`, m:`$$s_1 := (\\text{index after the last peak})$$` },
        { why:`"Not a peak" means, by definition, some strictly later term beats it. Chase that bigger term, then repeat the chase from there, forever.`, m:`$$x_{s_1}\\text{ not a peak} \\Rightarrow \\exists\\, s_2>s_1: x_{s_2}>x_{s_1} \\Rightarrow \\exists\\, s_3>s_2: x_{s_3}>x_{s_2} \\Rightarrow \\cdots$$` }
      ],
      ends:`Exactly one of the two cases must occur, and each produces a monotone subsequence. So every sequence, however chaotic, hides an increasing or decreasing thread inside it — the fact the Bolzano–Weierstrass Theorem builds on directly.`
    },
    cards:[
      { q:`Define a "peak" at index $m$.`, a:`$x_m$ is a peak if $x_m\\ge x_n$ for every $n\\ge m$ — no later term ever beats it.`, kind:'state' },
      { q:`If a sequence has infinitely many peaks, what kind of subsequence do they form?`, a:`A decreasing (non-increasing) subsequence, listed in index order.`, kind:'recall' },
      { q:`Trap: can a monotone subsequence skip non-consecutive terms of the original sequence?`, a:`Yes, and it usually must — monotone subsequences are rarely made of consecutive terms.`, kind:'trap' }
    ]
  },

  { id:'c.3.4.8', bartle:'3.4.8', sec:'3.4', kind:'theorem', tier:'core',
    title:'The Bolzano–Weierstrass Theorem',
    oneLine:'Every bounded sequence of real numbers has a convergent subsequence.',
    statement:`<p>A bounded sequence of real numbers has a convergent subsequence.</p>
      <p>Explicitly: if $X=(x_n)$ is a sequence in $\\mathbb{R}$ and there exists $M > 0$ such that $|x_n| \\le M$ for all $n \\in \\mathbb{N}$, then there exists a subsequence $X'=(x_{n_k})$ of $X$ and a real number $x^* \\in \\mathbb{R}$ such that:
      $$\\lim_{k\\to\\infty} x_{n_k} = x^*$$</p>`,
    intuition:`<p>A bounded sequence lives inside some fixed interval $[a,b]$ forever. The Monotone Subsequence Theorem (<code>c.3.4.7</code>) already guarantees SOME monotone subsequence hides inside any sequence at all; that subsequence, being monotone AND trapped inside $[a,b]$, has nowhere left to run off to — it must settle down to a limit. (This "monotone + bounded $\\Rightarrow$ convergent" fact is the Monotone Convergence Theorem of §3.3, and it is itself ultimately a consequence of the Completeness Property <code>c.2.3.6</code>: a bounded increasing sequence converges to its own supremum.)</p>`,
    needs:['c.3.4.7','c.3.3.2'],
    figs:['fig.bw'],
    traps:[
      `Thinking Bolzano–Weierstrass says the WHOLE sequence converges — it doesn't. A bounded sequence can still diverge overall (e.g. $((-1)^n)$) while having convergent subsequences (here, to $-1$ and to $+1$).`,
      `Forgetting boundedness is essential — an unbounded sequence (e.g. $(n)$) can fail to have ANY convergent subsequence at all.`,
      `Citing the theorem without being able to say WHICH subsequence or WHERE the limit lands — Chapter 5 applications often need this extra tracking (e.g. showing the limit point lands back inside $[a,b]$).`
    ],
    proof:{
      idea:`Combine two already-proved facts: (1) any sequence has a monotone subsequence (<code>c.3.4.7</code>); (2) a monotone sequence that is also bounded must converge (Monotone Convergence Theorem, §3.3 — ultimately a consequence of the Completeness Property <code>c.2.3.6</code>). Chain them together.`,
      why:`Monotonicity alone doesn't guarantee convergence (an increasing sequence can run off to $+\\infty$); boundedness alone doesn't either (a sequence can wander forever inside a bounded interval without settling, e.g. $((-1)^n)$). It's the COMBINATION that traps a sequence into settling at a single value, and completeness is exactly what gives "no room left to run" real teeth: a bounded increasing sequence converges to its supremum.`,
      rungs:[
        { why:`Start from what we already proved about the ORDER of any sequence — it always hides a monotone thread inside it.`, m:`$$X=(x_n) \\text{ bounded} \\ \\Rightarrow\\ X \\text{ has a monotone subsequence } X'=(x_{n_k}) \\quad\\text{(by Monotone Subsequence Thm, §3.4)}$$` },
        { why:`A subsequence of a bounded sequence is still bounded — you have only removed terms, never added any wilder new ones.`, m:`$$|x_n|\\le M\\ \\forall n \\ \\Rightarrow\\ |x_{n_k}|\\le M\\ \\forall k$$` },
        { why:`Now $X'$ is BOTH monotone and bounded — exactly the hypothesis of the Monotone Convergence Theorem, whose proof is where completeness actually gets used: a bounded increasing sequence converges to its supremum.`, m:`$$X' \\text{ monotone} + \\text{bounded} \\ \\Rightarrow\\ X' \\text{ converges} \\quad\\text{(Monotone Convergence Thm, §3.3, via Completeness, §2.3)}$$` },
        { why:`That convergent $X'$ IS a subsequence of the original $X$ — exactly what we set out to find.`, m:`$$\\therefore\\ X \\text{ has a convergent subsequence } X'$$` }
      ],
      ends:`Every bounded sequence — no matter how wildly it oscillates — has at least one subsequence that settles down to a genuine limit. This is the single fact Chapter 5 leans on hardest, to guarantee that a continuous function on a closed bounded interval actually attains a maximum and a minimum (rather than merely approaching one).`
    },
    cards:[
      { q:`State the Bolzano–Weierstrass Theorem.`, a:`Every bounded sequence of real numbers has a convergent subsequence.`, kind:'state' },
      { q:`Which two earlier results does the proof chain together?`, a:`The Monotone Subsequence Theorem (<code>c.3.4.7</code>) and the Monotone Convergence Theorem (§3.3, itself resting on completeness <code>c.2.3.6</code>).`, kind:'recall' },
      { q:`Find a convergent subsequence of $x_n=(-1)^n+1/n$.`, a:`The even-indexed subsequence $x_{2n}=1+1/(2n)\\to1$ converges (also the odd-indexed one converges to $-1$).`, kind:'apply' },
      { q:`Trap: does Bolzano–Weierstrass mean $((-1)^n)$ converges?`, a:`No — the theorem only guarantees SOME subsequence converges, not the whole sequence; $((-1)^n)$ itself is divergent, but its even and odd subsequences each converge.`, kind:'trap' }
    ]
  },

  { id:'c.4.1.1', bartle:'4.1.1', sec:'4.1', kind:'definition', tier:'core',
    title:'Cluster point of a set',
    oneLine:'c is a cluster point of A if points of A other than c itself pile up arbitrarily close to c.',
    statement:`<p>Let $A\\subseteq\\mathbb{R}$. A point $c\\in\\mathbb{R}$ is a <b>cluster point</b> of $A$ if for every $\\delta>0$ there exists at least one point $x\\in A$, $x\\ne c$, such that $|x-c|<\\delta$.</p>`,
    intuition:`<p>Points of $A$, excluding $c$ itself, must get arbitrarily close to $c$. Notice $c$ does NOT need to belong to $A$ at all — and even if $c\\in A$, its own membership is ignored when deciding whether it's a cluster point.</p>
      <p><b>Worked micro-example:</b> $A=(0,1)$. Every point of $[0,1]$ is a cluster point of $A$ — including the endpoints $0$ and $1$, even though neither belongs to $A$. By contrast, $A=\\{1,2\\}$ has NO cluster points: pick $\\delta=1/2$ around either point and no other point of $A$ falls within $\\delta$.</p>`,
    needs:['s.abs-ineq','s.quantifier'],
    traps:[
      `Assuming $c$ must belong to $A$ to be a cluster point of $A$ — false; e.g. $0,1$ are cluster points of $(0,1)$ without being members.`,
      `Assuming EVERY point of $A$ is automatically a cluster point of $A$ — false for isolated points, e.g. none of the points $1/n$ is a cluster point of $\\{1/n : n\\in\\mathbb{N}\\}$; only $0$ is (and $0\\notin A$).`
    ],
    cards:[
      { q:`Define "cluster point of A" in your own words.`, a:`A point that points of $A$ (other than itself) get arbitrarily close to — every neighbourhood of it contains some point of $A$ different from itself.`, kind:'state' },
      { q:`Is $1$ a cluster point of $A=\\{1,2\\}$?`, a:`No — a small enough neighbourhood of $1$ (e.g. radius $1/2$) contains no other point of $A$.`, kind:'apply' },
      { q:`Trap: is $0$ a cluster point of $A=\\{1/n : n\\in\\mathbb{N}\\}$, even though $0\\notin A$?`, a:`Yes — cluster points need not belong to the set; the terms $1/n$ pile up arbitrarily close to $0$.`, kind:'trap' }
    ]
  },

  { id:'c.4.1.4', bartle:'4.1.4', sec:'4.1', kind:'definition', tier:'core',
    title:'The ε-δ definition of the limit of a function',
    oneLine:'f has limit L at c if, for any output-tolerance ε, some input-tolerance δ guarantees every nearby x lands f(x) within ε of L.',
    statement:`<p>Let $A\\subseteq\\mathbb{R}$, let $c$ be a cluster point of $A$, and let $f:A\\to\\mathbb{R}$. A number $L$ is the <b>limit of $f$ at $c$</b>, written $\\lim_{x\\to c}f(x)=L$, if for every $\\varepsilon>0$ there exists $\\delta>0$ such that $x\\in A$ and $0<|x-c|<\\delta$ implies $|f(x)-L|<\\varepsilon$.</p>`,
    intuition:`<p>You get to demand any output-tolerance $\\varepsilon$ you like; the definition promises you can always find an input-tolerance $\\delta$ so that every $x\\in A$ within $\\delta$ of $c$ (but NOT equal to $c$ — that's what "$0<|x-c|$" enforces) lands $f(x)$ within $\\varepsilon$ of $L$. Since $x=c$ is deliberately excluded, $f$ need not even be defined at $c$, and even when it is, $f(c)$'s value is completely irrelevant to the limit.</p>
      <p><b>Worked micro-example:</b> $\\lim_{x\\to c}x^2=c^2$. Given $\\varepsilon>0$, one valid choice is $\\delta:=\\min\\{1,\\ \\varepsilon/(2|c|+1)\\}$: whenever $|x-c|<\\delta\\le1$, $|x+c|<2|c|+1$, so $|x^2-c^2|=|x+c||x-c|<(2|c|+1)\\cdot\\delta\\le\\varepsilon$.</p>`,
    needs:['c.4.1.1','s.abs-ineq','s.quantifier'],
    traps:[
      `Forgetting $c$ must be a cluster point of $A$ — the definition is meaningless (or vacuous) at an isolated point of $A$.`,
      `Dropping the "$0<|x-c|$" and accidentally requiring something about $f(c)$ itself — the limit never depends on $f(c)$, only on nearby values.`,
      `Confusing which variable depends on which — $\\delta$ depends on $\\varepsilon$ (and possibly $c$), never the reverse; writing "$\\delta:=\\varepsilon$" without actually checking it controls $|f(x)-L|$.`
    ],
    cards:[
      { q:`State the ε-δ definition of $\\lim_{x\\to c}f(x)=L$.`, a:`For every $\\varepsilon>0$ there exists $\\delta>0$ such that $x\\in A,\\ 0<|x-c|<\\delta \\Rightarrow |f(x)-L|<\\varepsilon$.`, kind:'state' },
      { q:`Why does the definition require $0<|x-c|$ rather than just $|x-c|<\\delta$?`, a:`To exclude $x=c$ itself, since the limit describes behaviour NEAR $c$, not at $c$ — $f$ need not even be defined there.`, kind:'recall' },
      { q:`Find a valid $\\delta$ for $\\lim_{x\\to c}x^2=c^2$ given $\\varepsilon>0$.`, a:`$\\delta:=\\min\\{1,\\ \\varepsilon/(2|c|+1)\\}$.`, kind:'apply' }
    ]
  },

  { id:'c.4.1.8', bartle:'4.1.8', sec:'4.1', kind:'theorem', tier:'core',
    title:'Sequential Criterion for Limits',
    oneLine:'f has limit L at c exactly when every sequence approaching c (avoiding c itself) has images approaching L.',
    statement:`<p>Let $f:A\\to\\mathbb{R}$ and let $c$ be a cluster point of $A$. The following are equivalent:</p>
      <p>(i) $\\lim_{x\\to c}f(x)=L$.</p>
      <p>(ii) For every sequence $(x_n)$ in $A$ with $x_n\\ne c$ for all $n$, and $\\lim(x_n)=c$, the image sequence $(f(x_n))$ converges to $L$.</p>`,
    intuition:`<p>The $\\varepsilon$-$\\delta$ definition talks about ALL $x$ near $c$ at once, directly. The sequential version says exactly the same thing using only sequences — which lets you reuse everything already proved about sequence limits (uniqueness, divergence criteria, algebra of limits) to attack function limits, and gives the single best tool for PROVING a function limit does NOT exist: just exhibit one bad sequence whose images misbehave.</p>`,
    needs:['c.4.1.4','c.3.1.3','c.4.1.1'],
    traps:[
      `Using the criterion with only ONE "good" sequence to try to PROVE a limit exists — one sequence behaving well proves nothing; the criterion needs EVERY valid sequence to behave.`,
      `To prove a limit does NOT exist, forgetting that just ONE bad sequence is enough — no need to check all of them in that direction.`,
      `Forgetting the requirement $x_n\\ne c$ in the hypothesis sequence, or (in the harder direction) forgetting to check the constructed sequence actually stays inside $A$ and genuinely converges to $c$.`
    ],
    proof:{
      idea:`Two directions. (⇒) is direct substitution: feed the $\\delta$ from the function-limit definition into the $K$ that comes from the sequence's own convergence to $c$. (⇐) is the harder direction, proved by contrapositive: assume the function limit FAILS, build one explicit bad sequence using shrinking $1/n$-neighbourhoods, and show it breaks the hypothesis.`,
      rungs:[
        { why:`(⇒) Assume $\\lim_{x\\to c}f=L$; take ANY sequence $(x_n)$ in $A\\setminus\\{c\\}$ with $(x_n)\\to c$. We must show $(f(x_n))\\to L$. Start from the $\\varepsilon$-$\\delta$ promise.`, m:`$$\\text{given }\\varepsilon>0,\\ \\exists\\delta>0: x\\in A,\\ 0<|x-c|<\\delta \\Rightarrow |f(x)-L|<\\varepsilon$$` },
        { why:`Now use $(x_n)\\to c$: feed THIS $\\delta$ into the sequence\'s own convergence to $c$ to get an index $K$ that traps $x_n$ within $\\delta$ of $c$.`, m:`$$(x_n)\\to c \\ \\Rightarrow\\ \\exists K(\\delta): n\\ge K(\\delta) \\Rightarrow |x_n-c|<\\delta$$` },
        { why:`Combine: past $K$, $x_n$ is within $\\delta$ of $c$ (and $\\ne c$ by hypothesis), so the $\\delta$-promise from step 1 fires and controls $f(x_n)$.`, m:`$$n\\ge K(\\delta) \\ \\Rightarrow\\ 0<|x_n-c|<\\delta \\ \\Rightarrow\\ |f(x_n)-L|<\\varepsilon$$` },
        { why:`(⇐) Prove the CONTRAPOSITIVE instead: assume $f$ does NOT have limit $L$ at $c$, and construct one specific bad sequence. Negating "$\\forall\\varepsilon\\,\\exists\\delta\\ldots$" means one bad $\\varepsilon_0$ defeats every $\\delta$.`, m:`$$\\exists\\,\\varepsilon_0>0:\\ \\forall\\delta>0,\\ \\exists x_\\delta\\in A,\\ 0<|x_\\delta-c|<\\delta,\\ |f(x_\\delta)-L|\\ge\\varepsilon_0$$` },
        { why:`Apply this with $\\delta=1/n$ for each $n\\in\\mathbb{N}$ — one bad point per shrinking neighbourhood — to manufacture a whole sequence.`, m:`$$\\forall n\\in\\mathbb{N},\\ \\exists x_n\\in A,\\ 0<|x_n-c|<1/n,\\ |f(x_n)-L|\\ge\\varepsilon_0$$` },
        { why:`Check this sequence really does converge to $c$ (the $1/n$ bound forces it, by squeeze), while its image sequence provably never gets close to $L$.`, m:`$$(x_n)\\to c, \\quad\\text{but } (f(x_n))\\not\\to L \\quad(\\text{since } |f(x_n)-L|\\ge\\varepsilon_0 \\text{ always})$$` }
      ],
      ends:`We've shown: no function limit $\\Rightarrow$ some bad sequence exists (the contrapositive of (⇐)). Combined with the direct (⇒) direction, the $\\varepsilon$-$\\delta$ limit and "every valid sequence has the right image limit" are exactly equivalent statements.`
    },
    cards:[
      { q:`State the Sequential Criterion for Limits.`, a:`$\\lim_{x\\to c}f(x)=L$ iff for every sequence $(x_n)$ in $A\\setminus\\{c\\}$ with $(x_n)\\to c$, the image sequence $(f(x_n))\\to L$.`, kind:'state' },
      { q:`To prove $\\lim_{x\\to c}f(x)\\ne L$, how many sequences do you need to check, and how many do you need to exhibit?`, a:`You need it to fail for at least one sequence (so exhibiting ONE bad sequence suffices) — but to prove it DOES equal $L$, you need it to hold for EVERY valid sequence, which the $\\varepsilon$-$\\delta$ definition (or a general argument) must establish.`, kind:'recall' },
      { q:`How does the (⇐) direction construct its bad sequence?`, a:`It uses the negation of the $\\varepsilon$-$\\delta$ definition with a single fixed $\\varepsilon_0$, then plugs in $\\delta=1/n$ for each $n$ to get points $x_n\\to c$ whose images stay $\\ge\\varepsilon_0$ from $L$.`, kind:'apply' }
    ]
  },

  { id:'c.4.1.9', bartle:'4.1.9', sec:'4.1', kind:'theorem', tier:'core',
    title:'Divergence Criteria (for functions)',
    oneLine:'To disprove a function limit, exhibit one sequence heading to c whose images misbehave.',
    statement:`<p>Let $f:A\\to\\mathbb{R}$ and let $c$ be a cluster point of $A$.</p>
      <p>(a) $f$ does NOT have limit $L$ at $c$ if and only if there is a sequence $(x_n)$ in $A$, $x_n\\ne c$, with $(x_n)\\to c$, such that $(f(x_n))$ does not converge to $L$.</p>
      <p>(b) $f$ has no limit at all at $c$ if and only if there is such a sequence $(x_n)\\to c$ for which $(f(x_n))$ does not converge in $\\mathbb{R}$ at all.</p>`,
    intuition:`<p>This is simply the Sequential Criterion (<code>c.4.1.8</code>) read backwards, turned into a practical recipe. Instead of fighting the $\\varepsilon$-$\\delta$ definition head-on to show a limit fails, build ONE concrete sequence heading to $c$ whose images misbehave — that alone is a complete proof.</p>
      <p><b>Worked micro-example:</b> $\\lim_{x\\to0}\\sin(1/x)$ does not exist. Take $x_n=1/(n\\pi)\\to0$, giving $\\sin(1/x_n)=0$ always; and $y_n=1/(\\pi/2+2n\\pi)\\to0$, giving $\\sin(1/y_n)=1$ always. Two sequences heading to the same point $0$, but different image limits ($0$ vs $1$) — so by part (b), no limit exists.</p>`,
    needs:['c.4.1.8'],
    traps:[
      `Using a sequence that doesn't actually satisfy $x_n\\ne c$, or doesn't actually converge to $c$ — invalidates the whole argument.`,
      `Showing $f(x_n)$ diverges for one sequence and then worrying you haven't "checked enough" sequences — for DISPROVING a limit, one bad sequence is sufficient; there's no need to check all of them.`
    ],
    proof: {
      idea: 'Negate the Sequential Criterion for Function Limits (Theorem 4.1.8).',
      why: 'By Theorem 4.1.8, $\\lim_{x\\to c} f(x) = L$ holds if and only if every punctured sequence $x_n \\to c$ satisfies $f(x_n) \\to L$.',
      rungs: [
        { why: 'State the Sequential Criterion (c.4.1.8): $\\lim_{x\\to c} f(x) = L$ iff for all sequences $(x_n)$ in $A \\setminus \\{c\\}$ with $x_n \\to c$, $f(x_n) \\to L$.', m: '\\lim_{x\\to c} f(x) = L \\iff (\\forall (x_n) \\subseteq A\\setminus\\{c\\},\\, x_n \\to c \\implies f(x_n) \\to L)' },
        { why: 'Negate the equivalence for part (a): $\\lim_{x\\to c} f(x) \\ne L$ if and only if there is at least one sequence $(x_n)$ with $x_n \\to c$ but $f(x_n) \\not\\to L$.', m: '\\lim_{x\\to c} f(x) \\ne L \\iff \\exists (x_n) \\subseteq A\\setminus\\{c\\}: x_n \\to c \\text{ and } f(x_n) \\not\\to L' },
        { why: 'For part (b), $f$ has no limit in $\\mathbb{R}$ at all if and only if no candidate $L$ works; either some $(f(x_n))$ diverges entirely, or two sequences produce distinct limits.', m: '\\exists (x_n) \\subseteq A\\setminus\\{c\\}: x_n \\to c \\text{ and } (f(x_n)) \\text{ diverges in } \\mathbb{R}' }
      ],
      ends: 'Thus a single bad sequence is necessary and sufficient to disprove the existence of a limit.'
    },
    cards:[
      { q:`To show $f$ has no limit at $c$, how many sequences suffice, and what must they satisfy?`, a:`One sequence $(x_n)$ in $A\\setminus\\{c\\}$ with $(x_n)\\to c$ but $(f(x_n))$ not converging (or two such sequences converging to different image limits) is enough.`, kind:'state' },
      { q:`Show $\\lim_{x\\to0}\\sin(1/x)$ does not exist, using two sequences.`, a:`$x_n=1/(n\\pi)\\to0$ gives $f(x_n)=0\\to0$; $y_n=1/(\\pi/2+2n\\pi)\\to0$ gives $f(y_n)=1\\to1$. Different image limits from sequences converging to the same point, so no limit exists.`, kind:'apply' },
      { q:`Trap: does disproving convergence for one sequence prove the limit exists and equals something else?`, a:`No — it only proves the limit is NOT that particular candidate value (or does not exist at all, per part (b)); it says nothing else about what, if anything, the limit could be.`, kind:'trap' }
    ]
  }
);

  { id:'c.2.4.3', bartle:'2.4.3', sec:'2.4', kind:'theorem', tier:'core',
    title:'The Archimedean Property',
    oneLine:'No real number is larger than every natural number — the naturals climb without limit.',
    statement:`<p><b>The Archimedean Property:</b> If $x\\in\\mathbb{R}$, then there exists $n_x\\in\\mathbb{N}$ such that $x\\le n_x$. Equivalently, the subset $\\mathbb{N}$ of natural numbers is not bounded above in $\\mathbb{R}$.</p>
      <p><b>Fundamental Corollaries (Equivalent Forms):</b></p>
      <p>• <b>(2.4.4) Infimum of Reciprocals:</b> If $S = \\{1/n : n \\in \\mathbb{N}\\}$, then $\\inf S = 0$.</p>
      <p>• <b>(2.4.5) Arbitrarily Small Reciprocals:</b> If $t > 0$, there exists $n_t \\in \\mathbb{N}$ such that $0 < \\dfrac{1}{n_t} < t$.</p>
      <p>• <b>(2.4.6) Squeeze Between Consecutive Integers:</b> If $y > 0$, there exists a unique natural number $n_y \\in \\mathbb{N}$ such that $n_y - 1 \\le y < n_y$.</p>`,
    intuition:`<p>However far out on the real line you point, the natural numbers $1,2,3,\\ldots$ eventually walk past that point. This looks obvious from a picture of the number line, but it cannot be proved from the algebraic and order axioms of $\\mathbb{R}$ alone — it genuinely needs the Completeness Property, together with the fact that $\\mathbb{N}$ is closed under adding $1$ (the Inductive Property).</p>
      <p><b>Worked micro-example:</b> given $x=1{,}000{,}000.5$, simply take $n_x=1{,}000{,}001\\in\\mathbb{N}$; the content of the theorem is that SOME such natural number always exists for every real $x$, not that a specific one is always easy to name.</p>`,
    needs:['c.2.3.2','c.2.3.6','s.contradiction'],
    traps:[
      `Treating this as "obvious" and therefore free of proof — it genuinely requires the Completeness Property; without completeness, an ordered field could contain elements bigger than every natural number.`,
      `Forgetting the Inductive Property of $\\mathbb{N}$ (if $m\\in\\mathbb{N}$ then $m+1\\in\\mathbb{N}$) is doing real work in the proof — it is what turns "$u-1$ is not an upper bound" into an actual contradiction.`
    ],
    proof:{
      idea:`Suppose, for contradiction, that some real number $x$ IS an upper bound for the whole of $\\mathbb{N}$. Then $\\mathbb{N}$ is a bounded-above set, so Completeness hands us its supremum $u$ — and $u-1$, being smaller than the least upper bound, must fail to be an upper bound, forcing a natural number past $u$ itself.`,
      why:`The proof is a single application of the Completeness Property to the specific set $\\mathbb{N}$: a number just below the supremum must be beaten by some element of the set, and here that margin is fixed at exactly $1$ so the Inductive Property can finish the job.`,
      rungs:[
        { why:`Negate the claim: suppose some real number $x$ IS an upper bound for the whole set $\\mathbb{N}$.`, m:`$$n\\le x \\ \\text{ for all } n\\in\\mathbb{N}$$` },
        { why:`Then $\\mathbb{N}$ is a nonempty subset of $\\mathbb{R}$ bounded above, so the Completeness Property applies.`, m:`$$u:=\\sup\\mathbb{N} \\text{ exists in } \\mathbb{R}$$` },
        { why:`$u-1$ is strictly smaller than the LEAST upper bound $u$, so it cannot itself be an upper bound of $\\mathbb{N}$.`, m:`$$u-1<u \\ \\Rightarrow\\ u-1 \\text{ is not an upper bound of } \\mathbb{N}$$` },
        { why:`"Not an upper bound" means some natural number slips past it.`, m:`$$\\exists\\, m\\in\\mathbb{N}: u-1 < m$$` },
        { why:`But $\\mathbb{N}$ is closed under $+1$ (Inductive Property), so $m+1$ is also a natural number — and it beats $u$.`, m:`$$m+1\\in\\mathbb{N}, \\qquad u < m+1$$` },
        { why:`This contradicts step 2: $u$ was supposed to be an upper bound of $\\mathbb{N}$, yet $m+1\\in\\mathbb{N}$ exceeds it.`, m:`$$u < m+1,\\ m+1\\in\\mathbb{N} \\ \\Rightarrow\\Leftarrow$$` }
      ],
      ends:`The assumption is impossible, so no real number bounds $\\mathbb{N}$ above — equivalently, for every $x\\in\\mathbb{R}$ there is some $n_x\\in\\mathbb{N}$ with $x\\le n_x$. This single fact drives every "choose $n$ large enough" argument later in the course, including $1/n\\to0$ and the density of $\\mathbb{Q}$ in $\\mathbb{R}$.`
    },
    cards:[
      { q:`State the Archimedean Property.`, a:`For every $x\\in\\mathbb{R}$ there exists $n_x\\in\\mathbb{N}$ with $x\\le n_x$ — i.e. $\\mathbb{N}$ is unbounded above.`, kind:'state' },
      { q:`What TWO facts about $\\mathbb{R}$ and $\\mathbb{N}$ does the proof combine?`, a:`The Completeness Property (to get $\\sup\\mathbb{N}$) and the Inductive Property of $\\mathbb{N}$ (to turn "$m$ beats $u-1$" into "$m+1$ beats $u$").`, kind:'recall' },
      { q:`Trap: is the Archimedean Property provable from the field and order axioms of $\\mathbb{R}$ alone?`, a:`No — it needs the Completeness Property; $\\mathbb{Q}$ itself is Archimedean too, so this specific property doesn't distinguish $\\mathbb{R}$ from $\\mathbb{Q}$, but the PROOF given here leans on completeness.`, kind:'trap' }
    ]
  },

  { id:'c.2.4.8', bartle:'2.4.8', sec:'2.4', kind:'theorem', tier:'core',
    title:'The Density Theorem (Rationals in ℝ)',
    oneLine:'Between any two distinct real numbers, however close, there is a rational number.',
    statement:`<p>If $x$ and $y$ are real numbers with $x < y$, then there exists a rational number $r \\in \\mathbb{Q}$ such that:
      $$x < r < y$$
      Consequently, between any two distinct real numbers there are infinitely many rational numbers; the set $\\mathbb{Q}$ is <b>dense</b> in $\\mathbb{R}$.</p>`,
    intuition:`<p>No matter how close together two numbers are — even $0.000000001$ apart — the rational fractions are so densely packed on the real line that at least one fraction (and in fact infinitely many) falls right into that gap.</p>
      <p>The trick: make the denominator $n$ large enough so the step size $1/n$ is strictly narrower than the gap $y - x$ (using Archimedean Corollary 2.4.5). Then the integer multiples $m/n$ march across the line with steps smaller than the gap, so at least one multiple $m/n$ is guaranteed to step right into $(x, y)$!</p>`,
    needs:['c.2.4.3','c.2.3.6'],
    traps:[
      `Confusing density with uncountability: $\\mathbb{Q}$ is dense in $\\mathbb{R}$, yet $\\mathbb{Q}$ is countable while $\\mathbb{R}$ is uncountable!`,
      `Forgetting that the theorem guarantees INFINITELY many rationals between $x$ and $y$, not just one.`
    ],
    proof:{
      idea:`Choose denominator $n$ so $1/n < y - x$, ensuring $ny - nx > 1$. Then the interval $(nx, ny)$ has length $> 1$, so it must contain an integer $m$. Then $r = m/n$ satisfies $x < r < y$.`,
      why:`An interval of length greater than $1$ must contain at least one integer. Scaling the gap $(x, y)$ by $n$ expands it to length $> 1$, and Corollary 2.4.6 provides the integer $m$.`,
      rungs:[
        { why:`Assume without loss of generality $x > 0$ (if $x \\le 0$, shift by an integer). Since $y - x > 0$, Corollary 2.4.5 supplies a denominator $n$.`, m:`$$y - x > 0 \\implies \\exists\\, n \\in \\mathbb{N}: \\frac{1}{n} < y - x \\iff nx + 1 < ny$$` },
        { why:`Apply Corollary 2.4.6 to $nx > 0$ to get the integer $m$ just above $nx$.`, m:`$$\\exists\\, m \\in \\mathbb{N}: m - 1 \\le nx < m$$` },
        { why:`From $m - 1 \\le nx$, we have $m \\le nx + 1$. Combine with $nx + 1 < ny$.`, m:`$$nx < m \\le nx + 1 < ny \\implies nx < m < ny$$` },
        { why:`Divide through by $n > 0$ to obtain the desired rational $r = m/n$.`, m:`$$x < \\frac{m}{n} < y \\implies r := \\frac{m}{n} \\in \\mathbb{Q} \\text{ with } x < r < y$$` }
      ],
      ends:`The rational $r = m/n$ lies strictly between $x$ and $y$. Repeating this process yields infinitely many rationals in $(x, y)$.`
    },
    cards:[
      { q:`State the Density Theorem for rational numbers.`, a:`If $x, y \\in \\mathbb{R}$ with $x < y$, there exists a rational number $r \\in \\mathbb{Q}$ such that $x < r < y$.`, kind:'state' },
      { q:`How is the denominator $n$ chosen in the proof of the Density Theorem?`, a:`By the Archimedean property such that $1/n < y - x$, so that $ny - nx > 1$.`, kind:'recall' },
      { q:`Trap: does density of a set imply that it is uncountable?`, a:`No — $\\mathbb{Q}$ is dense in $\\mathbb{R}$ but is countable.`, kind:'trap' }
    ]
  },

  { id:'c.2.4.9', bartle:'2.4.9', sec:'2.4', kind:'corollary', tier:'core',
    title:'Density of the irrationals in ℝ',
    oneLine:'Between any two distinct real numbers, however close, sits an irrational number.',
    statement:`<p>If $x,y\\in\\mathbb{R}$ with $x < y$, then there exists an irrational number $z$ such that $x < z< y$.</p>`,
    intuition:`<p>Bartle's Density Theorem (2.4.8) says the RATIONALS are dense in $\\mathbb{R}$: between any two reals sits a rational. This corollary says the irrationals are equally dense — the trick is to use a known irrational number ($\\sqrt2$) as a "yardstick" that converts one density statement into the other by scaling.</p>
      <p><b>Worked micro-example:</b> for $x=0$, $y=0.001$, apply the argument to $x/\\sqrt2=0$ and $y/\\sqrt2\\approx0.000707$ to get a rational $r$ in between (e.g. $r=0.0005$), giving the irrational $z=r\\sqrt2\\approx0.000707\\in(0,0.001)$.</p>`,
    needs:['c.2.4.8','c.2.4.3','s.contradiction'],
    traps:[
      `Assuming density of $\\mathbb{Q}$ automatically hands you density of the irrationals for free — it needs an actual argument (dividing by an irrational such as $\\sqrt2$), not just "there are more irrationals so obviously".`,
      `Forgetting to check the constructed $z=r\\sqrt2$ really is irrational — a NONZERO rational times an irrational number is always irrational, which is why $r\\ne0$ must be arranged.`
    ],
    proof:{
      idea:`Divide the whole problem by the known irrational $\\sqrt2$, apply the (already established) Density Theorem to find a rational in the rescaled gap, then multiply back through by $\\sqrt2$.`,
      why:`Scaling by $\\sqrt2$ turns "find an irrational between $x$ and $y$" into "find a rational between $x/\\sqrt2$ and $y/\\sqrt2$" — a problem the Density Theorem already solves, and multiplying a nonzero rational by $\\sqrt2$ always lands back on an irrational.`,
      rungs:[
        { why:`Rescale the target gap by the known irrational $\\sqrt2$ (Bartle 2.4.7).`, m:`$$\\frac{x}{\\sqrt2} < \\frac{y}{\\sqrt2}$$` },
        { why:`The Density Theorem (rationals dense in $\\mathbb{R}$) supplies a rational strictly between these rescaled endpoints; it can be taken nonzero since the gap contains infinitely many rationals.`, m:`$$\\exists\\, r\\in\\mathbb{Q},\\ r\\ne0:\\quad \\frac{x}{\\sqrt2} < r < \\frac{y}{\\sqrt2}$$` },
        { why:`Multiply back through by $\\sqrt2>0$ (positive, so the inequalities survive) to return to the original scale.`, m:`$$x < r\\sqrt2 < y$$` },
        { why:`Check $z:=r\\sqrt2$ is genuinely irrational: a nonzero rational times an irrational is always irrational.`, m:`$$z:=r\\sqrt2 \\ \\text{is irrational}, \\qquad x < z< y$$` }
      ],
      ends:`The irrationals are packed into $\\mathbb{R}$ just as densely as the rationals are — between any two reals, both a rational AND an irrational can always be found.`
    },
    cards:[
      { q:`State the density-of-irrationals corollary.`, a:`If $x < y$ are real numbers, there exists an irrational $z$ with $x < z< y$.`, kind:'state' },
      { q:`What known irrational number does the proof scale by, and why?`, a:`$\\sqrt2$ — dividing by it converts "find an irrational between $x,y$" into "find a rational between $x/\\sqrt2,\\,y/\\sqrt2$", which the Density Theorem already solves.`, kind:'recall' },
      { q:`Trap: why must the rational $r$ found be nonzero?`, a:`Because $r\\sqrt2$ is irrational only when $r\\ne0$ — if $r=0$ then $r\\sqrt2=0$ is rational, ruining the construction.`, kind:'trap' }
    ]
  },

  { id:'c.2.5.1', bartle:'2.5.1', sec:'2.5', kind:'theorem', tier:'core',
    title:'Characterization Theorem for intervals',
    oneLine:'A set with at least two points is an interval exactly when it contains every point squeezed between any two of its own points.',
    statement:`<p>Let $S\\subseteq\\mathbb{R}$ contain at least two points, with the property: if $x,y\\in S$ and $x < y$, then $[x,y]\\subseteq S$. Then $S$ is an interval.</p>`,
    intuition:`<p>This is the precise version of the everyday idea "an interval has no gaps": if two points belong to $S$, then EVERY point squeezed between them belongs too. What's surprising is the converse direction actually proved here — this "no gaps" property alone, with no reference to endpoints at all, is enough to force $S$ to be one of the familiar interval shapes.</p>
      <p><b>Worked micro-example:</b> $S=\\{x\\in\\mathbb{Q}: 0\\le x<1\\}$ (rationals only) satisfies "if $x,y\\in S,\\,x < y$" only vacuously in a misleading sense — actually it FAILS the hypothesis, since e.g. $[0,1/2]\\not\\subseteq S$ (irrationals in between are missing). This is why $S$ is not an interval, matching intuition.</p>`,
    needs:['c.2.3.1','c.2.3.2','s.interval'],
    traps:[
      `Thinking the defining property needs checking against points OUTSIDE $S$ — it doesn't; it only says that segments BETWEEN two points of $S$ must lie back inside $S$.`,
      `Forgetting the theorem covers unbounded intervals too — the bounded case (using $\\inf S,\\sup S$) is only one of four cases; boundedness above/below only, or neither, use $\\pm\\infty$ in place of a finite endpoint.`
    ],
    proof:{
      idea:`Handle the bounded case: set $a:=\\inf S$, $b:=\\sup S$; show every point strictly between $a$ and $b$ must already lie in $S$, then pin down which of the four interval shapes $S$ actually is depending on whether the endpoints belong.`,
      why:`Both $a$ and $b$ are LEAST/GREATEST bounds, so anything strictly between them fails to be a bound at all — which forces points of $S$ on both sides of it, and the "no gaps" hypothesis does the rest.`,
      rungs:[
        { why:`Bounded case: name the infimum and supremum; this immediately traps $S$ inside $[a,b]$.`, m:`$$a:=\\inf S,\\ b:=\\sup S \\ \\Rightarrow\\ S\\subseteq[a,b]$$` },
        { why:`Take any $z$ strictly between $a$ and $b$. Since $a$ is the GREATEST lower bound, anything bigger than it fails to be a lower bound — so some point of $S$ sits below $z$; symmetrically for $b$ and a point above $z$.`, m:`$$a < z<b \\ \\Rightarrow\\ \\exists x\\in S: x < z, \\quad \\exists y\\in S: z < y$$` },
        { why:`Now $x < z< y$ with $x,y\\in S$ — the hypothesis (property (1)) forces the WHOLE segment $[x,y]$, including $z$, into $S$.`, m:`$$x < z< y,\\ x,y\\in S \\ \\Rightarrow\\ z\\in[x,y]\\subseteq S$$` },
        { why:`$z$ was an arbitrary point of $(a,b)$, so the whole open interval sits inside $S$.`, m:`$$(a,b)\\subseteq S$$` },
        { why:`Combine with $S\\subseteq[a,b]$ from step 1; whether the endpoints $a,b$ themselves belong to $S$ determines which of the four interval types $S$ is.`, m:`$$(a,b)\\subseteq S\\subseteq[a,b] \\ \\Rightarrow\\ S\\in\\{(a,b),\\,[a,b),\\,(a,b],\\,[a,b]\\}$$` }
      ],
      ends:`In the bounded case $S$ is pinned to one of the four familiar shapes. The remaining three cases (bounded only above, only below, or neither) run the identical argument with $\\pm\\infty$ standing in for a missing finite endpoint.`
    },
    cards:[
      { q:`State the defining "no gaps" property used to characterise intervals.`, a:`If $x,y\\in S$ and $x < y$, then the whole segment $[x,y]$ is contained in $S$.`, kind:'state' },
      { q:`In the bounded case, what two numbers does the proof build the interval endpoints from?`, a:`$a:=\\inf S$ and $b:=\\sup S$.`, kind:'recall' },
      { q:`Trap: does $S=\\mathbb{Q}\\cap[0,1)$ satisfy the "no gaps" property?`, a:`No — e.g. $0,0.5\\in S$ but $[0,0.5]\\not\\subseteq S$ (irrationals in between are missing), so $S$ is correctly NOT classified as an interval.`, kind:'trap' }
    ]
  },

  { id:'c.2.5.2', bartle:'2.5.2', sec:'2.5', kind:'theorem', tier:'core',
    title:'Nested Intervals Property',
    oneLine:'An infinite chain of closed bounded intervals, each containing the next, always shares at least one common point.',
    statement:`<p>If $I_n=[a_n,b_n]$, $n\\in\\mathbb{N}$, is a nested sequence of closed bounded intervals (meaning $I_1\\supseteq I_2\\supseteq\\cdots\\supseteq I_n\\supseteq I_{n+1}\\supseteq\\cdots$), then there exists a number $\\xi\\in\\mathbb{R}$ such that $\\xi\\in I_n$ for all $n\\in\\mathbb{N}$.</p>`,
    intuition:`<p>Picture a chain of intervals, each one squeezed inside the last. Because they never grow, and because completeness rules out "gaps" in $\\mathbb{R}$, they can never squeeze a common point out of existence entirely — SOME real number survives in all of them at once. This fails badly for OPEN intervals: $(0,1/n)$ is nested but shares no common point at all, since any candidate point $x>0$ is eventually excluded once $1/n < x$.</p>
      <p><b>Worked micro-example:</b> $I_n=[0,1/n]$. Every $I_n$ contains $0$, and the Archimedean Property (<code>c.2.4.3</code>) shows $0$ is in fact the ONLY common point — but the Nested Intervals Property only guarantees existence of at least one, not uniqueness.</p>`,
    needs:['c.2.3.1','c.2.3.2','c.2.3.6'],
    traps:[
      `Forgetting the intervals must be CLOSED and BOUNDED — nested OPEN intervals like $(0,1/n)$, or nested rays like $(n,\\infty)$, can have EMPTY intersection.`,
      `Assuming the common point is unique — this theorem only guarantees existence; uniqueness needs the extra hypothesis that the interval lengths shrink to $0$ (Bartle's Theorem 2.5.3).`
    ],
    proof:{
      idea:`Collect all the LEFT endpoints $a_n$ into one set and let $\\xi$ be its supremum (which exists by Completeness). Then show $\\xi$ never exceeds any RIGHT endpoint $b_n$ either — so $\\xi$ lands inside every single interval at once.`,
      why:`Nestedness is exactly what lets any one interval's right endpoint act as an upper bound for ALL the left endpoints, early or late — that fact, combined with Completeness supplying a genuine least upper bound, is what manufactures the common point.`,
      rungs:[
        { why:`Collect all left endpoints into one set; nestedness ($I_n\\subseteq I_1$) makes $b_1$ an upper bound for the whole set.`, m:`$$\\{a_n : n\\in\\mathbb{N}\\}, \\qquad a_n\\le b_1 \\ \\text{ for all } n$$` },
        { why:`The set of left endpoints is nonempty and bounded above, so Completeness hands us its supremum.`, m:`$$\\xi := \\sup\\{a_n : n\\in\\mathbb{N}\\} \\ \\text{ exists}, \\qquad a_n\\le\\xi\\ \\text{ for all } n$$` },
        { why:`Fix one index $n$ and show $b_n$ is an upper bound for EVERY $a_k$ — split into two cases by which interval nests inside which.`, m:`$$\\text{if } n\\le k: I_k\\subseteq I_n \\Rightarrow a_k\\le b_k\\le b_n; \\qquad \\text{if } k < n: I_n\\subseteq I_k \\Rightarrow a_k\\le a_n\\le b_n$$` },
        { why:`Either way $a_k\\le b_n$ for every $k$, so $b_n$ is an upper bound of the whole set of left endpoints — hence at least as big as the LEAST such bound, $\\xi$.`, m:`$$b_n \\text{ upper-bounds } \\{a_k:k\\in\\mathbb{N}\\} \\ \\Rightarrow\\ \\xi\\le b_n$$` },
        { why:`This held for every $n$, so $\\xi$ sits between each interval's own two endpoints.`, m:`$$a_n\\le\\xi\\le b_n \\ \\text{ for all } n\\in\\mathbb{N}$$` },
        { why:`That is exactly membership in every $I_n$ simultaneously.`, m:`$$\\xi\\in I_n=[a_n,b_n] \\ \\text{ for all } n\\in\\mathbb{N}$$` }
      ],
      ends:`Completeness manufactures a genuine common point $\\xi$ for the whole nested chain, all at once. This is the tool behind Cantor's proof that $\\mathbb{R}$ is uncountable, and behind constructing real numbers as binary/decimal expansions via repeated bisection.`
    },
    cards:[
      { q:`State the Nested Intervals Property.`, a:`If $I_n=[a_n,b_n]$ is a nested sequence of closed bounded intervals, some $\\xi\\in\\mathbb{R}$ lies in every $I_n$.`, kind:'state' },
      { q:`Why does the theorem fail for nested OPEN intervals like $(0,1/n)$?`, a:`Because for any candidate $x>0$, the Archimedean Property gives $n$ with $1/n < x$, so $x\\notin(0,1/n)$ — no common point survives; the closedness of each $I_n$ is essential to the proof.`, kind:'trap' },
      { q:`How is $\\xi$ constructed in the proof?`, a:`$\\xi:=\\sup\\{a_n:n\\in\\mathbb{N}\\}$ — the supremum of all the left endpoints, which exists by Completeness.`, kind:'recall' }
    ]
  },

  { id:'c.2.5.3', bartle:'2.5.3', sec:'2.5', kind:'theorem', tier:'core',
    title:'Nested Intervals Theorem: Uniqueness of Common Point',
    oneLine:'If nested closed bounded intervals have lengths shrinking to 0, their intersection is exactly one point.',
    statement:`<p>If $I_n = [a_n, b_n]$, $n \\in \\mathbb{N}$, is a nested sequence of closed, bounded intervals such that the lengths $b_n - a_n$ satisfy:
      $$\\inf\\{b_n - a_n : n \\in \\mathbb{N}\\} = 0$$
      then the number $\\xi$ contained in $I_n$ for all $n \\in \\mathbb{N}$ is <b>unique</b>; that is:
      $$\\bigcap_{n=1}^\\infty I_n = \\{\\xi\\}$$</p>`,
    intuition:`<p>Theorem 2.5.2 guaranteed that at least ONE point $\\xi$ survives in the intersection of any nested closed bounded intervals. But if the intervals are fat (e.g. $[0, 1 + 1/n]$), their intersection $[0, 1]$ contains infinitely many points.</p>
      <p>This theorem adds the crucial condition: if the intervals shrink down to zero length, there is no room left for two different points! Any two points would have a positive distance between them, which would eventually exceed the shrinking interval width.</p>`,
    needs:['c.2.5.2','c.2.1.9'],
    proof:{
      idea:`Let $\\xi = \\sup\\{a_n\\}$ and $\\eta = \\inf\\{b_n\\}$. Show $\\xi \\le \\eta$, and that every common point $x$ satisfies $\\xi \\le x \\le \\eta$. Then use $\\inf\\{b_n - a_n\\} = 0$ and Theorem 2.1.9 to force $\\eta - \\xi = 0$.`,
      why:`Because any common point is an upper bound for all $a_n$ and lower bound for all $b_n$, it must lie in $[\\xi, \\eta]$. When $\\eta = \\xi$, that interval collapses to a single point.`,
      rungs:[
        { why:`From the proof of 2.5.2, $\\xi = \\sup\\{a_n\\}$ and $\\eta = \\inf\\{b_n\\}$ satisfy $\\xi \\le \\eta$, and $x \\in \\bigcap I_n \\iff \\xi \\le x \\le \\eta$.`, m:`$$a_n \\le \\xi \\le \\eta \\le b_n \\quad \\text{for all } n \\in \\mathbb{N}$$` },
        { why:`Subtract the inequalities to bound the gap $\\eta - \\xi$ by the length of $I_n$.`, m:`$$0 \\le \\eta - \\xi \\le b_n - a_n \\quad \\text{for all } n \\in \\mathbb{N}$$` },
        { why:`Since $\\inf\\{b_n - a_n : n \\in \\mathbb{N}\\} = 0$, for every $\\varepsilon > 0$ there exists $m \\in \\mathbb{N}$ such that $b_m - a_m < \\varepsilon$.`, m:`$$\\forall\\, \\varepsilon > 0, \\; \\exists m \\in \\mathbb{N}: \\; 0 \\le \\eta - \\xi \\le b_m - a_m < \\varepsilon$$` },
        { why:`By Theorem 2.1.9 (Positive Margin Property), $0 \\le \\eta - \\xi < \\varepsilon$ for all $\\varepsilon > 0$ forces $\\eta - \\xi = 0$.`, m:`$$\\eta - \\xi = 0 \\implies \\xi = \\eta$$` }
      ],
      ends:`Since $\\xi \\le x \\le \\eta$ and $\\xi = \\eta$, the only possible common point is $x = \\xi$. The intersection consists of the single point $\\{\\xi\\}$.`
    },
    cards:[
      { q:`State Theorem 2.5.3 on the uniqueness of the point in nested intervals.`, a:`If $I_n = [a_n, b_n]$ is nested closed bounded intervals with $\\inf\\{b_n - a_n : n \\in \\mathbb{N}\\} = 0$, then $\\bigcap_{n=1}^\\infty I_n = \\{\\xi\\}$ is a singleton.`, kind:'state' },
      { q:`What earlier result does the proof invoke to deduce $\\eta - \\xi = 0$?`, a:`Theorem 2.1.9: if $0 \\le a < \\varepsilon$ for all $\\varepsilon > 0$, then $a = 0$.`, kind:'recall' },
      { q:`Trap: does $\\bigcap I_n$ contain a unique point for $I_n = [0, 1 + 1/n]$?`, a:`No — lengths shrink to $1$, not $0$; the intersection is $[0, 1]$, which contains infinitely many points.`, kind:'trap' }
    ]
  },

  { id:'c.2.5.4', bartle:'2.5.4', sec:'2.5', kind:'theorem', tier:'core',
    title:'Uncountability of ℝ (Cantor Nested Intervals Proof)',
    oneLine:'The real numbers are uncountable — any proposed list of reals misses at least one number trapped in nested intervals.',
    statement:`<p>The set $\\mathbb{R}$ of real numbers is not countable (uncountable); equivalently, the closed unit interval $I = [0, 1]$ is uncountable.</p>`,
    intuition:`<p>Cantor gave two legendary proofs that $\\mathbb{R}$ is uncountable: his 1874 proof using nested intervals, and his 1891 diagonal argument. Bartle 2.5.4 presents the 1874 Nested Intervals proof.</p>
      <p>Suppose someone claims to list all numbers in $[0, 1]$ as $x_1, x_2, x_3, \\dots$. We divide $[0, 1]$ into three parts and pick a subinterval $I_1$ that misses $x_1$. Then divide $I_1$ and pick $I_2$ missing $x_2$, and so on. The Nested Intervals Property guarantees a point $\\xi$ sits in ALL $I_n$. But $\\xi$ cannot be $x_1$, cannot be $x_2$, cannot be any $x_k$ on the list! So no list could ever be complete.</p>`,
    needs:['c.2.5.2','c.1.3.1'],
    proof:{
      idea:`Assume $[0, 1]$ is countable: list it as $\\{x_1, x_2, \\dots\\}$. Construct nested closed intervals $I_1 \\supseteq I_2 \\supseteq \\cdots$ such that $x_n \\notin I_n$. By Nested Intervals, $\\xi \\in \\bigcap I_n$ exists, but $\\xi \\ne x_n$ for all $n$, contradicting the enumeration.`,
      why:`Each step deliberately excludes one listed element while keeping a closed bounded subinterval alive; completeness then manufactures an unlisted point.`,
      rungs:[
        { why:`Assume for contradiction that $I = [0, 1]$ is countable; enumerate it completely.`, m:`$$I = \\{x_1, x_2, x_3, \\ldots, x_n, \\ldots\\}$$` },
        { why:`Divide $[0, 1]$ into three equal subintervals $[0, 1/3], [1/3, 2/3], [2/3, 1]$. At least one subinterval does not contain $x_1$; call it $I_1 = [a_1, b_1]$.`, m:`$$I_1 \\subseteq I, \\quad x_1 \\notin I_1$$` },
        { why:`Inductively, given $I_k$, divide it into three subintervals. At least one does not contain $x_{k+1}$; call it $I_{k+1}$.`, m:`$$I_{k+1} \\subseteq I_k, \\quad x_{k+1} \\notin I_{k+1}$$` },
        { why:`This produces a nested sequence of nonempty closed bounded intervals $I_1 \\supseteq I_2 \\supseteq \\cdots$. By Nested Intervals (2.5.2), a common point exists.`, m:`$$\\exists\\, \\xi \\in \\mathbb{R}: \\quad \\xi \\in I_n \\quad \\text{for all } n \\in \\mathbb{N}$$` },
        { why:`Since $\\xi \\in I_n$ for all $n$, and $x_n \\notin I_n$, $\\xi$ cannot equal $x_n$ for any $n \\in \\mathbb{N}$.`, m:`$$\\xi \\ne x_n \\quad \\text{for all } n \\in \\mathbb{N} \\implies \\xi \\notin \\{x_1, x_2, \\ldots\\} \\implies\\Leftarrow$$` }
      ],
      ends:`The assumption that $[0, 1]$ is countable leads to a contradiction. Hence $[0, 1]$ and $\\mathbb{R}$ are uncountable.`
    },
    cards:[
      { q:`State Theorem 2.5.4.`, a:`The set $\\mathbb{R}$ of real numbers is uncountable.`, kind:'state' },
      { q:`How does the nested intervals proof of uncountability construct each $I_{n}$?`, a:`By trisecting $I_{n-1}$ and choosing a closed subinterval that excludes $x_n$.`, kind:'recall' },
      { q:`Trap: why does the surviving point $\\xi$ contradict the enumeration?`, a:`Because $\\xi \\in I_n$ for all $n$, but $x_n \\notin I_n$, so $\\xi$ is not equal to any member of the enumerated list.`, kind:'trap' }
    ]
  },

  { id:'c.2.5.5', bartle:'2.5.5', sec:'2.5', kind:'example', tier:'core',
    title:'The Cantor Ternary Set',
    oneLine:'Start with $[0, 1]$ and repeatedly delete the open middle third of every remaining interval: what survives is uncountable, nowhere dense, and has total length zero.',
    statement:`<p>Let $F_0 = [0, 1]$. Remove the open middle third $(1/3, 2/3)$ to get $F_1 = [0, 1/3] \\cup [2/3, 1]$. In general, $F_k$ is obtained by removing the open middle third from each of the $2^{k-1}$ intervals in $F_{k-1}$. The <b>Cantor Set</b> is the intersection $\\mathbb{F} = \\bigcap_{n=1}^\\infty F_n$.</p>`,
    intuition:`<p>The Cantor set sounds like it should be empty because at step $n$, the total length of removed intervals approaches $1$:
      $$\\frac{1}{3} + 2\\left(\\frac{1}{9}\\right) + 4\\left(\\frac{1}{27}\\right) + \\cdots = \\frac{1/3}{1 - 2/3} = 1$$
      So the total length left is $1 - 1 = 0$. Yet, the Cantor set contains infinitely many points! In fact, it contains EVERY number in $[0, 1]$ that can be written in base $3$ (ternary) using only the digits $0$ and $2$. Because every infinite sequence of $0$s and $2$s corresponds to a point in the Cantor set, $\\mathbb{F}$ is <b>uncountable</b> (as many points as all of $[0, 1]$!).</p>`,
    needs:['c.2.5.2', 'c.1.3.2'],
    traps:[
      `Thinking the Cantor set only contains the obvious endpoints like $0, 1, 1/3, 2/3$. Non-endpoints like $1/4 = 0.020202..._3$ are also in the Cantor set!`,
      `Confusing "length zero" with "countable": the Cantor set is UNCOUNTABLE even though its length (measure) is zero.`
    ],
    cards:[
      { q:`What is the total length (measure) of the open intervals removed to form the Cantor set?`, a:`$1$, which means the remaining Cantor set has measure $0$.`, kind:'recall' },
      { q:`Is the Cantor set countable or uncountable?`, a:`Uncountable — it has the cardinality of the continuum ($2^{\\aleph_0}$), matching $[0, 1]$.`, kind:'state' },
      { q:`Which numbers in $[0, 1]$ belong to the Cantor ternary set in base $3$?`, a:`Those whose ternary (base-3) expansion can be written using only digits $0$ and $2$ (never requiring digit $1$).`, kind:'recall' }
    ]
  },

  { id:'c.3.2.2', bartle:'3.2.2', sec:'3.2', kind:'theorem', tier:'core',
    title:'A convergent sequence is bounded',
    oneLine:'Once a sequence settles near a limit, only finitely many early terms can be wild — so the whole sequence is trapped in some fixed range.',
    statement:`<p>If $X=(x_n)$ is a convergent sequence of real numbers, then $X$ is bounded: there exists $M>0$ such that $|x_n|\\le M$ for all $n\\in\\mathbb{N}$.</p>`,
    intuition:`<p>Convergence only controls the sequence from some index $K$ onward — the tail huddles near the limit. The finitely many terms BEFORE $K$ could, in principle, be enormous, but a finite list of numbers is always bounded (just take the biggest one), so gluing the two pieces together bounds the whole sequence.</p>
      <p><b>Worked micro-example:</b> $x_n=(-1)^n\\cdot 100$ for $n\\le3$, then $x_n=1/n$ for $n>3$. The tail is tiny, but $x_1,x_2,x_3$ are huge — yet $\\max\\{100,100,100,\\ldots\\}=100$ still bounds the whole sequence. (This particular $X$ doesn't converge, but the bounding trick is the same either way.)</p>`,
    needs:['c.3.1.3','s.triangle-ineq'],
    traps:[
      `Believing the CONVERSE also holds (bounded $\\Rightarrow$ convergent) — false; $((-1)^n)$ is bounded but divergent (see <code>c.3.4.5</code>).`,
      `Forgetting to also bound the finitely many terms BEFORE index $K$ — convergence directly controls only the tail; the head needs a separate max/sup argument.`
    ],
    proof:{
      idea:`Use $\\varepsilon=1$ to trap the tail within $1$ of the limit $x$, bound $|x_n|$ there via the triangle inequality, then take the max over that bound and the finitely many earlier terms.`,
      why:`Any single fixed tolerance is enough to pin the tail down to a genuine numerical bound; the only extra step is remembering the finitely many terms before that tail also need covering, which a simple maximum handles.`,
      rungs:[
        { why:`Apply the definition of convergence with the specific tolerance $\\varepsilon=1$.`, m:`$$\\exists K:\\ n\\ge K \\Rightarrow |x_n-x|<1$$` },
        { why:`Triangle inequality turns "close to $x$" into an explicit numerical bound on $|x_n|$ itself, for the tail.`, m:`$$|x_n| = |x_n-x+x| \\le |x_n-x|+|x| < 1+|x| \\quad (n\\ge K)$$` },
