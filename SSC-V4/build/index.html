    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;
  }

  /* Inline rules, prose only. Code spans are pulled out first so that what is
     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);
      return '\x00C' + (code.length - 1) + '\x00';
    });

    s = esc(s)
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>');

    return s.replace(/\x00C(\d+)\x00/g, (_, i) => '<code>' + esc(code[+i]) + '</code>');
  }

  /* prose through the inline rules, maths through untouched */
  function spans(src) {
    return segments(src).map(seg => seg.math ? seg.t : inline(seg.t)).join('');
  }

  /* One source line -> one HTML block. */
  function line(src) {
    const raw = String(src == null ? '' : src);
    const t = raw.trim();
    if (!t) return '';

    if (/^(---|\*\*\*|___)\s*$/.test(t)) return '<hr>';

    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) {
      const n = Math.min(h[1].length + 1, 5);
      return '<h' + n + ' class="md-h">' + spans(h[2]) + '</h' + n + '>';
    }

    const q = /^>\s?(.*)$/.exec(t);
    if (q) return '<blockquote class="md-q">' + spans(q[1]) + '</blockquote>';

    const ul = /^[-*+]\s+(.*)$/.exec(t);
    if (ul) return '<ul class="md-l"><li>' + spans(ul[1]) + '</li></ul>';

    const ol = /^(\d+)[.)]\s+(.*)$/.exec(t);
    if (ol) return '<ol class="md-l" start="' + ol[1] + '"><li>' + spans(ol[2]) + '</li></ol>';

    return '<p class="md-p">' + spans(raw) + '</p>';
  }

  /* Does this line carry any maths delimiter at all? The editor uses this to
     decide whether a delimiter-free line in a maths-first box should be
     treated as bare LaTeX. */
  const hasMath = src => /\$/.test(String(src || ''));

  /* Whole document, for export and for the read-only preview. */
  const doc = src => String(src || '').split('\n').map(line).join('\n');

  return { line, doc, hasMath, inline, segments };
})();


/* ── src/core.store.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Progress store.

   Three things are tracked, and they are kept apart on purpose:

     completion   Level 1. You have encountered the material. Never evidence
                  of recall.
     proof work   Level 2. You have worked a proof through yourself. Awarded
                  per task, never for opening the note.
     first try    the FIRST recorded attempt at a card or a question. Later
                  attempts are allowed but never overwrite the first, because
                  the first attempt is the only honest measurement.

   The shape is built for merging. Two devices can both make progress offline,
   so every mutation is timestamped and every removal leaves a tombstone —
   merge(a,b) == merge(b,a), and merging twice changes nothing. core.sync.js
   depends on that and on nothing else.

   Storage is localStorage with an in-memory fallback so a locked-down browser
   degrades to a working-but-forgetful session instead of a broken one.
   ══════════════════════════════════════════════════════════════════════════ */

const Store = (function () {

  const KEY = 'ssc4.level1.v1';
  const EMPTY = {
    v: 2,
    done: {}, undone: {},        /* Level 1 completion + tombstones */
    proofs: {}, unproofs: {},    /* Level 2 proof work + tombstones */
    cards: {}, omr: {}, write: {},
    prefs: {}, prefsAt: {},
    updated: 0
  };

  let volatile = false;
  let state = load();
  const listeners = [];

  function blank() { return JSON.parse(JSON.stringify(EMPTY)); }

  /* v1 had no tombstones, no proof map and no per-key preference stamps.
     Everything it did have keeps its meaning, so the upgrade is a fill-in. */
  function upgrade(raw) {
    const s = Object.assign(blank(), raw || {});
    ['done', 'undone', 'proofs', 'unproofs', 'cards', 'omr', 'write', 'prefs', 'prefsAt']
      .forEach(function (k) { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
    s.v = 2;
    if (!s.updated) s.updated = Date.now();
    return s;
  }

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (!raw) return blank();
      return upgrade(JSON.parse(raw));
    } catch (e) {
      volatile = true;
      return blank();
    }
  }

  function write() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { volatile = true; }
  }

  const flush = DOM.debounce(write, 250);

  /* Write immediately, skipping the debounce. Anything the very next page load
     depends on has to go through here: a debounced write is still pending when
     `location.reload()` tears the page down, and signing in or out and then
     reloading would land back where you started. */
  function flushNow() { write(); }

  function save(quiet) {
    state.updated = Date.now();
    flush();
    if (!quiet) listeners.forEach(function (fn) { try { fn(); } catch (e) { /* a listener must never break a save */ } });
  }

  /* core.sync.js subscribes here; nothing else needs to. */
  function onChange(fn) { listeners.push(fn); }

  /* ── a tick with a tombstone, used by completion and by proof work ────── */
  function flag(on, off, id, want) {
    const now = Date.now();
    if (want) { state[on][id] = now; delete state[off][id]; }
    else { state[off][id] = now; delete state[on][id]; }
    save();
    return !!state[on][id];
  }

  /* ── completion (Level 1) ────────────────────────────────────────────── */
  const isDone = id => !!state.done[id];
  const setDone = (id, on) => flag('done', 'undone', id, on);

  /* Tick a whole list in one write — the prerequisite cascade. Returns the
     ids that actually changed, so the caller can report honestly. */
  function setDoneMany(ids, on) {
    const now = Date.now();
    const hit = [];
    (ids || []).forEach(function (id) {
      if (!!state.done[id] === !!on) return;
      hit.push(id);
      if (on) { state.done[id] = now; delete state.undone[id]; }
      else { state.undone[id] = now; delete state.done[id]; }
    });
    if (hit.length) save();
    return hit;
  }

  /* ── proof work (Level 2) ────────────────────────────────────────────── */
  /* id is a concept id, or 'w:<questionId>' for a written question. */
  const isProofDone = id => !!state.proofs[id];
  const setProofDone = (id, on) => flag('proofs', 'unproofs', id, on);

  /* ── statement cards ─────────────────────────────────────────────────── */
  /* grade: 'got' | 'partly' | 'missed' */
  const card = id => state.cards[id] || null;
  function gradeCard(id, grade) {
    const rec = state.cards[id] || (state.cards[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = grade;
    rec.lastAt = Date.now();
    if (!rec.first) { rec.first = grade; rec.firstAt = rec.lastAt; }  /* first attempt is final */
    save();
    return rec;
  }

  /* ── objective questions ─────────────────────────────────────────────── */
  const omr = id => state.omr[id] || null;
  function lockOmr(id, result) {
    const rec = state.omr[id] || (state.omr[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = { given: result.given, verdict: result.verdict, ms: result.ms, at: Date.now() };
    if (!rec.first) rec.first = rec.last;
    save();
    return rec;
  }

  /* ── writing drafts ──────────────────────────────────────────────────── */
  const draft = cid => (state.write[cid] && state.write[cid].tex) || '';
  function saveDraft(cid, tex) {
    if (!tex.trim()) delete state.write[cid];
    else state.write[cid] = { tex: tex, at: Date.now() };
    save();
  }

  /* ── preferences ─────────────────────────────────────────────────────── */
  const pref = (k, d) => (k in state.prefs ? state.prefs[k] : d);
  function setPref(k, v) {
    state.prefs[k] = v;
    state.prefsAt[k] = Date.now();
    save();
    return v;
  }

  /* ── the mastery level, PER COURSE ───────────────────────────────────────
     Not one switch for the whole app: a learner can be consolidating proofs in
     Real Analysis I while still meeting Real Analysis II for the first time,
     and a single global level would force the harder standard onto the course
     they have only just opened.

     Level 2 has to be unlocked on that course before it can be selected —
     by finishing the course at Level 1, or deliberately in its settings.
     Opening the app never promotes anyone. */
  const lvlKey = courseId => 'level:' + (courseId || '_');
  const unlKey = courseId => 'level2:' + (courseId || '_');

  const unlocked = courseId => pref(unlKey(courseId), false) === true;

  function unlock(courseId, on) {
    setPref(unlKey(courseId), !!on);
    if (!on) setPref(lvlKey(courseId), 1);
    return unlocked(courseId);
  }

  function level(courseId) {
    const want = pref(lvlKey(courseId), 1);
    return (want === 2 && unlocked(courseId)) ? 2 : 1;
  }

  function setLevel(courseId, n) {
    const want = n === 2 ? 2 : 1;
    if (want === 2 && !unlocked(courseId)) return level(courseId);
    setPref(lvlKey(courseId), want);
    return level(courseId);
  }

  /* ── who is signed in ────────────────────────────────────────────────────
     Name and roll number are the credentials AND the sync key. They are a pass
     key, not a password, and every surface that shows them says so. */
  const identity = () => ({
    name: pref('syncName', ''),
    roll: pref('syncRoll', '')
  });
  const signedIn = () => {
    const id = identity();
    return !!(String(id.name).trim() && String(id.roll).trim());
  };
  function signIn(name, roll) {
    setPref('syncName', String(name || '').trim());
    setPref('syncRoll', String(roll || '').trim());
    flushNow();
    return signedIn();
  }
  function signOut() {
    setPref('syncName', '');
    setPref('syncRoll', '');
    flushNow();
  }

  /* ── aggregate stats over a given universe of ids ────────────────────── */
  function summary(conceptIds, cardIds, omrIds, proofIds) {
    const notes = conceptIds.filter(isDone).length;
    let tried = 0, got = 0, partly = 0;
    cardIds.forEach(function (id) {
      const r = state.cards[id];
      if (!r || !r.first) return;
      tried += 1;
      if (r.first === 'got') got += 1;
      else if (r.first === 'partly') partly += 1;
    });
    let locked = 0, right = 0, part = 0;
    omrIds.forEach(function (id) {
      const r = state.omr[id];
      if (!r || !r.first) return;
      locked += 1;
      if (r.first.verdict === 'correct') right += 1;
      else if (r.first.verdict === 'partial') part += 1;
    });
    const pf = proofIds || [];
    return {
      notes: { done: notes, total: conceptIds.length },
      cards: { tried: tried, got: got, partly: partly, total: cardIds.length },
      omr: { locked: locked, correct: right, partial: part, total: omrIds.length },
      proofs: { done: pf.filter(isProofDone).length, total: pf.length }
    };
  }

  /* ── merging two devices ─────────────────────────────────────────────────
     Loss-free and order-independent. The rules follow from what each field
     means rather than from a single "newest wins": a first attempt is a
     measurement, so the EARLIER one survives; a tick is a decision, so the
     LATER one survives. */
  function mergeFlags(a, b, ta, tb) {
    const on = {}, off = {};
    [a, b].forEach(src => { for (const k in (src || {})) if (!(on[k] >= src[k])) on[k] = src[k]; });
    [ta, tb].forEach(src => { for (const k in (src || {})) if (!(off[k] >= src[k])) off[k] = src[k]; });
    for (const k in off) {
      if (!on[k]) continue;
      if (off[k] > on[k]) delete on[k];   /* un-ticked after the tick */
      else delete off[k];                 /* tombstone spent */
    }
    return { on: on, off: off };
  }

  function mergeAttempts(A, B, firstKey) {
    const out = {};
    const ids = {};
    for (const k in (A || {})) ids[k] = true;
    for (const k in (B || {})) ids[k] = true;
    for (const id in ids) {
      const x = (A || {})[id], y = (B || {})[id];
      if (!x || !y) { out[id] = JSON.parse(JSON.stringify(x || y)); continue; }
      const rec = { tries: Math.max(x.tries || 0, y.tries || 0) };

      /* the honest first attempt is the earliest one either device saw */
      const fx = x.first ? (x.firstAt || (x.first.at || 0)) : Infinity;
      const fy = y.first ? (y.firstAt || (y.first.at || 0)) : Infinity;
      const first = fx <= fy ? x : y;
      if (first.first) {
        rec.first = first.first;
        if (first.firstAt) rec.firstAt = first.firstAt;
      }

      /* the latest pass is the one worth showing */
      const lx = x.lastAt || (x.last && x.last.at) || 0;
      const ly = y.lastAt || (y.last && y.last.at) || 0;
      const last = lx >= ly ? x : y;
      if (last.last) {
        rec.last = last.last;
        if (last.lastAt) rec.lastAt = last.lastAt;
      }
      out[id] = rec;
    }
    return out;
  }

  function mergeStates(A, B) {
    A = upgrade(A); B = upgrade(B);
    const done = mergeFlags(A.done, B.done, A.undone, B.undone);
    const proof = mergeFlags(A.proofs, B.proofs, A.unproofs, B.unproofs);

    const write = {};
    [A.write, B.write].forEach(function (src) {
      for (const k in (src || {})) {
        if (!write[k] || (src[k].at || 0) > (write[k].at || 0)) write[k] = src[k];
      }
    });

    /* preferences are per-key: the device that set it most recently wins, and
       a key with no stamp yields to one that has it */
    const prefs = {}, prefsAt = {};
    [[A.prefs, A.prefsAt, A.updated], [B.prefs, B.prefsAt, B.updated]].forEach(function (p) {
      const src = p[0] || {}, at = p[1] || {}, fallback = p[2] || 0;
      for (const k in src) {
        const t = at[k] || fallback;
        if (!(k in prefs) || t >= (prefsAt[k] || 0)) { prefs[k] = src[k]; prefsAt[k] = t; }
      }
    });

    return {
      v: 2,
      done: done.on, undone: done.off,
      proofs: proof.on, unproofs: proof.off,
      cards: mergeAttempts(A.cards, B.cards),
      omr: mergeAttempts(A.omr, B.omr),
      write: write, prefs: prefs, prefsAt: prefsAt,
      updated: Math.max(A.updated || 0, B.updated || 0)
    };
  }

  /* Adopt a merged state wholesale. `quiet` keeps the sync listener from
     firing on the state it has just pulled. */
  function adopt(next, quiet) {
    state = upgrade(next);
    save(quiet);
    return state;
  }

  const snapshot = () => JSON.parse(JSON.stringify(state));
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function reset() { state = blank(); save(); }

  /* what the summary tiles count, so two callers cannot disagree */
  function tally() {
    return {
      notes: Object.keys(state.done).length,
      proofs: Object.keys(state.proofs).length,
      cards: Object.keys(state.cards).filter(k => state.cards[k].first).length,
      omr: Object.keys(state.omr).filter(k => state.omr[k].first).length
    };
  }

  return {
    isDone, setDone, setDoneMany,
    isProofDone, setProofDone,
    card, gradeCard, omr, lockOmr, draft, saveDraft,
    pref, setPref, level, setLevel, unlocked, unlock,
    identity, signedIn, signIn, signOut,
    summary, exportJSON, reset, tally,
    snapshot, adopt, mergeStates, onChange, flushNow,
    isVolatile: () => volatile
  };
})();


/* ── src/core.sync.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Multi-device sync.

   Firebase Realtime Database over plain REST — no SDK, no npm, no auth
   handshake, nothing to load before the app can start. One GET and one PUT.

   The key is the learner's name and roll number. That is a pass key, not a
   password: anyone who knows both can read and write that record, and the UI
   says so plainly rather than implying a login. It is the right trade for a
   personal study record that has to follow one person between a phone and a
   laptop with no account to create.

   Every sync MERGES before it writes (Store.mergeStates), so two devices that
   both worked offline lose nothing and the order they reconnect in does not
   matter. Overwriting instead of merging is how a week of work disappears.
   ══════════════════════════════════════════════════════════════════════════ */

const Sync = (function () {

  const DB = 'https://task-dominion-default-rtdb.asia-southeast1.firebasedatabase.app';

  /* Mock and validated pools keep SEPARATE STORES — progress and the sign-in
     register both. Their ids do not mean the same things, and a name typed
     into the test build must never appear in, or merge with, the real record.
     This is the only place that mapping is decided.

        live   ssc4_ra_v1        ssc4_users_v1
        mock   ssc4_ra_mock_v1   ssc4_users_mock_v1

     AGY owns the live pair; see "Publishing" in HOOK_agy.md. */
  const LIVE = () => (typeof DATA_KIND !== 'undefined' && DATA_KIND === 'live');
  const NS = () => LIVE() ? 'ssc4_ra_v1' : 'ssc4_ra_mock_v1';
  const USERS = () => LIVE() ? 'ssc4_users_v1' : 'ssc4_users_mock_v1';

  let syncing = false;
  let pushT = 0;
  let last = { at: 0, ok: null, msg: '' };
  const watchers = [];

  const slug = s => String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  /* name + roll -> one stable key. Both are required: a roll number alone
     collides across colleges, a name alone collides across people.

     The separator is '--', not '.': a Realtime Database key may not contain
     '.', '$', '#', '[', ']' or '/', and a dotted key is rejected outright with
     "Invalid token in path". slug() collapses runs of separators, so '--' can
     never be produced by either half and the split stays unambiguous. */
  function keyFor(name, roll) {
    const a = slug(name), b = slug(roll);
    return (a && b) ? a + '--' + b : '';
  }

  const identity = () => Store.identity();

  function key() {
    const id = identity();
    return keyFor(id.name, id.roll);
  }

  const on = () => !!key();
  const url = () => DB + '/' + NS() + '/' + encodeURIComponent(key()) + '.json';
  const userUrl = () => DB + '/' + USERS() + '/' + encodeURIComponent(key()) + '.json';

  function announce(ok, msg) {
    last = { at: Date.now(), ok: ok, msg: msg };
    watchers.forEach(function (fn) { try { fn(last); } catch (e) { /* a watcher must never break a sync */ } });
  }

  const watch = fn => { watchers.push(fn); return last; };
  const status = () => ({ on: on(), key: key(), syncing: syncing, last: last });

  /* ── the one operation: pull, merge, push ─────────────────────────────── */
  function now(opts) {
    const o = opts || {};
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not connected.' });
    if (syncing) return Promise.resolve({ ok: false, msg: 'Already syncing.' });
    if (!window.fetch) return Promise.resolve({ ok: false, msg: 'This browser cannot sync.' });

    syncing = true;
    announce(null, 'Syncing…');
    const before = Store.tally();

    return window.fetch(url(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (remote) {
        let rs = null;
        if (remote && typeof remote === 'object' && typeof remote.payload === 'string') {
          try { rs = JSON.parse(remote.payload); } catch (e) { rs = null; }
        }
        const merged = Store.mergeStates(Store.snapshot(), rs);
        Store.adopt(merged, true);   /* quiet: do not re-trigger the auto-push */

        const body = JSON.stringify({
          payload: JSON.stringify(Store.snapshot()),
          updated: Date.now(),
          device: Store.pref('syncName', '') + ' · ' + (navigator.platform || 'device')
        });
        return window.fetch(url(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: body
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const after = Store.tally();
          const gained = {
            notes: after.notes - before.notes,
            proofs: after.proofs - before.proofs,
            cards: after.cards - before.cards,
            omr: after.omr - before.omr
          };
          const bits = [];
          if (gained.notes > 0) bits.push(gained.notes + ' ' + DOM.plural(gained.notes, 'note'));
          if (gained.proofs > 0) bits.push(gained.proofs + ' ' + DOM.plural(gained.proofs, 'proof'));
          if (gained.cards > 0) bits.push(gained.cards + ' ' + DOM.plural(gained.cards, 'card'));
          if (gained.omr > 0) bits.push(gained.omr + ' ' + DOM.plural(gained.omr, 'question'));
          const msg = bits.length
            ? 'Merged in ' + bits.join(', ') + ' from your other device'
            : 'Everything already in sync';
          syncing = false;
          announce(true, msg);
          if (bits.length && o.reload !== false && typeof Router !== 'undefined') Router.reload();
          if (!o.quiet) DOM.announce(msg + '.');
          return { ok: true, msg: msg, gained: gained };
        });
      })
      .catch(function (err) {
        syncing = false;
        const msg = /Failed to fetch|NetworkError/i.test(String(err && err.message))
          ? 'Offline — your progress is saved here and will sync when you are back.'
          : 'Sync failed: ' + ((err && err.message) || err);
        announce(false, msg);
        if (!o.quiet) DOM.announce(msg);
        return { ok: false, msg: msg };
      });
  }

  const schedule = () => {
    if (!on()) return;
    window.clearTimeout(pushT);
    pushT = window.setTimeout(() => now({ quiet: true, reload: false }), 1500);
  };

  /* ── signing in ──────────────────────────────────────────────────────────
     Registers the key in the sign-in store (or touches it if it is already
     there), then does a normal merge-sync so an existing record arrives before
     the first screen is drawn. Being offline is NOT a reason to refuse entry:
     the local record still opens, and the next sync reconciles it. */
  function hello() {
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not signed in.' });
    if (!window.fetch) return now({ quiet: true }).then(r => Object.assign({ returning: null }, r));

    const id = identity();
    return window.fetch(userUrl(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (rec) {
        const returning = !!(rec && rec.created);
        return window.fetch(userUrl(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: id.name, roll: id.roll,
            created: (rec && rec.created) || Date.now(),
            seen: Date.now(),
            visits: ((rec && rec.visits) || 0) + 1
          })
        }).then(() => returning);
      })
      .then(function (returning) {
        return now({ quiet: true }).then(function (r) {
          return {
            ok: true, returning: returning,
            msg: returning
              ? 'Welcome back — ' + (r.ok ? r.msg.charAt(0).toLowerCase() + r.msg.slice(1) : 'working offline for now')
              : 'New record created for ' + id.name + '.'
          };
        });
      })
      .catch(function () {
        return { ok: false, offline: true,
          msg: 'Offline — opening the record stored on this device. It will sync when you are back.' };
      });
  }

  /* ── connecting ──────────────────────────────────────────────────────── */
  function connect(name, roll) {
    const k = keyFor(name, roll);
    if (!k) return Promise.resolve({ ok: false, msg: 'Both a name and a roll number are needed.' });
    Store.signIn(name, roll);
    return now({ quiet: false });
  }

  function disconnect() {
    Store.signOut();
    announce(null, 'Signed out. Progress stays on this device.');
  }

  /* ── wiring ──────────────────────────────────────────────────────────── */
  function start() {
    Store.onChange(schedule);
    if (!on()) return;
    now({ quiet: true });
    /* coming back to the tab is the moment the other device's work matters */
    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) now({ quiet: true });
    });
    window.addEventListener('online', function () { now({ quiet: true }); });
  }

  return { start, hello, connect, disconnect, now, status, watch, identity, keyFor, on };
})();


/* ── src/core.pool.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Content pool — one pass over the loaded data, then pure lookups.

   The app never reads the data globals directly; everything goes through here,
   so swapping mock data for the validated pool changes nothing above this line.

   Reads:  SYLLABI, SECTITLE, CONCEPTS, OBJECTIVE, QUESTIONS (optional)
   Builds: concept index, section -> concepts, course/module for a section,
           the statement-card deck, and the inverted `tests` edge
           (concept -> questions that examine it).
   ══════════════════════════════════════════════════════════════════════════ */

const Pool = (function () {

  const byId = {};          /* concept id -> node */
  const bySec = {};         /* section id  -> [node] */
  const secMeta = {};       /* section id  -> {course, module} */
  const deck = [];          /* statement cards, in course order */
  const objFor = {};        /* concept id -> [objective question] */
  const writFor = {};       /* concept id -> [written question] */
  const neededBy = {};      /* concept id -> [concept that lists it in needs] */
  const background = [];    /* nodes with no section in any course */
  let courses = [], objective = [], written = [], titles = {}, mock = false;

  /* Data files declare top-level `const`s, which are global *lexical* bindings
     rather than window properties — so they are read by name, guarded with
     typeof. These five names, plus DATA_KIND, are the entire data contract. */
  function build() {
    courses = (typeof SYLLABI !== 'undefined' ? SYLLABI : []).slice();
    objective = (typeof OBJECTIVE !== 'undefined' ? OBJECTIVE : []).slice();
    written = (typeof QUESTIONS !== 'undefined' ? QUESTIONS : []).slice();
    titles = typeof SECTITLE !== 'undefined' ? SECTITLE : {};
    const concepts = typeof CONCEPTS !== 'undefined' ? CONCEPTS : [];
    const kind = typeof DATA_KIND !== 'undefined' ? DATA_KIND : null;

    mock = kind === 'mock' || concepts.some(c => c.mock) || objective.some(q => q.mock);

    courses.forEach(course => (course.modules || []).forEach(mod =>
      (mod.secs || []).forEach(sec => { secMeta[sec] = { course: course, module: mod }; })));

    concepts.forEach(function (c) {
      byId[c.id] = c;
      if (c.sec && secMeta[c.sec]) (bySec[c.sec] || (bySec[c.sec] = [])).push(c);
      else background.push(c);
    });

    /* reverse prerequisite edges: "what does knowing this unlock?" */
    concepts.forEach(c => (c.needs || []).forEach(function (n) {
      (neededBy[n] || (neededBy[n] = [])).push(c);
    }));

    /* statement recall deck, ordered the way the courses are ordered */
    sections().forEach(s => s.concepts.forEach(c =>
      (c.cards || []).forEach(function (card, i) {
        if (card.kind !== 'state') return;
        deck.push({ id: c.id + '#' + i, cid: c.id, q: card.q, a: card.a, sec: c.sec,
          title: c.title, kind: c.kind });
      })));

    objective.forEach(q => (q.tests || []).forEach(t => (objFor[t] || (objFor[t] = [])).push(q)));
    written.forEach(q => (q.tests || []).forEach(t => (writFor[t] || (writFor[t] = [])).push(q)));
  }

  /* every in-course section, in display order */
  function sections(courseId) {
    const out = [];
    courses.forEach(function (course) {
      if (courseId && course.id !== courseId) return;
      (course.modules || []).forEach(mod => (mod.secs || []).forEach(sec => out.push({
        sec: sec, title: sectionTitle(sec), course: course, module: mod,
        concepts: bySec[sec] || []
      })));
    });
    return out;
  }

  const sectionTitle = sec => titles[sec] || ('Section ' + sec);
  const concept = id => byId[id] || null;
  const course = id => courses.filter(c => c.id === id)[0] || null;
  const courseOfSec = sec => (secMeta[sec] && secMeta[sec].course) || null;
  const moduleOfSec = sec => (secMeta[sec] && secMeta[sec].module) || null;
  const objectiveFor = cid => objFor[cid] || [];
  const writtenFor = cid => writFor[cid] || [];
  const objectiveOne = id => objective.filter(q => q.id === id)[0] || null;

  /* concepts of the whole slice, in reading order */
  function conceptList(courseId) {
    const out = [];
    sections(courseId).forEach(s => s.concepts.forEach(c => out.push(c)));
    return out;
  }

  /* Prerequisite chain, deepest first, ending at `id` itself. Depth-first over
     `needs`, de-duplicated, cycle-safe — this is what the note view walks. */
  function chain(id, limit) {
    const out = [], seen = {};
    (function walk(at, depth) {
      if (!byId[at] || seen[at] || depth > (limit == null ? 4 : limit)) return;
      seen[at] = true;
      (byId[at].needs || []).forEach(n => walk(n, depth + 1));
      out.push(byId[at]);
    })(id, 0);
    return out;
  }

  const unlocks = id => (neededBy[id] || []).slice();

  /* previous / next concept in reading order across the whole pool */
  function neighbours(id) {
    const all = conceptList();
    const i = all.map(c => c.id).indexOf(id);
    if (i < 0) return { prev: null, next: null };
    return { prev: all[i - 1] || null, next: all[i + 1] || null };
  }

  /* ids used for progress denominators */
  const ids = {
    concepts: courseId => conceptList(courseId).map(c => c.id),
    cards: () => deck.map(c => c.id),
    objective: () => objective.map(q => q.id),
    /* Level 2 counts proof work, so its denominator is the concepts that
       actually carry a proof — not every note. */
    proofs: courseId => conceptList(courseId).filter(c => c.proof).map(c => c.id)
  };

  return {
    build, sections, sectionTitle, concept, concepts: conceptList, course,
    courses: () => courses, courseOfSec, moduleOfSec, deck: () => deck,
    objective: () => objective, objectiveOne, objectiveFor, writtenFor,
    background: () => background, chain, unlocks, neighbours, ids, isMock: () => mock
  };
})();


/* ── src/core.progress.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Level-aware progress.

   `Store` knows two independent facts about a concept — it was ticked, and its
   proof was worked through — and knows nothing about courses. `Pool` knows
   which course a concept belongs to and whether it has a proof, and knows
   nothing about progress. This is the one place the two meet, and every screen
   that draws a tick, a ring or a meter asks HERE rather than asking Store
   directly. That is what keeps "done" meaning the same thing everywhere.

   What "done" means depends on the level of that concept's own course:

     level 1   ticked. You have encountered the material.
     level 2   ticked AND, if it has a proof, that proof worked through.

   So switching a course to Level 2 does not erase anything — it raises the
   bar, and notes that were complete become incomplete again because the
   standard moved. That is the intended reading: level 2 IS the progress
   measure for a course that has been switched to it. Courses still at Level 1
   are unaffected, which is the whole point of the level being per course.
   ══════════════════════════════════════════════════════════════════════════ */

const Progress = (function () {

  const courseIdOf = function (c) {
    if (!c) return null;
    const course = Pool.courseOfSec(c.sec);
    return course ? course.id : null;
  };

  /* The level a given concept is being held to. Background nodes (`s.*`) sit
     in no course, so they are always level 1 — they are assumed knowledge, not
     material to work proofs on. */
  const levelOf = id => Store.level(courseIdOf(Pool.concept(id)));

  const hasProof = id => {
    const c = Pool.concept(id);
    return !!(c && c.proof);
  };

  /* three states, because at level 2 a ticked note with an unworked proof is
     genuinely neither done nor untouched */
  function state(id) {
    const ticked = Store.isDone(id);
    if (levelOf(id) < 2) return ticked ? 'done' : 'none';
    if (!ticked) return 'none';
    if (!hasProof(id)) return 'done';
    return Store.isProofDone(id) ? 'done' : 'part';
  }

  const isDone = id => state(id) === 'done';

  /* ── ticking ─────────────────────────────────────────────────────────────
     One press advances one step, so the tick always has somewhere to go and
     never silently refuses. At level 2 that is tick -> work the proof -> clear.
     When a concept has no proof, ticking level 1 automatically counts as
     ticking both levels. */
  function advance(id) {
    const at = state(id);
    if (at === 'none') {
      Store.setDone(id, true);
      if (!hasProof(id)) Store.setProofDone(id, true);
      return state(id);
    }
    if (at === 'part') { Store.setProofDone(id, true); return state(id); }
    clear(id);
    return state(id);
  }

  function clear(id) {
    if (Store.isProofDone(id)) Store.setProofDone(id, false);
    Store.setDone(id, false);
  }

  /* Bulk set, for a section / module / course row. At level 2 "tick all" means
     the level 2 standard, or the row could never reach a full ring. */
  function setMany(ids, on) {
    const list = ids || [];
    Store.setDoneMany(list, on);
    list.forEach(function (id) {
      if (!hasProof(id)) {
        Store.setProofDone(id, !!on);
        return;
      }
      if (levelOf(id) < 2) {
        if (!on && Store.isProofDone(id)) Store.setProofDone(id, false);
        return;
      }
      if (Store.isProofDone(id) !== !!on) Store.setProofDone(id, !!on);
    });
  }

  /* ── counting ────────────────────────────────────────────────────────── */
  function count(ids) {
    const list = ids || [];
    let done = 0, part = 0;
    list.forEach(function (id) {
      const st = state(id);
      if (st === 'done') done += 1; else if (st === 'part') part += 1;
    });
    return { done: done, part: part, total: list.length };
  }

  /* what a tick button should render: 'true' | 'mixed' | 'false' */
  function tickState(ids) {
    const c = count(ids);
    if (!c.total) return 'false';
    if (c.done === c.total) return 'true';
    return (c.done || c.part) ? 'mixed' : 'false';
  }

  /* ── the reel queue ──────────────────────────────────────────────────────
     The reel only ever shows material you have said you have met. Studying a
     statement you have never read is not recall, it is reading with extra
     steps — and a reel full of unread theorems is the pile the reel exists to
     avoid.

     Two kinds of card:
       statement   every ticked concept that has a 'state' card
       proof       only for a course switched to Level 2, and only for ticked
                   concepts that carry a proof

     Order is by how badly each card needs the attempt, then by the reading
     order of the course — no randomness, so the queue is inspectable and the
     same twice running:

       0  never attempted
       1  first attempt was 'missed'
       2  first attempt was 'partly'
       3  first attempt was 'got'

     A proof card sits one rank behind its own statement card, so you are never
     asked to reconstruct a proof in the same breath as first stating it. */
  const RANK = { missed: 1, partly: 2, got: 3 };

  function rank(cardId) {
    const rec = Store.card(cardId);
    if (!rec || !rec.first) return 0;
    return RANK[rec.first] == null ? 3 : RANK[rec.first];
  }

  function reel(opts) {
    const o = opts || {};
    const out = [];

    Pool.deck().forEach(function (card, i) {
      if (!Store.isDone(card.cid)) return;
      out.push({
        kind: 'state', id: card.id, cid: card.cid, sec: card.sec,
        title: card.title, conceptKind: card.kind,
        q: card.q, a: card.a,
        rank: rank(card.id), order: i
      });
    });

    Pool.concepts().forEach(function (c, i) {
      if (!c.proof || !Store.isDone(c.id)) return;
      if (Store.level(courseIdOf(c)) < 2) return;
      const id = c.id + '#proof';
      out.push({
        kind: 'proof', id: id, cid: c.id, sec: c.sec,
        title: c.title, conceptKind: c.kind,
        proof: c.proof,
        rank: rank(id), order: i + 0.5
      });
    });

    const list = o.onlyNew ? out.filter(x => x.rank === 0) : out;
    return list.sort(function (a, b) {
      if (a.rank !== b.rank) return a.rank - b.rank;
      return a.order - b.order;
    });
  }

  /* every id the reel could ever contain, for the "n of m attempted" meter */
  function reelIds() {
    return reel().map(x => x.id);
  }

  return { levelOf, hasProof, state, isDone, advance, clear, setMany,
    count, tickState, reel, reelIds, courseIdOf };
})();


/* ── src/core.latex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   LaTeX commands, offered the way a code editor offers them.

   The brief asks for "a compact palette of the LaTeX commands needed for the
   current theorem … contextual and small rather than an indiscriminate
   reference manual." A sheet of keys at the bottom of the screen satisfied
   the letter of that and failed the thumb: on a phone it covers the input you
   are typing into, and finding one symbol among sixty is slower than knowing
   how to spell it.

   So the catalogue is now a completion source. Type `\va` and the matches
   appear inline above the keyboard, ranked with the commands this theorem
   actually uses first. Tap one, or press Tab. When nothing is being typed the
   same strip shows the contextual commands, so discovery still works by
   thumb — which is what the palette was really for.
   ══════════════════════════════════════════════════════════════════════════ */

const Latex = (function () {

  /* show = what the learner sees, ins = what gets typed, cmd = the macro name,
     alt = extra words that should also find it. */

    { g: 'Greek', show: 'ε', cmd: 'varepsilon', ins: '\\varepsilon ', desc: 'epsilon' },
    { g: 'Greek', show: 'δ', cmd: 'delta', ins: '\\delta ', desc: 'delta' },

    { g: 'Greek', show: 'σ', cmd: 'sigma', ins: '\\sigma ' },

    { g: 'Greek', show: 'ω', cmd: 'omega', ins: '\\omega ' },

    { g: 'Logic', show: '∀', cmd: 'forall', ins: '\\forall ', desc: 'for all' },
    { g: 'Logic', show: '∃', cmd: 'exists', ins: '\\exists ', desc: 'there exists' },

    { g: 'Sets', show: 'ℝ', cmd: 'mathbb', needle: '\\mathbb{R}', ins: '\\mathbb{R}', desc: 'the reals', alt: 'R reals' },
    { g: 'Sets', show: 'ℕ', cmd: 'mathbb', needle: '\\mathbb{N}', ins: '\\mathbb{N}', desc: 'the naturals', alt: 'N naturals' },
    { g: 'Sets', show: 'ℚ', cmd: 'mathbb', needle: '\\mathbb{Q}', ins: '\\mathbb{Q}', desc: 'the rationals', alt: 'Q rationals' },

    { g: 'Relations', show: '≤', cmd: 'le', ins: '\\le ', desc: 'at most' },
    { g: 'Relations', show: '≥', cmd: 'ge', ins: '\\ge ', desc: 'at least' },
    { g: 'Relations', show: '≠', cmd: 'ne', ins: '\\ne ', desc: 'not equal' },
    { g: 'Relations', show: '≈', cmd: 'approx', ins: '\\approx ' },
    { g: 'Relations', show: '≡', cmd: 'equiv', ins: '\\equiv ' },
    { g: 'Relations', show: '↦', cmd: 'mapsto', ins: '\\mapsto ' },
    { g: 'Relations', show: '≔', cmd: 'coloneqq', ins: ':= ', desc: 'defined as' },

    { g: 'Analysis', show: '→', cmd: 'to', ins: '\\to ', desc: 'tends to' },
    { g: 'Analysis', show: '∞', cmd: 'infty', ins: '\\infty ', desc: 'infinity' },
    { g: 'Analysis', show: 'sup', cmd: 'sup', ins: '\\sup ', desc: 'supremum' },
    { g: 'Analysis', show: 'inf', cmd: 'inf', ins: '\\inf ', desc: 'infimum' },
    { g: 'Analysis', show: 'lim', cmd: 'lim', ins: '\\lim_{' + CARET + '}', desc: 'limit' },
    { g: 'Analysis', show: 'limsup', cmd: 'limsup', ins: '\\limsup_{' + CARET + '}' },
    { g: 'Analysis', show: 'Σ', cmd: 'sum', ins: '\\sum_{' + CARET + '}^{}', desc: 'sum' },
    { g: 'Analysis', show: '∏', cmd: 'prod', ins: '\\prod_{' + CARET + '}^{}', desc: 'product' },
    { g: 'Analysis', show: '∫', cmd: 'int', ins: '\\int_{' + CARET + '}^{}', desc: 'integral' },
    { g: 'Analysis', show: '∂', cmd: 'partial', ins: '\\partial ' },
    { g: 'Analysis', show: '⋯', cmd: 'cdots', ins: '\\cdots ' },
    { g: 'Analysis', show: '…', cmd: 'ldots', ins: '\\ldots ' },
    { g: 'Analysis', show: 'f′', cmd: 'prime', ins: "f'(" + CARET + ')', desc: 'derivative' },

    { g: 'Structure', show: 'a⁄b', cmd: 'frac', ins: '\\frac{' + CARET + '}{}', desc: 'fraction' },
    { g: 'Structure', show: '√', cmd: 'sqrt', ins: '\\sqrt{' + CARET + '}', desc: 'square root' },
    { g: 'Structure', show: 'xⁿ', cmd: 'sup-script', ins: '^{' + CARET + '}', desc: 'superscript', alt: 'power exponent' },
    { g: 'Structure', show: 'xₙ', cmd: 'sub-script', ins: '_{' + CARET + '}', desc: 'subscript', alt: 'index' },
    { g: 'Structure', show: '|x|', cmd: 'abs', ins: '|' + CARET + '|', desc: 'absolute value', alt: 'modulus' },
    { g: 'Structure', show: '‖x‖', cmd: 'norm', ins: '\\|' + CARET + '\\|', desc: 'norm' },
    { g: 'Structure', show: '( )', cmd: 'left', ins: '\\left(' + CARET + '\\right)', desc: 'sized brackets' },
    { g: 'Structure', show: '[ ]', cmd: 'bracket', ins: '[' + CARET + ']' },
    { g: 'Structure', show: 'quad', cmd: 'quad', ins: '\\quad ', desc: 'wide space' },
    { g: 'Structure', show: 'cases', cmd: 'cases', ins: '\\begin{cases}' + CARET + '\\end{cases}', desc: 'case split' }
  ];

  /* what stays offered even when the statement does not use it */
  const CORE = ['varepsilon', 'delta', 'forall', 'exists', 'in', 'le', 'to',
    'frac', 'abs', 'sub-script', 'sup-script', 'mathbb', 'lim', 'text'];

  function macrosIn(tex) {
    const src = String(tex || '');
    const found = {};
    src.replace(/\\([a-zA-Z]+)/g, function (whole, m) { found[m] = true; return whole; });
    if (/_\{|_[a-zA-Z0-9]/.test(src)) found['sub-script'] = true;
    if (/\^\{|\^[a-zA-Z0-9]/.test(src)) found['sup-script'] = true;
    if (/\|/.test(src)) found['abs'] = true;
    return found;
  }

  /* Which catalogue entries this concept's own statement uses. These rank
     first everywhere — it is the whole of "contextual". */
  function usedBy(concept) {
    const src = String((concept && concept.statement) || '');
    const used = macrosIn(src);
    const taken = {};
    return CATALOG.filter(function (k) {
      const hit = k.needle ? src.indexOf(k.needle) >= 0 : !!used[k.cmd];
      if (!hit || taken[k.ins]) return false;
      taken[k.ins] = true;
      return true;
    });
  }

  /* ── completion ───────────────────────────────────────────────────────── */

  /* The token being typed: a backslash and the letters after it, ending at
     the caret. Returns null when the caret is not inside one. */
  function tokenAt(value, caret) {
    const upto = String(value || '').slice(0, caret);
    const m = /\\([a-zA-Z]*)$/.exec(upto);
    if (!m) return null;
    return { text: m[0], word: m[1], from: caret - m[0].length, to: caret };
  }

  const score = (k, word, ctx) => {
    const w = word.toLowerCase();
    const cmd = k.cmd.toLowerCase();
    const hay = (cmd + ' ' + (k.desc || '') + ' ' + (k.alt || '')).toLowerCase();
    let s = -1;
    if (!w) s = 40;
    else if (cmd === w) s = 100;
    else if (cmd.indexOf(w) === 0) s = 80 - cmd.length;
    else if (hay.indexOf(w) >= 0) s = 40 - cmd.length;
    if (s < 0) return s;
    if (ctx[k.ins]) s += 25;                      /* this theorem uses it */
    if (CORE.indexOf(k.cmd) >= 0) s += 6;
    return s;
  };

  /* Ranked completions for a partial command. `word` may be '' — that is the
     bare-backslash case, and it should still offer something useful. */
  function complete(word, concept, limit) {
    const ctx = {};
    usedBy(concept).forEach(k => { ctx[k.ins] = true; });
    const seen = {};
    return CATALOG
      .map(k => ({ k: k, s: score(k, String(word || ''), ctx) }))
      .filter(function (r) {
        if (r.s < 0 || seen[r.k.ins]) return false;
        seen[r.k.ins] = true;
        return true;
      })
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 12)
      .map(r => r.k);
  }

  /* The idle strip: what to offer when nothing is being typed. Contextual
     first, then the essentials, because a learner who does not know the
     spelling cannot start a completion at all. */
  function suggestions(concept, limit) {
    const ctx = usedBy(concept);
    const taken = {};
    ctx.forEach(k => { taken[k.ins] = true; });
    const core = CATALOG.filter(k => !taken[k.ins] && CORE.indexOf(k.cmd) >= 0);
    return ctx.concat(core).slice(0, limit || 14);
  }

  /* ── insertion ────────────────────────────────────────────────────────── */

  /* Replace [from,to) with `ins`. CARET marks where the caret should land.

     `opts.wrap` decides what happens to the text being replaced, and the two
     cases are genuinely different:

       wrap: true   the range is the user's SELECTION and CARET means "put it
                    here", so \sqrt{▮} around a selected x gives \sqrt{x}.
       wrap: false  the range is a half-typed command being replaced by the
                    completion, so it must be DISCARDED — keeping it turns
                    `\eps` + `$\varepsilon▮$` into `$\varepsilon\eps$`. */
  function splice(field, from, to, ins, opts) {
    const wrap = !opts || opts.wrap !== false;
    const val = field.value;
    const selected = wrap ? val.slice(from, to) : '';
    let text = ins, caretAt;
    const mark = text.indexOf(CARET);
    if (mark >= 0) {
      text = text.slice(0, mark) + selected + text.slice(mark + 1);
      caretAt = from + mark + selected.length;
    } else {
      caretAt = from + text.length;
    }
    field.value = val.slice(0, from) + text + val.slice(to);
    field.focus();
    try { field.setSelectionRange(caretAt, caretAt); } catch (e) { /* detached field */ }
    field.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* Insert at the caret, replacing the selection. */
  function insert(field, ins) {
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const b = field.selectionEnd == null ? a : field.selectionEnd;
    splice(field, a, b, ins);
  }

  /* Is the caret inside maths? Count the unescaped $ before it: an odd number
     means an inline span is open. `$$` counts as one delimiter either way, so
     a display block reads as "open" too, which is the answer we want. */
  function inMath(value, caret) {
    const upto = String(value || '').slice(0, caret);
    let n = 0;
    for (let i = 0; i < upto.length; i++) {
      if (upto[i] !== '$') continue;
      if (i && upto[i - 1] === '\\') continue;      /* an escaped \$ is a literal */
      if (upto[i + 1] === '$') { i += 1; }
      n += 1;
    }
    return n % 2 === 1;
  }

  /* Accept a completion: the partial command being typed is replaced whole.

     In a markdown line, a command typed in the middle of a sentence has to be
     wrapped in $…$ or it renders as literal backslash-text. Doing that at
     accept time is what lets someone write a paragraph and drop a symbol into
     it without stopping to think about delimiters. */
  function accept(field, entry, opts) {
    const o = opts || {};
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const tok = tokenAt(field.value, a);
    let ins = entry.ins;

    if (o.wrapInMath && !inMath(field.value, tok ? tok.from : a)) {
      const body = ins.replace(/\s+$/, '');
      const mark = body.indexOf(CARET);
      ins = mark >= 0
        ? '$' + body.slice(0, mark) + CARET + body.slice(mark + 1) + '$'
        : '$' + body + CARET + '$';
    }

    /* the half-typed command is replaced, never wrapped */
    if (tok) splice(field, tok.from, tok.to, ins, { wrap: false });
    else insert(field, ins);
  }

  return { CATALOG, CARET, usedBy, tokenAt, inMath, complete, suggestions, insert, splice, accept };
})();


/* ── src/ui.parts.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Shared view parts. Small builders every view reuses, so the views stay
   about study logic rather than markup.
   ══════════════════════════════════════════════════════════════════════════ */

const UI = (function () {

  const el = DOM.el;

  /* The page heading is also the focus target after a route change. */
  const title = (text, kicker) => el('div', {}, [
    kicker ? el('div', { class: 'kicker', text: kicker }) : null,
    el('h1', { tabindex: '-1', id: 'pagetitle', text: text })
  ]);

  function crumb(items) {
    const row = el('nav', { class: 'crumb', 'aria-label': 'Breadcrumb' });
    items.forEach(function (it, i) {
      if (i) row.appendChild(el('span', { 'aria-hidden': 'true', text: '›' }));
      row.appendChild(it.href
        ? el('a', { href: Router.href(it.href), text: it.text })
        : el('span', { text: it.text }));
    });
    return row;
  }

  /* authored HTML + TeX. Typeset by the caller via UI.math(node). */
  const prose = (html, cls) => el('div', { class: 'prose' + (cls ? ' ' + cls : ''), html: html || '' });
  const math = node => Tex.typeset(node);

  const kindBadge = c => el('span', { class: 'badge', text: c.kind || 'note' });

  const tierBadge = c => (c.tier && c.tier !== 'core')
    ? el('span', { class: 'badge warn', text: c.tier === 'ext' ? 'extension' : c.tier })
    : null;

  /* Level-aware: at Level 2 a ticked note with an unworked proof is not
     "completed", it is part-way, and saying otherwise would make the badge and
     the tree disagree. */
  const doneBadge = function (id) {
    const st = Progress.state(id);
    if (st === 'done') return el('span', { class: 'badge ok', text: '✓ completed' });
    if (st === 'part') return el('span', { class: 'badge warn', text: 'proof outstanding' });
    return null;
  };

  const meter = (a, b, ok) => el('div', { class: 'meter' + (ok ? ' ok' : '') }, [
    el('i', { style: { width: DOM.pct(a, b) + '%' } })
  ]);

  function stat(n, label, sub, bar) {
    return el('div', { class: 'stat' }, [
      el('div', { class: 'n', text: n }),
      el('div', { class: 'l', text: label }),
      sub ? el('div', { class: 's', text: sub }) : null,
      bar ? el('div', { style: { marginTop: '8px' } }, [bar]) : null
    ]);
  }

  const empty = (msg, extra) => el('div', { class: 'empty' }, [el('p', { text: msg }), extra || null]);

  /* Mastery ladder. Level 1 is a tick; level 2 is proof work actually done
     (or achieved automatically on notes that have no proof). */
  function ladder(done, proofDone, hasProof, courseId) {
    const names = ['Completed', 'Recognised', 'Recalled', 'Applied', 'Transferred'];
    const at = (hasProof === false && done) ? 2 : proofDone ? 2 : done ? 1 : 0;
    const caption = at === 2
      ? (hasProof === false ? '2 · completed (no proof needed)' : '2 · proof worked through')
      : at === 1 ? '1 · completed'
      : '1 · not yet completed';
    const right = (hasProof === false)
      ? (done ? 'counts for levels 1 & 2' : 'tick to complete levels 1 & 2')
      : (at === 2 ? 'proof worked through (Level 2)'
        : (Store.level(courseId) === 2 ? 'work the proof to reach level 2' : 'work the proof for level 2'));
    return el('div', {}, [
      el('div', { class: 'ladder' }, names.map((n, i) =>
        el('span', { class: i < at ? 'on' : '', title: n }))),
      el('div', { class: 'ladder-l' }, [
        el('span', { text: caption }),
        el('span', { text: right })
      ])
    ]);
  }

  /* The current level as a badge, and the switch that changes it. Level 2 is
     never entered by accident: it has to be unlocked first (Store.unlocked). */
  const levelBadge = courseId => el('span', {
    class: 'badge' + (Store.level(courseId) === 2 ? ' accent' : ''),
    text: 'Level ' + Store.level(courseId)
  });

  /* The level switch for ONE course. Level 2 has to be unlocked on that course
     before it can be picked, and switching is always a deliberate press. */
  function levelSwitch(course, after) {
    const id = course.id;
    const row = el('div', { class: 'row' }, [1, 2].map(function (n) {
      const can = n === 1 || Store.unlocked(id);
      const b = el('button', {
        class: 'chip', type: 'button', 'aria-pressed': String(Store.level(id) === n),
        disabled: !can, text: 'Level ' + n
      });
      b.addEventListener('click', function () {
        Store.setLevel(id, n);
        DOM.announce(course.title + ' set to Level ' + Store.level(id) + '.');
        if (after) after();
      });
      return b;
    }));
    if (!Store.unlocked(id)) {
      row.appendChild(el('button', {
        class: 'chip', type: 'button', text: 'Unlock Level 2',
        on: { click: function () {
          Store.unlock(id, true);
          Store.setLevel(id, 2);
          DOM.announce('Level 2 unlocked for ' + course.title + '.');
          if (after) after();
        } }
      }));
    }
    return row;
  }

  /* Which of a concept's prerequisites are not ticked yet. One definition,
     because the note view and the syllabus tree both offer the same cascade
     and must never disagree about what it would do. */
  const pendingPrereqs = id =>
    Pool.chain(id).filter(x => x.id !== id && !Store.isDone(x.id));

  /* An inline question with real buttons, used where window.confirm would
     lose the detail that makes the question answerable. */
  function ask(opts) {
    const host = el('div', { class: 'card tint ask', role: 'group',
      'aria-label': opts.title });
    DOM.add(host, [
      el('div', { class: 'kicker', text: opts.title }),
      opts.body ? el('div', { class: 'small', style: { margin: '6px 0 10px' } }, [opts.body]) : null,
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button',
          text: a.label, on: { click: a.onClick } })))
    ]);
    return host;
  }

  function mockBanner() {
    if (!Pool.isMock()) return null;
    return el('div', { class: 'banner' }, [
      el('span', { 'aria-hidden': 'true', text: '⚠' }),
      el('span', {}, [
        el('b', { text: 'Mock content. ' }),
        'These ten theorems and sixteen questions are placeholders written to test the study loop — ' +
        'not validated material, and not from any past paper. The real pool arrives through the ' +
        'data handoff.'
      ])
    ]);
  }

  /* Attempt-before-reveal gate. Nothing is revealed until the learner says
     they have tried, or does something that counts as trying. */
  function gate(opts) {
    const host = el('div', { class: 'gate' });
    const body = el('div', { class: 'stack', style: { gap: '12px' } }, [
      el('p', { class: 'small muted', style: { margin: 0 }, text: opts.hint }),
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button', text: a.label,
          on: { click: a.onClick } })))
    ]);
    host.appendChild(body);
    return host;
  }

  /* A titled block whose body is only built when it is opened. */
  function reveal(label, buildBody, opts) {
    const o = opts || {};
    const body = el('div', { class: 'b', hidden: true });
    const btn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false',
      text: o.openLabel || 'Show' });
    let built = false;
    btn.addEventListener('click', function () {
      const open = body.hidden;
      if (open && !built) { built = true; DOM.add(body, buildBody()); math(body); }
      body.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? (o.closeLabel || 'Hide') : (o.openLabel || 'Show');
    });
    const box = el('div', { class: 'reveal' }, [
      el('div', { class: 'h' }, [el('span', { text: label }), btn]), body
    ]);
    return box;
  }

  const typeBadge = q => el('span', {
    class: 'badge accent',
    text: q.type
  });

  function metaRow(q) {
    const bits = [q.marks + ' ' + DOM.plural(q.marks, 'mark')];
    bits.push(q.neg ? (q.negLabel || q.neg) + ' if wrong' : 'no negative marking');
    if (q.time) bits.push('about ' + Math.round(q.time / 30) / 2 + ' min');
    const row = el('div', { class: 'row' });
    bits.forEach(function (b, i) {
      if (i) row.appendChild(el('span', { class: 'count dot', 'aria-hidden': 'true', text: '·' }));
      row.appendChild(el('span', { class: 'count', text: b }));
    });
    return row;
  }

  const clock = ms => {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0');
  };

  return {
    title, crumb, prose, math, kindBadge, tierBadge, doneBadge, meter, stat, empty,
    ladder, levelBadge, levelSwitch, ask, pendingPrereqs, mockBanner, gate, reveal, typeBadge, metaRow, clock
  };
})();


/* ── src/fig.library.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The figures.

   Each one exists because the picture carries something the prose struggles
   with. Two of them take a control, because the whole point of ε–δ and of
   uniform continuity is what happens when you MOVE the parameter.

   Mock note: FIGMAP attaches figures to the placeholder concept ids. Validated
   data can instead declare `figs: ['fig.eps-delta']` on the concept itself and
   this map becomes unnecessary.
   ══════════════════════════════════════════════════════════════════════════ */

const FIGLIB = {

  /* ── §2.3 supremum: the least ceiling, not an element ─────────────────── */
  'fig.sup-inf': {
    title: 'sup sits outside the set',
    caption: 'Dots are $1-1/n$. Every dot is below $1$, and nothing below $1$ bounds them all — ' +
      'so $\\sup S=1$ even though $1$ is never an element. The infimum $0$ <i>is</i> an element.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 120, xr: [-0.12, 1.42], yr: [0, 1], padT: 26, padB: 34 });
      p.add(Fig.svg('line', { class: 'axis', x1: p.X(-0.12), y1: p.Y(0.42),
        x2: p.X(1.42), y2: p.Y(0.42) }));

      for (let n = 1; n <= 9; n++) {
        const x = 1 - 1 / n;
        const d = p.dot(x, 0.42, '', 4);
        d.classList.add('fade-in');
        d.style.animationDelay = (n * 55) + 'ms';
      }
      p.dot(0, 0.42, 'good', 4.6);
      p.label(0, 0.16, 'inf S = 0 ∈ S', 'lbl');

      /* the open circle at the supremum */
      p.add(Fig.svg('circle', { cx: p.X(1), cy: p.Y(0.42), r: 5, class: 'pt open' }));
      p.line(1, 0.42, 1, 0.9, 'guide');
      p.label(1, 1.0, 'sup S = 1 ∉ S', 'lbl');

      /* upper bounds sliding down to the least one */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.35) - p.X(1)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(1), y1: p.Y(0.06), x2: p.X(1), y2: p.Y(0.78),
        class: 'hot' }));
      g.appendChild(Fig.svg('text', { x: p.X(1) + 6, y: p.Y(0.1), text: 'upper bounds →',
        'text-anchor': 'start' }));
      p.add(g);
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'Number line with the points 1 minus 1 over n approaching 1; 1 is marked as an open circle.');
    }
  },

  /* ── §2.3 completeness: the hole in ℚ ─────────────────────────────────── */
  'fig.gap': {
    title: 'the hole completeness fills',
    caption: 'Rationals close in on $\\sqrt3$ from both sides. In $\\mathbb{Q}$ there is nothing ' +
      'at the meeting point, so the set of rationals below it has no least upper bound there. ' +
      'In $\\mathbb{R}$ the point exists — that is the whole content of the axiom.',
    build(api) {
      const R = Math.sqrt(3);
      const p = Fig.plot({ w: 330, h: 125, xr: [1.6, 1.87], yr: [0, 1], padT: 24, padB: 36 });
      p.axes({ y0: 0.4, yAxis: false, ticks: [{ x: 1.65, t: '1.65' }, { x: 1.8, t: '1.80' }] });

      const left = [1.7, 1.73, 1.731, 1.7320];
      const right = [1.85, 1.79, 1.7325, 1.73206];
      left.forEach(function (x, i) {
        const d = p.dot(x, 0.4, '', 3.6);
        d.classList.add('fade-in'); d.style.animationDelay = (i * 160) + 'ms';
      });
      right.forEach(function (x, i) {
        const d = p.dot(x, 0.4, 'good', 3.6);
        d.classList.add('fade-in'); d.style.animationDelay = (i * 160 + 80) + 'ms';
      });

      p.add(Fig.svg('line', { x1: p.X(R), y1: p.Y(0.12), x2: p.X(R), y2: p.Y(0.82), class: 'hot' }));
      p.add(Fig.svg('circle', { cx: p.X(R), cy: p.Y(0.4), r: 5, class: 'pt open' }));
      p.label(R, 0.95, '√3 ∉ ℚ', 'lbl');
      p.label(1.69, 0.13, 'x² < 3', '', 'middle');
      p.label(1.80, 0.13, 'x² > 3', '', 'middle');
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'Rationals approaching the square root of three from both sides, with a gap marked at the limit.');
    }
  },

  /* ── §3.4 Bolzano–Weierstrass ─────────────────────────────────────────── */
  'fig.bw': {
    title: 'a convergent subsequence, extracted',
    caption: 'The sequence $x_n=(-1)^n\\left(1-\\frac1n\\right)$ never settles, but the ' +
      'even-indexed terms (green) march to $1$. Boundedness alone guarantees some such ' +
      'subsequence exists — never that the sequence itself converges.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 175, xr: [0, 22], yr: [-1.25, 1.25], padT: 18, padB: 26,
        padL: 26, padR: 14 });
      p.rect(0, -1, 22, 1, 'band');
      p.axes({ y0: 0, yAxis: false });
      p.line(0, 1, 22, 1, 'guide');
      p.label(20.4, 1.12, 'limit 1', 'lbl', 'end');
      p.label(1.6, -1.16, '|xₙ| ≤ 1', '', 'start');

      for (let n = 1; n <= 20; n++) {
        const y = (n % 2 ? -1 : 1) * (1 - 1 / n);
        const even = n % 2 === 0;
        const d = p.dot(n, y, even ? 'good' : '', even ? 4.4 : 3.2);
        d.classList.add('fade-in');
        d.style.animationDelay = (n * 45) + 'ms';
      }
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'A bounded oscillating sequence with its even-indexed subsequence converging to one.');
    }
  },

  /* ── §5.1 ε–δ, interactive ────────────────────────────────────────────── */
  'fig.eps-delta': {
    title: 'ε is demanded, δ is your answer',
    interactive: true,
    caption: 'Drag ε. The orange band is the tolerance you must land inside; the blue strip is ' +
      'the δ that answers it for $f(x)=x^2$ at $c=1$. Continuity means you can always answer — ' +
      'and δ shrinks as ε does.',
    build(api) {
      const f = x => x * x, c = 1, fc = 1;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 2], yr: [0, 4], padT: 14, padB: 26,
        padL: 30, padR: 14 });

      const epsBand = p.rect(0, fc - 0.6, 2, fc + 0.6, 'band warm');
      const delBand = p.rect(c - 0.2, 0, c + 0.2, 4, 'band');
      p.axes({ ticks: [{ x: 1, t: 'c = 1' }, { x: 2, t: '2' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, fc, c, fc, 'guide');
      p.dot(c, fc, '', 4.4);
      const epsLbl = Fig.svg('text', { x: p.X(1.98), y: p.Y(fc) - 6, class: 'lbl',
        'text-anchor': 'end', text: 'ε' });
      const delLbl = Fig.svg('text', { x: p.X(c), y: p.Y(3.75), class: 'lbl',
        'text-anchor': 'middle', text: 'δ' });
      p.add(epsLbl, delLbl);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function deltaFor(eps) {
        const right = Math.sqrt(fc + eps) - c;
        const left = (fc - eps) > 0 ? c - Math.sqrt(fc - eps) : c;
        return Math.min(right, left);
      }
      function update(eps) {
        const d = deltaFor(eps);
        const lo = Math.max(0, fc - eps), hi = Math.min(4, fc + eps);
        epsBand.setAttribute('y', p.Y(hi));
        epsBand.setAttribute('height', Math.abs(p.Y(lo) - p.Y(hi)));
        delBand.setAttribute('x', p.X(c - d));
        delBand.setAttribute('width', p.X(c + d) - p.X(c - d));
        epsLbl.setAttribute('y', p.Y(hi) - 5);
      }
      api.control({
        min: 0.1, max: 1.6, step: 0.05, value: 0.6, label: 'epsilon',
        format: v => 'ε = ' + v.toFixed(2) + '  →  δ = ' + deltaFor(v).toFixed(3),
        onInput: update
      });
      update(0.6);
      p.svg.setAttribute('aria-label',
        'The curve y equals x squared with an epsilon band around f of c and the delta strip that answers it.');
    }
  },

  /* ── §5.1 sequential criterion ────────────────────────────────────────── */
  'fig.seq-crit': {
    title: 'sequences carry continuity',
    caption: 'Any $x_n\\to c$ on the axis is dragged by $f$ to $f(x_n)\\to f(c)$ on the other. ' +
      'Continuity is exactly the promise that <i>every</i> such input sequence behaves; one ' +
      'misbehaving sequence is all it takes to destroy it.',
    build(api) {
      const f = x => 0.6 + 1.1 * Math.sin(1.15 * x);
      const c = 1.6;
      const p = Fig.plot({ w: 330, h: 205, xr: [0, 2.4], yr: [0, 2], padT: 14, padB: 26,
        padL: 34, padR: 14 });
      p.axes({ ticks: [{ x: c, t: 'c' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, f(c), c, f(c), 'guide');
      p.line(c, 0, c, f(c), 'guide');
      p.dot(c, f(c), '', 4.6);
      p.label(0.22, f(c) + 0.14, 'f(c)', 'lbl', 'start');

      for (let n = 1; n <= 5; n++) {
        const x = c - 0.62 / n;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (250 + n * 200) + 'ms';
        g.appendChild(Fig.svg('circle', { cx: p.X(x), cy: p.Y(0), r: 3.2, class: 'pt' }));
        g.appendChild(Fig.svg('circle', { cx: p.X(0), cy: p.Y(f(x)), r: 3.2, class: 'pt good' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(0), x2: p.X(x), y2: p.Y(f(x)),
          class: 'guide' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(f(x)), x2: p.X(0), y2: p.Y(f(x)),
          class: 'guide' }));
        p.add(g);
      }
      p.label(1.02, 0.12, 'xₙ → c', 'lbl', 'middle');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Points approaching c on the x-axis with their images approaching f of c on the y-axis.');
    }
  },

  /* ── §5.3 max–min attained ────────────────────────────────────────────── */
  'fig.maxmin': {
    title: 'on [a,b] the extremes are reached',
    caption: 'Closed and bounded, plus continuity: the supremum and infimum of the range are ' +
      'not merely approached, they are <i>values</i> $f(x^*)$ and $f(x_*)$ at actual points of ' +
      'the interval.',
    build(api) {
      const f = x => 1.55 + 0.85 * Math.sin(3.1 * x) + 0.18 * x;
      const a = 0.25, b = 1.95;
      let xh = a, xl = a;
      for (let i = 0; i <= 400; i++) {
        const x = a + (b - a) * i / 400;
        if (f(x) > f(xh)) xh = x;
        if (f(x) < f(xl)) xl = x;
      }
      const p = Fig.plot({ w: 330, h: 200, xr: [0, 2.2], yr: [0, 3], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: a, t: 'a' }, { x: b, t: 'b' }] });
      const cur = p.path(p.curve(f, a, b), 'curve');
      [[xh, 'good'], [xl, 'bad']].forEach(function (pair, i) {
        const x = pair[0];
        p.line(0, f(x), x, f(x), 'guide');
        p.line(x, 0, x, f(x), 'guide');
        const d = p.dot(x, f(x), pair[1], 5);
        d.classList.add('fade-in');
        d.style.animationDelay = (700 + i * 240) + 'ms';
      });
      p.label(0.24, f(xh) + 0.17, 'max f(x*)', 'lbl', 'start');
      p.label(0.24, f(xl) - 0.28, 'min f(x⁎)', 'lbl', 'start');
      p.dot(a, f(a), '', 3.4);
      p.dot(b, f(b), '', 3.4);
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'A continuous curve on a closed interval with its maximum and minimum points marked.');
    }
  },

  /* ── §5.3 the same theorem with the hypothesis removed ────────────────── */
  'fig.no-max': {
    title: 'drop “closed” and the maximum goes',
    caption: '$f(x)=1/x$ on $(0,1]$ is continuous, attains its minimum at $x=1$, and has no ' +
      'maximum at all: $f(1/n)=n$. Nothing is contradicted — the theorem simply never applied.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 185, xr: [0, 1.2], yr: [0, 6], padT: 18, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.14 ? 1 / x : NaN), 0.14, 1.2), 'curve');
      p.dot(1, 1, 'good', 4.6);
      p.label(1.06, 1.2, 'min = 1', 'lbl', 'start');
      p.add(Fig.svg('circle', { cx: p.X(0.167), cy: p.Y(6), r: 4.4, class: 'pt open' }));

      const arrow = Fig.svg('g', { class: 'rise-y' });
      arrow.style.setProperty('--dy', '18px');
      arrow.appendChild(Fig.svg('path', { class: 'hot',
        d: 'M' + p.X(0.09) + ' ' + p.Y(2.2) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' M' + (p.X(0.09) - 4) + ' ' + (p.Y(5.4) + 6) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' L' + (p.X(0.09) + 4) + ' ' + (p.Y(5.4) + 6) }));
      p.add(arrow);
      p.label(0.33, 5.2, 'no maximum', 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'One over x on the half-open interval, escaping upward near zero with its minimum at x equals one.');
    }
  },

  /* ── §5.3 IVT, on the cubic the questions use ─────────────────────────── */
  'fig.ivt': {
    title: 'a sign change forces a crossing',
    caption: '$p(x)=x^3-3x+1$ has $p(0)=1>0$ and $p(1)=-1<0$, so the level $0$ is crossed ' +
      'somewhere inside. The theorem gives <i>at least one</i> $c$; that it is exactly one here ' +
      'comes from $p\' &lt; 0$ on $(0,1)$, not from the IVT.',
    build(api) {
      const p3 = x => x * x * x - 3 * x + 1;
      const root = 0.34729636;
      const p = Fig.plot({ w: 330, h: 195, xr: [-0.06, 1.12], yr: [-1.35, 1.35], padT: 16,
        padB: 26, padL: 30, padR: 16 });
      p.axes({ y0: 0, ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const cur = p.path(p.curve(p3, -0.06, 1.12), 'curve');
      p.dot(0, 1, 'good', 4.4);
      p.dot(1, -1, 'bad', 4.4);
      p.label(0.08, 1.16, 'p(0) = 1', 'lbl', 'start');
      p.label(0.94, -1.2, 'p(1) = −1', 'lbl', 'end');

      const sweep = Fig.svg('line', { x1: p.X(-0.06), y1: p.Y(0), x2: p.X(1.12), y2: p.Y(0),
        class: 'hot' });
      p.add(sweep);
      const rd = p.dot(root, 0, '', 5.2);
      rd.classList.add('fade-in');
      rd.style.animationDelay = '900ms';
      p.line(root, 0, root, -0.55, 'guide');
      p.label(root, -0.72, 'c ≈ 0.35', 'lbl');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.draw(sweep);
      p.svg.setAttribute('aria-label',
        'The cubic x cubed minus three x plus one crossing zero between zero and one.');
    }
  },

  /* ── §5.4 uniform continuity, interactive ─────────────────────────────── */
  'fig.unif': {
    title: 'one δ cannot serve the whole set',
    interactive: true,
    caption: 'Slide the δ-window along $f(x)=1/x$ on $(0,1]$. Its width never changes; the ' +
      'height of the image band does — without limit as you approach $0$. That is precisely ' +
      'the failure of uniform continuity.',
    build(api) {
      const f = x => 1 / x, d = 0.05;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 1.1], yr: [0, 12], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      const imgBand = p.rect(0, 1, 1.1, 2, 'band warm');
      const winBand = p.rect(0.5 - d, 0, 0.5 + d, 12, 'band');
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.083 ? f(x) : NaN), 0.083, 1.1), 'curve');
      const lo = p.dot(0.45, f(0.45), '', 3.8);
      const hi = p.dot(0.55, f(0.55), '', 3.8);
      const gap = Fig.svg('text', { class: 'lbl', 'text-anchor': 'start', text: '' });
      p.add(gap);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function update(u) {
        const a = Math.max(0.085, u - d), b = Math.min(1.1, u + d);
        const ya = f(b), yb = Math.min(12, f(a));
        winBand.setAttribute('x', p.X(a));
        winBand.setAttribute('width', p.X(b) - p.X(a));
        imgBand.setAttribute('y', p.Y(yb));
        imgBand.setAttribute('height', Math.abs(p.Y(ya) - p.Y(yb)));
        lo.setAttribute('cx', p.X(a)); lo.setAttribute('cy', p.Y(Math.min(12, f(a))));
        hi.setAttribute('cx', p.X(b)); hi.setAttribute('cy', p.Y(f(b)));
        gap.setAttribute('x', p.X(0.3));
        gap.setAttribute('y', p.Y(Math.min(11.4, yb)) - 6);
        gap.textContent = 'image height ≈ ' + (Math.min(12, f(a)) - f(b)).toFixed(2);
      }
      api.control({
        min: 0.1, max: 0.95, step: 0.01, value: 0.5, label: 'window position',
        format: v => 'window at x = ' + v.toFixed(2) + ',  width 2δ = ' + (2 * d).toFixed(2),
        onInput: update
      });
      update(0.5);
      p.svg.setAttribute('aria-label',
        'A fixed-width window sliding along one over x; the image band grows without bound near zero.');
    }
  },

  /* ── §5.4 why compactness rescues it ─────────────────────────────────── */
  'fig.heine': {
    title: 'on a closed interval there is a worst case',
    caption: 'Equal δ-windows along $\\sqrt{x}$ on $[0,1]$. The image bands differ, the worst ' +
      'one sits at $0$ — and because the interval is closed and bounded the worst one <i>exists</i>. ' +
      'Take δ for that window and it serves everywhere: continuity becomes uniform.',
    build(api) {
      const f = Math.sqrt;
      const p = Fig.plot({ w: 330, h: 190, xr: [0, 1.06], yr: [0, 1.15], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const w = 1 / 6;
      for (let i = 0; i < 6; i++) {
        const a = i * w, b = a + w;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (200 + i * 130) + 'ms';
        g.appendChild(Fig.svg('rect', {
          x: p.X(a), y: p.Y(f(b)), width: p.X(b) - p.X(a),
          height: Math.abs(p.Y(f(a)) - p.Y(f(b))),
          class: i === 0 ? 'band warm' : 'band good'
        }));
        g.appendChild(Fig.svg('line', { x1: p.X(a), y1: p.Y(0), x2: p.X(a), y2: p.Y(f(b)),
          class: 'guide' }));
        p.add(g);
      }
      const cur = p.path(p.curve(f, 0, 1.02), 'curve');
      p.label(0.2, 0.52, 'worst window', 'lbl', 'start');
      p.line(0.185, 0.5, 0.09, 0.42, 'guide');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Equal-width windows under the square-root curve, the tallest image band at zero.');
    }
  },

  /* ── §6.2 MVT, on the interval the questions use ─────────────────────── */
  'fig.mvt': {
    title: 'the tangent parallel to the chord',
    caption: 'For $f(x)=x^2$ on $[1,3]$ the chord has slope $\\frac{9-1}{3-1}=4$, and $f\'(c)=2c=4$ ' +
      'puts the parallel tangent at $c=2$. The theorem promises such a $c$ exists; finding it is ' +
      'just solving that equation.',
    build(api) {
      const f = x => x * x, a = 1, b = 3, c = 2;
      const p = Fig.plot({ w: 330, h: 205, xr: [0.6, 3.5], yr: [0, 11], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: 'a=1' }, { x: 2, t: 'c=2' }, { x: 3, t: 'b=3' }] });
      const cur = p.path(p.curve(f, 0.6, 3.5), 'curve');

      p.add(Fig.svg('line', { x1: p.X(a), y1: p.Y(f(a)), x2: p.X(b), y2: p.Y(f(b)), class: 'hot' }));
      p.label(1.35, 6.4, 'chord, slope 4', 'lbl', 'start');

      /* tangent y = 4x - 4, slid into place */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.1) - p.X(2)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(0.9), y1: p.Y(4 * 0.9 - 4),
        x2: p.X(3.2), y2: p.Y(4 * 3.2 - 4), class: 'curve', 'stroke-dasharray': '5 4' }));
      p.add(g);
      p.dot(a, f(a), '', 4); p.dot(b, f(b), '', 4);
      const cd = p.dot(c, f(c), 'good', 5.2);
      cd.classList.add('fade-in'); cd.style.animationDelay = '1.2s';
      p.label(2.42, 3.1, "f′(c) = 4", 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'The parabola x squared with the chord from one to three and the parallel tangent at c equals two.');
    }
  }
};

/* Concept → figures, while the pool is mock. Validated concepts should carry
   their own `figs: [...]` and this map can then be deleted. */
const FIGMAP = {
  'm.2.3.2': ['fig.sup-inf'],
  'm.2.3.6': ['fig.gap'],
  'm.3.4.8': ['fig.bw'],
  'm.5.1.1': ['fig.eps-delta'],
  'm.5.1.3': ['fig.seq-crit'],
  'm.5.3.4': ['fig.maxmin', 'fig.no-max'],
  'm.5.3.7': ['fig.ivt'],
  'm.5.4.1': ['fig.unif'],
  'm.5.4.3': ['fig.heine'],
  'm.6.2.4': ['fig.mvt']
};


/* ── src/comp.figure.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Figure engine.

   Figures are hand-drawn inline SVG, built from the mathematics rather than
   pasted in as images: they inherit the theme's colours, scale to any width,
   animate on entry, and a few of them take a control so the learner can move
   the parameter that matters (ε, or the window position).

   This file is the plumbing — coordinate mapping, the frame, the controls.
   The figures themselves live in fig.library.js.
   ══════════════════════════════════════════════════════════════════════════ */

const Fig = (function () {

  const el = DOM.el;
  const s = DOM.svg;

  /* A plot area inside a viewBox: maths coordinates in, pixels out. */
  function plot(opts) {
    const o = Object.assign({ w: 330, h: 190, pad: 20, xr: [0, 1], yr: [0, 1] }, opts);
    const l = o.padL == null ? o.pad : o.padL;
    const b = o.padB == null ? o.pad : o.padB;
    const t = o.padT == null ? o.pad : o.padT;
    const r = o.padR == null ? o.pad : o.padR;
    const X = x => l + (x - o.xr[0]) / (o.xr[1] - o.xr[0]) * (o.w - l - r);
    const Y = y => (o.h - b) - (y - o.yr[0]) / (o.yr[1] - o.yr[0]) * (o.h - t - b);

    /* sampled path of a function, clipped to the y range */
    function curve(fn, from, to, steps) {
      const n = steps || 90;
      const a = from == null ? o.xr[0] : from;
      const z = to == null ? o.xr[1] : to;
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = a + (z - a) * i / n;
        const y = fn(x);
        if (!isFinite(y) || y < o.yr[0] - 1e-9 || y > o.yr[1] + 1e-9) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1) + ' ';
        pen = true;
      }
      return d.trim();
    }

    const svg = s('svg', {
      viewBox: '0 0 ' + o.w + ' ' + o.h, role: 'img',
      preserveAspectRatio: 'xMidYMid meet'
    });

    return {
      svg: svg, X: X, Y: Y, curve: curve, box: o,
      add(...kids) { kids.forEach(k => k && svg.appendChild(k)); return this; },
      /* axes with optional tick labels */
      axes(opts2) {
        const a = opts2 || {};
        const y0 = a.y0 == null ? o.yr[0] : a.y0;
        this.add(s('line', { class: 'axis', x1: X(o.xr[0]), y1: Y(y0), x2: X(o.xr[1]), y2: Y(y0) }));
        if (a.yAxis !== false) {
          this.add(s('line', { class: 'axis', x1: X(a.x0 == null ? o.xr[0] : a.x0), y1: Y(o.yr[0]),
            x2: X(a.x0 == null ? o.xr[0] : a.x0), y2: Y(o.yr[1]) }));
        }
        (a.ticks || []).forEach(function (tk) {
