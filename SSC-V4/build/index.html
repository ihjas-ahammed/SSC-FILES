<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f4">
<meta name="description" content="Real Analysis study system — theorem-statement recall, OMR-first objective questions, and a LaTeX theorem-writing workspace.">
<title>Real Analysis · Study System</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap">
<style>
/* app/src/ui.css */
/* ══════════════════════════════════════════════════════════════════════════
   Real Analysis study system — design system.

   Mobile-first, two themes, one content column. Depth comes from layered
   glass over a soft aurora, not from heavy borders. Motion is short, springy
   and always optional (prefers-reduced-motion switches it all off).
   ══════════════════════════════════════════════════════════════════════════ */

@property --p { syntax: '<number>'; inherits: false; initial-value: 0; }

:root {
  /* paper-light */
  --paper:#faf8f4; --surface:#fff; --surface-2:#f4f0e9; --surface-3:#e9e2d6;
  --ink:#191614; --ink-2:#554e46; --ink-3:#847b70;
  --rule:#e4dccf; --rule-2:#cec4b3;
  --accent:#2a45c7; --accent-ink:#fff; --accent-soft:#e9ecfd; --accent-line:#b6c0f3;
  --ok:#0d6b49; --ok-soft:#e1f2ea; --ok-line:#a3d4bf;
  --bad:#a9251d; --bad-soft:#fbe9e7; --bad-line:#e9b1ab;
  --warn:#845200; --warn-soft:#fbf0db; --warn-line:#e2c588;

  /* glass + aurora */
  --glass:rgba(255,255,255,.72); --glass-2:rgba(255,255,255,.55);
  --glass-line:rgba(25,22,20,.08); --blur:saturate(180%) blur(18px);
  --aurora-1:rgba(42,69,199,.13); --aurora-2:rgba(196,120,0,.11); --aurora-3:rgba(13,107,73,.09);

  --font-prose:'Lora',Georgia,'Times New Roman',serif;
  --font-ui:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:ui-monospace,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;

  --r-s:9px; --r-m:14px; --r-l:22px;
  --sp:16px;
  --head-h:54px; --tab-h:62px;
  --shadow:0 1px 2px rgba(25,22,20,.05),0 10px 30px -14px rgba(25,22,20,.18);
  --shadow-2:0 2px 6px rgba(25,22,20,.06),0 24px 48px -20px rgba(25,22,20,.28);

  --ease:cubic-bezier(.32,.72,0,1);
  --spring:cubic-bezier(.34,1.44,.5,1);
  --dur:.34s; --dur-s:.18s;
  color-scheme:light;
}

:root[data-theme=dark] {
  --paper:#101216; --surface:#191c22; --surface-2:#21252d; --surface-3:#2b313b;
  --ink:#eae7e1; --ink-2:#aaa39b; --ink-3:#7e7770;
  --rule:#2b3038; --rule-2:#3a414d;
  --accent:#93a8ff; --accent-ink:#0d1020; --accent-soft:#1c2340; --accent-line:#39457a;
  --ok:#5ec79c; --ok-soft:#122a21; --ok-line:#26533e;
  --bad:#ff9087; --bad-soft:#2c1715; --bad-line:#5d2926;
  --warn:#e2b567; --warn-soft:#292013; --warn-line:#51401e;

  --glass:rgba(25,28,34,.68); --glass-2:rgba(25,28,34,.5);
  --glass-line:rgba(255,255,255,.07); --blur:saturate(150%) blur(20px);
  --aurora-1:rgba(94,120,255,.17); --aurora-2:rgba(255,167,64,.10); --aurora-3:rgba(64,200,150,.10);

  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -16px rgba(0,0,0,.7);
  --shadow-2:0 2px 8px rgba(0,0,0,.45),0 28px 56px -22px rgba(0,0,0,.8);
  color-scheme:dark;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
  font:400 16px/1.55 var(--font-ui);
  padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px);
  overflow-x:hidden;
}
/* the light the glass bends */
body::before{
  content:''; position:fixed; inset:-20% -10% auto -10%; height:120vh; z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(52vw 42vw at 12% 4%, var(--aurora-1), transparent 62%),
    radial-gradient(44vw 40vw at 92% 14%, var(--aurora-2), transparent 64%),
    radial-gradient(48vw 44vw at 50% 92%, var(--aurora-3), transparent 66%);
}

h1,h2,h3{ margin:0; font-weight:600; letter-spacing:-.014em; line-height:1.22; }
h1{ font-size:1.42rem; } h2{ font-size:1.06rem; } h3{ font-size:.95rem; }
p{ margin:0 0 .7em; } ul,ol{ margin:0 0 .7em; padding-left:1.25em; } li{ margin:.25em 0; }
a{ color:var(--accent); text-underline-offset:2px; }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:5px; }
h1[tabindex="-1"]:focus,main:focus{ outline:none; }
.sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skip{ position:absolute; left:8px; top:-48px; z-index:60; background:var(--accent);
  color:var(--accent-ink); padding:10px 14px; border-radius:var(--r-s); transition:top .15s; }
.skip:focus{ top:8px; }

/* ── shell ───────────────────────────────────────────────────────────────── */
.top{
  position:sticky; top:0; z-index:30; height:var(--head-h);
  display:flex; align-items:center; gap:10px; padding:0 14px;
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-bottom:1px solid var(--glass-line);
}
.brand{ display:flex; align-items:baseline; gap:8px; min-width:0; }
.brand b{ font-weight:600; font-size:.98rem; white-space:nowrap; }
.brand span{ color:var(--ink-3); font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; }
.top .grow{ flex:1 1 auto; }
.icon-btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-width:42px; height:42px; padding:0 11px;
  border:1px solid var(--glass-line); background:var(--glass-2);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-radius:999px; cursor:pointer; font-size:.82rem; color:var(--ink-2);
  transition:transform var(--dur-s) var(--spring), color var(--dur-s), border-color var(--dur-s);
}
.icon-btn:hover{ color:var(--ink); border-color:var(--rule-2); }
.icon-btn:active{ transform:scale(.93); }
.icon-btn svg{ width:17px; height:17px; flex:0 0 auto; }

nav.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:grid; grid-template-columns:repeat(5,1fr);
  background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  border-top:1px solid var(--glass-line);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
nav.tabs a{
  position:relative; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:3px; height:var(--tab-h); text-decoration:none;
  color:var(--ink-3); font-size:.66rem; letter-spacing:.02em; font-weight:500;
  transition:color var(--dur-s);
}
nav.tabs a svg{ width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round;
  transition:transform var(--dur) var(--spring), stroke-width var(--dur-s); }
nav.tabs a:active svg{ transform:scale(.88); }
nav.tabs a[aria-current=page]{ color:var(--accent); }
nav.tabs a[aria-current=page] svg{ stroke-width:2.2; transform:translateY(-1px) scale(1.06); }
nav.tabs a[aria-current=page]::before{
  content:''; position:absolute; top:0; left:50%; width:26px; height:3px;
  transform:translateX(-50%); border-radius:0 0 4px 4px; background:var(--accent);
}

main{ display:block; }
.wrap{ width:100%; max-width:730px; margin:0 auto; padding:18px 14px 30px; }
.wrap.bleed{ padding:0; max-width:none; }

@media (min-width:880px){
  :root{ --tab-h:48px; }
  body{ padding-bottom:0; }
  nav.tabs{ position:sticky; top:var(--head-h); bottom:auto; border-top:0;
    border-bottom:1px solid var(--glass-line); }
  nav.tabs a{ flex-direction:row; gap:9px; font-size:.84rem; }
  nav.tabs a[aria-current=page]::before{ top:auto; bottom:0; width:38px; border-radius:4px 4px 0 0; }
  .wrap{ padding:28px 20px 64px; }
}

/* ── motion ──────────────────────────────────────────────────────────────── */
@keyframes rise{ from{ opacity:0; transform:translateY(10px) } to{ opacity:1; transform:none } }
@keyframes pop{ from{ opacity:0; transform:scale(.9) } to{ opacity:1; transform:none } }
@keyframes slideIn{ from{ opacity:0; transform:translateY(16px) scale(.985) }
  to{ opacity:1; transform:none } }
@keyframes sweepIn{ from{ clip-path:inset(0 100% 0 0) } to{ clip-path:inset(0) } }
@keyframes drawIn{ from{ stroke-dashoffset:var(--len,600) } to{ stroke-dashoffset:0 } }
@keyframes glow{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

.view-in{ animation:rise var(--dur) var(--ease) both; }
.stagger>*{ animation:rise .42s var(--ease) both; animation-delay:calc(var(--i,0)*45ms); }
.verdict{ animation:slideIn .4s var(--spring) both; }

/* ── type helpers ────────────────────────────────────────────────────────── */
.kicker{ font-size:.7rem; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--ink-3); }
.lede{ font-family:var(--font-prose); font-size:1.04rem; color:var(--ink-2); }
.muted{ color:var(--ink-3); }
.small{ font-size:.81rem; }
.mono{ font-family:var(--font-mono); font-size:.86em; }
.stack{ display:flex; flex-direction:column; gap:var(--sp); }
.row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.spread{ display:flex; align-items:center; justify-content:space-between; gap:10px; }

/* ── surfaces ────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-m);
  padding:16px; box-shadow:var(--shadow);
}
.card.flat{ box-shadow:none; }
.card.tint{ background:var(--surface-2); box-shadow:none; }
.card.glass{
  background:var(--glass); border-color:var(--glass-line);
  backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
  box-shadow:var(--shadow-2);
}
a.card,button.card{ display:block; text-decoration:none; color:inherit; text-align:left;
  width:100%; cursor:pointer; transition:transform var(--dur-s) var(--ease),
  border-color var(--dur-s), box-shadow var(--dur-s); }
a.card:hover,button.card:hover{ border-color:var(--accent-line); box-shadow:var(--shadow-2); }
a.card:active,button.card:active{ transform:scale(.985); }
.card h2,.card h3{ margin-bottom:6px; }
.hr{ height:1px; background:var(--rule); border:0; margin:14px 0; }

/* ── badges & chips ──────────────────────────────────────────────────────── */
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px;
  font-size:.68rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--rule);
  white-space:nowrap;
}
.badge.accent{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-line); }
.badge.ok{ background:var(--ok-soft); color:var(--ok); border-color:var(--ok-line); }
.badge.bad{ background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line); }
.badge.warn{ background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line); }
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink-2);
  font-size:.81rem; cursor:pointer; text-decoration:none; min-height:36px;
  transition:transform var(--dur-s) var(--spring), background var(--dur-s),
    color var(--dur-s), border-color var(--dur-s);
}
.chip:hover{ border-color:var(--rule-2); color:var(--ink); }
.chip:active{ transform:scale(.94); }
.chip[aria-pressed=true],.chip.on{ background:var(--accent-soft); color:var(--accent);
  border-color:var(--accent-line); font-weight:600; }
.chip[disabled]{ opacity:.55; cursor:not-allowed; }
.chip.ghost{ background:transparent; border-style:dashed; }

/* ── buttons ─────────────────────────────────────────────────────────────── */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:0 18px; border-radius:var(--r-s); cursor:pointer;
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font-size:.93rem; font-weight:500; text-decoration:none; text-align:center;
  transition:transform var(--dur-s) var(--spring), filter var(--dur-s), border-color var(--dur-s);
}
.btn:hover{ border-color:var(--rule-2); }
.btn:active{ transform:scale(.97); }
.btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink);
  font-weight:600; box-shadow:0 6px 18px -8px color-mix(in srgb,var(--accent) 70%,transparent); }
.btn.primary:hover{ filter:brightness(1.07); }
.btn.quiet{ background:transparent; border-color:transparent; color:var(--accent); }
.btn.full{ width:100%; }
.btn[disabled]{ opacity:.6; cursor:not-allowed; transform:none; }
.btn.primary[disabled]{ background:var(--surface-2); border-color:var(--rule);
  color:var(--ink-3); opacity:1; box-shadow:none; }
.btn.sm{ min-height:36px; padding:0 14px; font-size:.84rem; }
.btn-row{ display:flex; gap:10px; flex-wrap:wrap; }
.btn-row>.btn{ flex:1 1 auto; }

/* ── concept reference links ──────────────────────────────────────────────── */
.concept-ref{
  display:inline-flex; align-items:center; gap:4px; padding:1px 8px; margin:0 2px;
  border-radius:var(--r-s, 6px); background:var(--accent-soft); color:var(--accent);
  font-weight:600; font-size:.88em; text-decoration:none;
  border:1px solid var(--accent-line); vertical-align:baseline;
  max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  transition:background var(--dur-s), color var(--dur-s), border-color var(--dur-s), transform var(--dur-s);
}
.concept-ref:hover{
  background:var(--accent); color:var(--accent-ink, #ffffff);
  border-color:var(--accent); text-decoration:none;
}
.concept-ref:active{ transform:scale(.96); }

.proof-scratchpad{
  width:100%; min-height:85px; padding:10px 12px; margin-top:8px; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font-family:inherit; font-size:.9rem; line-height:1.5; resize:vertical;
}
.proof-scratchpad:focus{
  outline:none; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft);
}

/* ── prose (authored HTML + TeX) ─────────────────────────────────────────── */
.prose{ font-family:var(--font-prose); font-size:1.03rem; line-height:1.68; color:var(--ink); }
.prose b{ font-weight:600; }
.prose :last-child{ margin-bottom:0; }
.prose mjx-container[display=true]{ overflow-x:auto; overflow-y:hidden; padding:2px 0; }
mjx-container{ max-width:100%; }
.prose.tight{ font-size:.97rem; line-height:1.62; }

/* ── stats, meters, rings ────────────────────────────────────────────────── */
.stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.stat{ background:var(--surface); border:1px solid var(--rule); border-radius:var(--r-m);
  padding:12px; }
.stat .n{ font-size:1.55rem; font-weight:600; letter-spacing:-.025em; line-height:1.1; }
.stat .l{ font-size:.67rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3);
  margin-top:3px; }
.stat .s{ font-size:.74rem; color:var(--ink-2); margin-top:4px; }
.meter{ height:6px; border-radius:999px; background:var(--surface-3); overflow:hidden; }
.meter>i{ display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--ok)));
  transition:width .6s var(--ease); animation:sweepIn .7s var(--ease) both; }
.meter.ok>i{ background:var(--ok); }

.ring{ position:relative; width:38px; height:38px; flex:0 0 auto; border-radius:50%;
  display:grid; place-items:center; transition:--p .7s var(--ease);
  background:conic-gradient(var(--accent) calc(var(--p)*1%), var(--surface-3) 0); }
.ring.done{ background:conic-gradient(var(--ok) calc(var(--p)*1%), var(--surface-3) 0); }
.ring>i{ width:30px; height:30px; border-radius:50%; background:var(--surface);
  display:grid; place-items:center; font-style:normal; font-size:.62rem;
  font-family:var(--font-mono); color:var(--ink-2); }
.ring.done>i{ color:var(--ok); }

/* ── mastery ladder ─────────────────────────────────────────────────────── */
.ladder{ display:flex; gap:6px; }
.ladder>span{ flex:1 1 0; height:6px; border-radius:999px; background:var(--surface-3);
  transition:background var(--dur); }
.ladder>span.on{ background:var(--ok); animation:sweepIn .5s var(--ease) both; }
.ladder-l{ display:flex; justify-content:space-between; font-size:.66rem; color:var(--ink-3);
  margin-top:6px; }

/* ── the tick tree ───────────────────────────────────────────────────────── */
.tree{ display:flex; flex-direction:column; gap:10px; }
.tnode{ border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface);
  box-shadow:var(--shadow); overflow:hidden; }
.tnode.sub{ border-radius:var(--r-s); box-shadow:none; background:var(--surface-2); }
.trow{ display:flex; align-items:stretch; gap:0; }
.tlabel{
  flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:11px;
  padding:13px 14px 13px 4px; background:none; border:0; cursor:pointer; text-align:left;
}
.tnode.sub .tlabel{ padding-top:11px; padding-bottom:11px; }
.tlabel .tt{ flex:1 1 auto; min-width:0; }
.tlabel .tt b{ display:block; font-weight:500; font-size:.97rem; letter-spacing:-.005em; }
.tlabel .tt span{ display:block; font-size:.75rem; color:var(--ink-3); margin-top:1px; }
.tnode.sub .tlabel .tt b{ font-size:.92rem; }
.chev{ flex:0 0 auto; width:20px; height:20px; color:var(--ink-3);
  transition:transform var(--dur) var(--spring); }
.tlabel[aria-expanded=true] .chev{ transform:rotate(90deg); color:var(--accent); }

/* the tick itself — the thing you came here to press */
.tick{
  flex:0 0 auto; width:42px; display:grid; place-items:center; cursor:pointer;
  background:none; border:0;
}
.tick>i{
  width:24px; height:24px; border-radius:7px; border:2px solid var(--rule-2);
  display:grid; place-items:center; font-style:normal; font-size:.78rem; color:transparent;
  background:var(--surface); line-height:1;
  transition:background var(--dur-s), border-color var(--dur-s), color var(--dur-s),
    transform var(--dur-s) var(--spring);
}
.tick:hover>i{ border-color:var(--accent); }
.tick:active>i{ transform:scale(.86); }
.tick[aria-checked=true]>i{ background:var(--ok); border-color:var(--ok); color:#fff; }
.tick[aria-checked=mixed]>i{ background:var(--accent-soft); border-color:var(--accent);
  color:var(--accent); }
.tick[aria-checked=true]>i,.tick[aria-checked=mixed]>i{ animation:pop .26s var(--spring) both; }

/* animated open/close: 0fr -> 1fr, no JS measuring */
.acc{ display:grid; grid-template-rows:0fr; transition:grid-template-rows var(--dur) var(--ease); }
.acc.open{ grid-template-rows:1fr; }
.acc>.acc-in{ overflow:hidden; }
.acc-pad{ padding:0 8px 10px; display:flex; flex-direction:column; gap:8px; }
.tnode.sub .acc-pad{ padding:0 6px 8px; }
.tnode.sec .acc-pad{ padding:0 0 8px; gap:6px; }
/* One faint rail at the course level and none below it: every deeper level
   keeps the full width, so a three-deep tree never squeezes the text. */
.rail{ border-left:2px solid var(--rule); padding-left:8px; display:flex;
  flex-direction:column; gap:8px; }
/* a section is a flush band inside its module, not another card */
.tnode.sec{ background:transparent; border:0; border-top:1px solid var(--rule);
  border-radius:0; box-shadow:none; }
.tnode.sec:first-child{ border-top:0; }
.tnode.sec .tlabel{ padding-left:2px; }

.crow{ display:flex; align-items:stretch; border-radius:var(--r-s); background:var(--surface);
  border:1px solid var(--rule); overflow:hidden; }
.tnode.sub .crow{ background:var(--surface); }
.crow>a{ flex:1 1 auto; min-width:0; display:flex; align-items:center; gap:10px;
  padding:10px 12px 10px 2px; text-decoration:none; color:inherit; }
.crow .tt{ flex:1 1 auto; min-width:0; }
.crow>a:hover{ background:var(--surface-2); }
.crow .tt b{ display:block; font-weight:500; font-size:.92rem; }
.crow .tt span{ display:block; font-size:.72rem; color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.crow.done{ border-color:var(--ok-line); }
.crow.done .tt b{ color:var(--ink-2); }

/* ── recall reel ─────────────────────────────────────────────────────────── */
/* ── recall reel ──────────────────────────────────────────────────────────
   One swipe, one card — the Shorts/Reels rule, and it is `scroll-snap-stop:
   always` that enforces it. Without it a flick keeps its momentum and sails
   past two or three snap points before settling, which reads as "it swiped
   twice". With it the scroller must come to rest on the very next snap point
   however hard the flick was.

   That rule only holds if every card is EXACTLY one viewport tall. So the card
   is a fixed-height frame and its content scrolls inside `.inner`, whose
   overscroll behaviour is left at `auto` on purpose: it scrolls to its own end
   and then chains out to the reel. (`contain` was tried and is what trapped
   the gesture on a long card — the inner scroller ate the touch and refused to
   hand it back.)

   `position:relative` on the reel is load-bearing too: it makes the reel the
   offsetParent of its cards, so card.offsetTop and reel.scrollTop are in the
   same coordinate system. And nothing here may carry a `transform`, because
   the browser snaps to the TRANSFORMED box — a decorative scale() silently
   moves every snap point. */
.reel{
  position:relative;
  height:calc(100dvh - var(--head-h) - var(--tab-h) - env(safe-area-inset-bottom,0px));
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain;
  scroll-snap-type:y mandatory; scroll-behavior:smooth;
  scrollbar-width:none;
}
.reel::-webkit-scrollbar{ display:none; }
@media (min-width:880px){ .reel{ height:calc(100dvh - var(--head-h) - var(--tab-h)); } }

.reel-card{
  height:100%; flex:0 0 100%;
  scroll-snap-align:start; scroll-snap-stop:always;
  display:flex; flex-direction:column; position:relative;
  transition:opacity var(--dur) var(--ease);
  opacity:.45;
}
.reel-card.live{ opacity:1; }

/* the card's own scroll region — this is where a long statement goes */
.reel-card>.inner{
  flex:1 1 auto; width:100%; max-width:640px; margin:0 auto;
  display:flex; flex-direction:column; gap:14px;
  padding:16px 14px 46px;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.reel-card>.inner::-webkit-scrollbar{ display:none; }
/* centre short content without clipping tall content the way
   justify-content:center would inside a scroller */
.reel-card>.inner::before,
.reel-card>.inner::after{ content:''; margin:auto; }

.reel-hint{ position:absolute; left:0; right:0; bottom:10px; text-align:center;
  font-size:.7rem; color:var(--ink-3); pointer-events:none; }
.reel-hint span{ display:inline-block; animation:glow 2.6s ease-in-out infinite; }
.reel-rail{ position:fixed; right:6px; top:calc(var(--head-h) + 18px); z-index:20;
  display:flex; flex-direction:column; gap:5px; align-items:center; }
.reel-rail i{ width:5px; height:5px; border-radius:50%; background:var(--rule-2);
  transition:background var(--dur) var(--ease), height var(--dur) var(--ease); }
.reel-rail i.on{ background:var(--accent); height:16px; border-radius:3px; }
.reel-rail i.got{ background:var(--ok); }
.reel-rail i.pf{ box-shadow:0 0 0 1.5px var(--accent-line); }
@media (min-width:880px){ .reel-rail{ right:max(12px,calc(50vw - 380px)); } }

/* ── figures ─────────────────────────────────────────────────────────────── */
.fig{ border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface-2);
  overflow:hidden; }
.fig svg{ display:block; width:100%; height:auto; }
.fig-h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 13px; border-bottom:1px solid var(--rule); background:var(--surface); }
.fig-cap{ padding:10px 13px; font-size:.79rem; color:var(--ink-2); line-height:1.5;
  border-top:1px solid var(--rule); }
.fig-ctl{ display:flex; align-items:center; gap:10px; padding:10px 13px;
  border-top:1px solid var(--rule); }
.fig-ctl label{ font-size:.72rem; color:var(--ink-3); white-space:nowrap;
  font-family:var(--font-mono); }
.fig-ctl input[type=range]{ flex:1 1 auto; accent-color:var(--accent); min-width:80px; }
.fig text{ font-family:var(--font-ui); font-size:9.5px; fill:var(--ink-2); }
.fig .axis{ stroke:var(--rule-2); stroke-width:1; }
.fig .curve{ stroke:var(--accent); stroke-width:2; fill:none; stroke-linecap:round; }
.fig .curve.draw{ stroke-dasharray:var(--len,600); animation:drawIn 1.1s var(--ease) both; }
.fig .band{ fill:var(--accent); opacity:.13; }
.fig .band.warm{ fill:var(--warn); opacity:.16; }
.fig .band.good{ fill:var(--ok); opacity:.14; }
.fig .guide{ stroke:var(--ink-3); stroke-width:1; stroke-dasharray:3 3; opacity:.75; }
.fig .pt{ fill:var(--accent); }
.fig .pt.open{ fill:var(--surface); stroke:var(--accent); stroke-width:2; }
.fig .pt.good{ fill:var(--ok); } .fig .pt.bad{ fill:var(--bad); }
.fig .hot{ stroke:var(--warn); stroke-width:2; fill:none; }
.fig .lbl{ font-weight:600; fill:var(--ink); }
.fig .fade-in{ animation:pop .5s var(--spring) both; }

/* ── OMR sheet ───────────────────────────────────────────────────────────── */
.omr{ display:flex; flex-direction:column; gap:10px; margin:0; padding:0; border:0; }
.omr-opt{
  display:flex; align-items:flex-start; gap:12px; width:100%; text-align:left;
  padding:12px 14px; border:1px solid var(--rule); border-radius:var(--r-m);
  background:var(--surface); cursor:pointer; min-height:54px;
  transition:transform var(--dur-s) var(--ease), border-color var(--dur-s), background var(--dur-s);
}
.omr-opt:hover{ border-color:var(--rule-2); }
.omr-opt:active{ transform:scale(.99); }
.omr-opt .bub{
  flex:0 0 auto; width:31px; height:31px; border-radius:50%;
  border:2px solid var(--rule-2); display:grid; place-items:center;
  font-family:var(--font-mono); font-size:.8rem; font-weight:600; color:var(--ink-3);
  background:var(--paper);

    transform var(--dur-s) var(--spring);
}
.omr-opt.msq .bub{ border-radius:8px; }
.omr-opt[aria-checked=true]{ border-color:var(--accent); background:var(--accent-soft); }

  color:var(--accent-ink); transform:scale(1.08); }
.omr-opt.key{ border-color:var(--ok); background:var(--ok-soft); }
.omr-opt.key .bub{ border-color:var(--ok); color:var(--ok); }
.omr-opt.chosen-bad{ border-color:var(--bad); background:var(--bad-soft); }

.omr-opt .t{ flex:1 1 auto; min-width:0; font-family:var(--font-prose); line-height:1.5; }

.omr-mark.ok{ color:var(--ok); } .omr-mark.bad{ color:var(--bad); }

.nat-in{ display:flex; align-items:center; gap:10px; padding:12px 14px;
  border:1px solid var(--rule); border-radius:var(--r-m); background:var(--surface); }

  letter-spacing:.04em; padding:11px 12px; border:1px solid var(--rule-2);

  border-radius:var(--r-m); border:1px solid; font-size:.93rem; }
.verdict.ok{ background:var(--ok-soft); border-color:var(--ok-line); color:var(--ok); }
.verdict.bad{ background:var(--bad-soft); border-color:var(--bad-line); color:var(--bad); }
.verdict.warn{ background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn); }
.verdict b{ display:block; font-size:1rem; margin-bottom:2px; }
.verdict .g{ font-size:1.35rem; line-height:1; animation:pop .45s var(--spring) both; }

/* ── reveal blocks ───────────────────────────────────────────────────────── */
.reveal{ border:1px solid var(--rule); border-radius:var(--r-m); overflow:hidden;
  background:var(--surface); }
.reveal>.h{ display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 14px; background:var(--surface-2); font-size:.79rem; font-weight:600;
  letter-spacing:.05em; text-transform:uppercase; color:var(--ink-2); }
.reveal>.b{ padding:14px; animation:rise .34s var(--ease) both; }
.gate{ border:1px dashed var(--rule-2); border-radius:var(--r-m); padding:16px;
  background:var(--surface-2); }

/* ── write workspace ─────────────────────────────────────────────────────── */
/* ── the writing workspace ───────────────────────────────────────────────── */
/* A document that fills downward: each line's rendering sits directly above
   it, and the one live input is always at the bottom of the stack. */
.wbox{ --w-rail:26px; }
.wdoc{ display:flex; flex-direction:column; gap:2px; }
.wline{

}
.wline[role=button]{ cursor:text; }

.wline.live{ background:var(--accent-soft); }
.wnum{
  flex:0 0 var(--w-rail); text-align:right; padding-top:3px;
  font:500 .66rem/1.5 var(--font-ui); color:var(--ink-3); font-variant-numeric:tabular-nums;
  user-select:none;
}
.wout{ flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden; }
.wout .ph{ color:var(--ink-3); font-size:.8rem; }
.wout mjx-container{ margin:.15em 0 !important; }
.wout mjx-container[display=true]{ text-align:left !important; margin:.2em 0 !important; }
.wout .prose{ font-size:.96rem; }
.wout .md-p,.wout .md-l,.wout .md-q{ margin:0; }
.wout .md-h{ margin:.1em 0; }
.wout .md-l{ padding-left:1.1em; }
.wout .md-q{ border-left:2px solid var(--accent-line); padding-left:10px; color:var(--ink-2); }

.winput{
  display:flex; align-items:center; gap:6px; margin:2px 0 0;
  padding:0 6px 0 calc(var(--w-rail) - 12px);
}
.wcaret{ flex:0 0 12px; color:var(--accent); font-weight:600; }
.wfield{
  flex:1 1 auto; min-width:0; padding:11px 12px;
  border:1px solid var(--accent-line); border-radius:var(--r-m);
  background:var(--surface); color:var(--ink);
  font:400 .95rem/1.5 var(--font-mono,ui-monospace,SFMono-Regular,Menlo,monospace);
}
.wfield:focus{ outline:none; border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-soft); }
.wkey{
  flex:0 0 auto; width:38px; height:38px; border-radius:var(--r-s);
  border:1px solid var(--rule); background:var(--surface-2); color:var(--ink-2);
  cursor:pointer; font-size:1rem; display:inline-flex; align-items:center;
  justify-content:center; transition:transform var(--dur-s) var(--spring);
}
.wkey:active{ transform:scale(.9); }

/* Completions, thumb-high: a single scrolling strip immediately under the
   input rather than a sheet that covers it. */
.wstrip{
  display:flex; gap:6px; align-items:center; overflow-x:auto; padding:2px 0 4px;
  scrollbar-width:none; -webkit-overflow-scrolling:touch;
}
.wstrip::-webkit-scrollbar{ display:none; }
.wstrip-l{

  letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);
  padding-right:4px; border-right:1px solid var(--rule); margin-right:2px;
}
.wsug{
  flex:0 0 auto; display:inline-flex; flex-direction:column; align-items:center;
  gap:1px; min-width:46px; padding:6px 9px; cursor:pointer;
  border:1px solid var(--rule); border-radius:var(--r-s); background:var(--surface);
  transition:transform var(--dur-s) var(--spring), border-color var(--dur-s);
}
.wsug:active{ transform:scale(.9); }
.wsug.on{ border-color:var(--accent); background:var(--accent-soft); }
.wsug .s{ font-size:1.02rem; line-height:1.1; font-family:var(--font-prose); }
.wsug .c{ font:400 .58rem/1 var(--font-mono,ui-monospace,monospace); color:var(--ink-3);
  max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.tex-out{ min-height:66px; padding:14px; border-radius:var(--r-m);
  border:1px solid var(--rule); background:var(--surface-2); overflow-x:auto; }
.tex-out .ph{ color:var(--ink-3); font-size:.9rem; font-family:var(--font-ui); }
.tex-err{ display:flex; gap:8px; align-items:flex-start; font-size:.8rem; color:var(--warn);
  margin-top:8px; line-height:1.45; }

/* text inputs outside the workspace (the sync pass key) */
.tin{
  flex:1 1 140px; min-width:0; padding:10px 12px; border-radius:var(--r-m);
  border:1px solid var(--rule); background:var(--surface); color:var(--ink);
  font:400 .92rem/1.4 var(--font-ui);
}
.tin:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

.ask{ margin-top:12px; animation:rise var(--dur) var(--ease) both; }
.proof-done{ border-top:1px solid var(--rule); padding-top:12px; }

/* a scratchpad is a full writing workspace, set back a little so it reads as
   your space rather than more of the note */
.scratch{ margin-top:6px; padding:12px; border-radius:var(--r-m);
  border:1px dashed var(--rule-2); background:var(--surface-2); }

/* a concept ticked but with its proof still outstanding, at Level 2 */
.crow.part .tick{ border-color:var(--warn); color:var(--warn); }
.crow.part .tt b{ color:var(--ink); }

/* the sign-in gate hides the shell chrome: there is nothing to navigate to */
body.signed-out nav.tabs{ display:none; }
body.signed-out{ padding-bottom:0; }
body.signed-out .top .icon-btn{ display:inline-flex; }

/* ── lists ───────────────────────────────────────────────────────────────── */
.list{ display:flex; flex-direction:column; border:1px solid var(--rule);
  border-radius:var(--r-m); overflow:hidden; background:var(--surface); }

    oneLine:'A set can have upper bounds without having a biggest member; the LEAST such bound is called the supremum.',
    intuition:`<p>Take $S=(0,1)$, the open interval. Every number $\\ge1$ is an upper bound. But $S$ has no largest element: for any $x\\in S$, the number $(x+1)/2$ is still in $S$ and strictly bigger than $x$ — so no matter which element you point to, a bigger one is hiding in the set. Yet $1$ still feels like the natural "ceiling": it's the smallest number that is an upper bound, even though it's not itself in the set.</p>
      <p>Contrast with $S=[0,1]$: here $1$ IS a member, so it's an honest maximum — and it's also still the least upper bound. So a maximum, when it exists, is always the least upper bound too; the useful new idea is that the least upper bound can exist even when a maximum does not.</p>
      <p>This everyday distinction — "biggest element" vs "tightest ceiling" — is exactly what the formal definition of <b>supremum</b> will capture precisely and use to define completeness of $\\mathbb{R}$.</p>`,
    needs:['s.interval'],
    cards:[
      { q:'Does $S=(0,1)$ have a maximum element?', a:'No — for any $x\\in S$, $(x+1)/2\\in S$ is strictly bigger.', kind:'state' },
      { q:'What is the "natural ceiling" (least upper bound) of $(0,1)$, even though it has no maximum?', a:'$1$.', kind:'apply' },
      { q:'Trap: if a set has a maximum, is its least upper bound something different from that maximum?', a:'No — when a maximum exists, it automatically equals the least upper bound too; "supremum" only becomes a genuinely new concept for sets like open intervals that have no maximum at all.', kind:'trap' }
    ]
  }
);
