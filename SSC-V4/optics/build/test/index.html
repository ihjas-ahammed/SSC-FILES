  /* ── counting ─────────────────────────────────────────────────────────────
     l1/l2/l3 are cumulative — "how many have reached at least this level" —
     because that is what the three-colour bar draws, and `min` is the level
     the whole group has reached. */
  function count(ids) {
    const list = ids || [];
    let l1 = 0, l2 = 0, l3 = 0, min = 3;
    list.forEach(function (id) {
      const v = level(id);
      if (v >= 1) l1 += 1;
      if (v >= 2) l2 += 1;
      if (v >= 3) l3 += 1;
      if (v < min) min = v;
    });
    if (!list.length) min = 0;
    return { total: list.length, l1: l1, l2: l2, l3: l3, min: min, done: l1 };
  }

  /* what a tick button should render: 'true' | 'mixed' | 'false' */
  function tickState(ids) {
    const c = count(ids);
    if (!c.total) return 'false';
    if (c.min >= 1) return 'true';
    return c.l1 ? 'mixed' : 'false';
  }

  /* ── prerequisites ───────────────────────────────────────────────────────
     A prerequisite is satisfied once it has been READ. Nothing more is asked:
     holding a note hostage to the proof work of everything under it made the
     groundwork look permanently outstanding, and that is not what a
     prerequisite is for. */
  const prereqTarget = () => 1;
  const prereqOk = prereqId => level(prereqId) >= 1;

  /* Prerequisites of `id` that have not been read. */
  function pendingPrereqs(id) {
    return Pool.chain(id).filter(x => x.id !== id && !prereqOk(x.id));
  }

  /* Raise them to level 1 — and no further, so a cascade never promotes work
     nobody did. */
  function raisePrereqs(id) {
    const pending = pendingPrereqs(id);
    pending.forEach(function (x) {
      if (level(x.id) < 1) setTo([x.id], 1);
    });
    dropCache();
    return pending.length;
  }

  /* ── the reel queue: spaced practice ─────────────────────────────────────
     The reel only ever shows material you have said you have met. Studying a
     statement you have never read is not recall, it is reading with extra
     steps.

     Four kinds of card, and each arrives by a different act — so ticking
     topics, proofs AND questions all feed the reel:

       statement   a ticked concept's 'state' card
       proof       a ticked concept that carries a proof
       question    an objective question whose tested concept has been read
       exercise    a written exercise you have marked complete

     Order is spaced practice, not a fixed ranking. Each card sits in a
     Leitner box that rises when you state it, holds when you half-state it
     and resets when you miss it; the box picks how long the card is put away
     for. Everything due (and everything never attempted) comes first, in
     RANDOM order — so no two passes are the same — and everything not yet due
     follows, soonest first. A card you know well is therefore a long way back
     without ever being dropped.

     Nothing repeats within a pass: the queue is a list, and the reel walks it
     once. */
  const HOUR = 3600e3, DAY = 24 * HOUR;
  const INTERVAL = [10 * 60e3, HOUR, DAY, 3 * DAY, 7 * DAY, 21 * DAY];

  function dueAt(cardId) {
    const rec = Store.card(cardId);
    if (!rec || !rec.lastAt) return 0;              /* never attempted — due now */
    const b = Math.max(0, Math.min(rec.box || 0, INTERVAL.length - 1));
    return rec.lastAt + INTERVAL[b];
  }

  /* what one grade does to the box — mirrored in Store.gradeCard */
  function nextBox(box, grade) {
    if (grade === 'got') return Math.min((box || 0) + 1, INTERVAL.length - 1);
    if (grade === 'partly') return Math.max(0, (box || 0) - 1);
    return 0;
  }

  function pool() {
    const out = [];

    Pool.deck().forEach(function (card, i) {
      if (!Store.isDone(card.cid)) return;
      out.push({
        kind: 'state', id: card.id, cid: card.cid, sec: card.sec,
        title: card.title, conceptKind: card.kind,
        q: card.q, a: card.a, order: i
      });
    });

    Pool.concepts(null, { includeExt: true }).forEach(function (c, i) {
      if (!c.proof || !Store.isDone(c.id)) return;
      out.push({
        kind: 'proof', id: c.id + '#proof', cid: c.id, sec: c.sec,
        title: c.title, conceptKind: c.kind, proof: c.proof, order: i + 0.5
      });
    });

    /* an objective question joins once anything it examines has been read */
    Pool.objective().forEach(function (q, i) {
      const tested = (q.tests || []).filter(id => Pool.concept(id));
      if (!tested.length || !tested.some(id => Store.isDone(id))) return;
      const c = Pool.concept(tested[0]);
      out.push({
        kind: 'question', id: 'q:' + q.id, cid: c.id, sec: q.sec || c.sec,
        title: c.title, conceptKind: q.type, question: q, order: 1000 + i
      });
    });

    /* an exercise joins once you have marked it worked through */
    Pool.written().forEach(function (q, i) {
      if (!taskDone(q)) return;
      const c = Pool.concept((q.tests || [])[0]);
      out.push({
        kind: 'exercise', id: 'x:' + q.id, cid: c ? c.id : null, sec: q.sec || (c && c.sec),
        title: q.title || (c ? c.title : q.id), conceptKind: 'exercise',
        question: q, order: 2000 + i
      });
    });

    return out;
  }

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function reel(opts) {
    const o = opts || {};
    const now = Date.now();
    let all = pool();
    if (o.onlyNew) all = all.filter(x => !(Store.card(x.id) || {}).first);
    if (o.exclude) all = all.filter(x => !o.exclude[x.id]);

    const due = [], later = [];
    all.forEach(function (x) {
      x.due = dueAt(x.id);
      (x.due <= now ? due : later).push(x);
    });
    shuffle(due);
    later.sort((a, b) => a.due - b.due);
    return due.concat(later);
  }

  /* every id the reel could ever contain, for the "n of m attempted" meter */
  function reelIds() {
    return pool().map(x => x.id);
  }

  return {
    level, courseLevel, ceiling, ceilingOf, isDone, hasProof, courseIdOf,
    advance, advanceMany, complete, clear, setTo,
    count, tickState,
    secTaskState, taskKey, taskDone,
    pyqKey, pyqDone, pyqState,
    prereqTarget, prereqOk, pendingPrereqs, raisePrereqs,
    reel, reelIds, nextBox, dueAt, dropCache
  };
})();


/* ── flow-library/app/src/core.latex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   LaTeX commands, offered the way a code editor offers them.

   The brief asks for "a compact palette of the LaTeX commands needed for the
   current theorem … contextual and small rather than an indiscriminate
   reference manual." A sheet of keys at the bottom of the screen satisfied
   the letter of that and failed the thumb: on a phone it covers the input you
   are typing into, and finding one symbol among sixty is slower than knowing
   how to spell it.

   So the catalogue is now a completion source. Type `\va` and the matches
   appear inline above the keyboard, ranked with the commands this theorem
   actually uses first. Tap one, or press Tab. When nothing is being typed the
   same strip shows the contextual commands, so discovery still works by
   thumb — which is what the palette was really for.
   ══════════════════════════════════════════════════════════════════════════ */

const Latex = (function () {

  const CARET = String.fromCharCode(1);   /* never appears in typed LaTeX */

  /* show = what the learner sees, ins = what gets typed, cmd = the macro name,
     alt = extra words that should also find it. */
  const CATALOG = [
    { g: 'Greek', show: 'ε', cmd: 'varepsilon', ins: '\\varepsilon ', desc: 'epsilon' },
    { g: 'Greek', show: 'δ', cmd: 'delta', ins: '\\delta ', desc: 'delta' },
    { g: 'Greek', show: 'Δ', cmd: 'Delta', ins: '\\Delta ', desc: 'big delta' },
    { g: 'Greek', show: 'η', cmd: 'eta', ins: '\\eta ' },
    { g: 'Greek', show: 'θ', cmd: 'theta', ins: '\\theta ' },
    { g: 'Greek', show: 'λ', cmd: 'lambda', ins: '\\lambda ' },
    { g: 'Greek', show: 'α', cmd: 'alpha', ins: '\\alpha ' },
    { g: 'Greek', show: 'β', cmd: 'beta', ins: '\\beta ' },
    { g: 'Greek', show: 'γ', cmd: 'gamma', ins: '\\gamma ' },
    { g: 'Greek', show: 'μ', cmd: 'mu', ins: '\\mu ' },
    { g: 'Greek', show: 'σ', cmd: 'sigma', ins: '\\sigma ' },
    { g: 'Greek', show: 'φ', cmd: 'varphi', ins: '\\varphi ', desc: 'phi' },
    { g: 'Greek', show: 'π', cmd: 'pi', ins: '\\pi ' },
    { g: 'Greek', show: 'ω', cmd: 'omega', ins: '\\omega ' },

    { g: 'Logic', show: '∀', cmd: 'forall', ins: '\\forall ', desc: 'for all' },
    { g: 'Logic', show: '∃', cmd: 'exists', ins: '\\exists ', desc: 'there exists' },
    { g: 'Logic', show: '∄', cmd: 'nexists', ins: '\\nexists ', desc: 'no such' },
    { g: 'Logic', show: '⟹', cmd: 'implies', ins: '\\implies ', desc: 'implies' },
    { g: 'Logic', show: '⟺', cmd: 'iff', ins: '\\iff ', desc: 'if and only if' },
    { g: 'Logic', show: '⇒', cmd: 'Rightarrow', ins: '\\Rightarrow ' },
    { g: 'Logic', show: '¬', cmd: 'neg', ins: '\\neg ', desc: 'not' },
    { g: 'Logic', show: '∧', cmd: 'wedge', ins: '\\wedge ', desc: 'and' },
    { g: 'Logic', show: '∨', cmd: 'vee', ins: '\\vee ', desc: 'or' },
    { g: 'Logic', show: 'text', cmd: 'text', ins: '\\text{' + CARET + '}', desc: 'words inside maths' },

    { g: 'Sets', show: 'ℝ', cmd: 'mathbb', needle: '\\mathbb{R}', ins: '\\mathbb{R}', desc: 'the reals', alt: 'R reals' },
    { g: 'Sets', show: 'ℕ', cmd: 'mathbb', needle: '\\mathbb{N}', ins: '\\mathbb{N}', desc: 'the naturals', alt: 'N naturals' },
    { g: 'Sets', show: 'ℚ', cmd: 'mathbb', needle: '\\mathbb{Q}', ins: '\\mathbb{Q}', desc: 'the rationals', alt: 'Q rationals' },
    { g: 'Sets', show: 'ℤ', cmd: 'mathbb', needle: '\\mathbb{Z}', ins: '\\mathbb{Z}', desc: 'the integers', alt: 'Z integers' },
    { g: 'Sets', show: '∈', cmd: 'in', ins: '\\in ', desc: 'belongs to' },
    { g: 'Sets', show: '∉', cmd: 'notin', ins: '\\notin ', desc: 'not in' },
    { g: 'Sets', show: '⊆', cmd: 'subseteq', ins: '\\subseteq ' },
    { g: 'Sets', show: '⊂', cmd: 'subset', ins: '\\subset ' },
    { g: 'Sets', show: '∪', cmd: 'cup', ins: '\\cup ', desc: 'union' },
    { g: 'Sets', show: '∩', cmd: 'cap', ins: '\\cap ', desc: 'intersection' },
    { g: 'Sets', show: '⋃', cmd: 'bigcup', ins: '\\bigcup_{' + CARET + '}' },
    { g: 'Sets', show: '⋂', cmd: 'bigcap', ins: '\\bigcap_{' + CARET + '}' },
    { g: 'Sets', show: '∅', cmd: 'emptyset', ins: '\\emptyset ', desc: 'empty set' },
    { g: 'Sets', show: '∖', cmd: 'setminus', ins: '\\setminus ', desc: 'set difference' },
    { g: 'Sets', show: '{ }', cmd: 'lbrace', ins: '\\{' + CARET + '\\}', desc: 'braces', alt: 'set brace' },

    { g: 'Relations', show: '≤', cmd: 'le', ins: '\\le ', desc: 'at most' },
    { g: 'Relations', show: '≥', cmd: 'ge', ins: '\\ge ', desc: 'at least' },
    { g: 'Relations', show: '≠', cmd: 'ne', ins: '\\ne ', desc: 'not equal' },
    { g: 'Relations', show: '≈', cmd: 'approx', ins: '\\approx ' },
    { g: 'Relations', show: '≡', cmd: 'equiv', ins: '\\equiv ' },
    { g: 'Relations', show: '↦', cmd: 'mapsto', ins: '\\mapsto ' },
    { g: 'Relations', show: '≔', cmd: 'coloneqq', ins: ':= ', desc: 'defined as' },

    { g: 'Analysis', show: '→', cmd: 'to', ins: '\\to ', desc: 'tends to' },
    { g: 'Analysis', show: '∞', cmd: 'infty', ins: '\\infty ', desc: 'infinity' },
    { g: 'Analysis', show: 'sup', cmd: 'sup', ins: '\\sup ', desc: 'supremum' },
    { g: 'Analysis', show: 'inf', cmd: 'inf', ins: '\\inf ', desc: 'infimum' },
    { g: 'Analysis', show: 'lim', cmd: 'lim', ins: '\\lim_{' + CARET + '}', desc: 'limit' },
    { g: 'Analysis', show: 'limsup', cmd: 'limsup', ins: '\\limsup_{' + CARET + '}' },
    { g: 'Analysis', show: 'Σ', cmd: 'sum', ins: '\\sum_{' + CARET + '}^{}', desc: 'sum' },
    { g: 'Analysis', show: '∏', cmd: 'prod', ins: '\\prod_{' + CARET + '}^{}', desc: 'product' },
    { g: 'Analysis', show: '∫', cmd: 'int', ins: '\\int_{' + CARET + '}^{}', desc: 'integral' },
    { g: 'Analysis', show: '∂', cmd: 'partial', ins: '\\partial ' },
    { g: 'Analysis', show: '⋯', cmd: 'cdots', ins: '\\cdots ' },
    { g: 'Analysis', show: '…', cmd: 'ldots', ins: '\\ldots ' },
    { g: 'Analysis', show: 'f′', cmd: 'prime', ins: "f'(" + CARET + ')', desc: 'derivative' },

    { g: 'Structure', show: 'a⁄b', cmd: 'frac', ins: '\\frac{' + CARET + '}{}', desc: 'fraction' },
    { g: 'Structure', show: '√', cmd: 'sqrt', ins: '\\sqrt{' + CARET + '}', desc: 'square root' },
    { g: 'Structure', show: 'xⁿ', cmd: 'sup-script', ins: '^{' + CARET + '}', desc: 'superscript', alt: 'power exponent' },
    { g: 'Structure', show: 'xₙ', cmd: 'sub-script', ins: '_{' + CARET + '}', desc: 'subscript', alt: 'index' },
    { g: 'Structure', show: '|x|', cmd: 'abs', ins: '|' + CARET + '|', desc: 'absolute value', alt: 'modulus' },
    { g: 'Structure', show: '‖x‖', cmd: 'norm', ins: '\\|' + CARET + '\\|', desc: 'norm' },
    { g: 'Structure', show: '( )', cmd: 'left', ins: '\\left(' + CARET + '\\right)', desc: 'sized brackets' },
    { g: 'Structure', show: '[ ]', cmd: 'bracket', ins: '[' + CARET + ']' },
    { g: 'Structure', show: 'quad', cmd: 'quad', ins: '\\quad ', desc: 'wide space' },
    { g: 'Structure', show: 'cases', cmd: 'cases', ins: '\\begin{cases}' + CARET + '\\end{cases}', desc: 'case split' }
  ];

  /* what stays offered even when the statement does not use it */
  const CORE = ['varepsilon', 'delta', 'forall', 'exists', 'in', 'le', 'to',
    'frac', 'abs', 'sub-script', 'sup-script', 'mathbb', 'lim', 'text'];

  function macrosIn(tex) {
    const src = String(tex || '');
    const found = {};
    src.replace(/\\([a-zA-Z]+)/g, function (whole, m) { found[m] = true; return whole; });
    if (/_\{|_[a-zA-Z0-9]/.test(src)) found['sub-script'] = true;
    if (/\^\{|\^[a-zA-Z0-9]/.test(src)) found['sup-script'] = true;
    if (/\|/.test(src)) found['abs'] = true;
    return found;
  }

  /* Which catalogue entries this concept's own statement uses. These rank
     first everywhere — it is the whole of "contextual". */
  function usedBy(concept) {
    const src = String((concept && concept.statement) || '');
    const used = macrosIn(src);
    const taken = {};
    return CATALOG.filter(function (k) {
      const hit = k.needle ? src.indexOf(k.needle) >= 0 : !!used[k.cmd];
      if (!hit || taken[k.ins]) return false;
      taken[k.ins] = true;
      return true;
    });
  }

  /* ── completion ───────────────────────────────────────────────────────── */

  /* The token being typed: a backslash and the letters after it, ending at
     the caret. Returns null when the caret is not inside one. */
  function tokenAt(value, caret) {
    const upto = String(value || '').slice(0, caret);
    const m = /\\([a-zA-Z]*)$/.exec(upto);
    if (!m) return null;
    return { text: m[0], word: m[1], from: caret - m[0].length, to: caret };
  }

  const score = (k, word, ctx) => {
    const w = word.toLowerCase();
    const cmd = k.cmd.toLowerCase();
    const hay = (cmd + ' ' + (k.desc || '') + ' ' + (k.alt || '')).toLowerCase();
    let s = -1;
    if (!w) s = 40;
    else if (cmd === w) s = 100;
    else if (cmd.indexOf(w) === 0) s = 80 - cmd.length;
    else if (hay.indexOf(w) >= 0) s = 40 - cmd.length;
    if (s < 0) return s;
    if (ctx[k.ins]) s += 25;                      /* this theorem uses it */
    if (CORE.indexOf(k.cmd) >= 0) s += 6;
    return s;
  };

  /* Ranked completions for a partial command. `word` may be '' — that is the
     bare-backslash case, and it should still offer something useful. */
  function complete(word, concept, limit) {
    const ctx = {};
    usedBy(concept).forEach(k => { ctx[k.ins] = true; });
    const seen = {};
    return CATALOG
      .map(k => ({ k: k, s: score(k, String(word || ''), ctx) }))
      .filter(function (r) {
        if (r.s < 0 || seen[r.k.ins]) return false;
        seen[r.k.ins] = true;
        return true;
      })
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 12)
      .map(r => r.k);
  }

  /* The idle strip: what to offer when nothing is being typed. Contextual
     first, then the essentials, because a learner who does not know the
     spelling cannot start a completion at all. */
  function suggestions(concept, limit) {
    const ctx = usedBy(concept);
    const taken = {};
    ctx.forEach(k => { taken[k.ins] = true; });
    const core = CATALOG.filter(k => !taken[k.ins] && CORE.indexOf(k.cmd) >= 0);
    return ctx.concat(core).slice(0, limit || 14);
  }

  /* ── insertion ────────────────────────────────────────────────────────── */

  /* Replace [from,to) with `ins`. CARET marks where the caret should land.

     `opts.wrap` decides what happens to the text being replaced, and the two
     cases are genuinely different:

       wrap: true   the range is the user's SELECTION and CARET means "put it
                    here", so \sqrt{▮} around a selected x gives \sqrt{x}.
       wrap: false  the range is a half-typed command being replaced by the
                    completion, so it must be DISCARDED — keeping it turns
                    `\eps` + `$\varepsilon▮$` into `$\varepsilon\eps$`. */
  function splice(field, from, to, ins, opts) {
    const wrap = !opts || opts.wrap !== false;
    const val = field.value;
    const selected = wrap ? val.slice(from, to) : '';
    let text = ins, caretAt;
    const mark = text.indexOf(CARET);
    if (mark >= 0) {
      text = text.slice(0, mark) + selected + text.slice(mark + 1);
      caretAt = from + mark + selected.length;
    } else {
      caretAt = from + text.length;
    }
    field.value = val.slice(0, from) + text + val.slice(to);
    field.focus();
    try { field.setSelectionRange(caretAt, caretAt); } catch (e) { /* detached field */ }
    field.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* Insert at the caret, replacing the selection. */
  function insert(field, ins) {
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const b = field.selectionEnd == null ? a : field.selectionEnd;
    splice(field, a, b, ins);
  }

  /* Is the caret inside maths? Count the unescaped $ before it: an odd number
     means an inline span is open. `$$` counts as one delimiter either way, so
     a display block reads as "open" too, which is the answer we want. */
  function inMath(value, caret) {
    const upto = String(value || '').slice(0, caret);
    let n = 0;
    for (let i = 0; i < upto.length; i++) {
      if (upto[i] !== '$') continue;
      if (i && upto[i - 1] === '\\') continue;      /* an escaped \$ is a literal */
      if (upto[i + 1] === '$') { i += 1; }
      n += 1;
    }
    return n % 2 === 1;
  }

  /* Accept a completion: the partial command being typed is replaced whole.

     In a markdown line, a command typed in the middle of a sentence has to be
     wrapped in $…$ or it renders as literal backslash-text. Doing that at
     accept time is what lets someone write a paragraph and drop a symbol into
     it without stopping to think about delimiters. */
  function accept(field, entry, opts) {
    const o = opts || {};
    const a = field.selectionStart == null ? field.value.length : field.selectionStart;
    const tok = tokenAt(field.value, a);
    let ins = entry.ins;

    if (o.wrapInMath && !inMath(field.value, tok ? tok.from : a)) {
      const body = ins.replace(/\s+$/, '');
      const mark = body.indexOf(CARET);
      ins = mark >= 0
        ? '$' + body.slice(0, mark) + CARET + body.slice(mark + 1) + '$'
        : '$' + body + CARET + '$';
    }

    /* the half-typed command is replaced, never wrapped */
    if (tok) splice(field, tok.from, tok.to, ins, { wrap: false });
    else insert(field, ins);
  }

  return { CATALOG, CARET, usedBy, tokenAt, inMath, complete, suggestions, insert, splice, accept };
})();


/* ── flow-library/app/src/ui.parts.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Shared view parts. Small builders every view reuses, so the views stay
   about study logic rather than markup.
   ══════════════════════════════════════════════════════════════════════════ */

const UI = (function () {

  const el = DOM.el;

  /* The page heading is also the focus target after a route change. */
  const title = (text, kicker) => el('div', {}, [
    kicker ? el('div', { class: 'kicker', text: kicker }) : null,
    el('h1', { tabindex: '-1', id: 'pagetitle', text: text })
  ]);

  function crumb(items) {
    const row = el('nav', { class: 'crumb', 'aria-label': 'Breadcrumb' });
    items.forEach(function (it, i) {
      if (i) row.appendChild(el('span', { 'aria-hidden': 'true', text: '›' }));
      row.appendChild(it.href
        ? el('a', { href: Router.href(it.href), text: it.text })
        : el('span', { text: it.text }));
    });
    return row;
  }

  /* authored HTML + TeX. Typeset by the caller via UI.math(node). */
  const prose = (html, cls) => el('div', { class: 'prose' + (cls ? ' ' + cls : ''), html: html || '' });
  const math = node => Tex.typeset(node);

  const kindBadge = c => el('span', { class: 'badge', text: c.kind || 'note' });

  const tierBadge = c => {
    if (typeof Pool !== 'undefined' && Pool.isExt && Pool.isExt(c)) {
      return el('span', { class: 'badge warn', text: 'outside syllabus' });
    }
    if (c.tier && c.tier !== 'core') {
      return el('span', { class: 'badge warn', text: c.tier === 'ext' ? 'outside syllabus' : c.tier });
    }
    return null;
  };

  /* The level a concept has reached, as a badge. One vocabulary everywhere:
     1 read, 2 proof worked, 3 exercises done — and the colour says which. */
  const LEVEL_NAME = ['not started', 'read', 'proof worked', 'exercises done', 'all complete'];
  const levelBadge = function (id) {
    const n = Progress.level(id);
    if (!n) return null;
    return el('span', { class: 'badge lv' + n }, [
      DOM.mi(n >= 3 ? 'workspace_premium' : n >= 2 ? 'function' : 'check', 'xs'),
      el('span', { text: 'level ' + n + ' · ' + LEVEL_NAME[n] })
    ]);
  };

  /* `lv` is a level (1, 2, 3) to colour the fill with, or `true` for the plain
     "finished" green. Left out, the meter is accent-coloured and says nothing
     about levels — which is right for recall and first-attempt numbers. */
  const meter = (a, b, lv) => el('div', {
    class: 'meter' + (lv === true ? ' ok' : lv ? ' lv' + lv : '')
  }, [el('i', { style: { width: DOM.pct(a, b) + '%' } })]);

  /* ── the three-level bar ─────────────────────────────────────────────────
     `c` is a Progress.count(): l1/l2/l3 are cumulative, so the widths nest and
     the bar reads green | amber | red | untouched with no arithmetic. */
  function levelBar(c, opts) {
    const o = opts || {};
    const bar = el('div', { class: 'lvbar', role: 'img',
      'aria-label': c.l1 + ' read, ' + c.l2 + ' with the proof worked, ' + c.l3 +
        ' with the exercises done, of ' + c.total });
    DOM.add(bar, [
      el('i', { class: 'a', style: { width: DOM.pct(c.l1, c.total) + '%' } }),
      el('i', { class: 'b', style: { width: DOM.pct(c.l2, c.total) + '%' } }),
      el('i', { class: 'c', style: { width: DOM.pct(c.l3, c.total) + '%' } })
    ]);
    if (o.key === false) return bar;
    return el('div', {}, [bar, el('div', { class: 'lvkey' }, [
      el('span', { class: 'k1' }, [el('em', {}), el('span', { text: 'read ' + c.l1 + '/' + c.total })]),
      el('span', { class: 'k2' }, [el('em', {}), el('span', { text: 'proofs ' + c.l2 + '/' + c.total })]),
      el('span', { class: 'k3' }, [el('em', {}), el('span', { text: 'exercises ' + c.l3 + '/' + c.total })])
    ])]);
  }

  /* The ring every tree row and course card draws: coloured by the level the
     WHOLE group has reached, filled by how far it has got towards the next. */
  function levelRing(c, label) {
    const at = c.min;
    const reached = at >= 3 ? c.l3 : at >= 2 ? c.l3 : at >= 1 ? c.l2 : c.l1;
    const pc = at >= 3 ? 100 : DOM.pct(reached, c.total);
    const node = el('span', {
      class: 'ring', 'data-lv': String(at), role: 'img',
      'aria-label': (label || '') + ' level ' + at + ', ' + reached + ' of ' + c.total +
        ' at the next level'
    }, [el('i', { text: c.total ? (at >= 3 ? c.total + '/' + c.total : reached + '/' + c.total) : '—' })]);
    window.requestAnimationFrame(() => node.style.setProperty('--p', pc));
    return node;
  }

  function stat(n, label, sub, bar) {
    return el('div', { class: 'stat' }, [
      el('div', { class: 'n', text: n }),
      el('div', { class: 'l', text: label }),
      sub ? el('div', { class: 's', text: sub }) : null,
      bar ? el('div', { style: { marginTop: '8px' } }, [bar]) : null
    ]);
  }

  const empty = (msg, extra) => el('div', { class: 'empty' }, [el('p', { text: msg }), extra || null]);

  /* Mastery ladder, for ONE concept. Nothing here is chosen — each rung is
     earned by a different act, and the caption says which act is still owed. */
  function ladder(id) {
    const at = Progress.level(id);
    const hasProof = Progress.hasProof(id);
    const c = Pool.concept(id);
    const tasks = c ? Progress.secTaskState(c.sec) : { total: 0, done: 0 };

    const caption = at === 3 ? '3 · section exercises done'
      : at === 2 ? '2 · proof worked through'
      : at === 1 ? '1 · read'
      : 'not started';

    /* A stage that does not exist is not a stage you are owed: a note with no
       proof is level 2 the moment it is read, and a section with no exercises
       cannot hold anything back from green. */
    const owed = at === 0 ? 'mark it read once you have been through it'
      : at === 1 ? 'complete the proof to reach level 2'
      : at === 2 ? ('level 3: ' + tasks.done + ' of ' + tasks.total + ' section exercises done')
      : 'nothing owed';

    const seg = n => el('span', {
      class: (n <= at ? 'on l' + n : ''),
      title: n === 1 ? 'Read' : n === 2 ? (hasProof ? 'Proof worked through' : 'No proof to work')
        : 'Section exercises worked'
    });

    return el('div', {}, [
      el('div', { class: 'ladder' }, [seg(1), seg(2), seg(3)]),
      el('div', { class: 'ladder-l' }, [
        el('span', { text: caption }),
        el('span', { text: owed })
      ])
    ]);
  }

  /* Which of a concept's prerequisites have not reached the level this note is
     held to. One definition, because the note view and the syllabus tree both
     offer the same cascade and must never disagree about what it would do. */
  const pendingPrereqs = id => Progress.pendingPrereqs(id);

  /* An inline question with real buttons, used where window.confirm would
     lose the detail that makes the question answerable. */
  function ask(opts) {
    const host = el('div', { class: 'card tint ask', role: 'group',
      'aria-label': opts.title });
    DOM.add(host, [
      el('div', { class: 'kicker', text: opts.title }),
      opts.body ? el('div', { class: 'small', style: { margin: '6px 0 10px' } }, [opts.body]) : null,
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button',
          text: a.label, on: { click: a.onClick } })))
    ]);
    return host;
  }

  function mockBanner() {
    if (!Pool.isMock()) return null;
    return el('div', { class: 'banner' }, [
      DOM.mi('science'),
      el('span', {}, [
        el('b', { text: 'Mock content. ' }),
        'These ten theorems and sixteen questions are placeholders written to test the study loop — ' +
        'not validated material, and not from any past paper. The real pool arrives through the ' +
        'data handoff.'
      ])
    ]);
  }

  /* Attempt-before-reveal gate. Nothing is revealed until the learner says
     they have tried, or does something that counts as trying. */
  function gate(opts) {
    const host = el('div', { class: 'gate' });
    const body = el('div', { class: 'stack', style: { gap: '12px' } }, [
      el('p', { class: 'small muted', style: { margin: 0 }, text: opts.hint }),
      el('div', { class: 'btn-row' }, (opts.actions || []).map(a =>
        el('button', { class: 'btn' + (a.primary ? ' primary' : ''), type: 'button', text: a.label,
          on: { click: a.onClick } })))
    ]);
    host.appendChild(body);
    return host;
  }

  /* A titled block whose body is only built when it is opened. */
  function reveal(label, buildBody, opts) {
    const o = opts || {};
    const body = el('div', { class: 'b', hidden: true });
    const btn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false',
      text: o.openLabel || 'Show' });
    let built = false;
    btn.addEventListener('click', function () {
      const open = body.hidden;
      if (open && !built) { built = true; DOM.add(body, buildBody()); math(body); }
      body.hidden = !open;
      btn.setAttribute('aria-expanded', String(open));
      btn.textContent = open ? (o.closeLabel || 'Hide') : (o.openLabel || 'Show');
    });
    const box = el('div', { class: 'reveal' }, [
      el('div', { class: 'h' }, [el('span', { text: label }), btn]), body
    ]);
    return box;
  }

  const typeBadge = q => el('span', {
    class: 'badge accent',
    text: q.type
  });

  function metaRow(q) {
    const bits = [q.marks + ' ' + DOM.plural(q.marks, 'mark')];
    bits.push(q.neg ? (q.negLabel || q.neg) + ' if wrong' : 'no negative marking');
    if (q.time) bits.push('about ' + Math.round(q.time / 30) / 2 + ' min');
    const row = el('div', { class: 'row' });
    bits.forEach(function (b, i) {
      if (i) row.appendChild(el('span', { class: 'count dot', 'aria-hidden': 'true', text: '·' }));
      row.appendChild(el('span', { class: 'count', text: b }));
    });
    return row;
  }

  /* "2 minutes ago", for the sync line. Short, because it is a reassurance and
     not a measurement. */
  function ago(at) {
    const s = Math.max(0, Math.round((Date.now() - at) / 1000));
    if (s < 45) return 'just now';
    const m = Math.round(s / 60);
    if (m < 60) return m + ' ' + DOM.plural(m, 'minute') + ' ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + ' ' + DOM.plural(h, 'hour') + ' ago';
    const d = Math.round(h / 24);
    return d + ' ' + DOM.plural(d, 'day') + ' ago';
  }

  /* ── one proof step ───────────────────────────────────────────────────
     Pools name the three parts of a rung differently — `why`/`m`/`meaning`
     in one, `label`/`math`/`note` in another — so the fields are read once,
     here, and every view that shows a proof gets the same step.

     A pool that files prose under the maths field (no explanation given, and
     the text reads like a sentence rather than a formula) has it shown as the
     explanation instead of forced into display maths. */
  const MEANS_PREFIX = /^(what this (really )?means:?|meaning:?)\s*/i;

  function rungParts(r) {
    const why = r.why || r.label || '';
    let math = String(r.m || r.math || '').trim();
    let meaning = String(r.meaning || r.note || '').trim();
    if (!meaning && math && (MEANS_PREFIX.test(math) ||
        (!math.startsWith('$$') && !/^\s*\\[a-zA-Z]+/.test(math) &&
         math.split(/\s+/).length > 6 && !math.includes('\\begin')))) {
      meaning = math; math = '';
    }
    if (math && math === meaning) math = '';
    return {
      why: why,
      math: math && !math.includes('$') ? '$$' + math + '$$' : math,
      meaning: meaning.replace(MEANS_PREFIX, '')
    };
  }

  /* `fig` is an optional diagram node a project draws for this step (PROJECT.hooks.rungFig),
     shown above the maths so the picture is read first.
     `line` is an optional RealLine node drawn under the maths.
     `compact` is the recall reel's version: the explanation as a quiet
     line under the maths rather than its own labelled block. */
  function rung(r, i, opts) {
    const o = opts || {};
    const p = rungParts(r);
    return el('div', { class: 'card flat rung' + (o.compact ? ' compact' : '') }, [
      el('div', { class: 'rung-why small muted' }, [
        el('b', { text: 'Step ' + (i + 1) + ': ' }), el('span', { html: p.why })
      ]),
      o.fig || null,
      p.math ? el('div', { class: 'rung-math', html: p.math }) : null,
      o.line || null,
      p.meaning ? (o.compact
        ? el('div', { class: 'rung-note small muted', html: p.meaning })
        : el('div', { class: 'rung-meaning' }, [
            el('div', { class: 'kicker', text: 'What this really means' }),
            el('div', { class: 'prose tight', html: p.meaning })
          ])) : null
    ]);
  }

  const clock = ms => {
    const s = Math.max(0, Math.round(ms / 1000));
    return String(Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0');
  };

  return {
    title, crumb, prose, math, kindBadge, tierBadge, meter, stat, empty,
    ladder, levelBadge, levelBar, levelRing, ask, pendingPrereqs, mockBanner, gate, reveal,
    typeBadge, metaRow, clock, ago, rung, rungParts
  };
})();


/* ── flow-library/app/src/fig.library.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The figures.

   Each one exists because the picture carries something the prose struggles
   with. Two of them take a control, because the whole point of ε–δ and of
   uniform continuity is what happens when you MOVE the parameter.

   Mock note: FIGMAP attaches figures to the placeholder concept ids. Validated
   data can instead declare `figs: ['fig.eps-delta']` on the concept itself and
   this map becomes unnecessary.
   ══════════════════════════════════════════════════════════════════════════ */

const FIGLIB = {

  /* ── §2.3 supremum: the least ceiling, not an element ─────────────────── */
  'fig.sup-inf': {
    title: 'sup sits outside the set',
    caption: 'Dots are $1-1/n$. Every dot is below $1$, and nothing below $1$ bounds them all — ' +
      'so $\\sup S=1$ even though $1$ is never an element. The infimum $0$ <i>is</i> an element.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 120, xr: [-0.12, 1.42], yr: [0, 1], padT: 26, padB: 34 });
      p.add(Fig.svg('line', { class: 'axis', x1: p.X(-0.12), y1: p.Y(0.42),
        x2: p.X(1.42), y2: p.Y(0.42) }));

      for (let n = 1; n <= 9; n++) {
        const x = 1 - 1 / n;
        const d = p.dot(x, 0.42, '', 4);
        d.classList.add('fade-in');
        d.style.animationDelay = (n * 55) + 'ms';
      }
      p.dot(0, 0.42, 'good', 4.6);
      p.label(0, 0.16, 'inf S = 0 ∈ S', 'lbl');

      /* the open circle at the supremum */
      p.add(Fig.svg('circle', { cx: p.X(1), cy: p.Y(0.42), r: 5, class: 'pt open' }));
      p.line(1, 0.42, 1, 0.9, 'guide');
      p.label(1, 1.0, 'sup S = 1 ∉ S', 'lbl');

      /* upper bounds sliding down to the least one */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.35) - p.X(1)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(1), y1: p.Y(0.06), x2: p.X(1), y2: p.Y(0.78),
        class: 'hot' }));
      g.appendChild(Fig.svg('text', { x: p.X(1) + 6, y: p.Y(0.1), text: 'upper bounds →',
        'text-anchor': 'start' }));
      p.add(g);
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'Number line with the points 1 minus 1 over n approaching 1; 1 is marked as an open circle.');
    }
  },

  /* ── §2.3 completeness: the hole in ℚ ─────────────────────────────────── */
  'fig.gap': {
    title: 'the hole completeness fills',
    caption: 'Rationals close in on $\\sqrt3$ from both sides. In $\\mathbb{Q}$ there is nothing ' +
      'at the meeting point, so the set of rationals below it has no least upper bound there. ' +
      'In $\\mathbb{R}$ the point exists — that is the whole content of the axiom.',
    build(api) {
      const R = Math.sqrt(3);
      const p = Fig.plot({ w: 330, h: 125, xr: [1.6, 1.87], yr: [0, 1], padT: 24, padB: 36 });
      p.axes({ y0: 0.4, yAxis: false, ticks: [{ x: 1.65, t: '1.65' }, { x: 1.8, t: '1.80' }] });

      const left = [1.7, 1.73, 1.731, 1.7320];
      const right = [1.85, 1.79, 1.7325, 1.73206];
      left.forEach(function (x, i) {
        const d = p.dot(x, 0.4, '', 3.6);
        d.classList.add('fade-in'); d.style.animationDelay = (i * 160) + 'ms';
      });
      right.forEach(function (x, i) {
        const d = p.dot(x, 0.4, 'good', 3.6);
        d.classList.add('fade-in'); d.style.animationDelay = (i * 160 + 80) + 'ms';
      });

      p.add(Fig.svg('line', { x1: p.X(R), y1: p.Y(0.12), x2: p.X(R), y2: p.Y(0.82), class: 'hot' }));
      p.add(Fig.svg('circle', { cx: p.X(R), cy: p.Y(0.4), r: 5, class: 'pt open' }));
      p.label(R, 0.95, '√3 ∉ ℚ', 'lbl');
      p.label(1.69, 0.13, 'x² < 3', '', 'middle');
      p.label(1.80, 0.13, 'x² > 3', '', 'middle');
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'Rationals approaching the square root of three from both sides, with a gap marked at the limit.');
    }
  },

  /* ── §3.4 Bolzano–Weierstrass ─────────────────────────────────────────── */
  'fig.bw': {
    title: 'a convergent subsequence, extracted',
    caption: 'The sequence $x_n=(-1)^n\\left(1-\\frac1n\\right)$ never settles, but the ' +
      'even-indexed terms (green) march to $1$. Boundedness alone guarantees some such ' +
      'subsequence exists — never that the sequence itself converges.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 175, xr: [0, 22], yr: [-1.25, 1.25], padT: 18, padB: 26,
        padL: 26, padR: 14 });
      p.rect(0, -1, 22, 1, 'band');
      p.axes({ y0: 0, yAxis: false });
      p.line(0, 1, 22, 1, 'guide');
      p.label(20.4, 1.12, 'limit 1', 'lbl', 'end');
      p.label(1.6, -1.16, '|xₙ| ≤ 1', '', 'start');

      for (let n = 1; n <= 20; n++) {
        const y = (n % 2 ? -1 : 1) * (1 - 1 / n);
        const even = n % 2 === 0;
        const d = p.dot(n, y, even ? 'good' : '', even ? 4.4 : 3.2);
        d.classList.add('fade-in');
        d.style.animationDelay = (n * 45) + 'ms';
      }
      api.body.appendChild(p.svg);
      p.svg.setAttribute('aria-label',
        'A bounded oscillating sequence with its even-indexed subsequence converging to one.');
    }
  },

  /* ── §5.1 ε–δ, interactive ────────────────────────────────────────────── */
  'fig.eps-delta': {
    title: 'ε is demanded, δ is your answer',
    interactive: true,
    caption: 'Drag ε. The orange band is the tolerance you must land inside; the blue strip is ' +
      'the δ that answers it for $f(x)=x^2$ at $c=1$. Continuity means you can always answer — ' +
      'and δ shrinks as ε does.',
    build(api) {
      const f = x => x * x, c = 1, fc = 1;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 2], yr: [0, 4], padT: 14, padB: 26,
        padL: 30, padR: 14 });

      const epsBand = p.rect(0, fc - 0.6, 2, fc + 0.6, 'band warm');
      const delBand = p.rect(c - 0.2, 0, c + 0.2, 4, 'band');
      p.axes({ ticks: [{ x: 1, t: 'c = 1' }, { x: 2, t: '2' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, fc, c, fc, 'guide');
      p.dot(c, fc, '', 4.4);
      const epsLbl = Fig.svg('text', { x: p.X(1.98), y: p.Y(fc) - 6, class: 'lbl',
        'text-anchor': 'end', text: 'ε' });
      const delLbl = Fig.svg('text', { x: p.X(c), y: p.Y(3.75), class: 'lbl',
        'text-anchor': 'middle', text: 'δ' });
      p.add(epsLbl, delLbl);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function deltaFor(eps) {
        const right = Math.sqrt(fc + eps) - c;
        const left = (fc - eps) > 0 ? c - Math.sqrt(fc - eps) : c;
        return Math.min(right, left);
      }
      function update(eps) {
        const d = deltaFor(eps);
        const lo = Math.max(0, fc - eps), hi = Math.min(4, fc + eps);
        epsBand.setAttribute('y', p.Y(hi));
        epsBand.setAttribute('height', Math.abs(p.Y(lo) - p.Y(hi)));
        delBand.setAttribute('x', p.X(c - d));
        delBand.setAttribute('width', p.X(c + d) - p.X(c - d));
        epsLbl.setAttribute('y', p.Y(hi) - 5);
      }
      api.control({
        min: 0.1, max: 1.6, step: 0.05, value: 0.6, label: 'epsilon',
        format: v => 'ε = ' + v.toFixed(2) + '  →  δ = ' + deltaFor(v).toFixed(3),
        onInput: update
      });
      update(0.6);
      p.svg.setAttribute('aria-label',
        'The curve y equals x squared with an epsilon band around f of c and the delta strip that answers it.');
    }
  },

  /* ── §5.1 sequential criterion ────────────────────────────────────────── */
  'fig.seq-crit': {
    title: 'sequences carry continuity',
    caption: 'Any $x_n\\to c$ on the axis is dragged by $f$ to $f(x_n)\\to f(c)$ on the other. ' +
      'Continuity is exactly the promise that <i>every</i> such input sequence behaves; one ' +
      'misbehaving sequence is all it takes to destroy it.',

      const f = x => 0.6 + 1.1 * Math.sin(1.15 * x);

      const p = Fig.plot({ w: 330, h: 205, xr: [0, 2.4], yr: [0, 2], padT: 14, padB: 26,
        padL: 34, padR: 14 });
      p.axes({ ticks: [{ x: c, t: 'c' }] });
      const cur = p.path(p.curve(f), 'curve');
      p.line(0, f(c), c, f(c), 'guide');
      p.line(c, 0, c, f(c), 'guide');
      p.dot(c, f(c), '', 4.6);
      p.label(0.22, f(c) + 0.14, 'f(c)', 'lbl', 'start');

      for (let n = 1; n <= 5; n++) {

        g.style.animationDelay = (250 + n * 200) + 'ms';
        g.appendChild(Fig.svg('circle', { cx: p.X(x), cy: p.Y(0), r: 3.2, class: 'pt' }));
        g.appendChild(Fig.svg('circle', { cx: p.X(0), cy: p.Y(f(x)), r: 3.2, class: 'pt good' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(0), x2: p.X(x), y2: p.Y(f(x)),
          class: 'guide' }));
        g.appendChild(Fig.svg('line', { x1: p.X(x), y1: p.Y(f(x)), x2: p.X(0), y2: p.Y(f(x)),
          class: 'guide' }));
        p.add(g);
      }
      p.label(1.02, 0.12, 'xₙ → c', 'lbl', 'middle');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Points approaching c on the x-axis with their images approaching f of c on the y-axis.');
    }
  },

  'fig.maxmin': {
    title: 'on [a,b] the extremes are reached',
    caption: 'Closed and bounded, plus continuity: the supremum and infimum of the range are ' +

      p.axes({ ticks: [{ x: a, t: 'a' }, { x: b, t: 'b' }] });
      const cur = p.path(p.curve(f, a, b), 'curve');
      [[xh, 'good'], [xl, 'bad']].forEach(function (pair, i) {
        const x = pair[0];
        p.line(0, f(x), x, f(x), 'guide');
        p.line(x, 0, x, f(x), 'guide');

        d.style.animationDelay = (700 + i * 240) + 'ms';
      });
      p.label(0.24, f(xh) + 0.17, 'max f(x*)', 'lbl', 'start');
      p.label(0.24, f(xl) - 0.28, 'min f(x⁎)', 'lbl', 'start');
      p.dot(a, f(a), '', 3.4);
      p.dot(b, f(b), '', 3.4);
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'A continuous curve on a closed interval with its maximum and minimum points marked.');
    }
  },

  /* ── §5.3 the same theorem with the hypothesis removed ────────────────── */
  'fig.no-max': {
    title: 'drop “closed” and the maximum goes',
    caption: '$f(x)=1/x$ on $(0,1]$ is continuous, attains its minimum at $x=1$, and has no ' +
      'maximum at all: $f(1/n)=n$. Nothing is contradicted — the theorem simply never applied.',
    build(api) {
      const p = Fig.plot({ w: 330, h: 185, xr: [0, 1.2], yr: [0, 6], padT: 18, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.14 ? 1 / x : NaN), 0.14, 1.2), 'curve');
      p.dot(1, 1, 'good', 4.6);
      p.label(1.06, 1.2, 'min = 1', 'lbl', 'start');
      p.add(Fig.svg('circle', { cx: p.X(0.167), cy: p.Y(6), r: 4.4, class: 'pt open' }));

      const arrow = Fig.svg('g', { class: 'rise-y' });
      arrow.style.setProperty('--dy', '18px');
      arrow.appendChild(Fig.svg('path', { class: 'hot',
        d: 'M' + p.X(0.09) + ' ' + p.Y(2.2) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' M' + (p.X(0.09) - 4) + ' ' + (p.Y(5.4) + 6) + ' L' + p.X(0.09) + ' ' + p.Y(5.4) +
           ' L' + (p.X(0.09) + 4) + ' ' + (p.Y(5.4) + 6) }));
      p.add(arrow);
      p.label(0.33, 5.2, 'no maximum', 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'One over x on the half-open interval, escaping upward near zero with its minimum at x equals one.');
    }
  },

  /* ── §5.3 IVT, on the cubic the questions use ─────────────────────────── */
  'fig.ivt': {
    title: 'a sign change forces a crossing',
    caption: '$p(x)=x^3-3x+1$ has $p(0)=1>0$ and $p(1)=-1<0$, so the level $0$ is crossed ' +
      'somewhere inside. The theorem gives <i>at least one</i> $c$; that it is exactly one here ' +
      'comes from $p\' &lt; 0$ on $(0,1)$, not from the IVT.',
    build(api) {
      const p3 = x => x * x * x - 3 * x + 1;
      const root = 0.34729636;
      const p = Fig.plot({ w: 330, h: 195, xr: [-0.06, 1.12], yr: [-1.35, 1.35], padT: 16,
        padB: 26, padL: 30, padR: 16 });
      p.axes({ y0: 0, ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const cur = p.path(p.curve(p3, -0.06, 1.12), 'curve');
      p.dot(0, 1, 'good', 4.4);
      p.dot(1, -1, 'bad', 4.4);
      p.label(0.08, 1.16, 'p(0) = 1', 'lbl', 'start');
      p.label(0.94, -1.2, 'p(1) = −1', 'lbl', 'end');

      const sweep = Fig.svg('line', { x1: p.X(-0.06), y1: p.Y(0), x2: p.X(1.12), y2: p.Y(0),
        class: 'hot' });
      p.add(sweep);
      const rd = p.dot(root, 0, '', 5.2);
      rd.classList.add('fade-in');
      rd.style.animationDelay = '900ms';
      p.line(root, 0, root, -0.55, 'guide');
      p.label(root, -0.72, 'c ≈ 0.35', 'lbl');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.draw(sweep);
      p.svg.setAttribute('aria-label',
        'The cubic x cubed minus three x plus one crossing zero between zero and one.');
    }
  },

  /* ── §5.4 uniform continuity, interactive ─────────────────────────────── */
  'fig.unif': {
    title: 'one δ cannot serve the whole set',
    interactive: true,
    caption: 'Slide the δ-window along $f(x)=1/x$ on $(0,1]$. Its width never changes; the ' +
      'height of the image band does — without limit as you approach $0$. That is precisely ' +
      'the failure of uniform continuity.',
    build(api) {
      const f = x => 1 / x, d = 0.05;
      const p = Fig.plot({ w: 330, h: 215, xr: [0, 1.1], yr: [0, 12], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      const imgBand = p.rect(0, 1, 1.1, 2, 'band warm');
      const winBand = p.rect(0.5 - d, 0, 0.5 + d, 12, 'band');
      p.axes({ ticks: [{ x: 1, t: '1' }] });
      const cur = p.path(p.curve(x => (x > 0.083 ? f(x) : NaN), 0.083, 1.1), 'curve');
      const lo = p.dot(0.45, f(0.45), '', 3.8);
      const hi = p.dot(0.55, f(0.55), '', 3.8);
      const gap = Fig.svg('text', { class: 'lbl', 'text-anchor': 'start', text: '' });
      p.add(gap);
      api.body.appendChild(p.svg);
      p.draw(cur);

      function update(u) {
        const a = Math.max(0.085, u - d), b = Math.min(1.1, u + d);
        const ya = f(b), yb = Math.min(12, f(a));
        winBand.setAttribute('x', p.X(a));
        winBand.setAttribute('width', p.X(b) - p.X(a));
        imgBand.setAttribute('y', p.Y(yb));
        imgBand.setAttribute('height', Math.abs(p.Y(ya) - p.Y(yb)));
        lo.setAttribute('cx', p.X(a)); lo.setAttribute('cy', p.Y(Math.min(12, f(a))));
        hi.setAttribute('cx', p.X(b)); hi.setAttribute('cy', p.Y(f(b)));
        gap.setAttribute('x', p.X(0.3));
        gap.setAttribute('y', p.Y(Math.min(11.4, yb)) - 6);
        gap.textContent = 'image height ≈ ' + (Math.min(12, f(a)) - f(b)).toFixed(2);
      }
      api.control({
        min: 0.1, max: 0.95, step: 0.01, value: 0.5, label: 'window position',
        format: v => 'window at x = ' + v.toFixed(2) + ',  width 2δ = ' + (2 * d).toFixed(2),
        onInput: update
      });
      update(0.5);
      p.svg.setAttribute('aria-label',
        'A fixed-width window sliding along one over x; the image band grows without bound near zero.');
    }
  },

  /* ── §5.4 why compactness rescues it ─────────────────────────────────── */
  'fig.heine': {
    title: 'on a closed interval there is a worst case',
    caption: 'Equal δ-windows along $\\sqrt{x}$ on $[0,1]$. The image bands differ, the worst ' +
      'one sits at $0$ — and because the interval is closed and bounded the worst one <i>exists</i>. ' +
      'Take δ for that window and it serves everywhere: continuity becomes uniform.',
    build(api) {
      const f = Math.sqrt;
      const p = Fig.plot({ w: 330, h: 190, xr: [0, 1.06], yr: [0, 1.15], padT: 16, padB: 26,
        padL: 30, padR: 14 });
      p.axes({ ticks: [{ x: 0, t: '0' }, { x: 1, t: '1' }] });
      const w = 1 / 6;
      for (let i = 0; i < 6; i++) {
        const a = i * w, b = a + w;
        const g = Fig.svg('g', { class: 'fade-in' });
        g.style.animationDelay = (200 + i * 130) + 'ms';
        g.appendChild(Fig.svg('rect', {
          x: p.X(a), y: p.Y(f(b)), width: p.X(b) - p.X(a),
          height: Math.abs(p.Y(f(a)) - p.Y(f(b))),
          class: i === 0 ? 'band warm' : 'band good'
        }));
        g.appendChild(Fig.svg('line', { x1: p.X(a), y1: p.Y(0), x2: p.X(a), y2: p.Y(f(b)),
          class: 'guide' }));
        p.add(g);
      }
      const cur = p.path(p.curve(f, 0, 1.02), 'curve');
      p.label(0.2, 0.52, 'worst window', 'lbl', 'start');
      p.line(0.185, 0.5, 0.09, 0.42, 'guide');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'Equal-width windows under the square-root curve, the tallest image band at zero.');
    }
  },

  /* ── §6.2 MVT, on the interval the questions use ─────────────────────── */
  'fig.mvt': {
    title: 'the tangent parallel to the chord',
    caption: 'For $f(x)=x^2$ on $[1,3]$ the chord has slope $\\frac{9-1}{3-1}=4$, and $f\'(c)=2c=4$ ' +
      'puts the parallel tangent at $c=2$. The theorem promises such a $c$ exists; finding it is ' +
      'just solving that equation.',
    build(api) {
      const f = x => x * x, a = 1, b = 3, c = 2;
      const p = Fig.plot({ w: 330, h: 205, xr: [0.6, 3.5], yr: [0, 11], padT: 16, padB: 26,
        padL: 32, padR: 14 });
      p.axes({ ticks: [{ x: 1, t: 'a=1' }, { x: 2, t: 'c=2' }, { x: 3, t: 'b=3' }] });
      const cur = p.path(p.curve(f, 0.6, 3.5), 'curve');

      p.add(Fig.svg('line', { x1: p.X(a), y1: p.Y(f(a)), x2: p.X(b), y2: p.Y(f(b)), class: 'hot' }));
      p.label(1.35, 6.4, 'chord, slope 4', 'lbl', 'start');

      /* tangent y = 4x - 4, slid into place */
      const g = Fig.svg('g', { class: 'slide-x' });
      g.style.setProperty('--dx', (p.X(1.1) - p.X(2)) + 'px');
      g.appendChild(Fig.svg('line', { x1: p.X(0.9), y1: p.Y(4 * 0.9 - 4),
        x2: p.X(3.2), y2: p.Y(4 * 3.2 - 4), class: 'curve', 'stroke-dasharray': '5 4' }));
      p.add(g);
      p.dot(a, f(a), '', 4); p.dot(b, f(b), '', 4);
      const cd = p.dot(c, f(c), 'good', 5.2);
      cd.classList.add('fade-in'); cd.style.animationDelay = '1.2s';
      p.label(2.42, 3.1, "f′(c) = 4", 'lbl', 'start');
      api.body.appendChild(p.svg);
      p.draw(cur);
      p.svg.setAttribute('aria-label',
        'The parabola x squared with the chord from one to three and the parallel tangent at c equals two.');
    }
  }
};

/* Concept → figures, while the pool is mock. Validated concepts should carry
   their own `figs: [...]` and this map can then be deleted. */
const FIGMAP = {
  'm.2.3.2': ['fig.sup-inf'],
  'm.2.3.6': ['fig.gap'],
  'm.3.4.8': ['fig.bw'],
  'm.5.1.1': ['fig.eps-delta'],
  'm.5.1.3': ['fig.seq-crit'],
  'm.5.3.4': ['fig.maxmin', 'fig.no-max'],
  'm.5.3.7': ['fig.ivt'],
  'm.5.4.1': ['fig.unif'],
  'm.5.4.3': ['fig.heine'],
  'm.6.2.4': ['fig.mvt']
};


/* ── flow-library/app/src/comp.figure.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Figure engine.

   Two kinds of figure now, and they are complementary rather than rivals:

     drawn      hand-built inline SVG (fig.library.js). Inherits the theme,
                scales to any width, animates, and a few take a control so the
                learner can move the parameter that matters (ε, or the window).
     rendered   the light/dark PNG pairs in `diagrams/`, indexed by concept in
                fig.diagrams.js. There are dozens of them and the app used to
                show none — a result with a picture sitting in the repository
                and nothing on screen is the worst of both.

   A concept shows its drawn figures first, then its rendered ones. Nothing is
   duplicated: where a drawn figure already exists for a result, the rendered
   one is still offered below it, because they show different things (the drawn
   figure is interactive, the rendered one is the finished diagram).

   This file is the plumbing — coordinate mapping, the frame, the controls, and
   the theme swap on a rendered diagram.
   ══════════════════════════════════════════════════════════════════════════ */

const Fig = (function () {

  const el = DOM.el;
  const s = DOM.svg;

  /* A plot area inside a viewBox: maths coordinates in, pixels out. */
  function plot(opts) {
    const o = Object.assign({ w: 330, h: 190, pad: 20, xr: [0, 1], yr: [0, 1] }, opts);
    const l = o.padL == null ? o.pad : o.padL;
    const b = o.padB == null ? o.pad : o.padB;
    const t = o.padT == null ? o.pad : o.padT;
    const r = o.padR == null ? o.pad : o.padR;
    const X = x => l + (x - o.xr[0]) / (o.xr[1] - o.xr[0]) * (o.w - l - r);
    const Y = y => (o.h - b) - (y - o.yr[0]) / (o.yr[1] - o.yr[0]) * (o.h - t - b);

    /* sampled path of a function, clipped to the y range */
    function curve(fn, from, to, steps) {
      const n = steps || 90;
      const a = from == null ? o.xr[0] : from;
      const z = to == null ? o.xr[1] : to;
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = a + (z - a) * i / n;
        const y = fn(x);
        if (!isFinite(y) || y < o.yr[0] - 1e-9 || y > o.yr[1] + 1e-9) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1) + ' ';
        pen = true;
      }
      return d.trim();
    }

    const svg = s('svg', {
      viewBox: '0 0 ' + o.w + ' ' + o.h, role: 'img',
      preserveAspectRatio: 'xMidYMid meet'
    });

    return {
      svg: svg, X: X, Y: Y, curve: curve, box: o,
      add(...kids) { kids.forEach(k => k && svg.appendChild(k)); return this; },
      /* axes with optional tick labels */
      axes(opts2) {
        const a = opts2 || {};
        const y0 = a.y0 == null ? o.yr[0] : a.y0;
        this.add(s('line', { class: 'axis', x1: X(o.xr[0]), y1: Y(y0), x2: X(o.xr[1]), y2: Y(y0) }));
        if (a.yAxis !== false) {
          this.add(s('line', { class: 'axis', x1: X(a.x0 == null ? o.xr[0] : a.x0), y1: Y(o.yr[0]),
            x2: X(a.x0 == null ? o.xr[0] : a.x0), y2: Y(o.yr[1]) }));
        }
        (a.ticks || []).forEach(function (tk) {
          svg.appendChild(s('line', { class: 'axis', x1: X(tk.x), y1: Y(y0) - 3, x2: X(tk.x), y2: Y(y0) + 3 }));
          svg.appendChild(s('text', { x: X(tk.x), y: Y(y0) + 15, 'text-anchor': 'middle', text: tk.t }));
        });
        return this;
      },
      label(x, y, text, cls, anchor) {
        this.add(s('text', { x: X(x), y: Y(y), class: cls || '', text: text,
          'text-anchor': anchor || 'middle' }));
        return this;
      },
      dot(x, y, cls, r2) {
        const c = s('circle', { cx: X(x), cy: Y(y), r: r2 || 3.6, class: 'pt ' + (cls || '') });
        this.add(c);
        return c;
      },
      line(x1, y1, x2, y2, cls) {
        const n = s('line', { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), class: cls || 'guide' });
        this.add(n);
        return n;
      },
      rect(x1, y1, x2, y2, cls) {
        const n = s('rect', { x: Math.min(X(x1), X(x2)), y: Math.min(Y(y1), Y(y2)),
          width: Math.abs(X(x2) - X(x1)), height: Math.abs(Y(y2) - Y(y1)), class: cls || 'band' });
        this.add(n);
        return n;
      },
      path(d, cls) {
        const n = s('path', { d: d, class: cls || 'curve' });
        this.add(n);
        return n;
      },
      /* stroke-draw entrance for a path */
      draw(node) {
        if (DOM.reduced() || !node.getTotalLength) return node;
        try {
          const len = Math.ceil(node.getTotalLength());
          node.style.setProperty('--len', len);
          node.classList.add('draw');
        } catch (e) { /* not yet in the document — skip the flourish */ }
        return node;
      }
    };
  }

  /* The frame: title, the drawing, an optional control, a caption. */
  function frame(def, opts) {
    const host = el('figure', { class: 'fig', style: { margin: 0 } });
    const body = el('div', {});
    const ctl = el('div', {});

    host.appendChild(el('div', { class: 'fig-h' }, [
      el('span', { class: 'kicker', text: def.title }),
      def.interactive ? el('span', { class: 'badge accent', text: 'drag it' }) : null
    ]));
    host.appendChild(body);
    host.appendChild(ctl);
    if (def.caption) {
      host.appendChild(el('figcaption', { class: 'fig-cap', html: def.caption }));
    }

    const api = {
      body: body,
      /* a labelled range control; onInput gets the numeric value */
      control(spec) {
        const input = el('input', {
          type: 'range', min: spec.min, max: spec.max, step: spec.step,
          value: spec.value, 'aria-label': spec.label
        });
        const out = el('label', { text: spec.format(Number(spec.value)) });
        input.addEventListener('input', function () {
          const v = Number(input.value);
          out.textContent = spec.format(v);
          spec.onInput(v);
        });
        DOM.clear(ctl);
        ctl.appendChild(el('div', { class: 'fig-ctl' }, [input, out]));
        return input;
      }
    };

    def.build(api, opts || {});
    return host;
  }

  /* ── rendered diagrams ────────────────────────────────────────────────── */
  const base = () => (typeof DIAGRAM_BASE !== 'undefined' ? DIAGRAM_BASE : 'diagrams/');

  const prettyTitle = b => b
    .replace(/^c\.[0-9.]+[a-z]?_/, '')
    .replace(/_/g, ' ')
    .replace(/^./, ch => ch.toUpperCase());

  function renderedFrame(basename, caption) {
    const light = base() + 'light/' + basename + '.png';
    const dark = base() + 'dark/' + basename + '.png';

    const img = el('img', {
      src: light, alt: caption || prettyTitle(basename),
      loading: 'lazy', decoding: 'async', class: 'fig-img'
    });

    /* One <img> whose src follows the theme. A <picture> with a
       prefers-color-scheme <source> was the obvious answer and is the wrong
       one: it can only see the OS setting, and this app has three theme
       settings of its own. So the swap watches the same `data-theme` attribute
       every other themed thing here reads. */
    function paint() {
      const wantDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = wantDark ? dark : light;
      if (img.getAttribute('src') !== next) img.setAttribute('src', next);
    }
    paint();
    if (window.MutationObserver) {
      const mo = new MutationObserver(paint);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    return el('figure', { class: 'fig fig-rendered', style: { margin: 0 } }, [
      el('div', { class: 'fig-h' }, [
        el('span', { class: 'kicker', text: prettyTitle(basename) }),
        el('span', { class: 'badge', text: 'diagram' })
      ]),
      el('div', { class: 'fig-imgwrap' }, [img])
    ]);
  }

  /* Which rendered diagrams belong to this concept. A concept may name them
     itself with `img: [...]`; otherwise the generated index answers by id. */
  function imagesFor(concept) {
    if (!concept) return [];
    if (concept.img && concept.img.length) {
      return Array.isArray(concept.img) ? concept.img : [concept.img];
    }
    return (typeof DIAGRAM_MAP !== 'undefined' && DIAGRAM_MAP[concept.id]) || [];
  }

  /* Mount every figure attached to a concept. Data may carry `figs: [id]`;
     the app's own map is the fallback while the pool is mock. */
  function forConcept(concept) {
    if (!concept) return [];
    const ids = (concept.figs && concept.figs.length)
      ? concept.figs
      : (FIGMAP[concept.id] || []);
    return ids.map(id => FIGLIB[id] ? { id: id, def: FIGLIB[id] } : null).filter(Boolean);
  }

  function mount(concept) {
    const figs = forConcept(concept);
    const imgs = imagesFor(concept);
    if (!figs.length && !imgs.length) return null;
    return el('div', { class: 'stack', style: { gap: '12px' } },
      figs.map(f => frame(f.def)).concat(imgs.map(b => renderedFrame(b))));
  }

  return { plot: plot, frame: frame, mount: mount, forConcept: forConcept,
    imagesFor: imagesFor, renderedFrame: renderedFrame, svg: s };
})();


/* ── flow-library/app/src/comp.zoom.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Figure viewer — click a rendered diagram to open it full-screen with
   100–400% zoom, reset, scrolling, and Escape/Close.

   Opt-in: a project sets `PROJECT.figZoom: true`. boot.js then calls
   `Zoom.start()` once the signed-in app is up. It also caps a diagram's
   height on desktop (see `body.fig-zoom` in ui.css), because a preview that
   fills the screen leaves nothing to enlarge. The dialog follows the theme:
   when the page swaps a diagram's light/dark file, the open one swaps too.
   ══════════════════════════════════════════════════════════════════════════ */

const Zoom = (function () {

  let started = false;

  function start() {
    if (started) return;
    started = true;
    const el = DOM.el;
    let source = null, scale = 1, fitWidth = 1, previousOverflow = '';
    const picture = el('img', { alt: '', draggable: 'false' });
    const viewport = el('div', { class: 'fig-viewport', tabindex: '0',
      'aria-label': 'Diagram; scroll to explore when zoomed' }, [picture]);
    const status = el('output', { 'aria-live': 'polite', text: '100%' });
    const button = (text, label, action) => {
      const b = el('button', { type: 'button', text: text, 'aria-label': label });
      b.addEventListener('click', action);
      return b;
    };
    const zoomOut = button('−', 'Zoom out', () => zoom(scale - 0.25));
    const zoomIn = button('+', 'Zoom in', () => zoom(scale + 0.25));
    const dialog = el('dialog', { class: 'fig-viewer', 'aria-label': 'Diagram viewer' }, [
      el('div', { class: 'fig-controls' }, [zoomOut, status, zoomIn,
        button('Reset', 'Reset zoom to fit', () => { zoom(1); viewport.scrollTo(0, 0); }),
        button('Close', 'Close diagram viewer', () => dialog.close())]), viewport
    ]);
    document.body.appendChild(dialog);
    function zoom(next) {
      scale = Math.min(4, Math.max(1, next));
      picture.style.width = (fitWidth * scale) + 'px';
      status.textContent = Math.round(scale * 100) + '%';
      zoomOut.disabled = scale <= 1;
      zoomIn.disabled = scale >= 4;
    }
    function fit() {
      if (!dialog.open || !picture.naturalWidth) return;
      fitWidth = Math.min(picture.naturalWidth, viewport.clientWidth,
        viewport.clientHeight * picture.naturalWidth / picture.naturalHeight);
      zoom(scale);
    }
    picture.addEventListener('load', fit);
    window.addEventListener('resize', fit);
    function open(img) {
      source = img;
      scale = 1;
      picture.alt = img.alt;
      picture.src = img.src;
      previousOverflow = document.body.style.overflow;
      document.body.style.overflow = 'hidden';
      dialog.showModal();
      fit();
      viewport.scrollTo(0, 0);
    }
    dialog.addEventListener('close', () => {
      document.body.style.overflow = previousOverflow;

   statement or a proof step and draws them in the three types of the design
   sheet (flow-library/design/realline-reference.html) — Type 1 x > a,
   Type 2 x < a, Type 3 a < x < b — with the quantity itself marked inside
   its set. Nothing has to be authored:

     u = \sup S                     one point, labelled with both names
     u - \varepsilon                implies u − ε < u, so u appears beside it

   shows: a picture that puts two incomparable terms in some order would be
   teaching something false. Unrelated facts in one statement become separate
   lines; anything ambiguous is simply not drawn.

   In a proof the line EVOLVES: step k is solved against everything the
   statement and steps 1…k have established, and a point appearing for the
   first time is lit. The argument can then be remembered as one picture
   changing, not as a list of formulas.

   `line: false` on a concept or a rung suppresses it there, and a string

    if (!line.ranges.length) {
      const n = line.pts.length;
      if (n < 3 || isEll(line.pts[0]) || isEll(line.pts[n - 1])) return out;
      out.push({ type: 3, lo: line.pts[0], hi: line.pts[n - 1],
        loOpen: line.gaps[0] === 2, hiOpen: line.gaps[n - 2] === 2,
        pts: line.pts.map((k, i) => ({ k: k, label: line.labels[i], role: i === 0 || i === n - 1 ? 'end' : 'inner' })) });
      return out.map(numberSet);
    }
    line.ranges.forEach(function (r) {
      if (!r.lo && !r.hi) return;
      let lo = r.lo, hi = r.hi, loOpen = r.loOpen, hiOpen = r.hiOpen;
      const pts = line.pts.map(k => ({ k: k, label: lab(k),
        role: k === lo || k === hi ? 'end' : k === r.punct ? 'hole' : k === r.center ? 'center' : 'inner' }));
      if (!lo && NONNEG.test(key(r.v))) {                       /* |…| ≤ R  →  [0, R] */
        lo = '0'; loOpen = false;
        if (!pts.some(p => p.k === '0')) pts.unshift({ k: '0', label: '0', role: 'end' });
        else pts.forEach(p => { if (p.k === '0') p.role = 'end'; });
      }
      const type = lo && hi ? 3 : lo ? 1 : 2;
      if (!pts.some(p => p.k === r.vk)) {
        /* the quantity itself, placed inside its set: beside the centre of a
           neighbourhood, mid-way along a segment, inside the ray */
        const iLo = pts.findIndex(p => p.k === lo), iHi = pts.findIndex(p => p.k === hi);
        const iC = pts.findIndex(p => p.role === 'center' || p.role === 'hole');
        let at = type === 1 ? iLo + 1 : type === 2 ? iHi : iC >= 0 ? iC + 1 : iLo + 1 + Math.floor((iHi - iLo - 1) / 2);
        if (type === 3 && iC < 0 && iHi - iLo === 1) at = iLo + 1;
        pts.splice(Math.max(0, at), 0, { k: r.vk, label: r.v, role: 'var' });
      } else {
        pts.forEach(p => { if (p.k === r.vk) p.role = 'var'; });
      }
      out.push({ type: type, lo: lo, hi: hi, loOpen: loOpen, hiOpen: hiOpen, pts: pts });
    });
    return out.map(numberSet);
  }

  /* ── ℕ, ℤ or ℝ ─────────────────────────────────────────────────────────
     When every marked quantity is an index or a count (n, k, m, N, K, n_k,
     K(ε), …) the line is ℕ — or ℤ if a negative integer is on it. In ℕ a
     set bounded only above starts at 1: n ≤ K is [1, K], never a ray into
     the negatives. */
  const INDEX = /^(n|m|k|j|i|N|K|H)(_\{?[a-zA-Z0-9]+(_\{?[a-zA-Z0-9]+\}?)?\}?|_[a-zA-Z0-9])?(\([^()]*\))?('|\^\{?\*\}?)?$/;

  function numberSet(t) {
    const marked = t.pts.filter(p => p.role === 'var' || p.role === 'inner');
    const integer = marked.length && marked.every(p => INDEX.test(key(p.label)));
    if (!integer) { t.set = 'R'; return t; }
    t.set = t.pts.some(p => /^-\d+$/.test(key(p.label))) ? 'Z' : 'N';
    if (t.set === 'N' && t.type === 2) {
      t.type = 3; t.lo = '1'; t.loOpen = false;
      const one = t.pts.find(p => p.k === '1');
      if (one) one.role = 'end'; else t.pts.unshift({ k: '1', label: '1', role: 'end' });
    }
    return t;
  }

  /* one line of text per track — what tools/realline_report.js prints */
  function describe(t) {
    const L = k => (t.pts.find(p => p.k === k) || {}).label;
    const set = t.type === 1 ? (t.loOpen ? '(' : '[') + L(t.lo) + ', ∞)'
      : t.type === 2 ? '(−∞, ' + L(t.hi) + (t.hiOpen ? ')' : ']')
      : (t.loOpen ? '(' : '[') + L(t.lo) + ', ' + L(t.hi) + (t.hiOpen ? ')' : ']');
    const marks = t.pts.filter(p => p.role !== 'end').map(p => p.label + (p.role === 'var' ? '' : ' (' + p.role + ')'));
    return 'Type ' + t.type + ' ' + set + (t.set && t.set !== 'R' ? ' in ' + (t.set === 'N' ? 'ℕ' : 'ℤ') : '')
      + (marks.length ? '  ·  ' + marks.join(', ') : '');
  }

  /* ── drawing ────────────────────────────────────────────────────────── */

  const plain = t => t.replace(/\\(varepsilon|epsilon)/g, 'ε').replace(/\\delta/g, 'δ').replace(/\\eta/g, 'η')
    .replace(/\\cdots|\\ldots|\\dots/g, '…').replace(/\\sup/g, 'sup').replace(/\\inf/g, 'inf')
    .replace(/\\[a-zA-Z]+/g, '').replace(/[{}]/g, '').replace(/\s+/g, ' ').trim();

  function track(t, fresh) {
    const n = t.pts.length;
    const kind = t.type === 1 ? 'ray-r' : t.type === 2 ? 'ray-l' : 'seg';
    /* evenly spaced, the open side of a ray left free */
    const span = t.type === 1 ? [n === 1 ? 32 : 14, 70] : t.type === 2 ? [30, n === 1 ? 68 : 86]
      : [n === 2 ? 22 : 12, n === 2 ? 78 : 88];
    const x = i => n === 1 ? span[0] : span[0] + i * (span[1] - span[0]) / (n - 1);
    const stagger = n >= 5 || (n >= 3 && t.pts.some(p => plain(p.label).length > 9));

    const box = el('div', { class: 'rl-track ' + kind, style: { height: (stagger ? 62 : 44) + 'px' } });
    const put = (cls, style, attrs) => {
      const d = el('div', Object.assign({ class: cls }, attrs || {}));
      Object.assign(d.style, style);
      box.appendChild(d);
      return d;
    };
    put('rl-axis', {});
    put('rl-R', {}, { text: t.set === 'N' ? '\u2115' : t.set === 'Z' ? '\u2124' : '\u211D' });

    const pos = {};
    t.pts.forEach((p, i) => { pos[p.k] = x(i); });
    const a = t.lo ? pos[t.lo] : 1.2, b = t.hi ? pos[t.hi] : 98.8;
    put('rl-set' + (t.lo ? '' : ' to-l') + (t.hi ? '' : ' to-r'), { left: a + '%', width: (b - a) + '%' });

    t.pts.forEach(function (p, i) {
      const at = { left: pos[p.k] + '%' };
      if (p.role === 'end') put('rl-end' + ((p.k === t.lo ? t.loOpen : t.hiOpen) ? ' open' : ''), at);
      else if (p.role === 'hole') put('rl-end open', at);
      else if (p.role === 'center') put('rl-pt inner', at);
      else put('rl-pt' + (p.role === 'var' ? ' var' : ''), at);
      const edge = i === 0 && t.type !== 2 ? ' first' : i === n - 1 && t.type !== 1 ? ' last' : '';
      put('rl-lab' + edge + (p.role === 'var' ? ' var' : '') + (fresh && fresh[p.k] ? ' new' : '')
        + (stagger && i % 2 ? ' low' : ''), at, { html: '$' + p.label + '$' });
    });

    return el('div', { class: 'rl', role: 'img', 'aria-label': 'On the real line: ' + plain(describe(t)) }, [box]);
  }

  /* ── what the views call ────────────────────────────────────────────── */

  const tracksOfAll = lines => [].concat.apply([], lines.map(tracksOf)).slice(0, 3);

  function render(lines, fresh) {
    const tracks = tracksOfAll(lines);
    return tracks.length ? el('div', { class: 'rl-group' }, tracks.map(t => track(t, fresh))) : null;
  }

  /* `line` in the data: false, one TeX string, or several */
  const source = (obj, fallback) => (obj && obj.line === false) ? null
    : (obj && typeof obj.line === 'string') ? '$' + obj.line + '$'
    : (obj && Array.isArray(obj.line)) ? obj.line.map(l => '$' + l + '$').join(' ') : fallback;

  /* The statement's own line(s). */
  function statement(c) {
    if (!enabled() || !c) return null;
    return render(planStatement(c), null);
  }

  /* Rays from one-sided facts, for a text that states no richer order. A
     bound other than 0 first: `n \ge K` says more than `\varepsilon > 0`,
     which nearly every step repeats. */
  function rayLines(F, rays) {
    const seen = {};
    /* w \le s "for all s \in S" is about s, not w: the side the text
       quantifies over is the variable, whichever side it is written on */
    rays = rays.map(r => (F.quantified[r.bk] && !F.quantified[r.vk])
      ? { v: F.labels[r.bk], vk: r.bk, bk: r.vk, dir: r.dir === 'r' ? 'l' : 'r', open: r.open } : r);
    return rays.filter(r => { const k = r.vk + '|' + r.bk + '|' + r.dir; if (seen[k]) return false; seen[k] = true; return true; })
      .sort((x, y) => (key(F.labels[x.bk] || '') === '0') - (key(F.labels[y.bk] || '') === '0'))
      .slice(0, MAX_LINES)
      .map(r => ({
        pts: [r.bk], gaps: [], labels: [F.labels[r.bk]],
        ranges: [{ v: r.v, vk: r.vk, lo: r.dir === 'r' ? r.bk : null, hi: r.dir === 'l' ? r.bk : null,
          loOpen: r.open, hiOpen: r.open }]
      }));
  }

  const rungText = r => source(r, [r.m, r.math].filter(Boolean).map(t => /\$/.test(t) ? t : '$' + t + '$').join(' '));

  /* The plan, with no DOM: one entry per rung ({ lines, fresh } or null),
     each solved against the statement plus every step up to and including
     it. A step whose facts clash with an earlier one (the same letter
     reused for something else) falls back to its own facts alone, so one
     clash cannot blank the rest of the proof. */
  /* Plan a sequence of texts (proof steps, or the parts of a statement):
     each is solved against ctx plus every text before it, falling back to
     its own facts alone, then to rays. `shown` collects what has been drawn
     so far, and a point drawn for the first time is `fresh`. */
  function planSeq(ctx, texts, shown) {
    return texts.map(function (text) {
      if (!text) return null;
      const before = { m: ctx.mentioned.length, r: ctx.ranges.length, y: ctx.rays.length };
      read(ctx, text);
      let lines = solve(ctx, ctx.mentioned.slice(before.m), ctx.ranges.slice(before.r));
      if (!tracksOfAll(lines).length) { const own = read(Facts(), text); lines = solve(own, own.mentioned, own.ranges); }
      if (!tracksOfAll(lines).length) lines = rayLines(ctx, ctx.rays.slice(before.y));
      if (!tracksOfAll(lines).length) return null;
      const fresh = {};
      const keys = [].concat.apply([], tracksOfAll(lines).map(t => t.pts.map(p => p.k)));
      keys.forEach(k => { if (!shown[k]) fresh[k] = true; });
      keys.forEach(k => { shown[k] = true; });
      return { lines: lines, fresh: fresh };
    });
  }

  /* A statement in parts, as the reader sees it: each <p>, each list item,
     and any loose text between them. A line goes right under its part. */
  function htmlParts(html) {
    const out = [], re = /<(p|li|div|blockquote)\b[^>]*>([\s\S]*?)<\/\1>/gi;
    const loose = t => t.replace(/<\/?(ul|ol)\b[^>]*>/gi, '');
    let last = 0, m;
    while ((m = re.exec(html))) {
      const pre = loose(html.slice(last, m.index));
      if (pre.trim()) out.push(pre);
      out.push(m[2]);
      last = re.lastIndex;
    }
    const tail = loose(html.slice(last));
    if (tail.trim()) out.push(tail);
    return out;
  }

  /* one entry per part of the statement: { lines, fresh } or null */
  function planStatementParts(c, parts) {
    if (!c || c.line === false) return (parts || []).map(() => null);
    if (c.line !== undefined) return [planSeq(Facts(), [source(c, '')], {})[0]];   /* an override is one block */
    return planSeq(Facts(), parts || htmlParts(String(c.statement || '')), {});
  }

  /* every line the statement draws, flat (the report and the proof seed use it) */
  function planStatement(c) {
    return [].concat.apply([], planStatementParts(c).filter(Boolean).map(p => p.lines));
  }

  function planProof(c) {
    const rungs = (c && c.proof && c.proof.rungs) || [];
    if (c.line === false || !rungs.length) return rungs.map(() => null);
    const ctx = Facts();
    const stText = source(c, c.statement);
    if (stText) read(ctx, stText);
    const shown = {};
    tracksOfAll(planStatement(c)).forEach(t => t.pts.forEach(p => { shown[p.k] = true; }));
    return planSeq(ctx, rungs.map(rungText), shown);
  }

  /* Draw a statement's lines INTO its rendered prose, each one directly under
     the block it comes from. Blocks are read before MathJax runs, so their
     text is still the authored TeX. Returns the prose node. */
  function statementInto(node, c) {
    if (!enabled() || !c || !node) return node;
    if (c.line !== undefined) {                       /* override: after the whole statement */
      const g = c.line === false ? null : render(planStatement(c), null);
      if (g) node.appendChild(g);
      return node;
    }
    const blocks = [];
    let run = [];
    const flush = () => {
      const text = run.map(n => n.textContent).join('');
      if (run.length && text.trim()) blocks.push({ after: run[run.length - 1], text: text });
      run = [];
    };
    Array.prototype.slice.call(node.childNodes).forEach(function (n) {
      if (n.nodeType === 1 && /^(P|DIV|BLOCKQUOTE|TABLE|H[1-6])$/.test(n.tagName)) { flush(); blocks.push({ after: n, text: n.textContent }); }
      else if (n.nodeType === 1 && /^(UL|OL)$/.test(n.tagName)) {
        flush();
        Array.prototype.slice.call(n.children).forEach(li => blocks.push({ into: li, text: li.textContent }));
      } else run.push(n);
    });
    flush();
    planStatementParts(c, blocks.map(b => b.text)).forEach(function (p, i) {
      const g = p && render(p.lines, null);
      if (!g) return;
      const b = blocks[i];
      if (b.into) b.into.appendChild(g);
      else b.after.parentNode.insertBefore(g, b.after.nextSibling);
    });
    return node;
  }

  /* One node (or null) per rung. */
  function proof(c) {
    const rungs = (c && c.proof && c.proof.rungs) || [];
    if (!enabled()) return rungs.map(() => null);
    return planProof(c).map(p => p ? render(p.lines, p.fresh) : null);
  }

  return { statement: statement, proof: proof, enabled: enabled,
    planStatement: planStatement, planProof: planProof, statementInto: statementInto, tracksOf: tracksOfAll, describe: describe };
})();


/* ── flow-library/app/src/comp.tree.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The syllabus tree — and, since Level 4, the reader as well.

   Course → module → section → concept, each row carrying a tick you can press
   and a ring showing how much of what is underneath is done. Opening a concept
   no longer leaves for a page of its own: the note unfolds in place, and its
   proof, its exercises and its questions unfold inside that. One scroll, from
   the course title to the last exercise.

   EXACTLY ONE THING IS OPEN AT EACH DEPTH. Opening a section closes the
   section that was open; opening a note closes the note that was open. The
   tree is a place you are, not a pile you have accumulated — which is the only
   way a three-deep tree of two hundred concepts stays navigable on a phone.
   That single open path is stored, so closing the app and coming back lands
   you where you left off (see `scrollToOpen`).

   Colour is the whole vocabulary. A row is RED once everything under it has
   been read, AMBER once every proof under it has been worked, GREEN once every
   section exercise under it is done. A course can go one further: VIOLET, level
   4, once its JAM past papers are worked through too.
   ══════════════════════════════════════════════════════════════════════════ */

const Tree = (function () {

  const el = DOM.el;
  const KEY = 'open4';
  const LEGACY = 'open';
  const DEPTH = ['course', 'mod', 'sec', 'concept'];

  /* ── the one open path ────────────────────────────────────────────────── */
  function readPath() {
    const p = Store.pref(KEY, null);
    if (p && typeof p === 'object') return p;

    /* Levels 1–3 stored a map of every open id. Keep the first of each kind
       so an upgrade lands somewhere familiar rather than fully collapsed. */
    const old = Store.pref(LEGACY, null);
    if (!old || typeof old !== 'object') return null;
    const out = {};
