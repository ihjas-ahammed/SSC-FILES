      monotone, so each has an obvious extreme member — and the extremes of the two families are
      the extremes of the union.</p>`,
    solution: `<p>For even $n$, $x_n=1-\\frac1n$, which increases from $x_2=\\tfrac12$ towards $1$.
      For odd $n$, $x_n=1+\\frac1n$, which decreases from $x_1=2$ towards $1$.</p>
      <p>Every element is therefore at least $\\tfrac12$ and at most $2$, so $\\tfrac12$ is a lower
      bound and $2$ an upper bound. Both are elements of $S$ (take $n=2$ and $n=1$), so they are
      the infimum and the supremum and both are attained:</p>
      $$\\inf S=\\tfrac12=\\min S,\\qquad \\sup S=2=\\max S.$$`,
    trap: `The two subsequences both converge to $1$, and it is tempting to answer $1$ for one of
      the bounds. $1$ is neither: it is the only cluster point, and a cluster point has nothing to
      do with a bound.`,
    tests: ['m.2.3.2'] },

  { id: 'w.2.3.2', sec: '2.3', marks: 6, mock: true,
    title: 'Exercise 2.3.2 — the supremum of a union',
    prompt: `<p>Let $A$ and $B$ be nonempty subsets of $\\mathbb{R}$ that are bounded above.
      Prove that $A\\cup B$ is bounded above and that
      $$\\sup(A\\cup B)=\\max\\{\\sup A,\\ \\sup B\\}.$$</p>`,
    approach: `<p>Write $u=\\sup A$, $v=\\sup B$ and $w=\\max\\{u,v\\}$. Two inequalities are owed:
      $w$ is an upper bound of $A\\cup B$, and no smaller number is. Get the second one from the
      fact that $w$ equals one of $u,v$, and that one is a LEAST upper bound of its own set.</p>`,
    solution: `<p>Put $u=\\sup A$, $v=\\sup B$, $w=\\max\\{u,v\\}$.</p>
      <p><b>$w$ is an upper bound.</b> Let $x\\in A\\cup B$. If $x\\in A$ then $x\\le u\\le w$; if
      $x\\in B$ then $x\\le v\\le w$. So $A\\cup B$ is bounded above by $w$ and, being nonempty,
      has a supremum.</p>
      <p><b>$w$ is the least one.</b> Say $w=u$ (the other case is identical with $B$). If $z$ is
      any upper bound of $A\\cup B$ then $z$ is in particular an upper bound of $A$, and since
      $u=\\sup A$ is the least upper bound of $A$ we get $u\\le z$, i.e. $w\\le z$.</p>
      <p>Hence $w$ is an upper bound no larger than every other upper bound, which is exactly
      $\\sup(A\\cup B)=w$.</p>`,
    trap: `Writing $\\sup(A\\cup B)=\\sup A+\\sup B$, or trying to prove it for the INTERSECTION by
      the same argument. For $A\\cap B$ no equality holds at all — the intersection can be empty.`,
    tests: ['m.2.3.2', 'm.2.3.6'] },

  { id: 'w.2.3.3', sec: '2.3', marks: 5, mock: true,
    title: 'Exercise 2.3.3 — translating a set',
    prompt: `<p>Let $S\\subseteq\\mathbb{R}$ be nonempty and bounded above, let $a\\in\\mathbb{R}$,
      and set $a+S=\\{\\,a+s : s\\in S\\,\\}$. Prove that $\\sup(a+S)=a+\\sup S$.</p>`,
    approach: `<p>The $\\varepsilon$-characterisation is the efficient route: $u=\\sup S$ exactly
      when $u$ is an upper bound and, for every $\\varepsilon>0$, some $s\\in S$ exceeds
      $u-\\varepsilon$. Translation moves both halves of that by $a$ and changes nothing else.</p>`,
    solution: `<p>Let $u=\\sup S$.</p>
      <p><b>Upper bound.</b> Every element of $a+S$ is $a+s$ with $s\\le u$, so $a+s\\le a+u$.</p>
      <p><b>Least.</b> Let $\\varepsilon>0$. Since $u=\\sup S$ there is $s_\\varepsilon\\in S$ with
      $u-\\varepsilon < s_\\varepsilon$, hence
      $$(a+u)-\\varepsilon < a+s_\\varepsilon\\in a+S.$$
      So no number below $a+u$ is an upper bound of $a+S$.</p>
      <p>Both halves of the characterisation hold, so $\\sup(a+S)=a+u=a+\\sup S$.</p>`,
    trap: `The same proof for $aS=\\{as\\}$ is FALSE when $a<0$: multiplying by a negative number
      reverses the order, and $\\sup(aS)=a\\inf S$ there. Translation is order-preserving; scaling
      is not.`,
    tests: ['m.2.3.2', 'm.2.3.6'] },

  /* ── §3.4 · subsequences and Bolzano–Weierstrass ────────────────────────── */
  { id: 'w.3.4.1', sec: '3.4', marks: 4, mock: true,
    title: 'Exercise 3.4.1 — divergence by two subsequences',
    prompt: `<p>Show that the sequence $x_n=(-1)^{n}$ is divergent, by exhibiting two
      subsequences with different limits.</p>`,
    approach: `<p>A convergent sequence has every subsequence converging to the same limit. So
      one pair of subsequences with different limits settles it — no $\\varepsilon$ argument is
      needed.</p>`,
    solution: `<p>The even-indexed subsequence is $x_{2k}=1$ for all $k$, so $x_{2k}\\to 1$. The
      odd-indexed subsequence is $x_{2k-1}=-1$ for all $k$, so $x_{2k-1}\\to -1$.</p>
      <p>If $(x_n)$ converged to some $L$, every subsequence would converge to $L$, giving
      $L=1$ and $L=-1$ at once. Hence $(x_n)$ diverges.</p>`,
    trap: `"The terms do not settle down" is not a proof. The divergence criterion needs two named
      subsequences with two named limits.`,
    tests: ['m.3.4.8'] },

  { id: 'w.3.4.2', sec: '3.4', marks: 7, mock: true,
    title: 'Exercise 3.4.2 — one limit for every subsequence',
    prompt: `<p>Let $(x_n)$ be a bounded sequence and suppose every convergent subsequence of
      $(x_n)$ converges to the same number $L$. Prove that $x_n\\to L$.</p>`,
    approach: `<p>Argue by contradiction and let Bolzano–Weierstrass do the work. If $x_n\\not\\to
      L$ then some $\\varepsilon_0>0$ is escaped infinitely often; those escaping terms form a
      bounded sequence, so they have a convergent subsequence — whose limit cannot be $L$.</p>`,
    solution: `<p>Suppose $x_n\\not\\to L$. Then there is $\\varepsilon_0>0$ such that for every
      $K\\in\\mathbb{N}$ there is $n\\ge K$ with $|x_n-L|\\ge\\varepsilon_0$. Choosing
      $K=1,2,3,\\ldots$ in turn gives indices $n_1<n_2<\\cdots$ with
      $$|x_{n_k}-L|\\ge\\varepsilon_0 \\quad\\text{for all } k.$$</p>
      <p>$(x_{n_k})$ is a subsequence of a bounded sequence, hence bounded, so by
      Bolzano–Weierstrass it has a convergent subsequence $(x_{n_{k_j}})$, say with limit $M$.
      That is also a subsequence of $(x_n)$, so by hypothesis $M=L$.</p>
      <p>But $|x_{n_{k_j}}-L|\\ge\\varepsilon_0$ for every $j$, and letting $j\\to\\infty$ gives
      $|M-L|\\ge\\varepsilon_0>0$ — a contradiction. Hence $x_n\\to L$.</p>`,
    trap: `Boundedness is doing real work here and must be used: without it the statement fails
      for $x_n = n$ when $n$ is odd and $x_n = 0$ when $n$ is even, whose only convergent
      subsequences tend to $0$.`,
    tests: ['m.3.4.8'] },

  { id: 'w.3.4.3', sec: '3.4', marks: 3, mock: true,
    title: 'Exercise 3.4.3 — a convergent subsequence of $(\\sin n)$',
    prompt: `<p>Show that the sequence $x_n=\\sin n$ has a convergent subsequence, without
      computing any limit.</p>`,
    approach: `<p>This is Bolzano–Weierstrass applied literally. The only thing to check is the
      hypothesis.</p>`,
    solution: `<p>For every $n\\in\\mathbb{N}$, $|\\sin n|\\le 1$, so $(x_n)$ is bounded.</p>
      <p>By the Bolzano–Weierstrass Theorem every bounded sequence of real numbers has a
      convergent subsequence, so $(\\sin n)$ has one.</p>`,
    trap: `Trying to identify the limit. Bolzano–Weierstrass is an existence theorem and names
      nothing; the limit here depends on how the integers distribute modulo $2\\pi$.`,
    tests: ['m.3.4.8'] },

  /* ── §5.1 · continuous functions ────────────────────────────────────────── */
  { id: 'w.5.1.1', sec: '5.1', marks: 6, mock: true,
    title: 'Exercise 5.1.1 — $x^{2}$ from the definition',
    prompt: `<p>Use the $\\varepsilon$-$\\delta$ definition to prove that $f(x)=x^{2}$ is
      continuous at every $c\\in\\mathbb{R}$.</p>`,
    approach: `<p>Factor $x^{2}-c^{2}=(x-c)(x+c)$ and control the second factor by agreeing in
      advance that $|x-c|<1$. That turns an unbounded factor into a constant, and the constant is
      what goes into $\\delta$.</p>`,
    solution: `<p>Fix $c$ and let $\\varepsilon>0$. For $|x-c|<1$ we have $|x|<|c|+1$, hence
      $$|x+c|\\le|x|+|c| < 2|c|+1.$$</p>
      <p>Put $\\delta=\\min\\left\\{1,\\ \\dfrac{\\varepsilon}{2|c|+1}\\right\\}>0$. If
      $|x-c|<\\delta$ then both constraints hold and
      $$|x^{2}-c^{2}| = |x-c|\\,|x+c| < \\delta\\,(2|c|+1) \\le \\varepsilon.$$</p>
      <p>Since $\\varepsilon>0$ was arbitrary, $f$ is continuous at $c$; and $c$ was arbitrary.</p>`,
    trap: `Taking $\\delta=\\varepsilon/|x+c|$. $\\delta$ may depend on $\\varepsilon$ and on $c$,
      never on $x$ — $x$ is the variable the inequality is about.`,
    tests: ['m.5.1.1'] },

  { id: 'w.5.1.2', sec: '5.1', marks: 6, mock: true,
    title: 'Exercise 5.1.2 — Dirichlet, by the sequential criterion',
    prompt: `<p>Let $f(x)=1$ for $x\\in\\mathbb{Q}$ and $f(x)=0$ for $x\\notin\\mathbb{Q}$. Prove
      that $f$ is continuous at no point of $\\mathbb{R}$.</p>`,
    approach: `<p>Density gives two sequences at every point — one rational, one irrational —
      both converging to it. The sequential criterion then compares two images that cannot
      agree.</p>`,
    solution: `<p>Let $c\\in\\mathbb{R}$.</p>
      <p>By the density of $\\mathbb{Q}$ there is a sequence $(r_n)$ of rationals with
      $r_n\\to c$; by the density of the irrationals there is a sequence $(s_n)$ of irrationals
      with $s_n\\to c$.</p>
      <p>Then $f(r_n)=1\\to 1$ and $f(s_n)=0\\to 0$. If $f$ were continuous at $c$, the sequential
      criterion would force $f(r_n)\\to f(c)$ and $f(s_n)\\to f(c)$, giving $f(c)=1$ and
      $f(c)=0$.</p>
      <p>That is impossible, so $f$ is discontinuous at $c$ — and $c$ was arbitrary.</p>`,
    trap: `Only producing the rational sequence. One sequence whose images converge proves
      nothing; the criterion is broken by a DISAGREEING pair.`,
    tests: ['m.5.1.3'] },

  { id: 'w.5.1.3', sec: '5.1', marks: 5, mock: true,
    title: 'Exercise 5.1.3 — sign is preserved locally',
    prompt: `<p>Suppose $f$ is continuous at $c$ and $f(c)>0$. Prove there is $\\delta>0$ such
      that $f(x)>0$ for every $x$ in the domain with $|x-c|<\\delta$.</p>`,
    approach: `<p>The whole exercise is the choice of $\\varepsilon$. Pick it so that the
      $\\varepsilon$-neighbourhood of $f(c)$ sits strictly inside the positive numbers —
      $\\varepsilon=\\tfrac12 f(c)$ does it.</p>`,
    solution: `<p>Let $\\varepsilon=\\tfrac12 f(c)>0$. By continuity at $c$ there is $\\delta>0$
      such that $|x-c|<\\delta$ (and $x$ in the domain) implies
      $$|f(x)-f(c)|<\\tfrac12 f(c).$$</p>
      <p>The left-hand inequality of that absolute value gives
      $$f(x) > f(c)-\\tfrac12 f(c) = \\tfrac12 f(c) > 0.$$</p>
      <p>So $f$ is strictly positive on that whole neighbourhood, and in fact bounded below
      there by $\\tfrac12 f(c)$.</p>`,
    trap: `Choosing $\\varepsilon=f(c)$ gives only $f(x)>0$ with no margin, and the strict
      inequality is then lost at the endpoint of the estimate. Half the value is the standard
      choice for a reason.`,
    tests: ['m.5.1.1', 'm.5.1.3'] },

  /* ── §5.3 · continuous functions on intervals ───────────────────────────── */
  { id: 'w.5.3.1', sec: '5.3', marks: 4, mock: true,
    title: 'Exercise 5.3.1 — where boundedness fails',
    prompt: `<p>Show that $f(x)=1/x$ is continuous and unbounded on $(0,1]$. Which hypothesis of
      the Boundedness Theorem fails?</p>`,
    approach: `<p>Continuity on the interval is the algebra of continuous functions. Unboundedness
      needs one explicit sequence. Then read the theorem's hypotheses and say which word is
      missing.</p>`,
    solution: `<p>On $(0,1]$ the denominator never vanishes, so $f$ is continuous there as a
      quotient of continuous functions.</p>
      <p>Take $x_n=1/n$ for $n\\ge 1$. Then $x_n\\in(0,1]$ and $f(x_n)=n$, so $f$ takes values
      above every bound and is unbounded.</p>
      <p>The Boundedness Theorem requires a CLOSED BOUNDED interval $[a,b]$. Here the interval is
      bounded but not closed: the endpoint $0$ is missing, and it is exactly the point the
      function blows up at.</p>`,
    trap: `Saying "the function is not continuous at $0$". $0$ is not in the domain, so there is
      nothing to be continuous or discontinuous at — the failure is in the interval, not in $f$.`,
    tests: ['m.5.3.4'] },

  { id: 'w.5.3.2', sec: '5.3', marks: 6, mock: true,
    title: 'Exercise 5.3.2 — every odd-degree polynomial has a root',
    prompt: `<p>Let $p(x)=a_{2k+1}x^{2k+1}+\\cdots+a_1x+a_0$ with $a_{2k+1}\\ne 0$. Prove that $p$
      has at least one real root.</p>`,
    approach: `<p>The leading term decides the sign far out in both directions, and it decides it
      differently because the degree is odd. Find one point where $p$ is negative and one where it
      is positive, then apply Bolzano's theorem on the interval between them.</p>`,
    solution: `<p>Assume $a_{2k+1}>0$ (otherwise apply the argument to $-p$, which has the same
      roots). Writing
      $$p(x)=x^{2k+1}\\left(a_{2k+1}+\\frac{a_{2k}}{x}+\\cdots+\\frac{a_0}{x^{2k+1}}\\right),$$
      the bracket tends to $a_{2k+1}>0$ as $|x|\\to\\infty$, so for all large $|x|$ it is positive.
      Since $x^{2k+1}$ is positive for large positive $x$ and negative for large negative $x$,
      there are $b>0$ with $p(b)>0$ and $a<0$ with $p(a)<0$.</p>
      <p>$p$ is a polynomial, hence continuous on $[a,b]$, and $p(a)<0<p(b)$. By Bolzano's
      Location of Roots Theorem there is $c\\in(a,b)$ with $p(c)=0$.</p>`,
    trap: `The argument uses oddness twice over, and it is worth saying where: an even-degree
      polynomial has the same sign at both ends, and $x^{2}+1$ shows the conclusion then fails.`,
    tests: ['m.5.3.7'] },

  { id: 'w.5.3.3', sec: '5.3', marks: 5, mock: true,
    title: 'Exercise 5.3.3 — a continuous self-map has a fixed point',
    prompt: `<p>Let $f:[0,1]\\to[0,1]$ be continuous. Prove that there is $c\\in[0,1]$ with
      $f(c)=c$.</p>`,
    approach: `<p>A fixed point of $f$ is a zero of $g(x)=f(x)-x$. Check the sign of $g$ at the
      two endpoints and the intermediate value theorem finishes it.</p>`,
    solution: `<p>Define $g(x)=f(x)-x$ on $[0,1]$; it is continuous as a difference of continuous
      functions.</p>
      <p>Since $f(0)\\in[0,1]$ we have $g(0)=f(0)-0\\ge 0$. Since $f(1)\\in[0,1]$ we have
      $g(1)=f(1)-1\\le 0$.</p>
      <p>If $g(0)=0$ then $c=0$ works; if $g(1)=0$ then $c=1$ works. Otherwise $g(0)>0>g(1)$ and
      Bolzano's theorem gives $c\\in(0,1)$ with $g(c)=0$, i.e. $f(c)=c$.</p>`,
    trap: `Forgetting the two boundary cases. $g(0)\\ge 0$ and $g(1)\\le 0$ are not strict, and the
      Location of Roots Theorem needs strict opposite signs — so the equalities have to be
      disposed of first.`,
    tests: ['m.5.3.7'] },

  /* ── §5.4 · uniform continuity ──────────────────────────────────────────── */
  { id: 'w.5.4.1', sec: '5.4', marks: 5, mock: true,
    title: 'Exercise 5.4.1 — $1/x$ is not uniformly continuous on $(0,1)$',
    prompt: `<p>Show that $f(x)=1/x$ is not uniformly continuous on $(0,1)$.</p>`,
    approach: `<p>Use the Nonuniform Continuity Criterion: produce $\\varepsilon_0>0$ and two
      sequences $(x_n),(u_n)$ in the set with $x_n-u_n\\to 0$ but $|f(x_n)-f(u_n)|\\ge
      \\varepsilon_0$.</p>`,
    solution: `<p>Take $x_n=\\dfrac{1}{n}$ and $u_n=\\dfrac{1}{n+1}$ for $n\\ge 1$; both lie in
      $(0,1)$ and
      $$x_n-u_n=\\frac{1}{n}-\\frac{1}{n+1}=\\frac{1}{n(n+1)}\\to 0.$$</p>
      <p>But $f(x_n)-f(u_n)=n-(n+1)=-1$, so $|f(x_n)-f(u_n)|=1$ for every $n$.</p>
      <p>With $\\varepsilon_0=1$ the Nonuniform Continuity Criterion applies: $f$ is not uniformly
      continuous on $(0,1)$, even though it is continuous at every point of it.</p>`,
    trap: `Concluding that $f$ is discontinuous somewhere. It is continuous at every point of
      $(0,1)$; what fails is that one $\\delta$ cannot serve the whole set at once.`,
    tests: ['m.5.4.1'] },

  { id: 'w.5.4.2', sec: '5.4', marks: 6, mock: true,
    title: 'Exercise 5.4.2 — $x^{2}$ on a bounded interval and on $\\mathbb{R}$',
    prompt: `<p>Show that $f(x)=x^{2}$ is uniformly continuous on $[0,b]$ for every $b>0$, but not
      uniformly continuous on $\\mathbb{R}$.</p>`,
    approach: `<p>On $[0,b]$ the factor $|x+u|$ is bounded by $2b$, which makes $\\delta$
      independent of the point — or quote the Uniform Continuity Theorem. On $\\mathbb{R}$ that
      bound is exactly what is lost, so hunt for two sequences drifting apart in value while
      closing in position.</p>`,
    solution: `<p><b>On $[0,b]$.</b> For $x,u\\in[0,b]$,
      $$|x^{2}-u^{2}|=|x-u|\\,|x+u|\\le 2b\\,|x-u|.$$
      Given $\\varepsilon>0$ take $\\delta=\\varepsilon/(2b)$, which depends on $\\varepsilon$ and
      $b$ only. (Equivalently: $[0,b]$ is a closed bounded interval and $f$ is continuous on it,
      so the Uniform Continuity Theorem applies.)</p>
      <p><b>On $\\mathbb{R}$.</b> Take $x_n=n+\\dfrac1n$ and $u_n=n$. Then $x_n-u_n=\\dfrac1n\\to
      0$, while
      $$x_n^{2}-u_n^{2}=\\left(n+\\tfrac1n\\right)^{2}-n^{2}=2+\\tfrac{1}{n^{2}}\\ge 2.$$
      With $\\varepsilon_0=2$ the Nonuniform Continuity Criterion applies.</p>`,
    trap: `"Continuous on $\\mathbb{R}$, and $\\mathbb{R}$ is closed, so the Uniform Continuity
      Theorem applies." The theorem needs closed AND BOUNDED; $\\mathbb{R}$ is not bounded.`,
    tests: ['m.5.4.1', 'm.5.4.3'] },

  { id: 'w.5.4.3', sec: '5.4', marks: 6, mock: true,
    title: 'Exercise 5.4.3 — Cauchy sequences are preserved',
    prompt: `<p>Let $f$ be uniformly continuous on $A\\subseteq\\mathbb{R}$ and let $(x_n)$ be a
      Cauchy sequence in $A$. Prove that $(f(x_n))$ is a Cauchy sequence.</p>`,
    approach: `<p>Uniform continuity hands you one $\\delta$ for the whole set; the Cauchy property
      hands you an index past which all terms are within $\\delta$ of each other. Line the two up in
      that order — $\\varepsilon$, then $\\delta$, then $K$.</p>`,
    solution: `<p>Let $\\varepsilon>0$. By uniform continuity there is $\\delta>0$ such that
      $$u,v\\in A,\\ |u-v|<\\delta \\ \\Longrightarrow\\ |f(u)-f(v)|<\\varepsilon.$$</p>
      <p>Since $(x_n)$ is Cauchy there is $K\\in\\mathbb{N}$ such that $|x_n-x_m|<\\delta$ for all
      $n,m\\ge K$.</p>
      <p>For such $n,m$ both terms lie in $A$ and are within $\\delta$, so
      $|f(x_n)-f(x_m)|<\\varepsilon$. As $\\varepsilon>0$ was arbitrary, $(f(x_n))$ is Cauchy.</p>`,
    trap: `Mere continuity is not enough, and the same $f(x)=1/x$ on $(0,1)$ shows it: $x_n=1/n$ is
      Cauchy there while $f(x_n)=n$ is not. The one $\\delta$ that serves all of $A$ is the whole
      content of the proof.`,
    tests: ['m.5.4.1', 'm.5.4.3'] },

  /* ── §6.2 · the Mean Value Theorem ──────────────────────────────────────── */
  { id: 'w.6.2.1', sec: '6.2', marks: 4, mock: true,
    title: 'Exercise 6.2.1 — sine is a contraction',
    prompt: `<p>Use the Mean Value Theorem to prove that
      $$|\\sin x-\\sin y|\\le|x-y|\\qquad\\text{for all }x,y\\in\\mathbb{R}.$$</p>`,
    approach: `<p>Apply the MVT to $\\sin$ on the interval between $x$ and $y$, then bound the
      derivative that appears. The bound $|\\cos c|\\le 1$ is the entire estimate.</p>`,
    solution: `<p>If $x=y$ both sides are $0$. Otherwise assume $y<x$ (relabel if needed).</p>
      <p>$\\sin$ is continuous on $[y,x]$ and differentiable on $(y,x)$, so by the Mean Value
      Theorem there is $c\\in(y,x)$ with
      $$\\sin x-\\sin y=(\\cos c)(x-y).$$</p>
      <p>Taking absolute values and using $|\\cos c|\\le 1$,
      $$|\\sin x-\\sin y|=|\\cos c|\\,|x-y|\\le |x-y|.$$</p>`,
    trap: `The MVT gives one $c$ that you do not get to choose, so nothing may be assumed about
      it beyond where it lies. Every estimate has to hold for EVERY admissible $c$.`,
    tests: ['m.6.2.4'] },

  { id: 'w.6.2.2', sec: '6.2', marks: 5, mock: true,
    title: 'Exercise 6.2.2 — a vanishing derivative',
    prompt: `<p>Let $f$ be differentiable on an interval $I$ with $f'(x)=0$ for every $x\\in I$.
      Prove that $f$ is constant on $I$.</p>`,
    approach: `<p>"Constant" means any two points have the same value, so take two and apply the
      MVT on the interval between them.</p>`,
    solution: `<p>Let $a,b\\in I$ with $a<b$. Since $I$ is an interval, $[a,b]\\subseteq I$, so $f$
      is continuous on $[a,b]$ and differentiable on $(a,b)$.</p>
      <p>By the Mean Value Theorem there is $c\\in(a,b)$ with
      $$f(b)-f(a)=f'(c)(b-a)=0\\cdot(b-a)=0,$$
      so $f(b)=f(a)$.</p>
      <p>Since $a,b$ were arbitrary, $f$ takes one value throughout $I$.</p>`,
    trap: `The hypothesis that $I$ is an INTERVAL is load-bearing. On the domain
      $(0,1)\\cup(2,3)$ a function can have zero derivative everywhere and still take two
      different values.`,
    tests: ['m.6.2.4'] },

  { id: 'w.6.2.3', sec: '6.2', marks: 6, mock: true,
    title: 'Exercise 6.2.3 — bracketing the logarithm',
    prompt: `<p>Prove that for every $x>0$,
      $$\\frac{x}{1+x} < \\ln(1+x) < x.$$</p>`,
    approach: `<p>Apply the MVT to $\\ln$ on $[1,1+x]$. The derivative is $1/t$, which is
      decreasing — so bounding $c$ between the endpoints bounds $1/c$ between the two reciprocals,
      and those are exactly the two sides asked for.</p>`,
    solution: `<p>Fix $x>0$ and let $g(t)=\\ln t$ on $[1,1+x]$. It is continuous there and
      differentiable on $(1,1+x)$ with $g'(t)=1/t$, so the Mean Value Theorem gives
      $c\\in(1,1+x)$ with
      $$\\ln(1+x)-\\ln 1=\\frac{1}{c}\\,\\big((1+x)-1\\big)=\\frac{x}{c},$$
      that is $\\ln(1+x)=x/c$.</p>
      <p>Since $1<c<1+x$ and $t\\mapsto 1/t$ is strictly decreasing on $(0,\\infty)$,
      $$\\frac{1}{1+x} < \\frac{1}{c} < 1.$$</p>
      <p>Multiplying through by $x>0$ preserves the strict inequalities and gives

/* ── project/effects.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Optics — behaviour only this app has.

   Loaded before flow-library, so it only REGISTERS hooks on PROJECT; nothing
   here may touch DOM, UI or Pool until a hook is called at run time.

   home  a live prism: a white ray enters an equilateral prism (apex A = 60°)
         and leaves dispersed into seven colours. The incidence angle sweeps
         slowly through the angle of minimum deviation, so the fan visibly
         narrows and widens — it is the real geometry, not a picture:

             r1 = asin(sin i / n),  r2 = A − r1,  e = asin(n sin r2),
             D  = i + e − A,        n(λ) = 1.50 + 0.020 / λ²  (λ in µm)

         Your progress sits under it as three rays: read, proofs, sections.
         It idles when off-screen or hidden and is still under
         prefers-reduced-motion.
   ══════════════════════════════════════════════════════════════════════════ */

PROJECT.hooks.home = function (ctx) {
  const el = DOM.el;
  const NS = 'http://www.w3.org/2000/svg';
  const W = 600, H = 190;
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(k => n.setAttribute(k, attrs[k]));
    return n;
  };
  const A = 60 * Math.PI / 180, RAD = Math.PI / 180;
  const BANDS = [
    { l: 0.405, c: 'var(--sp-1)' }, { l: 0.45, c: 'var(--sp-2)' }, { l: 0.49, c: 'var(--sp-3)' },
    { l: 0.55, c: 'var(--sp-4)' }, { l: 0.59, c: 'var(--sp-5)' }, { l: 0.65, c: 'var(--sp-6)' },
    { l: 0.70, c: 'var(--sp-6)' }
  ];
  const nOf = l => 1.50 + 0.020 / (l * l);

  /* Everything is worked out in the prism's own frame (apex up, entry point
     P1), then rotated about P1 so the incoming beam is always horizontal —
     which is what physically turning the prism looks like. */
  const S = 78, HT = S * Math.sqrt(3) / 2;
  const P1 = [170, 62];                                     /* fixed entry point on the left face */
  const apex0 = [P1[0] + S / 4, P1[1] - HT / 2], bl0 = [P1[0] - S / 4, P1[1] + HT / 2],
        br0 = [P1[0] + 3 * S / 4, P1[1] + HT / 2];         /* P1 is the midpoint of apex–bl */

  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
    'aria-label': 'A white ray entering a glass prism and splitting into the colours of the spectrum' });
  const prism = svgEl('polygon', { class: 'prism' });
  const beam = svgEl('line', { class: 'beam-in' });
  const inner = svgEl('line', { class: 'inner' });
  svg.appendChild(prism);
  svg.appendChild(inner);
  svg.appendChild(beam);
  const rays = BANDS.map(b => {
    const r = svgEl('line', { class: 'ray', stroke: b.c });
    svg.appendChild(r);
    return r;
  });

  /* screen coordinates (y down): rotate p about P1 by `th` radians, counter-clockwise on screen */
  const rot = (p, th) => {
    const dx = p[0] - P1[0], dy = -(p[1] - P1[1]);
    return [P1[0] + dx * Math.cos(th) - dy * Math.sin(th), P1[1] - (dx * Math.sin(th) + dy * Math.cos(th))];
  };
  const set = (node, a, b) => {
    node.setAttribute('x1', a[0].toFixed(1)); node.setAttribute('y1', a[1].toFixed(1));
    node.setAttribute('x2', b[0].toFixed(1)); node.setAttribute('y2', b[1].toFixed(1));
  };

  /* Prism frame: left face inward normal at −30°, right face outward normal at +30°. */
  function frame(t) {
    const i = (50 + 8 * Math.sin(t * 0.00055)) * RAD;      /* incidence on face 1 */
    const th = 30 * RAD - i;                                 /* rotation that makes the beam horizontal */
    const nMid = nOf(0.55);
    const dIn = -30 * RAD + Math.asin(Math.sin(i) / nMid);   /* mean internal direction */
    /* solve P1 + s·(cos dIn, −sin dIn) = apex0 + u·(br0 − apex0) */
    const dx = Math.cos(dIn), dy = -Math.sin(dIn);
    const fx = br0[0] - apex0[0], fy = br0[1] - apex0[1];
    const det = dx * (-fy) - dy * (-fx);
    const s = ((apex0[0] - P1[0]) * (-fy) - (apex0[1] - P1[1]) * (-fx)) / det;
    const P2 = [P1[0] + s * dx, P1[1] + s * dy];

    prism.setAttribute('points', [apex0, bl0, br0].map(p => rot(p, th).map(v => v.toFixed(1)).join(',')).join(' '));
    set(beam, [0, P1[1]], P1);
    const P2r = rot(P2, th);
    set(inner, P1, P2r);

    BANDS.forEach(function (b, k) {
      const n = nOf(b.l);
      const r1 = Math.asin(Math.sin(i) / n);
      const sinE = n * Math.sin(A - r1);
      const ray = rays[k];
      if (sinE > 1) { ray.setAttribute('opacity', 0); return; }     /* total internal reflection */
      ray.setAttribute('opacity', 0.92);
      const dOut = 30 * RAD - Math.asin(sinE) + th;                   /* in the rotated (screen) frame */
      set(ray, P2r, [P2r[0] + 330 * Math.cos(dOut), P2r[1] - 330 * Math.sin(dOut)]);
    });
  }

  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  frame(1400);
  if (!still) {
    const start = performance.now();
    const tick = function (now) {
      if (!svg.isConnected && now - start > 1000) return;    /* the view was replaced */
      if (!document.hidden) frame(now - start + 1400);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  const o = (ctx && ctx.overall) || { total: 0, l1: 0, l2: 0, l3: 0 };
  const band = (label, n, color) => el('div', {}, [
    el('b', { text: o.total ? DOM.pct(n, o.total) + '%' : '—' }),
    el('span', { text: label }),
    el('i', { style: { background: color, width: (o.total ? DOM.pct(n, o.total) : 0) + '%' } })
  ]);

  /* how far the student has got with the simulations, and the next one to try */
  const und = (function () {
    if (typeof OSIM === 'undefined') return null;
    const sm = OSIM.summary(), next = OSIM.ids().filter(id => !OSIM.rec(id).e)[0];
    let link = null;
    if (next) {
      const host = Pool.concepts(null, { includeExt: true }).filter(c => c.sim === next)[0];
      if (host) link = el('a', { href: Router.href('note/' + host.id), text: 'Next: ' + OSIM.get(next).title + ' ›' });
    }
    return el('div', { class: 'op-und' }, [
      el('div', {}, [el('b', { text: 'Understanding · ' }), 'simulations explored ', el('b', { text: sm.explored + '/' + sm.sims }),
        ' · predictions right first try ', el('b', { text: sm.right + '/' + sm.tasks }), ' (', sm.tried + ' tried', ')']),
      link
    ]);
  })();

  return el('section', { class: 'hero op-hero', 'aria-label': 'Optics' }, [
    el('div', { class: 'op-head' }, [
      el('div', { class: 'kicker', text: 'white light, split' }),
      el('span', { class: 'op-units', text: 'prism · A = 60°' })
    ]),
    svg,
    el('div', { class: 'op-exp' }, [
      band('read', o.l1, 'var(--sp-6)'),
      band('proofs', o.l2, 'var(--sp-5)'),
      band('sections', o.l3, 'var(--sp-4)')
    ]),
    und
  ]);
};


/* ── project/optics.figs.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Optics — step diagrams.

   Almost every derivation in optics is a picture that has been turned into
   algebra, so each proof step that needs one carries a small diagram. The
   diagrams are SVG drawn from the same numbers the proof uses (Snell's law is
   SOLVED for the crossing point, a ray is refracted with the real formula), so
   a figure cannot disagree with the maths beside it.

   ONE diagram, BUILT UP: a figure has stages 1…n and a proof step asks for
   stage k. Everything that has appeared before is drawn quietly; what this
   step adds is drawn in the accent colour (class `new`). Reading the proof top
   to bottom, the picture accumulates exactly as the argument does.

   Data side: a proof step carries `fig: { k: '<kind>', s: <stage> }`, written
   in authoring/figs.py. This file only REGISTERS (it must not touch DOM, UI or
   Pool at load): the hooks are called at run time by flow-library.

   Registered kinds live in optics.figs.m1.js … m4.js via OFIG.add(kind, spec):
       spec = { n: <stages>, w?, h?, alt: (s) => text, build: (g, s) => void }
   ══════════════════════════════════════════════════════════════════════════ */

const OFIG = (function () {

  const NS = 'http://www.w3.org/2000/svg';
  const RAD = Math.PI / 180;
  const reg = {};

  function node(tag, attrs, text) {
    const n = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }

  /* A drawing surface in USER units: x to the right, y UP, `sc` pixels per unit,
     (0,0) at pixel (ox, oy). Angles are degrees, counter-clockwise from +x, as on paper. */
  function Canvas(o) {
    const w = o.w || 320, h = o.h || 170, sc = o.sc || 1, ox = o.ox || 0, oy = o.oy == null ? h : o.oy;
    const svg = node('svg', { viewBox: '0 0 ' + w + ' ' + h, class: 'ofig-svg', role: 'img',
      'aria-label': o.alt || 'diagram', preserveAspectRatio: 'xMidYMid meet' });
    const X = x => ox + x * sc, Y = y => oy - y * sc;
    const add = n => svg.appendChild(n);
    const g = { svg: svg, X: X, Y: Y, w: w, h: h, sc: sc };

    g.line = (x1, y1, x2, y2, c) => add(node('line', { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), class: c || 'k' }));

    /* a ray/arrow; `at` is where the head sits along it (1 = at the end, .5 = mid-ray) */
    g.arrow = function (x1, y1, x2, y2, c, at) {
      const f = at == null ? 1 : at, cls = c || 'r';
      add(node('line', { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), class: cls }));
      const hx = x1 + (x2 - x1) * f, hy = y1 + (y2 - y1) * f;
      const a = Math.atan2(Y(y2) - Y(y1), X(x2) - X(x1)), L = 7, W = 3.2;
      const px = X(hx), py = Y(hy);
      const pts = [[px, py], [px - L * Math.cos(a) + W * Math.sin(a), py - L * Math.sin(a) - W * Math.cos(a)],
        [px - L * Math.cos(a) - W * Math.sin(a), py - L * Math.sin(a) + W * Math.cos(a)]];
      add(node('polygon', { points: pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '),
        class: cls + ' head' }));
    };

    g.text = (x, y, str, c, anchor, dx, dy) => add(node('text', { x: X(x) + (dx || 0), y: Y(y) + (dy == null ? 3 : dy),
      class: c || 't', 'text-anchor': anchor || 'middle' }, str));
    g.dot = (x, y, c, r) => add(node('circle', { cx: X(x), cy: Y(y), r: r || 3, class: c || 'pt' }));
    g.circle = (x, y, r, c) => add(node('circle', { cx: X(x), cy: Y(y), r: r * sc, class: c || 'k nofill' }));
    g.rect = (x1, y1, x2, y2, c) => add(node('rect', { x: X(Math.min(x1, x2)), y: Y(Math.max(y1, y2)),
      width: Math.abs(x2 - x1) * sc, height: Math.abs(y2 - y1) * sc, class: c || 'fillk' }));
    g.poly = (pts, c) => add(node('polygon', { points: pts.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' '),
      class: c || 'fillk' }));
    g.path = (d, c) => add(node('path', { d: d, class: c || 'k' }));

    /* a polyline through user points */
    g.poline = function (pts, c) {
      g.path(pts.map((p, i) => (i ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join(' '), c || 'k nofill');
    };

    /* an arc of radius r (user units) about (cx,cy) from angle a0 to a1 (degrees, CCW) */
    g.arc = function (cx, cy, r, a0, a1, c) {
      const p = a => [X(cx + r * Math.cos(a * RAD)), Y(cy + r * Math.sin(a * RAD))];
      const s = p(a0), e = p(a1);
      g.path('M' + s[0].toFixed(1) + ' ' + s[1].toFixed(1) + ' A' + (r * sc).toFixed(1) + ' ' + (r * sc).toFixed(1) +
        ' 0 ' + (Math.abs(a1 - a0) > 180 ? 1 : 0) + ' ' + (a1 > a0 ? 0 : 1) + ' ' + e[0].toFixed(1) + ' ' + e[1].toFixed(1),
        (c || 'ang') + ' nofill');
    };

    /* an angle mark between two directions at a vertex, with a label just outside it */
    g.angle = function (cx, cy, r, a0, a1, label, c) {
      g.arc(cx, cy, r, a0, a1, c || 'ang');
      if (label) {
        const m = (a0 + a1) / 2 * RAD, rr = r + 8 / sc;
        g.text(cx + rr * Math.cos(m), cy + rr * Math.sin(m), label, (c || 'ang') === 'ang' ? 't sym' : 't sym new', 'middle', 0, 3);
      }
    };

    /* a dimension line with arrowheads both ends, offset perpendicular by `off` px */
    g.dim = function (x1, y1, x2, y2, label, off, c) {
      const dx = X(x2) - X(x1), dy = Y(y2) - Y(y1), len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len * (off || 0), ny = dx / len * (off || 0);
      const p1 = [X(x1) + nx, Y(y1) + ny], p2 = [X(x2) + nx, Y(y2) + ny];
      const cls = c || 'dim';
      add(node('line', { x1: X(x1), y1: Y(y1), x2: p1[0], y2: p1[1], class: 'ext' }));
      add(node('line', { x1: X(x2), y1: Y(y2), x2: p2[0], y2: p2[1], class: 'ext' }));
      add(node('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], class: cls }));
      const a = Math.atan2(p2[1] - p1[1], p2[0] - p1[0]);
      [[p1, 1], [p2, -1]].forEach(function (e) {
        const q = e[0], sg = e[1], L = 5, W = 2.2;
        const tip = [q[0], q[1]], b = [q[0] + sg * L * Math.cos(a), q[1] + sg * L * Math.sin(a)];
        add(node('polygon', { points: [tip, [b[0] + W * Math.sin(a), b[1] - W * Math.cos(a)],
          [b[0] - W * Math.sin(a), b[1] + W * Math.cos(a)]].map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '), class: cls + ' head' }));
      });
      if (label) {
        const w = Math.max(10, String(label).length * 5.4 + 6);
        add(node('rect', { x: (p1[0] + p2[0]) / 2 - w / 2, y: (p1[1] + p2[1]) / 2 - 7, width: w, height: 14, class: 'dimbg' }));
      }
      if (label) add(node('text', { x: (p1[0] + p2[0]) / 2, y: (p1[1] + p2[1]) / 2 + 3.5,
        class: (c || 'dim') === 'dim' ? 't sym' : 't sym new', 'text-anchor': 'middle' }, label));
    };

    /* thin biconvex lens outline centred on x, spanning y0..y1 */
    g.lens = function (x, y0, y1, c, bulge) {
      const b = (bulge == null ? 7 : bulge) / sc, ym = (y0 + y1) / 2;
      g.path('M' + X(x) + ' ' + Y(y1) + ' Q' + X(x + b * 1.9) + ' ' + Y(ym) + ' ' + X(x) + ' ' + Y(y0) +
        ' Q' + X(x - b * 1.9) + ' ' + Y(ym) + ' ' + X(x) + ' ' + Y(y1) + 'Z', c || 'lens');
    };
    g.hatch = function (x1, x2, y, depth) {           /* mirror hatching below a horizontal line */
      for (let x = x1; x <= x2; x += 9 / sc) g.line(x, y, x - 6 / sc, y - (depth || 8) / sc, 'hatch');
    };
    return g;
  }

  /* ── registry, frames, hooks ─────────────────────────────────────────── */
  function add(kind, spec) { reg[kind] = spec; }

  function make(kind, s, opts) {
    const spec = reg[kind];
    if (!spec) return null;
    const st = Math.max(1, Math.min(spec.n || 1, s || 1));
    const g = Canvas({ w: spec.w, h: spec.h, sc: spec.sc, ox: spec.ox, oy: spec.oy,
      alt: spec.alt ? spec.alt(st) : kind });
    spec.build(g, st, opts || {});
    return g.svg;
  }

  /* the figure a proof step asks for */
  function forRung(rung, concept, i) {
    const f = rung && rung.fig;
    if (!f || !reg[f.k]) return null;
    const svg = make(f.k, f.s);
    return DOM.el('figure', { class: 'ofig', 'data-kind': f.k, 'data-stage': f.s }, [
      svg,
      f.cap ? DOM.el('figcaption', { class: 'ofig-cap', html: f.cap }) : null
    ]);
  }

  /* labels that fall outside the drawing's own frame (attached off-screen: getBBox needs layout) */
  function textOutside(svg, tag) {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;top:0;width:640px';
    host.appendChild(svg); document.body.appendChild(host);
    const vb = svg.viewBox.baseVal, out = [];
    Array.prototype.forEach.call(svg.querySelectorAll(tag || 'text'), function (n) {
      let b; try { b = n.getBBox(); } catch (e) { return; }
      if (b.width + b.height === 0) return;
      if (b.x < -6 || b.y < -6 || b.x + b.width > vb.width + 6 || b.y + b.height > vb.height + 6) out.push('"' + (n.textContent || '').slice(0, 26) + '" at (' + Math.round(b.x) + ',' + Math.round(b.y) + ',w' + Math.round(b.width) + ')');
    });
    document.body.removeChild(host);
    return out;
  }

  /* what the audit and the gallery walk over */
  const kinds = () => Object.keys(reg);
  const stages = k => (reg[k] && reg[k].n) || 1;

  /* Render every kind at every stage; report anything that is empty, has a NaN
     coordinate, or draws outside its own viewBox. Attached off-screen because
     getBBox needs layout. */
  function audit() {
    const host = document.createElement('div');
    host.style.cssText = 'position:absolute;left:-9999px;top:0;width:640px';
    document.body.appendChild(host);
    const problems = [];
    let count = 0;
    kinds().forEach(function (k) {
      for (let s = 1; s <= stages(k); s += 1) {
        count += 1;
        let svg;
        try { svg = make(k, s); } catch (e) { problems.push(k + '#' + s + ' threw ' + e.message); continue; }
        host.appendChild(svg);
        if (svg.childNodes.length < 4) problems.push(k + '#' + s + ' is nearly empty');
        const bad = Array.prototype.some.call(svg.querySelectorAll('*'), function (n) {
          return Array.prototype.some.call(n.attributes, a => /NaN|undefined|Infinity/.test(a.value));
        });
        if (bad) problems.push(k + '#' + s + ' has a NaN coordinate');
        const vb = svg.viewBox.baseVal;
        Array.prototype.forEach.call(svg.querySelectorAll('line,path,polygon,circle,rect,text'), function (n) {
          let b; try { b = n.getBBox(); } catch (e) { return; }
          if (b.width + b.height === 0) return;
          if (b.x < -14 || b.y < -14 || b.x + b.width > vb.width + 14 || b.y + b.height > vb.height + 14) {
            problems.push(k + '#' + s + ' <' + n.tagName + '> outside the frame (' + Math.round(b.x) + ',' + Math.round(b.y) + ',w' + Math.round(b.width) + ')' + (n.tagName === 'text' ? ' "' + n.textContent.slice(0, 30) + '"' : ''));
          }
        });
      }
    });
    document.body.removeChild(host);
    return { kinds: kinds().length, renders: count, problems: Array.from(new Set(problems)) };
  }

  /* every figure at every stage, for review (a page for a screenshot) */
  function gallery(hostEl, only) {
    kinds().filter(k => !only || only.split(',').indexOf(k) >= 0 || k.indexOf(only) === 0).forEach(function (k) {
      const row = document.createElement('div');
      row.className = 'ofig-row';
      const h = document.createElement('div');
      h.className = 'ofig-rowh';
      h.textContent = k;
      row.appendChild(h);
      for (let s = 1; s <= stages(k); s += 1) {
        const f = document.createElement('figure');
        f.className = 'ofig';
        f.appendChild(make(k, s));
        const c = document.createElement('figcaption');
        c.className = 'ofig-cap';
        c.textContent = k + ' · stage ' + s;
        f.appendChild(c);
        row.appendChild(f);
      }
      hostEl.appendChild(row);
    });
  }

  return { add: add, make: make, forRung: forRung, kinds: kinds, stages: stages, audit: audit, gallery: gallery,
    Canvas: Canvas, has: k => !!reg[k], RAD: RAD, textOutside: textOutside };
})();

/* the hook flow-library calls for each proof step */
PROJECT.hooks.rungFig = function (rung, concept, i) { return OFIG.forRung(rung, concept, i); };


/* ── project/optics.figs.m1.js ── */
/* Optics step diagrams — Module I (Fermat's principle, surfaces, thin lens, Newton).
   Registers into OFIG (optics.figs.js). Nothing here touches DOM at load. */

(function () {
  const N = (s, k) => (s === k ? ' new' : '');
  const D = Math.PI / 180;
  const deg = r => r / D;

  /* solve n1 sinθ1 = n2 sinθ2 for the crossing abscissa (bisection) — the figure uses the real law */
  function snellX(ax, a, bx, b, n1, n2) {
    let lo = ax, hi = bx;
    const f = x => n1 * (x - ax) / Math.hypot(a, x - ax) - n2 * (bx - x) / Math.hypot(b, bx - x);
    for (let i = 0; i < 60; i += 1) { const m = (lo + hi) / 2; if (f(m) > 0) hi = m; else lo = m; }
    return (lo + hi) / 2;
  }

  /* ── 1.1  reflection ─────────────────────────────────────────────────── */
  OFIG.add('reflect', {
    n: 4, alt: s => ['A mirror, two points and a reflection point P', 'Other possible reflection points make longer paths',
      'The normal at P with equal angles i and r', 'Top view: moving P sideways out of the plane of incidence lengthens the path'][s - 1],
    build(g, s) {
      if (s === 4) {                                   /* top view of the mirror plane */
        g.rect(25, 20, 295, 150, 'fillk');
        g.text(160, 10, 'mirror plane seen from above', 't mute');
        const A = [70, 105], B = [250, 65];
        g.line(A[0], A[1], B[0], B[1], 'k dash');
        g.text(135, 62, 'plane of incidence (edge-on)', 't mute', 'middle', 0, 0);
        const P = [A[0] + (B[0] - A[0]) * 0.55, A[1] + (B[1] - A[1]) * 0.55];
        const Q = [P[0] + 12, P[1] + 38];
        g.dot(A[0], A[1], 'pt'); g.dot(B[0], B[1], 'pt'); g.dot(P[0], P[1], 'pt new', 3.6); g.dot(Q[0], Q[1], 'pt hollow', 3.4);
        g.text(A[0] - 6, A[1] + 12, 'A′', 't sym', 'middle'); g.text(B[0] + 4, B[1] + 12, 'B′', 't sym', 'middle');
        g.text(P[0] - 8, P[1] - 10, 'P', 't sym new', 'middle'); g.text(Q[0] + 14, Q[1], 'P′', 't sym', 'middle');
        g.line(A[0], A[1], Q[0], Q[1], 'r2 dash'); g.line(Q[0], Q[1], B[0], B[1], 'r2 dash');
        g.text(160, 40, 'AP′ + P′B is longer;', 't', 'middle', 0, 0); g.text(160, 28, 'only P, in the plane, is stationary', 't new', 'middle', 0, 0);
        return;
      }
      const my = 30, A = [60, 120], B = [250, 95];
      const Ai = [A[0], 2 * my - A[1]], t = (my - Ai[1]) / (B[1] - Ai[1]), P = [Ai[0] + (B[0] - Ai[0]) * t, my];
      g.line(20, my, 300, my, 'k thick'); g.hatch(24, 296, my, 8);
      if (s === 2) {                                   /* trial reflection points */
        [105, 135, 215, 240].forEach(function (x) {
          g.line(A[0], A[1], x, my, 'k dash'); g.line(x, my, B[0], B[1], 'k dash'); g.dot(x, my, 'pt hollow', 2.6);
        });
        g.text(160, 8, 'other points: every path is longer', 't mute', 'middle', 0, 0);
      }
      g.arrow(A[0], A[1], P[0], P[1], 'r' + (s > 1 ? '' : ' new'), 0.55); g.arrow(P[0], P[1], B[0], B[1], 'r' + (s > 1 ? '' : ' new'), 0.6);
      g.dot(A[0], A[1]); g.dot(B[0], B[1]); g.dot(P[0], P[1], 'pt' + N(s, 1) + N(s, 2), 3.6);
      g.text(A[0] - 10, A[1] + 4, 'A', 't sym'); g.text(B[0] + 10, B[1] + 4, 'B', 't sym'); g.text(P[0], my - 12, 'P', 't sym' + N(s, 1), 'middle', 0, 0);
      if (s === 1) {
        g.dim(A[0] - 14, A[1], A[0] - 14, my, 'a', 0, 'dim new');
        g.dim(B[0] + 14, B[1], B[0] + 14, my, 'b', 0, 'dim new');
        g.dim(A[0], my, P[0], my, 'x', 22, 'dim new'); g.dim(P[0], my, B[0], my, 'd − x', 22, 'dim new');
        g.text(160, 158, 'L(x) = AP + PB', 't big new');
      }
      if (s === 3) {
        g.line(P[0], my, P[0], 148, 'k dash');
        const ia = deg(Math.atan2(A[1] - my, A[0] - P[0])), ib = deg(Math.atan2(B[1] - my, B[0] - P[0]));
        g.angle(P[0], my, 26, 90, ia, 'i', 'ang new'); g.angle(P[0], my, 26, ib, 90, 'r', 'ang new');
        g.text(160, 158, 'dL/dx = sin i − sin r = 0', 't big new');
      }
    }
  });

  /* ── 1.1  Snell's law ─────────────────────────────────────────────────── */
  OFIG.add('snell', {
    n: 4, alt: s => ['Ray from A in medium 1 to B in medium 2 crossing at R', 'The optical path L(x) has a minimum at R',
      'The angles θ₁ and θ₂ from the normal are the sines in the derivative', 'n₁ sin θ₁ = n₂ sin θ₂'][s - 1],
    build(g, s) {
      const yI = 85, A = [55, 150], B = [250, 20], n1 = 1, n2 = 1.5;
      const rx = snellX(A[0], A[1] - yI, B[0], yI - B[1], n1, n2), R = [rx, yI];
      g.rect(15, yI, 305, 165, 'fillw'); g.rect(15, 5, 305, yI, 'fillg');
      g.line(15, yI, 305, yI, 'k thick');
      g.text(28, 155, 'n₁', 't sym big'); g.text(28, 12, 'n₂ > n₁', 't sym big');
      g.arrow(A[0], A[1], R[0], R[1], 'r' + N(s, 1), 0.5); g.arrow(R[0], R[1], B[0], B[1], 'r' + N(s, 1), 0.55);
      g.dot(A[0], A[1]); g.dot(B[0], B[1]); g.dot(R[0], R[1], 'pt new', 3.6);
      g.text(A[0] - 10, A[1] + 3, 'A', 't sym'); g.text(B[0] + 10, B[1], 'B', 't sym'); g.text(R[0] + 8, yI + 12, 'R', 't sym new');
      if (s === 1) {
        g.dim(A[0] - 12, A[1], A[0] - 12, yI, 'a', 0, 'dim new'); g.dim(B[0] + 12, yI, B[0] + 12, B[1], 'b', 0, 'dim new');
        g.dim(A[0], yI, R[0], yI, 'x', -14, 'dim new'); g.dim(R[0], yI, B[0], yI, 'd − x', -14, 'dim new');
        g.text(210, 128, 'L(x) = n₁·AR + n₂·RB', 't big new');
      }
      if (s >= 2) {                                    /* inset plot of L(x) */
        const bx0 = 232, bx1 = 302, by0 = 118, by1 = 152;
        g.rect(bx0 - 8, by0 - 8, bx1 + 8, by1 + 22, 'fillk');
        const L = x => n1 * Math.hypot(A[1] - yI, x - A[0]) + n2 * Math.hypot(yI - B[1], B[0] - x);
        const xs = []; for (let i = 0; i <= 40; i += 1) xs.push(A[0] + (B[0] - A[0]) * i / 40);

/* ── project/optics.sims.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Optics — understanding simulations.

   A diagram shows one moment of an argument. A simulation lets the student move
   the quantities and SEE the law hold — and then proves they can use it. Every
   simulation has three levels, each asking more of the student than the last:

     Watch     the parameter sweeps by itself; a sentence says what to notice.
     Explore   the student drags the sliders; a live readout shows the numbers
               and checks the law (lhs = rhs) at that setting.
     Predict   three tasks of rising difficulty. The student commits to an
               answer BEFORE the simulation shows it:
                 level 1  recall    read a value off the scene
                 level 2  apply     use the law in a fresh setting
                 level 3  transfer  a changed situation the note never showed
               A task is either numeric (type a number) or a setting (drag a
               slider to the value that makes the law true).

   What the student has done is recorded per simulation as a preference
   `sim:<id>` = { w: watched, e: explored, t: { '<n>': 1|0 } }. Only the FIRST
   attempt at a task is kept (later attempts are allowed, never recorded), the
   same rule as first-try recall, because the first attempt is the only honest
   measurement. `OSIM.summary()` rolls this up for the Today card.

   A simulation is defined in optics.sims.m*.js with OSIM.add(id, def):

     def = { title, blurb, w?, h?, sc?, ox?, oy?,
             params: [{ k, label, min, max, step, value, fmt(v) }],
             draw(g, p),               the scene, on an OFIG.Canvas
             read(p)  -> [[label, text], …]      the live numbers
             law(p)   -> { lhs, rhs, text }      the identity, checked live
             watch:   { k, from, to },           the parameter Watch sweeps
             tasks: [ { lv, type:'num'|'set', q, setup?, ans(p)|goal(p), key?,
                        tol, unit?, why(p, a) } ] }

   This file only REGISTERS; `OSIM.audit()` (run in a browser by
   tools/audit_optics.js) draws every simulation at its extremes, checks each
   law at random settings, and evaluates every task's answer.
   ══════════════════════════════════════════════════════════════════════════ */

/* ══════════════════════════════════════════════════════════════════════════
   The project seam: the one place flow-library learns WHICH app it is.

   Everything in flow-library is shared by every study system. What makes an
   app itself — its name, where its progress is stored, what it looks like,
   any extra behaviour — is declared by the project in app/project/project.js
   as a single `PROJECT` object, loaded before this file:

     PROJECT = {
       id, name,                      required — name is shown in the chrome
       storageKey,                    required — localStorage key for progress
       sync: { live, mock,            required — Firebase namespaces; mock and
               users, usersMock,                 live must never share one
               db },                  optional — Firebase RTDB URL override
       themeColor: { light, dark },   optional — browser chrome colour
       realLine: true,                optional — draw the real-line widget
                                        (comp.realline.js) under inequalities
       pyqLabel: 'JAM past papers',   optional — what the level-4 rung is called (default shown)
       figZoom: true,                 optional — click a rendered diagram to open it
                                        full-screen with zoom (comp.zoom.js)
       hooks: {                       optional — each is called if present
         home(ctx)   -> Node|null     a hero placed above the home dashboard
         theme(dark)                  after light/dark is applied
         ready()                      once, after the signed-in app is up
         rungFig(rung, concept, i)    -> Node|null  a diagram above one proof step
         noteSim(concept)             -> Node|null  an interactive panel after a note's figures
       }
     }

   A missing required field is a fatal error rather than a silent default:
   two projects falling back to the same storage key would overwrite each
   other's progress in the same browser.
   ══════════════════════════════════════════════════════════════════════════ */

const Project = (function () {

  if (typeof PROJECT === 'undefined') {
    throw new Error('app/project/project.js did not define PROJECT');
  }

  const REQUIRED = ['id', 'name', 'storageKey', 'sync.live', 'sync.mock', 'sync.users', 'sync.usersMock'];
  const get = (o, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), o);
  const missing = REQUIRED.filter(k => !get(PROJECT, k));
  if (missing.length) {
    throw new Error('PROJECT is missing ' + missing.join(', ') + ' (app/project/project.js)');
  }

  PROJECT.themeColor = Object.assign({ light: '#faf8f4', dark: '#101216' }, PROJECT.themeColor);
  PROJECT.hooks = PROJECT.hooks || {};
  PROJECT.pyqLabel = PROJECT.pyqLabel || 'JAM past papers';
  document.documentElement.setAttribute('data-project', PROJECT.id);

  /* A broken hook must not take the app down with it: the hooks are
     decoration and extras, the study loop underneath is shared and tested. */
  function hook(name) {
    const fn = PROJECT.hooks[name];
    if (typeof fn !== 'function') return null;
    try {
      return fn.apply(PROJECT, Array.prototype.slice.call(arguments, 1));
    } catch (err) {
      console.error('PROJECT.hooks.' + name + ' failed:', err);
      return null;
    }
  }

  return { hook: hook };
})();

   ══════════════════════════════════════════════════════════════════════════ */

const DOM = (function () {

    const secTitle = (c.sec && typeof Pool.sectionTitle === 'function') ? Pool.sectionTitle(c.sec) : null;

/* ── hash router ─────────────────────────────────────────────────────────── */
const Router = (function () {
  let handler = null;
  /* How many route changes this visit has made. `history.back()` is only worth
     offering while there is somewhere of ours to go back TO — otherwise the
     browser walks out of the app entirely, which is not what a back button
     inside a toolbar is understood to mean. */
  let depth = 0;

  function current() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [p, q] = raw.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    new URLSearchParams(q || '').forEach((v, k) => { query[k] = v; });
    return { name: parts[0] || 'home', args: parts.slice(1), query, raw: p };
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', function () {
      depth += 1;
      handler(current());
      listeners.forEach(function (f) { try { f(current()); } catch (e) { /* never break a route */ } });
    });
    handler(current());
  }

  const listeners = [];
  const onRoute = fn => listeners.push(fn);

  /* One step back through OUR history, or home when there is none. */
  function back() {
    if (depth > 0) { depth -= 2; window.history.back(); return true; }
    if (current().name !== 'home') { go('home'); return true; }
    return false;
  }
  const canBack = () => depth > 0 || current().name !== 'home';

  const go = hash => { location.hash = hash.charAt(0) === '#' ? hash : '#/' + hash.replace(/^\//, ''); };
  const href = hash => '#/' + String(hash).replace(/^\//, '');
  const reload = () => handler && handler(current());

  return { current, start, go, href, reload, back, canBack, onRoute };
})();


/* ── flow-library/app/src/core.tex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   MathJax plumbing.

   Two jobs: typeset authored content after a view is mounted, and render the
   learner's own LaTeX fragment safely. "Safely" means a malformed fragment
   never throws into the view, never wipes the last good render, and reports a
   human-readable reason. MathJax's formatError hook (set in index.html) parks
   the message on window.__texError; we read and clear it around each run.
   ══════════════════════════════════════════════════════════════════════════ */

const Tex = (function () {

  let chain = Promise.resolve();

  const available = () => !!(window.MathJax && window.MathJax.typesetPromise);

  /* Serialise every typeset call: MathJax is single-threaded and we need the
     error hook to belong to a known run. */
  function run(job) {
    chain = chain.then(job).catch(err => {
      console.warn('[tex]', err && err.message);
    });
    return chain;
  }

  /* Typeset authored HTML already in the DOM. */
  function typeset(nodes) {
    if (!available()) return Promise.resolve();
    const list = Array.isArray(nodes) ? nodes : [nodes];
    return run(() => window.MathJax.typesetPromise(list));
  }

  /* Render one learner fragment into `target`.
     Resolves {ok, error}. On failure `target` keeps whatever it had. */
  function renderFragment(target, latex, opts) {
    const display = !opts || opts.display !== false;
    const src = String(latex == null ? '' : latex);

    if (!src.trim()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'ph', text: opts && opts.placeholder
        ? opts.placeholder : 'Your rendered mathematics will appear here.' }));
      return Promise.resolve({ ok: true, empty: true });
    }
    if (!available()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'mono small', text: src }));
      return Promise.resolve({ ok: false, error: 'MathJax is not loaded — showing LaTeX source.' });
    }

    return run(function () {
      const stage = document.createElement('div');
      stage.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      stage.textContent = display ? '\\[' + src + '\\]' : '\\(' + src + '\\)';
      document.body.appendChild(stage);
      window.__texError = null;

      return window.MathJax.typesetPromise([stage]).then(function () {
        const err = window.__texError;
        window.__texError = null;

        /* Three ways a fragment can be bad, and all three must be caught:
           a TeX error raised through formatError; an error node rendered in
           place; or no maths at all, which is what an unclosed group does —
           MathJax swallows the closing delimiter and finds nothing to typeset. */
        const errNode = stage.querySelector('mjx-merror, [data-mjx-error]');
        const produced = stage.querySelector('mjx-container');
        const why = err
          || (errNode && (errNode.getAttribute('data-mjx-error') || errNode.textContent))
          || (!produced && 'nothing came out — check for an unmatched { or }, and that every command is complete.');

        if (why) { stage.remove(); return { ok: false, error: String(why) }; }

        /* MathJax's noundefined package prints an unknown macro in red rather
           than failing. That is the right behaviour — the rest of the line
           still renders — but the learner deserves to be told. */
        const unknown = stage.querySelector('[style*="color: red"]');
        const hint = unknown
          ? 'It renders, but the part shown in red is not a command MathJax knows — check that spelling.'
          : null;

        DOM.clear(target);
        while (stage.firstChild) target.appendChild(stage.firstChild);
        stage.remove();
        return { ok: true, hint: hint };
      }, function (e) {
        stage.remove();
        window.__texError = null;
        return { ok: false, error: (e && e.message) || 'LaTeX could not be rendered.' };
      });
    });
  }

  /* Wait once for MathJax, so the first view is not typeset into the void. */
  function ready() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      return window.MathJax.startup.promise.catch(() => {});
    }
    return Promise.resolve();
  }

  return { typeset, renderFragment, ready, available };
})();


/* ── flow-library/app/src/core.md.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Markdown, line by line, with the maths left alone.

   The writing workspace is a live markdown editor whose maths is written
   inline as $…$ and $$…$$. So the one thing this renderer must never do is
   touch what is between the dollars: `\text{a*b*c}` is not italics, and a
   backslash is not an escape character to markdown here.

   The method is therefore: cut the source into maths and prose segments
   first, run the inline rules over prose only, then reassemble. Every block
   is one line — the editor renders each line into its own frame, so there is
   no multi-line block state to carry.

   AUTO-MATH. Dollar signs are bookkeeping, and bookkeeping is what stops a
   sentence being written at speed. So a LaTeX command met in the middle of
   prose no longer has to be fenced: "I love \\frac{1}{2} in fact" typesets the
   fraction and leaves the words alone. `autoMath` finds each run that is
   unambiguously mathematics — it has to CONTAIN a backslash command, a
   superscript or a subscript, never merely look numeric — grows it over the
   operands and operators around it, and stops at the first real word. The run
   is stashed behind a placeholder before the markdown rules run, so `_` inside
   a subscript is never mistaken for italics and `<` is never escaped.

   Explicit `$…$` still works and still wins: segments() takes those out first,
   so anything already fenced is left exactly as written.
   ══════════════════════════════════════════════════════════════════════════ */

const Markdown = (function () {

  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* Split on $$…$$ first, then $…$, so a display block is never mistaken for
     two inline ones. Returns [{math:false,t}|{math:true,t}]. */
  function segments(src) {
    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;
  }

  /* Inline rules, prose only. Code spans are pulled out first so that what is
     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);
      return '\x00C' + (code.length - 1) + '\x00';
    });

    s = esc(s)
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>');

    return s.replace(/\x00C(\d+)\x00/g, (_, i) => '<code>' + esc(code[+i]) + '</code>');
  }

  /* ── auto-math ───────────────────────────────────────────────────────────
     Scan a PROSE segment (everything already fenced in $…$ has been taken out)
     and wrap each mathematical run in \\( … \\).

     What starts a run: a backslash command, or a token carrying ^ or _.
     What continues one: single-letter variables, numbers, operators, balanced
     braces and the spaces between them.
     What ends one: a word of two or more letters that is not a command, a
     sentence-ending punctuation mark, or the end of the line.

     The two-letter rule is the whole safety margin. "in fact" ends the run;
     "x + 1" does not. A lone word like "a" or "I" can be swallowed into a run
     that is already open, which is the right call inside `f(a) = b` and a
     harmless one elsewhere — it renders as italic a, which is what someone

  /* `*` is deliberately absent: it is markdown emphasis far more often than it

  const OPS = '+-/=<>()[]|,;:!\'~^_&.';

  function brace(src, i) {

    for (let j = i; j < src.length; j++) {
