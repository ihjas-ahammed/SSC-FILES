{
 "id": "q.op.2.22",
 "course": "op",
 "sec": "2.6",
 "marks": 4,
 "title": "Reflected and Transmitted Amplitudes in Thin Film",
 "source": "Ghatak 6e Example 15.1",
 "prompt": "<p>A dielectric film of refractive index $n_f = 1.36$ is deposited in air ($n_a = 1.0$) on a glass substrate ($n_g = 1.5$). Assuming normal incidence, calculate the amplitudes of the reflected rays $a_1, a_5$ and the transmitted rays $a_4, a_7$. Explain why interference fringes in transmission exhibit poor contrast compared to reflection.</p>",
 "tests": [
  "c.2.6.1",
  "c.2.6.2",
  "c.2.6.3"
 ],
 "approach": "Compute Fresnel reflection and transmission coefficients at both interfaces, calculate amplitudes of the first two reflected and transmitted rays, and compare their amplitude ratios.",
 "solution": "<p>The normal-incidence reflection and transmission coefficients are:\n<ul>\n<li>Air-film boundary:\n$$r_1 = \\frac{n_a - n_f}{n_a + n_f} = \\frac{1 - 1.36}{1 + 1.36} = -\\frac{0.36}{2.36} \\approx -0.153$$\n$$t_1 = \\frac{2n_a}{n_a + n_f} = \\frac{2}{2.36} \\approx 0.847, \\qquad t_1' = \\frac{2n_f}{n_a + n_f} = \\frac{2.72}{2.36} \\approx 1.153$$</li>\n<li>Film-glass boundary:\n$$r_2 = \\frac{n_f - n_g}{n_f + n_g} = \\frac{1.36 - 1.5}{1.36 + 1.5} = -\\frac{0.14}{2.86} \\approx -0.049$$\n$$t_2 = \\frac{2n_f}{n_f + n_g} = \\frac{2.72}{2.86} \\approx 0.951$$</li>\n</ul></p>\n<p>For an incident ray of amplitude $a$:\n<ul>\n<li><b>Reflected rays:</b>\n<ul>\n<li>Ray 1 (reflected at top surface):\n$$a_1 = r_1 a = -0.153 a$$</li>\n<li>Ray 5 (internally reflected at lower surface, then transmitted into air):\n$$a_5 = t_1 r_2 t_1' a \\approx (0.847)(-0.049)(1.153) a \\approx -0.048 a$$</li>\n</ul>\nThe two reflected components have comparable amplitudes ($|a_1| \\approx 0.15a$, $|a_5| \\approx 0.05a$ to $0.1a$), allowing for significant destructive interference and high fringe contrast.</li>\n<li><b>Transmitted rays:</b>\n<ul>\n<li>Ray 4 (directly transmitted):\n$$a_4 = t_1 t_2 a \\approx (0.847)(0.951) a \\approx 0.806 a$$</li>\n<li>Ray 7 (undergoes two internal reflections before transmitting):\n$$a_7 = t_1 (-r_2)(-r_1) t_2 a \\approx a_4 (r_1 r_2) \\approx (0.806)(-0.153)(-0.049) a \\approx 0.006 a$$</li>\n</ul>\nBecause $|a_7| \\ll |a_4|$ ($0.006a$ versus $0.806a$), the intensity variation $\\sim 4 a_4 a_7$ is negligible compared to the background $a_4^2$, resulting in very poor fringe contrast in transmission.</li>\n</ul></p>",
 "trap": "Assuming transmitted fringes have high visibility; because the first transmitted beam carries nearly all the energy, the second beam is far too weak to create significant contrast."
},

 "id": "q.op.2.23",
 "course": "op",
 "sec": "2.6",
 "marks": 5,
 "title": "Antireflection Coating Thickness and Bandwidth",
 "source": "Ghatak 6e Problem 15.3",
 "prompt": "<p>A non-reflecting coating of refractive index $n = 1.38$ is applied to glass.\n<ol>\n<li>If the thickness is $9 \\times 10^{-6}\\text{ cm}$, calculate the wavelengths in the visible spectrum ($4000\\text{ \\AA} \\le \\lambda \\le 7000\\text{ \\AA}$) for which the film is non-reflecting.</li>\n<li>Repeat the calculation for a film thickness of $45 \\times 10^{-6}\\text{ cm}$.</li>\n<li>Explain why the thinner film is preferred for antireflective coatings.</li>\n</ol></p>",
 "tests": [
  "c.2.6.1",
  "c.2.6.2"
 ],
 "approach": "Apply the destructive condition in reflection $2nd = (m+1/2)\\lambda$ for $n_{\\text{air}} < n_{\\text{film}} < n_{\\text{glass}}$, find $\\lambda_m$, and consider the sensitivity $d\\delta/d\\lambda \\propto d$.",
 "solution": "<p>For $n_{\\text{air}} < n_{\\text{film}} < n_{\\text{glass}}$, reflections at both interfaces undergo a $\\pi$ phase shift. Destructive interference requires:\n$$2 n d = \\left(m + \\frac{1}{2}\\right)\\lambda \\implies \\lambda_m = \\frac{4 n d}{2m + 1} \\quad (m = 0, 1, 2, \\dots)$$</p>\n<p>1. For $d = 9 \\times 10^{-6}\\text{ cm}$:\n$$4 n d = 4(1.38)(9 \\times 10^{-6}\\text{ cm}) = 4.968 \\times 10^{-5}\\text{ cm} = 4968\\text{ \\AA}$$\n<ul>\n<li>For $m = 0$: $\\lambda_0 = 4968\\text{ \\AA}$ (visible, cyan)</li>\n<li>For $m = 1$: $\\lambda_1 = \\frac{4968}{3} = 1656\\text{ \\AA}$ (ultraviolet)</li>\n</ul>\nOnly $\\lambda = 4968\\text{ \\AA}$ lies in the visible range.</p>\n<p>2. For $d = 45 \\times 10^{-6}\\text{ cm}$:\n$$4 n d = 4(1.38)(45 \\times 10^{-6}\\text{ cm}) = 2.484 \\times 10^{-4}\\text{ cm} = 24840\\text{ \\AA}$$\n<ul>\n<li>$m = 1 \\implies \\lambda_1 = \\frac{24840}{3} = 8280\\text{ \\AA}$ (infrared)</li>\n<li>$m = 2 \\implies \\lambda_2 = \\frac{24840}{5} = 4968\\text{ \\AA}$ (visible)</li>\n<li>$m = 3 \\implies \\lambda_3 = \\frac{24840}{7} \\approx 3549\\text{ \\AA}$ (ultraviolet)</li>\n</ul>\nOnly $\\lambda = 4968\\text{ \\AA}$ lies in the visible range.</p>\n<p>3. <b>Comparison:</b><br/>\nThe reflectance varies with phase thickness according to $\\cos\\left(\\frac{4\\pi n d}{\\lambda}\\right)$. The derivative with respect to wavelength is:\n$$\\left|\\frac{d\\delta}{d\\lambda}\\right| \\propto d$$\nA thicker film causes the phase condition to vary much more rapidly with wavelength. Consequently, the reflectance minimum for $d = 45 \\times 10^{-6}\\text{ cm}$ is extremely narrow, leading to high reflectivity across most of the visible spectrum. The thin film ($d = 9 \\times 10^{-6}\\text{ cm}$) maintains low reflectance over a broad wavelength band.</p>",
 "trap": "Thinking both film thicknesses perform equally well because they have the same center wavelength; the thicker film has much narrower bandwidth and reflects most of the visible spectrum."
},

 "title": "Air and Oil Wedge Fringe Spacing",
 "source": "Ghatak 6e Problem 15.1",
 "prompt": "<p>A glass plate of refractive index $1.6$ is in contact with another glass plate of refractive index $1.8$ along a line, forming an air wedge with an angle of $0.5'$. Light of wavelength $5000\\text{ \\AA}$ is incident normally, and the film is viewed from above.\n<ol>\n<li>Calculate the fringe spacing.</li>\n<li>The entire apparatus is then immersed in an oil of refractive index $1.7$. Describe the qualitative change in the fringe pattern and compute the new fringe width.</li>\n</ol></p>",
 "tests": [
  "c.2.7.1"
 ],
 "approach": "Convert the wedge angle to radians, apply $\\beta = \\lambda/(2n\\alpha)$, and inspect the reflection phase changes when the medium between the plates changes from air to oil.",
 "solution": "<p>1. <b>In air ($n_{\\text{film}} = 1.0$):</b><br/>\nThe wedge angle in radians is:\n$$\\alpha = 0.5' = \\frac{0.5}{60} \\times \\frac{\\pi}{180}\\text{ rad} \\approx 1.4544 \\times 10^{-4}\\text{ rad}$$\nThe fringe width for an air wedge is:\n$$\\beta = \\frac{\\lambda}{2 n_{\\text{air}} \\alpha} = \\frac{5000 \\times 10^{-8}\\text{ cm}}{2(1.0)(1.4544 \\times 10^{-4})} \\approx 0.1719\\text{ cm} \\approx 1.72\\text{ mm}$$</p>\n<p>2. <b>In oil ($n_{\\text{oil}} = 1.7$):</b>\n<ul>\n<li><b>Refractive index condition:</b> The refractive indices now satisfy $n_1 < n_{\\text{film}} < n_2$ ($1.6 < 1.7 < 1.8$). Light reflects at both the top (plate 1 to oil) and bottom (oil to plate 2) interfaces from an optically rarer medium toward a denser medium. Both reflections undergo an abrupt phase change of $\\pi$. The relative reflection phase change is therefore:\n$$\\Delta\\phi = \\pi - \\pi = 0$$\nIn an air film, only the bottom reflection undergoes a $\\pi$ phase change, producing a dark fringe at the apex ($x = 0$). In the oil film, zero path difference gives constructive interference, so the contact edge becomes a bright fringe.</li>\n<li><b>New fringe width:</b>\n$$\\beta' = \\frac{\\lambda}{2 n_{\\text{oil}} \\alpha} = \\frac{\\beta}{n_{\\text{oil}}} = \\frac{0.1719\\text{ cm}}{1.7} \\approx 0.1011\\text{ cm} \\approx 1.01\\text{ mm}$$</li>\n</ul></p>",
 "trap": "Forgetting that when $n_1 < n_{\\text{film}} < n_2$, both reflections introduce a $\\pi$ phase shift, which flips the contact edge from dark to bright."
},

 "source": "Ghatak 6e Example 15.2",
 "prompt": "<p>In a Newton’s rings arrangement with $\\lambda = 6.4 \\times 10^{-5}\\text{ cm}$ and a plano-convex lens of radius of curvature $R = 100\\text{ cm}$:\n<ol>\n<li>Find the radii of the first and second dark rings.</li>\n<li>If the lens is raised vertically by $\\Delta h = \\lambda/4 = 1.6 \\times 10^{-5}\\text{ cm}$, describe the change in the pattern at the center and calculate the new radii of the first two dark rings.</li>\n</ol></p>",
 "tests": [

 "approach": "Use $r_m = \\sqrt{m\\lambda R}$ in contact, add $2\\Delta h$ to the round-trip path difference when raised, and find the new radii where the net path difference is a half-integer multiple of $\\lambda$.",
 "solution": "<p>1. <b>Lens in contact:</b><br/>\nThe radius of the $m$-th dark ring is:\n$$r_m = \\sqrt{m \\lambda R}$$\n<ul>\n<li>For $m = 1$:\n$$r_1 = \\sqrt{(1)(6.4 \\times 10^{-5}\\text{ cm})(100\\text{ cm})} = \\sqrt{6.4 \\times 10^{-3}}\\text{ cm} = 0.080\\text{ cm}$$</li>\n<li>For $m = 2$:\n$$r_2 = \\sqrt{(2)(6.4 \\times 10^{-5}\\text{ cm})(100\\text{ cm})} = \\sqrt{1.28 \\times 10^{-2}}\\text{ cm} \\approx 0.113\\text{ cm}$$</li>\n</ul></p>\n<p>2. <b>Lens raised by $\\Delta h = \\lambda/4$:</b><br/>\nThe film thickness at radial distance $r$ becomes:\n$$t(r) = \\Delta h + \\frac{r^2}{2R} = \\frac{\\lambda}{4} + \\frac{r^2}{2R}$$\nThe total optical path difference in reflection is:\n$$\\Delta = 2t + \\frac{\\lambda}{2} = 2\\left(\\frac{\\lambda}{4} + \\frac{r^2}{2R}\\right) + \\frac{\\lambda}{2} = \\lambda + \\frac{r^2}{R}$$\n<ul>\n<li>At the center ($r = 0$), $\\Delta = \\lambda$, which satisfies the condition for a maximum; the center changes from dark to bright.</li>\n<li>Dark rings occur where the path difference is a half-integer multiple of $\\lambda$:\n$$\\lambda + \\frac{r^2}{R} = \\left(m + \\frac{1}{2}\\right)\\lambda \\implies \\frac{r^2}{R} = \\left(m - \\frac{1}{2}\\right)\\lambda$$\n<ul>\n<li>First dark ring ($m = 1$):\n$$r_1' = \\sqrt{\\frac{1}{2}\\lambda R} = \\sqrt{\\frac{1}{2}(6.4 \\times 10^{-3})}\\text{ cm} \\approx 0.0566\\text{ cm}$$</li>\n<li>Second dark ring ($m = 2$):\n$$r_2' = \\sqrt{\\frac{3}{2}\\lambda R} = \\sqrt{1.5(6.4 \\times 10^{-3})}\\text{ cm} \\approx 0.0980\\text{ cm}$$</li>\n</ul></li>\n</ul>\nAs the lens is raised, the rings contract toward the center.</p>",

 "solution": "<p><b>Geometry:</b> Let a plane monochromatic wave of wavelength $\\lambda$ fall normally on a narrow rectangular slit of width $a$ extending from $x = -a/2$ to $x = +a/2$. By the Huygens–Fresnel principle, each strip of width $dx$ acts as a coherent source of secondary wavelets.</p>\n<p><b>Resultant field:</b> In the direction making an angle $\\theta$ with the normal, the path difference between a wavelet from coordinate $x$ and the wavelet from the centre ($x = 0$) is $x\\sin\\theta$, corresponding to a phase difference $kx\\sin\\theta = (2\\pi/\\lambda)x\\sin\\theta$. The resultant electric field amplitude $E(\\theta)$ is obtained by integrating across the aperture:\n$$E(\\theta) = C \\int_{-a/2}^{a/2} e^{i k x \\sin\\theta}\\,dx = C\\left[\\frac{e^{i k x \\sin\\theta}}{i k \\sin\\theta}\\right]_{-a/2}^{a/2} = C a\\,\\frac{e^{i\\beta} - e^{-i\\beta}}{2i\\beta} = E_0\\,\\frac{\\sin\\beta}{\\beta}$$\nwhere $E_0 = Ca$ is the central amplitude at $\\theta = 0$, and\n$$\\beta = \\frac{1}{2} k a \\sin\\theta = \\frac{\\pi a\\sin\\theta}{\\lambda}$$\n<b>Intensity distribution:</b> The intensity $I(\\theta)$ is proportional to $|E(\\theta)|^2$:\n$$I(\\theta) = I_0\\left(\\frac{\\sin\\beta}{\\beta}\\right)^2$$\nwhere $I_0$ is the intensity at the central maximum ($\\beta \\to 0, \\sin\\beta/\\beta \\to 1$).</p>\n<p><b>Minima:</b> Minima occur where $\\sin\\beta = 0$ with $\\beta \\neq 0$:\n$$\\beta = m\\pi \\implies \\frac{\\pi a\\sin\\theta}{\\lambda} = m\\pi \\implies a\\sin\\theta = m\\lambda\\quad (m = \\pm 1, \\pm 2, \\ldots)$$\nThe central maximum spans from $m = -1$ to $m = +1$ with angular width $2\\lambda/a$.</p>",

 "title": "Resolving Power of a Grating",
 "prompt": "<p>Explain the resolving power of a grating. State Rayleigh's criterion for resolution.</p>",
 "approach": "State Rayleigh's criterion and equate the angular position of a principal maximum to the adjacent minimum.",
 "solution": "<p><b>Resolving power:</b> The resolving power of a grating measures its ability to form separate, distinguishable spectral lines for two wavelengths that are very close to each other. It is defined as:\n$$R = \\frac{\\lambda}{\\Delta\\lambda}$$\nwhere $\\Delta\\lambda$ is the smallest wavelength difference between two lines that can just be resolved at wavelength $\\lambda$.</p>\n<p><b>Rayleigh's criterion for resolution:</b> Two spectral lines of equal intensity are said to be just resolved if the central maximum of the diffraction pattern of one wavelength falls exactly on the first minimum of the diffraction pattern of the other wavelength.</p>\n<p><b>Derivation of $R = mN$:</b> Consider a grating with $N$ lines and grating element $d$ illuminated at normal incidence. The $m$-th order principal maximum for wavelength $\\lambda$ occurs at angle $\\theta$ given by:\n$$d\\sin\\theta = m\\lambda$$\nThe total path difference across all $N$ lines of the grating is $Nd\\sin\\theta = Nm\\lambda$. The first adjacent minimum occurs when this path difference increases by $\\lambda$, corresponding to an angle $\\theta'$:\n$$Nd\\sin\\theta' = (Nm + 1)\\lambda \\implies d\\sin\\theta' = \\left(m + \\frac{1}{N}\\right)\\lambda$$\nBy Rayleigh's criterion, the principal maximum of wavelength $\\lambda + \\Delta\\lambda$ in the same order $m$ must occur at this exact angle $\\theta'$:\n$$d\\sin\\theta' = m(\\lambda + \\Delta\\lambda)$$\nEquating the two expressions for $d\\sin\\theta'$:\n$$m(\\lambda + \\Delta\\lambda) = \\left(m + \\frac{1}{N}\\right)\\lambda \\implies m\\,\\Delta\\lambda = \\frac{\\lambda}{N} \\implies \\frac{\\lambda}{\\Delta\\lambda} = mN$$\nThus, the resolving power is $R = mN$, proportional to the spectral order $m$ and the total number of illuminated lines $N$.</p>",
 "trap": "Confusing resolving power $R = mN$ with dispersive power $d\\theta/d\\lambda = m/(d\\cos\\theta)$."
},

 "title": "The Zone Plate vs Convex Lens",
 "prompt": "<p>Explain the zone plate. Compare it with a convex lens.</p>",
 "approach": "Describe how blocking alternate Fresnel zones focuses light by diffraction, and contrast it with refraction in a lens.",
 "solution": "<p><b>The zone plate:</b> A zone plate is a specially prepared optical screen consisting of concentric circular zones with radii proportional to the square roots of natural numbers ($r_n = \\sqrt{n f_1\\lambda}$), constructed by either completely blocking or phase-shifting alternate half-period zones. When a plane monochromatic wave strikes it, wavelets from all the transparent zones arrive at the axial focal point $P$ in phase (differing by an integral multiple of $2\\pi$), constructively interfering to produce an intense focal spot.</p>\n<p>Its primary focal length for radius $r_1$ of the first zone is:\n$$f_1 = \\frac{r_1^2}{\\lambda}$$\nBecause each open zone covers an odd number of zones for closer distances, it exhibits multiple higher-order real foci at $f_p = f_1/p$ ($p = 1, 3, 5, \\ldots$) as well as corresponding virtual foci.</p>\n<p><b>Comparison between zone plate and convex lens:</b>\n<ul>\n<li><b>Mechanism:</b> A zone plate focuses light by <i>diffraction</i> and interference, whereas a convex lens focuses light by <i>refraction</i>.</li>\n<li><b>Number of foci:</b> A zone plate has multiple foci ($f_1, f_1/3, f_1/5, \\ldots$) and virtual foci, whereas a thin lens has a single focal point.</li>\n<li><b>Chromatic aberration:</b> For a zone plate, $f \\propto 1/\\lambda$, so red light has a shorter focal length than violet light. For a convex lens, $f \\propto 1/(n-1)$, so violet light (having higher $n$) has a shorter focal length than red light.</li>\n<li><b>Intensity:</b> A lens transmits nearly all incident light to a single focus, whereas a zone plate concentrates only a fraction of the incident energy into each order.</li>\n</ul></p>",
 "trap": "Assuming a zone plate has the same chromatic aberration as a glass lens; their wavelength dependence is opposite ($f \\propto 1/\\lambda$ vs $f \\propto 1/(n(\\lambda)-1)$)."
},

 "prompt": "<p>Discuss the diffraction pattern produced by a double slit. Distinguish between interference maxima and diffraction envelope.</p>",

 "solution": "<p><b>Double-slit Fraunhofer diffraction:</b> Consider two parallel slits, each of width $a$, separated by centre-to-centre distance $d$. When illuminated normally by a plane monochromatic wave of wavelength $\\lambda$, the resultant intensity distribution in direction $\\theta$ is:\n$$I(\\theta) = 4I_0\\left(\\frac{\\sin\\beta}{\\beta}\\right)^2 \\cos^2\\gamma$$\nwhere $\\beta = \\dfrac{\\pi a\\sin\\theta}{\\lambda}$ and $\\gamma = \\dfrac{\\pi d\\sin\\theta}{\\lambda}$.</p>\n<p>This expression is the product of two distinct physical terms:\n<ul>\n<li><b>Interference factor ($\\cos^2\\gamma$):</b> Represents the interference between light from the two slits, producing closely spaced, sharp fringes with maxima at:\n$$d\\sin\\theta = m\\lambda\\quad (m = 0, \\pm 1, \\pm 2, \\ldots)$$</li>\n<li><b>Diffraction envelope $\\big(\\frac{\\sin\\beta}{\\beta}\\big)^2$:</b> Represents the Fraunhofer diffraction pattern of a single slit of width $a$, with diffraction minima at:\n$$a\\sin\\theta = p\\lambda\\quad (p = \\pm 1, \\pm 2, \\ldots)$$</li>\n</ul></p>\n<p><b>Distinction and missing orders:</b> The rapid $\\cos^2\\gamma$ interference fringes are modulated and bound inside the broader single-slit envelope. When a diffraction minimum coincides with an interference maximum ($d\\sin\\theta = m\\lambda$ and $a\\sin\\theta = p\\lambda$), that interference order has zero intensity and is missing ($m = (d/a)p$). The central diffraction maximum contains $(2d/a - 1)$ interference fringes.</p>",
 "trap": "Treating double-slit fringes as purely an interference effect, ignoring the modulating single-slit diffraction envelope."
},

 "prompt": "<p>Describe the Fresnel diffraction due to a straight edge. Explain the occurrence of maxima and minima.</p>",

 "solution": "<p><b>Experimental arrangement:</b> A straight, sharp opaque edge is placed perpendicular to the path of light from a monochromatic slit source $S$ of wavelength $\\lambda$. A screen is placed at distance $b$ behind the edge to observe the diffraction pattern.</p>\n<p><b>Diffraction pattern features:</b>\n<ol>\n<li><b>Geometrical shadow edge:</b> At the edge of the geometrical shadow ($v = 0$), the intensity does not drop abruptly to zero; instead, it is exactly $I_0/4$, where $I_0$ is the unobstructed intensity.</li>\n<li><b>Illuminated region:</b> Progressing into the illuminated region, the intensity alternates between maxima and minima:\n<ul>\n<li>First maximum at $v \\approx 1.22$ with peak intensity $\\approx 1.37 I_0$.</li>\n<li>First minimum at $v \\approx 1.87$ with intensity $\\approx 0.78 I_0$.</li>\n<li>Higher maxima ($1.20 I_0, 1.16 I_0, \\ldots$) and minima crowd closer together and gradually damp out to the uniform intensity $I_0$.</li>\n</ul></li>\n<li><b>Shadow region:</b> Inside the geometrical shadow ($v < 0$), the intensity decreases monotonically and smoothly to zero without exhibiting any fringes.</li>\n</ol></p>\n<p><b>Occurrence of maxima and minima:</b> By the Cornu spiral formulation, the intensity is proportional to the square of the chord joining $(-\\tfrac{1}{2}, -\\tfrac{1}{2})$ to the point $(C(v), S(v))$. In the illuminated region, the spiral winds into loops, causing the chord length to alternately overshoot and undershoot the asymptotic value, giving rise to interference-like fringes. In the shadow region, $v$ becomes negative and the point travels into the lower loop toward $(-\\tfrac{1}{2}, -\\tfrac{1}{2})$, so the chord length continuously decays to zero.</p>",
 "trap": "Assuming the edge of the geometrical shadow coincides with a bright or dark fringe; its intensity is exactly $I_0/4$."
},

 "prompt": "<p>Explain why the central maximum in a single slit diffraction has twice the width of secondary maxima.</p>",
 "approach": "Find the angular positions of the first and higher minima from $a\\sin\\theta = m\\lambda$.",
 "solution": "<p><b>Intensity in single-slit diffraction:</b> For a slit of width $a$ illuminated by wavelength $\\lambda$, the intensity distribution is:\n$$I(\\theta) = I_0\\left(\\frac{\\sin\\beta}{\\beta}\\right)^2,\\qquad \\beta = \\frac{\\pi a\\sin\\theta}{\\lambda}$$\nMinima occur where $\\sin\\beta = 0$ with $\\beta \\neq 0$:\n$$a\\sin\\theta = m\\lambda\\quad (m = \\pm 1, \\pm 2, \\pm 3, \\ldots)$$\nFor small diffraction angles ($\\sin\\theta \\simeq \\theta$):\n$$\\theta_m = \\frac{m\\lambda}{a}$$\n<b>Angular width of the central maximum:</b> The central maximum is bounded by the first minima on either side of the centre ($m = -1$ and $m = +1$):\n$$\\theta_{-1} = -\\frac{\\lambda}{a},\\qquad \\theta_{+1} = +\\frac{\\lambda}{a}$$\nTherefore, the total angular width of the central maximum is:\n$$2\\theta_1 = \\theta_{+1} - \\theta_{-1} = \\frac{\\lambda}{a} - \\left(-\\frac{\\lambda}{a}\\right) = \\frac{2\\lambda}{a}$$\n<b>Angular width of secondary maxima:</b> Any secondary maximum of order $m$ lies between the $m$-th and $(m+1)$-th minima on the same side of the centre:\n$$\\Delta\\theta_{\\text{sec}} = \\theta_{m+1} - \\theta_m = \\frac{(m+1)\\lambda}{a} - \\frac{m\\lambda}{a} = \\frac{\\lambda}{a}$$\n<b>Conclusion:</b> Since the central maximum spans between the $+1$ and $-1$ order minima across the origin, its angular width $2\\lambda/a$ (and linear width $2\\lambda D/a$ on a screen at distance $D$) is exactly twice the width $\\lambda/a$ of any secondary maximum.</p>",
 "trap": "Confusing half-angular width $\\lambda/a$ with the full angular width $2\\lambda/a$."

 "prompt": "<p>Explain the rectilinear propagation of light using Fresnel's half-period zones.</p>",
 "approach": "Sum the alternating contributions of half-period zones to show that the net amplitude is half of the first zone.",
 "solution": "<p><b>Fresnel's half-period zone construction:</b> Consider a plane wavefront $WW'$ of monochromatic light of wavelength $\\lambda$. Let $P$ be an observation point at distance $b$ along the normal passing through the pole $O$ of the wavefront. The wavefront is divided into concentric annular zones such that the distance from $P$ to the outer boundary of the $n$-th zone is $b + n\\lambda/2$.</p>\n<p>Each zone has equal area $\\pi b\\lambda$. Because wavelets from consecutive zones differ in path by $\\lambda/2$, their phases differ by $\\pi$. Thus, the zone amplitudes $A_1, A_2, A_3, \\ldots$ alternate in sign:\n$$A = A_1 - A_2 + A_3 - A_4 + \\ldots$$\nBecause of the obliquity factor $(1 + \\cos\\theta)$ and slight increase in distance, the amplitudes decrease continuously and smoothly: $A_1 > A_2 > A_3 > \\ldots$</p>\n<p>We can rewrite the series as:\n$$A = \\frac{A_1}{2} + \\left(\\frac{A_1}{2} - A_2 + \\frac{A_3}{2}\\right) + \\left(\\frac{A_3}{2} - A_4 + \\frac{A_5}{2}\\right) + \\ldots$$\nSince each term is very nearly the arithmetic mean of its neighbours, $A_n \\approx (A_{n-1} + A_{n+1})/2$, each bracketed term vanishes, leaving:\n$$A \\simeq \\frac{A_1}{2}$$\n<b>Rectilinear propagation:</b> The resultant amplitude at $P$ produced by the entire unobstructed wavefront is equal to half the amplitude contributed by the first central zone alone. Since the radius of the first zone $r_1 = \\sqrt{b\\lambda}$ is exceedingly small (fractions of a millimetre for visible light), light reaching $P$ is effectively confined to a tiny area immediately around the line joining source, pole, and $P$. Any obstacle larger than this small zone casts a distinct shadow, explaining why light appears to travel in straight lines.</p>",

},

 "title": "Theory of Plane Transmission Grating",
 "prompt": "<p>Describe the theory of plane transmission grating. Obtain the grating equation and show how it is used to measure the wavelength of spectral lines.</p>",
 "approach": "Model the grating as an array of $N$ parallel slits, derive the principal maxima condition $d\\sin\\theta = m\\lambda$, and explain spectrometer measurement.",
 "solution": "<p><b>Theory:</b> A plane transmission diffraction grating consists of an array of $N$ parallel, equally spaced slits, each of transparent width $a$ separated by opaque spaces of width $b$. The grating element is $d = a + b$.</p>\n<p>When illuminated normally by a plane monochromatic wave of wavelength $\\lambda$, each slit produces a diffracted beam with electric field amplitude $E_1 = E_0(\\sin\\beta/\\beta)$, where $\\beta = (\\pi a\\sin\\theta)/\\lambda$. The path difference between corresponding points of adjacent slits is $d\\sin\\theta$, giving a constant phase step between successive slits:\n$$2\\gamma = \\frac{2\\pi}{\\lambda}d\\sin\\theta$$\nThe resultant complex field from $N$ slits is the sum of a geometric series:\n$$E(\\theta) = E_0\\left(\\frac{\\sin\\beta}{\\beta}\\right)\\sum_{k=0}^{N-1} e^{2ik\\gamma} = E_0\\left(\\frac{\\sin\\beta}{\\beta}\\right) e^{i(N-1)\\gamma}\\,\\frac{\\sin N\\gamma}{\\sin\\gamma}$$\nTaking the square of the modulus yields the intensity distribution:\n$$I(\\theta) = I_0\\left(\\frac{\\sin\\beta}{\\beta}\\right)^2 \\left(\\frac{\\sin N\\gamma}{\\sin\\gamma}\\right)^2$$\n<b>Grating equation for principal maxima:</b> Principal maxima occur where all $N$ wavelets arrive in phase, i.e., $\\gamma = m\\pi$:\n$$\\gamma = \\frac{\\pi d\\sin\\theta}{\\lambda} = m\\pi \\implies d\\sin\\theta_m = m\\lambda\\quad (m = 0, \\pm 1, \\pm 2, \\ldots)$$\nAt these angles, $\\lim_{\\gamma\\to m\\pi}(\\sin N\\gamma/\\sin\\gamma) = N$, so $I = N^2 I_0(\\sin\\beta/\\beta)^2$. For oblique incidence at angle $i$, the equation generalizes to $d(\\sin\\theta \\pm \\sin i) = m\\lambda$.</p>\n<p><b>Measuring wavelength of spectral lines:</b>\n<ol>\n<li>A spectrometer is set up with its collimator and telescope focused for parallel rays. The grating is mounted on the prism table and adjusted for normal incidence using the reflection method.</li>\n<li>The telescope is aligned with the undeviated central beam ($m = 0, \\theta = 0$) where all wavelengths coincide.</li>\n<li>The telescope is rotated to one side to view a spectral line in order $m$ ($m = 1$ or $2$) and its angular position $\\theta_{\\text{left}}$ is recorded. It is then turned to the other side to record $\\theta_{\\text{right}}$ for the same order.</li>\n<li>The angle of diffraction is $\\theta = |\\theta_{\\text{left}} - \\theta_{\\text{right}}|/2$.</li>\n<li>With grating element $d = 1/N'$ (where $N'$ is lines per unit length), the wavelength is calculated as:\n$$\\lambda = \\frac{d\\sin\\theta}{m}$$</li>\n</ol></p>",
 "trap": "Using $m_{\\max} > d/\\lambda$; the maximum observable order is strictly limited by $\\sin\\theta \\le 1$."

 "solution": "<p><b>Double refraction (birefringence):</b> When an unpolarized beam of light enters an anisotropic crystal (such as calcite or quartz), it splits into two refracted rays polarized in mutually perpendicular planes:\n<ul>\n<li><b>Ordinary (o) ray:</b> Obeys Snell's law of refraction; travels with the same velocity $v_o = c/n_o$ in all directions; electric vibrations are perpendicular to the principal section.</li>\n<li><b>Extraordinary (e) ray:</b> Does not in general obey Snell's law; its velocity $v_e$ depends on direction; electric vibrations lie in the principal section.</li>\n</ul></p>\n<p><b>Huygens' theory of double refraction:</b> Huygens extended his wavelet principle to explain double refraction in uniaxial crystals by postulating that every point on a wavefront inside the crystal acts as the source of two secondary wave surfaces:\n<ol>\n<li>A <b>spherical wave surface</b> of radius $v_o t$, corresponding to the ordinary ray which travels at speed $v_o$ in all directions.</li>\n<li>An <b>ellipsoid of revolution</b> with semi-axes $v_e t$ (perpendicular to the optic axis) and $v_o t$ (along the optic axis), corresponding to the extraordinary ray whose speed varies with direction.</li>\n</ol>\nThe sphere and the ellipsoid touch each other at two points along the direction of the optic axis, because along the optic axis both rays have the same speed $v_o$.</p>\n<p><b>Positive and negative crystals:</b>\n<ul>\n<li><b>Negative crystal (e.g., calcite):</b> $v_e > v_o$ ($n_e < n_o$), so the ellipsoid encloses the sphere.</li>\n<li><b>Positive crystal (e.g., quartz):</b> $v_e < v_o$ ($n_e > n_o$), so the sphere encloses the ellipsoid.</li>\n</ul>\nThe envelope (common tangent plane) to these wavelets gives the new o- and e-wavefronts, and lines from the source point to the points of tangency give the o- and e-rays.</p>",

 "solution": "<p><b>Construction:</b> A Nicol prism is made from a calcite crystal rhomb whose length is about three times its breadth. The end faces are ground down to modify the corner angles from $71^\\circ$ and $109^\\circ$ to $68^\\circ$ and $112^\\circ$. The crystal is cut into two halves along a plane perpendicular to both the principal section and the ground end faces, polished, and cemented back together with an optical layer of Canada balsam ($n_b = 1.55$). The side faces are blackened.</p>\n<p><b>Working:</b> The refractive indices for sodium light are:\n$$n_o = 1.658,\\qquad n_b = 1.55,\\qquad n_e = 1.486$$\nWhen an unpolarized ray enters the prism parallel to its long axis, it splits into an o-ray and an e-ray:\n<ul>\n<li>For the <b>o-ray</b>, Canada balsam is optically rarer ($n_o = 1.658 > n_b = 1.55$). The critical angle at the calcite-balsam interface is $\\theta_c = \\sin^{-1}(1.55/1.658) \\approx 69^\\circ$. The prism geometry ensures the o-ray strikes the balsam layer at an angle $> 69^\\circ$, undergoing total internal reflection and being absorbed by the blackened side face.</li>\n<li>For the <b>e-ray</b>, Canada balsam is optically denser ($n_e = 1.486 < n_b = 1.55$). Total reflection cannot occur; the e-ray is transmitted through the balsam and emerges as completely linearly polarized light with vibrations in the principal section.</li>\n</ul></p>\n<p><b>Used as a polarizer and analyzer:</b>\n<ul>\n<li><b>As a polarizer:</b> When unpolarized light passes through a Nicol prism, it emerges linearly polarized.</li>\n<li><b>As an analyzer:</b> When a second Nicol prism is placed in the path of the polarized beam, rotating it varies the transmitted intensity according to Malus's law $I = I_0\\cos^2\\theta$. When the prisms have parallel principal sections ($\\theta = 0^\\circ$), intensity is maximum; when their principal sections are crossed ($\\theta = 90^\\circ$), total extinction occurs.</li>\n</ul></p>",

 "solution": "<p><b>Optical activity:</b> Optical activity (rotatory polarization) is the property of certain substances (such as quartz crystals, sugar solutions, and turpentine) to rotate the plane of vibration of linearly polarized light passing through them.</p>\n<p><b>Fresnel's theory of optical rotation:</b> Fresnel explained optical activity based on the following postulates:\n<ol>\n<li>Linearly polarized light can be mathematically resolved into two coherent, opposite circularly polarized components rotating with identical angular frequency: a right-handed circularly polarized (RHCP) component and a left-handed circularly polarized (LHCP) component of equal amplitude $a/2$.</li>\n<li>In an optically active medium, the speeds of propagation for RHCP and LHCP light are different ($v_R \\neq v_L$), corresponding to different refractive indices $n_R \\neq n_L$.</li>\n</ol>\n<b>Mathematical expression:</b> Let the incident linearly polarized light travel along the $z$-axis with its vibration along the $x$-axis. After traversing a thickness $l$ of the medium, the optical paths of the two circular components are $n_R l$ and $n_L l$. The resulting phase difference $\\delta$ between the two circular components upon emergence is:\n$$\\delta = \\frac{2\\pi}{\\lambda}(n_L - n_R)l$$\nRecombining the two circular components with this phase difference produces a resultant linear vibration whose plane has rotated through an angle $\\theta$:\n$$\\theta = \\frac{\\delta}{2} = \\frac{\\pi l}{\\lambda}(n_L - n_R)$$\nIf $n_L > n_R$ ($v_R > v_L$), $\\theta$ is positive and the rotation is clockwise (dextrorotatory); if $n_R > n_L$ ($v_L > v_R$), the rotation is anticlockwise (laevorotatory).</p>",

/* ── project/effects.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Optics — behaviour only this app has.

   Loaded before flow-library, so it only REGISTERS hooks on PROJECT; nothing
   here may touch DOM, UI or Pool until a hook is called at run time.

   home  a live prism: a white ray enters an equilateral prism (apex A = 60°)
         and leaves dispersed into seven colours. The incidence angle sweeps
         slowly through the angle of minimum deviation, so the fan visibly
         narrows and widens — it is the real geometry, not a picture:

             r1 = asin(sin i / n),  r2 = A − r1,  e = asin(n sin r2),
             D  = i + e − A,        n(λ) = 1.50 + 0.020 / λ²  (λ in µm)

         Your progress sits under it as three rays: read, proofs, sections.
         It idles when off-screen or hidden and is still under
         prefers-reduced-motion.
   ══════════════════════════════════════════════════════════════════════════ */

PROJECT.hooks.home = function (ctx) {
  const el = DOM.el;
  const NS = 'http://www.w3.org/2000/svg';
  const W = 600, H = 190;
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    Object.keys(attrs || {}).forEach(k => n.setAttribute(k, attrs[k]));
    return n;
  };
  const A = 60 * Math.PI / 180, RAD = Math.PI / 180;
  const BANDS = [
    { l: 0.405, c: 'var(--sp-1)' }, { l: 0.45, c: 'var(--sp-2)' }, { l: 0.49, c: 'var(--sp-3)' },
    { l: 0.55, c: 'var(--sp-4)' }, { l: 0.59, c: 'var(--sp-5)' }, { l: 0.65, c: 'var(--sp-6)' },
    { l: 0.70, c: 'var(--sp-6)' }
  ];
  const nOf = l => 1.50 + 0.020 / (l * l);

  /* Everything is worked out in the prism's own frame (apex up, entry point
     P1), then rotated about P1 so the incoming beam is always horizontal —
     which is what physically turning the prism looks like. */
  const S = 78, HT = S * Math.sqrt(3) / 2;
  const P1 = [170, 62];                                     /* fixed entry point on the left face */
  const apex0 = [P1[0] + S / 4, P1[1] - HT / 2], bl0 = [P1[0] - S / 4, P1[1] + HT / 2],
        br0 = [P1[0] + 3 * S / 4, P1[1] + HT / 2];         /* P1 is the midpoint of apex–bl */

  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img',
    'aria-label': 'A white ray entering a glass prism and splitting into the colours of the spectrum' });
  const prism = svgEl('polygon', { class: 'prism' });
  const beam = svgEl('line', { class: 'beam-in' });
  const inner = svgEl('line', { class: 'inner' });
  svg.appendChild(prism);
  svg.appendChild(inner);
  svg.appendChild(beam);
  const rays = BANDS.map(b => {
    const r = svgEl('line', { class: 'ray', stroke: b.c });
    svg.appendChild(r);
    return r;
  });

  /* screen coordinates (y down): rotate p about P1 by `th` radians, counter-clockwise on screen */
  const rot = (p, th) => {
    const dx = p[0] - P1[0], dy = -(p[1] - P1[1]);
    return [P1[0] + dx * Math.cos(th) - dy * Math.sin(th), P1[1] - (dx * Math.sin(th) + dy * Math.cos(th))];
  };
  const set = (node, a, b) => {
    node.setAttribute('x1', a[0].toFixed(1)); node.setAttribute('y1', a[1].toFixed(1));
    node.setAttribute('x2', b[0].toFixed(1)); node.setAttribute('y2', b[1].toFixed(1));
  };

  /* Prism frame: left face inward normal at −30°, right face outward normal at +30°. */
  function frame(t) {
    const i = (50 + 8 * Math.sin(t * 0.00055)) * RAD;      /* incidence on face 1 */
    const th = 30 * RAD - i;                                 /* rotation that makes the beam horizontal */
    const nMid = nOf(0.55);
    const dIn = -30 * RAD + Math.asin(Math.sin(i) / nMid);   /* mean internal direction */
    /* solve P1 + s·(cos dIn, −sin dIn) = apex0 + u·(br0 − apex0) */
    const dx = Math.cos(dIn), dy = -Math.sin(dIn);
    const fx = br0[0] - apex0[0], fy = br0[1] - apex0[1];
    const det = dx * (-fy) - dy * (-fx);
    const s = ((apex0[0] - P1[0]) * (-fy) - (apex0[1] - P1[1]) * (-fx)) / det;
    const P2 = [P1[0] + s * dx, P1[1] + s * dy];

    prism.setAttribute('points', [apex0, bl0, br0].map(p => rot(p, th).map(v => v.toFixed(1)).join(',')).join(' '));
    set(beam, [0, P1[1]], P1);
    const P2r = rot(P2, th);
    set(inner, P1, P2r);

    BANDS.forEach(function (b, k) {
      const n = nOf(b.l);
      const r1 = Math.asin(Math.sin(i) / n);
      const sinE = n * Math.sin(A - r1);
      const ray = rays[k];
      if (sinE > 1) { ray.setAttribute('opacity', 0); return; }     /* total internal reflection */
      ray.setAttribute('opacity', 0.92);
      const dOut = 30 * RAD - Math.asin(sinE) + th;                   /* in the rotated (screen) frame */
      set(ray, P2r, [P2r[0] + 330 * Math.cos(dOut), P2r[1] - 330 * Math.sin(dOut)]);
    });
  }

  const still = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  frame(1400);
  if (!still) {
    const start = performance.now();
    const tick = function (now) {
      if (!svg.isConnected && now - start > 1000) return;    /* the view was replaced */
      if (!document.hidden) frame(now - start + 1400);
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  const o = (ctx && ctx.overall) || { total: 0, l1: 0, l2: 0, l3: 0 };
  const band = (label, n, color) => el('div', {}, [
    el('b', { text: o.total ? DOM.pct(n, o.total) + '%' : '—' }),
    el('span', { text: label }),
    el('i', { style: { background: color, width: (o.total ? DOM.pct(n, o.total) : 0) + '%' } })
  ]);

  return el('section', { class: 'hero op-hero', 'aria-label': 'Optics' }, [
    el('div', { class: 'op-head' }, [
      el('div', { class: 'kicker', text: 'white light, split' }),
      el('span', { class: 'op-units', text: 'prism · A = 60°' })
    ]),
    svg,
    el('div', { class: 'op-exp' }, [
      band('read', o.l1, 'var(--sp-6)'),
      band('proofs', o.l2, 'var(--sp-5)'),
      band('sections', o.l3, 'var(--sp-4)')
    ])
  ]);
};


/* ── flow-library/app/src/core.project.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The project seam: the one place flow-library learns WHICH app it is.

   Everything in flow-library is shared by every study system. What makes an
   app itself — its name, where its progress is stored, what it looks like,
   any extra behaviour — is declared by the project in app/project/project.js
   as a single `PROJECT` object, loaded before this file:

     PROJECT = {
       id, name,                      required — name is shown in the chrome
       storageKey,                    required — localStorage key for progress
       sync: { live, mock,            required — Firebase namespaces; mock and
               users, usersMock,                 live must never share one
               db },                  optional — Firebase RTDB URL override
       themeColor: { light, dark },   optional — browser chrome colour
       realLine: true,                optional — draw the real-line widget
                                        (comp.realline.js) under inequalities
       pyqLabel: 'JAM past papers',   optional — what the level-4 rung is called (default shown)
       figZoom: true,                 optional — click a rendered diagram to open it
                                        full-screen with zoom (comp.zoom.js)
       hooks: {                       optional — each is called if present
         home(ctx)   -> Node|null     a hero placed above the home dashboard
         theme(dark)                  after light/dark is applied
         ready()                      once, after the signed-in app is up
       }
     }

   A missing required field is a fatal error rather than a silent default:
   two projects falling back to the same storage key would overwrite each
   other's progress in the same browser.
   ══════════════════════════════════════════════════════════════════════════ */

const Project = (function () {

  if (typeof PROJECT === 'undefined') {
    throw new Error('app/project/project.js did not define PROJECT');
  }

  const REQUIRED = ['id', 'name', 'storageKey', 'sync.live', 'sync.mock', 'sync.users', 'sync.usersMock'];
  const get = (o, path) => path.split('.').reduce((v, k) => (v == null ? v : v[k]), o);
  const missing = REQUIRED.filter(k => !get(PROJECT, k));
  if (missing.length) {
    throw new Error('PROJECT is missing ' + missing.join(', ') + ' (app/project/project.js)');
  }

  PROJECT.themeColor = Object.assign({ light: '#faf8f4', dark: '#101216' }, PROJECT.themeColor);
  PROJECT.hooks = PROJECT.hooks || {};
  PROJECT.pyqLabel = PROJECT.pyqLabel || 'JAM past papers';
  document.documentElement.setAttribute('data-project', PROJECT.id);

  /* A broken hook must not take the app down with it: the hooks are
     decoration and extras, the study loop underneath is shared and tested. */
  function hook(name) {
    const fn = PROJECT.hooks[name];
    if (typeof fn !== 'function') return null;
    try {
      return fn.apply(PROJECT, Array.prototype.slice.call(arguments, 1));
    } catch (err) {
      console.error('PROJECT.hooks.' + name + ' failed:', err);
      return null;
    }
  }

  return { hook: hook };
})();

/* ══════════════════════════════════════════════════════════════════════════
   DOM + routing primitives. No framework: every view returns a real element.
   ══════════════════════════════════════════════════════════════════════════ */

const DOM = (function () {

  const HTML_TAG_NAMES = 'p|b|i|u|strong|em|code|ul|ol|li|br|hr|table|tr|td|th|tbody|thead|h[1-6]|blockquote|pre|small|sub|sup|div|span|a|button|nav|svg|path|circle';
  const VALID_HTML_TAG_RE = new RegExp('</?(?:' + HTML_TAG_NAMES + ')(?=[\\s/>])[^>]*>', 'gi');

  /* Protect mathematical inequalities (e.g. $x<y$, $u-\\varepsilon<s_\\varepsilon$, 1/n < x)
     so the browser HTML parser does not mistake "<" for an opening HTML tag. */
  function sanitizeMathHtml(s) {
    if (typeof s !== 'string' || s.indexOf('<') === -1) return s;
    const tags = [];
    const masked = s.replace(VALID_HTML_TAG_RE, function (match) {
      tags.push(match);
      return '\x00TAG' + (tags.length - 1) + '\x00';
    });
    const safe = masked.replace(/</g, '&lt;');
    return safe.replace(/\x00TAG(\d+)\x00/g, function (_, idx) {
      return tags[parseInt(idx, 10)];
    });
  }

  /* Turn concept IDs like <code>c.2.3.1</code>, $c.3.4.2$, or raw c.2.3.1 references into
     clickable links labeled with their section number and concept name. */
  /* Concept references in authored prose become clickable §-chips. A reference
     INSIDE a maths span must not: an <a> in the middle of `$$ … $$` splits the
     formula and MathJax shows it as raw source. There the id is written into
     the formula as \text{§4.1 Title}, and the chip goes right after the span so
     the reference stays one tap away. */
  const ID = 'c\\.[0-9]+[a-z0-9.]*|s\\.[a-z0-9-]+';
  const TEXT_REF = new RegExp('<code>(' + ID + ')</code>|(?<=[\\s(])(c\\.[0-9]+\\.[0-9]+[a-z0-9.]*)(?=[\\s.,;:)])', 'g');
  const MATH_REF = new RegExp('<code>(' + ID + ')</code>|(?<=[\\s({])(c\\.[0-9]+\\.[0-9]+[a-z0-9.]*)(?=[\\s.,;:)}]|$)', 'g');
  const MATH_SPAN = /\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$]+?\$/g;
  const LONE_ID = new RegExp('^\\$(' + ID + ')\\$$');

  function refOf(id) {
    const c = (typeof Pool !== 'undefined' && Pool.concept) ? Pool.concept(id) : null;
    if (!c) return null;
    const cleanTitle = (c.title || id).split(';')[0].trim();
    const secTitle = (c.sec && typeof Pool.sectionTitle === 'function') ? Pool.sectionTitle(c.sec) : null;
    return {
      id: id,
      label: c.sec ? ('§' + c.sec + ' ' + cleanTitle) : cleanTitle,
      desc: (secTitle ? ('Section ' + c.sec + ': ' + secTitle + ' — ') : '') + (c.title || id)
    };
  }
  const chip = r => '<a class="concept-ref" href="#/note/' + r.id + '" title="'
    + r.desc.replace(/"/g, '&quot;') + '">' + r.label + '</a>';
  const texText = t => t.replace(/[\\{}$&#%_^~]/g, ch => '\\' + ({ '\\': 'backslash ', '~': 'textasciitilde ', '^': 'textasciicircum ' }[ch] || ch));

  function linkifyText(s) {
    return s.replace(TEXT_REF, function (match, g1, g2) {
      const r = refOf(g1 || g2);
      return r ? chip(r) : match;
    });
  }

  function linkifyMath(span) {
    const lone = LONE_ID.exec(span);
    if (lone) { const r = refOf(lone[1]); return r ? chip(r) : span; }
    const found = [];
    const tex = span.replace(MATH_REF, function (match, g1, g2) {
      const r = refOf(g1 || g2);

      if (!found.some(f => f.id === r.id)) found.push(r);

  }

  function linkifyConcepts(s) {
    if (typeof s !== 'string') return s;
    if (s.indexOf('c.') === -1 && s.indexOf('s.') === -1) return s;

      out += linkifyText(s.slice(last, m.index)) + linkifyMath(m[0]);
      last = m.index + m[0].length;

      .replace(/\*\*([^*]+?)\*\*/g, '<b>$1</b>')

/* ── hash router ─────────────────────────────────────────────────────────── */
const Router = (function () {
  let handler = null;
  /* How many route changes this visit has made. `history.back()` is only worth
     offering while there is somewhere of ours to go back TO — otherwise the
     browser walks out of the app entirely, which is not what a back button
     inside a toolbar is understood to mean. */
  let depth = 0;

  function current() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [p, q] = raw.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    new URLSearchParams(q || '').forEach((v, k) => { query[k] = v; });
    return { name: parts[0] || 'home', args: parts.slice(1), query, raw: p };
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', function () {
      depth += 1;
      handler(current());
      listeners.forEach(function (f) { try { f(current()); } catch (e) { /* never break a route */ } });
    });
    handler(current());
  }

  const listeners = [];
  const onRoute = fn => listeners.push(fn);

  /* One step back through OUR history, or home when there is none. */
  function back() {
    if (depth > 0) { depth -= 2; window.history.back(); return true; }
    if (current().name !== 'home') { go('home'); return true; }
    return false;
  }

/* ══════════════════════════════════════════════════════════════════════════
   MathJax plumbing.

   Two jobs: typeset authored content after a view is mounted, and render the
   learner's own LaTeX fragment safely. "Safely" means a malformed fragment
   never throws into the view, never wipes the last good render, and reports a
   human-readable reason. MathJax's formatError hook (set in index.html) parks
   the message on window.__texError; we read and clear it around each run.
   ══════════════════════════════════════════════════════════════════════════ */

const Tex = (function () {

  let chain = Promise.resolve();

  const available = () => !!(window.MathJax && window.MathJax.typesetPromise);

  /* Serialise every typeset call: MathJax is single-threaded and we need the
     error hook to belong to a known run. */
  function run(job) {
    chain = chain.then(job).catch(err => {
      console.warn('[tex]', err && err.message);
    });
    return chain;
  }

  /* Typeset authored HTML already in the DOM. */
  function typeset(nodes) {
    if (!available()) return Promise.resolve();
    const list = Array.isArray(nodes) ? nodes : [nodes];
    return run(() => window.MathJax.typesetPromise(list));
  }

  /* Render one learner fragment into `target`.
     Resolves {ok, error}. On failure `target` keeps whatever it had. */
  function renderFragment(target, latex, opts) {
    const display = !opts || opts.display !== false;
    const src = String(latex == null ? '' : latex);

    if (!src.trim()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'ph', text: opts && opts.placeholder
        ? opts.placeholder : 'Your rendered mathematics will appear here.' }));
      return Promise.resolve({ ok: true, empty: true });
    }
    if (!available()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'mono small', text: src }));
      return Promise.resolve({ ok: false, error: 'MathJax is not loaded — showing LaTeX source.' });
    }

    return run(function () {
      const stage = document.createElement('div');
      stage.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      stage.textContent = display ? '\\[' + src + '\\]' : '\\(' + src + '\\)';
      document.body.appendChild(stage);
      window.__texError = null;

      return window.MathJax.typesetPromise([stage]).then(function () {
        const err = window.__texError;
        window.__texError = null;

        /* Three ways a fragment can be bad, and all three must be caught:
           a TeX error raised through formatError; an error node rendered in
           place; or no maths at all, which is what an unclosed group does —
           MathJax swallows the closing delimiter and finds nothing to typeset. */
        const errNode = stage.querySelector('mjx-merror, [data-mjx-error]');
        const produced = stage.querySelector('mjx-container');
        const why = err
          || (errNode && (errNode.getAttribute('data-mjx-error') || errNode.textContent))
          || (!produced && 'nothing came out — check for an unmatched { or }, and that every command is complete.');

        if (why) { stage.remove(); return { ok: false, error: String(why) }; }

        /* MathJax's noundefined package prints an unknown macro in red rather
           than failing. That is the right behaviour — the rest of the line
           still renders — but the learner deserves to be told. */
        const unknown = stage.querySelector('[style*="color: red"]');
        const hint = unknown
          ? 'It renders, but the part shown in red is not a command MathJax knows — check that spelling.'
          : null;

        DOM.clear(target);
        while (stage.firstChild) target.appendChild(stage.firstChild);
        stage.remove();
        return { ok: true, hint: hint };
      }, function (e) {
        stage.remove();
        window.__texError = null;
        return { ok: false, error: (e && e.message) || 'LaTeX could not be rendered.' };
      });
    });
  }

  /* Wait once for MathJax, so the first view is not typeset into the void. */
  function ready() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      return window.MathJax.startup.promise.catch(() => {});
    }
    return Promise.resolve();
  }

  return { typeset, renderFragment, ready, available };
})();

/* ══════════════════════════════════════════════════════════════════════════
   Markdown, line by line, with the maths left alone.

   The writing workspace is a live markdown editor whose maths is written
   inline as $…$ and $$…$$. So the one thing this renderer must never do is
   touch what is between the dollars: `\text{a*b*c}` is not italics, and a
   backslash is not an escape character to markdown here.

   The method is therefore: cut the source into maths and prose segments
   first, run the inline rules over prose only, then reassemble. Every block
   is one line — the editor renders each line into its own frame, so there is
   no multi-line block state to carry.

   AUTO-MATH. Dollar signs are bookkeeping, and bookkeeping is what stops a
   sentence being written at speed. So a LaTeX command met in the middle of
   prose no longer has to be fenced: "I love \\frac{1}{2} in fact" typesets the
   fraction and leaves the words alone. `autoMath` finds each run that is
   unambiguously mathematics — it has to CONTAIN a backslash command, a
   superscript or a subscript, never merely look numeric — grows it over the
   operands and operators around it, and stops at the first real word. The run
   is stashed behind a placeholder before the markdown rules run, so `_` inside
   a subscript is never mistaken for italics and `<` is never escaped.

   Explicit `$…$` still works and still wins: segments() takes those out first,
   so anything already fenced is left exactly as written.
   ══════════════════════════════════════════════════════════════════════════ */

const Markdown = (function () {

  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* Split on $$…$$ first, then $…$, so a display block is never mistaken for
     two inline ones. Returns [{math:false,t}|{math:true,t}]. */
  function segments(src) {
    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;
  }

  /* Inline rules, prose only. Code spans are pulled out first so that what is
     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);
      return '\x00C' + (code.length - 1) + '\x00';
    });

      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>');

     Scan a PROSE segment (everything already fenced in $…$ has been taken out)
     and wrap each mathematical run in \\( … \\).

     What starts a run: a backslash command, or a token carrying ^ or _.
     What continues one: single-letter variables, numbers, operators, balanced
     braces and the spaces between them.
     What ends one: a word of two or more letters that is not a command, a
     sentence-ending punctuation mark, or the end of the line.

     The two-letter rule is the whole safety margin. "in fact" ends the run;
     "x + 1" does not. A lone word like "a" or "I" can be swallowed into a run
     that is already open, which is the right call inside `f(a) = b` and a
     harmless one elsewhere — it renders as italic a, which is what someone
     writing mathematics meant anyway. */

  const OPS = '+-/=<>()[]|,;:!\'~^_&.';

  const isSpace = ch => ch === ' ' || ch === '\t';

  /* one math token at i: returns the index after it, or -1 */

      const m = /^\\([a-zA-Z]+|[{}$%&#_|,;: ])/.exec(src.slice(i));
      return m ? i + m[0].length : -1;
    }
    if (ch === '{') return brace(src, i);
    if (ch === '^' || ch === '_') {
      const after = i + 1;
      const b = brace(src, after);
      if (b > 0) return b;
      if (after < src.length && isAlnum(src[after])) return after + 1;
      return -1;

     `x_n` and `x^{2}` are scripts. `snake_case` is not: its base letter is part
     of a word. `_italic_` is not: it has no base at all. That one test is what
     lets markdown emphasis and auto-math share a line. */

     far more often than multiplication, and LaTeX writes a product as \cdot
     or \times anyway. */
  const BACK_OPS = '+-/=<>|&([{~^_';

  /* The math token that ENDS at k, as a start index, or -1. Used to grow a run
     leftwards so that `f(x) = \sqrt{x}` is one expression rather than three
     words and a fraction. */
  function tokenBack(s, k, floor) {

      while (j - 1 > floor && /[0-9.]/.test(s[j - 2]) && /[0-9]/.test(s[j - 1])) j -= 1;

      return j;
    }
    if (/[A-Za-z]/.test(ch)) {
      if (/[A-Za-z]/.test(s[k - 2] || '')) return -1;   /* part of a word */
      return k - 1;
    }
    if (BACK_OPS.indexOf(ch) >= 0) return k - 1;

     Runs are collected as ranges first and merged, so two anchors in the same
     expression (`\lim_{n\to\infty} x_n`) produce ONE fence rather than two
     that overlap. */
  function autoMath(src) {
    const s = String(src);
    if (!STRONG.test(s)) return { text: s, stash: [] };

    /* regions that are verbatim and must never be fenced */
    const skip = [];

      i = end - 1;

    const floorFor = i => {
      let f = -1;
      skip.forEach(function (r) { if (r[1] <= i && r[1] - 1 > f) f = r[1] - 1; });
      return f;

    const runs = [];
    for (let i = 0; i < s.length; i++) {
      if (inSkip(i)) continue;
      const isCmd = s[i] === '\\' && /[a-zA-Z]/.test(s[i + 1] || '');
      const isScr = (s[i] === '^' || s[i] === '_') && isScript(s, i);
      if (!isCmd && !isScr) continue;
      if (runs.length && i < runs[runs.length - 1][1]) continue;   /* already inside one */

      const floor = Math.max(floorFor(i), runs.length ? runs[runs.length - 1][1] - 1 : -1);
      const a = extendLeft(s, i, floor);
      const b = extendRight(s, isCmd ? (token(s, i) < 0 ? i + 1 : token(s, i)) : i + 1);

      i = b - 1;

    if (!runs.length) return { text: s, stash: [] };

    const stash = [];
    let out = '', at = 0;
    runs.forEach(function (r) {
      out += s.slice(at, r[0]);
      let run = s.slice(r[0], r[1]);
      const trail = TRAIL.exec(run);
      let tail = '';
      if (trail && trail.index > 0) { tail = trail[0]; run = run.slice(0, trail.index); }
      if (!run.trim()) { out += s.slice(r[0], r[1]); at = r[1]; return; }

      out += '\x00M' + (stash.length - 1) + '\x00' + tail;
      at = r[1];

    out += s.slice(at);
    return { text: out, stash: stash };
  }

  /* prose through the inline rules, maths through untouched */
  function spans(src) {
    return segments(src).map(function (seg) {
      if (seg.math) return seg.t;
      const auto = autoMath(seg.t);
      const html = inline(auto.text);
      if (!auto.stash.length) return html;
      return html.replace(/\x00M(\d+)\x00/g, (_, n) => auto.stash[+n]);

  }

  /* One source line -> one HTML block. */
  function line(src) {
    const raw = String(src == null ? '' : src);
    const t = raw.trim();
    if (!t) return '';

    if (/^(---|\*\*\*|___)\s*$/.test(t)) return '<hr>';

    const h = /^(#{1,4})\s+(.*)$/.exec(t);

      const n = Math.min(h[1].length + 1, 5);
      return '<h' + n + ' class="md-h">' + spans(h[2]) + '</h' + n + '>';
    }

    const q = /^>\s?(.*)$/.exec(t);
    if (q) return '<blockquote class="md-q">' + spans(q[1]) + '</blockquote>';

    const ul = /^[-*+]\s+(.*)$/.exec(t);
    if (ul) return '<ul class="md-l"><li>' + spans(ul[1]) + '</li></ul>';

    const ol = /^(\d+)[.)]\s+(.*)$/.exec(t);
    if (ol) return '<ol class="md-l" start="' + ol[1] + '"><li>' + spans(ol[2]) + '</li></ol>';

    return '<p class="md-p">' + spans(raw) + '</p>';

  /* Does this line carry an explicit maths delimiter? A maths-first box uses
     this to decide whether a delimiter-free line is bare LaTeX. It stays
     dollar-only on purpose: auto-math is for MIXED lines, and a maths-first box
     wants the whole line set as display maths, not one fenced run inside it. */

  const doc = src => String(src || '').split('\n').map(line).join('\n');

  return { line, doc, hasMath, inline, segments, autoMath };
})();

/* ══════════════════════════════════════════════════════════════════════════
   Progress store.

   Three things are tracked, and they are kept apart on purpose:

     completion   Level 1. You have encountered the material. Never evidence
                  of recall.
     proof work   Level 2. You have worked a proof through yourself. Awarded
                  per task, never for opening the note.
     first try    the FIRST recorded attempt at a card or a question. Later
                  attempts are allowed but never overwrite the first, because
                  the first attempt is the only honest measurement.

   The shape is built for merging. Two devices can both make progress offline,
   so every mutation is timestamped and every removal leaves a tombstone —
   merge(a,b) == merge(b,a), and merging twice changes nothing. core.sync.js
   depends on that and on nothing else.

   Storage is localStorage with an in-memory fallback so a locked-down browser
   degrades to a working-but-forgetful session instead of a broken one.
   ══════════════════════════════════════════════════════════════════════════ */

const Store = (function () {

  const KEY = PROJECT.storageKey;
  const EMPTY = {
    v: 2,
    done: {}, undone: {},        /* Level 1 completion + tombstones */
    proofs: {}, unproofs: {},    /* proof + exercise work (L2/L3) + tombstones */
    cards: {}, omr: {}, write: {},
    prefs: {}, prefsAt: {},
    updated: 0
  };

  let volatile = false;
  let state = load();
  const listeners = [];

  function blank() { return JSON.parse(JSON.stringify(EMPTY)); }

  /* v1 had no tombstones, no proof map and no per-key preference stamps.
     Everything it did have keeps its meaning, so the upgrade is a fill-in. */
  function upgrade(raw) {
    const s = Object.assign(blank(), raw || {});
    ['done', 'undone', 'proofs', 'unproofs', 'cards', 'omr', 'write', 'prefs', 'prefsAt']
      .forEach(function (k) { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
    s.v = 2;
    if (!s.updated) s.updated = Date.now();
    return s;
  }

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (!raw) return blank();
      return upgrade(JSON.parse(raw));
    } catch (e) {
      volatile = true;
      return blank();
    }
  }

  function write() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { volatile = true; }
  }

  const flush = DOM.debounce(write, 250);

  /* Write immediately, skipping the debounce. Anything the very next page load
     depends on has to go through here: a debounced write is still pending when
     `location.reload()` tears the page down, and signing in or out and then
     reloading would land back where you started. */
  function flushNow() { write(); }

  function save(quiet) {
    state.updated = Date.now();
    flush();
    if (!quiet) listeners.forEach(function (fn) { try { fn(); } catch (e) { /* a listener must never break a save */ } });
  }

  /* core.sync.js subscribes here; nothing else needs to. */
  function onChange(fn) { listeners.push(fn); }

  /* ── a tick with a tombstone, used by completion and by proof work ────── */
  function flag(on, off, id, want) {
    const now = Date.now();
    if (want) { state[on][id] = now; delete state[off][id]; }
    else { state[off][id] = now; delete state[on][id]; }
    save();
    return !!state[on][id];
  }

  /* ── completion (Level 1) ────────────────────────────────────────────── */
  const isDone = id => !!state.done[id];
  /* when the note was ticked — what the pace graph is drawn from, so history
     needs no separate log and merges exactly like the tick itself */
  const doneAt = id => state.done[id] || 0;
  const setDone = (id, on) => flag('done', 'undone', id, on);

      else { state.undone[id] = now; delete state.done[id]; }

     One flag map for "I produced this myself", under two kinds of key:
       '<conceptId>'      a proof worked through          — earns level 2
       'w:<questionId>'   a written exercise worked out   — earns level 3

     same way; core.progress.js is what gives each key its meaning. */

  const setProofDone = (id, on) => flag('proofs', 'unproofs', id, on);
