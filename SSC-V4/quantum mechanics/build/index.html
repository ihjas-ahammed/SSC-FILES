    title: 'General Proof of the Uncertainty Principle',
    source: 'Griffiths 3e §1.6 Problem 1.18 & Zettili 2e §2.5',
    prompt: `<p>For any two Hermitian operators $\\hat{A}$ and $\\hat{B}$, prove the generalized uncertainty relation:
$$\\sigma_A \\sigma_B \\ge \\frac{1}{2} |\\langle [\\hat{A}, \\hat{B}] \\rangle|$$
and deduce the position-momentum uncertainty principle $\\sigma_x \\sigma_p \\ge \\hbar/2$ as a special case.</p>`,
    tests: ['c.1.6.1', 'c.1.5.3'],
    approach: '<p>Define shifted operators $\\Delta \\hat{A} = \\hat{A} - \\langle A \\rangle$ and $\\Delta \\hat{B} = \\hat{B} - \\langle B \\rangle$, apply the Cauchy-Schwarz inequality $|\\langle f | g \\rangle|^2 \\le \\langle f|f\\rangle \\langle g|g\\rangle$ to $|f\\rangle = \\Delta \\hat{A}|\\Psi\\rangle$ and $|g\\rangle = \\Delta \\hat{B}|\\Psi\\rangle$, and split the inner product into Hermitian and anti-Hermitian parts.</p>',
    solution: `<p>Let $|f\\rangle = (\\hat{A} - \\langle A \\rangle)|\\Psi\\rangle$ and $|g\\rangle = (\\hat{B} - \\langle B \\rangle)|\\Psi\\rangle$.<br>
By the Cauchy-Schwarz inequality in Hilbert space:
$$\\sigma_A^2 \\sigma_B^2 = \\langle f | f \\rangle \\langle g | g \\rangle \\ge |\\langle f | g \\rangle|^2$$
Evaluate the inner product $\\langle f | g \\rangle$:
$$\\langle f | g \\rangle = \\langle \\Psi | (\\hat{A} - \\langle A \\rangle)(\\hat{B} - \\langle B \\rangle) | \\Psi \\rangle = \\langle \\Delta \\hat{A} \\Delta \\hat{B} \\rangle$$
Any complex number $z = \\langle f|g \\rangle$ can be written as $z = \\text{Re}(z) + i \\text{Im}(z)$, so $|z|^2 = (\\text{Re} z)^2 + (\\text{Im} z)^2 \\ge (\\text{Im} z)^2 = \\left(\\frac{z - z^*}{2i}\\right)^2$.<br>
Note that:
$$\\langle f | g \\rangle^* = \\langle g | f \\rangle = \\langle \\Delta \\hat{B} \\Delta \\hat{A} \\rangle$$
Therefore:
$$\\frac{\\langle f | g \\rangle - \\langle f | g \\rangle^*}{2i} = \\frac{\\langle \\Delta \\hat{A} \\Delta \\hat{B} - \\Delta \\hat{B} \\Delta \\hat{A} \\rangle}{2i} = \\frac{\\langle [\\Delta \\hat{A}, \\Delta \\hat{B}] \\rangle}{2i} = \\frac{\\langle [\\hat{A}, \\hat{B}] \\rangle}{2i}$$
(since constants commute with all operators).<br>
Substituting back into the Cauchy-Schwarz inequality:
$$\\sigma_A^2 \\sigma_B^2 \\ge \\left| \\frac{\\langle [\\hat{A}, \\hat{B}] \\rangle}{2i} \\right|^2 = \\frac{1}{4} |\\langle [\\hat{A}, \\hat{B}] \\rangle|^2$$
Taking the positive square root on both sides:
$$\\sigma_A \\sigma_B \\ge \\frac{1}{2} |\\langle [\\hat{A}, \\hat{B}] \\rangle|$$
<b>Special Case for Position and Momentum:</b><br>
Set $\\hat{A} = \\hat{x}$ and $\\hat{B} = \\hat{p}$. Since $[\\hat{x}, \\hat{p}] = i\\hbar$:
$$|\\langle [\\hat{x}, \\hat{p}] \\rangle| = |i\\hbar| = \\hbar \\implies \\sigma_x \\sigma_p \\ge \\frac{1}{2}\\hbar = \\frac{\\hbar}{2}$$</p>`,
    trap: 'Forgetting that (Re z)² ≥ 0 can only be discarded as an inequality, which is why the relation is a lower bound (≥), not an equality.'
  }

$$\\boxed{\\frac{\\partial \\rho}{\\partial t} + \\nabla \\cdot \\mathbf{J} = 0} \\qquad \\text{(in 1D: } \\frac{\\partial \\rho}{\\partial t} + \\frac{\\partial J}{\\partial x} = 0\\text{)}$$
Integrating over any spatial volume $V$ bounded by surface $S$:
$$\\frac{d}{dt} \\int_V \\rho \\, dV = -\\oint_S \\mathbf{J} \\cdot d\\mathbf{A}$$
The rate of change of probability inside any region equals the net flux of probability flowing through its boundary.`,
    intuition: `Local conservation means probability cannot vanish here and instantaneously reappear over there without traveling through the intervening space (which would allow teleportation and superluminal signaling). It behaves exactly like an incompressible fluid or electric charge: if the total fluid level inside a bottle decreases, fluid MUST have flowed outward across the bottle neck.`,
    needs: ['c.1.4.2', 'c.1.1.2'],

        { label: 'Substitute from TDSE', math: '\\frac{\\partial \\Psi}{\\partial t} = \\frac{1}{i\\hbar}\\left(-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi}{\\partial x^2} + V\\Psi\\right), \\quad \\frac{\\partial \\Psi^*}{\\partial t} = -\\frac{1}{i\\hbar}\\left(-\\frac{\\hbar^2}{2m}\\frac{\\partial^2 \\Psi^*}{\\partial x^2} + V\\Psi^*\\right)', note: 'Complex conjugate inverts the sign of i.' },
        { label: 'Combine and Cancel Potential V', math: '\\frac{\\partial \\rho}{\\partial t} = \\frac{i\\hbar}{2m}\\left(\\Psi^* \\frac{\\partial^2 \\Psi}{\\partial x^2} - \\Psi \\frac{\\partial^2 \\Psi^*}{\\partial x^2}\\right) + \\frac{1}{i\\hbar}(V\\Psi^*\\Psi - V\\Psi^*\\Psi)', note: 'The potential energy terms cancel identically because V is real.' },
        { label: 'Identify Total Spatial Derivative', math: '\\Psi^* \\frac{\\partial^2 \\Psi}{\\partial x^2} - \\Psi \\frac{\\partial^2 \\Psi^*}{\\partial x^2} = \\frac{\\partial}{\\partial x}\\left(\\Psi^* \\frac{\\partial \\Psi}{\\partial x} - \\Psi \\frac{\\partial \\Psi^*}{\\partial x}\\right)', note: 'Verify by expanding with the product rule.' },

      ]

      { q: 'What property of the potential energy $V(x)$ is required for the continuity equation to hold?', a: '$V(x)$ must be purely real (Hermitian). An imaginary potential $V = V_R - i\\Gamma$ acts as a source or sink of probability.', kind: 'recall' }

    oneLine: 'J(x,t) = (ħ/2mi) [Ψ*(∂Ψ/∂x) - Ψ(∂Ψ*/∂x)] = (ħ/m) Im[Ψ*(∂Ψ/∂x)] represents probability flux per unit time.',
    statement: `The <b>probability current density</b> (or probability flux) in one dimension is defined as:

  /* ── 2.5 The Potential Step ───────────────────────────────────────────────── */
  {
    id: 'c.2.5.1', sec: '2.5', kind: 'definition', tier: 'core',
    title: 'The Potential Step and Boundary Matching for E > V₀',
    oneLine: 'For E > V₀, particles incident on a potential step undergo partial reflection and partial transmission with wave numbers k₁ = √(2mE)/ħ and k₂ = √(2m(E-V₀))/ħ.',
    statement: `A <b>potential step</b> of height $V_0 > 0$ at $x = 0$ is defined by:
$$V(x) = \\begin{cases} 0, & x < 0 \\quad (\\text{Region I}) \\\\ V_0, & x > 0 \\quad (\\text{Region II}) \\end{cases}$$
For particles of mass $m$ and energy $E > V_0$ incident from the left:
$$\\psi_I(x) = A e^{ik_1 x} + B e^{-ik_1 x}, \\qquad \\psi_{II}(x) = C e^{ik_2 x}$$
where $k_1 = \\frac{\\sqrt{2mE}}{\\hbar}$ and $k_2 = \\frac{\\sqrt{2m(E - V_0)}}{\\hbar} < k_1$.
Continuity of $\\psi(x)$ and $\\frac{d\\psi}{dx}$ at $x = 0$ yields the reflection and transmission amplitudes:
$$\\boxed{\\frac{B}{A} = \\frac{k_1 - k_2}{k_1 + k_2}, \\qquad \\frac{C}{A} = \\frac{2k_1}{k_1 + k_2}}$$`,
    intuition: `Classically, a particle with $E > V_0$ rolls over the step without ever turning back—it simply slows down from speed $v_1$ to $v_2$. In quantum mechanics, a wave encounters a sudden change in refractive index (impedance mismatch) at $x = 0$. Just like light hitting a glass window, part of the probability wave MUST reflect back ($B \\ne 0$), even though the particle possesses more than enough energy to clear the barrier!`,
    needs: ['c.2.3.1', 'c.2.4.2'],
    traps: [
      `Including a left-traveling wave $D e^{-ik_2 x}$ in Region II. Particles are incident ONLY from the left, so there is no source in Region II to send waves back toward $x = 0$.`,
      `Thinking quantum reflection requires $E < V_0$. Non-zero reflection ($R > 0$) occurs even when $E > V_0$, a purely wave-mechanical phenomenon.`
    ],
    proof: {
      idea: 'Match the wave function ψ(0-) = ψ(0+) and its first derivative ψ\'(0-) = ψ\'(0+) across the finite discontinuity at x = 0.',
      why: 'Finite potential steps enforce continuity of both the state and the probability current.',
      rungs: [
        { label: 'Continuity of ψ at x = 0', math: '\\psi_I(0) = \\psi_{II}(0) \\implies A + B = C', note: 'Evaluated at x = 0.' },
        { label: 'Continuity of ψ\' at x = 0', math: '\\psi_I\'(0) = \\psi_{II}\'(0) \\implies ik_1(A - B) = ik_2 C \\implies k_1(A - B) = k_2 C', note: 'Derivative continuity.' },
        { label: 'Substitute C = A + B', math: 'k_1(A - B) = k_2(A + B) \\implies (k_1 - k_2)A = (k_1 + k_2)B', note: 'Group terms in A and B.' },
        { label: 'Reflection Amplitude B/A', math: '\\frac{B}{A} = \\frac{k_1 - k_2}{k_1 + k_2}', note: 'Analogous to Fresnel reflection coefficient in optics.' },
        { label: 'Transmission Amplitude C/A', math: 'C = A + B = A\\left(1 + \\frac{k_1 - k_2}{k_1 + k_2}\\right) \\implies \\frac{C}{A} = \\frac{2k_1}{k_1 + k_2}', note: 'Standard transmission amplitude.' }
      ]
    },
    cards: [
      { q: 'What is the reflection amplitude $B/A$ at a potential step for $E > V_0$?', a: '$\\frac{B}{A} = \\frac{k_1 - k_2}{k_1 + k_2}$.', kind: 'state' },
      { q: 'Why is there reflection in quantum mechanics when $E > V_0$, unlike classical mechanics?', a: 'Because the sudden step change in potential causes an abrupt change in de Broglie wavelength (wave impedance mismatch), reflecting wave amplitude.', kind: 'recall' }
    ]
  },
  {
    id: 'c.2.5.2', sec: '2.5', kind: 'theorem', tier: 'core',
    title: 'Reflection and Transmission Coefficients (R + T = 1)',
    oneLine: 'R = |J_refl / J_inc| = (k₁ - k₂)² / (k₁ + k₂)² and T = |J_trans / J_inc| = 4k₁k₂ / (k₁ + k₂)², strictly satisfying R + T = 1.',
    statement: `The reflection coefficient $R$ and transmission coefficient $T$ are defined as the ratios of reflected and transmitted probability current to incident current:
$$R \\equiv \\left| \\frac{J_{\\text{refl}}}{J_{\\text{inc}}} \\right| = \\left| \\frac{B}{A} \\right|^2 = \\boxed{\\left( \\frac{k_1 - k_2}{k_1 + k_2} \\right)^2}$$
$$T \\equiv \\left| \\frac{J_{\\text{trans}}}{J_{\\text{inc}}} \\right| = \\frac{k_2}{k_1} \\left| \\frac{C}{A} \\right|^2 = \\frac{k_2}{k_1} \\left( \\frac{2k_1}{k_1 + k_2} \\right)^2 = \\boxed{\\frac{4k_1 k_2}{(k_1 + k_2)^2}}$$
Conservation of total probability flux rigorously guarantees:
$$\\boxed{R + T = 1}$$`,
    intuition: `Notice the velocity ratio $k_2 / k_1 = v_2 / v_1$ in the formula for $T$! Transmission is NOT simply $|C/A|^2$. If a stream of cars passes from a high-speed highway ($v_1$) into congested city traffic ($v_2$), the spatial density of cars increases even though the number of cars passing per minute is conserved. The ratio of currents accounts for the difference in particle velocities across the step.`,
    needs: ['c.2.5.1', 'c.2.4.3'],
    traps: [
      `Defining $T = |C/A|^2$ without the kinematic velocity factor $k_2/k_1$. Since $J = \\frac{\\hbar k}{m}|\\psi|^2$, $T = \\frac{J_{\\text{trans}}}{J_{\\text{inc}}} = \\frac{k_2 |C|^2}{k_1 |A|^2}$. Without $k_2/k_1$, $R + T \\ne 1$!`,
      `Thinking $R \\to 1$ as $E \\to \\infty$. As $E \\to \\infty$, $k_2 \\to k_1$, so $R \\to 0$ and $T \\to 1$ (approaching classical behavior).`
    ],
    proof: {
      idea: 'Compute the probability currents J_inc, J_refl, J_trans using J = (ħk/m)|amplitude|² and sum R + T.',
      why: 'Demonstrate algebraically that flux conservation holds identically.',
      rungs: [
        { label: 'Currents for Each Component', math: 'J_{\\text{inc}} = \\frac{\\hbar k_1}{m}|A|^2, \\quad J_{\\text{refl}} = -\\frac{\\hbar k_1}{m}|B|^2, \\quad J_{\\text{trans}} = \\frac{\\hbar k_2}{m}|C|^2', note: 'Signs indicate propagation direction.' },
        { label: 'Compute R', math: 'R = \\frac{|J_{\\text{refl}}|}{J_{\\text{inc}}} = \\frac{|B|^2}{|A|^2} = \\left(\\frac{k_1 - k_2}{k_1 + k_2}\\right)^2', note: 'Squared modulus of reflection amplitude.' },
        { label: 'Compute T', math: 'T = \\frac{J_{\\text{trans}}}{J_{\\text{inc}}} = \\frac{k_2 |C|^2}{k_1 |A|^2} = \\frac{k_2}{k_1} \\frac{4k_1^2}{(k_1 + k_2)^2} = \\frac{4k_1 k_2}{(k_1 + k_2)^2}', note: 'Factor of k₁ cancels.' },
        { label: 'Sum R + T', math: 'R + T = \\frac{(k_1 - k_2)^2 + 4k_1 k_2}{(k_1 + k_2)^2} = \\frac{k_1^2 - 2k_1 k_2 + k_2^2 + 4k_1 k_2}{(k_1 + k_2)^2} = \\frac{(k_1 + k_2)^2}{(k_1 + k_2)^2} = 1', note: 'Exact algebraic unity.' }
      ]
    },
    cards: [
      { q: 'Why is the transmission coefficient $T = \\frac{k_2}{k_1}|C/A|^2$ rather than just $|C/A|^2$?', a: 'Because $T$ is the ratio of probability fluxes, and the particles travel at different speeds $v_2/v_1 = k_2/k_1$ on either side of the step.', kind: 'recall' },
      { q: 'Calculate the reflection coefficient $R$ for a step potential if $E = \\frac{4}{3}V_0$.', a: '$k_1 \\propto \\sqrt{4/3}, k_2 \\propto \\sqrt{1/3} \\implies \\frac{k_1 - k_2}{k_1 + k_2} = \\frac{2 - 1}{2 + 1} = \\frac{1}{3} \\implies R = (1/3)^2 = 1/9$.', kind: 'state' }
    ]
  },

    title: 'The Potential Step for E < V₀ and Evanescent Waves',
    oneLine: 'When E < V₀, k₂ becomes imaginary k₂ = iκ, turning the transmitted state into an exponentially decaying evanescent wave ψ_{II}(x) = C e^{-κx}.',
    statement: `When particles of energy $E < V_0$ strike the potential step from the left, Region II is <b>classically forbidden</b> ($E - V_0 < 0$).

$$\\psi_I(x) = A e^{ik_1 x} + B e^{-ik_1 x}, \\qquad \\frac{B}{A} = \\frac{k_1 - i\\kappa}{k_1 + i\\kappa} = e^{i 2\\delta}$$`,
    intuition: `Classically, a billiard ball with $E < V_0$ hits a hard wall and bounces back instantly at the surface $x = 0$. Quantum mechanically, the wave cannot stop abruptly because that would cause an infinite derivative $d^2\\psi/dx^2$ and infinite kinetic energy. Instead, it "bleeds" smoothly into the forbidden territory, decaying exponentially like light undergoing total internal reflection with an evanescent field.`,

    cards: [

      { q: 'Why is the coefficient of $e^{+\\kappa x}$ set to zero for a step potential extending to $x = +\\infty$?', a: 'To prevent the wave function from blowing up to infinity as $x \\to +\\infty$, which would violate square-integrability.', kind: 'recall' }
    ]

    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.2',
    marks: 6,
    title: 'Two-State Superposition and Quantum Beats',
    source: 'Griffiths 3e §2.2 Problem 2.5',
    prompt: `<p>A particle in the infinite square well of width $a$ has as its initial wave function an even mixture of the first two stationary states:
$$\\Psi(x,0) = A [\\psi_1(x) + \\psi_2(x)]$$
(a) Normalize $\\Psi(x,0)$ to find the constant $A$.<br>
(b) Write down $\\Psi(x,t)$ and $|\\Psi(x,t)|^2$.<br>
(c) Compute $\\langle x \\rangle(t)$ and determine the frequency $\\omega$ and amplitude of its oscillation.</p>`,
    tests: ['c.2.1.2', 'c.2.1.4', 'c.2.2.2'],
    approach: '<p>Use orthonormality $\\int \\psi_m \\psi_n dx = \\delta_{mn}$ to normalize, attach phase factors $e^{-iE_n t/\\hbar}$, expand $|\\Psi|^2$, and evaluate $\\int x \\psi_1 \\psi_2 dx$.</p>',
    solution: `<p><b>(a) Normalization:</b><br>
$$\\int_0^a |\\Psi(x,0)|^2 dx = |A|^2 \\int_0^a [\\psi_1^2 + \\psi_2^2 + 2\\psi_1 \\psi_2] dx = |A|^2 (1 + 1 + 0) = 2|A|^2 = 1 \\implies A = \\frac{1}{\\sqrt{2}}$$
So $\\Psi(x,0) = \\frac{1}{\\sqrt{2}}\\psi_1(x) + \\frac{1}{\\sqrt{2}}\\psi_2(x)$.</p>
<p><b>(b) Time Evolution:</b><br>
$$\\Psi(x,t) = \\frac{1}{\\sqrt{2}}\\psi_1(x) e^{-iE_1 t/\\hbar} + \\frac{1}{\\sqrt{2}}\\psi_2(x) e^{-iE_2 t/\\hbar}$$
The probability density is:
$$|\\Psi(x,t)|^2 = \\frac{1}{2}\\psi_1^2(x) + \\frac{1}{2}\\psi_2^2(x) + \\psi_1(x)\\psi_2(x) \\cos(\\omega t)$$
where the Bohr beat frequency is:
$$\\omega = \\frac{E_2 - E_1}{\\hbar} = \\frac{4E_1 - E_1}{\\hbar} = \\frac{3E_1}{\\hbar} = \\frac{3\\pi^2 \\hbar}{2ma^2}$$</p>
<p><b>(c) Expectation Value $\\langle x \\rangle(t)$:</b><br>
$$\\langle x \\rangle(t) = \\frac{1}{2}\\int x\\psi_1^2 dx + \\frac{1}{2}\\int x\\psi_2^2 dx + \\cos(\\omega t) \\int_0^a x\\psi_1(x)\\psi_2(x) dx$$
The first two terms equal $\\frac{1}{2}(a/2) + \\frac{1}{2}(a/2) = \\frac{a}{2}$.<br>
The cross-term integral:
$$\\int_0^a x \\left(\\sqrt{\\frac{2}{a}}\\sin\\frac{\\pi x}{a}\\right)\\left(\\sqrt{\\frac{2}{a}}\\sin\\frac{2\\pi x}{a}\\right) dx = \\frac{2}{a}\\int_0^a x \\sin\\frac{\\pi x}{a} \\sin\\frac{2\\pi x}{a} dx = -\\frac{16a}{9\\pi^2}$$
Thus:
$$\\langle x \\rangle(t) = \\frac{a}{2} - \\frac{16a}{9\\pi^2} \\cos(\\omega t)$$
The expectation value sloshes back and forth about the center $a/2$ with amplitude $\\frac{16a}{9\\pi^2} \\approx 0.18 a$ and frequency $\\omega = \\frac{3\\pi^2 \\hbar}{2ma^2}$.</p>`,
    trap: 'Thinking the frequency is (E₁ + E₂)/ħ; the interference term oscillates at the difference frequency (E₂ - E₁)/ħ.'
  },
  {
    id: 'q.qm1.m2.05',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.2',
    marks: 6,
    title: 'Parabolic Initial Wave Function in an Infinite Well',
    source: 'Griffiths 3e §2.2 Problem 2.6',
    prompt: `<p>A particle in the infinite square well has the initial wave function:
$$\\Psi(x,0) = A x(a - x) \\qquad (0 \\le x \\le a)$$
(a) Normalize $\\Psi(x,0)$ to determine $A$.<br>
(b) Find the expansion coefficients $c_n$.<br>
(c) What is the probability that a measurement of energy will yield the ground state energy $E_1$?</p>`,
    tests: ['c.2.1.4', 'c.2.2.3'],
    approach: '<p>Compute $\\int_0^a x^2(a-x)^2 dx = a^5/30$ for normalization, then integrate $c_n = \\int_0^a \\psi_n(x) \\Psi(x,0) dx$ by parts twice.</p>',
    solution: `<p><b>(a) Normalization:</b><br>
$$1 = |A|^2 \\int_0^a x^2(a-x)^2 dx = |A|^2 \\int_0^a (a^2 x^2 - 2a x^3 + x^4) dx = |A|^2 a^5 \\left(\\frac{1}{3} - \\frac{2}{4} + \\frac{1}{5}\\right) = |A|^2 \\frac{a^5}{30}$$
$$A = \\sqrt{\\frac{30}{a^5}}$$</p>
<p><b>(b) Expansion Coefficients $c_n$:</b><br>
$$c_n = \\sqrt{\\frac{2}{a}} \\sqrt{\\frac{30}{a^5}} \\int_0^a x(a - x) \\sin\\left(\\frac{n\\pi x}{a}\\right) dx = \\frac{2\\sqrt{15}}{a^3} \\int_0^a (ax - x^2) \\sin\\left(\\frac{n\\pi x}{a}\\right) dx$$
Integrating by parts:
$$c_n = \\begin{cases} \\dfrac{8\\sqrt{15}}{(n\\pi)^3}, & n = 1, 3, 5, \\dots \\\\ 0, & n = 2, 4, 6, \\dots \\end{cases}$$
Even $n$ coefficients vanish because $x(a-x)$ is symmetric about $x = a/2$, whereas even eigenfunctions are antisymmetric about $a/2$.</p>
<p><b>(c) Probability of Ground State $E_1$:</b><br>
$$P(E_1) = |c_1|^2 = \\left( \\frac{8\\sqrt{15}}{\\pi^3} \\right)^2 = \\frac{64 \\times 15}{\\pi^6} = \\frac{960}{\\pi^6} \\approx \\frac{960}{961.389} \\approx 0.99855 \\quad (99.86\\%)$$
Almost the entire state is in the ground state because the parabola $x(a-x)$ closely mirrors the half-sine wave $\\sin(\\pi x/a)$.</p>`,
    trap: 'Forgetting that even n vanishes by symmetry, wasting effort calculating non-zero values for n=2, 4.'
  },

    id: 'q.qm1.m2.06',
    course: 'qm1',
    module: 'qm1.m2',

    title: 'Symmetric Triangular State in an Infinite Well',
    source: 'Griffiths 3e §2.2 Problem 2.7',
    prompt: `<p>A particle in the infinite well has the initial triangular wave function:
$$\\Psi(x,0) = \\begin{cases} A x, & 0 \\le x \\le a/2 \\\\ A(a - x), & a/2 \\le x \\le a \\end{cases}$$
(a) Normalize $\\Psi(x,0)$.<br>
(b) Calculate $c_n$ and verify that $c_n = 0$ for all even $n$.</p>`,
    tests: ['c.2.2.3', 'c.2.2.4'],
    approach: '<p>Split the integrals into $[0, a/2]$ and $[a/2, a]$ or exploit symmetry about $a/2$.</p>',
    solution: `<p><b>(a) Normalization:</b><br>
$$1 = 2 |A|^2 \\int_0^{a/2} x^2 dx = 2 |A|^2 \\left[ \\frac{x^3}{3} \\right]_0^{a/2} = 2 |A|^2 \\frac{a^3}{24} = |A|^2 \\frac{a^3}{12} \\implies A = \\sqrt{\\frac{12}{a^3}} = \\frac{2\\sqrt{3}}{a^{3/2}}$$</p>
<p><b>(b) Fourier Coefficients $c_n$:</b><br>
$$c_n = \\int_0^a \\psi_n(x) \\Psi(x,0) dx = 2 \\sqrt{\\frac{2}{a}} A \\int_0^{a/2} x \\sin\\left(\\frac{n\\pi x}{a}\\right) dx$$
Evaluating the integral by parts:
$$\\int_0^{a/2} x \\sin\\left(\\frac{n\\pi x}{a}\\right) dx = \\left( \\frac{a}{n\\pi} \\right)^2 \\sin\\left(\\frac{n\\pi}{2}\\right) - \\frac{a^2}{2n\\pi} \\cos\\left(\\frac{n\\pi}{2}\\right)$$
For even $n = 2k$, $\\sin(k\\pi) = 0$ and the overall integral vanishes: $c_{2k} = 0$.<br>
For odd $n = 1, 3, 5, \\dots$:
$$c_n = \\frac{4\\sqrt{6}}{(n\\pi)^2} (-1)^{(n-1)/2}$$
Specifically, $c_1 = \\frac{4\\sqrt{6}}{\\pi^2} \\approx 0.9927$, giving $P(E_1) = |c_1|^2 = \\frac{96}{\\pi^4} \\approx 98.55\\%$.</p>`,
    trap: 'Integrating without splitting at a/2, which produces an erroneous continuous derivative assumption.'
  },

    id: 'q.qm1.m2.07',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.3',
    marks: 4,
    title: 'Relativistic Phase and Group Velocities',
    source: 'Griffiths 3e §2.4 Problem 2.20',
    prompt: `<p>For a relativistic free particle with energy $E = \\sqrt{p^2 c^2 + m^2 c^4}$ and de Broglie relations $E = \\hbar \\omega$ and $p = \\hbar k$:
(a) Determine the phase velocity $v_p = \\omega/k$.<br>
(b) Determine the group velocity $v_g = d\\omega/dk$.<br>
(c) Show that $v_p v_g = c^2$. Is the fact that $v_p > c$ a violation of special relativity?</p>`,
    tests: ['c.2.3.3'],
    approach: '<p>Express $\\omega(k) = \\sqrt{c^2 k^2 + (m c^2/\\hbar)^2}$, then calculate $\\omega/k$ and $d\\omega/dk$.</p>',
    solution: `<p><b>(a) Phase Velocity:</b><br>
$$\\omega(k) = \\frac{1}{\\hbar} \\sqrt{\\hbar^2 k^2 c^2 + m^2 c^4} = c \\sqrt{k^2 + \\left(\\frac{mc}{\\hbar}\\right)^2}$$
$$v_p = \\frac{\\omega}{k} = c \\sqrt{1 + \\left(\\frac{mc}{\\hbar k}\\right)^2} = \\frac{E}{p} = \\frac{\\gamma m c^2}{\\gamma m v} = \\frac{c^2}{v} > c$$
The phase velocity is strictly superluminal ($v_p > c$).</p>
<p><b>(b) Group Velocity:</b><br>
$$v_g = \\frac{d\\omega}{dk} = c \\frac{2k}{2\\sqrt{k^2 + (mc/\\hbar)^2}} = \\frac{c^2 k}{\\omega} = \\frac{c^2 (p/\\hbar)}{E/\\hbar} = \\frac{c^2 p}{E} = \\frac{c^2 (\\gamma m v)}{\\gamma m c^2} = v$$
The group velocity is precisely the physical particle speed $v < c$.</p>
<p><b>(c) Product and Relativity:</b><br>
$$v_p v_g = \\left(\\frac{c^2}{v}\\right)(v) = c^2$$
Having $v_p > c$ does <b>not</b> violate relativity because a continuous monochromatic phase wave carries zero information and cannot transmit a signal. Any physical message or energy is modulated into a wave packet, which travels at the group velocity $v_g = v < c$.</p>`,
    trap: 'Thinking superluminal phase velocity violates Einstein causation; only information/mass velocity (v_g) must obey v ≤ c.'
  },
  {
    id: 'q.qm1.m2.08',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.4',
    marks: 4,
    title: 'Probability Current for a Spherical Wave',
    source: 'Zettili 2e Chapter 3 Problem 3.6',
    prompt: `<p>Consider an outgoing spherical wave originating from a point source:
$$\\psi(r) = \\frac{A}{r} e^{ikr}$$
(a) Find the radial component of the probability current density $J_r$.<br>
(b) Calculate the total probability flux flowing outward through a sphere of radius $r$. Is it independent of $r$?</p>`,
    tests: ['c.2.4.2'],
    approach: '<p>Use the radial gradient $\\nabla_r = \\frac{\\partial}{\\partial r}$ in $J_r = \\frac{\\hbar}{m}\\text{Im}\\left(\\psi^* \\frac{\\partial \\psi}{\\partial r}\\right)$, then integrate over a sphere of area $4\\pi r^2$.</p>',
    solution: `<p><b>(a) Radial Probability Current:</b><br>
Compute the radial derivative:
$$\\frac{\\partial \\psi}{\\partial r} = A \\frac{d}{dr}\\left( \\frac{e^{ikr}}{r} \\right) = A \\left( \\frac{ik}{r} - \\frac{1}{r^2} \\right) e^{ikr}$$
Multiply by $\\psi^*(r) = \\frac{A^*}{r} e^{-ikr}$:
$$\\psi^* \\frac{\\partial \\psi}{\\partial r} = \\frac{|A|^2}{r^2} \\left( ik - \\frac{1}{r} \\right)$$
Taking the imaginary part:
$$\\text{Im}\\left( \\psi^* \\frac{\\partial \\psi}{\\partial r} \\right) = \\frac{k |A|^2}{r^2}$$
Therefore:
$$J_r = \\frac{\\hbar}{m} \\text{Im}\\left( \\psi^* \\frac{\\partial \\psi}{\\partial r} \\right) = \\frac{\\hbar k}{m} \\frac{|A|^2}{r^2}$$</p>
<p><b>(b) Total Outward Flux:</b><br>
Integrate over a sphere of radius $r$:
$$\\Phi = \\oint_{S} \\mathbf{J} \\cdot d\\mathbf{A} = J_r (4\\pi r^2) = \\left( \\frac{\\hbar k |A|^2}{m r^2} \\right) (4\\pi r^2) = \\frac{4\\pi \\hbar k |A|^2}{m}$$
The total flux is strictly <b>independent of radius $r$</b>. This confirms probability flux conservation: the total probability flowing outward through every concentric shell per second is invariant, explaining why amplitude must decay as $1/r$.</p>`,
    trap: 'Forgetting the -1/r² term when differentiating 1/r, even though it is purely real and drops out of the imaginary part.'
  },
  {
    id: 'q.qm1.m2.09',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.5',
    marks: 4,
    title: 'Potential Step Reflection and Transmission for E = 2V₀',
    source: 'Zettili 2e Chapter 4 Problem 4.1',
    prompt: `<p>A beam of particles of mass $m$ and energy $E = 2 V_0$ is incident from $x < 0$ on a potential step $V(x) = V_0 \\Theta(x)$.<br>
(a) Determine the ratio of wave numbers $k_2 / k_1$.<br>
(b) Calculate the reflection coefficient $R$ and transmission coefficient $T$, and verify that $R + T = 1$.</p>`,
    tests: ['c.2.5.1', 'c.2.5.2'],
    approach: '<p>Calculate $k_1 = \\sqrt{2mE}/\\hbar$ and $k_2 = \\sqrt{2m(E-V_0)}/\\hbar = \\sqrt{2m V_0}/\\hbar$, then evaluate $R = (k_1 - k_2)^2/(k_1 + k_2)^2$ and $T = 4k_1 k_2/(k_1 + k_2)^2$.</p>',
    solution: `<p><b>(a) Ratio of Wave Numbers:</b><br>
$$k_1 = \\frac{\\sqrt{2mE}}{\\hbar} = \\frac{\\sqrt{4m V_0}}{\\hbar} = \\frac{\\sqrt{2m V_0}}{\\hbar} \\sqrt{2}$$
$$k_2 = \\frac{\\sqrt{2m(E - V_0)}}{\\hbar} = \\frac{\\sqrt{2m(2V_0 - V_0)}}{\\hbar} = \\frac{\\sqrt{2m V_0}}{\\hbar}$$
$$\\frac{k_2}{k_1} = \\frac{1}{\\sqrt{2}}$$</p>
<p><b>(b) Reflection and Transmission Coefficients:</b><br>
Divide numerator and denominator by $k_1$:
$$R = \\left( \\frac{1 - k_2/k_1}{1 + k_2/k_1} \\right)^2 = \\left( \\frac{1 - 1/\\sqrt{2}}{1 + 1/\\sqrt{2}} \\right)^2 = \\left( \\frac{\\sqrt{2} - 1}{\\sqrt{2} + 1} \\right)^2 = (\\sqrt{2} - 1)^4 \\approx (0.4142)^4 \\approx 0.02944 \\quad (2.94\\%)$$
$$T = \\frac{4(k_2/k_1)}{(1 + k_2/k_1)^2} = \\frac{4(1/\\sqrt{2})}{(1 + 1/\\sqrt{2})^2} = \\frac{4\\sqrt{2}}{(\\sqrt{2} + 1)^2} = 4\\sqrt{2}(\\sqrt{2} - 1)^2 = 4\\sqrt{2}(3 - 2\\sqrt{2}) = 12\\sqrt{2} - 16 \\approx 0.97056 \\quad (97.06\\%)$$
$$R + T = 0.02944 + 0.97056 = 1.00000$$
Even though the energy is double the barrier height, roughly $3\\%$ of the incident particles are reflected!</p>`,
    trap: 'Thinking T = |C/A|²; forgetting that T includes the velocity ratio k₂/k₁.'
  },
  {
    id: 'q.qm1.m2.10',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.5',
    marks: 4,
    title: 'Electron Penetration Depth for a Classically Forbidden Step',
    source: 'Zettili 2e Chapter 4 Problem 4.2',
    prompt: `<p>A beam of electrons with kinetic energy $E = 5.0\\text{ eV}$ is incident on a potential step of height $V_0 = 10.0\\text{ eV}$.<br>
(a) Find the attenuation constant $\\kappa$ in Region II.<br>
(b) Calculate the penetration depth $\\delta = 1/\\kappa$ in nanometers.<br>
(c) At what distance into the step does the probability density drop to $1\\%$ of its value at $x = 0$?</p>`,
    tests: ['c.2.5.3', 'c.2.5.4'],
    approach: '<p>Use $\\kappa = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar}$ with $V_0 - E = 5\\text{ eV}$, $\\delta = 1/\\kappa$, and set $e^{-2\\kappa x} = 0.01$.</p>',
    solution: `<p><b>(a) Attenuation Constant $\\kappa$:</b><br>
$$V_0 - E = 10.0\\text{ eV} - 5.0\\text{ eV} = 5.0\\text{ eV} = 5.0 \\times 1.602 \\times 10^{-19}\\text{ J} = 8.01 \\times 10^{-19}\\text{ J}$$
$$\\kappa = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar} = \\frac{\\sqrt{2(9.109 \\times 10^{-31}\\text{ kg})(8.01 \\times 10^{-19}\\text{ J})}}{1.055 \\times 10^{-34}\\text{ J}\\cdot\\text{s}} = \\frac{1.208 \\times 10^{-24}}{1.055 \\times 10^{-34}} \\approx 1.145 \\times 10^{10}\\text{ m}^{-1}$$</p>
<p><b>(b) Penetration Depth $\\delta$:</b><br>
$$\\delta = \\frac{1}{\\kappa} = \\frac{1}{1.145 \\times 10^{10}\\text{ m}^{-1}} \\approx 8.73 \\times 10^{-11}\\text{ m} = 0.0873\\text{ nm} = 0.873\\text{ \\AA}$$</p>
<p><b>(c) Distance for $1\\%$ Probability Density:</b><br>
$$|\\psi(x)|^2 = |\\psi(0)|^2 e^{-2\\kappa x} = 0.01 |\\psi(0)|^2 \\implies e^{-2\\kappa x} = 0.01$$
$$-2\\kappa x = \\ln(0.01) = -4.605 \\implies x = \\frac{4.605}{2\\kappa} = 2.303 \\, \\delta$$
$$x = 2.303 \\times 0.0873\\text{ nm} \\approx 0.201\\text{ nm} = 2.01\\text{ \\AA}$$
The wave function is virtually extinguished within two tenths of a nanometer (roughly one atomic diameter).</p>`,
    trap: 'Using e^{-κx} = 0.01 instead of e^{-2κx} = 0.01; probability density is the squared modulus.'
  },
  {
    id: 'q.qm1.m2.11',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.6',
    marks: 5,
    title: 'Electron Tunneling Probability Through a Nanoscale Barrier',
    source: 'Zettili 2e Chapter 4 Problem 4.5',
    prompt: `<p>An electron with energy $E = 2.0\\text{ eV}$ encounters a rectangular potential barrier of height $V_0 = 5.0\\text{ eV}$ and width $a = 0.3\\text{ nm}$.<br>
(a) Calculate the attenuation constant $\\kappa$ and the parameter $\\kappa a$.<br>
(b) Estimate the transmission probability $T$ using the wide-barrier approximation.</p>`,
    tests: ['c.2.6.2'],
    approach: '<p>Calculate $\\kappa = \\frac{\\sqrt{2m(V_0 - E)}}{\\hbar}$, check $\\kappa a \\gg 1$, and apply $T \\approx 16\\frac{E}{V_0}(1 - \\frac{E}{V_0})e^{-2\\kappa a}$.</p>',
    solution: `<p><b>(a) Decay Constant $\\kappa$:</b><br>
$$V_0 - E = 5.0 - 2.0 = 3.0\\text{ eV} = 4.806 \\times 10^{-19}\\text{ J}$$
$$\\kappa = \\frac{\\sqrt{2(9.109 \\times 10^{-31})(4.806 \\times 10^{-19})}}{1.055 \\times 10^{-34}} = \\frac{9.358 \\times 10^{-25}}{1.055 \\times 10^{-34}} \\approx 8.87 \\times 10^9\\text{ m}^{-1}$$
$$\\kappa a = (8.87 \\times 10^9\\text{ m}^{-1})(0.3 \\times 10^{-9}\\text{ m}) \\approx 2.661$$
Since $\\kappa a > 2$, the wide-barrier approximation is valid.</p>
<p><b>(b) Transmission Probability $T$:</b><br>
$$T_0 = 16 \\frac{E}{V_0} \\left(1 - \\frac{E}{V_0}\\right) = 16 \\left(\\frac{2}{5}\\right) \\left(1 - \\frac{2}{5}\\right) = 16 \\times 0.4 \\times 0.6 = 3.84$$
The exponential attenuation factor is:
$$e^{-2\\kappa a} = e^{-2(2.661)} = e^{-5.322} \\approx 4.88 \\times 10^{-3}$$
Therefore:
$$T \\approx T_0 e^{-2\\kappa a} = 3.84 \\times 4.88 \\times 10^{-3} \\approx 1.87 \\times 10^{-2} \\quad (1.87\\%)$$
Approximately $1.9\\%$ of the electrons tunnel successfully through the $0.3\\text{ nm}$ barrier.</p>`,
    trap: 'Neglecting the prefactor T₀; although the exponential dominates, T₀ = 3.84 introduces a factor of nearly 4.'
  },
  {
    id: 'q.qm1.m2.12',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.6',
    marks: 4,
    title: 'Ramsauer–Townsend Resonant Transmission Energy',
    source: 'Zettili 2e Chapter 4 Problem 4.6',
    prompt: `<p>A beam of electrons is incident on a potential barrier of height $V_0 = 12.0\\text{ eV}$ and width $a = 0.20\\text{ nm}$. Find the minimum energy $E > V_0$ for which the barrier becomes completely transparent ($T = 1$).</p>`,
    tests: ['c.2.6.4'],
    approach: '<p>The resonance condition is $k_2 a = n\\pi$. The minimum non-trivial energy corresponds to $n = 1$.</p>',
    solution: `<p><b>Resonance Condition:</b><br>
Transmission is $100\\%$ ($T = 1$) when $\\sin(k_2 a) = 0$, which occurs for:
$$k_2 a = n\\pi \\qquad (n = 1, 2, 3, \\dots)$$
where $k_2 = \\frac{\\sqrt{2m(E - V_0)}}{\\hbar}$.<br>
Squaring both sides:
$$\\frac{2m(E - V_0)}{\\hbar^2} a^2 = n^2 \\pi^2 \\implies E_n = V_0 + \\frac{n^2 \\pi^2 \\hbar^2}{2m a^2}$$
For minimum energy above $V_0$, select $n = 1$:
$$E_1 = V_0 + \\frac{\\pi^2 \\hbar^2}{2m a^2}$$
Compute the energy quantum:
$$\\frac{\\pi^2 \\hbar^2}{2m a^2} = \\frac{\\pi^2 (1.055 \\times 10^{-34})^2}{2(9.109 \\times 10^{-31})(0.20 \\times 10^{-9})^2} = \\frac{1.099 \\times 10^{-67}}{7.287 \\times 10^{-49}} = 1.508 \\times 10^{-19}\\text{ J} \\approx 0.941\\text{ eV}$$
Therefore:
$$E = 12.0\\text{ eV} + 0.941\\text{ eV} = 12.941\\text{ eV}$$
At an incident energy of $12.94\\text{ eV}$, reflection is completely quenched and transmission is $100\\%$.</p>`,
    trap: 'Setting n = 0; n = 0 would mean E = V₀ where k₂ = 0, which yields finite reflection rather than a transmission peak.'
  },
  {
    id: 'q.qm1.m2.13',
    course: 'qm1',
    module: 'qm1.m2',
    sec: '2.1',
    marks: 4,
    title: 'Time Evolution of Momentum in a Non-Stationary State',
    source: 'Griffiths 3e §2.1 Problem 2.7',
    prompt: `<p>Prove that for a general non-stationary wave function $\\Psi(x,t) = \\sum c_n \\psi_n(x) e^{-iE_n t/\\hbar}$, the expectation value of momentum can be written as:
$$\\langle p \\rangle(t) = \\sum_{m > n} 2 \\, \\text{Re}[c_m^* c_n e^{i(E_m - E_n)t/\\hbar} p_{mn}]$$
where $p_{mn} = \\int \\psi_m^* \\hat{p} \\psi_n dx$. Deduce why $\\langle p \\rangle$ is necessarily zero in any stationary state.</p>`,
    tests: ['c.2.1.2', 'c.2.1.4'],
    approach: '<p>Expand $\\langle p \\rangle = \\int \\Psi^* \\hat{p} \\Psi dx$ using the double sum and separate diagonal ($m=n$) from off-diagonal ($m \\ne n$) terms.</p>',

/* ── src/core.dom.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   DOM + routing primitives. No framework: every view returns a real element.
   ══════════════════════════════════════════════════════════════════════════ */

const DOM = (function () {

  const HTML_TAG_NAMES = 'p|b|i|u|strong|em|code|ul|ol|li|br|hr|table|tr|td|th|tbody|thead|h[1-6]|blockquote|pre|small|sub|sup|div|span|a|button|nav|svg|path|circle';
  const VALID_HTML_TAG_RE = new RegExp('</?(?:' + HTML_TAG_NAMES + ')(?=[\\s/>])[^>]*>', 'gi');

  /* Protect mathematical inequalities (e.g. $x<y$, $u-\\varepsilon<s_\\varepsilon$, 1/n < x)
     so the browser HTML parser does not mistake "<" for an opening HTML tag. */
  function sanitizeMathHtml(s) {
    if (typeof s !== 'string' || s.indexOf('<') === -1) return s;
    const tags = [];
    const masked = s.replace(VALID_HTML_TAG_RE, function (match) {
      tags.push(match);
      return '\x00TAG' + (tags.length - 1) + '\x00';
    });
    const safe = masked.replace(/</g, '&lt;');
    return safe.replace(/\x00TAG(\d+)\x00/g, function (_, idx) {
      return tags[parseInt(idx, 10)];
    });
  }

  /* Turn concept IDs like <code>c.2.3.1</code>, $c.3.4.2$, or raw c.2.3.1 references into
     clickable links labeled with their section number and concept name. */
  function linkifyConcepts(s) {
    if (typeof s !== 'string') return s;
    if (s.indexOf('<code>') === -1 && s.indexOf('$c.') === -1 && s.indexOf('c.') === -1 && s.indexOf('s.') === -1) return s;
    const re = /<code>(c\.[0-9]+[a-z0-9.]*|s\.[a-z0-9-]+)<\/code>|\$((?:c\.[0-9]+[a-z0-9.]*|s\.[a-z0-9-]+))\$|(?<=[\s(])(c\.[0-9]+\.[0-9]+[a-z0-9.]*)(?=[\s.,;:)])/g;
    return s.replace(re, function (match, g1, g2, g3) {
      const id = g1 || g2 || g3;
      const c = (typeof Pool !== 'undefined' && Pool.concept) ? Pool.concept(id) : null;
      if (!c) return match;
      const cleanTitle = (c.title || id).split(';')[0].trim();
      const label = c.sec ? ('§' + c.sec + ' ' + cleanTitle) : cleanTitle;
      const secTitle = (c.sec && typeof Pool.sectionTitle === 'function') ? Pool.sectionTitle(c.sec) : null;
      const fullDesc = (secTitle ? ('Section ' + c.sec + ': ' + secTitle + ' — ') : '') + (c.title || id);
      const escTitle = fullDesc.replace(/"/g, '&quot;');
      return '<a class="concept-ref" href="#/note/' + id + '" title="' + escTitle + '">' + label + '</a>';
    });
  }

  /* Convert markdown bold (**text**) and italics (*text*) to HTML <b> and <i> tags,
     leaving math spans ($...$ and $$...$$) and HTML tags intact. */
  function formatMarkdown(s) {
    if (typeof s !== 'string' || (s.indexOf('**') === -1 && s.indexOf('*') === -1)) return s;
    const tokens = [];
    const masked = s.replace(/\$\$[\s\S]+?\$\$|\$[^$]+?\$|<\/?[a-zA-Z][^>]*>/g, function (m) {
      tokens.push(m);
      return '\x00M' + (tokens.length - 1) + '\x00';
    });
    let res = masked
      .replace(/\*\*\*([^*]+?)\*\*\*/g, '<b><i>$1</i></b>')
      .replace(/\*\*([^*]+?)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])\*([^*\n]+?)\*(?=[\s.,;:)!?]|$)/g, '$1<i>$2</i>');
    return res.replace(/\x00M(\d+)\x00/g, function (_, idx) {
      return tokens[parseInt(idx, 10)];
    });
  }

  /* el('div', {class, text, html, on:{click}, ...attrs}, children) */
  function el(tag, attrs, kids) {
    const node = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = sanitizeMathHtml(linkifyConcepts(formatMarkdown(v)));            /* authored content only */
      else if (k === 'on') for (const ev in v) node.addEventListener(ev, v[ev]);
      else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
      else node.setAttribute(k, v === true ? '' : v);
    }
    add(node, kids);
    return node;
  }

  function add(node, kids) {
    if (kids == null || kids === false) return node;
    if (Array.isArray(kids)) { kids.forEach(k => add(node, k)); return node; }
    node.appendChild(kids instanceof Node ? kids : document.createTextNode(String(kids)));
    return node;
  }

  function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); return node; }

  /* polite screen-reader announcements (route changes, verdicts, saves) */
  function announce(msg) {
    const live = document.getElementById('live');
    if (!live) return;
    live.textContent = '';
    window.setTimeout(() => { live.textContent = msg; }, 30);
  }

  /* ── icons ───────────────────────────────────────────────────────────────
     Material Symbols, as a ligature font. Emoji used to stand in for icons
     here (💡, 👁, ⚠, ✓) and they were the wrong tool twice over: every
     platform draws them differently, and they ignore the theme — a yellow
     bulb on a dark card is not a design, it is a default. A ligature glyph
     inherits colour and size from its parent like any other text.

     `mi('bolt')` renders the icon named `bolt`. `mi('bolt', 'fill')` renders
     its filled variant. Names come from fonts.google.com/icons. */
  function mi(name, cls) {
    return el('span', {
      class: 'mi' + (cls ? ' ' + cls : ''), 'aria-hidden': 'true', translate: 'no', text: name
    });
  }

  /* A handful of shapes are still hand-drawn SVG, because they are figures
     rather than icons: the tree chevron animates its own rotation and has to
     line up with a text baseline at three different sizes. */
  const ICONS = {
    chev: 'M9 5l7 7-7 7'
  };
  function icon(name, size, cls) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('aria-hidden', 'true');
    if (cls) svg.setAttribute('class', cls);
    if (size) {
      svg.setAttribute('width', size);
      svg.setAttribute('height', size);
      svg.setAttribute('fill', 'none');
      svg.setAttribute('stroke', 'currentColor');
      svg.setAttribute('stroke-width', '1.7');
      svg.setAttribute('stroke-linecap', 'round');
      svg.setAttribute('stroke-linejoin', 'round');
    }
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', ICONS[name] || '');
    svg.appendChild(p);
    return svg;
  }

  function debounce(fn, ms) {
    let t = 0;
    return function () {
      const a = arguments, self = this;
      window.clearTimeout(t);
      t = window.setTimeout(() => fn.apply(self, a), ms);
    };
  }

  const plural = (n, one, many) => n === 1 ? one : (many || one + 's');
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;

  const reduced = () => !!(window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches);

  /* entrance animation, staggered by position — set --i, the CSS does the rest */
  function stagger(node, cls) {
    if (!node) return node;
    node.classList.add(cls || 'stagger');
    Array.prototype.forEach.call(node.children, function (kid, i) {
      kid.style.setProperty('--i', Math.min(i, 12));
    });
    return node;
  }

  /* SVG element builder — figures are hand-drawn, so this stays tiny */
  const NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs, kids) {
    const node = document.createElementNS(NS, tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'text') node.textContent = v;
      else node.setAttribute(k, v === true ? '' : v);
    }
    if (kids) (Array.isArray(kids) ? kids : [kids]).forEach(function (kid) {
      if (kid) node.appendChild(kid);
    });
    return node;
  }

  return { el, add, clear, announce, icon, mi, debounce, plural, pct, reduced, stagger, svg };
})();

/* ── hash router ─────────────────────────────────────────────────────────── */
const Router = (function () {
  let handler = null;
  /* How many route changes this visit has made. `history.back()` is only worth
     offering while there is somewhere of ours to go back TO — otherwise the
     browser walks out of the app entirely, which is not what a back button
     inside a toolbar is understood to mean. */
  let depth = 0;

  function current() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [p, q] = raw.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    new URLSearchParams(q || '').forEach((v, k) => { query[k] = v; });
    return { name: parts[0] || 'home', args: parts.slice(1), query, raw: p };
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', function () {
      depth += 1;
      handler(current());
      listeners.forEach(function (f) { try { f(current()); } catch (e) { /* never break a route */ } });
    });
    handler(current());
  }

  const listeners = [];
  const onRoute = fn => listeners.push(fn);

  /* One step back through OUR history, or home when there is none. */
  function back() {
    if (depth > 0) { depth -= 2; window.history.back(); return true; }
    if (current().name !== 'home') { go('home'); return true; }
    return false;
  }
  const canBack = () => depth > 0 || current().name !== 'home';

  const go = hash => { location.hash = hash.charAt(0) === '#' ? hash : '#/' + hash.replace(/^\//, ''); };
  const href = hash => '#/' + String(hash).replace(/^\//, '');
  const reload = () => handler && handler(current());

  return { current, start, go, href, reload, back, canBack, onRoute };
})();


/* ── src/core.tex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   MathJax plumbing.

   Two jobs: typeset authored content after a view is mounted, and render the
   learner's own LaTeX fragment safely. "Safely" means a malformed fragment
   never throws into the view, never wipes the last good render, and reports a
   human-readable reason. MathJax's formatError hook (set in index.html) parks
   the message on window.__texError; we read and clear it around each run.
   ══════════════════════════════════════════════════════════════════════════ */

const Tex = (function () {

  let chain = Promise.resolve();

  const available = () => !!(window.MathJax && window.MathJax.typesetPromise);

  /* Serialise every typeset call: MathJax is single-threaded and we need the
     error hook to belong to a known run. */
  function run(job) {
    chain = chain.then(job).catch(err => {
      console.warn('[tex]', err && err.message);
    });
    return chain;
  }

  /* Typeset authored HTML already in the DOM. */
  function typeset(nodes) {
    if (!available()) return Promise.resolve();
    const list = Array.isArray(nodes) ? nodes : [nodes];
    return run(() => window.MathJax.typesetPromise(list));
  }

  /* Render one learner fragment into `target`.
     Resolves {ok, error}. On failure `target` keeps whatever it had. */
  function renderFragment(target, latex, opts) {
    const display = !opts || opts.display !== false;
    const src = String(latex == null ? '' : latex);

    if (!src.trim()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'ph', text: opts && opts.placeholder
        ? opts.placeholder : 'Your rendered mathematics will appear here.' }));
      return Promise.resolve({ ok: true, empty: true });
    }
    if (!available()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'mono small', text: src }));
      return Promise.resolve({ ok: false, error: 'MathJax is not loaded — showing LaTeX source.' });
    }

    return run(function () {
      const stage = document.createElement('div');
      stage.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      stage.textContent = display ? '\\[' + src + '\\]' : '\\(' + src + '\\)';
      document.body.appendChild(stage);
      window.__texError = null;

      return window.MathJax.typesetPromise([stage]).then(function () {
        const err = window.__texError;
        window.__texError = null;

        /* Three ways a fragment can be bad, and all three must be caught:
           a TeX error raised through formatError; an error node rendered in
           place; or no maths at all, which is what an unclosed group does —
           MathJax swallows the closing delimiter and finds nothing to typeset. */
        const errNode = stage.querySelector('mjx-merror, [data-mjx-error]');
        const produced = stage.querySelector('mjx-container');
        const why = err
          || (errNode && (errNode.getAttribute('data-mjx-error') || errNode.textContent))
          || (!produced && 'nothing came out — check for an unmatched { or }, and that every command is complete.');

        if (why) { stage.remove(); return { ok: false, error: String(why) }; }

        /* MathJax's noundefined package prints an unknown macro in red rather
           than failing. That is the right behaviour — the rest of the line
           still renders — but the learner deserves to be told. */
        const unknown = stage.querySelector('[style*="color: red"]');
        const hint = unknown
          ? 'It renders, but the part shown in red is not a command MathJax knows — check that spelling.'
          : null;

        DOM.clear(target);
        while (stage.firstChild) target.appendChild(stage.firstChild);
        stage.remove();
        return { ok: true, hint: hint };
      }, function (e) {
        stage.remove();
        window.__texError = null;
        return { ok: false, error: (e && e.message) || 'LaTeX could not be rendered.' };
      });
    });
  }

  /* Wait once for MathJax, so the first view is not typeset into the void. */
  function ready() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      return window.MathJax.startup.promise.catch(() => {});
    }
    return Promise.resolve();
  }

  return { typeset, renderFragment, ready, available };
})();


/* ── src/core.md.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Markdown, line by line, with the maths left alone.

   The writing workspace is a live markdown editor whose maths is written
   inline as $…$ and $$…$$. So the one thing this renderer must never do is
   touch what is between the dollars: `\text{a*b*c}` is not italics, and a
   backslash is not an escape character to markdown here.

   The method is therefore: cut the source into maths and prose segments
   first, run the inline rules over prose only, then reassemble. Every block
   is one line — the editor renders each line into its own frame, so there is
   no multi-line block state to carry.

   AUTO-MATH. Dollar signs are bookkeeping, and bookkeeping is what stops a
   sentence being written at speed. So a LaTeX command met in the middle of
   prose no longer has to be fenced: "I love \\frac{1}{2} in fact" typesets the
   fraction and leaves the words alone. `autoMath` finds each run that is
   unambiguously mathematics — it has to CONTAIN a backslash command, a
   superscript or a subscript, never merely look numeric — grows it over the
   operands and operators around it, and stops at the first real word. The run
   is stashed behind a placeholder before the markdown rules run, so `_` inside
   a subscript is never mistaken for italics and `<` is never escaped.

   Explicit `$…$` still works and still wins: segments() takes those out first,
   so anything already fenced is left exactly as written.
   ══════════════════════════════════════════════════════════════════════════ */

const Markdown = (function () {

  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* Split on $$…$$ first, then $…$, so a display block is never mistaken for
     two inline ones. Returns [{math:false,t}|{math:true,t}]. */
  function segments(src) {
    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;
  }

  /* Inline rules, prose only. Code spans are pulled out first so that what is
     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);
      return '\x00C' + (code.length - 1) + '\x00';
    });

    s = esc(s)
      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em>$2</em>')
      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')
      .replace(/~~([^~]+)~~/g, '<s>$1</s>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" rel="noreferrer">$1</a>');

    return s.replace(/\x00C(\d+)\x00/g, (_, i) => '<code>' + esc(code[+i]) + '</code>');
  }

  /* ── auto-math ───────────────────────────────────────────────────────────
     Scan a PROSE segment (everything already fenced in $…$ has been taken out)
     and wrap each mathematical run in \\( … \\).

     What starts a run: a backslash command, or a token carrying ^ or _.
     What continues one: single-letter variables, numbers, operators, balanced
     braces and the spaces between them.
     What ends one: a word of two or more letters that is not a command, a
     sentence-ending punctuation mark, or the end of the line.

     The two-letter rule is the whole safety margin. "in fact" ends the run;
     "x + 1" does not. A lone word like "a" or "I" can be swallowed into a run
     that is already open, which is the right call inside `f(a) = b` and a
     harmless one elsewhere — it renders as italic a, which is what someone
     writing mathematics meant anyway. */

  /* `*` is deliberately absent: it is markdown emphasis far more often than it
     is multiplication, and LaTeX writes a product as \\cdot or \\times anyway. */
  const OPS = '+-/=<>()[]|,;:!\'~^_&.';
  const isOp = ch => OPS.indexOf(ch) >= 0;
  const isSpace = ch => ch === ' ' || ch === '\t';
  const isAlnum = ch => /[0-9A-Za-z]/.test(ch);

  /* a balanced {...} starting at i, or -1 */
  function brace(src, i) {
    if (src[i] !== '{') return -1;
    let depth = 0;
    for (let j = i; j < src.length; j++) {
      if (src[j] === '\\') { j += 1; continue; }
      if (src[j] === '{') depth += 1;
      else if (src[j] === '}') { depth -= 1; if (!depth) return j + 1; }
    }
    return -1;
  }

  /* one math token at i: returns the index after it, or -1 */
  function token(src, i) {
    const ch = src[i];
    if (ch === '\\') {
      const m = /^\\([a-zA-Z]+|[{}$%&#_|,;: ])/.exec(src.slice(i));
      return m ? i + m[0].length : -1;
    }
    if (ch === '{') return brace(src, i);
    if (ch === '^' || ch === '_') {
      const after = i + 1;
      const b = brace(src, after);
      if (b > 0) return b;
      if (after < src.length && isAlnum(src[after])) return after + 1;
      return -1;
    }
    if (/[0-9]/.test(ch)) {
      let j = i;
      while (j < src.length && /[0-9.]/.test(src[j])) j += 1;
      return j;
    }
    if (/[A-Za-z]/.test(ch)) {
      /* a single letter is a variable; two or more is a word, and a word ends
         the run — unless it is the argument of a command, which the brace
         branch has already eaten */
      return /[A-Za-z]/.test(src[i + 1] || '') ? -1 : i + 1;
    }
    if (isOp(ch)) return i + 1;
    return -1;
  }

  const STRONG = /\\[a-zA-Z]|[\^_]/;   /* what makes a run unmistakably maths */
  const TRAIL = /[.,;:!?\s]+$/;

  /* Is this ^ or _ a script, or is it punctuation in a word?
     `x_n` and `x^{2}` are scripts. `snake_case` is not: its base letter is part
     of a word. `_italic_` is not: it has no base at all. That one test is what
     lets markdown emphasis and auto-math share a line. */
  function isScript(s, i) {
    const prev = s[i - 1];
    if (prev == null) return false;
    if (/[A-Za-z]/.test(prev)) { if (/[A-Za-z]/.test(s[i - 2] || '')) return false; }
    else if (!/[0-9})\]]/.test(prev)) return false;
    const nx = s[i + 1];
    if (nx === '{') return brace(s, i + 1) > 0;
    if (!/[0-9A-Za-z]/.test(nx || '')) return false;
    return !/[0-9A-Za-z]/.test(s[i + 2] || '');
  }

  /* `*` is absent from both operator sets on purpose: it is markdown emphasis
     far more often than multiplication, and LaTeX writes a product as \cdot
     or \times anyway. */
  const BACK_OPS = '+-/=<>|&([{~^_';

  /* The math token that ENDS at k, as a start index, or -1. Used to grow a run
     leftwards so that `f(x) = \sqrt{x}` is one expression rather than three
     words and a fraction. */
  function tokenBack(s, k, floor) {
    if (k <= floor) return -1;
    const ch = s[k - 1];
    if (ch === '\x00') return -1;
    if (ch === '}' || ch === ')' || ch === ']') {
      const open = ch === '}' ? '{' : ch === ')' ? '(' : '[';
      let depth = 0;
      for (let j = k - 1; j >= floor; j--) {
        if (s[j] === ch) depth += 1;
        else if (s[j] === open) { depth -= 1; if (!depth) return j; }
      }
      return -1;
    }
    if (/[0-9]/.test(ch)) {
      let j = k;
      while (j - 1 > floor && /[0-9.]/.test(s[j - 2]) && /[0-9]/.test(s[j - 1])) j -= 1;
      while (j - 1 >= floor && /[0-9]/.test(s[j - 1])) j -= 1;
      return j;
    }
    if (/[A-Za-z]/.test(ch)) {
      if (/[A-Za-z]/.test(s[k - 2] || '')) return -1;   /* part of a word */
      return k - 1;
    }
    if (BACK_OPS.indexOf(ch) >= 0) return k - 1;
    return -1;
  }

  function extendLeft(s, from, floor) {
    let a = from;
    for (;;) {
      let k = a;
      while (k > floor && isSpace(s[k - 1])) k -= 1;
      if (k <= floor) break;
      const t = tokenBack(s, k, floor);
      if (t < 0) break;
      a = t;
    }
    return a;
  }

  function extendRight(s, from) {
    let j = from;
    for (;;) {
      let k = j;
      while (k < s.length && isSpace(s[k])) k += 1;
      if (k >= s.length) break;
      const next = token(s, k);
      if (next < 0) break;
      j = next;
    }
    return j;
  }

  /* Find every mathematical run in a prose segment and fence it in \( … \).
     Runs are collected as ranges first and merged, so two anchors in the same
     expression (`\lim_{n\to\infty} x_n`) produce ONE fence rather than two
     that overlap. */
  function autoMath(src) {
    const s = String(src);
    if (!STRONG.test(s)) return { text: s, stash: [] };

    /* regions that are verbatim and must never be fenced */
    const skip = [];
    for (let i = 0; i < s.length; i++) {
      if (s[i] !== '`') continue;
      const close = s.indexOf('`', i + 1);
      const end = close < 0 ? s.length : close + 1;
      skip.push([i, end]);
      i = end - 1;
    }
    const inSkip = i => skip.some(r => i >= r[0] && i < r[1]);
    const floorFor = i => {
      let f = -1;
      skip.forEach(function (r) { if (r[1] <= i && r[1] - 1 > f) f = r[1] - 1; });
      return f;
    };

    const runs = [];
    for (let i = 0; i < s.length; i++) {
      if (inSkip(i)) continue;
      const isCmd = s[i] === '\\' && /[a-zA-Z]/.test(s[i + 1] || '');
      const isScr = (s[i] === '^' || s[i] === '_') && isScript(s, i);
      if (!isCmd && !isScr) continue;
      if (runs.length && i < runs[runs.length - 1][1]) continue;   /* already inside one */

      const floor = Math.max(floorFor(i), runs.length ? runs[runs.length - 1][1] - 1 : -1);
      const a = extendLeft(s, i, floor);
      const b = extendRight(s, isCmd ? (token(s, i) < 0 ? i + 1 : token(s, i)) : i + 1);
      if (runs.length && a <= runs[runs.length - 1][1]) runs[runs.length - 1][1] = Math.max(b, runs[runs.length - 1][1]);
      else runs.push([a, b]);
      i = b - 1;
    }

    if (!runs.length) return { text: s, stash: [] };

    const stash = [];
    let out = '', at = 0;
    runs.forEach(function (r) {
      out += s.slice(at, r[0]);
      let run = s.slice(r[0], r[1]);
      const trail = TRAIL.exec(run);
      let tail = '';
      if (trail && trail.index > 0) { tail = trail[0]; run = run.slice(0, trail.index); }
      if (!run.trim()) { out += s.slice(r[0], r[1]); at = r[1]; return; }
      stash.push('\\(' + run + '\\)');
      out += '\x00M' + (stash.length - 1) + '\x00' + tail;
      at = r[1];
    });
    out += s.slice(at);
    return { text: out, stash: stash };
  }

  /* prose through the inline rules, maths through untouched */
  function spans(src) {
    return segments(src).map(function (seg) {
      if (seg.math) return seg.t;
      const auto = autoMath(seg.t);
      const html = inline(auto.text);
      if (!auto.stash.length) return html;
      return html.replace(/\x00M(\d+)\x00/g, (_, n) => auto.stash[+n]);
    }).join('');
  }

  /* One source line -> one HTML block. */
  function line(src) {
    const raw = String(src == null ? '' : src);
    const t = raw.trim();
    if (!t) return '';

    if (/^(---|\*\*\*|___)\s*$/.test(t)) return '<hr>';

    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) {
      const n = Math.min(h[1].length + 1, 5);
      return '<h' + n + ' class="md-h">' + spans(h[2]) + '</h' + n + '>';
    }

    const q = /^>\s?(.*)$/.exec(t);
    if (q) return '<blockquote class="md-q">' + spans(q[1]) + '</blockquote>';

    const ul = /^[-*+]\s+(.*)$/.exec(t);
    if (ul) return '<ul class="md-l"><li>' + spans(ul[1]) + '</li></ul>';

    const ol = /^(\d+)[.)]\s+(.*)$/.exec(t);
    if (ol) return '<ol class="md-l" start="' + ol[1] + '"><li>' + spans(ol[2]) + '</li></ol>';

    return '<p class="md-p">' + spans(raw) + '</p>';
  }

  /* Does this line carry an explicit maths delimiter? A maths-first box uses
     this to decide whether a delimiter-free line is bare LaTeX. It stays
     dollar-only on purpose: auto-math is for MIXED lines, and a maths-first box
     wants the whole line set as display maths, not one fenced run inside it. */
  const hasMath = src => /\$/.test(String(src || ''));

  /* Whole document, for export and for the read-only preview. */
  const doc = src => String(src || '').split('\n').map(line).join('\n');

  return { line, doc, hasMath, inline, segments, autoMath };
})();


/* ── src/core.store.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Progress store.

   Three things are tracked, and they are kept apart on purpose:

     completion   Level 1. You have encountered the material. Never evidence
                  of recall.
     proof work   Level 2. You have worked a proof through yourself. Awarded
                  per task, never for opening the note.
     first try    the FIRST recorded attempt at a card or a question. Later
                  attempts are allowed but never overwrite the first, because
                  the first attempt is the only honest measurement.

   The shape is built for merging. Two devices can both make progress offline,
   so every mutation is timestamped and every removal leaves a tombstone —
   merge(a,b) == merge(b,a), and merging twice changes nothing. core.sync.js
   depends on that and on nothing else.

   Storage is localStorage with an in-memory fallback so a locked-down browser
   degrades to a working-but-forgetful session instead of a broken one.
   ══════════════════════════════════════════════════════════════════════════ */

const Store = (function () {

  const KEY = 'ssc4.qm.v1';
  const EMPTY = {
    v: 2,
    done: {}, undone: {},        /* Level 1 completion + tombstones */
    proofs: {}, unproofs: {},    /* proof + exercise work (L2/L3) + tombstones */
    cards: {}, omr: {}, write: {},
    prefs: {}, prefsAt: {},
    updated: 0
  };

  let volatile = false;
  let state = load();
  const listeners = [];

  function blank() { return JSON.parse(JSON.stringify(EMPTY)); }

  /* v1 had no tombstones, no proof map and no per-key preference stamps.
     Everything it did have keeps its meaning, so the upgrade is a fill-in. */
  function upgrade(raw) {
    const s = Object.assign(blank(), raw || {});
    ['done', 'undone', 'proofs', 'unproofs', 'cards', 'omr', 'write', 'prefs', 'prefsAt']
      .forEach(function (k) { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
    s.v = 2;
    if (!s.updated) s.updated = Date.now();
    return s;
  }

  function load() {
    try {
      const raw = window.localStorage.getItem(KEY);
      if (!raw) return blank();
      return upgrade(JSON.parse(raw));
    } catch (e) {
      volatile = true;
      return blank();
    }
  }

  function write() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { volatile = true; }
  }

  const flush = DOM.debounce(write, 250);

  /* Write immediately, skipping the debounce. Anything the very next page load
     depends on has to go through here: a debounced write is still pending when
     `location.reload()` tears the page down, and signing in or out and then
     reloading would land back where you started. */
  function flushNow() { write(); }

  function save(quiet) {
    state.updated = Date.now();
    flush();
    if (!quiet) listeners.forEach(function (fn) { try { fn(); } catch (e) { /* a listener must never break a save */ } });
  }

  /* core.sync.js subscribes here; nothing else needs to. */
  function onChange(fn) { listeners.push(fn); }

  /* ── a tick with a tombstone, used by completion and by proof work ────── */
  function flag(on, off, id, want) {
    const now = Date.now();
    if (want) { state[on][id] = now; delete state[off][id]; }
    else { state[off][id] = now; delete state[on][id]; }
    save();
    return !!state[on][id];
  }

  /* ── completion (Level 1) ────────────────────────────────────────────── */
  const isDone = id => !!state.done[id];
  const setDone = (id, on) => flag('done', 'undone', id, on);

  /* Tick a whole list in one write — the prerequisite cascade. Returns the
     ids that actually changed, so the caller can report honestly. */
  function setDoneMany(ids, on) {
    const now = Date.now();
    const hit = [];
    (ids || []).forEach(function (id) {
      if (!!state.done[id] === !!on) return;
      hit.push(id);
      if (on) { state.done[id] = now; delete state.undone[id]; }
      else { state.undone[id] = now; delete state.done[id]; }
    });
    if (hit.length) save();
    return hit;
  }

  /* ── task work (Levels 2 and 3) ──────────────────────────────────────────
     One flag map for "I produced this myself", under two kinds of key:
       '<conceptId>'      a proof worked through          — earns level 2
       'w:<questionId>'   a written exercise worked out   — earns level 3
     They share a map because they are the same kind of claim and merge the
     same way; core.progress.js is what gives each key its meaning. */
  const isProofDone = id => !!state.proofs[id];
  const setProofDone = (id, on) => flag('proofs', 'unproofs', id, on);

  /* ── recall cards ────────────────────────────────────────────────────── */
  /* grade: 'got' | 'partly' | 'missed'

     `box` is the Leitner box the reel schedules from: it rises when you state
     a card, steps back when you half-state it and resets when you miss it.
     The interval each box buys is core.progress.js's business — this only has
     to store the number and, critically, MERGE it (see mergeAttempts). */
  const card = id => state.cards[id] || null;
  function gradeCard(id, grade) {
    const rec = state.cards[id] || (state.cards[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = grade;
    rec.lastAt = Date.now();
    rec.box = Progress.nextBox(rec.box, grade);
    if (!rec.first) { rec.first = grade; rec.firstAt = rec.lastAt; }  /* first attempt is final */
    save();
    return rec;
  }

  /* ── objective questions ─────────────────────────────────────────────── */
  const omr = id => state.omr[id] || null;
  function lockOmr(id, result) {
    const rec = state.omr[id] || (state.omr[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = { given: result.given, verdict: result.verdict, ms: result.ms, at: Date.now() };
    if (!rec.first) rec.first = rec.last;
    save();
    return rec;
  }

  /* ── writing drafts ──────────────────────────────────────────────────── */
  const draft = cid => (state.write[cid] && state.write[cid].tex) || '';
  function saveDraft(cid, tex) {
    if (!tex.trim()) delete state.write[cid];
    else state.write[cid] = { tex: tex, at: Date.now() };
    save();
  }

  /* ── preferences ─────────────────────────────────────────────────────── */
  const pref = (k, d) => (k in state.prefs ? state.prefs[k] : d);
  function setPref(k, v) {
    state.prefs[k] = v;
    state.prefsAt[k] = Date.now();
    save();
    return v;
  }

  /* ── the mastery level is no longer stored ────────────────────────
     It used to be a per-course switch with an unlock, and pressing it moved
     the goalposts under work that was already finished. The level is now
     DERIVED from what has actually been done — see core.progress.js — so there
     is nothing here to set. The old 'level:<course>' and 'level2:<course>'
     preferences are left where they are: they are inert, and deleting them
     would only make two devices argue about a key neither of them reads. */

  /* ── who is signed in ────────────────────────────────────────────────────
     Name and roll number are the credentials AND the sync key. They are a pass
     key, not a password, and every surface that shows them says so. */
  const identity = () => ({
    name: pref('syncName', ''),
    roll: pref('syncRoll', '')
  });
  const signedIn = () => {
    const id = identity();
    return !!(String(id.name).trim() && String(id.roll).trim());
  };
  function signIn(name, roll) {
    setPref('syncName', String(name || '').trim());
    setPref('syncRoll', String(roll || '').trim());
    flushNow();
    return signedIn();
  }
  function signOut() {
    setPref('syncName', '');
    setPref('syncRoll', '');
    flushNow();
  }

  /* ── aggregate stats over a given universe of ids ────────────────────── */
  function summary(conceptIds, cardIds, omrIds, proofIds) {
    const notes = conceptIds.filter(isDone).length;
    let tried = 0, got = 0, partly = 0;
    cardIds.forEach(function (id) {
      const r = state.cards[id];
      if (!r || !r.first) return;
      tried += 1;
      if (r.first === 'got') got += 1;
      else if (r.first === 'partly') partly += 1;
    });
    let locked = 0, right = 0, part = 0;
    omrIds.forEach(function (id) {
      const r = state.omr[id];
      if (!r || !r.first) return;
      locked += 1;
      if (r.first.verdict === 'correct') right += 1;
      else if (r.first.verdict === 'partial') part += 1;
    });
    const pf = proofIds || [];
    return {
      notes: { done: notes, total: conceptIds.length },
      cards: { tried: tried, got: got, partly: partly, total: cardIds.length },
      omr: { locked: locked, correct: right, partial: part, total: omrIds.length },
      proofs: { done: pf.filter(isProofDone).length, total: pf.length }
    };
  }

  /* ── merging two devices ─────────────────────────────────────────────────
     Loss-free and order-independent. The rules follow from what each field
     means rather than from a single "newest wins": a first attempt is a
     measurement, so the EARLIER one survives; a tick is a decision, so the
     LATER one survives. */
  function mergeFlags(a, b, ta, tb) {
    const on = {}, off = {};
    [a, b].forEach(src => { for (const k in (src || {})) if (!(on[k] >= src[k])) on[k] = src[k]; });
    [ta, tb].forEach(src => { for (const k in (src || {})) if (!(off[k] >= src[k])) off[k] = src[k]; });
    for (const k in off) {
      if (!on[k]) continue;
      if (off[k] > on[k]) delete on[k];   /* un-ticked after the tick */
      else delete off[k];                 /* tombstone spent */
    }
    return { on: on, off: off };
  }

  function mergeAttempts(A, B, firstKey) {
    const out = {};
    const ids = {};
    for (const k in (A || {})) ids[k] = true;
    for (const k in (B || {})) ids[k] = true;
    for (const id in ids) {
      const x = (A || {})[id], y = (B || {})[id];
      if (!x || !y) { out[id] = JSON.parse(JSON.stringify(x || y)); continue; }
      const rec = { tries: Math.max(x.tries || 0, y.tries || 0) };

      /* the honest first attempt is the earliest one either device saw */
      const fx = x.first ? (x.firstAt || (x.first.at || 0)) : Infinity;
      const fy = y.first ? (y.firstAt || (y.first.at || 0)) : Infinity;
      const first = fx <= fy ? x : y;
      if (first.first) {
        rec.first = first.first;
        if (first.firstAt) rec.firstAt = first.firstAt;
      }

      /* the latest pass is the one worth showing */
      const lx = x.lastAt || (x.last && x.last.at) || 0;
      const ly = y.lastAt || (y.last && y.last.at) || 0;
      const last = lx >= ly ? x : y;
      if (last.last) {
        rec.last = last.last;
        if (last.lastAt) rec.lastAt = last.lastAt;
      }
      /* The schedule travels with the latest pass. Rebuilding the record field
         by field is what drops anything not named here, so a new field has to
         be added in BOTH places or every sync quietly resets it. */
      if (last.box != null) rec.box = last.box;
      out[id] = rec;
    }
    return out;
  }

  function mergeStates(A, B) {
    A = upgrade(A); B = upgrade(B);
    const done = mergeFlags(A.done, B.done, A.undone, B.undone);
    const proof = mergeFlags(A.proofs, B.proofs, A.unproofs, B.unproofs);

    const write = {};
    [A.write, B.write].forEach(function (src) {
      for (const k in (src || {})) {
        if (!write[k] || (src[k].at || 0) > (write[k].at || 0)) write[k] = src[k];
      }
    });

    /* preferences are per-key: the device that set it most recently wins, and
       a key with no stamp yields to one that has it */
    const prefs = {}, prefsAt = {};
    [[A.prefs, A.prefsAt, A.updated], [B.prefs, B.prefsAt, B.updated]].forEach(function (p) {
      const src = p[0] || {}, at = p[1] || {}, fallback = p[2] || 0;
      for (const k in src) {
        const t = at[k] || fallback;
        if (!(k in prefs) || t >= (prefsAt[k] || 0)) { prefs[k] = src[k]; prefsAt[k] = t; }
      }
    });

    return {
      v: 2,
      done: done.on, undone: done.off,
      proofs: proof.on, unproofs: proof.off,
      cards: mergeAttempts(A.cards, B.cards),
      omr: mergeAttempts(A.omr, B.omr),
      write: write, prefs: prefs, prefsAt: prefsAt,
      updated: Math.max(A.updated || 0, B.updated || 0)
    };
  }

  /* Adopt a merged state wholesale. `quiet` keeps the sync listener from
     firing on the state it has just pulled. */
  function adopt(next, quiet) {
    state = upgrade(next);
    save(quiet);
    return state;
  }

  const snapshot = () => JSON.parse(JSON.stringify(state));
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function reset() { state = blank(); save(); }

  /* what the summary tiles count, so two callers cannot disagree */
  function tally() {
    return {
      notes: Object.keys(state.done).length,
      proofs: Object.keys(state.proofs).length,
      cards: Object.keys(state.cards).filter(k => state.cards[k].first).length,
      omr: Object.keys(state.omr).filter(k => state.omr[k].first).length
    };
  }

  return {
    isDone, setDone, setDoneMany,
    isProofDone, setProofDone,
    card, gradeCard, omr, lockOmr, draft, saveDraft,
    pref, setPref,
    identity, signedIn, signIn, signOut,
    summary, exportJSON, reset, tally,
    snapshot, adopt, mergeStates, onChange, flushNow,
    isVolatile: () => volatile
  };
})();


/* ── src/core.sync.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Multi-device sync.

   Firebase Realtime Database over plain REST — no SDK, no npm, no auth
   handshake, nothing to load before the app can start. One GET and one PUT.

   The key is the learner's name and roll number. That is a pass key, not a
   password: anyone who knows both can read and write that record, and the UI
   says so plainly rather than implying a login. It is the right trade for a
   personal study record that has to follow one person between a phone and a
   laptop with no account to create.

   Every sync MERGES before it writes (Store.mergeStates), so two devices that
   both worked offline lose nothing and the order they reconnect in does not
   matter. Overwriting instead of merging is how a week of work disappears.
   ══════════════════════════════════════════════════════════════════════════ */

const Sync = (function () {

  const DB = 'https://task-dominion-default-rtdb.asia-southeast1.firebasedatabase.app';

  /* Mock and validated pools keep SEPARATE STORES — progress and the sign-in
     register both. Their ids do not mean the same things, and a name typed
     into the test build must never appear in, or merge with, the real record.
     This is the only place that mapping is decided.

        live   ssc4_qm_v1        ssc4_qm_users_v1
        mock   ssc4_qm_mock_v1   ssc4_qm_users_mock_v1

     AGY owns the live pair; see "Publishing" in HOOK_agy.md. */
  const LIVE = () => (typeof DATA_KIND !== 'undefined' && DATA_KIND === 'live');
  const NS = () => LIVE() ? 'ssc4_qm_v1' : 'ssc4_qm_mock_v1';
  const USERS = () => LIVE() ? 'ssc4_qm_users_v1' : 'ssc4_qm_users_mock_v1';

  let syncing = false;
  let pushT = 0;
  let last = { at: 0, ok: null, msg: '' };
  const watchers = [];

  const slug = s => String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  /* name + roll -> one stable key. Both are required: a roll number alone
     collides across colleges, a name alone collides across people.

     The separator is '--', not '.': a Realtime Database key may not contain
     '.', '$', '#', '[', ']' or '/', and a dotted key is rejected outright with
     "Invalid token in path". slug() collapses runs of separators, so '--' can
     never be produced by either half and the split stays unambiguous. */
  function keyFor(name, roll) {
    const a = slug(name), b = slug(roll);
    return (a && b) ? a + '--' + b : '';
  }

  const identity = () => Store.identity();

  function key() {
    const id = identity();
    return keyFor(id.name, id.roll);
  }

  const on = () => !!key();
  const url = () => DB + '/' + NS() + '/' + encodeURIComponent(key()) + '.json';
  const userUrl = () => DB + '/' + USERS() + '/' + encodeURIComponent(key()) + '.json';

  function announce(ok, msg) {
    last = { at: Date.now(), ok: ok, msg: msg };
    watchers.forEach(function (fn) { try { fn(last); } catch (e) { /* a watcher must never break a sync */ } });
  }

  const watch = fn => { watchers.push(fn); return last; };
  const status = () => ({ on: on(), key: key(), syncing: syncing, last: last });

  /* ── the one operation: pull, merge, push ─────────────────────────────── */
  function now(opts) {
    const o = opts || {};
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not connected.' });
    if (syncing) return Promise.resolve({ ok: false, msg: 'Already syncing.' });
    if (!window.fetch) return Promise.resolve({ ok: false, msg: 'This browser cannot sync.' });

    syncing = true;
    announce(null, 'Syncing…');
    const before = Store.tally();

    return window.fetch(url(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (remote) {
        let rs = null;
        if (remote && typeof remote === 'object' && typeof remote.payload === 'string') {
          try { rs = JSON.parse(remote.payload); } catch (e) { rs = null; }
        }
        const merged = Store.mergeStates(Store.snapshot(), rs);
        Store.adopt(merged, true);   /* quiet: do not re-trigger the auto-push */

        const body = JSON.stringify({
          payload: JSON.stringify(Store.snapshot()),
          updated: Date.now(),
          device: Store.pref('syncName', '') + ' · ' + (navigator.platform || 'device')
        });
        return window.fetch(url(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: body
        }).then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const after = Store.tally();
          const gained = {
            notes: after.notes - before.notes,
            proofs: after.proofs - before.proofs,
            cards: after.cards - before.cards,
            omr: after.omr - before.omr
          };
          const bits = [];
          if (gained.notes > 0) bits.push(gained.notes + ' ' + DOM.plural(gained.notes, 'note'));
          if (gained.proofs > 0) bits.push(gained.proofs + ' ' + DOM.plural(gained.proofs, 'proof'));
          if (gained.cards > 0) bits.push(gained.cards + ' ' + DOM.plural(gained.cards, 'card'));
          if (gained.omr > 0) bits.push(gained.omr + ' ' + DOM.plural(gained.omr, 'question'));
          const msg = bits.length
            ? 'Merged in ' + bits.join(', ') + ' from your other device'
            : 'Everything already in sync';
          syncing = false;
          announce(true, msg);
          if (bits.length && o.reload !== false && typeof Router !== 'undefined') Router.reload();
          if (!o.quiet) DOM.announce(msg + '.');
          return { ok: true, msg: msg, gained: gained };
        });
      })
      .catch(function (err) {
        syncing = false;
        const msg = /Failed to fetch|NetworkError/i.test(String(err && err.message))
          ? 'Offline — your progress is saved here and will sync when you are back.'
          : 'Sync failed: ' + ((err && err.message) || err);
        announce(false, msg);
        if (!o.quiet) DOM.announce(msg);
        return { ok: false, msg: msg };
      });
  }

  const schedule = () => {
    if (!on()) return;
    window.clearTimeout(pushT);
    pushT = window.setTimeout(() => now({ quiet: true, reload: false }), 1500);
  };

  /* ── signing in ──────────────────────────────────────────────────────────
     Registers the key in the sign-in store (or touches it if it is already
     there), then does a normal merge-sync so an existing record arrives before
     the first screen is drawn. Being offline is NOT a reason to refuse entry:
     the local record still opens, and the next sync reconciles it. */
  function hello() {
    if (!on()) return Promise.resolve({ ok: false, msg: 'Not signed in.' });
    if (!window.fetch) return now({ quiet: true }).then(r => Object.assign({ returning: null }, r));

    const id = identity();
    return window.fetch(userUrl(), { cache: 'no-store' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
      .then(function (rec) {
        const returning = !!(rec && rec.created);
        return window.fetch(userUrl(), {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: id.name, roll: id.roll,
            created: (rec && rec.created) || Date.now(),
            seen: Date.now(),
            visits: ((rec && rec.visits) || 0) + 1
          })
        }).then(() => returning);
      })
      .then(function (returning) {
