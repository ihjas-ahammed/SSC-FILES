<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- full-bleed navy square: the same art works as a maskable icon -->
  <rect width="512" height="512" fill="#0b2161"/>
  <!-- calendar sheet, inside the 80% safe zone -->
  <rect x="122" y="130" width="268" height="262" rx="36" fill="#ffffff"/>
  <!-- header band -->
  <path d="M122 192 V166 A36 36 0 0 1 158 130 H354 A36 36 0 0 1 390 166 V192 Z" fill="#fbbd23"/>
  <!-- binder rings -->
  <rect x="172" y="106" width="22" height="58" rx="11" fill="#1849a9"/>
  <rect x="318" y="106" width="22" height="58" rx="11" fill="#1849a9"/>
  <!-- day grid: 3 columns x 3 rows -->
  <g fill="#e2e8f0">
    <rect x="158" y="216" width="50" height="36" rx="8"/>
    <rect x="231" y="216" width="50" height="36" rx="8"/>
    <rect x="304" y="216" width="50" height="36" rx="8"/>
    <rect x="158" y="268" width="50" height="36" rx="8"/>
    <rect x="231" y="268" width="50" height="36" rx="8"/>
    <rect x="304" y="268" width="50" height="36" rx="8"/>
    <rect x="158" y="320" width="50" height="36" rx="8"/>
    <rect x="231" y="320" width="50" height="36" rx="8"/>
  </g>
  <!-- one day ticked off -->
  <rect x="231" y="216" width="50" height="36" rx="8" fill="#1849a9"/>
  <polyline points="244,234 252,243 268,226" fill="none" stroke="#fbbd23" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- clock badge over the corner: the match clock -->
  <circle cx="374" cy="374" r="56" fill="#fbbd23" stroke="#0b2161" stroke-width="12"/>
  <path d="M374 344 V374 L394 386" fill="none" stroke="#0b2161" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
