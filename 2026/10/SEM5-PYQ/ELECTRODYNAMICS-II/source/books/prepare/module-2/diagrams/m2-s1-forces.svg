<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" role="img" aria-label="Velocity and force vectors for a charge in the moving wire: v horizontal, u along the wire, w the resultant, f_mag perpendicular to w, f_pull horizontal">
  <defs>
    <marker id="f-ink" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2631"/></marker>
    <marker id="f-orange" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D35400"/></marker>
    <marker id="f-green" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#117A65"/></marker>
  </defs>
  <g font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
    <line x1="60" y1="160" x2="170" y2="160" stroke="#117A65" stroke-width="1.8" marker-end="url(#f-green)"/>
    <text x="180" y="164" font-style="italic" font-weight="bold" fill="#117A65">v</text>
    <line x1="60" y1="160" x2="60" y2="70" stroke="#1B2631" stroke-width="1.8" marker-end="url(#f-ink)"/>
    <text x="48" y="66" font-style="italic" text-anchor="end">u</text>
    <line x1="60" y1="160" x2="170" y2="70" stroke="#1B2631" stroke-width="1.8" marker-end="url(#f-ink)"/>
    <text x="178" y="66" font-style="italic" font-weight="bold">w</text>
    <line x1="60" y1="70" x2="170" y2="70" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="170" y1="70" x2="170" y2="160" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="60" y1="160" x2="30" y2="112" stroke="#D35400" stroke-width="1.8" marker-end="url(#f-orange)"/>
    <text x="20" y="104" font-style="italic" fill="#D35400">f</text>
    <text x="28" y="108" font-size="10" fill="#D35400"></text>
    <line x1="60" y1="20" x2="110" y2="20" stroke="#D35400" stroke-width="1.8" marker-end="url(#f-orange)"/>
    <text x="118" y="24" font-style="italic" fill="#D35400">f_pull</text>
    <path d="M60,130 A30,30 0 0 1 74,140" fill="none" stroke="#1B2631" stroke-width="1"/>
    <text x="80" y="128" font-style="italic">θ</text>
    <text x="130" y="192" text-anchor="middle">Resultant velocity w = v + u; forces as in the text</text>
  </g>
</svg>
