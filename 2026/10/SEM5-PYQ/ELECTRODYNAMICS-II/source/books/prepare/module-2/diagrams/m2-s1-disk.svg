<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 230" role="img" aria-label="Metal disk spinning about a vertical axis in a field B pointing up, with a sliding contact at the rim and a resistor R from the rim to the axle">
  <defs>
    <marker id="d-ink" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2631"/></marker>
    <marker id="d-orange" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D35400"/></marker>
  </defs>
  <g font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
    <ellipse cx="120" cy="90" rx="80" ry="24" fill="#EAF2F8" stroke="#1B2631" stroke-width="1.4"/>
    <line x1="120" y1="90" x2="120" y2="200" stroke="#1B2631" stroke-width="2.2"/>
    <path d="M30,40 L30,10" stroke="#117A65" stroke-width="1.8" marker-end="url(#d-ink)" fill="none"/>
    <line x1="60" y1="60" x2="60" y2="20" stroke="#117A65" stroke-width="1.8" marker-end="url(#d-ink)"/>
    <text x="22" y="34" font-style="italic" font-weight="bold" fill="#117A65">B</text>
    <line x1="200" y1="90" x2="200" y2="150" stroke="#1B2631" stroke-width="1.4"/>
    <circle cx="200" cy="90" r="3" fill="#1B2631"/>
    <line x1="200" y1="150" x2="150" y2="170" stroke="#1B2631" stroke-width="1.4"/>
    <path d="M150,170 l4,-6 l5,12 l5,-12 l5,12 l5,-12 l4,6" fill="none" stroke="#1B2631" stroke-width="1.4"/>
    <text x="163" y="188" font-style="italic" font-weight="bold">R</text>
    <line x1="120" y1="170" x2="150" y2="170" stroke="#1B2631" stroke-width="1.4"/>
    <text x="150" y="112" font-size="11" font-style="italic">sliding contact</text>
    <line x1="200" y1="100" x2="200" y2="110" stroke="#1B2631" stroke-width="0"/>
    <path d="M200,88 L200,80" stroke="none"/>
    <text x="140" y="222" text-anchor="middle">Disk spins; current flows rim to axle</text>
  </g>
</svg>
