<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 320 200" role="img" aria-label="Polarization flux through an oblique end gives surface bound charge sigma b equals P dot the outward normal" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
<defs>
<marker id="s2e-polarization" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9770E"/></marker>
</defs>
<polygon points="60,60 190,60 240,140 110,140" fill="#EAF2F8" stroke="#1B2631" stroke-width="1.4"/>
<line x1="40" y1="60" x2="40" y2="140" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="35" y1="60" x2="45" y2="60" stroke="#7F8C8D" stroke-width="1"/>
<line x1="35" y1="140" x2="45" y2="140" stroke="#7F8C8D" stroke-width="1"/>
<text x="28" y="104" fill="#1B2631" font-size="13" text-anchor="end" font-style="italic">A</text>
<line x1="80" y1="100" x2="170" y2="100" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2e-polarization)"/>
<text x="120" y="92" fill="#B9770E" font-size="13" text-anchor="start" font-style="italic">P</text>
<line x1="215" y1="100" x2="253.2" y2="76.1" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2e-polarization)"/>
<text x="259" y="73" fill="#B9770E" font-size="13" text-anchor="start" font-style="italic">n̂</text>
<line x1="224" y1="100" x2="250" y2="100" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M237,100 A22,22 0 0 0 233.66,88.34" fill="none" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="246" y="105" fill="#1B2631" font-size="12" text-anchor="start" font-style="italic">θ</text>
<text x="190" y="85" fill="#C0392B" font-size="12" text-anchor="end" font-weight="bold">+</text>
<text x="206" y="105" fill="#C0392B" font-size="12" text-anchor="end" font-weight="bold">+</text>
<text x="222" y="125" fill="#C0392B" font-size="12" text-anchor="end" font-weight="bold">+</text>
<text x="160" y="178" fill="#1B2631" font-size="13" text-anchor="middle"><tspan font-style="italic">A</tspan><tspan baseline-shift="sub" font-size="9">end</tspan> = <tspan font-style="italic">A</tspan> / cos θ,  <tspan font-style="italic" fill="#B9770E">σ</tspan><tspan fill="#B9770E"><tspan baseline-shift="sub" font-size="9">b</tspan></tspan> = <tspan font-style="italic" fill="#B9770E">P</tspan> cos θ = <tspan font-style="italic" fill="#B9770E">P</tspan>·n̂</text>
</svg>
