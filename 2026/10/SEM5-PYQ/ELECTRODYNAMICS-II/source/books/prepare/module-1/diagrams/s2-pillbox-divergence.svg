<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 300 200" role="img" aria-label="More polarization flux exits than enters a volume, leaving negative bound charge inside" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
<defs>
<marker id="s2c-polarization" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#B9770E"/></marker>
</defs>
<rect x="80" y="50" width="140" height="100" fill="none" stroke="#1B2631" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="58" y1="75" x2="80" y2="75" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2c-polarization)"/>
<line x1="220" y1="75" x2="260" y2="75" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2c-polarization)"/>
<line x1="58" y1="100" x2="80" y2="100" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2c-polarization)"/>
<line x1="220" y1="100" x2="260" y2="100" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2c-polarization)"/>
<line x1="58" y1="125" x2="80" y2="125" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2c-polarization)"/>
<line x1="220" y1="125" x2="260" y2="125" stroke="#B9770E" stroke-width="1.8" marker-end="url(#s2c-polarization)"/>
<text x="60" y="40" fill="#B9770E" font-size="13" text-anchor="start"><tspan font-style="italic">P</tspan> in</text>
<text x="236" y="40" fill="#B9770E" font-size="13" text-anchor="start"><tspan font-style="italic">P</tspan> out</text>
<text x="242" y="146" fill="#B9770E" font-size="12" text-anchor="start">out &gt; in</text>
<text x="150" y="105" fill="#1F618D" font-size="16" text-anchor="middle">−</text>
<text x="150" y="176" fill="#1B2631" font-size="13" text-anchor="middle">∮<tspan font-style="italic">P</tspan>·d<tspan font-style="italic">a</tspan> &gt; 0 ⇒ ρ<tspan baseline-shift="sub" font-size="9">b</tspan> = −∇·<tspan font-style="italic">P</tspan> &lt; 0 inside</text>
</svg>
