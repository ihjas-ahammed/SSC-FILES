<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b2161" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>GATE DA Study Plan</title>

  <!-- Fonts & Screenshot Library -->
  <link rel="preconnect" href="https://fonts.bunny.net">
  <link href="https://fonts.bunny.net/css?family=plus-jakarta-sans:400,500,600,700,800,900&display=swap" rel="stylesheet" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/modern-screenshot@4.7.0/dist/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Modular Stylesheets -->
  <link rel="stylesheet" href="css/01-base-and-shell.css" />
  <link rel="stylesheet" href="css/02-plan-and-day-cards.css" />
  <link rel="stylesheet" href="css/03-editors-wizard-settings.css" />
  <link rel="stylesheet" href="css/04-schedule-and-modal.css" />
  <link rel="stylesheet" href="css/05-session-detail.css" />
  <link rel="stylesheet" href="css/06-pdf-viewer.css" />
</head>
<body>
  <!-- App Header & Navigation -->
  <header class="app-header">
    <div class="hdr-row">
      <div class="brand"><h1>GATE DA Study Plan</h1></div>
      <div class="hdr-stats" id="hdr-stats"></div>
    </div>
    <div class="side-title"><h1>GATE DA Plan</h1></div>
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="plan" role="tab">
        <svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V10h14v10zM5 8V6h14v2H5z"/></svg>
        Plan
      </button>
      <button class="tab" data-tab="day" role="tab">
        <svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.8 1.42-1.42zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5.5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91l1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
        Day
      </button>
      <button class="tab" data-tab="schedule" role="tab">
        <svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M17 12h-5v5h5v-5zM16 1v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-1V1h-2zm3 18H5V8h14v11z"/></svg>
        Schedule
      </button>
      <button class="tab" data-tab="settings" role="tab">
        <svg class="mi" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94a7.07 7.07 0 0 0 0-1.88l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7 7 0 0 0-1.62-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.84a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.62.94l-2.39-.96a.5.5 0 0 0-.6.22L2.68 8.88a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0 0 1.88L2.8 14.56a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.3.6.22l2.39-.96c.5.39 1.03.7 1.62.94l.36 2.54c.05.24.25.42.49.42h3.84c.24 0 .45-.18.49-.42l.36-2.54a7 7 0 0 0 1.62-.94l2.39.96c.22.09.47 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.62zM12 15.6a3.6 3.6 0 1 1 0-7.2 3.6 3.6 0 0 1 0 7.2z"/></svg>
        Settings
      </button>
    </nav>
  </header>

  <!-- Main Views -->
  <main>
    <section class="view" id="view-plan"></section>
    <section class="view" id="view-day"></section>
    <section class="view" id="view-schedule"></section>
    <section class="view" id="view-settings"></section>
  </main>

  <!-- Overlays -->
  <div id="wizard"></div>
  <div class="toast" id="toast"></div>

  <!-- Session Detail View Template (Cloned into Schedule Tab when viewing a session) -->
  <template id="ss-template">
    <div class="sess-scope space-y-4">

      <!-- 1. SUBJECT HERO BANNER CARD -->
      <section class="bg-[#f4effe] rounded-[22px] p-4 sm:p-5 border border-purple-200/60 shadow-sm relative overflow-hidden">
        <div class="flex items-stretch gap-3.5">
          <div class="w-1.5 rounded-full bg-[#9d5ce5] shrink-0 my-0.5"></div>
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2">
              <h2 id="hero-title" class="font-display font-extrabold text-[20px] sm:text-[22px] text-[#0f172a] leading-snug tracking-tight">
                Abstract Algebra I
              </h2>
              <button
                id="hero-status-badge"
                onclick="cycleStatus()"
                title="Click to toggle status"
                class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#ffe4e8] border border-rose-200/90 text-[#d92d20] text-xs font-semibold shadow-2xs transition hover:brightness-95"
              >
                <span id="hero-status-dot" class="w-2.5 h-2.5 rounded-full bg-[#e11d48]"></span>
                <span id="hero-status-text">Not done</span>
              </button>
            </div>
            <p id="hero-sub" class="text-[13.5px] font-medium text-slate-600 mt-1 leading-relaxed">
              Module II &bull; Subgroups, cyclic groups, permutations
            </p>
            <div class="mt-2.5 flex items-center gap-2">
              <span class="inline-block px-2.5 py-0.5 rounded-lg bg-[#e5d4ff] text-[#5b21b6] font-display font-bold text-[11px] tracking-wide uppercase">
                REV
              </span>
              <span id="active-timer-pill" class="hidden items-center gap-1.5 px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-900 border border-amber-300 font-mono text-xs font-bold">
                <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
                <span id="live-countdown">30:00</span>
              </span>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. THREE-TAB SEGMENTED CONTROL (Session | Resources | PYQ) -->
      <div class="bg-[#f1f5f9] p-1 rounded-[16px] border border-slate-200/90 grid grid-cols-3 items-center relative select-none">
        <button onclick="ssSwitchTab('session')" id="tab-btn-session" class="py-2.5 px-3 rounded-[12px] font-display font-bold text-[13.5px] transition-all bg-[#1849a9] text-white shadow-sm">
          Session
        </button>
        <button onclick="ssSwitchTab('resources')" id="tab-btn-resources" class="py-2.5 px-3 rounded-[12px] font-display font-semibold text-[13.5px] text-slate-600 hover:text-slate-900 transition-all relative">
          Resources
        </button>
        <button onclick="ssSwitchTab('pyq')" id="tab-btn-pyq" class="py-2.5 px-3 rounded-[12px] font-display font-semibold text-[13.5px] text-slate-600 hover:text-slate-900 transition-all relative">
          <span id="tab-divider" class="absolute left-0 top-2.5 bottom-2.5 w-[1px] bg-slate-300/80"></span>
          PYQ
        </button>
      </div>

      <!-- TAB PANEL 1: SESSION -->
      <div id="panel-session" class="space-y-5">
        <div id="session-desktop-grid" class="space-y-5">
          <section class="bg-white rounded-[22px] p-5 border border-slate-200/80 shadow-[0_4px_20px_-4px_rgba(15,23,42,0.04)]">
            <div class="flex items-center justify-between mb-3">
              <h3 class="font-display font-bold text-[17px] text-[#0f172a]">Session details</h3>
              <button onclick="fillSampleDetails()" id="fill-details-btn" class="text-[11px] font-semibold text-blue-600 hover:underline">
                Auto-fill schedule
              </button>
            </div>

            <div class="divide-y divide-slate-100">
              <div class="py-3 flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-[#eef4ff] text-[#2563eb] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="17" rx="3"></rect>
                    <path stroke-linecap="round" d="M16 2v4M8 2v4M3 9.5h18"></path>
                  </svg>
                </div>
                <div>
                  <div class="text-[11px] font-bold tracking-wider text-slate-500 uppercase">DATE</div>
                  <div id="detail-date" class="font-display font-bold text-sm text-slate-800 mt-0.5">—</div>
                </div>
              </div>

              <div class="py-3 flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-[#f5edff] text-[#7c3aed] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="8.5"></circle>
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 7.5v4.5l3 2"></path>
                  </svg>
                </div>
                <div>
                  <div class="text-[11px] font-bold tracking-wider text-slate-500 uppercase">START – END</div>
                  <div id="detail-time" class="font-display font-bold text-sm text-slate-800 mt-0.5">—</div>
                </div>
              </div>

              <div class="py-3 flex items-center gap-3.5">
                <div class="w-10 h-10 rounded-xl bg-[#fef6e0] text-[#d97706] flex items-center justify-center shrink-0">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6.5 4h11M6.5 20h11M8 4v3.5a4 4 0 001.4 3L12 12l2.6-1.5a4 4 0 001.4-3V4M8 20v-3.5a4 4 0 011.4-3L12 12l2.6 1.5a4 4 0 011.4 3V20"/>
                  </svg>
                </div>
                <div>
                  <div class="text-[11px] font-bold tracking-wider text-slate-500 uppercase">PLANNED TIME</div>
                  <div id="detail-duration" class="font-display font-bold text-sm text-slate-800 mt-0.5">—</div>
                </div>
              </div>

              <div class="pt-3 pb-1 flex items-center gap-3.5">
                <div id="detail-status-box" class="w-10 h-10 rounded-xl bg-[#ffe8ec] flex items-center justify-center shrink-0">
                  <span id="detail-status-dot" class="w-4 h-4 rounded-full bg-[#e11d48]"></span>
                </div>
                <div>
                  <div class="text-[11px] font-bold tracking-wider text-slate-500 uppercase">STATUS</div>
                  <div id="detail-status-text" class="font-display font-extrabold text-[15px] text-[#0f172a] mt-0.5">Not done</div>
                </div>
              </div>
            </div>
          </section>

          <section class="space-y-3">
            <div>
              <h3 class="font-display font-extrabold text-[19px] text-[#0f172a]">Units</h3>
              <p class="text-[13px] font-medium text-slate-500">Work through each unit for this session.</p>
            </div>
            <div id="units-list" class="space-y-3"></div>
          </section>
        </div>
      </div>

      <!-- TAB PANEL 2: RESOURCES -->
      <div id="panel-resources" class="hidden space-y-4"></div>

      <!-- TAB PANEL 3: PYQ -->
      <div id="panel-pyq" class="hidden space-y-4"></div>

      <!-- START BUTTON -->
      <button id="ss-main-start" onclick="startSessionReader()" class="w-full py-3.5 px-6 rounded-[18px] bg-[#fbbd23] hover:bg-[#f4b315] active:scale-[0.99] text-[#0b1e5e] font-display font-extrabold text-[17px] shadow-[0_8px_20px_-4px_rgba(251,189,35,0.45)] flex items-center justify-center gap-2.5 transition">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5-11-6.5z"/></svg>
        <span id="main-start-btn-text">Start</span>
      </button>

      <!-- START SESSION MODAL: shown only when the session's units have no study system (use the notes) -->
      <div id="start-modal-backdrop" class="hidden fixed inset-0 z-[200] bg-slate-950/55 flex items-center justify-center p-4">
        <div class="bg-[#f8fafc] w-full max-w-[380px] rounded-[28px] p-5 shadow-2xl border border-slate-200/90 space-y-4">
          <div class="flex items-start justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-11 h-11 rounded-full bg-[#fbbd23] text-[#0b2161] flex items-center justify-center shrink-0 shadow-2xs">
                <svg class="w-5 h-5 fill-current ml-0.5" viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5-11-6.5z"/></svg>
              </div>
              <div>
                <h3 class="font-display font-extrabold text-[18px] text-[#0f172a] leading-tight">Start Session</h3>
                <p class="text-xs font-medium text-slate-500 mt-0.5">Dynamic notes are not available</p>
              </div>
            </div>
            <button onclick="closeStartModal()" aria-label="Close modal" class="w-8 h-8 rounded-full text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 flex items-center justify-center transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
          </div>

          <div class="bg-white rounded-[20px] p-4 border border-slate-200/75 shadow-2xs">
            <p id="start-modal-msg" class="text-xs font-semibold text-slate-600 px-1"></p>
          </div>

          <button id="start-sys-btn" class="hidden w-full py-3.5 px-6 bg-white rounded-[20px] border border-slate-200/75 shadow-2xs font-display font-bold text-sm text-[#0f172a] flex items-center justify-center gap-2 transition">
            <span id="start-sys-label"></span>
          </button>
          <button onclick="startWithNotes()" class="w-full py-3.5 px-6 rounded-[18px] bg-[#fbbd23] hover:bg-[#f4b315] active:scale-[0.99] text-[#0b2161] font-display font-extrabold text-[16px] shadow-[0_8px_20px_-4px_rgba(251,189,35,0.5)] flex items-center justify-center gap-2 transition">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M7 5.5v13l11-6.5-11-6.5z"/></svg>
            <span>Use notes</span>
          </button>
        </div>
      </div>

    </div>
  </template>

  <!-- Main Application Entry -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
