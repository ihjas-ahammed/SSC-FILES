<!doctype html>

<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141110">
<title>Video Player</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// Dev player: http://localhost:5173/?v=<video>   (videos live in ./videos/*.js)
import { mountPlayer } from './engine/player.js';
import VIDEOS from './videos/list.js';
const qs = new URLSearchParams(location.search);
const name = qs.get('v') || 'nano-08-duality'; // DEFAULT_VIDEO
const def = (await import(`./videos/${name}.js`)).default;
await mountPlayer(def, { render: qs.has('render'), t: +(qs.get('t') || 0), compare: qs.has('compare'), videos: VIDEOS, current: name });
</script>
</body>
</html>
