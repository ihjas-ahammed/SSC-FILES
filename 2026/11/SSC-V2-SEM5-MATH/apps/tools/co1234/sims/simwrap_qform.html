<figure class="simwrap" data-sim="qform">
      <header><span class="lbl">Try it</span><b>Classify a stationary point from its Hessian</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">eigenvalues <b data-out="l">–</b></span><span class="ro">\(\det f''\) <b data-out="det">–</b></span>
        <span class="ro">\(f_{11}\) <b data-out="f11">–</b></span><span class="ro">verdict <b data-out="v">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>\(f_{11}\)</span><input type="range" min="-3" max="3" value="2" step="0.05" data-k="a"><output></output></label>
        <label class="ctrl"><span>\(f_{12} = f_{21}\)</span><input type="range" min="-3" max="3" value="0.8" step="0.05" data-k="b"><output></output></label>
        <label class="ctrl"><span>\(f_{22}\)</span><input type="range" min="-3" max="3" value="1.2" step="0.05" data-k="d"><output></output></label>
      </div>
      <figcaption>The picture is the quadratic part \(\tfrac12\mathbf h^Tf''(\boldsymbol\xi)\mathbf h\) of Taylor's theorem around a stationary point (copper above, indigo below). Dashed: the eigenvector directions. Make \(\det f''\) negative and the closed ellipses open into hyperbolas: a saddle. Push \(\det f''\) to zero and a whole line goes flat: that is the case where the test says nothing.</figcaption>
    </figure>
