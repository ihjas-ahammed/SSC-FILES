<figure class="simwrap" data-sim="water">
      <header><span class="lbl">Try it</span><b>Water-filling: pour in more total power</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">level \(1/\nu^\star\) <b data-out="lev">–</b></span><span class="ro">\(\mathbf x^\star\) <b data-out="x">–</b></span><span class="ro">channels in use <b data-out="on">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>total \(\mathbf 1^T\mathbf x\)</span><input type="range" min="0.2" max="8" value="2" step="0.05" data-k="tot"><output></output></label>
      </div>
      <figcaption>Boyd example 5.2: maximise \(\sum\log(\alpha_i+x_i)\) with \(\mathbf x\succeq0\), \(\mathbf 1^T\mathbf x\) fixed. The KKT conditions give \(x_i^\star = \max\{0,1/\nu^\star-\alpha_i\}\): the water level \(1/\nu^\star\) rises until the water poured equals the total. Low patches (small \(\alpha_i\)) fill first.</figcaption>
    </figure>
