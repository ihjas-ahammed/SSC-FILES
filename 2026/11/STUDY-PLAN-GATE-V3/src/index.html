<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<title>GATE DA Planner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f6df6'/%3E%3Cpath d='M18 34l9 9 19-21' stroke='white' stroke-width='7' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>/*STYLE*/</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs"><div class="in">
  <button data-tab="today" data-testid="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Today</button>
  <button data-tab="plan" data-testid="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-tab="practice" data-testid="tab-practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4h6M10 4v5L5 19a1 1 0 0 0 .9 1.5h12.2A1 1 0 0 0 19 19l-5-10V4"/></svg>Practice</button>
  <button data-tab="files" data-testid="tab-files"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3.5 7a2 2 0 0 1 2-2H10l2 2h6.5a2 2 0 0 1 2 2v8.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>Resources</button>
  <button data-tab="me" data-testid="tab-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Progress</button>
</div></nav>

<section class="sheet" id="pdf-sheet" hidden>
  <header>
    <button class="iconbtn" id="pv-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t"><span id="pv-title"></span><div class="tiny" id="pv-off"></div></div>
    <button class="iconbtn" id="pv-dl" aria-label="Download"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
    <button class="iconbtn" id="pv-ext" aria-label="Open in browser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></button>
  </header>
  <div class="body" id="pv-body"><div class="pdfpages" id="pv-pages"></div></div>
  <footer>
    <button class="btn sm" id="pv-count" title="Go to page">–</button>
    <span class="grow"></span>
    <button class="iconbtn" id="pv-out" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 12h12"/></svg></button>
    <span class="small" id="pv-zoom" style="min-width:44px;text-align:center">100%</span>
    <button class="iconbtn" id="pv-in" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 12h12M12 6v12"/></svg></button>
  </footer>
</section>

<section class="sheet" id="sheet" hidden>
  <header>
    <button class="iconbtn" id="sh-close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="t" id="sh-title"></div>
    <div id="sh-extra"></div>
  </header>
  <div class="body" id="sh-body"></div>
  <footer id="sh-foot" hidden></footer>
</section>

<div class="toast" id="toast"></div>
<script>/*DATA*/</script>
<script>/*VIEWER*/</script>
<script>/*APP*/</script>
</body>
</html>
