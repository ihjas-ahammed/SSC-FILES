<figure class="simwrap" data-sim="fermilevel">
      <header><span class="lbl">Try it</span><b>Where the Fermi level sits, and what it does to \(n\) and \(p\)</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">\(E_F - E_V\) <b data-out="EF">–</b></span><span class="ro">\(n\) <b data-out="n">–</b></span>
        <span class="ro">\(p\) <b data-out="p">–</b></span><span class="ro">\(np\) <b data-out="np">–</b></span>
        <span class="ro">\(n_i^2\) <b data-out="ni2">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>\(E_F\) position in gap</span><input type="range" min="0.08" max="0.92" value="0.5" step="0.005" data-k="f"><output></output></label>
        <label class="ctrl"><span>temperature \(T\) (K)</span><input type="range" min="100" max="600" value="300" step="5" data-k="T"><output></output></label>
        <label class="ctrl"><span>band gap \(E_g\) (eV)</span><input type="range" min="0.3" max="2" value="1.1" step="0.05" data-k="Eg"><output></output></label>
      </div>
      <figcaption>Slide \(E_F\) up towards the conduction band and \(n\) climbs while \(p\) falls — but watch the product \(np\): it never moves, because \(E_F\) cancels out of it. That constancy <i>is</i> the law of mass action, and it is the fastest way to see why doping one carrier suppresses the other.</figcaption>
    </figure>
