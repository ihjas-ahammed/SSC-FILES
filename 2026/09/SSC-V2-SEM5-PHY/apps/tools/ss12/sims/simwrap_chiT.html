<figure class="simwrap" data-sim="chiT">
      <header><span class="lbl">Try it</span><b>\(\chi\) against \(T\) — the four curves you must be able to draw</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">class <b data-out="cls">–</b></span><span class="ro">law <b data-out="law">–</b></span>
        <span class="ro">\(\chi\) at \(T\) <b data-out="chi">–</b></span><span class="ro">\(\theta\) or \(T_N\) <b data-out="th">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>temperature \(T\) (K)</span><input type="range" min="10" max="900" value="400" step="5" data-k="T"><output></output></label>
        <label class="ctrl"><span>\(\theta\) (K)</span><input type="range" min="50" max="500" value="300" step="5" data-k="th"><output></output></label>
      </div>
      <div class="readouts"><div class="seg" data-seg="cls"><button data-v="dia" aria-pressed="false">Dia</button><button data-v="para" aria-pressed="true">Para</button><button data-v="ferro" aria-pressed="false">Ferro</button><button data-v="anti" aria-pressed="false">Antiferro</button></div></div>
      <figcaption>Left: \(\chi(T)\). Right: \(1/\chi\) against \(T\), where every law becomes a <b>straight line</b> — through the origin for a paramagnet, cutting the axis at \(+\theta\) for a ferromagnet and at \(-\theta\) for an antiferromagnet. That intercept is how the class is identified experimentally, and drawing all three on one axis is a standard exam figure.</figcaption>
