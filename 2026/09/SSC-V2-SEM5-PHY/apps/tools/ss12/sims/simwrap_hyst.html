<figure class="simwrap" data-sim="hyst">
      <header><span class="lbl">Try it</span><b>The hysteresis loop, and what each part of it costs</b></header>
      <canvas></canvas>
      <div class="readouts">
        <span class="ro">\(B_r\) remanence <b data-out="Br">–</b></span><span class="ro">\(H_c\) coercivity <b data-out="Hc">–</b></span>
        <span class="ro">loop area \(\propto\) loss <b data-out="area">–</b></span><span class="ro">use <b data-out="use">–</b></span>
      </div>
      <div class="ctrls">
        <label class="ctrl"><span>coercivity \(H_c\)</span><input type="range" min="0.05" max="1" value="0.2" step="0.01" data-k="hc"><output></output></label>
        <label class="ctrl"><span>drive amplitude</span><input type="range" min="0.4" max="1.6" value="1.2" step="0.02" data-k="amp"><output></output></label>
      </div>
      <figcaption>Start at the origin and the first climb is the <b>initial magnetisation curve</b> — domain walls moving, then domains rotating. Come back and the material remembers: \(B_r\) is what is left at \(H=0\), and \(H_c\) is the reverse field needed to erase it. The enclosed <b>area is the energy lost per cycle</b>. Drag the coercivity from small (soft — transformer cores) to large (hard — permanent magnets) and watch the loop fatten.</figcaption>
    </figure>
