<script>
  /* MathJax: authored content uses $…$ and $$…$$. formatError parks the
     message where core.tex.js can read it, so a malformed learner fragment
     becomes a readable warning instead of a silent red blob. */
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true,
      formatError: function (jax, err) {
        window.__texError = err.message;
        return jax.formatError(err);
      }
    },
    chtml: { displayAlign: 'left', displayIndent: '0' },
    options: { enableMenu: false, enableAssistiveMml: true },
    startup: { typeset: false }
  };
</script>
