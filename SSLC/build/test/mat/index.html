    });
  }

  /* ══════════════════════════════════════════════════════════════════════
     The note itself.
     ══════════════════════════════════════════════════════════════════════ */
  function build(c, opts) {
    const o = opts || {};
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const root = el('div', { class: 'notebody stack' });

    const hasProof = !!c.proof;
    const isExt = Pool.isExt(c);
    const extNote = isExt ? (isMl ? ' (പാഠ്യപദ്ധതിക്ക് പുറത്ത്)' : ' (outside syllabus)') : '';
    const badgesHost = el('div', { class: 'row', style: { marginBottom: '2px' } });
    const ladderHost = el('div', {});
    const askHost = el('div', {});
    const doneBtn = el('button', { class: 'btn', type: 'button' });
    let syncProofTick = null;

    const isL2Complete = Progress.level(c.id) >= 2;
    const wView = writtenOn(c, function () { paintDone(); }, isL2Complete);

    function paintDone() {
      Progress.dropCache();
      const on = Store.isDone(c.id);
      const isL2 = Progress.level(c.id) >= 2;

      if (wView) {
        if (wView._updateHeader) wView._updateHeader();
        if (isL2 && wView._open && !wView._isOpen()) {
          wView._open();
        }
      }

      DOM.clear(badgesHost);
      DOM.add(badgesHost, [UI.kindBadge(c), UI.tierBadge(c), UI.levelBadge(c.id)].filter(Boolean));

      doneBtn.className = 'btn';
      DOM.clear(doneBtn);
      const btnText = on
        ? (((typeof I18N !== 'undefined') ? I18N.t('read_undo') : 'Read — undo') + extNote)
        : (((typeof I18N !== 'undefined') ? I18N.t('mark_read') : 'Mark as read') + extNote);
      DOM.add(doneBtn, [
        DOM.mi(on ? 'task_alt' : 'radio_button_unchecked', 'sm'),
        el('span', { text: btnText })
      ]);
      doneBtn.setAttribute('aria-pressed', String(on));
      DOM.clear(ladderHost).appendChild(UI.ladder(c.id));
      if (o.onChange) o.onChange();
    }

    function offerCascade() {
      const pending = Progress.pendingPrereqs(c.id);
      DOM.clear(askHost);
      if (!pending.length) return;

      const list = el('div', { class: 'row', style: { marginTop: '2px' } },
        pending.slice(0, 8).map(x => el('span', { class: 'chip', text: x.title })));
      if (pending.length > 8) {
        list.appendChild(el('span', { class: 'count', text: '+' + (pending.length - 8) + (isMl ? ' കൂടുതൽ' : ' more') }));
      }

      const cascadeTitle = I18N.t('cascade_title');
      const cascadeBody = isMl
        ? (pending.length + ' അടിസ്ഥാന ആശയങ്ങൾ ഇതുവരെ വായിച്ചിട്ടില്ല. അവയും വായിച്ചതായി അടയാളപ്പെടുത്തണോ?')
        : (pending.length + ' ' + DOM.plural(pending.length, 'prerequisite') + ' of this result have not been read. Mark them read?');

      askHost.appendChild(UI.ask({
        title: cascadeTitle,
        body: el('div', {}, [
          el('p', { style: { margin: '0 0 8px' }, text: cascadeBody }),
          list
        ]),
        actions: [
          { label: isMl ? ('അതെ, ' + pending.length + ' എണ്ണവും അടയാളപ്പെടുത്തുക') : ('Yes, mark all ' + pending.length), primary: true, onClick: function () {
              const n = Progress.raisePrereqs(c.id);
              DOM.clear(askHost);
              DOM.announce(isMl ? (n + ' അടിസ്ഥാന ആശയങ്ങൾ വായിച്ചതായി രേഖപ്പെടുത്തി.') : ('Marked ' + n + ' prerequisites as read.'));
              paintDone();
            } },
          { label: isMl ? 'വേണ്ട, ഇത് മാത്രം' : 'No, just this one', onClick: function () { DOM.clear(askHost); } }
        ]
      }));
    }

    doneBtn.addEventListener('click', function () {
      const next = !Store.isDone(c.id);
      Store.setDone(c.id, next);
      if (!hasProof) Store.setProofDone(c.id, next);
      else if (!next) Store.setProofDone(c.id, false);
      Progress.dropCache();
      paintDone();
      if (syncProofTick) syncProofTick();
      DOM.announce(next ? (isMl ? 'വായിച്ചതായി അടയാളപ്പെടുത്തി.' : 'Marked as read.') : (isMl ? 'ഒഴിവാക്കി.' : 'Tick removed.'));
      if (next) offerCascade(); else DOM.clear(askHost);
    });

    const pView = proofView(c, function () { paintDone(); });
    if (pView && pView._paintProofDone) syncProofTick = pView._paintProofDone;

    const next = Pool.neighbours(c.id).next;
    const nextTitle = next ? (typeof I18N !== 'undefined' ? I18N.pick(next, 'title') : next.title) : '';
    const completeBtnText = next
      ? (((typeof I18N !== 'undefined') ? I18N.t('complete_open_next') : 'Complete · open ') + nextTitle)
      : ((typeof I18N !== 'undefined') ? I18N.t('complete_note') : 'Complete this note');

    const completeBtn = el('button', { class: 'btn primary full', type: 'button' }, [
      DOM.mi('done_all', 'sm'),
      el('span', { text: completeBtnText })
    ]);
    completeBtn.addEventListener('click', function () {
      Progress.complete(c.id);
      paintDone();
      const cTitle = typeof I18N !== 'undefined' ? I18N.pick(c, 'title') : c.title;
      DOM.announce((isMl ? 'പൂർത്തിയായി: ' : 'Completed ') + cTitle + '.');
      if (o.onComplete) o.onComplete(next);
    });

    DOM.add(root, [
      el('div', {}, [
        badgesHost,
        el('p', { class: 'lede', style: { margin: '8px 0 0' }, text: c.oneLine })
      ]),

      el('div', { class: 'card' }, [
        el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('statement') : 'Statement' }),
        el('div', { style: { marginTop: '10px' } }, [UI.prose(c.statement)])
      ]),

      Fig.mount(c),

      c.intuition ? el('div', { class: 'card tint' }, [
        el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('what_it_says') : 'What it really says' }),
        el('div', { style: { marginTop: '10px' } }, [UI.prose(c.intuition, 'tight')])
      ]) : null,

      prereqPath(c),
      pView,
      traps(c),
      selfChecks(c),
      wView,
      questionsOn(c),
      teachBack(c),
      sectionTasks(c),
      unlocks(c),

      el('div', { class: 'card glass' }, [
        el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('this_note') : 'This note' }),
        el('div', { style: { margin: '10px 0 14px' } }, [ladderHost]),
        el('div', { class: 'btn-row' }, [doneBtn]),
        askHost
      ]),

      el('div', { class: 'note-foot' }, [completeBtn])
    ]);

    paintDone();
    UI.math(root);
    return root;
  }

  return { build, expander, taskRow, wantOpen };
})();


/* ── src/comp.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The writing workspace — a live markdown editor, one line at a time.

   The old workspace was a textarea with the rendering underneath and a sheet
   of LaTeX keys at the bottom. Two things were wrong with it on a phone: the
   key sheet covered the input it was meant to serve, and the rendering sat so
   far below a growing block of source that you stopped looking at it.

   So the shape is inverted. You write ONE line at a time, and that line's
   rendering sits directly ABOVE the input — where your eyes already are.
   Press Enter and the line settles into the document above; a fresh input
   appears beneath it, with its own output right above it again. The page
   fills downward with rendered mathematics and the caret is always at the
   bottom of it. Tap any settled line to reopen it.

   Commands are offered as completions rather than as a palette (core.latex.js):
   type a backslash and the matches appear in a strip immediately under the
   input, thumb-high. When nothing is being typed the strip shows the commands
   this theorem actually uses, so discovery still works without knowing how to
   spell anything.

   Still deliberately NOT a checker: it verifies that what you wrote renders,
   and says so out loud. Whether the mathematics is right stays your call.
   ══════════════════════════════════════════════════════════════════════════ */

const WriteBox = (function () {

  const el = DOM.el;

  function mount(host, opts) {
    const o = opts || {};
    const concept = o.concept || null;
    const uid = 'w' + Math.random().toString(36).slice(2, 8);

    /* MARKDOWN IS THE DEFAULT, AND SO IS MATHS. Every line is prose until you
       put maths in it, because a workspace you cannot write a sentence in is
       not a workspace — it is a formula box.

       Maths no longer needs fencing: write `I love \\frac{1}{2} in fact` and
       core.md.js finds the expression, typesets it, and leaves the sentence
       alone. Explicit $…$ and $$…$$ still work and still win, and the Σ key
       wraps the whole line for when the line really is nothing but maths.

       `mathFirst: true` is the opt-in exception for boxes that exist only to
       capture one formula; there, a line with no $ is taken as bare LaTeX. */
    const mathFirst = o.mathFirst === true;

    /* What the draft is filed under. Usually the concept, but a proof
       scratchpad and a statement attempt are different pieces of work on the
       same concept, so they need different keys — 'proof:<id>' for the former.
       Both merge across devices like any other draft. */
    const draftKey = o.draftKey || (concept ? concept.id : null);

    let firstInputFired = false;
    let lines = [''];
    let active = 0;

    const stored = (o.value != null ? o.value : (draftKey ? Store.draft(draftKey) : '')) || '';
    if (stored) { lines = stored.split('\n'); active = lines.length - 1; }

    /* ── chrome ────────────────────────────────────────────────────────── */
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const doc = el('div', { class: 'wdoc', id: uid + '-doc' });
    const strip = el('div', { class: 'wstrip', role: 'listbox',
      'aria-label': isMl ? 'കമാൻഡ് നിർദ്ദേശങ്ങൾ' : 'LaTeX command completions' });
    const errBox = el('div', { hidden: true });
    const saveNote = el('span', { class: 'small muted', text: '' });

    const hintText = isMl
      ? (mathFirst
        ? 'ഓരോ വരിയായി എഴുതുക. $ ഇല്ലാത്ത വരികൾ സമവാക്യമായി ദൃശ്യമാകും; വാക്കുകൾക്കൊപ്പം ചിഹ്നങ്ങൾ ചേർക്കാൻ $…$ ഉപയോഗിക്കുക. Enter അടുത്ത വരി തുടങ്ങും.'
        : 'സാധാരണ പോലെ എഴുതാം — **bold**, # തലക്കെട്ടുകൾ, - പട്ടിക. ഗണിത രൂപങ്ങൾക്ക് $ ആവശ്യമില്ല. Enter അടുത്ത വരി തുടങ്ങും.')
      : ((mathFirst
        ? 'One line at a time. A line with no $ is typeset as display maths; use $…$ to mix maths into words. '
        : 'Write normally — **bold**, # headings, - lists. Maths needs no dollar signs: '
          + 'type \\frac{1}{2} mid-sentence and it is typeset where it stands. A backslash '
          + 'opens the command list; the Σ key sets the whole line as display maths. ') +
        'Enter starts the next line.');

    const hint = el('p', {
      class: 'small muted', id: uid + '-hint', style: { margin: '6px 0 0' },
      text: hintText
    });

    /* the live input; one line, always the one you are writing */
    const field = el('input', {
      class: 'wfield', type: 'text', id: uid, spellcheck: 'false',
      autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off',
      'aria-describedby': uid + '-hint',
      placeholder: o.placeholder || (isMl
        ? 'ഒരു വരി എഴുതുക — വാക്കുകൾ, അല്ലെങ്കിൽ \\frac{a}{b} പോലുള്ള ഗണിത രൂപങ്ങൾ…'
        : (mathFirst
          ? '\\forall \\varepsilon > 0 \\; \\exists \\delta > 0 \\ldots'
          : 'Write a line — words, **bold**, or maths like \\varepsilon > 0 …'))
    });

    const newlineBtn = el('button', { class: 'wkey', type: 'button',
      title: isMl ? 'അടുത്ത വരി തുടങ്ങുക (Enter)' : 'Start the next line (Enter)',
      'aria-label': isMl ? 'അടുത്ത വരി തുടങ്ങുക' : 'Start the next line' },
      [DOM.mi('keyboard_return', 'sm')]);

    const mathBtn = el('button', { class: 'wkey', type: 'button',
      title: isMl ? 'ഈ വരി മുഴുവൻ സമവാക്യമാക്കുക' : 'Wrap this line in display maths',
      'aria-label': isMl ? 'ഈ വരി മുഴുവൻ സമവാക്യമാക്കുക' : 'Wrap this line in display maths' },
      [DOM.mi('functions', 'sm')]);

    /* ── rendering one line ────────────────────────────────────────────── */

    /* Returns a promise resolving {ok, error, hint} so the active line can
       report, and settled lines can stay quiet. */
    function paint(target, src) {
      const text = String(src == null ? '' : src);

      if (!text.trim()) {
        DOM.clear(target);
        target.appendChild(el('div', { class: 'ph',
          text: target.dataset.live ? (isMl ? 'നിങ്ങൾ ടൈപ്പ് ചെയ്യുമ്പോൾ ഈ വരി ഇവിടെ ദൃശ്യമാകും.' : 'This line renders here as you type.') : ' ' }));
        return Promise.resolve({ ok: true, empty: true });
      }

      if (mathFirst && !Markdown.hasMath(text)) {
        return Tex.renderFragment(target, text, { display: true });
      }

      DOM.clear(target);
      target.appendChild(el('div', { class: 'prose tight', html: Markdown.line(text) }));
      return Tex.typeset(target).then(function () {
        const bad = target.querySelector('mjx-merror, [data-mjx-error]');
        if (!bad) return { ok: true };
        return { ok: false,
          error: bad.getAttribute('data-mjx-error') || bad.textContent || (isMl ? 'ഈ വരിയിലെ ഗണിത രൂപം കാണിക്കാൻ കഴിഞ്ഞില്ല.' : 'MathJax could not parse the maths on this line.') };
      });
    }

    function showProblem(res) {
      if (!res || res.ok === true && !res.hint) { errBox.hidden = true; DOM.clear(errBox); return; }
      if (res.ok && res.hint) {
        DOM.clear(errBox);
        errBox.appendChild(el('div', { class: 'tex-err' }, [
          DOM.mi('info', 'sm'), el('span', { text: res.hint })
        ]));
        errBox.hidden = false;
        return;
      }
      if (res.ok) { errBox.hidden = true; DOM.clear(errBox); return; }
      DOM.clear(errBox);
      errBox.appendChild(el('div', { class: 'tex-err' }, [
        DOM.mi('report', 'sm'),
        el('span', {}, [
          el('b', { text: isMl ? 'ഈ വരി ഇതുവരെ വ്യക്തമായി രൂപപ്പെടുത്തിയിട്ടില്ല. ' : 'This line does not render yet. ' }),
          el('span', { text: res.error || (isMl ? '{ അല്ലെങ്കിൽ } കൃത്യമാണോ എന്ന് പരിശോധിക്കുക.' : 'Check for an unmatched { or }.') })
        ])
      ]));
      errBox.hidden = false;
    }

    /* ── the document ──────────────────────────────────────────────────── */

    let liveOut = null;          /* the output frame above the active input */

    /* Settled lines are re-rendered on every rebuild, and MathJax is the most
       expensive thing in the app. Their output only depends on their source,
       so keep the markup by source text and reuse it. */
    const cache = {};

    function build() {
      DOM.clear(doc);
      liveOut = null;

      lines.forEach(function (text, i) {
        const out = el('div', { class: 'wout' });
        const row = el('div', { class: 'wline' + (i === active ? ' live' : '') }, [
          el('span', { class: 'wnum', 'aria-hidden': 'true', text: String(i + 1) }),
          out
        ]);

        if (i === active) {
          out.dataset.live = '1';
          liveOut = out;
          doc.appendChild(row);
          doc.appendChild(el('div', { class: 'winput' }, [
            el('span', { class: 'wcaret', 'aria-hidden': 'true', text: '›' }),
            field, mathBtn, newlineBtn
          ]));
          field.value = text;
          paint(out, text).then(showProblem);
        } else {
          /* a settled line reopens on tap — that is the only way back */
          row.setAttribute('tabindex', '0');
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', (isMl ? 'വരി തിരുത്തുക ' : 'Edit line ') + (i + 1));
          const open = function (e) {
            if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
            e.preventDefault();
            focusLine(i, 'end');
          };
          row.addEventListener('click', open);
          row.addEventListener('keydown', open);
          doc.appendChild(row);
          if (cache[text] != null) out.innerHTML = cache[text];
          else paint(out, text).then(function () { cache[text] = out.innerHTML; });
        }
      });
    }

    const liveRender = DOM.debounce(function () {
      if (liveOut) paint(liveOut, field.value).then(showProblem);
    }, 200);

    const persist = DOM.debounce(function () {
      if (!draftKey) return;
      Store.saveDraft(draftKey, value());
      saveNote.textContent = value().trim() ? (isMl ? 'സേവ് ചെയ്തു' : 'Draft saved') : '';
    }, 700);

    function commitField() { lines[active] = field.value; }

    function focusLine(i, caret) {
      commitField();
      active = Math.max(0, Math.min(lines.length - 1, i));
      build();
      refreshStrip();
      /* synchronously: a requestAnimationFrame here leaves the user-gesture
         context, and iOS then refuses to bring the keyboard back up */
      field.focus();
      const at = caret === 'end' ? field.value.length : (caret || 0);
      try { field.setSelectionRange(at, at); } catch (e) { /* not focusable yet */ }
      revealInput();
    }

    /* ── completions ───────────────────────────────────────────────────── */
    let matches = [];
    let picked = 0;

    function refreshStrip() {
      const caret = field.selectionStart == null ? field.value.length : field.selectionStart;
      const tok = Latex.tokenAt(field.value, caret);
      matches = tok ? Latex.complete(tok.word, concept, 12) : Latex.suggestions(concept, 14);
      picked = 0;

      DOM.clear(strip);
      strip.appendChild(el('span', { class: 'wstrip-l', 'aria-hidden': 'true',
        text: tok ? (tok.text || '\\') : (isMl ? 'കമാൻഡുകൾ' : 'commands') }));

      matches.forEach(function (k, i) {
        strip.appendChild(el('button', {
          class: 'wsug' + (i === picked && tok ? ' on' : ''),
          type: 'button', role: 'option', 'aria-selected': String(i === picked && !!tok),
          title: '\\' + k.cmd + (k.desc ? ' — ' + k.desc : ''),
          on: { click: function () { take(k); } }
        }, [
          el('span', { class: 's', text: k.show }),
          el('span', { class: 'c', text: '\\' + k.cmd })
        ]));
      });

      if (!matches.length) {
        strip.appendChild(el('span', { class: 'small muted',
          text: isMl ? 'ഈ അക്ഷരങ്ങളുമായി പൊരുത്തപ്പെടുന്ന കമാൻഡുകളില്ല' : 'no command matches that spelling' }));
      }
    }

    /* Insert a command bare. It used to be wrapped in $…$ on the way in; that
       is now auto-math's job, and doing it here as well would fence half a
       sentence the learner is still writing. */
    function take(entry) {
      Latex.accept(field, entry, { wrapInMath: false });
      refreshStrip();
      revealInput();
    }

    /* ── keeping the input above the keyboard ────────────────────────────────
       An on-screen keyboard shrinks the VISUAL viewport but not the layout
       one, so an input near the bottom ends up behind it and the page looks
       like it simply refuses to scroll far enough. Correct it by hand: measure
       how far the input row plus its command strip overflow the visible
       bottom, and scroll the nearest scrolling ancestor by exactly that — the
       reel when we are inside it, the window otherwise. */
    function scroller(node) {
      let n = node.parentElement;
      while (n && n !== document.body) {
        const st = window.getComputedStyle(n);
        if (/(auto|scroll)/.test(st.overflowY) && n.scrollHeight > n.clientHeight + 4) return n;
        n = n.parentElement;
      }
      return null;
    }

    function revealInput() {
      if (document.activeElement !== field) return;
      const vv = window.visualViewport;
      const bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      const r = strip.getBoundingClientRect();
      const inputTop = field.getBoundingClientRect().top;

      let by = 0;
      const over = r.bottom + 12 - bottom;
      if (over > 1) by = over;
      else if (inputTop - 12 < top) by = inputTop - top - 12;
      if (!by) return;

      const sc = scroller(field);
      if (sc) sc.scrollTop += by;
      else window.scrollBy(0, by);
    }

    const reveal = DOM.debounce(revealInput, 90);
    field.addEventListener('focus', reveal);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', reveal);
      window.visualViewport.addEventListener('scroll', reveal);
    }

    /* ── keys ──────────────────────────────────────────────────────────── */
    field.addEventListener('input', function () {
      reveal();
      liveRender();
      commitField();
      persist();
      refreshStrip();
      if (!firstInputFired && field.value.trim()) {
        firstInputFired = true;
        if (o.onFirstInput) o.onFirstInput();
      }
    });

    field.addEventListener('keydown', function (e) {
      const caret = field.selectionStart == null ? 0 : field.selectionStart;
      const len = field.value.length;

      if (e.key === 'Tab' && matches.length) {
        const tok = Latex.tokenAt(field.value, caret);
        if (tok) {
          e.preventDefault();
          take(matches[picked] || matches[0]);
          return;
        }
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        newLine();
        return;
      }

      if (e.key === 'Backspace' && caret === 0 && field.selectionEnd === 0 && active > 0) {
        e.preventDefault();
        commitField();
        const carry = lines[active];
        const prevLen = lines[active - 1].length;
        lines[active - 1] += carry;
        lines.splice(active, 1);
        focusLine(active - 1, prevLen);
        persist();
        return;
      }

      if (e.key === 'ArrowUp' && caret === 0 && active > 0) {
        e.preventDefault();
        focusLine(active - 1, 'end');
        return;
      }

      if (e.key === 'ArrowDown' && caret === len && active < lines.length - 1) {
        e.preventDefault();
        focusLine(active + 1, 'end');
      }
    });

    field.addEventListener('click', refreshStrip);
    field.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') refreshStrip();
    });

    function newLine() {
      commitField();
      /* Enter on the last line when it is empty means "done", not "another
         blank line" — otherwise the document grows a tail of empties. */
      if (active === lines.length - 1 && !lines[active].trim() && lines.length > 1) {
        field.blur();
        return;
      }
      lines.splice(active + 1, 0, '');
      focusLine(active + 1, 0);
      persist();
    }

    newlineBtn.addEventListener('click', newLine);

    mathBtn.addEventListener('click', function () {
      const t = field.value.trim();
      const wrapped = /^\$\$[\s\S]*\$\$$/.test(t);
      field.value = wrapped ? t.replace(/^\$\$\s*|\s*\$\$$/g, '') : '$$ ' + t + ' $$';
      commitField();
      field.dispatchEvent(new Event('input', { bubbles: true }));
      field.focus();
    });

    /* ── assemble ──────────────────────────────────────────────────────── */
    const value = () => lines.join('\n');

    const box = el('div', { class: 'stack wbox', style: { gap: '10px' } }, [
      el('div', { class: 'spread' }, [
        el('label', { class: 'kicker', for: uid,
          text: o.label || (isMl ? 'എഴുതുക — ഓരോ വരിയായി' : 'Write it — one line at a time') }),
        saveNote
      ]),
      doc,
      strip,
      errBox,
      hint,
      el('p', {
        class: 'small muted', style: { margin: 0 },
        text: isMl ? 'നിങ്ങൾ എഴുതിയ ഗണിത രൂപം ശരിയായി ദൃശ്യമാകുന്നുണ്ടോ എന്ന് മാത്രമാണ് ഇത് പരിശോധിക്കുന്നത്. ഗണിത യുക്തി സ്വയം വിലയിരുത്തുക.'
                   : 'This checks only that what you wrote renders — not whether the mathematics is correct. That judgement stays yours.'
      })
    ]);
    host.appendChild(box);

    build();
    refreshStrip();

    return {
      value: value,
      focus: () => field.focus(),
      hasContent: () => !!value().trim(),
      node: box
    };
  }

  return { mount };
})();


/* ── src/view.login.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Sign in.

   The app does not open until there is a name and a roll number, because
   those two are the key the record is stored and merged under. A progress
   record that starts anonymous and is claimed later cannot be merged honestly
   — you would have to guess which device's history was whose.

   Be straight about what this is: it is a PASS KEY, not a password. Anyone who
   knows both halves can open this record. It exists so your work follows you
   between a phone and a laptop without an account to create, and the screen
   says exactly that rather than dressing it up as security.
   ══════════════════════════════════════════════════════════════════════════ */

const Login = (function () {

  const el = DOM.el;

  function mount(host, onDone) {
    const namePh = (typeof I18N !== 'undefined') ? I18N.t('login_name_ph') : 'e.g. Student Name';
    const rollPh = (typeof I18N !== 'undefined') ? I18N.t('login_roll_ph') : 'e.g. Roll Number';

    const nameIn = el('input', {
      class: 'tin', type: 'text', id: 'login-name', autocomplete: 'name',
      placeholder: namePh, spellcheck: 'false', enterkeyhint: 'next'
    });
    const rollIn = el('input', {
      class: 'tin', type: 'text', id: 'login-roll', autocomplete: 'off',
      placeholder: rollPh, spellcheck: 'false', enterkeyhint: 'go'
    });

    const known = Store.identity();
    nameIn.value = known.name || '';
    rollIn.value = known.roll || '';

    const note = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const go = el('button', {
      class: 'btn primary', type: 'submit',
      text: (typeof I18N !== 'undefined') ? I18N.t('login_submit') : 'Open my study record'
    });

    const keyLine = el('p', { class: 'small mono', style: { margin: '8px 0 0', color: 'var(--ink-3)' } });
    function paintKey() {
      const k = Sync.keyFor(nameIn.value, rollIn.value);
      keyLine.textContent = k ? 'record: ' + k : '';
    }
    nameIn.addEventListener('input', paintKey);
    rollIn.addEventListener('input', paintKey);
    paintKey();

    let busy = false;
    function submit(e) {
      if (e) e.preventDefault();
      if (busy) return;
      const name = nameIn.value.trim(), roll = rollIn.value.trim();
      if (!name || !roll) {
        note.textContent = (typeof I18N !== 'undefined')
          ? I18N.t('login_both_needed')
          : 'Both a name and a roll number are needed — together they are the key.';
        (name ? rollIn : nameIn).focus();
        return;
      }
      busy = true;
      go.disabled = true;
      go.textContent = (typeof I18N !== 'undefined') ? I18N.t('login_opening') : 'Opening…';
      note.textContent = (typeof I18N !== 'undefined') ? I18N.t('login_looking') : 'Looking for an existing record…';

      Store.signIn(name, roll);
      Sync.hello().then(function (r) {
        note.textContent = r.msg || '';
        onDone(r);
      }, function () {
        /* offline is not a reason to lock someone out of their own device */
        note.textContent = '';
        onDone({ ok: false, offline: true });
      });
    }

    const kickerText = (typeof I18N !== 'undefined') ? I18N.t('login_kicker') : 'Class 8 Mathematics · Math Base';
    const titleText = (typeof I18N !== 'undefined') ? I18N.t('login_title') : 'Sign in to your record';
    const ledeText = (typeof I18N !== 'undefined') ? I18N.t('login_lede') : 'Your name and roll number are the key your progress is stored under.';
    const nameLabel = (typeof I18N !== 'undefined') ? I18N.t('login_name') : 'Name';
    const rollLabel = (typeof I18N !== 'undefined') ? I18N.t('login_roll') : 'Roll number';
    const passkeyTitle = (typeof I18N !== 'undefined') ? I18N.t('login_passkey_title') : 'This is a pass key, not a password.';
    const passkeyDesc = (typeof I18N !== 'undefined') ? I18N.t('login_passkey_desc') : 'Anyone who knows your name and roll number can open this record.';

    const form = el('form', { class: 'stack', style: { gap: '14px' }, on: { submit: submit } }, [
      el('div', {}, [
        el('div', { class: 'kicker', text: kickerText }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: titleText })
      ]),
      el('p', { class: 'lede', text: ledeText }),
      el('div', { class: 'card' }, [
        el('label', { class: 'kicker', for: 'login-name', text: nameLabel }),
        el('div', { style: { margin: '6px 0 14px' } }, [nameIn]),
        el('label', { class: 'kicker', for: 'login-roll', text: rollLabel }),
        el('div', { style: { margin: '6px 0 0' } }, [rollIn]),
        keyLine
      ]),
      el('div', { class: 'btn-row' }, [go]),
      note,
      el('div', { class: 'banner' }, [
        DOM.mi('info'),
        el('span', {}, [
          el('b', { text: passkeyTitle + ' ' }),
          el('span', { text: passkeyDesc })
        ])
      ]),
      Pool.isMock() ? el('p', { class: 'small muted', style: { margin: 0 },
        text: 'Test build: records here are kept in a separate store from the real app, so nothing you do can reach it.' }) : null
    ]);

    nameIn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); rollIn.focus(); }
    });

    host.appendChild(el('div', { class: 'wrap view-in' }, [form]));
    (nameIn.value ? rollIn : nameIn).focus();
  }

  return { mount };
})();


/* ── src/view.home.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Today — the plan for the day, and what the app actually knows about you.

   The order of the page is the order of the evidence: the plan first (what to
   do), then the daily goal and streak (whether you are doing it), then the
   feedback the research says matters most — weak spots, why marks are lost,
   and calibration — then the numbers, the exam, and the courses.

   The tiles keep completion, exercises and recall apart on purpose: reading a
   note is Level 1 and says nothing about recall, so the numbers are never
   merged into one flattering percentage.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewHome = (function () {

  const el = DOM.el;
  const t = k => I18N.t(k);
  const isMl = () => I18N.lang() === 'ml';

  /* ── greeting row ──────────────────────────────────────────────────────── */
  function greeting() {
    const h = new Date().getHours();
    const word = h < 12 ? t('greeting_morning') : h < 17 ? t('greeting_day') : t('greeting_evening');
    const name = (Store.identity().name || '').split(' ')[0];
    const st = Study.streak();
    const ex = Study.exam();

    return el('div', { class: 'today-head' }, [
      el('div', {}, [
        el('div', { class: 'kicker', text: word + (name ? ', ' + name : '') }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: t('today_title') })
      ]),
      el('div', { class: 'row', style: { gap: '6px' } }, [
        el('span', { class: 'chip stat-chip' + (st.today ? ' on' : ''), title: t('streak_hint') }, [
          DOM.mi(st.current ? 'local_fire_department' : 'mode_heat', 'sm'),
          el('span', { text: st.current ? st.current + ' ' + t('streak') : t('streak_none') })
        ]),
        ex.days >= 0 ? el('a', { class: 'chip stat-chip', href: '#exam-card' }, [
          DOM.mi('event', 'sm'),
          el('span', { text: ex.days === 0 ? t('exam_today') : ex.days + ' ' + t('exam_days_left') })
        ]) : null
      ])
    ]);
  }

  /* ── the plan ──────────────────────────────────────────────────────────── */
  function planStep(i, s) {
    const ml = isMl();
    let label, detail, icon;
    switch (s.kind) {
      case 'review':
        icon = 'replay';
        label = s.n ? t('plan_review') : t('plan_review_none');
        detail = s.n ? s.n + ' ' + t('plan_review_detail') : t('streak_hint');
        break;
      case 'weak':
        icon = 'fitness_center';
        label = t('plan_weak');
        detail = s.items.slice(0, 3).map(x => x.c.title).join(' · ') + (s.items.length > 3 ? ' · +' + (s.items.length - 3) : '');
        break;
      case 'read':
        icon = 'menu_book';
        label = s.concept ? t('plan_read') + ': ' + s.concept.title : t('plan_read_done');
        detail = s.concept ? Pool.sectionTitle(s.concept.sec) + ' · ' + t('plan_read_detail') : '';
        break;
      case 'exercise':
        icon = 'edit_square';
        label = s.q ? t('plan_exercise') + ': ' + (s.q.title || s.q.id) : t('plan_exercise_done');
        detail = s.concept ? Pool.sectionTitle(s.concept.sec) + ' · ' + t('plan_exercise_detail') : '';
        break;
      case 'drill':
        icon = 'timer';
        label = t('plan_drill');
        detail = s.ready ? s.n + ' ' + t('plan_drill_detail') : t('plan_drill_locked');
        break;
      case 'teach':
        icon = 'record_voice_over';
        label = t('plan_teach') + (s.concept ? ': ' + s.concept.title : '');
        detail = t('plan_teach_detail');
        break;
      default:
        icon = 'circle'; label = s.kind; detail = '';
    }
    const cls = 'item plan-step' + (s.done ? ' is-done' : '') + (s.ready ? '' : ' is-idle');
    return el('a', { class: cls, href: Router.href(s.href) }, [
      el('span', { class: 'ix' + (s.done ? ' ok' : '') }, [DOM.mi(s.done ? 'check' : icon, 'xs')]),
      el('span', { class: 'tt' }, [el('b', { text: label }), detail ? el('span', { text: detail }) : null]),
      s.count ? el('span', { class: 'count', text: s.count }) : null,
      el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
    ]);
  }

  function planCard() {
    const steps = Study.plan();
    return el('div', { class: 'card glass' }, [
      el('div', { class: 'kicker', text: t('plan_title') }),
      el('p', { class: 'small muted', style: { margin: '4px 0 12px' }, text: t('plan_desc') }),
      el('div', { class: 'list' }, steps.map((s, i) => planStep(i, s)))
    ]);
  }

  /* ── daily goal and streak ─────────────────────────────────────────────── */
  function goalCard(rerender) {
    const g = Study.goalState();
    const st = Study.streak();
    const chip = (k, label) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(g.key === k), on: { click: function () { Study.setGoal(k); rerender(); } } });

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: t('goal_title') }),
        el('span', { class: 'badge' + (g.met ? ' ok' : ''), text: g.met ? t('goal_met') : g.pct + '%' })
      ]),
      el('div', { class: 'row', style: { margin: '10px 0 12px' } }, [
        chip('light', t('goal_light')), chip('normal', t('goal_normal')), chip('exam', t('goal_exam'))
      ]),
      el('div', { class: 'goal-grid' }, g.rows.map(function (r) {
        return el('div', { class: 'goal-row' }, [
          el('div', { class: 'spread' }, [
            el('span', { class: 'small', text: t('goal_' + r.key) }),
            el('span', { class: 'count', text: r.raw + '/' + r.want })
          ]),
          UI.meter(r.done, r.want, r.done >= r.want ? true : undefined)
        ]);
      })),
      el('div', { class: 'row', style: { marginTop: '12px', gap: '10px' } }, [
        el('span', { class: 'badge' + (st.current ? ' warn' : ''), text: st.current + ' ' + t('streak') }),
        el('span', { class: 'small muted', text: t('streak_best') + ' ' + st.best + ' · ' + t('streak_hint') })
      ]),
      el('p', { class: 'small muted', style: { margin: '10px 0 0' }, text: t('goal_note') })
    ]);
  }

  /* ── focus timer ───────────────────────────────────────────────────────── */
  function focusCard() {
    const F = Study.Focus;
    const host = el('div', { class: 'card tint focus-card' });
    const clock = el('div', { class: 'focus-clock', 'aria-live': 'off' });
    const phase = el('div', { class: 'small muted' });
    const ring = el('div', { class: 'focus-ring' }, [clock]);
    const actions = el('div', { class: 'btn-row', style: { marginTop: '12px' } });
    const presets = el('div', { class: 'row', style: { marginTop: '10px' } });
    const todayLine = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });

    function paintPresets() {
      DOM.clear(presets);
      Object.keys(F.PRESETS).forEach(function (k) {
        const p = F.PRESETS[k];
        presets.appendChild(el('button', { class: 'chip', type: 'button',
          'aria-pressed': String(Store.pref('focusPreset', 'normal') === k),
          text: p[0] + ' + ' + p[1] + ' ' + t('minutes'),
          on: { click: function () { F.setPreset(k); paintPresets(); paint(F.state()); } } }));
      });
    }

    function paint(s) {
      clock.textContent = UI.clock(s.left);
      const pct = s.total ? Math.round(100 * (1 - s.left / s.total)) : 0;
      ring.style.setProperty('--p', String(s.phase === 'idle' ? 0 : pct));
      ring.setAttribute('data-phase', s.phase);
      phase.textContent = s.phase === 'idle' ? t('focus_desc')
        : s.over ? t('focus_done')
        : s.phase === 'break' ? t('focus_on_break') : t('focus_running');
      DOM.clear(actions);
      if (s.phase === 'idle') {
        actions.appendChild(el('button', { class: 'btn primary', type: 'button',
          on: { click: function () { F.start('focus'); } } }, [DOM.mi('play_arrow', 'sm'), el('span', { text: t('focus_start') })]));
      } else if (s.over && s.phase === 'focus') {
        actions.appendChild(el('button', { class: 'btn primary', type: 'button', text: t('focus_break'),
          on: { click: function () { F.start('break'); } } }));
        actions.appendChild(el('button', { class: 'btn', type: 'button', text: t('focus_stop'),
          on: { click: function () { F.stop(); } } }));
      } else if (s.over) {
        actions.appendChild(el('button', { class: 'btn primary', type: 'button', text: t('focus_start'),
          on: { click: function () { F.start('focus'); } } }));
        actions.appendChild(el('button', { class: 'btn', type: 'button', text: t('focus_stop'),
          on: { click: function () { F.stop(); } } }));
      } else {
        actions.appendChild(el('button', { class: 'btn', type: 'button', text: t('focus_stop'),
          on: { click: function () { F.stop(); } } }));
      }
      const td = F.today();
      todayLine.textContent = td.min + ' ' + t('minutes') + ' ' + t('focus_today') + ' · ' + td.blocks + ' ' + t('focus_blocks');
    }

    const watcher = function (s) { if (!document.body.contains(host)) { F.unwatch(watcher); return; } paint(s); };
    paint(F.watch(watcher));
    paintPresets();

    DOM.add(host, [
      el('div', { class: 'kicker', text: t('focus_title') }),
      el('div', { class: 'focus-row' }, [ring, el('div', { class: 'grow' }, [phase, actions])]),
      presets, todayLine
    ]);
    return host;
  }

  /* ── weak spots, mistakes, calibration ─────────────────────────────────── */
  function weakCard() {
    const weak = Study.weakSpots(6);
    if (!weak.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: t('weak_title') }),
        el('a', { class: 'chip on', href: Router.href('recall?mode=weak'), text: t('weak_drill') })
      ]),
      el('p', { class: 'small muted', style: { margin: '6px 0 10px' }, text: t('weak_desc') }),
      el('div', { class: 'list' }, weak.map(function (w) {
        return el('a', { class: 'item', href: Router.href('note/' + w.cid) }, [
          el('span', { class: 'ix bad' }, [DOM.mi('priority_high', 'xs')]),
          el('span', { class: 'tt' }, [
            el('b', { text: w.c.title }),
            el('span', { text: Pool.sectionTitle(w.c.sec) })
          ]),

        ]);
      }))

  function mistakesCard() {

  function calibrationCard() {

    ]);

  function statTiles() {
    const all = Pool.ids.concepts();
    const overall = Progress.count(all);
    const s = Store.summary(all, Pool.ids.cards(), Pool.ids.objective(), Pool.ids.proofs());
    const tasks = Pool.ids.written();
    const tasksDone = tasks.filter(id => Store.isProofDone('w:' + id)).length;
    const pyqAll = Pool.pyq();
    const pyqDone = pyqAll.filter(q => Progress.pyqDone(q)).length;
    const lvl = t('level');

    return DOM.stagger(el('div', { class: 'stats' }, [
      UI.stat(overall.l1 + '/' + overall.total, t('stat_read'), lvl + ' 1', UI.levelBar(overall, { key: false })),
      UI.stat(tasksDone + '/' + tasks.length, t('stat_exercises'), lvl + ' 2', UI.meter(tasksDone, tasks.length, 2)),
      UI.stat(pyqDone + '/' + pyqAll.length, t('stat_pyq'), lvl + ' 3', UI.meter(pyqDone, pyqAll.length, 3)),
      UI.stat(s.cards.tried ? DOM.pct(s.cards.got, s.cards.tried) + '%' : '—', t('stat_recall'),
        s.cards.tried + ' ' + t('of') + ' ' + s.cards.total + ' ' + t('tried')),
      UI.stat(s.omr.locked ? DOM.pct(s.omr.correct, s.omr.locked) + '%' : '—', t('stat_correct'),

  function examCard(rerender) {

  function syncCard() {

    const state = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const dot = el('span', { class: 'badge ok', text: Sync.status().key });

    function paint(last) {

      const when = s.last && s.last.at
        ? (ml ? ' · അവസാനം പരിശോധിച്ചത് ' + UI.ago(s.last.at) : ' · last checked ' + UI.ago(s.last.at))
        : '';

            ? id.name + ' · ' + id.roll + ' എന്നതിൽ പ്രവേശിച്ചിരിക്കുന്നു. ഈ പേരും റോൾ നമ്പറും നൽകുന്ന എല്ലാ ഉപകരണങ്ങളിലും പുരോഗതി തനിയെ ലയിക്കും' + when + '. ഇത് ഒരു പാസ്‌വേഡല്ല.'
            : 'Signed in as ' + id.name + ' · ' + id.roll + '. Progress merges across every device '

    }

    /* The confirmation is inline, not a browser dialog: hosted pages often

    const askHost = el('div', {});

      el('div', { class: 'btn-row', style: { marginTop: '10px' } }, [

                : 'Progress stays on this device and in the cloud record.' }),

                { label: t('cancel'), onClick: function () { DOM.clear(askHost); } }
              ]

      ]),

          el('div', { class: 'row' }, [el('span', { class: 'badge lv2', text: lvl + ' 2' }), el('span', { class: 'small muted', text: t('lv2_desc') })]),
          el('div', { class: 'row' }, [el('span', { class: 'badge lv3', text: lvl + ' 3' }), el('span', { class: 'small muted', text: t('lv3_desc') })])

/* ══════════════════════════════════════════════════════════════════════════
   Study — the whole syllabus as one page of dropdowns you read your way
   through.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewStudy = (function () {

  const el = DOM.el;

  function levelWord(n) {
    return (typeof I18N !== 'undefined') ? I18N.levelName(n) : ['not started', 'read', 'exercises done', 'past papers done'][n || 0];
  }

  function summaryStrip() {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const ids = Pool.ids.concepts();
    const c = Progress.count(ids);
    const readText = isMl ? (c.l1 + ' / ' + c.total + ' വായിച്ചു') : (c.l1 + ' of ' + c.total + ' read');
    const lvlText = c.min ? ((typeof I18N !== 'undefined' ? I18N.t('level') : 'level') + ' ' + c.min + ' · ' + levelWord(c.min)) : levelWord(0);

    return el('div', { class: 'card glass' }, [
      el('div', { class: 'spread' }, [
        el('div', {}, [
          el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('where_stands') : 'Where the syllabus stands' }),
