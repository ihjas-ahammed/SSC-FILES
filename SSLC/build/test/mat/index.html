            text: readText })
        ]),
        el('span', { class: 'badge' + (c.min ? ' lv' + c.min : ''), text: lvlText })
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.levelBar(c)])
    ]);
  }

  function courseView(course) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const root = el('div', { class: 'stack' });
    const host = el('div', {});
    const ids = Pool.ids.concepts(course.id);
    const c = Progress.count(ids);
    const pyq = Progress.pyqState(course.id);

    DOM.add(root, [
      UI.crumb([{ text: (typeof I18N !== 'undefined') ? I18N.t('tab_study') : 'Study', href: 'study' }, { text: course.title }]),
      UI.title(course.title, course.code + (course.sem && course.sem !== '—' ? ' · ' + course.sem : '')),
      el('p', { class: 'lede', text: course.blurb }),
      course.pending
        ? el('div', { class: 'banner' }, [
            DOM.mi('hourglass_empty'),
            el('span', {}, [el('b', { text: isMl ? 'തയ്യാറായിട്ടില്ല. ' : 'Not built yet. ' }), course.pendingNote || I18N.t('not_delivered')])
          ])
        : el('div', { class: 'card tint' }, [
            el('div', { class: 'spread' }, [
              el('span', { class: 'kicker', text: I18N.t('levels_reached') }),
              el('span', { class: 'count', text: c.l1 + ' / ' + c.l2 + ' / ' + c.l3 + ' of ' + c.total })
            ]),
            el('div', { style: { marginTop: '8px' } }, [UI.levelBar(c)]),
            pyq.total ? el('div', { class: 'spread', style: { marginTop: '12px' } }, [
              el('span', { class: 'count', text: I18N.t('past_papers_lv') }),
              el('span', { class: 'count', text: pyq.done + '/' + pyq.total })
            ]) : null,
            pyq.total ? el('div', { style: { marginTop: '6px' } },
              [UI.meter(pyq.done, pyq.total, 3)]) : null
          ]),
      host
    ]);

    Tree.mount(host, course);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const course = Pool.course(args[0]);
      if (course) return courseView(course);
    }

    const root = el('div', { class: 'stack' });
    const host = el('div', {});
    Tree.seedOpen(Pool.courses().filter(c => !c.pending)[0]);

    DOM.add(root, [
      UI.title((typeof I18N !== 'undefined') ? I18N.t('syllabus') : 'Syllabus',
        (typeof I18N !== 'undefined') ? I18N.t('syllabus_sub') : 'Open a module, read what is inside it'),
      UI.mockBanner(),
      summaryStrip(),
      host,
      el('p', { class: 'small muted', style: { margin: 0 },
        text: (typeof I18N !== 'undefined') ? I18N.t('syllabus_foot') : 'One press on a row advances it...' })
    ]);

    Tree.mountAll(host, Pool.courses());
    return root;
  }

  /* `keepScroll` tells the shell not to jump to the top: this view restores
     the position of whatever was left open instead. */
  function afterPaint() { Tree.scrollToOpen(); }

  return { render, afterPaint, keepScroll: true };
})();


/* ── src/view.note.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   `#/note/<id>` — kept, and no longer a page.

   The note is a component now (comp.note.js) that opens inside the syllabus
   tree. But `#/note/<id>` is written into hundreds of places: every
   prerequisite path, every "used later by" chip, and every concept reference
   `DOM.linkifyConcepts` finds in authored prose. Breaking them would mean
   rewriting content to fix navigation, which is backwards.

   So the route survives as a jump: open the path down to that concept and
   hand over to Study, which lands on it. One scroll, one screen, and every
   old link still means what it said.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewNote = (function () {

  const el = DOM.el;

  function render(args, query) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const id = args && args[0];
    /* `?teach=1` from the plan opens the note on its teach-back box */
    if (query && query.teach && typeof NoteBody !== 'undefined' && NoteBody.wantOpen) NoteBody.wantOpen('teach');
    if (!Pool.concept(id)) {
      return el('div', { class: 'stack' }, [
        UI.title(isMl ? 'കണ്ടെത്താനായില്ല' : 'Not found'),
        UI.empty(isMl ? 'ഈ ആശയം ലഭ്യമായ പാഠ്യപദ്ധതിയിലില്ല.' : 'That concept is not in the loaded pool.',
          el('a', { class: 'btn', href: Router.href('study'), text: isMl ? 'പാഠ്യപദ്ധതിയിലേക്ക് മടങ്ങുക' : 'Back to the syllabus' }))
      ]);
    }
    Tree.revealPath(id);
    return ViewStudy.render([]);
  }

  return { render, afterPaint: () => Tree.scrollToOpen(), keepScroll: true };
})();


/* ── src/view.recall.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Recall, as a reel.

   One card per screen, swiped vertically, exactly one card per swipe. Getting
   that last part right is the whole job: a flick carries momentum, and a
   proximity-snapped scroller happily sails past two or three cards before it
   settles. `scroll-snap-stop: always` is the rule that forbids it. Every card
   is therefore exactly one viewport tall, and a card whose content overflows
   scrolls INSIDE itself and chains out at its ends.

   NOTHING COUNTS THE CARDS. There is no rail of dots, no "3 / 47", no "end of
   the reel" — you scroll and the next thing arrives, the way a reel is
   supposed to feel. Cards are appended a handful at a time as you approach the
   bottom, and the queue re-queries itself when it runs dry, so ticking a
   concept in Study while the reel is open makes new cards appear behind you
   rather than requiring a reload.

   What is in it, and in what order, is core.progress.js's business
   (`Progress.reel`): only material you have met, scheduled by Leitner box, due
   cards shuffled so no two passes are alike, and cards you know well a long
   way back. Nothing repeats within a pass.

   The rules are unchanged: nothing is revealed before an attempt, and the
   first grade is the one that counts. Two additions from the research: you
   say how sure you are BEFORE the reveal (calibration), and after a miss you
   say why (the mistake log). Both are one tap.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewRecall = (function () {

  const el = DOM.el;
  const getGrades = () => [
    { k: 'got', label: (typeof I18N !== 'undefined' ? I18N.t('stated_it') : 'Stated it'), cls: 'primary' },
    { k: 'partly', label: (typeof I18N !== 'undefined' ? I18N.t('partly') : 'Partly'), cls: '' },
    { k: 'missed', label: (typeof I18N !== 'undefined' ? I18N.t('missed_it') : 'Missed it'), cls: '' }
  ];
  const BATCH = 6;          /* how many cards to add at a time */
  const LOOKAHEAD = 3;      /* how close to the end before the next batch */

  /* What the reel draws from. 'all' is everything due, mixed across chapters
     (the default, because interleaving is the point); 'new' is cards never
     attempted; 'weak' is cards on the concepts you keep missing; 'chapter'
     is one chapter only, for the first days after reading it. */
  let mode = 'all';
  let chapter = null;          /* module id when mode is 'chapter' */
  let startAt = null;          /* concept id to open on, from ?from= */
  const t = k => I18N.t(k);

  function draw(exclude) {
    let list = Progress.reel({ onlyNew: mode === 'new', exclude: exclude });
    if (mode === 'weak') {
      const weak = Study.weakIds();
      list = list.filter(x => x.cid && weak[x.cid]);
    } else if (mode === 'chapter' && chapter) {
      list = list.filter(function (x) {
        const m = Pool.moduleOfSec(x.sec);
        return m && m.id === chapter;
      });
    }
    return list;
  }

  /* the chapters that have anything in the reel at all */
  function chaptersInReel() {
    const seen = {}, out = [];
    Progress.reel().forEach(function (x) {
      const m = Pool.moduleOfSec(x.sec);
      if (m && !seen[m.id]) { seen[m.id] = true; out.push(m); }
    });
    return out;
  }

  /* ── intro card ──────────────────────────────────────────────────────────
     The only place the reel is configured, and it says nothing about how much
     is left — that is the point. */
  function introCard(rebuild) {
    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: fn } });

    const anything = Progress.reel().length;
    const d = Study.due();
    const weakN = Object.keys(Study.weakIds()).length;
    const chapters = chaptersInReel();

    const select = el('select', { class: 'tin', id: 'reel-chapter', 'aria-label': t('one_chapter') },
      chapters.map(m => el('option', { value: m.id, text: m.title, selected: chapter === m.id ? true : null })));
    if (!chapter && chapters[0]) chapter = chapters[0].id;
    select.addEventListener('change', function () { chapter = select.value; mode = 'chapter'; rebuild(); });

    return el('div', { class: 'inner' }, [
      el('div', {}, [
        el('div', { class: 'kicker', text: t('reel_kicker') }),
        UI.title(t('reel'))
      ]),
      el('p', { class: 'lede' }, [t('reel_lede')]),

      anything ? el('div', { class: 'row', style: { gap: '10px' } }, [
        el('span', { class: 'badge' + (d.due ? ' accent' : ''), text: d.due + ' ' + t('reel_due') }),
        el('span', { class: 'small muted', text: d.later + ' ' + t('reel_later') })
      ]) : null,

      anything
        ? el('div', { class: 'stack', style: { gap: '10px' } }, [
            el('div', { class: 'kicker', text: t('reel_mode') }),
            el('div', { class: 'row' }, [
              chip(t('everything'), mode === 'all', function () { mode = 'all'; rebuild(); }),
              chip(t('not_yet_attempted'), mode === 'new', function () { mode = 'new'; rebuild(); }),
              weakN ? chip(t('weak_only') + ' · ' + weakN, mode === 'weak', function () { mode = 'weak'; rebuild(); }) : null,
              chapters.length > 1 ? chip(t('one_chapter'), mode === 'chapter', function () { mode = 'chapter'; rebuild(); }) : null
            ]),
            mode === 'chapter' && chapters.length > 1 ? el('div', {}, [select]) : null,
            el('p', { class: 'small muted', style: { margin: 0 },
              text: mode === 'chapter' ? t('chapter_note') : t('mixed_note') })
          ])
        : UI.empty(t('reel_empty'),
            el('a', { class: 'btn primary', href: Router.href('study'), text: t('open_syllabus') }))
    ]);
  }

  /* ── shared card chrome ──────────────────────────────────────────────── */
  function head(item, badge) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const rec = Store.card(item.id);
    const concept = item.cid ? Pool.concept(item.cid) : null;
    const kindLabel = concept ? I18N.kind(concept.kind) : I18N.kind(item.conceptKind);
    const itemTitle = typeof I18N !== 'undefined' ? I18N.pick(item, 'title') : item.title;
    const gradeWord = rec && rec.first ? (isMl ? (rec.first === 'got' ? 'ശരിയായി' : rec.first === 'missed' ? 'ഓർമ്മവന്നില്ല' : 'ഭാഗികം') : rec.first) : '';

    return el('div', { class: 'stack', style: { gap: '10px' } }, [
      el('div', { class: 'spread' }, [
        el('span', { class: 'badge accent', text: badge }),
        item.sec ? el('a', { class: 'small', href: Router.href('note/' + item.cid),
          text: '§' + item.sec }) : null
      ]),
      el('div', { class: 'kicker', text: kindLabel + ' · ' + itemTitle }),
      (rec && rec.first)
        ? el('div', { class: 'row' }, [
            el('span', {
              class: 'badge ' + (rec.first === 'got' ? 'ok' : rec.first === 'missed' ? 'bad' : 'warn'),
              text: isMl ? ('ആദ്യ ശ്രമം: ' + gradeWord) : ('first attempt: ' + rec.first)
            }),
            el('span', { class: 'small muted', text: isMl ? 'ഈ തവണ ഇത് മാറില്ല' : 'this pass will not change it' })
          ])
        : null
    ]);
  }

  function gradeRow(item, goNext, preGrade) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const rec = Store.card(item.id);
    const attemptedBefore = !!(rec && rec.first);
    const wrap = el('div', {});

    function commit(grade) {
      const r = Store.gradeCard(item.id, grade);
      if (item._conf) Store.recordConfidence(item.id, item._conf, grade === 'got', item.cid);
      const gradeWord = isMl ? (grade === 'got' ? 'ശരിയായി' : grade === 'missed' ? 'ഓർമ്മവന്നില്ല' : 'ഭാഗികം') : grade;
      const firstWord = isMl && r.first ? (r.first === 'got' ? 'ശരിയായി' : r.first === 'missed' ? 'ഓർമ്മവന്നില്ല' : 'ഭാഗികം') : r.first;

      DOM.clear(wrap);
      DOM.add(wrap, [
        el('div', { class: 'verdict ' +
          (grade === 'got' ? 'ok' : grade === 'missed' ? 'bad' : 'warn') }, [
          el('span', { class: 'g', 'aria-hidden': 'true' },
            [DOM.mi(grade === 'got' ? 'check_circle' : grade === 'missed' ? 'cancel' : 'remove_circle')]),
          el('span', {}, [
            el('b', { text: isMl
              ? (r.tries === 1 ? 'ആദ്യ ശ്രമം രേഖപ്പെടുത്തി: ' + gradeWord : 'ഈ ശ്രമം: ' + gradeWord)
              : (r.tries === 1 ? 'First attempt recorded: ' + grade : 'This pass: ' + grade) }),
            el('span', { text: isMl
              ? (r.tries > 1 ? 'ആദ്യ ശ്രമം (' + firstWord + ') മാറ്റമില്ലാതെ തുടരുന്നു.' : 'പഠന പുരോഗതി രേഖപ്പെടുത്തി.')
              : (r.tries > 1 ? 'First attempt (' + r.first + ') is unchanged.' : 'Completion and recall stay separate numbers.') })
          ])
        ]),
        grade !== 'got' ? el('div', { style: { marginTop: '12px' } }, [UI.whyRow(item.id, item.cid)]) : null,
        el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
          el('button', { class: 'btn primary', type: 'button', text: t('next_card'),
            on: { click: goNext } }),
          item.cid ? el('a', { class: 'btn', href: Router.href('note/' + item.cid),
            text: t('open_note') }) : null
        ])
      ]);
      DOM.announce(isMl ? 'രേഖപ്പെടുത്തി.' : ('Recorded ' + grade + '.'));
    }

    DOM.add(wrap, [
      el('p', { class: 'small muted', style: { margin: '0 0 8px' },
        text: attemptedBefore
          ? (isMl ? 'ഈ തവണ എങ്ങനെ ഉണ്ടായിരുന്നു? ആദ്യ ശ്രമത്തിന്റെ ഫലം മാറില്ല.' : 'How did this pass go? Your first attempt stays on record.')
          : (isMl ? 'നിങ്ങളുടെ ശ്രമം മുകളിലെ ഉത്തരവുമായി എത്രത്തോളം യോജിക്കുന്നു?' : 'How did your attempt compare with the answer above?') }),
      el('div', { class: 'btn-row' }, getGrades().map(g =>
        el('button', { class: 'btn ' + g.cls, type: 'button', text: g.label,
          on: { click: function () { commit(g.k); } } })))
    ]);

    if (preGrade) window.setTimeout(() => commit(preGrade), 0);
    return wrap;
  }

  /* ── options builder for statement cards ──────────────────────────────── */
  function buildStatementOptions(item) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const correct = typeof I18N !== 'undefined' ? I18N.pick(item, 'a') : item.a;
    if (item.options && Array.isArray(item.options) && item.options.length) {
      return item.options;
    }
    const deck = (typeof Pool !== 'undefined' && Pool.deck) ? Pool.deck() : [];
    const otherCards = deck.filter(c => c.id !== item.id);
    const sameSec = otherCards.filter(c => c.sec === item.sec);
    const poolList = (sameSec.length >= 3 ? sameSec : otherCards)
      .map(c => typeof I18N !== 'undefined' ? I18N.pick(c, 'a') : c.a)
      .filter(a => a && a !== correct);

    const uniquePool = Array.from(new Set(poolList));
    let distractors = [];
    if (uniquePool.length >= 3) {
      let hash = 0;
      for (let i = 0; i < item.id.length; i++) hash = ((hash << 5) - hash) + item.id.charCodeAt(i);
      hash = Math.abs(hash);
      const shuffled = uniquePool.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = (hash + i) % (i + 1);
        const tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
      }
      distractors = shuffled.slice(0, 3);
    } else {
      distractors = isMl
        ? ['ഇവയിലൊന്നുമല്ല', 'വ്യവസ്ഥകൾ ബാധകമല്ല', 'വിപരീതം ശരിയല്ല']
        : ['None of these', 'Conditions do not apply', 'The converse is false'];
    }

    const all = [
      { text: correct, correct: true },
      { text: distractors[0] || (isMl ? 'ബാധകമല്ല' : 'Not applicable'), correct: false },
      { text: distractors[1] || (isMl ? 'തീർച്ചപ്പെടുത്താനാവില്ല' : 'Cannot be determined'), correct: false },
      { text: distractors[2] || (isMl ? 'ഇവയിലൊന്നുമല്ല' : 'None of the above'), correct: false }
    ];

    let seed = 0;
    for (let i = 0; i < item.id.length; i++) seed += item.id.charCodeAt(i);
    const keys = ['A', 'B', 'C', 'D'];
    const rot = seed % 4;
    const rotated = all.slice(rot).concat(all.slice(0, rot));
    return rotated.map((opt, idx) => ({ k: keys[idx], text: opt.text, correct: opt.correct }));
  }

  /* ── a statement card ────────────────────────────────────────────────── */
  function statementCard(item, goNext) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const concept = Pool.concept(item.cid);
    let revealed = false;
    let answered = false;
    const gateHost = el('div', {});
    const answerHost = el('div', {});

    let conf = 0;
    function reveal(grade) {
      if (revealed) return;
      revealed = true;
      const rec = Store.gradeCard(item.id, grade);
      if (conf) Store.recordConfidence(item.id, conf, grade === 'got', item.cid);
      DOM.clear(gateHost);
      DOM.clear(answerHost);

      const isCorrect = grade === 'got';
      const verdictWrap = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' } }, [
        el('div', { class: 'verdict ' + (isCorrect ? 'ok' : 'bad') }, [
          el('span', { class: 'g', 'aria-hidden': 'true' }, [DOM.mi(isCorrect ? 'check_circle' : 'cancel')]),
          el('span', {}, [
            el('b', { text: isCorrect ? (isMl ? 'ശരിയുത്തരം!' : 'Correct!') : (isMl ? 'തെറ്റായ ഉത്തരം.' : 'Incorrect.') }),
            el('span', { text: isMl ? 'പഠന പുരോഗതി രേഖപ്പെടുത്തി.' : 'Recall attempt recorded.' })
          ])
        ]),
        el('div', { class: 'reveal' }, [
          el('div', { class: 'h' }, [el('span', { text: t('canonical') })]),
          el('div', { class: 'b' }, [
            el('div', { class: 'prose tight', html: typeof I18N !== 'undefined' ? I18N.pick(item, 'a') : item.a }),
            el('div', { class: 'row', style: { marginTop: '12px' } }, [
              el('a', { class: 'chip', href: Router.href('note/' + item.cid),
                text: t('full_note') + (typeof I18N !== 'undefined' ? I18N.pick(concept, 'title') : (concept ? concept.title : '')) })
            ])
          ])
        ]),
        conf === 3 && !isCorrect ? el('p', { class: 'small', style: { margin: 0 }, text: t('calib_over') }) : null,
        !isCorrect ? UI.whyRow(item.id, item.cid) : null,
        el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
          el('button', { class: 'btn primary', type: 'button', text: t('next_card'),
            on: { click: goNext } }),
          item.cid ? el('a', { class: 'btn', href: Router.href('note/' + item.cid),
            text: t('open_note') }) : null
        ])
      ]);

      answerHost.appendChild(verdictWrap);
      UI.math(answerHost);
      DOM.announce(isCorrect ? (isMl ? 'ശരിയുത്തരം.' : 'Correct.') : (isMl ? 'തെറ്റായ ഉത്തരം.' : 'Incorrect.'));
    }

    function showOptions() {
      DOM.clear(gateHost);
      const opts = buildStatementOptions(item);
      const omrGroup = el('div', { class: 'omr', role: 'radiogroup', 'aria-label': 'Select the correct statement' });

      opts.forEach(function (opt) {
        const row = el('button', {
          class: 'omr-opt',
          type: 'button',
          role: 'radio',
          'aria-checked': 'false'
        }, [
          el('span', { class: 'bub', 'aria-hidden': 'true', text: opt.k }),
          el('span', { class: 't', html: opt.text })
        ]);

        row.addEventListener('click', function () {
          if (answered) return;
          answered = true;
          const rows = omrGroup.querySelectorAll('.omr-opt');
          rows.forEach((r, idx) => {
            r.setAttribute('aria-disabled', 'true');
            if (opts[idx].correct) {
              r.classList.add('key');
              r.appendChild(el('span', { class: 'omr-mark ok', text: 'key' }));
            }
          });
          if (!opt.correct) {
            row.classList.add('chosen-bad');
            row.appendChild(el('span', { class: 'omr-mark bad', text: 'yours' }));
          }
          window.setTimeout(() => reveal(opt.correct ? 'got' : 'missed'), 400);
        });

        omrGroup.appendChild(row);
      });

      UI.math(omrGroup);

      const skipBtn = el('button', { class: 'btn', type: 'button', text: isMl ? 'ഉത്തരം കാണിക്കുക' : 'Show answer',
        on: { click: function () { reveal('missed'); } } });

      DOM.add(gateHost, [
        el('p', { class: 'small muted', style: { margin: '8px 0 10px' },
          text: isMl ? 'ശരിയായ പ്രസ്താവന തിരഞ്ഞെടുക്കുക:' : 'Select the correct statement from the options below:' }),
        omrGroup,
        el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [skipBtn])
      ]);
    }

    /* Say how sure you are first. "No idea" is an honest miss and is
       recorded as one; the other two unlock the options. */
    gateHost.appendChild(UI.confidenceGate({
      onPick: function (c) {
        conf = c;
        if (c === 1) { reveal('missed'); return; }
        showOptions();
      }
    }));

    return el('div', { class: 'inner' }, [
      head(item, I18N.kind(item.conceptKind || 'state')),
      el('div', { class: 'prose', style: { fontSize: '1.12rem' }, html: typeof I18N !== 'undefined' ? I18N.pick(item, 'q') : item.q }),
      gateHost, answerHost
    ]);
  }

  /* ── a proof card ────────────────────────────────────────────────────────
     The ask is the strategy, not the write-up: if you can say why the proof
     goes the way it does, the steps follow. */
  function proofCard(item, goNext) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const concept = Pool.concept(item.cid);
    const p = item.proof;
    let revealed = false;
    const gateHost = el('div', {});
    const writeHost = el('div', {});
    const answerHost = el('div', {});

    function unlock(msg) {
      DOM.clear(gateHost);
      gateHost.appendChild(el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: isMl ? 'തെളിവ് കാണുക' : 'Show the argument',
          on: { click: function () { reveal(); } } })
      ]));
      if (msg) DOM.announce(msg);
    }

    function reveal(preGrade) {
      if (revealed) return;
      revealed = true;
      DOM.clear(gateHost);
      DOM.clear(answerHost);
      const ideaText = typeof I18N !== 'undefined' ? I18N.pick(p, 'idea') : p.idea;
      const whyText = typeof I18N !== 'undefined' ? I18N.pick(p, 'why') : p.why;
      const endsText = typeof I18N !== 'undefined' ? I18N.pick(p, 'ends') : p.ends;
      const rungsList = (typeof I18N !== 'undefined' && isMl && p.rungs_ml) ? p.rungs_ml : (p.rungs || []);

      answerHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: isMl ? 'ഗണിത തെളിവ്' : 'The argument' })]),
        el('div', { class: 'b', style: { display: 'grid', gap: '10px' } }, [
          ideaText ? el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
            el('div', { class: 'kicker', text: isMl ? 'പ്രധാന ആശയം' : 'Key idea' }),
            el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: ideaText })
          ]) : null,
          whyText ? el('div', { class: 'prose tight', html: whyText }) : null,
          (rungsList && rungsList.length)
            ? el('div', { class: 'stack', style: { gap: '8px' } }, rungsList.map(function (r, i) {
                const rungWhy = typeof I18N !== 'undefined' ? I18N.pick(r, 'why') : r.why;
                return el('div', { class: 'card flat', style: { padding: '10px 14px' } }, [
                  el('div', { class: 'small muted', style: { marginBottom: '6px' } }, [
                    el('b', { text: (isMl ? 'ഘട്ടം ' : 'Step ') + (i + 1) + ': ' }), el('span', { html: rungWhy })
                  ]),
                  r.m ? el('div', { html: r.m }) : null
                ]);
              }))
            : null,
          endsText ? el('div', { class: 'prose tight', html: endsText }) : null,
          el('div', { class: 'row' }, [
            el('a', { class: 'chip', href: Router.href('note/' + item.cid),
              text: (isMl ? 'പൂർണ്ണ കുറിപ്പ് · ' : 'Full note · ') + (typeof I18N !== 'undefined' ? I18N.pick(concept, 'title') : concept.title) })
          ])
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.confidenceGate({
      hint: isMl ? 'നോക്കും മുൻപ് തെളിവിന്റെ പ്രധാന ആശയവും അത് എന്തുകൊണ്ട് പ്രവർത്തിക്കുന്നു എന്നും പറയുക.' : 'Say how the derivation goes before you look — the main move, and why it works. Then say how sure you are.',
      onPick: function (c) {
        item._conf = c;
        if (c === 1) { reveal('missed'); return; }
        unlock(isMl ? 'ശ്രമം രേഖപ്പെടുത്തി — ഇനി തെളിവ് കാണാം.' : 'Attempt registered — you can reveal now.');
      }
    }));

    const cTitle = typeof I18N !== 'undefined' ? I18N.pick(concept, 'title') : concept.title;
    return el('div', { class: 'inner' }, [
      head(item, isMl ? 'തെളിവ്' : 'proof'),
      el('div', { class: 'prose', style: { fontSize: '1.12rem' }, html: isMl ? ('<b>ഇതിന്റെ തെളിവ് ഓർത്തെടുക്കുക: ' + cTitle + '.</b><p class="small muted" style="margin: 8px 0 0">പ്രധാന ആശയവും തെളിയിക്കുന്ന രീതിയും.</p>') : ('<b>Reconstruct the proof of ' + cTitle + '.</b><p class="small muted" style="margin: 8px 0 0">The strategy and why it works, not the full write-up.</p>') }),
      gateHost, writeHost, answerHost
    ]);
  }

  /* ── an objective question, on a card ────────────────────────────────────
     The attempt IS the answer, so there is no separate grade row: the verdict
     the sheet returns is what schedules the card. */
  function questionCard(item, goNext) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const q = item.question;
    const tail = el('div', { class: 'btn-row' }, [
      el('button', { class: 'btn primary', type: 'button', text: t('next_card'),
        on: { click: goNext } }),
      item.cid ? el('a', { class: 'btn', href: Router.href('note/' + item.cid),
        text: t('open_note') }) : null
    ]);
    return el('div', { class: 'inner' }, [
      head(item, isMl ? 'ചോദ്യം' : 'question'),
      QuestionCard.build(q, {
        inNote: true, tail: tail,
        onLocked: function (verdict) {
          Store.gradeCard(item.id,
            verdict === 'correct' ? 'got' : verdict === 'partial' ? 'partly' : 'missed');
        }
      })
    ]);
  }

  /* ── an exercise you have already worked, back for another look ──────── */
  function exerciseCard(item, goNext) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const q = item.question;
    let revealed = false;
    const gateHost = el('div', {});
    const writeHost = el('div', {});
    const answerHost = el('div', {});

    const approachText = typeof I18N !== 'undefined' ? I18N.pick(q, 'approach') : q.approach;
    const solutionText = typeof I18N !== 'undefined' ? I18N.pick(q, 'solution') : q.solution;
    const trapText = typeof I18N !== 'undefined' ? I18N.pick(q, 'trap') : q.trap;
    const promptText = typeof I18N !== 'undefined' ? I18N.pick(q, 'prompt') : q.prompt;

    function unlock(msg) {
      DOM.clear(gateHost);
      gateHost.appendChild(el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: isMl ? 'വിശദമായ ഉത്തരം കാണുക' : 'Show the worked answer',
          on: { click: function () { reveal(); } } })
      ]));
      if (msg) DOM.announce(msg);
    }

    function reveal(preGrade) {
      if (revealed) return;
      revealed = true;
      DOM.clear(gateHost);
      DOM.clear(answerHost);
      answerHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: isMl ? 'വിശദമായ ഉത്തരം' : 'Worked answer' })]),
        el('div', { class: 'b', style: { display: 'grid', gap: '10px' } }, [
          approachText ? el('div', { class: 'prose tight', html: approachText }) : null,
          solutionText ? el('div', { class: 'prose tight', html: solutionText }) : null,
          trapText ? el('p', { class: 'small muted' },
            [el('b', { text: isMl ? 'ശ്രദ്ധിക്കുക: ' : 'Trap: ' }), el('span', { html: trapText })]) : null
        ])
      ]));
      answerHost.appendChild(gradeRow(item, goNext, preGrade));
      UI.math(answerHost);
    }

    gateHost.appendChild(UI.confidenceGate({
      hint: isMl ? 'മുൻപ് ചെയ്ത ചോദ്യമാണിത്. ഉത്തരം നോക്കും മുൻപ് പ്രധാന ഘട്ടം ഒരിക്കൽക്കൂടി സ്വയം ചെയ്യുക; പിന്നെ എത്ര ഉറപ്പുണ്ടെന്ന് പറയുക.' : 'You have worked this one before. Do the main move again before you look, then say how sure you are.',
      onPick: function (c) {
        item._conf = c;
        if (c === 1) { reveal('missed'); return; }
        unlock(isMl ? 'ശ്രമം രേഖപ്പെടുത്തി — ഇനി ഉത്തരം കാണാം.' : 'Attempt registered — you can reveal now.');
      }
    }));

    return el('div', { class: 'inner' }, [
      head(item, isMl ? 'പരിശീലന ചോദ്യം' : 'exercise'),
      el('div', { class: 'prose', style: { fontSize: '1.05rem' }, html: promptText }),
      gateHost, writeHost, answerHost
    ]);
  }

  const BUILDERS = {
    state: statementCard, proof: proofCard, question: questionCard, exercise: exerciseCard
  };

  /* ── the reel ────────────────────────────────────────────────────────── */
  function render(args, query) {
    if (query && query.from) { startAt = query.from; mode = 'all'; }
    if (query && query.mode) { mode = query.mode === 'weak' ? 'weak' : query.mode === 'new' ? 'new' : 'all'; }
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

    const reel = el('div', { class: 'reel', tabindex: '-1', 'aria-label': isMl ? 'ഓർത്തെടുക്കൽ കാർഡുകൾ' : 'Recall reel' });
    const root = el('div', {}, [
      el('h1', { id: 'pagetitle', tabindex: '-1', class: 'sr-only', text: t('reel') }),
      reel
    ]);

    let cards = [];        /* the <section>s on screen, index 0 is the intro */
    let queue = [];        /* cards drawn but not yet placed */
    let placed = {};       /* every id already on screen — nothing repeats */
    let ended = false;

    function build() {
      if (io) { io.disconnect(); io = null; }
      DOM.clear(reel);
      cards = [];
      placed = {};
      ended = false;
      queue = draw();

      push(el('section', { class: 'reel-card' }, [introCard(function () {
        build();
        reel.scrollTo({ top: 0, behavior: 'auto' });
      })]));

      extend(BATCH);
      observe();
      UI.math(reel);
      jumpToStart();
    }

    function push(section) {
      cards.push(section);
      reel.appendChild(section);
      if (io) io.observe(section);
    }

    const glide = i => {
      const to = cards[i];
      if (!to) return;
      reel.scrollTo({ top: to.offsetTop, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    };

    /* Draw `n` more cards. When the queue runs dry it is re-drawn, which is
       how material ticked while the reel is open finds its way in. */
    function extend(n) {
      let added = 0;
      while (added < n) {
        if (!queue.length) queue = draw(placed);
        const item = queue.shift();
        if (!item) break;
        if (placed[item.id]) continue;
        placed[item.id] = true;
        const at = cards.length;
        const make = BUILDERS[item.kind];
        if (!make) continue;
        push(el('section', { class: 'reel-card', 'data-cid': item.cid || '' },
          [make(item, function () { glide(at + 1); })]));
        added += 1;
      }
      if (!added && !ended) {
        ended = true;
        push(el('section', { class: 'reel-card' }, [
          el('div', { class: 'inner' }, [
            UI.empty(mode === 'new' ? t('reel_end_new') : mode === 'weak' ? t('reel_end_weak') : t('reel_end'),
              el('a', { class: 'btn primary', href: Router.href('study'), text: t('open_syllabus') }))
          ])
        ]));
      }
      UI.math(reel);
    }

    /* Mark the card in view, and top the reel up before you reach the end.
       Cards are one viewport tall, so a majority-of-the-viewport test is both
       correct and cheap. */
    let io = null;
    function observe() {
      if (!window.IntersectionObserver) { cards.forEach(c => c.classList.add('live')); return; }
      if (io) return;
      io = new window.IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          const seen = e.intersectionRect ? e.intersectionRect.height : 0;
          const port = (e.rootBounds && e.rootBounds.height) || reel.clientHeight || 1;
          const live = e.isIntersecting && seen / port > 0.55;
          e.target.classList.toggle('live', live);
          if (live && cards.indexOf(e.target) >= cards.length - LOOKAHEAD) extend(BATCH);
        });
      }, { root: reel, threshold: [0, 0.25, 0.56, 0.9, 1] });
      cards.forEach(c => io.observe(c));
    }

    function jumpToStart() {
      if (!startAt) return;
      const at = cards.map(c => c.getAttribute('data-cid')).indexOf(startAt);
      startAt = null;
      if (at > 0) window.requestAnimationFrame(function () {
        reel.scrollTo({ top: cards[at].offsetTop, behavior: 'auto' });
      });
    }

    /* Ticking a concept in Study while the reel is open should put its cards
       in the reel, not wait for a reload. The end card is the only thing in
       the way, so it is taken back off and the queue asked again. */
    Store.onChange(function () {
      if (!document.body.contains(reel) || !ended) return;
      const last = cards.pop();
      if (last && last.parentNode) last.parentNode.removeChild(last);
      ended = false;
      extend(BATCH);
    });

    /* Keyboard moves exactly one card, like the swipe. */
    reel.addEventListener('keydown', function (e) {
      const keys = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 };
      const dir = keys[e.key];
      if (!dir) return;
      if (/^(TEXTAREA|INPUT|SELECT)$/.test((e.target.tagName || '').toUpperCase())) return;
      e.preventDefault();
      const h = reel.clientHeight || 1;
      const last = reel.children.length - 1;
      const at = Math.round(reel.scrollTop / h);
      const to = Math.max(0, Math.min(last, at + dir));
      reel.scrollTo({ top: to * h, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });

    build();
    return root;
  }

  return { render, wrapClass: 'wrap bleed' };
})();


/* ── src/view.omr.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Objective questions, OMR first.

   The question itself is now a component — see comp.question.js — because a
   question belongs next to the note that teaches it, not behind a tab of its
   own. There is no Questions tab any more: this screen survives only so that
   `#/omr/<id>` links keep resolving, and so there is somewhere to see the
   whole bank at once.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewOmr = (function () {

  const el = DOM.el;

  /* ── list ──────────────────────────────────────────────────────────────── */
  let filter = 'all';

  function list(query) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const root = el('div', { class: 'stack' });
    const sec = query && query.sec;
    const chips = el('div', { class: 'row' });
    const host = el('div', {});

    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: fn } });

    function paint() {
      let qs = Pool.objective();
      if (sec) qs = qs.filter(q => q.sec === sec);
      if (filter === 'new') qs = qs.filter(q => !(Store.omr(q.id) || {}).first);
      else if (filter !== 'all') qs = qs.filter(q => q.type === filter);

      DOM.clear(chips);
      DOM.add(chips, ['all', 'new', 'MCQ', 'MSQ', 'NAT'].map(f => chip(
        f === 'all' ? (isMl ? 'എല്ലാം' : 'All') : f === 'new' ? (isMl ? 'ശ്രമിക്കാത്തവ' : 'Not attempted') : f,
        filter === f, function () { filter = f; paint(); })));

      DOM.clear(host);
      if (!qs.length) { host.appendChild(UI.empty(isMl ? 'ഈ ഫിൽട്ടറിൽ ചോദ്യങ്ങളൊന്നുമില്ല.' : 'Nothing matches that filter.')); return; }

      host.appendChild(el('div', { class: 'list' }, qs.map(function (q, i) {
        const rec = Store.omr(q.id);
        const v = rec && rec.first && rec.first.verdict;
        const marksText = isMl ? (q.marks + ' മാർക്ക്') : (q.marks + ' ' + DOM.plural(q.marks, 'mark'));
        const negText = q.neg ? (q.negLabel || (isMl ? (q.neg + ' തെറ്റിയാൽ കുറയും') : (q.neg + ' if wrong'))) : (isMl ? 'നെഗറ്റീവ് മാർക്കില്ല' : 'no negative');
        const vText = v ? (isMl ? ('ആദ്യ ശ്രമം: ' + (v === 'correct' ? 'ശരി' : v === 'wrong' ? 'തെറ്റ്' : 'ഭാഗികം')) : ('first attempt: ' + v)) : negText;

        return el('a', { class: 'item', href: Router.href('omr/' + q.id) }, [
          el('span', { class: 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : '') },
            [v ? DOM.mi(v === 'correct' ? 'check' : v === 'wrong' ? 'close' : 'remove', 'xs')
               : el('span', { text: String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: '§' + q.sec + '  ' + Pool.sectionTitle(q.sec) }),
            el('span', { text: q.type + ' · ' + marksText + ' · ' + vText })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      })));
    }

    const s = Store.summary([], [], Pool.ids.objective());
    DOM.add(root, [
      UI.title(isMl ? 'ചോദ്യങ്ങൾ' : 'Questions', isMl ? 'ആദ്യം സ്വയം ശ്രമിക്കുക, തുടർന്ന് വിശദമായ ഉത്തരം' : 'Answer first, then the full solution'),
      UI.mockBanner(),
      el('p', { class: 'small muted', style: { margin: 0 },
        text: isMl ? 'ഓരോ ചോദ്യവും പാഠ്യപദ്ധതിയിലെ അതാത് കുറിപ്പുകൾക്കൊപ്പവും ലഭ്യമാണ്.' : 'Every one of these also opens inside the note it examines, in the syllabus.' }),
      el('div', { class: 'card tint' }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'kicker', text: isMl ? 'ആദ്യ ശ്രമങ്ങൾ' : 'First attempts' }),
          el('span', { class: 'count',
            text: isMl ? (s.omr.locked + ' / ' + s.omr.total + ' രേഖപ്പെടുത്തി · ' + s.omr.correct + ' ശരി')
                       : (s.omr.locked + ' of ' + s.omr.total + ' locked · ' + s.omr.correct + ' correct') })
        ]),
        el('div', { style: { marginTop: '8px' } }, [UI.meter(s.omr.locked, s.omr.total)])
      ]),
      sec ? el('div', { class: 'row' }, [
        el('span', { class: 'badge accent', text: '§' + sec }),
        el('a', { class: 'chip', href: Router.href('omr'), text: isMl ? 'ഫിൽട്ടർ ഒഴിവാക്കുക' : 'clear section filter' })
      ]) : null,
      chips, host
    ]);
    paint();
    return root;
  }

  /* ── one question ──────────────────────────────────────────────────────── */
  function nextLink(q) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const all = Pool.objective();
    const i = all.map(x => x.id).indexOf(q.id);
    const unattempted = all.slice(i + 1).concat(all.slice(0, i))
      .filter(x => !(Store.omr(x.id) || {}).first)[0];
    const next = unattempted || all[(i + 1) % all.length];
    return el('a', { class: 'btn primary', href: Router.href('omr/' + next.id),
      text: unattempted ? (isMl ? 'അടുത്ത പുതിയ ചോദ്യം' : 'Next unattempted question') : (isMl ? 'അടുത്ത ചോദ്യം' : 'Next question') });
  }

  function detail(q) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const tail = el('div', { class: 'btn-row' }, [
      nextLink(q), el('a', { class: 'btn', href: Router.href('omr'), text: isMl ? 'എല്ലാ ചോദ്യങ്ങളും' : 'All questions' })
    ]);
    const secTitle = Pool.sectionTitle(q.sec);
    return el('div', { class: 'stack' }, [
      UI.crumb([{ text: isMl ? 'ചോദ്യങ്ങൾ' : 'Questions', href: 'omr' },
        { text: '§' + q.sec + ' ' + secTitle }]),
      el('h1', { tabindex: '-1', id: 'pagetitle', class: 'sr-only',
        text: q.type + ' question on ' + secTitle }),
      QuestionCard.build(q, { tail: tail })
    ]);
  }

  function render(args, query) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    if (args && args[0]) {
      const q = Pool.objectiveOne(args[0]);
      if (q) return detail(q);
      return el('div', { class: 'stack' }, [
        UI.title(isMl ? 'കണ്ടെത്താനായില്ല' : 'Not found'),
        UI.empty(isMl ? 'ഈ ചോദ്യം ലഭ്യമല്ല.' : 'That question is not in the loaded bank.',
          el('a', { class: 'btn', href: Router.href('omr'), text: isMl ? 'എല്ലാ ചോദ്യങ്ങളും' : 'All questions' }))
      ]);
    }
    return list(query);
  }

  return { render, judge: QuestionCard.judge };
})();


/* ── src/view.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Theorem writing.

   The target is named but its statement is withheld: you write first, then
   compare. The canonical statement is behind a gate for the same reason the
   flashcard answer is — reading a statement is not writing one.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewWrite = (function () {

  const el = DOM.el;

  function picker() {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const targets = Pool.concepts();
    return el('div', { class: 'stack' }, [
      UI.title(isMl ? 'പ്രസ്താവന എഴുതുക' : 'Write a statement', isMl ? 'ഗണിത രൂപത്തിൽ എഴുതി നോക്കുക' : 'Write and practice the statement'),
      el('p', { class: 'lede small' },
        [isMl ? 'ഓർമ്മയിൽ നിന്ന് പ്രസ്താവന എഴുതി നോക്കുക.'
              : 'Pick what to write from memory. Type your formulation and compare it with the textbook statement.']),
      el('div', { class: 'list' }, targets.map(function (c) {
        const has = !!Store.draft(c.id);
        const cTitle = typeof I18N !== 'undefined' ? I18N.pick(c, 'title') : c.title;
        const cKind = typeof I18N !== 'undefined' ? I18N.kind(c.kind) : c.kind;
        return el('a', { class: 'item', href: Router.href('write/' + c.id) }, [
          el('span', { class: 'ix' + (has ? ' ok' : '') },
            [DOM.mi(has ? 'edit_note' : 'radio_button_unchecked', 'xs')]),
          el('span', { class: 'tt' }, [
            el('b', { text: cTitle }),
            el('span', { text: '§' + c.sec + ' · ' + cKind + (has ? (isMl ? ' · സേവ് ചെയ്തു' : ' · draft saved') : '') })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      }))
    ]);
  }

  function workspace(c) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const root = el('div', { class: 'stack' });
    const boxHost = el('div', { class: 'card' });
    const compareHost = el('div', {});

    const wb = WriteBox.mount(boxHost, { concept: c, label: isMl ? 'നിങ്ങൾ ഓർത്തെടുത്ത പ്രസ്താവന' : 'Your statement in words' });

    function compare() {
      DOM.clear(compareHost);
      compareHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: isMl ? 'ശരിയായ പ്രസ്താവന' : 'Canonical statement' })]),
        el('div', { class: 'b' }, [
          UI.prose(c.statement, 'tight'),
          el('p', { class: 'small muted', style: { margin: '12px 0 0' },
            text: isMl ? 'നിങ്ങൾ എഴുതിയ പ്രസ്താവനയും ശരിയായ പ്രസ്താവനയും തമ്മിൽ ഒത്തുനോക്കുക.'
                       : 'Compare the quantifiers and the hypotheses first — that is where written answers lose marks, not in the algebra.' }),
          el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
            el('a', { class: 'btn', href: Router.href('note/' + c.id), text: isMl ? 'പൂർണ്ണ കുറിപ്പ് കാണുക' : 'Open the full note' }),
            el('a', { class: 'btn', href: Router.href('recall?from=' + encodeURIComponent(c.id)),
              text: isMl ? 'ഓർമ്മ പരിശോധിക്കുക' : 'Grade it as recall' })
          ])
        ])
      ]));
      UI.math(compareHost);
      DOM.announce(isMl ? 'ശരിയായ പ്രസ്താവന കാണിച്ചു.' : 'Canonical statement revealed.');
    }

    const gate = UI.gate({
      hint: isMl ? 'ആദ്യം മുകളിൽ എഴുതി ശ്രമിക്കുക. അതിനു ശേഷം ശരിയായ പ്രസ്താവന കാണാം.'
                 : 'Write your version above first. The canonical statement stays hidden until you ask for it.',
      actions: [
        { label: isMl ? 'ശരിയായ പ്രസ്താവനയുമായി ഒത്തുനോക്കുക' : 'Compare with the canonical statement', primary: true, onClick: function () {
            if (!wb.hasContent() &&
              !window.confirm(isMl ? 'ഇതുവരെ ഒന്നും എഴുതിയിട്ടില്ല. പ്രസ്താവന കാണണോ?' : 'Nothing is written yet. Reveal the statement anyway?')) return;
            compare();
          } }
      ]
    });

    const cTitle = typeof I18N !== 'undefined' ? I18N.pick(c, 'title') : c.title;
    DOM.add(root, [
      UI.crumb([{ text: isMl ? 'എഴുതുക' : 'Write', href: 'write' }, { text: '§' + c.sec }]),
      el('div', {}, [
        el('div', { class: 'row', style: { marginBottom: '8px' } }, [UI.kindBadge(c), UI.levelBadge(c.id)]),
        UI.title(cTitle, isMl ? 'ഇതിന്റെ പ്രസ്താവന എഴുതുക: ' : 'Write the statement of')
      ]),
      el('p', { class: 'lede', text: c.oneLine }),
      boxHost,
      gate,
      compareHost
    ]);

    UI.math(root);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const c = Pool.concept(args[0]);
      if (c) return workspace(c);
    }
    return picker();
  }

  return { render };
})();


/* ── src/view.drill.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Timed drill — a short paper under exam conditions.

   Rohrer's interleaving studies are the reason this exists: a block of ten
   questions from one chapter teaches you to execute a method; ten questions
   from four chapters, shuffled, teach you to CHOOSE the method, and choosing
   is what the paper tests. So the drill draws round-robin across chapters
   and never groups them.

   The clock is the second reason. Knowing something and producing it in 90
   seconds are different skills, and only the second one earns marks. Time per
   question is the question's own budget, summed.

   Everything the drill records goes through QuestionCard, exactly as it
   would inside a note — the first lock is the first attempt, wherever it
   happens. The drill's own state (which questions, the clock, the running
   tally) lives here for the session and is rebuilt on a language switch.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewDrill = (function () {

  const el = DOM.el;
  const t = k => I18N.t(k);

  const SIZES = [5, 10, 20];
  let setup = { n: 10, scope: 'read', course: 'all' };
  let session = null;      /* { qs, i, results, endAt, startedAt, phase } */
  let clockT = 0;

  /* "Class 10 · Chapter 1: Arithmetic Sequences" — three classes share chapter numbers */
  function chapterLabel(mod) {
    const course = Pool.courses().filter(c => (c.modules || []).indexOf(mod) >= 0)[0];
    const cls = course && /\d+/.test(course.code || '') ? (course.code || '').match(/\d+/)[0] : null;
    const isMl = I18N.lang() === 'ml';
    return (cls ? (isMl ? 'ക്ലാസ് ' : 'Class ') + cls + ' · ' : '') + mod.title;
  }

  const chapterOf = q => {
    const mod = Pool.moduleOfSec(q.sec || (Pool.concept((q.tests || [])[0] || q.concept) || {}).sec);
    return mod ? mod : null;
  };

  /* ── drawing the paper ─────────────────────────────────────────────────── */
  function candidates() {
    const readSet = {};
    Pool.ids.allConcepts().forEach(id => { if (Progress.level(id) >= 1) readSet[id] = true; });
    const weak = setup.scope === 'weak' ? Study.weakIds() : null;
    return Pool.objective().filter(function (q) {
      const targets = (q.tests || []).concat(q.concept ? [q.concept] : []);
      const c = Pool.concept(targets[0]);
      if (!c) return false;
      if (setup.course !== 'all') {
        const course = Pool.courseOfSec(c.sec);
        if (!course || course.id !== setup.course) return false;
      }
      if (setup.scope === 'read') return targets.some(id => readSet[id]);
      if (setup.scope === 'weak') return targets.some(id => weak[id]);
      return true;
    });
  }

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const x = list[i]; list[i] = list[j]; list[j] = x;
    }
    return list;
  }

  /* round-robin across chapters, unattempted questions first within each */
  function draw(n) {
    const by = {}, order = [];
    shuffle(candidates()).forEach(function (q) {
      const mod = chapterOf(q);
      const k = mod ? mod.id : '?';
      if (!by[k]) { by[k] = []; order.push(k); }
      by[k].push(q);
    });
    order.forEach(k => by[k].sort((a, b) => {
      const fa = (Store.omr(a.id) || {}).first ? 1 : 0, fb = (Store.omr(b.id) || {}).first ? 1 : 0;
      return fa - fb;
    }));
    shuffle(order);
    const out = [];
    let guard = 0;
    while (out.length < n && guard < 1000) {
      let any = false;
      for (let i = 0; i < order.length && out.length < n; i++) {
        const q = by[order[i]].shift();
        if (q) { out.push(q); any = true; }
      }
      if (!any) break;
      guard += 1;
    }
    return out;
  }

  function begin() {
    const qs = draw(setup.n);
    if (!qs.length) return false;
    const secs = qs.reduce((a, q) => a + (q.time || 30), 0);
    session = {
      qs: qs, i: 0, results: [], phase: 'run',
      startedAt: Date.now(), endAt: Date.now() + Math.max(60, secs) * 1000, total: Math.max(60, secs) * 1000
    };
    return true;
  }

  function finish() {
    if (!session) return;
    session.phase = 'done';
    session.finishedAt = Date.now();
    window.clearInterval(clockT);
    Router.reload();
  }

  /* ── setup screen ──────────────────────────────────────────────────────── */
  function setupView() {
    const root = el('div', { class: 'stack' });
    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: function () { fn(); Router.reload(); } } });
    const avail = candidates().length;
    const canStart = avail >= Math.min(5, setup.n) && avail > 0;
    const bp = Study.blueprint();

    DOM.add(root, [
      el('div', {}, [
        el('div', { class: 'kicker', text: t('drill_kicker') }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: t('drill') })
      ]),
      el('p', { class: 'lede', text: t('drill_lede') }),
      UI.mockBanner(),
      el('div', { class: 'card' }, [
        el('div', { class: 'kicker', text: t('drill_size') }),
        el('div', { class: 'row', style: { margin: '8px 0 14px' } }, SIZES.map(n =>
          chip(n + ' ' + t('questions_lc'), setup.n === n, () => { setup.n = n; }))),
        el('div', { class: 'kicker', text: t('drill_scope') }),
        el('div', { class: 'row', style: { margin: '8px 0 14px' } }, [
          chip(t('drill_scope_read'), setup.scope === 'read', () => { setup.scope = 'read'; }),
          chip(t('drill_scope_weak'), setup.scope === 'weak', () => { setup.scope = 'weak'; }),
          chip(t('drill_scope_all'), setup.scope === 'all', () => { setup.scope = 'all'; })
        ]),
        el('div', { class: 'kicker', text: t('drill_course') }),
        el('div', { class: 'row', style: { margin: '8px 0 0' } },
          [chip(t('drill_all_courses'), setup.course === 'all', () => { setup.course = 'all'; })]
            .concat(Pool.courses().filter(c => c.id !== 'foundation' && !c.pending).map(c =>
              chip(c.title, setup.course === c.id, () => { setup.course = c.id; }))))
      ]),
      el('div', { class: 'card tint' }, [
        el('div', { class: 'row', style: { gap: '10px' } }, [
          el('span', { class: 'badge accent', text: avail + ' ' + t('questions_lc') }),
          el('span', { class: 'small muted', text: t('exam_paper') })
        ]),
        el('p', { class: 'small muted', style: { margin: '8px 0 0' }, text: t('drill_first_only') })
      ]),
      canStart
        ? el('div', { class: 'btn-row' }, [
            el('button', { class: 'btn primary full', type: 'button',
              on: { click: function () { if (begin()) Router.reload(); } } },
              [DOM.mi('timer', 'sm'), el('span', { text: t('drill_start') })])
          ])
        : UI.empty(t('drill_none'), el('a', { class: 'btn', href: Router.href('study'), text: t('open_syllabus') }))
    ]);
    void bp;
    return root;
  }

  /* ── running ───────────────────────────────────────────────────────────── */
  function runView() {
    const s = session;
    const q = s.qs[s.i];
    const root = el('div', { class: 'stack' });
    const clock = el('span', { class: 'timer drill-clock' });
    const bar = el('div', { class: 'meter' }, [el('i', { style: { width: '0%' } })]);
    const banner = el('div', { hidden: true });

    function paintClock() {
      const left = s.endAt - Date.now();
      clock.textContent = UI.clock(Math.max(0, left)) + ' ' + t('drill_time_left');
      bar.firstChild.style.width = DOM.pct(Math.max(0, s.total - left), s.total) + '%';
      clock.classList.toggle('is-late', left < 60e3);
      if (left <= 0 && s.phase === 'run') {
        s.phase = 'late';
        banner.hidden = false;
        DOM.add(banner, [el('div', { class: 'banner' }, [DOM.mi('alarm'), el('span', { text: t('drill_time_up') })])]);
        DOM.announce(t('drill_time_up'));
      }
    }
    window.clearInterval(clockT);
    clockT = window.setInterval(function () {
      if (!document.body.contains(clock)) { window.clearInterval(clockT); return; }
      paintClock();
    }, 500);
    paintClock();

    let answered = false;
    const nextBtn = el('button', { class: 'btn primary', type: 'button',
      text: s.i + 1 < s.qs.length ? t('next') : t('drill_results'),
      on: { click: function () {
        if (!answered) s.results.push({ q: q, verdict: null, ms: 0 });
        if (s.i + 1 < s.qs.length && s.phase !== 'late') { s.i += 1; Router.reload(); }
        else finish();
      } } });
    const tail = el('div', { class: 'btn-row' }, [nextBtn]);

    const card = QuestionCard.build(q, {
      inNote: true, tail: tail, drill: true,
      onLocked: function (verdict, ms) {
        answered = true;
        s.results.push({ q: q, verdict: verdict, ms: ms || 0 });
      }
    });

    DOM.add(root, [
      el('div', { class: 'spread' }, [
        el('div', {}, [
          el('div', { class: 'kicker', text: t('drill') }),
          el('h1', { tabindex: '-1', id: 'pagetitle', text: t('drill_question') + ' ' + (s.i + 1) + ' / ' + s.qs.length })
        ]),
        clock
      ]),
      bar,
      banner,
      el('div', { class: 'card' }, [card]),
      el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn quiet', type: 'button', text: t('drill_finish'),
          on: { click: function () { if (!answered) s.results.push({ q: q, verdict: null, ms: 0 }); finish(); } } })
      ])
    ]);
    return root;
  }

  /* ── results ───────────────────────────────────────────────────────────── */
  function resultsView() {
    const s = session;
    const n = s.qs.length;
    const res = s.results;
    const correct = res.filter(r => r.verdict === 'correct').length;
    const partial = res.filter(r => r.verdict === 'partial').length;
    const wrong = res.filter(r => r.verdict === 'wrong').length;
    const unanswered = n - res.filter(r => r.verdict).length;
    const used = Math.min(s.total, (s.finishedAt || Date.now()) - s.startedAt);
    const marks = res.reduce((a, r) => a + (r.verdict ? QuestionCard.awarded(r.q, r.verdict) : 0), 0);
    const marksAll = s.qs.reduce((a, q) => a + (q.marks || 1), 0);

    const byCh = {}, order = [];
    s.qs.forEach(function (q) {
      const mod = chapterOf(q);
      const k = mod ? mod.id : '?';
      if (!byCh[k]) { byCh[k] = { mod: mod, total: 0, ok: 0 }; order.push(k); }
      byCh[k].total += 1;
      const r = res.filter(x => x.q === q)[0];
      if (r && r.verdict === 'correct') byCh[k].ok += 1;
    });

    const review = [];
    const seen = {};
    res.filter(r => r.verdict && r.verdict !== 'correct').forEach(function (r) {
      const c = Pool.concept((r.q.tests || [])[0] || r.q.concept);
      if (c && !seen[c.id]) { seen[c.id] = true; review.push(c); }
    });

    const root = el('div', { class: 'stack' });
    DOM.add(root, [
      el('div', {}, [
        el('div', { class: 'kicker', text: t('drill') }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: t('drill_results') })
      ]),
      DOM.stagger(el('div', { class: 'stats' }, [
        UI.stat(correct + '/' + n, t('drill_score'), (marks > 0 ? '+' : '') + Math.round(marks * 100) / 100 + ' / ' + marksAll + ' ' + t('marks'),
          UI.meter(correct, n, correct === n ? true : undefined)),
        UI.stat(UI.clock(used), t('drill_time'), UI.clock(Math.round(used / Math.max(1, n))) + ' ' + t('drill_per_q')),
        UI.stat(String(wrong + partial), t('not_correct'), unanswered ? unanswered + ' ' + t('drill_unanswered') : '')
      ])),
      el('div', { class: 'card' }, [
        el('div', { class: 'kicker', text: t('drill_by_chapter') }),
        el('div', { class: 'bars', style: { marginTop: '10px' } }, order.map(function (k) {
          const row = byCh[k];
          return el('div', { class: 'bar-row' }, [
            el('span', { class: 'small', text: row.mod ? chapterLabel(row.mod) : k }),
            el('div', { class: 'meter' + (row.ok === row.total ? ' ok' : row.ok ? ' lv2' : ' lv1') },
              [el('i', { style: { width: DOM.pct(row.ok, row.total) + '%' } })]),
            el('span', { class: 'count', text: row.ok + '/' + row.total })
          ]);
        }))
      ]),
      review.length ? el('div', { class: 'card tint' }, [
        el('div', { class: 'kicker', text: t('drill_review') }),
        el('div', { class: 'list', style: { marginTop: '10px' } }, review.map(c =>
          el('a', { class: 'item', href: Router.href('note/' + c.id) }, [
            el('span', { class: 'ix bad' }, [DOM.mi('priority_high', 'xs')]),
            el('span', { class: 'tt' }, [el('b', { text: c.title }), el('span', { text: Pool.sectionTitle(c.sec) })]),
            el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
          ])))
      ]) : null,
      el('div', { class: 'btn-row' }, [
        el('button', { class: 'btn primary', type: 'button', text: t('drill_again'),
          on: { click: function () { session = null; Router.reload(); } } }),
        el('a', { class: 'btn', href: Router.href('recall?mode=weak'), text: t('weak_drill') })
      ])
    ]);
    return root;
  }

  function render() {
    if (!session) return setupView();
    if (session.phase === 'done') return resultsView();
    return runView();
  }

  return { render };
})();

/* ══════════════════════════════════════════════════════════════════════════
   How to study — the research behind the app, and how each subject is best
   learned.

   Every claim here has a source, and the sources are the ones the learning
   science literature keeps coming back to: the Dunlosky review of ten study
   techniques, the retrieval-practice studies of Roediger and Karpicke, the
   spacing meta-analysis of Cepeda, Rohrer's interleaving experiments, Chi on
   self-explanation, Ericsson on deliberate practice, and the books that made
   them usable — "Make It Stick", "A Mind for Numbers", "How to Solve It",
   "Peak", "Atomic Habits", "Why Don't Students Like School?".

   The page is content, not chrome, so it is written here in both languages
   rather than in the string table. LEARNING_SCIENCE.md at the project root
   has the full bibliography.
   ══════════════════════════════════════════════════════════════════════════ */

      lede: { en: 'Concept first, formula second, numbers last. A formula you cannot say in words will be used in the wrong place.', ml: 'ആദ്യം ആശയം, പിന്നെ സൂത്രവാക്യം, അവസാനം സംഖ്യകൾ. വാക്കുകളിൽ പറയാൻ കഴിയാത്ത സൂത്രവാക്യം തെറ്റായ സ്ഥലത്ത് ഉപയോഗിക്കും.' },
      points: [
        { en: 'For every law, be able to say what each symbol means and what happens to one quantity when another doubles. That sentence is worth more than the formula.', ml: 'ഓരോ നിയമത്തിനും ഓരോ ചിഹ്നത്തിന്റെയും അർത്ഥവും ഒരു അളവ് ഇരട്ടിയായാൽ മറ്റൊന്നിന് എന്ത് സംഭവിക്കുമെന്നും പറയാൻ കഴിയണം. ആ വാക്യം സൂത്രവാക്യത്തേക്കാൾ വിലപ്പെട്ടതാണ്.' },
        { en: 'Draw before you calculate: ray diagrams, circuit diagrams, force arrows. The picture catches the sign error the algebra hides (dual coding: Paivio, Mayer).', ml: 'കണക്കുകൂട്ടും മുൻപ് വരയ്ക്കുക: രശ്മി ചിത്രങ്ങൾ, സർക്യൂട്ട് ചിത്രങ്ങൾ, ബല അമ്പുകൾ. ബീജഗണിതം മറയ്ക്കുന്ന ചിഹ്ന തെറ്റ് ചിത്രം പിടിക്കും (ദ്വിമുഖ കോഡിംഗ്: പൈവിയോ, മേയർ).' },
        { en: 'Write the unit with every number and check that the answer\'s unit is the one asked for. A wrong unit is a method error you can catch in five seconds.', ml: 'ഓരോ സംഖ്യയ്ക്കൊപ്പവും യൂണിറ്റ് എഴുതുക; ഉത്തരത്തിന്റെ യൂണിറ്റ് ചോദിച്ചത് തന്നെയാണോ എന്ന് പരിശോധിക്കുക. തെറ്റായ യൂണിറ്റ് അഞ്ച് സെക്കൻഡിൽ പിടിക്കാവുന്ന രീതി തെറ്റാണ്.' },
        { en: 'Derive each formula once, by hand, from the one before it. You will never again wonder whether it is v = u + at or v = u − at.', ml: 'ഓരോ സൂത്രവാക്യവും ഒരു തവണ കൈകൊണ്ട് മുൻപത്തേതിൽ നിന്ന് വരുത്തിയെടുക്കുക. v = u + at ആണോ v = u − at ആണോ എന്ന് പിന്നെ ഒരിക്കലും സംശയിക്കില്ല.' },
        { en: 'Mix numericals from different chapters in one sitting. The exam does not tell you which chapter a problem belongs to.', ml: 'വ്യത്യസ്ത അദ്ധ്യായങ്ങളിലെ കണക്കുകൾ ഒരേ ഇരിപ്പിൽ കലർത്തി ചെയ്യുക. ചോദ്യം ഏത് അദ്ധ്യായത്തിന്റേതെന്ന് പരീക്ഷ പറയില്ല.' }
      ],
      source: 'Hewitt, "Conceptual Physics"; Mayer, "Multimedia Learning" (2001); Paivio 1971; Sweller 1988'
    },
    {
      icon: 'science',
      title: { en: 'Chemistry', ml: 'രസതന്ത്രം' },
      lede: { en: 'Chemistry has a vocabulary layer (symbols, valencies, names) that must simply be recalled, and a reasoning layer (why reactions go) that must be understood. Use different methods for each.', ml: 'രസതന്ത്രത്തിന് ഓർത്തെടുക്കേണ്ട ഒരു പദാവലി പാളിയും (ചിഹ്നങ്ങൾ, സംയോജകത, പേരുകൾ) മനസ്സിലാക്കേണ്ട ഒരു യുക്തി പാളിയും (പ്രവർത്തനങ്ങൾ എന്തുകൊണ്ട് നടക്കുന്നു) ഉണ്ട്. ഓരോന്നിനും വ്യത്യസ്ത രീതി ഉപയോഗിക്കുക.' },
      points: [
        { en: 'Symbols, valencies and formulae of common compounds go on spaced recall cards. Two minutes a day, not two hours before the exam.', ml: 'ചിഹ്നങ്ങൾ, സംയോജകത, സാധാരണ സംയുക്തങ്ങളുടെ രാസസൂത്രങ്ങൾ ഇടവേളയിട്ട ഓർമ്മ കാർഡുകളിൽ. ദിവസേന രണ്ട് മിനിറ്റ്, പരീക്ഷയ്ക്ക് മുൻപ് രണ്ട് മണിക്കൂറല്ല.' },
        { en: 'Balance equations by doing, not by reading balanced ones. Cover the coefficients and rebuild them.', ml: 'സമവാക്യങ്ങൾ സന്തുലനം ചെയ്യുന്നത് ചെയ്തു പഠിക്കുക, സന്തുലനം ചെയ്തവ വായിച്ചല്ല. ഗുണാങ്കങ്ങൾ മറച്ച് വീണ്ടും ഉണ്ടാക്കുക.' },
        { en: 'Learn each reaction as a story: what goes in, under what condition, what comes out, and what you would SEE. Observation questions are where marks are lost.', ml: 'ഓരോ പ്രവർത്തനവും ഒരു കഥയായി പഠിക്കുക: എന്ത് ചേരുന്നു, ഏത് സാഹചര്യത്തിൽ, എന്ത് പുറത്തുവരുന്നു, നിങ്ങൾ എന്ത് കാണും. നിരീക്ഷണ ചോദ്യങ്ങളിലാണ് മാർക്ക് നഷ്ടപ്പെടുന്നത്.' },
        { en: 'Use the periodic table\'s patterns instead of memorising elements one by one: a group shares behaviour, a period shares a trend.', ml: 'മൂലകങ്ങൾ ഓരോന്നായി കാണാതെ പഠിക്കുന്നതിന് പകരം ആവർത്തനപ്പട്ടികയുടെ ക്രമങ്ങൾ ഉപയോഗിക്കുക: ഒരു ഗ്രൂപ്പിന് ഒരേ സ്വഭാവം, ഒരു പീരിയഡിന് ഒരേ പ്രവണത.' },
        { en: 'Mole and concentration numericals are maths problems: four steps, units on every line.', ml: 'മോൾ, ഗാഢത കണക്കുകൾ ഗണിത ചോദ്യങ്ങളാണ്: നാല് ഘട്ടം, ഓരോ വരിയിലും യൂണിറ്റ്.' }
      ],
      source: 'Dunlosky et al. 2013 (distributed practice for paired associates); Johnstone 1991 on the three levels of chemistry'
    },
    {
      icon: 'biotech',
      title: { en: 'Biology', ml: 'ജീവശാസ്ത്രം' },
      lede: { en: 'Biology is diagrams, processes and names. Draw the diagram from memory, tell the process as a sequence, and put the names on cards.', ml: 'ജീവശാസ്ത്രം ചിത്രങ്ങളും പ്രക്രിയകളും പേരുകളുമാണ്. ചിത്രം ഓർമ്മയിൽ നിന്ന് വരയ്ക്കുക, പ്രക്രിയ ഒരു ക്രമമായി പറയുക, പേരുകൾ കാർഡുകളിലാക്കുക.' },
      points: [
        { en: 'For every labelled diagram in the textbook, draw and label it yourself with the book closed, then compare. Diagram questions are the most predictable marks in the paper.', ml: 'പാഠപുസ്തകത്തിലെ ഓരോ പേരെഴുതിയ ചിത്രവും പുസ്തകം അടച്ച് സ്വയം വരച്ച് പേരെഴുതുക, പിന്നെ താരതമ്യം ചെയ്യുക. ചിത്ര ചോദ്യങ്ങൾ പേപ്പറിലെ ഏറ്റവും പ്രവചിക്കാവുന്ന മാർക്കാണ്.' },
        { en: 'Turn every process (digestion, reflex arc, the nephron) into a numbered sequence you can say aloud in order. Order is what the examiner checks.', ml: 'ഓരോ പ്രക്രിയയും (ദഹനം, റിഫ്ലക്സ് ആർക്ക്, നെഫ്രോൺ) ക്രമത്തിൽ ഉറക്കെ പറയാവുന്ന അക്കമിട്ട ക്രമമാക്കുക. ക്രമമാണ് പരിശോധകൻ നോക്കുന്നത്.' },
        { en: 'Build a concept map per chapter: the big idea in the middle, parts around it, arrows saying how. A map you drew yourself is remembered; one you were given is not (Novak).', ml: 'ഓരോ അദ്ധ്യായത്തിനും ഒരു ആശയ ഭൂപടം ഉണ്ടാക്കുക: നടുവിൽ വലിയ ആശയം, ചുറ്റും ഭാഗങ്ങൾ, എങ്ങനെ എന്ന് പറയുന്ന അമ്പുകൾ. സ്വയം വരച്ച ഭൂപടം ഓർക്കും; തന്നത് ഓർക്കില്ല (നൊവാക്).' },
        { en: 'Terms go on spaced recall cards, in both languages, with the function on the back rather than a definition to memorise.', ml: 'പദങ്ങൾ രണ്ട് ഭാഷയിലും ഇടവേളയിട്ട ഓർമ്മ കാർഡുകളിൽ; പിന്നിൽ കാണാതെ പഠിക്കാനുള്ള നിർവ്വചനത്തിന് പകരം ധർമ്മം.' },
        { en: 'Ask "why" of every fact: why is the alveolus thin, why does the heart have valves. A fact with a reason is stored once; a bare fact must be stored by force.', ml: 'ഓരോ വസ്തുതയോടും "എന്തുകൊണ്ട്" ചോദിക്കുക: അൽവിയോളസ് എന്തുകൊണ്ട് നേർത്തതാണ്, ഹൃദയത്തിന് എന്തുകൊണ്ട് വാൽവുകൾ. കാരണമുള്ള വസ്തുത ഒരു തവണ ഓർമ്മയിൽ ഇരിക്കും; വെറും വസ്തുത ബലമായി അടിച്ചേൽപ്പിക്കണം.' }
      ],
      source: 'Paivio 1971; Mayer 2001; Novak & Cañas 2008; Dunlosky et al. 2013 (elaborative interrogation)'
    },
    {
      icon: 'public',
      title: { en: 'Social Science', ml: 'സാമൂഹ്യശാസ്ത്രം' },
      lede: { en: 'History is a chain of causes, geography is a map, civics and economics are definitions with examples. Study each as the thing it is.', ml: 'ചരിത്രം കാരണങ്ങളുടെ ശൃംഖലയാണ്, ഭൂമിശാസ്ത്രം ഒരു ഭൂപടമാണ്, പൗരശാസ്ത്രവും സാമ്പത്തികശാസ്ത്രവും ഉദാഹരണങ്ങളോടെയുള്ള നിർവ്വചനങ്ങളാണ്. ഓരോന്നും അതെന്താണോ അതായി പഠിക്കുക.' },
      points: [
        { en: 'For history, draw a timeline per chapter and write the cause and effect as arrows between events. The exam asks why, not just when.', ml: 'ചരിത്രത്തിന് ഓരോ അദ്ധ്യായത്തിനും ഒരു കാലരേഖ വരയ്ക്കുക; സംഭവങ്ങൾക്കിടയിൽ കാരണവും ഫലവും അമ്പുകളായി എഴുതുക. പരീക്ഷ ചോദിക്കുന്നത് എന്തുകൊണ്ട് എന്നാണ്, എപ്പോൾ എന്ന് മാത്രമല്ല.' },
        { en: 'For geography, mark the outline map from memory once a week. Map questions are fixed marks that many students leave on the table.', ml: 'ഭൂമിശാസ്ത്രത്തിന് ആഴ്ചയിൽ ഒരിക്കൽ ഓർമ്മയിൽ നിന്ന് ഭൂപടത്തിൽ അടയാളപ്പെടുത്തുക. ഭൂപട ചോദ്യങ്ങൾ പല വിദ്യാർത്ഥികളും വിട്ടുകളയുന്ന ഉറപ്പുള്ള മാർക്കാണ്.' },
        { en: 'Answer in points, each point one idea, and practise writing them under time. A five-mark answer is five reasons, not one paragraph.', ml: 'പോയിന്റുകളായി ഉത്തരം എഴുതുക, ഓരോ പോയിന്റും ഒരു ആശയം; സമയം നോക്കി എഴുതി പരിശീലിക്കുക. അഞ്ച് മാർക്ക് ഉത്തരം അഞ്ച് കാരണങ്ങളാണ്, ഒരു ഖണ്ഡികയല്ല.' },
        { en: 'Put dates, articles and definitions on spaced cards. Put the stories in your own words: memory is built for stories, and a fact inside one sticks (Willingham).', ml: 'തീയതികൾ, അനുച്ഛേദങ്ങൾ, നിർവ്വചനങ്ങൾ ഇടവേളയിട്ട കാർഡുകളിൽ. കഥകൾ സ്വന്തം വാക്കുകളിൽ: ഓർമ്മ കഥകൾക്കായി ഉണ്ടാക്കിയതാണ്, കഥയ്ക്കുള്ളിലെ വസ്തുത നിൽക്കും (വില്ലിംഗ്ഹാം).' }
      ],
      source: 'Willingham, "Why Don\'t Students Like School?" (2009); Dunlosky et al. 2013 (practice testing, distributed practice)'
    },
    {
      icon: 'translate',
      title: { en: 'Languages · Malayalam, English, Hindi', ml: 'ഭാഷകൾ · മലയാളം, ഇംഗ്ലീഷ്, ഹിന്ദി' },
      lede: { en: 'A language is a skill, so it is learned like one: lots of input you mostly understand, and output that someone corrects.', ml: 'ഭാഷ ഒരു നൈപുണ്യമാണ്, അതിനാൽ അങ്ങനെ തന്നെ പഠിക്കണം: മിക്കവാറും മനസ്സിലാകുന്ന ധാരാളം വായന, ആരെങ്കിലും തിരുത്തുന്ന എഴുത്ത്.' },
      points: [
        { en: 'Read a little every day at a level where you understand most of it; look up only the words that block the meaning (Krashen). Reading builds vocabulary faster than lists.', ml: 'മിക്കവാറും മനസ്സിലാകുന്ന നിലയിൽ ദിവസേന കുറച്ച് വായിക്കുക; അർത്ഥം തടയുന്ന വാക്കുകൾ മാത്രം നോക്കുക (ക്രാഷൻ). പട്ടികകളേക്കാൾ വേഗത്തിൽ വായന പദസമ്പത്ത് വളർത്തുന്നു.' },
        { en: 'Know the exam formats cold: letter, notice, speech, character sketch, poem appreciation. Practise each format three times under time, then have it checked.', ml: 'പരീക്ഷാ രൂപങ്ങൾ നന്നായി അറിയുക: കത്ത്, അറിയിപ്പ്, പ്രസംഗം, കഥാപാത്ര നിരൂപണം, കവിതാ ആസ്വാദനം. ഓരോ രൂപവും സമയം നോക്കി മൂന്ന് തവണ പരിശീലിച്ച് പരിശോധിപ്പിക്കുക.' },
        { en: 'After reading a lesson, close the book and tell its story in your own words, aloud. Then check what you left out.', ml: 'ഒരു പാഠം വായിച്ച ശേഷം പുസ്തകം അടച്ച് അതിന്റെ കഥ സ്വന്തം വാക്കുകളിൽ ഉറക്കെ പറയുക. പിന്നെ വിട്ടുപോയത് പരിശോധിക്കുക.' },
        { en: 'New words go on spaced cards with a sentence you wrote, not a dictionary meaning (Nation). A word met in six spaced encounters is yours.', ml: 'പുതിയ വാക്കുകൾ നിഘണ്ടു അർത്ഥത്തിനു പകരം നിങ്ങൾ എഴുതിയ വാക്യത്തോടെ ഇടവേളയിട്ട കാർഡുകളിൽ (നേഷൻ). ആറ് ഇടവേളകളിൽ കണ്ടുമുട്ടിയ വാക്ക് നിങ്ങളുടേതാണ്.' },

      ],
      source: 'Krashen, "The Input Hypothesis" (1985); Nation, "Learning Vocabulary in Another Language" (2001); Dunlosky et al. 2013'
    }

  const EXAM = [
    { en: 'Use the 15-minute cool-off for what it is for: read every question, mark the ones you can do at once, and decide the order. Start with a sure one to settle your hands.', ml: '15 മിനിറ്റ് കൂൾ-ഓഫ് അതിനുള്ളതിന് ഉപയോഗിക്കുക: എല്ലാ ചോദ്യങ്ങളും വായിക്കുക, ഉടൻ ചെയ്യാവുന്നവ അടയാളപ്പെടുത്തുക, ക്രമം തീരുമാനിക്കുക. കൈ ഉറയ്ക്കാൻ ഉറപ്പുള്ള ഒന്നിൽ തുടങ്ങുക.' },
    { en: 'Budget under two minutes per mark: 80 marks in 150 minutes leaves ten minutes to check. A five-mark question that has taken ten minutes should be left and returned to.', ml: 'ഒരു മാർക്കിന് രണ്ട് മിനിറ്റിൽ താഴെ: 150 മിനിറ്റിൽ 80 മാർക്ക് എന്നാൽ പരിശോധിക്കാൻ പത്ത് മിനിറ്റ് ബാക്കി. പത്ത് മിനിറ്റെടുത്ത അഞ്ച് മാർക്ക് ചോദ്യം വിട്ട് പിന്നീട് തിരിച്ചു വരിക.' },
    { en: 'There is no negative marking. Attempt everything; a formula and a first line earn part marks.', ml: 'നെഗറ്റീവ് മാർക്കില്ല. എല്ലാം ശ്രമിക്കുക; ഒരു സൂത്രവാക്യവും ആദ്യ വരിയും ഭാഗിക മാർക്ക് നേടും.' },
    { en: 'Write the steps. Kerala\'s scheme awards marks per step, so a right answer with no working can score less than a wrong answer with the right method.', ml: 'ഘട്ടങ്ങൾ എഴുതുക. കേരളത്തിന്റെ മൂല്യനിർണ്ണയ രീതി ഓരോ ഘട്ടത്തിനും മാർക്ക് നൽകുന്നു; ചെയ്ത വഴി ഇല്ലാത്ത ശരിയായ ഉത്തരത്തിന് ശരിയായ രീതിയുള്ള തെറ്റായ ഉത്തരത്തേക്കാൾ കുറവ് മാർക്ക് കിട്ടാം.' },
    { en: 'The last week is for past papers under the clock, not for new chapters. The last night is for sleep: memory is consolidated while you sleep, and a tired brain misreads questions.', ml: 'അവസാന ആഴ്ച സമയം നോക്കി മുൻവർഷ ചോദ്യപേപ്പറുകൾക്കാണ്, പുതിയ അദ്ധ്യായങ്ങൾക്കല്ല. അവസാന രാത്രി ഉറക്കത്തിനാണ്: ഉറങ്ങുമ്പോഴാണ് ഓർമ്മ ഉറയ്ക്കുന്നത്; ക്ഷീണിച്ച തലച്ചോറ് ചോദ്യങ്ങൾ തെറ്റായി വായിക്കും.' }
  ];

  function principleCard(p, i) {
    return el('div', { class: 'card method-card' }, [
      el('div', { class: 'row', style: { gap: '10px', flexWrap: 'nowrap', alignItems: 'flex-start' } }, [
        el('span', { class: 'method-ix' }, [DOM.mi(p.icon, 'sm')]),
        el('div', { class: 'grow' }, [
          el('h3', { text: (i + 1) + '. ' + P(p.title) }),
          el('p', { class: 'prose tight', style: { margin: '6px 0 0' }, text: P(p.what) })
        ])
      ]),
      el('div', { class: 'method-meta' }, [
        el('div', {}, [el('span', { class: 'kicker', text: t('method_in_app') }), el('p', { class: 'small', style: { margin: '4px 0 0' }, text: P(p.app) })]),
        el('div', {}, [el('span', { class: 'kicker', text: t('method_source') }), el('p', { class: 'small muted', style: { margin: '4px 0 0' }, text: p.source })])
      ])
    ]);
  }

  function subjectCard(s) {
    return NoteBody.expander({
      cls: 'exp-subject',
      mark: el('span', { class: 'ix' }, [DOM.mi(s.icon, 'xs')]),
      title: P(s.title),
      sub: P(s.lede),
      build: function () {
        return [
          el('ul', { class: 'prose tight method-list' }, s.points.map(pt => el('li', { text: P(pt) }))),
          el('p', { class: 'small muted', style: { margin: '10px 0 0' } }, [el('b', { text: t('method_source') + ': ' }), el('span', { text: s.source })])
        ];
      }

  function render() {
    const bp = Study.blueprint();
    return el('div', { class: 'stack' }, [
      UI.crumb([{ text: t('tab_home'), href: 'home' }, { text: t('method_title') }]),
      el('div', {}, [
        el('div', { class: 'kicker', text: t('method_kicker') }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: t('method_title') })
      ]),
      el('p', { class: 'lede', text: t('method_lede') }),

      el('h2', { text: t('method_principles') }),
      el('div', { class: 'stack', style: { gap: '12px' } }, PRINCIPLES.map(principleCard)),

      el('div', { class: 'card tint' }, [
        el('div', { class: 'kicker', text: t('method_dont') }),
        el('ul', { class: 'prose tight method-list', style: { marginTop: '10px' } }, DONTS.map(d => el('li', { text: P(d) }))),
        el('p', { class: 'small muted', style: { margin: '8px 0 0' }, text: 'Dunlosky, Rawson, Marsh, Nathan & Willingham 2013; Bjork & Bjork 2011; Walker, "Why We Sleep" (2017)' })
      ]),

      el('h2', { text: t('method_subjects') }),
      el('div', { class: 'stack', style: { gap: '10px' } }, SUBJECTS.map(subjectCard)),

      el('div', { class: 'card' }, [
        el('div', { class: 'kicker', text: t('method_exam_day') }),
        el('p', { class: 'small muted', style: { margin: '6px 0 10px' },
          text: t('exam_paper') + ' · ' + bp.sections.map(s => s.count + '×' + s.marks).join(' + ') + ' = ' + bp.marks }),
        el('ul', { class: 'prose tight method-list' }, EXAM.map(x => el('li', { text: P(x) })))
      ]),

      el('div', { class: 'btn-row' }, [
        el('a', { class: 'btn primary', href: Router.href('home'), text: t('tab_home') }),
        el('a', { class: 'btn', href: Router.href('drill'), text: t('drill') })
      ])
