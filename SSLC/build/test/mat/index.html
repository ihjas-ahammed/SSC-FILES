  'fig.rhombus-diagonals': {
    title: 'Rhombus: Perpendicular Bisecting Diagonals',
    title_ml: 'റോംബസ്: ലംബമായി സമഭാഗം ചെയ്യുന്ന വികർണ്ണങ്ങൾ',
    caption: 'Diagonals $AC$ and $BD$ meet at $90^\\circ$ at midpoint $O$. From $O$, cut $d_2/2 = 4\\text{ cm}$ above and below to form all four equal sides ($5\\text{ cm}$).',
    caption_ml: 'വികർണ്ണങ്ങളായ $AC, BD$ എന്നിവ മധ്യബിന്ദു $O$-യിൽ $90^\\circ$-ൽ കൂട്ടിമുട്ടുന്നു. $O$-യിൽ നിന്ന് മുകളിലേക്കും താഴേക്കും $4\\text{ cm}$ വീതം അടയാളപ്പെടുത്തിയാൽ നാല് വശങ്ങളും ($5\\text{ cm}$) തുല്യമായ റോംബസ് ലഭിക്കുന്നു.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 210, xr: [-5, 5], yr: [-5, 5], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(halfD2) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        // Diagonal AC fixed horizontally (length 6 cm -> half = 3)
        const halfD1 = 3.0;
        const ax = -halfD1, ay = 0;
        const cx = halfD1, cy = 0;
        // Diagonal BD vertical (length 2 * halfD2)
        const bx = 0, by = halfD2;
        const dx = 0, dy = -halfD2;

        // Rhombus fill
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(dx)},${p.ty(dy)}`,
          style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5px;'
        }));

        // Diagonal AC (horizontal)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(ax), y1: p.ty(ay), x2: p.tx(cx), y2: p.ty(cy),
          style: 'stroke: var(--ink); stroke-width: 2px;'
        }));

        // Diagonal BD (vertical perpendicular bisector)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(bx), y1: p.ty(by + 0.5), x2: p.tx(dx), y2: p.ty(dy - 0.5),
          style: 'stroke: var(--ok); stroke-width: 2px; stroke-dasharray: 4 3;'
        }));

        // Right angle marker at O (0,0)
        group.appendChild(Fig.svg('polyline', {
          points: `${p.tx(0.4)},${p.ty(0)} ${p.tx(0.4)},${p.ty(0.4)} ${p.tx(0)},${p.ty(0.4)}`,
          style: 'fill: none; stroke: var(--warn); stroke-width: 1.5px;'
        }));

        // Side length via Pythagoras
        const sideLen = Math.hypot(halfD1, halfD2).toFixed(2);

        // Labels for diagonals
        group.appendChild(Fig.svg('text', {
          x: p.tx(-1.5), y: p.ty(0) - 6, 'text-anchor': 'middle',
          style: 'font-size: 10px; fill: var(--ink); font-weight: 600;', text: '3 cm'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(1.5), y: p.ty(0) - 6, 'text-anchor': 'middle',
          style: 'font-size: 10px; fill: var(--ink); font-weight: 600;', text: '3 cm'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(0) + 14, y: p.ty(halfD2 / 2),
          style: 'font-size: 10px; fill: var(--ok); font-weight: 600;', text: halfD2 + ' cm'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(0) + 14, y: p.ty(-halfD2 / 2),
          style: 'font-size: 10px; fill: var(--ok); font-weight: 600;', text: halfD2 + ' cm'
        }));

        // Vertices
        const vts = [
          { x: ax, y: ay, lbl: 'A', ox: -12, oy: 4 },
          { x: cx, y: cy, lbl: 'C', ox: 12, oy: 4 },
          { x: bx, y: by, lbl: 'B', ox: 0, oy: -8 },
          { x: dx, y: dy, lbl: 'D', ox: 0, oy: 14 },
          { x: 0, y: 0, lbl: 'O', ox: -10, oy: 12 }
        ];
        vts.forEach(v => {
          group.appendChild(Fig.svg('circle', {
            cx: p.tx(v.x), cy: p.ty(v.y), r: 3.5,
            style: 'fill: var(--ink);'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(v.x) + v.ox, y: p.ty(v.y) + v.oy,
            'text-anchor': 'middle',
            style: 'font-weight: 700; font-size: 11px; fill: var(--ink);',
            text: v.lbl
          }));
        });

        // Top banner: side length formula
        group.appendChild(Fig.svg('text', {
          x: p.tx(0), y: p.ty(4.6), 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 12px; fill: var(--accent);',
          text: (isMl ? `റോംബസ് വശം = √(3² + ${halfD2}²) = ${sideLen} cm`
                      : `Rhombus side = √(3² + ${halfD2}²) = ${sideLen} cm`)
        }));
      }

      draw(4);
      api.body.appendChild(p.svg);
      api.control({
        min: 2, max: 5, step: 0.5, value: 4,
        label: 'Half diagonal BD (OB)',
        format: v => v + ' cm (BD = ' + (2 * v) + ' cm)',
        onInput: draw
      });
    }
  },

  'fig.ratio-tape': {

  'fig.ratio-division': {
    title: 'Dividing in a Given Ratio',
    title_ml: 'അംശബന്ധത്തിൽ വിഭജിക്കൽ',
    caption: 'Dividing total quantity into ratio $3 : 2$. Step 1: 1 part = Total ÷ 5. Step 2: Multiply by parts.',
    caption_ml: 'തുകയെ 3 : 2 എന്ന അംശബന്ധത്തിൽ വിഭജിക്കുന്നു. ഘട്ടം 1: 1 ഭാഗം = തുക ÷ 5. ഘട്ടം 2: ഭാഗങ്ങൾ ഗുണിക്കുക.',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 180', role: 'img' });

      svg.appendChild(group);

      function draw(total) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const onePart = (total / 5).toFixed(1).replace(/\.0$/, '');
        const share1 = (3 * (total / 5)).toFixed(1).replace(/\.0$/, '');
        const share2 = (2 * (total / 5)).toFixed(1).replace(/\.0$/, '');

        // Bar container
        const barX = 35, barY = 40, barW = 260, barH = 36;
        const w1 = barW * 0.6;
        const w2 = barW * 0.4;

        // Share 1 block (3/5)
        group.appendChild(Fig.svg('rect', {
          x: barX, y: barY, width: w1, height: barH, rx: 4,
          style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: barX + w1 / 2, y: barY + 22, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 13px; fill: var(--accent);',
          text: isMl ? `ഭാഗം 1: ${share1}` : `Part 1: ${share1}`
        }));

        // Share 2 block (2/5)
        group.appendChild(Fig.svg('rect', {
          x: barX + w1, y: barY, width: w2, height: barH, rx: 4,
          style: 'fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: barX + w1 + w2 / 2, y: barY + 22, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 13px; fill: var(--ok);',
          text: isMl ? `ഭാഗം 2: ${share2}` : `Part 2: ${share2}`
        }));

        // Calculation labels
        group.appendChild(Fig.svg('text', {
          x: 165, y: 112, 'text-anchor': 'middle',
          style: 'font-size: 12px; fill: var(--ink); font-weight: 600;',
          text: isMl ? `1 ഭാഗം = ${total} ÷ (3 + 2) = ${onePart}` : `1 Part = ${total} ÷ (3 + 2) = ${onePart}`
        }));
        group.appendChild(Fig.svg('text', {
          x: 165, y: 138, 'text-anchor': 'middle',
          style: 'font-size: 12px; fill: var(--ink); font-weight: 600;',
          text: `${share1} : ${share2} = 3 : 2`
        }));
      }

      draw(50);
      api.body.appendChild(svg);
      api.control({
        min: 20, max: 100, step: 10, value: 50,
        label: 'Total Quantity',
        format: v => 'Total = ' + v,
        onInput: draw
      });
    }

    title_ml: 'തുല്യ ഉയരമുള്ള ത്രികോണങ്ങൾ',
    caption: 'When a vertex connects to the base, it splits the triangle into two with areas proportional to their bases.',
    caption_ml: 'ഒരു ശീർഷത്തിൽ നിന്നുള്ള വര പാദത്തെ വിഭജിക്കുമ്പോൾ ലഭിക്കുന്ന ത്രികോണങ്ങളുടെ പരപ്പളവ് പാദങ്ങളുടെ അംശബന്ധത്തിലാണ്.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 200, xr: [-1, 11], yr: [-1, 7], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(splitX) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const bx = 0, by = 0;
        const cx = 10, cy = 0;
        const ax = 4, ay = 6;
        const dx = splitX, dy = 0;

        // Triangle ABD
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(bx)},${p.ty(by)} ${p.tx(dx)},${p.ty(dy)} ${p.tx(ax)},${p.ty(ay)}`,
          style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2px;'
        }));

        // Triangle ADC
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(dx)},${p.ty(dy)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(ax)},${p.ty(ay)}`,
          style: 'fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2px;'
        }));

        // Height line from A perpendicular to base (at x = 4)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(ax), y1: p.ty(ay), x2: p.tx(ax), y2: p.ty(0),
          style: 'stroke: var(--warn); stroke-width: 1.5px; stroke-dasharray: 4 3;'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(ax) + 8, y: p.ty(3),
          style: 'font-size: 11px; fill: var(--warn); font-weight: 700;',
          text: 'h = 6'
        }));

        // Base lengths
        const b1 = splitX;
        const b2 = 10 - splitX;
        const a1 = (0.5 * b1 * 6).toFixed(1).replace(/\.0$/, '');
        const a2 = (0.5 * b2 * 6).toFixed(1).replace(/\.0$/, '');

        // Area text inside triangles
        group.appendChild(Fig.svg('text', {
          x: p.tx((bx + dx + ax) / 3), y: p.ty((by + dy + ay) / 3), 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--accent);',
          text: `A₁ = ${a1}`
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx((dx + cx + ax) / 3), y: p.ty((dy + cy + ay) / 3), 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ok);',
          text: `A₂ = ${a2}`
        }));

        // Ratio caption
        group.appendChild(Fig.svg('text', {
          x: p.tx(5), y: p.ty(-0.7), 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? `പാദങ്ങൾ: ${b1} : ${b2} ⇒ പരപ്പളവുകൾ: ${a1} : ${a2}`
                     : `Bases: ${b1} : ${b2} ⇒ Areas: ${a1} : ${a2}`
        }));
      }

      draw(4);
      api.body.appendChild(p.svg);
      api.control({
        min: 2, max: 8, step: 1, value: 4,
        label: 'Base split point D',
        format: v => 'BD = ' + v + ', DC = ' + (10 - v),
        onInput: draw
      });
    }
  },

  /* ── Class 8 Chapter 8: Area of Quadrilaterals (ചതുർഭുജങ്ങളുടെ പരപ്പളവ്) ──── */

  'fig.area-general-quad': {
    title: 'Area of General Quadrilateral',
    title_ml: 'സാധാരണ ചതുർഭുജത്തിന്റെ പരപ്പളവ്',
    caption: 'Diagonal $d$ splits quadrilateral into two triangles with perpendicular offsets $h_1$ and $h_2$.',
    caption_ml: 'വികർണ്ണം $d$ ചതുർഭുജത്തെ $h_1, h_2$ ലംബങ്ങളുള്ള രണ്ട് ത്രികോണങ്ങളായി വിഭജിക്കുന്നു.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 210, xr: [-2, 16], yr: [-6, 6], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(d) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const ax = 0, ay = 0;
        const cx = d, cy = 0;
        const bx = d * 0.35, by = 4;
        const dx = d * 0.7, dy = -3.5;

        // Fill quadrilateral
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(dx)},${p.ty(dy)}`,
          style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2px;'
        }));

        // Diagonal AC (d)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(ax), y1: p.ty(ay), x2: p.tx(cx), y2: p.ty(cy),
          style: 'stroke: var(--ink); stroke-width: 2.5px;'
        }));

        // Offset h1 (from B to AC)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(bx), y1: p.ty(by), x2: p.tx(bx), y2: p.ty(0),
          style: 'stroke: var(--ok); stroke-width: 1.5px; stroke-dasharray: 4 3;'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(bx) + 6, y: p.ty(2),
          style: 'font-size: 10px; font-weight: 700; fill: var(--ok);',
          text: 'h₁ = 4'
        }));

        // Offset h2 (from D to AC)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(dx), y1: p.ty(dy), x2: p.tx(dx), y2: p.ty(0),
          style: 'stroke: var(--warn); stroke-width: 1.5px; stroke-dasharray: 4 3;'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(dx) + 6, y: p.ty(-1.7),
          style: 'font-size: 10px; font-weight: 700; fill: var(--warn);',
          text: 'h₂ = 3.5'
        }));

        // Labels for vertices
        const pts = [
          { x: ax, y: ay, lbl: 'A', ox: -12, oy: 4 },
          { x: cx, y: cy, lbl: 'C', ox: 10, oy: 4 },
          { x: bx, y: by, lbl: 'B', ox: 0, oy: -8 },
          { x: dx, y: dy, lbl: 'D', ox: 0, oy: 14 }
        ];
        pts.forEach(pt => {
          group.appendChild(Fig.svg('circle', {
            cx: p.tx(pt.x), cy: p.ty(pt.y), r: 3, style: 'fill: var(--ink);'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(pt.x) + pt.ox, y: p.ty(pt.y) + pt.oy, 'text-anchor': 'middle',
            style: 'font-size: 11px; font-weight: 700; fill: var(--ink);', text: pt.lbl
          }));
        });

        // Area formula summary
        const area = (0.5 * d * (4 + 3.5)).toFixed(1).replace(/\.0$/, '');
        group.appendChild(Fig.svg('text', {
          x: p.tx(d / 2), y: p.ty(5.2), 'text-anchor': 'middle',
          style: 'font-size: 12px; font-weight: 700; fill: var(--accent);',
          text: isMl ? `പരപ്പളവ് = ½ × ${d} × (4 + 3.5) = ${area}`
                     : `Area = ½ × ${d} × (4 + 3.5) = ${area}`
        }));
      }

      draw(12);
      api.body.appendChild(p.svg);
      api.control({
        min: 8, max: 15, step: 1, value: 12,
        label: 'Diagonal length (d)',

        onInput: draw
      });
    }
  },

  'fig.area-rhombus': {

  'fig.area-parallelogram': {

    title_ml: 'സാമാന്തരികത്തിന്റെ പരപ്പളവ്',
    caption: 'Slide the left triangle to the right to see that parallelogram area equals base × height.',

  'fig.area-trapezium': {

    title_ml: 'ലംബകത്തിന്റെ പരപ്പളവ്',
    caption: 'Diagonal divides trapezium into two triangles with bases $a$ and $b$ sharing height $h$: Area = (1/2)*h*(a+b).',
    caption_ml: 'വികർണ്ണം ലംബകത്തെ $a, b$ പാദങ്ങളും പൊതു ഉയരം $h$-ഉം ഉള്ള രണ്ട് ത്രികോണങ്ങളാക്കുന്നു: പരപ്പളവ് = (1/2)*h*(a+b).',

    build(api) {
      const p = Fig.plot({ w: 330, h: 200, xr: [-1, 12], yr: [-1, 6], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(a) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const b = 10, h = 4;
        const ax = 0, ay = 0;
        const bx = b, by = 0;
        const topStart = (b - a) / 2;
        const dx = topStart, dy = h;
        const cx = topStart + a, cy = h;

        // Triangle 1 (base b, vertex D)
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)}`,

        }));

        // Triangle 2 (base a, vertex A)
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(dx)},${p.ty(dy)}`,
          style: 'fill: var(--ok-soft); stroke: var(--ok); stroke-width: 2px;'
        }));

        // Diagonal dividing line
        group.appendChild(Fig.svg('line', {
          x1: p.tx(ax), y1: p.ty(ay), x2: p.tx(cx), y2: p.ty(cy),

        }));

        // Height line
        group.appendChild(Fig.svg('line', {
          x1: p.tx(dx), y1: p.ty(dy), x2: p.tx(dx), y2: p.ty(0),

        group.appendChild(Fig.svg('text', {

        // Area total
        const area = (0.5 * h * (a + b)).toFixed(1).replace(/\.0$/, '');
        group.appendChild(Fig.svg('text', {
          x: p.tx(5), y: p.ty(5.2), 'text-anchor': 'middle',

  /* ── Class 8 Chapter 9: Negative Numbers (ഋണസംഖ്യകൾ) ───────────────────── */

  'fig.negative-number-line': {
    title: 'The Number Line & Signed Steps',
    title_ml: 'സംഖ്യാരേഖയും ചുവടുകളും',
    caption: 'Start at $a = 2$. Drag the step slider to add positive or negative quantities and observe direction.',
    caption_ml: '$a = 2$ ൽ നിന്ന് തുടങ്ങുന്നു. സ്ലൈഡർ നീക്കി അധിസംഖ്യകളും ന്യൂനസംഖ്യകളും കൂട്ടുമ്പോഴുള്ള ദിശ നിരീക്ഷിക്കുക.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 180, xr: [-9, 9], yr: [-3, 4], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(step) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const startX = 2;
        const endX = startX + step;

        // Number line axis
        group.appendChild(Fig.svg('line', {
          x1: p.tx(-8.5), y1: p.ty(0), x2: p.tx(8.5), y2: p.ty(0),
          style: 'stroke: var(--ink); stroke-width: 2px;'
        }));

        // Arrows at ends
        group.appendChild(Fig.svg('polyline', {
          points: `${p.tx(-8.2)},${p.ty(0.3)} ${p.tx(-8.5)},${p.ty(0)} ${p.tx(-8.2)},${p.ty(-0.3)}`,
          style: 'fill: none; stroke: var(--ink); stroke-width: 2px;'
        }));
        group.appendChild(Fig.svg('polyline', {
          points: `${p.tx(8.2)},${p.ty(0.3)} ${p.tx(8.5)},${p.ty(0)} ${p.tx(8.2)},${p.ty(-0.3)}`,
          style: 'fill: none; stroke: var(--ink); stroke-width: 2px;'
        }));

        // Ticks and labels
        for (let i = -8; i <= 8; i += 2) {
          const isZero = i === 0;
          group.appendChild(Fig.svg('line', {
            x1: p.tx(i), y1: p.ty(-0.3), x2: p.tx(i), y2: p.ty(0.3),
            style: `stroke: ${isZero ? 'var(--accent)' : 'var(--ink)'}; stroke-width: ${isZero ? 2.5 : 1}px;`
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(i), y: p.ty(-0.9), 'text-anchor': 'middle',
            style: `font-size: 10px; font-weight: ${isZero ? 700 : 500}; fill: ${isZero ? 'var(--accent)' : 'var(--ink)'};`,
            text: i
          }));
        }

        // Arc jump from startX to endX
        if (step !== 0) {
          const midX = (startX + endX) / 2;
          const arcH = Math.min(2.8, Math.max(1.2, Math.abs(step) * 0.35));
          const color = step > 0 ? 'var(--ok)' : 'var(--warn)';
          const pathD = `M ${p.tx(startX)} ${p.ty(0.3)} Q ${p.tx(midX)} ${p.ty(arcH)} ${p.tx(endX)} ${p.ty(0.3)}`;
          group.appendChild(Fig.svg('path', {
            d: pathD, style: `fill: none; stroke: ${color}; stroke-width: 2.5px;`
          }));
          group.appendChild(Fig.svg('text', {

  'fig.negative-multiplication': {
    title: 'Sign Rules of Multiplication',
    title_ml: 'ഗുണനത്തിലെ ചിഹ്നനിയമങ്ങൾ',
    caption: 'Products of like signs are positive (+); products of unlike signs are negative (-).',
    caption_ml: 'ഒരേ ചിഹ്നങ്ങളുടെ ഗുണനഫലം അധിസംഖ്യയും (+), വ്യത്യസ്ത ചിഹ്നങ്ങളുടെ ഗുണനഫലം ന്യൂനസംഖ്യയുമാണ് (-).',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 180', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(bVal) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const aVal = -4;
        const prod = aVal * bVal;
        const isPos = prod > 0;

        // Display card box
        svg.appendChild(Fig.svg('rect', {
          x: 20, y: 20, width: 290, height: 140, rx: 8,
          style: `fill: ${isPos ? 'var(--ok-soft)' : 'var(--accent-soft)'}; stroke: ${isPos ? 'var(--ok)' : 'var(--accent)'}; stroke-width: 1.5px;`
        }));

        // Formula line
        group.appendChild(Fig.svg('text', {
          x: 165, y: 65, 'text-anchor': 'middle',
          style: 'font-size: 16px; font-weight: 700; fill: var(--ink);',
          text: `(${aVal}) × (${bVal}) = ${prod > 0 ? '+' : ''}${prod}`
        }));

        // Rule description
        let ruleText = '';
        if (bVal < 0) {
          ruleText = isMl ? '(-) × (-) = (+) ന്യൂനവും ന്യൂനവും ഗുണിച്ചാൽ അധിസംഖ്യ!'
                          : '(-) × (-) = (+) Two negatives make a positive!';
        } else if (bVal > 0) {
          ruleText = isMl ? '(-) × (+) = (-) ന്യൂനവും അധിയും ഗുണിച്ചാൽ ന്യൂനസംഖ്യ!'
                          : '(-) × (+) = (-) Unlike signs make a negative!';
        } else {
          ruleText = isMl ? 'പൂജ്യത്തോട് ഗുണിച്ചാൽ ഫലം പൂജ്യം.' : 'Multiplication by zero gives zero.';
        }

        group.appendChild(Fig.svg('text', {
          x: 165, y: 110, 'text-anchor': 'middle',
          style: `font-size: 12px; font-weight: 700; fill: ${isPos ? 'var(--ok)' : 'var(--accent)'};`,

        onInput: draw

    caption_ml: 'ഓരോ അഞ്ച് വിവരങ്ങൾക്കും 4 ലംബ വരകളും 1 കുറുകെ വരയും ചേർത്ത് കെട്ടുകളാക്കുന്നു.',

      function draw(n) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const bundles = Math.floor(n / 5);

        for (let b = 0; b < bundles; b++) {
          const bx = startX + b * boxW;
          for (let v = 0; v < 4; v++) {

              style: 'stroke: var(--accent); stroke-width: 2.5px;'
            }));
          }
          group.appendChild(Fig.svg('line', {
            x1: bx - 4, y1: 90, x2: bx + 32, y2: 50,
            style: 'stroke: var(--warn); stroke-width: 2.5px;'
          }));
        }

        const remX = startX + bundles * boxW;
        for (let r = 0; r < rem; r++) {
          group.appendChild(Fig.svg('line', {
            x1: remX + r * 9, y1: 45, x2: remX + r * 9, y2: 95,
            style: 'stroke: var(--accent); stroke-width: 2.5px;'
          }));
        }

        group.appendChild(Fig.svg('text', {
          x: 165, y: 145, 'text-anchor': 'middle',

      api.control({

  'fig.stat-histogram': {

        { label: '40-50', x0: 40, x1: 50, f: 3 }

        DOM.clear(group);

        }));

        bins.forEach((b, idx) => {

          const isModal = b.f === 15;
          const fill = isSel ? 'var(--warn-soft)' : (isModal ? 'var(--ok-soft)' : 'var(--accent-soft)');
          const stroke = isSel ? 'var(--warn)' : (isModal ? 'var(--ok)' : 'var(--accent)');

          group.appendChild(Fig.svg('rect', {

          group.appendChild(Fig.svg('text', {

          x: p.tx(50), y: p.ty(-1), 'text-anchor': 'middle',
          style: 'font-size: 9px; fill: var(--ink);', text: 50

        const active = bins[selIdx];
        group.appendChild(Fig.svg('text', {
          x: p.tx(25), y: p.ty(17.2), 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? `വിഭാഗം: ${active.label} | ആവൃത്തി: ${active.f} ${active.f === 15 ? '(മോഡൽ വിഭാഗം)' : ''}`

      api.control({
        min: 0, max: 4, step: 1, value: 2,
        label: 'Select Class Interval',
        format: v => bins[v].label + ' (f=' + bins[v].f + ')',
        onInput: draw
      });
    }

        }));

        group.appendChild(Fig.svg('line', { x1: ax, y1: ay, x2: dx, y2: dy, style: 'stroke: var(--ink); stroke-width: 2px;' }));

      api.control({

        label: 'Position of Point D',
        format: v => 'BD : DC = ' + (v/10) + ' : ' + ((100-v)/10),

  /* ── Class 9 Chapter 3: Pairs of Equations (സമവാക്യജോടികൾ) ─────────────── */

  'fig.linear-systems': {
    title: 'Geometric Solution of Simultaneous Linear Equations',
    title_ml: 'രണ്ട് നേർവരകളുടെ സംഗമബിന്ദുവും സമവാക്യപരിഹാരവും',
    caption: 'System: $x + y = 10$ and $x - y = k$. The unique solution $(x, y)$ is the coordinates of the intersection point of the two lines.',
    caption_ml: 'സമവാക്യങ്ങൾ: $x + y = 10$, $x - y = k$. രണ്ട് വരകളും കൂട്ടിമുട്ടുന്ന ബിന്ദുവാണ് ഈ സമവാക്യങ്ങളുടെ പൊതുവായ പരിഹാരം $(x, y)$.',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 190', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(k) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const ox = 50, oy = 150, sc = 11;

        group.appendChild(Fig.svg('line', { x1: ox, y1: 15, x2: ox, y2: oy + 10, style: 'stroke: var(--muted); stroke-width: 1.5px;' }));
        group.appendChild(Fig.svg('line', { x1: ox - 10, y1: oy, x2: 300, y2: oy, style: 'stroke: var(--muted); stroke-width: 1.5px;' }));

        for (let i = 2; i <= 12; i += 2) {
          group.appendChild(Fig.svg('text', { x: ox + i * sc, y: oy + 14, 'text-anchor': 'middle', style: 'font-size: 9px; fill: var(--muted);', text: i }));
          group.appendChild(Fig.svg('text', { x: ox - 6, y: oy - i * sc + 3, 'text-anchor': 'end', style: 'font-size: 9px; fill: var(--muted);', text: i }));
        }

        group.appendChild(Fig.svg('line', {
          x1: ox + 0 * sc, y1: oy - 10 * sc,
          x2: ox + 11 * sc, y2: oy - (-1) * sc,
          style: 'stroke: #2563eb; stroke-width: 2px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + 2 * sc, y: oy - 9 * sc,
          style: 'font-size: 10px; font-weight: 700; fill: #2563eb;',
          text: 'x + y = 10'
        }));

        const xStart = Math.max(0, k);
        const yStart = xStart - k;
        group.appendChild(Fig.svg('line', {
          x1: ox + xStart * sc, y1: oy - yStart * sc,
          x2: ox + 12 * sc, y2: oy - (12 - k) * sc,
          style: 'stroke: #dc2626; stroke-width: 2px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + 10 * sc, y: oy - (10 - k) * sc - 8,
          style: 'font-size: 10px; font-weight: 700; fill: #dc2626;',

        }));

        const iy = (10 - k) / 2;

        const py = oy - iy * sc;

        group.appendChild(Fig.svg('line', { x1: px, y1: oy, x2: px, y2: py, style: 'stroke: var(--accent); stroke-dasharray: 2,2;' }));
        group.appendChild(Fig.svg('line', { x1: ox, y1: py, x2: px, y2: py, style: 'stroke: var(--accent); stroke-dasharray: 2,2;' }));
        group.appendChild(Fig.svg('circle', { cx: px, cy: py, r: 5, style: 'fill: var(--accent); stroke: #fff; stroke-width: 2px;' }));

        group.appendChild(Fig.svg('text', {
          x: px + 8, y: py - 8,
          style: 'font-size: 12px; font-weight: 800; fill: var(--ink);',

        }));

        group.appendChild(Fig.svg('text', {
          x: 165, y: 182, 'text-anchor': 'middle',

      draw(2);
      api.body.appendChild(svg);

        label: 'Difference Value k',
        format: v => 'k = ' + v,
        onInput: draw
      });
    }

  /* ── Class 9 Chapter 4: New Numbers (പുതിയ സംഖ്യകൾ) ──────────────────────── */

  'fig.root-spiral': {
    title: 'Spiral of Theodorus (Roots Construction)',
    title_ml: 'തിയോഡോറസ് സർപ്പിളം (വർഗ്ഗമൂലങ്ങൾ)',
    caption: 'Successive right-angled triangles with perpendicular side of 1 unit construct $\\sqrt{2}, \\sqrt{3}, \\sqrt{4}, \\sqrt{5}, \\dots$ consecutively.',
    caption_ml: 'ലംബവശം 1 യൂണിറ്റ് ആയി തുടർച്ചയായി മട്ടത്രികോണങ്ങൾ വരച്ച് $\\sqrt{2}, \\sqrt{3}, \\sqrt{4}, \\dots$ നിർമ്മിക്കുന്നു.',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 200', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(steps) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const ox = 150, oy = 120, unit = 48;

        group.appendChild(Fig.svg('circle', { cx: ox, cy: oy, r: 3, style: 'fill: var(--ink);' }));
        group.appendChild(Fig.svg('text', { x: ox - 10, y: oy + 12, style: 'font-size: 10px; font-weight: 700; fill: var(--ink);', text: 'O' }));

        let currentAngle = 0;
        let lastX = ox + unit;
        let lastY = oy;

        group.appendChild(Fig.svg('line', { x1: ox, y1: oy, x2: lastX, y2: lastY, style: 'stroke: var(--ink); stroke-width: 2px;' }));
        group.appendChild(Fig.svg('text', { x: (ox + lastX)/2, y: oy + 14, 'text-anchor': 'middle', style: 'font-size: 10px; font-weight: 700; fill: var(--muted);', text: '1' }));

        const colors = ['#2563eb', '#16a34a', '#d97706', '#dc2626', '#9333ea', '#0891b2'];

        for (let n = 1; n <= steps; n++) {
          const col = colors[(n - 1) % colors.length];
          const delta = Math.atan(1 / Math.sqrt(n));
          currentAngle += delta;
          const nextHypot = Math.sqrt(n + 1) * unit;
          const nextX = ox + nextHypot * Math.cos(currentAngle);
          const nextY = oy - nextHypot * Math.sin(currentAngle);

          group.appendChild(Fig.svg('polygon', {
            points: `${ox},${oy} ${lastX},${lastY} ${nextX},${nextY}`,
            style: `fill: ${col}22; stroke: ${col}; stroke-width: 1.5px;`
          }));

          group.appendChild(Fig.svg('line', {
            x1: lastX, y1: lastY, x2: nextX, y2: nextY,
            style: 'stroke: var(--ink); stroke-width: 1.5px;'
          }));

          const midX = (ox + nextX) / 2;
          const midY = (oy + nextY) / 2;
          const rootVal = n + 1 === 4 ? '2' : `√${n + 1}`;
          group.appendChild(Fig.svg('text', {
            x: midX, y: midY - 4, 'text-anchor': 'middle',
            style: `font-size: 10px; font-weight: 800; fill: ${col};`,
            text: rootVal
          }));

          lastX = nextX;
          lastY = nextY;
        }

        const currRoot = steps + 1;
        const valApprox = Math.sqrt(currRoot).toFixed(3);
        group.appendChild(Fig.svg('text', {
          x: 165, y: 190, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? `നിലവിലെ കർണ്ണം = √${currRoot} ≈ ${valApprox}` : `Current Hypotenuse = √${currRoot} ≈ ${valApprox}`
        }));
      }

      draw(3);
      api.body.appendChild(svg);
      api.control({
        min: 1, max: 6, step: 1, value: 3,
        label: 'Spiral Step n',
        format: v => `Hypotenuse: √${v + 1}`,
        onInput: draw
      });
    }
  },

  /* ── Class 9 Chapter 5: Circles (വൃത്തങ്ങൾ) ──────────────────────────────── */

  'fig.circle-theorems': {
    title: 'Inscribed Angle & Semicircle Theorem',
    title_ml: 'കേന്ദ്രകോണും വൃത്തത്തിലെ കോണും (അർദ്ധവൃത്ത കോൺ)',
    caption: 'The inscribed angle $\\angle APB$ is always half of the central angle $\\angle AOB$. When $AB$ is a diameter, the angle is strictly $90^\\circ$.',

    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 200', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(pAngleDeg) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const cx = 165, cy = 100, r = 70;

        group.appendChild(Fig.svg('circle', {
          cx: cx, cy: cy, r: r,
          style: 'fill: none; stroke: var(--ink); stroke-width: 1.5px;'
        }));

        group.appendChild(Fig.svg('circle', { cx: cx, cy: cy, r: 3.5, style: 'fill: var(--ink);' }));
        group.appendChild(Fig.svg('text', { x: cx, y: cy + 15, 'text-anchor': 'middle', style: 'font-size: 10px; font-weight: 700; fill: var(--ink);', text: 'O' }));

        const aRad = (210 * Math.PI) / 180;
        const bRad = (330 * Math.PI) / 180;
        const ax = cx + r * Math.cos(aRad);
        const ay = cy + r * Math.sin(aRad);
        const bx = cx + r * Math.cos(bRad);
        const by = cy + r * Math.sin(bRad);

        const pRad = (pAngleDeg * Math.PI) / 180;
        const px = cx + r * Math.cos(pRad);
        const py = cy - r * Math.sin(pRad);

        group.appendChild(Fig.svg('line', { x1: cx, y1: cy, x2: ax, y2: ay, style: 'stroke: var(--accent); stroke-width: 1.5px;' }));
        group.appendChild(Fig.svg('line', { x1: cx, y1: cy, x2: bx, y2: by, style: 'stroke: var(--accent); stroke-width: 1.5px;' }));

        group.appendChild(Fig.svg('line', { x1: px, y1: py, x2: ax, y2: ay, style: 'stroke: #16a34a; stroke-width: 1.8px;' }));
        group.appendChild(Fig.svg('line', { x1: px, y1: py, x2: bx, y2: by, style: 'stroke: #16a34a; stroke-width: 1.8px;' }));

        group.appendChild(Fig.svg('line', { x1: ax, y1: ay, x2: bx, y2: by, style: 'stroke: var(--muted); stroke-width: 1px; stroke-dasharray: 2,2;' }));

        [ [ax, ay, 'A', 'end', 12], [bx, by, 'B', 'start', 12], [px, py, 'P', 'middle', -8] ].forEach(([x, y, txt, anc, yoff]) => {
          group.appendChild(Fig.svg('circle', { cx: x, cy: y, r: 4, style: 'fill: var(--ink);' }));
          group.appendChild(Fig.svg('text', { x: x, y: y + yoff, 'text-anchor': anc, style: 'font-size: 11px; font-weight: 700; fill: var(--ink);', text: txt }));
        });

        const centralAngle = 120;
        const inscribedAngle = 60;

        group.appendChild(Fig.svg('text', {
          x: cx, y: cy - 10, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--accent);',
          text: `∠AOB = ${centralAngle}°`
        }));

        group.appendChild(Fig.svg('text', {
          x: px, y: py + 18, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: #16a34a;',
          text: `∠APB = ${inscribedAngle}°`
        }));

        group.appendChild(Fig.svg('text', {
          x: 165, y: 192, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? 'സിദ്ധാന്തം: കേന്ദ്രകോൺ (120°) = 2 × വൃത്തത്തിലെ കോൺ (60°)' : 'Theorem: Central Angle (120°) = 2 × Inscribed Angle (60°)'
        }));
      }

      draw(90);
      api.body.appendChild(svg);
      api.control({
        min: 45, max: 135, step: 15, value: 90,
        label: 'Move Vertex P along Arc',
        format: v => 'P Position: ' + v + '°',
        onInput: draw
      });
    }
  },

  'fig.parallel-intercepts-ratio': {

    caption: 'Three parallel lines cut transversals. Adjust the spacing: the ratio of intercepts on transversal 1 ($AB/BC$) remains strictly equal to transversal 2 ($DE/EF$).',

          }));
        });

        const xA = 60, yA = y1;

        const yB = y2;

        group.appendChild(Fig.svg('line', {
          x1: xA - 10, y1: yA - 15, x2: xC + 10, y2: yC + 15,

        }));

        const yE = y2;

        group.appendChild(Fig.svg('line', {
          x1: xD + 10, y1: yD - 15, x2: xF - 10, y2: yF + 15,
          style: 'stroke: #dc2626; stroke-width: 2px;'

        [ [xA, yA, 'A', 'end', -6], [xB, yB, 'B', 'end', 0], [xC, yC, 'C', 'end', 10],

  /* ── Class 9 Chapter 12: Proportion (അനുപാതം) ────────────────────────────── */
  'fig.proportion-direct-inverse': {
    title: 'Direct Proportion (y = 2x) vs Inverse (xy = 12)',
    title_ml: 'നേർ അനുപാതവും (y = 2x) വ്യസ്താനുപാതവും (xy = 12)',
    caption: 'Drag $x$: in direct proportion $y = 2x$ grows linearly through the origin; in inverse proportion $y = 12/x$ decreases as a hyperbola.',
    caption_ml: '$x$ മാറ്റി നോക്കുക: നേർ അനുപാതത്തിൽ $y = 2x$ കൂടുന്നു, വ്യസ്താനുപാതത്തിൽ $y = 12/x$ കുറയുന്നു.',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 190', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(xVal) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const ox = 40, oy = 148;
        const sx = 38, sy = 9.5;

        group.appendChild(Fig.svg('line', {
          x1: ox, y1: oy, x2: ox + 260, y2: oy,
          style: 'stroke: var(--ink); stroke-width: 1.5px;'
        }));
        group.appendChild(Fig.svg('line', {
          x1: ox, y1: oy, x2: ox, y2: oy - 128,
          style: 'stroke: var(--ink); stroke-width: 1.5px;'
        }));

        group.appendChild(Fig.svg('text', { x: ox + 265, y: oy + 4, style: 'font-size: 10px; fill: var(--ink);', text: 'x' }));
        group.appendChild(Fig.svg('text', { x: ox - 4, y: oy - 130, style: 'font-size: 10px; fill: var(--ink); text-anchor: end;', text: 'y' }));

        group.appendChild(Fig.svg('line', {
          x1: ox, y1: oy, x2: ox + 6 * sx, y2: oy - 12 * sy,
          style: 'stroke: #2563eb; stroke-width: 2px;'
        }));

        let curveD = '';
        for (let t = 1; t <= 6.05; t += 0.2) {
          const px = ox + t * sx;
          const py = oy - (12 / t) * sy;
          curveD += (t === 1 ? `M ${px} ${py} ` : `L ${px} ${py} `);
        }
        group.appendChild(Fig.svg('path', {
          d: curveD,
          style: 'fill: none; stroke: #dc2626; stroke-width: 2px;'
        }));

        const yDir = 2 * xVal;
        const yInv = (12 / xVal).toFixed(1);

        const px = ox + xVal * sx;
        const pyDir = oy - yDir * sy;
        const pyInv = oy - parseFloat(yInv) * sy;

        group.appendChild(Fig.svg('line', {
          x1: px, y1: oy, x2: px, y2: Math.min(pyDir, pyInv) - 10,
          style: 'stroke: var(--muted); stroke-width: 1px; stroke-dasharray: 2,2;'
        }));

        group.appendChild(Fig.svg('circle', { cx: px, cy: pyDir, r: 4.5, style: 'fill: #2563eb;' }));
        group.appendChild(Fig.svg('circle', { cx: px, cy: pyInv, r: 4.5, style: 'fill: #dc2626;' }));

        group.appendChild(Fig.svg('text', {
          x: 165, y: 175, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? `x = ${xVal} | നേർ y = 2x = ${yDir} | വ്യസ്ത y = 12/x = ${yInv}` : `x = ${xVal} | Direct y = 2x = ${yDir} | Inverse y = 12/x = ${yInv}`
        }));
      }

      draw(3);
      api.body.appendChild(svg);
      api.control({
        min: 1, max: 6, step: 0.5, value: 3,
        label: 'Value x',
        format: v => `x = ${v}`,
        onInput: draw
      });
    }

  /* ── Class 9 Chapter 13: Statistics (സ്ഥിതിവിവരക്കണക്ക്) ───────────────────── */
  'fig.stat-mean-balance': {
    title: 'Arithmetic Mean as Balance Point',
    title_ml: 'സമാന്തര ശരാശരി തുലാസിന്റെ സന്തുലന ബിന്ദു',
    caption: 'Drag value $x_4$: the arithmetic mean acts as the exact fulcrum where Total Excess above mean equals Total Deficit below mean ($\\sum (x_i - \\bar{x}) = 0$).',
    caption_ml: '$x_4$ മാറ്റി നോക്കുക: ശരാശരി എന്നത് ആകെ കൂടുതലും ആകെ കുറവും തുല്യമായി നിൽക്കുന്ന സന്തുലന ബിന്ദുവാണ് ($\\sum (x_i - \\bar{x}) = 0$).',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 190', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(x4) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const data = [10, 20, 25, x4, 45];
        const sum = data.reduce((a, b) => a + b, 0);
        const mean = sum / data.length;

        const beamY = 100;
        const minVal = 0, maxVal = 60;
        const scale = 250 / (maxVal - minVal);
        const ox = 40;

        group.appendChild(Fig.svg('line', {
          x1: ox, y1: beamY, x2: ox + 250, y2: beamY,
          style: 'stroke: var(--ink); stroke-width: 4px; stroke-linecap: round;'
        }));

        const fx = ox + (mean - minVal) * scale;
        group.appendChild(Fig.svg('polygon', {
          points: `${fx},${beamY} ${fx - 12},${beamY + 24} ${fx + 12},${beamY + 24}`,
          style: 'fill: #2563eb; stroke: #1d4ed8; stroke-width: 1.5px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: fx, y: beamY + 36, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: #2563eb;',
          text: isMl ? `ശരാശരി x̄ = ${mean.toFixed(1)}` : `Mean x̄ = ${mean.toFixed(1)}`
        }));

        let totalExcess = 0;
        let totalDeficit = 0;
        data.forEach((val, idx) => {
          const px = ox + (val - minVal) * scale;
          const isSelected = (idx === 3);
          group.appendChild(Fig.svg('circle', {
            cx: px, cy: beamY - 8, r: isSelected ? 6.5 : 5,
            style: `fill: ${isSelected ? '#dc2626' : 'var(--accent)'}; stroke: var(--ink); stroke-width: 1px;`
          }));
          group.appendChild(Fig.svg('text', {
            x: px, y: beamY - 18, 'text-anchor': 'middle',
            style: 'font-size: 9px; font-weight: 700; fill: var(--ink);',
            text: val
          }));
          const dev = val - mean;
          if (dev > 0) totalExcess += dev;
          else totalDeficit += Math.abs(dev);
        });

        group.appendChild(Fig.svg('text', {
          x: 165, y: 175, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? `കൂടുതൽ = +${totalExcess.toFixed(1)} · കുറവ് = -${totalDeficit.toFixed(1)} · തുക = 0` : `Total Excess = +${totalExcess.toFixed(1)} · Total Deficit = -${totalDeficit.toFixed(1)} · Sum = 0`
        }));
      }

      draw(35);
      api.body.appendChild(svg);
      api.control({
        min: 15, max: 55, step: 5, value: 35,
        label: 'Value x₄',
        format: v => `x₄ = ${v}`,
        onInput: draw
      });
    }
  },

  /* ── Class 10 Chapter 1: Arithmetic Sequences (സമാന്തരശ്രേണികൾ) ────────────── */
  'fig.arithmetic-sequence': {
    title: 'Arithmetic Sequence Ladder and Term Sum',
    title_ml: 'സമാന്തരശ്രേണിയുടെ ഗോവണിയും തുകയും',
    caption: 'Drag $n$: each step increases by common difference $d = 3$; pairing terms from ends ($x_1 + x_n = x_2 + x_{n-1}$) demonstrates Gauss’s formula $S_n = \\frac{n}{2}(x_1 + x_n)$.',
    caption_ml: 'പദങ്ങളുടെ എണ്ണം $n$ മാറ്റി നോക്കുക: ഓരോ പടിയും $d = 3$ നിരക്കിൽ ഉയരുന്നു; ഇരുവശങ്ങളിൽ നിന്നും പദങ്ങൾ ജോഡികളാക്കി തുക $S_n$ കണ്ടെത്തുന്നത് കാണുക.',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 190', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      function draw(n) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const a = 4, d = 3;
        const barW = Math.min(28, 240 / n);
        const startX = 165 - (n * barW) / 2;
        const baseY = 145;

        let terms = [];
        for (let i = 0; i < n; i++) {
          const val = a + i * d;
          terms.push(val);
          const barH = val * 3.5;
          const bx = startX + i * barW;
          const by = baseY - barH;

          group.appendChild(Fig.svg('rect', {
            x: bx + 2, y: by, width: barW - 4, height: barH,
            style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5px;',
            rx: 2
          }));

          group.appendChild(Fig.svg('text', {
            x: bx + barW / 2, y: by - 4, 'text-anchor': 'middle',
            style: 'font-size: 10px; font-weight: 700; fill: var(--ink);',
            text: val
          }));

          group.appendChild(Fig.svg('text', {
            x: bx + barW / 2, y: baseY + 14, 'text-anchor': 'middle',
            style: 'font-size: 9px; fill: var(--text-muted);',
            text: `x${i + 1}`
          }));
        }

        const pairSum = terms[0] + terms[n - 1];
        const totalSum = (n / 2) * pairSum;

        const xFirst = startX + barW / 2;
        const xLast = startX + (n - 1) * barW + barW / 2;
        group.appendChild(Fig.svg('path', {
          d: `M ${xFirst} 28 Q ${(xFirst + xLast) / 2} 10 ${xLast} 28`,
          style: 'fill: none; stroke: #dc2626; stroke-width: 1.5px; stroke-dasharray: 3,3;'
        }));
        group.appendChild(Fig.svg('text', {
          x: (xFirst + xLast) / 2, y: 16, 'text-anchor': 'middle',
          style: 'font-size: 10px; font-weight: 700; fill: #dc2626;',
          text: `x₁ + xₙ = ${terms[0]} + ${terms[n-1]} = ${pairSum}`
        }));

        group.appendChild(Fig.svg('text', {
          x: 165, y: 178, 'text-anchor': 'middle',
          style: 'font-size: 11px; font-weight: 700; fill: var(--ink);',
          text: isMl ? `ആകെ തുക S${n} = (${n}/2) × ${pairSum} = ${totalSum}` : `Total Sum S${n} = (${n}/2) × ${pairSum} = ${totalSum}`
        }));
      }

      draw(5);
      api.body.appendChild(svg);
      api.control({
        min: 3, max: 7, step: 1, value: 5,
        label: 'Terms n',
        format: v => `n = ${v}`,
        onInput: draw
      });
    }
  }
};

/* ── src/comp.figure.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Figure engine.

   Two kinds of figure now, and they are complementary rather than rivals:

     drawn      hand-built inline SVG (fig.library.js). Inherits the theme,
                scales to any width, animates, and a few take a control so the
                learner can move the parameter that matters (ε, or the window).
     rendered   the light/dark PNG pairs in `diagrams/`, indexed by concept in
                fig.diagrams.js. There are dozens of them and the app used to
                show none — a result with a picture sitting in the repository
                and nothing on screen is the worst of both.

   A concept shows its drawn figures first, then its rendered ones. Nothing is
   duplicated: where a drawn figure already exists for a result, the rendered
   one is still offered below it, because they show different things (the drawn
   figure is interactive, the rendered one is the finished diagram).

   This file is the plumbing — coordinate mapping, the frame, the controls, and
   the theme swap on a rendered diagram.
   ══════════════════════════════════════════════════════════════════════════ */

const Fig = (function () {

  const el = DOM.el;
  const s = DOM.svg;

  /* A plot area inside a viewBox: maths coordinates in, pixels out. */
  function plot(opts) {
    const o = Object.assign({ w: 330, h: 190, pad: 20, xr: [0, 1], yr: [0, 1] }, opts);
    const l = o.padL == null ? o.pad : o.padL;
    const b = o.padB == null ? o.pad : o.padB;
    const t = o.padT == null ? o.pad : o.padT;
    const r = o.padR == null ? o.pad : o.padR;
    const X = x => l + (x - o.xr[0]) / (o.xr[1] - o.xr[0]) * (o.w - l - r);
    const Y = y => (o.h - b) - (y - o.yr[0]) / (o.yr[1] - o.yr[0]) * (o.h - t - b);

    /* sampled path of a function, clipped to the y range */
    function curve(fn, from, to, steps) {
      const n = steps || 90;
      const a = from == null ? o.xr[0] : from;
      const z = to == null ? o.xr[1] : to;
      let d = '', pen = false;
      for (let i = 0; i <= n; i++) {
        const x = a + (z - a) * i / n;
        const y = fn(x);
        if (!isFinite(y) || y < o.yr[0] - 1e-9 || y > o.yr[1] + 1e-9) { pen = false; continue; }
        d += (pen ? 'L' : 'M') + X(x).toFixed(1) + ' ' + Y(y).toFixed(1) + ' ';
        pen = true;
      }
      return d.trim();
    }

    const svg = s('svg', {
      viewBox: '0 0 ' + o.w + ' ' + o.h, role: 'img',
      preserveAspectRatio: 'xMidYMid meet'
    });

    return {
      svg: svg, X: X, Y: Y, tx: X, ty: Y, curve: curve, box: o,
      add(...kids) { kids.forEach(k => k && svg.appendChild(k)); return this; },
      /* axes with optional tick labels */
      axes(opts2) {
        const a = opts2 || {};
        const y0 = a.y0 == null ? o.yr[0] : a.y0;
        this.add(s('line', { class: 'axis', x1: X(o.xr[0]), y1: Y(y0), x2: X(o.xr[1]), y2: Y(y0) }));
        if (a.yAxis !== false) {
          this.add(s('line', { class: 'axis', x1: X(a.x0 == null ? o.xr[0] : a.x0), y1: Y(o.yr[0]),
            x2: X(a.x0 == null ? o.xr[0] : a.x0), y2: Y(o.yr[1]) }));
        }
        (a.ticks || []).forEach(function (tk) {
          svg.appendChild(s('line', { class: 'axis', x1: X(tk.x), y1: Y(y0) - 3, x2: X(tk.x), y2: Y(y0) + 3 }));
          svg.appendChild(s('text', { x: X(tk.x), y: Y(y0) + 15, 'text-anchor': 'middle', text: tk.t }));
        });
        return this;
      },
      label(x, y, text, cls, anchor) {
        this.add(s('text', { x: X(x), y: Y(y), class: cls || '', text: text,
          'text-anchor': anchor || 'middle' }));
        return this;
      },
      dot(x, y, cls, r2) {
        const c = s('circle', { cx: X(x), cy: Y(y), r: r2 || 3.6, class: 'pt ' + (cls || '') });
        this.add(c);
        return c;
      },
      line(x1, y1, x2, y2, cls) {
        const n = s('line', { x1: X(x1), y1: Y(y1), x2: X(x2), y2: Y(y2), class: cls || 'guide' });
        this.add(n);
        return n;
      },
      rect(x1, y1, x2, y2, cls) {
        const n = s('rect', { x: Math.min(X(x1), X(x2)), y: Math.min(Y(y1), Y(y2)),
          width: Math.abs(X(x2) - X(x1)), height: Math.abs(Y(y2) - Y(y1)), class: cls || 'band' });
        this.add(n);
        return n;
      },
      path(d, cls) {
        const n = s('path', { d: d, class: cls || 'curve' });
        this.add(n);
        return n;
      },
      /* stroke-draw entrance for a path */
      draw(node) {
        if (DOM.reduced() || !node.getTotalLength) return node;
        try {
          const len = Math.ceil(node.getTotalLength());
          node.style.setProperty('--len', len);
          node.classList.add('draw');
        } catch (e) { /* not yet in the document — skip the flourish */ }
        return node;
      }
    };
  }

  /* The frame: title, the drawing, an optional control, a caption. */
  function frame(def, opts) {
    const host = el('figure', { class: 'fig', style: { margin: 0 } });
    const body = el('div', {});
    const ctl = el('div', {});
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

    const titleText = typeof I18N !== 'undefined' ? I18N.pick(def, 'title') : def.title;
    const capText = typeof I18N !== 'undefined' ? I18N.pick(def, 'caption') : def.caption;

    host.appendChild(el('div', { class: 'fig-h' }, [
      el('span', { class: 'kicker', text: titleText }),
      def.interactive ? el('span', { class: 'badge accent', text: isMl ? 'മാറ്റി നോക്കുക' : 'drag it' }) : null
    ]));
    host.appendChild(body);
    host.appendChild(ctl);
    if (capText) {
      host.appendChild(el('figcaption', { class: 'fig-cap', html: capText }));
    }

    const api = {
      body: body,
      /* a labelled range control; onInput gets the numeric value */
      control(spec) {
        const input = el('input', {
          type: 'range', min: spec.min, max: spec.max, step: spec.step,
          value: spec.value, 'aria-label': spec.label
        });
        const out = el('label', { text: spec.format(Number(spec.value)) });
        input.addEventListener('input', function () {
          const v = Number(input.value);
          out.textContent = spec.format(v);
          spec.onInput(v);
        });
        DOM.clear(ctl);
        ctl.appendChild(el('div', { class: 'fig-ctl' }, [input, out]));
        return input;
      }
    };

    try {
      def.build(api, opts || {});
    } catch (err) {
      console.error('Figure build error:', err);
    }
    return host;
  }

  /* ── rendered diagrams ────────────────────────────────────────────────── */
  const base = () => (typeof DIAGRAM_BASE !== 'undefined' ? DIAGRAM_BASE : 'diagrams/');

  const prettyTitle = b => b
    .replace(/^c\.[0-9.]+[a-z]?_/, '')
    .replace(/_/g, ' ')
    .replace(/^./, ch => ch.toUpperCase());

  function renderedFrame(basename, caption) {
    const light = base() + 'light/' + basename + '.png';
    const dark = base() + 'dark/' + basename + '.png';

    const img = el('img', {
      src: light, alt: caption || prettyTitle(basename),
      loading: 'lazy', decoding: 'async', class: 'fig-img'
    });

    /* One <img> whose src follows the theme. A <picture> with a
       prefers-color-scheme <source> was the obvious answer and is the wrong
       one: it can only see the OS setting, and this app has three theme
       settings of its own. So the swap watches the same `data-theme` attribute
       every other themed thing here reads. */
    function paint() {
      const wantDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const next = wantDark ? dark : light;
      if (img.getAttribute('src') !== next) img.setAttribute('src', next);
    }
    paint();
    if (window.MutationObserver) {
      const mo = new MutationObserver(paint);
      mo.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    }

    return el('figure', { class: 'fig fig-rendered', style: { margin: 0 } }, [
      el('div', { class: 'fig-h' }, [
        el('span', { class: 'kicker', text: prettyTitle(basename) }),
        el('span', { class: 'badge', text: 'diagram' })
      ]),
      el('div', { class: 'fig-imgwrap' }, [img])
    ]);
  }

  /* Which rendered diagrams belong to this concept. A concept may name them
     itself with `img: [...]`; otherwise the generated index answers by id. */
  function imagesFor(concept) {
    if (!concept) return [];
    if (concept.img && concept.img.length) {
      return Array.isArray(concept.img) ? concept.img : [concept.img];
    }
    return (typeof DIAGRAM_MAP !== 'undefined' && DIAGRAM_MAP[concept.id]) || [];
  }

  /* Mount every figure attached to a concept. Data may carry `figs: [id]`;
     the app's own map is the fallback while the pool is mock. */
  function forConcept(concept) {
    if (!concept) return [];
    const ids = (concept.figs && concept.figs.length)
      ? concept.figs
      : (FIGMAP[concept.id] || []);
    return ids.map(id => FIGLIB[id] ? { id: id, def: FIGLIB[id] } : null).filter(Boolean);
  }

  function mount(concept) {
    const figs = forConcept(concept);
    const imgs = imagesFor(concept);
    if (!figs.length && !imgs.length) return null;
    return el('div', { class: 'stack', style: { gap: '12px' } },
      figs.map(f => frame(f.def)).concat(imgs.map(b => renderedFrame(b))));
  }

  return { plot: plot, frame: frame, mount: mount, forConcept: forConcept,
    imagesFor: imagesFor, renderedFrame: renderedFrame, svg: s };
})();


/* ── src/comp.tree.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The syllabus tree — and, since Level 4, the reader as well.

   Course → module → section → concept, each row carrying a tick you can press
   and a ring showing how much of what is underneath is done. Opening a concept
   no longer leaves for a page of its own: the note unfolds in place, and its
   proof, its exercises and its questions unfold inside that. One scroll, from
   the course title to the last exercise.

   EXACTLY ONE THING IS OPEN AT EACH DEPTH. Opening a section closes the
   section that was open; opening a note closes the note that was open. The
   tree is a place you are, not a pile you have accumulated — which is the only
   way a three-deep tree of two hundred concepts stays navigable on a phone.
   That single open path is stored, so closing the app and coming back lands
   you where you left off (see `scrollToOpen`).

   Colour is the whole vocabulary. A row is RED once everything under it has
   been read, AMBER once every section exercise under it is worked, GREEN once
   the course's past exam papers are worked through too (core.progress.js).
   ══════════════════════════════════════════════════════════════════════════ */

const Tree = (function () {

  const el = DOM.el;
  const KEY = 'open4';
  const LEGACY = 'open';
  const DEPTH = ['course', 'mod', 'sec', 'concept'];

  /* ── the one open path ────────────────────────────────────────────────── */
  function readPath() {
    const p = Store.pref(KEY, null);
    if (p && typeof p === 'object') return p;

    /* Levels 1–3 stored a map of every open id. Keep the first of each kind
       so an upgrade lands somewhere familiar rather than fully collapsed. */
    const old = Store.pref(LEGACY, null);
    if (!old || typeof old !== 'object') return null;
    const out = {};
    Object.keys(old).forEach(function (k) {
      if (k.indexOf('course-') === 0 && !out.course) out.course = k.slice(7);
      else if (k.indexOf('mod-') === 0 && !out.mod) out.mod = k.slice(4);
      else if (k.indexOf('sec-') === 0 && !out.sec) out.sec = k.slice(4);
    });
    Store.setPref(KEY, out);
    return out;
  }

  let openPath = null;
  const path = () => (openPath || (openPath = readPath() || {}));
  function savePath(p) {
    openPath = p;
    Store.setPref(KEY, p);
  }

  /* Setting a slot clears everything deeper than it: opening a different
     section cannot leave the previous section's note hanging open. */
  function setSlot(kind, id, on) {
    const p = Object.assign({}, path());
    const i = DEPTH.indexOf(kind);
    p[kind] = on ? id : null;
    if (kind === 'pyq') { if (on) { p.mod = null; p.sec = null; p.concept = null; } }
    else {
      p.pyq = null;
      DEPTH.slice(i + 1).forEach(function (k) { p[k] = null; });
    }
    savePath(p);
  }

  const isOpen = (kind, id) => path()[kind] === id;

  /* ── in-place mark repainting ────────────────────────────────────────────
     A tick pressed inside an open note must not rebuild the tree — that would
     tear the note out from under the person using it. So every row registers
     how to repaint its own tick and ring, and a change just runs the list. */
  let marks = [];
  const registerMark = fn => { marks.push(fn); fn(); };
  function refresh() {
    Progress.dropCache();
    marks.forEach(function (fn) { try { fn(); } catch (e) { /* never break a repaint */ } });
  }

  /* ── pieces ───────────────────────────────────────────────────────────── */

  function tickButton(getState, onPress) {
    const btn = el('button', { class: 'tick', type: 'button', role: 'checkbox' },
      [el('i', { 'aria-hidden': 'true' })]);
    registerMark(function () {
      const s = getState();
      btn.setAttribute('aria-checked', s.state);
      btn.setAttribute('data-lv', String(s.lv || 0));
      btn.setAttribute('aria-label', s.label);
      const i = btn.firstChild;
      DOM.clear(i);
      i.appendChild(DOM.mi(
        s.state === 'mixed' ? 'remove' : s.lv >= 4 ? 'military_tech' : s.lv >= 3 ? 'workspace_premium' : 'check',
        'xs'));
    });
    btn.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); onPress(); });
    return btn;
  }

  const staticTick = glyph => el('span', { class: 'tick', 'aria-hidden': 'true' },
    [el('i', { style: { borderStyle: 'dashed' } }, [DOM.mi(glyph, 'xs')])]);

  /* A ring that repaints itself in place. */
  function ring(getCount, label) {
    const host = el('span', { class: 'ringhost' });
    registerMark(function () {
      DOM.clear(host);
      host.appendChild(UI.levelRing(getCount(), label));
    });
    return host;
  }

  let ctxOpenAccs = new Set();
  let isInitialPaint = true;

  function accordion(nid, open, kids, ctx) {
    const inner = el('div', { class: 'acc-in' }, [el('div', { class: 'acc-pad' }, kids)]);
    const acc = el('div', { class: 'acc', id: 'acc-' + nid }, [inner]);
    if (open) {
      const wasOpen = ctx && ctx.wasOpen ? ctx.wasOpen('acc-' + nid) : ctxOpenAccs.has('acc-' + nid);
      const isInit = ctx && typeof ctx.isInitial === 'boolean' ? ctx.isInitial : isInitialPaint;
      if (wasOpen || isInit || DOM.reduced()) {
        acc.classList.add('open');
      } else {
        window.requestAnimationFrame(() => acc.classList.add('open'));
      }
    }
    return acc;
  }

  function toggler(nid, open, kids, onToggle) {
    const btn = el('button', {
      class: 'tlabel', type: 'button',
      'aria-expanded': String(open), 'aria-controls': 'acc-' + nid
    }, kids);
    btn.addEventListener('click', function () { onToggle(!open); });
    return btn;
  }

  /* ── the cascade offer ────────────────────────────────────────────────── */
  function offerCascade(c) {
    const pending = Progress.pendingPrereqs(c.id);
    if (!pending.length) return;
    const names = pending.slice(0, 5).map(x => '· ' + x.title).join('\n') +
      (pending.length > 5 ? '\n· and ' + (pending.length - 5) + ' more' : '');
    const ask = isMlC()
      ? ('"' + c.title + '"-ന്റെ ' + pending.length + ' അടിസ്ഥാന ആശയങ്ങൾ ഇതുവരെ വായിച്ചിട്ടില്ല:\n\n' + names + '\n\nഅവയും വായിച്ചതായി അടയാളപ്പെടുത്തണോ?')
      : (pending.length + ' ' + DOM.plural(pending.length, 'prerequisite') +
        ' of "' + c.title + '" ' + DOM.plural(pending.length, 'has', 'have') +
        ' not been read yet:\n\n' + names + '\n\nMark them as read too?');
    if (!window.confirm(ask)) return;
    const n = Progress.raisePrereqs(c.id);
    DOM.announce(isMlC() ? (n + ' അടിസ്ഥാന ആശയങ്ങൾ വായിച്ചതായി രേഖപ്പെടുത്തി.') : ('Marked ' + n + ' ' + DOM.plural(n, 'prerequisite') + ' as read.'));
  }

  /* ── a concept: one row, and the whole note under it ─────────────────── */
  function conceptRow(c, ctx) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const nid = 'c-' + c.id;
    const open = isOpen('concept', c.id);
    const isExt = Pool.isExt(c);
    const extNote = isExt ? (isMl ? ' (പാഠ്യപദ്ധതിക്ക് പുറത്ത്)' : ' (outside syllabus)') : '';

    /* The row exists before anything that repaints it: a mark closure runs
       the moment it is registered, and a half-built row is a crash. */
    const row = el('div', { class: 'crow' });

    const tick = tickButton(function () {
      const lv = Progress.level(c.id);
      return {
        state: lv >= 1 ? 'true' : 'false', lv: lv,
        label: lv === 0
          ? (isMl ? ('"' + c.title + '" വായിച്ചതായി അടയാളപ്പെടുത്തുക' + extNote) : ('Mark "' + c.title + '" as read' + extNote))
          : (isMl ? ('"' + c.title + '" വായിച്ചു എന്ന അടയാളം മാറ്റുക') : ('Clear the read tick on "' + c.title + '"'))
      };
    }, function () {
      const was = Progress.level(c.id);
      Progress.advance(c.id);
      if (was === 0) offerCascade(c);
      refresh();
    });

    const tag = el('span', { class: 'lvtags' });
    registerMark(function () {
      const lv = Progress.level(c.id);
      DOM.clear(tag);
      if (lv === 1 && Progress.secTaskState(c.sec).total) {
        tag.appendChild(el('span', { class: 'lvtag', 'data-lv': '1', text: (typeof I18N !== 'undefined') ? I18N.t('exercises_owed') : 'exercises owed' }));
      } else if (lv >= 2) {
        tag.appendChild(el('span', { class: 'lvtag', 'data-lv': String(lv), text: 'L' + lv }));
      }
      row.setAttribute('data-lv', String(lv));
    });

    const body = open ? NoteBody.build(c, {
      onChange: refresh,
      onComplete: function (next) {
        if (next) revealPath(next.id);
        else setSlot('concept', c.id, false);
        ctx.repaint({ scroll: !!next, isNote: !!next });
      }
    }) : null;

    const acc = accordion(nid, open, body ? [body] : [], ctx);

    const kindLabel = (typeof I18N !== 'undefined') ? I18N.kind(c.kind) : c.kind;

    const label = toggler(nid, open, [
      el('span', { class: 'tt' }, [
        el('b', {}, [
          el('span', { text: c.title }),
          isExt ? el('span', { class: 'badge warn', text: isMl ? 'പാഠ്യപദ്ധതിക്ക് പുറത്ത്' : 'outside syllabus' }) : null
        ]),
        el('span', { text: kindLabel + ' · ' + c.oneLine })
      ]),
      tag,
      DOM.icon('chev', 18, 'chev')
    ], function (on) {
      setSlot('concept', c.id, on);
      ctx.repaint({ scroll: on, isNote: true });
    });

    DOM.add(row, [tick, label]);
    const node = el('div', { class: 'cnode' + (open ? ' open' : ''), 'data-cid': c.id }, [row, acc]);
    if (open) ctx.target = node;
    return node;
  }

  /* ── a section ────────────────────────────────────────────────────────── */
  function sectionNode(s, ctx) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const ids = s.concepts.map(c => c.id);
    const nid = 'sec-' + s.sec;
    const open = isOpen('sec', s.sec);
    const isExt = Pool.isExtSec(s.sec);
    const tasks = Progress.secTaskState(s.sec);

    const acc = accordion(nid, open, open
      ? (s.concepts.length
        ? [el('div', { class: 'stack', style: { gap: '6px' } }, s.concepts.map(c => conceptRow(c, ctx)))]
        : [el('p', { class: 'small muted', style: { margin: '4px 2px' },
            text: isMl ? 'ഈ ഭാഗത്തിൽ ആശയങ്ങൾ ഉൾപ്പെടുത്തിയിട്ടില്ല.' : 'No concepts loaded for this section yet.' })])
      : [], ctx);

    const conceptsWord = isMl ? 'ആശയങ്ങൾ' : DOM.plural(s.concepts.length, 'concept');
    const exercisesWord = (typeof I18N !== 'undefined') ? I18N.t('exercises_lc') : 'exercises';

    const node = el('div', { class: 'tnode sub sec' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const cnt = Progress.count(ids);
          return { state: Progress.tickState(ids), lv: cnt.min,
            label: isMl
              ? ('§' + s.sec + ' മുഴുവൻ മുന്നോട്ട് കൊണ്ടുപോകുക' + (isExt ? ' (പാഠ്യപദ്ധതിക്ക് പുറത്ത്)' : ''))
              : ('Advance all of §' + s.sec + (isExt ? ' (outside syllabus)' : '')) };
        }, function () {
          const to = Progress.advanceMany(ids);
          DOM.announce(to ? (isMl ? ('ഭാഗം ലെവൽ ' + to + ' ആയി.') : ('Section at level ' + to + '.')) : (isMl ? 'ഭാഗം ഒഴിവാക്കി.' : 'Section cleared.'));
          refresh();
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: '§' + s.sec + '  ' + s.title }),
              isExt ? el('span', { class: 'badge warn', text: isMl ? 'പാഠ്യപദ്ധതിക്ക് പുറത്ത്' : 'outside syllabus' }) : null
            ]),
            el('span', { text: s.concepts.length + ' ' + conceptsWord +
              (tasks.total ? ' · ' + tasks.done + '/' + tasks.total + ' ' + exercisesWord : '') +
              (isExt ? (isMl ? ' · പാഠ്യപദ്ധതിക്ക് പുറത്ത്' : ' · outside syllabus') : '') })
          ]),
          ring(() => Progress.count(ids), '§' + s.sec),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('sec', s.sec, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── a module ─────────────────────────────────────────────────────────── */
  function moduleNode(course, mod, ctx) {
    if (mod.pending) return pendingNode(mod, ctx);

    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const secs = Pool.sections(course.id).filter(s => (mod.secs || []).indexOf(s.sec) >= 0);
    const isExtMod = !!mod.ext;
    const countSecs = isExtMod ? secs : secs.filter(s => !Pool.isExtSec(s.sec));
    const ids = countSecs.reduce((acc, s) => acc.concat(s.concepts.map(c => c.id)), []);
    const nid = 'mod-' + mod.id;
    const open = isOpen('mod', mod.id);

    const extCount = secs.filter(s => Pool.isExtSec(s.sec)).length;
    const secsWord = isMl ? 'ഭാഗങ്ങൾ' : DOM.plural(countSecs.length, 'section');
    const marksWord = isMl ? 'മാർക്ക്' : 'marks';

    const subtitleText = isExtMod
      ? (secs.length + ' ' + secsWord + (isMl ? ' · പാഠ്യപദ്ധതിക്ക് പുറത്ത്' : ' · outside syllabus'))
      : ((mod.marks ? mod.marks + ' ' + marksWord + ' · ' : '') +
         countSecs.length + ' ' + secsWord +
         (extCount ? (isMl ? ' (+' + extCount + ' പുറത്ത്)' : ' (+' + extCount + ' outside syllabus)') : ''));

    const modPrefix = isExtMod || mod.n === '+' || mod.n === 'Ext'
      ? (isMl ? 'അധികഭാഗം' : 'Extension')
      : (mod.n && mod.n.indexOf('E') === 0 ? ((isMl ? 'വിഷയം ' : 'Topic ') + mod.n) : ((isMl ? 'അദ്ധ്യായം ' : 'Module ') + mod.n));
    const modHeading = modPrefix + ' · ' + mod.title;

    const acc = accordion(nid, open, open
      ? [el('div', {}, secs.map(s => sectionNode(s, ctx)))] : [], ctx);

    const node = el('div', { class: 'tnode' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const cnt = Progress.count(ids);
          return { state: Progress.tickState(ids), lv: cnt.min,
            label: isMl
              ? (mod.title + '-ലെ എല്ലാ ആശയങ്ങളും മുന്നോട്ട് കൊണ്ടുപോകുക')
              : ('Advance every syllabus note of ' + (isExtMod ? mod.title : 'module ' + mod.n)) };
        }, function () {
          const to = Progress.advanceMany(ids);
          DOM.announce(to ? ((isExtMod ? mod.title : (isMl ? 'അദ്ധ്യായം ' : 'Module ') + mod.n) + (isMl ? (' ലെവൽ ' + to + ' ആയി.') : (' at level ' + to + '.'))) : (isMl ? 'ഒഴിവാക്കി.' : 'Cleared.'));
          refresh();
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: modHeading }),
              isExtMod ? el('span', { class: 'badge warn', text: isMl ? 'പാഠ്യപദ്ധതിക്ക് പുറത്ത്' : 'outside syllabus' }) : null
            ]),
            el('span', { text: subtitleText })
          ]),
          ring(() => Progress.count(ids), isExtMod ? mod.title : (isMl ? 'അദ്ധ്യായം ' : 'Module ') + mod.n),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('mod', mod.id, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  function pendingNode(mod, ctx) {
    const nid = 'pend-' + mod.id;
    const open = isOpen('mod', mod.id);
    const builds = (mod.builds || []).map(function (id) {
      const c = Pool.concept(id);
      return c ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
        : el('span', { class: 'chip ghost', text: id });
    });
    const acc = accordion(nid, open, [el('div', { style: { padding: '0 2px' } }, [
      mod.why ? el('p', { class: 'small muted', style: { margin: '2px 0 8px' }, text: mod.why }) : null,
      builds.length ? el('div', {}, [
        el('div', { class: 'kicker', style: { marginBottom: '6px' }, text: 'Will build on' }),
        el('div', { class: 'row' }, builds)
      ]) : null
    ])], ctx);
    const modHeading = (mod.n && mod.n.indexOf('E') === 0 ? 'Topic ' + mod.n : mod.n) + ' · ' + mod.title;
    return el('div', { class: 'tnode sub sec' }, [
      el('div', { class: 'trow' }, [
        staticTick('hourglass_empty'),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: modHeading }),
              el('span', { class: 'badge warn', text: 'pending' })
            ]),
            el('span', { text: 'not delivered yet' })
          ]),
          DOM.icon('chev', 20, 'chev')
        ], function (on) { setSlot('mod', mod.id, on); ctx.repaint({ scroll: false }); })
      ]),
      acc
    ]);
  }

  /* ── level 3: the course's past papers ───────────────────────────────────
     A past-paper question is set on the whole year, not on one section, so it
     cannot hang off a note. It hangs off the COURSE — a sibling of the
     chapters, and the last thing between an amber course and a green one. */
  const isMlC = () => (typeof I18N !== 'undefined') && I18N.lang() === 'ml';

  function pyqNode(course, ctx) {
    const qs = Pool.pyq(course.id);
    const nid = 'pyq-' + course.id;
    const open = isOpen('pyq', course.id);

    if (!qs.length) {
      return el('div', { class: 'tnode sub sec' }, [
        el('div', { class: 'trow' }, [
          staticTick('hourglass_empty'),
          el('span', { class: 'tlabel', style: { cursor: 'default' } }, [
            el('span', { class: 'tt' }, [
              el('b', { text: (typeof I18N !== 'undefined') ? I18N.t('past_papers') : 'Past exam papers' }),
              el('span', { text: (typeof I18N !== 'undefined' && I18N.lang() === 'ml') ? ('ലഭ്യമായിട്ടില്ല · ലെവൽ 3: ' + course.title) : ('not delivered yet · level 3 of ' + course.title) })
            ]),
            el('span', { class: 'badge warn', text: (typeof I18N !== 'undefined') ? I18N.t('pending') : 'pending' })
          ])
        ])
      ]);
    }

    /* grouped by paper, newest first — Pool already sorted them that way */
    function years() {
      const seen = [], by = {};
      qs.forEach(function (q) {
        const k = (q.year || '—') + (q.paper ? ' ' + q.paper : '');
        if (!by[k]) { by[k] = []; seen.push(k); }
        by[k].push(q);
      });
      return seen.map(k => ({ label: k, list: by[k] }));
    }

    function questionCard(q) {
      const mark = el('span', { class: 'ix' });
      function paintMark() {
        const on = Progress.pyqDone(q);
        mark.className = 'ix' + (on ? ' ok' : '');
        DOM.clear(mark);
        mark.appendChild(DOM.mi(on ? 'check' : 'radio_button_unchecked', 'xs'));
      }
      paintMark();

      return NoteBody.expander({
        cls: 'exp-q',
        mark: mark,
        title: (q.exam || 'PYQ') + ' ' + (q.year || '') + (q.qno ? ' · Q' + q.qno : ''),
        sub: (q.marks ? I18N.marks(q.marks) : '')
          + (q.title ? ' · ' + q.title : ''),
        build: function () {
          /* quick OMR past question: once locked, marks p:id done and reveals full answer */
          if (q.options || q.type === 'MCQ' || q.type === 'MSQ' || q.type === 'NAT') {
            return [
              QuestionCard.build(q, {
                inNote: true,
                onLocked: function () {
                  Store.setProofDone('p:' + q.id, true);
                  paintMark();
                  refresh();
                }
              }),
              NoteBody.taskRow('p:' + q.id, { noun: 'question', onTick: function () {
                paintMark(); refresh();
              } })
            ];
          }

          const answerHost = el('div', { class: 'prose tight', style: { marginTop: '8px' }, hidden: true });
          let built = false;
          const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
            [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: I18N.t('show_answer') })]);
          showBtn.addEventListener('click', function () {
            const on = answerHost.hidden;
            if (on && !built) {
              built = true;
              DOM.add(answerHost, [
                q.approach ? el('div', { html: q.approach }) : null,
                q.solution ? el('div', { html: q.solution }) : null,
                q.trap ? el('p', {}, [el('b', { text: I18N.t('trap') }), el('span', { html: q.trap })]) : null
              ]);
              UI.math(answerHost);
            }
            answerHost.hidden = !on;
            showBtn.setAttribute('aria-expanded', String(on));
            showBtn.querySelector('.lb').textContent = on ? I18N.t('hide_answer') : I18N.t('show_answer');
          });

          return [
            el('div', { class: 'prose tight', html: q.prompt }),
            el('div', { class: 'row', style: { gap: '8px', marginTop: '10px' } }, [showBtn]),
            answerHost,
            NoteBody.taskRow('p:' + q.id, { noun: 'question', onTick: function () {
              paintMark(); refresh();
            } })
          ];
        }
      });
    }

    const acc = accordion(nid, open, open ? [el('div', { class: 'stack', style: { gap: '10px' } },
      years().map(function (grp) {
        return el('div', { class: 'stack', style: { gap: '6px' } }, [
          el('div', { class: 'kicker', text: grp.label }),
          el('div', { class: 'stack', style: { gap: '6px' } }, grp.list.map(questionCard))
        ]);
      }))] : [], ctx);

    const count = el('span', { class: 'count' });
    registerMark(function () {
      const st = Progress.pyqState(course.id);
      count.textContent = st.done + ' / ' + st.total;
    });

    const node = el('div', { class: 'tnode sub sec pyq' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        tickButton(function () {
          const st = Progress.pyqState(course.id);
          return {
            state: st.ready ? 'true' : (st.done ? 'mixed' : 'false'),
            lv: st.ready ? 4 : 0,
            label: st.ready
              ? (isMlC() ? course.title + '-ന്റെ എല്ലാ മുൻവർഷ ചോദ്യങ്ങളും പൂർത്തിയായി' : 'Every past paper of ' + course.title + ' is complete')
              : (isMlC() ? course.title + '-ന്റെ എല്ലാ മുൻവർഷ ചോദ്യങ്ങളും പൂർത്തിയായതായി അടയാളപ്പെടുത്തുക' : 'Mark every past paper of ' + course.title + ' complete')
          };
        }, function () {
          const st = Progress.pyqState(course.id);
          const want = !st.ready;
          st.list.forEach(q => Store.setProofDone('p:' + q.id, want));
          Progress.dropCache();
          DOM.announce(want ? (isMlC() ? 'എല്ലാ മുൻവർഷ ചോദ്യങ്ങളും പൂർത്തിയായതായി രേഖപ്പെടുത്തി.' : 'Every past paper marked complete.') : (isMlC() ? 'മുൻവർഷ ചോദ്യങ്ങളുടെ അടയാളം മാറ്റി.' : 'Past papers cleared.'));
          ctx.repaint({});
        }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', { text: (typeof I18N !== 'undefined') ? I18N.t('past_papers') : 'Past exam papers' }),
            el('span', { text: (typeof I18N !== 'undefined' && I18N.lang() === 'ml') ? (qs.length + ' ചോദ്യങ്ങൾ · ഇവ പൂർത്തിയാക്കിയാൽ ലെവൽ 3') : (qs.length + ' ' + DOM.plural(qs.length, 'question') + ' · finishing them is level 3') })
          ]),
          count,
          DOM.icon('chev', 20, 'chev')
        ], function (on) { setSlot('pyq', course.id, on); ctx.repaint({ scroll: false }); })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── a whole course ──────────────────────────────────────────────────── */
  function courseNode(course, ctx) {
    const ids = Pool.ids.concepts(course.id);
    const nid = 'course-' + course.id;
    const open = isOpen('course', course.id);

    const acc = accordion(nid, open, open ? [el('div', { class: 'rail' },
      (course.modules || []).map(mod => moduleNode(course, mod, ctx))
        .concat(course.pending || course.id === 'foundation' ? [] : [pyqNode(course, ctx)]))] : [], ctx);

    const node = el('div', { class: 'tnode' + (open ? ' open' : '') }, [
      el('div', { class: 'trow' }, [
        course.pending
          ? staticTick('hourglass_empty')
          : tickButton(function () {
              const lv = Progress.courseLevel(course.id);
              return { state: Progress.tickState(ids), lv: lv,
                label: (isMlC() ? course.title + '-ലെ എല്ലാ കുറിപ്പുകളും വായിച്ചതായി അടയാളപ്പെടുത്തുക' : 'Mark every note of ' + course.title + ' as read') };
            }, function () {
              const to = Progress.advanceMany(ids);
              DOM.announce(to ? course.title + (isMlC() ? ' ലെവൽ ' + to + ' ആയി.' : ' at level ' + to + '.') : (isMlC() ? 'കോഴ്സിന്റെ അടയാളങ്ങൾ മാറ്റി.' : 'Course cleared.'));
              refresh();
            }),
        toggler(nid, open, [
          el('span', { class: 'tt' }, [
            el('b', {}, [
              el('span', { text: course.title }),
              course.pending ? el('span', { class: 'badge warn', text: I18N.t('pending') }) : null
            ]),
            el('span', { text: course.pending ? course.blurb : course.code + ' · ' + course.blurb })
          ]),
          course.pending ? null : ring(() => Progress.count(ids), course.title),
          DOM.icon('chev', 20, 'chev')
        ], function (on) {
          setSlot('course', course.id, on);
          ctx.repaint({ scroll: false });
        })
      ]),
      acc
    ]);
    if (open && !ctx.target) ctx.target = node;
    return node;
  }

  /* ── mounting ─────────────────────────────────────────────────────────── */
  function painter(host, build) {
    let isInitial = true;

    function repaint(opts) {
      const o = opts || {};
      const keepY = window.scrollY;

      const currentlyOpenAccs = new Set();
      host.querySelectorAll('.acc.open').forEach(function (node) {
        if (node.id) currentlyOpenAccs.add(node.id);
      });
      ctxOpenAccs = currentlyOpenAccs;

      const prevH = host.offsetHeight;
      if (prevH > 0) host.style.minHeight = prevH + 'px';

      marks = [];
      const ctx = {
        repaint: repaint,
        target: null,
        isInitial: isInitial,
        wasOpen: function (accId) { return currentlyOpenAccs.has(accId); }
      };

      DOM.clear(host);
      host.appendChild(el('div', { class: 'tree' }, build(ctx)));

      window.requestAnimationFrame(function () {
