  { id: 'm.6.2.4', img: ['c.6.2.4_lagrange_mean_value_theorem'], sec: '6.2', kind: 'theorem', tier: 'core', mock: true,
    title: "Lagrange's Mean Value Theorem",
    oneLine: 'Somewhere inside, the tangent is parallel to the chord.',
    statement: `<p>Let $f$ be continuous on $[a,b]$ and differentiable on $(a,b)$. Then there exists
      $c\\in(a,b)$ such that</p>
      $$f(b)-f(a)=f'(c)\\,(b-a).$$`,
    intuition: `<p>The average rate of change over $[a,b]$ is achieved as an instantaneous rate

      <p>Its real use is turning information about $f'$ into information about $f$: $f'=0$ on an

        { why: '$\\varphi$ inherits continuity on $[a,b]$ and differentiability on $(a,b)$, because the subtracted part is a polynomial.',
          m: `$$ \\varphi\\in C[a,b],\\qquad \\varphi\\ \\text{differentiable on}\\ (a,b). $$` },
        { why: 'Check the endpoints: both give zero, which is exactly Rolle\u2019s hypothesis.',
          m: `$$ \\varphi(a)=0,\\qquad \\varphi(b)=f(b)-f(a)-\\big(f(b)-f(a)\\big)=0. $$` },

        { why: 'Differentiate the definition of $\\varphi$ and set it to zero at $c$.',
          m: `$$ \\varphi'(x)=f'(x)-\\frac{f(b)-f(a)}{b-a}. $$` }

    },

        a: 'If $f$ is continuous on $[a,b]$ and differentiable on $(a,b)$, then $f(b)-f(a)=f\'(c)(b-a)$ for some $c\\in(a,b)$.' },

      $u=\\sup S$ holds.</p>
      <p><b>D</b> drops the upper-bound half and collapses. Take $S=(0,1)$, $u=\\tfrac12$: every
      $\\varepsilon$-neighbourhood of $\\tfrac12$ meets $S$, so D holds — yet $\\tfrac12$ is not even
      an upper bound.</p>
      <p>Correct set: <b>A and B</b>.</p>`,
    tested: `The $\\varepsilon$-characterisation of $\\sup$ against the definition, plus the two
      standard confusions: supremum vs maximum, and “close to $S$” vs “bounds $S$”.`,
    tests: ['m.2.3.2'],
    trap: `Quoting only the second half of the $\\varepsilon$-characterisation. “There are elements
      arbitrarily close to $u$” is worth nothing alone — every interior point of $S$ has that
      property. In a written proof, dropping the upper-bound clause is where marks go.`,
    twist: { q: `If you add “and $u$ is an upper bound of $S$” to option D, does D become equivalent?`,
      a: `Yes — and then D <i>is</i> option A, because $|s-u|<\\varepsilon$ together with $s\\le u$
        forces $u-\\varepsilon<s\\le u$. The upper-bound clause is the load-bearing half.` },
    provenance: MO('mock §2.3, ε-characterisation of the supremum') },

  { id: 'mo.03', course: 'ra1', sec: '2.3', type: 'NAT', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 120,
    prompt: `Let $S=\\{\\,x\\in\\mathbb{Q}\\ :\\ x>0 \\text{ and } x^{2}<3\\,\\}$, regarded as a subset
      of $\\mathbb{R}$. Then $\\sup S$, correct to two decimal places, is ______.`,
    answer: { value: 1.73, tol: 0.01, dp: 2 },
    solution: `<p><b>Existence first.</b> $S\\neq\\emptyset$ (take $x=1$) and $S$ is bounded above: if
      $x\\ge2$ then $x^{2}\\ge4>3$, so $2$ bounds $S$. The Completeness Property therefore hands us
      $u=\\sup S\\in\\mathbb{R}$ — and it is completeness doing the work, nothing else.</p>
      <p><b>Value.</b> The standard nudging argument rules out $u^{2}<3$ (you could increase $u$
      slightly and stay in $S$) and $u^{2}>3$ (you could decrease $u$ slightly and still bound $S$),
      leaving $u^{2}=3$. So $u=\\sqrt3=1.7320508\\ldots\\approx\\mathbf{1.73}$.</p>
      <p><b>The point.</b> $S$ consists of <i>rationals</i> but its supremum is irrational. Inside
      $\\mathbb{Q}$ this set has no least upper bound at all — that failure is exactly why
      completeness is an axiom about $\\mathbb{R}$.</p>`,
    tested: `The Completeness (Supremum) Property: a nonempty set bounded above has a supremum
      <i>in $\\mathbb{R}$</i>. Also square roots as suprema.`,
    tests: ['m.2.3.6', 'm.2.3.2'],
    trap: `Answering $3$ — that bounds $x^{2}$, not $x$. The other trap is “the supremum does not
      exist because $\\sqrt3\\notin\\mathbb{Q}$”: the supremum is taken in $\\mathbb{R}$, where it
      exists.`,
    twist: { q: `What is $\\sup\\{x\\in\\mathbb{Q}:x>0,\\ x^{2}<2\\}$?`,
      a: `$\\sqrt2\\approx1.41$ — same argument, again a rational set with an irrational supremum.` },
    provenance: MO('mock §2.3, completeness property') },

  { id: 'mo.04', course: 'ra1', sec: '3.4', type: 'MCQ', mock: true,
    marks: 2, neg: -2 / 3, negLabel: '−2/3', time: 90,
    prompt: `Let $x_{n}=\\sin\\!\\left(\\dfrac{n\\pi}{2}\\right)$ for $n\\in\\mathbb{N}$. Which
      statement is correct?`,
    options: [
      { k: 'A', t: `$(x_{n})$ converges to $0$, because $x_{n}=0$ for every even $n$.` },
      { k: 'B', t: `$(x_{n})$ is divergent: it has subsequences converging to $1$, to $-1$ and to $0$.` },
      { k: 'C', t: `$(x_{n})$ is unbounded, hence divergent.` },
      { k: 'D', t: `$(x_{n})$ converges, because it is bounded.` }
    ],
    answer: 'B',
    solution: `<p>The values cycle with period $4$:
      $$x_{1}=1,\\quad x_{2}=0,\\quad x_{3}=-1,\\quad x_{4}=0,\\quad x_{5}=1,\\ \\ldots$$
      so $x_{4k+1}=1$, $x_{4k+3}=-1$ and $x_{2k}=0$ give three subsequences with three different
      limits.</p>
      <p>Every subsequence of a convergent sequence converges to the same limit, so three
      subsequential limits make convergence impossible. Option <b>B</b>.</p>
      <p><b>A</b> uses one subsequence and ignores the rest. <b>C</b> is false: $|x_{n}|\\le1$, so the
      sequence is bounded — it diverges by oscillation, not by escaping. <b>D</b> is the classic
      misreading of Bolzano–Weierstrass, which promises only a convergent <i>subsequence</i>.</p>`,
    tested: `The divergence criterion via subsequences: all subsequences of a convergent sequence
      share its limit. The trap under test is “bounded $\\Rightarrow$ convergent”.`,
    tests: ['m.3.4.8'],
    trap: `Two errors, both worth marks: concluding convergence from one well-behaved subsequence,
      and upgrading boundedness to convergence. Bounded <i>and monotone</i> converges; bounded alone
      gives only a convergent subsequence.`,
    twist: { q: `What changes for $x_{n}=\\sin(n\\pi)$?`,
      a: `$x_{n}=0$ for every $n$, so the sequence is constant and converges to $0$. Dropping the
        $\\tfrac12$ from the argument removes the oscillation entirely.` },
    provenance: MO('mock §3.4, subsequences and divergence') },

  { id: 'mo.05', course: 'ra1', sec: '3.4', type: 'MSQ', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 120,
    prompt: `Which of the following are <b>guaranteed</b> by the Bolzano–Weierstrass Theorem?`,
    options: [
      { k: 'A', t: `Every bounded sequence of real numbers has a convergent subsequence.` },
      { k: 'B', t: `Every sequence in $[0,1]$ has a subsequence converging to a point of $[0,1]$.` },
      { k: 'C', t: `Every bounded sequence of real numbers converges.` },
      { k: 'D', t: `A bounded sequence has exactly one subsequential limit.` }
    ],
    answer: ['A', 'B'],
    solution: `<p><b>A</b> is the theorem itself.</p>
      <p><b>B</b> follows in two steps: a sequence in $[0,1]$ is bounded, so some subsequence
      converges, say $x_{n_{k}}\\to x$; and $0\\le x_{n_{k}}\\le1$ passes to the limit, so
      $x\\in[0,1]$. The <i>closedness</i> of the interval is what keeps the limit inside — exactly
      the hypothesis that fails on $(0,1)$.</p>
      <p><b>C</b> is false: $x_{n}=(-1)^{n}$ is bounded and divergent. <b>D</b> is false for the same
      sequence, with subsequential limits $1$ and $-1$.</p>
      <p>Correct set: <b>A and B</b>.</p>`,
    tested: `Bolzano–Weierstrass, plus the fact that a closed interval contains the limits of its
      sequences — the pair of facts every compactness proof in §5.3 and §5.4 leans on.`,
    tests: ['m.3.4.8'],
    trap: `Reading “has a convergent subsequence” as “converges”. The theorem never promises the
      whole sequence anything; it extracts something well behaved from something badly behaved.`,
    twist: { q: `Does every sequence in the <i>open</i> interval $(0,1)$ have a subsequence
        converging to a point of $(0,1)$?`,
      a: `No. $x_{n}=1/n$ lies in $(0,1)$ but every subsequence converges to $0\\notin(0,1)$.
        Bolzano–Weierstrass still applies — the limit just need not land in the set.` },
    provenance: MO('mock §3.4, Bolzano–Weierstrass') },

  { id: 'mo.06', course: 'ra1', sec: '3.4', type: 'NAT', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 90,
    prompt: `Let $x_{n}=(-1)^{n}+\\dfrac{1}{n}$. The number of distinct subsequential limits of
      $(x_{n})$ is ______.`,
    answer: { value: 2, tol: 0, dp: 0 },
    solution: `<p>Split by parity. Even $n$: $x_{n}=1+\\frac1n\\to1$. Odd $n$: $x_{n}=-1+\\frac1n\\to-1$.
      So $1$ and $-1$ are subsequential limits.</p>
      <p>Nothing else can be: any subsequence uses infinitely many even or infinitely many odd
      indices, so it has a further subsequence tending to $1$ or to $-1$; if the subsequence itself
      converges, its limit is that value. Hence exactly $\\mathbf{2}$.</p>`,
    tested: `Subsequences and their limits: the set of subsequential limits is what decides
      convergence — one limit means convergent, more than one means divergent.`,
    tests: ['m.3.4.8'],
    trap: `Counting $0$ as a third limit because $\\frac1n\\to0$. The perturbation tends to $0$; the
      sequence never does, since $|x_{n}|\\ge1-\\frac1n$.`,
    twist: { q: `How many for $x_{n}=\\sin\\!\\left(\\frac{n\\pi}{2}\\right)$?`,
      a: `Three: $1$, $0$ and $-1$ — the period-$4$ cycle from question 4.` },
    provenance: MO('mock §3.4, subsequential limits') },

  { id: 'mo.07', course: 'ra2', sec: '5.1', type: 'MCQ', mock: true,
    marks: 2, neg: -2 / 3, negLabel: '−2/3', time: 90,
    prompt: `Which statement is the <b>Sequential Criterion</b> for continuity of
      $f:A\\to\\mathbb{R}$ at $c\\in A$?`,
    options: [
      { k: 'A', t: `$f$ is continuous at $c$ $\\iff$ for every sequence $(x_{n})$ in $A$ with $x_{n}\\to c$, $f(x_{n})\\to f(c)$.` },
      { k: 'B', t: `$f$ is continuous at $c$ $\\iff$ there exists a sequence $(x_{n})$ in $A$ with $x_{n}\\to c$ and $f(x_{n})\\to f(c)$.` },
      { k: 'C', t: `$f$ is continuous at $c$ $\\iff$ for every sequence $(x_{n})$ in $A$ with $f(x_{n})\\to f(c)$, $x_{n}\\to c$.` },
      { k: 'D', t: `$f$ is continuous at $c$ $\\iff$ for every sequence $(x_{n})$ in $A$ with $x_{n}\\to c$, the sequence $(f(x_{n}))$ is bounded.` }
    ],
    answer: 'A',
    solution: `<p><b>A</b> is the criterion, and the quantifier “for every sequence” is the whole
      content of it.</p>
      <p><b>B</b> is vacuous: the constant sequence $x_{n}=c$ satisfies $x_{n}\\to c$ and
      $f(x_{n})=f(c)\\to f(c)$ for <i>every</i> function, continuous or not. So B holds for
      $\\operatorname{sgn}$ at $0$, which is discontinuous there.</p>
      <p><b>C</b> reverses the implication, and is not even necessary: for the continuous constant
      function $f\\equiv5$ take $x_{n}=n$; then $f(x_{n})\\to5=f(c)$ while $x_{n}\\not\\to c$.</p>
      <p><b>D</b> is far too weak: for $f=\\operatorname{sgn}$ and any $x_{n}\\to0$ the images lie in
      $\\{-1,0,1\\}$, hence are bounded, yet $\\operatorname{sgn}$ is discontinuous at $0$.</p>`,
    tested: `The Sequential Criterion for continuity, and specifically its quantifier structure
      (“for every sequence”, not “for some”) and the direction of the implication.`,
    tests: ['m.5.1.3', 'm.5.1.1'],
    trap: `Swapping $\\forall$ and $\\exists$, or reversing the implication. The same slip costs marks
      in written proofs, where the criterion is usually applied in its contrapositive form.`,
    twist: { q: `What is the practical form of this criterion for proving <i>discontinuity</i>?`,
      a: `The Discontinuity Criterion: exhibit <b>one</b> sequence $x_{n}\\to c$ in $A$ with
        $f(x_{n})\\not\\to f(c)$. One witness suffices.` },
    provenance: MO('mock §5.1, sequential criterion') },

  { id: 'mo.08', course: 'ra2', sec: '5.1', type: 'NAT', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 90,
    prompt: `Let $f(x)=3x+2$ and $c=1$. For $\\varepsilon=0.06$, the largest $\\delta>0$ such that
      $|x-1|<\\delta$ guarantees $|f(x)-f(1)|<\\varepsilon$ is ______.`,
    answer: { value: 0.02, tol: 0.001, dp: 2 },
    solution: `<p>Compute the image gap exactly:
      $$|f(x)-f(1)|=|3x+2-5|=3|x-1|.$$
      So $|f(x)-f(1)|<0.06$ holds precisely when $3|x-1|<0.06$, i.e. $|x-1|<0.02$.</p>
      <p>Every $\\delta\\le0.02$ works and $\\delta=0.02$ is the largest, so
      $\\delta_{\\max}=\\mathbf{0.02}$.</p>
      <p>In general this is the Lipschitz-style recipe $\\delta=\\varepsilon/K$ with $K=3$ the slope.</p>`,
    tested: `The $\\varepsilon$–$\\delta$ definition of continuity, used forwards: converting a
      demanded $\\varepsilon$ into an actual $\\delta$ through the estimate $|f(x)-f(c)|\\le K|x-c|$.`,
    tests: ['m.5.1.1'],
    trap: `Answering $0.06$ (forgetting the factor $3$) or $0.18$ (multiplying instead of dividing).
      The slope divides the tolerance; a steeper function needs a smaller $\\delta$.`,
    twist: { q: `Does this $\\delta$ depend on the point $c$?`,
      a: `No — $\\delta=\\varepsilon/3$ works at every $c$, which is precisely why $3x+2$ is
        <i>uniformly</i> continuous on $\\mathbb{R}$.` },
    provenance: MO('mock §5.1, ε–δ definition') },

  { id: 'mo.09', course: 'ra2', sec: '5.3', type: 'MCQ', mock: true,
    marks: 2, neg: -2 / 3, negLabel: '−2/3', time: 90,
    prompt: `The function $f(x)=1/x$ is continuous on $A=(0,1]$ yet has no maximum on $A$. Which is
      the correct explanation?`,
    options: [
      { k: 'A', t: `$f$ is not continuous on $A$.` },
      { k: 'B', t: `The Maximum–Minimum Theorem requires a closed bounded interval, and $A$ is not closed.` },
      { k: 'C', t: `This contradicts the Maximum–Minimum Theorem.` },
      { k: 'D', t: `$f$ attains neither a maximum nor a minimum on $A$.` }
    ],
    answer: 'B',
    solution: `<p>The theorem applies to a <i>closed bounded</i> interval $[a,b]$. Here $A=(0,1]$ is
      bounded but not closed — the endpoint $0$ is missing — so the theorem simply does not apply,
      and there is nothing to contradict. Option <b>B</b>.</p>
      <p>And $f$ really is unbounded above on $A$: $f(1/n)=n\\to\\infty$.</p>
      <p><b>D</b> is false, which is the interesting part: on $(0,1]$ we have $1/x\\ge1$ with equality
      at $x=1$, so $f$ <i>does</i> attain the minimum value $1$. Half the conclusion survives the
      loss of the hypothesis; the other half does not.</p>`,
    tested: `The Maximum–Minimum Theorem and its hypotheses — continuity plus a closed <i>and</i>
      bounded interval — and the habit of checking hypotheses before invoking a conclusion.`,
    tests: ['m.5.3.4'],
    trap: `Remembering the conclusion without the hypotheses, and assuming that when a theorem fails
      to apply, all of its conclusions fail. Here the minimum is still attained.`,
    twist: { q: `What happens on $\\left[\\tfrac12,1\\right]$?`,
      a: `Closed and bounded, so the theorem applies: maximum $2$ at $x=\\tfrac12$ and minimum $1$ at
        $x=1$, both attained.` },
    provenance: MO('mock §5.3, maximum–minimum theorem') },

  { id: 'mo.10', course: 'ra2', sec: '5.3', type: 'MSQ', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 120,
    prompt: `Let $f$ be continuous on $[a,b]$. Which of the following follow from Bolzano's
      Intermediate Value Theorem?`,
    options: [
      { k: 'A', t: `If $f(a)f(b)<0$ then $f(c)=0$ for some $c\\in(a,b)$.` },
      { k: 'B', t: `$f$ takes every value strictly between $f(a)$ and $f(b)$ somewhere on $(a,b)$.` },
      { k: 'C', t: `If $f(c)=0$ for some $c\\in(a,b)$ then $f(a)f(b)<0$.` },
      { k: 'D', t: `$f$ is injective on $[a,b]$.` }
    ],
    answer: ['A', 'B'],
    solution: `<p><b>A</b> is the Location of Roots case: opposite signs at the endpoints means $0$
      lies strictly between $f(a)$ and $f(b)$, so it is attained.</p>
      <p><b>B</b> is the theorem itself.</p>
      <p><b>C</b> is the false converse. Take $f(x)=x^{2}$ on $[-1,1]$: there is a root at $c=0$,
      yet $f(-1)f(1)=1>0$. A root does not require a sign change.</p>
      <p><b>D</b> is false for the same $f$: $f(-1)=f(1)=1$. The IVT says the function misses no
      intermediate value, not that it hits each value once.</p>
      <p>Correct set: <b>A and B</b>.</p>`,
    tested: `The Intermediate Value Theorem and its Location of Roots case, and the direction of the
      implication (existence of a root vs a sign change).`,
    tests: ['m.5.3.7'],
    trap: `Running the IVT backwards to conclude a sign change from a root. In “show the equation has
      exactly one root” problems the IVT only supplies existence — uniqueness needs monotonicity.`,
    twist: { q: `How do you upgrade “at least one root” to “exactly one root”?`,
      a: `Add strict monotonicity: if $f'>0$ throughout the interval, $f$ is strictly increasing, so
        it can cross a level at most once.` },
    provenance: MO('mock §5.3, intermediate value theorem') },

  { id: 'mo.11', course: 'ra2', sec: '5.3', type: 'NAT', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 120,
    prompt: `The number of real roots of $p(x)=x^{3}-3x+1$ lying in the interval $(0,1)$ is ______.`,
    answer: { value: 1, tol: 0, dp: 0 },
    solution: `<p><b>At least one.</b> $p(0)=1>0$ and $p(1)=1-3+1=-1<0$, so by the Location of Roots
      case of the IVT there is a root in $(0,1)$.</p>
      <p><b>At most one.</b> $p'(x)=3x^{2}-3=3(x^{2}-1)<0$ for $0<x<1$, so $p$ is strictly decreasing
      on $[0,1]$ and can cross zero only once.</p>
      <p>Exactly $\\mathbf{1}$. (For the record $p$ has three real roots overall, near $-1.879$,
      $0.347$ and $1.532$ — only one of them is in $(0,1)$.)</p>`,
    tested: `The IVT for existence together with the sign of $p'$ for uniqueness — the standard
      two-step “exactly one root” argument.`,
    tests: ['m.5.3.7', 'm.6.2.4'],
    trap: `Answering $3$: that counts all real roots of the cubic and ignores the interval. Answering
      $0$ from “a cubic's roots are spread out” is the other version of not testing the endpoints.`,
    twist: { q: `How many roots in $(1,2)$?`,
      a: `Exactly one: $p(1)=-1<0$, $p(2)=3>0$ gives existence, and $p'>0$ on $(1,2)$ gives
        uniqueness.` },
    provenance: MO('mock §5.3, location of roots') },

  { id: 'mo.12', course: 'ra2', sec: '5.4', type: 'MCQ', mock: true,
    marks: 2, neg: -2 / 3, negLabel: '−2/3', time: 120,
    prompt: `Which function is <b>uniformly continuous</b> on the set shown?`,
    options: [
      { k: 'A', t: `$f(x)=1/x$ on $(0,1)$` },
      { k: 'B', t: `$f(x)=x^{2}$ on $\\mathbb{R}$` },
      { k: 'C', t: `$f(x)=\\sqrt{x}$ on $[0,\\infty)$` },
      { k: 'D', t: `$f(x)=\\sin(1/x)$ on $(0,1)$` }
    ],
    answer: 'C',
    solution: `<p><b>C is uniformly continuous</b>, in two overlapping pieces. On $[0,1]$: continuous
      on a closed bounded interval, so uniformly continuous by the Uniform Continuity Theorem. On
      $[1,\\infty)$:
      $$|\\sqrt{x}-\\sqrt{u}|=\\frac{|x-u|}{\\sqrt{x}+\\sqrt{u}}\\le\\tfrac12|x-u|,$$
      so $f$ is Lipschitz there, hence uniformly continuous. Given $\\varepsilon$, take the smaller
      of the two $\\delta$'s; the pieces overlap at $x=1$, which is what makes the patch legitimate.</p>
      <p><b>A</b> fails: $x_{n}=1/n$, $u_{n}=1/(n+1)$ give $|x_{n}-u_{n}|\\to0$ but
      $|f(x_{n})-f(u_{n})|=1$.</p>
      <p><b>B</b> fails: $x_{n}=n+\\frac1n$, $u_{n}=n$ give $|x_{n}-u_{n}|=\\frac1n\\to0$ but
      $|x_{n}^{2}-u_{n}^{2}|=2+\\frac1{n^{2}}\\ge2$.</p>
      <p><b>D</b> fails: with $x_{n}=\\frac{2}{(4n+1)\\pi}$ and $u_{n}=\\frac{2}{(4n+3)\\pi}$ both
      tending to $0$, $f(x_{n})=1$ and $f(u_{n})=-1$, a permanent gap of $2$.</p>`,
    tested: `Uniform continuity against its two standard sources (a closed bounded domain, or a
      Lipschitz bound) and the nonuniform continuity criterion for the failures.`,
    tests: ['m.5.4.1', 'm.5.4.3'],
    trap: `Two beliefs to unlearn: that uniform continuity needs a bounded or compact domain
      ($\\sqrt{x}$ on $[0,\\infty)$ is fine), and that it implies Lipschitz ($\\sqrt{x}$ on $[0,1]$
      is uniformly continuous but not Lipschitz).`,
    twist: { q: `Is $\\sqrt{x}$ Lipschitz on $[0,1]$?`,
      a: `No: $\\dfrac{\\sqrt{x}-\\sqrt{0}}{x-0}=\\dfrac{1}{\\sqrt{x}}\\to\\infty$ as $x\\to0^{+}$, so no
        constant $K$ works. Uniformly continuous does not imply Lipschitz.` },
    provenance: MO('mock §5.4, uniform continuity') },

  { id: 'mo.13', course: 'ra2', sec: '5.4', type: 'MSQ', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 120,
    prompt: `Which of the following statements are true?`,
    options: [
      { k: 'A', t: `Every Lipschitz function on $A\\subseteq\\mathbb{R}$ is uniformly continuous on $A$.` },
      { k: 'B', t: `Every uniformly continuous function on $A$ is Lipschitz on $A$.` },
      { k: 'C', t: `Every continuous function on a closed bounded interval is uniformly continuous there.` },
      { k: 'D', t: `Every uniformly continuous function on $\\mathbb{R}$ is bounded.` }
    ],
    answer: ['A', 'C'],
    solution: `<p><b>A</b> is true with the explicit choice $\\delta=\\varepsilon/K$: if
      $|f(x)-f(u)|\\le K|x-u|$ then $|x-u|<\\varepsilon/K$ forces $|f(x)-f(u)|<\\varepsilon$, and this
      $\\delta$ does not depend on the point.</p>
      <p><b>C</b> is the Uniform Continuity Theorem.</p>
      <p><b>B</b> is false: $\\sqrt{x}$ on $[0,1]$ is uniformly continuous (closed bounded interval)
      but not Lipschitz, since $1/\\sqrt{x}$ is unbounded near $0$.</p>
      <p><b>D</b> is false: $f(x)=x$ is Lipschitz with $K=1$, hence uniformly continuous on

      <p>Correct set: <b>A and C</b>.</p>`,
    tested: `The implication chain Lipschitz $\\Rightarrow$ uniformly continuous $\\Rightarrow$
      continuous, and the Uniform Continuity Theorem — with the reminder that neither arrow reverses.`,
    tests: ['m.5.4.1', 'm.5.4.3'],
    trap: `Reading the implications as equivalences, and confusing uniform continuity with
      boundedness. Uniform continuity controls <i>differences</i> of values, not their size.`,
    twist: { q: `On a closed bounded interval, does continuous $\\Rightarrow$ Lipschitz?`,
      a: `No. $\\sqrt{x}$ on $[0,1]$ is continuous, hence uniformly continuous, but not Lipschitz.
        Compactness buys uniformity, never a Lipschitz constant.` },
    provenance: MO('mock §5.4, Lipschitz and uniform continuity') },

  { id: 'mo.14', course: 'ra2', sec: '6.2', type: 'NAT', mock: true,
    marks: 2, neg: 0, negLabel: 'none', time: 90,
    prompt: `For $f(x)=x^{2}$ on $[1,3]$, the value $c\\in(1,3)$ supplied by the Mean Value Theorem
      satisfies $c=$ ______.`,
    answer: { value: 2, tol: 0, dp: 0 },
    solution: `<p>The MVT requires $f'(c)$ to equal the average rate of change:
      $$f'(c)=\\frac{f(3)-f(1)}{3-1}=\\frac{9-1}{2}=4.$$
      Since $f'(x)=2x$, this gives $2c=4$, so $c=\\mathbf{2}$ — which does lie in $(1,3)$.</p>
      <p>For any quadratic the MVT point is the midpoint of the interval; that is special to
      quadratics.</p>`,
    tested: `The Mean Value Theorem, used computationally: the conclusion is an equation
      $f'(c)=\\dfrac{f(b)-f(a)}{b-a}$ to be solved for $c$.`,
    tests: ['m.6.2.4'],
    trap: `Averaging the function <i>values</i> — $(9+1)/2=5$ — instead of solving for the point

  { id: 'w.2.3.1', sec: '2.3', marks: 4, mock: true,

    solution: `<p>Put $u=\\sup A$, $v=\\sup B$, $w=\\max\\{u,v\\}$.</p>
      <p><b>$w$ is an upper bound.</b> Let $x\\in A\\cup B$. If $x\\in A$ then $x\\le u\\le w$; if

      $u=\\sup A$ is the least upper bound of $A$ we get $u\\le z$, i.e. $w\\le z$.</p>

  { id: 'w.2.3.3', sec: '2.3', marks: 5, mock: true,

    prompt: `<p>Let $S\\subseteq\\mathbb{R}$ be nonempty and bounded above, let $a\\in\\mathbb{R}$,

/* ══════════════════════════════════════════════════════════════════════════
   I18N: pure English and pure Malayalam, zero mixing.

   Every string the interface says is here, twice. The content pool carries
   its own pairs (`title_en` / `title_ml`), and `pick` reads them; this table
   is for the chrome — buttons, captions, verdicts, the plan for the day.

   Terminology follows the SCERT Kerala textbooks: പരിശീലനം for exercises,
   മുൻവർഷ ചോദ്യങ്ങൾ for past papers, ആശയം for a concept. When a word here
   disagrees with the book, the book wins.
   ══════════════════════════════════════════════════════════════════════════ */

const I18N = (function () {
  let curLang = 'en';

  function init() {
    if (typeof Store !== 'undefined' && Store.pref) {
      curLang = Store.pref('lang', 'en');
    }
    apply();
  }

  function lang() {
    return curLang;
  }

  function apply() {
    document.documentElement.setAttribute('lang', curLang);
    if (document.body) {
      document.body.classList.toggle('lang-ml', curLang === 'ml');
    }
  }

  function setLang(l) {
    curLang = l === 'ml' ? 'ml' : 'en';
    if (typeof Store !== 'undefined' && Store.setPref) {
      Store.setPref('lang', curLang);
    }
    apply();
    if (typeof Shell !== 'undefined' && Shell.paint) {
      Shell.paint();
    }
    if (typeof App !== 'undefined' && App.buildNav) {
      App.buildNav();
    }
    if (typeof Router !== 'undefined' && Router.reload) {
      Router.reload();
      if (typeof Tex !== 'undefined' && Tex.typeset) {
        const main = document.getElementById('main');
        if (main) Tex.typeset(main);
      }
    }
    if (typeof DOM !== 'undefined' && DOM.announce) {
      DOM.announce(curLang === 'ml' ? 'ഭാഷ മലയാളത്തിലേക്ക് മാറ്റി' : 'Language switched to English');
    }
  }

  function toggle() {
    setLang(curLang === 'en' ? 'ml' : 'en');
  }

  /* Extract the localized field from a node: strictly separate en and ml. */
  function pick(node, field) {
    if (!node) return '';
    if (typeof node === 'string') return node;
    if (curLang === 'ml') {
      if (field) {
        return node[field + '_ml'] || (node[field] && typeof node[field] === 'object' ? node[field].ml : '') || node[field] || '';
      }
      return node.ml || node.en || '';
    }
    if (field) {
      return node[field + '_en'] || (node[field] && typeof node[field] === 'object' ? node[field].en : '') || node[field] || '';
    }
    return node.en || node.ml || '';
  }

  function t(key, fallback) {
    const entry = STRINGS[key];
    if (!entry) return fallback !== undefined ? fallback : key;
    return entry[curLang] || entry.en || (fallback !== undefined ? fallback : key);
  }

  function kind(k) {
    if (k === 'trap') return t('trap_kind');
    return t(k, k);
  }

  function levelName(n) {
    return t('level_word_' + (n || 0));
  }

  /* "3 marks" / "3 മാർക്ക്" — Malayalam does not inflect the noun here. */
  function marks(n) {
    if (curLang === 'ml') return n + ' മാർക്ക്';
    return n + ' ' + (n === 1 ? 'mark' : 'marks');
  }

  /* Numbers stay in Latin digits in both languages: the SCERT books do. */
  function count(n, singularKey, pluralKey) {
    return n + ' ' + t(n === 1 ? singularKey : (pluralKey || singularKey));
  }

  return { init, lang, setLang, toggle, pick, t, kind, levelName, marks, count, apply };

/* ── hash router ─────────────────────────────────────────────────────────── */
const Router = (function () {
  let handler = null;
  /* How many route changes this visit has made. `history.back()` is only worth
     offering while there is somewhere of ours to go back TO — otherwise the
     browser walks out of the app entirely, which is not what a back button
     inside a toolbar is understood to mean. */
  let depth = 0;

  function current() {
    const raw = (location.hash || '').replace(/^#\/?/, '');
    const [p, q] = raw.split('?');
    const parts = p.split('/').filter(Boolean).map(decodeURIComponent);
    const query = {};
    new URLSearchParams(q || '').forEach((v, k) => { query[k] = v; });
    return { name: parts[0] || 'home', args: parts.slice(1), query, raw: p };
  }

  function start(fn) {
    handler = fn;
    window.addEventListener('hashchange', function () {
      depth += 1;
      handler(current());
      listeners.forEach(function (f) { try { f(current()); } catch (e) { /* never break a route */ } });
    });
    handler(current());
  }

  const listeners = [];
  const onRoute = fn => listeners.push(fn);

  /* One step back through OUR history, or home when there is none. */
  function back() {
    if (depth > 0) { depth -= 2; window.history.back(); return true; }
    if (current().name !== 'home') { go('home'); return true; }
    return false;
  }
  const canBack = () => depth > 0 || current().name !== 'home';

  const go = hash => { location.hash = hash.charAt(0) === '#' ? hash : '#/' + hash.replace(/^\//, ''); };
  const href = hash => '#/' + String(hash).replace(/^\//, '');
  const reload = () => handler && handler(current());

  return { current, start, go, href, reload, back, canBack, onRoute };
})();


/* ── src/core.tex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   MathJax plumbing.

   Two jobs: typeset authored content after a view is mounted, and render the
   learner's own LaTeX fragment safely. "Safely" means a malformed fragment
   never throws into the view, never wipes the last good render, and reports a
   human-readable reason. MathJax's formatError hook (set in index.html) parks
   the message on window.__texError; we read and clear it around each run.
   ══════════════════════════════════════════════════════════════════════════ */

const Tex = (function () {

  let chain = Promise.resolve();

  const available = () => !!(window.MathJax && window.MathJax.typesetPromise);

  /* Serialise every typeset call: MathJax is single-threaded and we need the
     error hook to belong to a known run. */
  function run(job) {
    chain = chain.then(job).catch(err => {
      console.warn('[tex]', err && err.message);
    });
    return chain;
  }

  /* Typeset authored HTML already in the DOM. */
  function typeset(nodes) {
    if (!available()) return Promise.resolve();
    const list = Array.isArray(nodes) ? nodes : [nodes];
    return run(() => window.MathJax.typesetPromise(list));
  }

  /* Render one learner fragment into `target`.
     Resolves {ok, error}. On failure `target` keeps whatever it had. */
  function renderFragment(target, latex, opts) {
    const display = !opts || opts.display !== false;
    const src = String(latex == null ? '' : latex);

    if (!src.trim()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'ph', text: opts && opts.placeholder
        ? opts.placeholder : 'Your rendered mathematics will appear here.' }));
      return Promise.resolve({ ok: true, empty: true });
    }
    if (!available()) {
      DOM.clear(target);
      target.appendChild(DOM.el('div', { class: 'mono small', text: src }));
      return Promise.resolve({ ok: false, error: 'MathJax is not loaded — showing LaTeX source.' });
    }

    return run(function () {
      const stage = document.createElement('div');
      stage.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden';
      stage.textContent = display ? '\\[' + src + '\\]' : '\\(' + src + '\\)';
      document.body.appendChild(stage);
      window.__texError = null;

      return window.MathJax.typesetPromise([stage]).then(function () {
        const err = window.__texError;
        window.__texError = null;

        /* Three ways a fragment can be bad, and all three must be caught:
           a TeX error raised through formatError; an error node rendered in
           place; or no maths at all, which is what an unclosed group does —
           MathJax swallows the closing delimiter and finds nothing to typeset. */
        const errNode = stage.querySelector('mjx-merror, [data-mjx-error]');
        const produced = stage.querySelector('mjx-container');
        const why = err
          || (errNode && (errNode.getAttribute('data-mjx-error') || errNode.textContent))
          || (!produced && 'nothing came out — check for an unmatched { or }, and that every command is complete.');

        if (why) { stage.remove(); return { ok: false, error: String(why) }; }

        /* MathJax's noundefined package prints an unknown macro in red rather
           than failing. That is the right behaviour — the rest of the line
           still renders — but the learner deserves to be told. */
        const unknown = stage.querySelector('[style*="color: red"]');
        const hint = unknown
          ? 'It renders, but the part shown in red is not a command MathJax knows — check that spelling.'
          : null;

        DOM.clear(target);
        while (stage.firstChild) target.appendChild(stage.firstChild);
        stage.remove();
        return { ok: true, hint: hint };
      }, function (e) {
        stage.remove();
        window.__texError = null;
        return { ok: false, error: (e && e.message) || 'LaTeX could not be rendered.' };
      });
    });
  }

  /* Wait once for MathJax, so the first view is not typeset into the void. */
  function ready() {
    if (window.MathJax && window.MathJax.startup && window.MathJax.startup.promise) {
      return window.MathJax.startup.promise.catch(() => {});
    }
    return Promise.resolve();
  }

  return { typeset, renderFragment, ready, available };
})();

/* ══════════════════════════════════════════════════════════════════════════
   Markdown, line by line, with the maths left alone.

   The writing workspace is a live markdown editor whose maths is written
   inline as $…$ and $$…$$. So the one thing this renderer must never do is
   touch what is between the dollars: `\text{a*b*c}` is not italics, and a
   backslash is not an escape character to markdown here.

   The method is therefore: cut the source into maths and prose segments
   first, run the inline rules over prose only, then reassemble. Every block
   is one line — the editor renders each line into its own frame, so there is
   no multi-line block state to carry.

   AUTO-MATH. Dollar signs are bookkeeping, and bookkeeping is what stops a
   sentence being written at speed. So a LaTeX command met in the middle of
   prose no longer has to be fenced: "I love \\frac{1}{2} in fact" typesets the
   fraction and leaves the words alone. `autoMath` finds each run that is
   unambiguously mathematics — it has to CONTAIN a backslash command, a
   superscript or a subscript, never merely look numeric — grows it over the
   operands and operators around it, and stops at the first real word. The run
   is stashed behind a placeholder before the markdown rules run, so `_` inside
   a subscript is never mistaken for italics and `<` is never escaped.

   Explicit `$…$` still works and still wins: segments() takes those out first,
   so anything already fenced is left exactly as written.
   ══════════════════════════════════════════════════════════════════════════ */

const Markdown = (function () {

  const esc = s => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* Split on $$…$$ first, then $…$, so a display block is never mistaken for
     two inline ones. Returns [{math:false,t}|{math:true,t}]. */
  function segments(src) {
    const out = [];
    const re = /\$\$([\s\S]+?)\$\$|\$([^$\n]+?)\$/g;
    let at = 0, m;
    while ((m = re.exec(src)) !== null) {
      if (m.index > at) out.push({ math: false, t: src.slice(at, m.index) });
      out.push({ math: true, t: m[0] });
      at = m.index + m[0].length;
    }
    if (at < src.length) out.push({ math: false, t: src.slice(at) });
    return out;

     inside them survives verbatim. */
  function inline(text) {
    const code = [];
    let s = String(text).replace(/`([^`]+)`/g, function (_, c) {
      code.push(c);

      .replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')

      .replace(/(^|[\s(])_([^_\n]+)_/g, '$1<em>$2</em>')

     and wrap each mathematical run in \\( … \\).

     What starts a run: a backslash command, or a token carrying ^ or _.
     What continues one: single-letter variables, numbers, operators, balanced
     braces and the spaces between them.

     sentence-ending punctuation mark, or the end of the line.

    for (let i = 0; i < s.length; i++) {
      if (inSkip(i)) continue;
      const isCmd = s[i] === '\\' && /[a-zA-Z]/.test(s[i + 1] || '');
      const isScr = (s[i] === '^' || s[i] === '_') && isScript(s, i);
      if (!isCmd && !isScr) continue;
      if (runs.length && i < runs[runs.length - 1][1]) continue;   /* already inside one */

      const floor = Math.max(floorFor(i), runs.length ? runs[runs.length - 1][1] - 1 : -1);
      const a = extendLeft(s, i, floor);
      const b = extendRight(s, isCmd ? (token(s, i) < 0 ? i + 1 : token(s, i)) : i + 1);
      if (runs.length && a <= runs[runs.length - 1][1]) runs[runs.length - 1][1] = Math.max(b, runs[runs.length - 1][1]);
      else runs.push([a, b]);
      i = b - 1;
    }

    if (!runs.length) return { text: s, stash: [] };

    const stash = [];
    let out = '', at = 0;
    runs.forEach(function (r) {
      out += s.slice(at, r[0]);
      let run = s.slice(r[0], r[1]);
      const trail = TRAIL.exec(run);
      let tail = '';
      if (trail && trail.index > 0) { tail = trail[0]; run = run.slice(0, trail.index); }
      if (!run.trim()) { out += s.slice(r[0], r[1]); at = r[1]; return; }
      stash.push('\\(' + run + '\\)');
      out += '\x00M' + (stash.length - 1) + '\x00' + tail;
      at = r[1];
    });
    out += s.slice(at);
    return { text: out, stash: stash };
  }

  /* prose through the inline rules, maths through untouched */
  function spans(src) {
    return segments(src).map(function (seg) {
      if (seg.math) return seg.t;
      const auto = autoMath(seg.t);
      const html = inline(auto.text);
      if (!auto.stash.length) return html;
      return html.replace(/\x00M(\d+)\x00/g, (_, n) => auto.stash[+n]);
    }).join('');
  }

  /* One source line -> one HTML block. */
  function line(src) {
    const raw = String(src == null ? '' : src);
    const t = raw.trim();
    if (!t) return '';

    if (/^(---|\*\*\*|___)\s*$/.test(t)) return '<hr>';

    const h = /^(#{1,4})\s+(.*)$/.exec(t);
    if (h) {
      const n = Math.min(h[1].length + 1, 5);
      return '<h' + n + ' class="md-h">' + spans(h[2]) + '</h' + n + '>';
    }

    const q = /^>\s?(.*)$/.exec(t);
    if (q) return '<blockquote class="md-q">' + spans(q[1]) + '</blockquote>';

    const ul = /^[-*+]\s+(.*)$/.exec(t);
    if (ul) return '<ul class="md-l"><li>' + spans(ul[1]) + '</li></ul>';

    const ol = /^(\d+)[.)]\s+(.*)$/.exec(t);
    if (ol) return '<ol class="md-l" start="' + ol[1] + '"><li>' + spans(ol[2]) + '</li></ol>';

    return '<p class="md-p">' + spans(raw) + '</p>';
  }

  /* Does this line carry an explicit maths delimiter? A maths-first box uses
     this to decide whether a delimiter-free line is bare LaTeX. It stays
     dollar-only on purpose: auto-math is for MIXED lines, and a maths-first box
     wants the whole line set as display maths, not one fenced run inside it. */
  const hasMath = src => /\$/.test(String(src || ''));

  /* Whole document, for export and for the read-only preview. */
  const doc = src => String(src || '').split('\n').map(line).join('\n');

  return { line, doc, hasMath, inline, segments, autoMath };
})();


/* ── src/core.store.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Progress store.

   Six things are tracked, and they are kept apart on purpose:

     completion   Level 1. You have encountered the material. Never evidence
                  of recall.
     task work    Level 2 and 3. An exercise ('w:'), a past-paper question
                  ('p:') or a derivation (the concept id) worked through
                  yourself. Awarded per task, never for opening the note.
     first try    the FIRST recorded attempt at a card or a question. Later
                  attempts are allowed but never overwrite the first, because
                  the first attempt is the only honest measurement.
     the day log  how much was done on each calendar day. Streaks and the
                  daily goal read it; it proves nothing about mastery.
     mistakes     why an attempt went wrong, one tag per miss.
     calibration  how sure the learner said they were, against what happened.

   The shape is built for merging. Two devices can both make progress offline,
   so every mutation is timestamped and every removal leaves a tombstone —
   merge(a,b) == merge(b,a), and merging twice changes nothing. core.sync.js
   depends on that and on nothing else.

   Storage is localStorage with an in-memory fallback so a locked-down browser
   degrades to a working-but-forgetful session instead of a broken one.
   ══════════════════════════════════════════════════════════════════════════ */

const Store = (function () {

  /* SSLC keeps its own key. The app was forked from the Real Analysis system,
     which stores under 'ssc4.level1.v1'; sharing that key on one origin made
     the two apps write into each other's record. A record found under the old
     key is adopted once, so nobody loses the work they already did. */
  const KEY = 'sslc.v1';
  const LEGACY_KEY = 'ssc4.level1.v1';
  const EMPTY = {
    v: 3,
    done: {}, undone: {},        /* Level 1 completion + tombstones */
    proofs: {}, unproofs: {},    /* exercise, past-paper and derivation work + tombstones */
    cards: {}, omr: {}, write: {},
    days: {},                    /* 'YYYY-MM-DD' -> activity counters (streaks, daily goal) */
    errs: {},                    /* attempt id -> why it went wrong (the mistake log) */
    cal: {},                     /* attempt id -> confidence vs outcome (calibration) */
    prefs: {}, prefsAt: {},
    updated: 0
  };

  let volatile = false;
  let state = load();
  const listeners = [];

  function blank() { return JSON.parse(JSON.stringify(EMPTY)); }

  /* v1 had no tombstones, no proof map and no per-key preference stamps.
     Everything it did have keeps its meaning, so the upgrade is a fill-in. */
  function upgrade(raw) {
    const s = Object.assign(blank(), raw || {});
    ['done', 'undone', 'proofs', 'unproofs', 'cards', 'omr', 'write', 'days', 'errs', 'cal', 'prefs', 'prefsAt']
      .forEach(function (k) { if (!s[k] || typeof s[k] !== 'object') s[k] = {}; });
    s.v = 3;
    if (!s.updated) s.updated = Date.now();
    return s;
  }

  function load() {
    try {
      let raw = window.localStorage.getItem(KEY);
      if (!raw) {
        /* first run under the new key: carry the old record across */
        const old = window.localStorage.getItem(LEGACY_KEY);
        if (old) { raw = old; window.localStorage.setItem(KEY, old); }
      }
      if (!raw) return blank();
      return upgrade(JSON.parse(raw));
    } catch (e) {
      volatile = true;
      return blank();
    }
  }

  function write() {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { volatile = true; }
  }

  const flush = DOM.debounce(write, 250);

  /* Write immediately, skipping the debounce. Anything the very next page load
     depends on has to go through here: a debounced write is still pending when
     `location.reload()` tears the page down, and signing in or out and then
     reloading would land back where you started. */
  function flushNow() { write(); }

  function save(quiet) {
    state.updated = Date.now();
    flush();
    if (!quiet) listeners.forEach(function (fn) { try { fn(); } catch (e) { /* a listener must never break a save */ } });
  }

  /* core.sync.js subscribes here; nothing else needs to. */
  function onChange(fn) { listeners.push(fn); }

  /* ── a tick with a tombstone, used by completion and by proof work ────── */
  function flag(on, off, id, want) {
    const now = Date.now();
    if (want) { state[on][id] = now; delete state[off][id]; }
    else { state[off][id] = now; delete state[on][id]; }
    save();
    return !!state[on][id];
  }

  /* ── the day log ─────────────────────────────────────────────────────────
     One row per calendar day, a handful of counters. Streaks and the daily
     goal are read off it; nothing else is. Days are local dates, because a
     study day is the day the learner lived, not UTC. */
  function dayKey(d) {
    const x = d || new Date();
    const m = x.getMonth() + 1, day = x.getDate();
    return x.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
  }
  function bump(kind, n) {
    const k = dayKey();
    const row = state.days[k] || (state.days[k] = {});
    row[kind] = (row[kind] || 0) + (n == null ? 1 : n);
    row.at = Date.now();
    save();
    return row;
  }
  const day = k => state.days[k || dayKey()] || null;
  const days = () => state.days;

  /* ── completion (Level 1) ────────────────────────────────────────────── */
  const isDone = id => !!state.done[id];
  function setDone(id, on) {
    const was = !!state.done[id];
    const r = flag('done', 'undone', id, on);
    if (on && !was) bump('reads');
    return r;
  }

  /* Tick a whole list in one write — the prerequisite cascade. Returns the
     ids that actually changed, so the caller can report honestly. */
  function setDoneMany(ids, on) {
    const now = Date.now();
    const hit = [];
    (ids || []).forEach(function (id) {
      if (!!state.done[id] === !!on) return;
      hit.push(id);
      if (on) { state.done[id] = now; delete state.undone[id]; }
      else { state.undone[id] = now; delete state.done[id]; }
    });
    if (hit.length) save();
    return hit;
  }

  /* ── task work (Levels 2 and 3) ──────────────────────────────────────────
     One flag map for "I produced this myself", under two kinds of key:
       '<conceptId>'      a proof worked through          — earns level 2
       'w:<questionId>'   a written exercise worked out   — earns level 3
     They share a map because they are the same kind of claim and merge the
     same way; core.progress.js is what gives each key its meaning. */
  const isProofDone = id => !!state.proofs[id];
  function setProofDone(id, on) {
    const was = !!state.proofs[id];
    const r = flag('proofs', 'unproofs', id, on);
    if (on && !was) bump(id.indexOf('w:') === 0 ? 'exercises' : id.indexOf('p:') === 0 ? 'pyq' : 'proofs');
    return r;
  }

  /* ── recall cards ────────────────────────────────────────────────────── */
  /* grade: 'got' | 'partly' | 'missed'

     `box` is the Leitner box the reel schedules from: it rises when you state
     a card, steps back when you half-state it and resets when you miss it.
     The interval each box buys is core.progress.js's business — this only has
     to store the number and, critically, MERGE it (see mergeAttempts). */
  const card = id => state.cards[id] || null;
  function gradeCard(id, grade) {
    const rec = state.cards[id] || (state.cards[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = grade;
    rec.lastAt = Date.now();
    rec.box = Progress.nextBox(rec.box, grade);
    if (!rec.first) { rec.first = grade; rec.firstAt = rec.lastAt; }  /* first attempt is final */
    bump('reviews');
    save();
    return rec;
  }

  /* ── objective questions ─────────────────────────────────────────────── */
  const omr = id => state.omr[id] || null;
  function lockOmr(id, result) {
    const rec = state.omr[id] || (state.omr[id] = { tries: 0 });
    rec.tries += 1;
    rec.last = { given: result.given, verdict: result.verdict, ms: result.ms, at: Date.now() };
    if (!rec.first) rec.first = rec.last;
    bump('questions');
    save();
    return rec;
  }

  /* ── the mistake log ─────────────────────────────────────────────────────
     After a miss, one tap says WHY: a careless slip, a forgotten formula, the
     wrong method, a misread question, or simply not knowing. The reason is
     what makes the log useful — "wrong" tells you nothing about what to fix.
     Keyed by the attempt (a card id or 'q:<question id>'); the latest reason
     for an attempt wins on merge. */
  const err = id => state.errs[id] || null;
  function tagError(id, why, cid) {
    state.errs[id] = { why: why, cid: cid || null, at: Date.now() };
    save();
    return state.errs[id];
  }
  function clearError(id) { delete state.errs[id]; save(); }
  const errs = () => state.errs;

  /* ── calibration ─────────────────────────────────────────────────────────
     Before an answer is revealed the learner says how sure they are (1 no
     idea, 2 not sure, 3 sure); after it, the outcome is known. Confidence
     against outcome is the one number that tells a learner whether they can
     trust their own feeling of knowing. Keyed by attempt, latest wins. */
  function recordConfidence(id, conf, ok, cid) {
    state.cal[id] = { c: conf, ok: !!ok, cid: cid || null, at: Date.now() };
    save();
    return state.cal[id];
  }
  const cal = () => state.cal;

  /* ── writing drafts ──────────────────────────────────────────────────── */
  const draft = cid => (state.write[cid] && state.write[cid].tex) || '';
  function saveDraft(cid, tex) {
    if (!tex.trim()) delete state.write[cid];
    else state.write[cid] = { tex: tex, at: Date.now() };
    save();
  }

  /* ── preferences ─────────────────────────────────────────────────────── */
  const pref = (k, d) => (k in state.prefs ? state.prefs[k] : d);
  function setPref(k, v) {
    state.prefs[k] = v;
    state.prefsAt[k] = Date.now();
    save();
    return v;
  }

  /* ── the mastery level is no longer stored ────────────────────────
     It used to be a per-course switch with an unlock, and pressing it moved
     the goalposts under work that was already finished. The level is now
     DERIVED from what has actually been done — see core.progress.js — so there
     is nothing here to set. The old 'level:<course>' and 'level2:<course>'
     preferences are left where they are: they are inert, and deleting them
     would only make two devices argue about a key neither of them reads. */

  /* ── who is signed in ────────────────────────────────────────────────────
     Name and roll number are the credentials AND the sync key. They are a pass
     key, not a password, and every surface that shows them says so. */
  const identity = () => ({
    name: pref('syncName', ''),
    roll: pref('syncRoll', '')
  });
  const signedIn = () => {
    const id = identity();
    return !!(String(id.name).trim() && String(id.roll).trim());
  };
  function signIn(name, roll) {
    setPref('syncName', String(name || '').trim());
    setPref('syncRoll', String(roll || '').trim());
    flushNow();
    return signedIn();
  }
  function signOut() {
    setPref('syncName', '');
    setPref('syncRoll', '');
    flushNow();
  }

  /* ── aggregate stats over a given universe of ids ────────────────────── */
  function summary(conceptIds, cardIds, omrIds, proofIds) {
    const notes = conceptIds.filter(isDone).length;
    let tried = 0, got = 0, partly = 0;
    cardIds.forEach(function (id) {
      const r = state.cards[id];
      if (!r || !r.first) return;
      tried += 1;
      if (r.first === 'got') got += 1;
      else if (r.first === 'partly') partly += 1;
    });
    let locked = 0, right = 0, part = 0;
    omrIds.forEach(function (id) {
      const r = state.omr[id];
      if (!r || !r.first) return;
      locked += 1;
      if (r.first.verdict === 'correct') right += 1;
      else if (r.first.verdict === 'partial') part += 1;
    });
    const pf = proofIds || [];
    return {
      notes: { done: notes, total: conceptIds.length },
      cards: { tried: tried, got: got, partly: partly, total: cardIds.length },
      omr: { locked: locked, correct: right, partial: part, total: omrIds.length },
      proofs: { done: pf.filter(isProofDone).length, total: pf.length }
    };
  }

  /* ── merging two devices ─────────────────────────────────────────────────
     Loss-free and order-independent. The rules follow from what each field
     means rather than from a single "newest wins": a first attempt is a
     measurement, so the EARLIER one survives; a tick is a decision, so the
     LATER one survives. */
  function mergeFlags(a, b, ta, tb) {
    const on = {}, off = {};
    [a, b].forEach(src => { for (const k in (src || {})) if (!(on[k] >= src[k])) on[k] = src[k]; });
    [ta, tb].forEach(src => { for (const k in (src || {})) if (!(off[k] >= src[k])) off[k] = src[k]; });
    for (const k in off) {
      if (!on[k]) continue;
      if (off[k] > on[k]) delete on[k];   /* un-ticked after the tick */
      else delete off[k];                 /* tombstone spent */
    }
    return { on: on, off: off };
  }

  function mergeAttempts(A, B, firstKey) {
    const out = {};
    const ids = {};
    for (const k in (A || {})) ids[k] = true;
    for (const k in (B || {})) ids[k] = true;
    for (const id in ids) {
      const x = (A || {})[id], y = (B || {})[id];
      if (!x || !y) { out[id] = JSON.parse(JSON.stringify(x || y)); continue; }
      const rec = { tries: Math.max(x.tries || 0, y.tries || 0) };

      /* the honest first attempt is the earliest one either device saw */
      const fx = x.first ? (x.firstAt || (x.first.at || 0)) : Infinity;
      const fy = y.first ? (y.firstAt || (y.first.at || 0)) : Infinity;
      const first = fx <= fy ? x : y;
      if (first.first) {
        rec.first = first.first;
        if (first.firstAt) rec.firstAt = first.firstAt;
      }

      /* the latest pass is the one worth showing */
      const lx = x.lastAt || (x.last && x.last.at) || 0;
      const ly = y.lastAt || (y.last && y.last.at) || 0;
      const last = lx >= ly ? x : y;
      if (last.last) {
        rec.last = last.last;
        if (last.lastAt) rec.lastAt = last.lastAt;
      }
      /* The schedule travels with the latest pass. Rebuilding the record field
         by field is what drops anything not named here, so a new field has to
         be added in BOTH places or every sync quietly resets it. */
      if (last.box != null) rec.box = last.box;
      out[id] = rec;
    }
    return out;
  }

  function mergeStates(A, B) {
    A = upgrade(A); B = upgrade(B);
    const done = mergeFlags(A.done, B.done, A.undone, B.undone);
    const proof = mergeFlags(A.proofs, B.proofs, A.unproofs, B.unproofs);

    const write = {};
    [A.write, B.write].forEach(function (src) {
      for (const k in (src || {})) {
        if (!write[k] || (src[k].at || 0) > (write[k].at || 0)) write[k] = src[k];
      }
    });

    /* preferences are per-key: the device that set it most recently wins, and
       a key with no stamp yields to one that has it */
    const prefs = {}, prefsAt = {};
    [[A.prefs, A.prefsAt, A.updated], [B.prefs, B.prefsAt, B.updated]].forEach(function (p) {
      const src = p[0] || {}, at = p[1] || {}, fallback = p[2] || 0;
      for (const k in src) {
        const t = at[k] || fallback;
        if (!(k in prefs) || t >= (prefsAt[k] || 0)) { prefs[k] = src[k]; prefsAt[k] = t; }
      }
    });

    /* Day counters: the larger count survives. Two devices can both have
       counted the same review, so max is the honest bound and it is
       order-independent; summing would double-count every merge. */
    const daysOut = {};
    [A.days, B.days].forEach(function (src) {
      for (const k in (src || {})) {
        const row = src[k] || {};
        const out = daysOut[k] || (daysOut[k] = {});
        for (const f in row) {
          if (f === 'at') { if (!(out.at >= row.at)) out.at = row.at; continue; }
          if (!(out[f] >= row[f])) out[f] = row[f];
        }
      }
    });
    /* Reasons and confidence records: the latest stamp wins. */
    function latest(X, Y) {
      const out = {};
      [X, Y].forEach(function (src) {
        for (const k in (src || {})) {
          if (!out[k] || (src[k].at || 0) > (out[k].at || 0)) out[k] = src[k];
        }
      });
      return out;
    }

    return {
      v: 3,
      done: done.on, undone: done.off,
      proofs: proof.on, unproofs: proof.off,
      cards: mergeAttempts(A.cards, B.cards),
      omr: mergeAttempts(A.omr, B.omr),
      write: write,
      days: daysOut,
      errs: latest(A.errs, B.errs),
      cal: latest(A.cal, B.cal),
      prefs: prefs, prefsAt: prefsAt,
      updated: Math.max(A.updated || 0, B.updated || 0)
    };
  }

  /* Adopt a merged state wholesale. `quiet` keeps the sync listener from
     firing on the state it has just pulled. */
  function adopt(next, quiet) {
    state = upgrade(next);
    save(quiet);
    return state;
  }

  const snapshot = () => JSON.parse(JSON.stringify(state));
  function exportJSON() { return JSON.stringify(state, null, 2); }
  function reset() { state = blank(); save(); }

  /* what the summary tiles count, so two callers cannot disagree */
  function tally() {
    return {
      notes: Object.keys(state.done).length,
      proofs: Object.keys(state.proofs).length,
      cards: Object.keys(state.cards).filter(k => state.cards[k].first).length,
      omr: Object.keys(state.omr).filter(k => state.omr[k].first).length
    };
  }

  return {
    isDone, setDone, setDoneMany,
    isProofDone, setProofDone,
    card, gradeCard, omr, lockOmr, draft, saveDraft,
    dayKey, bump, day, days,
    err, tagError, clearError, errs,
    recordConfidence, cal,
    pref, setPref,
    identity, signedIn, signIn, signOut,
    summary, exportJSON, reset, tally,
    snapshot, adopt, mergeStates, onChange, flushNow,
    isVolatile: () => volatile
  };
})();


/* ── src/core.sync.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Multi-device sync.

   Firebase Realtime Database over plain REST — no SDK, no npm, no auth
   handshake, nothing to load before the app can start. One GET and one PUT.

   The key is the learner's name and roll number. That is a pass key, not a
   password: anyone who knows both can read and write that record, and the UI
   says so plainly rather than implying a login. It is the right trade for a
   personal study record that has to follow one person between a phone and a
   laptop with no account to create.

   Every sync MERGES before it writes (Store.mergeStates), so two devices that
   both worked offline lose nothing and the order they reconnect in does not
   matter. Overwriting instead of merging is how a week of work disappears.
   ══════════════════════════════════════════════════════════════════════════ */

const Sync = (function () {

  const DB = 'https://task-dominion-default-rtdb.asia-southeast1.firebasedatabase.app';

  /* Mock and validated pools keep SEPARATE STORES — progress and the sign-in
     register both. Their ids do not mean the same things, and a name typed
     into the test build must never appear in, or merge with, the real record.
     This is the only place that mapping is decided.

        live   sslc_v1        sslc_users_v1
        mock   sslc_mock_v1   sslc_users_mock_v1

     SSLC used to share the Real Analysis namespace ('ssc4_ra_v1'), so the
     same name and roll number in both apps merged two unrelated records into
     one. The first sync under the new namespace pulls the record left under
     the old one, once, so nothing already synced is lost. */
  const LIVE = () => (typeof DATA_KIND !== 'undefined' && DATA_KIND === 'live');
  const NS = () => LIVE() ? 'sslc_v1' : 'sslc_mock_v1';
  const USERS = () => LIVE() ? 'sslc_users_v1' : 'sslc_users_mock_v1';
  const LEGACY_NS = () => LIVE() ? 'ssc4_ra_v1' : 'ssc4_ra_mock_v1';

  let syncing = false;
  let pushT = 0;
  let last = { at: 0, ok: null, msg: '' };
  const watchers = [];

  const slug = s => String(s || '').toLowerCase().trim()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');

  /* name + roll -> one stable key. Both are required: a roll number alone
     collides across colleges, a name alone collides across people.
