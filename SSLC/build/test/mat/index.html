    });

    objective.forEach(function (q) {
      const targets = [].concat(q.tests || [], q.concept ? [q.concept] : []);
      targets.forEach(t => (objFor[t] || (objFor[t] = [])).push(q));
    });
    written.forEach(function (q) {
      const targets = [].concat(q.tests || [], q.concept ? [q.concept] : []);
      targets.forEach(t => (writFor[t] || (writFor[t] = [])).push(q));
    });

    /* Level 2/3 exercises are indexed by section */
    written.forEach(function (q) {
      const secs = {};
      if (q.sec) secs[q.sec] = true;
      const targets = [].concat(q.tests || [], q.concept ? [q.concept] : []);
      targets.forEach(function (t) {
        const c = byId[t];
        if (c && c.sec) secs[c.sec] = true;
      });
      Object.keys(secs).forEach(function (sec) {
        (writSec[sec] || (writSec[sec] = [])).push(q);
      });
    });
  }

  /* every in-course section, in display order */
  function sections(courseId) {
    const out = [];
    courses.forEach(function (course) {
      if (courseId && course.id !== courseId) return;
      (course.modules || []).forEach(mod => (mod.secs || []).forEach(sec => out.push({
        sec: sec, title: sectionTitle(sec), course: course, module: mod,
        concepts: bySec[sec] || []
      })));
    });
    return out;
  }

  const sectionTitle = sec => {
    const t = titles[sec];
    if (!t) return (typeof I18N !== 'undefined' && I18N.lang() === 'ml' ? 'ഭാഗം ' : 'Section ') + sec;
    if (typeof t === 'object') return (typeof I18N !== 'undefined') ? I18N.pick(t) : (t.en || t.ml);
    return t;
  };
  const concept = id => byId[id] || null;
  const course = id => courses.filter(c => c.id === id)[0] || null;
  const courseOfSec = sec => (secMeta[sec] && secMeta[sec].course) || null;
  const moduleOfSec = sec => (secMeta[sec] && secMeta[sec].module) || null;
  const objectiveFor = cid => objFor[cid] || [];
  const writtenFor = cid => writFor[cid] || [];
  const writtenForSec = sec => writSec[sec] || [];
  const objectiveOne = id => objective.filter(q => q.id === id)[0] || null;

  /* Past papers for one course, newest paper first; every one of them when no
     course is named. */
  const pyqFor = courseId => courseId ? (pyqBy[courseId] || []).slice() : pyq.slice();

  function isExtSec(sec) {
    if (!sec) return false;
    if (extSecs[sec]) return true;
    const meta = secMeta[sec];
    if (meta && meta.module) {
      if (meta.module.ext) return true;
      if (meta.module.extSecs && meta.module.extSecs.indexOf(sec) >= 0) return true;
    }
    return false;
  }

  function isExt(conceptOrId) {
    const c = typeof conceptOrId === 'string' ? byId[conceptOrId] : conceptOrId;
    if (!c) return false;
    if (c.tier === 'ext') return true;
    if (c.sec && isExtSec(c.sec)) return true;
    return false;
  }

  /* concepts of the whole slice, in reading order */
  function conceptList(courseId, opts) {
    const o = opts || {};
    const out = [];
    sections(courseId).forEach(s => s.concepts.forEach(function (c) {
      if (!o.includeExt && isExt(c)) return;
      out.push(c);
    }));
    return out;
  }

  /* Prerequisite chain, deepest first, ending at `id` itself. Depth-first over
     `needs`, de-duplicated, cycle-safe — this is what the note view walks. */
  function chain(id, limit) {
    const out = [], seen = {};
    (function walk(at, depth) {
      if (!byId[at] || seen[at] || depth > (limit == null ? 4 : limit)) return;
      seen[at] = true;
      (byId[at].needs || []).forEach(n => walk(n, depth + 1));
      out.push(byId[at]);
    })(id, 0);
    return out;
  }

  const unlocks = id => (neededBy[id] || []).slice();

  /* previous / next concept in reading order across the whole pool */
  function neighbours(id) {
    const all = conceptList(null, { includeExt: true });
    const i = all.map(c => c.id).indexOf(id);
    if (i < 0) return { prev: null, next: null };
    return { prev: all[i - 1] || null, next: all[i + 1] || null };
  }

  /* ids used for progress denominators */
  const ids = {
    concepts: courseId => conceptList(courseId, { includeExt: false }).map(c => c.id),
    allConcepts: courseId => conceptList(courseId, { includeExt: true }).map(c => c.id),
    cards: () => deck.filter(c => !isExt(c.cid)).map(c => c.id),
    allCards: () => deck.map(c => c.id),
    objective: () => objective.map(q => q.id),
    /* Level 4's denominator: the past papers filed against a course. */
    pyq: courseId => pyqFor(courseId).map(q => q.id),
    /* Level 2 counts proof work, so its denominator is the concepts that
       actually carry a proof — not every note. */
    proofs: courseId => conceptList(courseId, { includeExt: false }).filter(c => c.proof).map(c => c.id),
    allProofs: courseId => conceptList(courseId, { includeExt: true }).filter(c => c.proof).map(c => c.id),
    /* Level 3's denominator: every exercise reachable from a course's own
       sections, de-duplicated, because one exercise may span two sections. */
    written: function (courseId) {
      const seen = {}, out = [];
      sections(courseId).forEach(s => writtenForSec(s.sec).forEach(function (q) {
        if (seen[q.id]) return;
        seen[q.id] = true;
        out.push(q.id);
      }));
      return out;
    }
  };

  return {
    build, sections, sectionTitle, concept, concepts: conceptList, course,
    courses: () => courses, courseOfSec, moduleOfSec, deck: () => deck,
    objective: () => objective, objectiveOne, objectiveFor, writtenFor, writtenForSec,
    written: () => written, pyq: pyqFor,
    background: () => background, chain, unlocks, neighbours, ids,
    isExtSec, isExt, isMock: () => mock
  };
})();


/* ── src/core.progress.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Levels, earned — never switched.

   There is no level control. A learner does not *choose* to be at level 2;
   they get there by working the proof. The level of a concept is derived, in
   one place, from what has actually been done:

     level 1   read. You have been through the material.                RED
     level 2   its proof worked through. A note with NO proof reaches    AMBER
               level 2 with the tick, because there is no proof to work.
     level 3   every exercise filed against this concept's SECTION       GREEN
               worked through. A section with NO exercises reaches
               level 3 with level 2, because there is nothing to work.

   Nothing is ever held back by a stage that does not exist: a definition with
   no proof, in a section with no exercises, is green the moment it is read.
   That is the whole of rule 12 — a missing stage promotes, it does not cap.

   A group (section, module, course) is at the level its *weakest* member has
   reached — all red before the group is red, all amber before the group is
   amber. That is what the coloured rings and bars draw.

   LEVEL 4 IS A COURSE RUNG AND ONLY A COURSE RUNG. Concepts, sections and
   modules top out at 3. A course reaches 4 — "all complete" — when every note
   in it is green AND every JAM past-paper question filed against it has been
   worked through. See `courseLevel`.

   `Store` knows four independent facts and nothing about courses: a concept
   was read, and a task was worked through (a proof, keyed on the concept id;
   an exercise, keyed 'w:<questionId>'; a past-paper question, keyed
   'p:<questionId>'). `Pool` knows structure and no progress. This is the one
   place the two meet, so "done" cannot mean two different things on two
   screens.
   ══════════════════════════════════════════════════════════════════════════ */

const Progress = (function () {

  const courseIdOf = function (c) {
    if (!c) return null;
    const course = Pool.courseOfSec(c.sec);
    return course ? course.id : null;
  };

  const hasProof = id => {
    const c = Pool.concept(id);
    return !!(c && c.proof);
  };

  /* ── level 3 tasks ───────────────────────────────────────────────────────
     The written/Bartle exercises attached to a section. They are stored in the
     same flag map as proof work, under a 'w:' key, so they merge across
     devices exactly like every other tick. */
  const taskKey = q => 'w:' + q.id;
  const taskDone = q => Store.isProofDone(taskKey(q));

  /* ── level 4 tasks ───────────────────────────────────────────────────────
     The JAM past-paper questions attached to a COURSE, under a 'p:' key. */
  const pyqKey = q => 'p:' + q.id;
  const pyqDone = q => Store.isProofDone(pyqKey(q));

  /* secTaskState is asked once per concept per repaint, so it is memoised and
     the cache is dropped whenever anything is written. */
  let secCache = {};
  if (Store.onChange) Store.onChange(function () { secCache = {}; });
  const dropCache = () => { secCache = {}; };

  function secTasks(sec) {
    const qs = (sec && Pool.writtenForSec) ? Pool.writtenForSec(sec) : [];
    const done = qs.filter(taskDone).length;
    /* `ready` is true for an EMPTY set too: nothing owed is nothing owed. */
    return { total: qs.length, done: done, ready: done === qs.length, list: qs };
  }

  function secTaskState(sec) {
    if (!sec) return { total: 0, done: 0, ready: true, list: [] };
    if (!secCache[sec]) secCache[sec] = secTasks(sec);
    return secCache[sec];
  }

  /* Every concept can now reach 3 (or 2 for foundation). */
  const ceiling = id => {
    if (!id) return 3;
    const c = Pool.concept(id);
    return (c && courseIdOf(c) === 'foundation') ? 2 : 3;
  };
  const ceilingOf = id => ceiling(id);

  /* ── the level of one concept (0: not started, 1: read, 2: exercises, 3: PYQ) ── */
  function level(id) {
    if (!Store.isDone(id)) return 0;
    const c = Pool.concept(id);
    if (!c) return 1;
    // Level 1: Read. Exercises must be completed to reach Level 2.
    if (!secTaskState(c.sec).ready) return 1;
    // Level 2: Exercises done. Past exam papers (PYQ) must be completed to reach Level 3.
    const courseId = courseIdOf(c);
    if (!courseId || courseId === 'foundation') return 2;
    return pyqState(courseId).ready ? 3 : 2;
  }

  /* kept for the few places that only care whether a note has been met */
  const isDone = id => level(id) >= 1;

  /* ── the level of a whole course, 0–3 ────────────────────────────────────
     0: not started, 1: read, 2: exercises done, 3: PYQs done */
  function pyqState(courseId) {
    const qs = Pool.pyq(courseId);
    const done = qs.filter(pyqDone).length;
    return { total: qs.length, done: done, ready: qs.length > 0 && done === qs.length, list: qs };
  }

  function courseLevel(courseId) {
    const c = count(Pool.ids.concepts(courseId));
    if (courseId === 'foundation') return Math.min(2, c.min);
    if (c.min < 2) return c.min;
    return pyqState(courseId).ready ? 3 : 2;
  }

  /* ── ticking ─────────────────────────────────────────────────────────────
     One press marks read (Level 1), or clears. */
  function advance(id) {
    const at = level(id);
    if (at === 0) {
      Store.setDone(id, true);
    } else {
      clear(id);
    }
    dropCache();
    return level(id);
  }

  /* Mark a note read without ever pulling it back down */
  function complete(id) {
    if (!Store.isDone(id)) Store.setDone(id, true);
    dropCache();
    return level(id);
  }

  function clear(id) {
    Store.setDone(id, false);
    dropCache();
  }

  /* Put a list of concepts AT a given level (0 or 1). */
  function setTo(ids, n) {
    const list = ids || [];
    const want = Math.max(0, Math.min(1, n));
    Store.setDoneMany(list, want >= 1);
    dropCache();
  }

  /* one press on a section / module / course row */
  function advanceMany(ids) {
    const c = count(ids);
    if (!c.total) return 0;
    if (c.min === 0) setTo(ids, 1);
    else setTo(ids, 0);
    return count(ids).min;
  }

  /* ── counting ─────────────────────────────────────────────────────────────
     l1/l2/l3 are cumulative — "how many have reached at least this level" —
     because that is what the three-colour bar draws, and `min` is the level
     the whole group has reached. */
  function count(ids) {
    const list = ids || [];
    const isFnd = list.length > 0 && list.every(id => {
      const c = Pool.concept(id);
      return c && courseIdOf(c) === 'foundation';
    });
    const maxLv = isFnd ? 2 : 3;
    let l1 = 0, l2 = 0, l3 = 0, min = maxLv;
    list.forEach(function (id) {
      const v = level(id);
      if (v >= 1) l1 += 1;
      if (v >= 2) l2 += 1;
      if (v >= 3) l3 += 1;
      if (v < min) min = v;
    });
    if (!list.length) min = 0;
    return { total: list.length, l1: l1, l2: l2, l3: l3, min: min, done: l1, isFnd: isFnd, maxLv: maxLv };
  }

  /* what a tick button should render: 'true' | 'mixed' | 'false' */
  function tickState(ids) {
    const c = count(ids);
    if (!c.total) return 'false';
    if (c.min >= 1) return 'true';
    return c.l1 ? 'mixed' : 'false';
  }

  /* ── prerequisites ───────────────────────────────────────────────────────
     A prerequisite is satisfied once it has been READ. Nothing more is asked:
     holding a note hostage to the proof work of everything under it made the
     groundwork look permanently outstanding, and that is not what a
     prerequisite is for. */
  const prereqTarget = () => 1;
  const prereqOk = prereqId => level(prereqId) >= 1;

  /* Prerequisites of `id` that have not been read. */
  function pendingPrereqs(id) {
    return Pool.chain(id).filter(x => x.id !== id && !prereqOk(x.id));
  }

  /* Raise them to level 1 — and no further, so a cascade never promotes work
     nobody did. */
  function raisePrereqs(id) {
    const pending = pendingPrereqs(id);
    pending.forEach(function (x) {
      if (level(x.id) < 1) setTo([x.id], 1);
    });
    dropCache();
    return pending.length;
  }

  /* ── the reel queue: spaced practice ─────────────────────────────────────
     The reel only ever shows material you have said you have met. Studying a
     statement you have never read is not recall, it is reading with extra
     steps.

     Four kinds of card, and each arrives by a different act — so ticking
     topics, proofs AND questions all feed the reel:

       statement   a ticked concept's cards (state, recall, apply, trap)
       proof       a ticked concept that carries a proof
       question    an objective question whose tested concept has been read
       exercise    a written exercise you have marked complete

     Order is spaced practice, not a fixed ranking. Each card sits in a
     Leitner box that rises when you state it, holds when you half-state it
     and resets when you miss it; the box picks how long the card is put away
     for. Everything due (and everything never attempted) comes first, in
     RANDOM order — so no two passes are the same — and everything not yet due
     follows, soonest first. A card you know well is therefore a long way back
     without ever being dropped.

     Nothing repeats within a pass: the queue is a list, and the reel walks it
     once. */
  const HOUR = 3600e3, DAY = 24 * HOUR;
  const INTERVAL = [10 * 60e3, HOUR, DAY, 3 * DAY, 7 * DAY, 21 * DAY];

  function dueAt(cardId) {
    const rec = Store.card(cardId);
    if (!rec || !rec.lastAt) return 0;              /* never attempted — due now */
    const b = Math.max(0, Math.min(rec.box || 0, INTERVAL.length - 1));
    return rec.lastAt + INTERVAL[b];
  }

  /* what one grade does to the box — mirrored in Store.gradeCard */
  function nextBox(box, grade) {
    if (grade === 'got') return Math.min((box || 0) + 1, INTERVAL.length - 1);
    if (grade === 'partly') return Math.max(0, (box || 0) - 1);
    return 0;
  }

  function pool() {
    const out = [];

    Pool.deck().forEach(function (card, i) {
      if (!Store.isDone(card.cid)) return;
      out.push({
        kind: 'state', id: card.id, cid: card.cid, sec: card.sec,
        title: card.title, conceptKind: card.kind,
        q: card.q, a: card.a, order: i
      });
    });

    Pool.concepts(null, { includeExt: true }).forEach(function (c, i) {
      if (!c.proof || !Store.isDone(c.id)) return;
      out.push({
        kind: 'proof', id: c.id + '#proof', cid: c.id, sec: c.sec,
        title: c.title, conceptKind: c.kind, proof: c.proof, order: i + 0.5
      });
    });

    /* an objective question joins once anything it examines has been read.
       The live pool names its target as `concept`; the mock pool as `tests`. */
    Pool.objective().forEach(function (q, i) {
      const tested = (q.tests || []).concat(q.concept ? [q.concept] : []).filter(id => Pool.concept(id));
      if (!tested.length || !tested.some(id => Store.isDone(id))) return;
      const c = Pool.concept(tested[0]);
      out.push({
        kind: 'question', id: 'q:' + q.id, cid: c.id, sec: q.sec || c.sec,
        title: c.title, conceptKind: q.type, question: q, order: 1000 + i
      });
    });

    /* an exercise joins once you have marked it worked through */
    Pool.written().forEach(function (q, i) {
      if (!taskDone(q)) return;
      const c = Pool.concept((q.tests || [])[0] || q.concept);
      out.push({
        kind: 'exercise', id: 'x:' + q.id, cid: c ? c.id : null, sec: q.sec || (c && c.sec),
        title: q.title || (c ? c.title : q.id), conceptKind: 'exercise',
        question: q, order: 2000 + i
      });
    });

    return out;
  }

  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = list[i]; list[i] = list[j]; list[j] = t;
    }
    return list;
  }

  function reel(opts) {
    const o = opts || {};
    const now = Date.now();
    let all = pool();
    if (o.onlyNew) all = all.filter(x => !(Store.card(x.id) || {}).first);
    if (o.exclude) all = all.filter(x => !o.exclude[x.id]);

    const due = [], later = [];
    all.forEach(function (x) {
      x.due = dueAt(x.id);
      (x.due <= now ? due : later).push(x);
    });
    shuffle(due);
    later.sort((a, b) => a.due - b.due);
    return due.concat(later);
  }

  /* every id the reel could ever contain, for the "n of m attempted" meter */
  function reelIds() {
    return pool().map(x => x.id);
  }

  return {
    level, courseLevel, ceiling, ceilingOf, isDone, hasProof, courseIdOf,
    advance, advanceMany, complete, clear, setTo,
    count, tickState,
    secTaskState, taskKey, taskDone,
    pyqKey, pyqDone, pyqState,
    prereqTarget, prereqOk, pendingPrereqs, raisePrereqs,
    reel, reelIds, nextBox, dueAt, dropCache
  };
})();


/* ── src/core.study.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The study engine — what the learning research says to do today.

   `Progress` knows levels and the spaced queue; `Store` knows what happened.
   This is the layer that turns those into a plan, and every rule in it has a
   source (see LEARNING_SCIENCE.md at the project root):

     retrieval first     Karpicke & Roediger 2008; Brown, Roediger & McDaniel,
                         "Make It Stick". The plan opens with what is due,
                         never with reading.
     spacing             Ebbinghaus; Cepeda et al. 2006; Leitner boxes are in
                         core.progress.js. `due()` counts them.
     interleaving        Rohrer & Taylor 2007; Rohrer, Dedrick & Stershic 2015.
                         The reel and the drill mix chapters by default.
     deliberate practice Ericsson, "Peak". `weakSpots()` ranks concepts by
                         misses so practice is aimed, not spread.
     calibration         Dunlosky et al. 2013; Koriat & Bjork on the illusion
                         of knowing. `calibration()` compares confidence with
                         outcome.
     error analysis      Metcalfe 2017 on learning from errors; the "mistake
                         notebook" every maths teacher recommends. `mistakes()`
                         aggregates the tags.
     habits and streaks  Clear, "Atomic Habits"; Fogg. Small daily goal, never
                         miss twice, one card counts.
     focused blocks      Cirillo's Pomodoro; Oakley, "A Mind for Numbers" on
                         focused and diffuse modes. `Focus` is the timer.
     exam pacing         The SSLC maths paper: 80 marks, 2 h 30 min writing
                         plus 15 min cool-off. `exam()` counts down and
                         `blueprint()` states the paper.
   ══════════════════════════════════════════════════════════════════════════ */

const Study = (function () {

  const DAY = 24 * 3600e3;

  /* ── daily goal ──────────────────────────────────────────────────────── */
  const GOALS = {
    light:  { reviews: 10, reads: 1, exercises: 1, questions: 3 },
    normal: { reviews: 20, reads: 2, exercises: 2, questions: 6 },
    exam:   { reviews: 40, reads: 3, exercises: 4, questions: 12 }
  };
  const goalKey = () => Store.pref('goal', 'normal');
  const goal = () => GOALS[goalKey()] || GOALS.normal;
  function setGoal(k) { if (GOALS[k]) Store.setPref('goal', k); }

  function todayLog() {
    return Store.day() || {};
  }

  function goalState() {
    const g = goal(), d = todayLog();
    const rows = ['reviews', 'reads', 'exercises', 'questions'].map(function (k) {
      return { key: k, done: Math.min(d[k] || 0, g[k]), raw: d[k] || 0, want: g[k] };
    });
    const met = rows.every(r => r.done >= r.want);
    const pct = Math.round(100 * rows.reduce((a, r) => a + r.done / r.want, 0) / rows.length);
    return { rows: rows, met: met, pct: pct, key: goalKey() };
  }

  /* ── streaks ─────────────────────────────────────────────────────────────
     A day counts when anything at all was done on it. The current streak may
     end today or yesterday: a learner who has not opened the app yet this
     morning has not broken anything. */
  function active(row) {
    if (!row) return false;
    return ['reviews', 'reads', 'exercises', 'questions', 'pyq', 'focus'].some(k => (row[k] || 0) > 0);
  }

  function streak() {
    const days = Store.days();
    const keys = Object.keys(days).filter(k => active(days[k])).sort();
    if (!keys.length) return { current: 0, best: 0, today: false };

    const set = {};
    keys.forEach(k => { set[k] = true; });
    const today = Store.dayKey();
    const yesterday = Store.dayKey(new Date(Date.now() - DAY));

    function runEndingAt(key) {
      let n = 0, d = new Date(key + 'T12:00:00');
      while (set[Store.dayKey(d)]) { n += 1; d = new Date(d.getTime() - DAY); }
      return n;
    }
    const current = set[today] ? runEndingAt(today) : (set[yesterday] ? runEndingAt(yesterday) : 0);

    /* the best run: measure forward from every day that starts one */
    let best = 0;
    keys.forEach(function (k) {
      const prev = Store.dayKey(new Date(new Date(k + 'T12:00:00').getTime() - DAY));
      if (set[prev]) return;
      let n = 0, d = new Date(k + 'T12:00:00');
      while (set[Store.dayKey(d)]) { n += 1; d = new Date(d.getTime() + DAY); }
      best = Math.max(best, n);
    });
    return { current: current, best: Math.max(best, current), today: !!set[today] };
  }

  /* ── what is due ─────────────────────────────────────────────────────── */
  function due() {
    const now = Date.now();
    const all = Progress.reel();
    let dueN = 0, fresh = 0;
    all.forEach(function (x) {
      if (x.due <= now) { dueN += 1; if (!(Store.card(x.id) || {}).first) fresh += 1; }
    });
    return { due: dueN, fresh: fresh, later: all.length - dueN, total: all.length };
  }

  /* ── weak spots ──────────────────────────────────────────────────────────
     Misses are counted per concept from three places: a card's first grade,
     a card's current box (0 means it was missed last time), and a question's
     first verdict. Recent misses weigh more than old ones. */
  function weakSpots(limit) {
    const score = {};
    const now = Date.now();
    const bump = (cid, w) => { if (cid) score[cid] = (score[cid] || 0) + w; };
    const recency = at => at ? Math.max(0.4, 1 - (now - at) / (30 * DAY)) : 0.6;

    Pool.deck().forEach(function (card) {
      const rec = Store.card(card.id);
      if (!rec) return;
      if (rec.first === 'missed') bump(card.cid, 1.0 * recency(rec.firstAt));
      else if (rec.first === 'partly') bump(card.cid, 0.5 * recency(rec.firstAt));
      if (rec.last === 'missed' && rec.tries > 1) bump(card.cid, 1.0 * recency(rec.lastAt));
      if ((rec.box || 0) === 0 && rec.tries > 1) bump(card.cid, 0.5);
    });
    Pool.objective().forEach(function (q) {
      const rec = Store.omr(q.id);
      if (!rec || !rec.first) return;
      const cid = (q.tests || [])[0] || q.concept;
      if (rec.first.verdict === 'wrong') bump(cid, 1.2 * recency(rec.first.at));
      else if (rec.first.verdict === 'partial') bump(cid, 0.5 * recency(rec.first.at));
      if (rec.last && rec.last.verdict === 'wrong' && rec.tries > 1) bump(cid, 0.8 * recency(rec.last.at));
    });
    const errs = Store.errs();
    Object.keys(errs).forEach(function (k) {
      const e = errs[k];
      if (e && e.cid) bump(e.cid, 0.3);
    });

    return Object.keys(score)
      .map(cid => ({ c: Pool.concept(cid), cid: cid, score: score[cid] }))
      .filter(x => x.c && x.score >= 0.75)
      .sort((a, b) => b.score - a.score)
      .slice(0, limit || 6)
      .map(function (x) { x.misses = Math.round(x.score * 10) / 10; return x; });
  }

  const weakIds = () => {
    const out = {};
    weakSpots(40).forEach(x => { out[x.cid] = true; });
    return out;
  };

  /* ── calibration ─────────────────────────────────────────────────────── */
  function calibration() {
    const cal = Store.cal();
    const out = { n: 0, sureRight: 0, sureWrong: 0, unsureRight: 0, unsureWrong: 0, verdict: 'few' };
    Object.keys(cal).forEach(function (k) {
      const r = cal[k];
      if (!r) return;
      out.n += 1;
      const sure = r.c >= 3;
      if (sure && r.ok) out.sureRight += 1;
      else if (sure && !r.ok) out.sureWrong += 1;
      else if (!sure && r.ok) out.unsureRight += 1;
      else out.unsureWrong += 1;
    });
    if (out.n >= 5) {
      const over = out.sureWrong / Math.max(1, out.sureRight + out.sureWrong);
      const under = out.unsureRight / Math.max(1, out.unsureRight + out.unsureWrong);
      out.verdict = over > 0.3 ? 'over' : under > 0.6 ? 'under' : 'good';
    }
    return out;
  }

  /* ── the mistake log, aggregated ─────────────────────────────────────── */
  const WHYS = ['careless', 'formula', 'method', 'misread', 'unknown'];
  function mistakes() {
    const errs = Store.errs();
    const by = {}, byC = {};
    let n = 0;
    WHYS.forEach(w => { by[w] = 0; });
    Object.keys(errs).forEach(function (k) {
      const e = errs[k];
      if (!e || !e.why) return;
      n += 1;
      by[e.why] = (by[e.why] || 0) + 1;
      if (e.cid) byC[e.cid] = (byC[e.cid] || 0) + 1;
    });
    const top = WHYS.map(w => ({ why: w, n: by[w] })).sort((a, b) => b.n - a.n);
    return { n: n, by: by, top: top, concepts: byC };
  }

  /* ── the exam ────────────────────────────────────────────────────────── */
  function defaultExamDate() {
    /* The data may name the exam; otherwise the SSLC paper is in March. */
    const tracks = (typeof TRACKS !== 'undefined' && Array.isArray(TRACKS)) ? TRACKS : [];
    const named = tracks.filter(t => t.required && t.isoDate)[0];
    const now = new Date();
    if (named && new Date(named.isoDate) > now) return named.isoDate;
    const year = now.getMonth() >= 2 ? now.getFullYear() + 1 : now.getFullYear();
    return year + '-03-10';
  }

  function exam() {
    const iso = Store.pref('examDate', '') || defaultExamDate();
    const at = new Date(iso + 'T09:30:00');
    const days = Math.ceil((at.getTime() - Date.now()) / DAY);
    /* how much of Class 10 still has to be read once, spread over the days left */
    const ids = Pool.ids.concepts('m10');
    const left = ids.filter(id => Progress.level(id) < 1).length;
    const perDay = days > 0 ? Math.ceil(left / days * 10) / 10 : left;
    return { iso: iso, at: at, days: days, left: left, perDay: perDay, custom: !!Store.pref('examDate', '') };
  }
  function setExamDate(iso) { Store.setPref('examDate', iso || ''); }

  /* The SSLC mathematics paper, as the learner will meet it. */
  const BLUEPRINT = {
    marks: 80, internal: 20, writingMin: 150, coolOffMin: 15,
    sections: [
      { marks: 2, count: 4 }, { marks: 3, count: 6 }, { marks: 4, count: 11 }, { marks: 5, count: 8 }
    ]
  };
  const blueprint = () => BLUEPRINT;

  /* ── the plan for today ──────────────────────────────────────────────────
     Ordered by what the evidence says pays most: retrieval of what is due,
     then aimed practice on what is weak, then one or two NEW notes, then an
     exercise worked in four steps, then a timed mixed drill, then explaining
     today's note back in your own words. */
  function plan() {
    const d = due();
    const weak = weakSpots(6);
    const g = goal(), log = todayLog();
    const steps = [];

    steps.push({
      kind: 'review', n: d.due, ready: d.due > 0,
      done: (log.reviews || 0) >= g.reviews,
      href: 'recall', count: (log.reviews || 0) + '/' + g.reviews
    });
    if (weak.length) {
      steps.push({ kind: 'weak', n: weak.length, ready: true, done: false, href: 'recall?mode=weak', items: weak });
    }

    const next = Pool.concepts('m10').filter(c => Progress.level(c.id) === 0)[0]
      || Pool.concepts().filter(c => Progress.level(c.id) === 0)[0] || null;
    steps.push({
      kind: 'read', concept: next, ready: !!next,
      done: (log.reads || 0) >= g.reads,
      href: next ? 'note/' + next.id : 'study', count: (log.reads || 0) + '/' + g.reads
    });

    /* the next exercise owed on something already read */
    let ex = null, exTarget = null;
    const written = Pool.written();
    for (let i = 0; i < written.length && !ex; i++) {
      const q = written[i];
      if (Progress.taskDone(q)) continue;
      const c = Pool.concept((q.tests || [])[0] || q.concept);
      if (c && Progress.level(c.id) >= 1) { ex = q; exTarget = c; }
    }
    if (!ex) {
      for (let i = 0; i < written.length && !ex; i++) {
        if (!Progress.taskDone(written[i])) { ex = written[i]; exTarget = Pool.concept((ex.tests || [])[0] || ex.concept); }
      }
    }
    steps.push({
      kind: 'exercise', q: ex, concept: exTarget, ready: !!ex,
      done: (log.exercises || 0) >= g.exercises,
      href: exTarget ? 'note/' + exTarget.id : 'study', count: (log.exercises || 0) + '/' + g.exercises
    });

    const readIds = Pool.ids.allConcepts().filter(id => Progress.level(id) >= 1);
    const readSet = {}; readIds.forEach(id => { readSet[id] = true; });
    const poolQ = Pool.objective().filter(q => (q.tests || []).concat(q.concept ? [q.concept] : []).some(id => readSet[id]));
    steps.push({
      kind: 'drill', n: Math.min(10, poolQ.length), ready: poolQ.length >= 5,
      done: (log.questions || 0) >= g.questions,
      href: 'drill', count: (log.questions || 0) + '/' + g.questions
    });

    const readToday = todayReads()[0] || null;
    steps.push({ kind: 'teach', concept: readToday, ready: !!readToday, done: false,
      href: readToday ? 'note/' + readToday.id + '?teach=1' : 'study' });

    return steps;
  }

  /* concepts marked read today, newest first */
  function todayReads() {
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const snap = Store.snapshot();
    return Object.keys(snap.done || {})
      .filter(id => snap.done[id] >= start.getTime() && Pool.concept(id))
      .sort((a, b) => snap.done[b] - snap.done[a])
      .map(id => Pool.concept(id));
  }

  /* ── the focus timer ─────────────────────────────────────────────────────
     Wall-clock based, so a phone that sleeps still ends the block on time.
     The running block is kept in localStorage directly (not in the record):
     it is a property of this device and this hour, and it must never sync. */
  const Focus = (function () {
    const K = 'sslc.focus';
    const PRESETS = { short: [15, 3], normal: [25, 5], long: [45, 10] };
    let tickT = 0;
    const watchers = [];

    function read() {
      try { return JSON.parse(window.localStorage.getItem(K) || 'null'); } catch (e) { return null; }
    }
    function write(v) {
      try { if (v) window.localStorage.setItem(K, JSON.stringify(v)); else window.localStorage.removeItem(K); }
      catch (e) { /* a private window forgets the timer; nothing else breaks */ }
    }
    const preset = () => PRESETS[Store.pref('focusPreset', 'normal')] || PRESETS.normal;
    function setPreset(k) { if (PRESETS[k]) Store.setPref('focusPreset', k); }

    function state() {
      const s = read();
      if (!s) return { phase: 'idle', left: preset()[0] * 60e3, total: preset()[0] * 60e3 };
      const left = s.end - Date.now();
      if (left <= 0) {
        if (s.phase === 'focus' && !s.credited) {
          s.credited = true; write(s);
          Store.bump('focus', s.min);
          Store.bump('blocks', 1);
        }
        return { phase: s.phase, left: 0, total: s.min * 60e3, over: true, min: s.min };
      }
      return { phase: s.phase, left: left, total: s.min * 60e3, min: s.min };
    }

    function start(phase) {
      const p = preset();
      const min = phase === 'break' ? p[1] : p[0];
      write({ phase: phase || 'focus', end: Date.now() + min * 60e3, min: min, credited: false });
      loop();
      emit();
    }
    function stop() { write(null); emit(); }
    function emit() { const s = state(); watchers.forEach(fn => { try { fn(s); } catch (e) { /* never */ } }); }
    function loop() {
      window.clearInterval(tickT);
      tickT = window.setInterval(function () {
        const s = state();
        emit();
        if (s.phase === 'idle') window.clearInterval(tickT);
      }, 1000);
    }
    function watch(fn) { watchers.push(fn); if (read()) loop(); return state(); }
    function unwatch(fn) { const i = watchers.indexOf(fn); if (i >= 0) watchers.splice(i, 1); }
    const today = () => ({ min: (Store.day() || {}).focus || 0, blocks: (Store.day() || {}).blocks || 0 });

    return { state, start, stop, watch, unwatch, preset, setPreset, PRESETS, today };
  })();

  return {
    GOALS, goal, goalKey, setGoal, goalState,
    streak, due, weakSpots, weakIds, calibration, mistakes, WHYS,
    exam, setExamDate, blueprint, plan, todayReads, Focus
  };
})();


/* ── src/core.latex.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   LaTeX commands, offered the way a code editor offers them.

   The brief asks for "a compact palette of the LaTeX commands needed for the
   current theorem … contextual and small rather than an indiscriminate
   reference manual." A sheet of keys at the bottom of the screen satisfied
   the letter of that and failed the thumb: on a phone it covers the input you
   are typing into, and finding one symbol among sixty is slower than knowing
   how to spell it.

   So the catalogue is now a completion source. Type `\va` and the matches
   appear inline above the keyboard, ranked with the commands this theorem
   actually uses first. Tap one, or press Tab. When nothing is being typed the
   same strip shows the contextual commands, so discovery still works by
   thumb — which is what the palette was really for.
   ══════════════════════════════════════════════════════════════════════════ */

const Latex = (function () {

  const CARET = String.fromCharCode(1);   /* never appears in typed LaTeX */

  /* show = what the learner sees, ins = what gets typed, cmd = the macro name,
     alt = extra words that should also find it. */
  const CATALOG = [
    { g: 'Greek', show: 'ε', cmd: 'varepsilon', ins: '\\varepsilon ', desc: 'epsilon' },
    { g: 'Greek', show: 'δ', cmd: 'delta', ins: '\\delta ', desc: 'delta' },
    { g: 'Greek', show: 'Δ', cmd: 'Delta', ins: '\\Delta ', desc: 'big delta' },
    { g: 'Greek', show: 'η', cmd: 'eta', ins: '\\eta ' },
    { g: 'Greek', show: 'θ', cmd: 'theta', ins: '\\theta ' },
    { g: 'Greek', show: 'λ', cmd: 'lambda', ins: '\\lambda ' },
    { g: 'Greek', show: 'α', cmd: 'alpha', ins: '\\alpha ' },
    { g: 'Greek', show: 'β', cmd: 'beta', ins: '\\beta ' },
    { g: 'Greek', show: 'γ', cmd: 'gamma', ins: '\\gamma ' },
    { g: 'Greek', show: 'μ', cmd: 'mu', ins: '\\mu ' },
    { g: 'Greek', show: 'σ', cmd: 'sigma', ins: '\\sigma ' },
    { g: 'Greek', show: 'φ', cmd: 'varphi', ins: '\\varphi ', desc: 'phi' },
    { g: 'Greek', show: 'π', cmd: 'pi', ins: '\\pi ' },
    { g: 'Greek', show: 'ω', cmd: 'omega', ins: '\\omega ' },

    { g: 'Logic', show: '∀', cmd: 'forall', ins: '\\forall ', desc: 'for all' },
    { g: 'Logic', show: '∃', cmd: 'exists', ins: '\\exists ', desc: 'there exists' },
    { g: 'Logic', show: '∄', cmd: 'nexists', ins: '\\nexists ', desc: 'no such' },
    { g: 'Logic', show: '⟹', cmd: 'implies', ins: '\\implies ', desc: 'implies' },
    { g: 'Logic', show: '⟺', cmd: 'iff', ins: '\\iff ', desc: 'if and only if' },
    { g: 'Logic', show: '⇒', cmd: 'Rightarrow', ins: '\\Rightarrow ' },
    { g: 'Logic', show: '¬', cmd: 'neg', ins: '\\neg ', desc: 'not' },
    { g: 'Logic', show: '∧', cmd: 'wedge', ins: '\\wedge ', desc: 'and' },
    { g: 'Logic', show: '∨', cmd: 'vee', ins: '\\vee ', desc: 'or' },
    { g: 'Logic', show: 'text', cmd: 'text', ins: '\\text{' + CARET + '}', desc: 'words inside maths' },

    { g: 'Sets', show: 'ℝ', cmd: 'mathbb', needle: '\\mathbb{R}', ins: '\\mathbb{R}', desc: 'the reals', alt: 'R reals' },
    { g: 'Sets', show: 'ℕ', cmd: 'mathbb', needle: '\\mathbb{N}', ins: '\\mathbb{N}', desc: 'the naturals', alt: 'N naturals' },
    { g: 'Sets', show: 'ℚ', cmd: 'mathbb', needle: '\\mathbb{Q}', ins: '\\mathbb{Q}', desc: 'the rationals', alt: 'Q rationals' },
    { g: 'Sets', show: 'ℤ', cmd: 'mathbb', needle: '\\mathbb{Z}', ins: '\\mathbb{Z}', desc: 'the integers', alt: 'Z integers' },
    { g: 'Sets', show: '∈', cmd: 'in', ins: '\\in ', desc: 'belongs to' },
    { g: 'Sets', show: '∉', cmd: 'notin', ins: '\\notin ', desc: 'not in' },
    { g: 'Sets', show: '⊆', cmd: 'subseteq', ins: '\\subseteq ' },
    { g: 'Sets', show: '⊂', cmd: 'subset', ins: '\\subset ' },
    { g: 'Sets', show: '∪', cmd: 'cup', ins: '\\cup ', desc: 'union' },
    { g: 'Sets', show: '∩', cmd: 'cap', ins: '\\cap ', desc: 'intersection' },
    { g: 'Sets', show: '⋃', cmd: 'bigcup', ins: '\\bigcup_{' + CARET + '}' },
    { g: 'Sets', show: '⋂', cmd: 'bigcap', ins: '\\bigcap_{' + CARET + '}' },
    { g: 'Sets', show: '∅', cmd: 'emptyset', ins: '\\emptyset ', desc: 'empty set' },
    { g: 'Sets', show: '∖', cmd: 'setminus', ins: '\\setminus ', desc: 'set difference' },
    { g: 'Sets', show: '{ }', cmd: 'lbrace', ins: '\\{' + CARET + '\\}', desc: 'braces', alt: 'set brace' },

    { g: 'Relations', show: '≤', cmd: 'le', ins: '\\le ', desc: 'at most' },
    { g: 'Relations', show: '≥', cmd: 'ge', ins: '\\ge ', desc: 'at least' },
    { g: 'Relations', show: '≠', cmd: 'ne', ins: '\\ne ', desc: 'not equal' },
    { g: 'Relations', show: '≈', cmd: 'approx', ins: '\\approx ' },
    { g: 'Relations', show: '≡', cmd: 'equiv', ins: '\\equiv ' },
    { g: 'Relations', show: '↦', cmd: 'mapsto', ins: '\\mapsto ' },
    { g: 'Relations', show: '≔', cmd: 'coloneqq', ins: ':= ', desc: 'defined as' },

    { g: 'Analysis', show: '→', cmd: 'to', ins: '\\to ', desc: 'tends to' },
    { g: 'Analysis', show: '∞', cmd: 'infty', ins: '\\infty ', desc: 'infinity' },
    { g: 'Analysis', show: 'sup', cmd: 'sup', ins: '\\sup ', desc: 'supremum' },
    { g: 'Analysis', show: 'inf', cmd: 'inf', ins: '\\inf ', desc: 'infimum' },
    { g: 'Analysis', show: 'lim', cmd: 'lim', ins: '\\lim_{' + CARET + '}', desc: 'limit' },
    { g: 'Analysis', show: 'limsup', cmd: 'limsup', ins: '\\limsup_{' + CARET + '}' },
    { g: 'Analysis', show: 'Σ', cmd: 'sum', ins: '\\sum_{' + CARET + '}^{}', desc: 'sum' },
    { g: 'Analysis', show: '∏', cmd: 'prod', ins: '\\prod_{' + CARET + '}^{}', desc: 'product' },
    { g: 'Analysis', show: '∫', cmd: 'int', ins: '\\int_{' + CARET + '}^{}', desc: 'integral' },
    { g: 'Analysis', show: '∂', cmd: 'partial', ins: '\\partial ' },
    { g: 'Analysis', show: '⋯', cmd: 'cdots', ins: '\\cdots ' },
    { g: 'Analysis', show: '…', cmd: 'ldots', ins: '\\ldots ' },
    { g: 'Analysis', show: 'f′', cmd: 'prime', ins: "f'(" + CARET + ')', desc: 'derivative' },

    { g: 'Structure', show: 'a⁄b', cmd: 'frac', ins: '\\frac{' + CARET + '}{}', desc: 'fraction' },
    { g: 'Structure', show: '√', cmd: 'sqrt', ins: '\\sqrt{' + CARET + '}', desc: 'square root' },
    { g: 'Structure', show: 'xⁿ', cmd: 'sup-script', ins: '^{' + CARET + '}', desc: 'superscript', alt: 'power exponent' },
    { g: 'Structure', show: 'xₙ', cmd: 'sub-script', ins: '_{' + CARET + '}', desc: 'subscript', alt: 'index' },
    { g: 'Structure', show: '|x|', cmd: 'abs', ins: '|' + CARET + '|', desc: 'absolute value', alt: 'modulus' },
    { g: 'Structure', show: '‖x‖', cmd: 'norm', ins: '\\|' + CARET + '\\|', desc: 'norm' },
    { g: 'Structure', show: '( )', cmd: 'left', ins: '\\left(' + CARET + '\\right)', desc: 'sized brackets' },
    { g: 'Structure', show: '[ ]', cmd: 'bracket', ins: '[' + CARET + ']' },
    { g: 'Structure', show: 'quad', cmd: 'quad', ins: '\\quad ', desc: 'wide space' },
    { g: 'Structure', show: 'cases', cmd: 'cases', ins: '\\begin{cases}' + CARET + '\\end{cases}', desc: 'case split' }
  ];

  /* what stays offered even when the statement does not use it */
  const CORE = ['varepsilon', 'delta', 'forall', 'exists', 'in', 'le', 'to',
    'frac', 'abs', 'sub-script', 'sup-script', 'mathbb', 'lim', 'text'];

  function macrosIn(tex) {
    const src = String(tex || '');
    const found = {};
    src.replace(/\\([a-zA-Z]+)/g, function (whole, m) { found[m] = true; return whole; });
    if (/_\{|_[a-zA-Z0-9]/.test(src)) found['sub-script'] = true;
    if (/\^\{|\^[a-zA-Z0-9]/.test(src)) found['sup-script'] = true;
    if (/\|/.test(src)) found['abs'] = true;
    return found;
  }

  /* Which catalogue entries this concept's own statement uses. These rank
     first everywhere — it is the whole of "contextual". */
  function usedBy(concept) {
    const src = String((concept && concept.statement) || '');
    const used = macrosIn(src);
    const taken = {};
    return CATALOG.filter(function (k) {
      const hit = k.needle ? src.indexOf(k.needle) >= 0 : !!used[k.cmd];
      if (!hit || taken[k.ins]) return false;
      taken[k.ins] = true;
      return true;
    });
  }

  /* ── completion ───────────────────────────────────────────────────────── */

  /* The token being typed: a backslash and the letters after it, ending at
     the caret. Returns null when the caret is not inside one. */
  function tokenAt(value, caret) {
    const upto = String(value || '').slice(0, caret);
    const m = /\\([a-zA-Z]*)$/.exec(upto);
    if (!m) return null;
    return { text: m[0], word: m[1], from: caret - m[0].length, to: caret };
  }

  const score = (k, word, ctx) => {
    const w = word.toLowerCase();
    const cmd = k.cmd.toLowerCase();
    const hay = (cmd + ' ' + (k.desc || '') + ' ' + (k.alt || '')).toLowerCase();
    let s = -1;
    if (!w) s = 40;
    else if (cmd === w) s = 100;
    else if (cmd.indexOf(w) === 0) s = 80 - cmd.length;
    else if (hay.indexOf(w) >= 0) s = 40 - cmd.length;
    if (s < 0) return s;
    if (ctx[k.ins]) s += 25;                      /* this theorem uses it */
    if (CORE.indexOf(k.cmd) >= 0) s += 6;
    return s;
  };

  /* Ranked completions for a partial command. `word` may be '' — that is the
     bare-backslash case, and it should still offer something useful. */
  function complete(word, concept, limit) {
    const ctx = {};
    usedBy(concept).forEach(k => { ctx[k.ins] = true; });
    const seen = {};
    return CATALOG
      .map(k => ({ k: k, s: score(k, String(word || ''), ctx) }))
      .filter(function (r) {
        if (r.s < 0 || seen[r.k.ins]) return false;
        seen[r.k.ins] = true;
        return true;
      })
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 12)
      .map(r => r.k);
  }

  /* The idle strip: what to offer when nothing is being typed. Contextual
     first, then the essentials, because a learner who does not know the
     spelling cannot start a completion at all. */
  function suggestions(concept, limit) {
    const ctx = usedBy(concept);
    const taken = {};
    ctx.forEach(k => { taken[k.ins] = true; });
    const core = CATALOG.filter(k => !taken[k.ins] && CORE.indexOf(k.cmd) >= 0);
    return ctx.concat(core).slice(0, limit || 14);
  }

  /* ── insertion ────────────────────────────────────────────────────────── */

  /* Replace [from,to) with `ins`. CARET marks where the caret should land.

     `opts.wrap` decides what happens to the text being replaced, and the two
     cases are genuinely different:

       wrap: true   the range is the user's SELECTION and CARET means "put it
                    here", so \sqrt{▮} around a selected x gives \sqrt{x}.
       wrap: false  the range is a half-typed command being replaced by the
                    completion, so it must be DISCARDED — keeping it turns
                    `\eps` + `$\varepsilon▮$` into `$\varepsilon\eps$`. */
  function splice(field, from, to, ins, opts) {
    const wrap = !opts || opts.wrap !== false;
    const val = field.value;
    const selected = wrap ? val.slice(from, to) : '';
    let text = ins, caretAt;
    const mark = text.indexOf(CARET);
    if (mark >= 0) {
      text = text.slice(0, mark) + selected + text.slice(mark + 1);
      caretAt = from + mark + selected.length;
    } else {
      caretAt = from + text.length;
    }
    field.value = val.slice(0, from) + text + val.slice(to);
    field.focus();
    try { field.setSelectionRange(caretAt, caretAt); } catch (e) { /* detached field */ }
    field.dispatchEvent(new Event('input', { bubbles: true }));
  }

  /* Insert at the caret, replacing the selection. */
  function insert(field, ins) {

     means an inline span is open. `$$` counts as one delimiter either way, so
     a display block reads as "open" too, which is the answer we want. */
  function inMath(value, caret) {
    const upto = String(value || '').slice(0, caret);
    let n = 0;
    for (let i = 0; i < upto.length; i++) {
      if (upto[i] !== '$') continue;
      if (i && upto[i - 1] === '\\') continue;      /* an escaped \$ is a literal */
      if (upto[i + 1] === '$') { i += 1; }

    return n % 2 === 1;

     In a markdown line, a command typed in the middle of a sentence has to be
     wrapped in $…$ or it renders as literal backslash-text. Doing that at
     accept time is what lets someone write a paragraph and drop a symbol into

    if (o.wrapInMath && !inMath(field.value, tok ? tok.from : a)) {
      const body = ins.replace(/\s+$/, '');
      const mark = body.indexOf(CARET);
      ins = mark >= 0
        ? '$' + body.slice(0, mark) + CARET + body.slice(mark + 1) + '$'
        : '$' + body + CARET + '$';
    }

    /* the half-typed command is replaced, never wrapped */
    if (tok) splice(field, tok.from, tok.to, ins, { wrap: false });
    else insert(field, ins);
  }

  return { CATALOG, CARET, usedBy, tokenAt, inMath, complete, suggestions, insert, splice, accept };

        : at === 2 ? (isMl ? '2 · പരിശീലനം പൂർത്തിയായി' : '2 · exercises done')

        : (isMl ? 'പൂർണ്ണമായി' : 'all complete'))
      : (at === 0 ? (isMl ? 'വായിച്ച ശേഷം വായിച്ചു എന്ന് അടയാളപ്പെടുത്തുക' : 'mark it read once you have studied it')
        : at === 1 ? (tasks.total ? (isMl ? ('ലെവൽ 2: ' + tasks.done + '/' + tasks.total + ' പരിശീലന ചോദ്യങ്ങൾ ചെയ്യുക') : ('level 2: ' + tasks.done + ' of ' + tasks.total + ' section exercises done')) : (isMl ? 'ലെവൽ 2 പൂർത്തിയായി' : 'level 2 is clear'))

      bits.push(isMl ? 'നെഗറ്റീവ് മാർക്കില്ല' : 'no negative marking');
    }

      bits.push(isMl ? ('ഏകദേശം ' + Math.round(q.time / 30) / 2 + ' മിനിറ്റ്') : ('about ' + Math.round(q.time / 30) / 2 + ' min'));

    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const s = Math.max(0, Math.round((Date.now() - at) / 1000));

    const m = Math.round(s / 60);
    if (m < 60) return isMl ? (m + ' മിനിറ്റ് മുൻപ്') : (m + ' ' + DOM.plural(m, 'minute') + ' ago');

    return isMl ? (d + ' ദിവസം മുൻപ്') : (d + ' ' + DOM.plural(d, 'day') + ' ago');

  };

  return {
    title, crumb, prose, math, kindBadge, tierBadge, meter, stat, empty,
    ladder, levelBadge, levelBar, levelRing, ask, pendingPrereqs, mockBanner, gate, reveal,
    whyRow, confidenceGate, typeBadge, metaRow, clock, ago
  };
})();

    caption_ml: 'വശം $x$ ആയ സമചതുരത്തിന്റെ വിസ്തീർണ്ണം $x^2$ ആണ്. സ്ലൈഡർ നീക്കി വശത്തിനനുസരിച്ച് വിസ്തീർണ്ണം മാറുന്നത് കാണുക.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 210, xr: [0, 10], yr: [0, 10], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(side) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const s = Math.min(6, Math.max(1, side));
        const cellSize = 120 / 6;
        const totalW = s * cellSize;
        const startX = 165 - totalW / 2;
        const startY = 95 - totalW / 2;

        // Background square
        group.appendChild(Fig.svg('rect', {
          x: startX, y: startY, width: totalW, height: totalW,
          class: 'band', rx: 4, style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2px;'
        }));

        // Grid lines
        for (let i = 1; i < s; i++) {
          group.appendChild(Fig.svg('line', {
            x1: startX + i * cellSize, y1: startY,
            x2: startX + i * cellSize, y2: startY + totalW,
            class: 'guide', style: 'stroke: var(--accent-line); stroke-dasharray: 2 2;'
          }));
          group.appendChild(Fig.svg('line', {
            x1: startX, y1: startY + i * cellSize,
            x2: startX + totalW, y2: startY + i * cellSize,
            class: 'guide', style: 'stroke: var(--accent-line); stroke-dasharray: 2 2;'
          }));
        }

        // Dimension labels
        group.appendChild(Fig.svg('text', {
          x: 165, y: startY - 8, 'text-anchor': 'middle',
          class: 'lbl', style: 'font-weight: 700; fill: var(--ink);',
          text: (isMl ? 'വശം = ' : 'side = ') + s
        }));
        group.appendChild(Fig.svg('text', {
          x: startX - 10, y: 95, 'text-anchor': 'end',
          class: 'lbl', style: 'font-weight: 700; fill: var(--ink);',
          text: s
        }));

        // Area text in center
        group.appendChild(Fig.svg('text', {
          x: 165, y: 95 + 4, 'text-anchor': 'middle',
          class: 'lbl', style: 'font-weight: 700; font-size: 15px; fill: var(--accent);',
          text: s + ' × ' + s + ' = ' + (s * s)
        }));
      }

      draw(4);
      api.body.appendChild(p.svg);
      api.control({
        min: 1, max: 6, step: 1, value: 4,
        label: 'Side length',
        format: v => (typeof I18N !== 'undefined' && I18N.lang() === 'ml')
          ? ('വശം: ' + v + ' · വിസ്തീർണ്ണം: ' + (v * v))
          : ('Side: ' + v + ' · Area: ' + (v * v)),
        onInput: draw
      });
    }
  },

  'fig.square-root-defn': {
    title: 'Square Root: Finding the Side from the Area',
    title_ml: 'വർഗ്ഗമൂലം: വിസ്തീർണ്ണത്തിൽ നിന്ന് വശം കണ്ടെത്തൽ',
    caption: 'Given a square of area $A$, its side length is the square root $\\sqrt{A}$. Drag the slider to test different areas.',
    caption_ml: 'വിസ്തീർണ്ണം $A$ ആയ സമചതുരത്തിന്റെ ഒരു വശത്തിന്റെ നീളമാണ് വർഗ്ഗമൂലം $\\sqrt{A}$. സ്ലൈഡർ നീക്കി പരീക്ഷിക്കുക.',
    interactive: true,
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 160', role: 'img' });
      const group = Fig.svg('g', {});
      svg.appendChild(group);

      const roots = [1, 2, 3, 4, 5, 6, 7, 8];
      function draw(idx) {
        DOM.clear(group);
        const s = roots[Math.min(roots.length - 1, Math.max(0, idx))];
        const area = s * s;
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        const px = 15 + s * 12;
        const ox = 165 - px / 2;
        const oy = 75 - px / 2;

        group.appendChild(Fig.svg('rect', {
          x: ox, y: oy, width: px, height: px, rx: 4,

        }));

        group.appendChild(Fig.svg('text', {
          x: 165, y: 75 + 5, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 15px; fill: var(--ok);',
          text: (isMl ? 'വിസ്തീർണ്ണം = ' : 'Area = ') + area
        }));

        group.appendChild(Fig.svg('text', {
          x: 165, y: oy - 8, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 13px; fill: var(--ink);',
          text: '√' + area + ' = ' + s
        }));
      }

      draw(3); // side 4, area 16
      api.body.appendChild(svg);
      api.control({
        min: 0, max: 7, step: 1, value: 3,
        label: 'Square Root',
        format: i => {
          const s = roots[i];
          return (typeof I18N !== 'undefined' && I18N.lang() === 'ml')
            ? ('വിസ്തീർണ്ണം: ' + (s * s) + ' ⇒ വശം: ' + s)
            : ('Area: ' + (s * s) + ' ⇒ Side: ' + s);
        },
        onInput: draw
      });
    }
  },

    title: 'The Pythagoras Theorem: a² + b² = c²',
    title_ml: 'പൈതഗോറസ് സിദ്ധാന്തം: a² + b² = c²',
    caption: 'In any right triangle, the area of the square on the hypotenuse equals the sum of areas on the other two sides: $3^2 + 4^2 = 9 + 16 = 25 = 5^2$.',
    caption_ml: 'ഒരു മട്ടത്രികോണത്തിൽ കർണ്ണത്തിലെ സമചതുരത്തിന്റെ വിസ്തീർണ്ണം മറ്റ് രണ്ട് വശങ്ങളിലെ സമചതുരങ്ങളുടെ വിസ്തീർണ്ണങ്ങളുടെ തുകയ്ക്ക് തുല്യമാണ്: $9 + 16 = 25$.',
    build(api) {
      const svg = Fig.svg('svg', { viewBox: '0 0 330 200', role: 'img' });
      const ox = 110, oy = 110;
      const a = 40, b = 55; // right triangle legs

      // Right triangle
      svg.appendChild(Fig.svg('polygon', {
        points: `${ox},${oy} ${ox + b},${oy} ${ox},${oy - a}`,
        style: 'fill: var(--surface-3); stroke: var(--ink); stroke-width: 2px;'
      }));

      // Square on leg a (left)
      svg.appendChild(Fig.svg('rect', {
        x: ox - a, y: oy - a, width: a, height: a,
        style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5px;'
      }));
      svg.appendChild(Fig.svg('text', {
        x: ox - a / 2, y: oy - a / 2 + 5, 'text-anchor': 'middle',
        style: 'font-weight: 700; font-size: 12px; fill: var(--accent);', text: 'a² = 9'
      }));

      // Square on leg b (bottom)
      svg.appendChild(Fig.svg('rect', {
        x: ox, y: oy, width: b, height: b,
        style: 'fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5px;'
      }));
      svg.appendChild(Fig.svg('text', {
        x: ox + b / 2, y: oy + b / 2 + 5, 'text-anchor': 'middle',
        style: 'font-weight: 700; font-size: 12px; fill: var(--warn);', text: 'b² = 16'
      }));

      // Square on hypotenuse c (tilted)
      // Vector from (ox, oy - a) to (ox + b, oy) is (b, a)
      // Perpendicular vector is (-a, b)
      const p1x = ox, p1y = oy - a;
      const p2x = ox + b, p2y = oy;
      const p3x = p2x + a, p3y = p2y - b;
      const p4x = p1x + a, p4y = p1y - b;

      svg.appendChild(Fig.svg('polygon', {
        points: `${p1x},${p1y} ${p2x},${p2y} ${p3x},${p3y} ${p4x},${p4y}`,
        style: 'fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5px;'
      }));
      svg.appendChild(Fig.svg('text', {
        x: (p1x + p3x) / 2, y: (p1y + p3y) / 2 + 5, 'text-anchor': 'middle',
        style: 'font-weight: 700; font-size: 13px; fill: var(--ok);', text: 'c² = 25'
      }));

      // Equation label below
      svg.appendChild(Fig.svg('text', {
        x: 165, y: 190, 'text-anchor': 'middle',
        style: 'font-weight: 700; font-size: 13px; fill: var(--ink);', text: '9 + 16 = 25'
      }));

      api.body.appendChild(svg);
    }
  },

  /* ── Class 8 Chapter 3: Square Identities ──────────────────────────────── */

  'fig.ident-sum-sq': {
    title: 'Square of a Sum: (x + y)² = x² + 2xy + y²',
    title_ml: 'തുകയുടെ വർഗ്ഗം: (x + y)² = x² + 2xy + y²',
    caption: 'A square of side $(x+y)$ is divided into four regions: $x^2 + xy + xy + y^2$. Drag the slider to vary $x$.',
    caption_ml: '$(x+y)$ വശമുള്ള സമചതുരം 4 ഭാഗങ്ങളായി വിഭജിക്കപ്പെടുന്നു: $x^2 + xy + xy + y^2$. സ്ലൈഡർ നീക്കി $x$-ന്റെ അളവ് മാറ്റുക.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 210, xr: [0, 10], yr: [0, 10], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(xVal) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const x = Math.min(6, Math.max(2, xVal));
        const y = 2;
        const scale = 14;
        const xPx = x * scale;
        const yPx = y * scale;
        const total = xPx + yPx;
        const ox = 165 - total / 2;
        const oy = 95 - total / 2;

        // x^2 region
        group.appendChild(Fig.svg('rect', {
          x: ox, y: oy, width: xPx, height: xPx,
          style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + xPx / 2, y: oy + xPx / 2 + 5, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 13px; fill: var(--accent);',
          text: `x² = ${x * x}`
        }));

        // top-right xy region
        group.appendChild(Fig.svg('rect', {
          x: ox + xPx, y: oy, width: yPx, height: xPx,
          style: 'fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + xPx + yPx / 2, y: oy + xPx / 2 + 5, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 11px; fill: var(--warn);',
          text: `xy = ${x * y}`
        }));

        // bottom-left xy region
        group.appendChild(Fig.svg('rect', {
          x: ox, y: oy + xPx, width: xPx, height: yPx,
          style: 'fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1.5px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + xPx / 2, y: oy + xPx + yPx / 2 + 5, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 11px; fill: var(--warn);',
          text: `xy = ${x * y}`
        }));

        // bottom-right y^2 region
        group.appendChild(Fig.svg('rect', {
          x: ox + xPx, y: oy + xPx, width: yPx, height: yPx,
          style: 'fill: var(--ok-soft); stroke: var(--ok); stroke-width: 1.5px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + xPx + yPx / 2, y: oy + xPx + yPx / 2 + 5, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 11px; fill: var(--ok);',
          text: `y² = ${y * y}`
        }));

        // Dimension labels
        group.appendChild(Fig.svg('text', {
          x: ox + xPx / 2, y: oy - 6, 'text-anchor': 'middle',
          style: 'font-weight: 600; font-size: 11px; fill: var(--ink-2);',
          text: `x = ${x}`
        }));
        group.appendChild(Fig.svg('text', {
          x: ox + xPx + yPx / 2, y: oy - 6, 'text-anchor': 'middle',
          style: 'font-weight: 600; font-size: 11px; fill: var(--ink-2);',
          text: `y = ${y}`
        }));
        group.appendChild(Fig.svg('text', {
          x: 165, y: oy + total + 18, 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 12px; fill: var(--ink);',
          text: `(${x} + ${y})² = ${x*x} + 2(${x*y}) + ${y*y} = ${(x+y)*(x+y)}`
        }));
      }

      draw(4);
      api.body.appendChild(p.svg);
      api.control({
        min: 2, max: 6, step: 1, value: 4,
        label: 'x',
        format: v => (typeof I18N !== 'undefined' && I18N.lang() === 'ml')
          ? (`x = ${v}, y = 2 · (${v}+2)² = ${(v+2)*(v+2)}`)
          : (`x = ${v}, y = 2 · (${v}+2)² = ${(v+2)*(v+2)}`),
        onInput: draw
      });
    }
  },

  'fig.ident-diff-sq': {
    title: 'Square of a Difference: (x - y)² = x² - 2xy + y²',

      }));

      // (x-y)^2 inner square (top-left)
      svg.appendChild(Fig.svg('rect', {
        x: ox, y: oy, width: diff, height: diff,

      }));
      svg.appendChild(Fig.svg('text', {
        x: ox + diff / 2, y: oy + diff / 2 + 5, 'text-anchor': 'middle',
        style: 'font-weight: 700; font-size: 14px; fill: var(--accent);',
        text: '(x - y)²'
      }));

      // Right strip: y * (x-y)
      svg.appendChild(Fig.svg('rect', {
        x: ox + diff, y: oy, width: ySize, height: diff,
        style: 'fill: var(--warn-soft); stroke: var(--warn); stroke-width: 1px;'

      svg.appendChild(Fig.svg('text', {
        x: ox + diff + ySize / 2, y: oy + diff / 2 + 4, 'text-anchor': 'middle',

      }));

      // Bottom strip: (x-y) * y
      svg.appendChild(Fig.svg('rect', {

      svg.appendChild(Fig.svg('text', {
        x: ox + diff + ySize / 2, y: oy - 6, 'text-anchor': 'middle',
        style: 'font-size: 11px; fill: var(--ink-2);', text: 'y'
      }));
      svg.appendChild(Fig.svg('text', {
        x: ox - 8, y: oy + diff / 2 + 4, 'text-anchor': 'end',
        style: 'font-size: 11px; fill: var(--ink-2);', text: 'x - y'
      }));
      svg.appendChild(Fig.svg('text', {
        x: ox - 8, y: oy + diff + ySize / 2 + 4, 'text-anchor': 'end',
        style: 'font-size: 11px; fill: var(--ink-2);', text: 'y'

      // Formula at bottom
      svg.appendChild(Fig.svg('text', {
        x: 165, y: 178, 'text-anchor': 'middle',
        style: 'font-weight: 700; font-size: 12px; fill: var(--ink);',
        text: isMl ? '(x - y)² = x² - 2xy + y²' : '(x - y)² = x² - 2xy + y²'
      }));

      api.body.appendChild(svg);
    }
  },

  /* ── Class 8 Chapter 4: Polygons (ബഹുഭുജങ്ങൾ) ─────────────────────────── */

  'fig.polygon-triangulation': {
    title: 'Triangulation & Angle Sum of Polygons',
    title_ml: 'ബഹുഭുജങ്ങളെ ത്രികോണങ്ങളാക്കൽ',
    caption: 'An $n$-sided polygon is divided into $(n - 2)$ triangles from one vertex. Sum of angles $= (n - 2) \\times 180^\\circ$.',
    caption_ml: 'ഒരു മൂലയിൽ നിന്ന് വരകൾ വരച്ച് $n$ വശങ്ങളുള്ള ബഹുഭുജത്തെ $(n - 2)$ ത്രികോണങ്ങളാക്കാം. കോണുകളുടെ തുക $= (n - 2) \\times 180^\\circ$.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 220, xr: [-1.4, 1.4], yr: [-1.4, 1.4], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      const colors = ['#388bfd', '#2ea043', '#d29922', '#db61a2', '#a371f7', '#f85149'];

      function draw(n) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const vertices = [];
        for (let i = 0; i < n; i++) {
          const angle = -Math.PI / 2 + (2 * Math.PI * i) / n;
          vertices.push([Math.cos(angle), Math.sin(angle)]);
        }

        // Draw triangles from vertex 0
        for (let i = 1; i < n - 1; i++) {
          const tPts = [vertices[0], vertices[i], vertices[i + 1]];
          const ptsStr = tPts.map(pt => p.tx(pt[0]) + ',' + p.ty(pt[1])).join(' ');
          group.appendChild(Fig.svg('polygon', {
            points: ptsStr,
            style: 'fill: ' + colors[(i - 1) % colors.length] + '22; stroke: ' + colors[(i - 1) % colors.length] + '; stroke-width: 1.5px;'
          }));

          // Triangle label in centroid
          const cx = (tPts[0][0] + tPts[1][0] + tPts[2][0]) / 3;
          const cy = (tPts[0][1] + tPts[1][1] + tPts[2][1]) / 3;
          group.appendChild(Fig.svg('text', {
            x: p.tx(cx), y: p.ty(cy) + 4, 'text-anchor': 'middle',
            style: 'font-weight: 700; font-size: 11px; fill: ' + colors[(i - 1) % colors.length] + ';',
            text: '180°'
          }));
        }

        // Outer polygon boundary
        const polyStr = vertices.map(pt => p.tx(pt[0]) + ',' + p.ty(pt[1])).join(' ');
        group.appendChild(Fig.svg('polygon', {
          points: polyStr,
          style: 'fill: none; stroke: var(--ink); stroke-width: 2.5px;'
        }));

        // Vertices dots
        vertices.forEach((pt, i) => {
          group.appendChild(Fig.svg('circle', {
            cx: p.tx(pt[0]), cy: p.ty(pt[1]), r: i === 0 ? 5 : 3.5,
            style: i === 0 ? 'fill: var(--accent); stroke: #fff; stroke-width: 1.5px;' : 'fill: var(--ink);'
          }));
        });

        // Summary text
        const sum = (n - 2) * 180;
        group.appendChild(Fig.svg('text', {
          x: p.tx(0), y: p.ty(-1.28), 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 13px; fill: var(--ink);',
          text: (isMl ? (n + ' വശങ്ങൾ · ' + (n - 2) + ' ത്രികോണങ്ങൾ · തുക: ' + sum + '°')
                      : (n + ' sides · ' + (n - 2) + ' triangles · Sum: ' + sum + '°'))
        }));
      }

      draw(5);
      api.body.appendChild(p.svg);
      api.control({
        min: 4, max: 8, step: 1, value: 5,
        label: 'Number of sides (n)',
        format: v => (typeof I18N !== 'undefined' && I18N.lang() === 'ml')
          ? ('വശങ്ങൾ: ' + v + ' · തുക: ' + ((v - 2) * 180) + '°')
          : ('Sides: ' + v + ' · Sum: ' + ((v - 2) * 180) + '°'),
        onInput: draw
      });
    }
  },

  'fig.polygon-outer-angles': {

    title_ml: 'ബാഹ്യകോണുകളുടെ തുക 360°',

      }

      // Draw extended sides
      for (let i = 0; i < n; i++) {

          points: ptsStr,
          style: 'fill: none; stroke: var(--ink); stroke-width: 2.5px;'

  /* ── Class 8 Chapter 5: Money Maths (പണമിടപാടുകളിലെ കണക്ക്) ──────────── */

  'fig.simple-vs-compound': {
    title: 'Simple Interest vs Compound Interest Growth',
    title_ml: 'ലളിതപലിശയും കൂട്ടുപലിശയും തമ്മിലുള്ള വളർച്ച',
    caption: 'Compare ₹10,000 growing over time at 10% annual rate. In compound interest, interest earns additional interest each year.',
    caption_ml: '₹10,000 രൂപ 10% വാർഷിക നിരക്കിൽ വളരുന്നത് താരതമ്യം ചെയ്യുക. കൂട്ടുപലിശയിൽ ഓരോ വർഷത്തെയും പലിശയ്ക്കും വീണ്ടും പലിശ ലഭിക്കുന്നു.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 220, xr: [0, 5.5], yr: [9000, 17500], pad: 20 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(years) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const P = 10000;
        const r = 0.10;

        // Grid lines
        for (let y = 10000; y <= 17000; y += 2000) {
          group.appendChild(Fig.svg('line', {
            x1: p.tx(0), y1: p.ty(y), x2: p.tx(5.2), y2: p.ty(y),
            style: 'stroke: var(--border); stroke-dasharray: 2 2;'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(0) - 4, y: p.ty(y) + 3, 'text-anchor': 'end',
            style: 'font-size: 9px; fill: var(--muted);',
            text: '₹' + y
          }));
        }

        // Lines for SI and CI
        const siPts = [];
        const ciPts = [];
        for (let t = 0; t <= years; t += 0.2) {
          siPts.push([t, P * (1 + r * t)]);
          ciPts.push([t, P * Math.pow(1 + r, t)]);
        }

        const siStr = siPts.map(pt => p.tx(pt[0]) + ',' + p.ty(pt[1])).join(' ');
        const ciStr = ciPts.map(pt => p.tx(pt[0]) + ',' + p.ty(pt[1])).join(' ');

        // SI path (straight blue line)
        group.appendChild(Fig.svg('polyline', {
          points: siStr,
          style: 'fill: none; stroke: #388bfd; stroke-width: 2.5px;'
        }));

        // CI path (curved green line)
        group.appendChild(Fig.svg('polyline', {
          points: ciStr,
          style: 'fill: none; stroke: #2ea043; stroke-width: 3px;'
        }));

        // Year markers
        for (let t = 1; t <= years; t++) {
          const siVal = P * (1 + r * t);
          const ciVal = P * Math.pow(1 + r, t);

          group.appendChild(Fig.svg('circle', {
            cx: p.tx(t), cy: p.ty(siVal), r: 3.5,
            style: 'fill: #388bfd;'
          }));
          group.appendChild(Fig.svg('circle', {
            cx: p.tx(t), cy: p.ty(ciVal), r: 4,
            style: 'fill: #2ea043;'
          }));
        }

        const finalSI = Math.round(P * (1 + r * years));
        const finalCI = Math.round(P * Math.pow(1 + r, years));
        const diff = finalCI - finalSI;

        // Label box
        group.appendChild(Fig.svg('text', {
          x: p.tx(2.6), y: p.ty(16800), 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 13px; fill: var(--ink);',
          text: (isMl ? (years + ' വർഷം: ലളിതപലിശ ₹' + finalSI + ' · കൂട്ടുപലിശ ₹' + finalCI)
                      : (years + ' years: SI = ₹' + finalSI + ' · CI = ₹' + finalCI))
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(2.6), y: p.ty(15800), 'text-anchor': 'middle',
          style: 'font-weight: 600; font-size: 12px; fill: #2ea043;',
          text: (isMl ? ('കൂട്ടുപലിശയിലെ അധിക നേട്ടം: +₹' + diff)
                      : ('Extra CI Advantage: +₹' + diff))
        }));
      }

      draw(3);
      api.body.appendChild(p.svg);
      api.control({
        min: 1, max: 5, step: 1, value: 3,
        label: 'Years (n)',
        format: v => (typeof I18N !== 'undefined' && I18N.lang() === 'ml')
          ? ('വർഷം: ' + v) : ('Years: ' + v),
        onInput: draw
      });
    }
  },

  /* ── Class 8 Chapter 6: Construction of Quadrilaterals ─────────────────── */

  'fig.quad-flexibility': {
    title: 'Flexibility of 4-Bar Frame vs Diagonal Locking',
    title_ml: 'ചതുർഭുജ ചട്ടക്കൂടിന്റെ അയവും വികർണ്ണ ദാർഢ്യവും',
    caption: 'A four-bar frame can freely flex its corner angles without changing side lengths. Adding a 5th element (a diagonal) divides it into two rigid triangles and locks its geometry uniquely.',
    caption_ml: 'നാല് കമ്പികൾ കൊണ്ടുള്ള ചട്ടക്കൂട് വശങ്ങളുടെ നീളം മാറ്റാതെ തന്നെ പല കോണുകളിലേക്ക് ചായുന്നു. എന്നാൽ ഒരു വികർണ്ണം (5-ാം അളവ്) നൽകിയാൽ അത് രണ്ട് ദൃഢ ത്രികോണങ്ങളായി ഉറച്ചുനിൽക്കുന്നു.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 180, xr: [0, 10], yr: [0, 6], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(deg) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
        const rad = (deg * Math.PI) / 180;

        // Base AB fixed at bottom
        const ax = 2.0, ay = 1.0;
        const bx = 6.5, by = 1.0;
        const sideAD = 3.5;

        // Corner D rotates with angle 'deg' at A
        const dx = ax + sideAD * Math.cos(rad);
        const dy = ay + sideAD * Math.sin(rad);

        // For a parallelogram-like linkage: C = B + (D - A)
        const cx = bx + (dx - ax);
        const cy = by + (dy - ay);

        // Ghost reference for 90 deg rectangle
        const rRad = (90 * Math.PI) / 180;
        const rdx = ax + sideAD * Math.cos(rRad);
        const rdy = ay + sideAD * Math.sin(rRad);
        const rcx = bx + (rdx - ax);
        const rcy = by + (rdy - ay);

        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(rcx)},${p.ty(rcy)} ${p.tx(rdx)},${p.ty(rdy)}`,
          style: 'fill: none; stroke: var(--ink-3); stroke-dasharray: 4 4; stroke-width: 1.5px;'
        }));

        // Quadrilateral body
        group.appendChild(Fig.svg('polygon', {
          points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(dx)},${p.ty(dy)}`,
          style: 'fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.5px;'
        }));

        // Diagonal AC (locking element)
        group.appendChild(Fig.svg('line', {
          x1: p.tx(ax), y1: p.ty(ay),
          x2: p.tx(cx), y2: p.ty(cy),
          style: 'stroke: var(--bad); stroke-width: 2px; stroke-dasharray: 3 3;'
        }));

        // Diagonal length calculation
        const diagLen = Math.sqrt(Math.pow(cx - ax, 2) + Math.pow(cy - ay, 2)).toFixed(1);

        // Vertex circles and labels
        const pts = [
          { x: ax, y: ay, lbl: 'A', ox: -10, oy: 14 },
          { x: bx, y: by, lbl: 'B', ox: 10, oy: 14 },
          { x: cx, y: cy, lbl: 'C', ox: 12, oy: -6 },
          { x: dx, y: dy, lbl: 'D', ox: -12, oy: -6 }
        ];

        pts.forEach(pt => {
          group.appendChild(Fig.svg('circle', {
            cx: p.tx(pt.x), cy: p.ty(pt.y), r: 4,
            style: 'fill: var(--ink);'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(pt.x) + pt.ox, y: p.ty(pt.y) + pt.oy,
            'text-anchor': 'middle',
            style: 'font-weight: 700; font-size: 11px; fill: var(--ink);',
            text: pt.lbl
          }));
        });

        // Info text
        group.appendChild(Fig.svg('text', {
          x: p.tx(5.0), y: p.ty(5.5), 'text-anchor': 'middle',
          style: 'font-weight: 700; font-size: 12px; fill: var(--ink);',
          text: (isMl ? `കോൺ ∠A = ${deg}° · വികർണ്ണം AC = ${diagLen}` : `Angle ∠A = ${deg}° · Diagonal AC = ${diagLen}`)
        }));

        group.appendChild(Fig.svg('text', {
          x: p.tx(5.0), y: p.ty(5.0), 'text-anchor': 'middle',
          style: 'font-size: 10px; fill: var(--bad); font-weight: 600;',
          text: isMl ? 'വികർണ്ണം ഉറപ്പിച്ചാൽ ആകൃതി ദൃഢമാകുന്നു (5-ാം അളവ്)' : 'Fixing diagonal AC locks the shape uniquely (5th measure)'
        }));
      }

      draw(70);
      api.body.appendChild(p.svg);
      api.control({
        min: 45, max: 120, step: 5, value: 70,
        label: 'Corner angle ∠A',
        format: v => v + '°',
        onInput: draw
      });
    }
  },

  'fig.quad-four-sides-diag': {
    title: 'Step-by-Step: 4 Sides and 1 Diagonal',
    title_ml: 'ഘട്ടം ഘട്ടമായ നിർമ്മിതി: 4 വശങ്ങളും 1 വികർണ്ണവും',
    caption: 'Constructing quadrilateral $ABCD$: first base triangle $\\triangle ABC$ using diagonal $AC$, then locating $D$ via intersecting arcs from $A$ and $C$.',
    caption_ml: 'ആദ്യം $AC$ വികർണ്ണമുപയോഗിച്ച് $\\triangle ABC$ നിർമ്മിക്കുന്നു, തുടർന്ന് $A, C$ എന്നിവയിൽ നിന്ന് ചാപങ്ങൾ വരച്ച് $D$ കണ്ടെത്തുന്നു.',
    interactive: true,
    build(api) {
      const p = Fig.plot({ w: 330, h: 200, xr: [0, 11], yr: [0, 8], pad: 15 });
      const group = Fig.svg('g', {});
      p.add(group);

      function draw(step) {
        DOM.clear(group);
        const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

        // Coordinates
        const ax = 2.0, ay = 2.0;
        const bx = 6.5, by = 2.0;
        const cx = 8.0, cy = 5.5;
        const dx = 3.5, dy = 6.5;

        // Step 1: Base AB
        group.appendChild(Fig.svg('line', {
          x1: p.tx(ax), y1: p.ty(ay),
          x2: p.tx(bx), y2: p.ty(by),
          style: 'stroke: var(--accent); stroke-width: 3px;'
        }));
        group.appendChild(Fig.svg('text', {
          x: p.tx(4.25), y: p.ty(ay) + 16, 'text-anchor': 'middle',
          style: 'font-weight: 600; font-size: 11px; fill: var(--accent);',
          text: 'AB = 4.5 cm'
        }));

        if (step >= 2) {
          // Step 2: Base Triangle ABC with diagonal AC
          group.appendChild(Fig.svg('line', {
            x1: p.tx(bx), y1: p.ty(by),
            x2: p.tx(cx), y2: p.ty(cy),
            style: 'stroke: var(--accent); stroke-width: 2.5px;'
          }));
          group.appendChild(Fig.svg('line', {
            x1: p.tx(ax), y1: p.ty(ay),
            x2: p.tx(cx), y2: p.ty(cy),
            style: 'stroke: var(--warn); stroke-width: 2px; stroke-dasharray: 4 3;'
          }));
          group.appendChild(Fig.svg('polygon', {
            points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)}`,
            style: 'fill: var(--accent-soft); fill-opacity: 0.5;'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(7.5), y: p.ty(3.5), 'text-anchor': 'start',
            style: 'font-size: 10px; fill: var(--ink);', text: 'BC = 5.5 cm'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(4.8), y: p.ty(4.2), 'text-anchor': 'end',
            style: 'font-size: 10px; fill: var(--warn); font-weight: 600;', text: 'AC = 7 cm'
          }));
        }

        if (step >= 3) {
          // Step 3: Arcs from A (r=AD) and C (r=CD)
          const radAD = Math.hypot(p.tx(dx) - p.tx(ax), p.ty(dy) - p.ty(ay));
          group.appendChild(Fig.svg('path', {
            d: `M ${p.tx(dx) - 20} ${p.ty(dy) - 15} A ${radAD} ${radAD} 0 0 1 ${p.tx(dx) + 20} ${p.ty(dy) + 15}`,
            style: 'fill: none; stroke: var(--bad); stroke-width: 1.5px;'
          }));
          const radCD = Math.hypot(p.tx(dx) - p.tx(cx), p.ty(dy) - p.ty(cy));
          group.appendChild(Fig.svg('path', {
            d: `M ${p.tx(dx) - 15} ${p.ty(dy) + 20} A ${radCD} ${radCD} 0 0 1 ${p.tx(dx) + 15} ${p.ty(dy) - 20}`,
            style: 'fill: none; stroke: var(--ok); stroke-width: 1.5px;'
          }));
        }

        if (step >= 4) {
          // Step 4: Complete quadrilateral
          group.appendChild(Fig.svg('line', {
            x1: p.tx(ax), y1: p.ty(ay),
            x2: p.tx(dx), y2: p.ty(dy),
            style: 'stroke: var(--accent); stroke-width: 2.5px;'
          }));
          group.appendChild(Fig.svg('line', {
            x1: p.tx(cx), y1: p.ty(cy),
            x2: p.tx(dx), y2: p.ty(dy),
            style: 'stroke: var(--accent); stroke-width: 2.5px;'
          }));
          group.appendChild(Fig.svg('polygon', {
            points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(dx)},${p.ty(dy)}`,
            style: 'fill: var(--ok-soft); fill-opacity: 0.3;'
          }));
          group.appendChild(Fig.svg('text', {
            x: p.tx(2.3), y: p.ty(4.6), 'text-anchor': 'end',

          'ഘട്ടം 4: AD, CD യോജിപ്പിച്ച് ABCD പൂർത്തിയാക്കുക!'
        ];

        group.appendChild(Fig.svg('text', {

      const ay = by + 4.0 * Math.sin((60 * Math.PI) / 180);
      // C angle = 90 deg, length CD = 4.5 cm

      // Angle arc at B
      p.add(Fig.svg('path', {

        style: 'fill: none; stroke: var(--ok); stroke-width: 2px;'
      }));
      p.add(Fig.svg('text', {
        x: p.tx(bx) + 26, y: p.ty(by) - 10,
        style: 'font-size: 10px; fill: var(--ok); font-weight: 700;', text: '60°'
      }));

      // Angle C ray (extended perpendicular)
      p.add(Fig.svg('line', {
        x1: p.tx(cx), y1: p.ty(cy), x2: p.tx(dx), y2: p.ty(dy + 0.8),
        style: 'stroke: var(--ink-3); stroke-dasharray: 4 3; stroke-width: 1.5px;'
      }));

      // Side CD
      p.add(Fig.svg('line', {
        x1: p.tx(cx), y1: p.ty(cy), x2: p.tx(dx), y2: p.ty(dy),
        style: 'stroke: var(--accent); stroke-width: 2.5px;'
      }));
      p.add(Fig.svg('text', {
        x: p.tx(cx) + 10, y: p.ty((cy + dy) / 2),

        text: 'CD = 4.5 cm'

      // Right angle square at C
      p.add(Fig.svg('polyline', {
        points: `${p.tx(cx) - 12},${p.ty(cy)} ${p.tx(cx) - 12},${p.ty(cy) - 12} ${p.tx(cx)},${p.ty(cy) - 12}`,
        style: 'fill: none; stroke: var(--warn); stroke-width: 1.5px;'

      // Top closing segment AD
      p.add(Fig.svg('line', {

      }));

      // Shaded polygon

        points: `${p.tx(ax)},${p.ty(ay)} ${p.tx(bx)},${p.ty(by)} ${p.tx(cx)},${p.ty(cy)} ${p.tx(dx)},${p.ty(dy)}`,
        style: 'fill: var(--accent-soft); fill-opacity: 0.35;'

      // Vertex dots and labels
      const vertices = [
        { x: bx, y: by, lbl: 'B', ox: -12, oy: 12 },
        { x: cx, y: cy, lbl: 'C', ox: 12, oy: 12 },
        { x: dx, y: dy, lbl: 'D', ox: 12, oy: -6 },
        { x: ax, y: ay, lbl: 'A', ox: -12, oy: -6 }
