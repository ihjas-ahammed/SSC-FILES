        host.style.minHeight = '';
      });

      const openCid = path().concept;
      document.body.classList.toggle('note-open', !!openCid);
      const openC = openCid ? Pool.concept(openCid) : null;
      if (typeof Shell !== 'undefined' && Shell.setSubtitle) {
        Shell.setSubtitle(openC ? openC.title : '');
      }
      lastTarget = ctx.target;

      if (o.scroll && o.isNote && ctx.target) {
        scrollToNote(ctx.target);
      } else if (o.scroll && ctx.target) {
        scrollTo(ctx.target);
      } else if (o.restore !== false) {
        window.scrollTo(0, keepY);
      }

      isInitial = false;
      isInitialPaint = false;
    }

    /* The first paint leaves the scroll alone — the Study view decides where
       to land, via scrollToOpen(). */
    repaint({ restore: false });
    return repaint;
  }

  let lastTarget = null;

  function scrollToNote(node) {
    if (!node) return;
    const scrollTarget = function () {
      const head = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--head-h'), 10) || 54;
      const rect = node.getBoundingClientRect();
      const targetY = Math.max(0, rect.top + window.scrollY - head - 8);
      window.scrollTo({ top: targetY, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    };
    window.requestAnimationFrame(scrollTarget);
    setTimeout(scrollTarget, 100);
    setTimeout(scrollTarget, 240);
  }

  function scrollTo(node) {
    if (!node) return;
    window.requestAnimationFrame(function () {
      const head = parseInt(getComputedStyle(document.documentElement)
        .getPropertyValue('--head-h'), 10) || 0;
      const y = node.getBoundingClientRect().top + window.scrollY - head - 12;
      window.scrollTo({ top: Math.max(0, y), behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });
  }

  /* Called by the Study view once it is on screen: return to whatever was
     last left open. */
  function scrollToOpen() {
    if (lastTarget) {
      if (path().concept) scrollToNote(lastTarget);
      else scrollTo(lastTarget);
    }
  }

  function mountAll(host, courses) {
    return painter(host, ctx => courses.map(course => courseNode(course, ctx)));
  }

  function mount(host, course) {
    return painter(host, ctx => (course.modules || []).map(mod => moduleNode(course, mod, ctx))
      .concat(course.pending ? [] : [pyqNode(course, ctx)]));
  }

  /* First visit: open the first course, module and section that still have
     work left, so the tree opens somewhere useful rather than flat. */
  function seedOpen(course) {
    if (Store.pref(KEY, null) || Store.pref(LEGACY, null)) { path(); return; }
    const p = {};
    if (course) {
      p.course = course.id;
      const mod = (course.modules || []).filter(x => !x.pending)[0];
      if (mod) {
        p.mod = mod.id;
        const sec = Pool.sections(course.id)
          .filter(s => (mod.secs || []).indexOf(s.sec) >= 0)
          .filter(s => s.concepts.some(c => Progress.level(c.id) < 1))[0];
        if (sec) p.sec = sec.sec;
      }
    }
    savePath(p);
  }

  /* Open the path down to one concept — what `#/note/<id>` now means. */
  function revealPath(conceptId, opts) {
    const c = Pool.concept(conceptId);
    if (!c) return false;
    const course = Pool.courseOfSec(c.sec), mod = Pool.moduleOfSec(c.sec);
    savePath({
      course: course ? course.id : null,
      mod: mod ? mod.id : null,
      sec: c.sec || null,
      concept: c.id,
      pyq: null
    });
    void opts;
    return true;
  }

  return { mount, mountAll, seedOpen, revealPath, refresh, scrollToOpen, path };
})();


/* ── src/comp.question.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One objective question, as a component.

   This used to live inside the Questions page, which is why answering a
   question meant leaving the note that taught it. The machinery is unchanged —
   OMR sheet first, lock, then verdict + worked answer + what it tests + trap +
   variant — it has simply stopped belonging to a screen, so the note can put a
   question inside itself and the reel can put one on a card.

   MCQ, MSQ and NAT are scored by their own rules, not one shared rule:
     MCQ  one key; a wrong lock costs the negative mark
     MSQ  the exact set is required; a clean subset is reported as partial and
          earns nothing, which is the convention these papers use
     NAT  numeric within the stated tolerance; no negative marking
   Only the first lock is recorded.
   ══════════════════════════════════════════════════════════════════════════ */

const QuestionCard = (function () {

  const el = DOM.el;

  /* ── scoring ───────────────────────────────────────────────────────────── */
  function judge(q, given) {
    if (q.type === 'MCQ') {
      return given === q.answer ? 'correct' : 'wrong';
    }
    if (q.type === 'MSQ') {
      const key = q.answer.slice().sort().join(',');
      const got = given.slice().sort().join(',');
      if (key === got) return 'correct';
      const noWrong = given.every(k => q.answer.indexOf(k) >= 0);
      return (noWrong && given.length) ? 'partial' : 'wrong';
    }
    const n = parseFloat(String(given).replace(/[^0-9eE+\-.]/g, ''));
    if (!isFinite(n)) return 'wrong';
    return Math.abs(n - q.answer.value) <= (q.answer.tol || 0) + 1e-12 ? 'correct' : 'wrong';
  }

  const awarded = (q, verdict) =>
    verdict === 'correct' ? q.marks : (q.type === 'MCQ' ? (q.neg || 0) : 0);

  const keyText = q => q.type === 'NAT'
    ? q.answer.value.toFixed(q.answer.dp || 0) + (q.answer.tol ? ' (± ' + q.answer.tol + ')' : '')
    : (Array.isArray(q.answer) ? q.answer.join(' and ') : q.answer);

  const givenText = (q, given) => q.type === 'NAT'
    ? String(given)
    : (Array.isArray(given) ? (given.slice().sort().join(' and ') || '—') : given);

  /* The figure of the first tested concept that has one — seeing the picture
     right after the attempt is when it lands hardest. */
  function figureFor(q) {
    const withFig = (q.tests || [])
      .map(id => Pool.concept(id))
      .filter(c => c && Fig.forConcept(c).length)[0];
    if (!withFig) return null;
    const def = Fig.forConcept(withFig)[0].def;
    return el('div', { class: 'stack', style: { gap: '8px' } }, [
      el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('picture_behind') : 'The picture behind it' }),
      Fig.frame(def)
    ]);
  }

  /* ── the component ───────────────────────────────────────────────────────
     opts.inNote   true when the question is open inside a note: the links back
                   to concepts are then pointless and the chrome is lighter
     opts.tail     extra nodes appended after the worked answer (the "next
                   question" row the Questions page still wants)
     opts.onLocked called with the verdict once the first lock lands */
  function build(q, opts) {
    const o = opts || {};
    const rec = Store.omr(q.id);
    const already = rec && rec.first;

    let given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
    let locked = false;
    const started = Date.now();

    const sheetHost = el('div', {});
    const actionHost = el('div', {});
    const resultHost = el('div', {});

    const timer = el('span', { class: 'timer', text: '0:00' });
    const tick = window.setInterval(function () {
      /* stop on lock, and stop once this component has been thrown away */
      if (locked || !document.body.contains(timer)) { window.clearInterval(tick); return; }
      timer.textContent = UI.clock(Date.now() - started);
    }, 1000);

    /* — OMR sheet — */
    function paintSheet(focusIdx) {
      const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
      DOM.clear(sheetHost);

      if (q.type === 'NAT') {
        const input = el('input', {
          type: 'text', inputmode: 'decimal', autocomplete: 'off',
          'aria-label': isMl ? 'നിങ്ങളുടെ സംഖ്യാ ഉത്തരം' : 'Your numeric answer', placeholder: '0.00',
          disabled: locked || null
        });
        input.value = typeof given === 'string' ? given : '';
        input.addEventListener('input', function () { given = input.value; paintActions(); });
        sheetHost.appendChild(el('div', { class: 'nat-in' }, [
          input,
          el('span', { class: 'small muted', text: q.answer.dp
            ? (isMl ? (q.answer.dp + ' ദശാംശസ്ഥാനം വരെ') : ('to ' + q.answer.dp + ' decimal places'))
            : (isMl ? 'പൂർണ്ണസംഖ്യ' : 'integer') })
        ]));
        if (locked) {
          sheetHost.appendChild(el('p', { class: 'small muted', style: { margin: '8px 0 0' },
            text: (isMl ? 'ശരിയായ പരിധി: ' : 'Accepted range: ') + keyText(q) }));
        }
        return;
      }

      const msq = q.type === 'MSQ';
      const selectAria = msq
        ? ((typeof I18N !== 'undefined') ? I18N.t('select_all_correct') : 'Select all correct options')
        : ((typeof I18N !== 'undefined') ? I18N.t('select_one_option') : 'Select one option');
      const group = el('div', {
        class: 'omr', role: msq ? 'group' : 'radiogroup',
        'aria-label': selectAria
      });

      (q.options || []).forEach(function (opt) {
        const chosen = msq ? given.indexOf(opt.k) >= 0 : given === opt.k;
        const isKey = locked && (msq ? q.answer.indexOf(opt.k) >= 0 : q.answer === opt.k);
        const badChoice = locked && chosen && !isKey;

        const row = el('button', {
          class: 'omr-opt' + (msq ? ' msq' : '') + (isKey ? ' key' : '') + (badChoice ? ' chosen-bad' : ''),
          type: 'button',
          role: msq ? 'checkbox' : 'radio',
          'aria-checked': String(chosen),
          'aria-disabled': locked ? 'true' : null
        }, [
          el('span', { class: 'bub', 'aria-hidden': 'true', text: opt.k }),
          el('span', { class: 't', html: opt.t }),
          locked && isKey ? el('span', { class: 'omr-mark ok', text: (typeof I18N !== 'undefined') ? I18N.t('key') : 'key' }) : null,
          badChoice ? el('span', { class: 'omr-mark bad', text: (typeof I18N !== 'undefined') ? I18N.t('yours') : 'yours' }) : null
        ]);

        if (!locked) row.addEventListener('click', function () {
          if (msq) {
            const i = given.indexOf(opt.k);
            if (i >= 0) given.splice(i, 1); else given.push(opt.k);
          } else given = opt.k;
          paintSheet(q.options.indexOf(opt));   /* keep focus on the row just used */
          paintActions();
        });
        group.appendChild(row);
      });

      /* arrow-key movement inside the group, as a radiogroup should behave */
      group.addEventListener('keydown', function (e) {
        if (locked) return;
        const keys = ['ArrowDown', 'ArrowRight', 'ArrowUp', 'ArrowLeft'];
        if (keys.indexOf(e.key) < 0) return;
        e.preventDefault();
        const rows = Array.prototype.slice.call(group.querySelectorAll('.omr-opt'));
        const at = rows.indexOf(document.activeElement);
        const dir = (e.key === 'ArrowDown' || e.key === 'ArrowRight') ? 1 : -1;
        const nextRow = rows[(at + dir + rows.length) % rows.length];
        if (nextRow) nextRow.focus();
      });

      sheetHost.appendChild(group);
      if (focusIdx != null) {
        const rows = group.querySelectorAll('.omr-opt');
        if (rows[focusIdx]) rows[focusIdx].focus({ preventScroll: true });
      }
      UI.math(group);
    }

    /* — lock / clear — */
    function hasAnswer() {
      if (q.type === 'MSQ') return given.length > 0;
      if (q.type === 'NAT') return String(given).trim().length > 0;
      return !!given;
    }

    function paintActions() {
      const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
      DOM.clear(actionHost);
      if (locked) return;
      DOM.add(actionHost, [
        el('div', { class: 'btn-row' }, [
          el('button', {
            class: 'btn primary', type: 'button', disabled: hasAnswer() ? null : true,
            text: q.type === 'MSQ'
              ? (isMl ? ('തിരഞ്ഞെടുത്ത ' + (given.length || 0) + ' എണ്ണം സ്ഥിരീകരിക്കുക') : ('Lock ' + (given.length || 'no') + ' selected'))
              : ((typeof I18N !== 'undefined') ? I18N.t('lock_answer') : 'Lock answer'),
            on: { click: lock }
          }),
          hasAnswer() ? el('button', { class: 'btn', type: 'button',
            text: (typeof I18N !== 'undefined') ? I18N.t('clear') : 'Clear',
            on: { click: function () {
              given = q.type === 'MSQ' ? [] : (q.type === 'NAT' ? '' : null);
              paintSheet(); paintActions();
            } } }) : null
        ]),
        el('p', { class: 'small muted', style: { margin: '10px 0 0' },
          text: already
            ? (isMl ? ('നിങ്ങളുടെ ആദ്യ ശ്രമം (' + already.verdict + ') രേഖപ്പെടുത്തിയിട്ടുണ്ട്.') : ('Your first attempt (' + already.verdict + ') is already on record; this pass is not recorded.'))
            : (isMl ? 'ഉത്തരം സ്ഥിരീകരിച്ചാൽ ഉടൻ വിശദമായ പരിഹാരം കാണാം.' : 'Locking records your first attempt. The worked answer follows immediately.') })
      ]);
    }

    function lock() {
      if (locked || !hasAnswer()) return;
      locked = true;
      const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
      const verdict = judge(q, given);
      const ms = Date.now() - started;
      const saved = Store.lockOmr(q.id, { given: given, verdict: verdict, ms: ms });
      paintSheet();
      DOM.clear(actionHost);
      resultHost.appendChild(feedback(q, given, verdict, ms, saved));
      UI.math(resultHost);
      DOM.announce(verdict === 'correct'
        ? (isMl ? 'ശരിയുത്തരം.' : 'Correct.')
        : verdict === 'partial'
          ? (isMl ? 'ഭാഗികമായി ശരി.' : 'Partially correct.')
          : (isMl ? 'തെറ്റായ ഉത്തരം. പരിഹാരം കാണിച്ചിരിക്കുന്നു.' : 'Incorrect. Worked answer shown.'));
      if (o.onLocked) o.onLocked(verdict, ms);
      const h = resultHost.querySelector('.verdict');
      if (h) h.scrollIntoView({ block: 'center', behavior: 'smooth' });
    }

    /* — after the lock: verdict, worked answer, what it tests, trap, twist — */
    function feedback(q, given, verdict, ms, saved) {
      const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
      const wrap = el('div', { class: 'stack' });
      const marks = awarded(q, verdict);
      const cls = verdict === 'correct' ? 'ok' : verdict === 'partial' ? 'warn' : 'bad';
      const glyph = verdict === 'correct' ? 'check_circle' : verdict === 'partial' ? 'remove_circle' : 'cancel';

      const verdictTitle = verdict === 'correct'
        ? ((typeof I18N !== 'undefined') ? I18N.t('correct') : 'Correct')
        : verdict === 'partial'
          ? ((typeof I18N !== 'undefined') ? I18N.t('partially_correct') : 'Partially correct')
          : ((typeof I18N !== 'undefined') ? I18N.t('not_correct') : 'Not correct');

      const marksWord = (typeof I18N !== 'undefined') ? I18N.t(Math.abs(marks) === 1 ? 'mark' : 'marks') : DOM.plural(Math.abs(marks), 'mark');

      DOM.add(wrap, [
        el('div', { class: 'verdict ' + cls }, [
          el('span', { class: 'g', 'aria-hidden': 'true' }, [DOM.mi(glyph)]),
          el('span', {}, [
            el('b', { text: verdictTitle }),
            el('span', { text: (isMl ? 'നിങ്ങൾ നൽകിയത് ' : 'You answered ') + givenText(q, given) +
              (isMl ? ' · ശരിയുത്തരം ' : ' · key ') + keyText(q) +
              ' · ' + (marks > 0 ? '+' : '') + (Math.round(marks * 100) / 100) + ' ' +
              marksWord + ' · ' + UI.clock(ms) })
          ])
        ]),

        saved.tries > 1 ? el('p', { class: 'small muted', style: { margin: 0 },
          text: isMl ? ('ആദ്യ ശ്രമം (' + saved.first.verdict + ') മാറ്റിയിട്ടില്ല.') : ('First attempt (' + saved.first.verdict + ') is unchanged — that is the number the stats use.') }) : null,

        /* a miss is only useful once it has a reason */
        verdict !== 'correct' ? UI.whyRow('q:' + q.id, (q.tests || [])[0] || q.concept || null) : null,

        el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('worked_answer') : 'Worked answer' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.solution, 'tight')])
        ]),

        q.tested ? el('div', { class: 'card tint' }, [
          el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('what_tests') : 'What this actually tests' }),
          el('div', { style: { marginTop: '10px' } }, [UI.prose(q.tested, 'tight')]),
          o.inNote ? null : el('div', { class: 'row', style: { marginTop: '12px' } },
            (q.tests || []).map(function (id) {
              const c = Pool.concept(id);
              return c
                ? el('a', { class: 'chip', href: Router.href('note/' + id), text: c.title })
                : el('span', { class: 'chip ghost', text: id });
            }))
        ]) : null,

        /* the picture of the idea being examined, where there is one */
        figureFor(q),

        q.trap ? el('div', { class: 'card' }, [
          el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('the_trap') : 'The trap' }),
          el('div', { style: { marginTop: '8px' } }, [UI.prose(q.trap, 'tight')])
        ]) : null,

        q.twist ? UI.reveal('Changed version', function () {
          return el('div', { class: 'stack', style: { gap: '10px' } }, [
            UI.prose(q.twist.q, 'tight'),
            UI.reveal('Answer', () => UI.prose(q.twist.a, 'tight'),
              { openLabel: 'Show', closeLabel: 'Hide' })
          ]);
        }, { openLabel: 'Try the variant', closeLabel: 'Hide the variant' }) : null,

        o.tail || null
      ]);
      return wrap;
    }

    const node = el('div', { class: o.inNote ? 'stack qcard' : 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'row' }, [
          UI.typeBadge(q),
          q.mock ? el('span', { class: 'badge warn', text: 'draft' }) : null,
          o.drill ? el('span', { class: 'badge', text: Pool.sectionTitle(q.sec) }) : null
        ]),
        timer
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.metaRow(q)]),
      el('div', { style: { marginTop: '14px' } }, [UI.prose(q.prompt)]),
      el('div', { style: { marginTop: '16px' } }, [sheetHost]),
      el('div', { style: { marginTop: '16px' } }, [actionHost]),
      resultHost
    ]);

    paintSheet();
    paintActions();
    UI.math(node);
    return node;
  }

  return { build, judge, awarded, keyText, givenText, figureFor };
})();


/* ── src/comp.note.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   One concept note, as a component that opens INSIDE the syllabus.

   The note used to be a page of its own, which meant that reading a section
   was a loop of leaving the tree and coming back to it — four screens for one
   act of studying. It is now a body with no chrome: the tree expands a row and
   drops this in, and everything the note used to link out to (its proof, its
   exercises, its objective questions, the writing workspace) opens inside it,
   in the same scroll.

   Nothing here is built until the note is opened, and the questions inside it
   are not built until each one is opened in turn. A section of forty concepts
   costs one row each until you ask for more.

   The vocabulary of the buttons: a claim is "Mark as complete", not "Tick
   level 2". The level still moves — it is just no longer what the button
   talks about. Reading is level 1, the section's exercises are level 2, the
   course's past papers are level 3. A derivation, where a result has one, is
   optional work that feeds the recall reel; it does not gate a level.

   Two things here come straight from the learning research: every exercise
   opens as Pólya's four steps (understand, plan, solve, look back), and every
   note ends with "teach it back" — explain it in your own words, which is
   Chi's self-explanation effect and Feynman's test in one box.
   ══════════════════════════════════════════════════════════════════════════ */

const NoteBody = (function () {

  const el = DOM.el;

  /* A one-shot request from a route: open this section when the note builds. */
  let wanted = null;
  const wantOpen = what => { wanted = what; };
  const takeWanted = what => { if (wanted === what) { wanted = null; return true; } return false; };

  /* ── a lazy, titled expander ─────────────────────────────────────────────
     The one pattern the whole note is built from: a header you press and a
     body that does not exist until you do. */
  function expander(opts) {
    const o = opts || {};
    const isOpen = !!o.open;
    const body = el('div', { class: 'exp-b', hidden: !isOpen });
    const chev = DOM.icon('chev', 18, 'chev');
    const head = el('button', { class: 'exp-h', type: 'button', 'aria-expanded': String(isOpen) }, [
      o.mark || null,
      el('span', { class: 'tt' }, [
        el('b', { text: o.title }),
        o.sub ? el('span', { text: o.sub }) : null
      ]),
      o.badge || null,
      chev
    ]);
    let built = false;
    function openBody() {
      if (!built) {
        built = true;
        DOM.add(body, o.build());
        UI.math(body);
      }
      body.hidden = false;
      head.setAttribute('aria-expanded', 'true');
      if (o.onOpen) o.onOpen(body);
    }
    function closeBody() {
      body.hidden = true;
      head.setAttribute('aria-expanded', 'false');
    }
    head.addEventListener('click', function () {
      if (body.hidden) openBody(); else closeBody();
    });
    if (isOpen) {
      built = true;
      DOM.add(body, o.build());
    }
    const host = el('div', { class: 'exp' + (o.cls ? ' ' + o.cls : '') }, [head, body]);
    host._head = head;
    host._open = openBody;
    host._close = closeBody;
    host._isOpen = function () { return !body.hidden; };
    return host;
  }

  /* ── the prerequisite chain, walked and rendered as a path ──────────────
     A prerequisite is satisfied once it has been READ, and nothing more is
     asked of it. Judging the chain at the highest level anything in it had
     reached was the bug that made groundwork look permanently outstanding. */
  function prereqPath(c) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const chain = Pool.chain(c.id, 3);
    if (chain.length < 2) return null;
    const missing = chain.filter(x => x.id !== c.id && !Progress.prereqOk(x.id)).length;

    const notReadText = isMl ? (missing + ' എണ്ണം വായിക്കാനുണ്ട്') : (missing + ' not read yet');
    const groundworkText = (typeof I18N !== 'undefined') ? I18N.t('groundwork_read') : 'groundwork read';

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('route_to_result') : 'Route to this result' }),
        missing
          ? el('span', { class: 'badge warn', text: notReadText })
          : el('span', { class: 'badge ok', text: groundworkText })
      ]),
      el('div', { class: 'path', style: { marginTop: '10px' } }, chain.map(function (x, i) {
        const here = x.id === c.id;
        const lv = Progress.level(x.id);
        const ok = Progress.prereqOk(x.id);
        const kindLabel = (typeof I18N !== 'undefined') ? I18N.kind(x.kind) : x.kind;
        const lvlWord = (typeof I18N !== 'undefined') ? I18N.t('level') : 'level';
        const kids = [
          el('span', { class: 'dot', 'aria-hidden': 'true' },
            [ok && !here ? DOM.mi('check', 'xs') : el('span', { text: here ? '•' : String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: x.title }),
            el('span', { text: here ? ((typeof I18N !== 'undefined') ? I18N.t('you_are_here') : 'you are here')
              : '§' + x.sec + ' · ' + kindLabel + ' · ' + lvlWord + ' ' + lv })
          ])
        ];
        return here
          ? el('div', { class: 'pstep here' }, kids)
          : el('a', { class: 'pstep' + (ok ? ' done' : ''), 'data-lv': String(lv),
              href: Router.href('note/' + x.id) }, kids);
      }))
    ]);
  }

  /* ── reverse edges: what this result is used for ──────────────────────── */
  function unlocks(c) {
    const next = Pool.unlocks(c.id);
    if (!next.length) return null;
    return el('div', { class: 'card tint' }, [
      el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('used_later') : 'Used later by' }),
      el('div', { class: 'row', style: { marginTop: '10px' } }, next.map(function (x) {
        return el('a', { class: 'chip', href: Router.href('note/' + x.id) }, [
          Progress.level(x.id) >= 1 ? DOM.mi('check', 'xs') : null,
          el('span', { text: x.title })
        ]);
      }))
    ]);
  }

  /* ── the claim that earns a level ────────────────────────────────────────
     One control, because it is one kind of claim — "I produced this myself".
     It is deliberately not a checkbox you can tick on the way past. */
  function taskRow(id, opts) {
    const o = opts || {};
    const noun = o.noun || 'proof';
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const btn = el('button', { class: 'btn', type: 'button' });
    const note = el('p', { class: 'small muted', style: { margin: '8px 0 0' } });

    function paint() {
      const on = Store.isProofDone(id);
      btn.className = 'btn' + (on ? '' : ' primary');
      DOM.clear(btn);
      const btnText = on
        ? ((typeof I18N !== 'undefined') ? I18N.t('complete_undo') : 'Completed — undo')
        : ((typeof I18N !== 'undefined') ? I18N.t('mark_complete') : 'Mark as complete');
      DOM.add(btn, [
        DOM.mi(on ? 'task_alt' : 'radio_button_unchecked', 'sm'),
        el('span', { text: btnText })
      ]);
      btn.setAttribute('aria-pressed', String(on));
      note.textContent = on
        ? (isMl ? 'പൂർത്തിയായതായി രേഖപ്പെടുത്തി.' : 'Marked complete on this ' + noun + '.')
        : (isMl ? 'സ്വയം ചെയ്തു കണ്ടെത്തിയെങ്കിൽ മാത്രം രേഖപ്പെടുത്തുക; വായിച്ചതിന് അല്ല.' : 'Claim this only if you worked it yourself, not if you read the answer.');
    }

    btn.addEventListener('click', function () {
      const next = !Store.isProofDone(id);
      Store.setProofDone(id, next);
      /* A proof cannot be worked through on a note you have not read, so
         claiming it carries the reading tick with it. An exercise key ('w:')
         is a section-wide claim and owns no single concept, so it carries
         nothing. */
      if (next && id.indexOf('w:') !== 0 && id.indexOf('p:') !== 0 && !Store.isDone(id)) {
        Store.setDone(id, true);
      }
      Progress.dropCache();
      paint();
      if (o.onTick) o.onTick();
      DOM.announce(next ? (isMl ? 'പൂർത്തിയായി.' : 'Marked complete.') : (isMl ? 'ഒഴിവാക്കി.' : 'Completion removed.'));
    });
    paint();

    const host = el('div', { class: 'proof-done', style: { marginTop: '16px' } }, [
      el('div', { class: 'btn-row' }, [btn]),
      note
    ]);
    host._paint = paint;
    return host;
  }

  /* ── the proof ───────────────────────────────────────────────────────── */
  function proofView(c, onTick) {
    if (!c.proof) return null;
    const p = c.proof;
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';

    const tryHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });
    const proofHost = el('div', { class: 'stack', style: { gap: '10px', marginTop: '12px' }, hidden: true });

    let tryBuilt = false;
    let proofBuilt = false;

    function buildTry() {
      const kids = [];
      if (p.idea) {
        kids.push(el('div', { class: 'card tint', style: { padding: '10px 14px' } }, [
          el('div', { class: 'kicker' }, [DOM.mi('lightbulb', 'xs'), el('span', { text: ' ' + ((typeof I18N !== 'undefined') ? I18N.t('proof_strategy') : 'Proof strategy') })]),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
        ]));
      }
      if (p.why) {
        kids.push(el('div', { class: 'card flat', style: { padding: '10px 14px', borderLeft: '3px solid var(--accent, #4f46e5)' } }, [
          el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('core_rationale') : 'Core Rationale' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.why })
        ]));
      }
      if (p.rungs && p.rungs.length > 0 && p.rungs[0].why) {
        kids.push(el('div', { class: 'card flat', style: { padding: '8px 12px', background: 'var(--surface-2)' } }, [
          el('div', { class: 'small muted' }, [
            el('b', { text: (typeof I18N !== 'undefined') ? I18N.t('first_step_clue') : 'First step clue: ' }),
            el('span', { html: p.rungs[0].why })
          ])
        ]));
      }
      /* The scratchpad is the full writing workspace, not a bare textarea */
      const pad = el('div', { class: 'scratch' });
      WriteBox.mount(pad, {
        draftKey: 'proof:' + c.id, concept: c,
        label: (typeof I18N !== 'undefined') ? I18N.t('scratchpad_proof') : 'Scratchpad · draft the argument before you look',
        placeholder: isMl ? 'പ്രധാന ഘട്ടം…' : 'The main move is…'
      });
      kids.push(pad);
      return kids;
    }

    function buildProof() {
      const kids = [];
      if (p.idea) {
        kids.push(el('div', { class: 'card tint', style: { marginBottom: '6px', padding: '10px 14px' } }, [
          el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('key_idea') : 'Key Idea' }),
          el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: p.idea })
        ]));
      }
      if (p.rungs && p.rungs.length) {
        kids.push(el('div', { class: 'stack', style: { gap: '10px' } },
          p.rungs.map(function (r, idx) {
            const stepWord = (typeof I18N !== 'undefined') ? I18N.t('step') : 'Step';
            const rungItems = [
              el('div', { class: 'small muted', style: { marginBottom: '6px' } }, [
                el('b', { text: stepWord + ' ' + (idx + 1) + ': ' }),
                el('span', { html: r.why })
              ])
            ];

            const rawContent = (r.meaning || r.m || '').trim();
            if (rawContent) {
              const isExplanation = !!r.meaning ||
                /^what this (really )?means/i.test(rawContent) ||
                /^meaning:/i.test(rawContent) ||
                (!rawContent.startsWith('$$') && !/^\s*\\[a-zA-Z]+/.test(rawContent) && rawContent.split(/\s+/).length > 6 && !rawContent.includes('\\begin'));

              if (isExplanation) {
                const text = rawContent.replace(/^(what this (really )?means:?|meaning:?)\s*/i, '');
                rungItems.push(el('div', {
                  class: 'rung-meaning',
                  style: {
                    marginTop: '8px', padding: '8px 12px',
                    background: 'var(--surface-2, rgba(0,0,0,0.03))',
                    borderRadius: '6px', borderLeft: '2px solid var(--accent, #4f46e5)',
                    fontSize: '0.88rem', lineHeight: '1.45'
                  }
                }, [
                  el('div', {
                    class: 'kicker',
                    style: { fontSize: '0.68rem', color: 'var(--accent, #4f46e5)', marginBottom: '3px', fontWeight: '600' },
                    text: (typeof I18N !== 'undefined') ? I18N.t('what_means') : 'What this really means'
                  }),
                  el('div', { class: 'prose tight', html: text })
                ]));
              } else {
                let mathHtml = rawContent;
                if (!mathHtml.includes('$')) mathHtml = '$$' + mathHtml + '$$';
                rungItems.push(el('div', { style: { marginTop: '6px', overflowX: 'auto' }, html: mathHtml }));
              }
            }

            if (r.meaning && r.m && r.m.trim() !== r.meaning.trim()) {
              let mathHtml = r.m.trim();
              if (!mathHtml.includes('$')) mathHtml = '$$' + mathHtml + '$$';
              rungItems.splice(1, 0, el('div', { style: { marginTop: '6px', overflowX: 'auto' }, html: mathHtml }));
            }

            return el('div', { class: 'card flat', style: { padding: '10px 14px', borderLeft: '3px solid var(--accent, #4f46e5)' } }, rungItems);
          })
        ));
      }
      if (p.ends) {
        kids.push(el('div', { class: 'prose tight', style: { marginTop: '12px', fontStyle: 'italic', borderTop: '1px solid var(--line, rgba(0,0,0,0.1))', paddingTop: '8px' }, html: p.ends }));
      }
      return kids;
    }

    const tryBtnText = (typeof I18N !== 'undefined') ? I18N.t('try_proof_hint') : 'Try proof (hint)';
    const hideHintText = (typeof I18N !== 'undefined') ? I18N.t('hide_hint') : 'Hide hint';
    const showProofText = (typeof I18N !== 'undefined') ? I18N.t('show_proof') : 'Show step-by-step proof';
    const hideProofText = (typeof I18N !== 'undefined') ? I18N.t('hide_proof') : 'Hide proof';

    const tryBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
      [DOM.mi('lightbulb', 'sm'), el('span', { class: 'lb', text: tryBtnText })]);

    const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
      [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: showProofText })]);

    tryBtn.addEventListener('click', function () {
      const open = tryHost.hidden;
      if (open && !tryBuilt) { tryBuilt = true; DOM.add(tryHost, buildTry()); UI.math(tryHost); }
      tryHost.hidden = !open;
      tryBtn.setAttribute('aria-expanded', String(open));
      tryBtn.querySelector('.lb').textContent = open ? hideHintText : tryBtnText;
    });

    showBtn.addEventListener('click', function () {
      const open = proofHost.hidden;
      if (open && !proofBuilt) { proofBuilt = true; DOM.add(proofHost, buildProof()); UI.math(proofHost); }
      proofHost.hidden = !open;
      showBtn.setAttribute('aria-expanded', String(open));
      showBtn.querySelector('.lb').textContent = open ? hideProofText : showProofText;
    });

    const row = taskRow(c.id, { noun: 'proof', onTick: onTick });
    const proofTitle = (typeof I18N !== 'undefined') ? I18N.t('proof_heading') : 'Proof & rigorous argument';
    const stepsCount = (p.rungs ? p.rungs.length : 0);
    const stepsSub = stepsCount + ' ' + ((typeof I18N !== 'undefined') ? I18N.t('proof_sub') : 'steps · optional, joins the recall reel once worked');

    const view = expander({
      cls: 'exp-proof',
      open: false,
      title: proofTitle,
      sub: stepsSub,
      build: function () {
        return [
          el('div', { class: 'row', style: { gap: '8px', flexWrap: 'wrap' } }, [tryBtn, showBtn]),
          tryHost, proofHost, row
        ];
      }
    });
    view._paintProofDone = row._paint;
    return view;
  }

  /* Level 3 is a SECTION bar, so the note has to say where the section stands */
  function sectionTasks(c) {
    if (!c.sec) return null;
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const t = Progress.secTaskState(c.sec);
    if (!t.total) return null;

    const kickerText = '§' + c.sec + ' ' + I18N.t('sec_exercises_lv');
    const statusText = t.ready ? I18N.t('sec_ready') : I18N.t('sec_not_ready');

    return el('div', { class: 'card tint' }, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: kickerText }),
        el('span', { class: 'count', text: t.done + ' / ' + t.total })
      ]),
      el('div', { style: { marginTop: '10px' } }, [UI.meter(t.done, t.total, 2)]),
      el('p', { class: 'small muted', style: { margin: '10px 0 0' }, text: statusText })
    ]);
  }

  function traps(c) {
    if (!c.traps || !c.traps.length) return null;
    return el('div', { class: 'card' }, [
      el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('common_traps') : 'Where marks are lost' }),
      el('ul', { class: 'prose tight', style: { marginTop: '10px', paddingLeft: '1.1em' } },
        c.traps.map(t => el('li', { html: t })))
    ]);
  }

  function selfChecks(c) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const cards = (c.cards || []);
    if (!cards.length) return null;
    const subText = cards.length + ' ' + I18N.t('self_check_sub');

    return expander({
      title: (typeof I18N !== 'undefined') ? I18N.t('self_checks') : 'Self-check',
      open: true,
      sub: subText,
      build: function () {
        return [el('div', { class: 'stack', style: { gap: '14px' } }, cards.map(function (card) {
          return el('div', { class: 'stack', style: { gap: '6px' } }, [
            el('div', { class: 'prose tight', html: card.q }),
            UI.reveal(I18N.kind(card.kind), () => el('div', { class: 'prose tight', html: card.a }),
              {
                openLabel: (typeof I18N !== 'undefined') ? I18N.t('show_answer') : 'Show answer',
                closeLabel: (typeof I18N !== 'undefined') ? I18N.t('hide') : 'Hide'
              })
          ]);
        }))];
      }
    });
  }

  /* ── objective questions, answered here ──────────────────────────────── */
  function questionsOn(c) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    let qs = Pool.objectiveFor(c.id);
    if (!qs.length && c.sec) {
      qs = Pool.objective().filter(q => q.sec === c.sec);
    }
    if (!qs.length) return null;
    return el('div', { class: 'stack', style: { gap: '8px' } }, [
      el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('objective_on_this') : 'Objective questions on this' }),
      el('div', { class: 'stack', style: { gap: '8px' } }, qs.map(function (q) {
        const mark = el('span', { class: 'ix' });
        const sub = el('span', {});

        function paintMark() {
          const rec = Store.omr(q.id);
          const v = rec && rec.first && rec.first.verdict;
          mark.className = 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : '');
          DOM.clear(mark);
          mark.appendChild(DOM.mi(v === 'correct' ? 'check' : v ? 'close' : 'radio_button_unchecked', 'xs'));
          sub.textContent = v
            ? ((isMl ? 'ആദ്യ ശ്രമം: ' : 'first attempt: ') + (v === 'correct' ? (isMl ? 'ശരി' : 'correct') : v === 'partial' ? (isMl ? 'ഭാഗികം' : 'partial') : (isMl ? 'തെറ്റ്' : 'wrong')))
            : (isMl ? 'ശ്രമിച്ചിട്ടില്ല' : 'not attempted');
        }
        paintMark();

        const qKindLabel = (typeof I18N !== 'undefined') ? I18N.kind(q.type) : q.type;

        const node = expander({
          cls: 'exp-q',
          open: true,
          mark: mark,
          title: qKindLabel + ' · ' + I18N.marks(q.marks),
          sub: ' ',
          build: function () {
            return [QuestionCard.build(q, { inNote: true, onLocked: paintMark })];
          }
        });
        const slot = node.querySelector('.exp-h .tt span');
        if (slot) slot.parentNode.replaceChild(sub, slot);
        return node;
      }))
    ]);
  }

  /* ── the section's exercises, worked here ────────────────────────────── */
  function writtenOn(c, onTick, isOpen) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    let qs = Pool.writtenFor(c.id);
    if (!qs.length && c.sec) {
      qs = Pool.writtenForSec(c.sec);
    }
    if (!qs.length) return null;

    const countSpan = el('span', { class: 'count' });
    const mark = el('span', { class: 'ix' });

    function updateHeader() {
      const done = qs.filter(q => Progress.taskDone(q)).length;
      const allDone = done === qs.length;
      DOM.clear(mark);
      mark.className = 'ix' + (allDone ? ' ok' : '');
      mark.appendChild(DOM.mi(allDone ? 'check' : 'radio_button_unchecked', 'xs'));
      countSpan.textContent = done + ' / ' + qs.length;
    }
    updateHeader();

    const subText = qs.length + ' ' + I18N.t('exercises_sub');

    const exp = expander({
      cls: 'exp-exercises',
      open: !!isOpen,
      mark: mark,
      title: (typeof I18N !== 'undefined') ? I18N.t('exercises_on_this') : 'Exercises on this',
      sub: subText,
      badge: countSpan,
      build: function () {
        return [
          el('p', { class: 'small muted', style: { margin: '0 0 10px' },
            text: (typeof I18N !== 'undefined')
              ? I18N.t('exercises_desc')
              : 'Every exercise in this section has to be worked through before the section turns amber. Work it on paper or in the scratchpad, then mark it complete.' }),
          el('div', { class: 'stack', style: { gap: '8px' } }, qs.map(function (q) {
            const qMark = el('span', { class: 'ix' });
            function paintQMark() {
              DOM.clear(qMark);
              const on = Progress.taskDone(q);
              qMark.className = 'ix' + (on ? ' ok' : '');
              qMark.appendChild(DOM.mi(on ? 'check' : 'radio_button_unchecked', 'xs'));
            }
            paintQMark();

            return expander({
              cls: 'exp-q',
              open: true,
              mark: qMark,
              title: q.title || (I18N.t('exercise') + ' ' + q.id),
              sub: I18N.marks(q.marks || 0),
              build: function () {
                const tryHost = el('div', { class: 'stack', style: { gap: '8px', marginTop: '8px' }, hidden: true });
                const answerHost = el('div', { class: 'prose tight', style: { marginTop: '8px' }, hidden: true });
                let tryBuilt = false, answerBuilt = false;

                /* Pólya's four steps, as a stepper. The approach hint, where
                   the data has one, belongs to the Plan step and is revealed
                   there, not before Understand is done. */
                function buildTry() {
                  const steps = [1, 2, 3, 4];
                  const host = el('div', { class: 'polya' });
                  let at = 0;
                  function paint() {
                    DOM.clear(host);
                    host.appendChild(el('div', { class: 'polya-track' }, steps.map((n, i) =>
                      el('button', { class: 'polya-dot' + (i === at ? ' on' : i < at ? ' done' : ''), type: 'button',
                        'aria-current': i === at ? 'step' : null, text: I18N.t('polya_' + n),
                        on: { click: function () { at = i; paint(); } } }))));
                    const n = steps[at];
                    const body = el('div', { class: 'polya-body' }, [
                      el('div', { class: 'kicker', text: (at + 1) + ' · ' + I18N.t('polya_' + n) }),
                      el('p', { class: 'prose tight', style: { margin: '6px 0 0' }, text: I18N.t('polya_' + n + '_q') })
                    ]);
                    if (n === 2 && q.approach) {
                      body.appendChild(el('div', { class: 'card tint', style: { padding: '10px 14px', marginTop: '10px' } }, [
                        el('div', { class: 'kicker' }, [DOM.mi('lightbulb', 'xs'), el('span', { text: ' ' + I18N.t('approach') })]),
                        el('div', { class: 'prose tight', style: { marginTop: '4px' }, html: q.approach })
                      ]));
                      UI.math(body);
                    }
                    if (n === 3) {
                      const pad = el('div', { class: 'scratch' });
                      WriteBox.mount(pad, {
                        draftKey: 'ex:' + q.id, concept: Pool.concept((q.tests || [])[0] || q.concept),
                        label: I18N.t('scratchpad_write'),
                        placeholder: isMl ? 'ഘട്ടം 1…' : 'Step 1…'
                      });
                      body.appendChild(pad);
                    }
                    body.appendChild(el('div', { class: 'btn-row', style: { marginTop: '10px' } }, [
                      at < steps.length - 1
                        ? el('button', { class: 'btn sm primary', type: 'button', text: I18N.t('next'), on: { click: function () { at += 1; paint(); } } })
                        : el('span', { class: 'small muted', text: I18N.t('polya_note') })
                    ]));
                    host.appendChild(body);
                  }
                  paint();
                  return [host];
                }

                function buildAnswer() {
                  return [
                    q.approach ? el('div', { html: q.approach }) : null,
                    q.solution ? el('div', { html: q.solution }) : null,
                    q.trap ? el('p', {}, [
                      el('b', { text: (typeof I18N !== 'undefined') ? I18N.t('trap') : 'Trap: ' }),
                      el('span', { html: q.trap })
                    ]) : null
                  ];
                }

                const tryBtnText = (typeof I18N !== 'undefined') ? I18N.t('try_hint') : 'Work it in four steps';
                const hideHintText = (typeof I18N !== 'undefined') ? I18N.t('hide_steps') : 'Hide steps';
                const showAnswerText = (typeof I18N !== 'undefined') ? I18N.t('show_answer') : 'Show answer';
                const hideAnswerText = (typeof I18N !== 'undefined') ? I18N.t('hide_answer') : 'Hide answer';

                const tryBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
                  [DOM.mi('format_list_numbered', 'sm'), el('span', { class: 'lb', text: tryBtnText })]);
                const showBtn = el('button', { class: 'chip', type: 'button', 'aria-expanded': 'false' },
                  [DOM.mi('visibility', 'sm'), el('span', { class: 'lb', text: showAnswerText })]);

                tryBtn.addEventListener('click', function () {
                  const open = tryHost.hidden;
                  if (open && !tryBuilt) { tryBuilt = true; DOM.add(tryHost, buildTry()); UI.math(tryHost); }
                  tryHost.hidden = !open;
                  tryBtn.setAttribute('aria-expanded', String(open));
                  tryBtn.querySelector('.lb').textContent = open ? hideHintText : tryBtnText;
                });

                showBtn.addEventListener('click', function () {
                  const open = answerHost.hidden;
                  if (open && !answerBuilt) { answerBuilt = true; DOM.add(answerHost, buildAnswer()); UI.math(answerHost); }
                  answerHost.hidden = !open;
                  showBtn.setAttribute('aria-expanded', String(open));
                  showBtn.querySelector('.lb').textContent = open ? hideAnswerText : showAnswerText;
                });

                return [
                  el('div', { class: 'prose tight', html: q.prompt }),
                  el('div', { class: 'row', style: { gap: '8px', marginTop: '10px', flexWrap: 'wrap' } },
                    [tryBtn, showBtn]),
                  tryHost, answerHost,
                  taskRow('w:' + q.id, { noun: 'exercise', onTick: function () {
                    paintQMark();
                    updateHeader();
                    if (onTick) onTick();
                  } })
                ];
              }
            });
          }))
        ];
      }
    });

    exp._updateHeader = updateHeader;
    return exp;
  }

  /* ── teach it back ───────────────────────────────────────────────────────
     The Feynman test as a box: one plain sentence, one example of your own,
     one place a classmate would slip. Nothing is graded; the draft is kept
     so tomorrow's version can be compared with today's. */
  function teachBack(c) {
    const open = takeWanted('teach');
    return expander({
      cls: 'exp-teach',
      open: open,
      mark: el('span', { class: 'ix' }, [DOM.mi('record_voice_over', 'xs')]),
      title: I18N.t('teach_title'),
      sub: I18N.t('teach_sub'),
      build: function () {
        const pad = el('div', { class: 'scratch' });
        WriteBox.mount(pad, {
          draftKey: 'teach:' + c.id, concept: c,
          label: I18N.t('teach_title'),
          placeholder: I18N.t('teach_placeholder')
        });
        return [
          el('ol', { class: 'prose tight teach-prompts' }, [
            el('li', { text: I18N.t('teach_p1') }),
            el('li', { text: I18N.t('teach_p2') }),
            el('li', { text: I18N.t('teach_p3') })
