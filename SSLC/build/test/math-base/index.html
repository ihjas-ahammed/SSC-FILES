/* ── src/comp.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   The writing workspace — a live markdown editor, one line at a time.

   The old workspace was a textarea with the rendering underneath and a sheet
   of LaTeX keys at the bottom. Two things were wrong with it on a phone: the
   key sheet covered the input it was meant to serve, and the rendering sat so
   far below a growing block of source that you stopped looking at it.

   So the shape is inverted. You write ONE line at a time, and that line's
   rendering sits directly ABOVE the input — where your eyes already are.
   Press Enter and the line settles into the document above; a fresh input
   appears beneath it, with its own output right above it again. The page
   fills downward with rendered mathematics and the caret is always at the
   bottom of it. Tap any settled line to reopen it.

   Commands are offered as completions rather than as a palette (core.latex.js):
   type a backslash and the matches appear in a strip immediately under the
   input, thumb-high. When nothing is being typed the strip shows the commands
   this theorem actually uses, so discovery still works without knowing how to
   spell anything.

   Still deliberately NOT a checker: it verifies that what you wrote renders,
   and says so out loud. Whether the mathematics is right stays your call.
   ══════════════════════════════════════════════════════════════════════════ */

const WriteBox = (function () {

  const el = DOM.el;

  function mount(host, opts) {
    const o = opts || {};
    const concept = o.concept || null;
    const uid = 'w' + Math.random().toString(36).slice(2, 8);

    /* MARKDOWN IS THE DEFAULT, AND SO IS MATHS. Every line is prose until you
       put maths in it, because a workspace you cannot write a sentence in is
       not a workspace — it is a formula box.

       Maths no longer needs fencing: write `I love \\frac{1}{2} in fact` and
       core.md.js finds the expression, typesets it, and leaves the sentence
       alone. Explicit $…$ and $$…$$ still work and still win, and the Σ key
       wraps the whole line for when the line really is nothing but maths.

       `mathFirst: true` is the opt-in exception for boxes that exist only to
       capture one formula; there, a line with no $ is taken as bare LaTeX. */
    const mathFirst = o.mathFirst === true;

    /* What the draft is filed under. Usually the concept, but a proof
       scratchpad and a statement attempt are different pieces of work on the
       same concept, so they need different keys — 'proof:<id>' for the former.
       Both merge across devices like any other draft. */
    const draftKey = o.draftKey || (concept ? concept.id : null);

    let firstInputFired = false;
    let lines = [''];
    let active = 0;

    const stored = (o.value != null ? o.value : (draftKey ? Store.draft(draftKey) : '')) || '';
    if (stored) { lines = stored.split('\n'); active = lines.length - 1; }

    /* ── chrome ────────────────────────────────────────────────────────── */
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const doc = el('div', { class: 'wdoc', id: uid + '-doc' });
    const strip = el('div', { class: 'wstrip', role: 'listbox',
      'aria-label': isMl ? 'കമാൻഡ് നിർദ്ദേശങ്ങൾ' : 'LaTeX command completions' });
    const errBox = el('div', { hidden: true });
    const saveNote = el('span', { class: 'small muted', text: '' });

    const hintText = isMl
      ? (mathFirst
        ? 'ഓരോ വരിയായി എഴുതുക. $ ഇല്ലാത്ത വരികൾ സമവാക്യമായി ദൃശ്യമാകും; വാക്കുകൾക്കൊപ്പം ചിഹ്നങ്ങൾ ചേർക്കാൻ $…$ ഉപയോഗിക്കുക. Enter അടുത്ത വരി തുടങ്ങും.'
        : 'സാധാരണ പോലെ എഴുതാം — **bold**, # തലക്കെട്ടുകൾ, - പട്ടിക. ഗണിത രൂപങ്ങൾക്ക് $ ആവശ്യമില്ല. Enter അടുത്ത വരി തുടങ്ങും.')
      : ((mathFirst
        ? 'One line at a time. A line with no $ is typeset as display maths; use $…$ to mix maths into words. '
        : 'Write normally — **bold**, # headings, - lists. Maths needs no dollar signs: '
          + 'type \\frac{1}{2} mid-sentence and it is typeset where it stands. A backslash '
          + 'opens the command list; the Σ key sets the whole line as display maths. ') +
        'Enter starts the next line.');

    const hint = el('p', {
      class: 'small muted', id: uid + '-hint', style: { margin: '6px 0 0' },
      text: hintText
    });

    /* the live input; one line, always the one you are writing */
    const field = el('input', {
      class: 'wfield', type: 'text', id: uid, spellcheck: 'false',
      autocapitalize: 'off', autocomplete: 'off', autocorrect: 'off',
      'aria-describedby': uid + '-hint',
      placeholder: o.placeholder || (isMl
        ? 'ഒരു വരി എഴുതുക — വാക്കുകൾ, അല്ലെങ്കിൽ \\frac{a}{b} പോലുള്ള ഗണിത രൂപങ്ങൾ…'
        : (mathFirst
          ? '\\forall \\varepsilon > 0 \\; \\exists \\delta > 0 \\ldots'
          : 'Write a line — words, **bold**, or maths like \\varepsilon > 0 …'))
    });

    const newlineBtn = el('button', { class: 'wkey', type: 'button',
      title: isMl ? 'അടുത്ത വരി തുടങ്ങുക (Enter)' : 'Start the next line (Enter)',
      'aria-label': isMl ? 'അടുത്ത വരി തുടങ്ങുക' : 'Start the next line' },
      [DOM.mi('keyboard_return', 'sm')]);

    const mathBtn = el('button', { class: 'wkey', type: 'button',
      title: isMl ? 'ഈ വരി മുഴുവൻ സമവാക്യമാക്കുക' : 'Wrap this line in display maths',
      'aria-label': isMl ? 'ഈ വരി മുഴുവൻ സമവാക്യമാക്കുക' : 'Wrap this line in display maths' },
      [DOM.mi('functions', 'sm')]);

    /* ── rendering one line ────────────────────────────────────────────── */

    /* Returns a promise resolving {ok, error, hint} so the active line can
       report, and settled lines can stay quiet. */
    function paint(target, src) {
      const text = String(src == null ? '' : src);

      if (!text.trim()) {
        DOM.clear(target);
        target.appendChild(el('div', { class: 'ph',
          text: target.dataset.live ? (isMl ? 'നിങ്ങൾ ടൈപ്പ് ചെയ്യുമ്പോൾ ഈ വരി ഇവിടെ ദൃശ്യമാകും.' : 'This line renders here as you type.') : ' ' }));
        return Promise.resolve({ ok: true, empty: true });
      }

      if (mathFirst && !Markdown.hasMath(text)) {
        return Tex.renderFragment(target, text, { display: true });
      }

      DOM.clear(target);
      target.appendChild(el('div', { class: 'prose tight', html: Markdown.line(text) }));
      return Tex.typeset(target).then(function () {
        const bad = target.querySelector('mjx-merror, [data-mjx-error]');
        if (!bad) return { ok: true };
        return { ok: false,
          error: bad.getAttribute('data-mjx-error') || bad.textContent || (isMl ? 'ഈ വരിയിലെ ഗണിത രൂപം കാണിക്കാൻ കഴിഞ്ഞില്ല.' : 'MathJax could not parse the maths on this line.') };
      });
    }

    function showProblem(res) {
      if (!res || res.ok === true && !res.hint) { errBox.hidden = true; DOM.clear(errBox); return; }
      if (res.ok && res.hint) {
        DOM.clear(errBox);
        errBox.appendChild(el('div', { class: 'tex-err' }, [
          DOM.mi('info', 'sm'), el('span', { text: res.hint })
        ]));
        errBox.hidden = false;
        return;
      }
      if (res.ok) { errBox.hidden = true; DOM.clear(errBox); return; }
      DOM.clear(errBox);
      errBox.appendChild(el('div', { class: 'tex-err' }, [
        DOM.mi('report', 'sm'),
        el('span', {}, [
          el('b', { text: isMl ? 'ഈ വരി ഇതുവരെ വ്യക്തമായി രൂപപ്പെടുത്തിയിട്ടില്ല. ' : 'This line does not render yet. ' }),
          el('span', { text: res.error || (isMl ? '{ അല്ലെങ്കിൽ } കൃത്യമാണോ എന്ന് പരിശോധിക്കുക.' : 'Check for an unmatched { or }.') })
        ])
      ]));
      errBox.hidden = false;
    }

    /* ── the document ──────────────────────────────────────────────────── */

    let liveOut = null;          /* the output frame above the active input */

    /* Settled lines are re-rendered on every rebuild, and MathJax is the most
       expensive thing in the app. Their output only depends on their source,
       so keep the markup by source text and reuse it. */
    const cache = {};

    function build() {
      DOM.clear(doc);
      liveOut = null;

      lines.forEach(function (text, i) {
        const out = el('div', { class: 'wout' });
        const row = el('div', { class: 'wline' + (i === active ? ' live' : '') }, [
          el('span', { class: 'wnum', 'aria-hidden': 'true', text: String(i + 1) }),

            el('span', { class: 'wcaret', 'aria-hidden': 'true', text: '›' }),
            field, mathBtn, newlineBtn
          ]));

        } else {

          row.setAttribute('tabindex', '0');
          row.setAttribute('role', 'button');
          row.setAttribute('aria-label', (isMl ? 'വരി തിരുത്തുക ' : 'Edit line ') + (i + 1));
          const open = function (e) {
            if (e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;

          row.addEventListener('click', open);
          row.addEventListener('keydown', open);

          if (cache[text] != null) out.innerHTML = cache[text];
          else paint(out, text).then(function () { cache[text] = out.innerHTML; });
        }
      });
    }

    const liveRender = DOM.debounce(function () {
      if (liveOut) paint(liveOut, field.value).then(showProblem);
    }, 200);

    const persist = DOM.debounce(function () {
      if (!draftKey) return;
      Store.saveDraft(draftKey, value());
      saveNote.textContent = value().trim() ? (isMl ? 'സേവ് ചെയ്തു' : 'Draft saved') : '';
    }, 700);

    function commitField() { lines[active] = field.value; }

    function focusLine(i, caret) {
      commitField();
      active = Math.max(0, Math.min(lines.length - 1, i));

         context, and iOS then refuses to bring the keyboard back up */

      try { field.setSelectionRange(at, at); } catch (e) { /* not focusable yet */ }
      revealInput();
    }

    /* ── completions ───────────────────────────────────────────────────── */
    let matches = [];
    let picked = 0;

    function refreshStrip() {
      const caret = field.selectionStart == null ? field.value.length : field.selectionStart;
      const tok = Latex.tokenAt(field.value, caret);
      matches = tok ? Latex.complete(tok.word, concept, 12) : Latex.suggestions(concept, 14);
      picked = 0;

      DOM.clear(strip);
      strip.appendChild(el('span', { class: 'wstrip-l', 'aria-hidden': 'true',
        text: tok ? (tok.text || '\\') : (isMl ? 'കമാൻഡുകൾ' : 'commands') }));

      matches.forEach(function (k, i) {

          class: 'wsug' + (i === picked && tok ? ' on' : ''),
          type: 'button', role: 'option', 'aria-selected': String(i === picked && !!tok),
          title: '\\' + k.cmd + (k.desc ? ' — ' + k.desc : ''),

          el('span', { class: 's', text: k.show }),
          el('span', { class: 'c', text: '\\' + k.cmd })

      if (!matches.length) {
        strip.appendChild(el('span', { class: 'small muted',
          text: isMl ? 'ഈ അക്ഷരങ്ങളുമായി പൊരുത്തപ്പെടുന്ന കമാൻഡുകളില്ല' : 'no command matches that spelling' }));

       sentence the learner is still writing. */
    function take(entry) {
      Latex.accept(field, entry, { wrapInMath: false });

    }

    /* ── keeping the input above the keyboard ────────────────────────────────

       one, so an input near the bottom ends up behind it and the page looks
       like it simply refuses to scroll far enough. Correct it by hand: measure
       how far the input row plus its command strip overflow the visible
       bottom, and scroll the nearest scrolling ancestor by exactly that — the
       reel when we are inside it, the window otherwise. */
    function scroller(node) {
      let n = node.parentElement;

        n = n.parentElement;
      }
      return null;
    }

    function revealInput() {
      if (document.activeElement !== field) return;
      const vv = window.visualViewport;
      const bottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
      const top = vv ? vv.offsetTop : 0;
      const r = strip.getBoundingClientRect();
      const inputTop = field.getBoundingClientRect().top;

      let by = 0;
      const over = r.bottom + 12 - bottom;
      if (over > 1) by = over;
      else if (inputTop - 12 < top) by = inputTop - top - 12;
      if (!by) return;

      const sc = scroller(field);
      if (sc) sc.scrollTop += by;
      else window.scrollBy(0, by);
    }

    const reveal = DOM.debounce(revealInput, 90);
    field.addEventListener('focus', reveal);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', reveal);
      window.visualViewport.addEventListener('scroll', reveal);
    }

    /* ── keys ──────────────────────────────────────────────────────────── */
    field.addEventListener('input', function () {
      reveal();
      liveRender();
      commitField();
      persist();
      refreshStrip();
      if (!firstInputFired && field.value.trim()) {
        firstInputFired = true;
        if (o.onFirstInput) o.onFirstInput();
      }
    });

    field.addEventListener('keydown', function (e) {
      const caret = field.selectionStart == null ? 0 : field.selectionStart;
      const len = field.value.length;

      if (e.key === 'Tab' && matches.length) {
        const tok = Latex.tokenAt(field.value, caret);
        if (tok) {
          e.preventDefault();
          take(matches[picked] || matches[0]);
          return;
        }
      }

      if (e.key === 'Enter') {
        e.preventDefault();
        newLine();
        return;
      }

      if (e.key === 'Backspace' && caret === 0 && field.selectionEnd === 0 && active > 0) {
        e.preventDefault();
        commitField();
        const carry = lines[active];
        const prevLen = lines[active - 1].length;
        lines[active - 1] += carry;
        lines.splice(active, 1);
        focusLine(active - 1, prevLen);
        persist();
        return;
      }

      if (e.key === 'ArrowUp' && caret === 0 && active > 0) {
        e.preventDefault();
        focusLine(active - 1, 'end');
        return;
      }

      if (e.key === 'ArrowDown' && caret === len && active < lines.length - 1) {
        e.preventDefault();
        focusLine(active + 1, 'end');
      }
    });

    field.addEventListener('click', refreshStrip);
    field.addEventListener('keyup', function (e) {
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') refreshStrip();
    });

    function newLine() {
      commitField();
      /* Enter on the last line when it is empty means "done", not "another
         blank line" — otherwise the document grows a tail of empties. */
      if (active === lines.length - 1 && !lines[active].trim() && lines.length > 1) {
        field.blur();
        return;
      }
      lines.splice(active + 1, 0, '');
      focusLine(active + 1, 0);
      persist();
    }

    newlineBtn.addEventListener('click', newLine);

    mathBtn.addEventListener('click', function () {
      const t = field.value.trim();
      const wrapped = /^\$\$[\s\S]*\$\$$/.test(t);
      field.value = wrapped ? t.replace(/^\$\$\s*|\s*\$\$$/g, '') : '$$ ' + t + ' $$';
      commitField();
      field.dispatchEvent(new Event('input', { bubbles: true }));
      field.focus();
    });

    /* ── assemble ──────────────────────────────────────────────────────── */
    const value = () => lines.join('\n');

    const box = el('div', { class: 'stack wbox', style: { gap: '10px' } }, [
      el('div', { class: 'spread' }, [
        el('label', { class: 'kicker', for: uid,
          text: o.label || (isMl ? 'എഴുതുക — ഓരോ വരിയായി' : 'Write it — one line at a time') }),
        saveNote
      ]),
      doc,
      strip,
      errBox,
      hint,
      el('p', {
        class: 'small muted', style: { margin: 0 },
        text: isMl ? 'നിങ്ങൾ എഴുതിയ ഗണിത രൂപം ശരിയായി ദൃശ്യമാകുന്നുണ്ടോ എന്ന് മാത്രമാണ് ഇത് പരിശോധിക്കുന്നത്. ഗണിത യുക്തി സ്വയം വിലയിരുത്തുക.'
                   : 'This checks only that what you wrote renders — not whether the mathematics is correct. That judgement stays yours.'
      })
    ]);
    host.appendChild(box);

    build();
    refreshStrip();

    return {
      value: value,
      focus: () => field.focus(),
      hasContent: () => !!value().trim(),
      node: box
    };
  }

  return { mount };
})();


/* ── src/view.login.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Sign in.

   The app does not open until there is a name and a roll number, because
   those two are the key the record is stored and merged under. A progress
   record that starts anonymous and is claimed later cannot be merged honestly
   — you would have to guess which device's history was whose.

   Be straight about what this is: it is a PASS KEY, not a password. Anyone who
   knows both halves can open this record. It exists so your work follows you
   between a phone and a laptop without an account to create, and the screen
   says exactly that rather than dressing it up as security.
   ══════════════════════════════════════════════════════════════════════════ */

const Login = (function () {

  const el = DOM.el;

  function mount(host, onDone) {
    const namePh = (typeof I18N !== 'undefined') ? I18N.t('login_name_ph') : 'e.g. Student Name';
    const rollPh = (typeof I18N !== 'undefined') ? I18N.t('login_roll_ph') : 'e.g. Roll Number';

    const nameIn = el('input', {
      class: 'tin', type: 'text', id: 'login-name', autocomplete: 'name',
      placeholder: namePh, spellcheck: 'false', enterkeyhint: 'next'
    });
    const rollIn = el('input', {
      class: 'tin', type: 'text', id: 'login-roll', autocomplete: 'off',
      placeholder: rollPh, spellcheck: 'false', enterkeyhint: 'go'
    });

    const known = Store.identity();
    nameIn.value = known.name || '';
    rollIn.value = known.roll || '';

    const note = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const go = el('button', {
      class: 'btn primary', type: 'submit',
      text: (typeof I18N !== 'undefined') ? I18N.t('login_submit') : 'Open my study record'
    });

    const keyLine = el('p', { class: 'small mono', style: { margin: '8px 0 0', color: 'var(--ink-3)' } });
    function paintKey() {
      const k = Sync.keyFor(nameIn.value, rollIn.value);
      keyLine.textContent = k ? 'record: ' + k : '';
    }
    nameIn.addEventListener('input', paintKey);
    rollIn.addEventListener('input', paintKey);
    paintKey();

    let busy = false;
    function submit(e) {
      if (e) e.preventDefault();
      if (busy) return;
      const name = nameIn.value.trim(), roll = rollIn.value.trim();
      if (!name || !roll) {
        note.textContent = (typeof I18N !== 'undefined')
          ? I18N.t('login_both_needed')
          : 'Both a name and a roll number are needed — together they are the key.';
        (name ? rollIn : nameIn).focus();
        return;
      }
      busy = true;
      go.disabled = true;
      go.textContent = (typeof I18N !== 'undefined') ? I18N.t('login_opening') : 'Opening…';
      note.textContent = (typeof I18N !== 'undefined') ? I18N.t('login_looking') : 'Looking for an existing record…';

      Store.signIn(name, roll);
      Sync.hello().then(function (r) {
        note.textContent = r.msg || '';
        onDone(r);
      }, function () {
        /* offline is not a reason to lock someone out of their own device */
        note.textContent = '';
        onDone({ ok: false, offline: true });
      });
    }

    const kickerText = (typeof I18N !== 'undefined') ? I18N.t('login_kicker') : 'Class 8 Mathematics · Math Base';
    const titleText = (typeof I18N !== 'undefined') ? I18N.t('login_title') : 'Sign in to your record';
    const ledeText = (typeof I18N !== 'undefined') ? I18N.t('login_lede') : 'Your name and roll number are the key your progress is stored under.';
    const nameLabel = (typeof I18N !== 'undefined') ? I18N.t('login_name') : 'Name';
    const rollLabel = (typeof I18N !== 'undefined') ? I18N.t('login_roll') : 'Roll number';
    const passkeyTitle = (typeof I18N !== 'undefined') ? I18N.t('login_passkey_title') : 'This is a pass key, not a password.';
    const passkeyDesc = (typeof I18N !== 'undefined') ? I18N.t('login_passkey_desc') : 'Anyone who knows your name and roll number can open this record.';

    const form = el('form', { class: 'stack', style: { gap: '14px' }, on: { submit: submit } }, [
      el('div', {}, [
        el('div', { class: 'kicker', text: kickerText }),
        el('h1', { tabindex: '-1', id: 'pagetitle', text: titleText })
      ]),
      el('p', { class: 'lede', text: ledeText }),
      el('div', { class: 'card' }, [
        el('label', { class: 'kicker', for: 'login-name', text: nameLabel }),
        el('div', { style: { margin: '6px 0 14px' } }, [nameIn]),
        el('label', { class: 'kicker', for: 'login-roll', text: rollLabel }),
        el('div', { style: { margin: '6px 0 0' } }, [rollIn]),
        keyLine
      ]),
      el('div', { class: 'btn-row' }, [go]),
      note,
      el('div', { class: 'banner' }, [
        DOM.mi('info'),
        el('span', {}, [
          el('b', { text: passkeyTitle + ' ' }),
          el('span', { text: passkeyDesc })
        ])
      ]),
      Pool.isMock() ? el('p', { class: 'small muted', style: { margin: 0 },
        text: 'Test build: records here are kept in a separate store from the real app, so nothing you do can reach it.' }) : null
    ]);

    nameIn.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); rollIn.focus(); }
    });

    host.appendChild(el('div', { class: 'wrap view-in' }, [form]));
    (nameIn.value ? rollIn : nameIn).focus();
  }

  return { mount };
})();


/* ── src/view.home.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Today — what to do next, and what the app actually knows about you.

   The tiles keep completion, proof work and recall apart on purpose: finishing
   a note is Level 1 "completed" and says nothing about recall, so the numbers
   are never merged into one flattering percentage.

   There is no level switch any more. A course does not get *set* to level 2;
   it arrives there when every note in it has had its proof worked, and at
   level 3 when every section's exercises are done. The card shows the colour
   the course has actually earned — red, amber, green — and what is owed for
   the next one.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewHome = (function () {

  const el = DOM.el;

  function nextUndone() {
    return Pool.concepts().filter(c => Progress.level(c.id) === 0)[0]
      || Pool.concepts(null, { includeExt: true }).filter(c => Progress.level(c.id) === 0)[0]
      || null;
  }
  function nextCard() {
    return Pool.deck().filter(c => !(Store.card(c.id) || {}).first)[0] || null;
  }
  function nextQuestion() {
    return Pool.objective().filter(q => !(Store.omr(q.id) || {}).first)[0] || null;
  }
  /* the next proof owed on something already read — offering proof work on a
     note nobody has opened is offering work out of order */
  function nextProof() {
    return Pool.concepts().filter(c => Progress.level(c.id) === 1)[0]
      || Pool.concepts(null, { includeExt: true }).filter(c => Progress.level(c.id) === 1)[0]
      || null;
  }

  /* the next section exercise owed, for level 3 */
  function nextExercise() {
    const qs = Pool.written();
    for (let i = 0; i < qs.length; i++) {
      if (!Progress.taskDone(qs[i])) return qs[i];
    }
    return null;
  }

  function step(n, label, detail, href, ready) {
    return el('a', { class: 'item', href: Router.href(href) }, [
      ready ? el('span', { class: 'ix', text: String(n) })
            : el('span', { class: 'ix ok' }, [DOM.mi('check', 'xs')]),
      el('span', { class: 'tt' }, [
        el('b', { text: label }),
        el('span', { text: detail })
      ]),
      el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
    ]);
  }

  function levelWord(n) {
    return (typeof I18N !== 'undefined') ? I18N.levelName(n) : ['not started', 'read', 'proofs worked', 'exercises done', 'all complete'][n || 0];
  }

  function courseCard(course) {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';

    if (course.pending) {
      return el('div', { class: 'card' }, [
        el('div', { class: 'spread' }, [
          el('div', { class: 'kicker', text: course.title }),
          el('span', { class: 'badge warn', text: isMl ? 'തീരുമാനിച്ചിട്ടില്ല' : 'pending' })
        ]),
        el('p', { class: 'small muted', style: { margin: '8px 0 0' },
          text: course.pendingNote || (isMl ? 'പാഠഭാഗങ്ങൾ തയ്യാറായിട്ടില്ല.' : 'Content has not been delivered yet.') })
      ]);
    }

    const ids = Pool.ids.concepts(course.id);
    const c = Progress.count(ids);
    const tasks = Pool.ids.written(course.id);
    const tasksDone = tasks.filter(id => Store.isProofDone('w:' + id)).length;
    const pyq = Progress.pyqState(course.id);
    const lv = Progress.courseLevel(course.id);

    const owed = isMl
      ? (c.min === 0 ? (c.total - c.l1) + ' എണ്ണം കൂടി വായിക്കാനുണ്ട് (ലെവൽ 1)'
        : c.min === 1 ? (c.total - c.l2) + ' തെളിവുകൾ കൂടി ചെയ്യാനുണ്ട് (ലെവൽ 2)'
        : c.min === 2 ? (c.total - c.l3) + ' ഭാഗങ്ങൾ കൂടി പൂർത്തിയാക്കാനുണ്ട് (ലെവൽ 3)'
        : 'എല്ലാ ഘട്ടങ്ങളും പൂർത്തിയായി')
      : (c.min === 0 ? (c.total - c.l1) + ' still to read for a red tick'
        : c.min === 1 ? (c.total - c.l2) + ' proofs still owed for an amber tick'
        : c.min === 2 ? (c.total - c.l3) + ' notes still short of their section exercises'
        : 'every level earned');

    const progressSummary = isMl
      ? c.l1 + ' വായിച്ചു · ' + c.l2 + ' തെളിവുകൾ · ' + c.l3 + ' പൂർത്തിയായി, ആകെ ' + c.total
      : c.l1 + ' read · ' + c.l2 + ' proofs · ' + c.l3 + ' green, of ' + c.total;

    return el('div', { class: 'card' }, [
      el('div', { class: 'spread' }, [
        el('a', { class: 'kicker', style: { textDecoration: 'none' },
          href: Router.href('study/' + course.id), text: course.title }),
        el('span', { class: 'badge' + (lv ? ' lv' + lv : ''),
          text: lv ? ((typeof I18N !== 'undefined' ? I18N.t('level') : 'level') + ' ' + lv + ' · ' + levelWord(lv)) : levelWord(0) })
      ]),
      el('div', { class: 'row', style: { marginTop: '10px', gap: '12px', alignItems: 'center' } }, [
        UI.levelRing(c, course.title),
        el('span', { class: 'tt' }, [
          el('b', { text: progressSummary }),
          el('span', { text: course.blurb })
        ])
      ]),
      el('div', { style: { marginTop: '12px' } }, [UI.levelBar(c)]),
      tasks.length ? el('div', { style: { marginTop: '12px' } }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'count', text: isMl ? 'പരിശീലന ചോദ്യങ്ങൾ ചെയ്തു' : 'section exercises worked' }),
          el('span', { class: 'count', text: tasksDone + '/' + tasks.length })
        ]),
        el('div', { style: { marginTop: '6px' } }, [UI.meter(tasksDone, tasks.length, 3)])
      ]) : null,
      pyq.total ? el('div', { style: { marginTop: '12px' } }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'count', text: isMl ? 'പരീക്ഷാ പേപ്പറുകൾ · ലെവൽ 4' : 'past papers · level 4' }),
          el('span', { class: 'count', text: pyq.done + '/' + pyq.total })
        ]),
        el('div', { style: { marginTop: '6px' } }, [UI.meter(pyq.done, pyq.total, 4)])
      ]) : null,
      el('p', { class: 'small muted', style: { margin: '10px 0 0' }, text: owed })
    ]);
  }

  /* ── sync ─────────────────────────────────────────────────────────────── */
  function syncCard() {
    const id = Store.identity();
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const host = el('div', { class: 'card tint' });
    const state = el('p', { class: 'small muted', style: { margin: '10px 0 0' } });
    const dot = el('span', { class: 'badge ok', text: Sync.status().key });

    function paint(last) {
      const s = Sync.status();
      const when = s.last && s.last.at
        ? (isMl ? ' · അവസാനം പരിശോധിച്ചത് ' + UI.ago(s.last.at) : ' · last checked ' + UI.ago(s.last.at))
        : '';
      state.textContent = (last && last.msg)
        ? last.msg + when
        : (isMl
            ? id.name + ' · ' + id.roll + ' എന്നതിൽ പ്രവേശിച്ചിരിക്കുന്നു. നിങ്ങളുടെ എല്ലാ ഉപകരണങ്ങളിലും പഠന പുരോഗതി തനിയെ ക്രമീകരിക്കപ്പെടും' + when + '.'
            : 'Signed in as ' + id.name + ' · ' + id.roll + '. Progress merges across every device '
              + 'that signs in with these two, on its own' + when + '. It is a pass key, not a password.');
    }
    Sync.watch(paint);
    paint(Sync.status().last);

    DOM.add(host, [
      el('div', { class: 'spread' }, [
        el('div', { class: 'kicker', text: (typeof I18N !== 'undefined') ? I18N.t('sync_title') : 'Your record · syncing automatically' }),
        dot
      ]),
      el('div', { class: 'btn-row', style: { marginTop: '10px' } }, [
        el('button', { class: 'btn', type: 'button',
          text: (typeof I18N !== 'undefined') ? I18N.t('sign_out') : 'Sign out',
          on: { click: function () {
            const promptMsg = isMl
              ? 'പുറത്തുകടക്കണോ? നിങ്ങളുടെ പുരോഗതി ഈ ഉപകരണത്തിലും ക്ലൗഡിലും സുരക്ഷിതമായിരിക്കും.'
              : 'Sign out? Progress stays on this device and in the cloud record.';
            if (!window.confirm(promptMsg)) return;
            Sync.disconnect();
            location.reload();
          } } })
      ]),
      state
    ]);
    return host;
  }

  function render() {
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    const all = Pool.ids.concepts();
    const overall = Progress.count(all);
    const s = Store.summary(all, Pool.ids.cards(), Pool.ids.objective(), Pool.ids.proofs());
    const note = nextUndone(), card = nextCard(), q = nextQuestion();
    const pf = nextProof(), ex = nextExercise();
    const exTarget = ex ? (Pool.concept((ex.tests || [])[0]) || null) : null;
    const qTarget = q ? (Pool.concept((q.tests || [])[0]) || null) : null;

    const root = el('div', { class: 'stack' });

    const lvlWord = (typeof I18N !== 'undefined') ? I18N.t('level') : 'level';
    const tiles = [
      UI.stat(overall.l1 + '/' + overall.total, (typeof I18N !== 'undefined') ? I18N.t('stat_read') : 'Read', lvlWord + ' 1',
        UI.levelBar(overall, { key: false })),
      UI.stat(s.cards.tried ? DOM.pct(s.cards.got, s.cards.tried) + '%' : '—',
        (typeof I18N !== 'undefined') ? I18N.t('stat_recall') : 'First-try recall',
        isMl ? (s.cards.tried + ' / ' + s.cards.total + ' ശ്രമിച്ചു') : (s.cards.tried + ' of ' + s.cards.total + ' tried')),
      UI.stat(s.omr.locked ? DOM.pct(s.omr.correct, s.omr.locked) + '%' : '—',
        (typeof I18N !== 'undefined') ? I18N.t('stat_correct') : 'First-try correct',
        isMl ? (s.omr.locked + ' / ' + s.omr.total + ' രേഖപ്പെടുത്തി') : (s.omr.locked + ' of ' + s.omr.total + ' locked')),
      UI.stat(overall.l2 + '/' + overall.total, (typeof I18N !== 'undefined') ? I18N.t('stat_proofs') : 'Proofs worked', lvlWord + ' 2',
        UI.meter(overall.l2, overall.total, 2)),
      UI.stat(overall.l3 + '/' + overall.total, (typeof I18N !== 'undefined') ? I18N.t('stat_exercises') : 'Sections green', lvlWord + ' 3',
        UI.meter(overall.l3, overall.total, 3))
    ];

    const loop = [
      step(1,
        note ? (isMl ? 'വായിക്കുക: ' + note.title : 'Read: ' + note.title)
             : (isMl ? 'എല്ലാ പാഠഭാഗങ്ങളും ഒരു തവണ വായിച്ചു' : 'Every syllabus note has been read once'),
        note ? (Pool.sectionTitle(note.sec) + (Pool.isExt(note) ? (isMl ? ' · പാഠ്യപദ്ധതിക്ക് പുറത്ത്' : ' · outside syllabus') : ''))
             : (isMl ? 'വീണ്ടും വായിക്കാൻ എപ്പോഴും ലഭ്യമാണ്' : 'Re-reading is always available'),
        note ? 'note/' + note.id : 'study', !!note),
      step(2,

  function afterPaint() { Tree.scrollToOpen(); }

  return { render, afterPaint, keepScroll: true };
})();

/* ══════════════════════════════════════════════════════════════════════════
   `#/note/<id>` — kept, and no longer a page.

   The note is a component now (comp.note.js) that opens inside the syllabus
   tree. But `#/note/<id>` is written into hundreds of places: every
   prerequisite path, every "used later by" chip, and every concept reference
   `DOM.linkifyConcepts` finds in authored prose. Breaking them would mean
   rewriting content to fix navigation, which is backwards.

   So the route survives as a jump: open the path down to that concept and
   hand over to Study, which lands on it. One scroll, one screen, and every
   old link still means what it said.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewNote = (function () {

  const el = DOM.el;

  function render(args) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const id = args && args[0];
    if (!Pool.concept(id)) {
      return el('div', { class: 'stack' }, [
        UI.title(isMl ? 'കണ്ടെത്താനായില്ല' : 'Not found'),

})();

/* ══════════════════════════════════════════════════════════════════════════
   Recall, as a reel.

   One card per screen, swiped vertically, exactly one card per swipe. Getting
   that last part right is the whole job: a flick carries momentum, and a
   proximity-snapped scroller happily sails past two or three cards before it
   settles. `scroll-snap-stop: always` is the rule that forbids it. Every card
   is therefore exactly one viewport tall, and a card whose content overflows
   scrolls INSIDE itself and chains out at its ends.

   NOTHING COUNTS THE CARDS. There is no rail of dots, no "3 / 47", no "end of
   the reel" — you scroll and the next thing arrives, the way a reel is
   supposed to feel. Cards are appended a handful at a time as you approach the
   bottom, and the queue re-queries itself when it runs dry, so ticking a
   concept in Study while the reel is open makes new cards appear behind you
   rather than requiring a reload.

   What is in it, and in what order, is core.progress.js's business
   (`Progress.reel`): only material you have met, scheduled by Leitner box, due
   cards shuffled so no two passes are alike, and cards you know well a long
   way back. Nothing repeats within a pass.

   first grade is the one that counts.

  const LOOKAHEAD = 3;      /* how close to the end before the next batch */

      return item.options;
    }
    const deck = (typeof Pool !== 'undefined' && Pool.deck) ? Pool.deck() : [];
    const otherCards = deck.filter(c => c.id !== item.id);
    const sameSec = otherCards.filter(c => c.sec === item.sec);
    const poolList = (sameSec.length >= 3 ? sameSec : otherCards)
      .map(c => typeof I18N !== 'undefined' ? I18N.pick(c, 'a') : c.a)
      .filter(a => a && a !== correct);

    const uniquePool = Array.from(new Set(poolList));
    let distractors = [];
    if (uniquePool.length >= 3) {
      let hash = 0;
      for (let i = 0; i < item.id.length; i++) hash = ((hash << 5) - hash) + item.id.charCodeAt(i);
      hash = Math.abs(hash);
      const shuffled = uniquePool.slice();
      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = (hash + i) % (i + 1);
        const tmp = shuffled[i]; shuffled[i] = shuffled[j]; shuffled[j] = tmp;
      }
      distractors = shuffled.slice(0, 3);
    } else {
      distractors = isMl
        ? ['ഇവയിലൊന്നുമല്ല', 'വ്യവസ്ഥകൾ ബാധകമല്ല', 'വിപരീതം ശരിയല്ല']
        : ['None of these', 'Conditions do not apply', 'The converse is false'];
    }

    const all = [
      { text: correct, correct: true },
      { text: distractors[0] || (isMl ? 'ബാധകമല്ല' : 'Not applicable'), correct: false },
      { text: distractors[1] || (isMl ? 'തീർച്ചപ്പെടുത്താനാവില്ല' : 'Cannot be determined'), correct: false },
      { text: distractors[2] || (isMl ? 'ഇവയിലൊന്നുമല്ല' : 'None of the above'), correct: false }
    ];

    let seed = 0;
    for (let i = 0; i < item.id.length; i++) seed += item.id.charCodeAt(i);
    const keys = ['A', 'B', 'C', 'D'];
    const rot = seed % 4;
    const rotated = all.slice(rot).concat(all.slice(0, rot));
    return rotated.map((opt, idx) => ({ k: keys[idx], text: opt.text, correct: opt.correct }));
  }

  const BUILDERS = {
    state: statementCard, proof: proofCard, question: questionCard, exercise: exerciseCard
  };

  /* ── the reel ────────────────────────────────────────────────────────── */
  function render(args, query) {
    if (query && query.from) { startAt = query.from; onlyNew = false; }
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';

    const reel = el('div', { class: 'reel', tabindex: '-1', 'aria-label': isMl ? 'ഓർത്തെടുക്കൽ കാർഡുകൾ' : 'Recall reel' });
    const root = el('div', {}, [
      el('h1', { id: 'pagetitle', tabindex: '-1', class: 'sr-only', text: typeof I18N !== 'undefined' ? I18N.t('reel') : 'Recall' }),
      reel
    ]);

    let cards = [];        /* the <section>s on screen, index 0 is the intro */
    let queue = [];        /* cards drawn but not yet placed */
    let placed = {};       /* every id already on screen — nothing repeats */
    let ended = false;

    function build() {
      if (io) { io.disconnect(); io = null; }
      DOM.clear(reel);
      cards = [];
      placed = {};
      ended = false;
      queue = Progress.reel({ onlyNew: onlyNew });

      push(el('section', { class: 'reel-card' }, [introCard(function () {
        build();
        reel.scrollTo({ top: 0, behavior: 'auto' });
      })]));

      extend(BATCH);
      observe();
      UI.math(reel);
      jumpToStart();
    }

    function push(section) {
      cards.push(section);
      reel.appendChild(section);
      if (io) io.observe(section);
    }

    const glide = i => {
      const to = cards[i];
      if (!to) return;
      reel.scrollTo({ top: to.offsetTop, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    };

    /* Draw `n` more cards. When the queue runs dry it is re-drawn, which is
       how material ticked while the reel is open finds its way in. */
    function extend(n) {
      let added = 0;
      while (added < n) {
        if (!queue.length) queue = Progress.reel({ onlyNew: onlyNew, exclude: placed });
        const item = queue.shift();
        if (!item) break;
        if (placed[item.id]) continue;
        placed[item.id] = true;
        const at = cards.length;
        const make = BUILDERS[item.kind];
        if (!make) continue;
        push(el('section', { class: 'reel-card', 'data-cid': item.cid || '' },
          [make(item, function () { glide(at + 1); })]));
        added += 1;
      }
      if (!added && !ended) {
        ended = true;
        push(el('section', { class: 'reel-card' }, [
          el('div', { class: 'inner' }, [
            UI.empty(onlyNew
              ? (isMl ? 'എല്ലാ ചോദ്യങ്ങളും ഒരിക്കലെങ്കിലും ശ്രമിച്ചു കഴിഞ്ഞു.' : 'Everything in your material has had a first attempt.')
              : (isMl ? 'പഠിച്ച എല്ലാ ആശയങ്ങളും കാർഡുകളായി വന്നു കഴിഞ്ഞു. പുതിയവ പഠിക്കുമ്പോൾ ഇവിടെ ലഭ്യമാകും.' : 'That is everything you have met, for now. Read something new and it will be here waiting.'),
              el('a', { class: 'btn primary', href: Router.href('study'),
                text: typeof I18N !== 'undefined' ? I18N.t('open_syllabus') : 'Open the syllabus' }))
          ])
        ]));
      }
      UI.math(reel);
    }

    /* Mark the card in view, and top the reel up before you reach the end.
       Cards are one viewport tall, so a majority-of-the-viewport test is both
       correct and cheap. */
    let io = null;
    function observe() {
      if (!window.IntersectionObserver) { cards.forEach(c => c.classList.add('live')); return; }
      if (io) return;
      io = new window.IntersectionObserver(function (entries) {
        entries.forEach(function (e) {
          const seen = e.intersectionRect ? e.intersectionRect.height : 0;
          const port = (e.rootBounds && e.rootBounds.height) || reel.clientHeight || 1;
          const live = e.isIntersecting && seen / port > 0.55;
          e.target.classList.toggle('live', live);
          if (live && cards.indexOf(e.target) >= cards.length - LOOKAHEAD) extend(BATCH);
        });
      }, { root: reel, threshold: [0, 0.25, 0.56, 0.9, 1] });
      cards.forEach(c => io.observe(c));
    }

    function jumpToStart() {
      if (!startAt) return;
      const at = cards.map(c => c.getAttribute('data-cid')).indexOf(startAt);
      startAt = null;
      if (at > 0) window.requestAnimationFrame(function () {
        reel.scrollTo({ top: cards[at].offsetTop, behavior: 'auto' });
      });
    }

    /* Ticking a concept in Study while the reel is open should put its cards
       in the reel, not wait for a reload. The end card is the only thing in
       the way, so it is taken back off and the queue asked again. */
    Store.onChange(function () {
      if (!document.body.contains(reel) || !ended) return;
      const last = cards.pop();
      if (last && last.parentNode) last.parentNode.removeChild(last);
      ended = false;
      extend(BATCH);
    });

    /* Keyboard moves exactly one card, like the swipe. */
    reel.addEventListener('keydown', function (e) {
      const keys = { ArrowDown: 1, PageDown: 1, ArrowUp: -1, PageUp: -1 };
      const dir = keys[e.key];
      if (!dir) return;
      if (/^(TEXTAREA|INPUT|SELECT)$/.test((e.target.tagName || '').toUpperCase())) return;
      e.preventDefault();
      const h = reel.clientHeight || 1;
      const last = reel.children.length - 1;
      const at = Math.round(reel.scrollTop / h);
      const to = Math.max(0, Math.min(last, at + dir));
      reel.scrollTo({ top: to * h, behavior: DOM.reduced() ? 'auto' : 'smooth' });
    });

    build();
    return root;
  }

  return { render, wrapClass: 'wrap bleed' };
})();


/* ── src/view.omr.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Objective questions, OMR first.

   The question itself is now a component — see comp.question.js — because a
   question belongs next to the note that teaches it, not behind a tab of its
   own. There is no Questions tab any more: this screen survives only so that
   `#/omr/<id>` links keep resolving, and so there is somewhere to see the
   whole bank at once.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewOmr = (function () {

  const el = DOM.el;

  /* ── list ──────────────────────────────────────────────────────────────── */
  let filter = 'all';

  function list(query) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const root = el('div', { class: 'stack' });
    const sec = query && query.sec;
    const chips = el('div', { class: 'row' });
    const host = el('div', {});

    const chip = (label, on, fn) => el('button', { class: 'chip', type: 'button', text: label,
      'aria-pressed': String(on), on: { click: fn } });

    function paint() {
      let qs = Pool.objective();
      if (sec) qs = qs.filter(q => q.sec === sec);
      if (filter === 'new') qs = qs.filter(q => !(Store.omr(q.id) || {}).first);
      else if (filter !== 'all') qs = qs.filter(q => q.type === filter);

      DOM.clear(chips);
      DOM.add(chips, ['all', 'new', 'MCQ', 'MSQ', 'NAT'].map(f => chip(
        f === 'all' ? (isMl ? 'എല്ലാം' : 'All') : f === 'new' ? (isMl ? 'ശ്രമിക്കാത്തവ' : 'Not attempted') : f,
        filter === f, function () { filter = f; paint(); })));

      DOM.clear(host);
      if (!qs.length) { host.appendChild(UI.empty(isMl ? 'ഈ ഫിൽട്ടറിൽ ചോദ്യങ്ങളൊന്നുമില്ല.' : 'Nothing matches that filter.')); return; }

      host.appendChild(el('div', { class: 'list' }, qs.map(function (q, i) {
        const rec = Store.omr(q.id);
        const v = rec && rec.first && rec.first.verdict;
        const marksText = isMl ? (q.marks + ' മാർക്ക്') : (q.marks + ' ' + DOM.plural(q.marks, 'mark'));
        const negText = q.neg ? (q.negLabel || (isMl ? (q.neg + ' തെറ്റിയാൽ കുറയും') : (q.neg + ' if wrong'))) : (isMl ? 'നെഗറ്റീവ് മാർക്കില്ല' : 'no negative');
        const vText = v ? (isMl ? ('ആദ്യ ശ്രമം: ' + (v === 'correct' ? 'ശരി' : v === 'wrong' ? 'തെറ്റ്' : 'ഭാഗികം')) : ('first attempt: ' + v)) : negText;

        return el('a', { class: 'item', href: Router.href('omr/' + q.id) }, [
          el('span', { class: 'ix' + (v === 'correct' ? ' ok' : v ? ' bad' : '') },
            [v ? DOM.mi(v === 'correct' ? 'check' : v === 'wrong' ? 'close' : 'remove', 'xs')
               : el('span', { text: String(i + 1) })]),
          el('span', { class: 'tt' }, [
            el('b', { text: '§' + q.sec + '  ' + Pool.sectionTitle(q.sec) }),
            el('span', { text: q.type + ' · ' + marksText + ' · ' + vText })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      })));
    }

    const s = Store.summary([], [], Pool.ids.objective());
    DOM.add(root, [
      UI.title(isMl ? 'ചോദ്യങ്ങൾ' : 'Questions', isMl ? 'ആദ്യം സ്വയം ശ്രമിക്കുക, തുടർന്ന് വിശദമായ ഉത്തരം' : 'Answer first, then the full solution'),
      UI.mockBanner(),
      el('p', { class: 'small muted', style: { margin: 0 },
        text: isMl ? 'ഓരോ ചോദ്യവും പാഠ്യപദ്ധതിയിലെ അതാത് കുറിപ്പുകൾക്കൊപ്പവും ലഭ്യമാണ്.' : 'Every one of these also opens inside the note it examines, in the syllabus.' }),
      el('div', { class: 'card tint' }, [
        el('div', { class: 'spread' }, [
          el('span', { class: 'kicker', text: isMl ? 'ആദ്യ ശ്രമങ്ങൾ' : 'First attempts' }),
          el('span', { class: 'count',
            text: isMl ? (s.omr.locked + ' / ' + s.omr.total + ' രേഖപ്പെടുത്തി · ' + s.omr.correct + ' ശരി')
                       : (s.omr.locked + ' of ' + s.omr.total + ' locked · ' + s.omr.correct + ' correct') })
        ]),
        el('div', { style: { marginTop: '8px' } }, [UI.meter(s.omr.locked, s.omr.total)])
      ]),
      sec ? el('div', { class: 'row' }, [
        el('span', { class: 'badge accent', text: '§' + sec }),
        el('a', { class: 'chip', href: Router.href('omr'), text: isMl ? 'ഫിൽട്ടർ ഒഴിവാക്കുക' : 'clear section filter' })
      ]) : null,
      chips, host
    ]);
    paint();
    return root;
  }

  /* ── one question ──────────────────────────────────────────────────────── */
  function nextLink(q) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const all = Pool.objective();
    const i = all.map(x => x.id).indexOf(q.id);
    const unattempted = all.slice(i + 1).concat(all.slice(0, i))
      .filter(x => !(Store.omr(x.id) || {}).first)[0];
    const next = unattempted || all[(i + 1) % all.length];
    return el('a', { class: 'btn primary', href: Router.href('omr/' + next.id),
      text: unattempted ? (isMl ? 'അടുത്ത പുതിയ ചോദ്യം' : 'Next unattempted question') : (isMl ? 'അടുത്ത ചോദ്യം' : 'Next question') });
  }

  function detail(q) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const tail = el('div', { class: 'btn-row' }, [
      nextLink(q), el('a', { class: 'btn', href: Router.href('omr'), text: isMl ? 'എല്ലാ ചോദ്യങ്ങളും' : 'All questions' })
    ]);
    const secTitle = Pool.sectionTitle(q.sec);
    return el('div', { class: 'stack' }, [
      UI.crumb([{ text: isMl ? 'ചോദ്യങ്ങൾ' : 'Questions', href: 'omr' },
        { text: '§' + q.sec + ' ' + secTitle }]),
      el('h1', { tabindex: '-1', id: 'pagetitle', class: 'sr-only',
        text: q.type + ' question on ' + secTitle }),
      QuestionCard.build(q, { tail: tail })
    ]);
  }

  function render(args, query) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    if (args && args[0]) {
      const q = Pool.objectiveOne(args[0]);
      if (q) return detail(q);
      return el('div', { class: 'stack' }, [
        UI.title(isMl ? 'കണ്ടെത്താനായില്ല' : 'Not found'),
        UI.empty(isMl ? 'ഈ ചോദ്യം ലഭ്യമല്ല.' : 'That question is not in the loaded bank.',
          el('a', { class: 'btn', href: Router.href('omr'), text: isMl ? 'എല്ലാ ചോദ്യങ്ങളും' : 'All questions' }))
      ]);
    }
    return list(query);
  }

  return { render, judge: QuestionCard.judge };
})();


/* ── src/view.write.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Theorem writing.

   The target is named but its statement is withheld: you write first, then
   compare. The canonical statement is behind a gate for the same reason the
   flashcard answer is — reading a statement is not writing one.
   ══════════════════════════════════════════════════════════════════════════ */

const ViewWrite = (function () {

  const el = DOM.el;

  function picker() {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const targets = Pool.concepts();
    return el('div', { class: 'stack' }, [
      UI.title(isMl ? 'പ്രസ്താവന എഴുതുക' : 'Write a statement', isMl ? 'ഗണിത രൂപത്തിൽ എഴുതി നോക്കുക' : 'Write and practice the statement'),
      el('p', { class: 'lede small' },
        [isMl ? 'ഓർമ്മയിൽ നിന്ന് പ്രസ്താവന എഴുതി നോക്കുക.'
              : 'Pick what to write from memory. Type your formulation and compare it with the textbook statement.']),
      el('div', { class: 'list' }, targets.map(function (c) {
        const has = !!Store.draft(c.id);
        const cTitle = typeof I18N !== 'undefined' ? I18N.pick(c, 'title') : c.title;
        const cKind = typeof I18N !== 'undefined' ? I18N.kind(c.kind) : c.kind;
        return el('a', { class: 'item', href: Router.href('write/' + c.id) }, [
          el('span', { class: 'ix' + (has ? ' ok' : '') },
            [DOM.mi(has ? 'edit_note' : 'radio_button_unchecked', 'xs')]),
          el('span', { class: 'tt' }, [
            el('b', { text: cTitle }),
            el('span', { text: '§' + c.sec + ' · ' + cKind + (has ? (isMl ? ' · സേവ് ചെയ്തു' : ' · draft saved') : '') })
          ]),
          el('span', { class: 'go', 'aria-hidden': 'true', text: '›' })
        ]);
      }))
    ]);
  }

  function workspace(c) {
    const isMl = typeof I18N !== 'undefined' && I18N.lang() === 'ml';
    const root = el('div', { class: 'stack' });
    const boxHost = el('div', { class: 'card' });
    const compareHost = el('div', {});

    const wb = WriteBox.mount(boxHost, { concept: c, label: isMl ? 'നിങ്ങൾ ഓർത്തെടുത്ത പ്രസ്താവന' : 'Your statement in words' });

    function compare() {
      DOM.clear(compareHost);
      compareHost.appendChild(el('div', { class: 'reveal' }, [
        el('div', { class: 'h' }, [el('span', { text: isMl ? 'ശരിയായ പ്രസ്താവന' : 'Canonical statement' })]),
        el('div', { class: 'b' }, [
          UI.prose(c.statement, 'tight'),
          el('p', { class: 'small muted', style: { margin: '12px 0 0' },
            text: isMl ? 'നിങ്ങൾ എഴുതിയ പ്രസ്താവനയും ശരിയായ പ്രസ്താവനയും തമ്മിൽ ഒത്തുനോക്കുക.'
                       : 'Compare the quantifiers and the hypotheses first — that is where written answers lose marks, not in the algebra.' }),
          el('div', { class: 'btn-row', style: { marginTop: '12px' } }, [
            el('a', { class: 'btn', href: Router.href('note/' + c.id), text: isMl ? 'പൂർണ്ണ കുറിപ്പ് കാണുക' : 'Open the full note' }),
            el('a', { class: 'btn', href: Router.href('recall?from=' + encodeURIComponent(c.id)),
              text: isMl ? 'ഓർമ്മ പരിശോധിക്കുക' : 'Grade it as recall' })
          ])
        ])
      ]));
      UI.math(compareHost);
      DOM.announce(isMl ? 'ശരിയായ പ്രസ്താവന കാണിച്ചു.' : 'Canonical statement revealed.');
    }

    const gate = UI.gate({
      hint: isMl ? 'ആദ്യം മുകളിൽ എഴുതി ശ്രമിക്കുക. അതിനു ശേഷം ശരിയായ പ്രസ്താവന കാണാം.'
                 : 'Write your version above first. The canonical statement stays hidden until you ask for it.',
      actions: [
        { label: isMl ? 'ശരിയായ പ്രസ്താവനയുമായി ഒത്തുനോക്കുക' : 'Compare with the canonical statement', primary: true, onClick: function () {
            if (!wb.hasContent() &&
              !window.confirm(isMl ? 'ഇതുവരെ ഒന്നും എഴുതിയിട്ടില്ല. പ്രസ്താവന കാണണോ?' : 'Nothing is written yet. Reveal the statement anyway?')) return;
            compare();
          } }
      ]
    });

    const cTitle = typeof I18N !== 'undefined' ? I18N.pick(c, 'title') : c.title;
    DOM.add(root, [
      UI.crumb([{ text: isMl ? 'എഴുതുക' : 'Write', href: 'write' }, { text: '§' + c.sec }]),
      el('div', {}, [
        el('div', { class: 'row', style: { marginBottom: '8px' } }, [UI.kindBadge(c), UI.levelBadge(c.id)]),
        UI.title(cTitle, isMl ? 'ഇതിന്റെ പ്രസ്താവന എഴുതുക: ' : 'Write the statement of')
      ]),
      el('p', { class: 'lede', text: c.oneLine }),
      boxHost,
      gate,
      compareHost
    ]);

    UI.math(root);
    return root;
  }

  function render(args) {
    if (args && args[0]) {
      const c = Pool.concept(args[0]);
      if (c) return workspace(c);
    }
    return picker();
  }

  return { render };
})();


/* ── src/boot.js ── */
/* ══════════════════════════════════════════════════════════════════════════
   Boot: theme, data loading, navigation, routing, failure surfaces.
   ══════════════════════════════════════════════════════════════════════════ */

const Theme = (function () {
  const media = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function apply() {
    const pref = Store.pref('theme', 'auto');
    const dark = pref === 'dark' || (pref === 'auto' && media && media.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', dark ? '#101216' : '#faf8f4');
  }

  if (media && media.addEventListener) {
    media.addEventListener('change', function () {
      if (Store.pref('theme', 'auto') === 'auto') apply();
    });
  }
  return { apply };
})();

/* ── shell chrome ─────────────────────────────────────────────────────────
   The controls that belong to the frame rather than to any view: back, full
   screen, theme. Each exists twice — once in the mobile header, once in the
   desktop rail — so they repaint from one place and can never disagree about
   what is on. */
const Shell = (function () {

  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

  function toggleFull() {
    const root = document.documentElement;
    if (isFull()) {
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
      return;
    }
    const req = root.requestFullscreen || root.webkitRequestFullscreen;
    if (req) {
      const r = req.call(root);
      if (r && r.catch) r.catch(function () { DOM.announce('This browser refused full screen.'); });
    } else {
      DOM.announce('This browser has no full-screen mode.');
    }
  }

  function cycleTheme() {
    const order = ['auto', 'light', 'dark'];
    const next = order[(order.indexOf(Store.pref('theme', 'auto')) + 1) % 3];
    Store.setPref('theme', next);
    Theme.apply();
    DOM.announce('Theme set to ' + next + '.');
    paint();
  }

  const each = (sel, fn) => Array.prototype.forEach.call(document.querySelectorAll(sel), fn);
  function setGlyph(btn, name, label) {
    const g = btn.querySelector('.mi');
    if (g) g.textContent = name;
    const l = btn.querySelector('.lb');
    if (l) l.textContent = label;
  }

  function paint() {
    const full = isFull();
    const theme = Store.pref('theme', 'auto');
    const isMl = (typeof I18N !== 'undefined') && I18N.lang() === 'ml';
    document.body.classList.toggle('is-full', full);
    each('[data-chrome=full]', function (b) {
      b.setAttribute('aria-pressed', String(full));
      b.setAttribute('aria-label', full ? ((typeof I18N !== 'undefined') ? I18N.t('exit_fullscreen') : 'Exit full screen') : ((typeof I18N !== 'undefined') ? I18N.t('fullscreen') : 'Full screen'));
      setGlyph(b, full ? 'fullscreen_exit' : 'fullscreen', full ? ((typeof I18N !== 'undefined') ? I18N.t('exit_fullscreen') : 'Exit full screen') : ((typeof I18N !== 'undefined') ? I18N.t('fullscreen') : 'Full screen'));
    });
    each('[data-chrome=theme]', function (b) {
      const themeWord = (typeof I18N !== 'undefined') ? I18N.t('theme') : 'Theme';
      b.setAttribute('aria-label', themeWord + ': ' + theme + ' — change it');
      setGlyph(b, theme === 'dark' ? 'dark_mode' : theme === 'light' ? 'light_mode' : 'contrast',
        themeWord + ': ' + theme);
    });
    each('[data-chrome=lang]', function (b) {
      const nextLangName = isMl ? 'English' : 'മലയാളം';
      b.setAttribute('aria-label', (typeof I18N !== 'undefined') ? I18N.t('lang_switch_aria') : 'Switch language');
      setGlyph(b, 'translate', nextLangName);
    });
    each('[data-chrome=back]', function (b) {
      b.disabled = !Router.canBack();
      b.setAttribute('aria-label', (typeof I18N !== 'undefined') ? I18N.t('back') : 'Back');
    });

    const langBtn = document.getElementById('lang-btn');
    if (langBtn) {
      langBtn.setAttribute('aria-label', (typeof I18N !== 'undefined') ? I18N.t('lang_switch_aria') : 'Switch language');
      const langText = document.getElementById('lang-btn-text');
      if (langText) langText.textContent = isMl ? 'English' : 'മലയാളം';
    }

    const topTitle = document.getElementById('top-title');
    if (topTitle) {
      topTitle.textContent = (Pool.courses && Pool.courses()[0] && Pool.courses()[0].title) || ((typeof I18N !== 'undefined') ? I18N.t('app_title') : 'Class 8 Mathematics');
    }
    const topSub = document.getElementById('top-sub');
    if (topSub && (!topSub.dataset.custom || topSub.dataset.custom === 'false')) {
      topSub.textContent = (typeof I18N !== 'undefined') ? I18N.t('app_sub') : 'Math Base';
    }
  }

  function setSubtitle(text) {
    const topSub = document.getElementById('top-sub');
    const railSub = document.getElementById('rail-sub');
    if (topSub) {
      topSub.textContent = text || ((typeof I18N !== 'undefined') ? I18N.t('app_sub') : '');
      topSub.dataset.custom = text ? 'true' : 'false';
    }
    if (railSub) railSub.textContent = text || ((typeof I18N !== 'undefined') ? I18N.t('app_sub') : '');
  }

  function wire() {
    const byId = id => document.getElementById(id);
    const back = byId('back-btn'), full = byId('full-btn'), theme = byId('theme-btn'), lang = byId('lang-btn');
    if (back) { back.setAttribute('data-chrome', 'back'); back.addEventListener('click', () => Router.back()); }
    if (full) { full.setAttribute('data-chrome', 'full'); full.addEventListener('click', toggleFull); }
    if (theme) { theme.setAttribute('data-chrome', 'theme'); theme.addEventListener('click', cycleTheme); }
    if (lang) { lang.addEventListener('click', () => { if (typeof I18N !== 'undefined') I18N.toggle(); }); }
    document.addEventListener('fullscreenchange', paint);
    document.addEventListener('webkitfullscreenchange', paint);
    paint();
  }

  return { isFull, toggleFull, cycleTheme, paint, wire, setSubtitle };
})();

const App = (function () {

  const el = DOM.el;

  /* Three tabs, not five. Questions and Write lost their tabs when the note
     learned to hold them: answering a question about a theorem belongs under
     that theorem, not behind a tab that makes you find it again. Both routes
     still resolve — see view.omr.js and view.write.js — they are simply not
     places you navigate TO any more. */
  const TABS = [
    { name: 'home', label: 'Today', icon: 'today', also: [] },
    { name: 'study', label: 'Study', icon: 'menu_book', also: ['note', 'omr'] },
    { name: 'recall', label: 'Recall', icon: 'style', also: [] }
  ];

  const VIEWS = {
    home: () => ViewHome, study: () => ViewStudy, note: () => ViewNote,
    recall: () => ViewRecall, omr: () => ViewOmr, write: () => ViewStudy
  };

  /* ONE nav element, laid out two ways.

     On a phone it is the bottom tab bar it has always been. On a desktop the
     same element becomes a left rail — because the horizontal strip was
     costing a band of vertical space on every screen, and vertical space is
     the whole of reading. The rail carries its own brand, back button and
     shell controls, so at that width the top header can go away entirely and
     the page gets the full height of the window.

     `.rail-top` and `.rail-foot` are simply not displayed on a phone, where
     the header already carries them. */
  function railBtn(chrome, glyph, label, onClick) {
    const b = el('button', { class: 'rail-btn', type: 'button', 'data-chrome': chrome,
      'aria-label': label }, [DOM.mi(glyph), el('span', { class: 'lb', text: label })]);
    b.addEventListener('click', onClick);
    return b;
  }

  function buildNav() {
    const nav = document.getElementById('tabs');
    DOM.clear(nav);

    const backLabel = (typeof I18N !== 'undefined') ? I18N.t('back') : 'Back';
    const appTitle = (Pool.courses && Pool.courses()[0] && Pool.courses()[0].title) || ((typeof I18N !== 'undefined') ? I18N.t('app_title') : 'Class 8 Mathematics');
    const appSub = (typeof I18N !== 'undefined') ? I18N.t('app_sub') : 'Math Base';

    nav.appendChild(el('div', { class: 'rail-top' }, [
      railBtn('back', 'arrow_back', backLabel, function () { Router.back(); }),
      el('a', { class: 'rail-brand', href: Router.href('home') }, [
        el('span', { class: 'brand-titles' }, [
          el('b', { text: appTitle }),
          el('span', { class: 'brand-sub', id: 'rail-sub', text: appSub })
        ])
      ])
    ]));

    const list = el('div', { class: 'rail-nav' });
    TABS.forEach(function (t) {
      const tabLabel = (typeof I18N !== 'undefined') ? I18N.t('tab_' + t.name, t.label) : t.label;
      list.appendChild(el('a', { href: Router.href(t.name), id: 'tab-' + t.name }, [
        DOM.mi(t.icon), el('span', { class: 'lb', text: tabLabel })
      ]));
    });
    nav.appendChild(list);

    const langLabel = (typeof I18N !== 'undefined') ? I18N.t('lang_btn') : 'മലയാളം';
    const fullLabel = (typeof I18N !== 'undefined') ? I18N.t('fullscreen') : 'Full screen';
    const themeLabel = (typeof I18N !== 'undefined') ? I18N.t('theme') : 'Theme';

    nav.appendChild(el('div', { class: 'rail-foot' }, [
      railBtn('lang', 'translate', langLabel, function () { if (typeof I18N !== 'undefined') I18N.toggle(); }),
      railBtn('full', 'fullscreen', fullLabel, Shell.toggleFull),
      railBtn('theme', 'contrast', themeLabel, Shell.cycleTheme)
    ]));

    Shell.paint();
  }

  function markNav(routeName) {
    TABS.forEach(function (t) {
      const a = document.getElementById('tab-' + t.name);
      if (!a) return;
      const on = t.name === routeName || t.also.indexOf(routeName) >= 0;
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
  }

  function failureCard(err) {
    console.error(err);
    document.body.setAttribute('data-error', (err && err.message) || 'error');
    return el('div', { class: 'stack' }, [
      el('h1', { tabindex: '-1', id: 'pagetitle', text: 'Something broke' }),
      el('div', { class: 'banner' }, [
        DOM.mi('warning'),
        el('span', {}, [
          el('b', { text: 'This view failed to render. ' }),
          el('span', { class: 'mono', text: (err && err.message) || String(err) })
        ])
      ]),
      el('a', { class: 'btn', href: Router.href('home'), text: 'Back to Today' })
    ]);
  }

  function paint(r) {
    const main = document.getElementById('main');
    const view = (VIEWS[r.name] || VIEWS.home)();
    DOM.clear(main);
    let node;
    try { node = view.render(r.args, r.query); }
    catch (err) { node = failureCard(err); }
    const wrap = el('div', { class: (view.wrapClass || 'wrap') + ' view-in' }, [node]);
    main.appendChild(wrap);
    markNav(r.name);
    Shell.paint();
    if (r.name !== 'study' && r.name !== 'note') Shell.setSubtitle('');
    const h = main.querySelector('#pagetitle');
    if (h) h.focus({ preventScroll: true });
    /* Most views start at the top. Study does not: it restores the row you
       were last reading, and jumping to the top first would undo that. */
    if (view.keepScroll) { if (view.afterPaint) view.afterPaint(); }
    else window.scrollTo(0, 0);
  }

  /* Views are painted synchronously and animate in with CSS (.view-in).
     The native View Transition API was tried here and dropped: its DOM-update
     callback is frame-scheduled, so a route could land on an empty <main> if
     that frame never arrives. A blank screen is not worth a cross-fade. */
  const route = paint;

  /* ── data loading ──────────────────────────────────────────────────────── */
  function loadOne(src) {
    return new Promise(function (resolve, reject) {
      const s = document.createElement('script');
      s.src = src;
      s.async = false;
      s.onload = () => resolve(src);
      s.onerror = () => reject(new Error('could not load ' + src));
      document.head.appendChild(s);
    });
  }

  function loadData() {
    const cfg = (typeof DATA_SOURCES !== 'undefined') ? DATA_SOURCES : null;
    if (!cfg) return Promise.reject(new Error('app/sources.js is missing'));
    const list = cfg[cfg.use] || [];
    if (!list.length) return Promise.reject(new Error('no data files listed for source "' + cfg.use + '"'));
    return list.reduce((p, src) => p.then(() => loadOne(src)), Promise.resolve());
  }

  function fatal(err) {
    document.body.setAttribute('data-error', (err && err.message) || 'fatal');
    const main = document.getElementById('main');
    DOM.clear(main);
    main.appendChild(el('div', { class: 'wrap stack' }, [
      el('h1', { text: 'Content did not load' }),
      el('div', { class: 'banner' }, [
        DOM.mi('warning'),
        el('span', {}, [
          el('b', { text: 'The data files could not be read. ' }),
          el('span', { class: 'mono', text: (err && err.message) || String(err) })
        ])
      ]),
      el('p', { class: 'small muted', text: 'Check the paths listed in app/sources.js.' })
    ]));
  }

  function mathjaxWarning() {
    if (Tex.available()) return;
    const main = document.getElementById('main');
    const wrap = main.querySelector('.wrap');
    if (!wrap) return;
    wrap.insertBefore(el('div', { class: 'banner' }, [
      DOM.mi('warning'),
      el('span', {}, [
        el('b', { text: 'MathJax did not load. ' }),
        'Formulas will show in plain text format. The app needs the network once to fetch it.'
      ])
    ]), wrap.firstChild);
  }

  /* The app proper. Only ever reached with someone signed in. */
  function run() {
    document.body.classList.remove('signed-out');
    buildNav();
    /* Sync starts after the pool: a merge can change what is on screen, and
       it reloads the current route when it does. */
    Sync.start();
    Router.start(route);

    /* MathJax arrives on its own schedule; typeset whatever is on screen
       once it is ready, and say so plainly if it never arrives. */
    Tex.ready().then(function () {
      Tex.typeset(document.getElementById('main'));
      mathjaxWarning();
    });
  }

  /* The record is keyed on a name and a roll number, so there is no sensible
     "anonymous" state to start in: progress made before signing in could not
     be merged with the record it later turns out to belong to. The gate is
     therefore first, and it is the only screen shown until it is passed. */
  function gate() {
    const main = document.getElementById('main');
    DOM.clear(main);
    document.body.classList.add('signed-out');
    Login.mount(main, function () {
      DOM.clear(main);
      run();
    });
    Tex.ready().then(() => Tex.typeset(main));
  }

  function start() {
    if (typeof I18N !== 'undefined') I18N.init();
    Theme.apply();
    Shell.wire();

    loadData().then(function () {
      Pool.build();
      if (Store.signedIn()) run(); else gate();
    }, fatal);
  }

  window.addEventListener('error', function (e) {
    document.body.setAttribute('data-error', (e && e.message) || 'error');
  });

  /* Progress is written through a debounce, so a tab closed or backgrounded
     within a quarter-second of the last tick would lose it. `pagehide` is the
     one event that fires reliably on mobile, where tabs are killed rather
     than closed. */
  window.addEventListener('pagehide', function () { Store.flushNow(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) Store.flushNow();
  });

  return { start: start, route: route };
})();

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', App.start);
} else {
  App.start();
}

</script>
</body>
</html>
