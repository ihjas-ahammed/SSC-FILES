<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Real Analysis Duo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'duo-green': '#58cc02',
              'duo-green-dark': '#46a302',
              'duo-blue': '#1cb0f6',
              'duo-blue-dark': '#1899d6',
              'duo-red': '#ff4b4b',
              'duo-red-dark': '#ea2b2b',
              'duo-gray': '#e5e5e5',
              'duo-gray-dark': '#cecece',
            },
            fontFamily: {
              sans: ['"Nunito"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <!-- MathJax Configuration -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
          fontCache: 'global'
        },
        startup: {
          typeset: false 
        }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    <style>
      body { font-family: 'Nunito', sans-serif; }
      /* Hide scrollbar for clean mobile look but allow scroll */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      
      /* Markdown/Math Content Formatting Fixes */
      .math-content ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .math-content ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin-bottom: 1rem;
      }
      .math-content li {
        margin-bottom: 0.5rem;
      }
      .math-content p {
        margin-bottom: 1rem;
        line-height: 1.6;
      }
      .math-content strong {
        font-weight: 800;
        color: #374151;
      }
      .math-content blockquote {
        border-left: 4px solid #e5e7eb;
        padding-left: 1rem;
        margin-left: 0;
        font-style: italic;
        color: #4b5563;
        margin-bottom: 1rem;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "marked": "https://esm.sh/marked@12.0.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-white text-slate-700">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
