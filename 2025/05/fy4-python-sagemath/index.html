<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fundamentals of Python & SageMath</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'duo-green': '#58cc02',
              'duo-green-dark': '#46a302',
              'duo-blue': '#1cb0f6',
              'duo-blue-dark': '#1899d6',
              'duo-red': '#ff4b4b',
              'duo-red-dark': '#ea2b2b',
              'duo-violet': '#ce82ff',
              'duo-violet-dark': '#a559ce',
              'duo-orange': '#ff9600',
              'duo-orange-dark': '#cc7800',
              'duo-gray': '#2a2a35',
              'duo-gray-dark': '#1f1f28',
              'glass-bg': 'rgba(255, 255, 255, 0.05)',
              'glass-border': 'rgba(255, 255, 255, 0.1)',
            },
            fontFamily: {
              sans: ['"Nunito"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;700;800&display=swap" rel="stylesheet">
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']]
        },
        svg: {
          fontCache: 'global'
        },
        startup: {
          typeset: false 
        }
      };
    </script>
    <script type="text/javascript" id="MathJax-script" async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js">
    </script>
    <link rel="stylesheet" href="/index.css">
    <link rel="stylesheet" href="/theme.css">
  </head>
  <body class="bg-[#0b0f19] text-slate-200">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
