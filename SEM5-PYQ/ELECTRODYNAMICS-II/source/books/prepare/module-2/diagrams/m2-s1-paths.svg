<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" role="img" aria-label="Two integration paths: (a) along the wire at one instant around the loop; (b) following one charge around the moving loop">
  <defs>
    <marker id="p-ink" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2631"/></marker>
  </defs>
  <g font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
    <path d="M30,40 L110,40 L110,150 L30,150 Z" fill="none" stroke="#1B2631" stroke-width="1.6"/>
    <line x1="70" y1="40" x2="90" y2="40" stroke="#1B2631" stroke-width="1.8" marker-end="url(#p-ink)"/>
    <line x1="110" y1="60" x2="110" y2="80" stroke="#1B2631" stroke-width="1.8" marker-end="url(#p-ink)"/>
    <line x1="70" y1="150" x2="50" y2="150" stroke="#1B2631" stroke-width="1.8" marker-end="url(#p-ink)"/>
    <line x1="30" y1="120" x2="30" y2="100" stroke="#1B2631" stroke-width="1.8" marker-end="url(#p-ink)"/>
    <text x="70" y="186" text-anchor="middle">(a) Along the wire, at one instant</text>
    <path d="M200,150 L200,80 L232,40 L300,40 L330,80 L330,150 Z" fill="none" stroke="#1B2631" stroke-width="1.4" stroke-dasharray="4 3"/>
    <path d="M200,140 L228,68" fill="none" stroke="#7D3C98" stroke-width="2"/>
    <path d="M228,68 L300,62" fill="none" stroke="#7D3C98" stroke-width="2"/>
    <path d="M300,62 L318,140" fill="none" stroke="#7D3C98" stroke-width="2"/>
    <path d="M318,140 L200,140" fill="none" stroke="#7D3C98" stroke-width="2"/>
    <line x1="210" y1="140" x2="220" y2="104" stroke="#7D3C98" stroke-width="1.8" marker-end="url(#p-ink)"/>
    <text x="268" y="186" text-anchor="middle">(b) Following one charge</text>
  </g>
</svg>
