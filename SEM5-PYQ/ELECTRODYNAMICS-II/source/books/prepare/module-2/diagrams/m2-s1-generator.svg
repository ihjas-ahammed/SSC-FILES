<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 180" role="img" aria-label="Rectangular loop with its left side inside a uniform field region, pulled to the right at speed v, with a resistor R on the right side">
  <defs>
    <marker id="g-ink" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2631"/></marker>
  </defs>
  <g font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
    <rect x="40" y="30" width="110" height="130" fill="#EAF2F8" stroke="none"/>
    <path d="M110,40 L230,40 L230,140 L110,140 Z" fill="none" stroke="#1B2631" stroke-width="1.4"/>
    <text x="60" y="50" font-style="italic" fill="#1B2631">B</text>
    <g fill="#1B2631"><circle cx="60" cy="72" r="2.5"/><circle cx="90" cy="72" r="2.5"/><circle cx="60" cy="100" r="2.5"/><circle cx="90" cy="100" r="2.5"/><circle cx="60" cy="128" r="2.5"/><circle cx="90" cy="128" r="2.5"/></g>
    <text x="110" y="57" font-style="italic" text-anchor="end">a</text>
    <text x="110" y="155" font-style="italic" text-anchor="end">d</text>
    <text x="110" y="57" font-style="italic" text-anchor="end" dx="-2"></text>
    <text x="236" y="92" font-style="italic" font-weight="bold" fill="#1B2631">R</text>
    <path d="M230,80 l4,-4 l4,8 l-8,0 l4,-4" fill="none" stroke="#1B2631" stroke-width="1.4"/>
    <line x1="260" y1="62" x2="292" y2="62" stroke="#117A65" stroke-width="1.8" marker-end="url(#g-ink)"/>
    <text x="276" y="54" font-style="italic" font-weight="bold" fill="#117A65">v</text>
    <line x1="252" y1="40" x2="252" y2="140" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
    <line x1="246" y1="40" x2="258" y2="40" stroke="#1B2631" stroke-width="1"/>
    <line x1="246" y1="140" x2="258" y2="140" stroke="#1B2631" stroke-width="1"/>
    <text x="264" y="98" font-style="italic" text-anchor="start">h</text>
    <text x="150" y="172" text-anchor="middle">Loop moves right; side ab is in the field region</text>
  </g>
</svg>
