<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 170" role="img" aria-label="Circuit with an ammeter and a switch moved from a to b; the loop encloses a region of field into the page, but no motional emf is produced">
  <g font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
    <rect x="50" y="40" width="130" height="100" fill="#EAF2F8" stroke="none"/>
    <path d="M50,40 L180,40 L180,140 L50,140 Z" fill="none" stroke="#1B2631" stroke-width="1.4"/>
    <circle cx="110" cy="40" r="10" fill="#FDF2E9" stroke="#1B2631" stroke-width="1.4"/>
    <text x="110" y="44" text-anchor="middle">A</text>
    <line x1="180" y1="40" x2="200" y2="40" stroke="#1B2631" stroke-width="1.4"/>
    <circle cx="200" cy="40" r="2.5" fill="#1B2631"/>
    <line x1="200" y1="40" x2="222" y2="22" stroke="#1B2631" stroke-width="1.4"/>
    <circle cx="232" cy="26" r="2.5" fill="#1B2631"/>
    <text x="236" y="16" font-style="italic">b</text>
    <text x="196" y="56" font-style="italic">a</text>
    <text x="110" y="100" text-anchor="middle" fill="#1B2631">B</text>
    <text x="140" y="160" text-anchor="middle">B into the page (shaded region)</text>
    <g fill="#1B2631"><circle cx="80" cy="70" r="2"/><circle cx="110" cy="70" r="2"/><circle cx="80" cy="120" r="2"/><circle cx="110" cy="120" r="2"/></g>
  </g>
</svg>
