<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 260 210" role="img" aria-label="Dipole at forty degrees in a uniform field with equal opposite forces and an aligning torque" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
<defs>
<marker id="s1b-field" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#117A65"/></marker>
<marker id="s1b-dipole" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#7D3C98"/></marker>
<marker id="s1b-force" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D35400"/></marker>
</defs>
<line x1="91.7" y1="142.1" x2="168.3" y2="77.9" stroke="#7D3C98" stroke-width="2.2"/>
<circle cx="168.3" cy="77.9" r="5" fill="#C0392B"/>
<circle cx="91.7" cy="142.1" r="5" fill="#1F618D"/>
<text x="160" y="64" fill="#C0392B" font-size="13" text-anchor="start">+q</text>
<text x="84" y="162" fill="#1F618D" font-size="13" text-anchor="start">−q</text>
<line x1="130" y1="110" x2="153" y2="90.7" stroke="#7D3C98" stroke-width="1.8" marker-end="url(#s1b-dipole)"/>
<text x="132" y="87" fill="#7D3C98" font-size="13" text-anchor="start" font-style="italic">p</text>
<line x1="20" y1="30" x2="100" y2="30" stroke="#117A65" stroke-width="1.8" marker-end="url(#s1b-field)"/>
<text x="55" y="21" fill="#117A65" font-size="13" text-anchor="start" font-style="italic" font-weight="bold">E</text>
<line x1="132" y1="110" x2="164" y2="110" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
<path d="M155,110 A25,25 0 0 0 149.15,93.93" fill="none" stroke="#7F8C8D" stroke-width="1" stroke-dasharray="4 3"/>
