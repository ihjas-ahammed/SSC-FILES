<text x="60" y="130" fill="#D35400" font-size="13" text-anchor="middle" font-style="italic">F<tspan baseline-shift="sub" font-size="9">−</tspan></text>
<text x="130" y="196" fill="#1B2631" font-size="12" text-anchor="middle">Net force zero; torque turns <tspan font-style="italic">p</tspan> toward <tspan font-style="italic">E</tspan></text>
</svg>
