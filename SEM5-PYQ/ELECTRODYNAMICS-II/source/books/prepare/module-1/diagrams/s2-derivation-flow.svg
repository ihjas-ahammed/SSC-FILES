<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 320 240" role="img" aria-label="Six steps from the dipole sum to surface and volume bound charge densities" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
<defs>
<marker id="s2b-ink" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#1B2631"/></marker>
</defs>
<rect x="10" y="22" width="92" height="40" fill="#EAF2F8" stroke="#1F618D" stroke-width="1.4"/>
<text x="56" y="38" fill="#1B2631" font-size="12" text-anchor="middle">Eq. 4.9:</text>
<text x="56" y="53" fill="#1B2631" font-size="12" text-anchor="middle">dipole sum</text>
<rect x="114" y="22" width="92" height="40" fill="#FDF2E9" stroke="#A04000" stroke-width="1.4"/>
<text x="160" y="38" fill="#1B2631" font-size="12" text-anchor="middle">∇′(1/𝓡) =</text>
<text x="160" y="53" fill="#1B2631" font-size="12" text-anchor="middle">R̂/𝓡<tspan baseline-shift="super" font-size="9">2</tspan></text>
<rect x="218" y="22" width="92" height="40" fill="#FDF2E9" stroke="#A04000" stroke-width="1.4"/>
<text x="264" y="38" fill="#1B2631" font-size="12" text-anchor="middle">Integrate</text>
<text x="264" y="53" fill="#1B2631" font-size="12" text-anchor="middle">by parts</text>
<rect x="10" y="128" width="92" height="40" fill="#FDF2E9" stroke="#A04000" stroke-width="1.4"/>
<text x="56" y="144" fill="#1B2631" font-size="12" text-anchor="middle">Divergence</text>
<text x="56" y="159" fill="#1B2631" font-size="12" text-anchor="middle">theorem</text>
<rect x="114" y="128" width="92" height="40" fill="#EAF2F8" stroke="#1F618D" stroke-width="1.4"/>
<text x="160" y="144" fill="#1B2631" font-size="12" text-anchor="middle">Eq. 4.10: surface</text>
<text x="160" y="159" fill="#1B2631" font-size="12" text-anchor="middle">+ volume terms</text>
<rect x="218" y="128" width="92" height="40" fill="#E9F7EF" stroke="#117A65" stroke-width="1.4"/>
<text x="264" y="144" fill="#1B2631" font-size="12" text-anchor="middle">Eq. 4.13:</text>
<text x="264" y="159" fill="#1B2631" font-size="12" text-anchor="middle">σ<tspan baseline-shift="sub" font-size="9">b</tspan> and ρ<tspan baseline-shift="sub" font-size="9">b</tspan></text>
<line x1="103" y1="42" x2="112" y2="42" stroke="#1B2631" stroke-width="1.8" marker-end="url(#s2b-ink)"/>
<line x1="207" y1="42" x2="216" y2="42" stroke="#1B2631" stroke-width="1.8" marker-end="url(#s2b-ink)"/>
<line x1="103" y1="148" x2="112" y2="148" stroke="#1B2631" stroke-width="1.8" marker-end="url(#s2b-ink)"/>
<line x1="207" y1="148" x2="216" y2="148" stroke="#1B2631" stroke-width="1.8" marker-end="url(#s2b-ink)"/>
<path d="M264,63 V92 Q264,100 256,100 H64 Q56,100 56,108 V126" fill="none" stroke="#1B2631" stroke-width="1.8" marker-end="url(#s2b-ink)"/>
<text x="160" y="196" fill="#1B2631" font-size="12" text-anchor="middle"><tspan font-style="italic" fill="#B9770E">σ</tspan><tspan fill="#B9770E"><tspan baseline-shift="sub" font-size="9">b</tspan></tspan> = <tspan font-style="italic" fill="#B9770E">P</tspan>·n̂ on the surface</text>
<text x="160" y="212" fill="#1B2631" font-size="12" text-anchor="middle"><tspan font-style="italic" fill="#B9770E">ρ</tspan><tspan fill="#B9770E"><tspan baseline-shift="sub" font-size="9">b</tspan></tspan> = −∇·<tspan font-style="italic" fill="#B9770E">P</tspan> in the volume</text>
</svg>
