<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 300 220" role="img" aria-label="Potential energy U equals minus p E cosine theta, increasing from minus p E to plus p E" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
