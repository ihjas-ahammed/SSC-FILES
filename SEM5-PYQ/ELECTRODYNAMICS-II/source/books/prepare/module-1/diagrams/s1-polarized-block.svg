<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 300 200" role="img" aria-label="A block of fifteen dipoles aligned with the applied field, with polarization P equals N p" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
