<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 260 190" role="img" aria-label="Dipole with larger field and force at the positive end in a nonuniform field" font-family="Liberation Serif, Times New Roman, serif" font-size="13" fill="#1B2631">
<defs>
<marker id="s1d-field" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#117A65"/></marker>
<marker id="s1d-force" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#D35400"/></marker>
</defs>
<line x1="90" y1="110" x2="170" y2="110" stroke="#1B2631" stroke-width="2"/>
<circle cx="90" cy="110" r="6" fill="#FFFFFF" stroke="#1F618D" stroke-width="2"/>
<circle cx="170" cy="110" r="6" fill="#C0392B"/>
<text x="90" y="99" fill="#1F618D" font-size="13" text-anchor="middle">−q</text>
<text x="170" y="99" fill="#C0392B" font-size="13" text-anchor="middle">+q</text>
<line x1="90" y1="70" x2="120" y2="70" stroke="#117A65" stroke-width="1.8" marker-end="url(#s1d-field)"/>
<text x="105.0" y="57" fill="#117A65" font-size="13" text-anchor="middle" font-style="italic" font-weight="bold">E<tspan baseline-shift="sub" font-size="9">−</tspan></text>
<line x1="90" y1="150" x2="120" y2="150" stroke="#D35400" stroke-width="1.8" marker-end="url(#s1d-force)"/>
<text x="105.0" y="139" fill="#D35400" font-size="13" text-anchor="middle" font-style="italic">F<tspan baseline-shift="sub" font-size="9">−</tspan></text>
<line x1="170" y1="70" x2="230" y2="70" stroke="#117A65" stroke-width="1.8" marker-end="url(#s1d-field)"/>
<text x="200.0" y="57" fill="#117A65" font-size="13" text-anchor="middle" font-style="italic" font-weight="bold">E<tspan baseline-shift="sub" font-size="9">+</tspan></text>
<line x1="170" y1="150" x2="230" y2="150" stroke="#D35400" stroke-width="1.8" marker-end="url(#s1d-force)"/>
<text x="200.0" y="139" fill="#D35400" font-size="13" text-anchor="middle" font-style="italic">F<tspan baseline-shift="sub" font-size="9">+</tspan></text>
<text x="130" y="182" fill="#1B2631" font-size="13" text-anchor="middle">E<tspan baseline-shift="sub" font-size="9">+</tspan> &gt; E<tspan baseline-shift="sub" font-size="9">−</tspan>, so F<tspan baseline-shift="sub" font-size="9">+</tspan> &gt; F<tspan baseline-shift="sub" font-size="9">−</tspan>: net force to the right</text>
</svg>
