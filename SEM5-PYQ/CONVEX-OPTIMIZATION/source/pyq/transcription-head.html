<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Past paper</title>
<script>
window.MathJax = {
  tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
  svg: { fontCache: 'global' }
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<style>
  :root {
    --page-bg: #d9d9d4;
    --paper: #fdfdfb;
    --ink: #111;
    --rule: #444;
    --note: #555;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #2b2b2b;
      --paper: #f4f3ee;
      --ink: #111;
      --rule: #444;
      --note: #555;
    }
  }
  :root[data-theme="dark"] {
    --page-bg: #2b2b2b;
    --paper: #f4f3ee;
    --ink: #111;
    --rule: #444;
    --note: #555;
  }
  body {
    margin: 0;
    background: var(--page-bg);
    color: var(--ink);
    font-family: "Times New Roman", Times, "Liberation Serif", serif;
    font-size: 15px;
    line-height: 1.45;
  }
  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 12mm auto;
    padding: 14mm 18mm 16mm;
    box-sizing: border-box;
    background: var(--paper);
    box-shadow: 0 1px 6px rgba(0,0,0,.25);
    position: relative;
  }
  .sheet + .sheet { margin-top: 0; }
  .hdr {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: start;
    font-size: 14px;
  }
  .code { font-size: 22px; font-weight: bold; letter-spacing: .5px; }
  .pages { text-align: center; padding-top: 14px; }
  .name { text-align: right; line-height: 2; }
  .title { text-align: center; margin-top: 22px; }
  .title .exam { font-size: 19px; font-weight: bold; letter-spacing: .3px; }
  .title .sch { margin-top: 2px; }
  .title .course { margin-top: 10px; font-size: 16px; }
  .title .subject { margin-top: 6px; font-size: 16px; font-weight: bold; }
  .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 16px;
    font-size: 15px;
  }
  .sec { margin-top: 14px; }
  .sec-head {
    display: grid;
    grid-template-columns: 26px 1fr;
    font-weight: bold;
  }
  .sec-head .num { font-weight: bold; }
  .sec-head .body { font-weight: normal; }
  .sec-head .body b { font-weight: bold; }
  .sec-head .body i { font-style: italic; }
  .sec-total { text-align: right; font-weight: normal; margin-top: 4px; }
  .qs { margin-top: 6px; }
  .q {
    display: grid;
    grid-template-columns: 36px 1fr;
    margin-bottom: 7px;
  }
  .q .n { text-align: right; padding-right: 10px; }
  .q p { margin: 0; }
  .sub { margin-left: 22px; }
  .cut { color: var(--note); }
  .turn { text-align: right; font-weight: bold; margin-top: 26px; }
  .fig {
    display: block;
    margin: 8px auto 2px 36px;
    width: 230px;
    height: auto;
  }
  .fig-cap { margin-left: 36px; font-size: 13px; color: var(--note); font-style: italic; }
  .foot-note {
    margin-top: 26px;
    border-top: 1px solid var(--rule);
    padding-top: 6px;
    font-size: 12px;
    color: var(--note);
  }
  .pno { text-align: center; font-size: 15px; margin-bottom: 4px; }
  .pno-hdr { position: absolute; top: 10mm; right: 18mm; font-weight: bold; font-size: 14px; }
  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .sheet { margin: 0; box-shadow: none; width: 210mm; height: 297mm; min-height: 0; page-break-after: always; }
    .sheet:last-child { page-break-after: auto; }
  }
  @media (max-width: 720px) {
    .sheet { width: auto; margin: 0; padding: 14px 16px; min-height: 0; }
    .hdr { grid-template-columns: 1fr; gap: 6px; }
    .name { text-align: left; }
    .pages { text-align: left; padding-top: 0; }
  }
</style>
<style>
  .sec-title { font-weight: bold; margin-top: 16px; }
  .sec-title .sub { font-weight: normal; font-style: italic; }
  .lead { margin: 8px 0 4px; }
  .placeholder {
    margin: 8px 0 4px 36px; padding: 8px 10px;
    border: 1px dashed var(--rule); font-size: 13px; color: var(--note);
  }
  .title .tl { margin-top: 4px; font-size: 16px; }
  .title .tl.bold { font-weight: bold; }
</style>
</head>
<body>
